<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>完全直方体を探せ</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2d;--line:#6e89a8;--red:#ff4d5f;--cyan:#5de1e6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% 0,#152b46,var(--bg) 60%);color:#eef6ff;min-height:100vh}
main{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(22px,5vw,38px);margin:0}.sub{color:#9fb2c8;margin:5px 0 0}
button{border:1px solid #34506d;background:#152942;color:#fff;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}button:hover{border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.8fr);gap:15px;margin-top:16px}.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid #263d58;border-radius:18px;padding:15px;box-shadow:0 18px 50px #0006}
.stage{position:relative;min-height:470px;overflow:hidden;touch-action:none;background:linear-gradient(#0a1829,#07111f);border-radius:13px}.stage svg{width:100%;height:470px;display:block}.hint{position:absolute;left:12px;bottom:10px;color:#9fb2c8;font-size:13px;background:#07111fcc;padding:7px 9px;border-radius:8px}
.edge{stroke:var(--line);stroke-width:3;fill:none}.face{fill:#2c557633;stroke:none}.diag{stroke:#7088a3;stroke-width:2;stroke-dasharray:7 5;opacity:.55}.diag.integer{stroke:var(--red);stroke-width:4;stroke-dasharray:none;opacity:1;filter:drop-shadow(0 0 5px #ff4d5f)}.space{stroke:#e9f2ff;stroke-width:2.5;stroke-dasharray:5 5}.space.integer{stroke:var(--red);stroke-width:5;stroke-dasharray:none;filter:drop-shadow(0 0 7px #ff4d5f)}
.handle{fill:var(--cyan);stroke:#fff;stroke-width:2;cursor:grab;filter:drop-shadow(0 0 5px #5de1e6)}.handle:active{cursor:grabbing}.handle.selected{fill:#fff;stroke:var(--cyan);stroke-width:5}
.edge-rail{position:absolute;right:10px;top:38px;width:68px;padding:8px 7px;background:#07111fe8;border:1px solid #34506d;border-radius:14px;text-align:center;user-select:none}.rail-title{font-size:12px;color:#b9cadb;margin-bottom:6px}.rail-title b{color:var(--cyan);font-size:17px}.rail-buttons{display:grid;gap:4px}.rail-btn{padding:8px 3px;border-radius:8px;font-size:12px;touch-action:none}.rail-btn.major{background:#243c58;color:#fff}.rail-mid{height:2px;background:#54708d;margin:2px 5px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#aebed0}.dot{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:5px;background:#7088a3}.dot.red{background:var(--red)}
.values{display:grid;gap:9px;margin-top:12px}.value{display:flex;justify-content:space-between;gap:8px;padding:10px 11px;background:#091625;border-radius:10px}.value strong{font-variant-numeric:tabular-nums}.value.ok{outline:2px solid var(--red);color:#ff7684;background:#35141d}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.controls label{font-size:12px;color:#9fb2c8}.controls input{width:100%;margin-top:4px;border:1px solid #314964;border-radius:8px;background:#081421;color:#fff;padding:9px;font-size:16px}
.status{padding:12px;border-radius:11px;background:#0a1726;color:#bac9d8;line-height:1.5}.status.euler{background:#342413;color:#ffd99d}.status.perfect{background:#3a121b;color:#ff92a0;animation:pulse 1s infinite alternate}@keyframes pulse{to{box-shadow:0 0 22px #ff4d5f66}}
.found{margin-top:12px;font-size:13px;color:#9fb2c8}.found-list{max-height:110px;overflow:auto}.found-item{padding:5px 0;color:#ff8591}
.search-box{margin:10px 0;padding:11px;background:#091625;border-radius:11px}.search-box label{display:block;font-size:12px;color:#9fb2c8}.search-box select{width:100%;margin-top:5px;border:1px solid #314964;border-radius:8px;background:#081421;color:#fff;padding:9px}.search-note{min-height:1.4em;margin-top:7px;color:#8af1e9;font-size:12px;line-height:1.45}

.research{margin-top:15px}.research-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.research-head h2{margin:0}.research-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.theorem{padding:12px;background:#091625;border:1px solid #263d58;border-radius:12px}.theorem.pass{border-color:#42c98b;background:#0d2a25}.theorem.hit{border-color:#ffb454;background:#332512}.theorem small{display:block;color:#9fb2c8;margin-top:5px;line-height:1.45}.research-result{margin-top:10px;padding:12px;border-radius:11px;background:#101f33;line-height:1.55}.research-actions{display:flex;gap:8px;margin-top:10px}.research-actions button{flex:1}.log{margin-top:10px;max-height:150px;overflow:auto;font-size:13px;color:#b9cadb}.log div{padding:6px 0;border-bottom:1px solid #21374f}.tag{display:inline-block;padding:2px 7px;border-radius:999px;background:#23415f;color:#8af1e9;font-size:11px;margin-right:6px}
@media(max-width:720px){main{padding:11px}.grid{grid-template-columns:1fr}.stage,.stage svg{min-height:390px;height:390px}.top{align-items:flex-start;flex-direction:column}.top button{width:100%}.research-grid{grid-template-columns:1fr}.research-head{align-items:flex-start;flex-direction:column}.research-actions{flex-direction:column}}
</style>
</head>
<body><main>
<div class="top"><div><h1>完全直方体を探せ</h1><p class="sub">3本の辺をつかんで、ぐーっと伸ばそう。</p></div><button id="euler">オイラー直方体の例を見る</button></div>
<div class="grid">
<section class="card"><div class="stage" id="stage">
<svg id="view" viewBox="0 0 650 470" aria-label="操作できる直方体">
<polygon id="face1" class="face"/><polygon id="face2" class="face"/><polygon id="face3" class="face"/>
<g id="diagonals"></g><g id="edges"></g><line id="space" class="space"/>
<circle id="ha" class="handle" r="10"/><circle id="hb" class="handle" r="10"/><circle id="hc" class="handle" r="10"/>
</svg><div class="edge-rail" aria-label="選択した辺の増減バー"><div class="rail-title">選択中：辺 <b id="selectedLabel">a</b></div><div class="rail-buttons"><button class="rail-btn major" data-delta="100">＋100</button><button class="rail-btn" data-delta="10">＋10</button><button class="rail-btn" data-delta="1">＋1</button><div class="rail-mid"></div><button class="rail-btn" data-delta="-1">−1</button><button class="rail-btn" data-delta="-10">−10</button><button class="rail-btn major" data-delta="-100">−100</button></div></div><div class="hint">辺を選択→右のバーで微調整。端ほど大きく増減します。</div></div>
<div class="legend"><span><i class="dot"></i>まだ整数でない対角線</span><span><i class="dot red"></i>整数になった対角線</span></div></section>
<aside class="card">
<h2 style="margin:0 0 4px">現在の直方体</h2>
<div class="controls">
<label>辺 a<input id="a" type="number" min="1" max="1000000"></label>
<label>辺 b<input id="b" type="number" min="1" max="1000000"></label>
<label>辺 c<input id="c" type="number" min="1" max="1000000"></label>
</div>
<div class="search-box"><label>辺を動かすときの仮説<select id="hypothesis"><option value="current">現在の赤い整数条件を維持</option><option value="one">面対角線を1本以上整数にする</option><option value="euler">3本とも整数（オイラー直方体）</option></select></label><div id="searchNote" class="search-note">選択した辺を動かすと、条件に合う次の値を探します。</div></div>
<div id="status" class="status"></div><div id="values" class="values"></div>
<div class="found"><b>今回見つけた整数対角線</b><div id="found" class="found-list">まだありません</div></div>
</aside></div>
<section class="card research">
<div class="research-head"><div><h2>数学研究室</h2><p class="sub">証明済みルールを固定し、辺を変えて仮説と反例を集めよう。</p></div><button id="sample">別の研究対象</button></div>
<div id="theorems" class="research-grid"></div>
<div id="researchResult" class="research-result"></div>
<div class="research-actions"><button id="record">この結果を研究ログへ記録</button><button id="clearLog">ログを消す</button></div>
<div id="researchLog" class="log">まだ研究記録はありません。</div>
</section>

</main>
<script>
const MAX_EDGE=1000000, S={a:20,b:15,c:12}, keys=['a','b','c'], seen=new Set();
let selected='a', holdTimer=null, searchToken=0, hypothesisMask=null;
const $=id=>document.getElementById(id), svg=$('view'), origin={x:278,y:260};
const vec={a:{x:1,y:.20},b:{x:-.74,y:.46},c:{x:0,y:-1}};
const len=(k)=>{const max=Math.max(S.a,S.b,S.c);return 70+170*S[k]/max};
const add=(p,v,t=1)=>({x:p.x+v.x*t,y:p.y+v.y*t});
const pt=(...ks)=>ks.reduce((p,k)=>add(p,vec[k],len(k)),{...origin});
const str=p=>p.x+','+p.y;
const isInt=n=>Number.isInteger(Math.sqrt(n));
function line(p,q,cls='edge'){const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',p.x);l.setAttribute('y1',p.y);l.setAttribute('x2',q.x);l.setAttribute('y2',q.y);l.setAttribute('class',cls);return l}

const researchLog=[];
function factorize(n){const out=[];let x=n;for(let p=2;p*p<=x;p+=(p===2?1:2)){if(x%p)continue;let e=0;while(x%p===0){x/=p;e++}out.push([p,e])}if(x>1)out.push([x,1]);return out}
function research(){
 const n=S.a*S.a+S.b*S.b+S.c*S.c, fs=factorize(n), odd=fs.filter(x=>x[1]%2), bad43=fs.filter(x=>x[0]%4===3&&x[1]%2), five=fs.find(x=>x[0]===5);
 const primitive=(S.a%2+S.b%2+S.c%2)===1;
 const rules=[
  ['奇偶則',primitive?'適合':'観察中','原始オイラー直方体では辺は奇数1本・偶数2本、Sは奇数。'],
  ['4k+3素数則',bad43.length?'反例候補':'適合','3・7・11などがSに現れる指数は必ず偶数。'],
  ['5の指数1禁止',five&&five[1]===1?'反例候補':'適合','オイラー直方体なら5がSを1回だけ割ることはない。']
 ];
 $('theorems').innerHTML=rules.map(r=>'<div class="theorem '+(r[1]==='適合'?'pass':'hit')+'"><b>'+r[0]+'：'+r[1]+'</b><small>'+r[2]+'</small></div>').join('');
 const faceOk=[S.a*S.a+S.b*S.b,S.a*S.a+S.c*S.c,S.b*S.b+S.c*S.c].every(isInt);
 const factorText=fs.map(x=>x[0]+(x[1]>1?'<sup>'+x[1]+'</sup>':'')).join(' × ');
 let hypothesis=odd.length?'奇数回現れる素数候補：'+odd.map(x=>x[0]).join(', '):'Sは平方数候補（全素因数の指数が偶数）';
 if(!faceOk)hypothesis+='。ただし面対角線3本が整数でないため、定理の反例にはならない。';
 $('researchResult').innerHTML='<span class="tag">S='+n+'</span> '+factorText+'<br><b>今回の仮説：</b>'+hypothesis;
}
function drawResearchLog(){
 $('researchLog').innerHTML=researchLog.length?researchLog.slice().reverse().map(x=>'<div><span class="tag">'+x.time+'</span>'+x.text+'</div>').join(''):'まだ研究記録はありません。';
}

function render(){
 const o=origin,A=pt('a'),B=pt('b'),C=pt('c'),AB=pt('a','b'),AC=pt('a','c'),BC=pt('b','c'),ABC=pt('a','b','c');
 $('face1').setAttribute('points',[o,A,AB,B].map(str).join(' '));$('face2').setAttribute('points',[o,A,AC,C].map(str).join(' '));$('face3').setAttribute('points',[o,B,BC,C].map(str).join(' '));
 const eg=$('edges');eg.replaceChildren(...[[o,A],[o,B],[o,C],[A,AB],[A,AC],[B,AB],[B,BC],[C,AC],[C,BC],[AB,ABC],[AC,ABC],[BC,ABC]].map(x=>line(...x)));
 const tests=[['a²+b²',o,AB,S.a*S.a+S.b*S.b],['a²+c²',o,AC,S.a*S.a+S.c*S.c],['b²+c²',o,BC,S.b*S.b+S.c*S.c]];
 const dg=$('diagonals');dg.replaceChildren(...tests.map(t=>line(t[1],t[2],'diag '+(isInt(t[3])?'integer':''))));
 const sp=$('space');sp.setAttribute('x1',o.x);sp.setAttribute('y1',o.y);sp.setAttribute('x2',ABC.x);sp.setAttribute('y2',ABC.y);sp.setAttribute('class','space '+(isInt(S.a*S.a+S.b*S.b+S.c*S.c)?'integer':''));
 [['ha',A],['hb',B],['hc',C]].forEach(([id,p])=>{ $(id).setAttribute('cx',p.x);$(id).setAttribute('cy',p.y);$(id).classList.toggle('selected',id==='h'+selected)});$('selectedLabel').textContent=selected;
 keys.forEach(k=>$(k).value=S[k]);
 const all=[...tests.map(t=>[t[0],Math.sqrt(t[3]),isInt(t[3])]),['空間',Math.sqrt(S.a*S.a+S.b*S.b+S.c*S.c),isInt(S.a*S.a+S.b*S.b+S.c*S.c)]];
 $('values').innerHTML=all.map(([n,v,ok])=>'<div class="value '+(ok?'ok':'')+'"><span>'+n+'</span><strong>'+format(v)+(ok?'（整数）':'')+'</strong></div>').join('');
 all.forEach(([n,v,ok])=>{if(ok){const z=n+': '+S.a+'×'+S.b+'×'+S.c+' → '+v;seen.add(z)}});
 $('found').innerHTML=seen.size?[...seen].reverse().map(x=>'<div class="found-item">'+x+'</div>').join(''):'まだありません';
 const faces=tests.every(t=>isInt(t[3])), spaceOk=all[3][2], st=$('status');
 if(faces&&spaceOk){st.className='status perfect';st.innerHTML='<b>完全直方体を発見！</b><br>未知の組み合わせかもしれません。値を保存しよう。'}
 else if(faces){st.className='status euler';st.innerHTML='<b>オイラー直方体！</b><br>3つの面対角線がすべて整数です。あとは空間対角線。'}
 else{st.className='status';st.innerHTML='面対角線を整数にすると、その対角線が赤く残ります。まず1本を赤くしてみよう。'}
 research();
}
function format(v){return Number.isInteger(v)?v:v.toFixed(2)}
function faceMask(a=S.a,b=S.b,c=S.c){return [isInt(a*a+b*b),isInt(a*a+c*c),isInt(b*b+c*c)]}
function selectEdge(k){selected=k;hypothesisMask=faceMask();render()}
keys.forEach(k=>{$(k).addEventListener('focus',()=>selectEdge(k));$(k).addEventListener('change',e=>{selected=k;S[k]=Math.max(1,Math.min(MAX_EDGE,+e.target.value||1));hypothesisMask=faceMask();$('searchNote').textContent='直接入力しました。次の操作から仮説探索を再開します。';render()})});
let drag=null;
keys.forEach(k=>{const h=$('h'+k);h.addEventListener('pointerdown',e=>{selectEdge(k);drag=k;h.setPointerCapture(e.pointerId)})});
svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect(),p={x:(e.clientX-r.left)*650/r.width,y:(e.clientY-r.top)*470/r.height},v=vec[drag],dot=(p.x-origin.x)*v.x+(p.y-origin.y)*v.y,norm=v.x*v.x+v.y*v.y,pixels=Math.max(70,dot/norm);const target=Math.max(1,Math.min(MAX_EDGE,Math.round(pixels/2)));if(target!==S[drag])findMatchingValue(target>S[drag]?1:-1,Math.max(1,Math.abs(target-S[drag])))}); 
svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);
function matchesHypothesis(value){
 const v={...S,[selected]:value}, mask=faceMask(v.a,v.b,v.c), mode=$('hypothesis').value;
 if(mode==='euler')return mask.every(Boolean);
 if(mode==='one')return mask.some(Boolean);
 const target=hypothesisMask||faceMask();
 return target.some(Boolean)?target.every((needed,i)=>!needed||mask[i]):mask.some(Boolean);
}
async function findMatchingValue(direction,offset=1){
 const token=++searchToken, start=Math.max(1,Math.min(MAX_EDGE,S[selected]+direction*offset));
 $('searchNote').textContent='辺 '+selected+' を '+start+' から '+(direction>0?'上':'下')+'方向へ探索中…';
 let value=start, checked=0;
 while(value>=1&&value<=MAX_EDGE){
  const end=direction>0?Math.min(MAX_EDGE,value+19999):Math.max(1,value-19999);
  for(;direction>0?value<=end:value>=end;value+=direction){if(matchesHypothesis(value)){if(token!==searchToken)return;S[selected]=value;hypothesisMask=faceMask();$('searchNote').textContent='条件一致：辺 '+selected+' = '+value+'（'+checked.toLocaleString()+'件探索）';render();return}checked++}
  if(token!==searchToken)return;
  await new Promise(requestAnimationFrame);
 }
 $('searchNote').textContent=(direction>0?'上限100万':'下限1')+'まで探しましたが、現在の仮説に合う値はありません。これ以上は探索しません。';
}
function changeSelected(delta){findMatchingValue(Math.sign(delta),Math.abs(delta))}
document.querySelectorAll('.rail-btn').forEach(btn=>{const delta=+btn.dataset.delta;btn.addEventListener('click',e=>{e.preventDefault();changeSelected(delta)})});
$('hypothesis').addEventListener('change',()=>{hypothesisMask=faceMask();$('searchNote').textContent='仮説を変更しました。辺を動かすと条件一致値を最大100万まで探します。'});
$('euler').addEventListener('click',()=>{Object.assign(S,{a:44,b:117,c:240});render()});
const samples=[[44,117,240],[85,132,720],[240,252,275],[140,480,693],[117,520,756]];
$('sample').addEventListener('click',()=>{const x=samples[Math.floor(Math.random()*samples.length)];Object.assign(S,{a:x[0],b:x[1],c:x[2]});render()});
$('record').addEventListener('click',()=>{const n=S.a*S.a+S.b*S.b+S.c*S.c,fs=factorize(n).map(x=>x[0]+'^'+x[1]).join('×');researchLog.push({time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),text:S.a+'×'+S.b+'×'+S.c+' / S='+n+' / '+fs});drawResearchLog()});
$('clearLog').addEventListener('click',()=>{researchLog.length=0;drawResearchLog()});
render();
</script></body></html>
