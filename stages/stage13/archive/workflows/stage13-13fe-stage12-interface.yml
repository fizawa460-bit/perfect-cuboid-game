name: Stage13-13fe Stage12 interface

on:
  pull_request:
    paths:
      - 'stages/stage13/13-13fe/**'
      - 'stages/stage13/scripts/13-13fe/**'
      - 'stages/stage13/data/13-13fe/**'
      - 'stages/stage13/13-13f/r05-repair-plan.md'
      - 'stages/stage13/13-13/roadmap.md'
      - '.github/workflows/stage13-13fe-stage12-interface.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute interface report
        run: python stages/stage13/scripts/13-13fe/stage12_interface_audit.py --write-report
      - name: Verify committed report
        run: git diff --exit-code -- stages/stage13/data/13-13fe/stage12_interface_audit.json
      - name: Check Gate E
        run: python stages/stage13/scripts/13-13fe/stage12_interface_audit.py --check-report
