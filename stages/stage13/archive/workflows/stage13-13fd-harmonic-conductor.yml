name: Stage13-13fd harmonic conductor bookkeeping

on:
  pull_request:
    paths:
      - 'stages/stage13/13-13fd/**'
      - 'stages/stage13/scripts/13-13fd/**'
      - 'stages/stage13/data/13-13fd/**'
      - 'stages/stage13/13-13f/r05-repair-plan.md'
      - 'stages/stage13/13-13/roadmap.md'
      - '.github/workflows/stage13-13fd-harmonic-conductor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute report
        run: python stages/stage13/scripts/13-13fd/harmonic_conductor_audit.py --write-report
      - name: Verify committed report
        run: git diff --exit-code -- stages/stage13/data/13-13fd/harmonic_conductor_audit.json
      - name: Check Gate D contract
        run: python stages/stage13/scripts/13-13fd/harmonic_conductor_audit.py --check-report
