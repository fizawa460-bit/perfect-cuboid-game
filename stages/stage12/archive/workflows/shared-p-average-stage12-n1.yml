name: Shared-p average stage 12-N1

on:
  pull_request:
    paths:
      - "data/shared_p_average_stage12_n1_report.json"
      - "docs/face-ratio-geometry-research.md"
      - "scripts/audit_shared_p_average_stage12_n1.py"
      - "scripts/update_shared_p_average_stage12_n1_memo.py"
      - ".github/workflows/shared-p-average-stage12-n1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  shared-p-average:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Stage12-N1 scripts
        run: |
          python -m py_compile scripts/audit_shared_p_average_stage12_n1.py
          python -m py_compile scripts/update_shared_p_average_stage12_n1_memo.py

      - name: Regenerate Stage12-N1 report
        run: |
          python scripts/audit_shared_p_average_stage12_n1.py \
            --write-report generated-shared-p-average-stage12-n1-report.json

      - name: Regenerate Stage12-N1 memo
        run: |
          python scripts/update_shared_p_average_stage12_n1_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --report generated-shared-p-average-stage12-n1-report.json \
            --output generated-face-ratio-geometry-research.md
          grep -n "4.21 Stage12-N1" generated-face-ratio-geometry-research.md
          grep -Fn '2\left\lfloor\frac{B}{13}\right\rfloor' generated-face-ratio-geometry-research.md
          grep -n "primitive-compatible joint weight" generated-face-ratio-geometry-research.md

      - name: Compare committed outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          committed = json.loads(Path("data/shared_p_average_stage12_n1_report.json").read_text(encoding="utf-8"))
          generated = json.loads(Path("generated-shared-p-average-stage12-n1-report.json").read_text(encoding="utf-8"))
          if committed != generated:
              raise SystemExit("committed Stage12-N1 report differs from regenerated output")

          committed_text = Path("docs/face-ratio-geometry-research.md").read_text(encoding="utf-8")
          generated_text = Path("generated-face-ratio-geometry-research.md").read_text(encoding="utf-8")
          start = "<!-- SHARED_P_AVERAGE_STAGE12_N1_START -->"
          end = "<!-- SHARED_P_AVERAGE_STAGE12_N1_END -->"

          def extract(text: str) -> str:
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit("Stage12-N1 markers missing or duplicated")
              return text.split(start, 1)[1].split(end, 1)[0].strip()

          if extract(committed_text) != extract(generated_text):
              raise SystemExit("committed Stage12-N1 memo block differs from regenerated block")
          PY

      - name: Verify core finite identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("data/shared_p_average_stage12_n1_report.json").read_text(encoding="utf-8"))
          expected = {
              1000: 3180,
              2000: 8396,
              5000: 29446,
              10000: 74414,
              20000: 185206,
          }
          rows = {row["B"]: row for row in report["finite_raw_average"]["rows"]}
          for bound, raw in expected.items():
              if rows[bound]["C_raw"] != raw:
                  raise SystemExit(f"Stage11 raw identity changed at B={bound}")

          if report["scaling_trap"]["linear_raw_lower_bound"] != "C_raw(B)>=2*floor(B/13)":
              raise SystemExit("scaling-trap lower bound missing")
          if "primitive-compatible" not in report["meta_ai_route_audit"]["next_required_object"]:
              raise SystemExit("primitive-compatible decision missing")
          PY

      - name: Upload generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: shared-p-average-stage12-n1
          path: |
            generated-shared-p-average-stage12-n1-report.json
            generated-face-ratio-geometry-research.md
