name: Stage12-N1-2e divisor-dyadic audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage12-n1-2e-divisor-dyadic
    paths:
      - "scripts/audit_divisor_dyadic_stage12_n1_2e.py"
      - "data/divisor_dyadic_stage12_n1_2e_report.json"
      - "docs/stage12-n1-2e-divisor-dyadic.md"
      - ".github/workflows/stage12-n1-2e-divisor-dyadic.yml"
  pull_request:
    paths:
      - "scripts/audit_divisor_dyadic_stage12_n1_2e.py"
      - "data/divisor_dyadic_stage12_n1_2e_report.json"
      - "docs/stage12-n1-2e-divisor-dyadic.md"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run divisor-dyadic audit
        run: |
          python -m py_compile scripts/audit_divisor_dyadic_stage12_n1_2e.py
          python scripts/audit_divisor_dyadic_stage12_n1_2e.py --write-report /tmp/report.json
          diff -u data/divisor_dyadic_stage12_n1_2e_report.json /tmp/report.json
