name: Stage12-N1-2d modular-hyperbola audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage12-n1-2d-modular-hyperbola
    paths:
      - "scripts/audit_modular_hyperbola_stage12_n1_2d.py"
      - "data/modular_hyperbola_stage12_n1_2d_report.json"
      - "docs/stage12-n1-2d-modular-hyperbola.md"
      - ".github/workflows/stage12-n1-2d-modular-hyperbola.yml"
  pull_request:
    paths:
      - "scripts/audit_modular_hyperbola_stage12_n1_2d.py"
      - "data/modular_hyperbola_stage12_n1_2d_report.json"
      - "docs/stage12-n1-2d-modular-hyperbola.md"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run modular-hyperbola audit
        run: |
          python -m py_compile scripts/audit_modular_hyperbola_stage12_n1_2d.py
          python scripts/audit_modular_hyperbola_stage12_n1_2d.py --write-report /tmp/report.json
          diff -u data/modular_hyperbola_stage12_n1_2d_report.json /tmp/report.json
