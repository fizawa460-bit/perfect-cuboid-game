name: Stage14-s-batch s7-120..122 theorem contracts

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-120/**'
      - 'stages/stage14/14-s7-121/**'
      - 'stages/stage14/14-s7-122/**'
      - 'stages/stage14/14-s-batch/s7-120-122-report.md'
      - 'stages/stage14/scripts/14-s-batch/s7_120_122_theorem_contract_audit.py'
      - '.github/workflows/stage14-s-batch-s7-120-122-theorem-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Batch deterministic audit
        run: python stages/stage14/scripts/14-s-batch/s7_120_122_theorem_contract_audit.py

      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/14-s-batch/s7_120_122_theorem_contract_audit.py

      - name: Regress merged s7-117..119
        run: python stages/stage14/scripts/14-s-batch/s7_117_119_squareclass_reverse_audit.py

      - name: Lock merged Work-cbX40 boundary
        run: |
          grep -Fq 'S_NONALIGNED_COMMON_SQUARECLASS_REVERSE_WITNESS_KERNEL_PROVED=true' stages/stage14/14-Work-cbX40/result.md
          grep -Fq 'Q18_PREMATURE_PENDING_S7_120_THEOREM_CONTRACT=true' stages/stage14/14-Work-cbX40/result.md
          grep -Fq 'S_ROUTE_H_NEEDED=false' stages/stage14/14-Work-cbX40/result.md

      - name: Lock theorem contracts
        run: |
          grep -Fq 'S_SQUARECLASS_DEFICIT_LEDGER_EXACT=true' stages/stage14/14-s7-120/result.md
          grep -Fq 'UniformOneDimensionalFixedSquareClassTwoLevelReverseReciprocalFactorPairSupport' stages/stage14/14-s7-121/result.md
          grep -Fq 'UniformPolynomialOuterPairFiberedFixedSquareClassTwoLevelReverseReciprocalFactorPairSupport' stages/stage14/14-s7-122/result.md
          grep -Fq 'Q18_THEOREM_TARGETS_NOW_STABLE=true' stages/stage14/14-s7-122/result.md
          grep -Fq 'NEXT=Stage14-s7-123' stages/stage14/14-s-batch/s7-120-122-report.md
          grep -Fq 'STAGE14_AUTOMATION_SAFE=true' stages/stage14/14-s-batch/s7-120-122-report.md
          grep -Fq 'STAGE14_ROUTE=s' stages/stage14/14-s-batch/s7-120-122-report.md

      - name: Diff check
        run: git diff --check origin/main...HEAD
