name: Stage14-s4b coarse arithmetic clustering
on:
  pull_request:
    paths:
      - 'stages/stage14/scripts/14-s4b/**'
      - 'stages/stage14/14-s4b/**'
      - 'stages/stage14/data/14-s4b/**'
      - '.github/workflows/stage14-s4b-coarse-cluster.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PARI/GP
        run: sudo apt-get update -qq && sudo apt-get install -y pari-gp
      - name: Run s4b audit
        run: python stages/stage14/scripts/14-s4b/coarse_cluster_audit.py
      - name: Validate boundary
        run: |
          python - <<'PY'
          import json
          p='stages/stage14/data/14-s4b/coarse_cluster_summary.json'
          d=json.load(open(p))
          assert d['metadata']['active_vertices']==490
          assert d['decision']['FINITE_CLUSTERING_PROVES_ALGEBRAIC_STRATA'] is False
          assert d['decision']['SQRT_B_ASYMPTOTIC_PROVED'] is False
          print(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage14-s4b-coarse-cluster-summary
          path: stages/stage14/data/14-s4b/coarse_cluster_summary.json
