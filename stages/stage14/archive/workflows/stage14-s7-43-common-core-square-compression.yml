name: Stage14-s7-43 common-core square compression

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-43/**'
      - 'stages/stage14/scripts/14-s7-43/**'
      - '.github/workflows/stage14-s7-43-common-core-square-compression.yml'
      - 'stages/stage14/14-4da/**'
      - 'stages/stage14/14-s7-42/**'
      - 'stages/stage14/14-X13/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage14-s7-43 audit
        run: python stages/stage14/scripts/14-s7-43/common_core_square_compression_audit.py

      - name: Compile Stage14-s7-43 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-43/common_core_square_compression_audit.py

      - name: Merged 4da regression
        run: python stages/stage14/scripts/14-4/sqrt_root_gcd_excess_audit.py

      - name: Merged s7-42 regression
        run: python stages/stage14/scripts/14-s7-42/sh41_critical_closure_stability_prism_audit.py

      - name: Merged X13 regression
        run: python stages/stage14/scripts/14-X13/reverse_reciprocal_sqrt_audit.py

      - name: Lock matched-lost-core predecessors
        run: |
          f=stages/stage14/14-4da/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=1/2' "$f"
          grep -Fq 'K=B^o(1)' "$f"
          grep -Fq 'H^2/D0=B^o(1)' "$f"
          grep -Fq 'j=chi-2s' "$f"
          grep -Fq 'STRICT_SUB_SQRT_POWER_SAVING_PROVED=false' "$f"

      - name: Lock full-core predecessor facts
        run: |
          grep -Fq 'C_Cayley=J*B^o(1)' stages/stage14/14-4cx/result.md
          grep -Fq 'COMMON_CORE_GAUSSIAN_ROOT_LINES_PROVED=true' stages/stage14/14-s7-29/result.md
          grep -Fq 'PRIMITIVE_ROOT_LINE_DYADIC_COUNT_PROVED=true' stages/stage14/14-s7-29/result.md

      - name: Lock Stage14-s7-43 theorem boundary
        run: |
          f=stages/stage14/14-s7-43/result.md
          grep -Fq 'STAGE14_S7_43=COMPLETE_MATCHED_COMMON_CORE_SQUARE_COMPRESSION_AND_ZERO_ROOT_GCD_SQRT_SATURATION' "$f"
          grep -Fq 'FIXED_J_H_TO_COMMON_CORE_MULTIPLICITY=Bo1' "$f"
          grep -Fq 'MATCHED_COMMON_CORE_SUPPORT_EXPONENT=chi-s' "$f"
          grep -Fq 'MATCHED_FIXED_S_BLOCK_EXPONENT=1/2-s' "$f"
          grep -Fq 'SQRT_SATURATION_CROSS_ROOT_EXPONENT=0' "$f"
          grep -Fq 'SQRT_SATURATION_GLOBALLY_ODD_PRIMITIVE=true' "$f"
          grep -Fq 'SQRT_SATURATION_LOST_CORE_EXPONENT=0' "$f"
          grep -Fq 'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=1/2' "$f"
          grep -Fq 'STRICT_SUBSQRT_POWER_SAVING_PROVED=false' "$f"
          grep -Fq 'S7_43_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'REMAINING_RECEIVER=SquareRootThetaQuarterGloballyOddPrimitiveFullCoreDualPrimitiveRootLineIncidence' "$f"
          grep -Fq 'NEXT=Stage14-s7-44' "$f"
