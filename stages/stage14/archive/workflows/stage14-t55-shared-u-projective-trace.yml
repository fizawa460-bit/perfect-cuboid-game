name: Stage14-t55 shared-U projective trace

on:
  pull_request:
    paths:
      - 'stages/stage14/14-t55/**'
      - 'stages/stage14/scripts/14-t/t55_shared_u_projective_trace_audit.py'
      - 'stages/stage14/scripts/14-t/t55_validate_frozen.py'
      - 'stages/stage14/data/14-t55/**'
      - '.github/workflows/stage14-t55-shared-u-projective-trace.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run t54 regression
        run: python stages/stage14/scripts/14-t/t54_shared_u_canonical_prime_audit.py
      - name: Run t55 shared-U projective trace audit
        run: python stages/stage14/scripts/14-t/t55_shared_u_projective_trace_audit.py
      - name: Validate frozen t55 ledger and boundary
        run: python stages/stage14/scripts/14-t/t55_validate_frozen.py
