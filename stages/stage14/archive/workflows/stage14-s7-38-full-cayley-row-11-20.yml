name: Stage14-s7-38 X12 plus full Cayley row 61/112

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-38/**'
      - 'stages/stage14/scripts/14-s7-38/**'
      - '.github/workflows/stage14-s7-38-full-cayley-row-11-20.yml'
      - 'stages/stage14/14-X12/**'
      - 'stages/stage14/14-s7-37/**'
      - 'stages/stage14/14-s7-36/**'
      - 'stages/stage14/14-X11/**'
      - 'stages/stage14/14-4cv/**'
      - 'stages/stage14/14-4cu/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Stage14-s7-38 audit
        run: python stages/stage14/scripts/14-s7-38/full_cayley_row_11_20_audit.py
      - name: Compile Stage14-s7-38 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-38/full_cayley_row_11_20_audit.py
      - name: Run merged X12 regression
        run: python stages/stage14/scripts/14-X12/lost_core_fourth_root_71_128_audit.py
      - name: Run merged s7-37 regression
        run: python stages/stage14/scripts/14-s7-37/sameside_u_residual_19_34_audit.py
      - name: Run merged X11 regression
        run: python stages/stage14/scripts/14-X11/proportional_root_gcd_19_34_audit.py
      - name: Run merged s7-36 regression
        run: python stages/stage14/scripts/14-s7-36/row_column_proportional_9_16_audit.py
      - name: Run merged 4cv regression
        run: python stages/stage14/scripts/14-4/row_column_cofactor_7_12_audit.py
      - name: Run merged 4cu regression
        run: python stages/stage14/scripts/14-4/orientation_linear_product_19_32_audit.py
      - name: Lock Stage14-s7-38 theorem boundary
        run: |
          f=stages/stage14/14-s7-38/result.md
          grep -Fq 'STAGE14_S7_38=COMPLETE_X12_COLUMN_DIVISOR_FULL_CAYLEY_ROW_CORE_RECONSTRUCTION_AND_61_112_PROMOTION' "$f"
          grep -Fq 'MERGED_X12_71_128_IMPORTED=true' "$f"
          grep -Fq 'X12_LOST_CORE_FOURTH_ROOT_COLUMN_SAVING_RETAINED=true' "$f"
          grep -Fq 'FULL_CAYLEY_CORE_USED_FOR_ROW_CRT=true' "$f"
          grep -Fq 'ROW_AND_COLUMN_REFINEMENTS_COMPATIBLE=true' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=61/112' "$f"
          grep -Fq 'IMPROVEMENT_OVER_PREVIOUS_71_128=9/896' "$f"
          grep -Fq 'CURRENT_GAP_TO_SQRT=5/112' "$f"
          grep -Fq 'SIXTYONE_112_SATURATION_THETA=61/224' "$f"
          grep -Fq 'SIXTYONE_112_SATURATION_PHI=1/4' "$f"
          grep -Fq 'SIXTYONE_112_CAYLEY_ONLY_ANNULUS_EXPONENT=3/56' "$f"
          grep -Fq 'SIXTYONE_112_EFFECTIVE_COLUMN_SUPPORT_EXPONENT=1/28' "$f"
          grep -Fq 'SIXTYONE_112_ROW_CRT_LIFT_EXPONENT=1/112' "$f"
          grep -Fq 'REMAINING_RECEIVER=SixtyOneOneHundredTwelfthsSingleCrossRootCayleyAnnulusEffectiveColumnTinyRowLiftIncidence' "$f"
          grep -Fq 'S7_38_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-s7-39' "$f"
