name: Stage14-s7-27 full signed quotient curve

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-27/**'
      - 'stages/stage14/scripts/14-s7-27/**'
      - '.github/workflows/stage14-s7-27-full-signed-quotient-curve.yml'
      - 'stages/stage14/14-s7-26/**'
      - 'stages/stage14/14-4cm/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run s7-27 full signed quotient curve audit
        run: python stages/stage14/scripts/14-s7-27/full_signed_quotient_curve_audit.py

      - name: Compile s7-27 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-27/full_signed_quotient_curve_audit.py

      - name: Run merged s7-26 regression
        run: python stages/stage14/scripts/14-s7-26/linear_agreement_allocation_audit.py

      - name: Run merged 4cm regression
        run: python stages/stage14/scripts/14-4/signed_linear_reciprocal_audit.py

      - name: Lock predecessor boundaries
        run: |
          grep -Fq 'STAGE14_S7_26=COMPLETE_COMMON_CORE_AGREEMENT_I_BRANCH_ELIMINATION_AND_TOP_EDGE_LINEAR_ALLOCATION' stages/stage14/14-s7-26/result.md
          grep -Fq 'XI_AGREEMENT_EXACT_TWO_WAY_LINEAR_ALLOCATION=true' stages/stage14/14-s7-26/result.md
          grep -Fq 'K_AGREEMENT_EXACT_TWO_WAY_LINEAR_ALLOCATION=true' stages/stage14/14-s7-26/result.md
          grep -Fq 'STAGE14_4CM=COMPLETE_QUADRATIC_BRANCH_ELIMINATION_AND_TOP_THETA_SIGNED_LINEAR_QUOTIENT_REDUCTION' stages/stage14/14-4cm/result.md
          grep -Fq 'TOP_THETA_SIGNED_QUOTIENT_PAIR_SUPPORT_EXPONENT_MAX=1/8' stages/stage14/14-4cm/result.md
          grep -Fq 'SIGNED_QUOTIENT_SUPPORT_ALONE_IMPLIES_POWER_SAVING=false' stages/stage14/14-4cm/result.md

      - name: Lock s7-27 theorem boundary
        run: |
          f=stages/stage14/14-s7-27/result.md
          grep -Fq 'STAGE14_S7_27=COMPLETE_FULL_SIGNED_QUOTIENT_DIVISOR_COLLAPSE_AND_RECIPROCAL_BIQUADRATIC_REDUCTION' "$f"
          grep -Fq 'FULL_XI_SIGNED_QUOTIENT_PAIR_DEFINED=true' "$f"
          grep -Fq 'FULL_K_SIGNED_QUOTIENT_PAIR_DEFINED=true' "$f"
          grep -Fq 'XI_SIGNED_QUOTIENT_PRODUCT_ODDPART=oddpart(u_res)' "$f"
          grep -Fq 'K_SIGNED_QUOTIENT_PRODUCT_ODDPART=oddpart(v_res)' "$f"
          grep -Fq 'FIXED_RESIDUAL_FULL_SIGNED_QUOTIENT_QUADRUPLE_MULTIPLICITY=Bo1' "$f"
          grep -Fq 'DOMINANT_SIGN_SPLIT_REQUIRED_FOR_EXACT_RECEIVER=false' "$f"
          grep -Fq 'RECIPROCAL_FOUR_MODULUS_QUADRATIC_SYSTEM_PROVED=true' "$f"
          grep -Fq 'RECIPROCAL_RATIO_BIDEGREE_2_2_CURVE_PROVED=true' "$f"
          grep -Fq 'TOP_THETA_RECIPROCAL_BIQUADRATIC_MODULUS_RATIO_INCIDENCE_PROVED=false' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/8' "$f"
          grep -Fq 'S7_27_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-s7-28' "$f"
