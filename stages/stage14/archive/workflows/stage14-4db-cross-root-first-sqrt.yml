name: Stage14-4db cross-root-first sqrt

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4db/**'
      - 'stages/stage14/scripts/14-4/cross_root_first_sqrt_audit.py'
      - 'stages/stage14/data/14-4/cross_root_first_sqrt_summary.json'
      - '.github/workflows/stage14-4db-cross-root-first-sqrt.yml'
      - 'stages/stage14/14-4da/**'
      - 'stages/stage14/14-X13/**'
      - 'stages/stage14/14-s7-42/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage14-4db deterministic audit
        run: python stages/stage14/scripts/14-4/cross_root_first_sqrt_audit.py

      - name: Compile Stage14-4db audit
        run: python -m py_compile stages/stage14/scripts/14-4/cross_root_first_sqrt_audit.py

      - name: Merged X13 square-root regression
        run: python stages/stage14/scripts/14-X13/reverse_reciprocal_sqrt_audit.py

      - name: Merged 4da regression
        run: python stages/stage14/scripts/14-4/sqrt_root_gcd_excess_audit.py

      - name: Merged s7-42 regression
        run: python stages/stage14/scripts/14-s7-42/sh41_critical_closure_stability_prism_audit.py

      - name: Lock predecessor theorem facts
        run: |
          grep -Fq 'SQRT_B_UPPER_BOUND_PROVED=true' stages/stage14/14-X13/result.md
          grep -Fq 'ROW_CRT_LIFT_INDEPENDENT_SUPPORT=false' stages/stage14/14-X13/result.md
          grep -Fq 'LOST_CORE_D0_DIVIDES_CROSS_ROOT_SQUARE=true' stages/stage14/14-4da/result.md
          grep -Fq 'RESIDUAL_COLUMN_FORCED_DIVISOR=K^2*G' stages/stage14/14-4da/result.md
          grep -Fq 'THETA_QUARTER_FIXED_POWER_SAMESIDE_GCD_SAVING_PROVED=true' stages/stage14/14-s7-42/result.md

      - name: Lock Stage14-4db theorem boundary
        run: |
          f=stages/stage14/14-4db/result.md
          grep -Fq 'STAGE14_4DB=COMPLETE_CROSS_ROOT_FIRST_LOST_CORE_ENUMERATION_AND_GLOBALLY_ODD_PRIMITIVE_SQRT_SATURATION' "$f"
          grep -Fq 'CROSS_ROOT_FIRST_QUANTIFIER_ORDER_PROVED=true' "$f"
          grep -Fq 'FIXED_H_LOST_CORE_DIVISOR_MULTIPLICITY=Bo1' "$f"
          grep -Fq 'CROSS_ROOT_FIRST_COMPLETE_COUNT=1/2-kappa-s' "$f"
          grep -Fq 'FIXED_POWER_CROSS_ROOT_GCD_STRICTLY_SUBSQRT=true' "$f"
          grep -Fq 'FIXED_POWER_SAMESIDE_ROOT_GCD_STRICTLY_SUBSQRT=true' "$f"
          grep -Fq 'SQRT_SATURATION_CROSS_ROOT_GCD=Bo1' "$f"
          grep -Fq 'SQRT_SATURATION_SAMESIDE_ROOT_GCD=Bo1' "$f"
          grep -Fq 'SQRT_SATURATION_LOST_CORE=Bo1' "$f"
          grep -Fq 'GLOBAL_ODD_FOUR_ROOT_PRIMITIVITY_AT_SQRT_SATURATION=true' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=1/2' "$f"
          grep -Fq 'SQRT_B_UPPER_BOUND_PROVED=true' "$f"
          grep -Fq 'STRICT_SUB_SQRT_POWER_SAVING_PROVED=false' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'T80_CROSS_PROMOTED_TO_MAINLINE=false' "$f"
          grep -Fq 'NEXT=Stage14-4dc' "$f"
