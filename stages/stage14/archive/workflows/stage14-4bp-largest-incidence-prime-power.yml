name: Stage14-4bp largest incidence prime power

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4bp/**'
      - 'stages/stage14/data/14-4/largest_incidence_prime_power_summary.json'
      - 'stages/stage14/scripts/14-4/largest_incidence_prime_power_audit.py'
      - '.github/workflows/stage14-4bp-largest-incidence-prime-power.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile 4bp audit
        run: python -m py_compile stages/stage14/scripts/14-4/largest_incidence_prime_power_audit.py
      - name: Run predecessor 4bo audit
        run: python stages/stage14/scripts/14-4/normalized_core_moving_q_audit.py
      - name: Run 4bp deterministic audit
        run: python stages/stage14/scripts/14-4/largest_incidence_prime_power_audit.py | tee /tmp/4bp-audit.txt
      - name: Check audit flags
        run: |
          grep -q 'Q_ODD_PRIMES_COPRIME_TO_DIRECTION_NORM_AUDIT=true' /tmp/4bp-audit.txt
          grep -q 'LARGEST_PRIME_POWER_UNIQUE_CELL_AUDIT=true' /tmp/4bp-audit.txt
          grep -q 'MOVING_Z_QUARTIC_EXACT_AUDIT=true' /tmp/4bp-audit.txt
          grep -q 'LARGE_Z_CROSS_CEILING_THRESHOLD_29_63=true' /tmp/4bp-audit.txt
          grep -q 'SUPER_SQRT_Z_BOUND_13_14=true' /tmp/4bp-audit.txt
          grep -q 'HARD_COMPLEMENT_R_LOWER_19_63=true' /tmp/4bp-audit.txt
          grep -q 'ALL_AUDITS_PASS=true' /tmp/4bp-audit.txt
      - name: Check theorem boundary
        run: |
          grep -q 'STAGE14_4BP=LARGEST_INCIDENCE_PRIME_POWER_ELLIPTIC_PACKET_AND_LARGE_Z_BOUND' stages/stage14/14-4bp/result.md
          grep -q 'T37_T38_CANONICAL_PRIME_IDENTIFIED_WITH_Q_LARGEST_PRIME=false' stages/stage14/14-4bp/result.md
          grep -q 'FIXED_DESCENDED_PACKET_MOVING_Z_MULTIPLICITY=B^o(1)' stages/stage14/14-4bp/result.md
          grep -q 'LARGE_Z_CROSS_CEILING_THRESHOLD=29/63' stages/stage14/14-4bp/result.md
          grep -q 'SUPER_SQRT_Z_SECTOR_BOUND=B^(13/14+o(1))' stages/stage14/14-4bp/result.md
          grep -q 'HARD_COMPLEMENT_R_EXPONENT_GT=19/63' stages/stage14/14-4bp/result.md
          grep -q 'FULL_DIRECT_POST_LOCAL_POSITIVE_SAVING_PROVED=false' stages/stage14/14-4bp/result.md
          grep -q 'NEXT=Stage14-4bq' stages/stage14/14-4bp/result.md
