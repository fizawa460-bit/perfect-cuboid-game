name: Stage14-4cg coupled residual common core

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4cg/**'
      - 'stages/stage14/scripts/14-4/coupled_residual_common_core_audit.py'
      - 'stages/stage14/data/14-4/coupled_residual_common_core_summary.json'
      - '.github/workflows/stage14-4cg-coupled-residual-common-core.yml'
      - 'stages/stage14/14-4cf/**'
      - 'stages/stage14/14-s7-20/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 4cg common-core audit
        run: python stages/stage14/scripts/14-4/coupled_residual_common_core_audit.py

      - name: Run merged s7-20 predecessor audit
        run: python stages/stage14/scripts/14-s7-20/balanced_eight_cell_audit.py

      - name: Check merged 4cf boundary
        run: |
          f=stages/stage14/14-4cf/result.md
          grep -Fq 'STAGE14_4CF=COMPLETE_BALANCED_EIGHT_CELL_GAUSSIAN_SQUARE_DIVISOR_DESCENT' "$f"
          grep -Fq 'BALANCED_FOUR_HOST_GAUSSIAN_SQUARE_DIVISOR_INCIDENCE_REQUIRED=true' "$f"
          grep -Fq 'BALANCED_FOUR_HOST_GAUSSIAN_SQUARE_DIVISOR_INCIDENCE_PROVED=false' "$f"
          grep -Fq 'NEXT=Stage14-4cg' "$f"

      - name: Lock 4cg theorem boundary
        run: |
          f=stages/stage14/14-4cg/result.md
          grep -Fq 'STAGE14_4CG=COMPLETE_PAIRWISE_RESIDUAL_COLLAPSE_AND_COMMON_CORE_COUPLING' "$f"
          grep -Fq 'K_HOST_RESIDUAL_NORMS_EQUAL=true' "$f"
          grep -Fq 'XI_HOST_RESIDUAL_NORMS_EQUAL=true' "$f"
          grep -Fq 'COMMON_ODD_CORE_DIVIDES_BOTH_RESIDUAL_NORMS=true' "$f"
          grep -Fq 'COMMON_CORE_MAX_EXPONENT=3/8' "$f"
          grep -Fq 'ENDPOINT_THETA_MINUS_PHI_RANGE=[0,1/8]' "$f"
          grep -Fq 'REDUCED_RESIDUAL_PRODUCT_MAX_EXPONENT=1/4' "$f"
          grep -Fq 'PHYSICAL_LIFT_FROM_COMMON_CORE_RESIDUAL_DATA_BO1_PROVED=false' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/8' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-4ch' "$f"
