name: Stage14-main-batch 4ft-4fv fixed-E shadow split

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4ft/**'
      - 'stages/stage14/14-4fu/**'
      - 'stages/stage14/14-4fv/**'
      - 'stages/stage14/14-4-batch/4ft-4fv-report.md'
      - 'stages/stage14/scripts/14-4/batch_4ft_4fv_fixed_e_shadow_split_audit.py'
      - '.github/workflows/stage14-main-batch-4ft-4fv-fixed-e-shadow-split.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deterministic audit
        run: python stages/stage14/scripts/14-4/batch_4ft_4fv_fixed_e_shadow_split_audit.py

      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/14-4/batch_4ft_4fv_fixed_e_shadow_split_audit.py

      - name: Previous mainline regression
        run: python stages/stage14/scripts/14-4/batch_4fq_4fs_bare_shadow_completion_audit.py

      - name: s7-99-101 regression
        run: python stages/stage14/scripts/14-s-batch/s7_99_101_outer_existence_split_audit.py

      - name: Work-bvX34 regression
        run: python stages/stage14/scripts/14-Work-bvX34/local_theorem_coverage_audit.py

      - name: Lock batch contracts
        run: |
          grep -Fq 'Stage14-main-batch' stages/stage14/archive/docs/operations/stage14-main-batch-task-contract.md
          grep -Fq 'BATCH_INTEGRATED_H_UNITS=' stages/stage14/archive/docs/operations/stage14-batch-common-contract.md

      - name: Lock new receiver boundary
        run: |
          grep -Fq 'FIXED_E_ENDPOINT_UNITARY_WITNESS_CHOICE_EXHAUSTED=true' stages/stage14/14-4ft/result.md
          grep -Fq 'UNITARY_RESTRICTION_REMOVAL_COST_FOR_UPPER_BOUND=ZERO' stages/stage14/14-4fu/result.md
          grep -Fq 'Q14_UNITARY_UPPER_BOUND_ADAPTER_COMPLETE=true' stages/stage14/14-4fv/result.md
          grep -Fq 'BATCH_SUBSTANTIVE_WORK_UNIT_COUNT=3' stages/stage14/14-4-batch/4ft-4fv-report.md
          grep -Fq 'BATCH_STOP_REASON=receiver_change' stages/stage14/14-4-batch/4ft-4fv-report.md
          grep -Fq 'NEXT=Stage14-4fw' stages/stage14/14-4-batch/4ft-4fv-report.md

      - name: Diff check
        run: git diff --check origin/main...HEAD
