name: Stage14-4be local retainer instantiation

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4be/**'
      - 'stages/stage14/data/14-4/local_retainer_instantiation_summary.json'
      - 'stages/stage14/scripts/14-4/local_retainer_instantiation_audit.py'
      - '.github/workflows/stage14-4be-local-retainer-instantiation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/14-4/local_retainer_instantiation_audit.py
      - name: Run deterministic audit
        run: python stages/stage14/scripts/14-4/local_retainer_instantiation_audit.py
      - name: Check theorem boundary flags
        run: |
          grep -q 'STAGE14_4BE=UNWEIGHTED_FULL_LOCAL_RETAINER_INSTANTIATED' stages/stage14/14-4be/result.md
          grep -q 'UNWEIGHTED_RHO_LOC_B_EXPONENT=1/400' stages/stage14/14-4be/result.md
          grep -q 'UNWEIGHTED_E_LOC=0' stages/stage14/14-4be/result.md
          grep -q 'EXPLICIT_NONTRIVIAL_RHO_LOC_PROVED=true' stages/stage14/14-4be/result.md
          grep -q 'EXPLICIT_COMPLETE_E_LOC_PROVED=true' stages/stage14/14-4be/result.md
          grep -q 'D_LOC_SEPARATE_POWER_SAVING_PROVED=false' stages/stage14/14-4be/result.md
          grep -q 'ARBITRARY_WEIGHT_LOCAL_RETAINER_PROVED=false' stages/stage14/14-4be/result.md
          grep -q 'NEXT=Stage14-4bf' stages/stage14/14-4be/result.md
