name: Stage14-s7-34 fourth-power root transfer 47/80

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-34/**'
      - 'stages/stage14/scripts/14-s7-34/**'
      - '.github/workflows/stage14-s7-34-fourth-power-root-transfer-47-80.yml'
      - 'stages/stage14/14-s7-33/**'
      - 'stages/stage14/14-4cu/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage14-s7-34 fourth-power audit
        run: python stages/stage14/scripts/14-s7-34/fourth_power_root_transfer_47_80_audit.py

      - name: Compile Stage14-s7-34 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-34/fourth_power_root_transfer_47_80_audit.py

      - name: Run merged s7-33 boundary regression
        run: python stages/stage14/scripts/14-s7-33/theorem_boundary_audit.py

      - name: Run merged 4cu regression
        run: python stages/stage14/scripts/14-4/orientation_linear_product_19_32_audit.py

      - name: Lock predecessor boundaries
        run: |
          grep -Fq 'STAGE14_S7_33=COMPLETE_COMMON_CORE_GAUSSIAN_ORIENTATION_IDENTIFICATION_AND_TRANSFER_NOGO' stages/stage14/14-s7-33/result.md
          grep -Fq 'COMMON_CORE_CANCELLED_GAUSSIAN_TRANSFER_IDENTITY_PROVED=true' stages/stage14/14-s7-33/result.md
          grep -Fq 'STAGE14_4CU=COMPLETE_RESIDUAL_CAYLEY_ORIENTATION_LINEAR_PRODUCT_TRANSFER_AND_19_32_PROMOTION' stages/stage14/14-4cu/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=19/32' stages/stage14/14-4cu/result.md
          grep -Fq 'JOINT_CORE_DIVIDES_ENDPOINT_LINEAR_PRODUCT=true' stages/stage14/14-4cu/result.md

      - name: Lock Stage14-s7-34 theorem boundary
        run: |
          f=stages/stage14/14-s7-34/result.md
          grep -Fq 'STAGE14_S7_34=COMPLETE_XI_FOURTH_POWER_ROOT_GCD_TRANSFER_AND_47_80_PROMOTION' "$f"
          grep -Fq 'XI_COMMON_ROOT_GCD_FOURTH_POWER_DIVIDES_QXI=true' "$f"
          grep -Fq 'XI_H_DYADIC_COMPLETE_COUNT_EXPONENT=3phi-1/8-3eta' "$f"
          grep -Fq 'NONPROPORTIONAL_FORCED_SAVING=3*(chi-1/4)/7' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=47/80' "$f"
          grep -Fq 'IMPROVEMENT_OVER_PREVIOUS_19_32=1/160' "$f"
          grep -Fq 'FORTY_SEVEN_EIGHTIETHS_SATURATION_THETA=47/160' "$f"
          grep -Fq 'FORTY_SEVEN_EIGHTIETHS_SATURATION_PHI=1/4' "$f"
          grep -Fq 'FORTY_SEVEN_EIGHTIETHS_EXTRA_XI_GCD_EXPONENT=1/40' "$f"
          grep -Fq 'REMAINING_RECEIVER=FortySevenEightiethsExtraXiResidualGcdJointCoreLinearFactorIncidence' "$f"
          grep -Fq 'S7_34_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-s7-35' "$f"
