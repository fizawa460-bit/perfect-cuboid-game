name: Stage14-s6-02 genus-one large-prime incidence audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s6-02/**'
      - 'stages/stage14/scripts/14-s6-02/**'
      - 'stages/stage14/14-s6-01/result.md'
      - '.github/workflows/stage14-s6-02-genus1-large-prime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic s6-02 audit
        run: python stages/stage14/scripts/14-s6-02/genus1_large_prime_audit.py
      - name: Lock s6-02 boundary flags
        run: |
          grep -F 'STAGE14_S6_02=COMPLETE_GENUS_ONE_PACKET_GEOMETRY_AND_LARGE_PRIME_INCIDENCE_SECTOR' stages/stage14/14-s6-02/result.md
          grep -F 'FIXED_PACKET_SMOOTH_GENUS_ONE_PROVED=true' stages/stage14/14-s6-02/result.md
          grep -F 'POSITIVE_DIMENSIONAL_TORSION_BOUNDARY_COMPONENT=false' stages/stage14/14-s6-02/result.md
          grep -F 'CANONICAL_EDGE_LARGE_PRIME_TWO_LINE_INCIDENCE=true' stages/stage14/14-s6-02/result.md
          grep -F 'LARGE_EDGE_KERNEL_LONG_VARIABLE_SECTOR_POWER_SAVING_PROVED=true' stages/stage14/14-s6-02/result.md
          grep -F 'FULL_DIRECT_POST_LOCAL_POSITIVE_SAVING_PROVED=false' stages/stage14/14-s6-02/result.md
          grep -F 'POST_LOCAL_SAVING_REQUIRED_FOR_SQRT_B_UPPER_BOUND=10/21' stages/stage14/14-s6-02/result.md
          grep -F 'NEXT=Stage14-s6-03' stages/stage14/14-s6-02/result.md
