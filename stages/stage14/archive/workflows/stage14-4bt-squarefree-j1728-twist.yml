name: Stage14-4bt squarefree j1728 twist

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4bt/**'
      - 'stages/stage14/14-4bt/result.md'
      - 'stages/stage14/data/14-4/squarefree_j1728_twist_summary.json'
      - 'stages/stage14/scripts/14-4/squarefree_j1728_twist_audit.py'
      - '.github/workflows/stage14-4bt-squarefree-j1728-twist.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile 4bt audit
        run: python -m py_compile stages/stage14/scripts/14-4/squarefree_j1728_twist_audit.py
      - name: Run predecessor 4bs audit
        run: python stages/stage14/scripts/14-4/architecture_barrier_joint_receiver_audit.py
      - name: Run 4bt deterministic audit
        run: python stages/stage14/scripts/14-4/squarefree_j1728_twist_audit.py
      - name: Check theorem boundary
        run: |
          grep -q 'STAGE14_4BT=SQUAREFREE_J1728_TWIST_COMPRESSION_AND_TORSION_PAIR_EXCLUSION' stages/stage14/14-4bt/result.md
          grep -q 'PHYSICAL_TWO_POINT_DIFFERENCE_INFINITE_ORDER=true' stages/stage14/14-4bt/result.md
          grep -q 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=20/21' stages/stage14/14-4bt/result.md
          grep -q 'NEW_WHOLE_FAMILY_POWER_SAVING_PROVED=false' stages/stage14/14-4bt/result.md
