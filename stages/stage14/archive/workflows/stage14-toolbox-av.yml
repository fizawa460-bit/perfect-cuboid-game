name: Stage14 toolbox-av certificate-consumer audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-toolbox-av/**'
      - 'stages/stage14/scripts/14-toolbox-av/**'
      - 'docs/stage14-toolbox/certificate-consumer-matrix.md'
      - '.github/workflows/stage14-toolbox-av.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python stages/stage14/scripts/14-toolbox-av/certificate_consumer_audit.py
