name: Stage14-s7-36 row-column proportional 9/16

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-36/**'
      - 'stages/stage14/scripts/14-s7-36/**'
      - '.github/workflows/stage14-s7-36-row-column-proportional-9-16.yml'
      - 'stages/stage14/14-s7-35/**'
      - 'stages/stage14/14-4cv/**'
      - 'stages/stage14/14-4cu/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage14-s7-36 audit
        run: python stages/stage14/scripts/14-s7-36/row_column_proportional_9_16_audit.py

      - name: Compile Stage14-s7-36 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-36/row_column_proportional_9_16_audit.py

      - name: Run merged s7-35 regression
        run: python stages/stage14/scripts/14-s7-35/extra_gcd_collapse_4_7_audit.py

      - name: Run merged 4cv regression
        run: python stages/stage14/scripts/14-4/row_column_cofactor_7_12_audit.py

      - name: Run merged 4cu regression
        run: python stages/stage14/scripts/14-4/orientation_linear_product_19_32_audit.py

      - name: Lock predecessor boundaries
        run: |
          grep -Fq 'STAGE14_S7_35=COMPLETE_EXTRA_XI_RESIDUAL_GCD_COLLAPSE_AND_4_7_PROMOTION' stages/stage14/14-s7-35/result.md
          grep -Fq 'XI_EXTRA_GCD_DIVIDES_ENDPOINT_OMEGA_PRODUCT=true' stages/stage14/14-s7-35/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=4/7' stages/stage14/14-s7-35/result.md
          grep -Fq 'STAGE14_4CV=COMPLETE_JOINT_CORE_ROW_COLUMN_COFACTOR_RECONSTRUCTION_AND_SEVEN_TWELFTHS_PROMOTION' stages/stage14/14-4cv/result.md

      - name: Lock Stage14-s7-36 theorem boundary
        run: |
          f=stages/stage14/14-s7-36/result.md
          grep -Fq 'STAGE14_S7_36=COMPLETE_ROW_COLUMN_REOPTIMIZATION_AND_9_16_PROPORTIONAL_BARRIER_PROMOTION' "$f"
          grep -Fq 'MERGED_4CV_ROW_COLUMN_RECONSTRUCTION_IMPORTED=true' "$f"
          grep -Fq 'S7_35_EXTRA_GCD_COLLAPSE_INSERTED_INTO_ROW_COLUMN_LEDGER=true' "$f"
          grep -Fq 'NONPROPORTIONAL_BRANCH_UPPER_BOUND_EXPONENT=19/34' "$f"
          grep -Fq 'NONPROPORTIONAL_SATURATION_THETA=19/68' "$f"
          grep -Fq 'NONPROPORTIONAL_TWIN_SHORT_SUPPORT_EXPONENT=1/34' "$f"
          grep -Fq 'PROPORTIONAL_BRANCH_UPPER_BOUND_EXPONENT=9/16' "$f"
          grep -Fq 'PROPORTIONAL_SATURATION_PHI_RANGE=[11/48,1/4]' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=9/16' "$f"
          grep -Fq 'IMPROVEMENT_OVER_PREVIOUS_4_7=1/112' "$f"
          grep -Fq 'CURRENT_GAP_TO_SQRT=1/16' "$f"
          grep -Fq 'REMAINING_RECEIVER=NineSixteenthsProportionalCommonZScaleKGaussianResidualIncidence' "$f"
          grep -Fq 'S7_36_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-s7-37' "$f"
