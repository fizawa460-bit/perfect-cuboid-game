name: Stage14 tH28 audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-tH28/**'
      - 'stages/stage14/scripts/14-tH28/**'
      - '.github/workflows/stage14-tH28.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen tH28 deterministic audit
        run: python stages/stage14/scripts/14-tH28/projected_support_audit.py
      - name: Diff check
        run: git diff --check
