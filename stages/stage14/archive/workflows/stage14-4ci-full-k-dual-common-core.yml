name: Stage14-4ci full k-dual common core

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4ci/**'
      - 'stages/stage14/scripts/14-4/full_k_dual_common_core_audit.py'
      - 'stages/stage14/data/14-4/full_k_dual_common_core_summary.json'
      - '.github/workflows/stage14-4ci-full-k-dual-common-core.yml'
      - 'stages/stage14/14-4ch/**'
      - 'stages/stage14/14-s7-22/**'
      - 'stages/stage14/14-X0/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage14-4ci audit
        run: python stages/stage14/scripts/14-4/full_k_dual_common_core_audit.py

      - name: Run Stage14-4ch predecessor regression
        run: python stages/stage14/scripts/14-4/eight_cell_residual_lift_audit.py

      - name: Run Stage14-s7-22 predecessor regression
        run: python stages/stage14/scripts/14-s7-22/dual_saturation_tangent_audit.py

      - name: Lock Stage14-4ci boundary
        run: |
          f=stages/stage14/14-4ci/result.md
          grep -Fq 'STAGE14_4CI=COMPLETE_COMMON_CORE_FULL_K_DUAL_SATURATION_AND_NORMALIZED_HOST_REDUCTION' "$f"
          grep -Fq 'JOINT_COMMON_CORE_CRT_PHYSICAL_FIBER_LEMMA_PROVED=true' "$f"
          grep -Fq 'K_PRIMITIVE_Z_DIRECTION_IN_LATTICE=true' "$f"
          grep -Fq 'K_DUAL_SATURATION_ORDER=k^2' "$f"
          grep -Fq 'K_DUAL_DEFECT=1' "$f"
          grep -Fq 'COMMON_Z_SCALE_SQUARE_DIVIDES_QK=true' "$f"
          grep -Fq 'COMMON_OMEGA_SCALE_SQUARE_DIVIDES_QXI=true' "$f"
          grep -Fq 'NORMALIZED_COUPLED_FOUR_HOST_SYSTEM_PROVED=true' "$f"
          grep -Fq 'DYADIC_RESIDUAL_TRIPLE_SUPPORT_EXPONENT=2*(theta+phi)-1/2' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/8' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-4cj' "$f"
