name: Stage14-4cd four-root lattice endpoint

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4cd/**'
      - 'stages/stage14/data/14-4/four_root_lattice_endpoint_summary.json'
      - 'stages/stage14/scripts/14-4/four_root_lattice_endpoint_audit.py'
      - 'stages/stage14/14-s7-15/**'
      - 'stages/stage14/14-tH14/**'
      - 'stages/stage14/14-t52/**'
      - '.github/workflows/stage14-4cd-four-root-lattice-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Stage14-4cd four-root lattice endpoint
        run: python stages/stage14/scripts/14-4/four_root_lattice_endpoint_audit.py

      - name: Lock Stage14-4cd theorem boundary
        shell: bash
        run: |
          set -euo pipefail
          f=stages/stage14/14-4cd/result.md
          grep -F 'STAGE14_4CD=FOUR_ROOT_LATTICE_CONGRUENCE_AND_MAXIMAL_K_ENDPOINT_LOCALIZATION' "$f"
          grep -F 'DIFFERENCE_KERNEL_CONGRUENCE_LATTICE_EXACT=true' "$f"
          grep -F 'CRITICAL_LATTICE_SUPPORT_EXPONENT=1/8+(d+kappa)/2' "$f"
          grep -F 'SEVEN_EIGHT_RESIDUAL_REQUIRES_K_EXPONENT=1-o(1)' "$f"
          grep -F 'CRITICAL_TWIST_PARAMETER_EXPONENT=7/4+o(1)' "$f"
          grep -F 'PHYSICAL_WEIGHTED_SQUARECLASS_FIBER_ENERGY_PROVED=false' "$f"
          grep -F 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/8' "$f"
          grep -F 'MAINLINE_H_NEEDED=false' "$f"
          grep -F 'NEXT=Stage14-4ce' "$f"
