name: Stage14-4dd full-residual balanced Gaussian density

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4dd/**'
      - 'stages/stage14/data/14-4/full_residual_balanced_gaussian_density_summary.json'
      - 'stages/stage14/scripts/14-4/full_residual_balanced_gaussian_density_audit.py'
      - '.github/workflows/stage14-4dd-full-residual-balanced-gaussian-density.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage14-4dd deterministic audit
        run: python stages/stage14/scripts/14-4/full_residual_balanced_gaussian_density_audit.py

      - name: Compile Stage14-4dd audit
        run: python -m py_compile stages/stage14/scripts/14-4/full_residual_balanced_gaussian_density_audit.py

      - name: Merged 4dH regression
        run: |
          f=stages/stage14/14-4dH/result.md
          grep -Fq 'STAGE14_4DH=COMPLETE_MAINLINE_H_APPLICABILITY_AUDIT_NO_CERTIFIED_UNIFORM_DELTA' "$f"
          grep -Fq 'ZERO_FREQUENCY_PHYSICAL_DENSITY_OBSTRUCTION=true' "$f"
          grep -Fq 'MAINLINE_BLOCKED_BY_H=false' "$f"
          grep -Fq 'NEXT=Stage14-4dd' "$f"
          python stages/stage14/scripts/14-4/gaussian_product_physical_energy_h_audit.py >/dev/null

      - name: Merged 4dc regression
        run: |
          f=stages/stage14/14-4dc/result.md
          grep -Fq 'STAGE14_4DC=COMPLETE_GAUSSIAN_PRODUCT_ROOT_LINE_COMPRESSION_TRANSVERSE_RESULTANT_NOGO_AND_MAINLINE_H_GATE' "$f"
          grep -Fq 'GAUSSIAN_PRODUCT_ROOT_LINE_EXPONENT=1/2-chi' "$f"
          python stages/stage14/scripts/14-4/gaussian_product_rootline_h_gate_audit.py >/dev/null

      - name: X13 and s7-42 predecessor locks
        run: |
          grep -Fq 'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=1/2' stages/stage14/14-X13/result.md
          grep -Fq 'FIRST_RESIDUAL_AND_SINGLE_COLUMN_POWER_EQUIVALENT=true' stages/stage14/14-s7-42/result.md

      - name: Stage14-4dd theorem boundary
        run: |
          f=stages/stage14/14-4dd/result.md
          grep -Fq 'STAGE14_4DD=COMPLETE_FIRST_RESIDUAL_DEFICIT_SAVING_AND_BALANCED_GAUSSIAN_SATURATION_REDUCTION' "$f"
          grep -Fq 'FIXED_MU_COMPLETE_COUNT_EXPONENT=2phi+mu' "$f"
          grep -Fq 'FIRST_RESIDUAL_FIXED_POWER_DEFICIT_SAVING_PROVED=true' "$f"
          grep -Fq 'SQRT_SATURATION_REQUIRES_FIRST_RESIDUAL_AT_CAP=true' "$f"
          grep -Fq 'SQRT_SATURATION_GAUSSIAN_PAIR_BALANCED=true' "$f"
          grep -Fq 'NORM_DIVISOR_REPARAMETERIZATION_GIVES_EXTRA_FIXED_POWER_SAVING=false' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=1/2' "$f"
          grep -Fq 'STRICT_SUBSQRT_POWER_SAVING_PROVED=false' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-4de' "$f"
