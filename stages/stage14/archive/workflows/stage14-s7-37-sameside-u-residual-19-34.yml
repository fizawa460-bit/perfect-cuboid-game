name: Stage14-s7-37 same-side residual 19/34
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run s7-37 audit
        run: python stages/stage14/scripts/14-s7-37/sameside_u_residual_19_34_audit.py
      - name: Compile s7-37 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-37/sameside_u_residual_19_34_audit.py
      - name: Run s7-36 regression
        run: python stages/stage14/scripts/14-s7-36/row_column_proportional_9_16_audit.py
      - name: Run X11 regression
        run: python stages/stage14/scripts/14-X11/proportional_root_gcd_19_34_audit.py
      - name: Run s7-34 regression
        run: python stages/stage14/scripts/14-s7-34/fourth_power_root_transfer_47_80_audit.py
      - name: Run 4ci regression
        run: python stages/stage14/scripts/14-4/full_k_dual_common_core_audit.py
      - name: Lock s7-37 boundary
        run: |
          f=stages/stage14/14-s7-37/result.md
          grep -Fq 'STAGE14_S7_37=COMPLETE_PROPORTIONAL_SAMESIDE_RESIDUAL_TRANSFER_AND_19_34_REFINEMENT' "$f"
          grep -Fq 'SAMESIDE_ROOT_GCD_COPRIME_TO_QXI=true' "$f"
          grep -Fq 'SAMESIDE_ROOT_GCD_SQUARE_DIVIDES_U_RES=true' "$f"
          grep -Fq 'PROPORTIONAL_BRANCH_UPPER_BOUND_EXPONENT=7/16' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=19/34' "$f"
          grep -Fq 'S7_37_PROVES_ADDITIONAL_WHOLE_FAMILY_POWER_SAVING=false' "$f"
          grep -Fq 'S7_37_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-s7-38' "$f"
