name: Stage14-s7-06 torsion self-correspondence audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-06/**'
      - 'stages/stage14/scripts/14-s7-06/**'
      - '.github/workflows/stage14-s7-06-torsion-self-correspondence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile s7-06 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-06/torsion_self_correspondence_audit.py

      - name: Run predecessor s7-05 audit
        run: python stages/stage14/scripts/14-s7-05/joint_twist_pair_receiver_audit.py > /tmp/s7-05.txt

      - name: Run s7-06 deterministic audit
        run: python stages/stage14/scripts/14-s7-06/torsion_self_correspondence_audit.py | tee /tmp/s7-06.txt

      - name: Check predecessor
        run: grep -q '^ALL_AUDITS_PASS=true$' /tmp/s7-05.txt

      - name: Check s7-06 audit flags
        run: |
          grep -q '^ORDERED_PHYSICAL_INCIDENCES=124$' /tmp/s7-06.txt
          grep -q '^MERGED_S7_05_RECEIVER_AUDIT=true$' /tmp/s7-06.txt
          grep -q '^MERGED_4BT_TORSION_BOUNDARY_AUDIT=true$' /tmp/s7-06.txt
          grep -q '^XI_K_COPRIME_AUDIT=true$' /tmp/s7-06.txt
          grep -q '^SQUAREFREE_N_AUDIT=true$' /tmp/s7-06.txt
          grep -q '^PHYSICAL_N_GT_1_AUDIT=true$' /tmp/s7-06.txt
          grep -q '^NO_RATIONAL_4_TORSION_CONDITION_AUDIT=true$' /tmp/s7-06.txt
          grep -q '^POSITIVE_LIFT_TORSION_CORRESPONDENCE_EXCLUSION_AUDIT=true$' /tmp/s7-06.txt
          grep -q '^PHYSICAL_TWO_POINT_DIFFERENCE_INFINITE_ORDER_THEOREM_IMPORTED=true$' /tmp/s7-06.txt
          grep -q '^PHYSICAL_TWIST_PAIR_POSITIVE_RANK_GATE=true$' /tmp/s7-06.txt
          grep -q '^FIXED_N_FACTORIZATION_MULTIPLICITY_AUDIT=true$' /tmp/s7-06.txt
          grep -q '^PHYSICAL_N_BOUND_B_SQUARED_AUDIT=true$' /tmp/s7-06.txt
          grep -q '^ALL_AUDITS_PASS=true$' /tmp/s7-06.txt

      - name: Check theorem boundary
        run: |
          grep -q 'STAGE14_S7_06=COMPLETE_SQUAREFREE_J1728_TORSION_SELF_CORRESPONDENCE_EXCLUSION' stages/stage14/14-s7-06/result.md
          grep -q 'TWIST_PARAMETER_N_SQUAREFREE=true' stages/stage14/14-s7-06/result.md
          grep -q 'PHYSICAL_TWO_POINT_DIFFERENCE_INFINITE_ORDER=true' stages/stage14/14-s7-06/result.md
          grep -q 'PHYSICAL_TWIST_PAIR_IMPLIES_POSITIVE_RANK_ON_E_N=true' stages/stage14/14-s7-06/result.md
          grep -q 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=20/21' stages/stage14/14-s7-06/result.md
          grep -q 'NEXT=Stage14-s7-07' stages/stage14/14-s7-06/result.md
