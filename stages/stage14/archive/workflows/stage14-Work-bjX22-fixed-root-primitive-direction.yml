name: Stage14-Work-bjX22 fixed root primitive direction

on:
  pull_request:
    paths:
      - 'stages/stage14/14-Work-bjX22/**'
      - 'stages/stage14/scripts/14-Work-bjX22/**'
      - 'docs/stage14-toolbox/work-bjX22-receiver-matrix.md'
      - '.github/workflows/stage14-Work-bjX22-fixed-root-primitive-direction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run integrated bjX22 audit
        run: python stages/stage14/scripts/14-Work-bjX22/fixed_root_primitive_direction_audit.py
      - name: Compile integrated audit
        run: python -m py_compile stages/stage14/scripts/14-Work-bjX22/fixed_root_primitive_direction_audit.py
      - name: Regress merged Work-biX21
        run: python stages/stage14/scripts/14-Work-biX21/prime_support_energy_audit.py
      - name: Regress merged 4dw
        run: python stages/stage14/scripts/14-4/fixed_prime_divisor_pair_mass_audit.py
      - name: Regress merged s7-63
        run: python stages/stage14/scripts/14-s7-63/proportional_collision_collapse_audit.py
      - name: Regress merged t103
        run: python stages/stage14/14-t103/audit.py
      - name: Lock integrated theorem boundary
        run: |
          f=stages/stage14/14-Work-bjX22/result.md
          grep -Fq 'GLOBAL_PRIMITIVE_DIRECTION_COUNT_EXPONENT=1/2' "$f"
          grep -Fq 'GLOBAL_FIXED_GAUSSIAN_ROOT_ORIENTATION_PROVED=true' "$f"
          grep -Fq 'GLOBAL_FIXED_ROOT_ORIENTATION_DIRECTION_COUNT_EXPONENT=1/2' "$f"
          grep -Fq 'COLLISION_ENERGY_DISCHARGED_AS_LOCALIZATION=true' "$f"
          grep -Fq 'COMMON_FINITE_LABEL_FREEZING_PRINCIPLE_PROVED=true' "$f"
          grep -Fq 'COMMON_ARITHMETIC_MASK_ADAPTER_PROVED=false' "$f"
          grep -Fq 'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=1/2' "$f"
          grep -Fq 'TH28_NEEDED=false' "$f"
      - name: Lock receiver matrix
        run: |
          grep -Fq 'COMMON_FINITE_LABEL_FREEZING_PRINCIPLE_PROVED=true' docs/stage14-toolbox/work-bjX22-receiver-matrix.md
          grep -Fq 'FixedPrimeFixedRootPrimitiveDivisorPairPhysicalMaskTransportLemma' docs/stage14-toolbox/work-bjX22-receiver-matrix.md
      - name: Diff check
        run: git diff --check origin/main...HEAD
