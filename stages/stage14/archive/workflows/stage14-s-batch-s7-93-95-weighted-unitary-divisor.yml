name: Stage14-s-batch s7-93..95 weighted unitary divisor

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-93/**'
      - 'stages/stage14/14-s7-94/**'
      - 'stages/stage14/14-s7-95/**'
      - 'stages/stage14/14-s-batch/s7-93-95-report.md'
      - 'stages/stage14/scripts/14-s-batch/s7_93_95_weighted_unitary_divisor_audit.py'
      - '.github/workflows/stage14-s-batch-s7-93-95-weighted-unitary-divisor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Batch deterministic audit
        run: python stages/stage14/scripts/14-s-batch/s7_93_95_weighted_unitary_divisor_audit.py

      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/14-s-batch/s7_93_95_weighted_unitary_divisor_audit.py

      - name: Regress merged s7-90..92
        run: python stages/stage14/scripts/14-s-batch/s7_90_92_primitive_ratio_window_audit.py

      - name: Regress merged mainline 4fh..4fj
        run: python stages/stage14/scripts/14-4/batch_4fh_4fj_reciprocal_window_interior_audit.py

      - name: Regress merged Work-bsX31
        run: python stages/stage14/scripts/14-Work-bsX31/scalar_outer_reciprocal_selector_audit.py

      - name: Lock common and s batch contracts
        run: |
          grep -Fq '## Integrated sH work unit' stages/stage14/archive/docs/operations/stage14-s-batch-task-contract.md
          grep -Fq 'BATCH_INTEGRATED_H_UNITS=' stages/stage14/archive/docs/operations/stage14-batch-common-contract.md
          grep -Fq 'unresolved_external_gate' stages/stage14/archive/docs/operations/stage14-batch-common-contract.md

      - name: Lock batch boundary
        run: |
          grep -Fq 'STAGE14_S7_93=COMPLETE_INTERIOR_PHYSICAL_INCIDENCE_PULLBACK_AND_COMPLEMENTARY_E_WEIGHT_OPENING' stages/stage14/14-s7-93/result.md
          grep -Fq 'PHYSICAL_INCIDENCE_PULLED_BACK_TO_RATIO_COORDINATE=true' stages/stage14/14-s7-93/result.md
          grep -Fq 'STAGE14_S7_94=COMPLETE_PRIMITIVE_RATIO_TO_PRIME_POWER_ORIENTATION_AND_INNER_ENDPOINT_GEOMETRY_NOGO' stages/stage14/14-s7-94/result.md
          grep -Fq 'INNER_RATIO_ENDPOINT_DISTINCT_FROM_RADIAL_ENDPOINT=true' stages/stage14/14-s7-94/result.md
          grep -Fq 'STAGE14_S7_95=COMPLETE_PRIMITIVE_RATIO_WINDOW_TO_WEIGHTED_UNITARY_DIVISOR_SHORT_INTERVAL_RECEIVER' stages/stage14/14-s7-95/result.md
          grep -Fq 'WEIGHTED_UNITARY_DIVISOR_INCIDENCE_DEFINED=true' stages/stage14/14-s7-95/result.md
          grep -Fq 'BATCH_SUBSTANTIVE_WORK_UNIT_COUNT=3' stages/stage14/14-s-batch/s7-93-95-report.md
          grep -Fq 'BATCH_INTEGRATED_H_UNITS=NONE' stages/stage14/14-s-batch/s7-93-95-report.md
          grep -Fq 'BATCH_STOP_REASON=receiver_change' stages/stage14/14-s-batch/s7-93-95-report.md
          grep -Fq 'NEXT=Stage14-s7-96' stages/stage14/14-s-batch/s7-93-95-report.md

      - name: Diff check
        run: git diff --check origin/main...HEAD
