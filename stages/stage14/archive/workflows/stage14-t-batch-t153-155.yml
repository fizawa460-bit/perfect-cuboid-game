name: Stage14-t-batch t153-t155 long lattice harmonic capacity

on:
  pull_request:
    paths:
      - 'stages/stage14/14-t153/**'
      - 'stages/stage14/14-t154/**'
      - 'stages/stage14/14-t155/**'
      - 'stages/stage14/14-t-batch-t153-155/**'
      - '.github/workflows/stage14-t-batch-t153-155.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Audit t153-t155
        run: python stages/stage14/14-t-batch-t153-155/audit.py
      - name: Regression t150-t152
        run: python stages/stage14/14-t-batch-t150-152/audit.py
      - name: Regression t147-t149
        run: python stages/stage14/14-t-batch-t147-149/audit.py
      - name: Regression repaired t144-t146
        run: python stages/stage14/14-t-batch-t144-146/audit.py
