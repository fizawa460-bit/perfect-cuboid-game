name: Stage14-Work-ceX43 q20 conditioned correlation audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-Work-ceX43/**'
      - 'docs/stage14-toolbox/work-ceX43-receiver-matrix.md'
      - 'docs/stage14-q20-**'
      - 'stages/stage14/scripts/14-Work-ceX43/**'
      - '.github/workflows/stage14-Work-ceX43-q20-conditioned-correlation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run integrated ceX43 plus q20 audit
        run: python stages/stage14/scripts/14-Work-ceX43/conditioned_correlation_audit.py
      - name: Compile integrated audit
        run: python -m py_compile stages/stage14/scripts/14-Work-ceX43/conditioned_correlation_audit.py
      - name: Regress merged s7-129..131
        run: python stages/stage14/scripts/14-s-batch/s7_129_131_second_reverse_weight_audit.py
      - name: Lock merged Work-cdX42 and q19
        run: |
          grep -Fq 'RESOLVED_INNER_SUPPORT_ADAPTER_CONSUMPTION_LEMMA_PROVED=true' stages/stage14/14-Work-cdX42/result.md
          grep -Fq 'STAGE14_Q19=COMPLETE_CONDITIONED_SECOND_REVERSE_EXTENSION_LITERATURE_RADAR' docs/stage14-q19-summary.md
      - name: Lock parked main and fixed-U gates
        run: |
          grep -Fq 'MAINLINE_H_COMPLETED=true' stages/stage14/14-Work-cdX42/result.md
          grep -Fq 'FIXED_U_H_COMPLETED=true' stages/stage14/14-Work-cdX42/result.md
          grep -Fq 'TH33_COMPLETE_CONSUMED=true' stages/stage14/14-Work-cdX42/result.md
      - name: Lock q20 boundary
        run: |
          grep -Fq 'Q20_COMPONENT_COMPLETE=true' docs/stage14-q20-summary.md
          grep -Fq 'DIRECT_FULL_OBSTRUCTION_THEOREM_COUNT=0' docs/stage14-q20-summary.md
          grep -Fq 'Q20_WITNESS_DEPENDENCE_SEPARABILITY_TEST' docs/stage14-q20-summary.md
          grep -Fq 'Q20_FIXED_SHIFT_OR_BINARY_FORM_NORMAL_FORM_TEST' docs/stage14-q20-summary.md
      - name: Lock integrated XQ boundary
        run: |
          grep -Fq 'CONDITIONED_CORRELATION_RECEIVER_ISOLATION_LEMMA_PROVED=true' stages/stage14/14-Work-ceX43/result.md
          grep -Fq 'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=1/2' stages/stage14/14-Work-ceX43/result.md
          grep -Fq 'TH34_NEEDED=false' stages/stage14/14-Work-ceX43/result.md
          grep -Fq 'STAGE14_AUTOMATION_SAFE=true' stages/stage14/14-Work-ceX43/result.md
          grep -Fq 'STAGE14_ROUTE=xq' stages/stage14/14-Work-ceX43/result.md
      - name: Diff check
        run: git diff --check origin/main...HEAD
