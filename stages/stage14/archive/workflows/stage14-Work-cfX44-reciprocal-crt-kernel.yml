name: Stage14-Work-cfX44 reciprocal CRT kernel audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-Work-cfX44/**'
      - 'docs/stage14-toolbox/work-cfX44-receiver-matrix.md'
      - 'stages/stage14/scripts/14-Work-cfX44/**'
      - '.github/workflows/stage14-Work-cfX44-reciprocal-crt-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run integrated cfX44 audit
        run: python stages/stage14/scripts/14-Work-cfX44/reciprocal_crt_kernel_audit.py
      - name: Compile integrated audit
        run: python -m py_compile stages/stage14/scripts/14-Work-cfX44/reciprocal_crt_kernel_audit.py
      - name: Regress merged s7-132..134
        run: python stages/stage14/scripts/14-s-batch/s7_132_134_quadratic_divisor_root_audit.py
      - name: Lock merged Work-ceX43 and q20
        run: |
          grep -Fq 'CONDITIONED_CORRELATION_RECEIVER_ISOLATION_LEMMA_PROVED=true' stages/stage14/14-Work-ceX43/result.md
          grep -Fq 'STAGE14_Q20=COMPLETE_CONDITIONED_DIVISOR_CORRELATION_LITERATURE_RADAR' stages/stage14/archive/docs/q-research/stage14-q20-summary.md
      - name: Lock q17 reciprocal CRT baseline
        run: |
          grep -Fq 'RECIPROCAL_CRT_SUPPORT_DIRECT_THEOREM_FOUND=false' stages/stage14/archive/docs/q-research/stage14-q17-summary.md
          grep -Fq 'F_+ + F_- == 0 mod 2U' stages/stage14/archive/docs/q-research/stage14-q17-summary.md
      - name: Lock integrated XQ boundary
        run: |
          grep -Fq 'SECOND_REVERSE_SELF_COUPLED_MODULUS_CANCELLATION_PROVED=true' stages/stage14/14-Work-cfX44/result.md
          grep -Fq 'Q_COMPONENT=NOT_TRIGGERED' stages/stage14/14-Work-cfX44/result.md
          grep -Fq 'Q21_NEEDED=false' stages/stage14/14-Work-cfX44/result.md
          grep -Fq 'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=1/2' stages/stage14/14-Work-cfX44/result.md
      - name: Diff check
        run: git diff --check origin/main...HEAD
