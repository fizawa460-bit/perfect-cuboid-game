name: Stage14-s-batch s7-90..92 primitive ratio window

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-90/**'
      - 'stages/stage14/14-s7-91/**'
      - 'stages/stage14/14-s7-92/**'
      - 'stages/stage14/14-s-batch/s7-90-92-report.md'
      - 'stages/stage14/scripts/14-s-batch/s7_90_92_primitive_ratio_window_audit.py'
      - '.github/workflows/stage14-s-batch-s7-90-92-primitive-ratio-window.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Batch deterministic audit
        run: python stages/stage14/scripts/14-s-batch/s7_90_92_primitive_ratio_window_audit.py

      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/14-s-batch/s7_90_92_primitive_ratio_window_audit.py

      - name: Regress merged s7-87..89
        run: python stages/stage14/scripts/14-s-batch/s7_87_89_normalized_radial_product_audit.py

      - name: Regress merged mainline 4fe..4fg
        run: python stages/stage14/scripts/14-4/batch_4fe_4fg_radial_physical_density_audit.py

      - name: Regress merged Work-brX30
        run: python stages/stage14/scripts/14-Work-brX30/reciprocal_window_adapter_audit.py

      - name: Lock common and s batch contracts
        run: |
          grep -Fq '## Integrated sH work unit' stages/stage14/archive/docs/operations/stage14-s-batch-task-contract.md
          grep -Fq 'BATCH_INTEGRATED_H_UNITS=' stages/stage14/archive/docs/operations/stage14-batch-common-contract.md
          grep -Fq 'unresolved_external_gate' stages/stage14/archive/docs/operations/stage14-batch-common-contract.md

      - name: Lock batch boundary
        run: |
          grep -Fq 'STAGE14_S7_90=COMPLETE_SHARED_SQUAREFREE_AND_COMMON_SQUAREPART_TO_PRIMITIVE_RATIO_NORMAL_FORM' stages/stage14/14-s7-90/result.md
          grep -Fq 'PEELED_TRIPLE_TO_E_U_V_BIJECTION=true' stages/stage14/14-s7-90/result.md
          grep -Fq 'STAGE14_S7_91=COMPLETE_COMMON_DILATION_ELIMINATION_TO_PRIMITIVE_COPRIME_DIVISOR_RATIO_SELECTOR' stages/stage14/14-s7-91/result.md
          grep -Fq 'PHYSICAL_ROOT_WINDOWS_PROJECTED_TO_PRIMITIVE_RATIO=true' stages/stage14/14-s7-91/result.md
          grep -Fq 'STAGE14_S7_92=COMPLETE_RECIPROCAL_ROOT_WINDOWS_TO_SHORT_PRIMITIVE_DIVISOR_RATIO_OCCUPANCY_RECEIVER' stages/stage14/14-s7-92/result.md
          grep -Fq 'PRIMITIVE_RATIO_WINDOW_MULTIPLICATIVE_WIDTH=Bo1' stages/stage14/14-s7-92/result.md
          grep -Fq 'BATCH_SUBSTANTIVE_WORK_UNIT_COUNT=3' stages/stage14/14-s-batch/s7-90-92-report.md
          grep -Fq 'BATCH_INTEGRATED_H_UNITS=NONE' stages/stage14/14-s-batch/s7-90-92-report.md
          grep -Fq 'BATCH_STOP_REASON=receiver_change' stages/stage14/14-s-batch/s7-90-92-report.md
          grep -Fq 'NEXT=Stage14-s7-93' stages/stage14/14-s-batch/s7-90-92-report.md

      - name: Diff check
        run: git diff --check origin/main...HEAD
