name: Stage14 toolbox aq audit

on:
  push:
    paths:
      - 'docs/stage14-toolbox/minimal-common-theorem-envelope.md'
      - 'stages/stage14/14-toolbox-aq/**'
      - '.github/workflows/stage14-toolbox-aq.yml'
  pull_request:
    paths:
      - 'docs/stage14-toolbox/minimal-common-theorem-envelope.md'
      - 'stages/stage14/14-toolbox-aq/**'
      - '.github/workflows/stage14-toolbox-aq.yml'

jobs:
  envelope-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit minimal envelope and receiver guards
        run: python stages/stage14/scripts/14-toolbox-aq/envelope_audit.py
