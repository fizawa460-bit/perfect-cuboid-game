name: Stage14-t77 projective ray character kernel

on:
  pull_request:
    paths:
      - 'stages/stage14/14-t77/**'
      - 'stages/stage14/data/14-t77/**'
      - 'stages/stage14/scripts/14-t/t77_*.py'
      - '.github/workflows/stage14-t77-projective-ray-character.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: predecessor t76 regression
        run: python stages/stage14/scripts/14-t/t76_clean_kappa_cover_rootline_audit.py >/dev/null
      - name: merged tH21 boundary regression
        run: grep -q 'STAGE14_TH21=COMPLETE_BALANCED_CLEAN_KAPPA_CANONICAL_PRIME_PRIMITIVE_COVER_TYPEII_DISPERSION_APPLICABILITY_AUDIT' stages/stage14/14-tH21/result.md
      - name: merged s7-38 global 61/112 ledger regression
        run: grep -Fq 'V(B) << B^(61/112+o(1))' stages/stage14/14-s7-38/result.md
      - name: Stage14-t77 audit
        run: python stages/stage14/scripts/14-t/t77_projective_ray_character_audit.py
      - name: frozen validator if present
        run: |
          if [ -f stages/stage14/scripts/14-t/t77_validate_frozen.py ]; then
            python stages/stage14/scripts/14-t/t77_validate_frozen.py
          fi
      - name: syntax
        run: python -m py_compile stages/stage14/scripts/14-t/t77_*.py
