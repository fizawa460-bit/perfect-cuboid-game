name: Stage14-t16 square-x lift audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-t16/**'
      - 'stages/stage14/scripts/14-t/t16_square_x_lift_audit.py'
      - 'stages/stage14/data/14-t16/square_x_lift_audit.json'
      - 'stages/stage14/t-roadmap.md'
      - '.github/workflows/stage14-t16-square-x-lift.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python stages/stage14/scripts/14-t/t16_square_x_lift_audit.py
      - run: git diff --exit-code stages/stage14/data/14-t16/square_x_lift_audit.json
