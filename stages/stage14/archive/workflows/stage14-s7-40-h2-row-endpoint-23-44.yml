name: Stage14-s7-40 H2 row endpoint 23/44

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-40/**'
      - 'stages/stage14/scripts/14-s7-40/**'
      - '.github/workflows/stage14-s7-40-h2-row-endpoint-23-44.yml'
      - 'stages/stage14/14-4cx/**'
      - 'stages/stage14/14-s7-39/**'
      - 'stages/stage14/14-4cs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage14-s7-40 audit
        run: python stages/stage14/scripts/14-s7-40/h2_row_endpoint_23_44_audit.py

      - name: Compile Stage14-s7-40 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-40/h2_row_endpoint_23_44_audit.py

      - name: Run merged 4cx regression
        run: python stages/stage14/scripts/14-4/cayley_annulus_collapse_23_44_audit.py

      - name: Run merged s7-39 regression
        run: python stages/stage14/scripts/14-s7-39/cayley_residual_disjoint_17_32_audit.py

      - name: Lock quotient/root-gcd predecessor
        run: |
          grep -Fq 'oddpart(gcd(c,d))' stages/stage14/14-4cs/result.md
          grep -Fq 'gcd(J,H)=1' stages/stage14/14-4cx/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=23/44' stages/stage14/14-4cx/result.md

      - name: Lock Stage14-s7-40 theorem boundary
        run: |
          f=stages/stage14/14-s7-40/result.md
          grep -Fq 'STAGE14_S7_40=COMPLETE_CROSS_ROOT_SQUARE_ROW_MODULUS_AND_23_44_ENDPOINT_COLLAPSE' "$f"
          grep -Fq 'COMMON_CROSS_ROOT_SQUARE_DIVIDES_ROW_PRODUCT=true' "$f"
          grep -Fq 'ROW_SPACING_MODULUS_EQUALS_J_TIMES_H2=true' "$f"
          grep -Fq 'ROW_LIFT_TWO_S_SAVING_PROVED=true' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=23/44' "$f"
          grep -Fq 'NEW_WHOLE_FAMILY_POWER_SAVING_PROVED=false' "$f"
          grep -Fq 'OLD_23_44_SATURATION_SEGMENT_COLLAPSED=true' "$f"
          grep -Fq 'TWENTYTHREE_44_SATURATION_POINT_UNIQUE=true' "$f"
          grep -Fq 'TWENTYTHREE_44_SATURATION_THETA=23/88' "$f"
          grep -Fq 'TWENTYTHREE_44_SATURATION_PHI=19/88' "$f"
          grep -Fq 'TWENTYTHREE_44_SATURATION_CROSS_ROOT_EXPONENT=0' "$f"
          grep -Fq 'TWENTYTHREE_44_COLUMN_SHORT_EXPONENT=1/22' "$f"
          grep -Fq 'TWENTYTHREE_44_ROW_SHORT_EXPONENT=1/22' "$f"
          grep -Fq 'TWENTYTHREE_44_U_RESIDUAL_CAP_EXPONENT=1/11' "$f"
          grep -Fq 'S7_40_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-s7-41' "$f"
