name: Stage14-tH2 hyperbola engine

on:
  pull_request:
    paths:
      - 'stages/stage14/14-tH2/**'
      - 'stages/stage14/data/tH2/**'
      - 'stages/stage14/scripts/tH2/**'
      - 'stages/stage14/14-tH1/**'
      - 'stages/stage14/14-t32/**'
      - '.github/workflows/stage14-tH2-hyperbola.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/tH2/hyperbola_engine_audit.py
      - name: Run exact hyperbola audit
        run: python stages/stage14/scripts/tH2/hyperbola_engine_audit.py
      - name: Check locked boundary
        run: |
          grep -F 'STAGE14_TH2=COMPLETE_DIVISOR_COUPLED_GAUSSIAN_NORM_HYPERBOLA_ENGINE' stages/stage14/14-tH2/result.md
          grep -F 'DIVISOR_REPARAMETERIZATION_BIJECTION_PROVED=true' stages/stage14/14-tH2/result.md
          grep -F 'EXACT_BALANCED_HYPERBOLA_IDENTITY_PROVED=true' stages/stage14/14-tH2/result.md
          grep -F 'SHARP_HYPERBOLA_RECTANGULARIZED_WITHOUT_ERROR=false' stages/stage14/14-tH2/result.md
          grep -F 'NORM_INDEX_HYPERBOLIC_CORRELATION_POWER_SAVING_PROVED=false' stages/stage14/14-tH2/result.md
          grep -F 'NEXT=Stage14-tH3' stages/stage14/14-tH2/result.md
