name: Stage14-4cv row-column cofactor 7/12

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4cv/**'
      - 'stages/stage14/data/14-4/row_column_cofactor_7_12_summary.json'
      - 'stages/stage14/scripts/14-4/row_column_cofactor_7_12_audit.py'
      - '.github/workflows/stage14-4cv-row-column-cofactor-7-12.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Stage14-4cv deterministic audit
        run: python stages/stage14/scripts/14-4/row_column_cofactor_7_12_audit.py
      - name: Stage14-4cu regression
        run: python stages/stage14/scripts/14-4/orientation_linear_product_19_32_audit.py
      - name: Stage14-s7-33 theorem boundary regression
        run: python stages/stage14/scripts/14-s7-33/theorem_boundary_audit.py
      - name: Stage14-s7-34 regression
        run: python stages/stage14/scripts/14-s7-34/fourth_power_root_transfer_47_80_audit.py
      - name: Boundary locks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/12' stages/stage14/14-4cv/result.md
          grep -q 'IMPROVEMENT_OVER_MERGED_S7_34_47_80=1/240' stages/stage14/14-4cv/result.md
          grep -q 'SEVEN_TWELFTHS_SATURATION_THETA=7/24' stages/stage14/14-4cv/result.md
          grep -q 'SEVEN_TWELFTHS_SATURATION_JOINT_CORE_EXPONENT=5/24' stages/stage14/14-4cv/result.md
          grep -q 'SEVEN_TWELFTHS_EXTRA_RESIDUAL_GCD_EXPONENT=1/24' stages/stage14/14-4cv/result.md
          grep -q 'STRONG_CANONICAL_ST_SPLIT_USED=false' stages/stage14/14-4cv/result.md
          grep -q 'COMMON_CORE_ORIENTATION_DOUBLE_CHARGED=false' stages/stage14/14-4cv/result.md
          grep -q 'MAINLINE_H_NEEDED=false' stages/stage14/14-4cv/result.md
          grep -q 'NEXT=Stage14-4cw' stages/stage14/14-4cv/result.md
