name: Stage14-4ch eight-cell residual lift

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4ch/**'
      - 'stages/stage14/scripts/14-4/eight_cell_residual_lift_audit.py'
      - 'stages/stage14/data/14-4/eight_cell_residual_lift_summary.json'
      - '.github/workflows/stage14-4ch-eight-cell-residual-lift.yml'
      - 'stages/stage14/14-4cg/**'
      - 'stages/stage14/14-s7-21/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage14-4ch reconstruction audit
        run: python stages/stage14/scripts/14-4/eight_cell_residual_lift_audit.py

      - name: Regress merged 4cg
        run: python stages/stage14/scripts/14-4/coupled_residual_common_core_audit.py

      - name: Regress merged s7-21
        run: python stages/stage14/scripts/14-s7-21/dual_crt_short_vector_audit.py

      - name: Lock predecessor boundaries
        run: |
          grep -Fq 'STAGE14_4CG=COMPLETE_PAIRWISE_RESIDUAL_COLLAPSE_AND_COMMON_CORE_COUPLING' stages/stage14/14-4cg/result.md
          grep -Fq 'PHYSICAL_LIFT_FROM_COMMON_CORE_RESIDUAL_DATA_BO1_PROVED=false' stages/stage14/14-4cg/result.md
          grep -Fq 'STAGE14_S7_21=COMPLETE_PRIMEWISE_ORIENTATION_LINEARIZATION_AND_DUAL_CRT_SHORT_VECTOR_REDUCTION' stages/stage14/14-s7-21/result.md
          grep -Fq 'K_RANK_ONE_FIXES_Z_RATIO=true' stages/stage14/14-s7-21/result.md

      - name: Lock Stage14-4ch theorem boundary
        run: |
          f=stages/stage14/14-4ch/result.md
          grep -Fq 'STAGE14_4CH=COMPLETE_EIGHT_CELL_COMMON_CORE_RESIDUAL_PHYSICAL_LIFT_BOUND' "$f"
          grep -Fq 'FIXED_EIGHT_CELLS_COMMON_CORE_RESIDUAL_PHYSICAL_LIFT_BO1=true' "$f"
          grep -Fq 'RESIDUAL_TRIPLE_ALONE_EXACTLY_DETERMINES_EIGHT_CELLS=false' "$f"
          grep -Fq 'RESIDUAL_TRIPLE_SUPPORT_EXPONENT=5/8' "$f"
          grep -Fq 'COMMON_CORE_RESIDUAL_EIGHT_CELL_MULTIPLICITY_PROVED=false' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/8' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-4ci' "$f"
