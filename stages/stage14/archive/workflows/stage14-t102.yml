name: Stage14-t102 prime mover density energy

on:
  pull_request:
    paths:
      - 'stages/stage14/14-t102/**'
      - '.github/workflows/stage14-t102.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify merged predecessors
        run: |
          grep -q 'STAGE14_T101=COMPLETE_SINGLE_ELEMENTARY_MOVER_PRINCIPAL_CENTERED_SPLIT' stages/stage14/14-t101/result.md
          grep -q 'NEXT_INTERNAL_TARGET=PrimeMoverDensityOrEnergyLemma' stages/stage14/14-Work-bhX20/result.md
          grep -q 'NEXT_H_NEEDED=false' stages/stage14/14-tH27/result.md
          grep -q 'STAGE14_S7_61=COMPLETE_SINGLE_PRIME_TWO_SQUARE_INFLUENCE_RESIDUE_SUPPORT_BOUNDARY' stages/stage14/14-s7-61/result.md

      - name: Run deterministic mover-density audit
        run: python stages/stage14/14-t102/audit.py

      - name: Verify t102 frozen boundary
        run: |
          grep -q 'FIXED_U_PRIME_MOVER_DENSITY_ENERGY_LEMMA_PROVED=true' stages/stage14/14-t102/frozen-boundary.txt
          grep -q 'NORMALIZED_GENERIC_PRIME_MEAN_INFLUENCE_EXPONENT_ZERO=true' stages/stage14/14-t102/frozen-boundary.txt
          grep -q 'GENERIC_MOVER_PRIME_SUPPORT_DENSITY_EXPONENT_ZERO=true' stages/stage14/14-t102/frozen-boundary.txt
          grep -q 'NORMALIZED_MOVER_ENERGY_EXPONENT_ZERO=true' stages/stage14/14-t102/frozen-boundary.txt
          grep -q 'TH28_NEEDED=false' stages/stage14/14-t102/frozen-boundary.txt
          grep -q 'NEXT=Stage14-t103' stages/stage14/14-t102/frozen-boundary.txt
