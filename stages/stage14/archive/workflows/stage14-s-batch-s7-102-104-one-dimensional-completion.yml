name: Stage14-s-batch s7-102..104 one-dimensional completion

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-102/**'
      - 'stages/stage14/14-s7-103/**'
      - 'stages/stage14/14-s7-104/**'
      - 'stages/stage14/14-s-batch/s7-102-104-report.md'
      - 'stages/stage14/scripts/14-s-batch/s7_102_104_one_dimensional_completion_audit.py'
      - '.github/workflows/stage14-s-batch-s7-102-104-one-dimensional-completion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Batch deterministic audit
        run: python stages/stage14/scripts/14-s-batch/s7_102_104_one_dimensional_completion_audit.py

      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/14-s-batch/s7_102_104_one_dimensional_completion_audit.py

      - name: Regress merged s7-99..101
        run: python stages/stage14/scripts/14-s-batch/s7_99_101_outer_existence_split_audit.py

      - name: Regress merged mainline 4fq..4fs
        run: python stages/stage14/scripts/14-4/batch_4fq_4fs_bare_shadow_completion_audit.py

      - name: Regress merged Work-bvX34
        run: python stages/stage14/scripts/14-Work-bvX34/local_theorem_coverage_audit.py

      - name: Lock common and s batch contracts
        run: |
          grep -Fq '## Integrated sH work unit' stages/stage14/archive/docs/operations/stage14-s-batch-task-contract.md
          grep -Fq 'BATCH_INTEGRATED_H_UNITS=' stages/stage14/archive/docs/operations/stage14-batch-common-contract.md
          grep -Fq 'unresolved_external_gate' stages/stage14/archive/docs/operations/stage14-batch-common-contract.md

      - name: Lock batch boundary
        run: |
          grep -Fq 'STAGE14_S7_102=COMPLETE_MERGED_4FS_BVX34_NESTED_SUPPORT_SYNCHRONIZATION' stages/stage14/14-s7-102/result.md
          grep -Fq 'FIXED_E_ENDPOINT_BARE_UNITARY_FIXED_POWER_SAVING=false' stages/stage14/14-s7-103/result.md
          grep -Fq 'KNOWN_SQUAREFREE_KERNEL_MASK_FIXED_POWER_DEFICIT=0' stages/stage14/14-s7-104/result.md
          grep -Fq 'WORK_BVX34_REVISIT_TRIGGER_S7_104_REACHED=true' stages/stage14/14-s7-104/result.md
          grep -Fq 'RECEIVER_MATERIALLY_CHANGED=true' stages/stage14/14-s7-104/result.md
          grep -Fq 'BATCH_SUBSTANTIVE_WORK_UNIT_COUNT=3' stages/stage14/14-s-batch/s7-102-104-report.md
          grep -Fq 'BATCH_INTEGRATED_H_UNITS=NONE' stages/stage14/14-s-batch/s7-102-104-report.md
          grep -Fq 'BATCH_STOP_REASON=receiver_change' stages/stage14/14-s-batch/s7-102-104-report.md
          grep -Fq 'NEXT=Stage14-s7-105' stages/stage14/14-s-batch/s7-102-104-report.md

      - name: Diff check
        run: git diff --check origin/main...HEAD
