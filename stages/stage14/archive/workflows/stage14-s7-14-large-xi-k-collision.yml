name: Stage14-s7-14 large-xi k-collision audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-14/**'
      - 'stages/stage14/scripts/14-s7-14/**'
      - '.github/workflows/stage14-s7-14-large-xi-k-collision.yml'
      - 'stages/stage14/14-s7-13/**'
      - 'stages/stage14/14-s7-10/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regress Stage14-s7-13 full-coordinate 7/8 theorem
        run: python stages/stage14/scripts/14-s7-13/full_coordinate_refinement_audit.py

      - name: Audit Stage14-s7-14 large-xi and transverse-k receiver
        run: python stages/stage14/scripts/14-s7-14/large_xi_k_collision_audit.py

      - name: Lock Stage14-s7-14 theorem boundary
        shell: bash
        run: |
          set -euo pipefail
          f=stages/stage14/14-s7-14/result.md
          grep -F 'STAGE14_S7_14=COMPLETE_LARGE_SHARED_LABEL_SHELL_AND_TRANSVERSE_K_COLLISION_RECEIVER' "$f"
          grep -F 'XI_ONLY_MINIMAX_CRITICAL_EXPONENT=gamma=3/4' "$f"
          grep -F 'XI_ONLY_MINIMAX_BARRIER=7/8' "$f"
          grep -F 'TRANSVERSE_LABEL_K=ker(Q^2-P^2)' "$f"
          grep -F 'GCD_K_XI=1' "$f"
          grep -F 'OFF_DIAGONAL_XI_K_COLLISION_ENERGY_RECEIVER_DEFINED=true' "$f"
          grep -F 'OFF_DIAGONAL_XI_K_COLLISION_POWER_SAVING_PROVED=false' "$f"
          grep -F 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/8' "$f"
          grep -F 'NEW_WHOLE_FAMILY_POWER_SAVING_PROVED=false' "$f"
          grep -F 'NEXT=Stage14-s7-15' "$f"
