name: Stage14-s7-13 full-coordinate 7-8 audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-13/**'
      - 'stages/stage14/scripts/14-s7-13/**'
      - '.github/workflows/stage14-s7-13-full-coordinate-7-8.yml'
      - 'stages/stage14/14-s7-12/**'
      - 'stages/stage14/14-s7-10/**'
      - 'stages/stage14/14-s7-04/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regress Stage14-s7-12 unbalanced receiver
        run: python stages/stage14/scripts/14-s7-12/unbalanced_short_denominator_audit.py

      - name: Audit Stage14-s7-13 full-coordinate refinement
        run: python stages/stage14/scripts/14-s7-13/full_coordinate_refinement_audit.py

      - name: Lock Stage14-s7-13 theorem boundary
        shell: bash
        run: |
          set -euo pipefail
          f=stages/stage14/14-s7-13/result.md
          grep -F 'STAGE14_S7_13=COMPLETE_FULL_COORDINATE_CANONICAL_REFINEMENT_AND_7_8_BOUND' "$f"
          grep -F 'FULL_COORDINATE_DYADIC_REFINEMENT=true' "$f"
          grep -F 'COMMON_REFINEMENT_RECEIVER_IS_MIN_OF_TWO_VALID_BOUNDS=true' "$f"
          grep -F 'FIXED_COORDINATE_AND_TWO_CELL_SAVINGS_MULTIPLIED=false' "$f"
          grep -F 'CRITICAL_SELECTED_COEFFICIENT_EXPONENT=3/8' "$f"
          grep -F 'CRITICAL_NUMERATOR_SQUAREPART_ROOT_EXPONENT=1/16' "$f"
          grep -F 'CRITICAL_DENOMINATOR_SQUAREPART_ROOT_EXPONENT=1/16' "$f"
          grep -F 'CRITICAL_SHARED_LABEL_EXPONENT=3/4' "$f"
          grep -F 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/8' "$f"
          grep -F 'NEW_WHOLE_FAMILY_POWER_SAVING_PROVED=true' "$f"
          grep -F 'SQRT_B_UPPER_BOUND_PROVED=false' "$f"
          grep -F 'NEXT=Stage14-s7-14' "$f"
