name: Stage14-s7-30 two-sided common-core 11/16

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-30/**'
      - 'stages/stage14/scripts/14-s7-30/**'
      - '.github/workflows/stage14-s7-30-two-sided-common-core-11-16.yml'
      - 'stages/stage14/14-s7-29/**'
      - 'stages/stage14/14-s7-28/**'
      - 'stages/stage14/14-4cp/**'
      - 'stages/stage14/14-t68/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run s7-30 two-sided common-core audit
        run: python stages/stage14/scripts/14-s7-30/two_sided_common_core_root_pair_audit.py

      - name: Compile s7-30 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-30/two_sided_common_core_root_pair_audit.py

      - name: Run merged s7-29 regression
        run: python stages/stage14/scripts/14-s7-29/common_core_primitive_root_line_audit.py

      - name: Run merged s7-28 regression
        run: python stages/stage14/scripts/14-s7-28/primitive_ratio_reconstruction_audit.py

      - name: Lock imported boundaries
        run: |
          grep -Fq 'STAGE14_S7_29=COMPLETE_COMMON_CORE_GAUSSIAN_ROOT_LINE_PRIMITIVE_LATTICE_COUNT_AND_3_4_BOUND' stages/stage14/14-s7-29/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=3/4' stages/stage14/14-s7-29/result.md
          grep -Fq 'STAGE14_4CP=COMPLETE_THREE_QUARTER_PROMOTION_SINGULAR_ELIMINATION_AND_QUARTER_PHI_ROOTLINE_REDUCTION' stages/stage14/14-4cp/result.md
          grep -Fq 'THREE_QUARTER_SATURATION_REQUIRES_THETA=5/16' stages/stage14/14-4cp/result.md
          grep -Fq 'THREE_QUARTER_SATURATION_REQUIRES_PHI=1/4' stages/stage14/14-4cp/result.md
          grep -Fq 'SELF_GENERATED_FOUR_ROOT_MODULI_CHARGED_AS_INDEPENDENT_SPACING=false' stages/stage14/14-4cp/result.md
          grep -Fq 'OPPOSITE_AGREEMENT_PRODUCT_RECONSTRUCTED_FROM_PRIMITIVE_X_PAIR=true' stages/stage14/14-s7-28/result.md
          grep -Fq 'TH18_NEEDED=false' stages/stage14/14-t68/result.md

      - name: Lock s7-30 theorem boundary
        run: |
          f=stages/stage14/14-s7-30/result.md
          grep -Fq 'STAGE14_S7_30=COMPLETE_TWO_SIDED_COMMON_CORE_QUADRATIC_ROOT_PAIR_COUNT_AND_11_16_BOUND' "$f"
          grep -Fq 'COMMON_CORE_SCALE_PINNED=true' "$f"
          grep -Fq 'COMMON_CORE_SCALE_EXPONENT=2*theta+2*phi-3/4' "$f"
          grep -Fq 'SECOND_COMMON_CORE_QUADRATIC_CONGRUENCE_PROVED=true' "$f"
          grep -Fq 'NONPRIMITIVE_QUADRATIC_ROOT_PAIR_LEMMA_PROVED=true' "$f"
          grep -Fq 'NONPRIMITIVE_QUADRATIC_ROOT_PAIR_BOUND=M^(1/2)+M/C' "$f"
          grep -Fq 'OPPOSITE_SIGNED_QUOTIENTS_COUNTED_WITHOUT_FIXING_VRES=true' "$f"
          grep -Fq 'DYADIC_TWO_SIDED_BLOCK_EXPONENT=max(theta+phi+1/8,1-2*theta)' "$f"
          grep -Fq 'TWO_SIDED_COMMON_CORE_STRIP_UPPER_BOUND_EXPONENT=11/16' "$f"
          grep -Fq 'ELEVEN_SIXTEENTHS_SATURATION_REQUIRES_THETA=5/16' "$f"
          grep -Fq 'ELEVEN_SIXTEENTHS_SATURATION_REQUIRES_PHI=1/4' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=11/16' "$f"
          grep -Fq 'IMPROVEMENT_OVER_3_4=1/16' "$f"
          grep -Fq 'OPPOSITE_QUOTIENT_COMMON_GCD_ODDPART_DIVIDES_XY=true' "$f"
          grep -Fq 'S7_30_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'REMAINING_RECEIVER=TopCornerOppositeSignedQuotientCommonGcdRootProductIncidence' "$f"
          grep -Fq 'NEXT=Stage14-s7-31' "$f"
