name: Stage14-toolbox-al proof recipe cookbook audit

on:
  pull_request:
    paths:
      - 'docs/stage14-toolbox/**'
      - 'stages/stage14/14-toolbox-al/**'
      - 'stages/stage14/scripts/14-toolbox-al/**'
      - 'stages/stage14/scripts/14-toolbox-ak/**'
      - '.github/workflows/stage14-toolbox-al.yml'
      - '.github/workflows/stage14-toolbox-ak.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen toolbox-al interface regression
        run: python stages/stage14/scripts/14-toolbox-al/forward_regression.py
      - name: Compile toolbox audits
        run: |
          python -m py_compile stages/stage14/scripts/14-toolbox-al/proof_recipe_cookbook_audit.py
          python -m py_compile stages/stage14/scripts/14-toolbox-al/forward_regression.py
          python -m py_compile stages/stage14/scripts/14-toolbox-ak/forward_regression.py
      - name: Regress frozen toolbox-ak interface
        run: python stages/stage14/scripts/14-toolbox-ak/forward_regression.py
      - name: Regress proved s7-08 bound
        run: python stages/stage14/scripts/14-s7-08/shared_xi_cell_switch_audit.py
      - name: Regress main 4bw independent rederivation
        run: python stages/stage14/scripts/14-4/shared_xi_cell_sieve_audit.py
      - name: Regress historical s7-09 gate
        run: python stages/stage14/scripts/14-s7-09/adjacent_two_cell_mixed_gate_audit.py
      - name: Regress historical 4bx thick reoptimization
        run: python stages/stage14/scripts/14-4/thick_sieve_reoptimization_audit.py
      - name: Validate immutable toolbox-al boundary
        run: |
          grep -q 'STAGE14_TOOLBOX_AL=COMPLETE_PROOF_RECIPE_COOKBOOK_AND_RECEIVER_CHECKLISTS' stages/stage14/14-toolbox-al/result.md
          grep -q 'CANONICAL_TOTAL_CARD_COUNT=87' stages/stage14/14-toolbox-al/result.md
          grep -q 'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=15/16' stages/stage14/14-toolbox-al/result.md
          grep -q 'UPDATED_TWO_CELL_CONDITIONAL_TARGET=13/14' stages/stage14/14-toolbox-al/result.md
          grep -q 'NEXT=Stage14-toolbox-am external theorem hypothesis contract and import checklist' stages/stage14/14-toolbox-al/result.md
