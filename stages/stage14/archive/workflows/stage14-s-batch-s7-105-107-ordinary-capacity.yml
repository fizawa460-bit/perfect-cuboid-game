name: Stage14-s-batch s7-105..107 ordinary capacity

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-105/**'
      - 'stages/stage14/14-s7-106/**'
      - 'stages/stage14/14-s7-107/**'
      - 'stages/stage14/14-s-batch/s7-105-107-report.md'
      - 'stages/stage14/scripts/14-s-batch/s7_105_107_ordinary_capacity_audit.py'
      - '.github/workflows/stage14-s-batch-s7-105-107-ordinary-capacity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Batch deterministic audit
        run: python stages/stage14/scripts/14-s-batch/s7_105_107_ordinary_capacity_audit.py

      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/14-s-batch/s7_105_107_ordinary_capacity_audit.py

      - name: Regress merged s7-102..104
        run: python stages/stage14/scripts/14-s-batch/s7_102_104_one_dimensional_completion_audit.py

      - name: Regress merged mainline 4ft..4fv
        run: python stages/stage14/scripts/14-4/batch_4ft_4fv_fixed_e_shadow_split_audit.py

      - name: Regress merged Work-bwX35
        run: python stages/stage14/scripts/14-Work-bwX35/absolute_capacity_localization_audit.py

      - name: Lock q15 width handoff
        run: |
          grep -Fq 'Q15_LOCALIZED_DIVISOR_WIDTH_COMPATIBILITY_TEST' stages/stage14/archive/docs/q-research/stage14-q15-summary.md
          grep -Fq 'UNITARY_TO_ORDINARY_LOCALIZED_SHADOW_BOUNDED_DISTORTION=false' stages/stage14/archive/docs/q-research/stage14-q15-summary.md

      - name: Lock common and s batch contracts
        run: |
          grep -Fq '## Integrated sH work unit' stages/stage14/archive/docs/operations/stage14-s-batch-task-contract.md
          grep -Fq 'BATCH_INTEGRATED_H_UNITS=' stages/stage14/archive/docs/operations/stage14-batch-common-contract.md
          grep -Fq 'unresolved_external_gate' stages/stage14/archive/docs/operations/stage14-batch-common-contract.md

      - name: Lock batch boundary
        run: |
          grep -Fq 'STAGE14_S7_105=COMPLETE_MERGED_FIXED_E_ORDINARY_DIVISOR_ABSOLUTE_CAPACITY_SUPERSESSION' stages/stage14/14-s7-105/result.md
          grep -Fq 'STAGE14_S7_106=COMPLETE_FIXED_PRODUCT_E_LOCAL_PROVENANCE_AUDIT_AND_SINGLE_COMPLETION_BOOLEAN_REDUCTION' stages/stage14/14-s7-106/result.md
          grep -Fq 'STAGE14_S7_107=COMPLETE_POLYNOMIAL_OUTER_PAIR_ORDINARY_DIVISOR_ABSOLUTE_CAPACITY_ENVELOPE_AND_RECEIVER_CHANGE' stages/stage14/14-s7-107/result.md
          grep -Fq 'POLYNOMIAL_PAIR_UNITARY_TO_ORDINARY_POINTWISE_ENVELOPE_PROVED=true' stages/stage14/14-s7-107/result.md
          grep -Fq 'BATCH_SUBSTANTIVE_WORK_UNIT_COUNT=3' stages/stage14/14-s-batch/s7-105-107-report.md
          grep -Fq 'BATCH_INTEGRATED_H_UNITS=NONE' stages/stage14/14-s-batch/s7-105-107-report.md
          grep -Fq 'BATCH_STOP_REASON=receiver_change' stages/stage14/14-s-batch/s7-105-107-report.md
          grep -Fq 'NEXT=Stage14-s7-108' stages/stage14/14-s-batch/s7-105-107-report.md

      - name: Diff check
        run: git diff --check origin/main...HEAD
