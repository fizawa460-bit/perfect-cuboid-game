name: Stage14-t57 rank-one Kummer Mellin adapter

on:
  pull_request:
    paths:
      - 'stages/stage14/14-t57/**'
      - 'stages/stage14/scripts/14-t/t57_rank1_kummer_mellin_audit.py'
      - 'stages/stage14/scripts/14-t/t57_validate_frozen.py'
      - 'stages/stage14/data/14-t57/**'
      - '.github/workflows/stage14-t57-rank1-kummer-mellin.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run t56 predecessor regression
        run: python stages/stage14/scripts/14-t/t56_centered_selector_subd_bridge_audit.py
      - name: Run t57 rank-one Kummer/Mellin audit
        run: python stages/stage14/scripts/14-t/t57_rank1_kummer_mellin_audit.py
      - name: Validate frozen t57 boundary
        run: python stages/stage14/scripts/14-t/t57_validate_frozen.py
