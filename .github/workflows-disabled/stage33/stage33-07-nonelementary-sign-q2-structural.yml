name: Stage33-07 non-elementary sign target-Q2 structure

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/certify_nonelementary_sign_q2_structural_reduction.py'
      - 'stages/stage33/33-07/certify_nonelementary_target_q4_rank_obstruction.py'
      - 'stages/stage33/33-07/certify_nonelementary_target_q8_exponent_reduction.py'
      - 'stages/stage33/33-07/certify_nonelementary_k3_q8_skeleton_orbits.py'
      - 'stages/stage33/33-07/certify_nonelementary_k3_lift_section_orbits.py'
      - 'stages/stage33/33-07/certify_nonelementary_k3_integral_cc_ct_orbits.py'
      - 'stages/stage33/33-07/certify_nonelementary_exact_quotient_action_witnesses.py'
      - 'stages/stage33/33-07/certify_nonelementary_k1_full_q_isometry_z3.py'
      - 'stages/stage33/33-07/coordinate-k3-scaled-action-choices-retained.json'
      - 'stages/stage33/33-07/picard_coordinate_sign_rows_retained.py'
      - 'stages/stage33/33-07/picard-discriminant-compact.json'
      - 'stages/stage33/33-07/index512-abstract-glue-types-lr-retained.json'
      - '.github/workflows/stage33-07-nonelementary-sign-q2-structural.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: stages/stage33/33-07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact finite dependencies
        run: python -m pip install --disable-pip-version-check sympy==1.14.0 z3-solver==4.15.3.0
      - name: Exact E7 structural census
        run: python certify_nonelementary_sign_q2_structural_reduction.py
      - name: Exact target-Q4 rank obstruction
        run: python certify_nonelementary_target_q4_rank_obstruction.py
      - name: Exact target-Q8 exponent obstruction
        run: python certify_nonelementary_target_q8_exponent_reduction.py
      - name: Exact k3 Q8 skeleton orbit reduction
        run: python certify_nonelementary_k3_q8_skeleton_orbits.py
      - name: Exact k3 affine lift-section orbit reduction
        run: python certify_nonelementary_k3_lift_section_orbits.py
      - name: Exact k3 integral cc ct affine filter and Burnside reduction
        run: python certify_nonelementary_k3_integral_cc_ct_orbits.py
      - name: Exact quotient and action-stability witnesses
        run: python certify_nonelementary_exact_quotient_action_witnesses.py
      - name: Exact full finite-q decision for the surviving k1 witness
        run: python certify_nonelementary_k1_full_q_isometry_z3.py
      - name: Enforce conservative firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('nonelementary-sign-target-q2-structural-reduction.json'))
          y=json.load(open('nonelementary-target-q4-rank-obstruction.json'))
          z=json.load(open('nonelementary-target-q8-exponent-reduction.json'))
          s=json.load(open('nonelementary-k3-q8-skeleton-orbits.json'))
          l=json.load(open('nonelementary-k3-lift-section-orbits.json'))
          a=json.load(open('nonelementary-k3-integral-cc-ct-orbits.json'))
          w=json.load(open('nonelementary-exact-quotient-action-witnesses.json'))
          q=json.load(open('nonelementary-k1-full-q-isometry.json'))
          assert x['target_quotient_Q2_log2']==14
          assert x['forced_reduced_code']=='E7 even-weight code in F2^7'
          assert x['summary_by_number_of_Z4_factors']['1']['P_after_support_filter']==63
          assert x['summary_by_number_of_Z4_factors']['2']['P_after_support_filter']==651
          assert x['summary_by_number_of_Z4_factors']['3']['P_after_support_filter']==805
          assert x['summary_by_number_of_Z4_factors']['4']['P_after_support_filter']==21
          assert x['summary_by_number_of_Z4_factors']['4']['P_with_consistent_lift_pairing']==6
          assert x['total_structural_H_after_sign_and_target_Q2']==101478817840448
          assert y['target_Q4_log2']==24 and y['Kb_X_rank_t_upper_bound']==2
          assert y['non_elementary_abstract_types_before']==4 and y['non_elementary_abstract_types_after']==3
          assert y['summary_by_number_of_Z4_factors']['4']['structural_H_after_t_le_2']==0
          assert z['total_structural_H_after_Q4_rank_and_Q8_exponent']==1838020348224
          assert z['summary_by_number_of_Z4_factors']['1']['structural_H_after_t_le_2_and_Q8_exponent']==1375727569216
          assert z['summary_by_number_of_Z4_factors']['2']['structural_H_after_t_le_2_and_Q8_exponent']==437454110720
          assert z['summary_by_number_of_Z4_factors']['3']['structural_H_after_t_le_2_and_Q8_exponent']==24838668288
          assert z['summary_by_number_of_Z4_factors']['4']['structural_H_after_t_le_2_and_Q8_exponent']==0
          assert s['exact_P_W_skeleton_count']==7236
          assert s['lift_section_affine_fibre_size_by_t']=={'1':4194304,'2':2097152}
          assert s['structural_H_count_reconstructed']==24838668288
          assert s['forced_cc_mod2_compatible_skeleton_count']==2628
          assert s['forced_cc_mod2_compatible_profile_by_t']=={'1':1152,'2':1476}
          assert s['forced_cc_mod2_rejected_skeleton_count']==4608
          assert s['forced_cc_mod2_rejected_profile_by_t']=={'1':3456,'2':1152}
          assert s['structural_H_count_after_forced_cc_mod2']==7927234560
          assert s['structural_H_rejected_by_forced_cc_mod2']==16911433728
          assert s['symmetry_order']==288 and s['symmetry_preserves_ambient_q_and_source_species']
          assert s['exact_orbit_count']==189
          assert s['orbit_size_histogram']=={'3':3,'9':101,'18':75,'36':10}
          assert s['orbit_size_sum']==2628
          assert len(s['orbit_representatives'])==189
          assert s['canonical_sha256']=='d01faf0f252da478f2ec36d02027b7db4bd74b6bcf6e93a3b5f12169460b3505'
          assert not s['surviving_lift_sections_quotiented_or_rejected']
          assert l['source_skeleton_orbit_count']==189
          assert l['source_cc_compatible_skeleton_count']==2628
          assert l['source_structural_H_count']==7927234560
          assert l['affine_lift_coordinate_count']==24
          assert l['binary_carry_included_in_stabilizer_action']
          assert l['fixed_sets_counted_by_exact_F2_elimination'] and l['burnside_exact']
          assert l['stabilizer_order_histogram']=={'8':10,'16':75,'32':101,'96':3}
          assert l['solution_dimension_histogram']=={'21':117,'22':72}
          assert l['structural_H_count_reconstructed']==7927234560
          assert l['exact_full_symmetry_orbit_count']==98680896
          assert len(l['skeleton_orbit_records'])==189
          assert l['canonical_sha256']=='19c37c310ab6a5494817be64ef860e135c8314273ff3f0e1f61dad0db7165fdb'
          assert a['source_affine_lift_orbits_sha256']==l['canonical_sha256']
          assert a['predecessor_exact_skeleton_count']==2628
          assert a['predecessor_exact_skeleton_orbit_count']==189
          assert a['predecessor_structural_H_count']==7927234560
          assert a['predecessor_structural_H_count_reconstructed']==7927234560
          assert a['integral_symmetry_order']==288
          assert a['retained_action_sets_closed_under_full_symmetry']
          assert a['raw_global_cc_action_choice_count']==1024
          assert a['raw_global_ct_action_choice_count']==128
          assert a['distinct_normalized_global_cc_action_count']==8
          assert a['distinct_normalized_global_ct_action_count']==1
          assert a['raw_multiplicity_per_normalized_cc_action']==128
          assert a['raw_multiplicity_per_normalized_ct_action']==128
          assert a['all_cc_choices_checked_on_every_skeleton_orbit']
          assert a['all_ct_choices_checked_on_every_skeleton_orbit']
          assert a['cc_stability_locus_count_per_skeleton_orbit']==1
          assert a['ct_stability_locus_equals_predecessor_fibre_for_every_orbit']
          assert a['integral_cc_ct_lift_dimension_histogram_over_skeleton_orbits']=={'16':66,'18':111,'19':6,'21':6}
          assert a['integral_cc_ct_lift_dimension_histogram_over_all_skeletons']=={'16':1080,'18':1434,'19':72,'21':42}
          assert a['structural_H_count_after_integral_cc_ct']==572522496
          assert a['structural_H_rejected_by_integral_cc']==7354712064
          assert a['exact_full_symmetry_orbit_count_after_integral_cc_ct']==17146944
          assert a['identity_full_fibre_firewall_checked_for_every_orbit'] and a['burnside_exact']
          assert a['direct_order512_isotropic_action_stable_witness_checked_for_every_skeleton_orbit']
          assert not a['fast_or_heuristic_traversal_used']
          assert not a['canonical_augmentation_completeness_claimed']
          assert len(a['skeleton_orbit_records'])==189
          assert a['canonical_sha256']=='c18334f94a9b71fc611b7bfdc3c0291125aee09a67ce7267882ae62713847b1b'
          assert w['exact_witness_type_count']==2
          assert w['exact_witness_types']==['k1_Z4_plus_Z2_7','k2_Z4_2_plus_Z2_5']
          assert all(r['quotient_invariant_factors']==[2]*4+[4]*6+[8]*4 for r in w['records'].values())
          assert all(all(r['action_stability'].values()) for r in w['records'].values())
          assert w['records']['k1_Z4_plus_Z2_7']['Q2_profile_matches_endpoint']
          assert not w['records']['k2_Z4_2_plus_Z2_5']['Q2_profile_matches_endpoint']
          assert not w['records']['k1_Z4_plus_Z2_7']['twoQ_profile_matches_endpoint']
          assert not w['records']['k2_Z4_2_plus_Z2_5']['twoQ_profile_matches_endpoint']
          assert all(r['fourQ_profile_matches_endpoint'] for r in w['records'].values())
          assert w['specific_k2_witness_rejected_by_Q2_value_profile']
          assert w['specific_k1_witness_rejected_by_2Q_value_profile']
          assert w['both_explicit_witnesses_rejected_by_q_filtration']
          assert q['solver_result']=='UNSAT'
          assert q['specific_witness_rejected']
          assert q['independent_2Q_profile_rejection_source_locked']
          assert not q['abstract_k1_type_rejected']
          assert not x['endpoint_finite_q_certified'] and not y['endpoint_finite_q_certified'] and not z['endpoint_finite_q_certified']
          assert not s['endpoint_finite_q_certified'] and not s['endpoint_full_action_conjugacy_certified']
          assert not l['full_Q4_condition_certified'] and not l['endpoint_finite_q_certified'] and not l['endpoint_full_action_conjugacy_certified']
          assert not a['full_Q4_condition_certified'] and not a['endpoint_finite_q_certified'] and not a['endpoint_full_action_conjugacy_certified']
          assert not w['endpoint_finite_q_certified'] and not w['endpoint_full_action_conjugacy_certified']
          assert not q['full_finite_quadratic_form_isometry_certified_for_this_witness'] and not q['endpoint_full_action_conjugacy_certified']
          assert not x['actual_index512_glue_identified'] and not y['actual_index512_glue_identified'] and not z['actual_index512_glue_identified']
          assert not s['actual_index512_glue_identified'] and not s['arithmetic_HS_closed']
          assert not l['actual_index512_glue_identified'] and not l['arithmetic_HS_closed']
          assert not a['actual_index512_glue_identified'] and not a['arithmetic_HS_closed']
          assert not w['actual_index512_glue_identified'] and not w['arithmetic_HS_closed']
          assert not q['actual_index512_glue_identified'] and not q['arithmetic_HS_closed']
          assert x['stage33_progress']=='6/11' and y['stage33_progress']=='6/11' and z['stage33_progress']=='6/11' and w['stage33_progress']=='6/11' and q['stage33_progress']=='6/11'
          assert s['stage33_progress']=='6/11' and not s['stage33_08_released'] and not s['stage33_09_released']
          assert l['stage33_progress']=='6/11' and not l['stage33_08_released'] and not l['stage33_09_released']
          assert a['stage33_progress']=='6/11' and not a['stage33_08_released'] and not a['stage33_09_released']
          print('NONELEMENTARY_SIGN_TARGET_Q2_STRUCTURAL_REDUCTION=PASS_EXACT')
          print('NONELEMENTARY_TARGET_Q4_RANK_OBSTRUCTION=PASS_EXACT')
          print('NONELEMENTARY_TARGET_Q8_EXPONENT_REDUCTION=PASS_EXACT')
          print('E7_STRUCTURAL_H_TOTAL='+str(x['total_structural_H_after_sign_and_target_Q2']))
          print('NON_ELEMENTARY_TYPES_AFTER_Q4_RANK=3')
          print('NON_ELEMENTARY_STRUCTURAL_H_AFTER_Q4_Q8=1838020348224')
          print('NON_ELEMENTARY_K3_Q8_SKELETONS=7236')
          print('NON_ELEMENTARY_K3_CC_MOD2_SKELETONS=2628')
          print('NON_ELEMENTARY_K3_CC_MOD2_STRUCTURAL_H=7927234560')
          print('NON_ELEMENTARY_K3_CC_MOD2_SKELETON_ORBITS=189')
          print('NON_ELEMENTARY_K3_AFFINE_FULL_SYMMETRY_ORBITS=98680896')
          print('NON_ELEMENTARY_K3_INTEGRAL_CC_CT_STRUCTURAL_H=572522496')
          print('NON_ELEMENTARY_K3_INTEGRAL_CC_CT_FULL_SYMMETRY_ORBITS=17146944')
          print('NON_ELEMENTARY_EXACT_QUOTIENT_ACTION_WITNESS_TYPES=2')
          print('NON_ELEMENTARY_EXPLICIT_WITNESSES_REJECTED_BY_Q_FILTRATION=2')
          print('NON_ELEMENTARY_K1_EXPLICIT_WITNESS_FULL_Q=UNSAT_EXACT')
