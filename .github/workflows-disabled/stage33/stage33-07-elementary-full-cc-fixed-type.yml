name: Stage33-07 elementary full cc fixed type

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/**'
      - '.github/workflows/stage33-07-elementary-full-cc-fixed-type.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elementary-full-cc-fixed-type:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: stages/stage33/33-07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact integer algebra dependency
        run: python -m pip install --disable-pip-version-check --no-input sympy==1.14.0
      - name: Materialize H0 regression prerequisite
        run: python certify_elementary_index512_glue_candidate.py
      - name: Recompute structural reduction prerequisite
        run: python certify_elementary_index512_structural_reduction.py
      - name: Recompute complete ct fixed-type prerequisite
        run: python certify_elementary_index512_full_ct_fixed_type_reduction.py
      - name: Recompute forced V4 commutator prerequisite
        run: python certify_elementary_index512_forced_commutator_reduction.py
      - name: Certify full cc fixed-subgroup reduction
        run: python certify_elementary_index512_full_cc_fixed_type_reduction.py
      - name: Enforce conservative Stage33-07 firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('elementary-index512-full-cc-fixed-type-reduction.json'))
          assert x['before_full_cc']==161792
          assert x['local_total_and_k4_relations_extension_independent_exact']
          assert x['full_cc_signature_census']=={'10,14,16':102912,'10,15,16':40704,'10,15,18':17024,'10,16,18':1152}
          assert x['b1_target_survivors']==0
          assert x['b2_target_survivors']==17024
          assert x['elementary_candidates_after_full_cc_fixed_type_total']==17024
          assert not x['all_elementary_order512_glue_rejected']
          assert not x['actual_index512_glue_identified']
          assert not x['simultaneous_endpoint_cc_ct_action_conjugacy_certified']
          assert x['unit_status']=='RUNNING_REPAIR'
          assert x['stage33_progress']=='6/11'
          assert not x['stage33_08_released']
          assert not x['theorem_credit']
          assert not x['endpoint_credit']
          print('ELEMENTARY_INDEX512_FULL_CC_FIXED_TYPE_REDUCTION=PASS_EXACT')
          print('SURVIVOR_CENSUS=17024')
          print('STAGE33_08_RELEASED=False')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-elementary-full-cc-fixed-type
          path: stages/stage33/33-07/elementary-index512-full-cc-fixed-type-reduction.json
          retention-days: 5
