name: Stage33-07 elementary q256 materialization

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/**'
      - '.github/workflows/stage33-07-elementary-q256-materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q256-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: stages/stage33/33-07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact integer algebra dependency
        run: python -m pip install --disable-pip-version-check --no-input sympy==1.14.0
      - name: Materialize exact q256 survivor set
        run: python materialize_elementary_index512_q256_survivors.py
      - name: Enforce conservative firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('elementary-index512-q256-survivors.json'))
          assert x['candidate_count']==256
          assert len(x['records'])==256
          assert len({tuple(r['H_basis_bits']) for r in x['records']})==256
          assert not x['actual_index512_glue_identified']
          assert not x['full_finite_quadratic_form_isometry_certified_for_all']
          assert not x['simultaneous_endpoint_cc_ct_action_conjugacy_certified']
          assert x['stage33_progress']=='6/11'
          assert not x['stage33_08_released']
          print('ELEMENTARY_INDEX512_Q256_MATERIALIZATION=PASS_EXACT')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-elementary-q256-survivors
          path: stages/stage33/33-07/elementary-index512-q256-survivors.json
          retention-days: 5
