name: Stage32-17 e20/a0 exact tier <=114186

on:
  pull_request:
    paths:
      - 'stages/stage32/32-17/build_e20_tier114186_plan.py'
      - 'stages/stage32/32-17/run_e20_work_bundle.py'
      - 'stages/stage32/32-17/aggregate_e20_tier114186.py'
      - 'stages/stage32/32-17/check_actions_storage_gate.py'
      - 'stages/stage32/32-17/verify_predecessor_neighbor_regression.py'
      - '.github/workflows/stage32-17-e20-tier114186.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-17-e20-tier114186-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  change_gate:
    name: decide whether this revision changes exact execution sources
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.delta.outputs.run_heavy }}
    steps:
      - id: delta
        uses: actions/github-script@v7
        with:
          script: |
            const exactSources = new Set([
              'stages/stage32/32-17/build_e20_tier114186_plan.py',
              'stages/stage32/32-17/run_e20_work_bundle.py',
              'stages/stage32/32-17/aggregate_e20_tier114186.py',
              'stages/stage32/32-17/check_actions_storage_gate.py',
              'stages/stage32/32-17/verify_predecessor_neighbor_regression.py'
            ]);
            if (context.eventName !== 'pull_request' || context.payload.action !== 'synchronize') {
              core.setOutput('run_heavy', 'true');
              return;
            }
            const before = context.payload.before;
            const after = context.payload.after;
            if (!before || !after) {
              core.setOutput('run_heavy', 'true');
              return;
            }
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${before}...${after}`,
              per_page: 100
            });
            const files = comparison.data.files || [];
            if (files.length >= 300) {
              core.setOutput('run_heavy', 'true');
              return;
            }
            const changed = files.map(f => f.filename).sort();
            const runHeavy = changed.some(path => exactSources.has(path));
            core.setOutput('run_heavy', runHeavy ? 'true' : 'false');
            await core.summary.addRaw(`run_heavy=${runHeavy}\nchanged=${JSON.stringify(changed)}\n`).write();

  plan:
    name: lock audited <=65536 predecessor and build pre-plateau plan
    needs: change_gate
    if: needs.change_gate.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      wave0_matrix: ${{ steps.plan.outputs.wave0_matrix }}
      wave1_matrix: ${{ steps.plan.outputs.wave1_matrix }}
      wave2_matrix: ${{ steps.plan.outputs.wave2_matrix }}
      wave3_matrix: ${{ steps.plan.outputs.wave3_matrix }}
      pilot_bundle_id: ${{ steps.plan.outputs.pilot_bundle_id }}
      plan_sha: ${{ steps.plan.outputs.plan_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Compile Stage32-17 exact sources
        run: |
          python -m py_compile \
            stages/stage32/32-17/build_e20_tier114186_plan.py \
            stages/stage32/32-17/run_e20_work_bundle.py \
            stages/stage32/32-17/aggregate_e20_tier114186.py \
            stages/stage32/32-17/check_actions_storage_gate.py \
            stages/stage32/32-17/verify_predecessor_neighbor_regression.py
      - name: Download source-locked profile and hostile-audited predecessor
        run: |
          mkdir -p "$RUNNER_TEMP/profile" "$RUNNER_TEMP/prev" "$RUNNER_TEMP/out"
          gh run download 32725113188 --repo fizawa460-bit/perfect-cuboid-game \
            --name stage32-14-e20-profile-plan --dir "$RUNNER_TEMP/profile"
          gh run download 32733420941 --repo fizawa460-bit/perfect-cuboid-game \
            --name stage32-16-e20-a0-le65536-exact-tier --dir "$RUNNER_TEMP/prev"
      - id: plan
        name: Build deterministic dynamic shards and LPT bundles
        run: |
          python stages/stage32/32-17/build_e20_tier114186_plan.py \
            --profile "$RUNNER_TEMP/profile/e20-profile.json" \
            --predecessor "$RUNNER_TEMP/prev/e20-tier65536.json" \
            --output "$RUNNER_TEMP/out/e20-tier114186-plan.json" \
            --github-output "$GITHUB_OUTPUT"
      - name: Enforce exact pre-plateau envelope
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'out/e20-tier114186-plan.json').read_text())
          assert p['delta_cell_count']==116 and p['delta_branch_count']==9890148
          assert p['cumulative_cell_count']==417 and p['cumulative_branch_count']==16724262
          assert p['next_profile_wall']['branch_count']==115712
          assert p['next_profile_wall']['cell_multiplicity']==128
          x=p['execution_architecture']
          assert x['work_item_count']==364 and x['bundle_count']==80
          assert x['bounded_wave_count']==4 and x['max_parallel_bundles']==8
          assert x['bundle_expected_branch_minimum']==109826
          assert x['bundle_expected_branch_maximum']==134565
          assert x['stage32_16_runner_reused_without_solver_semantic_change'] is True
          s=p['storage_safety']
          assert s['hard_compact_storage_upper_bound_bytes']==7280000
          assert s['raw_items_retained_after_post_verification_compaction'] is False
          assert [w['bundle_count'] for w in p['bounded_waves']]==[20,20,20,20]
          PY
      - name: Inventory retained artifacts and gate incremental storage
        run: |
          gh api --paginate --slurp \
            "repos/fizawa460-bit/perfect-cuboid-game/actions/artifacts?per_page=100" \
            > "$RUNNER_TEMP/out/retained-artifact-inventory.json"
          python stages/stage32/32-17/check_actions_storage_gate.py \
            --inventory "$RUNNER_TEMP/out/retained-artifact-inventory.json" \
            --output "$RUNNER_TEMP/out/incremental-storage-gate.json" --enforce
      - name: Enforce 27.28 MB conservative new-run bound
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'out/incremental-storage-gate.json').read_text())
          assert p['historical_retained_inventory_is_background_only'] is True
          assert p['new_run_worst_case']['total_bytes']==27280000
          assert p['new_run_worst_case']['below_100mb_fallback_requirement'] is True
          assert p['new_run_worst_case']['does_not_depend_on_deletion'] is True
          assert p['safe_to_launch_pilot_or_fanout'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-17-e20-tier114186-plan
          path: |
            ${{ runner.temp }}/out/e20-tier114186-plan.json
            ${{ runner.temp }}/out/incremental-storage-gate.json
          retention-days: 7
          if-no-files-found: error

  pilot:
    name: representative maximum-load exact bundle and predecessor regression
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      safe_to_fanout: ${{ steps.gate.outputs.safe_to_fanout }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install pinned exact dependencies
        run: |
          pip install -r stages/stage32/32-05/requirements.txt
          pip install -r stages/stage32/32-03/requirements.txt
      - name: Download source-locked core and plan
        run: |
          mkdir -p "$RUNNER_TEMP/core" "$RUNNER_TEMP/plan" "$RUNNER_TEMP/out" "$RUNNER_TEMP/regression"
          gh run download 32624596141 --repo fizawa460-bit/perfect-cuboid-game \
            --name stage32-01-low-degree-verified-prefix --dir "$RUNNER_TEMP/core"
      - uses: actions/download-artifact@v4
        with:
          name: stage32-17-e20-tier114186-plan
          path: ${{ runner.temp }}/plan
      - name: Re-derive exact 140-form caps
        run: |
          python stages/stage32/32-05/derive_intersection_caps.py \
            --core "$RUNNER_TEMP/core/picard-core.json" \
            --output "$RUNNER_TEMP/caps.json"
      - name: Execute maximum-load exact pilot bundle
        run: |
          python stages/stage32/32-17/run_e20_work_bundle.py \
            --core "$RUNNER_TEMP/core/picard-core.json" \
            --cap-certificate "$RUNNER_TEMP/caps.json" \
            --plan "$RUNNER_TEMP/plan/e20-tier114186-plan.json" \
            --bundle-id "${{ needs.plan.outputs.pilot_bundle_id }}" \
            --output-dir "$RUNNER_TEMP/out" \
            --node-limit-per-branch 1000000 \
            --max-raw-bytes 1000000000 --max-compact-bytes 20000
      - name: Recompute one audited <=65536 predecessor shard
        run: |
          python stages/stage32/32-17/run_e20_work_bundle.py \
            --core "$RUNNER_TEMP/core/picard-core.json" \
            --cap-certificate "$RUNNER_TEMP/caps.json" \
            --plan "$RUNNER_TEMP/plan/e20-tier114186-plan.json" \
            --bundle-id predecessor-regression-cell48-s0of2 \
            --output-dir "$RUNNER_TEMP/regression" \
            --node-limit-per-branch 1000000 \
            --max-raw-bytes 1000000000 --max-compact-bytes 20000
          python stages/stage32/32-17/verify_predecessor_neighbor_regression.py \
            --plan "$RUNNER_TEMP/plan/e20-tier114186-plan.json" \
            --compact "$RUNNER_TEMP/regression/cell0048-s0of2-compact.json" \
            --output "$RUNNER_TEMP/regression/regression-result.json"
      - id: gate
        name: Verify pilot exactness and observed storage envelope
        run: |
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          assert not list(root.glob('*-raw.json'))
          receipt=json.loads((root/'bundle-receipt.json').read_text())
          assert receipt['all_items_complete'] is True
          assert receipt['unknown_branch_count']==0
          assert receipt['executed_branches']==receipt['planned_expected_branches']==134565
          assert receipt['runtime']['maximum_runner_local_raw_bytes']<=1000000000
          compacts=list(root.glob('*-compact.json'))
          assert len(compacts)==receipt['item_count']==5
          assert max(p.stat().st_size for p in compacts)<=20000
          PY
          echo "safe_to_fanout=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-17b-e20-${{ needs.plan.outputs.pilot_bundle_id }}
          path: ${{ runner.temp }}/out
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-17-predecessor-neighbor-regression
          path: ${{ runner.temp }}/regression
          retention-days: 30
          if-no-files-found: error

  wave0:
    name: e20-wave0-work-bundle-${{ matrix.bundle_id }}
    needs: [plan, pilot]
    if: needs.pilot.outputs.safe_to_fanout == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.wave0_matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10.6'}
      - run: |
          pip install -r stages/stage32/32-05/requirements.txt
          pip install -r stages/stage32/32-03/requirements.txt
      - run: |
          mkdir -p "$RUNNER_TEMP/core" "$RUNNER_TEMP/plan" "$RUNNER_TEMP/out"
          gh run download 32624596141 --repo fizawa460-bit/perfect-cuboid-game --name stage32-01-low-degree-verified-prefix --dir "$RUNNER_TEMP/core"
      - uses: actions/download-artifact@v4
        with: {name: stage32-17-e20-tier114186-plan, path: '${{ runner.temp }}/plan'}
      - run: python stages/stage32/32-05/derive_intersection_caps.py --core "$RUNNER_TEMP/core/picard-core.json" --output "$RUNNER_TEMP/caps.json"
      - run: python stages/stage32/32-17/run_e20_work_bundle.py --core "$RUNNER_TEMP/core/picard-core.json" --cap-certificate "$RUNNER_TEMP/caps.json" --plan "$RUNNER_TEMP/plan/e20-tier114186-plan.json" --bundle-id "${{ matrix.bundle_id }}" --output-dir "$RUNNER_TEMP/out" --node-limit-per-branch 1000000 --max-raw-bytes 1000000000 --max-compact-bytes 20000
      - name: Enforce exact bundle completion
        run: |
          python - <<'PY'
          import json, os, pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          assert not list(r.glob('*-raw.json'))
          x=json.loads((r/'bundle-receipt.json').read_text())
          assert x['all_items_complete'] is True and x['unknown_branch_count']==0
          assert x['executed_branches']==x['planned_expected_branches']
          assert max(p.stat().st_size for p in r.glob('*-compact.json'))<=20000
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'stage32-17b-e20-${{ matrix.bundle_id }}', path: '${{ runner.temp }}/out', retention-days: 1, if-no-files-found: error}

  wave1:
    name: e20-wave1-work-bundle-${{ matrix.bundle_id }}
    needs: [plan, wave0]
    if: needs.wave0.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.wave1_matrix) }}
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10.6'}
      - run: |
          pip install -r stages/stage32/32-05/requirements.txt
          pip install -r stages/stage32/32-03/requirements.txt
      - run: |
          mkdir -p "$RUNNER_TEMP/core" "$RUNNER_TEMP/plan" "$RUNNER_TEMP/out"
          gh run download 32624596141 --repo fizawa460-bit/perfect-cuboid-game --name stage32-01-low-degree-verified-prefix --dir "$RUNNER_TEMP/core"
      - uses: actions/download-artifact@v4
        with: {name: stage32-17-e20-tier114186-plan, path: '${{ runner.temp }}/plan'}
      - run: python stages/stage32/32-05/derive_intersection_caps.py --core "$RUNNER_TEMP/core/picard-core.json" --output "$RUNNER_TEMP/caps.json"
      - run: python stages/stage32/32-17/run_e20_work_bundle.py --core "$RUNNER_TEMP/core/picard-core.json" --cap-certificate "$RUNNER_TEMP/caps.json" --plan "$RUNNER_TEMP/plan/e20-tier114186-plan.json" --bundle-id "${{ matrix.bundle_id }}" --output-dir "$RUNNER_TEMP/out" --node-limit-per-branch 1000000 --max-raw-bytes 1000000000 --max-compact-bytes 20000
      - run: |
          python - <<'PY'
          import json, os, pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'; x=json.loads((r/'bundle-receipt.json').read_text())
          assert not list(r.glob('*-raw.json')); assert x['all_items_complete'] is True and x['unknown_branch_count']==0; assert x['executed_branches']==x['planned_expected_branches']; assert max(p.stat().st_size for p in r.glob('*-compact.json'))<=20000
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'stage32-17b-e20-${{ matrix.bundle_id }}', path: '${{ runner.temp }}/out', retention-days: 1, if-no-files-found: error}

  wave2:
    name: e20-wave2-work-bundle-${{ matrix.bundle_id }}
    needs: [plan, wave1]
    if: needs.wave1.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.wave2_matrix) }}
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10.6'}
      - run: |
          pip install -r stages/stage32/32-05/requirements.txt
          pip install -r stages/stage32/32-03/requirements.txt
      - run: |
          mkdir -p "$RUNNER_TEMP/core" "$RUNNER_TEMP/plan" "$RUNNER_TEMP/out"
          gh run download 32624596141 --repo fizawa460-bit/perfect-cuboid-game --name stage32-01-low-degree-verified-prefix --dir "$RUNNER_TEMP/core"
      - uses: actions/download-artifact@v4
        with: {name: stage32-17-e20-tier114186-plan, path: '${{ runner.temp }}/plan'}
      - run: python stages/stage32/32-05/derive_intersection_caps.py --core "$RUNNER_TEMP/core/picard-core.json" --output "$RUNNER_TEMP/caps.json"
      - run: python stages/stage32/32-17/run_e20_work_bundle.py --core "$RUNNER_TEMP/core/picard-core.json" --cap-certificate "$RUNNER_TEMP/caps.json" --plan "$RUNNER_TEMP/plan/e20-tier114186-plan.json" --bundle-id "${{ matrix.bundle_id }}" --output-dir "$RUNNER_TEMP/out" --node-limit-per-branch 1000000 --max-raw-bytes 1000000000 --max-compact-bytes 20000
      - run: |
          python - <<'PY'
          import json, os, pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'; x=json.loads((r/'bundle-receipt.json').read_text())
          assert not list(r.glob('*-raw.json')); assert x['all_items_complete'] is True and x['unknown_branch_count']==0; assert x['executed_branches']==x['planned_expected_branches']; assert max(p.stat().st_size for p in r.glob('*-compact.json'))<=20000
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'stage32-17b-e20-${{ matrix.bundle_id }}', path: '${{ runner.temp }}/out', retention-days: 1, if-no-files-found: error}

  wave3:
    name: e20-wave3-work-bundle-${{ matrix.bundle_id }}
    needs: [plan, wave2]
    if: needs.wave2.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.wave3_matrix) }}
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10.6'}
      - run: |
          pip install -r stages/stage32/32-05/requirements.txt
          pip install -r stages/stage32/32-03/requirements.txt
      - run: |
          mkdir -p "$RUNNER_TEMP/core" "$RUNNER_TEMP/plan" "$RUNNER_TEMP/out"
          gh run download 32624596141 --repo fizawa460-bit/perfect-cuboid-game --name stage32-01-low-degree-verified-prefix --dir "$RUNNER_TEMP/core"
      - uses: actions/download-artifact@v4
        with: {name: stage32-17-e20-tier114186-plan, path: '${{ runner.temp }}/plan'}
      - run: python stages/stage32/32-05/derive_intersection_caps.py --core "$RUNNER_TEMP/core/picard-core.json" --output "$RUNNER_TEMP/caps.json"
      - run: python stages/stage32/32-17/run_e20_work_bundle.py --core "$RUNNER_TEMP/core/picard-core.json" --cap-certificate "$RUNNER_TEMP/caps.json" --plan "$RUNNER_TEMP/plan/e20-tier114186-plan.json" --bundle-id "${{ matrix.bundle_id }}" --output-dir "$RUNNER_TEMP/out" --node-limit-per-branch 1000000 --max-raw-bytes 1000000000 --max-compact-bytes 20000
      - run: |
          python - <<'PY'
          import json, os, pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'; x=json.loads((r/'bundle-receipt.json').read_text())
          assert not list(r.glob('*-raw.json')); assert x['all_items_complete'] is True and x['unknown_branch_count']==0; assert x['executed_branches']==x['planned_expected_branches']; assert max(p.stat().st_size for p in r.glob('*-compact.json'))<=20000
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'stage32-17b-e20-${{ matrix.bundle_id }}', path: '${{ runner.temp }}/out', retention-days: 1, if-no-files-found: error}

  aggregate:
    name: cumulative exact e20/a0 tier <=114186
    needs: [plan, pilot, wave0, wave1, wave2, wave3]
    if: needs.pilot.result == 'success' && needs.wave0.result == 'success' && needs.wave1.result == 'success' && needs.wave2.result == 'success' && needs.wave3.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10.6'}
      - name: Download locked profile and audited predecessor
        run: |
          mkdir -p "$RUNNER_TEMP/profile" "$RUNNER_TEMP/prev" "$RUNNER_TEMP/plan" "$RUNNER_TEMP/final"
          gh run download 32725113188 --repo fizawa460-bit/perfect-cuboid-game --name stage32-14-e20-profile-plan --dir "$RUNNER_TEMP/profile"
          gh run download 32733420941 --repo fizawa460-bit/perfect-cuboid-game --name stage32-16-e20-a0-le65536-exact-tier --dir "$RUNNER_TEMP/prev"
      - uses: actions/download-artifact@v4
        with: {name: stage32-17-e20-tier114186-plan, path: '${{ runner.temp }}/plan'}
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-17b-e20-*
          path: ${{ runner.temp }}/certs
          merge-multiple: false
      - name: Verify all 364 work items and aggregate audited predecessor
        run: |
          python stages/stage32/32-17/aggregate_e20_tier114186.py \
            --profile "$RUNNER_TEMP/profile/e20-profile.json" \
            --predecessor "$RUNNER_TEMP/prev/e20-tier65536.json" \
            --plan "$RUNNER_TEMP/plan/e20-tier114186-plan.json" \
            --input-dir "$RUNNER_TEMP/certs" \
            --output "$RUNNER_TEMP/final/e20-tier114186.json"
      - name: Enforce final audit boundary and size
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'final/e20-tier114186.json'
          assert p.stat().st_size <= 10000000
          x=json.loads(p.read_text())
          assert x['chosen_cumulative_branch_threshold']==114186
          assert x['selected_cell_count']==417 and x['selected_total_materialized_branches']==16724262
          assert x['unknown_branch_count']==0
          assert x['parent_e20_a0_complete'] is False
          assert x['remaining_e20_a0_cells']==765
          assert x['next_profile_wall']['branch_count']==115712 and x['next_profile_wall']['cell_multiplicity']==128
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-17-e20-a0-le114186-exact-tier
          path: ${{ runner.temp }}/final/e20-tier114186.json
          retention-days: 30
          if-no-files-found: error
