name: Stage16-20 finite-data

on:
  pull_request:
    paths:
      - "stages/stage16/16-20/**"
      - ".github/workflows/stage16-20-finite-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay Stage16-20 census
        run: |
          python stages/stage16/16-20/enumerate.py \
            --verify stages/stage16/16-20/counts.csv \
            --self-check-b 100
