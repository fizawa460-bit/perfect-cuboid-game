name: Stage34-02b D2 Gaussian 03f exact proof replay

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage34/runkeys/stage34-02b-d2-gaussian-03f-proof.json'
      - 'stages/stage34/34-02/d2-stageA2-genus2-rankle1-gaussian-03f-proof-lock.json'
      - 'stages/stage34/34-02/prove_d2_stageA2_genus2_rankle1_gaussian_03f.py'
      - '.github/workflows/stage34-02b-d2-gaussian-03f-proof.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Check dedicated proof run key advanced and armed
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          KEY=stages/stage34/runkeys/stage34-02b-d2-gaussian-03f-proof.json
          if [ -z "$BEFORE" ]; then echo 'authorized=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BEFORE" || true
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo 'authorized=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! git diff --name-only "$BEFORE" HEAD | grep -Fxq "$KEY"; then echo 'authorized=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,subprocess,os
          p='stages/stage34/runkeys/stage34-02b-d2-gaussian-03f-proof.json'
          cur=json.load(open(p))
          before=subprocess.check_output(['git','show',f'{os.environ["BEFORE"]}:{p}'],text=True)
          old=json.loads(before)
          ok=(cur.get('schema')=='STAGE34_02B_D2_GAUSSIAN_03F_PROOF_RUNKEY_V1'
              and cur.get('armed') is True
              and isinstance(cur.get('generation'),int)
              and cur['generation']>int(old.get('generation',-1))
              and cur.get('expected_targets')==1
              and cur.get('planned_heavy_jobs')==1
              and cur.get('effective_heavy_concurrency')==1
              and cur.get('maximum_external_magma_requests_at_once')==1
              and cur.get('artifact_max_bytes')==1048576
              and cur.get('retention_days')==1)
          print('authorized='+('true' if ok else 'false'))
          PY

  prove:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Replay exact Gaussian quotient and parent closure
        run: python3 stages/stage34/34-02/prove_d2_stageA2_genus2_rankle1_gaussian_03f.py
      - name: Enforce compact proof artifact cap
        if: always()
        run: |
          test -f stages/stage34/34-02/d2-stageA2-genus2-rankle1-gaussian-03f-proof-certificate.json
          test $(wc -c < stages/stage34/34-02/d2-stageA2-genus2-rankle1-gaussian-03f-proof-certificate.json) -le 1048576
          test $(wc -c < stages/stage34/34-02/d2-stageA2-genus2-rankle1-gaussian-03f-proof-stdout.txt) -le 1048576
      - name: Upload compact proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-02b-d2-gaussian-03f-proof
          path: |
            stages/stage34/34-02/d2-stageA2-genus2-rankle1-gaussian-03f-proof-certificate.json
            stages/stage34/34-02/d2-stageA2-genus2-rankle1-gaussian-03f-proof-stdout.txt
          if-no-files-found: warn
          retention-days: 1
