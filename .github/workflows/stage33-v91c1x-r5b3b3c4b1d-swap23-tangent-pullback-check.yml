name: Stage33 V91C1X R5B3B3C4B1D swap23 tangent pullback check

on:
  push:
    branches:
      - stage33-v91c1x-r5b2d0-swap23-source-lock
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b1d-swap23-tangent-pullback-check.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1d_swap23_tangent_pullback_comparison.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1d-swap23-tangent-pullback-comparison.json'
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  exact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Rebuild and compare C4B1D certificate read-only
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1d_swap23_tangent_pullback_comparison.py
      - name: Verify Stage33 mutable authority remains synchronized
        run: python stages/stage33/sync_main_state.py --check
      - name: Verify clean exact head
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
