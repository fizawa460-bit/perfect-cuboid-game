name: Stage14 final self-contained R01 integrity

on:
  pull_request:
    paths:
      - "docs/stage14-final-self-contained.md"
      - "docs/review/stage14-final-self-contained-*.md"
      - "review/STAGE14-FINAL-SELF-CONTAINED-20260812-R01.html"
      - "scripts/build_stage14_final_bundle_r01.py"
      - ".github/workflows/stage14-final-self-contained-r01.yml"
  push:
    branches: [main]
    paths:
      - "docs/stage14-final-self-contained.md"
      - "docs/review/stage14-final-self-contained-*.md"
      - "review/STAGE14-FINAL-SELF-CONTAINED-20260812-R01.html"
      - "scripts/build_stage14_final_bundle_r01.py"
      - ".github/workflows/stage14-final-self-contained-r01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile deterministic builder
        run: python -m py_compile scripts/build_stage14_final_bundle_r01.py
      - name: Verify exact generated bytes, hashes, and theorem locks
        run: python scripts/build_stage14_final_bundle_r01.py --check
      - name: Verify standalone HTML envelope
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("review/STAGE14-FINAL-SELF-CONTAINED-20260812-R01.html")
          data = path.read_text(encoding="utf-8")
          assert data.startswith("<!doctype html>")
          assert len(data.encode("utf-8")) > 50_000
          assert "<style>" in data
          assert "https://" not in data and "http://" not in data
          assert "N₂(B) ≪ B<sup>1/2+o(1)</sup>" in data
          assert "SELF_CONTAINED_WITH_STATED_EXTERNAL_THEOREMS" in data
          print("STANDALONE_HTML_STATUS=PASS")
          PY
