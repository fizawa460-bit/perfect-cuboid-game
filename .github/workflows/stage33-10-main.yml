name: Stage33-10 absolute H1 Galois descent adapter

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'stages/stage33/33-10/**'
      - '.github/workflows/stage33-10-main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-10-absolute-h1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construct and certify exact absolute H1 receiver
        run: python stages/stage33/33-10/certify_stage33_10_absolute_receiver.py
      - name: Enforce Stage33-10 exit and parent firewalls
        run: |
          python - <<'PY'
          import hashlib,json
          p='stages/stage33/33-10/absolute-h1-receiver-certified.json'
          x=json.load(open(p))
          b=dict(x); claimed=b.pop('canonical_sha256')
          got=hashlib.sha256(json.dumps(b,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert claimed==got
          assert x['schema']=='STAGE33_10_ABSOLUTE_H1_RECEIVER_V1'
          assert all(x['exit_condition'].values())
          assert x['finite_shortcut']['status']=='EXPLICITLY_REPLACED'
          assert x['branches']['33-10e']=='CLOSED_EXACT'
          assert x['stage33_11_interface']['source_invariant_factor_directions']==26
          assert x['stage33_11_interface']['connecting_source_directions_computed']=='0/26'
          f=x['firewalls']
          assert f['connecting_matrix_columns_materialized']=='0/26'
          assert not f['arithmetic_localization_connecting_map_computed']
          assert not f['arithmetic_hs_closed'] and not f['stage33_07_closed'] and not f['stage33_08_released']
          assert f['stage33_progress']=='6/11'
          assert not f['theorem_credit'] and not f['endpoint_credit']
          assert not f['perfect_cuboid_existence_claim'] and not f['perfect_cuboid_nonexistence_claim']
          print('STAGE33_10_EXIT=PASS_EXACT')
          print('ABSOLUTE_RECEIVER_SHA256='+claimed)
          print('NEXT='+x['next_item'])
          PY
      - name: Remove generated certificate and verify tracked tree unchanged
        run: |
          rm stages/stage33/33-10/absolute-h1-receiver-certified.json
          git diff --exit-code -- stages/stage33/33-10
