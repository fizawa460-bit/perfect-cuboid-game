name: Stage33 V91C1X R5B2B2 full 16 exceptional Rees charts

on:
  push:
    branches:
      - stage33-v91c1x-r5-cover-glue-package
    paths:
      - 'stages/stage33/33-12/e3-v91c1x-r5b2b1-a2-02-full-closure-local-germs.json'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b2b2_full_16_exceptional_rees_charts.py'
      - 'stages/stage33/33-12/verify_stage33_v91c1x_r5b2b2_full_16_exceptional_rees_charts_v120.py'
      - '.github/workflows/stage33-v91c1x-r5b2b2-full-16-exceptional-rees-charts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install sympy
      - name: Materialize R5B2B2 full 16 exceptional Rees charts
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b2b2_full_16_exceptional_rees_charts.py --write
      - name: Verify R5B2B2 full 16 exceptional Rees charts
        run: python stages/stage33/33-12/verify_stage33_v91c1x_r5b2b2_full_16_exceptional_rees_charts_v120.py
      - name: Verify live Stage33 state remains synchronized
        run: python stages/stage33/sync_main_state.py --check
      - name: Diff check
        run: git diff --check
      - name: Commit R5B2B2 Rees-chart certificate
        shell: bash
        run: |
          CERT='stages/stage33/33-12/e3-v91c1x-r5b2b2-a2-02-full-16-exceptional-rees-charts.json'
          if [ -z "$(git status --porcelain -- "$CERT")" ]; then
            echo 'R5B2B2 certificate already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CERT"
          git commit -m '[Stage33] materialize R5B2B2 full 16 exceptional Rees charts'
          git push origin HEAD:${GITHUB_REF_NAME}
