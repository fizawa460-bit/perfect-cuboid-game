name: Stage33 V91C1X_R1-R5 chain-contract active replay

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: stage33-v91c1x-r5-chain-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay R1 exact negative diagnostic
        run: python stages/stage33/33-12/diagnose_e3_v91c1x_r1_chain_level_action_difference_preflight.py
      - name: Verify V115 R5 current routing and prior audited provenance
        run: |
          python stages/stage33/33-12/verify_stage33_v91c1x_r5_active_v115.py
          python stages/stage33/sync_main_state.py --check
      - name: Diff hygiene
        run: git diff --check
