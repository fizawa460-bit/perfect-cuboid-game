    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install pinned exact dependencies
        run: |
          pip install -r stages/stage32/32-05/requirements.txt
          pip install -r stages/stage32/32-03/requirements.txt
      - name: Download source-locked core and audited profile
        run: |
          gh run download 32624596141 --repo fizawa460-bit/perfect-cuboid-game --name stage32-01-low-degree-verified-prefix --dir "$RUNNER_TEMP/core"
          if [ "${{ matrix.e }}" = "8" ]; then
            PROFILE=stage32-08-e8-a36-materialization-profile
          else
            PROFILE=stage32-08-e10-a30-materialization-profile
          fi
          gh run download 32679056269 --repo fizawa460-bit/perfect-cuboid-game --name "$PROFILE" --dir "$RUNNER_TEMP/profile"
      - name: Re-derive exact caps and lock profile row
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python stages/stage32/32-05/derive_intersection_caps.py \
            --core "$RUNNER_TEMP/core/picard-core.json" \
            --output "$RUNNER_TEMP/out/intersection-cap-certificates.json"
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          p=json.loads((root/'profile/materialization-profile.json').read_text())
          expected_sha = {
            8: '97608b176d7a91677f63cd293502f7042a9a9f6ad30904631260c9d560b7be17',
            10: '993d0005f60499b50b03b899153b60f93de757a74f53d942e5a2168830cc5123',
          }[int('${{ matrix.e }}')]
          assert p['canonical_sha256_without_this_field']==expected_sha
          idx=int('${{ matrix.cell_index }}'); cid='${{ matrix.cell_id }}'; branches=int('${{ matrix.branches }}')
          row=next(c for c in p['cells_sorted_by_branch_count'] if int(c['cell_index'])==idx)
          assert row['cell_id']==cid
          assert int(row['materialized_branch_count'])==branches
          PY
      - name: Exhaust exact signature cell
        run: |
          python stages/stage32/32-08/run_materialized_cell_exhaustive.py \
            --core "$RUNNER_TEMP/core/picard-core.json" \
            --cap-certificate "$RUNNER_TEMP/out/intersection-cap-certificates.json" \
            --output "$RUNNER_TEMP/out/cell.json" \
            --exceptional-mass ${{ matrix.e }} --curve-group-mass ${{ matrix.a }} \
            --cell-index ${{ matrix.cell_index }} --expected-cell-id ${{ matrix.cell_id }} \
            --node-limit-per-branch 1000000
      - name: Enforce exact completion and credit firewalls
        run: |
          python - <<'PY'
          import json, os, pathlib
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'out/cell.json').read_text())
          assert d['parameters']['exceptional_mass']==int('${{ matrix.e }}')
          assert d['parameters']['curve_group_mass']==int('${{ matrix.a }}')
          assert d['parameters']['cell_index']==int('${{ matrix.cell_index }}')
          assert d['parameters']['cell_id']=='${{ matrix.cell_id }}'
          assert d['materialization']['total_branch_count']==int('${{ matrix.branches }}')
          assert d['executed_branch_count']==int('${{ matrix.branches }}')
          assert d['complete_numerical_enumeration'] is True
          assert all(not b['search']['node_budget_exhausted'] for b in d['branches'])
          assert d['shared_context']['kernel_dimension']==12
          assert d['parent_exactly_closed'] is False
          assert d['effectivity_classification_complete'] is False
          assert d['actual_curve_existence_claim'] is False
          assert d['theorem_credit'] is False and d['receiver_credit'] is False
          assert d['FULL_D8_G0_ROW_COMPLETE'] is False
          assert d['FULL_D176_D192_NUMERICAL_ORBIT_CENSUS'] is False
          assert d['R29_LG2_NUMERICAL_COMPONENT_COMPLETE'] is False
          assert d['R29_LG2']=='NOT_DISCHARGED' and d['R29_LG2_EFF']=='NOT_DISCHARGED' and d['R29_LG2_MB']=='NOT_DISCHARGED'
          assert d['G10_LOWGENUS_PICARD']=='AMBER'
          print(json.dumps(dict(
            e=d['parameters']['exceptional_mass'], a=d['parameters']['curve_group_mass'],
            cell_index=d['parameters']['cell_index'], cell_id=d['parameters']['cell_id'],
            branches=d['executed_branch_count'], result=d['solver_result'],
            survivors=d['exact_numerical_survivor_count'], sha=d['deterministic_sha256_without_runtime'],
          ), sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage32-11-e${{ matrix.e }}-a${{ matrix.a }}-cell-${{ matrix.cell_index }}-${{ matrix.cell_id }}
          path: ${{ runner.temp }}/out/cell.json
          if-no-files-found: warn
