name: Stage15-6bg support gate

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6bg/**'
      - 'stages/stage15/evidence/stage15_6bg_support_gate.json'
      - 'stages/stage15/replay/verify_stage15_6bg.py'
      - 'stages/stage15/scripts/stage15_6bg_support_gate.py'
      - '.github/workflows/stage15-6bg-support-gate.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python stages/stage15/replay/verify_stage15_6bg.py
      - run: python -m py_compile stages/stage15/scripts/stage15_6bg_support_gate.py stages/stage15/replay/verify_stage15_6bg.py
