name: Stage32 residual32-01 full178 resumable 256M production

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage32/runkeys/residual32-01-full178-resumable-256m-production.json'
      - '.github/workflows/stage32-residual32-01-full178-resumable-256m-production.yml'

permissions:
  contents: read
  actions: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      matrix: ${{ steps.gate.outputs.matrix }}
      carry: ${{ steps.gate.outputs.carry }}
      production_generation: ${{ steps.gate.outputs.production_generation }}
      source_frontier_count: ${{ steps.gate.outputs.source_frontier_count }}
      dispatch_count: ${{ steps.gate.outputs.dispatch_count }}
      carry_count: ${{ steps.gate.outputs.carry_count }}
      node_limit: ${{ steps.gate.outputs.node_limit }}
      dispatch_sha256: ${{ steps.gate.outputs.dispatch_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - id: gate
        name: Verify fresh Gen38 256M key and exact FIFO source
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          KEY='stages/stage32/runkeys/residual32-01-full178-resumable-256m-production.json'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          echo 'matrix={"work_unit":[]}' >> "$GITHUB_OUTPUT"
          echo 'carry=[]' >> "$GITHUB_OUTPUT"
          echo 'production_generation=0' >> "$GITHUB_OUTPUT"
          echo 'source_frontier_count=0' >> "$GITHUB_OUTPUT"
          echo 'dispatch_count=0' >> "$GITHUB_OUTPUT"
          echo 'carry_count=0' >> "$GITHUB_OUTPUT"
          echo 'node_limit=0' >> "$GITHUB_OUTPUT"
          echo 'dispatch_sha256=' >> "$GITHUB_OUTPUT"
          [ "$ACTION" = synchronize ] || exit 0
          [ -n "${BEFORE:-}" ] || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || exit 0
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          mapfile -t changed < <(git diff --name-only "$BEFORE" "$HEAD")
          [ "${#changed[@]}" -eq 1 ] || exit 0
          [ "${changed[0]}" = "$KEY" ] || exit 0
          python - "$BEFORE" "$KEY" "$GITHUB_OUTPUT" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,tempfile,zipfile
          sys.path.insert(0,'stages/stage32/residual-32-01-production')
          from run_full178_resumable_work_unit import decode_input

          before,key,out=sys.argv[1:]
          old=json.loads(subprocess.check_output(['git','show',f'{before}:{key}'],text=True))
          new=json.load(open(key))
          schema='STAGE32_RESIDUAL32_01_FULL178_RESUMABLE_256M_PRODUCTION_RUNKEY_V1'
          assert old['schema']==new['schema']==schema
          assert old['workload']==new['workload']=='FULL178_EXACT_PAIRING_PREFIX_RESUMABLE_256M_PRODUCTION'
          assert int(new['revision'])==int(old['revision'])+1
          assert int(new['production_generation'])==int(old['production_generation'])==38
          assert int(new['source_frontier_count'])==int(old['source_frontier_count'])==73
          assert int(new['dispatch_count'])==int(old['dispatch_count'])==73
          assert int(new['carry_count'])==int(old['carry_count'])==0
          assert int(new['node_limit_per_work_unit'])==int(old['node_limit_per_work_unit'])==256000000
          assert new['source_frontier_artifact']==old['source_frontier_artifact']
          assert new['queue_policy']==old['queue_policy']=='FIFO_GLOBAL_FRONTIER_CARRY_THEN_RESUMABLE_CHILDREN'
          assert new['runner_schema']=='STAGE32_RESIDUAL32_01_FULL178_RESUMABLE_WORK_UNIT_V1'
          assert int(new['max_unresolved_children_per_input'])==1
          assert float(new['structural_reproduction_upper_bound'])==1.0
          assert int(new['effective_heavy_concurrency'])==17
          assert int(new['other_stage32_heavy_overlap_bound'])==1
          assert int(new['maximum_effective_stage32_heavy_overlap'])==18
          assert int(new['effective_heavy_concurrency'])+int(new['other_stage32_heavy_overlap_bound'])<=18
          assert float(new['projected_peak_artifact_mb'])<500
          assert int(new['intermediate_retention_days'])==1
          assert int(new['frontier_manifest_retention_days'])==7
          assert new['FULL_178_ROW_SWEEP_AUTHORIZED'] is True
          assert new['B18_RELEASE_AUTHORIZED'] is False
          assert new['THEOREM_CREDIT'] is False and new['RECEIVER_CREDIT'] is False
          assert new['PERFECT_CUBOID_EXISTENCE_CLAIM'] is False and new['PERFECT_CUBOID_NONEXISTENCE_CLAIM'] is False
          if new['armed']:
              assert old['armed'] is False
          else:
              assert old['armed'] is False

          def digest(v):
              return hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':')).encode()).hexdigest()

          src=new['source_frontier_artifact']; aid=int(src['artifact_id'])
          root=pathlib.Path(tempfile.mkdtemp(prefix='resumable-256m-frontier-')); zp=root/f'{aid}.zip'
          url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/artifacts/{aid}/zip"
          subprocess.check_call(['curl','-fsSL','-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",'-H','X-GitHub-Api-Version: 2022-11-28',url,'-o',str(zp)])
          assert hashlib.sha256(zp.read_bytes()).hexdigest()==src['artifact_zip_sha256']
          with zipfile.ZipFile(zp) as z:
              candidates=[n for n in z.namelist() if n.endswith('resumable-frontier-manifest.json')]
              assert len(candidates)==1
              m=json.loads(z.read(candidates[0]))
          claimed=m.pop('canonical_sha256_without_this_field')
          assert digest(m)==claimed==src['manifest_canonical_sha256']
          assert int(m['production_generation'])==int(src['generation'])==37
          frontier=m['frontier_exact_work_units']
          assert len(frontier)==73==int(new['source_frontier_count'])
          dispatch=frontier[:73]; carry=frontier[73:]
          assert not carry
          normalized=[]
          for raw in dispatch:
              row=raw['row_id']; genus=int(row.split('-')[0][1:]); emin=8 if genus==0 else 4
              cur=decode_input(raw,emin=emin); assert cur['row_id']==row
              normalized.append(raw)
          ids=[u['work_unit_id'] for u in frontier]; assert len(ids)==len(set(ids))
          dsha=digest(dispatch)
          print(json.dumps({'verdict':'PASS_EXACT_FIFO_GEN38_256M_SOURCE_PREFLIGHT','frontier':73,'dispatch':73,'carry':0,'node_limit':256000000,'dispatch_sha256':dsha,'armed':bool(new['armed'])},sort_keys=True))
          with open(out,'a') as f:
              f.write('production_generation=38\n')
              f.write('source_frontier_count=73\n')
              f.write('dispatch_count=73\n')
              f.write('carry_count=0\n')
              f.write('node_limit=256000000\n')
              f.write('dispatch_sha256='+dsha+'\n')
          if not new['armed']:
              sys.exit(0)
          with open(out,'a') as f:
              f.write('authorized=true\n')
              f.write('matrix='+json.dumps({'work_unit':normalized},separators=(',',':'))+'\n')
              f.write('carry=[]\n')
          PY

  produce:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix: ${{ fromJSON(needs.authorize.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      WORK_UNIT_JSON: ${{ toJSON(matrix.work_unit) }}
      NODE_LIMIT: ${{ needs.authorize.outputs.node_limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Execute one exact resumable 256M work unit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage32-full178-resumable-256m"
          ID=$(python -c 'import json,os; print(json.loads(os.environ["WORK_UNIT_JSON"])["work_unit_id"])')
          OUT="$RUNNER_TEMP/stage32-full178-resumable-256m/${ID}.json"
          python stages/stage32/residual-32-01-production/run_full178_resumable_work_unit.py \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --work-unit-json "$WORK_UNIT_JSON" --node-limit "$NODE_LIMIT" --output "$OUT"
          python - "$OUT" <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(sys.argv[1]); x=json.loads(p.read_text()); expected=int(os.environ['NODE_LIMIT'])
          assert x['schema']=='STAGE32_RESIDUAL32_01_FULL178_RESUMABLE_WORK_UNIT_V1'
          assert x['nodes_used']==sum(int(t['nodes']) for t in x['telemetry'])
          assert 0<=x['nodes_used']<=x['node_limit']==expected==256000000
          assert x['unknown_count']==len(x['unresolved_exact_child_work_units'])<=1
          assert x['max_unresolved_children_per_input']==1 and x['reproduction_factor_structural_upper_bound']==1.0
          assert x['prefix_stage_only'] is True and x['unknown_is_unsat'] is False and x['numerical_row_complete'] is False
          assert x['B18_RELEASE_AUTHORIZED'] is False and x['THEOREM_CREDIT'] is False and x['RECEIVER_CREDIT'] is False
          assert p.stat().st_size <= 32*1024
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-full178-resumable-256m-${{ needs.authorize.outputs.production_generation }}-${{ matrix.work_unit.work_unit_id }}
          path: ${{ runner.temp }}/stage32-full178-resumable-256m/*.json
          retention-days: 1
          if-no-files-found: error

  aggregate:
    needs: [authorize, produce]
    if: needs.authorize.outputs.authorized == 'true' && needs.produce.result == 'success'
    runs-on: ubuntu-24.04
    env:
      PRODUCTION_GENERATION: ${{ needs.authorize.outputs.production_generation }}
      SOURCE_FRONTIER_COUNT: ${{ needs.authorize.outputs.source_frontier_count }}
      DISPATCH_COUNT: ${{ needs.authorize.outputs.dispatch_count }}
      CARRY_COUNT: ${{ needs.authorize.outputs.carry_count }}
      NODE_LIMIT: ${{ needs.authorize.outputs.node_limit }}
      DISPATCH_SHA256: ${{ needs.authorize.outputs.dispatch_sha256 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-full178-resumable-256m-${{ needs.authorize.outputs.production_generation }}-wu-*
          path: ${{ runner.temp }}/aggregate-256m
          merge-multiple: true
      - name: Build exact FIFO 256M frontier manifest
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'aggregate-256m'
          dispatch_count=int(os.environ['DISPATCH_COUNT']); source_count=int(os.environ['SOURCE_FRONTIER_COUNT']); node_limit=int(os.environ['NODE_LIMIT'])
          files=sorted(root.glob('*.json')); assert len(files)==dispatch_count==73
          rows=[]; children=[]
          for p in files:
              x=json.loads(p.read_text()); assert x['schema']=='STAGE32_RESIDUAL32_01_FULL178_RESUMABLE_WORK_UNIT_V1'
              assert x['node_limit']==node_limit==256000000
              assert x['unknown_count']==len(x['unresolved_exact_child_work_units'])<=1
              rows.append({'work_unit_id':x['input_work_unit']['work_unit_id'],'row_id':x['row_id'],'nodes_used':x['nodes_used'],'completed_prefix_partitions':len(x['completed_prefix_partitions']),'continuation_count':x['unknown_count'],'certificate_sha256':x['canonical_sha256_without_this_field']})
              children.extend(x['unresolved_exact_child_work_units'])
          frontier=children
          assert len(frontier)<=source_count
          ids=[u['work_unit_id'] for u in frontier]; assert len(ids)==len(set(ids))
          payload={'schema':'STAGE32_RESIDUAL32_01_FULL178_RESUMABLE_256M_FRONTIER_MANIFEST_V1','production_generation':38,'node_limit_per_work_unit':node_limit,'source_dispatch_sha256':os.environ['DISPATCH_SHA256'],'input_frontier_count':source_count,'dispatch_count':dispatch_count,'carry_count':0,'completed_input_count':sum(1 for x in rows if x['continuation_count']==0),'continuation_count':len(children),'frontier_after_ingest_count':len(frontier),'frontier_net_change':len(frontier)-source_count,'structural_frontier_nonincrease':len(frontier)<=source_count,'work_units':sorted(rows,key=lambda v:v['work_unit_id']),'frontier_exact_work_units':frontier,'queue_policy':'FIFO_GLOBAL_FRONTIER_CARRY_THEN_RESUMABLE_CHILDREN','unknown_is_unsat':False,'prefix_stage_only':True,'FULL_D176_D192_NUMERICAL_ORBIT_CENSUS':False,'R29_LG2':'NOT_DISCHARGED','THEOREM_CREDIT':False,'RECEIVER_CREDIT':False,'PERFECT_CUBOID_EXISTENCE_CLAIM':False,'PERFECT_CUBOID_NONEXISTENCE_CLAIM':False}
          raw=json.dumps(payload,sort_keys=True,separators=(',',':')).encode(); payload['canonical_sha256_without_this_field']=hashlib.sha256(raw).hexdigest()
          out=root/'resumable-256m-frontier-manifest.json'; out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n'); assert out.stat().st_size<1024*1024
          print(json.dumps({'input_frontier':source_count,'dispatch':dispatch_count,'carry':0,'node_limit':node_limit,'continuations':len(children),'frontier_after':len(frontier),'net_change':len(frontier)-source_count,'sha256':payload['canonical_sha256_without_this_field']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-full178-resumable-256m-${{ needs.authorize.outputs.production_generation }}-frontier
          path: ${{ runner.temp }}/aggregate-256m/resumable-256m-frontier-manifest.json
          retention-days: 7
          if-no-files-found: error
