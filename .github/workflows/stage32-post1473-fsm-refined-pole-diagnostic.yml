name: Stage32 post1473 FSM refined pole diagnostic

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  exact-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recompute exact refined FSM certificate
        run: python stages/stage32/residual-32-01-production/diagnose_stage32_post1473_fsm_refined_pole_obstruction.py
      - name: Require committed certificate to be canonical
        run: git diff --exit-code -- stages/stage32/residual-32-01-production/post1473-specific-class-fsm-refined-pole-obstruction.json
