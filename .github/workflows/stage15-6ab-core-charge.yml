name: Stage15-6ab moving core charge

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6ab/**'
      - 'stages/stage15/evidence/stage15_6ab_core_charge.json'
      - 'stages/stage15/replay/verify_stage15_6ab.py'
      - 'stages/stage15/scripts/stage15_6ab_core_charge.py'
      - '.github/workflows/stage15-6ab-core-charge.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6ab moving core charge
        run: python stages/stage15/replay/verify_stage15_6ab.py
