name: StructureRadar batch22 lineage matcher

on:
  push:
    branches:
      - structure-radar-deep-corpus-batch-22
permissions:
  contents: write
jobs:
  lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Match summaries to reviewed archive stages
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.'); r=root/'docs/structure-radar'
          q=json.loads((r/'exploration-queue.json').read_text()); task=next(t for t in q['tasks'] if t['status']=='READY'); ids=task['source_ids'][:60]
          sources={}; bypath={}
          for p in sorted((r/'source-manifest').glob('part-*.json')):
              for s in json.loads(p.read_text())['sources']:
                  sources[s['source_id']]=s; bypath[s['path'].lower()]=s
          reviews=json.loads((r/'progress.json').read_text())['source_reviews']
          def strings(x):
              if isinstance(x,str): yield x
              elif isinstance(x,dict):
                  for v in x.values(): yield from strings(v)
              elif isinstance(x,list):
                  for v in x: yield from strings(v)
          lines=['# idx | source | stage labels | reviewed archive lineage']
          for i,sid in enumerate(ids,1):
              s=sources[sid]; path=root/s['path']; labels=[]
              try: obj=json.loads(path.read_text())
              except Exception: obj={}
              for st in strings(obj):
                  for m in re.finditer(r'(?i)Stage14-([A-Za-z0-9]+)',st):
                      slug=m.group(1)
                      if slug.lower() not in [x.lower() for x in labels]: labels.append(slug)
              hits=[]
              for slug in labels:
                  candidates=[f'stages/stage14/archive/tasks/14-{slug}/result.md'.lower(),f'stages/stage14/tasks/14-{slug}/result.md'.lower()]
                  for cp in candidates:
                      old=bypath.get(cp)
                      if old:
                          rv=reviews.get(old['source_id'],{})
                          cids=rv.get('structure_ids',[])
                          hits.append(f"14-{slug}:{old['source_id']}:{','.join(cids) or rv.get('status','?')}")
                          break
              lines.append(f"{i:02d} | {sid} | {','.join(labels) or '-'} | {' ; '.join(hits) or '-'}")
          (r/'.batch22-lineage.txt').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/structure-radar/.batch22-lineage.txt
          if ! git diff --cached --quiet; then
            git commit -m "Build StructureRadar batch22 lineage map"
            git push origin HEAD:structure-radar-deep-corpus-batch-22
          fi
