name: Stage15-2a compactification audit

on:
  pull_request:
    paths:
      - 'stages/stage15/15-2a/**'
      - 'stages/stage15/replay/verify_stage15_2a.py'
      - '.github/workflows/stage15-2a-compactification.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-2a compactification audit
        run: python stages/stage15/replay/verify_stage15_2a.py
