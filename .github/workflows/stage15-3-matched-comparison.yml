name: Stage15-3 matched A-B comparison

on:
  pull_request:
    paths:
      - 'stages/stage15/15-3/**'
      - 'stages/stage15/evidence/stage15_3_baseline.json'
      - 'stages/stage15/replay/verify_stage15_3.py'
      - 'stages/stage15/scripts/stage15_3_compare.py'
      - 'stages/stage15/scripts/paired_enumerator.py'
      - '.github/workflows/stage15-3-matched-comparison.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-3 matched comparison
        run: python stages/stage15/replay/verify_stage15_3.py
