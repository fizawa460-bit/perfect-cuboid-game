name: Stage32 32-01-178 direct Picard production panel

on:
  push:
    branches:
      - stage32-01-178-post-td02-fibration-nef
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - name: Exact compact-signature factorization
        run: python stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_signature_factorization.py
      - name: Exact direct numerical Picard production endpoint panel
        run: python stages/stage32/32-01-178/fibration-nef/verify_direct_numerical_picard_leaf_compression.py --panel-size 2
