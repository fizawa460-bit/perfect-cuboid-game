name: Stage32 32-01-178 exact research preflights

on:
  push:
    branches:
      - stage32-01-178-post-td02-fibration-nef
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-preflights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - name: Exact compact-signature factorization
        run: python stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_signature_factorization.py
      - name: Exact Picard existential equivalence
        run: python stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_picard_existential_preflight.py
      - name: Exact real-production existence panel
        run: python stages/stage32/32-01-178/fibration-nef/verify_direct_numerical_picard_existence_panel.py --panel-size 5
