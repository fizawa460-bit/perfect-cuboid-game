name: Stage32EX5 BC2-06 next exceptional block preflight

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_06_next_exceptional_terminal_block_preflight.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-05-symbolic-x4-full-exceptional-refinement-checkpoint.json'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_family.py'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_indexer.py'
      - '.github/workflows/stage32ex5-bc2-02-unknown53-direct-slice-a-preflight.yml'

permissions:
  contents: read

concurrency:
  group: stage32ex5-bc2-06-next-block-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exact-next-block-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Compile BC2-06 preflight
        run: python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_06_next_exceptional_terminal_block_preflight.py
      - name: Replay ranks 133 through 265 exactly
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_06_next_exceptional_terminal_block_preflight.py \
            --bc2-05-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-05-symbolic-x4-full-exceptional-refinement-checkpoint.json \
            --output "$RUNNER_TEMP/bc2-06-next-block-preflight.json"
      - name: Validate BC2-06 scope and firewalls
        run: |
          python - "$RUNNER_TEMP/bc2-06-next-block-preflight.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); b=p['next_block']; e=p['execution']; f=p['firewalls']
          assert p['schema']=='STAGE32EX5_BC2_06_NEXT_EXCEPTIONAL_TERMINAL_BLOCK_PREFLIGHT_V1'
          assert p['status']=='PASS_NEXT_EXCEPTIONAL_BLOCK_EXACTLY_REDERIVED_NO_SOLVER_CREDIT'
          assert b['terminal_rank_start']==133 and b['terminal_rank_end']==265 and b['block_width']==133
          assert b['outer_exceptional_rank']==1
          assert b['x4_start']==0 and b['x4_end']==132
          assert b['all_133_rank_unrank_replays_exact'] is True
          assert b['all_133_terminal_predicate_replays_exact'] is True
          assert b['x4_is_innermost_coordinate_over_block'] is True
          assert b['exceptional_signature_constant_over_block'] is True
          assert b['exceptional_signature_differs_from_previous_block'] is True
          assert e['solver_invoked'] is False and e['heavy_compute_invoked'] is False
          assert e['artifact_required'] is False and e['new_mathematical_condition_added'] is False
          assert p['next_exact_unit']['id']=='BC2_07_OUTER_RANK1_SYMBOLIC_X4_PARENT_PREFLIGHT'
          assert f['rank_133_to_265_block_picard64_closed'] is False
          assert f['whole_g1_d008_e4_stratum_closed'] is False
          assert f['FULL178_complete'] is False and f['stage32_main_credit'] is False
          assert f['merge_authorized'] is False
          print(json.dumps({'rank_block':[b['terminal_rank_start'],b['terminal_rank_end']],'outer_exceptional_rank':b['outer_exceptional_rank'],'base_terminal':b['base_terminal_x4_zero'],'exceptional_signature':b['exceptional_signature'],'replay_stream_sha256':b['replay_stream_sha256'],'canonical':p['canonical_sha256_without_this_field']},sort_keys=True))
          PY
