name: Stage32EX5 BC2-04 symbolic x4 block preflight

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_04_x4_innermost_block_compression_preflight.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-03-rank1-exact-unsat-checkpoint.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-02-rank0-exact-unsat-checkpoint.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_02_exact_witness_to_node_support.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-01b-runtime-node-coordinate-bridge.json'
      - 'stages/stage32-ex5/runkeys/bc2-04-x4-block-preflight.json'
      - 'stages/stage32/residual-32-01-production/full178-manifest.json'
      - 'stages/stage32/residual-32-01-production/full178-prefix-indexed-compression-main-checkpoint.json'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_family.py'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_indexer.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - '.github/workflows/stage32ex5-bc2-02-unknown53-direct-slice-a-preflight.yml'

permissions:
  contents: read

concurrency:
  group: stage32ex5-bc2-04-x4-block-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Validate fresh BC2-04 run-key arm in synchronize commit range
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          KEY='stages/stage32-ex5/runkeys/bc2-04-x4-block-preflight.json'
          BEFORE='${{ github.event.before }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          authorized=false
          if [ -n "$BEFORE" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && git diff --name-only "$BEFORE" "$HEAD" | grep -Fxq "$KEY"; then
              python - "$KEY" "$BEFORE" <<'PY'
          import json,subprocess,sys
          key,before=sys.argv[1:]
          new=json.load(open(key))
          if new.get('schema')!='STAGE32EX5_BC2_04_X4_BLOCK_PREFLIGHT_RUNKEY_V1':
              raise SystemExit('run-key schema mismatch')
          if new.get('armed') is not True:
              raise SystemExit('run-key is not armed')
          if new.get('source_commit')!='d98cfea04e08940f85b0b6572f49e312e00a0cfd':
              raise SystemExit('BC2-04 source commit lock mismatch')
          if new.get('terminal_rank_block') != [0,132]:
              raise SystemExit('terminal block lock mismatch')
          if new.get('exceptional_rank') != 0:
              raise SystemExit('exceptional rank lock mismatch')
          if int(new.get('parent_timeout_ms',0)) != 1500:
              raise SystemExit('parent timeout lock mismatch')
          if int(new.get('max_parent_branches',0)) != 210:
              raise SystemExit('parent branch ceiling mismatch')
          if int(new.get('projected_max_artifact_bytes',0)) > 200000:
              raise SystemExit('artifact projection exceeds BC2-04 preflight ceiling')
          if int(new.get('artifact_retention_days',0)) != 1:
              raise SystemExit('transient artifact retention must be one day')
          old_generation=-1
          try:
              old_text=subprocess.check_output(['git','show',f'{before}:{key}'],text=True,stderr=subprocess.DEVNULL)
              old_generation=int(json.loads(old_text).get('generation',-1))
          except subprocess.CalledProcessError:
              pass
          if int(new.get('generation',-1)) <= old_generation:
              raise SystemExit('run-key generation did not advance')
          print('BC2_04_RUNKEY_FRESH_ARM_OK')
          PY
              authorized=true
            fi
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "BC2_04_HEAVY_AUTHORIZED=$authorized"

  symbolic-x4-block-preflight:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact solver dependencies
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Run exact symbolic x4 block preflight
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_04_x4_innermost_block_compression_preflight.py \
            --manifest stages/stage32/residual-32-01-production/full178-manifest.json \
            --prefix-checkpoint stages/stage32/residual-32-01-production/full178-prefix-indexed-compression-main-checkpoint.json \
            --adapter-preflight stages/stage32-ex5/breadth-cycle-2/bc2-02-full178-target-to-59d-model-adapter-preflight.json \
            --rank0-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-02-rank0-exact-unsat-checkpoint.json \
            --rank1-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-03-rank1-exact-unsat-checkpoint.json \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --parent-timeout-ms 1500 \
            --output "$RUNNER_TEMP/bc2-04-x4-block-preflight.json"
      - name: Validate exact block compression and firewalls
        run: |
          python - "$RUNNER_TEMP/bc2-04-x4-block-preflight.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); b=p['x4_block_semantics']; a=p['adaptive_exceptional_partition']; q=p['parent_result']; r=p['result']
          assert p['schema']=='STAGE32EX5_BC2_04_X4_INNERMOST_BLOCK_COMPRESSION_PREFLIGHT_V1'
          assert b['rank_start']==0 and b['rank_end']==132 and b['block_width']==133
          assert b['known_label_49_is_x4'] is True
          assert b['x4_is_only_normal_terminal_variable'] is True
          assert b['x4_is_independent_of_exceptional_terminal_predicate_conditions'] is True
          assert b['all_133_rank_unrank_replays_exact'] is True
          assert b['exceptional_signature_constant_across_block'] is True
          assert b['exact_disjunction_replaced_by_single_bounded_integer_x4'] is True
          assert b['new_mathematical_condition_added'] is False
          assert a['residual_exceptional_mass']==2
          assert a['parent_branch_count']==210
          assert a['parent_partition_complete_for_symbolic_x4_block'] is True
          assert q['aggregate_result'] in {'SAT','UNSAT','UNKNOWN'}
          if q['aggregate_result']=='UNSAT':
              assert q['tested_parent_branches']==210
              assert q['exact_unsat_parent_branches']==210
              assert q['unknown_parent_branches']==0
              assert r['whole_rank_0_to_132_block_exact_unsat_authorized'] is True
          if q['aggregate_result']=='SAT':
              assert q['sat_parent'] is not None
              assert 0 <= q['sat_parent']['x4'] <= 132
              assert isinstance(r['witness_r_reduced'],list) and len(r['witness_r_reduced'])==59
          if q['aggregate_result']=='UNKNOWN':
              assert q['unknown_parent_branches']>0
              assert q['exact_full_exceptional_refinement_subcase_count_if_needed']>0
              assert r['whole_rank_0_to_132_block_exact_unsat_authorized'] is False
          assert p['firewalls']['whole_g1_d008_e4_stratum_closed'] is False
          assert p['firewalls']['FULL178_complete'] is False
          assert p['firewalls']['stage32_main_credit'] is False
          assert p['firewalls']['merge_authorized'] is False
          print(json.dumps({'aggregate':q['aggregate_result'],'parent_unsat':q['exact_unsat_parent_branches'],'parent_unknown':q['unknown_parent_branches'],'unknown_mass_counts':q['unknown_parent_unselected_mass_counts'],'refined_subcases':q['exact_full_exceptional_refinement_subcase_count_if_needed'],'sat_parent':q['sat_parent'],'canonical':p['canonical_sha256_without_this_field']},sort_keys=True))
          PY
      - name: Feed symbolic-block SAT completion into node-support consumer
        run: |
          set -euo pipefail
          STATUS=$(python - "$RUNNER_TEMP/bc2-04-x4-block-preflight.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['result']['status'])
          PY
          )
          if [ "$STATUS" = SAT ]; then
            python stages/stage32-ex5/breadth-cycle-2/bc2_02_exact_witness_to_node_support.py \
              --evidence "$RUNNER_TEMP/bc2-04-x4-block-preflight.json" \
              --retained stages/stage33/33-07/picard_base_rows_retained.py \
              --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
              --node-bridge stages/stage32-ex5/breadth-cycle-2/bc2-01b-runtime-node-coordinate-bridge.json \
              --output "$RUNNER_TEMP/bc2-04-x4-block-support.json"
          else
            echo "symbolic x4 block result=$STATUS; node-support consumer not invoked"
          fi
      - name: Upload compact BC2-04 evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-04-x4-block-preflight
          path: ${{ runner.temp }}/bc2-04-x4-block*.json
          retention-days: 1
          compression-level: 9
