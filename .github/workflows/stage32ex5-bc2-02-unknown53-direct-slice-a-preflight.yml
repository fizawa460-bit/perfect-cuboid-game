name: Stage32EX5 BC2-02 unknown53 full exceptional exact

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_02_rank0_unknown53_full_exceptional_partition_exact.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-02-rank0-exceptional-mass2-branched-exact-checkpoint.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_02_exact_witness_to_node_support.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-01b-runtime-node-coordinate-bridge.json'
      - 'stages/stage32/residual-32-01-production/full178-manifest.json'
      - 'stages/stage32/residual-32-01-production/full178-prefix-indexed-compression-main-checkpoint.json'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - '.github/workflows/stage32ex5-bc2-02-unknown53-direct-slice-a-preflight.yml'

permissions:
  contents: read

concurrency:
  group: stage32ex5-bc2-02-unknown53-full-exceptional-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unknown53-full-exceptional-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact solver dependencies
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Run exact full-exceptional refinement of retained unknown53
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_02_rank0_unknown53_full_exceptional_partition_exact.py \
            --manifest stages/stage32/residual-32-01-production/full178-manifest.json \
            --prefix-checkpoint stages/stage32/residual-32-01-production/full178-prefix-indexed-compression-main-checkpoint.json \
            --adapter-preflight stages/stage32-ex5/breadth-cycle-2/bc2-02-full178-target-to-59d-model-adapter-preflight.json \
            --prior-v1 stages/stage32-ex5/breadth-cycle-2/bc2-02-one-indexed-full178-terminal-picard64-v1-unknown.json \
            --branched-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-02-rank0-exceptional-mass2-branched-exact-checkpoint.json \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --subcase-timeout-ms 1000 \
            --output "$RUNNER_TEMP/bc2-02-unknown53-full-exceptional.json"
      - name: Validate exact refinement firewalls
        run: |
          python - "$RUNNER_TEMP/bc2-02-unknown53-full-exceptional.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); q=p['exact_result']; r=p['result']; x=p['partition']
          assert p['schema']=='STAGE32EX5_BC2_02_RANK0_UNKNOWN53_FULL_EXCEPTIONAL_PARTITION_EXACT_V1'
          assert p['indexed_terminal']['row_id']=='g1-d008'
          assert p['indexed_terminal']['terminal_rank']==0
          assert x['retained_parent_exact_unsat_count']==157
          assert x['retained_parent_unknown_count']==53
          assert x['selected_exceptional_count']==29
          assert x['unselected_exceptional_count']==19
          assert x['mass2_unknown_parent_count']==35
          assert x['mass1_unknown_parent_count']==18
          assert x['expected_refined_subcase_count']==377
          assert x['partition_complete_for_all_53_parent_unknown_solution_sets'] is True
          assert x['new_mathematical_condition_added'] is False
          assert q['aggregate_result'] in {'SAT','UNSAT','UNKNOWN'}
          if q['aggregate_result']=='UNSAT':
              assert q['tested_refined_subcase_count']==377
              assert q['exact_unsat_refined_subcase_count']==377
              assert q['unknown_refined_subcase_count']==0
              assert q['rank0_terminal_exact_unsat_authorized'] is True
          if q['aggregate_result']=='UNKNOWN':
              assert q['tested_refined_subcase_count']==377
              assert q['unknown_refined_subcase_count']>0
              assert q['rank0_terminal_exact_unsat_authorized'] is False
          if q['aggregate_result']=='SAT':
              assert isinstance(r['witness_r_reduced'],list) and len(r['witness_r_reduced'])==59
              assert isinstance(p['target']['z'],list) and len(p['target']['z'])==5
          assert p['firewalls']['FULL178_complete'] is False
          assert p['firewalls']['stage32_main_credit'] is False
          assert p['firewalls']['merge_authorized'] is False
          print(json.dumps({'aggregate':q['aggregate_result'],'tested':q['tested_refined_subcase_count'],'unsat':q['exact_unsat_refined_subcase_count'],'unknown':q['unknown_refined_subcase_count'],'status_sha':q['subcase_status_stream_sha256'],'canonical':p['canonical_sha256_without_this_field']},sort_keys=True))
          PY
      - name: Feed exact SAT completion into node-support consumer
        run: |
          set -euo pipefail
          STATUS=$(python - "$RUNNER_TEMP/bc2-02-unknown53-full-exceptional.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['result']['status'])
          PY
          )
          if [ "$STATUS" = SAT ]; then
            python stages/stage32-ex5/breadth-cycle-2/bc2_02_exact_witness_to_node_support.py \
              --evidence "$RUNNER_TEMP/bc2-02-unknown53-full-exceptional.json" \
              --retained stages/stage33/33-07/picard_base_rows_retained.py \
              --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
              --node-bridge stages/stage32-ex5/breadth-cycle-2/bc2-01b-runtime-node-coordinate-bridge.json \
              --output "$RUNNER_TEMP/bc2-02-unknown53-full-exceptional-support.json"
          else
            echo "full-exceptional refinement result=$STATUS; node-support consumer not invoked"
          fi
      - name: Upload compact exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-02-unknown53-full-exceptional-exact
          path: ${{ runner.temp }}/bc2-02-unknown53-full-exceptional*.json
          retention-days: 7
          compression-level: 9
