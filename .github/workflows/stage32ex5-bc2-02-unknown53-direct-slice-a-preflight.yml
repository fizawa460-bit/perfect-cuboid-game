name: Stage32EX5 BC2-08 outer-rank1 single full-exceptional refinement

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_08_outer_rank1_unknown_parent_full_exceptional_refinement.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-07-outer-rank1-parent-preflight-evidence.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-06-next-exceptional-terminal-block-preflight-checkpoint.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_02_exact_witness_to_node_support.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-01b-runtime-node-coordinate-bridge.json'
      - 'stages/stage32-ex5/runkeys/bc2-08-outer-rank1-single-refinement.json'
      - 'stages/stage32/residual-32-01-production/full178-manifest.json'
      - 'stages/stage32/residual-32-01-production/full178-prefix-indexed-compression-main-checkpoint.json'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - '.github/workflows/stage32ex5-bc2-02-unknown53-direct-slice-a-preflight.yml'

permissions:
  contents: read

concurrency:
  group: stage32ex5-bc2-08-outer-rank1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Validate fresh BC2-08 run-key arm in synchronize commit range
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          KEY='stages/stage32-ex5/runkeys/bc2-08-outer-rank1-single-refinement.json'
          BEFORE='${{ github.event.before }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          authorized=false
          if [ -n "$BEFORE" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && git diff --name-only "$BEFORE" "$HEAD" | grep -Fxq "$KEY"; then
              python - "$KEY" "$BEFORE" <<'PY'
          import json,subprocess,sys
          key,before=sys.argv[1:]
          new=json.load(open(key))
          if new.get('schema')!='STAGE32EX5_BC2_08_OUTER_RANK1_SINGLE_REFINEMENT_RUNKEY_V1':
              raise SystemExit('run-key schema mismatch')
          if new.get('armed') is not True:
              raise SystemExit('run-key is not armed')
          if new.get('source_commit')!='ab693cf6acd0df1c11faced30294f6be04feb112':
              raise SystemExit('BC2-08 source commit lock mismatch')
          if new.get('terminal_rank_block') != [133,265]:
              raise SystemExit('terminal block lock mismatch')
          if int(new.get('unknown_parent_id',-1)) != 7:
              raise SystemExit('unknown parent ID lock mismatch')
          if int(new.get('expected_refinement_subcases',0)) != 1:
              raise SystemExit('single refinement count lock mismatch')
          if int(new.get('refine_timeout_ms',0)) != 5000:
              raise SystemExit('refinement timeout lock mismatch')
          if new.get('bc2_07_evidence_canonical_sha256')!='c40f658608019cdc3094d96e153ed9974937828b686660151f2904cda1893efe':
              raise SystemExit('BC2-07 evidence lock mismatch')
          if int(new.get('projected_max_artifact_bytes',0)) > 200000:
              raise SystemExit('artifact projection exceeds BC2-08 ceiling')
          if int(new.get('artifact_retention_days',0)) != 1:
              raise SystemExit('transient artifact retention must be one day')
          if int(new.get('effective_heavy_concurrency',0)) != 1:
              raise SystemExit('effective heavy concurrency must be one')
          old_generation=-1
          try:
              old_text=subprocess.check_output(['git','show',f'{before}:{key}'],text=True,stderr=subprocess.DEVNULL)
              old_generation=int(json.loads(old_text).get('generation',-1))
          except subprocess.CalledProcessError:
              pass
          if int(new.get('generation',-1)) <= old_generation:
              raise SystemExit('run-key generation did not advance')
          print('BC2_08_RUNKEY_FRESH_ARM_OK')
          PY
              authorized=true
            fi
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "BC2_08_HEAVY_AUTHORIZED=$authorized"

  single-full-exceptional-refinement:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact solver dependencies
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Compile BC2-08 solver
        run: python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_08_outer_rank1_unknown_parent_full_exceptional_refinement.py
      - name: Run exact single full-exceptional refinement
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_08_outer_rank1_unknown_parent_full_exceptional_refinement.py \
            --manifest stages/stage32/residual-32-01-production/full178-manifest.json \
            --prefix-checkpoint stages/stage32/residual-32-01-production/full178-prefix-indexed-compression-main-checkpoint.json \
            --adapter-preflight stages/stage32-ex5/breadth-cycle-2/bc2-02-full178-target-to-59d-model-adapter-preflight.json \
            --bc2-06-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-06-next-exceptional-terminal-block-preflight-checkpoint.json \
            --bc2-07-evidence stages/stage32-ex5/breadth-cycle-2/bc2-07-outer-rank1-parent-preflight-evidence.json \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --refine-timeout-ms 5000 \
            --output "$RUNNER_TEMP/bc2-08-outer-rank1-refinement.json"
      - name: Validate single refinement and firewalls
        run: |
          python - "$RUNNER_TEMP/bc2-08-outer-rank1-refinement.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); t=p['retained_parent_partition']; q=p['full_exceptional_refinement']; r=p['exact_result']; f=p['firewalls']
          assert p['schema']=='STAGE32EX5_BC2_08_OUTER_RANK1_UNKNOWN_PARENT_FULL_EXCEPTIONAL_REFINEMENT_V1'
          assert t['parent_branch_count']==20 and t['exact_unsat_parents_retained_without_rerun']==19
          assert t['unknown_parents_refined_only']==1 and t['bc2_07_parent_partition_recomputed_for_credit'] is False
          assert t['unknown_parent_assignment_reconstructed_from_canonical_partition'] is True
          assert t['unknown_parent_id']==7 and t['selected_assignment_sparse_labels_1based']==[[121,1]]
          assert q['expected_subcase_count']==1 and q['tested_subcase_count']==1
          assert q['all_48_exceptional_pairings_fixed_in_tested_subcase'] is True
          assert q['unselected_exceptional_pairings_all_zero'] is True
          assert q['x4_kept_symbolic_over_full_range'] is True and q['x4_range']==[0,132]
          assert q['new_mathematical_condition_added'] is False
          assert r['aggregate_result'] in {'SAT','UNSAT','UNKNOWN'}
          if r['aggregate_result']=='UNSAT':
              assert q['exact_unsat_subcase_count']==1 and q['unknown_subcase_count']==0 and q['sat_subcase_count']==0
              assert r['rank_133_to_265_block_exact_unsat_authorized'] is True
              assert r['retained_19_plus_refined_1_partition_complete'] is True
              assert p['next_exact_unit']['id']=='BC2_09_NEXT_EXCEPTIONAL_TERMINAL_BLOCK_PREFLIGHT'
          elif r['aggregate_result']=='SAT':
              assert q['sat_subcase_count']==1
              assert isinstance(p['result']['witness_r_reduced'],list) and len(p['result']['witness_r_reduced'])==59
              assert p['next_exact_unit']['id']=='BC2_08_SAT_NODE_SUPPORT_CONSUMPTION'
          else:
              assert q['unknown_subcase_count']==1
              assert r['rank_133_to_265_block_exact_unsat_authorized'] is False
              assert p['next_exact_unit']['id']=='BC2_08_SINGLE_SUBCASE_EXACT_SOLVER_REFINEMENT'
          assert f['rank_0_to_132_block_exact_unsat_retained'] is True
          assert f['whole_g1_d008_e4_stratum_closed'] is False
          assert f['FULL178_complete'] is False and f['stage32_main_credit'] is False
          assert f['receiver_credit'] is False and f['Q602_excluded'] is False and f['O210_excluded'] is False
          assert f['merge_authorized'] is False
          print(json.dumps({'aggregate':r['aggregate_result'],'whole_block_unsat':r['rank_133_to_265_block_exact_unsat_authorized'],'canonical':p['canonical_sha256_without_this_field'],'sat_subcase':p['sat_subcase']},sort_keys=True))
          PY
      - name: Feed BC2-08 SAT completion into node-support consumer
        run: |
          set -euo pipefail
          STATUS=$(python - "$RUNNER_TEMP/bc2-08-outer-rank1-refinement.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['result']['status'])
          PY
          )
          if [ "$STATUS" = SAT ]; then
            python stages/stage32-ex5/breadth-cycle-2/bc2_02_exact_witness_to_node_support.py \
              --evidence "$RUNNER_TEMP/bc2-08-outer-rank1-refinement.json" \
              --retained stages/stage33/33-07/picard_base_rows_retained.py \
              --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
              --node-bridge stages/stage32-ex5/breadth-cycle-2/bc2-01b-runtime-node-coordinate-bridge.json \
              --output "$RUNNER_TEMP/bc2-08-outer-rank1-support.json"
          else
            echo "BC2-08 result=$STATUS; node-support consumer not invoked"
          fi
      - name: Upload compact BC2-08 evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-08-outer-rank1-refinement
          path: ${{ runner.temp }}/bc2-08-outer-rank1*.json
          retention-days: 1
          compression-level: 9
