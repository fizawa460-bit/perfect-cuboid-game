name: Stage32EX5 BC2-05 symbolic x4 unknown-parent refinement

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_05_symbolic_x4_unknown_parent_full_exceptional_refinement.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-04-x4-block-compression-preflight-checkpoint.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-04-x4-block-unknown-parent-ledger.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-03-rank1-exact-unsat-checkpoint.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-02-rank0-exact-unsat-checkpoint.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_02_exact_witness_to_node_support.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-01b-runtime-node-coordinate-bridge.json'
      - 'stages/stage32-ex5/runkeys/bc2-05-symbolic-x4-refinement.json'
      - 'stages/stage32/residual-32-01-production/full178-manifest.json'
      - 'stages/stage32/residual-32-01-production/full178-prefix-indexed-compression-main-checkpoint.json'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_family.py'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_indexer.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - '.github/workflows/stage32ex5-bc2-02-unknown53-direct-slice-a-preflight.yml'

permissions:
  contents: read

concurrency:
  group: stage32ex5-bc2-05-x4-refine-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Validate fresh BC2-05 run-key arm in synchronize commit range
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          KEY='stages/stage32-ex5/runkeys/bc2-05-symbolic-x4-refinement.json'
          BEFORE='${{ github.event.before }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          authorized=false
          if [ -n "$BEFORE" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && git diff --name-only "$BEFORE" "$HEAD" | grep -Fxq "$KEY"; then
              python - "$KEY" "$BEFORE" <<'PY'
          import json,subprocess,sys
          key,before=sys.argv[1:]
          new=json.load(open(key))
          if new.get('schema')!='STAGE32EX5_BC2_05_SYMBOLIC_X4_REFINEMENT_RUNKEY_V1':
              raise SystemExit('run-key schema mismatch')
          if new.get('armed') is not True:
              raise SystemExit('run-key is not armed')
          if new.get('source_commit')!='bdfbf39a7dd501932dc1d2aea44a3b5975f73eff':
              raise SystemExit('BC2-05 source commit lock mismatch')
          if new.get('terminal_rank_block') != [0,132]:
              raise SystemExit('terminal block lock mismatch')
          if int(new.get('unknown_parent_count',0)) != 52:
              raise SystemExit('unknown parent count lock mismatch')
          if int(new.get('refined_subcase_count',0)) != 376:
              raise SystemExit('refined subcase count lock mismatch')
          if int(new.get('refine_timeout_ms',0)) != 1500:
              raise SystemExit('refine timeout lock mismatch')
          if new.get('bc2_04_evidence_canonical_sha256')!='5da62963fdaf6e3fec6e52c6c7fca4c269e154c553f62c962ba8bf23dd8d247b':
              raise SystemExit('BC2-04 evidence lock mismatch')
          if new.get('unknown_parent_ledger_canonical_sha256')!='fb4a5d1a61e1e1260636ec093f8b355991befa2c2e432cfb5e45ad5b5012f3ac':
              raise SystemExit('unknown parent ledger lock mismatch')
          if int(new.get('projected_max_artifact_bytes',0)) > 200000:
              raise SystemExit('artifact projection exceeds BC2-05 ceiling')
          if int(new.get('artifact_retention_days',0)) != 1:
              raise SystemExit('transient artifact retention must be one day')
          if int(new.get('effective_heavy_concurrency',0)) != 1:
              raise SystemExit('effective heavy concurrency must be one')
          old_generation=-1
          try:
              old_text=subprocess.check_output(['git','show',f'{before}:{key}'],text=True,stderr=subprocess.DEVNULL)
              old_generation=int(json.loads(old_text).get('generation',-1))
          except subprocess.CalledProcessError:
              pass
          if int(new.get('generation',-1)) <= old_generation:
              raise SystemExit('run-key generation did not advance')
          print('BC2_05_RUNKEY_FRESH_ARM_OK')
          PY
              authorized=true
            fi
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "BC2_05_HEAVY_AUTHORIZED=$authorized"

  symbolic-x4-unknown-parent-refinement:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact solver dependencies
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Compile BC2-05 solver
        run: python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_05_symbolic_x4_unknown_parent_full_exceptional_refinement.py
      - name: Run exact 52-parent / 376-subcase refinement
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_05_symbolic_x4_unknown_parent_full_exceptional_refinement.py \
            --manifest stages/stage32/residual-32-01-production/full178-manifest.json \
            --prefix-checkpoint stages/stage32/residual-32-01-production/full178-prefix-indexed-compression-main-checkpoint.json \
            --adapter-preflight stages/stage32-ex5/breadth-cycle-2/bc2-02-full178-target-to-59d-model-adapter-preflight.json \
            --rank0-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-02-rank0-exact-unsat-checkpoint.json \
            --rank1-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-03-rank1-exact-unsat-checkpoint.json \
            --block-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-04-x4-block-compression-preflight-checkpoint.json \
            --unknown-parent-ledger stages/stage32-ex5/breadth-cycle-2/bc2-04-x4-block-unknown-parent-ledger.json \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --refine-timeout-ms 1500 \
            --output "$RUNNER_TEMP/bc2-05-symbolic-x4-refinement.json"
      - name: Validate exact refinement partition and firewalls
        run: |
          python - "$RUNNER_TEMP/bc2-05-symbolic-x4-refinement.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); q=p['full_exceptional_refinement']; r=p['exact_result']; t=p['retained_parent_partition']
          assert p['schema']=='STAGE32EX5_BC2_05_SYMBOLIC_X4_UNKNOWN_PARENT_FULL_EXCEPTIONAL_REFINEMENT_V1'
          assert t['parent_branch_count']==210
          assert t['exact_unsat_parents_retained_without_rerun']==158
          assert t['unknown_parents_refined_only']==52
          assert t['bc2_04_parent_partition_recomputed_for_credit'] is False
          assert t['unknown_parent_assignments_reconstructed_from_canonical_partition'] is True
          assert q['expected_subcase_count']==376
          assert 0 <= q['tested_subcase_count'] <= 376
          assert q['all_48_exceptional_pairings_fixed_in_each_tested_subcase'] is True
          assert q['x4_kept_symbolic_over_full_range'] is True
          assert q['x4_range']==[0,132]
          assert q['new_mathematical_condition_added'] is False
          assert r['aggregate_result'] in {'SAT','UNSAT','UNKNOWN'}
          if r['aggregate_result']=='UNSAT':
              assert q['tested_subcase_count']==376
              assert q['exact_unsat_subcase_count']==376
              assert q['unknown_subcase_count']==0
              assert q['sat_subcase_found'] is False
              assert r['whole_rank_0_to_132_block_exact_unsat_authorized'] is True
              assert r['retained_158_plus_refined_376_partition_complete'] is True
              assert p['next_exact_unit']['id']=='BC2_06_NEXT_EXCEPTIONAL_TERMINAL_BLOCK_PREFLIGHT'
          if r['aggregate_result']=='SAT':
              assert q['sat_subcase_found'] is True
              assert p['sat_subcase'] is not None
              assert isinstance(p['result']['witness_r_reduced'],list) and len(p['result']['witness_r_reduced'])==59
              assert 0 <= p['sat_subcase']['x4'] <= 132
              assert p['next_exact_unit']['id']=='BC2_05_SAT_NODE_SUPPORT_CONSUMPTION'
          if r['aggregate_result']=='UNKNOWN':
              assert q['unknown_subcase_count']>0
              assert r['whole_rank_0_to_132_block_exact_unsat_authorized'] is False
              assert p['next_exact_unit']['id']=='BC2_05_UNKNOWN_SUBCASE_REFINEMENT'
          assert p['firewalls']['whole_g1_d008_e4_stratum_closed'] is False
          assert p['firewalls']['FULL178_complete'] is False
          assert p['firewalls']['stage32_main_credit'] is False
          assert p['firewalls']['merge_authorized'] is False
          print(json.dumps({'aggregate':r['aggregate_result'],'tested':q['tested_subcase_count'],'exact_unsat':q['exact_unsat_subcase_count'],'unknown':q['unknown_subcase_count'],'sat_subcase':p['sat_subcase'],'whole_block_unsat':r['whole_rank_0_to_132_block_exact_unsat_authorized'],'canonical':p['canonical_sha256_without_this_field']},sort_keys=True))
          PY
      - name: Feed BC2-05 SAT completion into node-support consumer
        run: |
          set -euo pipefail
          STATUS=$(python - "$RUNNER_TEMP/bc2-05-symbolic-x4-refinement.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['result']['status'])
          PY
          )
          if [ "$STATUS" = SAT ]; then
            python stages/stage32-ex5/breadth-cycle-2/bc2_02_exact_witness_to_node_support.py \
              --evidence "$RUNNER_TEMP/bc2-05-symbolic-x4-refinement.json" \
              --retained stages/stage33/33-07/picard_base_rows_retained.py \
              --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
              --node-bridge stages/stage32-ex5/breadth-cycle-2/bc2-01b-runtime-node-coordinate-bridge.json \
              --output "$RUNNER_TEMP/bc2-05-symbolic-x4-support.json"
          else
            echo "BC2-05 refinement result=$STATUS; node-support consumer not invoked"
          fi
      - name: Upload compact BC2-05 evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-05-symbolic-x4-refinement
          path: ${{ runner.temp }}/bc2-05-symbolic-x4*.json
          retention-days: 1
          compression-level: 9
