name: Stage32 scout d16 140-first LIA

on:
  pull_request:
    paths:
      - 'stages/stage32/scouts/d16_140first_lia_scout.py'
      - '.github/workflows/stage32-scout-d16-140first-lia.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d16-140first-lia-scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact linear integer solver
        run: pip install z3-solver==4.15.3.0
      - name: Download source-locked Stage32 Picard core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/core"
          gh run download 32624596141 --repo fizawa460-bit/perfect-cuboid-game \
            --name stage32-01-low-degree-verified-prefix --dir "$RUNNER_TEMP/core"
          test -s "$RUNNER_TEMP/core/picard-core.json"
      - name: Apply all 140 linear caps first, then exact norm filter
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python stages/stage32/scouts/d16_140first_lia_scout.py \
            --core "$RUNNER_TEMP/core/picard-core.json" \
            --output "$RUNNER_TEMP/out/d16-140first-lia-scout.json" \
            --max-models 200000 \
            --max-seconds 600 \
            --check-timeout-ms 10000
      - name: Enforce scout storage and firewalls
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'/'d16-140first-lia-scout.json'
          assert p.stat().st_size < 2_000_000
          r=json.loads(p.read_text())
          assert r['THEOREM_CREDIT'] is False
          assert r['RECEIVER_CREDIT'] is False
          assert r['FULL_D16_G0_ROW_COMPLETE'] is False
          assert r['architecture']['materialized_branch_count_constructed'] == 0
          assert r['architecture']['short_vector_ball_materialized'] is False
          assert r['architecture']['quadratic_constraint_inside_solver'] is False
          print({k:r[k] for k in ('terminal_status','linear_models_exactly_checked','norm_le_34_survivors_in_prefix','elapsed_seconds','minimum_exact_norm_seen')})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-scout-d16-140first-lia
          path: ${{ runner.temp }}/out/d16-140first-lia-scout.json
          retention-days: 7
          if-no-files-found: error
