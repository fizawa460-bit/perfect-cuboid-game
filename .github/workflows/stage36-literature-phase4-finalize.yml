name: Stage36 literature Phase4 finalizer

on:
  push:
    branches:
      - arsenal-stage36-literature-strengthening-implementation

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin Phase3 freeze
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/fizawa460-bit/perfect-cuboid-game/f1a2d3074e802b0fd4555cb827e165c3de2bdfc9/docs/arsenal/literature-stage36-hostile-freeze.json \
            -o /tmp/stage36-phase3-freeze.json

      - name: Materialize registry from frozen accepted set
        run: |
          python3 -B docs/arsenal/_stage36_lit_phase4_impl.py

      - name: Normalize Phase3 manifest and LIT-WF02 provenance
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          idx_path = Path('docs/arsenal/index.json')
          contract_path = Path('docs/arsenal/lit-wf02-global-h1-localization-reciprocity-contract.json')
          verifier_path = Path('docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py')
          promo_path = Path('docs/stage36-literature-strengthening-promotion.md')
          p3 = json.loads(Path('/tmp/stage36-phase3-freeze.json').read_text())

          c = json.loads(contract_path.read_text())
          c['implementation_pr'] = 1692
          c['implementation_base_main'] = 'e758e05953df2cf8cd4ab26ac1e9d72374e99760'
          c['literature_audit_pr'] = 1690
          c['literature_audit_exact_head'] = 'f1a2d3074e802b0fd4555cb827e165c3de2bdfc9'
          for paper in c['literature']:
              paper['journal_or_publisher'] = paper.get('publisher') or paper.get('journal_or_publisher')
              if paper['authors'] == 'Jean-Pierre Serre':
                  paper['exact_hypotheses_summary'] = 'fixed global field and fixed squareclass/quadratic-form data with all local Hilbert-symbol inputs normalized at the relevant finite, dyadic and real places'
                  paper['conditional_assumptions'] = 'the repo rows must already be proved to be localizations/evaluations of one fixed global class system; the product formula alone is not an obstruction'
              else:
                  paper['exact_hypotheses_summary'] = 'one fixed finite global Galois module over one fixed global field, with the required localization maps and local conditions entering Poitou-Tate duality'
                  paper['conditional_assumptions'] = 'Poitou-Tate use is inactive until the repo supplies and verifies the genuine fixed global module/class and exact localizations'
          contract_path.write_text(json.dumps(c, indent=2, ensure_ascii=False) + '\n')

          contract_blob = subprocess.check_output(['git','hash-object',str(contract_path)], text=True).strip()
          verifier_blob = subprocess.check_output(['git','hash-object',str(verifier_path)], text=True).strip()

          idx = json.loads(idx_path.read_text())
          s = idx['stage36_literature_strengthening']
          # Exact Phase3 implementation boundary: do not reinterpret or expand it.
          s['implementation_manifest'] = p3['implementation_manifest']
          s['phase3_classifications'] = p3['classifications']
          s['phase3_freeze_schema'] = p3['schema']
          s['phase3_freeze_exact_head'] = 'f1a2d3074e802b0fd4555cb827e165c3de2bdfc9'
          wf = s['workflow_metadata']['LIT-WF02']
          wf['stable_id'] = 'LIT-WF02'
          wf['candidate_id'] = 'GLOBAL-H1-LOCALIZATION-RECIPROCITY-AUDIT'
          wf['support_artifact_path'] = str(contract_path)
          wf['support_artifact_blob_sha'] = contract_blob
          wf['verifier_path'] = str(verifier_path)
          wf['verifier_blob_sha'] = verifier_blob
          wf['repo_adapter_contract'] = 'STAGE36_SOURCE_RESULT -> REPO_GLOBAL_CLASS_LOCALIZATION_ADAPTER (must be separately proved) -> SERRE/MILNE_THEOREM_INPUTS -> TYPED_GLOBAL_LOCAL_PACKAGE; workflow audits readiness only and never manufactures the missing adapter'
          wf['adapter_status'] = 'FAIL_CLOSED_UNTIL_SEPARATE_MATHEMATICAL_ADAPTER_PASS'
          wf['maturity'] = 'PROVISIONAL'
          idx_path.write_text(json.dumps(idx, indent=2, ensure_ascii=False) + '\n')

          promo = promo_path.read_text()
          old = 'Adapter source/verifier: **not yet present**; the workflow itself is the fail-closed applicability procedure and carries zero mathematical credit.'
          new = f'Workflow support artifact: `docs/arsenal/lit-wf02-global-h1-localization-reciprocity-contract.json`, blob `{contract_blob}`. Structural verifier: `docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py`, blob `{verifier_blob}`. These audit typed readiness only; a separate mathematical adapter is still required for theorem use and mathematical credit remains zero.'
          assert old in promo
          promo = promo.replace(old, new)
          old_gap = '`GLOBAL-HILBERT-SELMER-COMPATIBILITY-TERMINAL` remains **RESEARCH_GAP**. Required missing adapter: `DYNAMIC_RESERVOIR_ROWS_TO_GLOBAL_KUMMER_LOCALIZATION_SYSTEM`. No `POSSIBLY_NOVEL` item is activated; the Phase3 novelty flag list is empty.'
          new_gap = '''Phase3 freezes the following research gaps; none is activated as a weapon:\n\n- `GLOBAL-HILBERT-SELMER-COMPATIBILITY-TERMINAL` — missing `DYNAMIC_RESERVOIR_ROWS_TO_GLOBAL_KUMMER_LOCALIZATION_SYSTEM`.\n- `S36-PW03/B12 exact Loughran-Salgado hypothesis match`.\n- `S36-PW04 chart-to-global-H1 adapter`.\n- `S36-PW06 full-MW basis/saturation only if stronger claim attempted`.\n- `B01 source subgroup equivalence`.\n\nNo `POSSIBLY_NOVEL` item is activated; the Phase3 novelty flag list is empty.'''
          assert old_gap in promo
          promo_path.write_text(promo.replace(old_gap, new_gap))
          print('PASS: exact Phase3 manifest and LIT-WF02 support provenance normalized')
          print('LIT_WF02_CONTRACT_BLOB=' + contract_blob)
          print('LIT_WF02_VERIFIER_BLOB=' + verifier_blob)
          PY

      - name: Generate Arsenal cards and catalog
        run: |
          python3 -B docs/arsenal/sync_arsenal_catalog.py

      - name: LIT-WF02 structural self-check
        run: |
          python3 -B docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py --self-check

      - name: Remove all temporary implementation machinery
        run: |
          rm -f docs/arsenal/.stage36-literature-phase4-runkey
          rm -f docs/arsenal/_stage36_lit_phase4_impl.py
          rm -f .github/workflows/stage36-literature-phase4-implementation.yml
          rm -f .github/workflows/stage36-literature-phase4-hotfix.yml
          rm -f .github/workflows/stage36-literature-phase4-finalize.yml

      - name: Validate final materialized tree before commit
        run: |
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          git diff --check
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          BASE='e758e05953df2cf8cd4ab26ac1e9d72374e99760'
          idx=json.loads(Path('docs/arsenal/index.json').read_text())
          p3=json.loads(Path('/tmp/stage36-phase3-freeze.json').read_text())
          s=idx['stage36_literature_strengthening']
          assert s['implementation_manifest'] == p3['implementation_manifest']
          assert s['phase3_classifications'] == p3['classifications']
          assert s['literature_audit_pr'] == 1690
          assert s['literature_audit_exact_head'] == 'f1a2d3074e802b0fd4555cb827e165c3de2bdfc9'
          assert s['arsenal_base_main'] == '386b6a52d7bfec2e8903412c7ca56976b46c288b'
          assert s['implementation_base_main'] == BASE
          assert s['stage36_arsenal_source_head'] == '2fc3f4b8afb28bb23765bd861cbd7c52aafd6563'
          assert s['literature_population_expanded'] is False
          f=s['credit_firewall']
          zeros=['STAGE36_PROGRESS_INCREMENT','STAGE36_THEOREM_CREDIT_INCREMENT','RECEIVER_CLOSURE_INCREMENT','MW_CLOSURE_INCREMENT','LOCAL_GLOBAL_OBSTRUCTION_INCREMENT','ENDPOINT_CREDIT_INCREMENT']
          assert all(f[k] == 0 for k in zeros)
          assert f['LITERATURE_ARSENAL_REGISTRATION_DOES_NOT_CHANGE_STAGE36_MATHEMATICAL_AUTHORITY'] is True
          assert f['PERFECT_CUBOID_EXISTENCE_CLAIM'] is False
          assert f['PERFECT_CUBOID_NONEXISTENCE_CLAIM'] is False
          assert f['NOVEL'] is False and f['FIRST_PROOF'] is False and f['NEW_THEOREM'] is False

          accepted=s['accepted_item_metadata']
          assert set(accepted)=={'S36-PW02','S36-PW03','S36-PW04','S36-PW06','S36-PW07','DISC-S36-B01->S30-W01','DISC-S36-B08->S31-W01','DISC-S36-B12->S34-W02'}
          for item in accepted.values():
              assert item['theorem_hypotheses_summary'] and item['conclusion_summary']
              assert item['repo']['repo_adapter_contract']
              assert len(item['repo']['stage36_source_exact_head']) == 40
              assert len(item['repo']['source_or_certificate_blob_sha']) == 40
              assert len(item['repo']['verifier_blob_sha']) == 40
              for paper in item['literature']:
                  for key in ('authors','title','journal_or_publisher','year','theorem_identifier','source_type','conditional_assumptions'):
                      assert paper.get(key) not in (None,''), (item['proposed_role'], key)
                  assert paper.get('doi') or paper.get('canonical_url')

          assert set(s['source_anchor_only']) == {'S36-PW01','S36-PW05'}
          wf=s['workflow_metadata']['LIT-WF02']
          assert wf['classification']=='NEW_LITERATURE_WORKFLOW'
          assert wf['maturity']=='PROVISIONAL'
          assert len(wf['support_artifact_blob_sha'])==40 and len(wf['verifier_blob_sha'])==40
          assert wf['adapter_status']=='FAIL_CLOSED_UNTIL_SEPARATE_MATHEMATICAL_ADAPTER_PASS'
          c=json.loads(Path(wf['support_artifact_path']).read_text())
          assert c['stable_id']=='LIT-WF02' and c['maturity']=='PROVISIONAL'
          for paper in c['literature']:
              for key in ('authors','title','journal_or_publisher','year','canonical_url','theorem_identifier','exact_hypotheses_summary','conclusion_summary','conditional_assumptions','source_type'):
                  assert paper.get(key) not in (None,''), key
              assert paper.get('doi') or paper.get('canonical_url')

          stage36_h=[h for h in idx['provisional_harvests'] if h.get('source_stage')=='Stage36 Literature Strengthening']
          assert len(stage36_h)==1
          assert stage36_h[0]['active_cards']==[] and stage36_h[0]['active_workflows']==['LIT-WF02']
          assert stage36_h[0]['stage36_mathematical_credit_added'] is False

          changed=set(subprocess.check_output(['git','diff','--name-only',BASE], text=True).splitlines())
          fixed={'docs/stage36-literature-strengthening-promotion.md','docs/arsenal/index.json','docs/arsenal/catalog.md','docs/arsenal/lit-wf02-global-h1-localization-reciprocity-contract.json','docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py'}
          assert fixed <= changed
          assert all(p in fixed or p.startswith('docs/arsenal/cards/') for p in changed), changed
          assert not any(p.startswith('stages/stage36/') for p in changed)
          assert not any(p.startswith('.github/workflows/') for p in changed)
          assert 'docs/arsenal/_stage36_lit_phase4_impl.py' not in changed
          assert 'docs/arsenal/.stage36-literature-phase4-runkey' not in changed
          print('PASS: Phase3 exact manifest, literature provenance, adapter separation, credit firewall, and exact final scope')
          print('FINAL_CHANGED=' + ','.join(sorted(changed)))
          PY

      - name: Commit final materialized state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[Arsenal][Literature][Stage36] materialize frozen Phase3 strengthening'

      - name: Exact committed-head validation
        run: |
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          python3 -B docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py --self-check
          git diff --check HEAD^ HEAD
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          BASE='e758e05953df2cf8cd4ab26ac1e9d72374e99760'
          idx=json.loads(Path('docs/arsenal/index.json').read_text())
          p3=json.loads(Path('/tmp/stage36-phase3-freeze.json').read_text())
          s=idx['stage36_literature_strengthening']
          assert s['implementation_manifest']==p3['implementation_manifest']
          assert s['phase3_classifications']==p3['classifications']
          changed=set(subprocess.check_output(['git','diff','--name-only',BASE,'HEAD'], text=True).splitlines())
          fixed={'docs/stage36-literature-strengthening-promotion.md','docs/arsenal/index.json','docs/arsenal/catalog.md','docs/arsenal/lit-wf02-global-h1-localization-reciprocity-contract.json','docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py'}
          assert all(p in fixed or p.startswith('docs/arsenal/cards/') for p in changed), changed
          assert not any(p.startswith('stages/stage36/') or p.startswith('.github/workflows/') for p in changed)
          assert not Path('.github/workflows/stage36-literature-phase4-finalize.yml').exists()
          assert not Path('.github/workflows/stage36-literature-phase4-hotfix.yml').exists()
          assert not Path('.github/workflows/stage36-literature-phase4-implementation.yml').exists()
          print('PASS: exact committed final head scope')
          print('EXACT_HEAD=' + subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          PY

      - name: Push exact validated final head
        run: |
          git push origin HEAD:arsenal-stage36-literature-strengthening-implementation
