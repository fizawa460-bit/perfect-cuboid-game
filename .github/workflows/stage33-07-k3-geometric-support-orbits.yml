name: Stage33-07 k3 geometric Q2/2Q support orbits

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'stages/stage33/33-07/certify_nonelementary_k3_geometric_q2_2q_support_orbits.py'
      - 'stages/stage33/33-07/certify_nonelementary_target_q4_rank_obstruction.py'
      - 'stages/stage33/33-07/certify_nonelementary_target_q8_exponent_reduction.py'
      - 'stages/stage33/33-07/certify_nonelementary_sign_q2_structural_reduction.py'
      - 'stages/stage33/33-07/picard-discriminant-compact.json'
      - '.github/workflows/stage33-07-k3-geometric-support-orbits.yml'

permissions:
  contents: read

jobs:
  exact-k3-geometric-support-orbits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact Q4-rank prerequisite
        run: python stages/stage33/33-07/certify_nonelementary_target_q4_rank_obstruction.py
      - name: Exact k3 Q2/2Q geometric support orbit census
        run: python stages/stage33/33-07/certify_nonelementary_k3_geometric_q2_2q_support_orbits.py
      - name: Upload exact certificate
        uses: actions/upload-artifact@v4
        with:
          name: stage33-07-k3-geometric-support-orbits
          path: stages/stage33/33-07/nonelementary-k3-geometric-q2-2q-support-orbits.json
          if-no-files-found: error
