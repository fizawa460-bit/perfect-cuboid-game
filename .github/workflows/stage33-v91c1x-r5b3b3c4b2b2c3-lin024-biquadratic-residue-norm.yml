name: Stage33 V91C1X C4B2B2C3 LIN024 biquadratic residue norm

on:
  push:
    branches:
      - stage33-v91c1x-r5b3b3c4b1e-1757-refinement-unit-preflight
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b2b2c3-lin024-biquadratic-residue-norm.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b2b2c3_lin024_four_component_biquadratic_residue_norm.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b2-a2-02-formal-tame-symbol-hidden-carrier-inventory.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4a-tame-residue-parity-and-cross-carrier-preflight.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b2c2-lin024-actual-four-component-prime-incidence.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Materialize LIN024 four-component biquadratic residue norm
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b2b2c3_lin024_four_component_biquadratic_residue_norm.py --write
      - name: Enforce artifact-only bounded delta
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b2c3-lin024-four-component-biquadratic-residue-norm.json'
          changed="$(git status --porcelain | sed 's/^...//')"
          test -n "$changed"
          test "$changed" = "$artifact"
          git diff --check
      - name: Commit generated certificate
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b2c3-lin024-four-component-biquadratic-residue-norm.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$artifact"
          git diff --cached --quiet || git commit -m '[Stage33] materialize C4B2B2C3 LIN024 biquadratic residue norm'
          git push
