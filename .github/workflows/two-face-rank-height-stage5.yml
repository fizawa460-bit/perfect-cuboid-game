name: Two-face rank and height stage 5

on:
  pull_request:
    paths:
      - "data/two_face_cuboids_1e6_mordell_weil_relations.json"
      - "data/two_face_cuboids_1e6_stage5_report.json"
      - "docs/face-ratio-geometry-research.md"
      - "scripts/audit_two_face_rank_height_stage5.py"
      - "scripts/audit_two_face_rank_height_stage5_runner.py"
      - "scripts/update_two_face_stage5_memo.py"
      - ".github/workflows/two-face-rank-height-stage5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rank-generator-height:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PARI GP
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pari-gp
          gp --version

      - name: Run stage-five audit
        run: |
          python scripts/audit_two_face_rank_height_stage5_runner.py \
            --rank-efforts 4,8 \
            --rank-timeout-per-attempt 900 \
            --generator-saturation-bound 100 \
            --write-report generated-two-face-stage5-report.json

      - name: Generate stage-five memo
        run: |
          python scripts/update_two_face_stage5_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --report generated-two-face-stage5-report.json \
            --output generated-face-ratio-geometry-research.md
          grep -n "4.14 未確定rank" generated-face-ratio-geometry-research.md
          grep -n "P=2G" generated-face-ratio-geometry-research.md

      - name: Compare committed outputs when present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          committed = Path("data/two_face_cuboids_1e6_stage5_report.json")
          generated = Path("generated-two-face-stage5-report.json")
          if committed.exists():
              expected = json.loads(committed.read_text(encoding="utf-8"))
              actual = json.loads(generated.read_text(encoding="utf-8"))
              if expected != actual:
                  raise SystemExit(f"{committed} differs from regenerated output")
          else:
              print(f"{committed} is not committed yet; skipping comparison")
          PY

      - name: Commit reproducible outputs to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cp generated-two-face-stage5-report.json data/two_face_cuboids_1e6_stage5_report.json
          cp generated-face-ratio-geometry-research.md docs/face-ratio-geometry-research.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/two_face_cuboids_1e6_stage5_report.json \
            docs/face-ratio-geometry-research.md
          if git diff --cached --quiet; then
            echo "Generated outputs are already current"
          else
            git commit -m "Record stage-five rank and height audit"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Upload stage-five outputs
        uses: actions/upload-artifact@v4
        with:
          name: two-face-rank-height-stage5
          path: |
            generated-two-face-stage5-report.json
            generated-face-ratio-geometry-research.md
