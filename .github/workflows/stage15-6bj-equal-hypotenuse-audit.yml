name: Stage15-6bj equal hypotenuse audit
on:
  pull_request:
    paths:
      - 'stages/stage15/15-6bj/**'
      - 'stages/stage15/evidence/stage15_6bj_equal_hypotenuse_audit.json'
      - 'stages/stage15/replay/verify_stage15_6bj.py'
      - 'stages/stage15/scripts/stage15_6bj_equal_hypotenuse_audit.py'
      - '.github/workflows/stage15-6bj-equal-hypotenuse-audit.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python stages/stage15/replay/verify_stage15_6bj.py
      - run: python -m py_compile stages/stage15/scripts/stage15_6bj_equal_hypotenuse_audit.py
