name: Stage32EX2 EX2-03D compact zero-curve geometry

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - 'stages/stage32-ex2/runkeys/ex2-03d-zero-curve-geometry.json'

permissions:
  contents: read

concurrency:
  group: stage32ex2-ex2-03d-zero-curve-geometry-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      armed: ${{ steps.gate.outputs.armed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          key = json.loads(Path('stages/stage32-ex2/runkeys/ex2-03d-zero-curve-geometry.json').read_text())
          assert key['schema'] == 'STAGE32EX2_EX2_03D_ZERO_CURVE_GEOMETRY_RUNKEY_V1'
          assert key['generation'] == 1
          assert key['armed'] is True
          assert key['target_head_parent'] == '1eab5613b3d3858cbc07669666580e654186a0ab'
          assert key['diagnostic_blob_sha1'] == '9df4d917332610e68a48641c58805a541111b5ff'
          print('armed=true')
          with open('/tmp/gate.txt', 'w') as f:
              f.write('armed=true\n')
          PY
          cat /tmp/gate.txt >> "$GITHUB_OUTPUT"

  compute:
    needs: authorize
    if: needs.authorize.outputs.armed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Replay compact EX2-03D geometry
        run: |
          python -B stages/stage32-ex2/diagnose_ex2_03d_zero_curve_geometry.py > /tmp/ex2-03d.json
          python - <<'PY'
          import json
          p='/tmp/ex2-03d.json'
          x=json.load(open(p))
          assert x['schema']=='STAGE32EX2_EX2_03D_ZERO_CURVE_COMPACT_GEOMETRY_DIAGNOSTIC_V1'
          assert x['remaining_unresolved_labels_1based']==[21,24,25,30,31]
          assert x['restriction_preflight']['remaining_five_fixedness_classified'] is False
          print('remaining5_genus0=', x['remaining5_genus0_labels_1based'])
          print('remaining5_genus1=', x['remaining5_genus1_labels_1based'])
          print('remaining5_gram=', x['remaining5_intersection_matrix'])
          print('remaining5_negative_definite=', x['remaining5_negative_definite_by_sylvester'])
          print('canonical=', x['canonical_sha256_without_this_field'])
          print(json.dumps(x, sort_keys=True))
          PY
