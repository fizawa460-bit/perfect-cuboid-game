name: Stage13-13fh R05 synthesis readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'stages/stage13/13-13fh/**'
      - 'stages/stage13/scripts/13-13fh/**'
      - 'stages/stage13/data/13-13fh/**'
      - 'stages/stage13/13-13/roadmap.md'
      - 'stages/stage13/13-13f/r05-repair-plan.md'
      - '.github/workflows/stage13-13fh-r05-synthesis-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute Gate H readiness report
        run: python stages/stage13/scripts/13-13fh/r05_synthesis_readiness_audit.py --write-report
      - name: Verify committed Gate H report
        run: python stages/stage13/scripts/13-13fh/r05_synthesis_readiness_audit.py --check-report
      - name: Verify R05-build gate
        run: |
          grep -F 'STAGE13_13FH=COMPLETE_R05_SYNTHESIS_READINESS' stages/stage13/13-13fh/result.md
          grep -F 'R05_SYNTHESIS_READY=true' stages/stage13/13-13fh/result.md
          grep -F 'R05_BUNDLE_CREATED=false' stages/stage13/13-13fh/result.md
          grep -F 'NEXT=13-13fi' stages/stage13/13-13/roadmap.md
          grep -F 'DETERMINISTIC_AUDIT_SCOPE=REPRODUCIBILITY_AND_CONSISTENCY_ONLY' stages/stage13/13-13fh/stage13-r05-canonical-proof.md
