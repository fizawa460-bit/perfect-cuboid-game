name: Stage32EX6 scratch eight-conic exceptional projection

on:
  push:
    branches:
      - scratch/stage32-ex6-simultaneous-critical-support
    paths:
      - '.github/workflows/stage32-ex6-scratch-eight-conic-exceptional-projection.yml'
      - 'stages/stage32-ex6/scratch_verify_v6_eight_conic_exceptional_order_projection.py'

permissions:
  contents: read

concurrency:
  group: stage32-ex6-scratch-eight-conic-exceptional-projection
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact scratch head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install locked lightweight dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.4.0' 'scipy==1.15.3'
      - name: Replay 8x48 exceptional projection
        run: |
          python stages/stage32-ex6/scratch_verify_v6_eight_conic_exceptional_order_projection.py \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --witness stages/stage32/32-21/post1473-v6-witness-body-recovered.json \
            --adapter-dir stages/stage32/residual-32-01-production
