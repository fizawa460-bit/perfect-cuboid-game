    name: cumulative exact e20/a0 tier <=65536
    needs: [plan, pilot, wave0, wave1, wave2, wave3]
    if: needs.pilot.result == 'success' && needs.wave0.result == 'success' && needs.wave1.result == 'success' && needs.wave2.result == 'success' && needs.wave3.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Download source-locked profile and hostile-audited predecessor
        run: |
          mkdir -p "$RUNNER_TEMP/profile" "$RUNNER_TEMP/prev" "$RUNNER_TEMP/plan" "$RUNNER_TEMP/final"
          gh run download 32725113188 --repo fizawa460-bit/perfect-cuboid-game \
            --name stage32-14-e20-profile-plan --dir "$RUNNER_TEMP/profile"
          gh run download 32726279718 --repo fizawa460-bit/perfect-cuboid-game \
            --name stage32-15-e20-a0-le16384-exact-tier --dir "$RUNNER_TEMP/prev"
      - uses: actions/download-artifact@v4
        with:
          name: stage32-16-e20-tier65536-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-16b-e20-*
          path: ${{ runner.temp }}/certs
          merge-multiple: false
      - name: Verify all 287 exact work items and aggregate audited predecessor
        run: |
          python stages/stage32/32-16/aggregate_e20_tier65536.py \
            --profile "$RUNNER_TEMP/profile/e20-profile.json" \
            --predecessor "$RUNNER_TEMP/prev/e20-tier16384.json" \
            --plan "$RUNNER_TEMP/plan/e20-tier65536-plan.json" \
            --input-dir "$RUNNER_TEMP/certs" \
            --output "$RUNNER_TEMP/final/e20-tier65536.json"
      - name: Enforce final audit artifact size
        run: |
          bytes=$(stat -c%s "$RUNNER_TEMP/final/e20-tier65536.json")
          echo "final_bytes=$bytes"
          test "$bytes" -le 10000000
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-16-e20-a0-le65536-exact-tier
          path: ${{ runner.temp }}/final/e20-tier65536.json
          retention-days: 30
          if-no-files-found: error
