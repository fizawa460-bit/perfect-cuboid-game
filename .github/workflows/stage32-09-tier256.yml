name: Stage32-09 exact <=256-branch parent tiers

on:
  pull_request:
    paths:
      - 'stages/stage32/32-08/run_materialized_parent_tier.py'
      - 'stages/stage32/32-09/**'
      - '.github/workflows/stage32-09-tier256.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tier256:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: e8-a36-le256
            predecessor_artifact: stage32-08-e8-a36-le64-exact-tier
            predecessor_sha: a58a6589633ef76a08bba420efabbd52d1b56c28eaaaa131c4ebb336666f13b0
            e: 8
            a: 36
            threshold: 256
            expected_cells: 24
            expected_branches: 1161
            expected_predecessor_cells: 21
          - label: e10-a30-le256
            predecessor_artifact: stage32-08-e10-a30-le64-exact-tier
            predecessor_sha: 383f2a2aa202aad1384ada1ef41041d0c731445e1ea7baff0ea895e91117a0e9
            e: 10
            a: 30
            threshold: 256
            expected_cells: 64
            expected_branches: 3344
            expected_predecessor_cells: 58
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install pinned exact dependencies
        run: |
          pip install -r stages/stage32/32-05/requirements.txt
          pip install -r stages/stage32/32-03/requirements.txt
      - name: Compile exhaustive tier runner
        run: python -m py_compile stages/stage32/32-08/run_materialized_parent_tier.py
      - name: Download source-locked Picard core
        run: >-
          gh run download 32624596141
          --repo fizawa460-bit/perfect-cuboid-game
          --name stage32-01-low-degree-verified-prefix
          --dir "$RUNNER_TEMP/core"
      - name: Download audited <=64 predecessor artifact
        run: >-
          gh run download 32682503895
          --repo fizawa460-bit/perfect-cuboid-game
          --name ${{ matrix.predecessor_artifact }}
          --dir "$RUNNER_TEMP/pred"
      - name: Re-derive exact 140 dual caps
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python stages/stage32/32-05/derive_intersection_caps.py \
            --core "$RUNNER_TEMP/core/picard-core.json" \
            --output "$RUNNER_TEMP/out/intersection-cap-certificates.json"
      - name: Exhaust exact <=256-branch tier
        run: |
          python stages/stage32/32-08/run_materialized_parent_tier.py \
            --core "$RUNNER_TEMP/core/picard-core.json" \
            --cap-certificate "$RUNNER_TEMP/out/intersection-cap-certificates.json" \
            --output "$RUNNER_TEMP/out/tier256.json" \
            --exceptional-mass ${{ matrix.e }} \
            --curve-group-mass ${{ matrix.a }} \
            --branch-threshold ${{ matrix.threshold }} \
            --node-limit-per-branch 1000000
      - name: Enforce exact inventory, audited-prefix regression, and firewalls
        env:
          EXPECTED_CELLS: ${{ matrix.expected_cells }}
          EXPECTED_BRANCHES: ${{ matrix.expected_branches }}
          EXPECTED_PREDECESSOR_CELLS: ${{ matrix.expected_predecessor_cells }}
          PREDECESSOR_SHA: ${{ matrix.predecessor_sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib

          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          new=json.loads((root/'out/tier256.json').read_text())
          pred=json.loads((root/'pred/tier64.json').read_text())

          assert pred['deterministic_sha256_without_runtime']==os.environ['PREDECESSOR_SHA']
          assert pred['parameters']['branch_threshold']==64
          assert pred['tier_complete_numerical_enumeration'] is True
          assert pred['unknown_cell_count']==0
          assert len(pred['cells'])==int(os.environ['EXPECTED_PREDECESSOR_CELLS'])

          assert new['schema']=='STAGE32_D8_MATERIALIZED_PARENT_TIER_EXHAUSTIVE_V1'
          assert new['algorithm_id']=='D8_PARENT_LOW_BRANCH_TIER_SHARED_QTAIL12_EXHAUSTIVE_V1'
          assert new['parameters']['branch_threshold']==256
          assert new['tier_inventory']['selected_cell_count']==int(os.environ['EXPECTED_CELLS'])
          assert new['tier_inventory']['scheduled_materialized_branch_count']==int(os.environ['EXPECTED_BRANCHES'])
          assert new['shared_context']['kernel_dimension']==12
          assert new['complete_cell_count'] + new['unknown_cell_count'] == new['tier_inventory']['selected_cell_count']
          assert new['exact_unsat_cell_count'] + new['exact_sat_cell_count'] == new['complete_cell_count']

          pred_ids=pred['tier_inventory']['selected_cell_ids']
          pred_indices=pred['tier_inventory']['selected_cell_indices']
          assert new['tier_inventory']['selected_cell_ids'][:len(pred_ids)]==pred_ids
          assert new['tier_inventory']['selected_cell_indices'][:len(pred_indices)]==pred_indices

          def strip_runtime(x):
              if isinstance(x, dict):
                  return {k: strip_runtime(v) for k,v in x.items() if k not in {'elapsed_seconds','shared_context_preparation_seconds'}}
              if isinstance(x, list):
                  return [strip_runtime(v) for v in x]
              return x

          pred_by_id={c['cell_id']:strip_runtime(c) for c in pred['cells']}
          new_by_id={c['cell_id']:strip_runtime(c) for c in new['cells']}
          assert set(pred_by_id).issubset(new_by_id)
          for cell_id, old_cell in pred_by_id.items():
              assert new_by_id[cell_id]==old_cell, cell_id

          if new['tier_complete_numerical_enumeration']:
              assert new['unknown_cell_count']==0
              assert new['exact_numerical_survivor_count_in_complete_tier']==len(new['confirmed_numerical_survivors'])
              assert all(c['complete_numerical_enumeration'] is True for c in new['cells'])
          else:
              assert new['unknown_cell_count']>0
              assert new['exact_numerical_survivor_count_in_complete_tier'] is None

          assert new['numerical_census_scope']=='SELECTED_LOW_BRANCH_SIGNATURE_CELL_TIER_ONLY'
          assert new['full_parent_complete'] is False
          assert new['effectivity_classification_complete'] is False
          assert new['actual_curve_existence_claim'] is False
          assert new['theorem_credit'] is False and new['receiver_credit'] is False
          assert new['FULL_D8_G0_ROW_COMPLETE'] is False
          assert new['FULL_D176_D192_NUMERICAL_ORBIT_CENSUS'] is False
          assert new['R29_LG2_NUMERICAL_COMPONENT_COMPLETE'] is False
          assert new['R29_LG2']=='NOT_DISCHARGED'
          assert new['R29_LG2_EFF']=='NOT_DISCHARGED'
          assert new['R29_LG2_MB']=='NOT_DISCHARGED'
          assert new['G10_LOWGENUS_PICARD']=='AMBER'

          summary={
              'e':new['parameters']['exceptional_mass'],
              'a':new['parameters']['curve_group_mass'],
              'cells':new['tier_inventory']['selected_cell_count'],
              'branches':new['tier_inventory']['scheduled_materialized_branch_count'],
              'complete_cells':new['complete_cell_count'],
              'unsat_cells':new['exact_unsat_cell_count'],
              'sat_cells':new['exact_sat_cell_count'],
              'unknown_cells':new['unknown_cell_count'],
              'survivors':len(new['confirmed_numerical_survivors']),
              'tier_complete':new['tier_complete_numerical_enumeration'],
              'sha':new['deterministic_sha256_without_runtime'],
              'audited_le64_prefix_regression':'PASS',
          }
          print(json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-09-${{ matrix.label }}-exact-tier
          path: ${{ runner.temp }}/out/tier256.json
          if-no-files-found: error

  summary:
    name: <=256 tier summary
    needs: tier256
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-09-*-le256-exact-tier
          path: ${{ runner.temp }}/all
      - name: Summarize
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('${{ runner.temp }}')/'all'
          rows=[]
          for p in sorted(root.glob('stage32-09-*-le256-exact-tier/tier256.json')):
              d=json.loads(p.read_text())
              rows.append({
                  'e':d['parameters']['exceptional_mass'],
                  'a':d['parameters']['curve_group_mass'],
                  'cells':d['tier_inventory']['selected_cell_count'],
                  'branches':d['tier_inventory']['scheduled_materialized_branch_count'],
                  'complete_cells':d['complete_cell_count'],
                  'unsat_cells':d['exact_unsat_cell_count'],
                  'sat_cells':d['exact_sat_cell_count'],
                  'unknown_cells':d['unknown_cell_count'],
                  'survivors':len(d['confirmed_numerical_survivors']),
                  'complete':d['tier_complete_numerical_enumeration'],
                  'sha':d['deterministic_sha256_without_runtime'],
              })
          assert len(rows)==2
          out={
              'schema':'STAGE32_D8_TIER256_SUMMARY_V1',
              'rows':rows,
              'audited_predecessor_run':32682503895,
              'theorem_credit':False,
              'receiver_credit':False,
              'G10_LOWGENUS_PICARD':'AMBER',
          }
          q=pathlib.Path('${{ runner.temp }}')/'stage32-09-tier256-summary.json'
          q.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(rows,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-09-tier256-summary
          path: ${{ runner.temp }}/stage32-09-tier256-summary.json
          if-no-files-found: error
