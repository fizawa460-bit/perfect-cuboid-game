name: Stage27-20-r301g-j squareclass fiber batch

on:
  push:
    branches:
      - agent/stage27-20-r301g-j-squareclass-fiber-batch
    paths:
      - 'stages/stage27/27-20-r301g/**'
      - 'stages/stage27/27-20-r301h/**'
      - 'stages/stage27/27-20-r301i/**'
      - 'stages/stage27/27-20-r301j/**'
      - 'stages/stage27/27-20-r301g-j/**'
      - 'stages/stage27/27-controller.json'
      - '.github/workflows/stage27-20-r301g-j-squareclass-fiber.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'stages/stage27/27-20-r301g/**'
      - 'stages/stage27/27-20-r301h/**'
      - 'stages/stage27/27-20-r301i/**'
      - 'stages/stage27/27-20-r301j/**'
      - 'stages/stage27/27-20-r301g-j/**'
      - 'stages/stage27/27-controller.json'
      - '.github/workflows/stage27-20-r301g-j-squareclass-fiber.yml'
  workflow_dispatch:

jobs:
  verify-stage27-20-r301g-j:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Stage27-20-r301g-j squareclass fiber batch
        run: python stages/stage27/27-20-r301g-j/verify_27_20_r301g_j.py

      - name: Validate controller and registry JSON
        run: |
          python -m json.tool stages/stage27/27-controller.json >/dev/null
          python -m json.tool stages/stage27/27-20-r301g-j/batch-registry.json >/dev/null

      - name: Diff hygiene
        run: |
          test ! -e .github/workflows/tmp-stage27-r301g-j-sync.yml
          test ! -e stages/stage27/tmp_r301g_j_sync.py
          echo 'Stage27-20-r301g-j diff hygiene: PASS'
