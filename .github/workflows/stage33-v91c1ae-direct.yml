name: Stage33 V91C1X_R5 active cover-glue construction check

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: stage33-v91c1x-r5-direct-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned exact local algebra
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Replay retained W and R1 bounded preflight
        run: |
          python stages/stage33/33-12/diagnose_e3_v91c1w_all8_picard64_reduction_v2.py
          python stages/stage33/33-12/verify_e3_v91c1w_a2_02_all8_picard64_reduction.py
          python stages/stage33/33-12/diagnose_e3_v91c1x_r1_chain_level_action_difference_preflight.py
      - name: Verify V115 R4 hostile-pass and R5 active routing
        run: |
          python stages/stage33/33-12/verify_stage33_v91c1x_r5_active_v115.py
          python stages/stage33/sync_main_state.py --check
      - name: Diff hygiene
        run: git diff --check
