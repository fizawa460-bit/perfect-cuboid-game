name: Stage32 post-21bl Picard witness adapter

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'stages/stage32/32-21/32-21bl-joint-integer-witness.json'
      - 'stages/stage32/residual-32-01-production/adapt_stage32_post21bl_picard_witness.py'
      - '.github/workflows/stage32-post21bl-picard-witness-adapter.yml'

permissions:
  contents: read

concurrency:
  group: stage32-post21bl-picard-witness-adapter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  adapt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Reconstruct the 21bl witness in the original retained Picard64 model
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python adapt_stage32_post21bl_picard_witness.py \
            --evidence "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bl-joint-integer-witness.json" \
            --retained "$GITHUB_WORKSPACE/stages/stage33/33-07/picard_base_rows_retained.py" \
            --marking "$GITHUB_WORKSPACE/stages/stage33/33-07/stage32_picard_marking_retained.py" \
            --output "$RUNNER_TEMP/stage32-post21bl-picard-witness-adapter.json"
      - name: Upload compact adapter evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-post21bl-picard-witness-adapter
          path: ${{ runner.temp }}/stage32-post21bl-picard-witness-adapter.json
          retention-days: 7
          compression-level: 9
