name: Stage24-70 closeout audit

on:
  pull_request:
    paths:
      - 'stages/stage24/**'
      - 'docs/stage24-arsenal-promotion.md'
      - '.github/workflows/stage24-70-closeout-audit.yml'

jobs:
  closeout-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage24 closeout contract
        run: python stages/stage24/24-70/closeout_audit.py
