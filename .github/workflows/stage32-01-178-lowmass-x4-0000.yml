name: Stage32 32-01-178 lowmass x4=0 exact slice

# lifecycle: ACTIVE_AUTO
# Current 178 frontier only; retire immediately after exact-head replay.
on:
  push:
    branches:
      - stage32-01-178-post-td02-fibration-nef
    paths:
      - 'stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_lowmass_separable_x4_0000.py'
      - '.github/workflows/stage32-01-178-lowmass-x4-0000.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-01-178-lowmass-x4-0000-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - name: Exact complete x4=0 slice via nonheavy separable Picard minimum
        run: python stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_lowmass_separable_x4_0000.py
      - name: Diff hygiene
        run: git diff --check
