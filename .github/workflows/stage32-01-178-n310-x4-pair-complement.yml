name: Stage32 32-01-178 N310 x4 pair complement

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/32-01-178/nodes/N310/**'
      - '.github/workflows/stage32-01-178-n310-x4-pair-complement.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify N310 exact x4 pair-complement relations
        run: python stages/stage32/32-01-178/nodes/N310/verify_n310_x4_pair_complement_relations.py
