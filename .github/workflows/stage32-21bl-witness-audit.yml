name: Stage32-21bl fresh exact witness replay audit

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage32/32-21/32-21bl-joint-integer-witness.json'
      - 'stages/stage32/residual-32-01-production/audit_stage32_21bl_joint_integer_witness.py'
      - '.github/workflows/stage32-21bl-witness-audit.yml'

permissions:
  contents: read

concurrency:
  group: stage32-21bl-witness-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependencies
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Freshly rebuild current 21bl model and replay the persisted 59D witness
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python audit_stage32_21bl_joint_integer_witness.py \
            --source-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21az-survivor-prism.json" \
            --formula-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bb-r51-interval-formula.json" \
            --pair-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bc-pair-combination-bounds.json" \
            --audit-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21be-r51-endpoint-audit.json" \
            --seventh-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bh-r54-lossless-table.json" \
            --eighth-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bi-r57-exact-formula.json" \
            --ninth-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bj-r56-exact-formula.json" \
            --tenth-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bk-r20-final-single-coordinate-evidence.json" \
            --retained "$GITHUB_WORKSPACE/stages/stage33/33-07/picard_base_rows_retained.py" \
            --marking "$GITHUB_WORKSPACE/stages/stage33/33-07/stage32_picard_marking_retained.py" \
            --evidence "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bl-joint-integer-witness.json" \
            --output "$RUNNER_TEMP/stage32-21bl-witness-audit.json"
      - name: Upload compact audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-21bl-witness-audit
          path: ${{ runner.temp }}/stage32-21bl-witness-audit.json
          retention-days: 7
          compression-level: 9
