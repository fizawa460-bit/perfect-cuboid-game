name: Stage32 post1648L trace-oriented H-coset diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-post1648l-trace-oriented-h-coset.yml'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_post1648l_trace_oriented_h_coset.py'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_post1648e_b3_boundary_weierstrass_filter.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-oriented-h-coset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Run exact H-coset diagnostic
        run: python3 -B stages/stage32/residual-32-01-production/diagnose_stage32_post1648l_trace_oriented_h_coset.py
      - name: Diff check
        run: git diff --check
