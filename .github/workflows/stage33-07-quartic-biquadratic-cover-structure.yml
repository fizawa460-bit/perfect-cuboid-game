name: Stage33-07 quartic biquadratic cover structure

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/certify_quartic_norm_biquadratic_cover_structure.py'
      - 'stages/stage33/33-07/certify_ambient_linear_carrier_boundary_offboundary_split.py'
      - 'stages/stage33/33-07/inventory_mixed_order_ambient_linear_divisor_support.py'
      - 'stages/stage33/33-07/materialize_mixed_order_side_ambient_function_lifts.py'
      - 'stages/stage33/33-07/materialize_mixed_order_exceptional_ambient_tangent_function_lifts.py'
      - 'stages/stage33/33-07/certify_order2_quotient_raw_order4_bockstein.py'
      - 'stages/stage33/33-07/order2-first-residue-function-liftability.json'
      - 'stages/stage33/33-07/exceptional-p1-tangent-coordinates.json'
      - 'stages/stage33/33-07/br0b-boundary-raw-residue-map.json'
      - 'stages/stage33/33-07/br0g-finite-ramified-residue-presentation.json'
      - 'stages/stage33/33-07/two-primary-residue-invariant-basis.json'
      - '.github/workflows/stage33-07-quartic-biquadratic-cover-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Reproduce carrier split
        working-directory: stages/stage33/33-07
        run: |
          python certify_order2_quotient_raw_order4_bockstein.py
          python materialize_mixed_order_side_ambient_function_lifts.py
          python materialize_mixed_order_exceptional_ambient_tangent_function_lifts.py
          python inventory_mixed_order_ambient_linear_divisor_support.py
          python certify_ambient_linear_carrier_boundary_offboundary_split.py
      - name: Reduce quartic carriers to six Pic2 tests
        working-directory: stages/stage33/33-07
        run: python certify_quartic_norm_biquadratic_cover_structure.py
      - name: Validate exact six-test firewall
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import hashlib,json
          p='quartic-norm-biquadratic-cover-structure.json'
          x=json.load(open(p)); h=x.pop('canonical_sha256')
          assert h==hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          r=x['reduction_summary']
          assert r['quartic_norm_carrier_hyperplanes']==12
          assert r['distinct_irreducible_base_quartics']==6
          assert r['observed_carriers_per_base_quartic']==2
          assert r['full_projective_sign_orbit_size_per_base_quartic']==4
          assert r['base_normalization_genus_histogram']=={'1':3,'2':3}
          assert r['definitely_ramified_branch_count_histogram']=={'4':3,'8':3}
          assert r['ramified_quadratic_intermediate_genus']==5
          assert r['remaining_binary_pic2_triviality_tests']==6
          assert len(x['base_quartic_records'])==6
          assert all(x['exact_checks'].values())
          assert all(q['ramified_quadratic_cover']['connected'] and q['ramified_quadratic_cover']['genus']==5 for q in x['base_quartic_records'])
          assert all(q['function_field_reduction']['unramified_pic2_candidate_tau_status']=='UNRESOLVED_TRIVIAL_OR_NONTRIVIAL' for q in x['base_quartic_records'])
          prog=x['constructive_progress']
          assert prog['quartic_norm_hyperplanes_structurally_reduced']==12
          assert prog['quartic_norm_base_quartics_materialized']==6
          assert prog['quartic_norm_remaining_pic2_triviality_tests']==6
          assert not prog['quartic_norm_prime_divisor_decomposition_closed']
          assert prog['global_geometric_Gersten_lifts_materialized_count']==0
          assert prog['off_boundary_codimension1_residue_certificates_materialized_count']==0
          assert not prog['project_14x26_L_squareclass_tensor_materialized']
          assert not prog['absolute_delta_loc_computed'] and not prog['arithmetic_HS_closed']
          assert x['stage33_progress']=='6/11' and not x['stage33_08_released']
          print('STAGE33_07_QUARTIC_BIQUADRATIC_STRUCTURE=PASS')
          print('CERTIFICATE_SHA256='+h)
          print('QUARTIC_CARRIERS=12')
          print('BASE_QUARTICS=6')
          print('PIC2_TESTS_REMAINING=6')
          print('NEXT='+x['next_exact_leaf'])
          PY
      - name: Upload quartic cover structure certificate
        uses: actions/upload-artifact@v4
        with:
          name: stage33-07-quartic-biquadratic-cover-structure
          retention-days: 3
          path: stages/stage33/33-07/quartic-norm-biquadratic-cover-structure.json
