name: StructureRadar search06 temporary runner
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/structure-radar-search06-temp.yml']
permissions:
  contents: write
jobs:
  run:
    if: github.head_ref == 'structure-radar-search-06'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Inspect next StructureRadar cards
        run: |
          python - <<'PY'
          import json
          p='docs/structure-radar/structure-registry.json'
          d=json.load(open(p))
          ids={f'SR-STR-{i:03d}' for i in range(41,49)}
          out=[x for x in d['structures'] if x['structure_id'] in ids]
          open('/tmp/cards.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/structure-radar-search06-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'StructureRadar: remove temporary search06 inspector'
          git push origin HEAD:${{ github.head_ref }}
