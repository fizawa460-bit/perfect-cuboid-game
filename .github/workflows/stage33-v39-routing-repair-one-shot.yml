name: Stage33 V39 routing repair one-shot

on:
  push:
    branches:
      - stage33-post1488-v25-cech-lattice-continuation
    paths:
      - 'stages/stage33/apply_post_v39_locator_construction_v60.py'
      - '.github/workflows/stage33-v39-routing-repair-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: stage33-v39-routing-repair-one-shot
  cancel-in-progress: false

jobs:
  apply-routing-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage33-post1488-v25-cech-lattice-continuation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply V39 routing repair
        run: |
          python stages/stage33/apply_post_v39_locator_construction_v60.py
          git diff --check
      - name: Commit synchronized V60/V17 state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            stages/stage33/controller.json \
            stages/stage33/sync_main_state.py \
            stages/stage33/MAIN-START-HERE.md \
            stages/stage33/MAIN-STATE.json \
            stages/stage33/CURRENT.md \
            stages/stage33/33-12/verify_j2_post_v36_controller_generator_sync_v38.py \
            .github/workflows/stage33-12-main.yml
          if git diff --cached --quiet; then
            echo "No routing changes to commit"
            exit 1
          fi
          git commit -m "Stage33: activate locator-first construction routing"
          git push origin HEAD:stage33-post1488-v25-cech-lattice-continuation
