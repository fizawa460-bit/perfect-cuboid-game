name: Stage32 scratch post1648ah FSM unibranch V6 exclusion

on:
  push:
    branches:
      - stage32-scratch-post1648ah-fsm-unibranch-v6-exclusion
    paths:
      - '.github/workflows/stage32-post1648ah-fsm-unibranch-v6-exclusion-scratch.yml'
      - 'stages/stage32/residual-32-01-production/post1648ah-fsm-unibranch-source-note.md'
      - 'stages/stage32/residual-32-01-production/verify_stage32_post1648ah_fsm_unibranch_v6_exclusion.py'

permissions:
  contents: write

concurrency:
  group: stage32-post1648ah-fsm-unibranch-v6-exclusion-scratch
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact scratch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Run exact bounded exclusion verifier
        run: python stages/stage32/residual-32-01-production/verify_stage32_post1648ah_fsm_unibranch_v6_exclusion.py
      - name: Commit scratch certificate only
        run: |
          RESULT=stages/stage32/residual-32-01-production/post1648ah-fsm-unibranch-v6-exclusion.json
          test -f "$RESULT"
          git add "$RESULT"
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage32 scratch AH: fix FSM unibranch V6 exclusion result'
          git push origin HEAD:${{ github.ref_name }}
