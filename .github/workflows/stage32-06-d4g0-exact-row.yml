name: Stage32-06 d4-g0 exact row batch

on:
  pull_request:
    paths:
      - 'stages/stage32/32-06/**'
      - '.github/workflows/stage32-06-d4g0-exact-row.yml'

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    name: exact-cap parent inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install pinned dependencies
        run: pip install -r stages/stage32/32-05/requirements.txt
      - name: Download source-locked Stage32 Picard core
        run: >-
          gh run download 32624596141
          --repo fizawa460-bit/perfect-cuboid-game
          --name stage32-01-low-degree-verified-prefix
          --dir "$RUNNER_TEMP/stage32-prefix"
      - name: Re-derive exact dual caps
        run: |
          mkdir -p "$RUNNER_TEMP/stage32-06"
          python stages/stage32/32-05/derive_intersection_caps.py \
            --core "$RUNNER_TEMP/stage32-prefix/picard-core.json" \
            --output "$RUNNER_TEMP/stage32-06/intersection-cap-certificates.json"
      - name: Build exact d4-g0 parent inventory
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib, sys
          root = pathlib.Path.cwd()
          base_dir = root / 'stages/stage32/32-05'
          sys.path.insert(0, str(base_dir))
          spec = importlib.util.spec_from_file_location('stage32_05_exact', base_dir / 'run_exact_mitm_closure.py')
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          from cap_certificate import load_and_verify
          temp = pathlib.Path(__import__('os').environ['RUNNER_TEMP'])
          core_path = temp / 'stage32-prefix/picard-core.json'
          cap_path = temp / 'stage32-06/intersection-cap-certificates.json'
          core, _, cap = load_and_verify(core_path, cap_path)
          assert cap['certificate_canonical_sha256'] == mod.EXPECTED_CAP_SHA
          transform = mod.build_transform(core)
          aggregate = mod.aggregate_structure(transform['pair'], transform['h'])
          assert aggregate['certificate']['exceptional_aggregate_type_counts'] == {'A': 32, 'B': 8, 'C': 8}
          assert aggregate['certificate']['qhead_aggregate_triple'] == [16, 120, 304]
          assert aggregate['certificate']['qtail_aggregate_triple'] == [0, 0, 0]
          d = 4; ecap = d // 4; ncap = d // 2
          assert ecap == 1 and ncap == 2
          pairs = set(); solutions = []
          for x in range(33):
            for y in range(9):
              for z in range(9):
                e = x + y + z
                if e > 19*d//5: continue
                for t in range(4*ncap + 1):
                  if 8*y + 16*z + 16*t != 8*d: continue
                  anum = -24*x + 32*y + 96*z + 120*t
                  if anum % 8: continue
                  a = anum // 8
                  if not 0 <= a <= 19*d - 5*e: continue
                  if -40*x + 112*y + 264*z + 304*t != 8*(19*d - 5*e): continue
                  pairs.add((e,a)); solutions.append([e,a,x,y,z,t])
          expected = [(0,30),(1,27),(2,23),(2,24),(3,20),(3,21),(4,16),(4,17),(4,18),
                      (5,13),(5,14),(5,15),(6,10),(6,11),(6,12),(7,7),(7,8),(7,9),
                      (8,4),(8,5),(8,6),(9,1),(9,2),(9,3),(10,0)]
          assert sorted(pairs) == expected
          all_parent_count = sum((19*d - 5*e) + 1 for e in range(19*d//5 + 1))
          assert all_parent_count == 632
          payload = {
            'schema': 'STAGE32_D4G0_EXACT_CAP_PARENT_INVENTORY_V1',
            'degree': d, 'genus': 0,
            'normal_cap': ncap, 'exceptional_cap': ecap,
            'all_budget_parent_count': all_parent_count,
            'aggregate_feasible_parent_count': len(expected),
            'aggregate_infeasible_parent_count': all_parent_count - len(expected),
            'aggregate_feasible_pairs': [list(v) for v in expected],
            'aggregate_solution_count': len(solutions),
            'aggregate_solutions': solutions,
            'cap_certificate_sha256': cap['certificate_canonical_sha256'],
            'selected_matrix_determinant': transform['certificate']['selected_matrix_determinant'],
            'inverse_denominator': transform['certificate']['inverse_denominator'],
            'theorem_credit': False,
            'audit_status': 'PENDING',
            'receiver_credit': False,
          }
          out = temp / 'stage32-06/d4g0-parent-inventory.json'
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'parents': len(expected), 'aggregate_solutions': len(solutions), 'excluded': all_parent_count-len(expected)}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-06-d4g0-parent-inventory
          path: ${{ runner.temp }}/stage32-06
          if-no-files-found: error

  exact-parent:
    name: exact-parent-${{ matrix.parent }}
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parent:
          - '0-30'
          - '1-27'
          - '2-23'
          - '2-24'
          - '3-20'
          - '3-21'
          - '4-16'
          - '4-17'
          - '4-18'
          - '5-13'
          - '5-14'
          - '5-15'
          - '6-10'
          - '6-11'
          - '6-12'
          - '7-7'
          - '7-8'
          - '7-9'
          - '8-4'
          - '8-5'
          - '8-6'
          - '9-1'
          - '9-2'
          - '9-3'
          - '10-0'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact solver
        run: pip install z3-solver==4.15.3.0
      - name: Download source-locked Stage32 Picard core
        run: >-
          gh run download 32624596141
          --repo fizawa460-bit/perfect-cuboid-game
          --name stage32-01-low-degree-verified-prefix
          --dir "$RUNNER_TEMP/stage32-prefix"
      - name: Exhaust exact superset shard
        run: |
          P='${{ matrix.parent }}'
          E="${P%-*}"; A="${P#*-}"
          mkdir -p "$RUNNER_TEMP/stage32-06/${P}"
          python stages/stage32/32-02/run_exact_z3_budget.py \
            --core "$RUNNER_TEMP/stage32-prefix/picard-core.json" \
            --output-dir "$RUNNER_TEMP/stage32-06/${P}" \
            --degree 4 --genus 0 \
            --exceptional-mass "$E" --curve-group-mass "$A" \
            --timeout 60 --threads 1 --proof
      - name: Apply exact dual-cap filter to complete shard output
        if: always()
        run: |
          P='${{ matrix.parent }}'
          E="${P%-*}"; A="${P#*-}"
          P="$P" E="$E" A="$A" python - <<'PY'
          import hashlib, json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          label = f"d4-g0-e{os.environ['E']}-a{os.environ['A']}"
          checkpoint = temp / 'stage32-06' / os.environ['P'] / label / 'checkpoint.json'
          out = temp / 'stage32-06' / os.environ['P'] / 'filtered.json'
          if not checkpoint.exists():
            out.write_text(json.dumps({'complete': False, 'missing_checkpoint': True}, indent=2) + '\n')
            raise SystemExit('missing exact checkpoint')
          data = json.loads(checkpoint.read_text())
          if not data.get('complete'):
            out.write_text(json.dumps({'complete': False, 'solver_result': data.get('solver_result'), 'unknown_reason': data.get('unknown_reason')}, indent=2) + '\n')
            raise SystemExit('exact shard did not complete')
          core = json.loads((temp / 'stage32-prefix/picard-core.json').read_text())
          rows = core['raw_cross_pairings_with_basis']
          valid = []
          rejected = 0
          for survivor in data['survivors']:
            v = survivor['picard_coordinates']
            pair = [sum(row[j]*v[j] for j in range(64)) for row in rows]
            assert min(pair) >= 0
            assert sum(pair[92:]) == int(os.environ['E'])
            assert sum(pair[:46]) == int(os.environ['A'])
            if all(x <= 2 for x in pair[:92]) and all(x <= 1 for x in pair[92:]):
              valid.append({'picard_coordinates': v, 'intersection_vector_sha256': hashlib.sha256(json.dumps(pair,separators=(',',':')).encode()).hexdigest()})
            else:
              rejected += 1
          payload = {
            'schema': 'STAGE32_D4G0_CAP_FILTERED_PARENT_V1',
            'degree': 4, 'genus': 0,
            'exceptional_mass': int(os.environ['E']), 'curve_group_mass': int(os.environ['A']),
            'superset_exact_complete': True,
            'superset_survivor_count': len(data['survivors']),
            'dual_cap_rejected_count': rejected,
            'cap_valid_survivor_count': len(valid),
            'cap_valid_survivors': valid,
            'target_parent_exact_complete': True,
            'theorem_credit': False, 'audit_status': 'PENDING', 'receiver_credit': False,
          }
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'superset': len(data['survivors']), 'cap_valid': len(valid), 'rejected': rejected}))
          PY
      - name: Upload parent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage32-06-d4g0-parent-${{ matrix.parent }}
          path: ${{ runner.temp }}/stage32-06/${{ matrix.parent }}
          if-no-files-found: error

  summary:
    name: d4-g0 exact row summary
    needs: [inventory, exact-parent]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-06-d4g0-*
          path: evidence
          merge-multiple: true
      - name: Recompute row accounting and firewalls
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('evidence')
          inventory = json.loads((root / 'd4g0-parent-inventory.json').read_text())
          filtered = sorted(root.glob('**/filtered.json'))
          if len(filtered) != 25:
            raise SystemExit(f'expected 25 filtered parents, got {len(filtered)}')
          rows = [json.loads(p.read_text()) for p in filtered]
          complete = all(r.get('target_parent_exact_complete') is True for r in rows)
          cap_valid = sum(int(r.get('cap_valid_survivor_count', 0)) for r in rows)
          superset = sum(int(r.get('superset_survivor_count', 0)) for r in rows)
          rejected = sum(int(r.get('dual_cap_rejected_count', 0)) for r in rows)
          payload = {
            'schema': 'STAGE32_D4G0_EXACT_ROW_SUMMARY_V1',
            'degree': 4, 'genus': 0,
            'budget_parent_count': inventory['all_budget_parent_count'],
            'aggregate_feasible_parent_count': inventory['aggregate_feasible_parent_count'],
            'aggregate_infeasible_parent_count': inventory['aggregate_infeasible_parent_count'],
            'exact_parent_count': len(rows),
            'all_target_parents_exact_complete': complete,
            'superset_survivor_count': superset,
            'dual_cap_rejected_count': rejected,
            'cap_valid_survivor_count': cap_valid,
            'preorbit_exact_row_complete': complete,
            'numerical_orbit_row_complete': bool(complete and cap_valid == 0),
            'orbit_deduplication_required': cap_valid != 0,
            'theorem_credit': False,
            'audit_status': 'PENDING',
            'receiver_credit': False,
            'FULL_D176_D192_NUMERICAL_ORBIT_CENSUS': False,
            'R29_LG2_NUMERICAL_COMPONENT_COMPLETE': False,
            'R29_LG2': 'NOT_DISCHARGED',
            'R29_LG2_EFF': 'NOT_DISCHARGED',
            'R29_LG2_MB': 'NOT_DISCHARGED',
            'G10_LOWGENUS_PICARD': 'AMBER',
          }
          pathlib.Path('d4g0-row-summary.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          print(json.dumps(payload, sort_keys=True))
          if not complete:
            raise SystemExit('d4/g0 row has incomplete exact parents')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-06-d4g0-row-summary
          path: d4g0-row-summary.json
