jobs:
  cancellation-fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo 'HPADJ21 heavy is intentionally cold.'
          echo 'Previous ONE_FULL178_ROW recovery is retired because timed-out rows had no intra-row checkpoint.'
