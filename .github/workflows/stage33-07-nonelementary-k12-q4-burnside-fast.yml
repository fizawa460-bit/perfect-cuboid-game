name: Stage33-07 non-elementary k1 k2 Q4 Burnside fast

on:
  push:
    branches:
      - stage33-07-k12-burnside-fast-scout
    paths:
      - 'stages/stage33/33-07/**'
      - '.github/workflows/stage33-07-nonelementary-k12-q4-burnside-fast.yml'
  workflow_dispatch:

concurrency:
  group: stage33-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact structural predecessor files
        working-directory: stages/stage33/33-07
        run: |
          python certify_nonelementary_target_q4_rank_obstruction.py
          python certify_nonelementary_target_q8_exponent_reduction.py
          python certify_nonelementary_k12_q2_support_reduction.py
          python certify_nonelementary_k12_2q_support_reduction.py
      - name: Certify retained-Q4 exact Burnside quotient
        working-directory: stages/stage33/33-07
        run: python certify_nonelementary_k12_q4_affine_burnside_fast.py
      - name: Enforce exact coverage and conservative firewall
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import json
          x=json.load(open('nonelementary-k12-q4-affine-burnside-fast-certified.json'))
          assert x['source_Q4_survivor_bitsets_sha256']=='d4a96195628a12f1b69da4a1ed82b5cf638b29dbff304b9ce2083a875ee49471'
          assert x['source_formal_Q4_certificate_sha256']=='cc7350ecd3a5f7d1c3eca0b96649df0fb1219283190f806ec1e537d28cbd4b19'
          assert x['Q4_membership_imported_from_formal_retained_bitset']
          assert x['fixed_sets_counted_by_exact_F2_elimination'] and x['burnside_exact'] and x['burnside_certified']
          assert not x['lift_sections_enumerated_for_burnside'] and not x['fast_or_canonical_traversal_used']
          assert x['k1']['Q4_surviving_skeleton_orbits']==3187 and x['k1']['Q4_surviving_H_reconstructed']==2012416
          assert x['k1']['exact_full_symmetry_orbits_after_Q4']==77076
          assert x['k2']['Q4_surviving_skeleton_orbits']==294 and x['k2']['Q4_surviving_H_reconstructed']==8867840
          assert x['k2']['exact_full_symmetry_orbits_after_Q4']==303496
          assert x['combined_Q4_surviving_H']==10880256 and x['combined_exact_full_symmetry_orbits_after_Q4']==380572
          assert not x['endpoint_finite_q_certified'] and not x['endpoint_full_action_certified']
          assert not x['actual_index512_glue_identified'] and not x['arithmetic_HS_closed']
          assert x['stage33_progress']=='6/11' and not x['stage33_08_released'] and not x['stage33_09_released']
          assert not x['theorem_credit'] and not x['endpoint_credit'] and not x['perfect_cuboid_nonexistence_claim']
          print('K12_Q4_BURNSIDE_FAST=PASS_EXACT')
          print('FULL_SYMMETRY_ORBITS=380572')
          print('CERT_SHA256='+x['canonical_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-k12-q4-affine-burnside-fast-certified
          path: stages/stage33/33-07/nonelementary-k12-q4-affine-burnside-fast-certified.json
          retention-days: 5
