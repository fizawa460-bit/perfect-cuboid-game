name: Stage14-4bw shared xi cell sieve

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4bw/**'
      - 'stages/stage14/14-4bw/result.md'
      - 'stages/stage14/data/14-4/shared_xi_cell_sieve_summary.json'
      - 'stages/stage14/scripts/14-4/shared_xi_cell_sieve_audit.py'
      - '.github/workflows/stage14-4bw-shared-xi-cell-sieve.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile 4bw audit
        run: python -m py_compile stages/stage14/scripts/14-4/shared_xi_cell_sieve_audit.py
      - name: Run merged 4bv regression
        run: python stages/stage14/scripts/14-4/inert_fourier_thin_switch_audit.py
      - name: Run 4bw deterministic audit
        run: python stages/stage14/scripts/14-4/shared_xi_cell_sieve_audit.py
      - name: Check theorem boundary
        run: |
          grep -q 'STAGE14_4BW=SHARED_XI_FOUR_CELL_ONE_VARIABLE_SIEVE_AND_18_19_BOUND' stages/stage14/14-4bw/result.md
          grep -q 'SHARED_XI_DROPPED_IN_THIN_SWITCH=false' stages/stage14/14-4bw/result.md
          grep -q 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=18/19' stages/stage14/14-4bw/result.md
          grep -q 'NEW_WHOLE_FAMILY_POWER_SAVING_PROVED=true' stages/stage14/14-4bw/result.md
          grep -q 'SQRT_B_UPPER_BOUND_PROVED=false' stages/stage14/14-4bw/result.md
