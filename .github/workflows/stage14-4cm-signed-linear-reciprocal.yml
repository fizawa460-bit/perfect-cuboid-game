name: Stage14-4cm signed linear reciprocal

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4cm/**'
      - 'stages/stage14/scripts/14-4/signed_linear_reciprocal_audit.py'
      - 'stages/stage14/data/14-4/signed_linear_reciprocal_summary.json'
      - '.github/workflows/stage14-4cm-signed-linear-reciprocal.yml'
      - 'stages/stage14/14-4cl/**'
      - 'stages/stage14/14-s7-25/**'
      - 'stages/stage14/14-X4/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage14-4cm audit
        run: python stages/stage14/scripts/14-4/signed_linear_reciprocal_audit.py

      - name: Run merged Stage14-4cl regression
        run: python stages/stage14/scripts/14-4/cyclotomic_quartic_allocation_audit.py

      - name: Run merged Stage14-s7-25 regression
        run: python stages/stage14/scripts/14-s7-25/xi_switch_shell_reconstruction_audit.py

      - name: Run merged Stage14-X4 regression
        run: python stages/stage14/scripts/14-X4/physical_diagonal_elimination_audit.py

      - name: Lock predecessor boundaries
        run: |
          grep -Fq 'STAGE14_4CL=COMPLETE_PHYSICAL_PROPORTIONAL_BRANCH_ELIMINATION_AND_RECIPROCAL_CYCLOTOMIC_REDUCTION' stages/stage14/14-4cl/result.md
          grep -Fq 'STAGE14_S7_25=COMPLETE_FIXED_RESIDUAL_XI_SWITCH_PRODUCT_RECONSTRUCTION_AND_TOP_THETA_LOCALIZATION' stages/stage14/14-s7-25/result.md
          grep -Fq 'FIXED_RESIDUAL_XI_SWITCH_PRODUCT_PACKET_FIBER_BO1=true' stages/stage14/14-s7-25/result.md
          grep -Fq 'TOP_THETA_BARRIER=theta=5/16' stages/stage14/14-s7-25/result.md
          grep -Fq 'STAGE14_X4=COMPLETE_PHYSICAL_PROPORTIONAL_BRANCH_ELIMINATION_AND_X_ROUTE_ALIGNMENT' stages/stage14/14-X4/result.md
          grep -Fq 'X1_CHARGED_ONCE_QUANTIFIER_ORDER_PRESERVED=true' stages/stage14/14-X4/result.md

      - name: Lock Stage14-4cm theorem boundary
        run: |
          f=stages/stage14/14-4cm/result.md
          grep -Fq 'STAGE14_4CM=COMPLETE_QUADRATIC_BRANCH_ELIMINATION_AND_TOP_THETA_SIGNED_LINEAR_QUOTIENT_REDUCTION' "$f"
          grep -Fq 'MERGED_X4_IMPORTED=true' "$f"
          grep -Fq 'COMPLEMENTARY_MINUS_ODDPART_DECOMPOSITION_PROVED=true' "$f"
          grep -Fq 'XI_CYCLOTOMIC_I_BRANCH_EMPTY=true' "$f"
          grep -Fq 'K_CYCLOTOMIC_I_BRANCH_EMPTY=true' "$f"
          grep -Fq 'MIXED_OR_QUADRATIC_DOMINANT_BRANCH_TYPES_EXIST=false' "$f"
          grep -Fq 'DOMINANT_BRANCH_TYPE_COUNT=4' "$f"
          grep -Fq 'TOP_THETA_XI_DOMINANT_LINEAR_MODULUS_EXPONENT=phi' "$f"
          grep -Fq 'TOP_THETA_K_DOMINANT_LINEAR_MODULUS_EXPONENT=5/16' "$f"
          grep -Fq 'TOP_THETA_SIGNED_QUOTIENT_PAIR_SUPPORT_EXPONENT_MAX=1/8' "$f"
          grep -Fq 'TOP_THETA_RECIPROCAL_SIGNED_LINEAR_QUOTIENT_XI_SWITCH_INCIDENCE_PROVED=false' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/8' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-4cn' "$f"
