name: TEMP Stage27 r301k-m lifecycle sync

on:
  push:
    branches:
      - agent/stage27-20-r301k-m-moduli-twist-batch
    paths:
      - '.github/workflows/tmp-stage27-r301km-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-20-r301k-m-moduli-twist-batch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize audited g-j closeout and register k-m
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('.')
          for suffix in 'ghij':
              p=root/f'stages/stage27/27-20-r301{suffix}/result.md'
              s=p.read_text()
              s=s.replace('STATUS=BATCH_SUBMITTED_PENDING_FRESH_AUDIT','STATUS=AUDITED_PASS_MERGED',1)
              marker=f'STAGE27_20_R301{suffix.upper()}_STATUS=BATCH_SUBMITTED_PENDING_FRESH_AUDIT'
              s=s.replace(marker, f'STAGE27_20_R301{suffix.upper()}_STATUS=AUDITED_PASS_MERGED')
              p.write_text(s)

          oldp=root/'stages/stage27/27-20-r301g-j/batch-registry.json'
          old=json.loads(oldp.read_text())
          old['status']='AUDITED_PASS_MERGED'
          old['audit_status']='PASS'
          old['merge_allowed']=True
          old['advance_allowed']=True
          old['fresh_reaudit_required']=False
          old['final_audit_verdict']='PASS'
          old['merged']=True
          old['merge_commit']='d53f4a4bb74e86c9e0ea38a0e12124c9b3bab30c'
          old['next_derived_route']='27-20-r301k'
          oldp.write_text(json.dumps(old,indent=2)+'\n')

          cp=root/'stages/stage27/27-controller.json'
          ctl=json.loads(cp.read_text())
          dr=ctl['derived_routes']
          for suffix in 'ghij':
              key=f'Stage27-20-r301{suffix}'
              r=dr[key]
              r['status']='AUDITED_PASS_MERGED'
              r['audit_status']='PASS'
              r['merge_allowed']=True
              r['advance_allowed']=True
              r['audit_verdict']='PASS'
              r['merged']=True
              r['merge_commit']='d53f4a4bb74e86c9e0ea38a0e12124c9b3bab30c'

          entries={
            'Stage27-20-r301k': {
              'trigger_checkpoint':40,'route_kind':'UPPER_REENTRY_PREFLIGHT','source_stage':'Stage20',
              'parent_route':'Stage27-20-r301j','batch_audit_group':'Stage27-20-r301k-m',
              'status':'BATCH_SUBMITTED_PENDING_FRESH_AUDIT','audit_status':'PENDING',
              'merge_allowed':False,'advance_allowed':False,
              'result_path':'stages/stage27/27-20-r301k/result.md',
              'j_invariant_formula_proved':True,'delta_geometric_twist_only':True,
              'physical_j_fiber_multiplicity_le_2':True,'j_map_support_saving_proved':False,
              'strict_sub_sqrt_upper_proved':False,'next_derived_route':'27-20-r301l'
            },
            'Stage27-20-r301l': {
              'trigger_checkpoint':40,'route_kind':'UPPER_REENTRY_PREFLIGHT','source_stage':'Stage20',
              'parent_route':'Stage27-20-r301k','batch_audit_group':'Stage27-20-r301k-m',
              'status':'BATCH_SUBMITTED_PENDING_FRESH_AUDIT','audit_status':'PENDING',
              'merge_allowed':False,'advance_allowed':False,
              'result_path':'stages/stage27/27-20-r301l/result.md',
              'odd_twist_prime_support_subset_degeneration_support':True,
              'conductor_equality_proved':False,'minimal_weierstrass_model_audited':False,
              'strict_sub_sqrt_upper_proved':False,'next_derived_route':'27-20-r301m'
            },
            'Stage27-20-r301m': {
              'trigger_checkpoint':40,'route_kind':'UPPER_REENTRY_PREFLIGHT','source_stage':'Stage20',
              'parent_route':'Stage27-20-r301l','batch_audit_group':'Stage27-20-r301k-m',
              'status':'BATCH_SUBMITTED_PENDING_FRESH_AUDIT','audit_status':'PENDING',
              'merge_allowed':False,'advance_allowed':False,
              'result_path':'stages/stage27/27-20-r301m/result.md',
              'q1_and_j_support_exponents_equal':True,'squareclass_multiplicity_per_j_subpower':True,
              'height_only_moduli_support_route_closed':True,
              'uniform_moving_fiber_subpower_proved':False,'strict_sub_sqrt_upper_proved':False,
              'new_mu_lt_half_proved':False,'true_n2_exponent_identified':False,
              'next_derived_route':'27-20-r301n',
              'stop_reason':'UNIFORM_OR_AVERAGED_ARITHMETIC_TWIST_FAMILY_THEOREM_REQUIRED'
            }
          }
          dr.update(entries)
          assert ctl['state']['CURRENT_CHECKPOINT']==40
          assert ctl['state']['NEXT_CHECKPOINT']==40
          assert ctl['state']['ADVANCE_TO_CHECKPOINT50'] is False
          cp.write_text(json.dumps(ctl,indent=2)+'\n')
          PY
          python stages/stage27/27-20-r301k-m/verify_27_20_r301k_m.py
          git add stages/stage27/27-20-r301g stages/stage27/27-20-r301h stages/stage27/27-20-r301i stages/stage27/27-20-r301j stages/stage27/27-20-r301g-j/batch-registry.json stages/stage27/27-controller.json
          git diff --check --cached
          git commit -m 'Sync Stage27 r301g-j audit and register r301k-m'
          git push origin HEAD:agent/stage27-20-r301k-m-moduli-twist-batch
