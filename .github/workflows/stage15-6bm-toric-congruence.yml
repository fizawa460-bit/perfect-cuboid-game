name: Stage15-6bm toric congruence
on:
  pull_request:
    paths: ['stages/stage15/15-6bm/**','stages/stage15/evidence/stage15_6bm_toric_congruence.json','stages/stage15/replay/verify_stage15_6bm.py','stages/stage15/scripts/stage15_6bm_toric_congruence.py','.github/workflows/stage15-6bm-toric-congruence.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python stages/stage15/replay/verify_stage15_6bm.py
