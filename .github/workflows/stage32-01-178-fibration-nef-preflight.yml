name: Stage32 32-01-178 fibration nef recoverability preflight

on:
  push:
    branches:
      - stage32-01-178-topdown-grf02-hpadj08
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - name: Exact fibration-nef recoverability preflight
        run: python stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_recoverability.py
      - name: Exact five-residual aggregate Hperp producer preflight
        run: python stages/stage32/32-01-178/fibration-nef/verify_five_residual_aggregate_hperp_preflight.py
      - name: Exact fibration-nef five-dimensional branch-and-bound preflight
        run: python stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_branch_and_bound_preflight.py
      - name: Exact TD02 aggregate bridge preflight
        run: python stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_td02_aggregate_bridge.py
      - name: Exact aggregate Picard lattice preflight
        run: python stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_aggregate_picard_lattice_preflight.py
