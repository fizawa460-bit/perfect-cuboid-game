name: Stage33-07 two coordinate-swap Picard rows

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage33/33-07/certify_two_coordinate_swap_picard_rows.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - '.github/workflows/stage33-07-two-coordinate-swap-picard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: stages/stage33/33-07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Recover the two swap Picard matrices from retained exact marking
        run: python certify_two_coordinate_swap_picard_rows.py
      - name: Enforce exact local-recovery and firewall checks
        run: |
          python - <<'PY'
          import hashlib,json
          x=json.load(open('picard-two-coordinate-swap-actions.json'));h=x.pop('canonical_sha256')
          assert h==hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert x['schema']=='STAGE33_07_TWO_COORDINATE_SWAP_PICARD_ROWS_V2'
          assert len(x['picard_actions_64x64'])==2
          assert all(len(M)==64 and all(len(r)==64 for r in M) for M in x['picard_actions_64x64'])
          e=x['exact_checks']
          assert e['both_geometric_permutations_involutions']
          assert e['both_actions_involutions'] and e['both_actions_unimodular']
          assert e['both_actions_preserve_retained_picard_gram']
          assert e['both_actions_fix_hyperplane'] and e['both_actions_transport_all_140_known_classes']
          assert not e['smith_form_used'] and not e['remote_cas_used']
          assert x['basis_recovery']['all_140_known_classes_integral']
          assert x['basis_recovery']['all_140_hyperplane_pairings_rechecked']
          assert x['execution']['remote_cas_used'] is False
          assert x['stage33_progress']=='6/11' and not x['stage33_08_released']
          assert not x['theorem_credit'] and not x['endpoint_credit']
          for mode in ('swap12','swap13'):
              y=json.load(open(f'picard-action-{mode}.json'));hy=y.pop('canonical_sha256')
              assert hy==hashlib.sha256(json.dumps(y,sort_keys=True,separators=(',',':')).encode()).hexdigest()
              assert y['schema']=='STAGE33_07_PICARD_COORDINATE_SWAP_ROWS_V2'
              assert y['exact_recovery']['all_140_known_classes_transport_exactly']
              assert y['exact_recovery']['picard_gram_preserved'] and y['exact_recovery']['hyperplane_fixed']
              assert not y['exact_recovery']['remote_cas_used'] and not y['exact_recovery']['smith_form_used']
          print('STAGE33_07_TWO_COORDINATE_SWAP_PICARD_ROWS=PASS_EXACT_LOCAL')
          print('CERTIFICATE_SHA256='+h)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-two-coordinate-swap-picard-rows-local
          retention-days: 7
          if-no-files-found: error
          path: |
            stages/stage33/33-07/picard-two-coordinate-swap-actions.json
            stages/stage33/33-07/picard-action-swap12.json
            stages/stage33/33-07/picard-action-swap13.json
