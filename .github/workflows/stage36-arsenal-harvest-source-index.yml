name: Stage36 Arsenal harvest source index
on:
  push:
    branches: [stage36-arsenal-initial-harvest-discovery]
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 256
      - name: Build bounded Stage36 immediate-directory index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          ROOT=Path('stages/stage36')
          UPPER='07a465cb5025e7c0188fb63610bb40e4b54e7a84'
          LOWER='62c26297ebeb159e9cdd1e6b9c2129dff6a4acdc'
          def blob(p):
              return subprocess.check_output(['git','rev-parse',f'HEAD:{p}'],text=True).strip()
          out={'schema':'STAGE36_INITIAL_HARVEST_SOURCE_INDEX_V1','harvest_lower_bound':LOWER,'harvest_upper_bound':UPPER,'scan_contract':'NONRECURSIVE_TOP_LEVEL_PLUS_ONE_LEVEL_STAGE36_DIRECTORIES','top_level_files':[],'clusters':{}}
          for e in sorted(ROOT.iterdir(), key=lambda p:p.name):
              if e.is_file():
                  out['top_level_files'].append({'path':str(e),'size':e.stat().st_size,'blob_sha':blob(str(e))})
              elif e.is_dir():
                  rows=[]
                  for c in sorted(e.iterdir(), key=lambda p:p.name):
                      if c.is_file(): rows.append({'path':str(c),'size':c.stat().st_size,'blob_sha':blob(str(c))})
                  out['clusters'][e.name]=rows
          Path('docs/arsenal/stage36-initial-source-index.tmp.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          git diff --check
      - name: Commit index and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage36-arsenal-harvest-source-index.yml
          git add docs/arsenal/stage36-initial-source-index.tmp.json
          git commit -m 'arsenal: index Stage36 harvest sources'
          git push origin HEAD:stage36-arsenal-initial-harvest-discovery
