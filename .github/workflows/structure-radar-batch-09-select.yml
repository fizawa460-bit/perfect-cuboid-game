name: StructureRadar batch09 selector
on:
  push:
    branches: [structure-radar-deep-corpus-batch-09]
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  select:
    if: github.event_name == 'push' || github.head_ref == 'structure-radar-deep-corpus-batch-09'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize next 60-source bundle and boundary index
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')
          q=json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          t=next(x for x in q['tasks'] if x['status']=='READY')
          ids=t['source_ids']
          src={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              for s in json.loads(p.read_text())['sources']:
                  src[s['source_id']]=s
          selected=[src[i] for i in ids]
          out={'batch_id':'SR-BATCH-STAGE14_15_DEEP_CORPUS-09-R01','task_id':t['task_id'],'source_count':len(selected),'sources':selected}
          (root/'.github/structure-radar-batch-09-selection.json').write_text(json.dumps(out,indent=2)+'\n')
          parts=[]; idx=[]
          for n,s in enumerate(selected,1):
              p=root/s['path']; text=p.read_text(errors='replace')
              parts += [f'===== SOURCE {n:02d}/60 =====',f"SOURCE_ID={s['source_id']}",f"PATH={s['path']}",f"KIND={s['kind']}",f"EVIDENCE_ROLE={s['evidence_role']}",'----- CONTENT -----',text,'===== END SOURCE =====','']
              title=next((ln[2:].strip() for ln in text.splitlines() if ln.startswith('# ')), '')
              flags=[]
              for ln in text.splitlines():
                  z=ln.strip()
                  if re.match(r'^[A-Z][A-Z0-9_]*(?:=|:)', z):
                      flags.append(z)
              seen=set(); compact=[]
              for z in reversed(flags):
                  if z not in seen:
                      seen.add(z); compact.append(z)
                  if len(compact)>=28: break
              compact=list(reversed(compact))
              idx.append({'n':n,'source_id':s['source_id'],'path':s['path'],'kind':s['kind'],'title':title,'boundary_fields':compact})
          (root/'.github/structure-radar-batch-09-bundle.txt').write_text('\n'.join(parts))
          (root/'.github/structure-radar-batch-09-index.json').write_text(json.dumps(idx,indent=2)+'\n')
          for j in range(6):
              (root/f'.github/structure-radar-batch-09-index-{j+1}.json').write_text(json.dumps(idx[j*10:(j+1)*10],indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/structure-radar-batch-09-selection.json .github/structure-radar-batch-09-bundle.txt .github/structure-radar-batch-09-index*.json
          git commit -m 'StructureRadar: materialize batch09 source bundle' || exit 0
          git push origin HEAD:structure-radar-deep-corpus-batch-09
