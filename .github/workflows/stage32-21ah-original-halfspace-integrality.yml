name: Stage32-21ah original-halfspace integrality anti-fixed diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stage32-21ah-original-halfspace-integrality.yml'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_21ah_original_halfspace_integrality.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_reynolds_rank2_antifixed_coset_bound.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_reynolds_rank2_integer_qp.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_reynolds_rank2_integral_projection_bound.py'
      - 'stages/stage32/residual-32-01-production/full178-manifest.json'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'

permissions:
  contents: read

concurrency:
  group: stage32-21ah-halfspace-integrality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'

      - name: Install exact local algebra dependency
        run: python -m pip install 'sympy==1.14.0'

      - name: Test original 140 halfspace integrality functionals on true anti-fixed kernel
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python diagnose_stage32_21ah_original_halfspace_integrality.py \
            --manifest "$GITHUB_WORKSPACE/stages/stage32/residual-32-01-production/full178-manifest.json" \
            --retained "$GITHUB_WORKSPACE/stages/stage33/33-07/picard_base_rows_retained.py" \
            --marking "$GITHUB_WORKSPACE/stages/stage33/33-07/stage32_picard_marking_retained.py" \
            --row-shards 16 \
            --shard-index 0 \
            --output "$GITHUB_WORKSPACE/stage32-21ah-original-halfspace-integrality.json"

      - name: Upload compact diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-21ah-original-halfspace-integrality
          path: stage32-21ah-original-halfspace-integrality.json
          retention-days: 3
          compression-level: 9
