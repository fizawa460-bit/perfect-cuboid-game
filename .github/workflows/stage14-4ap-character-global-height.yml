name: Stage14-4ap character/global/height transfer audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4ap/**'
      - 'stages/stage14/scripts/14-4/character_global_height_transfer_audit.py'
      - 'stages/stage14/data/14-4/character_global_height_transfer_summary.json'
      - 'stages/stage14/main.md'
      - 'stages/stage14/README.md'
      - 'stages/stage14/roadmap.md'
      - '.github/workflows/stage14-4ap-character-global-height.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python stages/stage14/scripts/14-4/character_global_height_transfer_audit.py
      - run: git diff --exit-code stages/stage14/data/14-4/character_global_height_transfer_summary.json
