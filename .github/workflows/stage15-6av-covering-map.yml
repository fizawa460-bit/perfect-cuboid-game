name: Stage15-6av explicit covering map

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6av/**'
      - 'stages/stage15/evidence/stage15_6av_covering_map.json'
      - 'stages/stage15/replay/verify_stage15_6av.py'
      - 'stages/stage15/scripts/stage15_6av_covering_map.py'
      - '.github/workflows/stage15-6av-covering-map.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6av explicit covering map
        run: python stages/stage15/replay/verify_stage15_6av.py
      - name: Compile Stage15-6av utility
        run: python -m py_compile stages/stage15/scripts/stage15_6av_covering_map.py stages/stage15/replay/verify_stage15_6av.py
