name: Stage15-6as twist-height audit

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6as/**'
      - 'stages/stage15/evidence/stage15_6as_twist_height_audit.json'
      - 'stages/stage15/replay/verify_stage15_6as.py'
      - 'stages/stage15/scripts/stage15_6as_twist_height_audit.py'
      - '.github/workflows/stage15-6as-twist-height-audit.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6as twist-height audit
        run: python stages/stage15/replay/verify_stage15_6as.py
      - name: Compile Stage15-6as utility
        run: python -m py_compile stages/stage15/scripts/stage15_6as_twist_height_audit.py stages/stage15/replay/verify_stage15_6as.py
