name: Stage33-11 global arithmetic-localization naturality

on:
  pull_request:
    paths:
      - 'stages/stage33/33-11/**'
      - '.github/workflows/stage33-11-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage33-11-global-naturality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-global-naturality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact local dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' z3-solver
      - name: Rebuild retained order2 localization receiver
        working-directory: stages/stage33/33-07
        run: python materialize_order2_localization_receiver.py
      - name: Profile intrinsic naturality, forced-zero blocks and smallest target images
        run: |
          python -u stages/stage33/33-11/profile_stage33_11_smallest_block_target_images.py
          cat stages/stage33/33-11/stage33-11-intrinsic-at2-naturality.json
          cat stages/stage33/33-11/stage33-11-equivariant-forced-zero-blocks.json
          cat stages/stage33/33-11/stage33-11-smallest-block-target-images.json
      - name: Upload compact exact certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage33-11-intrinsic-at2-naturality
          path: |
            stages/stage33/33-07/actual-coordinate-swap-at2-actions.json
            stages/stage33/33-07/actual-galois-at2-actions.json
            stages/stage33/33-11/stage33-11-intrinsic-at2-naturality.json
            stages/stage33/33-11/stage33-11-equivariant-forced-zero-blocks.json
            stages/stage33/33-11/stage33-11-smallest-block-target-images.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Synchronize Stage33 controller checkpoint
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          python -u stages/stage33/33-11/sync_stage33_controller_checkpoint.py
          git add stages/stage33/controller.json
          if git diff --cached --quiet; then
            echo "Controller already synchronized."
          else
            git commit -m "Stage33-11: synchronize running controller checkpoint"
            git push origin "HEAD:$HEAD_REF"
          fi
