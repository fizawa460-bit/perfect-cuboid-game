name: Stage33-11 global arithmetic-localization naturality

on:
  pull_request:
    paths:
      - 'stages/stage33/33-11/**'
      - '.github/workflows/stage33-11-main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-11-global-naturality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-global-naturality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact local dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' z3-solver
      - name: Rebuild retained order2 localization receiver
        working-directory: stages/stage33/33-07
        run: python materialize_order2_localization_receiver.py
      - name: Run Stage33-11 direct Smith scout with preflight and live stacks
        run: |
          python -u stages/stage33/33-11/run_stage33_11_direct_smith_diagnostic.py
          cat stages/stage33/33-11/stage33-11-direct-smith-naturality.json
      - name: Upload compact scout diagnostics and certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage33-11-direct-smith-naturality
          path: |
            stages/stage33/33-11/stage33-11-direct-smith-preflight.json
            stages/stage33/33-11/stage33-11-direct-smith-naturality.json
          if-no-files-found: ignore
          retention-days: 1
