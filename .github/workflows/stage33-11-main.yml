name: Stage33-11 audit handoff

on:
  pull_request:
    paths:
      - 'stages/stage33/33-11/**'
      - '.github/workflows/stage33-11-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage33-11-audit-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freeze-for-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate audit handoff marker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('stages/stage33/33-11/audit-handoff-current-pr.json')
          x=json.loads(p.read_text())
          assert x['schema']=='STAGE33_11_AUDIT_HANDOFF_CURRENT_PR_V1'
          assert x['mode']=='AUDIT_HANDOFF'
          assert x['main_progression_frozen_in_this_pr'] is True
          assert x['next_expected_command']=='Stage33-audit'
          assert x['exact_audited_progress']=='0/26'
          assert x['firewalls']['stage33_12_released'] is False
          print('STAGE33_11_AUDIT_HANDOFF_MARKER=PASS')
          PY

      - name: Synchronize controller to audit mode only
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          python -u stages/stage33/33-11/sync_stage33_11_audit_handoff.py
          git add stages/stage33/controller.json
          if git diff --cached --quiet; then
            echo "Controller already in audit handoff mode."
          else
            git commit -m "Stage33-11: switch PR1449 controller to audit handoff"
            git push origin "HEAD:$HEAD_REF"
          fi
