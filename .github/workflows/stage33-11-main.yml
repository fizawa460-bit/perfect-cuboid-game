name: Stage33-11 global arithmetic-localization naturality

on:
  pull_request:
    paths:
      - 'stages/stage33/33-11/**'
      - '.github/workflows/stage33-11-main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-11-global-naturality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-global-naturality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact local dependencies
        run: python -m pip install --disable-pip-version-check sympy z3-solver
      - name: Run Stage33-11 absolute naturality scout
        run: |
          python stages/stage33/33-11/certify_stage33_11_global_naturality.py
          cat stages/stage33/33-11/stage33-11-global-naturality-scout.json
      - name: Upload compact scout certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage33-11-global-naturality-scout
          path: stages/stage33/33-11/stage33-11-global-naturality-scout.json
          if-no-files-found: ignore
          retention-days: 1
