name: StructureRadar search08 finalizer
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'structure-radar-search-08-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply literature batch08
        run: |
          python - <<'PY'
          import json, pathlib
          ids=[f'SR-STR-{i:03d}' for i in range(57,65)]
          rp='docs/structure-radar/structure-registry.json'
          r=json.load(open(rp))
          found=[]
          for c in r['structures']:
            if c['structure_id'] in ids:
              assert c['search_status']=='NOT_SEARCHED'
              c['search_status']='SEARCHED'; c['arsenal_decision']='ACTIVE'; c['card_status']='ACTIVE'; found.append(c['structure_id'])
          assert sorted(found)==ids
          open(rp,'w').write(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          pp='docs/structure-radar/progress.json'; p=json.load(open(pp)); bid='SR-BATCH-LITERATURE_SEARCH-08-R01'
          assert not any(x.get('batch_id')==bid for x in p['audit_batches'])
          p['audit_batches'].append({'batch_id':bid,'task_id':'SR-SEARCH-01','status':'SUBMITTED_FOR_AUDIT','source_ids':[],'sources_reviewed':0,'structures_added':0,'structures_updated':8,'structure_carrier_sources':0,'structures_deduped':0,'searches_completed':8,'arsenal_decisions':8,'audit_required':True,'duplicate_source':0,'no_distinct_structure':0})
          open(pp,'w').write(json.dumps(p,indent=2,ensure_ascii=False)+'\n')
          ledger='''# StructureRadar literature ledger — search batch 08

SEARCH_TASK=SR-SEARCH-01
BATCH_ID=SR-BATCH-LITERATURE_SEARCH-08-R01
SEARCH_DATE=2026-08-19
STRUCTURES=SR-STR-057,SR-STR-058,SR-STR-059,SR-STR-060,SR-STR-061,SR-STR-062,SR-STR-063,SR-STR-064
SEARCH_BATCH_SIZE=8
EVIDENCE_POLICY=repo exact receiver first; external primary literature is adjacent unless population/height/quantifiers match
NOVELTY_BY_SEARCH_ABSENCE=false

## SR-STR-057 — Toric master space-diagonal receiver on the two-face host
The equation `x^2 y^2+1=z^2(x^2+y^2)` is retained as the exact Stage19 rational-point receiver. General literature on rational points on fibred Diophantine surfaces does not impose the repo's positivity, primitivity, exact-two-face condition, physical height `R<=B`, or canonical multiplicity. Transfer verdict: `REPO_EXACT_RECEIVER`. Arsenal decision: `ACTIVE`.

## SR-STR-058 — Split-factor nonisotrivial genus-one tau torsor
Genus-one fibrations and torsors are a standard external theorem species, but the displayed split factorization and its binary-quartic fibre are the repo normal form. The existence of a genus-one model alone gives neither a rational section nor the counting saving required by the physical receiver. Transfer verdict: `REPO_EXACT_FIBRATION`. Arsenal decision: `ACTIVE`.

## SR-STR-059 — Tau-adic parity obstruction to a rational section
Local/valuation obstructions are classical, but the tau-adic parity certificate is retained only for the generic function-field fibre. It is not promoted to a statement that specialized physical fibres have no rational points. Transfer verdict: `REPO_LOCAL_NO_SECTION_CERTIFICATE`. Arsenal decision: `ACTIVE`.

## SR-STR-060 — Constant-u bisection genus and physical-degeneration barrier
The constant-u substitution and genus/discriminant classification remain repo-specific. The degree-two boundary points on `z^2=1` are excluded from any physical interior-family promotion. Transfer verdict: `REPO_BISECTION_CLASSIFICATION`. Arsenal decision: `ACTIVE`.

## SR-STR-061 — Affine-linear moving-u multisection discriminant classification
The generic sextic/genus-two calculation and rational discriminant strata are retained exactly; the classification does not extend to quadratic or higher-degree moving `u`. Transfer verdict: `REPO_LINEAR_MULTISECTION_CLASSIFICATION`. Arsenal decision: `ACTIVE`.

## SR-STR-062 — Universal toric physical-height ledger and degree-eight saturation
The formula `h_alg=2d_x+2d_y-g` is a repo physical-height adapter. External rational-point height theory does not change the calibrated fact that R501/R502 saturate `h_alg=8`, nor does saturation exclude polynomially thicker families. Transfer verdict: `REPO_HEIGHT_ADAPTER`. Arsenal decision: `ACTIVE`.

## SR-STR-063 — Tau pushforward invariant and collision receiver
The tau identity and equal-tau collision equation are retained as the exact pushforward receiver. General fibration results require a separately proved uniform support or fibre bound before they can affect the physical count. Transfer verdict: `REPO_PUSHFORWARD_RECEIVER`. Arsenal decision: `ACTIVE`.

## SR-STR-064 — Support-times-max-fiber upper exponent gate
The inequality `N2(B)<=#T(B) max_t w_B(t)` is elementary, but the exponent gate `sigma+phi<1/2` is useful only when both inputs are uniform in the same primitive canonical physical measure. Bonolis--Browning, *Uniform bounds for rational points on hyperelliptic fibrations* (arXiv:2007.14182), and Loughran--Smeets, *Fibrations with few rational points* (arXiv:1511.08027), are adjacent primary literature for fibre/support control; neither is promoted without an exact receiver adapter. Transfer verdict: `REPO_EXACT_COUNTING_GATE_WITH_ADJACENT_LITERATURE`. Arsenal decision: `ACTIVE`.

## Firewalls
- `NOVELTY_BY_SEARCH_ABSENCE=false`.
- Genus-one/no-section statements are not converted into nonexistence of specialized rational points.
- Boundary multisections on `z^2=1` are not physical lower families.
- Linear moving-u classification is not extrapolated to higher-degree multisections.
- Height saturation for one-parameter families does not rule out thicker parameter families.
- Fibration literature is not transferred without exact population, height, multiplicity and quantifier matching.
- No perfect-cuboid existence or nonexistence claim is made.
'''
          pathlib.Path('docs/structure-radar/literature/SR-SEARCH-08.md').write_text(ledger)
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
      - name: Commit official files and self-clean
        run: |
          rm .github/workflows/structure-radar-search08-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'StructureRadar: literature search batch 08'
          git push origin HEAD:${{ github.head_ref }}
