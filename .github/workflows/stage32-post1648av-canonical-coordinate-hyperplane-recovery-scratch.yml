name: Stage32 post1648AV canonical coordinate hyperplane recovery

on:
  push:
    branches:
      - stage32-scratch-post1648av-canonical-node-hyperplane-capacity

permissions:
  contents: read

jobs:
  diagnose-av-canonical-hyperplanes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact scratch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install exact diagnostic dependency
        run: python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run AV canonical coordinate hyperplane recovery
        run: |
          python3 -B stages/stage32/residual-32-01-production/diagnose_stage32_post1648av_canonical_coordinate_hyperplane_recovery.py | tee /tmp/post1648av-hyp.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/post1648av-hyp.json'))
          assert x['mode']=='SCRATCH_POST1648AV_CANONICAL_COORDINATE_HYPERPLANE_RECOVERY'
          g=x['coordinate_W1_W2_W3_C_recovery']
          print(json.dumps({'candidate_group_count':g['candidate_group_count'],'groups':g['groups'],'partition':g['rational_partition_exact'],'exceptional_double_cover':g['each_exceptional_in_exactly_two_coordinate_hyperplanes']},sort_keys=True))
          PY
      - name: Diff hygiene
        run: test -z "$(git status --porcelain)"
