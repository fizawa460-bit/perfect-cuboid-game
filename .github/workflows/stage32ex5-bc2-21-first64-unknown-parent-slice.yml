name: Stage32EX5 BC2-21 first64 UNKNOWN parent slice

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage32-ex5/runkeys/bc2-21-first64-unknown-parent-slice.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_21_first64_retained_unknown_parent_slice.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-21-first64-unknown-parent-slice-preflight.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-20-global-normal-positivity-union-checkpoint.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-19-n354-survivor-normal-positivity-mass-checkpoint.json'
      - '.github/workflows/stage32ex5-bc2-21-first64-unknown-parent-slice.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - id: gate
        name: Validate fresh BC2-21 run-key arm
        shell: bash
        run: |
          set -euo pipefail
          KEY='stages/stage32-ex5/runkeys/bc2-21-first64-unknown-parent-slice.json'
          SOURCE='stages/stage32-ex5/breadth-cycle-2/bc2_21_first64_retained_unknown_parent_slice.py'
          BEFORE='${{ github.event.before }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test '${{ github.event.action }}' = synchronize || exit 0
          test -n "$BEFORE" || exit 0
          test "$(git rev-parse HEAD)" = "$HEAD" || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || exit 0
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          git diff --name-only "$BEFORE" "$HEAD" | grep -Fxq "$KEY" || exit 0
          test -f "$KEY" -a -f "$SOURCE" || exit 0
          python - "$KEY" "$SOURCE" "$BEFORE" <<'PY'
          import json, subprocess, sys
          key_path, source_path, before = sys.argv[1:]
          new = json.load(open(key_path))
          assert new['schema'] == 'STAGE32EX5_BC2_21_FIRST64_UNKNOWN_PARENT_SLICE_RUNKEY_V1'
          assert new['armed'] is True
          assert int(new['generation']) > 0
          assert new['source_git_blob_sha'] == subprocess.check_output(['git','hash-object',source_path], text=True).strip()
          assert new['preflight_canonical'] == '7af1bad407a8bfebdbbe1048a6d309092a16fcae818fd7ba1e26b996e5845c47'
          assert new['bc2_20_checkpoint_canonical'] == '5b702386389913ecae9972e210e67bccca992df3a84eda1199fbe1862e8cec06'
          assert new['target'] == {'first64_retained_unknown_count':64,'source_bc2_19_unknown_count':236,'other_unknown_identity_count':172}
          ex = new['execution']
          assert ex['per_parent_timeout_ms'] == 5000
          assert ex['workflow_timeout_minutes'] == 10
          assert ex['effective_heavy_concurrency'] == 1
          assert ex['artifact_retention_days'] == 1
          assert ex['projected_peak_artifact_bytes'] <= 100000
          assert ex['repository_storage_budget_bytes'] == 524288000
          old_raw = subprocess.run(['git','show',f'{before}:{key_path}'], text=True, capture_output=True)
          if old_raw.returncode == 0:
              old = json.loads(old_raw.stdout)
              assert int(new['generation']) > int(old.get('generation', -1))
          PY
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  first64-slice:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Compile BC2-21
        run: python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_21_first64_retained_unknown_parent_slice.py
      - name: Run exact first64 UNKNOWN slice
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_21_first64_retained_unknown_parent_slice.py \
            --per-parent-timeout-ms 5000 \
            --output "$RUNNER_TEMP/bc2-21.json"
          cat "$RUNNER_TEMP/bc2-21.json"
      - name: Validate scope firewalls
        run: |
          python - "$RUNNER_TEMP/bc2-21.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          assert p['slice']['checked_count'] == 64
          assert p['slice']['source_bc2_19_unknown_count'] == 236
          assert p['slice']['other_unknown_identity_count'] == 172
          assert p['slice']['other_unknown_identities_not_inferred'] is True
          assert p['credit']['whole_first_block_unsat'] is False
          assert p['credit']['full178_complete'] is False
          assert p['credit']['stage32_main_credit'] is False
          assert p['credit']['effectivity_or_actual_curve_existence_proved'] is False
          assert p['firewalls']['other_172_unknown_relabelled_unsat'] is False
          assert p['firewalls']['unknown_relabelled_unsat'] is False
          assert p['firewalls']['main_promotion'] is False
          assert p['firewalls']['merge_authorized'] is False
          print('BC2_21_SCOPE_OK',p['status'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-21-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/bc2-21.json
          retention-days: 1
          compression-level: 0
