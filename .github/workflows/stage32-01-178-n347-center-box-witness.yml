name: Stage32 32-01-178 N347 center-box witness

# Trigger lifecycle: RETIRED
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sat: ${{ steps.n347.outputs.sat }}
      unresolved: ${{ steps.n347.outputs.unresolved }}
      replays: ${{ steps.n347.outputs.replays }}
      canonical: ${{ steps.n347.outputs.canonical }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.13.0.0'
      - name: Verify N347 exact center-box witness harvest
        id: n347
        shell: bash
        run: |
          set -o pipefail
          python stages/stage32/32-01-178/nodes/N347/verify_n347_center_box_witness.py | tee /tmp/n347.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/n347.json'))
          a=d['aggregate']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"sat={a['exact_sat_witness_count']}\n")
              f.write(f"unresolved={a['unresolved_count']}\n")
              f.write(f"replays={a['total_candidate_replays']}\n")
              f.write(f"canonical={d['canonical_sha256_without_this_field']}\n")
          PY
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD

  ledger:
    needs: verify
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    name: N347 ledger SAT=${{ needs.verify.outputs.sat }} UNRESOLVED=${{ needs.verify.outputs.unresolved }} REPLAYS=${{ needs.verify.outputs.replays }}
    steps:
      - run: echo 'N347 exact center-box witness harvest completed.'
