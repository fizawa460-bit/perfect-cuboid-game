name: Stage32 root cleanup phase C

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-root-cleanup-phase-b.yml'
      - 'stages/README.md'
      - 'stages/stage32/README.md'
      - 'stages/stage32/MAIN-STATE.json'
      - 'stages/stage32/verify_main_startup.py'
      - 'stages/stage32/integrated-ex/**'
      - 'stages/stage32/management/**'
      - 'stages/stage32/archive/legacy-root/**'
      - 'stages/stage32/HEAVY_WORKFLOW_POLICY.md'
      - 'stages/stage32/HISTORY.md'
      - 'stages/stage32/ROADMAP-32-01-RESIDUAL-CLOSURE.md'
      - 'stages/stage32/ROADMAP-32-19-21-REANCHOR.md'
      - 'stages/stage32/post1728-remap-audit-handoff.md'
      - 'stages/stage32/verify_root_cleanup_phase_b.py'
      - 'stages/stage32/mainbatch-final-chain-reentry-20260909.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-root-cleanup-phase-c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-phase-c:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Resolve freshness authority
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"

          # Freshness is a separate merge/readiness gate.  Accept the current
          # hostile-audited EX5 merge as reviewed main-only drift without
          # pretending that EX5 was automatically promoted into Stage32 MAIN.
          # Any later main tip must be reviewed again unless already contained.
          if test "$merge_base" = "$current_main"; then
            echo "freshness=contains-current-main"
            exit 0
          fi

          reviewed_main="bf2890ec0b8168f70db803de876024aa6b6d1f6d"
          reviewed_parent_main="e2da76d90a0994af5038023613c6c4084c4c507e"
          reviewed_ex5_head="a5e59bab3f7fe5a31e356c5a78edcbd741b093a6"
          test "$current_main" = "$reviewed_main" || {
            echo "freshness review required: unreviewed main tip $current_main"
            exit 1
          }
          test "$merge_base" = "$reviewed_parent_main"
          test "$(git rev-parse "$current_main^1")" = "$reviewed_parent_main"
          test "$(git rev-parse "$current_main^2")" = "$reviewed_ex5_head"
          echo "freshness=reviewed-ex5-main-drift-no-auto-main-credit"

      - name: Verify MAIN startup authority remains exact
        run: python3 stages/stage32/verify_main_startup.py

      - name: Verify root cleanup and EX1-EX4 integration
        run: python3 stages/stage32/management/verify_root_cleanup_phase_c.py

      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=-blank-at-eof diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
