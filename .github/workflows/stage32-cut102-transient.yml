name: Stage32 CUT103 transient scope/preimage replay

on:
  pull_request:
    branches: [main]
    paths:
      - 'stages/stage32/full178-cut/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cut103:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact runtime dependencies
        run: python -m pip install --disable-pip-version-check sympy z3-solver
      - name: Run CUT103 fresh retained19 replay and scope certificate
        run: |
          python stages/stage32/full178-cut/cut103_scope_preimage_fresh_replay.py \
            --whole-timeout-ms 10000 \
            --branch-timeout-ms 20000 \
            --output stages/stage32/full178-cut/CUT103-result.json
      - name: Upload CUT103 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage32-cut103-result
          path: stages/stage32/full178-cut/CUT103-result.json
          if-no-files-found: warn
