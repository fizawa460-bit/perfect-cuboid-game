name: research-os-retirement-audit-tmp

on:
  push:
    branches:
      - research-os-final-handoff-discovery
    paths:
      - '.github/workflows/research-os-retirement-audit-tmp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-deferred-stages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-os-final-handoff-discovery
          fetch-depth: 1
      - name: Restore Stage32 and Stage33 to PR base
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin ed5940413c11d8b4f315bed167702a0d5f23104f --depth=1
          git checkout FETCH_HEAD -- \
            .github/workflows/stage33-v39-routing.yml \
            stages/stage32/controller.json \
            stages/stage33/33-12/j2-post-v35-evidence-locator-handoff-v36.json \
            stages/stage33/33-12/j2-post-v36-controller-generator-sync-v38.json \
            stages/stage33/33-12/j2-post-v36-startup-authority-repair-v37.json \
            stages/stage33/33-12/j2-post-v38-locator-first-construction-policy-v39.json \
            stages/stage33/33-12/verify_j2_post_v38_locator_first_construction_policy_v39.py \
            stages/stage33/controller.json
          rm -f research-os-retirement-inventory.tmp scripts/research_os_retire_locator_tmp.py stage33-discovery-migration-digests.tmp
          git add -A
          git commit -m 'revert: defer Stage32 and Stage33 locator migration'
          git push
