name: research-os-retirement-audit-tmp

on:
  push:
    branches:
      - research-os-final-handoff-discovery
    paths:
      - '.github/workflows/research-os-retirement-audit-tmp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-os-final-handoff-discovery
          fetch-depth: 1
      - name: Apply Stage33 discovery migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python scripts/research_os_retire_locator_tmp.py
