name: StructureRadar batch18 selector
on:
  push:
    branches: [structure-radar-deep-corpus-batch-18]
    paths: ['.github/structure-radar-batch18-trigger.txt']
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compress registry
        shell: python
        run: |
          import json, pathlib
          reg=json.loads(pathlib.Path('docs/structure-radar/structure-registry.json').read_text())
          lines=[]
          for c in reg['structures']:
              obj=' '.join(c.get('exact_equations_or_object','').split())[:700]
              aliases='; '.join(c.get('search_terms_aliases',[]))[:220]
              lines.append(f"{c['structure_id']}\t{c.get('canonical_math_name','')}\t{obj}\t{aliases}")
          pathlib.Path('.github/structure-radar-batch18-registry.tsv').write_text('\n'.join(lines)+'\n')
      - name: Commit registry summary
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/structure-radar-batch18-registry.tsv
          git commit -m 'StructureRadar batch18 registry summary' || exit 0
          git push
