name: StructureRadar batch18 selector
on:
  push:
    branches: [structure-radar-deep-corpus-batch-18]
    paths: ['.github/structure-radar-batch18-trigger.txt']
permissions:
  contents: write
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source signal digest
        shell: python
        run: |
          import json, pathlib, re
          idx=json.loads(pathlib.Path('.github/structure-radar-batch18-index.json').read_text())
          rx=re.compile(r'(CURRENT_|STRICT_|PROVED|BOUND|BARRIER|RECEIVER|TARGET|PREFERRED|NEXT|NOGO|NO_GO|SAVING|SUBSQRT|T_O_SQRT|POWER|RANK|KUMMER|SELBER|SIEVE|DISPERSION|HEECKE|HECKE|FRIEDLANDER|HUMBERT|ELLIPTIC|CAYLEY|SELECTOR|COLLISION)',re.I)
          out=[]
          for x in idx:
              out.append(f"=== {x['n']:02d} {x['source_id']} {x['title']} ===")
              keep=[z for z in x.get('key_lines',[]) if rx.search(z)]
              for z in keep[:18]: out.append(z)
          pathlib.Path('.github/structure-radar-batch18-digest.txt').write_text('\n'.join(out)+'\n')
      - name: Commit digest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/structure-radar-batch18-digest.txt
          git commit -m 'StructureRadar batch18 source digest' || exit 0
          git push
