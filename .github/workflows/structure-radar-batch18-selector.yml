name: StructureRadar batch18 selector
on:
  push:
    branches: [structure-radar-deep-corpus-batch-18]
    paths: ['.github/structure-radar-batch18-trigger.txt']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize batch18
        shell: python
        run: |
          import json, pathlib
          BATCH='SR-BATCH-STAGE14_15_DEEP_CORPUS-18-R01'
          TASK='SR-CENSUS-STAGE14_15_DEEP_CORPUS-01'
          idx=json.loads(pathlib.Path('.github/structure-radar-batch18-index.json').read_text())
          assert len(idx)==60
          by={x['source_id']:x for x in idx}; ids=[x['source_id'] for x in idx]
          mp={
            1:['SR-STR-038','SR-STR-164'], 2:['SR-STR-164','SR-STR-219'], 3:['SR-STR-219'],
            4:['SR-STR-162','SR-STR-164','SR-STR-219'], 5:['SR-STR-162','SR-STR-163','SR-STR-164'],
            6:['SR-STR-162','SR-STR-163'], 7:['SR-STR-162','SR-STR-163','SR-STR-165'],
            8:['SR-STR-162','SR-STR-163'], 9:['SR-STR-163','SR-STR-164'], 10:['SR-STR-164'], 11:[],
            12:['SR-STR-223'], 13:['SR-STR-164','SR-STR-165'], 14:['SR-STR-165'], 15:['SR-STR-165'],
            16:['SR-STR-165'], 17:['SR-STR-165'], 18:['SR-STR-165'], 19:['SR-STR-164','SR-STR-219'],
            20:['SR-STR-165','SR-STR-222'], 21:['SR-STR-162','SR-STR-222'], 22:['SR-STR-165'],
            23:['SR-STR-163','SR-STR-223'], 24:['SR-STR-164','SR-STR-165'],
            25:['SR-STR-164','SR-STR-225'], 26:['SR-STR-164','SR-STR-225'], 27:['SR-STR-164','SR-STR-225'],
            28:['SR-STR-164','SR-STR-222','SR-STR-225'], 29:['SR-STR-165','SR-STR-225'],
            30:['SR-STR-165','SR-STR-225'], 31:['SR-STR-165','SR-STR-225'], 32:['SR-STR-169','SR-STR-225'],
            33:['SR-STR-165','SR-STR-169','SR-STR-225'], 34:['SR-STR-223'],
            35:['SR-STR-165','SR-STR-169','SR-STR-225'], 36:['SR-STR-165','SR-STR-225'],
            37:['SR-STR-164','SR-STR-225'], 38:['SR-STR-222','SR-STR-225'], 39:['SR-STR-169','SR-STR-225'],
            40:['SR-STR-169','SR-STR-222','SR-STR-225'], 41:['SR-STR-169','SR-STR-222','SR-STR-225'],
            42:['SR-STR-165','SR-STR-169','SR-STR-225'], 43:['SR-STR-169','SR-STR-225'],
            44:['SR-STR-169','SR-STR-225'], 45:['SR-STR-223'], 46:['SR-STR-223'],
            47:['SR-STR-225'], 48:['SR-STR-225'], 49:['SR-STR-225'], 50:['SR-STR-225'],
            51:['SR-STR-163','SR-STR-225'], 52:['SR-STR-200','SR-STR-222'], 53:['SR-STR-200'],
            54:['SR-STR-200','SR-STR-209','SR-STR-222'], 55:['SR-STR-052','SR-STR-222'],
            56:['SR-STR-165','SR-STR-222'], 57:[], 58:['SR-STR-200','SR-STR-209'],
            59:['SR-STR-163','SR-STR-223'], 60:['SR-STR-200','SR-STR-209']
          }
          mapping={x['source_id']:mp[x['n']] for x in idx}
          assert sum(bool(v) for v in mapping.values())==58
          assert sum(not bool(v) for v in mapping.values())==2
          pp=pathlib.Path('docs/structure-radar/progress.json'); progress=json.loads(pp.read_text())
          reviews=progress.setdefault('source_reviews',{})
          for sid in ids:
              e=by[sid]; sids=mapping[sid]
              if sids:
                  reviews[sid]={'fingerprint':e['fingerprint'],'batch_id':BATCH,'status':'STRUCTURES_RECORDED','structure_ids':sids}
              else:
                  reviews[sid]={'fingerprint':e['fingerprint'],'batch_id':BATCH,'status':'NO_DISTINCT_STRUCTURE'}
          batches=progress.setdefault('audit_batches',[])
          batches=[b for b in batches if b.get('batch_id')!=BATCH]
          batches.append({'batch_id':BATCH,'task_id':TASK,'status':'SUBMITTED_FOR_AUDIT','source_ids':ids,
            'sources_reviewed':60,'structures_added':1,'structures_updated':12,'structure_carrier_sources':58,
            'structures_deduped':2,'searches_completed':0,'arsenal_decisions':0,'audit_required':True,
            'duplicate_source':0,'no_distinct_structure':2})
          progress['audit_batches']=batches
          pp.write_text(json.dumps(progress,indent=2,ensure_ascii=False)+'\n')

          rp=pathlib.Path('docs/structure-radar/structure-registry.json'); reg=json.loads(rp.read_text())
          cards={c['structure_id']:c for c in reg['structures']}
          assert max(int(k.rsplit('-',1)[1]) for k in cards)==224
          for cid in ['SR-STR-038','SR-STR-052','SR-STR-162','SR-STR-163','SR-STR-164','SR-STR-165','SR-STR-169','SR-STR-200','SR-STR-209','SR-STR-219','SR-STR-222','SR-STR-223']:
              assert cid in cards
          carrier225=[by[sid] for sid,sids in mapping.items() if 'SR-STR-225' in sids]
          newcard={
            'structure_id':'SR-STR-225',
            'canonical_math_name':'Signed fixed-U Kummer rectangle/Rayleigh receiver and polar-Schatten firewall',
            'exact_equations_or_object':'On the fixed-U shared-divisor-fan Kummer packet, the complete projective kernel has square-root complete trace and an exact rank-one Kummer/Mellin expansion, while the physical selector retains correlated canonical-prime, primitive-cover, hyperbola and reconstruction masks. Those masks admit zero-fixed-power support-energy transfer and a B^o(1) family of pairwise-orthogonal comparator rectangles. Passing to the positive polar operator |C_r| is not zero-loss: its Schatten/leverage mass carries a polynomial auxiliary-prime scale even when the signed matrix has safe Hilbert-Schmidt energy. The quantifier-safe receiver therefore keeps the signed Kummer matrix and asks only for the physical positive mass-vector Rayleigh / vertical TT* defect, equivalently after the t64 reduction a square-lifted cross-ratio incidence; an arbitrary-support polar fourth moment or full operator bound is neither proved nor required.',
            'search_terms_primary':['signed Kummer rectangle Rayleigh bound','polar Schatten obstruction arithmetic large sieve','physical selector Kummer TT star'],
            'search_terms_aliases':['fixed-U Kummer rectangle receiver','polar leverage firewall','mass-vector Rayleigh Kummer gate'],
            'theorem_species':['bilinear dispersion','operator-norm firewall','Kummer character correlation','physical-mass Rayleigh bound'],
            'repo_provenance':[{'source_id':e['source_id'],'path':e['path'],'locator':'normalized Stage14 deep-corpus batch18 signed-Kummer carrier','fingerprint':e['fingerprint']} for e in carrier225],
            'target_populations':['Stage14 fixed-U principal squareclass collision packets after divisor-fan and projective normalization'],
            'potential_weapon_types':['DISPERSION','TT_STAR','KUMMER_CHARACTER','RAYLEIGH_BOUND'],
            'applicability_gaps':['Complete projective cancellation does not control the sparse physical selector.','Taking absolute polar/SVD values creates a fixed-power Schatten/leverage loss and cannot be substituted for the signed physical receiver.','No global Stage14 strict sub-square-root saving is proved by this reduction.'],
            'existing_radar_overlap':['SR-STR-164','SR-STR-165','SR-STR-169','SR-STR-222'],
            'search_status':'NOT_SEARCHED','arsenal_decision':'PENDING','card_status':'SUBMITTED_FOR_AUDIT'
          }
          reg['structures'].append(newcard); cards['SR-STR-225']=newcard
          for sid,sids in mapping.items():
              e=by[sid]
              for cid in sids:
                  c=cards[cid]; prov=c.setdefault('repo_provenance',[])
                  if not any(p.get('source_id')==sid and p.get('fingerprint')==e['fingerprint'] for p in prov):
                      prov.append({'source_id':sid,'path':e['path'],'locator':'normalized Stage14 deep-corpus batch18 carrier','fingerprint':e['fingerprint']})
                  c['card_status']='SUBMITTED_FOR_AUDIT'
          refinements={
            'SR-STR-038':' Stage14-t20 corrects the triple-collision measure to raw-pair edges: for kappa(e)=[d^2-s^2], the trivial class has n_1(B)=3T(B), hence 9T(B)^2<=Q_edge(B). This is an exact population identity, not a collision saving.',
            'SR-STR-052':' Stage14-t68 sharpens the cross-resultant dictionary: after mutually Cayley-private conditioning, a canonical prime divides a cross resultant exactly when it appears as an extra divisor of the partner Cayley factor. Removing those contaminated pairs leaves no generic canonical-prime cross-resultant modulus, so the dictionary is a no-go boundary rather than a fresh saving.',
            'SR-STR-162':' Stage14-t23--t29 supplies a historical active-direction realization of the large-prime complete-descent pipeline: fixed directions have subpolynomial all-scale fibers; non-torsion directions are routed through an explicit [-1] 2-cover/dual-isogeny system, and usable odd large primes are routed into finitely many cover states. A positive-proportion large-prime subfamily or one-column friability split does not bound every active direction, and the visible largest prime is an incidence modulus rather than an independent square-sieve character.',
            'SR-STR-163':' Stage14-t24--t28 gives an explicit rational-2-torsion instance: torsion packets are degree-2 genus-one coverings, the rank branch is a [-1] 2-descent cover, odd primes route through rational/Gaussian/dual-isogeny columns, and the four-linear cover packet has only subpolynomial local state multiplicity. These are structural descent reductions; the moving rank-energy saving is separate.',
            'SR-STR-164':' Stage14-t20--t44 provides an exact raw-edge squareclass collision chain: coprime difference-of-squares factors expose split Gaussian squarefree kernels; fixed-direction collision twists have subpolynomial bounded-height multiplicity; explicit even-quartic/four-linear packets make square/polynomial-sieve routing legal; but when both sides move the off-fiber incidence is Kummer-type and generic two-sided transversality remains an additional theorem problem.',
            'SR-STR-165':' Stage14-t30--t51 records the Gaussian analytic boundary in detail. Auxiliary good-prime quartic characters have complete Weil cancellation, their value symbols transfer to Q(i) Hecke symbols, all character orders admit Gaussian additive/Mellin large-sieve control, and same-modulus differencing exposes genuine quadratic-Hecke characters. None of these complete or one-variable estimates automatically controls the sparse physical selector or the global equal-squareclass principal energy; collapsing product-kernel coefficients before physical cancellation is circular.',
            'SR-STR-169':' Stage14-t48--t59 specializes the correlation-only route to the fixed-U physical selector: the live object is a physical row-correlation / centered projective Kummer kernel, complete projective traces are already square-root sized, rank-one Mellin reassembly has zero fixed-power spectral cost, physical masks transfer safely at support-energy level, and exact comparator relations decompose into B^o(1) orthogonal rectangles. The unresolved input is the same-measure signed selector correlation, not another marginal or complete finite-field bound.',
            'SR-STR-200':' Stage14-t66,t69,t70 gives the earlier fixed-U Cayley/common-support realization: odd primewise Cayley factors select opposite-sign quadratic root lines with only B^o(1) CRT choices; after mutually private canonical primes are removed, the cross-state modulus is the noncanonical common support J. Root-line/CRT multiplicity itself is exponent-neutral and must not be recharged as a second saving.',
            'SR-STR-209':' Stage14-t67,t69,t70 supplies a common-support precursor of the centered/projective-collision gate. Canonical root moduli collapse losslessly, generic private-prime spacing does not improve the natural large-sieve scale, and a small common-support J cannot be ruled out from squareclass algebra alone; any fixed-power gain must use the physical reconstruction/selector measure rather than assume nontrivial overlap.',
            'SR-STR-219':' Stage14-t21--t23 gives a parallel fixed-direction compression: after the split-kernel direction is fixed, one elliptic quotient with rational 2-torsion controls all scales with B^o(1) multiplicity. Thus edge count and active-direction count have the same power exponent; a torsion first-moment saving does not by itself control the partition second moment, and the positive-rank active-direction family remains the moving support problem.',
            'SR-STR-222':' Stage14-t37--t68 is an earlier fixed-U/canonical-prime precursor of this receiver. Fixed canonical prime shells admit genuine internal power saving and a fixed descended packet contains only B^o(1) moving canonical primes, but the critical moving-prime strip persists. Later fixed-U Kummer stratification, projective complete-trace cancellation, Cayley denominator recovery and private-prime reductions all preserve the same conclusion: kernel/local multiplicity is cheap, while the physical selector/canonical-prime correlation is the live density problem.',
            'SR-STR-223':' Stage14-t3--t7 identifies the fixed-base triple curve as a type-4 Humbert--Edge genus-five curve whose Jacobian splits into five elliptic quotients, reducing geometrically to three elliptic types. A physical triple requires compatible lifts/small points on reflected quotient families arising from the same q, with an additional shared-q Pythagorean relation. These fixed-fiber quotient facts and finite rank/torsion tests do not supply a uniform moving-height sub-square-root theorem.'
          }
          for cid,extra in refinements.items():
              c=cards[cid]
              if extra.strip() not in c.get('exact_equations_or_object',''):
                  c['exact_equations_or_object']=c.get('exact_equations_or_object','').rstrip()+extra
          reg['status']='BATCH_SUBMITTED_FOR_AUDIT'
          rp.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')
      - name: Refresh and verify
        run: |
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git diff --check
      - name: Remove temporary helpers and commit
        run: |
          git rm -f --ignore-unmatch .github/structure-radar-batch18-trigger.txt .github/structure-radar-batch18-index.json .github/structure-radar-batch18-summary.txt .github/structure-radar-batch18-registry.tsv .github/structure-radar-batch18-digest.txt .github/workflows/structure-radar-batch18-selector.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/structure-radar
          git commit -m 'StructureRadar: census Stage14-15 deep corpus batch 18'
          git push
