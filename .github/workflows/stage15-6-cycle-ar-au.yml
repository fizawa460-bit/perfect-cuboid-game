name: Stage15-6 cycle ar-au

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6ar/**'
      - 'stages/stage15/15-6as/**'
      - 'stages/stage15/15-6at/**'
      - 'stages/stage15/15-6au/**'
      - 'stages/stage15/15-6-cycle/6ar-6au.md'
      - 'stages/stage15/evidence/stage15_6ar_twist_adapter.json'
      - 'stages/stage15/evidence/stage15_6as_twist_height_audit.json'
      - 'stages/stage15/evidence/stage15_6at_branch_memory_audit.json'
      - 'stages/stage15/evidence/stage15_6au_small_height_twist_audit.json'
      - 'stages/stage15/replay/verify_stage15_6ar.py'
      - 'stages/stage15/replay/verify_stage15_6as.py'
      - 'stages/stage15/replay/verify_stage15_6at.py'
      - 'stages/stage15/replay/verify_stage15_6au.py'
      - '.github/workflows/stage15-6-cycle-ar-au.yml'
  workflow_dispatch:

jobs:
  verify-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 6ar
        run: python stages/stage15/replay/verify_stage15_6ar.py
      - name: Verify 6as
        run: python stages/stage15/replay/verify_stage15_6as.py
      - name: Verify 6at
        run: python stages/stage15/replay/verify_stage15_6at.py
      - name: Verify 6au
        run: python stages/stage15/replay/verify_stage15_6au.py
      - name: Compile cycle utilities
        run: python -m py_compile stages/stage15/scripts/stage15_6ar_twist_adapter.py stages/stage15/scripts/stage15_6as_twist_height_audit.py stages/stage15/scripts/stage15_6at_branch_memory_audit.py stages/stage15/scripts/stage15_6au_small_height_twist_audit.py
