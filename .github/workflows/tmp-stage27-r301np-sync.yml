name: TEMP Stage27 r301n-p lifecycle sync

on:
  push:
    branches:
      - agent/stage27-20-r301n-p-common-jacobian
    paths:
      - '.github/workflows/tmp-stage27-r301np-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-20-r301n-p-common-jacobian
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize audited k-m closeout and register n-p
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')

          # Materialize the already-audited/merged r301k-m lifecycle.
          for suffix in 'klm':
              p=root/f'stages/stage27/27-20-r301{suffix}/result.md'
              s=p.read_text()
              s=s.replace('STATUS=BATCH_SUBMITTED_PENDING_FRESH_AUDIT','STATUS=AUDITED_PASS_MERGED',1)
              marker=f'STAGE27_20_R301{suffix.upper()}_STATUS=BATCH_SUBMITTED_PENDING_FRESH_AUDIT'
              s=s.replace(marker, f'STAGE27_20_R301{suffix.upper()}_STATUS=AUDITED_PASS_MERGED')
              p.write_text(s)

          oldp=root/'stages/stage27/27-20-r301k-m/batch-registry.json'
          old=json.loads(oldp.read_text())
          old.update({
              'status':'AUDITED_PASS_MERGED',
              'audit_status':'PASS',
              'merge_allowed':True,
              'advance_allowed':True,
              'fresh_reaudit_required':False,
              'final_audit_verdict':'PASS',
              'merged':True,
              'merge_commit':'800532681ad086a0ad3894f0e56cbcbf1c2b0ec3',
              'next_derived_route':'27-20-r301n'
          })
          oldp.write_text(json.dumps(old,indent=2)+'\n')

          # Update the old verifier so the new final lifecycle is canonical.
          vp=root/'stages/stage27/27-20-r301k-m/verify_27_20_r301k_m.py'
          v=vp.read_text()
          v=v.replace('assert reg["status"] == "BATCH_SUBMITTED_PENDING_FRESH_AUDIT"','assert reg["status"] == "AUDITED_PASS_MERGED"')
          v=v.replace('assert reg["audit_status"] == "PENDING"','assert reg["audit_status"] == "PASS"')
          v=v.replace('assert reg["merge_allowed"] is False','assert reg["merge_allowed"] is True')
          v=v.replace('assert reg["fresh_reaudit_required"] is True','assert reg["fresh_reaudit_required"] is False')
          v=v.replace('assert route["status"] == "BATCH_SUBMITTED_PENDING_FRESH_AUDIT"','assert route["status"] == "AUDITED_PASS_MERGED"')
          v=v.replace('assert route["audit_status"] == "PENDING"','assert route["audit_status"] == "PASS"')
          v=v.replace('assert route["merge_allowed"] is False','assert route["merge_allowed"] is True')
          v=v.replace('assert route["advance_allowed"] is False','assert route["advance_allowed"] is True')
          vp.write_text(v)

          cp=root/'stages/stage27/27-controller.json'
          ctl=json.loads(cp.read_text())
          dr=ctl['derived_routes']
          for suffix in 'klm':
              r=dr[f'Stage27-20-r301{suffix}']
              r.update({
                  'status':'AUDITED_PASS_MERGED',
                  'audit_status':'PASS',
                  'audit_verdict':'PASS',
                  'merge_allowed':True,
                  'advance_allowed':True,
                  'merged':True,
                  'pr':1046,
                  'merge_commit':'800532681ad086a0ad3894f0e56cbcbf1c2b0ec3',
                  'audit_record':'stages/stage27/27-20-r301k-m/audit.md'
              })

          dr.update({
            'Stage27-20-r301n': {
              'trigger_checkpoint':40,'route_kind':'UPPER_REENTRY_PREFLIGHT','source_stage':'Stage20',
              'parent_route':'Stage27-20-r301m','batch_audit_group':'Stage27-20-r301n-p',
              'status':'BATCH_SUBMITTED_PENDING_FRESH_AUDIT','audit_status':'PENDING',
              'merge_allowed':False,'advance_allowed':False,
              'result_path':'stages/stage27/27-20-r301n/result.md',
              'common_jacobian_independent_of_delta':True,
              'common_jacobian_full_rational_2_torsion':True,
              'mordell_weil_rank_depends_on_delta':False,
              'uniform_covering_height_transfer_proved':False,
              'strict_sub_sqrt_upper_proved':False,'next_derived_route':'27-20-r301o'
            },
            'Stage27-20-r301o': {
              'trigger_checkpoint':40,'route_kind':'UPPER_REENTRY_PREFLIGHT','source_stage':'Stage20',
              'parent_route':'Stage27-20-r301n','batch_audit_group':'Stage27-20-r301n-p',
              'status':'BATCH_SUBMITTED_PENDING_FRESH_AUDIT','audit_status':'PENDING',
              'merge_allowed':False,'advance_allowed':False,
              'result_path':'stages/stage27/27-20-r301o/result.md',
              'rank_variation_in_delta_eliminated':True,
              'uniform_fixed_x_aggregate_subpower_proved':False,
              'uniform_covering_height_transfer_proved':False,
              'strict_sub_sqrt_upper_proved':False,'next_derived_route':'27-20-r301p'
            },
            'Stage27-20-r301p': {
              'trigger_checkpoint':40,'route_kind':'UPPER_REENTRY_PREFLIGHT','source_stage':'Stage20',
              'parent_route':'Stage27-20-r301o','batch_audit_group':'Stage27-20-r301n-p',
              'status':'BATCH_SUBMITTED_PENDING_FRESH_AUDIT','audit_status':'PENDING',
              'merge_allowed':False,'advance_allowed':False,
              'result_path':'stages/stage27/27-20-r301p/result.md',
              'common_jacobian_full_2_descent_available':True,
              'uniform_selmer2_cardinality_subpolynomial':True,
              'uniform_rank_bound':'O(log B/log log B)',
              'uniform_point_count_subpower_from_rank_proved':False,
              'uniform_regulator_lower_bound_proved':False,
              'strict_sub_sqrt_upper_proved':False,
              'new_mu_lt_half_proved':False,'true_n2_exponent_identified':False,
              'next_derived_route':'27-20-r301q',
              'stop_reason':'UNIFORM_OR_AVERAGED_REGULATOR_HEIGHT_OR_OCCUPIED_SUPPORT_THEOREM_REQUIRED'
            }
          })

          assert ctl['state']['CURRENT_CHECKPOINT']==40
          assert ctl['state']['NEXT_CHECKPOINT']==40
          assert ctl['state']['ADVANCE_ALLOWED'] is False
          cp.write_text(json.dumps(ctl,indent=2)+'\n')
          PY

          python stages/stage27/27-20-r301k-m/verify_27_20_r301k_m.py
          python stages/stage27/27-20-r301n-p/verify_27_20_r301n_p.py
          git add stages/stage27/27-20-r301k stages/stage27/27-20-r301l stages/stage27/27-20-r301m stages/stage27/27-20-r301k-m stages/stage27/27-controller.json
          git diff --check --cached
          git commit -m 'Sync Stage27 r301k-m audit and register r301n-p'
          git push origin HEAD:agent/stage27-20-r301n-p-common-jacobian
