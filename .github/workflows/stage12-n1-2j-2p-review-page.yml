# The Stage12-N1-2j source snapshot below includes only the R01 form-feed repair.
name: Stage12-N1-2j-2p review page

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/proof-chain-2j-to-2p-review-page.md"
      - "docs/archive/stage12-n1-2/stage12-n1-2j-boundary-layers.md"
      - "docs/archive/stage12-n1-2/stage12-n1-2k-final-remainder.md"
      - "docs/archive/stage12-n1-2/stage12-n1-2l-dlb-hypotheses.md"
      - "docs/archive/stage12-n1-2/stage12-n1-2m-iterated-selberg-delange.md"
      - "docs/archive/stage12-n1-2/stage12-n1-2n-coupled-region.md"
      - "docs/archive/stage12-n1-2/stage12-n1-2o-analytic-closure.md"
      - "docs/archive/stage12-n1-2/stage12-n1-2p-final-bookkeeping.md"
      - "scripts/build_stage12_n1_2j_2p_review_html.py"
      - "review/PC-N1-2J-2P-PROOF-CHAIN-20260807-R01.html"
      - ".github/workflows/stage12-n1-2j-2p-review-page.yml"

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build self-contained HTML
        run: |
          python -m py_compile scripts/build_stage12_n1_2j_2p_review_html.py
          python scripts/build_stage12_n1_2j_2p_review_html.py
      - name: Verify generated HTML
        shell: bash
        run: |
          page=review/PC-N1-2J-2P-PROOF-CHAIN-20260807-R01.html
          test -s "$page"
          grep -Fq 'BUNDLE_ID=PC-N1-2J-2P-PROOF-CHAIN-20260807-R01' "$page"
          grep -Fq 'SOURCE_SNAPSHOT_COMMIT=cbc1c6f7840b99d26e5f71f1deaf8bfd470f34c8' "$page"
          grep -Fq 'CHECKPOINT=START_OF_MAIN' "$page"
          grep -Fq 'CHECKPOINT=END_OF_MAIN' "$page"
          grep -Fq 'END_OF_BUNDLE=PC-N1-2J-2P-PROOF-CHAIN-20260807-R01' "$page"
          grep -Fq 'SOURCE 7 / 7 — Stage12-N1-2p' "$page"
          ! grep -Pq '\x0c' "$page"
          test "$(wc -c < "$page")" -gt 40000
      - name: Commit generated HTML to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          page=review/PC-N1-2J-2P-PROOF-CHAIN-20260807-R01.html
          if git diff --quiet -- "$page" && git ls-files --error-unmatch "$page" >/dev/null 2>&1; then
            echo "Generated HTML is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$page"
          git commit -m "Generate Stage12 2j-2p review HTML"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload generated HTML
        uses: actions/upload-artifact@v4
        with:
          name: stage12-n1-2j-2p-review-html
          path: review/PC-N1-2J-2P-PROOF-CHAIN-20260807-R01.html
          if-no-files-found: error
          retention-days: 7
