name: Stage33-07 finite swap naturality envelope

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/certify_finite_swap_candidate_naturality_envelope.py'
      - 'stages/stage33/33-07/certify_retained_geometric_sign_intertwiner_space.py'
      - 'stages/stage33/33-07/retained-q256-geometric-sign-endpoint.json'
      - 'stages/stage33/33-07/exceptional-p1-tangent-coordinates.json'
      - 'stages/stage33/33-07/materialize_order2_first_residue_functions.py'
      - 'stages/stage33/33-07/materialize_order2_localization_receiver.py'
      - 'stages/stage33/33-07/two-primary-residue-invariant-basis.json'
      - '.github/workflows/stage33-07-finite-swap-naturality-envelope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: stages/stage33/33-07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact algebra and Boolean solver
        run: python -m pip install --disable-pip-version-check --no-input 'sympy==1.14.0' 'z3-solver==4.15.3.0'
      - name: Reproduce finite localization receiver
        run: python materialize_order2_localization_receiver.py
      - name: Enumerate every admissible finite coordinate-swap pair and naturality envelope
        run: python certify_finite_swap_candidate_naturality_envelope.py
      - name: Enforce complete conservative envelope and firewalls
        run: |
          python - <<'PY'
          import hashlib,json
          p='finite-swap-candidate-naturality-envelope.json';x=json.load(open(p));h=x.pop('canonical_sha256')
          assert h==hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert x['schema']=='STAGE33_07_FINITE_SWAP_CANDIDATE_NATURALITY_ENVELOPE_V1'
          ex=x['execution'];assert ex['remote_cas_used'] is False and ex['z3_exact_boolean_solver_used'] and ex['candidate_enumeration_complete']
          f=x['finite_receiver_problem'];assert f['A_T2_dimension_f2']==14 and f['swap12_linear_intertwiner_dimension_f2']==33 and f['swap13_linear_intertwiner_dimension_f2']==33 and f['candidate_pair_count']>=1
          s=x['source_geometry'];assert s['boundary_permutations_reconstructed_from_exact_qi_nodes'] and s['source_swap_actions_satisfy_S3']
          n=x['naturality_envelope'];assert n['ambient_matrix_space_dimension_f2']==416 and n['seven_sign_only_constraint_rank_f2']==270 and n['seven_sign_only_remaining_dimension_f2']==146
          assert n['minimum_remaining_dimension_f2']<=n['maximum_remaining_dimension_f2']<=146
          e=x['exact_consequence'];assert e['actual_geometric_finite_swap_pair_is_contained_in_candidate_set'] and e['all_26_source_columns_treated_uniformly']
          assert e['connecting_matrix_columns_explicitly_materialized']==0 and not e['middle_gersten_module_action_materialized'] and not e['absolute_delta_loc_computed'] and not e['project_14x26_L_squareclass_tensor_materialized'] and not e['arithmetic_HS_closed']
          assert x['stage33_progress']=='6/11' and not x['stage33_08_released'] and not x['theorem_credit'] and not x['endpoint_credit']
          print('STAGE33_07_FINITE_SWAP_NATURALITY_ENVELOPE=PASS_EXACT')
          print('CANDIDATE_PAIRS='+str(f['candidate_pair_count']))
          print('REMAINING_HIST='+json.dumps(n['remaining_dimension_histogram'],sort_keys=True))
          print('UNIQUE_ROWSPACES='+str(n['unique_constraint_rowspace_count']))
          print('ROBUST_ZERO='+str(n['finite_v4_delta_loc_forced_zero_for_every_admissible_candidate']).lower())
          print('CERT_SHA256='+h);print('NEXT='+x['next_exact_leaf'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-finite-swap-naturality-envelope
          retention-days: 5
          if-no-files-found: error
          path: stages/stage33/33-07/finite-swap-candidate-naturality-envelope.json
