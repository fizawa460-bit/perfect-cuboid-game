name: Stage32 post-21bl fresh Picard64 pairing inversion audit

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'stages/stage32/32-21/post-21bl-picard64-witness-adapter.json'
      - 'stages/stage32/residual-32-01-production/audit_stage32_post21bl_picard64_witness.py'
      - '.github/workflows/stage32-post21bl-picard64-witness-audit.yml'

permissions:
  contents: read

concurrency:
  group: stage32-post21bl-picard64-witness-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Independently invert retained-basis pairings to Picard64 and replay the original slice
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python audit_stage32_post21bl_picard64_witness.py \
            --evidence21bl "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bl-joint-integer-witness.json" \
            --adapter-evidence "$GITHUB_WORKSPACE/stages/stage32/32-21/post-21bl-picard64-witness-adapter.json" \
            --retained "$GITHUB_WORKSPACE/stages/stage33/33-07/picard_base_rows_retained.py" \
            --marking "$GITHUB_WORKSPACE/stages/stage33/33-07/stage32_picard_marking_retained.py" \
            --output "$RUNNER_TEMP/stage32-post21bl-picard64-witness-audit.json"
      - name: Upload compact fresh audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage32-post21bl-picard64-witness-audit
          path: ${{ runner.temp }}/stage32-post21bl-picard64-witness-audit.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9
