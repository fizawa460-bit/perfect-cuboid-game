name: Two-face Mordell-Weil stage 3

on:
  pull_request:
    paths:
      - "data/two_face_cuboids_1e6_kummer_classification.json"
      - "data/two_face_cuboids_1e6_mordell_weil_relations.json"
      - "data/two_face_cuboids_1e6_mordell_weil_report.json"
      - "data/two_face_cuboids_1e6_pari_rank_report.json"
      - "data/two_face_cuboids_1e6_all_fibers_pari_report.json"
      - "data/two_face_cuboids_lambda_16_21_pari_report.json"
      - "docs/face-ratio-geometry-research.md"
      - "scripts/analyze_two_face_mordell_weil.py"
      - "scripts/audit_focus_fiber_with_pari.py"
      - "scripts/audit_repeated_fibers_with_pari.py"
      - "scripts/audit_all_observed_fibers_with_pari.py"
      - "scripts/update_two_face_mordell_weil_stage3_memo.py"
      - "scripts/update_two_face_all_fibers_stage4_memo.py"
      - ".github/workflows/two-face-mordell-weil-stage3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-relations:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate exact relation audit
        run: |
          python scripts/analyze_two_face_mordell_weil.py \
            --write-derived generated-mordell-weil-relations.json \
            --write-report generated-mordell-weil-report.json

      - name: Install PARI GP
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pari-gp
          gp --version

      - name: Audit lambda 16/21 with PARI 2-descent
        run: |
          python scripts/audit_focus_fiber_with_pari.py \
            --relations generated-mordell-weil-relations.json \
            --lambda 16/21 \
            --effort 1 \
            --write-report generated-lambda-16-21-pari-report.json

      - name: Audit repeated fibers with PARI 2-descent
        run: |
          python scripts/audit_repeated_fibers_with_pari.py \
            --relations generated-mordell-weil-relations.json \
            --effort 0 \
            --timeout-per-fiber 120 \
            --write-report generated-pari-rank-report.json

      - name: Audit all observed fibers and seed saturation
        run: |
          python scripts/audit_all_observed_fibers_with_pari.py \
            --relations generated-mordell-weil-relations.json \
            --effort 0 \
            --retry-effort 2 \
            --saturation-bound 100 \
            --timeout-per-fiber 180 \
            --workers 4 \
            --write-report generated-all-fibers-pari-report.json

      - name: Generate research memo
        run: |
          python scripts/update_two_face_mordell_weil_stage3_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --output generated-stage3-memo.md
          python scripts/update_two_face_all_fibers_stage4_memo.py \
            --input generated-stage3-memo.md \
            --report generated-all-fibers-pari-report.json \
            --output generated-face-ratio-geometry-research.md
          grep -n "4.13 観測済み193ファイバー全体" generated-face-ratio-geometry-research.md
          if grep -P "\t" generated-face-ratio-geometry-research.md; then
            echo "Unexpected tab found in generated Markdown" >&2
            exit 1
          fi

      - name: Compare committed outputs with regenerated results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pairs = [
              (Path("data/two_face_cuboids_1e6_mordell_weil_relations.json"), Path("generated-mordell-weil-relations.json")),
              (Path("data/two_face_cuboids_1e6_mordell_weil_report.json"), Path("generated-mordell-weil-report.json")),
              (Path("data/two_face_cuboids_1e6_pari_rank_report.json"), Path("generated-pari-rank-report.json")),
              (Path("data/two_face_cuboids_1e6_all_fibers_pari_report.json"), Path("generated-all-fibers-pari-report.json")),
              (Path("data/two_face_cuboids_lambda_16_21_pari_report.json"), Path("generated-lambda-16-21-pari-report.json")),
          ]
          for committed, generated in pairs:
              if not committed.exists():
                  raise SystemExit(f"required committed output is missing: {committed}")
              expected = json.loads(committed.read_text(encoding="utf-8"))
              actual = json.loads(generated.read_text(encoding="utf-8"))
              if expected != actual:
                  raise SystemExit(f"{committed} differs from regenerated output")

          def extract_section(text: str, prefix: str) -> str:
              lines = text.splitlines()
              try:
                  start = next(
                      index for index, line in enumerate(lines)
                      if line.startswith(prefix)
                  )
              except StopIteration as exc:
                  raise SystemExit(f"missing memo section: {prefix}") from exc
              end = len(lines)
              for index in range(start + 1, len(lines)):
                  line = lines[index]
                  if line.startswith("### 4.") or line.startswith("## 5.") or line.startswith("<!-- TWO_FACE_STAGE5_START -->"):
                      end = index
                      break
              return "\n".join(lines[start:end]).strip()

          committed_memo = Path("docs/face-ratio-geometry-research.md").read_text(encoding="utf-8")
          generated_memo = Path("generated-face-ratio-geometry-research.md").read_text(encoding="utf-8")
          for prefix in (
              "### 4.12 楕円ファイバー上のMordell–Weil関係",
              "### 4.13 観測済み193ファイバー全体のrank・飽和監査",
          ):
              if extract_section(committed_memo, prefix) != extract_section(generated_memo, prefix):
                  raise SystemExit(f"committed memo section differs from regenerated section: {prefix}")
          PY

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: two-face-mordell-weil-stage4
          path: |
            generated-mordell-weil-relations.json
            generated-mordell-weil-report.json
            generated-pari-rank-report.json
            generated-all-fibers-pari-report.json
            generated-lambda-16-21-pari-report.json
            generated-face-ratio-geometry-research.md
