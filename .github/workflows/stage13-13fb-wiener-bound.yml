name: Stage13-13fb explicit Wiener bound

on:
  pull_request:
    paths:
      - 'stages/stage13/13-13fb/**'
      - 'stages/stage13/scripts/13-13fb/**'
      - 'stages/stage13/data/13-13fb/**'
      - 'stages/stage13/13-12ad/result.md'
      - 'stages/stage13/13-13f/r05-repair-plan.md'
      - 'stages/stage13/13-13/roadmap.md'
      - '.github/workflows/stage13-13fb-wiener-bound.yml'
  push:
    branches: [main]
    paths:
      - 'stages/stage13/13-13fb/**'
      - 'stages/stage13/scripts/13-13fb/**'
      - 'stages/stage13/data/13-13fb/**'
      - 'stages/stage13/13-12ad/result.md'
      - 'stages/stage13/13-13f/r05-repair-plan.md'
      - 'stages/stage13/13-13/roadmap.md'
      - '.github/workflows/stage13-13fb-wiener-bound.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiener-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute exact Wiener constants
        run: python stages/stage13/scripts/13-13fb/wiener_bound_audit.py --write-report > /tmp/stage13-13fb-report.json
      - name: Verify committed report is reproducible
        run: git diff --exit-code -- stages/stage13/data/13-13fb/wiener_bound_audit.json
      - name: Verify lemma contract and PASS status
        run: python stages/stage13/scripts/13-13fb/wiener_bound_audit.py --check-report
