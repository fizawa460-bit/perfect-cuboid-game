name: Stage32 32-02 scalar producer E2E

# ACTIVE_AUTO: current audit-repair leaf for PR #1790 only. It performs no
# production search and uploads no artifacts; it is exact-head CI evidence.
on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  scalar-e2e:
    if: github.event.pull_request.number == 1790 && github.event.pull_request.head.ref == 'stage32-02-scalar-producer-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Verify checkout is the triggering exact head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Regenerate lifecycle inventory from the exact live workflow set
        run: python docs/research-os/policies/verify_repo_workflow_trigger_inventory.py --write-inventory
      - name: Commit regenerated lifecycle inventory
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- docs/research-os/policies/repo-workflow-trigger-inventory-20260911.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/research-os/policies/repo-workflow-trigger-inventory-20260911.json
            git commit -m 'Stage32 32-02 regenerate workflow lifecycle inventory'
            git push origin HEAD:"$HEAD_BRANCH"
          fi
      - name: Run selected64 producer and source-locked E2E replay
        run: |
          set -euo pipefail
          python -B stages/stage32/final-chain/32-02-effectivity/scalar-producer-research/verify_pairing_scalar_producer.py
          python -B stages/stage32/final-chain/32-02-effectivity/scalar-producer-research/verify_source_locked_known_curve_scalar.py
          python -B stages/stage32/final-chain/32-02-effectivity/scalar-producer-research/verify_scalar_e2e.py
