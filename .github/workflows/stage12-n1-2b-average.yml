name: Stage12-N1-2b average audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage12-n1-2b-average
    paths:
      - "scripts/audit_shared_p_average_stage12_n1_2b.py"
      - "scripts/update_shared_p_average_stage12_n1_2b_memo.py"
      - "data/shared_p_average_stage12_n1_2b_report.json"
      - "docs/face-ratio-geometry-research.md"
      - ".github/workflows/stage12-n1-2b-average.yml"
  pull_request:
    paths:
      - "scripts/audit_shared_p_average_stage12_n1_2b.py"
      - "scripts/update_shared_p_average_stage12_n1_2b_memo.py"
      - "data/shared_p_average_stage12_n1_2b_report.json"
      - "docs/face-ratio-geometry-research.md"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run audit
        run: |
          python -m py_compile scripts/audit_shared_p_average_stage12_n1_2b.py
          python -m py_compile scripts/update_shared_p_average_stage12_n1_2b_memo.py
          python scripts/audit_shared_p_average_stage12_n1_2b.py --write-report /tmp/report.json
          diff -u data/shared_p_average_stage12_n1_2b_report.json /tmp/report.json
          python scripts/update_shared_p_average_stage12_n1_2b_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --report data/shared_p_average_stage12_n1_2b_report.json \
            --output /tmp/memo.md
          diff -u docs/face-ratio-geometry-research.md /tmp/memo.md
