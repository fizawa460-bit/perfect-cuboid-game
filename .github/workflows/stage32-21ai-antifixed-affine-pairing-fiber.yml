name: Stage32-21ai anti-fixed affine pairing fiber structure

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stage32-21ai-antifixed-affine-pairing-fiber.yml'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_21ai_antifixed_affine_pairing_fiber.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_reynolds_lattice_diagnostic.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_reynolds_rank2_integral_projection_bound.py'
      - 'stages/stage32/residual-32-01-production/hperp_integral_adapter.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'

permissions:
  contents: read

concurrency:
  group: stage32-21ai-antifixed-affine-fiber-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'

      - name: Install exact local algebra dependency
        run: python -m pip install 'sympy==1.14.0'

      - name: Reconstruct exact saturated anti-fixed pairing fiber
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python diagnose_stage32_21ai_antifixed_affine_pairing_fiber.py \
            --retained "$GITHUB_WORKSPACE/stages/stage33/33-07/picard_base_rows_retained.py" \
            --marking "$GITHUB_WORKSPACE/stages/stage33/33-07/stage32_picard_marking_retained.py" \
            --output "$GITHUB_WORKSPACE/stage32-21ai-antifixed-affine-pairing-fiber.json"

      - name: Upload compact diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-21ai-antifixed-affine-pairing-fiber
          path: stage32-21ai-antifixed-affine-pairing-fiber.json
          retention-days: 3
          compression-level: 9
