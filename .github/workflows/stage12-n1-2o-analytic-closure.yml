name: Stage12-N1-2o analytic-closure audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/stage12-n1-2o-analytic-closure.md"
      - "scripts/audit_analytic_closure_stage12_n1_2o.py"
      - "data/analytic_closure_stage12_n1_2o_report.json"
      - ".github/workflows/stage12-n1-2o-analytic-closure.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run analytic-closure audit
        run: |
          python -m py_compile scripts/audit_analytic_closure_stage12_n1_2o.py
          python scripts/audit_analytic_closure_stage12_n1_2o.py --write-report /tmp/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('data/analytic_closure_stage12_n1_2o_report.json').read_text())
          actual = json.loads(Path('/tmp/report.json').read_text())
          assert expected == actual, (expected, actual)
          PY
