name: Stage32 residual32-01 full178 resumable production

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage32/runkeys/residual32-01-full178-resumable-production.json'
      - 'stages/stage32/residual-32-01-production/run_full178_resumable_work_unit.py'
      - 'stages/stage32/residual-32-01-production/resumable_prefix_engine.py'
      - 'stages/stage32/residual-32-01-production/verify_resumable_production_cold_preflight.py'
      - '.github/workflows/stage32-residual32-01-full178-resumable-production.yml'

permissions:
  contents: read
  actions: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      matrix: ${{ steps.gate.outputs.matrix }}
      carry: ${{ steps.gate.outputs.carry }}
      production_generation: ${{ steps.gate.outputs.production_generation }}
      dispatch_count: ${{ steps.gate.outputs.dispatch_count }}
      carry_count: ${{ steps.gate.outputs.carry_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Reverify cold resumable production preflight
        run: python stages/stage32/residual-32-01-production/verify_resumable_production_cold_preflight.py
      - id: gate
        name: Verify fresh dedicated resumable production arm and exact FIFO frontier
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          KEY='stages/stage32/runkeys/residual32-01-full178-resumable-production.json'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          echo 'matrix={"work_unit":[]}' >> "$GITHUB_OUTPUT"
          echo 'carry=[]' >> "$GITHUB_OUTPUT"
          echo 'production_generation=0' >> "$GITHUB_OUTPUT"
          echo 'dispatch_count=0' >> "$GITHUB_OUTPUT"
          echo 'carry_count=0' >> "$GITHUB_OUTPUT"
          [ "$ACTION" = synchronize ] || exit 0
          [ -n "${BEFORE:-}" ] || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || exit 0
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          mapfile -t changed < <(git diff --name-only "$BEFORE" "$HEAD")
          [ "${#changed[@]}" -eq 1 ] || exit 0
          [ "${changed[0]}" = "$KEY" ] || exit 0
          python - "$BEFORE" "$KEY" "$GITHUB_OUTPUT" <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,tempfile,zipfile
          sys.path.insert(0,'stages/stage32/residual-32-01-production')
          from run_full178_resumable_work_unit import decode_input

          before,key,out=sys.argv[1:]
          old=json.loads(subprocess.check_output(['git','show',f'{before}:{key}'],text=True))
          new=json.load(open(key))
          schema='STAGE32_RESIDUAL32_01_FULL178_RESUMABLE_PRODUCTION_RUNKEY_V1'
          assert old['schema']==new['schema']==schema
          assert old['workload']==new['workload']=='FULL178_EXACT_PAIRING_PREFIX_RESUMABLE_PRODUCTION'
          assert int(new['revision'])==int(old['revision'])+1==1
          assert old['armed'] is False and new['armed'] is True
          assert int(new['production_generation'])==34
          assert new['source_mode']=='BOOTSTRAP_LOCKED_OLD_FRONTIER_V1'
          assert int(new['source_frontier_count'])==218
          assert int(new['dispatch_count'])==128
          assert int(new['carry_count'])==90
          assert int(new['dispatch_count'])+int(new['carry_count'])==int(new['source_frontier_count'])
          assert int(new['node_limit_per_work_unit'])==64000000
          assert int(new['max_unresolved_children_per_input'])==1
          assert float(new['structural_reproduction_upper_bound'])==1.0
          assert int(new['effective_heavy_concurrency'])==17
          assert int(new['other_stage32_heavy_overlap_bound'])==1
          assert int(new['maximum_effective_stage32_heavy_overlap'])==18
          assert int(new['effective_heavy_concurrency'])+int(new['other_stage32_heavy_overlap_bound'])<=18
          assert float(new['projected_peak_artifact_mb'])<500
          assert int(new['intermediate_retention_days'])==1
          assert int(new['frontier_manifest_retention_days'])==7
          assert new['FULL_178_ROW_SWEEP_AUTHORIZED'] is True
          assert new['B18_RELEASE_AUTHORIZED'] is False
          assert new['THEOREM_CREDIT'] is False and new['RECEIVER_CREDIT'] is False

          def digest(v):
              return hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          def load_slice(spec,root):
              aid=int(spec['artifact_id']); zp=root/f'{aid}.zip'
              url=f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/artifacts/{aid}/zip"
              subprocess.check_call(['curl','-fsSL','-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",'-H','X-GitHub-Api-Version: 2022-11-28',url,'-o',str(zp)])
              assert hashlib.sha256(zp.read_bytes()).hexdigest()==spec['artifact_zip_sha256']
              with zipfile.ZipFile(zp) as z:
                  m=json.loads(z.read('wave-manifest.json'))
              claimed=m.pop('canonical_sha256_without_this_field')
              assert digest(m)==claimed==spec['manifest_canonical_sha256']
              assert int(m['generation'])==int(spec['generation'])
              units=m['next_exact_work_units']; a=int(spec['start']); b=int(spec['end'])
              assert 0<=a<=b<=len(units)
              return units[a:b]

          root=pathlib.Path(tempfile.mkdtemp(prefix='resumable-frontier-'))
          frontier=[]
          for spec in new['source_slices']:
              frontier.extend(load_slice(spec,root))
          assert len(frontier)==218
          dispatch=frontier[:128]; carry=frontier[128:]
          assert len(dispatch)==128 and len(carry)==90
          assert digest(dispatch)==new['dispatch_canonical_sha256']=='2d96ebc0ed716d319e554c1ff6ac05dc9ad0bde9dbacc20490c9027c33f210a9'
          # Every queued unit must reload through the exact resumable input adapter.
          normalized=[]
          for raw in dispatch:
              row=raw['row_id']; genus=int(row.split('-')[0][1:]); emin=8 if genus==0 else 4
              cur=decode_input(raw,emin=emin)
              assert cur['row_id']==row
              normalized.append(raw)
          assert len({u['work_unit_id'] for u in dispatch})==128
          assert len({u['work_unit_id'] for u in carry})==90
          with open(out,'a') as f:
              f.write('authorized=true\n')
              f.write('matrix='+json.dumps({'work_unit':normalized},separators=(',',':'))+'\n')
              f.write('carry='+json.dumps(carry,separators=(',',':'))+'\n')
              f.write('production_generation=34\n')
              f.write('dispatch_count=128\n')
              f.write('carry_count=90\n')
          PY

  produce:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix: ${{ fromJSON(needs.authorize.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WORK_UNIT_JSON: ${{ toJSON(matrix.work_unit) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Execute one exact resumable production work unit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage32-full178-resumable"
          ID=$(python -c 'import json,os; print(json.loads(os.environ["WORK_UNIT_JSON"])["work_unit_id"])')
          OUT="$RUNNER_TEMP/stage32-full178-resumable/${ID}.json"
          python stages/stage32/residual-32-01-production/run_full178_resumable_work_unit.py \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --work-unit-json "$WORK_UNIT_JSON" \
            --node-limit 64000000 \
            --output "$OUT"
          python - "$OUT" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]); x=json.loads(p.read_text())
          assert x['schema']=='STAGE32_RESIDUAL32_01_FULL178_RESUMABLE_WORK_UNIT_V1'
          assert x['nodes_used']==sum(int(t['nodes']) for t in x['telemetry'])
          assert 0<=x['nodes_used']<=x['node_limit']==64000000
          assert x['unknown_count']==len(x['unresolved_exact_child_work_units'])<=1
          assert x['max_unresolved_children_per_input']==1
          assert x['reproduction_factor_structural_upper_bound']==1.0
          assert x['prefix_stage_only'] is True and x['unknown_is_unsat'] is False
          assert x['numerical_row_complete'] is False
          assert x['B18_RELEASE_AUTHORIZED'] is False
          assert x['THEOREM_CREDIT'] is False and x['RECEIVER_CREDIT'] is False
          assert p.stat().st_size <= 32*1024
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-full178-resumable-${{ needs.authorize.outputs.production_generation }}-${{ matrix.work_unit.work_unit_id }}
          path: ${{ runner.temp }}/stage32-full178-resumable/*.json
          retention-days: 1
          if-no-files-found: error

  aggregate:
    needs: [authorize, produce]
    if: needs.authorize.outputs.authorized == 'true' && needs.produce.result == 'success'
    runs-on: ubuntu-24.04
    env:
      PRODUCTION_GENERATION: ${{ needs.authorize.outputs.production_generation }}
      DISPATCH_COUNT: ${{ needs.authorize.outputs.dispatch_count }}
      CARRY_COUNT: ${{ needs.authorize.outputs.carry_count }}
      CARRY_JSON: ${{ needs.authorize.outputs.carry }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-full178-resumable-${{ needs.authorize.outputs.production_generation }}-wu-*
          path: ${{ runner.temp }}/aggregate
          merge-multiple: true
      - name: Build exact FIFO resumable frontier manifest
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'aggregate'
          files=sorted(root.glob('*.json')); dispatch_count=int(os.environ['DISPATCH_COUNT'])
          assert len(files)==dispatch_count==128
          carry=json.loads(os.environ['CARRY_JSON']); assert len(carry)==int(os.environ['CARRY_COUNT'])==90
          rows=[]; children=[]
          for p in files:
              x=json.loads(p.read_text())
              assert x['schema']=='STAGE32_RESIDUAL32_01_FULL178_RESUMABLE_WORK_UNIT_V1'
              assert x['unknown_count']==len(x['unresolved_exact_child_work_units'])<=1
              rows.append({'work_unit_id':x['input_work_unit']['work_unit_id'],'row_id':x['row_id'],
                           'nodes_used':x['nodes_used'],'completed_prefix_partitions':len(x['completed_prefix_partitions']),
                           'continuation_count':x['unknown_count'],'certificate_sha256':x['canonical_sha256_without_this_field']})
              children.extend(x['unresolved_exact_child_work_units'])
          frontier=carry+children
          assert len(children)<=dispatch_count
          assert len(frontier)<=len(carry)+dispatch_count==218
          ids=[u['work_unit_id'] for u in frontier]; assert len(ids)==len(set(ids))
          payload={'schema':'STAGE32_RESIDUAL32_01_FULL178_RESUMABLE_FRONTIER_MANIFEST_V1',
                   'production_generation':int(os.environ['PRODUCTION_GENERATION']),
                   'input_frontier_count':218,'dispatch_count':dispatch_count,'carry_count':len(carry),
                   'completed_input_count':sum(1 for x in rows if x['continuation_count']==0),
                   'continuation_count':len(children),'frontier_after_ingest_count':len(frontier),
                   'frontier_net_change':len(frontier)-218,
                   'structural_frontier_nonincrease':len(frontier)<=218,
                   'work_units':sorted(rows,key=lambda v:v['work_unit_id']),
                   'frontier_exact_work_units':frontier,
                   'queue_policy':'FIFO_GLOBAL_FRONTIER_CARRY_THEN_RESUMABLE_CHILDREN',
                   'unknown_is_unsat':False,'prefix_stage_only':True,
                   'FULL_D176_D192_NUMERICAL_ORBIT_CENSUS':False,'R29_LG2':'NOT_DISCHARGED',
                   'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False,
                   'PERFECT_CUBOID_EXISTENCE_CLAIM':False,'PERFECT_CUBOID_NONEXISTENCE_CLAIM':False}
          raw=json.dumps(payload,sort_keys=True,separators=(',',':')).encode()
          payload['canonical_sha256_without_this_field']=hashlib.sha256(raw).hexdigest()
          out=root/'resumable-frontier-manifest.json'; out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          assert out.stat().st_size < 1024*1024
          print(json.dumps({'input_frontier':218,'dispatch':128,'carry':90,'continuations':len(children),
                            'frontier_after':len(frontier),'net_change':len(frontier)-218,
                            'sha256':payload['canonical_sha256_without_this_field']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-full178-resumable-${{ needs.authorize.outputs.production_generation }}-frontier
          path: ${{ runner.temp }}/aggregate/resumable-frontier-manifest.json
          retention-days: 7
          if-no-files-found: error
