name: Stage15-6ae single-square trigger audit

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6ae/**'
      - 'stages/stage15/evidence/stage15_6ae_single_square_trigger.json'
      - 'stages/stage15/replay/verify_stage15_6ae.py'
      - 'stages/stage15/scripts/stage15_6ae_single_square_trigger.py'
      - '.github/workflows/stage15-6ae-single-square-trigger.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6ae single-square trigger audit
        run: python stages/stage15/replay/verify_stage15_6ae.py
      - name: Compile Stage15-6ae utility
        run: python -m py_compile stages/stage15/scripts/stage15_6ae_single_square_trigger.py stages/stage15/replay/verify_stage15_6ae.py
