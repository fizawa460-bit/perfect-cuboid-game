name: Stage32-18X d16 b16 tail geometry pilot

on:
  push:
    branches:
      - stage32-18x-b16-tail-geometry-pilot-clean
    paths:
      - 'stages/stage32/runkeys/18x-b16-tail-geometry-pilot.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-18x-b16-tail-geometry-pilot
  cancel-in-progress: true

jobs:
  validate-run-key:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.key.outputs.matrix }}
      generation: ${{ steps.key.outputs.generation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require a dedicated ARM commit
        run: |
          set -euo pipefail
          KEY='stages/stage32/runkeys/18x-b16-tail-geometry-pilot.json'
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$KEY"
          test "$(git log -1 --pretty=%s)" = 'Stage32-18X: ARM B16 TAIL GEOMETRY PILOT'
      - id: key
        name: Validate exact pilot contract
        run: |
          python - <<'PY'
          import json,os,pathlib
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18x-b16-tail-geometry-pilot.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1'
          assert d['workflow']=='stage32-18x-d16-b16-tail-geometry-pilot'
          assert d['armed'] is True and d['generation']==1 and d['bound']==16
          assert d['accepted_b14_canonical_survivors']==44450
          assert d['accepted_b14_dump_sha256']=='4d4680a87fab0c01ac8b54bcf404eecaa707cf5db782b31d5fa7357a52249d8a'
          assert d['exact_source_artifact_id']==9574308138
          assert d['exact_source_zip_sha256']=='0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4'
          assert d['primary_residues']==[436,503,922]
          assert d['primary_coordinate']==54 and d['primary_modulus']==1024
          assert d['secondary_coordinate']==48 and d['secondary_shard_count']==4
          assert d['node_cap']==40000000 and d['max_parallel']==15
          inc=[]
          for p in d['primary_residues']:
              inc.append({'tag':f'direct-p{p}','kind':'direct','primary':p,'secondary':-1})
              for s in range(4):
                  inc.append({'tag':f'c48x4-p{p}-s{s}','kind':'nested','primary':p,'secondary':s})
          assert len(inc)==15
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('generation=1\n')
              f.write('matrix='+json.dumps({'include':inc},separators=(',',':'))+'\n')
          print(json.dumps({'jobs':len(inc),'matrix':inc},sort_keys=True))
          PY

  prepare:
    needs: validate-run-key
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch immutable exact source and build direct plus nested certifiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libboost-dev time
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/prepared"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RUNNER_TEMP/source.zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/d16-exact-symmetry-sharded.cpp"
          test -f "$RUNNER_TEMP/source/d16-hperp.txt"
          test -f "$RUNNER_TEMP/source/d16-aut-prefix256-bundle.txt"
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic \
            "$RUNNER_TEMP/source/d16-exact-symmetry-sharded.cpp" -o "$RUNNER_TEMP/prepared/d16-exact"
          for p in 436 503 922; do
            python stages/stage32/32-18X/build_two_stage_certifier.py \
              --source "$RUNNER_TEMP/source/d16-exact-symmetry-sharded.cpp" \
              --output "$RUNNER_TEMP/prepared/d16-two-stage-$p.cpp" --primary-id "$p"
            g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic \
              "$RUNNER_TEMP/prepared/d16-two-stage-$p.cpp" -o "$RUNNER_TEMP/prepared/d16-two-stage-$p"
          done
          cp "$RUNNER_TEMP/source/d16-hperp.txt" "$RUNNER_TEMP/prepared/"
          cp "$RUNNER_TEMP/source/d16-aut-prefix256-bundle.txt" "$RUNNER_TEMP/prepared/"
          sha256sum "$RUNNER_TEMP/prepared"/* > "$RUNNER_TEMP/prepared/files.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18x-prepared-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/prepared/
          retention-days: 14
          if-no-files-found: error

  pilot:
    needs: [validate-run-key, prepare]
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.validate-run-key.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage32-18x-prepared-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/prepared
      - name: Restore executable modes
        run: chmod +x "$RUNNER_TEMP/prepared/d16-exact" "$RUNNER_TEMP/prepared/d16-two-stage-436" "$RUNNER_TEMP/prepared/d16-two-stage-503" "$RUNNER_TEMP/prepared/d16-two-stage-922"
      - name: Exact real-leaf pilot ${{ matrix.tag }}
        env:
          KIND: ${{ matrix.kind }}
          PRIMARY: ${{ matrix.primary }}
          SECONDARY: ${{ matrix.secondary }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          if [ "$KIND" = direct ]; then
            exe="$RUNNER_TEMP/prepared/d16-exact"
            args=(--bound 16 --shard-id "$PRIMARY" --shard-count 1024 --split-coordinate 54 --node-cap 40000000)
          else
            exe="$RUNNER_TEMP/prepared/d16-two-stage-$PRIMARY"
            args=(--bound 16 --shard-id "$SECONDARY" --shard-count 4 --split-coordinate 48 --node-cap 40000000)
          fi
          set +e
          /usr/bin/time -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" \
            "$exe" \
              --input "$RUNNER_TEMP/prepared/d16-hperp.txt" \
              --bundle "$RUNNER_TEMP/prepared/d16-aut-prefix256-bundle.txt" \
              --output "$RUNNER_TEMP/out/cert.json" \
              --dump-canonical "$RUNNER_TEMP/out/dump.bin" \
              "${args[@]}" >"$RUNNER_TEMP/out/stdout.txt" 2>"$RUNNER_TEMP/out/stderr.txt"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -q 'exact traversal node cap exceeded' "$RUNNER_TEMP/out/stderr.txt"; then
              RC="$rc" python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          runtime=float((root/'runtime.txt').read_text().strip())
          out={'schema':'STAGE32_18X_B16_TAIL_GEOMETRY_RESULT_V1','tag':os.environ['TAG'],'kind':os.environ['KIND'],'primary_residue':int(os.environ['PRIMARY']),'secondary_shard':int(os.environ['SECONDARY']),'status':'RESOURCE_WALL_NODE_CAP','node_cap':40000000,'runtime_seconds':runtime,'exit_code':int(os.environ['RC']),'D16_B16_NUMERICAL_CREDIT':False}
          (root/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
            else
              cat "$RUNNER_TEMP/out/stderr.txt"
              exit "$rc"
            fi
          else
            python - <<'PY'
          import hashlib,json,os,pathlib
          MAGIC=b'S32D16C1'; RS=141
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          d=json.loads((root/'cert.json').read_text()); kind=os.environ['KIND']; p=int(os.environ['PRIMARY']); s=int(os.environ['SECONDARY'])
          want='STAGE32_18E_D16_EXACT_SYMMETRY_SHARDED_TRAVERSAL_CERT_V1' if kind=='direct' else 'STAGE32_18X_D16_B16_TWO_STAGE_SHARD_V1'
          assert d['schema']==want and d['status']=='COMPLETE' and d['bound']==16
          assert d['TRAVERSAL_COMPLETENESS_CERTIFICATE'] is True
          assert d['all_symmetry_branch_rejections_exact_rational_cauchy_schwarz'] is True
          assert d['aut_group_order']==1536 and d['dfs_symmetry_breaker_count']==256
          if kind=='direct':
              assert (d['shard_id'],d['shard_count'],d['split_coordinate'])==(p,1024,54)
          else:
              assert d['two_stage_partition'] is True
              assert (d['primary_shard_id'],d['primary_shard_count'],d['primary_split_coordinate'])==(p,1024,54)
              assert (d['secondary_shard_id'],d['secondary_shard_count'],d['secondary_split_coordinate'])==(s,4,48)
          raw=(root/'dump.bin').read_bytes(); assert raw[:8]==MAGIC and (len(raw)-8)%RS==0
          n=(len(raw)-8)//RS; assert n==int(d['canonical_survivors_including_zero'])
          runtime=float((root/'runtime.txt').read_text().strip())
          out={'schema':'STAGE32_18X_B16_TAIL_GEOMETRY_RESULT_V1','tag':os.environ['TAG'],'kind':kind,'primary_residue':p,'secondary_shard':s,'status':'COMPLETE','node_cap':40000000,'runtime_seconds':runtime,'canonical_survivors_including_zero':n,'canonical_norm_histogram':d['canonical_norm_histogram'],'canonical_dump_sha256':hashlib.sha256(raw).hexdigest(),'nodes':d.get('nodes'),'coordinate_trials':d.get('coordinate_trials'),'prepared_input_sha256':d.get('prepared_input_sha256'),'stable_aut_content_sha256':d.get('stable_aut_content_sha256'),'canonical_bundle_sha256':d.get('canonical_bundle_sha256'),'aut_group_order':1536,'dfs_symmetry_breaker_count':256,'D16_B16_NUMERICAL_CREDIT':False}
          (root/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18x-b16-${{ matrix.tag }}-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/out/
          retention-days: 14
          if-no-files-found: error

  summarize:
    needs: [validate-run-key, pilot]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-18x-b16-*-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/runs
      - name: Verify geometry evidence and freeze verdict
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          MAGIC=b'S32D16C1'; RS=141
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'runs'
          docs={}
          dirs={}
          for p in root.rglob('compact.json'):
              d=json.loads(p.read_text()); docs[d['tag']]=d; dirs[d['tag']]=p.parent
          expected=set()
          for q in (436,503,922):
              expected.add(f'direct-p{q}')
              expected.update(f'c48x4-p{q}-s{s}' for s in range(4))
          assert set(docs)==expected,(set(docs),expected)
          per={}; all_nested=True; all_partition_checks=True
          for q in (436,503,922):
              direct=docs[f'direct-p{q}']
              nested=[docs[f'c48x4-p{q}-s{s}'] for s in range(4)]
              complete=all(d['status']=='COMPLETE' for d in nested)
              info={'direct_status':direct['status'],'nested_statuses':[d['status'] for d in nested],'nested_all_complete':complete}
              if complete:
                  recs=[]
                  for s in range(4):
                      raw=(dirs[f'c48x4-p{q}-s{s}']/'dump.bin').read_bytes(); assert raw[:8]==MAGIC and (len(raw)-8)%RS==0
                      recs.extend(raw[i:i+RS] for i in range(8,len(raw),RS))
                  assert len(recs)==len(set(recs))
                  union=MAGIC+b''.join(sorted(recs))
                  info['nested_union_canonical_survivors']=len(recs)
                  info['nested_union_dump_sha256']=hashlib.sha256(union).hexdigest()
                  if direct['status']=='COMPLETE':
                      draw=(dirs[f'direct-p{q}']/'dump.bin').read_bytes()
                      info['direct_matches_nested_union']=draw==union
                      all_partition_checks &= info['direct_matches_nested_union']
                  else:
                      info['direct_matches_nested_union']=None
              else:
                  all_nested=False
              per[str(q)]=info
          if all_nested and all_partition_checks:
              verdict='PASS_B16_TAIL_GEOMETRY__C48_FOUR_WAY_CLOSES_HISTORICAL_TAILS__PRODUCTION_DESIGN_READY'
              next_item='32-18Y-D16-B16-RESOURCE-SAFE-EXACT-PRODUCTION'
          else:
              verdict='B16_TAIL_GEOMETRY__C48_FOUR_WAY_INSUFFICIENT__FINER_SECONDARY_SPLIT_REQUIRED'
              next_item='32-18Y-D16-B16-FINER-TAIL-SPLIT-PILOT'
          out={'schema':'STAGE32_18X_B16_TAIL_GEOMETRY_SUMMARY_V1','verdict':verdict,'primary_residues':[436,503,922],'primary_coordinate':54,'primary_modulus':1024,'secondary_coordinate':48,'secondary_shard_count':4,'node_cap':40000000,'per_primary':per,'partition_crosschecks_passed':all_partition_checks,'next_item':next_item,'D16_B16_NUMERICAL_CREDIT':False,'GLOBAL_B16_AGGREGATION_COMPLETE':False,'FULL_D16_G0_ROW_COMPLETE':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False,'CONTROLLER_MODIFIED':False}
          outdir=pathlib.Path(os.environ['RUNNER_TEMP'])/'summary'; outdir.mkdir()
          (outdir/'stage32-18x-b16-tail-geometry-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'verdict':verdict,'per_primary':per,'next_item':next_item},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18x-b16-tail-geometry-summary-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/summary/
          retention-days: 14
          if-no-files-found: error
