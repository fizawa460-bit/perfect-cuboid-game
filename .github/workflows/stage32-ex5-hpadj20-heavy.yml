name: Stage32EX5 HPADJ20 heavy replay

# Lifecycle: ACTIVE_AUTO, but heavy compute is fail-closed behind the dedicated
# run-key commit-range gate below. workflow_dispatch remains available after the
# workflow exists on the default branch for exact-head audit reruns.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32-ex5/runkeys/hpadj20-heavy-replay.json'
      - '.github/workflows/stage32-ex5-hpadj20-heavy.yml'
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact 40-hex head to replay
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      exact_sha: ${{ steps.gate.outputs.exact_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Fresh run-key / exact-head authorization gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          DISPATCH_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          KEY='stages/stage32-ex5/runkeys/hpadj20-heavy-replay.json'
          HEAD_SHA="$PR_HEAD"
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            HEAD_SHA="$DISPATCH_SHA"
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'authorized=false' >> "$GITHUB_OUTPUT"
            echo 'exact_sha=' >> "$GITHUB_OUTPUT"
            echo 'invalid exact head sha' >&2
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            python - "$KEY" <<'PY'
          import json, sys
          from pathlib import Path
          key = json.loads(Path(sys.argv[1]).read_text())
          assert key['schema'] == 'STAGE32EX5_HPADJ20_HEAVY_RUNKEY_V1'
          assert key['armed'] is True
          assert int(key['generation']) > 0
          assert key['producer_git_blob'] == '837d647cfcbc96bbe384e564f449cd7042a46d48'
          assert key['execution_contract_git_blob'] == '051e54bd554eb15a8c50c949751b1778f0a5940a'
          PY
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
            echo "exact_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo 'authorization=MANUAL_EXACT_HEAD_WITH_LOCKED_RUNKEY'
            exit 0
          fi

          if [ "$PR_ACTION" = 'reopened' ]; then
            echo 'authorized=false' >> "$GITHUB_OUTPUT"
            echo "exact_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo 'authorization=COLD_REOPEN'
            exit 0
          fi

          if [ "$PR_ACTION" = 'opened' ]; then
            BEFORE="$PR_BASE"
          else
            BEFORE="$EVENT_BEFORE"
          fi
          if ! [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'authorized=false' >> "$GITHUB_OUTPUT"
            echo "exact_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo 'authorization=NO_VERIFIABLE_BEFORE'
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BEFORE" || true
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo 'authorized=false' >> "$GITHUB_OUTPUT"
            echo "exact_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo 'authorization=BEFORE_FETCH_FAILED'
            exit 0
          fi
          if ! git diff --name-only "$BEFORE" "$HEAD_SHA" | grep -Fxq "$KEY"; then
            echo 'authorized=false' >> "$GITHUB_OUTPUT"
            echo "exact_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo 'authorization=RUNKEY_NOT_CHANGED_IN_EVENT_RANGE'
            exit 0
          fi

          python - "$BEFORE" "$KEY" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          before, key_path = sys.argv[1:]
          new = json.loads(Path(key_path).read_text())
          assert new['schema'] == 'STAGE32EX5_HPADJ20_HEAVY_RUNKEY_V1'
          assert new['armed'] is True
          generation = int(new['generation'])
          assert generation > 0
          assert new['producer_git_blob'] == '837d647cfcbc96bbe384e564f449cd7042a46d48'
          assert new['execution_contract_git_blob'] == '051e54bd554eb15a8c50c949751b1778f0a5940a'
          prior = subprocess.run(
              ['git', 'show', f'{before}:{key_path}'],
              text=True, capture_output=True,
          )
          if prior.returncode == 0:
              old = json.loads(prior.stdout)
              assert generation > int(old['generation'])
          PY
          echo 'authorized=true' >> "$GITHUB_OUTPUT"
          echo "exact_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo 'authorization=FRESH_RUNKEY_EVENT_RANGE_PASS'

  replay-hpadj20:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.exact_sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'

      - name: Verify exact-head, source locks, resume waiver, and storage preflight
        env:
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.exact_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          producer = Path('stages/stage32-ex5/hpadj-20_ex5/derive_two_tier_qa_predomain_picard_lp_bound.py')
          contract = Path('stages/stage32-ex5/hpadj-20_ex5/HEAVY-EXECUTION-CONTRACT.json')
          runkey = Path('stages/stage32-ex5/runkeys/hpadj20-heavy-replay.json')

          def git_blob(path: Path) -> str:
              raw = path.read_bytes()
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()

          assert git_blob(producer) == '837d647cfcbc96bbe384e564f449cd7042a46d48'
          assert git_blob(contract) == '051e54bd554eb15a8c50c949751b1778f0a5940a'
          key = json.loads(runkey.read_text())
          assert key['armed'] is True and int(key['generation']) > 0
          assert key['producer_git_blob'] == git_blob(producer)
          assert key['execution_contract_git_blob'] == git_blob(contract)
          data = json.loads(contract.read_text())
          assert data['resume_policy'] == 'RESUME_NOT_FEASIBLE'
          assert data['partition']['partial_outputs_reusable'] is False
          assert data['storage_preflight']['operating_budget_mb'] == 500
          assert data['storage_preflight']['planned_jobs'] == 1
          assert data['storage_preflight']['planned_effective_heavy_concurrency'] == 1
          assert data['storage_preflight']['persisted_artifact_uploads'] == 0
          assert data['storage_preflight']['projected_peak_actions_artifact_storage_mb'] == 0
          assert data['credit_firewall']['partial_output_credit'] is False
          assert data['credit_firewall']['stage32_main_credit'] is False
          assert data['credit_firewall']['merge_authorized'] is False
          print('RESUME_POLICY=' + data['resume_policy'])
          print('RESUME_REASON=' + data['resume_not_feasible_reason'])
          print('CANCELLATION_RECOVERY=' + data['cancellation_recovery'])
          print('STORAGE_PREFLIGHT=PASS jobs=1 concurrency=1 artifact_uploads=0 projected_actions_storage_mb=0 budget_mb=500')
          PY
          {
            echo '## HPADJ20 heavy execution contract'
            echo '- Resume policy: `RESUME_NOT_FEASIBLE`'
            echo '- Cancellation recovery: re-arm by fresh run-key generation; incomplete local output is non-credit.'
            echo '- Storage preflight: 1 job, concurrency 1, no artifact uploads, projected Actions artifact storage increment 0 MB / 500 MB budget.'
            echo "- Exact head: \`$EXPECTED_HEAD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install HPADJ exact diagnostic dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.13.3'

      - name: Replay HPADJ20 exact two-tier qA refinement
        run: |
          set -euo pipefail
          python stages/stage32-ex5/hpadj-20_ex5/derive_two_tier_qa_predomain_picard_lp_bound.py | tee /tmp/hpadj20.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/hpadj20.json').read_text())
          assert data['status'] == 'Q_QUADRATIC_QA_TWO_TIER_EXACT_MULTIPLICITY_PREDOMAIN_PICARD_LP_CANDIDATE_HOSTILE_AUDIT_REQUIRED'
          assert data['candidate_bound']['hpadj20_candidate_upper_bound'] <= 195603649074545538415
          assert data['candidate_bound']['hpadj20_candidate_upper_bound'] <= data['candidate_bound']['replayed_hpadj19_candidate_upper_bound']
          assert data['candidate_bound']['structurally_no_weaker_than_hpadj19'] is True
          assert data['qA_refinement']['exact_support_preserved'] is True
          assert data['qA_refinement']['strict_two_tier_class_count'] > 0
          assert data['semantics']['per_exact_pre_block_q_survivor_capacity_no_larger_than_hpadj19'] is True
          assert data['semantics']['statistical_independence_assumed'] is False
          assert data['semantics']['new_heavy_run_used'] is False
          assert data['firewalls']['stage32_main_pruning_credit'] is False
          print('HPADJ20_CANONICAL=' + data['canonical_sha256_without_this_field'])
          print('HPADJ20_HPADJ19_REPLAY_UPPER=' + str(data['candidate_bound']['replayed_hpadj19_candidate_upper_bound']))
          print('HPADJ20_UPPER=' + str(data['candidate_bound']['hpadj20_candidate_upper_bound']))
          print('HPADJ20_IMPROVEMENT_VS_HPADJ19=' + str(data['candidate_bound']['improvement_vs_hpadj19_replay']))
          print('HPADJ20_IMPROVEMENT_VS_MAIN_Q=' + str(data['candidate_bound']['improvement_vs_main_q_quadratic_global']))
          PY
