name: Stage32EX5 HPADJ20 heavy replay

# Lifecycle: ACTIVE_AUTO. Heavy compute is fail-closed behind a fresh dedicated
# run-key commit-range gate. The durable recovery unit is one FULL178 row.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32-ex5/runkeys/hpadj20-heavy-replay.json'
      - '.github/workflows/stage32-ex5-hpadj20-heavy.yml'
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact 40-hex head to replay
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      exact_sha: ${{ steps.gate.outputs.exact_sha }}
      carry_run_id: ${{ steps.gate.outputs.carry_run_id }}
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Fresh run-key / exact-head authorization gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          DISPATCH_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          KEY='stages/stage32-ex5/runkeys/hpadj20-heavy-replay.json'
          HEAD_SHA="$PR_HEAD"
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then HEAD_SHA="$DISPATCH_SHA"; fi
          MATRIX="$(python - <<'PY'
          import json
          print(json.dumps(list(range(178)), separators=(',', ':')))
          PY
          )"
          emit_cold() {
            echo 'authorized=false' >> "$GITHUB_OUTPUT"
            echo "exact_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo 'carry_run_id=' >> "$GITHUB_OUTPUT"
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          }
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then emit_cold; exit 0; fi
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          validate_new_key() {
            python - "$KEY" <<'PY'
          import json, sys
          from pathlib import Path
          key = json.loads(Path(sys.argv[1]).read_text())
          assert key['schema'] == 'STAGE32EX5_HPADJ20_HEAVY_RUNKEY_V3'
          assert key['armed'] is True
          assert int(key['generation']) > 0
          assert int(key['shard_count']) == 178
          assert int(key['max_parallel']) == 32
          carry = key.get('carry_run_id')
          assert carry is None or (isinstance(carry, int) and carry > 0)
          assert key['producer_git_blob'] == '837d647cfcbc96bbe384e564f449cd7042a46d48'
          assert key['row_shard_worker_git_blob'] == '380c191b7dd3bcc6c1e290495c776203d4a92b63'
          assert key['union_verifier_git_blob'] == 'cfa58039f9cce06767a18b7594782dc620865e51'
          assert key['execution_contract_git_blob'] == '5c113f84c757efcd368e11d17a6bd37f714cdd53'
          PY
          }

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            validate_new_key
            CARRY="$(python - "$KEY" <<'PY'
          import json, sys
          from pathlib import Path
          x=json.loads(Path(sys.argv[1]).read_text()).get('carry_run_id')
          print('' if x is None else int(x))
          PY
          )"
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
            echo "exact_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "carry_run_id=$CARRY" >> "$GITHUB_OUTPUT"
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$PR_ACTION" = 'reopened' ]; then emit_cold; exit 0; fi
          BEFORE="$EVENT_BEFORE"
          if [ "$PR_ACTION" = 'opened' ]; then BEFORE="$PR_BASE"; fi
          if ! [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]; then emit_cold; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BEFORE" || true
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then emit_cold; exit 0; fi
          if ! git diff --name-only "$BEFORE" "$HEAD_SHA" | grep -Fxq "$KEY"; then
            emit_cold
            echo 'authorization=RUNKEY_NOT_CHANGED_IN_EVENT_RANGE'
            exit 0
          fi

          validate_new_key
          python - "$BEFORE" "$KEY" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          before, path = sys.argv[1:]
          new = json.loads(Path(path).read_text())
          prior = subprocess.run(['git','show',f'{before}:{path}'],text=True,capture_output=True)
          if prior.returncode == 0:
              old=json.loads(prior.stdout)
              assert int(new['generation']) > int(old['generation'])
          PY
          CARRY="$(python - "$KEY" <<'PY'
          import json, sys
          from pathlib import Path
          x=json.loads(Path(sys.argv[1]).read_text()).get('carry_run_id')
          print('' if x is None else int(x))
          PY
          )"
          echo 'authorized=true' >> "$GITHUB_OUTPUT"
          echo "exact_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "carry_run_id=$CARRY" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo 'authorization=FRESH_RUNKEY_EVENT_RANGE_PASS'

  row:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        unit: ${{ fromJSON(needs.authorize.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.exact_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'

      - name: Verify exact-head locks and resume contract
        env:
          EXPECTED_HEAD_SHA: ${{ needs.authorize.outputs.exact_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git hash-object stages/stage32-ex5/hpadj-20_ex5/derive_two_tier_qa_predomain_picard_lp_bound.py)" = '837d647cfcbc96bbe384e564f449cd7042a46d48'
          test "$(git hash-object stages/stage32-ex5/hpadj-20_ex5/run_row_shard.py)" = '380c191b7dd3bcc6c1e290495c776203d4a92b63'
          test "$(git hash-object stages/stage32-ex5/hpadj-20_ex5/aggregate_row_shards.py)" = 'cfa58039f9cce06767a18b7594782dc620865e51'
          test "$(git hash-object stages/stage32-ex5/hpadj-20_ex5/HEAVY-EXECUTION-CONTRACT.json)" = '5c113f84c757efcd368e11d17a6bd37f714cdd53'
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('stages/stage32-ex5/hpadj-20_ex5/HEAVY-EXECUTION-CONTRACT.json').read_text())
          assert x['resume_policy']=='RESUME_FIRST_EXACT_FULL178_ONE_ROW_UNITS'
          assert x['partition']['shard_count']==178
          assert x['partition']['rows_per_shard']==1
          assert x['cancellation_recovery']['salvage_granularity']=='ONE_FULL178_ROW'
          assert x['storage_preflight']['planned_effective_heavy_concurrency']==32
          assert x['storage_preflight']['projected_peak_actions_artifact_storage_mb_upper_bound']<=500
          assert x['credit_firewall']['partial_output_credit'] is False
          assert x['credit_firewall']['stage32_main_credit'] is False
          PY

      - name: Try carried completed row
        if: needs.authorize.outputs.carry_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hpadj20-row-${{ matrix.unit }}
          path: carry
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize.outputs.carry_run_id }}

      - name: Validate carry-over row certificate
        id: reuse
        env:
          UNIT: ${{ matrix.unit }}
          CARRY_RUN_ID: ${{ needs.authorize.outputs.carry_run_id }}
        run: |
          set -euo pipefail
          mkdir -p out
          reused=false
          CANDIDATE="carry/hpadj20-row-${UNIT}.json"
          if [ -n "$CARRY_RUN_ID" ] && [ -f "$CANDIDATE" ]; then
            if python stages/stage32-ex5/hpadj-20_ex5/run_row_shard.py --shard-index "$UNIT" --shard-count 178 --verify-existing "$CANDIDATE"; then
              cp "$CANDIDATE" "out/hpadj20-row-${UNIT}.json"
              reused=true
              echo "HPADJ20_ROW_REUSED unit=$UNIT carry_run_id=$CARRY_RUN_ID"
            fi
          fi
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

      - name: Install exact diagnostic dependency
        if: steps.reuse.outputs.reused != 'true'
        run: python -m pip install --disable-pip-version-check 'sympy==1.13.3'

      - name: Compute one exact FULL178 row
        if: steps.reuse.outputs.reused != 'true'
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          set -euo pipefail
          python stages/stage32-ex5/hpadj-20_ex5/run_row_shard.py --shard-index "$UNIT" --shard-count 178 --output "out/hpadj20-row-${UNIT}.json"

      - name: Validate durable row checkpoint
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          set -euo pipefail
          CERT="out/hpadj20-row-${UNIT}.json"
          python stages/stage32-ex5/hpadj-20_ex5/run_row_shard.py --shard-index "$UNIT" --shard-count 178 --verify-existing "$CERT"
          BYTES="$(wc -c < "$CERT")"
          test "$BYTES" -le 1000000
          echo "HPADJ20_ROW_CHECKPOINT_COMPLETE unit=$UNIT bytes=$BYTES"

      - name: Upload durable completed row checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: hpadj20-row-${{ matrix.unit }}
          path: out/hpadj20-row-${{ matrix.unit }}.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  aggregate:
    needs: [authorize, row]
    if: needs.authorize.outputs.authorized == 'true' && needs.row.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.exact_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Download all durable row checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: hpadj20-row-*
          path: certs
          merge-multiple: true
      - name: Verify exact 178-row union and aggregate HPADJ20 bound
        run: |
          set -euo pipefail
          python stages/stage32-ex5/hpadj-20_ex5/aggregate_row_shards.py --cert-dir certs --shard-count 178 --output /tmp/hpadj20-parallel-union.json
          BYTES="$(wc -c < /tmp/hpadj20-parallel-union.json)"
          test "$BYTES" -le 2000000
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/hpadj20-parallel-union.json').read_text())
          assert data['partition']['exact_disjoint_union_verified'] is True
          assert data['partition']['row_gap_count']==0
          assert data['partition']['row_overlap_count']==0
          assert data['candidate_bound']['hpadj20_candidate_upper_bound'] <= data['candidate_bound']['replayed_hpadj19_candidate_upper_bound']
          assert data['firewalls']['stage32_main_pruning_credit'] is False
          print('HPADJ20_PARALLEL_AUDIT_CANDIDATE='+data['canonical_sha256_without_this_field'])
          PY
          cp /tmp/hpadj20-parallel-union.json hpadj20-parallel-union.json
      - name: Upload compact final union certificate
        uses: actions/upload-artifact@v4
        with:
          name: hpadj20-parallel-union
          path: hpadj20-parallel-union.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
