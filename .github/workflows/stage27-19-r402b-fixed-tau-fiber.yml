name: Stage27-19-r402b fixed tau fiber preflight

on:
  push:
    branches:
      - agent/stage27-19-r402b-fixed-tau-fiber
  pull_request:
    paths:
      - 'stages/stage27/27-19-r402b/**'
      - 'stages/stage27/27-controller.json'
      - 'docs/00_CURRENT_RESEARCH_STATUS.md'
      - '.github/workflows/stage27-19-r402b-fixed-tau-fiber.yml'

jobs:
  verify-stage27-19-r402b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Stage27-19-r402b fixed tau fiber route
        run: |
          python -m json.tool stages/stage27/27-19-r402b/fixed-tau-fiber-registry.json >/dev/null
          python stages/stage27/27-19-r402b/verify_27_19_r402b.py
          git diff --check
