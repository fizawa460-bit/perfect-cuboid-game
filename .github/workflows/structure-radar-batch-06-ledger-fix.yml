name: StructureRadar batch 06 ledger fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-ledger:
    if: github.event.pull_request.head.ref == 'structure-radar-deep-corpus-batch-06'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: structure-radar-deep-corpus-batch-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix batch 06 progress ledger
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/structure-radar/progress.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          batch_id = 'SR-BATCH-STAGE14_15_DEEP_CORPUS-06-R01'
          matches = [b for b in data['audit_batches'] if b.get('batch_id') == batch_id]
          assert len(matches) == 1, len(matches)
          batch = matches[0]
          assert batch['sources_reviewed'] == 60
          assert batch['structure_carrier_sources'] == 30
          assert batch['no_distinct_structure'] == 30
          assert batch.get('duplicate_source', 0) == 0
          assert batch['structures_deduped'] == 47
          batch['structures_deduped'] = 30
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          python scripts/structure_radar.py verify
          python scripts/verify_research_arsenal.py
          git diff --check
          rm .github/workflows/structure-radar-batch-06-ledger-fix.yml
          rm .github/structure-radar-batch-06-ledger-fix-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/structure-radar/progress.json .github/workflows/structure-radar-batch-06-ledger-fix.yml .github/structure-radar-batch-06-ledger-fix-trigger.txt
          git commit -m 'fix: correct StructureRadar batch 06 dedupe accounting'
          git push origin HEAD:structure-radar-deep-corpus-batch-06
