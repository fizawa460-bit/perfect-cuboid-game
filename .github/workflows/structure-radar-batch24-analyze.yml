name: StructureRadar batch24 finalizer

on:
  pull_request:
    branches:
      - structure-radar-deep-corpus-batch-24

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'structure-radar-batch24-analysis-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-24
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize batch24 ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          batch_id='SR-BATCH-STAGE14_15_DEEP_CORPUS-24-R01'
          task_id='SR-CENSUS-STAGE14_15_DEEP_CORPUS-01'
          report=json.loads(Path('docs/structure-radar/.batch24-analysis.json').read_text())['sources']
          assert len(report)==60
          assert report[0]['source_id']=='SRC-5E11E240975B'
          for r in report:
              assert r['exact_reviewed_ids'], r
              assert r['exact_reviewed_ids']==r['registry_ids'], r
          mapping={r['source_id']:r['exact_reviewed_ids'] for r in report}
          unique_cards=sorted({cid for ids in mapping.values() for cid in ids})
          assert len(unique_cards)==15, unique_cards

          sources=[]
          for p in sorted(Path('docs/structure-radar/source-manifest').glob('part-*.json')):
              sources += json.loads(p.read_text()).get('sources',[])
          source_map={s['source_id']:s for s in sources}
          assert all(sid in source_map for sid in mapping)

          progress_path=Path('docs/structure-radar/progress.json')
          progress=json.loads(progress_path.read_text())
          reviews=progress['source_reviews']
          for sid,ids in mapping.items():
              s=source_map[sid]
              reviews[sid]={
                  'fingerprint':s['fingerprint'],
                  'status':'STRUCTURES_RECORDED',
                  'batch_id':batch_id,
                  'structure_ids':ids,
              }
          progress['audit_batches']=[b for b in progress.get('audit_batches',[]) if b.get('batch_id')!=batch_id]
          progress['audit_batches'].append({
              'batch_id':batch_id,
              'task_id':task_id,
              'status':'SUBMITTED_FOR_AUDIT',
              'source_ids':list(mapping),
              'sources_reviewed':60,
              'structures_added':0,
              'structures_updated':15,
              'structure_carrier_sources':60,
              'structures_deduped':0,
              'searches_completed':0,
              'arsenal_decisions':0,
              'audit_required':True,
              'duplicate_source':0,
              'no_distinct_structure':0,
          })
          progress_path.write_text(json.dumps(progress,indent=2,ensure_ascii=False)+'\n')

          registry_path=Path('docs/structure-radar/structure-registry.json')
          registry=json.loads(registry_path.read_text())
          cards={c['structure_id']:c for c in registry['structures']}
          assert all(cid in cards for cid in unique_cards)
          changed=set()
          for sid,ids in mapping.items():
              s=source_map[sid]
              prov={'source_id':sid,'path':s['path'],'locator':'StructureRadar batch24 source carrier','fingerprint':s['fingerprint']}
              for cid in ids:
                  lst=cards[cid]['repo_provenance']
                  if not any(x.get('source_id')==sid for x in lst):
                      lst.append(prov.copy()); changed.add(cid)
          assert changed==set(unique_cards), (len(changed), sorted(changed))
          registry['status']='BATCH_SUBMITTED_FOR_AUDIT'
          registry_path.write_text(json.dumps(registry,indent=2,ensure_ascii=False)+'\n')

          for name in [
              '.github/workflows/structure-radar-batch24-analyze.yml',
              'docs/structure-radar/.batch24-analysis.json',
              'docs/structure-radar/.batch24-compact.tsv',
          ]:
              p=Path(name)
              if p.exists(): p.unlink()
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/structure-radar/controller.json').read_text())
          assert c['corpus']['review_states'].get('CURRENT_REVIEWED')==2022, c['corpus']['review_states']
          assert c['corpus']['review_states'].get('NEW')==534, c['corpus']['review_states']
          assert c['registry']['structure_count']==225
          p=json.loads(Path('docs/structure-radar/progress.json').read_text())
          b=next(x for x in p['audit_batches'] if x['batch_id']=='SR-BATCH-STAGE14_15_DEEP_CORPUS-24-R01')
          assert b['structures_updated']==15 and b['structure_carrier_sources']==60 and b['no_distinct_structure']==0
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "StructureRadar census Stage14-15 deep corpus batch 24"
          git push origin HEAD:structure-radar-deep-corpus-batch-24
