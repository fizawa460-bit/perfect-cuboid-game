name: Stage33 V91 marked Picard dual retained replay

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  retained-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: stages/stage33/33-12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Replay Stage33-09 marked Picard bridge locally
        run: python ../33-09/certify_stage33_09_exit.py
      - name: Replay retained V91 marked Picard-dual source binding locally
        run: python verify_e3_retained_at_marked_picard_dual_source_v91.py
      - name: Diff hygiene
        working-directory: .
        run: git diff --check
