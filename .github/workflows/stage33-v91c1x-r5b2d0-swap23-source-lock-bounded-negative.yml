name: Stage33 V91C1X R5B2D0 swap23 source-lock bounded negative

on:
  push:
    branches:
      - stage33-v91c1x-r5b2d0-swap23-source-lock
    paths:
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b2d0_swap23_source_lock_bounded_negative.py'
      - 'stages/stage33/33-12/verify_stage33_v91c1x_r5b2d0_swap23_source_lock_bounded_negative_v128.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2d0-swap23-source-lock-bounded-negative.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2c3-all-double-overlaps-317-cover.json'
      - 'stages/stage33/33-12/e3-v91c1x-r2-literal-mu2-or-unimodular-cech-glue-contract.json'
      - 'stages/stage33/MAIN-STATE.json'
      - 'stages/stage33/sync_main_state.py'
      - '.github/workflows/stage33-v91c1x-r5b2d0-swap23-source-lock-bounded-negative.yml'
  pull_request:
    paths:
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b2d0_swap23_source_lock_bounded_negative.py'
      - 'stages/stage33/33-12/verify_stage33_v91c1x_r5b2d0_swap23_source_lock_bounded_negative_v128.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2d0-swap23-source-lock-bounded-negative.json'
      - '.github/workflows/stage33-v91c1x-r5b2d0-swap23-source-lock-bounded-negative.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize B2D0 bounded-negative certificate
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b2d0_swap23_source_lock_bounded_negative.py --write
      - name: Verify B2D0 bounded-negative certificate
        run: python stages/stage33/33-12/verify_stage33_v91c1x_r5b2d0_swap23_source_lock_bounded_negative_v128.py
      - name: Verify live Stage33 state remains synchronized
        run: python stages/stage33/sync_main_state.py --check
      - name: Diff check
        run: git diff --check
      - name: Commit compact B2D0 certificate
        shell: bash
        run: |
          CERT='stages/stage33/33-12/e3-v91c1x-r5b2d0-swap23-source-lock-bounded-negative.json'
          if [ -z "$(git status --porcelain -- "$CERT")" ]; then
            echo 'B2D0 certificate already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CERT"
          git commit -m '[Stage33] materialize R5B2D0 swap23 source-lock bounded negative'
          git push origin HEAD:${GITHUB_REF_NAME}
