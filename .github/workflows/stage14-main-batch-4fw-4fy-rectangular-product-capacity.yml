name: Stage14-main-batch 4fw-4fy rectangular product capacity

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4fw/**'
      - 'stages/stage14/14-4fx/**'
      - 'stages/stage14/14-4fy/**'
      - 'stages/stage14/14-4-batch/4fw-4fy-report.md'
      - 'stages/stage14/scripts/14-4/batch_4fw_4fy_rectangular_product_capacity_audit.py'
      - '.github/workflows/stage14-main-batch-4fw-4fy-rectangular-product-capacity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deterministic audit
        run: python stages/stage14/scripts/14-4/batch_4fw_4fy_rectangular_product_capacity_audit.py

      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/14-4/batch_4fw_4fy_rectangular_product_capacity_audit.py

      - name: Previous mainline regression
        run: python stages/stage14/scripts/14-4/batch_4ft_4fv_fixed_e_shadow_split_audit.py

      - name: s7-102-104 regression
        run: python stages/stage14/scripts/14-s-batch/s7_102_104_one_dimensional_completion_audit.py

      - name: Work-bwX35 regression
        run: python stages/stage14/scripts/14-Work-bwX35/absolute_capacity_localization_audit.py

      - name: Lock q15 boundary
        run: |
          grep -Fq 'DIRECT_LOCALIZED_UNITARY_DIVISOR_SUPPORT_THEOREM_FOUND=false' docs/stage14-q15-summary.md
          grep -Fq 'Q15_UNITARY_TO_ORDINARY_LOCALIZED_DIVISOR_TRANSFER_TEST' docs/stage14-q15-summary.md

      - name: Lock batch contracts
        run: |
          grep -Fq 'Stage14-main-batch' docs/stage14-main-batch-task-contract.md
          grep -Fq 'BATCH_INTEGRATED_H_UNITS=' docs/stage14-batch-common-contract.md

      - name: Lock new receiver boundary
        run: |
          grep -Fq 'FIXED_E_ORDINARY_SHADOW_IS_RECTANGULAR_DISTINCT_PRODUCT_SET=true' stages/stage14/14-4fw/result.md
          grep -Fq 'SUBCRITICAL_RECTANGLE_CAPACITY_BRANCH_CLOSED=true' stages/stage14/14-4fx/result.md
          grep -Fq 'FIXED_E_TWO_SIDED_SURVIVAL_BUDGET=pi_minus_delta_lift_ge_mu' stages/stage14/14-4fy/result.md
          grep -Fq 'Q15_LOCALIZED_DIVISOR_ROUTE_SUPERSEDED_BY_RECTANGULAR_PRODUCT_CAPACITY=true' stages/stage14/14-4fy/result.md
          grep -Fq 'BATCH_SUBSTANTIVE_WORK_UNIT_COUNT=3' stages/stage14/14-4-batch/4fw-4fy-report.md
          grep -Fq 'BATCH_STOP_REASON=receiver_change' stages/stage14/14-4-batch/4fw-4fy-report.md
          grep -Fq 'NEXT=Stage14-4fz' stages/stage14/14-4-batch/4fw-4fy-report.md

      - name: Diff check
        run: git diff --check origin/main...HEAD
