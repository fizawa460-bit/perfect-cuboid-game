name: Stage32 BRIDGE BR204 G4 mainline replay

# Lifecycle: ACTIVE_AUTO — compact replay and post-arm storage preflight for the current BR204 G4 surface.
on:
  push:
    branches: [stage32bridge-g4-mainline]
    paths:
      - '.github/workflows/stage32-bridge-br204-recovery-replay.yml'
      - '.github/workflows/br204-stage32-bridge-recovery-g4.yml'
      - 'stages/stage32/generalization-bridge/STATE.json'
      - 'stages/stage32/generalization-bridge/BR204-G4-PREDECESSOR-CERTIFICATE.json'
      - 'stages/stage32/generalization-bridge/BR204-GENERATION4-RECOVERY-DESIGN.json'
      - 'stages/stage32/generalization-bridge/BR204-GENERATION4-RECOVERY-PLAN.json'
      - 'stages/stage32/generalization-bridge/verify_br204_generation4_recovery_plan.py'
      - 'stages/stage32/generalization-bridge/runkeys/br204-recovery-g4.json'
      - 'stages/stage32/generalization-bridge/BR204-G4-ONE-SHOT-TRIGGER.txt'
      - 'stages/stage32/generalization-bridge/BR204-G4-REPRESENTATIVE-STORAGE-MEASUREMENT.json'
      - 'stages/stage32/generalization-bridge/BR204-G4-REPRESENTATIVE-COMPACT-CHILD.json'
      - 'stages/stage32/generalization-bridge/BR202-P1-K8-FULL-QA-BOUNDED-RESULT.json'
      - 'stages/stage32/generalization-bridge/verify_br203_picard_mu_16_state_v2.py'
      - 'stages/stage32/generalization-bridge/emit_br203_bounded_mu_header.py'
      - 'stages/stage32/generalization-bridge/verify_br203_bounded_mu_intersection_kernel.cpp'
      - 'stages/stage32/generalization-bridge/verify_br204_compact_routing_surface_preflight.cpp'
      - 'stages/stage32/generalization-bridge/verify_br204_compact_k8_syndrome_preflight.cpp'
      - 'stages/stage32/generalization-bridge/verify_br204_compact_mu_bounded_equivalence.cpp'
      - 'stages/stage32/generalization-bridge/run_br204_full178_b_unit.cpp'
      - 'stages/stage32/generalization-bridge/run_br204_full178_bc_shard.cpp'
      - 'stages/stage32/generalization-bridge/combine_br204_bc_shards.py'
      - 'stages/stage32/generalization-bridge/combine_br204_bc64_to_bc16_parent.py'
      - 'stages/stage32/generalization-bridge/run_br204_resumable_bc64_hierarchical.py'
      - 'stages/stage32/generalization-bridge/verify_br204_bc_shard_equivalence.py'
      - 'stages/stage32/generalization-bridge/verify_br204_bc64_hierarchical_equivalence.py'
      - 'docs/research-os/policies/verify_repo_workflow_trigger_inventory.py'
      - 'docs/research-os/policies/repo-workflow-trigger-inventory-20260911.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-bridge-br204-g4-mainline-${{ github.ref }}
  cancel-in-progress: true

env:
  CURRENT_MAIN: a834864923086e5f7c1647e462804f45ff9ac28d
  MAIN_STATE_BLOB: 070847c669120aef1ab3777239d45878937b41f3
  PREDECESSOR_BLOB: 5a4a990a1588c71facbb9640a4c26b8641e44b02
  DESIGN_BLOB: cca9143c29c891434303cfc973ea818f965c8460
  PLAN_BLOB: a6611f245f71bb958b11efb625d3750d1d011501
  PLAN_VERIFIER_BLOB: 29cff69ef70afcf1926d6e0566a823e4fbafc1bc
  RUNKEY_BLOB: 313bd92e6dc1e60a91f74352902eee9693a5cf25
  STATE_BLOB: eb75735344c3d9daf7c0a8d64eb1bc6069f2107d
  COLD_WORKFLOW_BLOB: bd61a2c20427318f091469d25e75aa865a397be9
  MEASUREMENT_BLOB: 69331aa90b901c3de282d0ee641b2dc82a42b0bb
  MEASUREMENT_PAYLOAD_BLOB: 26ca9fcaf37b02daa18acd641c32627e91ab7afc
  REPO_LIFECYCLE_VERIFIER_BLOB: e9a6b164f94a9b49a99c62ea8496daff1314421e
  REPO_LIFECYCLE_INVENTORY_BLOB: 493130a42a564b20109fc744e359e7edb7757e34
  BR202_RESULT_BLOB: 06d0d21e5543cd5b5195c93ae431fbc186edd6ba
  BR203_VERIFIER_BLOB: 56c932c90ce2adaf702956e0b600b0a958fd29fe
  BR203_EMITTER_BLOB: 26f1a0cb87140a5050b01fc1cd076f947091ac27
  BR203_KERNEL_BLOB: 1feeae4a2f1ec39c919e35626153aba8af68266a
  BR204_ROUTING_BLOB: 42deb05d35becac2b5cffc8bfb3378b17acbd7e6
  BR204_K8_BLOB: 336285a0c204276e40da57a63ab634e88dae2b88
  BR204_MU_BLOB: b7fc7e0c6c889c92cb152d4e8b54d05d2b71a5d1
  DIRECT_WORKER_BLOB: 0d5ee8e1013cab6120e957707a363e86b3c0d41e
  SHARD_WORKER_BLOB: ca0a4985e788455432eb59d603da54fc3c703ea6
  BC_COMBINER_BLOB: 33089c2ca4876650a4ee9c6477e1e6242ad3741c
  GROUP_COMBINER_BLOB: 5986168bca8ec63e1d1aab2e417e9157ae09ef23
  HIER_HELPER_BLOB: ae79ec1ed4ed373f53e5ef010bc2f9e17d8ced45
  BC_EQ_BLOB: e77d033dd375b7a2db319b647d45d56354b9b2b8
  BC64_EQ_BLOB: 3148a180d4e41d5a2910d373a8c4cae065a0b3c3

jobs:
  recovery-replay:
    runs-on: ubuntu-latest
    outputs:
      runkey_armed: ${{ steps.armstate.outputs.armed }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify compact G4 source identities
        run: |
          set -euo pipefail
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-G4-PREDECESSOR-CERTIFICATE.json)" = "$PREDECESSOR_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-GENERATION4-RECOVERY-DESIGN.json)" = "$DESIGN_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-GENERATION4-RECOVERY-PLAN.json)" = "$PLAN_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/verify_br204_generation4_recovery_plan.py)" = "$PLAN_VERIFIER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/runkeys/br204-recovery-g4.json)" = "$RUNKEY_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/STATE.json)" = "$STATE_BLOB"
          test "$(git hash-object .github/workflows/br204-stage32-bridge-recovery-g4.yml)" = "$COLD_WORKFLOW_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-G4-REPRESENTATIVE-STORAGE-MEASUREMENT.json)" = "$MEASUREMENT_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-G4-REPRESENTATIVE-COMPACT-CHILD.json)" = "$MEASUREMENT_PAYLOAD_BLOB"
          python stages/stage32/generalization-bridge/verify_br204_generation4_recovery_plan.py
      - id: armstate
        name: Verify compact predecessor, audited arm, and firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("stages/stage32/generalization-bridge/BR204-G4-PREDECESSOR-CERTIFICATE.json").read_text())
          s=json.loads(Path("stages/stage32/generalization-bridge/STATE.json").read_text())
          r=json.loads(Path("stages/stage32/generalization-bridge/runkeys/br204-recovery-g4.json").read_text())
          assert p["frontier_before_g4"]=={
              "expected_target_count":69,
              "complete_target_count":0,
              "zero_subunit_partial_targets":[{"b":3,"d":148}],
              "missing_target_count":68,
              "reusable_generation3_completed_subunits":0,
          }
          assert p["restored_predecessor_carry"]["exact_child64_indices"]==[0,16,32,48]
          assert p["restored_predecessor_carry"]["recompute"] is False
          assert p["restored_predecessor_carry"]["parent_payload_sha256"]=="d3a84475e3d7c68614fa101f166b0c342c32ea9c73453e5ea331fa608a284973"
          assert all(v is False for v in p["credit"].values())
          assert s["schema"]=="STAGE32_GENERALIZATION_BRIDGE_STATE_V20_G4_BOOTSTRAP_COLD_GATE"
          assert s["routing"]["BR204_FULL178_scaleout_authorized"] is False
          assert s["routing"]["heavy_compute_armed"] is False
          assert all(v is False for v in s["credit_firewall"].values())
          assert r["generation"]==1 and r["armed"] is True
          ac=r["arm_contract"]
          assert ac["audited_doorstep_head"]=="4be08e46894dc8aedde5ce19b7c00da85b85b3af"
          assert ac["audited_doorstep_review_id"]==5312620454
          assert ac["hostile_audit_status"]=="PASS"
          assert ac["planned_effective_heavy_concurrency"]==12
          assert ac["repository_stage_concurrency_ceiling"]==18
          assert ac["observed_other_stage32_heavy_concurrency_at_arm"]==0
          assert ac["combined_effective_heavy_concurrency_at_arm"]==12
          assert all(v is False for v in r["credit"].values())
          PY
          echo 'armed=true' >> "$GITHUB_OUTPUT"
      - name: Verify current MAIN identity
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$CURRENT_MAIN"
          test "$(git rev-parse origin/main:stages/stage32/MAIN-STATE.json)" = "$MAIN_STATE_BLOB"
          git merge-base --is-ancestor "$CURRENT_MAIN" HEAD
      - name: Verify repository workflow lifecycle
        run: |
          set -euo pipefail
          test "$(git hash-object docs/research-os/policies/verify_repo_workflow_trigger_inventory.py)" = "$REPO_LIFECYCLE_VERIFIER_BLOB"
          test "$(git hash-object docs/research-os/policies/repo-workflow-trigger-inventory-20260911.json)" = "$REPO_LIFECYCLE_INVENTORY_BLOB"
          python docs/research-os/policies/verify_repo_workflow_trigger_inventory.py
      - name: Verify replay source identities
        run: |
          set -euo pipefail
          test "$(git hash-object stages/stage32/generalization-bridge/BR202-P1-K8-FULL-QA-BOUNDED-RESULT.json)" = "$BR202_RESULT_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/verify_br203_picard_mu_16_state_v2.py)" = "$BR203_VERIFIER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/emit_br203_bounded_mu_header.py)" = "$BR203_EMITTER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/verify_br203_bounded_mu_intersection_kernel.cpp)" = "$BR203_KERNEL_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/verify_br204_compact_routing_surface_preflight.cpp)" = "$BR204_ROUTING_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/verify_br204_compact_k8_syndrome_preflight.cpp)" = "$BR204_K8_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/verify_br204_compact_mu_bounded_equivalence.cpp)" = "$BR204_MU_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/run_br204_full178_b_unit.cpp)" = "$DIRECT_WORKER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/run_br204_full178_bc_shard.cpp)" = "$SHARD_WORKER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/combine_br204_bc_shards.py)" = "$BC_COMBINER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/combine_br204_bc64_to_bc16_parent.py)" = "$GROUP_COMBINER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/run_br204_resumable_bc64_hierarchical.py)" = "$HIER_HELPER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/verify_br204_bc_shard_equivalence.py)" = "$BC_EQ_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/verify_br204_bc64_hierarchical_equivalence.py)" = "$BC64_EQ_BLOB"
      - name: Verify actual predecessor-child lossless compaction preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREDECESSOR_RUN_ID: '35574528620'
          PREDECESSOR_ARTIFACT_ID: '10628120960'
          PREDECESSOR_ARTIFACT_NAME: br204-g3-replacement-b2-d148-bc0of16
          PREDECESSOR_ARTIFACT_DIGEST: sha256:dd76c0d102af75b6313c485a264ee3b5fdd7734aec940c97d88c185a8f590cee
        run: |
          set -euo pipefail
          mkdir -p /tmp/g4pred /tmp/g4cert /tmp/g4raw
          gh api "repos/$REPO/actions/runs/$PREDECESSOR_RUN_ID/artifacts?per_page=100" > /tmp/g4-artifacts.json
          python - <<'PY'
          import json,os
          x=json.load(open('/tmp/g4-artifacts.json'))['artifacts']
          hit=[a for a in x if a['id']==int(os.environ['PREDECESSOR_ARTIFACT_ID'])]
          assert len(hit)==1
          a=hit[0]
          assert a['name']==os.environ['PREDECESSOR_ARTIFACT_NAME']
          assert a['expired'] is False
          assert a['digest']==os.environ['PREDECESSOR_ARTIFACT_DIGEST']
          PY
          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/artifacts/$PREDECESSOR_ARTIFACT_ID/zip" > /tmp/g4pred.zip
          unzip -q /tmp/g4pred.zip -d /tmp/g4pred
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={
            0:'5881148242d36fcf98c713a4711397e1b3f414afade2effc263aa8476fb29442',
            16:'2fa5982933d06d855a9a56493c23a23351f2b289bbebae7471550ac5732f5f83',
            32:'f7a7d36d5f5b812e445926df5ce11f9d9cd13803d650b3c73b14011f406e3dff',
            48:'044a708ae4e4a263cc3755b7c5f18d754397660dc4c1dd1c81ad9e2d6dae4fa1',
          }
          for i,sha in expected.items():
              p=Path(f'/tmp/g4pred/children/br204-f-b2-d148-bc{i}of64.tsv.gz')
              assert p.is_file()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==sha
          PY
          for i in 0 16 32 48; do
            python stages/stage32/generalization-bridge/combine_br204_bc_shards.py compact-child               --input "/tmp/g4pred/children/br204-f-b2-d148-bc${i}of64.tsv.gz"               --output "/tmp/g4cert/child-${i}.json"               --worker-blob "$SHARD_WORKER_BLOB" --plan-blob "$PLAN_BLOB" --runkey-blob "$RUNKEY_BLOB"
            python stages/stage32/generalization-bridge/combine_br204_bc_shards.py verify-compact-child               --certificate "/tmp/g4cert/child-${i}.json" --output-raw "/tmp/g4raw/child-${i}.tsv"               --expected-worker-blob "$SHARD_WORKER_BLOB" --expected-plan-blob "$PLAN_BLOB"               --expected-runkey-blob "$RUNKEY_BLOB"
          done
          python - <<'PY'
          from pathlib import Path
          sizes=[p.stat().st_size for p in Path('/tmp/g4cert').glob('child-*.json')]
          assert len(sizes)==4 and max(sizes)<=65536
          projected=max(sizes)*2684
          assert projected < 524288000
          assert 175898624 < 524288000
          print({'actual_certificate_bytes':sorted(sizes),'max_actual':max(sizes),
                 'projected_2684_at_max':projected,'hard_cap':65536,'budget':524288000})
          PY
      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Replay retained BR203 and bounded BR204 semantics
        run: |
          set -euo pipefail
          python stages/stage32/generalization-bridge/verify_br203_picard_mu_16_state_v2.py --output /tmp/mu.json
          python stages/stage32/generalization-bridge/emit_br203_bounded_mu_header.py /tmp/mu.json /tmp/br203_mu_generated.hpp
          g++ -std=c++20 -O3 -DNDEBUG -I/tmp stages/stage32/generalization-bridge/verify_br203_bounded_mu_intersection_kernel.cpp -o /tmp/br203-direct
          /tmp/br203-direct > /tmp/br203-direct.json
          g++ -std=c++20 -O3 -DNDEBUG stages/stage32/generalization-bridge/verify_br204_compact_routing_surface_preflight.cpp -o /tmp/routing
          /tmp/routing > /tmp/routing.json
          g++ -std=c++20 -O3 -DNDEBUG stages/stage32/generalization-bridge/verify_br204_compact_k8_syndrome_preflight.cpp -o /tmp/k8
          /tmp/k8 > /tmp/k8.json
          g++ -std=c++20 -O3 -DNDEBUG -I/tmp stages/stage32/generalization-bridge/verify_br204_compact_mu_bounded_equivalence.cpp -o /tmp/mu-eq
          /tmp/mu-eq > /tmp/mu-eq.json
      - name: Reprove BR204 partition equivalences
        run: |
          python stages/stage32/generalization-bridge/verify_br204_bc_shard_equivalence.py --include-dir /tmp --b 0 --d 8 --shard-count 16
          python stages/stage32/generalization-bridge/verify_br204_bc64_hierarchical_equivalence.py --include-dir /tmp --b 0 --d 8
      - name: Diff check compact G4 surface
        run: |
          set -euo pipefail
          git -c core.whitespace=-blank-at-eof diff --check "$CURRENT_MAIN" HEAD --             .github/workflows/stage32-bridge-br204-recovery-replay.yml             .github/workflows/br204-stage32-bridge-recovery-g4.yml             stages/stage32/generalization-bridge             docs/research-os/policies/verify_repo_workflow_trigger_inventory.py             docs/research-os/policies/repo-workflow-trigger-inventory-20260911.json


  cold-gate-bootstrap:
    name: cold-gate-bootstrap
    needs: recovery-replay
    if: needs.recovery-replay.outputs.runkey_armed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify retained MANUAL cold-gate source locks
        run: |
          set -euo pipefail
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-G4-PREDECESSOR-CERTIFICATE.json)" = "$PREDECESSOR_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-GENERATION4-RECOVERY-DESIGN.json)" = "$DESIGN_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-GENERATION4-RECOVERY-PLAN.json)" = "$PLAN_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/verify_br204_generation4_recovery_plan.py)" = "$PLAN_VERIFIER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/runkeys/br204-recovery-g4.json)" = "$RUNKEY_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/STATE.json)" = "$STATE_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-G4-REPRESENTATIVE-STORAGE-MEASUREMENT.json)" = "$MEASUREMENT_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-G4-REPRESENTATIVE-COMPACT-CHILD.json)" = "$MEASUREMENT_PAYLOAD_BLOB"
          python stages/stage32/generalization-bridge/verify_br204_generation4_recovery_plan.py
      - name: Verify predecessor and zero-credit firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("stages/stage32/generalization-bridge/BR204-G4-PREDECESSOR-CERTIFICATE.json").read_text())
          s=json.loads(Path("stages/stage32/generalization-bridge/STATE.json").read_text())
          r=json.loads(Path("stages/stage32/generalization-bridge/runkeys/br204-recovery-g4.json").read_text())
          m=json.loads(Path("stages/stage32/generalization-bridge/BR204-G4-REPRESENTATIVE-STORAGE-MEASUREMENT.json").read_text())
          assert p["schema"]=="STAGE32_BR204_G4_PREDECESSOR_CERTIFICATE_V1"
          assert p["frontier_before_g4"]["expected_target_count"]==69
          assert p["frontier_before_g4"]["complete_target_count"]==0
          assert p["restored_predecessor_carry"]["exact_child64_indices"]==[0,16,32,48]
          assert p["restored_predecessor_carry"]["recompute"] is False
          assert all(v is False for v in p["credit"].values())
          assert s["schema"]=="STAGE32_GENERALIZATION_BRIDGE_STATE_V20_G4_BOOTSTRAP_COLD_GATE"
          assert s["routing"]["heavy_compute_armed"] is False
          assert s["routing"]["BR204_FULL178_scaleout_authorized"] is False
          assert all(v is False for v in s["credit_firewall"].values())
          assert r["generation"]==0 and r["armed"] is False
          assert all(v is False for v in r["credit"].values())
          assert m["payload_bytes"]==448 and m["within_hard_cap"] is True
          PY
      - name: Verify current MAIN source lock
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$CURRENT_MAIN"
          test "$(git rev-parse FETCH_HEAD:stages/stage32/MAIN-STATE.json)" = "$MAIN_STATE_BLOB"
      - name: Confirm heavy execution remains unavailable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("stages/stage32/generalization-bridge/BR204-GENERATION4-RECOVERY-PLAN.json").read_text())
          r=json.loads(Path("stages/stage32/generalization-bridge/runkeys/br204-recovery-g4.json").read_text())
          assert p["authorization"]["heavy_compute_authorized"] is False
          assert p["authorization"]["runkey_armed"] is False
          assert r["armed"] is False
          print("G4 compact mainline bootstrap cold gate: PASS; heavy remains unauthorized")
          PY
