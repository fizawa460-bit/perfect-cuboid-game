name: Stage32 BRIDGE BR204 post-cancellation recovery replay

# Lifecycle: ACTIVE_AUTO — current BR204 post-cancellation/carry-repair audit gate.
on:
  push:
    branches: [stage32bridge-mainbatch]
    paths:
      - '.github/workflows/stage32-bridge-br204-recovery-replay.yml'
      - 'stages/stage32/generalization-bridge/BR204-GENERATION3-CANCELLATION-CHECKPOINT.json'
      - 'stages/stage32/generalization-bridge/verify_br204_generation3_cancellation_checkpoint.py'
      - 'stages/stage32/generalization-bridge/BR204-G3-EXPIRED-CARRY-REPAIR-TARGET.json'
      - 'stages/stage32/generalization-bridge/run_br204_single_bc16_parent_via_bc64.py'
      - '.github/workflows/br204-stage32-bridge-g3-carry-repair.yml'
      - 'stages/stage32/generalization-bridge/runkeys/br204-g3-expired-carry-repair.json'
      - 'stages/stage32/generalization-bridge/STATE.json'
      - 'docs/research-os/policies/repo-workflow-trigger-inventory-bridge-supplement.json'
      - '.github/workflows/br204-stage32-bridge-heavy.yml'
      - '.github/workflows/br204-stage32-bridge-recovery-g3.yml'
      - '.github/workflows/stage32-bridge-br204-retained-replay.yml'
      - 'docs/research-os/policies/verify_repo_workflow_trigger_inventory.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-bridge-br204-post-cancel-replay-${{ github.ref }}
  cancel-in-progress: true

env:
  CURRENT_MAIN: da573f048a82a63e459be1343fb002e663b60875
  MAIN_STATE_BLOB: a8f873ffdcaca280f7b57158b69606b3ea496d3c
  G3_CHECKPOINT_BLOB: f8e8ff8c469eea73f08beeb2dcb6fa17911aba30
  G3_CHECKPOINT_VERIFIER_BLOB: bdef488aa29f73da1134cd0f39e5f14e3466cf1c
  G3_TARGETS_BLOB: 975fadbe0f3ee0dfd7c792be7807c154421dec20
  G3_ARM_RUNKEY_BLOB: cc6aa298754e12a9a806ccd0a4e245fd6ca29e99
  REPAIR_TARGET_BLOB: 73bf49fb82ba0256fe870e235cfbde7ee036cba0
  REPAIR_RUNNER_BLOB: 1dc29de6b7af6e547a01be5666ffaab8387377b3
  REPAIR_WORKFLOW_BLOB: 48b49646a6461961284967df42a81c16c8b07ead
  REPAIR_RUNKEY_BLOB: ff50c2cf70f5a8e37083e6486a130db44c06daaf
  STATE_BLOB: 64a6947b0eb1d8f661cd2590d9b8f041e23614aa
  G1_MANUAL_BLOB: f8aef3a5abf0119d78c1a80a784027bc5fa5e3d9
  G3_MANUAL_BLOB: 4359bb7678b0a90fa184f7d41584649d0229ca38
  OLD_REPLAY_MANUAL_BLOB: eea43a14cbbd1d37378122e06f6bec1834a4a3d9
  LIFECYCLE_SUPPLEMENT_BLOB: 4db10552ffe3d96848ce492e9e747752e21507a7
  SHARD_WORKER_BLOB: ca0a4985e788455432eb59d603da54fc3c703ea6
  BC_COMBINER_BLOB: efcbcc3e2b31604acea8f83bbf9524e5180e5139
  GROUP_COMBINER_BLOB: 5986168bca8ec63e1d1aab2e417e9157ae09ef23
  HIER_HELPER_BLOB: ae79ec1ed4ed373f53e5ef010bc2f9e17d8ced45
  LAST_AUDITED_COLD: f30d33e3992c3bbecb171f14d60086424f017d8c

jobs:
  recovery-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.sha }}, fetch-depth: 0}
      - name: Verify frozen G3 cancellation and current STATE
        run: |
          set -euo pipefail
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-GENERATION3-CANCELLATION-CHECKPOINT.json)" = "$G3_CHECKPOINT_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/verify_br204_generation3_cancellation_checkpoint.py)" = "$G3_CHECKPOINT_VERIFIER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-GENERATION3-RECOVERY-TARGETS.json)" = "$G3_TARGETS_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/runkeys/br204-recovery-g3.json)" = "$G3_ARM_RUNKEY_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/STATE.json)" = "$STATE_BLOB"
          python stages/stage32/generalization-bridge/verify_br204_generation3_cancellation_checkpoint.py
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage32/generalization-bridge/STATE.json').read_text())
          assert s['active_leaf']=='BR204_G3_EXPIRED_CARRY_REPAIR_COLD_DOORSTEP_AUDIT'
          c=s['generation3_execution_checkpoint']
          assert (c['complete_target_count'],c['partial_target_count'],c['missing_target_count'],c['reusable_g3_completed_subunit_count'])==(0,1,68,0)
          assert c['expired_generation2_carry']['reusable'] is False
          PY
      - name: Verify current MAIN identity
        run: |
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$CURRENT_MAIN"
          test "$(git rev-parse FETCH_HEAD:stages/stage32/MAIN-STATE.json)" = "$MAIN_STATE_BLOB"
      - name: Verify workflow lifecycle inventory
        run: |
          test "$(git hash-object docs/research-os/policies/repo-workflow-trigger-inventory-bridge-supplement.json)" = "$LIFECYCLE_SUPPLEMENT_BLOB"
          test "$(git hash-object .github/workflows/br204-stage32-bridge-heavy.yml)" = "$G1_MANUAL_BLOB"
          test "$(git hash-object .github/workflows/br204-stage32-bridge-recovery-g3.yml)" = "$G3_MANUAL_BLOB"
          test "$(git hash-object .github/workflows/stage32-bridge-br204-retained-replay.yml)" = "$OLD_REPLAY_MANUAL_BLOB"
          python docs/research-os/policies/verify_repo_workflow_trigger_inventory.py
      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Replay retained BR203 and bounded BR204 semantics
        run: |
          set -euo pipefail
          python stages/stage32/generalization-bridge/verify_br203_picard_mu_16_state_v2.py --output /tmp/mu.json
          python stages/stage32/generalization-bridge/emit_br203_bounded_mu_header.py /tmp/mu.json /tmp/br203_mu_generated.hpp
          g++ -std=c++20 -O3 -DNDEBUG -I/tmp stages/stage32/generalization-bridge/verify_br203_bounded_mu_intersection_kernel.cpp -o /tmp/br203-direct
          /tmp/br203-direct > /tmp/br203-direct.json
          g++ -std=c++20 -O3 -DNDEBUG stages/stage32/generalization-bridge/verify_br204_compact_routing_surface_preflight.cpp -o /tmp/routing
          /tmp/routing > /tmp/routing.json
          g++ -std=c++20 -O3 -DNDEBUG stages/stage32/generalization-bridge/verify_br204_compact_k8_syndrome_preflight.cpp -o /tmp/k8
          /tmp/k8 > /tmp/k8.json
          g++ -std=c++20 -O3 -DNDEBUG -I/tmp stages/stage32/generalization-bridge/verify_br204_compact_mu_bounded_equivalence.cpp -o /tmp/mu-eq
          /tmp/mu-eq > /tmp/mu-eq.json
      - name: Verify cold single-parent repair source locks and firewalls
        run: |
          set -euo pipefail
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-G3-EXPIRED-CARRY-REPAIR-TARGET.json)" = "$REPAIR_TARGET_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/run_br204_single_bc16_parent_via_bc64.py)" = "$REPAIR_RUNNER_BLOB"
          test "$(git hash-object .github/workflows/br204-stage32-bridge-g3-carry-repair.yml)" = "$REPAIR_WORKFLOW_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/runkeys/br204-g3-expired-carry-repair.json)" = "$REPAIR_RUNKEY_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/run_br204_full178_bc_shard.cpp)" = "$SHARD_WORKER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/combine_br204_bc_shards.py)" = "$BC_COMBINER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/combine_br204_bc64_to_bc16_parent.py)" = "$GROUP_COMBINER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/run_br204_resumable_bc64_hierarchical.py)" = "$HIER_HELPER_BLOB"
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path('stages/stage32/generalization-bridge/BR204-G3-EXPIRED-CARRY-REPAIR-TARGET.json').read_text()); rk=json.loads(Path('stages/stage32/generalization-bridge/runkeys/br204-g3-expired-carry-repair.json').read_text())
          assert t['target']['exact_child_indices']==[0,16,32,48] and t['expired_source']['exact_bytes_available'] is False and t['expired_source']['reusable'] is False
          assert rk['generation']==0 and rk['armed'] is False and rk['execution']['target']=={'b':2,'d':148,'parent_bc16_index':0}
          assert rk['recovery_policy']['broader_generation3_or_generation4_wave_forbidden'] is True and rk['recovery_policy']['only_parent_bc16_index0_recomputed'] is True
          assert rk['arm_contract']['audited_doorstep_head'] is None and rk['arm_contract']['audited_doorstep_review_id'] is None
          assert all(v is False for v in rk['credit'].values())
          PY
      - name: Reprove BC partition equivalences
        run: |
          python stages/stage32/generalization-bridge/verify_br204_bc_shard_equivalence.py --include-dir /tmp --b 0 --d 8 --shard-count 16
          python stages/stage32/generalization-bridge/verify_br204_bc64_hierarchical_equivalence.py --include-dir /tmp --b 0 --d 8
      - name: Reverify bounded BR205 qBC-tail attribution without authorization
        run: python stages/stage32/generalization-bridge/verify_br205_qbc_slack_attribution_bounded_preflight.py
      - name: Diff check from last hostile-audited cold boundary
        run: git -c core.whitespace=-blank-at-eof diff --check "$LAST_AUDITED_COLD" HEAD
