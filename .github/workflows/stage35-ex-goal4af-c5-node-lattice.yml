name: Stage35-EX Goal4AF local C5 node-lattice extraction

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_local_node_lattice.py'
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_sign_stabilizer.py'
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_galois_stabilizer.py'
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_branch_conic_receiver.py'
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_branch_conic_receiver_v2.py'
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_branch_conic_receiver_v3.py'
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_branch_conic_receiver_v4.py'
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_target_span.py'
      - 'stages/stage35-ex/runkeys/goal4af-c5-node-lattice.json'
      - '.github/workflows/stage35-ex-goal4af-c5-node-lattice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage35-ex-goal4af-node-lattice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          KEY='stages/stage35-ex/runkeys/goal4af-c5-node-lattice.json'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test '${{ github.event_name }}' = 'pull_request' || exit 0
          test "${PR_NUMBER}" = '1659' || exit 0
          test "${HEAD_REF}" = 'stage35-ex-goal4x-open-receiver-boundary-picard' || exit 0
          test -n "${BEFORE}" || exit 0
          git fetch --no-tags --depth=1 origin "${BEFORE}" || exit 0
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || exit 0
          git diff --name-only "${BEFORE}" "${HEAD_SHA}" | grep -Fxq "${KEY}" || exit 0
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          key=Path('stages/stage35-ex/runkeys/goal4af-c5-node-lattice.json')
          diag=Path('stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_target_span.py')
          new=json.loads(key.read_text())
          assert new['schema']=='STAGE35_EX_GOAL4AF_C5_NODE_LATTICE_RUNKEY_V1'
          assert new['armed'] is True and new['generation']==12
          assert new['route']=='LOCAL_C5_MARKED_REPRESENTATIVE_TARGET_SPAN_SYMPY'
          def blob(p):
              raw=p.read_bytes(); return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob(diag)==new['diagnostic_blob_sha1']=='3a5045f7f3c48a2f93a8116090beca1422bafac3'
          before='${{ github.event.before }}'
          old=json.loads(subprocess.check_output(['git','show',f'{before}:{key.as_posix()}'],text=True))
          assert old['generation']==11
          r=new['generation11_result']
          assert r['workflow_run']==34071538303 and r['job']==101589709266
          assert r['failure_before_target_span_math']=='MISSING_SYMPY_DEPENDENCY'
          assert new['planned_jobs']==1 and new['planned_shards']==1
          assert new['persisted_output_upper_bound_bytes']<=16384
          assert new['actions_artifact_upload'] is False
          print('GOAL4AF_TARGET_SPAN_G12_AUTHORIZED=true')
          PY
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  diagnose:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact local linear-algebra dependency
        run: python -m pip install --disable-pip-version-check --no-input sympy==1.14.0
      - name: Test Goal4AA target span after adjoining C5 marked representatives
        run: |
          set -euo pipefail
          python -B stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_target_span.py | tee /tmp/goal4af-target-span.log
          grep -q '^GOAL4AF_TARGET_SPAN_JSON=' /tmp/goal4af-target-span.log
          test "$(wc -c </tmp/goal4af-target-span.log)" -le 16384
      - name: Enforce marked-representative no-credit boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=Path('/tmp/goal4af-target-span.log').read_text()
          d=json.loads(next(x for x in s.splitlines() if x.startswith('GOAL4AF_TARGET_SPAN_JSON=')).split('=',1)[1])
          assert d['goal4ab_linear_section_column_count']==43
          assert d['goal4ab_linear_section_span_rank']==31
          assert d['formal_target_support_count']==69
          assert d['c5_goal4ac_residual_pair_count']==4
          assert d['c5_residual_distinct_marked_picard64_row_count']==2
          assert isinstance(d['formal_target_in_Q_span_after_adjoining_c5_marked_representatives'],bool)
          assert d['actual_C5_support_identified_with_marked_representative'] is False
          assert d['explicit_F_B_materialized'] is False
          assert d['general_principal_function_problem_closed'] is False
          assert d['remote_cas_used'] is False
          assert d['theorem_credit'] is False and d['endpoint_credit'] is False
          assert d['E1_proved'] is False and d['stage35_closed'] is False
          print('GOAL4AF_TARGET_SPAN_G12_BOUNDARY=PASS')
          PY