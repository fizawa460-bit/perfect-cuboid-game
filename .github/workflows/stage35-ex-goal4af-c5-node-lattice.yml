name: Stage35-EX Goal4AF local C5 node-lattice extraction

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_local_node_lattice.py'
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_sign_stabilizer.py'
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_galois_stabilizer.py'
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_branch_conic_receiver.py'
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_branch_conic_receiver_v2.py'
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_branch_conic_receiver_v3.py'
      - 'stages/stage35-ex/runkeys/goal4af-c5-node-lattice.json'
      - '.github/workflows/stage35-ex-goal4af-c5-node-lattice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage35-ex-goal4af-node-lattice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          KEY='stages/stage35-ex/runkeys/goal4af-c5-node-lattice.json'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test '${{ github.event_name }}' = 'pull_request' || exit 0
          test "${PR_NUMBER}" = '1659' || exit 0
          test "${HEAD_REF}" = 'stage35-ex-goal4x-open-receiver-boundary-picard' || exit 0
          test -n "${BEFORE}" || exit 0
          git fetch --no-tags --depth=1 origin "${BEFORE}" || exit 0
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || exit 0
          git diff --name-only "${BEFORE}" "${HEAD_SHA}" | grep -Fxq "${KEY}" || exit 0
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          key=Path('stages/stage35-ex/runkeys/goal4af-c5-node-lattice.json')
          diag=Path('stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_branch_conic_receiver_v3.py')
          new=json.loads(key.read_text())
          assert new['schema']=='STAGE35_EX_GOAL4AF_C5_NODE_LATTICE_RUNKEY_V1'
          assert new['armed'] is True and new['generation']==9
          assert new['route']=='LOCAL_SOURCE_C1_25_BRANCH_CONIC_RECEIVER_SOLVE_V3'
          def blob(p):
              raw=p.read_bytes(); return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob(diag)==new['diagnostic_blob_sha1']=='b536ef738049f91fa12b8ce3e8f0921996b9a3d7'
          before='${{ github.event.before }}'
          old=json.loads(subprocess.check_output(['git','show',f'{before}:{key.as_posix()}'],text=True))
          assert old['generation']==8
          r=new['generation8_result']
          assert r['workflow_run']==34070524409 and r['job']==101586918424
          assert r['receiver_augmented_rank']==64 and r['receiver_augmented_nullity']==0
          assert r['pair_rows_materialized'] is True and r['pair_count']==8
          assert r['goal4ac_residual_pair_count']==4
          assert r['failure_after_materialization']=='OVERSTRONG_BRANCH_CONIC_RECEIVER_EXHAUSTION_POSTCHECK'
          assert new['planned_jobs']==1 and new['planned_shards']==1
          assert new['persisted_output_upper_bound_bytes']<=65536
          assert new['actions_artifact_upload'] is False
          print('GOAL4AF_BRANCH_CONIC_RECEIVER_G9_AUTHORIZED=true')
          PY
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  diagnose:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay final C5 pair solve without receiver-bijection assumption
        run: |
          set -euo pipefail
          python -B stages/stage35-ex/diagnose_stage35_ex_35_goal4af_c5_branch_conic_receiver_v3.py | tee /tmp/goal4af-c25-receiver.log
          grep -q '^GOAL4AF_SIGN_STABILIZER_JSON=' /tmp/goal4af-c25-receiver.log
          grep -q '^GOAL4AF_BRANCH_CONIC_RECEIVER_JSON=' /tmp/goal4af-c25-receiver.log
          test "$(wc -c </tmp/goal4af-c25-receiver.log)" -le 65536
      - name: Enforce source-receiver no-credit boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=Path('/tmp/goal4af-c25-receiver.log').read_text()
          base=json.loads(next(x for x in s.splitlines() if x.startswith('GOAL4AF_SIGN_STABILIZER_JSON=')).split('=',1)[1])
          d=json.loads(next(x for x in s.splitlines() if x.startswith('GOAL4AF_BRANCH_CONIC_RECEIVER_JSON=')).split('=',1)[1])
          assert base['galois_stabilizer_augmented_rank']==63
          assert base['galois_stabilizer_augmented_nullity']==1
          assert base['pair_rows_materialized'] is True and base['pair_count']==8
          assert base['goal4ac_residual_pair_count']==4
          assert d['receiver_known_curve_index_1based']==25
          assert d['receiver_each_c5_intersection']==2
          assert d['receiver_total_pair_intersection']==4
          assert d['receiver_augmented_rank']==64 and d['receiver_augmented_nullity']==0
          recv=d['equivariant_receiver_indices_1based']
          assert len(recv)==8
          assert all(25<=int(x)<=32 for x in recv.values())
          assert d['pair_rows_materialized'] is True and d['pair_count']==8
          assert d['goal4ac_residual_pair_count']==4
          assert d['target_span_computed'] is False
          assert d['theorem_credit'] is False and d['endpoint_credit'] is False
          print('GOAL4AF_BRANCH_CONIC_RECEIVER_G9_BOUNDARY=PASS')
          PY