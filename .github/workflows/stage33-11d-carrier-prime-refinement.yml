name: Stage33-11d carrier prime refinement

on:
  pull_request:
    paths:
      - 'stages/stage33/33-11d/run-key.json'
      - '.github/workflows/stage33-11d-carrier-prime-refinement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: authorize
        env:
          EVENT: '${{ github.event_name }}'
          ACTION: '${{ github.event.action }}'
          BEFORE: '${{ github.event.before }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: python stages/stage33/33-11d/authorize_stage33_11d_run.py

  verify-prime-refinement:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned exact local algebra
        run: python -m pip install 'sympy==1.14.0'
      - name: Verify frozen source lock and exact primary decompositions
        run: python stages/stage33/33-11d/verify_stage33_11d_prime_refinement.py
      - name: Enforce no-promotion boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='stages/stage33/33-11d/stage33-11d-prime-refinement-certificate.json'
          x=json.load(open(p, encoding='utf-8'))
          assert x['summary']['stage33_11d_status']=='OPEN_UNRESOLVED'
          assert x['summary']['remaining_unresolved_geometric_representatives']==3
          assert x['summary']['remaining_unresolved_original_carriers']==11
          assert x['summary']['stage33_11_exact_connecting_progress']=='0/26'
          assert x['summary']['exact_connecting_columns_promoted']==0
          assert not any([
              x['firewalls']['stage33_11_closed_exact'],
              x['firewalls']['stage33_12_released'],
              x['firewalls']['stage33_08_released'],
              x['firewalls']['stage33_07_closed'],
              x['firewalls']['theorem_credit'],
              x['firewalls']['endpoint_credit'],
          ])
          assert x['actions_preflight']['planned_effective_heavy_concurrency']==0
          assert x['actions_preflight']['projected_new_artifact_storage_bytes']==0
          print('STAGE33_11D_NO_PROMOTION_FIREWALL=PASS')
          PY
