name: Stage32 32-01-178 N344 integral self-square threshold

on:
  pull_request:
    paths:
      - 'stages/stage32/32-01-178/nodes/N344/**'
      - '.github/workflows/stage32-01-178-n344-integral-self-square-threshold.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.13.0.0'
      - name: Verify N344 integral self-square threshold
        run: python stages/stage32/32-01-178/nodes/N344/verify_n344_integral_self_square_threshold.py
      - name: Diff check
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
