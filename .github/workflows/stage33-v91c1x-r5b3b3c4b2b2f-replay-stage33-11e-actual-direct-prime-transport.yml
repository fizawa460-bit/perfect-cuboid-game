name: Stage33 V91C1X C4B2B2F replay Stage33-11e actual direct-prime transport

on:
  push:
    branches:
      - stage33-v91c1x-r5b3b3c4b1e-1757-refinement-unit-preflight
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b2b2f-replay-stage33-11e-actual-direct-prime-transport.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b2b2f_replay_stage33_11e_actual_direct_prime_transport.py'
      - 'stages/stage33/33-11e/stage33-11e-prime-galois-transport-certificate.json'
      - 'stages/stage33/33-11e/stage33-11e-source-lock.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b2c2-lin024-actual-four-component-prime-incidence.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b2e-remaining-seven-direct-support-actual-prime-refinement.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Replay Stage33-11e on repaired actual direct primes
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b2b2f_replay_stage33_11e_actual_direct_prime_transport.py --write
      - name: Enforce artifact-only bounded delta
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b2f-stage33-11e-actual-direct-prime-transport-replay.json'
          changed="$(git status --porcelain | sed 's/^...//')"
          test -n "$changed"
          test "$changed" = "$artifact"
          git diff --check
      - name: Commit generated certificate
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b2f-stage33-11e-actual-direct-prime-transport-replay.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$artifact"
          git diff --cached --quiet || git commit -m '[Stage33] materialize C4B2B2F repaired Stage33-11e transport replay'
          git push
