name: Stage12-N1c optimize bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/stage12-n1c-optimize-bootstrap.yml"

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage12-n1-primitive-joint
      - name: Optimize divisor loops
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit_shared_p_global_mobius_stage12_n1c.py')
          text = path.read_text()
          text = text.replace(
              'from audit_shared_p_convolution_stage11 import MAX_D, THRESHOLDS, enumerate_shared_p\nfrom audit_shared_p_primitive_joint_stage12_n1b import mobius_sieve\n',
              'from audit_shared_p_convolution_stage11 import MAX_D, THRESHOLDS, build_spf, enumerate_shared_p\nfrom audit_shared_p_primitive_joint_stage12_n1b import divisors, mobius_sieve\n'
          )
          text = text.replace(
              '    mu = mobius_sieve(MAX_D)\n',
              '    mu = mobius_sieve(MAX_D)\n    spf = build_spf(MAX_D)\n',
              1
          )
          text = text.replace(
              '        divisors = [k for k in range(1, p + 1) if p % k == 0]\n        for k in divisors:\n',
              '        for k in divisors(p, spf):\n'
          )
          text = text.replace(
              '            for k in range(1, p + 1):\n                if p % k:\n                    continue\n',
              '            for k in divisors(p, spf):\n'
          )
          path.write_text(text)
          PY
          rm -f .github/workflows/stage12-n1c-optimize-bootstrap.yml
      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize Stage12-N1c divisor audits"
          git push origin HEAD:agent/stage12-n1-primitive-joint
