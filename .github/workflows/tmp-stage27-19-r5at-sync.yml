name: Temporary Stage27-19-r5at lifecycle sync

on:
  push:
    paths:
      - '.github/workflows/tmp-stage27-19-r5at-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-19-r5at-kappa-ceiling
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize lifecycle and active route
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          old_path = root/'stages/stage27/27-19-r5aq/route-contract.json'
          old = json.loads(old_path.read_text())
          old['status'] = 'CLOSED_AUDITED_PASS_MERGED'
          old['fresh_audit_required'] = False
          old['merge_allowed'] = True
          old['advance_allowed'] = True
          old['audit_status'] = 'PASS'
          old['final_audit'] = {
              'verdict': 'PASS',
              'pr': 1068,
              'head': 'b0039f5b9c88ce83c78098b32fc3a320e3bbd6a8',
              'merge_commit': 'fbae8c1bde526a82bbcfc11eed8f86ac5dda5351',
              'exact_head_ci_run': 32008700863,
              'exact_head_ci_conclusion': 'SUCCESS',
              'successor': '27-19-r5at'
          }
          old_path.write_text(json.dumps(old, indent=2) + '\n')

          audit = root/'stages/stage27/27-19-r5aq/audit-final.md'
          audit.write_text('''# Stage27-19-r5aq-r5as final audit\n\n```text\nAUDIT_VERDICT=PASS\nMATHEMATICAL_AUDIT=PASS\nCI_AUDIT=PASS\nLIFECYCLE_AUDIT=PASS\nPR=1068\nFINAL_HEAD=b0039f5b9c88ce83c78098b32fc3a320e3bbd6a8\nMERGE_COMMIT=fbae8c1bde526a82bbcfc11eed8f86ac5dda5351\nEXACT_HEAD_CI_RUN=32008700863\nEXACT_HEAD_CI=SUCCESS\nSTRICT_SUB_SQRT_UPPER_PROVED=false\nNEW_MU_LT_HALF_PROVED=false\nTRUE_N2_EXPONENT_IDENTIFIED=false\n```\n\nThe final repaired batch is accepted: the kappa subpower prefactor is retained as `(X*k)^eps` before Stage19 specialization, the Stage19 specialization uses the proved physical scale, r5ar retains the modulus-entropy barrier, and r5as retains the double-Pell compression.\n''')

          ctrl_path = root/'stages/stage27/27-controller.json'
          ctrl = json.loads(ctrl_path.read_text())

          def find_container(obj, key):
              if isinstance(obj, dict):
                  if key in obj:
                      return obj
                  for v in obj.values():
                      hit = find_container(v, key)
                      if hit is not None:
                          return hit
              elif isinstance(obj, list):
                  for v in obj:
                      hit = find_container(v, key)
                      if hit is not None:
                          return hit
              return None

          routes = find_container(ctrl, 'Stage27-19-r5aq-r5as')
          assert routes is not None, 'r5aq-r5as controller entry not found'
          prev = routes['Stage27-19-r5aq-r5as']
          prev.update({
              'status': 'AUDITED_PASS_MERGED',
              'audit_status': 'PASS',
              'advance_allowed': True,
              'merge_allowed': True,
              'fresh_audit_required': False,
              'audit_record': 'stages/stage27/27-19-r5aq/audit-final.md',
              'pr': 1068,
              'merge_commit': 'fbae8c1bde526a82bbcfc11eed8f86ac5dda5351',
              'next_derived_route': '27-19-r5at'
          })
          routes['Stage27-19-r5at-r5av'] = {
              'status': 'BATCH_SUBMITTED_PENDING_FRESH_AUDIT',
              'trigger_checkpoint': 40,
              'route_kind': 'UPPER_REENTRY_PARALLEL',
              'source_stage': 'Stage19',
              'parent_route': 'Stage27-19-r5aq-r5as',
              'batch_routes': ['27-19-r5at','27-19-r5au','27-19-r5av'],
              'purpose': 'collapse kappa entropy at fixed physical diagonal and isolate the hyperbolic boundary after coefficient-cell summation',
              'result_paths': [
                  'stages/stage27/27-19-r5at/result.md',
                  'stages/stage27/27-19-r5au/result.md',
                  'stages/stage27/27-19-r5av/result.md'
              ],
              'route_contract': 'stages/stage27/27-19-r5at/route-contract.json',
              'fixed_R_kappa_entropy_collapse_proved': True,
              'fixed_seven_outer_plus_R_subpower_completion_proved': True,
              'fixed_R_dyadic_weighted_host_proved': True,
              'hyperbolic_boundary_accumulation_barrier_proved': True,
              'strict_sub_sqrt_upper_proved': False,
              'new_mu_lt_half_proved': False,
              'true_N2_exponent_identified': False,
              'audit_status': 'PENDING',
              'advance_to_checkpoint50': False,
              'advance_allowed': False,
              'merge_allowed': False,
              'fresh_audit_required': True,
              'next_derived_route': '27-19-r5aw',
              'next_target': 'BOUNDARY_FACTORIZATION_OR_FIXED_R_OUTER_SUPPORT_COUNT'
          }

          if 'checkpoint_status' in ctrl:
              ctrl['checkpoint_status']['40'] = 'UPPER_ATTACK_AUDITED_PASS_MERGED_WITH_R5AQ_R5AS_AUDITED_PASS_MERGED_AND_R5AT_R5AV_PENDING_AUDIT'
          state = ctrl['state']
          state.update({
              'CURRENT_CHECKPOINT': 40,
              'MAIN_STATUS': 'UPPER_REENTRY_STAGE27_19_R5AT_R5AV_SUBMITTED_PENDING_FRESH_AUDIT',
              'AUDIT_STATUS': 'PENDING',
              'ADVANCE_ALLOWED': False,
              'NEXT_CHECKPOINT': 40,
              'NEXT_STAGE': '',
              'NEW_INPUT_REQUIRED': False,
              'HUMAN_DECISION_REQUIRED': False,
              'MERGE_ALLOWED': False
          })
          ctrl['next_expected_command'] = 'Stage27-19-r5-audit'
          ctrl_path.write_text(json.dumps(ctrl, indent=2) + '\n')

          doc_path = root/'docs/00_CURRENT_RESEARCH_STATUS.md'
          text = doc_path.read_text()
          replacements = {
              'CURRENT_STAGE=Stage27-19-r5aq-r5as-BATCH-SUBMITTED-PENDING-FRESH-AUDIT': 'CURRENT_STAGE=Stage27-19-r5at-r5av-BATCH-SUBMITTED-PENDING-FRESH-AUDIT',
              'STAGE27_STATUS=OPEN_CHECKPOINT40_WITH_STAGE19_UPPER_REENTRY_R5AQ_R5AS_PENDING_FRESH_AUDIT': 'STAGE27_STATUS=OPEN_CHECKPOINT40_WITH_STAGE19_UPPER_REENTRY_R5AT_R5AV_PENDING_FRESH_AUDIT',
              'STAGE27_19_R5AQ_R5AS_STATUS=BATCH_SUBMITTED_PENDING_FRESH_AUDIT': 'STAGE27_19_R5AQ_R5AS_STATUS=AUDITED_PASS_MERGED_PR1068\nSTAGE27_19_R5AT_R5AV_STATUS=BATCH_SUBMITTED_PENDING_FRESH_AUDIT',
              'STAGE27_ACTIVE_UPPER_REENTRY=27-19-r5aq-r5as': 'STAGE27_ACTIVE_UPPER_REENTRY=27-19-r5at-r5av'
          }
          for a,b in replacements.items():
              assert a in text, f'missing status marker: {a}'
              text = text.replace(a,b,1)
          marker = 'STAGE27_R5AT_FIXED_R_KAPPA_ENTROPY_COLLAPSE_PROVED=true\nSTAGE27_R5AU_FIXED_R_DYADIC_WEIGHTED_HOST_PROVED=true\nSTAGE27_R5AV_HYPERBOLIC_BOUNDARY_PRIMARY_BARRIER=true\n'
          fence = 'STAGE27_R501_TAU_PROJECTION_DEGREE=8\n'
          assert fence in text
          text = text.replace(fence, marker+fence, 1)
          doc_path.write_text(text)
          PY
      - name: Commit synchronization and self-clean
        run: |
          git config user.name 'fizawa460-bit'
          git config user.email 'fizawa460@gmail.com'
          git add stages/stage27/27-19-r5aq/route-contract.json stages/stage27/27-19-r5aq/audit-final.md stages/stage27/27-controller.json docs/00_CURRENT_RESEARCH_STATUS.md
          git commit -m 'Stage27-19-r5at: close r5aq-r5as and activate fixed-R batch'
          git push origin HEAD:agent/stage27-19-r5at-kappa-ceiling
          git rm .github/workflows/tmp-stage27-19-r5at-sync.yml
          git commit -m 'Stage27-19-r5at: remove temporary sync workflow'
          git push origin HEAD:agent/stage27-19-r5at-kappa-ceiling
