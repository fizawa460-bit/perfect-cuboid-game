name: Temporary StructureRadar apply Stage16-25 census 02
on:
  push:
    branches: [structureradar/stage16-25-02]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply normalized decisions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          radar=Path('docs/structure-radar')
          report=json.loads((radar/'stage16-25-current-02-report.json').read_text())
          by_path={r['path']:r for r in report}
          progress=json.loads((radar/'progress.json').read_text())
          registry=json.loads((radar/'structure-registry.json').read_text())
          cards={c['structure_id']:c for c in registry['structures']}
          batch='SR-BATCH-STAGE16_25_CURRENT-02-R01'

          def prov(path, locator):
              r=by_path[path]
              return {'source_id':r['source_id'],'path':path,'locator':locator,'fingerprint':r['fingerprint']}
          def add_prov(cid,path,locator):
              p=prov(path,locator); arr=cards[cid]['repo_provenance']
              if not any(x.get('source_id')==p['source_id'] and x.get('locator')==p['locator'] for x in arr): arr.append(p)

          new_cards=[
            {
              'structure_id':'SR-STR-143',
              'canonical_math_name':'Exactly-two-face ambient asymptotic and cubic-host thinning law',
              'exact_equations_or_object':'For primitive canonical R<=B cuboids with exactly two integral face diagonals and no space-diagonal condition, M2(B)~C_M2 B(log B)^5 with C_M2>0; against U(B)=pi B^3/(36 zeta(3))+O(B^2), M2/U~[36 zeta(3) C_M2/pi](log B)^5/B^2.',
              'search_terms_primary':['exactly two integral faces cuboid asymptotic B log^5 B','Euler cuboid two-face ambient density'],
              'search_terms_aliases':['Stage18 M2 ambient law','exactly-two face cubic-host thinning'],
              'theorem_species':['asymptotic counting','population thinning','ambient density law'],
              'repo_provenance':[prov('stages/stage18/18-70/result.md','executive synthesis and ambient ratio'),prov('stages/stage18/final.md','audited closed Stage18 interface')],
              'target_populations':['primitive canonical exactly-two-face cuboids without space-diagonal integrality under R<=B'],
              'potential_weapon_types':['ASYMPTOTIC','POPULATION_BASELINE'],
              'applicability_gaps':['The law does not impose an integral space diagonal and does not by itself isolate the incremental second-face or third-face cost.'],
              'existing_radar_overlap':['SR-STR-005','SR-STR-008'],'search_status':'NOT_SEARCHED','arsenal_decision':'PENDING','card_status':'SUBMITTED_FOR_AUDIT'
            },
            {
              'structure_id':'SR-STR-144',
              'canonical_math_name':'Shared-edge double-Pythagorean normal form for the exactly-two-face host',
              'exact_equations_or_object':'Every Stage18 object has a unique shared edge s for its two successful faces and can be written s^2+x^2=p^2, s^2+y^2=q^2 with x^2+y^2 nonsquare. The two face conditions are coupled through s and are not independent random-square tests.',
              'search_terms_primary':['two Pythagorean faces sharing one leg Euler cuboid','double Pythagorean shared edge exactly two faces'],
              'search_terms_aliases':['Stage18 double-Pythagorean host','shared-edge two-face normal form'],
              'theorem_species':['normal form','Pythagorean parametrization','causal decomposition'],
              'repo_provenance':[prov('stages/stage18/18-60/result.md','exact arithmetic restriction and causal verdict'),prov('stages/stage18/final.md','audited closed Stage18 interface')],
              'target_populations':['primitive canonical exactly-two-face cuboids without space-diagonal integrality under R<=B'],
              'potential_weapon_types':['NORMAL_FORM','CAUSAL_DECOMPOSITION'],
              'applicability_gaps':['The normal form does not prove independence or assign separate leading costs to the two successful faces or to third-face exclusion.'],
              'existing_radar_overlap':['SR-STR-003','SR-STR-143'],'search_status':'NOT_SEARCHED','arsenal_decision':'PENDING','card_status':'SUBMITTED_FOR_AUDIT'
            },
            {
              'structure_id':'SR-STR-145',
              'canonical_math_name':'Paired Gaussian-norm squareclass parity sieve for Stage19 zero density',
              'exact_equations_or_object':'On the shared-edge toric chart A=N(mr+i ns), B=N(ms+i nr), R integral iff sf(A)=sf(B). For good split p=1 mod 4 the same-measure parity acceptance is rho_p=(p^4+4p^3+22p^2+4p+1)/((p+1)^2(p^2+6p+1)) with 1-rho_p=4/p+O(p^-2); the finite-prime product tends to zero and proves N2/M2->0. This local sieve is not the source of the separate half-power global upper bound.',
              'search_terms_primary':['Gaussian norm squareclass parity sieve split primes','valuation parity squareclass coincidence Euler cuboid'],
              'search_terms_aliases':['Stage19 local squareclass sieve','paired Gaussian-norm zero-density mechanism'],
              'theorem_species':['local sieve','squareclass coincidence','zero-density mechanism'],
              'repo_provenance':[prov('stages/stage19/19-60/result.md','exact new restriction and certified causal zero-density mechanism'),prov('stages/stage19/19-70/result.md','causal synthesis and no-double-charge boundary')],
              'target_populations':['Stage18 exactly-two-face host intersected with integral space diagonal under R<=B'],
              'potential_weapon_types':['LOCAL_SIEVE','ZERO_DENSITY','NORMAL_FORM'],
              'applicability_gaps':['The local product has logarithmic profile and does not pay the certified B^(1/2+epsilon) whole-family ceiling; multiplying these savings would double charge.'],
              'existing_radar_overlap':['SR-STR-008','SR-STR-079','SR-STR-091'],'search_status':'NOT_SEARCHED','arsenal_decision':'PENDING','card_status':'SUBMITTED_FOR_AUDIT'
            },
            {
              'structure_id':'SR-STR-146',
              'canonical_math_name':'Certified Euler-cuboid global envelope with unresolved true exponent',
              'exact_equations_or_object':'For the primitive canonical Stage20 Euler population under R<=B, the current certified envelope is B^(1/6)<<M3(B)<<_eta B(log B)^(5-eta) for every fixed eta<1/46; in particular eta=1/50 is frozen. The population is infinite, but no asymptotic or true exponent is identified.',
              'search_terms_primary':['Euler cuboid global upper lower bound exponent','primitive Euler brick count B log power upper B one sixth lower'],
              'search_terms_aliases':['Stage20 global envelope','Euler population open exponent'],
              'theorem_species':['upper bound','constructive lower bound','open exponent bracket'],
              'repo_provenance':[prov('stages/stage20/20-70/result.md','KNOWN_RESULTS and certified envelope'),prov('stages/stage20/20-50/result.md','Saunderson constructive lower ledger')],
              'target_populations':['primitive canonical Euler cuboids with three integral face diagonals, no space-diagonal condition, R<=B'],
              'potential_weapon_types':['UPPER_BOUND','LOWER_BOUND','POPULATION_BASELINE'],
              'applicability_gaps':['The finite near-sqrt(B) signal is diagnostic only; the bracket does not identify the true exponent or an asymptotic constant.'],
              'existing_radar_overlap':['SR-STR-003','SR-STR-077'],'search_status':'NOT_SEARCHED','arsenal_decision':'PENDING','card_status':'SUBMITTED_FOR_AUDIT'
            },
            {
              'structure_id':'SR-STR-147',
              'canonical_math_name':'Euler third-face local blocker law and sieve-dimension-two rarity mechanism',
              'exact_equations_or_object':'For third-face completion on the two-face host, delta_2=2/9 and for odd p, delta_p=2(p-chi_4(p))/(p^2+6p+1)=2/p+O(p^-2). Every Euler brick avoids all blockers; fixed finite prime sets have product survival and give a local zero-density mechanism, but the sieve does not determine the true global M3 exponent.',
              'search_terms_primary':['Euler brick local obstruction density 2 over p','third face completion local blocker sieve'],
              'search_terms_aliases':['Stage20 local blocker law','Euler third-face sieve dimension two'],
              'theorem_species':['local obstruction','sieve','causal rarity mechanism'],
              'repo_provenance':[prov('stages/stage20/20-60/result.md','local obstruction mechanism'),prov('stages/stage20/20-70/result.md','local obstruction law and no-double-charge synthesis')],
              'target_populations':['third-face completion inside the primitive canonical exactly-two-face host'],
              'potential_weapon_types':['LOCAL_SIEVE','LOCAL_OBSTRUCTION','ZERO_DENSITY'],
              'applicability_gaps':['The blocker product is not an independent random-square probability and must not be multiplied with the K3 thin-cover or global divisor-envelope savings.'],
              'existing_radar_overlap':['SR-STR-003','SR-STR-146'],'search_status':'NOT_SEARCHED','arsenal_decision':'PENDING','card_status':'SUBMITTED_FOR_AUDIT'
            }
          ]
          for c in new_cards:
              if c['structure_id'] not in cards:
                  registry['structures'].append(c); cards[c['structure_id']]=c

          # Direct current-stage provenance on existing normalized cards.
          add_prov('SR-STR-004','stages/stage17/final.md','audited Stage17 self-contained transition interface')
          add_prov('SR-STR-008','stages/stage19/post-stage25-50-supersession.md','current Stage19 quarter-power lower and half-power upper interface')
          add_prov('SR-STR-003','stages/stage20/20-60/result.md','K3 structured third-face causal layer')
          add_prov('SR-STR-077','stages/stage20/20-50/result.md','primitive Saunderson B^(1/6) construction ledger')

          # Explicit per-source review decisions. Only canonical mathematical carriers are STRUCTURES_RECORDED;
          # checkpoint repetition, audits, controllers, manifests and finite-only ledgers are duplicate evidence.
          canonical={
            'stages/stage17/final.md':['SR-STR-004'],
            'stages/stage18/18-60/result.md':['SR-STR-143','SR-STR-144'],
            'stages/stage18/18-70/result.md':['SR-STR-143','SR-STR-144'],
            'stages/stage18/final.md':['SR-STR-143','SR-STR-144'],
            'stages/stage19/19-60/result.md':['SR-STR-145'],
            'stages/stage19/19-70/result.md':['SR-STR-008','SR-STR-145'],
            'stages/stage19/post-stage25-50-supersession.md':['SR-STR-008'],
            'stages/stage20/20-50/result.md':['SR-STR-077','SR-STR-146'],
            'stages/stage20/20-60/result.md':['SR-STR-003','SR-STR-146','SR-STR-147'],
            'stages/stage20/20-70/result.md':['SR-STR-003','SR-STR-077','SR-STR-146','SR-STR-147'],
            'stages/stage20/final.md':['SR-STR-146','SR-STR-147'],
          }
          # Ensure every canonical mapping has matching provenance on every referenced card.
          for path,ids in canonical.items():
              for cid in ids:
                  add_prov(cid,path,'normalized Stage16-25 current census carrier')

          reviews=progress.setdefault('source_reviews',{})
          n_struct=0; n_dup=0
          for r in report:
              ids=canonical.get(r['path'])
              if ids:
                  reviews[r['source_id']]={'fingerprint':r['fingerprint'],'status':'STRUCTURES_RECORDED','batch_id':batch,'structure_ids':ids}; n_struct+=1
              else:
                  reviews[r['source_id']]={'fingerprint':r['fingerprint'],'status':'DUPLICATE_SOURCE','batch_id':batch}; n_dup+=1
          assert n_struct+n_dup==60

          registry['status']='BATCH_SUBMITTED_FOR_AUDIT'
          batches=progress.setdefault('audit_batches',[]); batches[:]=[b for b in batches if b.get('batch_id')!=batch]
          batches.append({'batch_id':batch,'task_id':'SR-CENSUS-STAGE16_25_CURRENT-01','status':'SUBMITTED_FOR_AUDIT','source_ids':[r['source_id'] for r in report],'sources_reviewed':60,'structures_added':5,'structures_updated':4,'structures_deduped':n_dup,'structure_carrier_sources':n_struct,'searches_completed':0,'arsenal_decisions':0,'audit_required':True})
          (radar/'progress.json').write_text(json.dumps(progress,indent=2,ensure_ascii=False)+'\n')
          (radar/'structure-registry.json').write_text(json.dumps(registry,indent=2,ensure_ascii=False)+'\n')
          for name in ['stage16-25-current-02-report.json','stage16-25-current-02-compact.json','stage16-25-current-02-tail.json']:
              p=radar/name
              if p.exists(): p.unlink()
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
      - name: Commit batch and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-structureradar-apply-stage16-25-02.yml
          git add docs/structure-radar
          git diff --check --cached
          git commit -m 'StructureRadar: census Stage16-25 current batch 02'
          git push
