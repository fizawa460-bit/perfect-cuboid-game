name: Stage14-sH44 dual root-line energy audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-sH44/**'
      - 'stages/stage14/scripts/14-sH44/**'
      - '.github/workflows/stage14-sH44-dual-root-line-energy.yml'
      - 'stages/stage14/14-s7-44/**'
      - 'stages/stage14/14-s7-43/**'
      - 'stages/stage14/14-4db/**'
      - 'stages/stage14/14-X13/**'
      - 'stages/stage14/14-4cr/**'
      - 'stages/stage14/14-4cn/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage14-sH44 deterministic H audit
        run: python stages/stage14/scripts/14-sH44/dual_root_line_energy_h_audit.py

      - name: Compile Stage14-sH44 audit
        run: python -m py_compile stages/stage14/scripts/14-sH44/dual_root_line_energy_h_audit.py

      - name: Merged s7-44 regression
        run: python stages/stage14/scripts/14-s7-44/dual_root_line_no_go_audit.py

      - name: Merged s7-43 regression
        run: python stages/stage14/scripts/14-s7-43/common_core_square_compression_audit.py

      - name: Merged 4db regression
        run: python stages/stage14/scripts/14-4/cross_root_first_sqrt_audit.py

      - name: Merged X13 regression
        run: python stages/stage14/scripts/14-X13/reverse_reciprocal_sqrt_audit.py

      - name: Lock reciprocal Edwards and Cayley predecessors
        run: |
          grep -Fq 'RECIPROCAL_EDWARDS_SINGULAR_VALUES={0,4,-4}' stages/stage14/14-4cn/result.md
          grep -Fq 'CAYLEY_GOOD_CORE_UNIT_ON_MN=true' stages/stage14/14-4cr/result.md || grep -Fq 'gcd(C_Cayley,M*N)=1' stages/stage14/14-4cr/result.md
          grep -Fq 'C_- | M-N' stages/stage14/14-4cr/result.md
          grep -Fq 'C_+ | M+N' stages/stage14/14-4cr/result.md

      - name: Lock s7-44 H request
        run: |
          f=stages/stage14/14-s7-44/result.md
          grep -Fq 'S7_44_AUXILIARY_H_NEEDED=true' "$f"
          grep -Fq 'DUAL_ROOT_LINE_TRIVIAL_COMPLETE_COUNT=1/2' "$f"
          grep -Fq 'REMAINING_RECEIVER=SquareRootThetaQuarterGloballyOddPrimitiveFullCoreDualRootLineCompatibilityEnergy' "$f"

      - name: Lock Stage14-sH44 verdict
        run: |
          f=stages/stage14/14-sH44/result.md
          grep -Fq 'STAGE14_SH44=COMPLETE' "$f"
          grep -Fq 'FIXED_POWER_SAVING_PROVED=false' "$f"
          grep -Fq 'CERTIFIED_DUAL_ROOT_LINE_DELTA=0' "$f"
          grep -Fq 'FULL_COMMON_CORE_DIVIDES_CLEARED_LAMBDA2_MINUS_16=true' "$f"
          grep -Fq 'FULL_COMMON_CORE_IS_RECIPROCAL_EDWARDS_BAD_REDUCTION_SUPPORT=true' "$f"
          grep -Fq 'DUAL_ROOT_LINE_PRINCIPAL_DENSITY_EXPONENT=1/2' "$f"
          grep -Fq 'ROOT_DISTRIBUTION_LARGE_SIEVE_ALONE_CAN_SAVE=false' "$f"
          grep -Fq 'FIXED_MODULUS_COMPLETE_KLOOSTERMAN_ADAPTER_PROVED=false' "$f"
          grep -Fq 'TH23_CROSS_PROMOTED_TO_SH44=false' "$f"
          grep -Fq 'S_ROUTE_BLOCKED_WAITING_FOR_H=false' "$f"
          grep -Fq 'S7_45_CAN_CONSUME_SH44=true' "$f"
          grep -Fq 'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=1/2' "$f"
          grep -Fq 'STRICT_SUBSQRT_POWER_SAVING_PROVED=false' "$f"
          grep -Fq 'NEXT=Stage14-s7-45' "$f"
