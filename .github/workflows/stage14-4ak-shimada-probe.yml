name: Stage14-4ak Shimada lattice enumeration

on:
  pull_request:
    paths:
      - '.github/workflows/stage14-4ak-shimada-probe.yml'
      - 'stages/stage14/scripts/14-4/**'
      - 'stages/stage14/data/14-4/**'
      - 'stages/stage14/archive/stage14-4ak-*'
  workflow_dispatch:

jobs:
  enumerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install exact lattice enumerator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pari-gp
      - name: Download official Shimada level-4 data
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            'https://home.hiroshima-u.ac.jp/ichiro-shimada/preprints/X0X3/PreprintX0X3/compdata/compdata.zip' \
            -o /tmp/shimada.zip
          unzip -q /tmp/shimada.zip -d /tmp/shimada
      - name: Identify intrinsic candidates
        run: python stages/stage14/scripts/14-4/shimada_stage14_identify.py /tmp/shimada --out /tmp/identify.json > /tmp/identify.log
      - name: Refine by coordinate swap
        run: python stages/stage14/scripts/14-4/shimada_stage14_refine.py /tmp/shimada /tmp/identify.json --out /tmp/refine.json
      - name: Prove surviving labelings equivalent under AutX0f
        run: python stages/stage14/scripts/14-4/shimada_stage14_equiv.py /tmp/shimada /tmp/refine.json --out /tmp/equiv.json
      - name: Enumerate split roots with PARI Fincke-Pohst
        run: python stages/stage14/scripts/14-4/shimada_stage14_roots.py /tmp/shimada /tmp/refine.json /tmp/equiv.json --out /tmp/roots.json
      - name: Independently enumerate by exact Python LDL recursion
        run: python stages/stage14/scripts/14-4/shimada_stage14_verify.py /tmp/shimada /tmp/refine.json --out /tmp/verify.json
      - name: Cross-check independent enumerators
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/roots.json')); v=json.load(open('/tmp/verify.json'))
          assert r['anti_invariant_rank']==v['anti_rank']==6
          assert 2*r['norm16_pair_representatives']==v['exact_norm16_vectors']
          assert r['parity_compatible_split_root_pairs']==v['parity_compatible_split_root_pairs']
          print('STAGE14_4AK_ENUMERATOR_CROSSCHECK=PASS')
          print('NORM16_VECTORS=',v['exact_norm16_vectors'])
          print('PARITY_COMPATIBLE_SPLIT_ROOT_PAIRS=',r['parity_compatible_split_root_pairs'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage14-4ak-enumeration
          path: |
            /tmp/identify.json
            /tmp/refine.json
            /tmp/equiv.json
            /tmp/roots.json
            /tmp/verify.json
