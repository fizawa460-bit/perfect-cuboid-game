name: Stage14-4ak Shimada data probe

on:
  pull_request:
    paths:
      - '.github/workflows/stage14-4ak-shimada-probe.yml'
      - 'stages/stage14/scripts/14-4/**'
      - 'stages/stage14/data/14-4/**'
      - 'stages/stage14/archive/stage14-4ak-*'
  workflow_dispatch:

jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Shimada level-4 data
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            'https://home.hiroshima-u.ac.jp/ichiro-shimada/preprints/X0X3/PreprintX0X3/compdata/compdata.zip' \
            -o /tmp/shimada.zip
          unzip -q /tmp/shimada.zip -d /tmp/shimada
      - name: Identify Stage14 classes in Shimada basis
        run: |
          python stages/stage14/scripts/14-4/shimada_stage14_identify.py \
            /tmp/shimada \
            --out /tmp/stage14-4ak-identify.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage14-4ak-identify
          path: /tmp/stage14-4ak-identify.json
