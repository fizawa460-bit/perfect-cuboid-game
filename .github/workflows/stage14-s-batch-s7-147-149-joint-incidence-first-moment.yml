name: Stage14-s-batch s7-147..149 joint incidence first moment

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-147/**'
      - 'stages/stage14/14-s7-148/**'
      - 'stages/stage14/14-s7-149/**'
      - 'stages/stage14/14-s-batch/s7-147-149-report.md'
      - 'stages/stage14/scripts/14-s-batch/s7_147_149_joint_incidence_first_moment_audit.py'
      - '.github/workflows/stage14-s-batch-s7-147-149-joint-incidence-first-moment.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Batch deterministic audit
        run: python stages/stage14/scripts/14-s-batch/s7_147_149_joint_incidence_first_moment_audit.py
      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/14-s-batch/s7_147_149_joint_incidence_first_moment_audit.py
      - name: Regress merged s7-144..146
        run: grep -q 'Q22_THEOREM_TARGET_NOW_STABLE=true' stages/stage14/14-s7-146/result.md
      - name: Lock Work-cjX48 q22 boundary
        run: |
          grep -q 'STAGE14_Q22=COMPLETE_GOOD_PACKET_INDICATOR_FIRST_MOMENT_LITERATURE_RADAR' stages/stage14/14-q22/summary.md
          grep -q 'Q22_GOOD_INDICATOR_EXACT_WITNESS_EXPANSION_TEST=Stage14-s7-147' stages/stage14/14-q22/summary.md
      - name: Lock batch boundary
        run: |
          grep -q 'Q22_POSITIVE_FIRST_MOMENT_NORMAL_FORM_TEST=PASS_JOINT_NONNEGATIVE_DIVISOR_CRT_INCIDENCE' stages/stage14/14-s7-148/result.md
          grep -q 'Q23_THEOREM_TARGET_NOW_STABLE=true' stages/stage14/14-s7-149/result.md
          grep -q 'NEXT=Stage14-s7-150' stages/stage14/14-s-batch/s7-147-149-report.md
      - name: Diff check
        run: git diff --check origin/${{ github.base_ref }}...HEAD
