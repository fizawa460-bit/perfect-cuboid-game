name: Temporary StructureRadar compact Stage16-25 census 02
on:
  push:
    branches: [structureradar/stage16-25-02]
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build compact report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/structure-radar/stage16-25-current-02-report.json')
          rows=json.loads(p.read_text())
          out=[]
          for r in rows:
              out.append({'source_id':r['source_id'],'path':r['path'],'kind':r['kind'],'stage':r['stage'],'excerpt':r.get('excerpt','')[:420]})
          Path('docs/structure-radar/stage16-25-current-02-compact.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Commit compact report and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-structureradar-compact-02.yml
          git add docs/structure-radar/stage16-25-current-02-compact.json
          git commit -m 'StructureRadar: compact Stage16-25 census 02 report'
          git push
