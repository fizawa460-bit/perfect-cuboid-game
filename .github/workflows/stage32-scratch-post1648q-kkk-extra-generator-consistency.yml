name: Stage32 scratch post1648Q KKK extra-generator consistency

on:
  push:
    branches:
      - stage32-scratch-post1648n-marked-ppav-basis
    paths:
      - '.github/workflows/stage32-scratch-post1648q-kkk-extra-generator-consistency.yml'
      - 'stages/stage32/residual-32-01-production/post1648q-kkk-extra-generator-source-consistency-guard.json'
      - 'stages/stage32/residual-32-01-production/verify_stage32_post1648q_kkk_extra_generator_source_consistency_guard.py'
      - 'stages/stage32/residual-32-01-production/post1648q-kkk-extra-generator-source-consistency-guard-source-note.md'
      - 'stages/stage32/residual-32-01-production/post1648n-canonical-period-marked-ppav-torsor-obstruction.json'
      - 'stages/stage32/residual-32-01-production/post1648p-b9-fixed-weierstrass-pair-nonpruning.json'

permissions:
  contents: read

jobs:
  kkk-extra-generator-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify KKK extra-generator source consistency guard
        run: python3 -B stages/stage32/residual-32-01-production/verify_stage32_post1648q_kkk_extra_generator_source_consistency_guard.py
      - name: Diff check
        run: git diff --check
