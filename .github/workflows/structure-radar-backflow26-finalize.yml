name: StructureRadar backflow26 finalize
on: pull_request
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'structure-radar-backflow-26-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate Stage26 arsenal promotion into central router
        run: |
          python - <<'PY'
          import hashlib, json, pathlib

          batch='SR-BATCH-ARSENAL_BACKFLOW-26-R01'
          task='SR-REGISTRY-BACKFLOW-01'
          source='docs/stage26-arsenal-promotion.md'

          jp=pathlib.Path('docs/research-arsenal-index.json')
          text=jp.read_text()
          assert '"scope": "merged reusable weapons through Stage25 reentry"' in text
          assert '"id":"S26-W01"' not in text
          text=text.replace('"scope": "merged reusable weapons through Stage25 reentry"', '"scope": "merged reusable weapons through Stage26 promotion"')
          text=text.replace('{"id":"S20-W01","status":"ACTIVE","type":"BOUND","source":"docs/stage20-arsenal.md","output":"M3(B)<<_eta B(log B)^(5-eta), eta<1/46"}', '{"id":"S20-W01","status":"SUPERSEDED","type":"BOUND","source":"docs/stage20-arsenal.md","output":"M3(B)<<_eta B(log B)^(5-eta), eta<1/46"}')
          text=text.replace('{"id":"S20-W02","status":"ACTIVE","type":"CONSTRUCTION","source":"docs/stage20-arsenal.md","output":"M3(B)>>B^(1/6)"}', '{"id":"S20-W02","status":"SUPERSEDED","type":"CONSTRUCTION","source":"docs/stage20-arsenal.md","output":"M3(B)>>B^(1/6)"}')
          anchor='    {"id":"S25-W06","status":"ACTIVE","type":"LEDGER","source":"docs/stage25-arsenal-promotion.md","output":"Manin transitions (2,2)->(1,4)->(1,6)"}\n  ],'
          insert='    {"id":"S25-W06","status":"ACTIVE","type":"LEDGER","source":"docs/stage25-arsenal-promotion.md","output":"Manin transitions (2,2)->(1,4)->(1,6)"},\n    {"id":"S26-W01","status":"ACTIVE","type":"BOUND","source":"docs/stage26-arsenal-promotion.md","output":"M3(B)>>_epsilon B^(1/3-epsilon) for every epsilon>0"},\n    {"id":"S26-W02","status":"ACTIVE","type":"ADAPTER","source":"docs/stage26-arsenal-promotion.md","output":"Phi,Theta->0; Theta/Phi->3 with explicit lower/upper completion corridor"},\n    {"id":"S26-W03","status":"ACTIVE","type":"BOUND_INTERFACE","source":"docs/stage26-arsenal-promotion.md","output":"M3(B)<<_eta B(log B)^(5-eta), eta<1/46 with nonmultiplicative K3/local-sieve/thin-cover interface"}\n  ],'
          assert anchor in text
          text=text.replace(anchor, insert)
          sup='    {"old":"Stage23 target-unboundedness and positive-power-lower false markers","new":"S25-W01"}\n  ],'
          sup2='    {"old":"Stage23 target-unboundedness and positive-power-lower false markers","new":"S25-W01"},\n    {"old":"S20-W02 primitive Saunderson lower B^(1/6)","new":"S26-W01 generalized two-parameter lower B^(1/3-epsilon)"},\n    {"old":"S20-W01 Euler upper package","new":"S26-W03 same upper with audited K3/local-sieve/thin-cover interface"}\n  ],'
          assert sup in text
          text=text.replace(sup, sup2)
          jp.write_text(text)

          mp=pathlib.Path('docs/research-arsenal-index.md')
          md=mp.read_text()
          assert 'SCOPE=merged reusable weapons through Stage25 reentry' in md
          md=md.replace('SCOPE=merged reusable weapons through Stage25 reentry','SCOPE=merged reusable weapons through Stage26 promotion')
          md=md.replace('| S20-W01 | BOUND | Euler upper `M_3(B) <<_eta B(log B)^(5-eta)` | `stage20-arsenal.md` |','| S26-W01 | BOUND | generalized Saunderson `M_3(B) >>_epsilon B^(1/3-epsilon)` | `stage26-arsenal-promotion.md` |')
          md=md.replace('| S20-W02 | CONSTRUCTION | primitive Saunderson `M_3(B) >> B^(1/6)` | `stage20-arsenal.md` |','| S26-W03 | BOUND_INTERFACE | Euler upper `M_3(B) <<_eta B(log B)^(5-eta)` with audited nonmultiplicative K3/sieve interface | `stage26-arsenal-promotion.md` |')
          row='| S25-W06 | LEDGER | Manin `(a,b)` transitions `(2,2)->(1,4)->(1,6)` | `stage25-arsenal-promotion.md` |\n'
          assert row in md
          md=md.replace(row, row+'| S26-W02 | ADAPTER | literal completion corridor: `Phi,Theta->0`, `Theta/Phi->3`, with explicit lower/upper rate window | `stage26-arsenal-promotion.md` |\n')
          sup_row='| Stage14 s7-13 whole-family exponent `7/8` | AR-006 half-power upper |\n'
          assert sup_row in md
          md=md.replace(sup_row, '| S20-W02 primitive Saunderson `B^(1/6)` lower | S26-W01 generalized two-parameter `B^(1/3-epsilon)` lower |\n| S20-W01 Euler upper package | S26-W03 same upper with audited K3/local-sieve/thin-cover interface |\n'+sup_row)
          mp.write_text(md)

          ledger=pathlib.Path('docs/structure-radar/arsenal/SR-BACKFLOW-26.md')
          ledger.write_text('''# StructureRadar Arsenal backflow — Stage26 promotion\n\nBATCH_ID=SR-BATCH-ARSENAL_BACKFLOW-26-R01\nTASK_ID=SR-REGISTRY-BACKFLOW-01\nSOURCE=docs/stage26-arsenal-promotion.md\nBACKFLOW_GAP_BEFORE=docs/stage26-arsenal-promotion.md\nCENTRAL_WEAPONS_ADDED=S26-W01,S26-W02,S26-W03\nNEW_STRUCTURE_CARDS=0\nNOVELTY_BY_SEARCH_ABSENCE=false\nCURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=1/2\nSTRICT_SUBSQRT_POWER_SAVING_PROVED=false\nAUDIT_REQUIRED=true\nNEXT_EXPECTED_COMMAND=StructureRadar-audit\n\n## Integration\n\n- `S26-W01` is the current central lower weapon for the primitive canonical Euler-cuboid population `M3`, with the exact epsilon-dependent statement `M3(B) >>_epsilon B^(1/3-epsilon)` and no epsilon-free exponent or asymptotic claim. It supersedes the weaker Stage20 `B^(1/6)` lower selector.\n- `S26-W02` records the literal exactly-two/exactly-three completion corridor on the two distinct hosts `H_{>=2}=M2+M3` and `P=M2+3M3`, including `Phi,Theta->0`, `Theta/Phi->3`, and the recorded fixed-delta/fixed-epsilon rate corridor. It is not an objectwise survival probability or independence statement.\n- `S26-W03` is the current central upper interface for `M3(B) <<_eta B(log B)^(5-eta)`, `0<eta<1/46`, preserving the Stage26 rule that local-sieve and thin-cover savings are alternatives and are not multiplied. It supersedes the older Stage20 upper package as the preferred router entry without strengthening the polynomial exponent.\n\nThe Stage26 promotion source had already been source-censused and mapped into existing normalized StructureRadar cards (`SR-STR-002,003,009,010,017,146`), so this backflow repair creates no duplicate structure card and changes no card search/Arsenal decision. Its purpose is to make the project-wide central Arsenal router current with the already-reviewed Stage26 promotion package.\n\n## Firewalls\n\n- `TRUE_M3_EXPONENT_IDENTIFIED=false`.\n- `M3_ASYMPTOTIC_PROVED=false`.\n- `UPPER_LOWER_MATCH=false`.\n- The lower and upper bounds live on the primitive canonical Euler-cuboid population with no space-diagonal requirement; they are not transferred to `N2` or perfect-cuboid existence.\n- Exactly-two and exactly-three strata are disjoint; `Phi` and `Theta` are host ratios, not independent probabilities.\n- No perfect-cuboid existence or nonexistence conclusion is introduced.\n''')

          pp=pathlib.Path('docs/structure-radar/progress.json')
          p=json.loads(pp.read_text())
          reviews=p['source_reviews']
          for sid,path in [('SRC-1ADC07F7AFDD',jp),('SRC-DBF5BAD7EDED',mp)]:
              reviews[sid]={
                  'fingerprint': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'status':'DUPLICATE_SOURCE',
                  'batch_id':batch,
              }
          assert not any(x.get('batch_id')==batch for x in p['audit_batches'])
          p['audit_batches'].append({
              'batch_id':batch,
              'task_id':task,
              'status':'SUBMITTED_FOR_AUDIT',
              'source_ids':['SRC-1ADC07F7AFDD','SRC-DBF5BAD7EDED'],
              'sources_reviewed':2,
              'structures_added':0,
              'structures_updated':0,
              'structure_carrier_sources':0,
              'structures_deduped':0,
              'searches_completed':0,
              'arsenal_decisions':0,
              'audit_required':True,
              'duplicate_source':2,
              'no_distinct_structure':0,
          })
          pp.write_text(json.dumps(p,indent=2,ensure_ascii=False)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python - <<'PY'
          import json
          c=json.load(open('docs/structure-radar/controller.json'))
          assert c['corpus']['arsenal_backflow_gaps']==[], c['corpus']['arsenal_backflow_gaps']
          assert c['registry']['unresolved_search_count']==0
          assert c['registry']['pending_arsenal_decision_count']==0
          assert c['queue']['task_count']==0
          assert c['close_conditions']['all_current_sources_reviewed'] is True
          assert c['close_conditions']['all_searches_resolved'] is True
          assert c['close_conditions']['all_arsenal_decisions_resolved'] is True
          assert c['close_conditions']['all_card_provenance_current'] is True
          assert c['close_conditions']['arsenal_backflow_clear'] is True
          assert c['status']=='AUDIT_REQUIRED', c['status']
          assert c['next_expected_command']=='StructureRadar-audit', c['next_expected_command']
          a=json.load(open('docs/research-arsenal-index.json'))
          ids={w['id']:w for w in a['weapons']}
          for wid in ['S26-W01','S26-W02','S26-W03']:
              assert ids[wid]['source']=='docs/stage26-arsenal-promotion.md'
          assert ids['S20-W01']['status']=='SUPERSEDED'
          assert ids['S20-W02']['status']=='SUPERSEDED'
          print('STATUS',c['status'])
          print('NEXT',c['next_expected_command'])
          print('BACKFLOW',c['corpus']['arsenal_backflow_gaps'])
          PY
          rm .github/workflows/structure-radar-backflow26-finalize.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'StructureRadar: integrate Stage26 arsenal backflow'
          git push
