name: Stage15-6 cycle bp-bs
on: [pull_request, workflow_dispatch]
jobs:
  verify-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python stages/stage15/replay/verify_stage15_6bp.py
      - run: python stages/stage15/replay/verify_stage15_6bq.py
      - run: python stages/stage15/replay/verify_stage15_6br.py
      - run: python stages/stage15/replay/verify_stage15_6bs.py
      - run: python -m py_compile stages/stage15/scripts/stage15_6bp_huang_window.py stages/stage15/scripts/stage15_6bq_huang_level.py stages/stage15/scripts/stage15_6br_geometric_sieve.py stages/stage15/scripts/stage15_6bs_multiplicative_sieve_gate.py
