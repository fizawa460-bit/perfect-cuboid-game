name: Stage32 32-01-178 Smith marking closure

on:
  push:
    branches:
      - stage32-01-178-smith
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact evidence-locator authority commit
        run: |
          git fetch --no-tags --depth=1 origin 66147254a7893b38a57a07d75576ac72dc178a37
          git cat-file -e 66147254a7893b38a57a07d75576ac72dc178a37^{commit}
      - name: Install exact linear algebra dependency
        run: |
          python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Recompute pair-mass image
        run: |
          set -o pipefail
          python stages/stage32/32-01-178-smith/verify_smith_pair_mass_image_classifier.py | tee /tmp/smith-pair-image.json
      - name: Close current numerical X8 marking gate
        run: |
          set -o pipefail
          python stages/stage32/32-01-178-smith/verify_smith_current_marking_closure.py /tmp/smith-pair-image.json | tee /tmp/smith-marking.json
      - name: Replay current factor-degree parity reduction
        run: |
          set -o pipefail
          python stages/stage32/32-01-178-smith/verify_smith_current_factor_parity_reduction.py | tee /tmp/smith-factor-parity.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/smith-factor-parity.json'))
          a=x['current_observable_algebra']
          assert a['residual_pair_mass_rank_before_factor_parity'] == 2
          assert a['f1_parity_already_determined_by_current_prefix'] is False
          assert a['f2_parity_already_determined_by_current_prefix'] is False
          assert a['residual_pair_mass_rank_after_factor_parity'] == 1
          assert a['minimal_additional_true_pair_group_sums_after_factor_parity'] == 1
          PY
      - name: Certify label104 exposure after factor parity
        run: |
          set -o pipefail
          python stages/stage32/32-01-178-smith/verify_smith_label104_after_factor_parity.py /tmp/smith-factor-parity.json | tee /tmp/smith-label104.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/smith-label104.json'))['exact_result']
          assert x['minimum_additional_individual_exceptional_pairings_after_factor_parity'] == 1
          assert x['additional_individual_exceptional_labels_needed_after_factor_parity'] == [104]
          assert x['full_pair_mass_signature_determined_after_factor_parity_and_label104'] is True
          PY
      - name: Classify residual signature fibres after factor parity
        run: |
          set -o pipefail
          cd stages/stage32/32-01-178-smith
          python verify_smith_factor_parity_residual_signature_fibres.py | tee /tmp/smith-residual-fibres.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/smith-residual-fibres.json'))
          e=x['exact']
          assert e['pair_signature_image_rank'] == 3
          assert e['pair_signature_count'] == 8
          assert e['residual_rank_after_current_plus_factor_parity'] == 1
          assert e['residual_fibre_count'] == 4
          assert sum(e['fibre_forbidden_member_count_distribution'].values()) == 4
          assert x['hurwitz_equality']['equality_strata_count'] == 178
          PY
      - name: Compact ledger
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/smith-marking.json'))
          r=x['exact_result']
          g=x['remaining_semantic_gate']
          f=json.load(open('/tmp/smith-factor-parity.json'))
          a=f['current_observable_algebra']
          l=json.load(open('/tmp/smith-label104.json'))
          q=json.load(open('/tmp/smith-residual-fibres.json'))
          e=q['exact']
          print('canonical='+x['canonical_sha256_without_this_field'])
          print('incidence_components='+str(r['incidence_components']))
          print('component_type='+r['component_type'])
          print('weierstrass_pairs='+str(r['canonical_unordered_weierstrass_pairs']))
          print('single_transpositions='+str(r['pair_mass_single_transpositions']))
          print('single_transpositions_equal_marked_cusp_pairs='+str(r['single_transpositions_equal_marked_cusp_pairs']))
          print('CURRENT_NUMERICAL_MARKING_GATE_CLOSED='+str(r['current_numerical_marking_gate_closed']))
          print('CURRENT_CARRIER_COMMON_COVER_ASSEMBLY_LIFT='+str(g['current_carrier_common_cover_h_equivariant_assembly_lift']))
          print('factor_parity_canonical='+f['canonical_sha256_without_this_field'])
          print('PAIR_RESIDUAL_BEFORE_FACTOR_PARITY='+str(a['residual_pair_mass_rank_before_factor_parity']))
          print('F1_PARITY_ALREADY_DETERMINED='+str(a['f1_parity_already_determined_by_current_prefix']))
          print('PAIR_RESIDUAL_AFTER_FACTOR_PARITY='+str(a['residual_pair_mass_rank_after_factor_parity']))
          print('MIN_EXTRA_PAIR_GROUPS_AFTER_FACTOR_PARITY='+str(a['minimal_additional_true_pair_group_sums_after_factor_parity']))
          print('LABEL104_EXPOSURE_CANONICAL='+l['canonical_sha256_without_this_field'])
          print('MIN_EXTRA_INDIVIDUALS_AFTER_FACTOR_PARITY='+str(l['exact_result']['minimum_additional_individual_exceptional_pairings_after_factor_parity']))
          print('ONE_MINIMAL_INDIVIDUAL_EXTENSION='+str(l['exact_result']['additional_individual_exceptional_labels_needed_after_factor_parity']))
          print('RESIDUAL_FIBRES_CANONICAL='+q['canonical_sha256_without_this_field'])
          print('RESIDUAL_FIBRE_DISTRIBUTION='+str(e['fibre_forbidden_member_count_distribution']))
          print('ALL_FORBIDDEN_FIBRES='+str(e['all_forbidden_fibre_count']))
          print('MIXED_FIBRES='+str(e['mixed_fibre_count']))
          print('ALL_ALLOWED_FIBRES='+str(e['all_allowed_fibre_count']))
          print('MAIN_PRUNING_CREDIT='+str(x['credit']['main_pruning_credit']))
          PY
