name: StructureRadar batch21 one-line review table

on:
  push:
    branches:
      - structure-radar-deep-corpus-batch-21

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build one-line table
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.')
          cand=json.loads((root/'docs/structure-radar/.batch21-candidates.json').read_text())
          bound=json.loads((root/'docs/structure-radar/.batch21-boundary-pack.json').read_text())
          bm={x['source_id']:x for x in bound['sources']}
          lines=['# idx | source | path | top3 | named | locked']
          for i,x in enumerate(cand['sources'],1):
              b=bm[x['source_id']]
              top=','.join(c['id'] for c in x['top_cards'][:3])
              named=';'.join(x['named_objects'][:4]) or '-'
              locked=[]
              for kv in b.get('boundary',[]):
                  u=kv.upper()
                  if any(k in u for k in ['CURRENT_PHYSICAL','STRICT_SUB','SQRT_B','NEW_WHOLE','POWER_SAVING_PROVED','RECEIVER_PROVED','THEOREM_PROVED','BLOCKED','NEXT=']):
                      locked.append(kv)
              if not locked:
                  for s in b.get('signals',[]):
                      u=s.upper()
                      if any(k in u for k in ['REMAINING_RECEIVER','CURRENT_PHYSICAL_UPPER_BOUND','PROVED\": FALSE','PROVED\": TRUE']):
                          locked.append(s)
                      if len(locked)>=4: break
              lines.append(f'{i:02d} | {x["source_id"]} | {x["path"]} | {top} | {named} | ' + ' ; '.join(locked[:7]))
          (root/'docs/structure-radar/.batch21-one-line.txt').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/structure-radar/.batch21-one-line.txt
          if ! git diff --cached --quiet; then
            git commit -m "Build StructureRadar batch21 one-line review table"
            git push origin HEAD:structure-radar-deep-corpus-batch-21
          fi
