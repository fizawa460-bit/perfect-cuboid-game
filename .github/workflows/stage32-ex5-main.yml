name: Stage32EX5 main integrity
# lifecycle: ACTIVE_AUTO — current EX5 retained frontier / bounded leaf producer gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32-ex5/**'
      - 'stages/stage32/proof/CLAIM-REGISTRY.json'
      - 'stages/stage32/proof/LANE-ADAPTERS.json'
      - '.github/workflows/stage32-ex5-main.yml'

permissions:
  contents: read

jobs:
  verify-stage32ex5-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Replay retained Cycle1 evidence against historical MAIN routing snapshots
        run: python stages/stage32-ex5/verify_ex5_retained_chain_historical_main_replay.py
      - name: Replay BC2-00 BTVA node-support/span first-pass diagnostic
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_00_btva_node_support_span_diagnostic.py
      - name: Replay BC2-00 second-pass repository dedup
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_00_second_pass_repository_dedup.py
      - name: Replay BC2-01 support-adapter preflight
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_01_support_adapter_preflight.py
      - name: Replay BC2-01A exceptional-pairing bridge
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_01a_exceptional_pairing_bridge.py
      - name: Replay BC2-01B runtime-node coordinate bridge
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_01b_runtime_node_coordinate_bridge.py
      - name: Replay BC2-02 FULL178 support reconstruction preflight
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_02_full178_support_reconstruction_preflight.py
      - name: Replay BC2-11 next exceptional block preflight
        run: |
          tmp="$(mktemp)"
          python stages/stage32-ex5/breadth-cycle-2/bc2_11_next_exceptional_terminal_block_preflight.py \
            --bc2-10-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-10-outer-rank2-exact-unsat-checkpoint.json \
            --output "$tmp"
          cmp "$tmp" stages/stage32-ex5/breadth-cycle-2/bc2-11-next-exceptional-terminal-block-preflight-checkpoint.json
      - name: Verify retained BC2-12 exact UNSAT checkpoint
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_12_outer_rank3_exact_unsat_checkpoint.py
      - name: Replay retained BC2-13 next exceptional block preflight
        run: |
          tmp="$(mktemp)"
          python stages/stage32-ex5/breadth-cycle-2/bc2_13_next_exceptional_terminal_block_preflight.py \
            --bc2-12-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-12-outer-rank3-exact-unsat-checkpoint.json \
            --output "$tmp"
          cmp "$tmp" stages/stage32-ex5/breadth-cycle-2/bc2-13-next-exceptional-terminal-block-preflight-checkpoint.json
      - name: Verify retained BC2-14 exact UNSAT checkpoint
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_14_outer_rank4_exact_unsat_checkpoint.py
      - name: Replay retained BC2-15 next exceptional block preflight
        run: |
          tmp="$(mktemp)"
          python stages/stage32-ex5/breadth-cycle-2/bc2_15_next_exceptional_terminal_block_preflight.py \
            --bc2-14-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-14-outer-rank4-exact-unsat-checkpoint.json \
            --output "$tmp"
          cmp "$tmp" stages/stage32-ex5/breadth-cycle-2/bc2-15-next-exceptional-terminal-block-preflight-checkpoint.json
      - name: Verify retained BC2-16 exact UNSAT checkpoint
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_16_outer_rank5_exact_unsat_checkpoint.py
      - name: Verify retained BC2-25 boundary33 checkpoint and transitive source locks
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_25_boundary33_partition_checkpoint.py
      - name: Verify retained BC2-26 boundary34 checkpoint and transitive source locks
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_26_boundary34_partition_checkpoint.py
      - name: Verify retained BC2-27 boundary35 checkpoint and transitive source locks
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_27_boundary35_partition_checkpoint.py
      - name: Verify retained BC2-28 boundary38 checkpoint and artifact receipt
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_28_boundary38_partition_checkpoint.py
      - name: Verify maximum audited current-MAIN e8 CUT handoff adapter
        run: python stages/stage32-ex5/cut-handoff/verify_e8_terminal_population_adapter.py
      - name: Verify EX5 live routing firewalls
        run: python stages/stage32-ex5/verify_main_state.py
      - name: Verify Stage32 claim DAG integrity
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify Stage32 active frontier
        run: python stages/stage32/proof/verify_stage32_active_frontier.py

  authorize-bc2-31-recovery:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: gate
        name: Authorize only fresh BC2-31 generation-2 recovery runkey
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          key=Path('stages/stage32-ex5/runkeys/bc2-31-recover-remaining172.json')
          before=os.environ.get('BEFORE','').strip(); head=os.environ.get('HEAD_SHA','').strip()
          authorized=False; reason='cold'
          if before and head and key.exists():
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',before],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              old_ok=subprocess.run(['git','cat-file','-e',before+'^{commit}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if old_ok:
                  changed=subprocess.check_output(['git','diff','--name-only',before,head],text=True).splitlines()
                  if str(key) in changed:
                      r=json.loads(key.read_text())
                      try:
                          old=json.loads(subprocess.check_output(['git','show',before+':'+str(key)],text=True,stderr=subprocess.DEVNULL))
                          generation_ok=int(r.get('generation',0))>int(old.get('generation',0))
                      except subprocess.CalledProcessError:
                          generation_ok=False
                      source='stages/stage32-ex5/breadth-cycle-2/bc2_31_recover_remaining172_bc2_19_unknown.py'
                      preflight='stages/stage32-ex5/breadth-cycle-2/bc2-31-recover-remaining172-preflight.json'
                      sb=subprocess.check_output(['git','hash-object',source],text=True).strip()
                      pb=subprocess.check_output(['git','hash-object',preflight],text=True).strip()
                      a=r.get('audit_consumption',{}); t=r.get('target',{}); ex=r.get('execution',{})
                      s=json.load(open('stages/stage32-ex5/MAIN-STATE.json'))
                      boundary=s.get('intermediate_audit_boundary',{})
                      authorized=(r.get('schema')=='STAGE32EX5_BC2_31_RECOVER_REMAINING172_RUNKEY_V1'
                          and r.get('generation')==2 and r.get('armed') is True and generation_ok
                          and r.get('source_git_blob_sha')==sb=='bd6ba2a0048b565354319598ff5811a9edf9a7a3'
                          and r.get('preflight_git_blob_sha')==pb=='15633233f18bf66815ca149ac3009156d0ef57e3'
                          and r.get('preflight_canonical')=='edd1bf6198d054277f828795f4e7a9d5372bc3094886e7afea420484bd899328'
                          and a.get('bc2_30_hostile_audit_status')=='PASS'
                          and a.get('bc2_30_hostile_audit_exact_head')=='38b60be7d0390ad5fa89ddb4dcd9511cfe36c57f'
                          and a.get('bc2_30_hostile_audit_review_id')==5184226057
                          and t.get('historical_unknown_count')==236
                          and t.get('retained_first64_count')==64
                          and t.get('remaining_identity_count')==172
                          and t.get('identity_recovery_only') is True
                          and ex.get('per_parent_timeout_ms')==2000
                          and ex.get('effective_heavy_concurrency')==1
                          and ex.get('heavy_scaleout_authorized') is False
                          and s.get('schema')=='STAGE32EX5_MAIN_COMPACT_STATE_V15_BC2_30_AUDIT_CONSUMED_BC2_31_RECOVERY_EXECUTION'
                          and boundary.get('last_hostile_audit_exact_head')=='38b60be7d0390ad5fa89ddb4dcd9511cfe36c57f'
                          and boundary.get('last_hostile_audit_review_id')==5184226057
                          and boundary.get('bc2_31_execution_authorized') is True)
                      reason='fresh-runkey' if authorized else 'semantic-gate-failed'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('authorized='+('true' if authorized else 'false')+'\n')
          print('BC2-31 recovery authorized:',authorized,'reason:',reason,'before:',before,'head:',head)
          PY

  bc2-31-recovery:
    needs: [verify-stage32ex5-main, authorize-bc2-31-recovery]
    if: needs.authorize-bc2-31-recovery.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact BC2-19 replay dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Verify BC2-30 audit consumption and BC2-31 execution authority
        run: |
          python stages/stage32-ex5/verify_main_state.py
          python - <<'PY'
          import json
          s=json.load(open('stages/stage32-ex5/MAIN-STATE.json'))
          a=s['intermediate_audit_boundary']
          assert s['schema']=='STAGE32EX5_MAIN_COMPACT_STATE_V15_BC2_30_AUDIT_CONSUMED_BC2_31_RECOVERY_EXECUTION'
          assert a['last_hostile_audit_status']=='PASS'
          assert a['last_hostile_audit_exact_head']=='38b60be7d0390ad5fa89ddb4dcd9511cfe36c57f'
          assert a['last_hostile_audit_review_id']==5184226057
          assert a['bc2_31_execution_authorized'] is True
          PY
          python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Compile BC2-31 recovery producer
        run: python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_31_recover_remaining172_bc2_19_unknown.py
      - name: Re-execute exact BC2-19 stream and recover all 236 UNKNOWN identities
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_31_recover_remaining172_bc2_19_unknown.py \
            --per-parent-timeout-ms 2000 \
            --output "$RUNNER_TEMP/bc2-31.json"
          cat "$RUNNER_TEMP/bc2-31.json"
      - name: Validate BC2-31 identity-only scope
        run: |
          python - "$RUNNER_TEMP/bc2-31.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          r=p['recovery_certificate']; c=p['credit']; f=p['firewalls']
          assert p['status']=='PASS_EXACT_172_IDENTITIES_RECOVERED_NO_STATUS_INFERENCE'
          assert p['audit_consumption']['bc2_30_hostile_audit_review_id']==5184226057
          assert (r['historical_unknown_count'],r['retained_first64_count'],r['recovered_remaining_count'])==(236,64,172)
          assert r['partition_exact'] is True and r['partition_disjoint'] is True
          assert len(r['all236_parent_indices'])==236
          assert len(r['retained_first64_parent_indices'])==64
          assert len(r['recovered_remaining172_parent_indices'])==172
          assert c['new_parent_unsat_count']==0 and c['known_parent_unsat_count_lower_bound']==7164
          assert c['whole_first_block_unsat'] is False and c['full178_complete'] is False and c['stage32_main_credit'] is False
          assert f['recovered_unknown_relabelled_unsat'] is False and f['unknown_dropped'] is False
          assert f['main_promotion'] is False and f['merge_authorized'] is False
          print('BC2_31_IDENTITY_RECOVERY_SCOPE_OK',p['canonical_sha256_without_this_field'],r['recovered_remaining172_parent_indices_sha256'])
          PY
      - name: Upload BC2-31 exact recovery result
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-31-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/bc2-31.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  authorize-e8-cut-handoff-wave:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: gate
        name: Authorize only a fresh e8 handoff runkey generation
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          key=Path('stages/stage32-ex5/runkeys/e8-cut-handoff-wave.json')
          before=os.environ.get('BEFORE','').strip(); head=os.environ.get('HEAD_SHA','').strip()
          authorized=False; reason='cold'
          if before and head and key.exists():
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',before],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              old_ok=subprocess.run(['git','cat-file','-e',before+'^{commit}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if old_ok:
                  changed=subprocess.check_output(['git','diff','--name-only',before,head],text=True).splitlines()
                  if str(key) in changed:
                      new=json.loads(key.read_text())
                      try:
                          old=json.loads(subprocess.check_output(['git','show',before+':'+str(key)],text=True,stderr=subprocess.DEVNULL))
                          generation_ok=int(new.get('generation',0))>int(old.get('generation',0))
                      except subprocess.CalledProcessError:
                          generation_ok=int(new.get('generation',0))==1
                      source='stages/stage32-ex5/cut-handoff/e8_terminal_population_adapter.py'
                      preflight='stages/stage32-ex5/cut-handoff/e8-terminal-population-preflight.json'
                      source_blob=subprocess.check_output(['git','hash-object',source],text=True).strip()
                      preflight_blob=subprocess.check_output(['git','hash-object',preflight],text=True).strip()
                      t=new.get('target',{}); ex=new.get('execution',{})
                      authorized=(new.get('schema')=='STAGE32EX5_E8_CUT_HANDOFF_WAVE_RUNKEY_V1'
                          and new.get('armed') is True and generation_ok
                          and new.get('source_git_blob_sha')==source_blob=='6026d2c8b4a2eb69c453a2bd38c5923f46d6d74f'
                          and new.get('preflight_git_blob_sha')==preflight_blob=='b28539d9d0eafddc181d3bbf6d668261f2ff081e'
                          and t.get('current_main_handoff_block_count')==7596
                          and t.get('current_main_handoff_terminal_count')==858348
                          and t.get('wave_survivor_offset_start')==1 and t.get('wave_survivor_count')==255
                          and t.get('wave_source_block_index_minmax')==[1,343]
                          and t.get('wave_terminal_count')==28815 and t.get('wave_raw_parent_candidates')==407672
                          and ex.get('max_raw_candidates')==425000 and ex.get('effective_heavy_concurrency')==1)
                      reason='fresh-runkey' if authorized else 'semantic-gate-failed'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('authorized='+('true' if authorized else 'false')+'\n')
          print('e8 CUT handoff authorized:',authorized,'reason:',reason,'before:',before,'head:',head)
          PY

  e8-cut-handoff-wave:
    needs: [verify-stage32ex5-main, authorize-e8-cut-handoff-wave]
    if: needs.authorize-e8-cut-handoff-wave.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact adapter dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Execute current-MAIN survivor e8 wave through common adapter
        run: |
          python stages/stage32-ex5/cut-handoff/e8_terminal_population_adapter.py \
            --survivor-offset 1 --survivor-count 255 --max-raw-candidates 425000 \
            --output "$RUNNER_TEMP/e8-cut-handoff-wave.json"
      - name: Validate compact handoff scope
        run: |
          python - "$RUNNER_TEMP/e8-cut-handoff-wave.json" <<'PY'
          import hashlib,json,sys
          p=json.load(open(sys.argv[1]))
          assert p['schema']=='STAGE32EX5_E8_CURRENT_MAIN_HANDOFF_WAVE_V1'
          assert p['survivor_offset_range']==[1,255]
          assert p['block_index_minmax']==[1,343]
          assert p['block_count']==255 and p['terminal_count']==28815
          assert p['raw_parent_candidates_checked']==407672
          assert len(p['blocks'])==255 and len(p['block_indices'])==255
          h=hashlib.sha256()
          for i in p['block_indices']: h.update(f'{i}\n'.encode())
          assert h.hexdigest()=='68ca7b27ffeceb52c35942449ca47105fd4a74757575544033454c3c9be514ea'
          assert p['authority']['n220_audited'] is True and p['authority']['n355_full_prefix_audited'] is True
          assert p['authority']['n356_candidate_consumed'] is False
          assert all(b['current_main_audited_prefix_survivor'] is True for b in p['blocks'])
          assert p['firewalls']['stage32_main_pruning_credit'] is False
          assert p['firewalls']['full178_complete'] is False
          assert p['firewalls']['merge_authorized'] is False
          print('E8_CURRENT_MAIN_CUT_HANDOFF_WAVE_OK',p['canonical_sha256_without_this_field'])
          PY
      - name: Upload compact e8 CUT handoff certificate
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-e8-current-main-cut-handoff-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/e8-cut-handoff-wave.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
