name: Stage32EX5 main integrity

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32-ex5/**'
      - 'stages/stage32/proof/CLAIM-REGISTRY.json'
      - 'stages/stage32/proof/LANE-ADAPTERS.json'
      - '.github/workflows/stage32-ex5-main.yml'

permissions:
  contents: read

jobs:
  verify-stage32ex5-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Replay EX5-00 source lock on historical MAIN routing snapshot
        run: python stages/stage32-ex5/verify_ex5_00_historical_main_routing_replay.py
      - name: Replay EX5-01 receiver ledger
        run: python stages/stage32-ex5/verify_ex5_01_receiver_ledger.py
      - name: Replay EX5-02 coverage dependency graph
        run: python stages/stage32-ex5/verify_ex5_02_coverage_graph.py
      - name: Replay EX5-03 clean-room route universe
        run: python stages/stage32-ex5/verify_ex5_03_clean_room_routes.py
      - name: Replay EX5-04 repository asset dedup
        run: python stages/stage32-ex5/verify_ex5_04_asset_dedup.py
      - name: Replay EX5-05 route scorecard
        run: python stages/stage32-ex5/verify_ex5_05_route_scorecard.py
      - name: Replay EX5-06 executable route contracts
        run: python stages/stage32-ex5/verify_ex5_06_executable_route_contracts.py
      - name: Replay EX5-07 XSTAGE preflight blocker
        run: python stages/stage32-ex5/verify_ex5_07_xstage_preflight_01.py
      - name: Replay EX5-07 EFC preflight blocker
        run: python stages/stage32-ex5/verify_ex5_07_efc_preflight_01.py
      - name: Replay EX5-07 EHS preflight blocker
        run: python stages/stage32-ex5/verify_ex5_07_ehs_preflight_01.py
      - name: Replay EX5-10 bounded breadth exhaustion ledger
        run: python stages/stage32-ex5/verify_ex5_10_bounded_breadth_exhaustion.py
      - name: Replay EX5-11 terminal route-decision candidate
        run: python stages/stage32-ex5/verify_ex5_11_terminal_route_decision.py
      - name: Verify EX5 routing firewalls
        run: python stages/stage32-ex5/verify_main_state.py
      - name: Verify Stage32 claim DAG integrity
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify Stage32 active frontier
        run: python stages/stage32/proof/verify_stage32_active_frontier.py
