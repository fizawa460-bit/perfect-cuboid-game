name: Stage32EX5 main integrity

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32-ex5/**'
      - 'stages/stage32/proof/CLAIM-REGISTRY.json'
      - 'stages/stage32/proof/LANE-ADAPTERS.json'
      - '.github/workflows/stage32-ex5-main.yml'

permissions:
  contents: read

jobs:
  verify-stage32ex5-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Replay EX5-00 source lock
        run: python stages/stage32-ex5/verify_ex5_00_source_lock.py
      - name: Replay EX5-01 receiver ledger
        run: python stages/stage32-ex5/verify_ex5_01_receiver_ledger.py
      - name: Replay EX5-02 coverage dependency graph
        run: python stages/stage32-ex5/verify_ex5_02_coverage_graph.py
      - name: Replay EX5-03 clean-room route universe
        run: python stages/stage32-ex5/verify_ex5_03_clean_room_routes.py
      - name: Replay EX5-04 repository asset dedup
        run: python stages/stage32-ex5/verify_ex5_04_asset_dedup.py
      - name: Replay EX5-05 route scorecard
        run: python stages/stage32-ex5/verify_ex5_05_route_scorecard.py
      - name: Verify EX5 routing firewalls
        run: python stages/stage32-ex5/verify_main_state.py
      - name: Verify Stage32 claim DAG integrity
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify Stage32 active frontier
        run: python stages/stage32/proof/verify_stage32_active_frontier.py
