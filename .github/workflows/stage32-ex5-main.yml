name: Stage32EX5 main integrity
# Trigger lifecycle: ACTIVE_AUTO — EX5 current producer / retained-interface integrity gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32-ex5/**'
      - 'stages/stage32/proof/CLAIM-REGISTRY.json'
      - 'stages/stage32/proof/LANE-ADAPTERS.json'
      - 'stages/stage32/proof/CROSS-LANE-DEMANDS.json'
      - 'stages/stage32/proof/verify_cross_lane_demands.py'
      - '.github/workflows/stage32-ex5-main.yml'

permissions:
  contents: read

jobs:
  verify-stage32ex5-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Replay retained Cycle1 evidence against historical MAIN routing snapshots
        run: python stages/stage32-ex5/verify_ex5_retained_chain_historical_main_replay.py
      - name: Replay BC2-00 BTVA node-support/span first-pass diagnostic
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_00_btva_node_support_span_diagnostic.py
      - name: Replay BC2-00 second-pass repository dedup
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_00_second_pass_repository_dedup.py
      - name: Replay BC2-01 support-adapter preflight
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_01_support_adapter_preflight.py
      - name: Replay BC2-01A exceptional-pairing bridge
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_01a_exceptional_pairing_bridge.py
      - name: Replay BC2-01B runtime-node coordinate bridge
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_01b_runtime_node_coordinate_bridge.py
      - name: Replay BC2-02 FULL178 support reconstruction preflight
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_02_full178_support_reconstruction_preflight.py
      - name: Replay BC2-11 next exceptional block preflight
        run: |
          tmp="$(mktemp)"
          python stages/stage32-ex5/breadth-cycle-2/bc2_11_next_exceptional_terminal_block_preflight.py --bc2-10-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-10-outer-rank2-exact-unsat-checkpoint.json --output "$tmp"
          cmp "$tmp" stages/stage32-ex5/breadth-cycle-2/bc2-11-next-exceptional-terminal-block-preflight-checkpoint.json
      - name: Verify retained BC2-12 exact UNSAT checkpoint
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_12_outer_rank3_exact_unsat_checkpoint.py
      - name: Replay retained BC2-13 next exceptional block preflight
        run: |
          tmp="$(mktemp)"
          python stages/stage32-ex5/breadth-cycle-2/bc2_13_next_exceptional_terminal_block_preflight.py --bc2-12-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-12-outer-rank3-exact-unsat-checkpoint.json --output "$tmp"
          cmp "$tmp" stages/stage32-ex5/breadth-cycle-2/bc2-13-next-exceptional-terminal-block-preflight-checkpoint.json
      - name: Verify retained BC2-14 exact UNSAT checkpoint
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_14_outer_rank4_exact_unsat_checkpoint.py
      - name: Replay retained BC2-15 next exceptional block preflight
        run: |
          tmp="$(mktemp)"
          python stages/stage32-ex5/breadth-cycle-2/bc2_15_next_exceptional_terminal_block_preflight.py --bc2-14-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-14-outer-rank4-exact-unsat-checkpoint.json --output "$tmp"
          cmp "$tmp" stages/stage32-ex5/breadth-cycle-2/bc2-15-next-exceptional-terminal-block-preflight-checkpoint.json
      - name: Verify retained BC2-16 exact UNSAT checkpoint
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_16_outer_rank5_exact_unsat_checkpoint.py
      - name: Verify retained BC2-25 boundary33 checkpoint and transitive source locks
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_25_boundary33_partition_checkpoint.py
      - name: Verify retained BC2-26 boundary34 checkpoint and transitive source locks
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_26_boundary34_partition_checkpoint.py
      - name: Verify retained BC2-27 boundary35 checkpoint and transitive source locks
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_27_boundary35_partition_checkpoint.py
      - name: Verify retained BC2-28 boundary38 checkpoint and artifact receipt
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_28_boundary38_partition_checkpoint.py
      - name: Verify retained BC2-35 targeted replay checkpoint and artifact receipt
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_35_targeted_replay_checkpoint.py
      - name: Verify retained BC2-36 targeted replay checkpoint and artifact receipt
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_36_targeted_replay_checkpoint.py
      - name: Verify maximum audited current-MAIN e8 CUT handoff adapter
        run: python stages/stage32-ex5/cut-handoff/verify_e8_terminal_population_adapter.py
      - name: Compile targeted replay producers
        run: |
          python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_32_replay_explicit_fresh_unknown170.py
          python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_33_replay_explicit_fresh_unknown107.py
          python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_34_replay_explicit_fresh_unknown81.py
          python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_35_replay_explicit_fresh_unknown64.py
          python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_36_replay_explicit_fresh_unknown52.py
          python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_37_replay_explicit_fresh_unknown41.py
      - name: Verify EX5 live routing firewalls
        run: python stages/stage32-ex5/verify_main_state.py
      - name: Verify EX5 cross-lane producer demand routing
        run: python stages/stage32/proof/verify_cross_lane_demands.py
      - name: Verify Stage32 claim DAG integrity
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify Stage32 active frontier
        run: python stages/stage32/proof/verify_stage32_active_frontier.py

  authorize-bc2-37-fresh-unknown41:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: gate
        name: Authorize only a fresh BC2-37 generation
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          key=Path('stages/stage32-ex5/runkeys/bc2-37-fresh-unknown41-replay.json'); statep=Path('stages/stage32-ex5/MAIN-STATE.json'); source=Path('stages/stage32-ex5/breadth-cycle-2/bc2_37_replay_explicit_fresh_unknown41.py'); preflight=Path('stages/stage32-ex5/breadth-cycle-2/bc2-37-fresh-unknown41-replay-preflight.json')
          before=os.environ.get('BEFORE','').strip(); head=os.environ.get('HEAD_SHA','').strip(); authorized=False; reason='cold'
          if before and head and key.exists():
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',before],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              old_ok=subprocess.run(['git','cat-file','-e',before+'^{commit}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if old_ok and str(key) in subprocess.check_output(['git','diff','--name-only',before,head],text=True).splitlines():
                  new=json.loads(key.read_text())
                  try:
                      old=json.loads(subprocess.check_output(['git','show',before+':'+str(key)],text=True,stderr=subprocess.DEVNULL)); generation_ok=int(new.get('generation',0))>int(old.get('generation',0))
                  except subprocess.CalledProcessError: generation_ok=int(new.get('generation',0))==1
                  sb=subprocess.check_output(['git','hash-object',str(source)],text=True).strip(); pb=subprocess.check_output(['git','hash-object',str(preflight)],text=True).strip(); state=json.loads(statep.read_text()); dep=new.get('dependency_locks',{}); target=new.get('target',{}); ex=new.get('execution',{}); audit=new.get('audit_consumption',{})
                  authorized=(new.get('schema')=='STAGE32EX5_BC2_37_FRESH_UNKNOWN41_REPLAY_RUNKEY_V1' and new.get('armed') is True and int(new.get('generation',0))==1 and generation_ok and sb==new.get('source_git_blob_sha')=='35a1644c197fd32aec845332452cc918f3bc75d9' and pb==new.get('preflight_git_blob_sha')=='15a008cd4557fe4e81d31591c3d80b50bc595a03' and new.get('preflight_canonical')=='30fa122941ee6b75e6e5004aa43ab121b216af93831cff0e9e22922f2438ddba' and audit=={'bc2_36_hostile_audit_status':'PASS','bc2_36_hostile_audit_exact_head':'9c63ccb48dd0e5bdeedda7739dd05e2404698465','bc2_36_hostile_audit_review_id':5188625406} and dep.get('bc2_36_checkpoint_git_blob_sha')=='09ac58349e388c479ac77e04724bef2fd9b49b7e' and dep.get('bc2_36_checkpoint_canonical')=='e92cd6d07299b833a79fe20b81e9de032d61790cf1b7a6fb81ec6adccdb49fdf' and dep.get('bc2_36_producer_git_blob_sha')=='18f9c2146d5dc97400c4af1a8691560523cc03cf' and dep.get('bc2_32_producer_git_blob_sha')=='7cfe8450cb9b9ab7f04da797d487655505598b93' and dep.get('bc2_19_replay_source_git_blob_sha')=='b2899aa228e7a3ee97526e3787ffbefa483530b4' and dep.get('bc2_18_enumerator_source_git_blob_sha')=='1e2ed93cae3c5b446c8d90c1ae2250be83289c79' and target.get('fresh_unknown_parent_count')==41 and target.get('fresh_unknown_parent_indices_sha256')=='570b36293f136405c2beceb1be77dbad4b0c6b50e7fd2f28d9f3dfc944f590e9' and target.get('prior_audited_unsat_count')==7295 and ex.get('per_parent_timeout_ms')==120000 and ex.get('effective_heavy_concurrency')==1 and ex.get('workflow_timeout_minutes')==110 and ex.get('heavy_scaleout_authorized') is False and state.get('schema')=='STAGE32EX5_MAIN_COMPACT_STATE_V27_BC2_36_AUDIT_CONSUMED_BC2_37_EXECUTION' and state.get('intermediate_audit_boundary',{}).get('bc2_37_execution_authorized') is True)
                  reason='fresh-runkey' if authorized else 'semantic-gate-failed'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('authorized='+('true' if authorized else 'false')+'\n')
          print('BC2-37 authorized:',authorized,'reason:',reason,'before:',before,'head:',head)
          PY

  bc2-37-fresh-unknown41:
    needs: [verify-stage32ex5-main, authorize-bc2-37-fresh-unknown41]
    if: needs.authorize-bc2-37-fresh-unknown41.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact BC2-37 dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Verify BC2-36 audit consumption and BC2-37 authority
        run: python stages/stage32-ex5/verify_main_state.py
      - name: Execute targeted replay of audited 41 UNKNOWN parents
        run: python stages/stage32-ex5/breadth-cycle-2/bc2_37_replay_explicit_fresh_unknown41.py --per-parent-timeout-ms 120000 --output "$RUNNER_TEMP/bc2-37.json"
      - name: Validate BC2-37 retained scope
        run: |
          python - "$RUNNER_TEMP/bc2-37.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); r=p['replay']; assert p['schema']=='STAGE32EX5_BC2_37_FRESH_UNKNOWN41_REPLAY_V1'; assert r['parents_checked']==41 and r['unsat_count']+r['unknown_count']+r['sat_count']==41 and r['per_parent_timeout_ms']==120000
          assert p['target']['parent_indices_sha256']=='570b36293f136405c2beceb1be77dbad4b0c6b50e7fd2f28d9f3dfc944f590e9' and p['target']['prior_audited_unsat_count']==7295; assert p['credit']['known_parent_unsat_count_lower_bound']==7295+r['unsat_count']; assert p['credit']['stage32_main_credit'] is False and p['credit']['full178_complete'] is False
          assert p['firewalls']['merge_authorized'] is False and p['firewalls']['heavy_scaleout_authorized'] is False and p['firewalls']['perfect_cuboid_existence_claim'] is False and p['firewalls']['perfect_cuboid_nonexistence_claim'] is False
          print('BC2_37_RESULT_OK',p['canonical_sha256_without_this_field'],r['unsat_count'],r['unknown_count'],r['sat_count'])
          PY
      - name: Upload compact BC2-37 result
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-37-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/bc2-37.json
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

  authorize-e8-cut-handoff-wave:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: gate
        name: Authorize only a fresh e8 handoff runkey generation
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          key=Path('stages/stage32-ex5/runkeys/e8-cut-handoff-wave.json'); before=os.environ.get('BEFORE','').strip(); head=os.environ.get('HEAD_SHA','').strip(); authorized=False; reason='cold'
          if before and head and key.exists():
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',before],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              old_ok=subprocess.run(['git','cat-file','e',before+'^{commit}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if old_ok:
                  changed=subprocess.check_output(['git','diff','--name-only',before,head],text=True).splitlines()
                  if str(key) in changed:
                      new=json.loads(key.read_text())
                      try: old=json.loads(subprocess.check_output(['git','show',before+':'+str(key)],text=True,stderr=subprocess.DEVNULL)); generation_ok=int(new.get('generation',0))>int(old.get('generation',0))
                      except subprocess.CalledProcessError: generation_ok=int(new.get('generation',0))==1
                      source='stages/stage32-ex5/cut-handoff/e8_terminal_population_adapter.py'; preflight='stages/stage32-ex5/cut-handoff/e8-terminal-population-preflight.json'; source_blob=subprocess.check_output(['git','hash-object',source],text=True).strip(); preflight_blob=subprocess.check_output(['git','hash-object',preflight],text=True).strip(); t=new.get('target',{}); ex=new.get('execution',{})
                      authorized=(new.get('schema')=='STAGE32EX5_E8_CUT_HANDOFF_WAVE_RUNKEY_V1' and new.get('armed') is True and generation_ok and new.get('source_git_blob_sha')==source_blob=='6026d2c8b4a2eb69c453a2bd38c5923f46d6d74f' and new.get('preflight_git_blob_sha')==preflight_blob=='b28539d9d0eafddc181d3bbf6d668261f2ff081e' and t.get('current_main_handoff_block_count')==7596 and t.get('current_main_handoff_terminal_count')==858348 and t.get('wave_survivor_offset_start')==1 and t.get('wave_survivor_count')==255 and t.get('wave_source_block_index_minmax')==[1,343] and t.get('wave_terminal_count')==28815 and t.get('wave_raw_parent_candidates')==407672 and ex.get('max_raw_candidates')==425000 and ex.get('effective_heavy_concurrency')==1); reason='fresh-runkey' if authorized else 'semantic-gate-failed'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('authorized='+('true' if authorized else 'false')+'\n')
          print('e8 CUT handoff authorized:',authorized,'reason:',reason,'before:',before,'head:',head)
          PY

  e8-cut-handoff-wave:
    needs: [verify-stage32ex5-main, authorize-e8-cut-handoff-wave]
    if: needs.authorize-e8-cut-handoff-wave.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact adapter dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Execute current-MAIN survivor e8 wave through common adapter
        run: python stages/stage32-ex5/cut-handoff/e8_terminal_population_adapter.py --survivor-offset 1 --survivor-count 255 --max-raw-candidates 425000 --output "$RUNNER_TEMP/e8-cut-handoff-wave.json"
      - name: Validate compact handoff scope
        run: |
          python - "$RUNNER_TEMP/e8-cut-handoff-wave.json" <<'PY'
          import hashlib,json,sys
          p=json.load(open(sys.argv[1])); assert p['schema']=='STAGE32EX5_E8_CURRENT_MAIN_HANDOFF_WAVE_V1'; assert p['survivor_offset_range']==[1,255]; assert p['block_index_minmax']==[1,343]; assert p['block_count']==255 and p['terminal_count']==28815; assert p['raw_parent_candidates_checked']==407672; assert len(p['blocks'])==255 and len(p['block_indices'])==255
          h=hashlib.sha256(); [h.update(f'{i}\n'.encode()) for i in p['block_indices']]; assert h.hexdigest()=='68ca7b27ffeceb52c35942449ca47105fd4a74757575544033454c3c9be514ea'; assert p['authority']['n220_audited'] is True and p['authority']['n355_full_prefix_audited'] is True; assert p['authority']['n356_candidate_consumed'] is False; assert all(b['current_main_audited_prefix_survivor'] is True for b in p['blocks']); assert p['firewalls']['stage32_main_pruning_credit'] is False; assert p['firewalls']['full178_complete'] is False; assert p['firewalls']['merge_authorized'] is False
          print('E8_CURRENT_MAIN_CUT_HANDOFF_WAVE_OK',p['canonical_sha256_without_this_field'])
          PY
      - name: Upload compact e8 CUT handoff certificate
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-e8-current-main-cut-handoff-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/e8-cut-handoff-wave.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
