name: Stage32EX5 main integrity

# Trigger lifecycle: ACTIVE_AUTO — EX5 current producer / retained-interface integrity gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32-ex5/**'
      - 'stages/stage32/proof/CLAIM-REGISTRY.json'
      - 'stages/stage32/proof/LANE-ADAPTERS.json'
      - 'stages/stage32/proof/CROSS-LANE-DEMANDS.json'
      - 'stages/stage32/proof/verify_cross_lane_demands.py'
      - '.github/workflows/stage32-ex5-main.yml'

permissions:
  contents: read

jobs:
  verify-stage32ex5-main:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact Picard64 preflight dependencies
        run: python -m pip install 'python-flint==0.9.0' 'sympy==1.14.0' 'z3-solver==4.15.4.0'

      - name: Replay retained Cycle1 evidence against historical MAIN routing snapshots
        run: python stages/stage32-ex5/verify_ex5_retained_chain_historical_main_replay.py
      - name: Replay BC2-00 BTVA node-support/span first-pass diagnostic
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_00_btva_node_support_span_diagnostic.py
      - name: Replay BC2-00 second-pass repository dedup
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_00_second_pass_repository_dedup.py
      - name: Replay BC2-01 support-adapter preflight
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_01_support_adapter_preflight.py
      - name: Replay BC2-01A exceptional-pairing bridge
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_01a_exceptional_pairing_bridge.py
      - name: Replay BC2-01B runtime-node coordinate bridge
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_01b_runtime_node_coordinate_bridge.py
      - name: Replay BC2-02 FULL178 support reconstruction preflight
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_02_full178_support_reconstruction_preflight.py
      - name: Replay BC2-11 next exceptional block preflight
        run: |
          tmp="$(mktemp)"
          python stages/stage32-ex5/breadth-cycle-2/bc2_11_next_exceptional_terminal_block_preflight.py \
            --bc2-10-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-10-outer-rank2-exact-unsat-checkpoint.json \
            --output "$tmp"
          cmp "$tmp" stages/stage32-ex5/breadth-cycle-2/bc2-11-next-exceptional-terminal-block-preflight-checkpoint.json
      - name: Verify retained BC2-12 exact UNSAT checkpoint
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_12_outer_rank3_exact_unsat_checkpoint.py
      - name: Replay retained BC2-13 next exceptional block preflight
        run: |
          tmp="$(mktemp)"
          python stages/stage32-ex5/breadth-cycle-2/bc2_13_next_exceptional_terminal_block_preflight.py \
            --bc2-12-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-12-outer-rank3-exact-unsat-checkpoint.json \
            --output "$tmp"
          cmp "$tmp" stages/stage32-ex5/breadth-cycle-2/bc2-13-next-exceptional-terminal-block-preflight-checkpoint.json
      - name: Verify retained BC2-14 exact UNSAT checkpoint
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_14_outer_rank4_exact_unsat_checkpoint.py
      - name: Replay retained BC2-15 next exceptional block preflight
        run: |
          tmp="$(mktemp)"
          python stages/stage32-ex5/breadth-cycle-2/bc2_15_next_exceptional_terminal_block_preflight.py \
            --bc2-14-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-14-outer-rank4-exact-unsat-checkpoint.json \
            --output "$tmp"
          cmp "$tmp" stages/stage32-ex5/breadth-cycle-2/bc2-15-next-exceptional-terminal-block-preflight-checkpoint.json
      - name: Verify retained BC2-16 exact UNSAT checkpoint
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_16_outer_rank5_exact_unsat_checkpoint.py
      # EFF-AFFINE01 FP58 is intentionally not executed in ordinary
      # integrity CI: the first bounded sample exceeded the practical CI
      # envelope and was cancelled.  The engine remains source-locked below;
      # exact enumeration requires a separately authorized bounded run.
      - name: Prove EFF-AFFINE02 bounded all140 complement
        run: python stages/stage32-ex5/effectivity-affine/eff_affine02_bounded_complement_preflight.py
      # EFF-AFFINE03..13 are retained research probes, not authority-bearing
      # gates. Their exact-head negative/inconclusive results advanced the
      # research frontier and are intentionally not replayed on every PR sync.
      # AFFINE14 exact-head PASS advanced the frontier to a forced-zero
      # collapse inside its best remaining 54D hierarchy fiber.
      - name: Certify EFF-AFFINE15 forced-zero lattice collapse
        run: python stages/stage32-ex5/effectivity-affine/eff_affine15_forced_zero_collapse.py
      - name: Benchmark EFF-AFFINE16 exact FP37 survivor
        run: python stages/stage32-ex5/effectivity-affine/eff_affine16_fp37_benchmark.py
      - name: Sweep EFF-AFFINE17 exact empty adjunction ellipsoids
        run: python stages/stage32-ex5/effectivity-affine/eff_affine17_empty_ellipsoid_sweep.py
      - name: Benchmark EFF-AFFINE18 smallest-radius exact FP43 survivor
        run: python stages/stage32-ex5/effectivity-affine/eff_affine18_fp43_benchmark.py
      - name: Run EFF-AFFINE19 low-radius exact FP43 wave
        run: python stages/stage32-ex5/effectivity-affine/eff_affine19_fp43_wave.py
      - name: Sweep EFF-AFFINE20 exact pairing ellipsoid separation
        run: python stages/stage32-ex5/effectivity-affine/eff_affine20_pairing_ellipsoid_separation.py
      - name: Sweep EFF-AFFINE21 exact two-pairing ellipsoid separation
        run: python stages/stage32-ex5/effectivity-affine/eff_affine21_two_pairing_separation.py
      - name: Sweep EFF-AFFINE22 optimized exact two-halfspace dual
        run: python stages/stage32-ex5/effectivity-affine/eff_affine22_optimized_two_halfspace_dual.py
      - name: Benchmark EFF-AFFINE23 AFFINE22 residual exact FP43
        run: python stages/stage32-ex5/effectivity-affine/eff_affine23_fp43_residual_benchmark.py
      - name: Probe EFF-AFFINE24 single-pairing exact conditioning
        run: python stages/stage32-ex5/effectivity-affine/eff_affine24_single_pairing_conditioning.py
      - name: Benchmark EFF-AFFINE25 conditioned exact FP42 branch
        run: python stages/stage32-ex5/effectivity-affine/eff_affine25_fp42_conditioned_benchmark.py
      - name: Benchmark EFF-AFFINE26 next conditioned exact FP42 branch
        run: python stages/stage32-ex5/effectivity-affine/eff_affine26_fp42_next_conditioned_benchmark.py
      - name: Probe EFF-AFFINE27 FP42 search growth
        run: python stages/stage32-ex5/effectivity-affine/eff_affine27_fp42_growth_probe.py
      - name: Probe EFF-AFFINE28 second exact pairing conditioner
        run: python stages/stage32-ex5/effectivity-affine/eff_affine28_second_pairing_conditioning.py
      - name: Close remaining EFF-AFFINE29 pairing96 branches structurally
        run: python stages/stage32-ex5/effectivity-affine/eff_affine29_remaining_pair96_second_conditioning.py
      - name: Probe EFF-AFFINE30 third exact pairing conditioner
        run: python stages/stage32-ex5/effectivity-affine/eff_affine30_third_pairing_conditioning.py
      - name: Verify EX5 live routing firewalls
        run: python stages/stage32-ex5/verify_main_state.py
      - name: Verify EX5 cross-lane producer demand routing
        run: python stages/stage32/proof/verify_cross_lane_demands.py
      - name: Verify Stage32 claim DAG integrity
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify Stage32 active frontier
        run: python stages/stage32/proof/verify_stage32_active_frontier.py
