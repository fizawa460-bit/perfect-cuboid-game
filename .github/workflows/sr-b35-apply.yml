name: StructureRadar batch35 verified ledger builder
on:
  push:
    branches: [agent/sr-b35-analysis]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply final source census batch
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('.')
          batch_id='SR-BATCH-OTHER_ARCHIVE_AND_CONTEXT-35-R01'
          task_id='SR-CENSUS-OTHER_ARCHIVE_AND_CONTEXT-01'
          M={
            'SRC-8EC9A00BFD09':None,
            'SRC-A9E72C617229':None,
            'SRC-9F7CBCE127B9':None,
            'SRC-9A80DF3AE418':None,
            'SRC-DC06E19F6A6E':None,
            'SRC-B84DC255B011':None,
            'SRC-3AEC182EF778':None,
            'SRC-664C6539925E':['SR-STR-001'],
            'SRC-83EB3E54E2E1':None,
            'SRC-FE2FCDC3FA2D':None,
            'SRC-A0659274F0BB':['SR-STR-141','SR-STR-228'],
            'SRC-B59D416C356D':['SR-STR-141','SR-STR-228'],
            'SRC-C06217162CEA':['SR-STR-001','SR-STR-141','SR-STR-228'],
            'SRC-6D28F90DCB94':None,
            'SRC-2AADA2F86E10':None,
            'SRC-477D48A21337':None,
            'SRC-10F19D05A945':None
          }
          qpath=root/'docs/structure-radar/exploration-queue.json'
          q=json.loads(qpath.read_text())
          task=next(t for t in q['tasks'] if t['status']=='READY' and t['phase']=='SOURCE_CENSUS')
          ids=task['source_ids']
          assert task['task_id']==task_id, task['task_id']
          assert ids==list(M.keys()) and len(ids)==17, (len(ids),ids)

          source_map={}; part_docs={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              d=json.loads(p.read_text()); part_docs[p]=d
              for s in d['sources']: source_map[s['source_id']]=s

          prog_path=root/'docs/structure-radar/progress.json'
          prog=json.loads(prog_path.read_text())
          assert not any(b.get('batch_id')==batch_id for b in prog['audit_batches'])
          reg_path=root/'docs/structure-radar/structure-registry.json'
          reg=json.loads(reg_path.read_text())
          cards={c['structure_id']:c for c in reg['structures']}
          assert 'SR-STR-228' not in cards
          assert len(reg['structures'])==227

          def prov(sid,locator):
              s=source_map[sid]
              return {'source_id':sid,'path':s['path'],'locator':locator,'fingerprint':s['fingerprint']}

          # New Euler-side theorem card: stronger than the prior order-only SR-STR-141 baseline.
          p228=[
            prov('SRC-A0659274F0BB','E-1d raw Euler-side directional chamber asymptotic'),
            prov('SRC-B59D416C356D','E-1e fixed-edge overlap bound and exactly-one synthesis'),
            prov('SRC-C06217162CEA','Euler-cuboid E-1 completed population-layer overview')
          ]
          new_card={
            'structure_id':'SR-STR-228',
            'canonical_math_name':'Euler-side unrestricted-space exactly-one directional chamber asymptotic and fixed-edge overlap thinning',
            'exact_equations_or_object':'For primitive canonical 0<a<b<c with gcd(a,b,c)=1 and R=sqrt(a^2+b^2+c^2)<=B, without requiring integral space diagonal, raw one-face incidences satisfy A_q^E(B)~[6 I_q/pi^4] B^2 log B. For P(n)={x>0:n^2+x^2 is a square}, |P(n)|<=tau(n^2), so each pair overlap O_qr(B)<=sum_{n<B}tau(n^2)^2=B^(1+o(1))=o(B^2 log B). Hence exactly-one counts satisfy N_q^E(B)~[6 I_q/pi^4] B^2 log B, N_1^E(B)~[3/(4 pi^2)]B^2 log B, and (N_ab,N_ac,N_bc)/N_1 -> (8/pi^2)(I_ab,I_ac,I_bc), the same chamber vector as the integral-space Stage13 theorem.',
            'search_terms_primary':[
              'primitive Euler cuboid exactly one face directional asymptotic B^2 log B',
              'fixed edge Pythagorean partner tau(n^2) pair overlap bound',
              'Euler-side chamber integrals unrestricted space diagonal exactly one face'
            ],
            'search_terms_aliases':[
              'E-1d raw directional asymptotic',
              'E-1e exact-one synthesis',
              'unrestricted-space exactly-one chamber law'
            ],
            'theorem_species':[
              'directional asymptotic counting',
              'archimedean chamber density',
              'divisor overlap bound',
              'raw-to-exact-one transfer',
              'limiting proportion law'
            ],
            'repo_provenance':p228,
            'target_populations':[
              'primitive canonical exactly-one-face cuboids without space-diagonal integrality under Euclidean height R<=B',
              'raw one-face incidences on the same Euler-side host'
            ],
            'potential_weapon_types':[
              'ASYMPTOTIC',
              'POPULATION_BASELINE',
              'DIVISOR_BOUND',
              'MEASURE_ADAPTER',
              'CAUSAL_DECOMPOSITION'
            ],
            'applicability_gaps':[
              'The space diagonal is unrestricted; the B^2 log B scale must not be transferred to integral-space populations.',
              'The fixed-edge divisor bound proves pair-overlap lower order on the Euler-side one-face host but does not determine the true Euler-brick M3 exponent.'
            ],
            'existing_radar_overlap':['SR-STR-001','SR-STR-041','SR-STR-141','SR-STR-227'],
            'search_status':'NOT_SEARCHED',
            'arsenal_decision':'PENDING',
            'card_status':'SUBMITTED_FOR_AUDIT'
          }
          reg['structures'].append(new_card)
          cards['SR-STR-228']=new_card

          # Existing-card provenance and a stale-gap repair on the order-only baseline.
          loc={
            'SR-STR-001':'Euler-side primitive canonical counting convention carrier',
            'SR-STR-141':'Euler-side exactly-one ambient B^2 log B baseline and stronger directional follow-up carrier',
            'SR-STR-228':'Euler-side unrestricted-space directional/exact-one theorem carrier'
          }
          for sid,cids in M.items():
              if not cids: continue
              for cid in cids:
                  if cid=='SR-STR-228': continue
                  pv=cards[cid].setdefault('repo_provenance',[])
                  if not any(x.get('source_id')==sid for x in pv):
                      pv.append(prov(sid,loc[cid]))

          cards['SR-STR-141']['applicability_gaps']=[
            'This baseline card records the B^2 log B order and Pythagorean-scale mechanism; the leading constant, directional constants, pair-overlap lower-order theorem, and exact-one limit law are normalized separately in SR-STR-228.',
            'Integral space diagonal is not imposed and must not be charged through this ambient baseline.'
          ]
          ov=cards['SR-STR-141'].setdefault('existing_radar_overlap',[])
          if 'SR-STR-228' not in ov: ov.append('SR-STR-228')

          for sid in ids:
              s=source_map[sid]
              assert s['review_state']=='NEW', (sid,s['review_state'])
              assert sid not in prog['source_reviews'], sid
              cids=M[sid]
              if cids is None:
                  prog['source_reviews'][sid]={'fingerprint':s['fingerprint'],'status':'NO_DISTINCT_STRUCTURE','batch_id':batch_id}
              else:
                  prog['source_reviews'][sid]={'fingerprint':s['fingerprint'],'status':'STRUCTURES_RECORDED','batch_id':batch_id,'structure_ids':cids}
              s['review_state']='CURRENT_REVIEWED'

          union=sorted({cid for sid in ids if M[sid] for cid in M[sid]})
          assert union==['SR-STR-001','SR-STR-141','SR-STR-228'], union
          carrier=sum(M[sid] is not None for sid in ids); nodist=17-carrier
          assert (carrier,nodist)==(4,13), (carrier,nodist)

          prog['audit_batches'].append({
            'batch_id':batch_id,'task_id':task_id,'status':'SUBMITTED_FOR_AUDIT','source_ids':ids,
            'sources_reviewed':17,'structures_added':1,'structures_updated':2,
            'structure_carrier_sources':4,'structures_deduped':13,'searches_completed':0,
            'arsenal_decisions':0,'audit_required':True,'duplicate_source':0,'no_distinct_structure':13})
          prog_path.write_text(json.dumps(prog,indent=2,ensure_ascii=False)+'\n')
          reg_path.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')
          for p,d in part_docs.items():
              if any(s['source_id'] in M for s in d['sources']):
                  p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Refresh and verify
        shell: bash
        run: |
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git diff --check
      - name: Assert census closure and ledger
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          r=pathlib.Path('.')
          c=json.loads((r/'docs/structure-radar/controller.json').read_text())
          assert c['corpus']['review_states']=={'CURRENT_REVIEWED':2556}, c['corpus']['review_states']
          assert c['registry']['structure_count']==228, c['registry']['structure_count']
          p=json.loads((r/'docs/structure-radar/progress.json').read_text())
          b=next(x for x in p['audit_batches'] if x['batch_id']=='SR-BATCH-OTHER_ARCHIVE_AND_CONTEXT-35-R01')
          assert b['sources_reviewed']==17 and b['structures_added']==1 and b['structures_updated']==2
          assert b['structure_carrier_sources']==4 and b['no_distinct_structure']==13 and b['duplicate_source']==0
          rv=[v for v in p['source_reviews'].values() if v.get('batch_id')==b['batch_id']]
          assert len(rv)==17 and sum(v['status']=='STRUCTURES_RECORDED' for v in rv)==4 and sum(v['status']=='NO_DISTINCT_STRUCTURE' for v in rv)==13
          q=json.loads((r/'docs/structure-radar/exploration-queue.json').read_text())
          assert not any(t['phase']=='SOURCE_CENSUS' and t['status']=='READY' for t in q['tasks'])
          print('BATCH35_OK',c['corpus']['review_states'],c['registry']['structure_count'],c['queue'],c['next_expected_command'])
          PY
      - name: Commit verified official ledger on analysis branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/structure-radar
          git commit -m 'Temp verified: StructureRadar final source census batch 35'
          git push origin HEAD:agent/sr-b35-analysis
