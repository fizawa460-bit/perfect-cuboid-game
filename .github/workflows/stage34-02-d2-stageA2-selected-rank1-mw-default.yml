name: Stage34-02 D2 StageA2 selected rank-one MW default

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage34/runkeys/stage34-02-d2-stageA2-selected-rank1-mw-default.json'
      - 'stages/stage34/34-02/d2-stageA2-rank1-cover-selection.json'
      - 'stages/stage34/34-02/d2-stageA2-selected-rank1-mw-default-lock.json'
      - 'stages/stage34/34-02/run_d2_stageA2_selected_rank1_mw_default.py'
      - 'stages/stage34/34-02/validate_d2_stageA2_selected_rank1_mw_default_runkey.py'
      - '.github/workflows/stage34-02-d2-stageA2-selected-rank1-mw-default.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch event-before commit if needed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ]; then git fetch --no-tags --depth=1 origin "$BEFORE" || true; fi
      - name: Validate dedicated run key against actual commit range
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 stages/stage34/34-02/validate_d2_stageA2_selected_rank1_mw_default_runkey.py "$BEFORE" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Report authorization
        run: echo "authorized=${{ steps.gate.outputs.authorized }} reason=${{ steps.gate.outputs.reason }}"

  certify-selected-rank1:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install proof-capable eclib mwrank
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends eclib-tools
          dpkg-query -W eclib-tools
      - name: Default-bound full MW basis pass on selected 14 models
        run: python3 stages/stage34/34-02/run_d2_stageA2_selected_rank1_mw_default.py
      - name: Enforce compact artifact cap
        if: always()
        run: |
          test -f stages/stage34/34-02/d2-stageA2-selected-rank1-mw-default.json
          test -f stages/stage34/34-02/d2-stageA2-selected-rank1-mw-default-stdout.txt
          test $(wc -c < stages/stage34/34-02/d2-stageA2-selected-rank1-mw-default.json) -le 1048576
          test $(wc -c < stages/stage34/34-02/d2-stageA2-selected-rank1-mw-default-stdout.txt) -le 1048576
      - name: Upload compact MW evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-02-d2-stageA2-selected-rank1-mw-default
          path: |
            stages/stage34/34-02/d2-stageA2-selected-rank1-mw-default.json
            stages/stage34/34-02/d2-stageA2-selected-rank1-mw-default-stdout.txt
          if-no-files-found: warn
          retention-days: 1
