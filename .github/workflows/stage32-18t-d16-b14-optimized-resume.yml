name: Stage32-18T d16 b14 optimized resume

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/runkeys/18t-b14-optimized-resume.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-18t-b14-optimized-resume-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-snapshot:
    runs-on: ubuntu-latest
    outputs:
      hot_matrix: ${{ steps.snap.outputs.hot_matrix }}
      hot_packet_matrix: ${{ steps.snap.outputs.hot_packet_matrix }}
      regular_matrix: ${{ steps.snap.outputs.regular_matrix }}
      hot_ids: ${{ steps.snap.outputs.hot_ids }}
      missing_ids: ${{ steps.snap.outputs.missing_ids }}
      source_complete_count: ${{ steps.snap.outputs.source_complete_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate explicit optimized-resume key
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18t-b14-optimized-resume.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1'
          assert d['workflow']=='stage32-18t-d16-b14-optimized-resume'
          assert d['armed'] is True and d['generation']==1 and d['bound']==14
          assert d['source_run_id']==32915934318
          assert d['source_prepared_artifact_id']==9588229672
          assert d['source_prepared_zip_sha256']=='6e4e6e5350717296f0e76e5c972e945b72a61d32e039718a535e245826b5b159'
          assert d['exact_source_artifact_id']==9574308138
          assert d['exact_source_zip_sha256']=='0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4'
          assert d['manifest_sha256']=='9ee5c6781cbe1a3a39e9656419745b60abaec07de52f99a9cdf2261650f189ab'
          assert d['hot_secondary_split_coordinate']==45 and d['hot_secondary_shard_count']==4
          assert d['regular_parallel_residue_workers']==4
          PY
      - id: snap
        name: Snapshot COMPLETE source packets before handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot"
          python stages/stage32/32-18T/snapshot_source_completion.py --repo "$GITHUB_REPOSITORY" --run-id 32915934318 --output "$RUNNER_TEMP/snapshot/source-completion.json"
          python - <<'PY'
          import json,os,pathlib
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'snapshot/source-completion.json').read_text())
          hot=d['missing_hot_ids']; regular=d['missing_regular_ids']; missing=d['missing_bulk_ids']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('hot_matrix='+json.dumps({'include':d['hot_matrix']},separators=(',',':'))+'\n')
              f.write('hot_packet_matrix='+json.dumps({'packet_id':hot},separators=(',',':'))+'\n')
              f.write('regular_matrix='+json.dumps({'packet_id':regular},separators=(',',':'))+'\n')
              f.write('hot_ids='+json.dumps(hot,separators=(',',':'))+'\n')
              f.write('missing_ids='+json.dumps(missing,separators=(',',':'))+'\n')
              f.write('source_complete_count='+str(len(d['source_complete_ids']))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18t-b14-source-snapshot-g1
          path: ${{ runner.temp }}/snapshot/
          retention-days: 14
          if-no-files-found: error

  prepare:
    needs: validate-and-snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify source prepared artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          u='https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9588229672'
          q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          d=json.load(urllib.request.urlopen(q)); assert d['workflow_run']['id']==32915934318; assert d['digest']=='sha256:6e4e6e5350717296f0e76e5c972e945b72a61d32e039718a535e245826b5b159'; assert d['expired'] is False
          PY
      - uses: actions/download-artifact@v4
        with:
          name: stage32-18p-b14-bulk251-prepared-g1
          path: ${{ runner.temp }}/prepared
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32915934318
      - name: Fetch immutable exact source and build missing hot binaries
        env:
          GH_TOKEN: ${{ github.token }}
          HOT_IDS: ${{ needs.validate-and-snapshot.outputs.hot_ids }}
        run: |
          set -euo pipefail
          echo '9ee5c6781cbe1a3a39e9656419745b60abaec07de52f99a9cdf2261650f189ab  '"$RUNNER_TEMP/prepared/packet-manifest.json" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/zips"
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/zips/source.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/zips/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/zips/source.zip" -d "$RUNNER_TEMP/source"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libboost-dev
          python - <<'PY'
          import json,os,pathlib,subprocess
          hot=json.loads(os.environ['HOT_IDS']); manifest=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'prepared/packet-manifest.json').read_text())
          root=pathlib.Path(os.environ['RUNNER_TEMP']); src=root/'source/d16-exact-symmetry-sharded.cpp'; out=root/'prepared'
          for pid in hot:
              packet=manifest['packets'][pid]; assert packet['tier']=='hot-single' and len(packet['residues'])==1; residue=int(packet['residues'][0])
              cpp=out/f'd16-hot-packet-{pid}.cpp'; exe=out/f'd16-hot-packet-{pid}'
              subprocess.run(['python','stages/stage32/32-18T/build_hot_two_stage_certifier.py','--source',str(src),'--output',str(cpp),'--primary-id',str(residue)],check=True)
              subprocess.run(['g++','-O3','-DNDEBUG','-std=c++17','-Wall','-Wextra','-pedantic',str(cpp),'-o',str(exe)],check=True)
          print({'hot_binaries':len(hot)})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18t-b14-prepared-g1
          path: ${{ runner.temp }}/prepared/
          retention-days: 14
          if-no-files-found: error

  hot-subshard:
    needs: [validate-and-snapshot, prepare]
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.validate-and-snapshot.outputs.hot_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage32-18t-b14-prepared-g1
          path: ${{ runner.temp }}/prepared
      - name: Exact hot packet ${{ matrix.packet_id }} subshard ${{ matrix.subshard }}/4
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          chmod +x "$RUNNER_TEMP/prepared/d16-hot-packet-${{ matrix.packet_id }}"
          "$RUNNER_TEMP/prepared/d16-hot-packet-${{ matrix.packet_id }}" \
            --input "$RUNNER_TEMP/prepared/d16-hperp.txt" --bundle "$RUNNER_TEMP/prepared/d16-aut-prefix256-bundle.txt" \
            --output "$RUNNER_TEMP/out/hot-packet-${{ matrix.packet_id }}-sub-${{ matrix.subshard }}.json" \
            --dump-canonical "$RUNNER_TEMP/out/hot-packet-${{ matrix.packet_id }}-sub-${{ matrix.subshard }}.bin" \
            --bound 14 --shard-id ${{ matrix.subshard }} --shard-count 4 --split-coordinate 45 --node-cap 120000000
          python - <<'PY'
          import json,os,pathlib
          pid=int('${{ matrix.packet_id }}'); sid=int('${{ matrix.subshard }}'); d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'out'/f'hot-packet-{pid}-sub-{sid}.json').read_text())
          assert d['schema']=='STAGE32_18T_D16_B14_HOT_SUBSHARD_V1' and d['status']=='COMPLETE' and d['bound']==14
          assert (d['secondary_split_coordinate'],d['secondary_shard_id'],d['secondary_shard_count'])==(45,sid,4)
          assert d['TRAVERSAL_COMPLETENESS_CERTIFICATE'] is True
          print(json.dumps({'packet_id':pid,'subshard':sid,'nodes':d['nodes'],'canonical':d['canonical_survivors_including_zero']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage32-18t-b14-hot-packet-${{ matrix.packet_id }}-sub-${{ matrix.subshard }}-of4-g1
          path: ${{ runner.temp }}/out/
          retention-days: 5
          if-no-files-found: warn

  synthesize-hot:
    if: always() && needs.prepare.result == 'success'
    needs: [validate-and-snapshot, prepare, hot-subshard]
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.validate-and-snapshot.outputs.hot_packet_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-18t-b14-hot-packet-${{ matrix.packet_id }}-sub-*-of4-g1
          path: ${{ runner.temp }}/children
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: stage32-18t-b14-prepared-g1
          path: ${{ runner.temp }}/prepared
      - name: Synthesize exact rescued hot packet
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python stages/stage32/32-18T/synthesize_hot_packet.py --manifest "$RUNNER_TEMP/prepared/packet-manifest.json" --packet-id ${{ matrix.packet_id }} --input "$RUNNER_TEMP/children" --output "$RUNNER_TEMP/out"
          python stages/stage32/32-18B/verify_d16_bound_canonical.py --aut "$RUNNER_TEMP/prepared/d16-aut-action.json" --dump "$RUNNER_TEMP/out/packet-canonical.bin" --enum-json "$RUNNER_TEMP/out/packet-certificate.json" --output "$RUNNER_TEMP/out/full-aut-verify.json" --bound 14
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18t-b14-packet-${{ matrix.packet_id }}-g1
          path: ${{ runner.temp }}/out/
          retention-days: 14
          if-no-files-found: error

  regular-packet:
    needs: [validate-and-snapshot, prepare]
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.validate-and-snapshot.outputs.regular_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: stage32-18t-b14-prepared-g1
          path: ${{ runner.temp }}/prepared
      - name: Exact packet with parallel residue workers
        run: |
          mkdir -p "$RUNNER_TEMP/out"; chmod +x "$RUNNER_TEMP/prepared/d16-exact"; SECONDS=0
          python stages/stage32/32-18T/run_exact_packet_parallel.py --manifest "$RUNNER_TEMP/prepared/packet-manifest.json" --packet-id ${{ matrix.packet_id }} --exe "$RUNNER_TEMP/prepared/d16-exact" --input "$RUNNER_TEMP/prepared/d16-hperp.txt" --bundle "$RUNNER_TEMP/prepared/d16-aut-prefix256-bundle.txt" --output "$RUNNER_TEMP/out" --node-cap 220000000 --workers 4
          elapsed=$SECONDS
          ELAPSED="$elapsed" python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'out/packet-certificate.json'; d=json.loads(p.read_text()); d['packet_runtime_seconds']=int(os.environ['ELAPSED']); p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n'); assert d['status']=='COMPLETE'; print(json.dumps({'packet_id':d['packet_id'],'runtime_seconds':d['packet_runtime_seconds'],'residues':d['residues']},sort_keys=True))
          PY
          python stages/stage32/32-18B/verify_d16_bound_canonical.py --aut "$RUNNER_TEMP/prepared/d16-aut-action.json" --dump "$RUNNER_TEMP/out/packet-canonical.bin" --enum-json "$RUNNER_TEMP/out/packet-certificate.json" --output "$RUNNER_TEMP/out/full-aut-verify.json" --bound 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage32-18t-b14-packet-${{ matrix.packet_id }}-g1
          path: ${{ runner.temp }}/out/
          retention-days: 14
          if-no-files-found: warn

  summarize:
    if: always()
    needs: [validate-and-snapshot, synthesize-hot, regular-packet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage32-18t-b14-source-snapshot-g1
          path: ${{ runner.temp }}/snapshot
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: stage32-18t-b14-packet-*-g1
          path: ${{ runner.temp }}/packets
      - name: Verify resume coverage against frozen source snapshot
        run: |
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']); snap=json.loads((root/'snapshot/source-completion.json').read_text()); docs={}
          for p in (root/'packets').rglob('packet-certificate.json') if (root/'packets').exists() else []:
              d=json.loads(p.read_text()); docs[int(d['packet_id'])]=d
          expected=set(snap['missing_bulk_ids']); complete={i for i,d in docs.items() if d.get('status')=='COMPLETE' and d.get('TRAVERSAL_COMPLETENESS_CERTIFICATE') is True}; missing=sorted(expected-complete); extra=sorted(complete-expected)
          out={'schema':'STAGE32_18T_B14_OPTIMIZED_RESUME_SUMMARY_V1','source_run_id':snap['source_run_id'],'source_complete_ids':snap['source_complete_ids'],'resume_expected_ids':sorted(expected),'resume_complete_ids':sorted(complete),'resume_missing_ids':missing,'resume_extra_ids':extra,'ready_for_18r':not missing and not extra,'D16_B14_NUMERICAL_CREDIT':False,'GLOBAL_B14_AGGREGATION_COMPLETE':False,'AUDIT_STATUS':'PENDING'}
          pathlib.Path('resume-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps({'source_complete':len(snap['source_complete_ids']),'resume_complete':len(complete),'resume_missing':missing,'ready_for_18r':out['ready_for_18r']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18t-b14-resume-summary-g1
          path: resume-summary.json
          retention-days: 14
          if-no-files-found: error
