name: Stage14-s7-39 Cayley residual disjoint 17/32

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-39/**'
      - 'stages/stage14/scripts/14-s7-39/**'
      - '.github/workflows/stage14-s7-39-cayley-residual-disjoint-17-32.yml'
      - 'stages/stage14/14-s7-38/**'
      - 'stages/stage14/14-4cw/**'
      - 'stages/stage14/14-4cr/**'
      - 'stages/stage14/14-4cs/**'
      - 'stages/stage14/14-s7-35/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage14-s7-39 audit
        run: python stages/stage14/scripts/14-s7-39/cayley_residual_disjoint_17_32_audit.py

      - name: Compile Stage14-s7-39 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-39/cayley_residual_disjoint_17_32_audit.py

      - name: Run merged s7-38 regression
        run: python stages/stage14/scripts/14-s7-38/full_cayley_row_11_20_audit.py

      - name: Run merged X12 regression
        run: python stages/stage14/scripts/14-X12/lost_core_fourth_root_71_128_audit.py

      - name: Run merged s7-37 regression
        run: python stages/stage14/scripts/14-s7-37/sameside_u_residual_19_34_audit.py

      - name: Run merged 4cw regression
        run: |
          grep -Fq 'STAGE14_4CW=COMPLETE_FULL_CAYLEY_ROW_LOST_CORE_FOURTH_ROOT_AND_61_112_PROMOTION' stages/stage14/14-4cw/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=61/112' stages/stage14/14-4cw/result.md

      - name: Lock Cayley/root predecessor facts
        run: |
          grep -Fq 'gcd(C_*,M*N)=1' stages/stage14/14-4cr/result.md
          grep -Fq 'oddpart(gcd(X,Y))' stages/stage14/14-4cs/result.md
          grep -Fq 'omega_1*omega_2' stages/stage14/14-s7-35/result.md

      - name: Lock Stage14-s7-39 theorem boundary
        run: |
          f=stages/stage14/14-s7-39/result.md
          grep -Fq 'STAGE14_S7_39=COMPLETE_CAYLEY_RESIDUAL_DISJOINTNESS_SQUARE_ROOT_LOST_CORE_AND_17_32_PROMOTION' "$f"
          grep -Fq 'CAYLEY_GOOD_CORE_COPRIME_TO_COMMON_ROOT_GCD=true' "$f"
          grep -Fq 'CAYLEY_RESIDUAL_FIXED_POWER_INTERSECTION_TRIVIAL=true' "$f"
          grep -Fq 'JOINT_CORE_EQUALS_CAYLEY_GOOD_CORE_AT_FIXED_POWER=true' "$f"
          grep -Fq 'LOST_CORE_SQUARE_ROOT_DIVISOR_PROVED=true' "$f"
          grep -Fq 'LOST_CORE_SQUARE_ROOT_DIVISOR_DIVIDES_COLUMN_COFACTOR_PRODUCT=true' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=17/32' "$f"
          grep -Fq 'IMPROVEMENT_OVER_PREVIOUS_61_112=3/224' "$f"
          grep -Fq 'CURRENT_GAP_TO_SQRT=1/32' "$f"
          grep -Fq 'SEVENTEEN_32_EFFECTIVE_COLUMN_SUPPORT_EXPONENT=0' "$f"
          grep -Fq 'SEVENTEEN_32_ROW_CRT_LIFT_EXPONENT=1/32' "$f"
          grep -Fq 'S7_39_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-s7-40' "$f"
