name: Stage33-12 post-1488 frontier replay

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: stage33-12-post1488-frontier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-frontier-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay V26-V34 exact frontier
        run: |
          python stages/stage33/33-12/certify_j2_ct_determinant_compactification_parity_frontier_v26.py --check
          python stages/stage33/33-12/certify_j2_ct_norm_splitting_boundary_valuations_v27.py --check
          python stages/stage33/33-12/certify_j2_post_v27_exceptional_overlap_inheritance_audit_v28.py --check
          python stages/stage33/33-12/certify_j2_current_lambda_d_even_norm_rank2_lattices_v29.py --check
          python stages/stage33/33-12/certify_j2_current_lambda_d_odd_ramified_cech_overlaps_v30.py --check
          python stages/stage33/33-12/certify_j2_current_cc_global_square_cech_overlap_v31.py
          python stages/stage33/33-12/audit_j2_current_v4_pic2_cocycle_v32.py
          python stages/stage33/33-12/audit_j2_current_hs_d2_integral_lift_v33.py
          python stages/stage33/33-12/certify_j2_adapted_first_kummer_column_v34.py
          git diff --check
