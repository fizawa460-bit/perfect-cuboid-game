name: Stage32 post1484 O210 q4 six-cusp Hurwitz replay

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replay O210 six-cusp Hurwitz reduction
        run: >-
          python stages/stage32/residual-32-01-production/certify_stage32_post1484_o210_q4_six_cusp_hurwitz_reduction.py
          --check stages/stage32/residual-32-01-production/post1484-o210-q4-six-cusp-hurwitz-reduction.json
      - name: Replay explicit first Hurwitz nonexclusion
        run: >-
          python stages/stage32/residual-32-01-production/certify_stage32_post1484_o210_q4_first_hurwitz_explicit_nonexclusion.py
          --check stages/stage32/residual-32-01-production/post1484-o210-q4-first-hurwitz-explicit-nonexclusion.json
      - name: Replay common-cover Pic2 reduction
        run: >-
          python stages/stage32/residual-32-01-production/certify_stage32_post1484_o210_q4_common_double_cover_pic2_reduction.py
          --check stages/stage32/residual-32-01-production/post1484-o210-q4-common-double-cover-pic2-reduction.json
      - name: Replay common-cover Cartesian identity
        run: >-
          python stages/stage32/residual-32-01-production/certify_stage32_post1484_o210_q4_common_double_cover_cartesian_identity.py
          --check stages/stage32/residual-32-01-production/post1484-o210-q4-common-double-cover-cartesian-identity.json
      - name: Replay second-projection 24-unit local excess decomposition
        run: >-
          python stages/stage32/residual-32-01-production/certify_stage32_post1484_o210_q4_second_projection_local_excess_decomposition.py
          --check stages/stage32/residual-32-01-production/post1484-o210-q4-second-projection-local-excess-decomposition.json
      - name: Replay second-ramification half-divisor Picard identity
        run: >-
          python stages/stage32/residual-32-01-production/certify_stage32_post1484_o210_q4_second_ramification_half_divisor_picard_identity.py
          --check stages/stage32/residual-32-01-production/post1484-o210-q4-second-ramification-half-divisor-picard-identity.json
      - name: Replay half-ramification Abel-Jacobi reduction
        run: >-
          python stages/stage32/residual-32-01-production/certify_stage32_post1484_o210_q4_half_ramification_abel_jacobi_reduction.py
          --check stages/stage32/residual-32-01-production/post1484-o210-q4-half-ramification-abel-jacobi-reduction.json
      - name: Replay Abel-Jacobi closure contract
        run: >-
          python stages/stage32/residual-32-01-production/certify_stage32_post1484_o210_q4_abel_jacobi_closure_contract.py
          --check stages/stage32/residual-32-01-production/post1484-o210-q4-abel-jacobi-closure-contract.json
      - name: Replay Abel-Jacobi equivalent-theorem zero closure
        run: >-
          python stages/stage32/residual-32-01-production/certify_stage32_post1484_o210_q4_abel_jacobi_equivalent_theorem_closure.py
          --check stages/stage32/residual-32-01-production/post1484-o210-q4-abel-jacobi-equivalent-theorem-closure.json
      - name: Replay Bolza correspondence Rosati frontier
        run: >-
          python stages/stage32/residual-32-01-production/certify_stage32_post1490_o210_q4_bolza_correspondence_rosati_frontier.py
          --check stages/stage32/residual-32-01-production/post1490-o210-q4-bolza-correspondence-rosati-frontier.json
