name: Stage34-02 D2 fiber-product MW sieve

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage34/runkeys/stage34-02-d2-fiber-product-mw.json'
      - 'stages/stage34/34-02/d2-fiber-product-mw-preflight.json'
      - 'stages/stage34/34-02/d2-jacobian-torsion-lock.json'
      - 'stages/stage34/34-02/d2-jq-to-receiver-x-coordinate-lock.json'
      - 'stages/stage34/34-02/verify_d2_jacobian_torsion.py'
      - 'stages/stage34/34-02/verify_d2_inverse_basepoint_extension.py'
      - 'stages/stage34/34-02/run_d2_fiber_product_mw_panel.py'
      - 'stages/stage34/34-02/run_d2_fiber_product_mw_panel_v2.py'
      - 'stages/stage34/34-02/validate_d2_fiber_product_mw_runkey.py'
      - 'stages/stage34/34-02/d2-quartic-map-certificate.json'
      - 'stages/stage34/34-02/d2-jacobian-mw-certificate.json'
      - '.github/workflows/stage34-02-d2-fiber-product-mw.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch event-before commit if needed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ]; then git fetch --no-tags --depth=1 origin "$BEFORE" || true; fi
      - name: Validate dedicated run key against actual commit range
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 stages/stage34/34-02/validate_d2_fiber_product_mw_runkey.py "$BEFORE" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Report authorization
        run: echo "authorized=${{ steps.gate.outputs.authorized }} reason=${{ steps.gate.outputs.reason }}"

  fiber-product-mw:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Jq torsion
        run: python3 stages/stage34/34-02/verify_d2_jacobian_torsion.py
      - name: Verify inverse-coordinate basepoint extension
        run: python3 stages/stage34/34-02/verify_d2_inverse_basepoint_extension.py
      - name: Run exact four-prime matching-x panel without indeterminate J states
        run: python3 stages/stage34/34-02/run_d2_fiber_product_mw_panel_v2.py
      - name: Enforce compact artifact cap
        run: test $(wc -c < stages/stage34/34-02/d2-fiber-product-mw-panel-v2.json) -le 1048576
      - name: Upload compact certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-02-d2-fiber-product-mw-panel-v2
          path: |
            stages/stage34/34-02/d2-fiber-product-mw-panel-v2.json
            stages/stage34/34-02/d2-inverse-basepoint-extension.json
          if-no-files-found: warn
          retention-days: 1
