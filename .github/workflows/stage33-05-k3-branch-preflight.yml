name: Stage33-05 retained geometric preflight (NO Q-descent credit)

# HOSTILE-REOPEN SAFETY NOTE
# The historical j2_arithmetic_descent.py output was revoked after its
# Q-defined ell_J2 was proved geometrically trivial in the corrected
# Creutz--Viray quotient. This workflow MUST NOT execute that script, MUST NOT
# execute downstream scripts that consume its positive J2-descent flag, and
# MUST NOT upload j2-arithmetic-descent.json as current evidence.
#
# This workflow now checks only the retained geometric/presentation prefix.
# Current repair authority is j2-representative-repair-state.json plus the
# dedicated Stage33-12/R4 replay. A GREEN run here grants no Q-descent, unit
# closure, downstream-release, theorem, receiver, or endpoint credit.

on:
  pull_request:
    paths:
      - 'stages/stage33/33-05/**'
      - '.github/workflows/stage33-05-k3-branch-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-geometric-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Verify branch factorization, Galois swap, and 8 transverse nodes
        working-directory: stages/stage33/33-05
        run: python branch_galois_check.py
      - name: Verify Creutz-Viray finite dimension skeleton
        working-directory: stages/stage33/33-05
        run: python cv_dimension_check.py
      - name: Materialize common normalization and associated-graded conjugation action
        working-directory: stages/stage33/33-05
        run: python normalization_galois_skeleton.py
      - name: Materialize filtered 5D LcE quotient and two Jac functions
        working-directory: stages/stage33/33-05
        run: python lce_filtered_quotient_skeleton.py
      - name: Materialize low-degree graph quotient function channel
        working-directory: stages/stage33/33-05
        run: python graph_function_lowdegree_search.py
      - name: Synthesize the one residual graph direction in bidegree (2,1)
        working-directory: stages/stage33/33-05
        run: python residual_graph_function_bidegree21.py
      - name: Replace parity-only graph pilots by exact elliptic lifts and materialize extension mixing
        working-directory: stages/stage33/33-05
        run: python cv_exact_graph_lifts_and_galois.py
      - name: Run superseded norm-level two-row pilot for algebraic regression only
        working-directory: stages/stage33/33-05
        run: python xalpha_split_section_rows.py
      - name: Repair true x-alpha pair classes and full-pair Galois action
        working-directory: stages/stage33/33-05
        run: python xalpha_pair_galois_repair.py
      - name: Compute CV-presentation connecting cocycles for geometric quotient basis
        working-directory: stages/stage33/33-05
        run: python descent_presentation_cocycle.py
      - name: Enforce hostile-reopen evidence firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.load(open('stages/stage33/33-05/j2-representative-repair-state.json', encoding='utf-8'))
          assert r['current_leaf'] == 'R4'
          assert r['firewalls']['Q_defined_descent_credit_restored'] is False
          assert r['firewalls']['stage33_05_reclosed'] is False
          assert r['firewalls']['stage33_12_closed_exact'] is False
          assert r['firewalls']['stage33_13_released'] is False
          assert r['firewalls']['theorem_credit'] is False
          assert r['firewalls']['receiver_credit'] is False
          assert r['firewalls']['endpoint_credit'] is False

          # The revoked historical producer remains source-locked history only.
          old = Path('stages/stage33/33-05/j2_arithmetic_descent.py')
          assert old.exists()
          assert not Path('stages/stage33/33-05/j2-arithmetic-descent.json').exists(), (
              'revoked j2-arithmetic-descent.json was regenerated in current workflow'
          )
          print('STAGE33_05_RETAINED_GEOMETRIC_PREFLIGHT_ONLY=PASS')
          print('Q_DEFINED_J2_DESCENT_CREDIT=FORBIDDEN')
          PY

      # Intentionally no artifact upload. In particular, the revoked
      # j2-arithmetic-descent.json must never be republished as fresh evidence.
