name: Stage33-05 K3 branch/Galois preflight

on:
  pull_request:
    paths:
      - 'stages/stage33/33-05/**'
      - '.github/workflows/stage33-05-k3-branch-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-galois-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Verify branch factorization, Galois swap, and 8 transverse nodes
        working-directory: stages/stage33/33-05
        run: python branch_galois_check.py
      - name: Verify Creutz-Viray finite dimension skeleton
        working-directory: stages/stage33/33-05
        run: python cv_dimension_check.py
      - name: Upload exact preflight certificates
        uses: actions/upload-artifact@v4
        with:
          name: stage33-05-k3-branch-preflight
          path: |
            stages/stage33/33-05/branch-galois-certificate.json
            stages/stage33/33-05/cv-dimension-certificate.json
