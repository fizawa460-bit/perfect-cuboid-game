name: Stage35-EX Goal4AJ numerator degree31 three-prime projective CRT gen22

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage35-ex/runkeys/goal4aj-numerator-degree31-three-prime-projective-crt-gen22.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          KEY='stages/stage35-ex/runkeys/goal4aj-numerator-degree31-three-prime-projective-crt-gen22.json'
          SCRIPT='stages/stage35-ex/diagnose_stage35_ex_35_goal4aj_numerator_degree31_three_prime_projective_crt_gen22.py'
          EXPECTED_SCRIPT_BLOB='c3a374a4d93b808c2dff93a912ccc1c79895a5bb'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test "$EVENT" = 'pull_request' || exit 0
          test "$ACTION" = 'synchronize' || exit 0
          test "$PR_NUMBER" = '1698' || exit 0
          test "$HEAD_BRANCH" = 'stage35-ex-goal4aj-degree19-truncated-kernel' || exit 0
          test "$BASE_BRANCH" = 'main' || exit 0
          test -n "$BEFORE" || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || exit 0
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          test "$(git diff --name-only "$BEFORE" "$HEAD" | wc -l)" -eq 1 || exit 0
          git diff --name-only "$BEFORE" "$HEAD" | grep -Fxq "$KEY" || exit 0
          if git cat-file -e "$BEFORE:$KEY" 2>/dev/null; then exit 0; fi
          test "$(git hash-object "$SCRIPT")" = "$EXPECTED_SCRIPT_BLOB" || exit 0
          python - "$KEY" <<'PY'
          import json,sys
          k=json.loads(open(sys.argv[1],encoding='utf-8').read())
          assert k['schema']=='STAGE35_EX_GOAL4AJ_NUMERATOR_DEGREE31_THREE_PRIME_PROJECTIVE_CRT_GEN22_RUNKEY_V1'
          assert k['generation']==1 and k['armed'] is True
          assert k['observed_current_main_sha']=='d5545b32e6b3088bca53318998d434f2745b03e9'
          assert k['branch_merge_base_sha']=='1d7bfd98ef8eab7bd849fe7bfdbcdaf5c0b575e7'
          assert k['script_blob_sha1']=='c3a374a4d93b808c2dff93a912ccc1c79895a5bb'
          assert k['gen21_run']==34189796107 and k['gen21_job']==101945366434
          assert k['gen21_canonical_sha256']=='9a4c8acd3b6c311d521b18787da6943a410836cb4fbfde66e39ec591c930f4dc'
          assert k['gen21_route']=='TWO_PRIME_SUPPORT_MATCHED_BALANCED_RATIONAL_RECONSTRUCTION_INCOMPLETE_THIRD_PRIME_REQUIRED'
          assert k['first_prime']==32009 and k['second_prime']==32057 and k['third_prime']==32089 and k['degree']==31
          assert k['planned_jobs']==1 and k['artifact_upload'] is False
          PY
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  diagnose:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Singular
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends singular
          Singular --version | head -n 3
      - name: Three-prime support, projective CRT, and first exact strict check
        run: |
          set -euo pipefail
          python -u -B stages/stage35-ex/diagnose_stage35_ex_35_goal4aj_numerator_degree31_three_prime_projective_crt_gen22.py | tee /tmp/goal4aj-num31-three-prime-crt-gen22.log
          grep -q '^GOAL4AJ_NUM31_THREE_PRIME_CRT_GEN22_JSON=' /tmp/goal4aj-num31-three-prime-crt-gen22.log
          grep -q '^GOAL4AJ_NUM31_THREE_PRIME_CRT_GEN22=DONE$' /tmp/goal4aj-num31-three-prime-crt-gen22.log
          test "$(wc -c </tmp/goal4aj-num31-three-prime-crt-gen22.log)" -le 65536
