name: Stage33-03 UPic V4 integral action

on:
  pull_request:
    paths:
      - 'stages/stage33/33-03/**'
      - '.github/workflows/stage33-03-upic-v4-action.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  upic-v4-action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact integer algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Materialize pinned cc/ct action from Testa-Stoll
        working-directory: stages/stage33/33-03
        run: python extract_galois_action.py
      - name: Induce exact action on the rank-14 unit lattice and rational Pic(Ubar)
        working-directory: stages/stage33/33-03
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python analyze_upic_action.py
      - name: Certify the complete odd-primary UPic contribution
        working-directory: stages/stage33/33-03
        run: python derive_odd_primary.py
      - name: Bridge Stage32 primitive Picard basis and materialize integral Pic(Ubar) action
        working-directory: stages/stage33/33-03
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python extract_picu_quotient_action.py
      - name: Compute finite V4 hypercohomology with extension data
        working-directory: stages/stage33/33-03
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python compute_v4_hypercohomology.py
      - name: Reduce the absolute two-primary filtration and expose the residual transgression
        working-directory: stages/stage33/33-03
        run: python derive_absolute_two_primary_shape.py
      - name: Compute exact finite V4 Pic(Ubar) H1 and transgression rank envelope
        working-directory: stages/stage33/33-03
        run: python compute_finite_transgression_envelope.py
      - name: Compute exact finite d2 transgression ranks from H1 of the total complex
        working-directory: stages/stage33/33-03
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python compute_finite_transgression_ranks.py
      - name: Upload exact Stage33-03 certificates
        uses: actions/upload-artifact@v4
        with:
          name: stage33-03-upic-v4-action
          path: |
            stages/stage33/33-03/galois-request-summary.json
            stages/stage33/33-03/galois-action-raw.json
            stages/stage33/33-03/galois-magma-stdout.txt
            stages/stage33/33-03/upic-v4-action-certificate.json
            stages/stage33/33-03/odd-primary-closure.json
            stages/stage33/33-03/picu-action-magma-stdout.txt
            stages/stage33/33-03/picu-integral-action.json
            stages/stage33/33-03/v4-hyper-request-summary.json
            stages/stage33/33-03/v4-hyper-magma-stdout.txt
            stages/stage33/33-03/finite-v4-hypercohomology.json
            stages/stage33/33-03/absolute-two-primary-shape.json
            stages/stage33/33-03/finite-transgression-envelope.json
            stages/stage33/33-03/finite-transgression-ranks.json
