name: StructureRadar search07 inspect
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: github.head_ref == 'structure-radar-search-07-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: |
          python - <<'PY'
          import json,pathlib
          r=json.load(open('docs/structure-radar/structure-registry.json'))
          c=next(c for c in r['structures'] if c['structure_id']=='SR-STR-056')
          pathlib.Path('docs/structure-radar/TEMP-search07-cards.json').write_text(json.dumps(c,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/structure-radar/TEMP-search07-cards.json
          git commit -m 'TEMP: materialize SR-STR-056'
          git push origin HEAD:${{ github.head_ref }}
