name: StructureRadar batch22 review helper

on:
  push:
    branches:
      - structure-radar-deep-corpus-batch-22

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build compact review artifacts
        run: |
          python - <<'PY'
          import json,re,math
          from collections import Counter
          from pathlib import Path
          root=Path('.')
          radar=root/'docs/structure-radar'
          q=json.loads((radar/'exploration-queue.json').read_text())
          task=next(t for t in q['tasks'] if t['status']=='READY')
          ids=task['source_ids'][:60]
          assert task['task_id']=='SR-CENSUS-STAGE14_15_DEEP_CORPUS-01'
          assert len(ids)==60 and ids[0]=='SRC-B17EA4CAB19A' and ids[-1]=='SRC-41CD367FBC48'
          sm={}
          for p in sorted((radar/'source-manifest').glob('part-*.json')):
              for s in json.loads(p.read_text())['sources']:
                  if s['source_id'] in ids: sm[s['source_id']]=s
          assert set(sm)==set(ids)
          keyrx=re.compile(r'\b([A-Z][A-Z0-9_]{3,})\s*=\s*([^`\n]+)')
          sig_rx=re.compile(r'(?i)(receiver|obstruction|unresolved|proved|not proved|does not|saving|exponent|theorem|lemma|identity|reduction|boundary|next=|current_|strict_|applicable|counterexample|rank|torsion|height|gcd|prime|gaussian|pell|kummer|dispersion|collision|sieve)')
          boundary=[]; texts={}
          for sid in ids:
              s=sm[sid]; txt=(root/s['path']).read_text(errors='replace') if (root/s['path']).exists() else ''; texts[sid]=txt
              lines=txt.splitlines(); title=next((x.strip('# ').strip() for x in lines if x.strip().startswith('#')), '')
              kv=[]
              for ln in lines:
                  for m in keyrx.finditer(ln):
                      item=f'{m.group(1)}={m.group(2).strip()}'
                      if item not in kv: kv.append(item)
              sig=[]
              for ln in lines:
                  st=' '.join(ln.strip().split())
                  if st and sig_rx.search(st) and st not in sig: sig.append(st[:360])
                  if len(sig)>=18: break
              boundary.append({'source_id':sid,'path':s['path'],'kind':s['kind'],'title':title,'boundary':kv[-45:],'signals':sig})
          (radar/'.batch22-boundary-pack.json').write_text(json.dumps({'task':task['task_id'],'count':len(ids),'sources':boundary},indent=2,ensure_ascii=False)+'\n')
          reg=json.loads((radar/'structure-registry.json').read_text())['structures']
          stop=set('the a an and or of to in for with on from is are be this that as by at it its stage current result true false proved proof receiver next complete physical fixed power saving theorem structure batch main route merged audit'.split())
          def toks(x):
              x=re.sub(r'([a-z0-9])([A-Z])',r'\1 \2',x)
              return [w for w in re.findall(r'[A-Za-z0-9]+',x.lower()) if len(w)>=3 and w not in stop and not w.isdigit()]
          card_tokens={}; df=Counter()
          for c in reg:
              text=' '.join([c.get('canonical_math_name',''),c.get('exact_equations_or_object',''),' '.join(c.get('theorem_species',[])),' '.join(c.get('search_terms_primary',[])),' '.join(c.get('search_terms_aliases',[]))])
              ct=Counter(toks(text)); card_tokens[c['structure_id']]=ct
              for w in ct: df[w]+=1
          N=len(reg)
          def score(st,ct): return sum((1+math.log(st[w]))*(1+math.log(ct[w]))*math.log((N+1)/(df[w]+1)+1) for w in set(st)&set(ct))
          candidates=[]
          for sid in ids:
              s=sm[sid]; st=Counter(toks(texts[sid]))
              ranked=sorted(((score(st,card_tokens[c['structure_id']]),c['structure_id'],c['canonical_math_name']) for c in reg), reverse=True)[:8]
              named=[]
              for m in re.finditer(r'\b[A-Z][A-Za-z0-9]*(?:[A-Z][A-Za-z0-9]*){2,}\b',texts[sid]):
                  v=m.group(0)
                  if len(v)>18 and v not in named: named.append(v)
                  if len(named)>=12: break
              candidates.append({'source_id':sid,'path':s['path'],'kind':s['kind'],'named_objects':named,'top_cards':[{'score':round(sc,2),'id':i,'name':n} for sc,i,n in ranked]})
          (radar/'.batch22-candidates.json').write_text(json.dumps({'count':len(candidates),'sources':candidates},indent=2,ensure_ascii=False)+'\n')
          bm={x['source_id']:x for x in boundary}; lines=['# idx | source | path | top5 | named | locked']
          for i,x in enumerate(candidates,1):
              b=bm[x['source_id']]; top=','.join(c['id'] for c in x['top_cards'][:5]); named=';'.join(x['named_objects'][:4]) or '-'; locked=[]
              for kv in b.get('boundary',[]):
                  u=kv.upper()
                  if any(k in u for k in ['CURRENT_PHYSICAL','STRICT_SUB','SQRT_B','NEW_WHOLE','POWER_SAVING_PROVED','RECEIVER_PROVED','THEOREM_PROVED','BLOCKED','NEXT=']): locked.append(kv)
              if not locked:
                  for sline in b.get('signals',[]):
                      u=sline.upper()
                      if any(k in u for k in ['REMAINING_RECEIVER','CURRENT_PHYSICAL_UPPER_BOUND','PROVED\": FALSE','PROVED\": TRUE']): locked.append(sline)
                      if len(locked)>=5: break
              lines.append(f'{i:02d} | {x["source_id"]} | {x["path"]} | {top} | {named} | ' + ' ; '.join(locked[:7]))
          (radar/'.batch22-one-line.txt').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/structure-radar/.batch22-boundary-pack.json docs/structure-radar/.batch22-candidates.json docs/structure-radar/.batch22-one-line.txt
          if ! git diff --cached --quiet; then
            git commit -m "Build StructureRadar batch22 review artifacts"
            git push origin HEAD:structure-radar-deep-corpus-batch-22
          fi
