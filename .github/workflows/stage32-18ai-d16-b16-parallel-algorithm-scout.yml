name: Stage32-18AI d16 b16 parallel algorithm scout

on:
  push:
    branches: [stage32-18ai-b16-parallel-algorithm-scout]
    paths: ['stages/stage32/runkeys/18ai-b16-parallel-algorithm-scout.json']

permissions: {contents: read, actions: read}
concurrency: {group: stage32-18ai-b16-parallel-algorithm-scout, cancel-in-progress: true}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs: {matrix: '${{ steps.k.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Require dedicated ARM commit
        run: |
          set -euo pipefail
          KEY=stages/stage32/runkeys/18ai-b16-parallel-algorithm-scout.json
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1 && test "${changed[0]}" = "$KEY"
          test "$(git log -1 --pretty=%s)" = 'Stage32-18AI: ARM B16 PARALLEL ALGORITHM SCOUT'
      - id: k
        run: |
          python - <<'PY'
          import json,pathlib,os
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18ai-b16-parallel-algorithm-scout.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1' and d['armed'] and d['bound']==16
          assert d['source_exact_artifact_id']==9574308138 and d['source_18ah_run_id']==33119402575
          assert d['shard_count']==1024 and d['secondary_split_coordinate']==48 and d['node_cap']==6000000
          assert d['max_parallel']==6 and d['allow_finer_split'] is False
          alg=['baseline','pairwise-deep','lower48-reverse']; walls=[(436,5),(922,13)]
          inc=[{'algo':a,'primary':p,'secondary':s,'tag':f'{a}-p{p}-s{s}'} for a in alg for p,s in walls]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':inc},separators=(',',':'))+'\n')
          PY

  scout:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build exact scout variant
        env: {GH_TOKEN: '${{ github.token }}', ALGO: '${{ matrix.algo }}', PRIMARY: '${{ matrix.primary }}'}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++ libboost-dev
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/source.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/src"
          python stages/stage32/32-18X/build_two_stage_certifier.py --source "$RUNNER_TEMP/src/d16-exact-symmetry-sharded.cpp" --output "$RUNNER_TEMP/work/cert.cpp" --primary-id "$PRIMARY"
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AF/patch_symmetry_schedule.py
          if [ "$ALGO" = pairwise-deep ]; then SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AI/patch_pairwise_deep.py; fi
          if [ "$ALGO" = lower48-reverse ]; then SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AI/patch_lower48_reverse.py; fi
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic "$RUNNER_TEMP/work/cert.cpp" -o "$RUNNER_TEMP/work/cert"
          cp "$RUNNER_TEMP/src/d16-hperp.txt" "$RUNNER_TEMP/work/"; cp "$RUNNER_TEMP/src/d16-aut-prefix256-bundle.txt" "$RUNNER_TEMP/work/"
      - name: Run scout ${{ matrix.tag }}
        env: {ALGO: '${{ matrix.algo }}', PRIMARY: '${{ matrix.primary }}', SECONDARY: '${{ matrix.secondary }}', TAG: '${{ matrix.tag }}'}
        run: |
          set -euo pipefail; set +e
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" timeout --signal=TERM --kill-after=20s 15m "$RUNNER_TEMP/work/cert" --input "$RUNNER_TEMP/work/d16-hperp.txt" --bundle "$RUNNER_TEMP/work/d16-aut-prefix256-bundle.txt" --output "$RUNNER_TEMP/out/cert.json" --dump-canonical "$RUNNER_TEMP/out/dump.bin" --bound 16 --shard-id "$SECONDARY" --shard-count 1024 --split-coordinate 48 --node-cap 6000000 >"$RUNNER_TEMP/out/stdout.txt" 2>"$RUNNER_TEMP/out/stderr.txt"
          rc=$?; set -e
          STATUS=COMPLETE
          if [ "$rc" -ne 0 ]; then if grep -q 'exact traversal node cap exceeded' "$RUNNER_TEMP/out/stderr.txt"; then STATUS=RESOURCE_WALL_NODE_CAP; elif [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$rc" -eq 143 ]; then STATUS=RESOURCE_WALL_WALLCLOCK; else STATUS=UNEXPECTED_FAILURE; fi; fi
          export STATUS
          python - <<'PY'
          import json,os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'; cert={}
          if (r/'cert.json').exists():
              try: cert=json.loads((r/'cert.json').read_text())
              except: cert={}
          rt=float((r/'runtime.txt').read_text().strip().splitlines()[-1]) if (r/'runtime.txt').exists() and (r/'runtime.txt').read_text().strip() else None
          out={'schema':'STAGE32_18AI_B16_PARALLEL_SCOUT_RESULT_V1','algorithm':os.environ['ALGO'],'tag':os.environ['TAG'],'primary_residue':int(os.environ['PRIMARY']),'secondary_shard':int(os.environ['SECONDARY']),'status':os.environ['STATUS'],'runtime_seconds':rt,'nodes':cert.get('nodes'),'exact_symmetry_prune_checks':cert.get('exact_symmetry_prune_checks'),'exact_symmetry_prunes':cert.get('exact_symmetry_prunes'),'pairwise_symmetry_checks':cert.get('pairwise_symmetry_checks'),'pairwise_symmetry_prunes':cert.get('pairwise_symmetry_prunes'),'canonical_survivors_including_zero':cert.get('canonical_survivors_including_zero'),'D16_B16_NUMERICAL_CREDIT':False}
          (r/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          test "$STATUS" != UNEXPECTED_FAILURE
      - uses: actions/upload-artifact@v4
        with: {name: 'stage32-18ai-${{ matrix.tag }}-g1', path: '${{ runner.temp }}/out/', retention-days: 7, if-no-files-found: error}

  summarize:
    needs: scout
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'stage32-18ai-*-g1', path: '${{ runner.temp }}/runs'}
      - run: |
          python - <<'PY'
          import json,os,pathlib
          docs=[json.loads(p.read_text()) for p in (pathlib.Path(os.environ['RUNNER_TEMP'])/'runs').rglob('compact.json')]; assert len(docs)==6
          by={}
          for d in docs: by.setdefault(d['algorithm'],[]).append(d)
          assert set(by)=={'baseline','pairwise-deep','lower48-reverse'}
          def metrics(xs):
              complete=sum(x['status']=='COMPLETE' for x in xs)
              nodes=sum((x['nodes'] or 6000000) for x in xs)
              runtime=sum((x['runtime_seconds'] or 900) for x in xs)
              return {'complete':complete,'nodes':nodes,'runtime_seconds':runtime}
          def score(xs):
              m=metrics(xs)
              return (-m['complete'],m['nodes'],m['runtime_seconds'])
          ranking=sorted(by,key=lambda a:(score(by[a]),a))
          best_observed=ranking[0]
          baseline=metrics(by['baseline'])
          def beats_baseline_for_promotion(algo):
              if algo=='baseline':
                  return False
              m=metrics(by[algo])
              progress_better=m['complete']>baseline['complete']
              resource_no_worse=m['nodes']<=baseline['nodes'] and m['runtime_seconds']<=baseline['runtime_seconds']
              resource_strictly_better=m['nodes']<baseline['nodes'] or m['runtime_seconds']<baseline['runtime_seconds']
              return progress_better and resource_no_worse and resource_strictly_better
          promotable=[a for a in ranking if beats_baseline_for_promotion(a)]
          promotable_winner=promotable[0] if promotable else 'NONE'
          if promotable_winner=='NONE':
              verdict='NO_PROMOTABLE_CHALLENGER_REDIRECT'
              next_item='32-18AJ-D16-B16-ALGORITHM-REDIRECTION'
          else:
              verdict='PROMOTABLE_CHALLENGER_FOUND'
              next_item='32-18AJ-D16-B16-PROMOTE-SCOUT-WINNER'
          out={'schema':'STAGE32_18AI_B16_PARALLEL_ALGORITHM_SCOUT_SUMMARY_V2','verdict':verdict,'best_observed_algorithm':best_observed,'promotable_winner':promotable_winner,'promotion_criterion':'non-baseline challenger must improve exact completion progress and use no more nodes/runtime than baseline, with a strict resource improvement','metrics':{a:metrics(by[a]) for a in sorted(by)},'ranking':ranking,'results':sorted(docs,key=lambda d:(d['algorithm'],d['primary_residue'])),'next_item':next_item,'D16_B16_NUMERICAL_CREDIT':False,'GLOBAL_B16_AGGREGATION_COMPLETE':False,'FULL_D16_G0_ROW_COMPLETE':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False,'CONTROLLER_MODIFIED':False}
          o=pathlib.Path(os.environ['RUNNER_TEMP'])/'summary'; o.mkdir(); (o/'stage32-18ai-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps({'best_observed_algorithm':best_observed,'promotable_winner':promotable_winner,'ranking':ranking,'next_item':next_item}))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: stage32-18ai-parallel-algorithm-scout-summary-g2, path: '${{ runner.temp }}/summary/', retention-days: 14, if-no-files-found: error}
