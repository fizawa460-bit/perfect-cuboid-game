name: Stage35-EX Goal4Z boundary incidence probe

on:
  pull_request:
    paths:
      - 'stages/stage35-ex/probe_goal4z_boundary_incidence.py'
      - '.github/workflows/stage35-ex-goal4z-boundary-probe.yml'

jobs:
  probe-goal4z-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 320
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sympy
        run: python -m pip install --disable-pip-version-check sympy
      - name: Print exact boundary incidence
        run: python -B stages/stage35-ex/probe_goal4z_boundary_incidence.py
