name: Stage14-4cn reciprocal Edwards reduction

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4cn/**'
      - 'stages/stage14/scripts/14-4/reciprocal_edwards_reduction_audit.py'
      - 'stages/stage14/data/14-4/reciprocal_edwards_reduction_summary.json'
      - '.github/workflows/stage14-4cn-reciprocal-edwards-reduction.yml'
      - 'stages/stage14/14-4cm/**'
      - 'stages/stage14/14-s7-27/**'
      - 'stages/stage14/scripts/14-s7-27/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage14-4cn audit
        run: python stages/stage14/scripts/14-4/reciprocal_edwards_reduction_audit.py

      - name: Compile Stage14-4cn audit
        run: python -m py_compile stages/stage14/scripts/14-4/reciprocal_edwards_reduction_audit.py

      - name: Run merged s7-27 regression
        run: python stages/stage14/scripts/14-s7-27/full_signed_quotient_curve_audit.py

      - name: Lock predecessor boundaries
        run: |
          grep -Fq 'STAGE14_4CM=COMPLETE_QUADRATIC_BRANCH_ELIMINATION_AND_TOP_THETA_SIGNED_LINEAR_QUOTIENT_REDUCTION' stages/stage14/14-4cm/result.md
          grep -Fq 'STAGE14_S7_27=COMPLETE_FULL_SIGNED_QUOTIENT_DIVISOR_COLLAPSE_AND_RECIPROCAL_BIQUADRATIC_REDUCTION' stages/stage14/14-s7-27/result.md
          grep -Fq 'FIXED_RESIDUAL_FULL_SIGNED_QUOTIENT_QUADRUPLE_MULTIPLICITY=Bo1' stages/stage14/14-s7-27/result.md
          grep -Fq 'RECIPROCAL_RATIO_BIDEGREE_2_2_CURVE_PROVED=true' stages/stage14/14-s7-27/result.md

      - name: Lock Stage14-4cn theorem boundary
        run: |
          f=stages/stage14/14-4cn/result.md
          grep -Fq 'STAGE14_4CN=COMPLETE_PRIMITIVE_RATIO_INJECTIVITY_AND_RECIPROCAL_EDWARDS_SINGULAR_SMOOTH_SPLIT' "$f"
          grep -Fq 'RATIO_TO_FOUR_ODD_MODULI_FIBER=1' "$f"
          grep -Fq 'ORIGINAL_SCALE_EQUATION_IS_FILTER_NOT_MULTIPLICITY=true' "$f"
          grep -Fq 'RECIPROCAL_EDWARDS_NORMAL_FORM_PROVED=true' "$f"
          grep -Fq 'ONLY_PHYSICAL_SINGULAR_VALUE=4' "$f"
          grep -Fq 'LAMBDA4_FACTORIZATION_PROVED=true' "$f"
          grep -Fq 'SMOOTH_BRANCH_GENUS=1' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/8' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=true' "$f"
          grep -Fq 'MAINLINE_BLOCKED_BY_H=false' "$f"
          grep -Fq 'MAINLINE_H_REQUESTED_OBJECT=PhysicalReciprocalEdwardsGenusOneAverageIncidence' "$f"
          grep -Fq 'NEXT=Stage14-4co' "$f"
