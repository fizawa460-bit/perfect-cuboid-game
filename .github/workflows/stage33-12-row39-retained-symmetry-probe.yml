name: Stage33-12 row39 retained symmetry probe

on:
  pull_request:
    paths:
      - 'stages/stage33/33-12/probe_j2_order4_row39_retained_symmetry_v11.py'
      - '.github/workflows/stage33-12-row39-retained-symmetry-probe.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Exact retained symmetry probe
        run: python stages/stage33/33-12/probe_j2_order4_row39_retained_symmetry_v11.py
      - name: Diff check
        run: git diff --check
