name: Stage14-X8 two-thirds minimax

on:
  pull_request:
    paths:
      - 'stages/stage14/14-X8/**'
      - 'stages/stage14/data/14-X8/**'
      - 'stages/stage14/scripts/14-X8/**'
      - '.github/workflows/stage14-X8-two-thirds-minimax.yml'
      - 'stages/stage14/14-X7/**'
      - 'stages/stage14/14-s7-30/**'
      - 'stages/stage14/14-4cq/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage14-X8 minimax audit
        run: python stages/stage14/scripts/14-X8/two_sided_dual_cayley_minimax_audit.py

      - name: Compile Stage14-X8 audit
        run: python -m py_compile stages/stage14/scripts/14-X8/two_sided_dual_cayley_minimax_audit.py

      - name: Run merged Stage14-X7 regression
        run: python stages/stage14/scripts/14-X7/gaussian_quotient_resultant_audit.py

      - name: Run merged Stage14-s7-30 regression
        run: python stages/stage14/scripts/14-s7-30/two_sided_common_core_root_pair_audit.py

      - name: Run merged Stage14-4cq regression
        run: python stages/stage14/scripts/14-4/dual_common_core_cayley_audit.py

      - name: Lock predecessor boundaries
        run: |
          grep -Fq 'STAGE14_X7=COMPLETE_SELF_GENERATED_FOUR_ROOT_UNCHARGING_AND_GAUSSIAN_QUOTIENT_RESULTANT_REDUCTION' stages/stage14/14-X7/result.md
          grep -Fq 'STAGE14_S7_30=COMPLETE_TWO_SIDED_COMMON_CORE_QUADRATIC_ROOT_PAIR_COUNT_AND_11_16_BOUND' stages/stage14/14-s7-30/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=11/16' stages/stage14/14-s7-30/result.md
          grep -Fq 'COMMON_CORE_SCALE_EXPONENT=2*theta+2*phi-3/4' stages/stage14/14-s7-30/result.md
          grep -Fq 'STAGE14_4CQ=COMPLETE_DUAL_COMMON_CORE_CAYLEY_DIVISOR_COLLAPSE_AND_SYMMETRIC_QUARTER_QUARTER_REDUCTION' stages/stage14/14-4cq/result.md
          grep -Fq 'ALTERNATIVE_DUAL_CAYLEY_BLOCK_EXPONENT=1/2+2phi-c' stages/stage14/14-4cq/result.md
          grep -Fq 'DUAL_COMMON_CORE_CAYLEY_DIVISOR_LOCK_PROVED=true' stages/stage14/14-4cq/result.md

      - name: Lock Stage14-X8 theorem boundary
        run: |
          f=stages/stage14/14-X8/result.md
          grep -Fq 'STAGE14_X8=COMPLETE_TWO_SIDED_DUAL_CAYLEY_MINIMAX_AND_TWO_THIRDS_PROMOTION' "$f"
          grep -Fq 'MERGED_X7_IMPORTED=true' "$f"
          grep -Fq 'MERGED_S7_30_IMPORTED=true' "$f"
          grep -Fq 'MERGED_4CQ_IMPORTED=true' "$f"
          grep -Fq 'S7_30_BLOCK_EXPONENT=max(theta+phi+1/8,1-2theta)' "$f"
          grep -Fq 'S7_30_COMMON_CORE_SCALE_PIN=c=2theta+2phi-3/4' "$f"
          grep -Fq 'DUAL_CAYLEY_BLOCK_EXPONENT_AFTER_SCALE_PIN=5/4-2theta' "$f"
          grep -Fq 'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=2/3' "$f"
          grep -Fq 'IMPROVEMENT_OVER_11_16=1/48' "$f"
          grep -Fq 'TWO_THIRDS_SATURATION_REQUIRES_THETA=7/24' "$f"
          grep -Fq 'TWO_THIRDS_SATURATION_REQUIRES_PHI=1/4' "$f"
          grep -Fq 'TWO_THIRDS_SATURATION_COMMON_CORE_EXPONENT=1/3' "$f"
          grep -Fq 'S7_30_THETA_5_16_BARRIER_SUPERSEDED=true' "$f"
          grep -Fq 'FOUR_CQ_SYMMETRIC_QUARTER_QUARTER_BARRIER_SUPERSEDED=true' "$f"
          grep -Fq 'REMAINING_RECEIVER=Theta7Over24QuarterPhiCommonGcdCayleyGaussianQuotientEnergy' "$f"
          grep -Fq 'X8_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'SQRT_B_UPPER_BOUND_PROVED=false' "$f"
          grep -Fq 'NEXT_RECOMMENDED=Stage14-X9' "$f"
