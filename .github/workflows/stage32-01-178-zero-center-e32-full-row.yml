name: Stage32 32-01-178 zero-center e32 full-row exact replay

# lifecycle: ACTIVE_AUTO
# Current 178 frontier only; retire immediately after exact-head replay.
on:
  push:
    branches:
      - stage32-01-178-post-td02-fibration-nef
    paths:
      - 'stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_zero_center_e32_full_x4_row.py'
      - '.github/workflows/stage32-01-178-zero-center-e32-full-row.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-01-178-zero-center-e32-full-row-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - name: Exact complete g1-d192 e32 x4 row via zero-center closed form
        run: python stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_zero_center_e32_full_x4_row.py
      - name: Diff hygiene
        run: git diff --check
