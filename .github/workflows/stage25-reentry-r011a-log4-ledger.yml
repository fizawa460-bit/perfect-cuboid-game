name: Stage25 reentry r011a log4 geometric ledger

on:
  pull_request:
    paths:
      - 'stages/stage25/25-reentry-r011a/**'
      - 'stages/stage21/post-stage25-r011a.md'
      - 'stages/stage22/post-stage25-r011a.md'
      - 'stages/stage25/25-reentry-controller.json'
      - '.github/workflows/stage25-reentry-r011a-log4-ledger.yml'
  workflow_dispatch:

jobs:
  verify-r011a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage25 reentry r011a geometric log4 ledger
        run: python stages/stage25/25-reentry-r011a/verify_r011a.py
