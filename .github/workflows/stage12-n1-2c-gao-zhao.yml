name: Stage12-N1-2c Gao-Zhao audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage12-n1-2c-gao-zhao
    paths:
      - "scripts/audit_gao_zhao_compatibility_stage12_n1_2c.py"
      - "data/gao_zhao_compatibility_stage12_n1_2c_report.json"
      - "docs/stage12-n1-2c-gao-zhao.md"
      - ".github/workflows/stage12-n1-2c-gao-zhao.yml"
  pull_request:
    paths:
      - "scripts/audit_gao_zhao_compatibility_stage12_n1_2c.py"
      - "data/gao_zhao_compatibility_stage12_n1_2c_report.json"
      - "docs/stage12-n1-2c-gao-zhao.md"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run compatibility audit
        run: |
          python -m py_compile scripts/audit_gao_zhao_compatibility_stage12_n1_2c.py
          python scripts/audit_gao_zhao_compatibility_stage12_n1_2c.py --write-report /tmp/report.json
          diff -u data/gao_zhao_compatibility_stage12_n1_2c_report.json /tmp/report.json
