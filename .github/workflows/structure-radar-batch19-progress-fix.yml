name: StructureRadar batch19 progress fix

on:
  push:
    branches:
      - structure-radar-deep-corpus-batch-19
    paths:
      - .github/structure-radar-batch19-progress-fix-trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Move batch19 into audit_batches and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/structure-radar/progress.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          batch_id = 'SR-BATCH-STAGE14_15_DEEP_CORPUS-19-R01'

          batches = data.get('batches')
          if not isinstance(batches, list):
              raise SystemExit('top-level batches is missing or not a list')
          matches = [b for b in batches if b.get('batch_id') == batch_id]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one batch19 object in batches, got {len(matches)}')
          if len(batches) != 1:
              raise SystemExit(f'expected top-level batches to contain only batch19, got {len(batches)} objects')

          audit_batches = data.get('audit_batches')
          if not isinstance(audit_batches, list):
              raise SystemExit('audit_batches is missing or not a list')
          if any(b.get('batch_id') == batch_id for b in audit_batches):
              raise SystemExit('batch19 already present in audit_batches')

          batch = matches[0]
          audit_batches.append(batch)
          del data['batches']

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          reread = json.loads(path.read_text(encoding='utf-8'))
          assert 'batches' not in reread
          assert reread['audit_batches'][-1]['batch_id'] == batch_id
          assert sum(1 for b in reread['audit_batches'] if b.get('batch_id') == batch_id) == 1
          print('PROGRESS_SCHEMA_FIX=PASS')
          PY
          python scripts/structure_radar.py verify
          git diff --check
      - name: Remove one-shot helper and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/structure-radar-batch19-progress-fix.yml .github/structure-radar-batch19-progress-fix-trigger.txt
          git add docs/structure-radar/progress.json
          git diff --cached --check
          git commit -m 'StructureRadar batch19: normalize progress audit ledger'
          git push origin HEAD:structure-radar-deep-corpus-batch-19
