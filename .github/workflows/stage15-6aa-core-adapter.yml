name: Stage15-6aa Gaussian core adapter

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6aa/**'
      - 'stages/stage15/evidence/stage15_6aa_core_adapter.json'
      - 'stages/stage15/replay/verify_stage15_6aa.py'
      - 'stages/stage15/scripts/stage15_6aa_core_adapter.py'
      - '.github/workflows/stage15-6aa-core-adapter.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6aa two-channel core adapter
        run: python stages/stage15/replay/verify_stage15_6aa.py
