name: Stage32 post1648AY S4 extension nonsplitting

on:
  push:
    branches:
      - stage32-scratch-post1648ay-s4-complement-splitting

permissions:
  contents: read

jobs:
  diagnose-ay-s4-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact scratch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install exact diagnostic dependency
        run: python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run AY S4 extension nonsplitting diagnostic
        run: python3 -B stages/stage32/residual-32-01-production/diagnose_stage32_post1648ay_s4_complement_splitting.py | tee /tmp/ay.json
      - name: Assert exact nonsplitting
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/ay.json'))
          assert x['mode']=='SCRATCH_POST1648AY_S4_EXTENSION_NONSPLITTING'
          assert x['retained_group_order']==1536
          assert x['kernel_order']==64
          assert x['quotient_order']==24
          assert all(n>0 for n in x['coxeter_involutive_lift_candidate_counts'])
          assert x['coxeter_candidate_triple_count']>0
          assert x['full_coxeter_triple_count']==0
          assert x['extension_split'] is False
          assert x['bounded_negative']=='NO_S4_COMPLEMENT_IN_THE_RETAINED_1536_EXTENSION_OVER_THE_EXACT_WC_BLOCK_QUOTIENT'
          assert x['firewalls']['full_1536_source_to_retained_group_isomorphism_verified'] is False
          assert x['firewalls']['explicit_48_node_bijection_obtained'] is False
          print(json.dumps({
            'lift_counts':x['coxeter_involutive_lift_candidate_counts'],
            'candidate_triples':x['coxeter_candidate_triple_count'],
            'commuting_pairs':x['commuting_s1_s3_lift_pair_count'],
            's12_pairs':x['s1_s2_order3_lift_pair_count'],
            's23_pairs':x['s2_s3_order3_lift_pair_count'],
            'full_coxeter_triples':x['full_coxeter_triple_count'],
            'next_exact_route':x['next_exact_route'],
          },sort_keys=True))
          PY
      - name: Diff hygiene
        run: test -z "$(git status --porcelain)"
