name: Stage33-07 mixed-order exceptional ambient lifts

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/materialize_mixed_order_side_ambient_function_lifts.py'
      - 'stages/stage33/33-07/materialize_mixed_order_exceptional_ambient_tangent_function_lifts.py'
      - 'stages/stage33/33-07/record_mixed_order_ambient_boundary_progress.py'
      - 'stages/stage33/33-07/certify_order2_quotient_raw_order4_bockstein.py'
      - 'stages/stage33/33-07/certify_exceptional_p1_tangent_coordinates.py'
      - 'stages/stage33/33-07/order2-first-residue-function-liftability.json'
      - 'stages/stage33/33-07/exceptional-p1-tangent-coordinates.json'
      - 'stages/stage33/33-07/br0b-boundary-raw-residue-map.json'
      - 'stages/stage33/33-07/br0g-finite-ramified-residue-presentation.json'
      - 'stages/stage33/33-07/two-primary-residue-invariant-basis.json'
      - '.github/workflows/stage33-07-mixed-order-exceptional-ambient-lifts.yml'
  workflow_dispatch:

concurrency:
  group: stage33-07-authoritative-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: gate
        env: {EVENT: '${{ github.event_name }}', ACTION: '${{ github.event.action }}', BEFORE: '${{ github.event.before }}', HEAD: '${{ github.event.pull_request.head.sha }}', WORKFLOW_REF: '${{ github.workflow_ref }}'}
        run: python .github/scripts/stage33_commit_range_gate.py
  certify:
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact integer algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Reproduce full mixed-order Bockstein certificate
        working-directory: stages/stage33/33-07
        run: python certify_order2_quotient_raw_order4_bockstein.py
      - name: Reproduce side ambient rational-function lifts
        working-directory: stages/stage33/33-07
        run: python materialize_mixed_order_side_ambient_function_lifts.py
      - name: Materialize exceptional ambient tangent rational-function lifts
        working-directory: stages/stage33/33-07
        run: python materialize_mixed_order_exceptional_ambient_tangent_function_lifts.py
      - name: Record historical all-72 ambient boundary progress if handoff is still V10
        working-directory: stages/stage33/33-07
        run: python record_mixed_order_ambient_boundary_progress.py
      - name: Validate conservative exceptional progress
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import hashlib,json
          p='mixed-order-exceptional-ambient-tangent-function-lifts.json'
          x=json.load(open(p)); h=x.pop('canonical_sha256')
          actual=hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert h==actual
          assert x['mixed_order_partition']=={'raw_order2':17,'raw_order4':9}
          assert x['counts']['source_count']==26
          assert x['counts']['exceptional_component_count']==48
          assert len(x['exceptional_ambient_projection_models'])==48
          assert x['counts']['nontrivial_source_exceptional_function_count']==120
          assert all(x['exact_checks'].values())
          prog=x['constructive_progress']
          assert prog['all_72_boundary_component_function_packages_have_explicit_ambient_or_blowup_rational_lifts']
          # This producer is historical support evidence only.  Its local progress
          # object predates the later Gersten-existence-by-purity promotion and
          # must not be used to overwrite the authoritative handoff.
          assert prog['global_geometric_Gersten_lifts_materialized_count']==0
          assert prog['global_geometric_Gersten_lifts_required_count']==26
          assert prog['off_boundary_codimension1_residue_certificates_materialized_count']==0
          assert not prog['project_14x26_L_squareclass_tensor_materialized']
          assert not prog['absolute_delta_loc_computed'] and not prog['arithmetic_HS_closed']
          hand=json.load(open('handoff.json'))
          assert hand['stage33_progress']=='6/11' and not hand['stage33_08_released']
          assert hand['schema'].startswith('STAGE33_07_REAUDIT_BLOCKED_HANDOFF_V10_') or hand['schema'].startswith('STAGE33_07_REAUDIT_BLOCKED_HANDOFF_V11_') or hand['schema'].startswith('STAGE33_07_REAUDIT_BLOCKED_HANDOFF_V12_')
          print('STAGE33_07_EXCEPTIONAL_AMBIENT_TANGENT_LIFTS=PASS')
          print('CERTIFICATE_SHA256='+h)
          print('ALL_72_BOUNDARY_PACKAGES_AMBIENTIZED=true')
          print('AUTHORITATIVE_HANDOFF_SCHEMA='+hand['schema'])
          PY
      - name: Upload exceptional ambient tangent lift atlas
        uses: actions/upload-artifact@v4
        with:
          name: stage33-07-mixed-order-exceptional-ambient-lifts
          retention-days: 3
          path: |
            stages/stage33/33-07/mixed-order-side-ambient-function-lifts.json
            stages/stage33/33-07/mixed-order-exceptional-ambient-tangent-function-lifts.json
