name: Stage15-6af cross resultant

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6af/**'
      - 'stages/stage15/evidence/stage15_6af_cross_resultant.json'
      - 'stages/stage15/replay/verify_stage15_6af.py'
      - 'stages/stage15/scripts/stage15_6af_cross_resultant.py'
      - '.github/workflows/stage15-6af-cross-resultant.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6af cross resultant
        run: python stages/stage15/replay/verify_stage15_6af.py
      - name: Compile Stage15-6af utility
        run: python -m py_compile stages/stage15/scripts/stage15_6af_cross_resultant.py stages/stage15/replay/verify_stage15_6af.py
