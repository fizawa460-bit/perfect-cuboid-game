name: Stage14-num-alpha11-diag5 family clusters

on:
  pull_request:
    paths:
      - 'stages/stage14/14-num-alpha11-diag5/**'
      - 'stages/stage14/data/14-num-alpha11-diag5/**'
      - 'stages/stage14/scripts/14-num-alpha11-diag5/**'
      - '.github/workflows/stage14-num-alpha11-diag5-family-clusters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cluster-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute diag5
        run: python stages/stage14/scripts/14-num-alpha11-diag5/family_cluster_dependence.py > /tmp/diag5.json
      - name: Verify frozen summary
        run: |
          python - <<'PY'
          import json
          got=json.load(open('/tmp/diag5.json'))
          lock=json.load(open('stages/stage14/data/14-num-alpha11-diag5/cluster_summary.json'))
          assert got['source_rows']==lock['source_rows']==3495
          assert got['global_direction_counts']==lock['global_direction_counts']=={'a':1374,'b':1371,'c':750}
          assert got['same_diagonal']['distinct_d']==lock['same_diagonal']['distinct_d']==3325
          assert got['same_diagonal']['repeated_d']==lock['same_diagonal']['repeated_d']==166
          assert got['same_diagonal']['max_objects_per_d']==lock['same_diagonal']['max_objects_per_d']==3
          assert got['primitive_face_graph_clusters']['connected_components']==lock['primitive_face_graph_clusters']['connected_components']==1703
          assert got['primitive_face_graph_clusters']['max_component_edges']==lock['primitive_face_graph_clusters']['max_component_edges']==95
          assert got['primitive_face_graph_clusters']['duplicate_graph_edges']==0
          pairs=[
            (got['decision']['RAW_LATE_SHIFT_L2'],lock['late_shell_300_400_vs_400_500']['raw_shift_l2']),
            (got['decision']['EQUAL_D_LATE_SHIFT_L2'],lock['late_shell_300_400_vs_400_500']['equal_weight_per_d_shift_l2']),
            (got['decision']['EQUAL_COMPONENT_LATE_SHIFT_L2'],lock['late_shell_300_400_vs_400_500']['equal_weight_per_component_shift_l2']),
          ]
          for a,b in pairs: assert abs(a-b)<1e-14,(a,b)
          assert got['decision']['SAME_DIAGONAL_MULTIPLICITY_MATERIALLY_REDUCES_LATE_SHIFT'] is False
          assert got['decision']['GRAPH_COMPONENT_EQUAL_WEIGHT_MATERIALLY_REDUCES_LATE_SHIFT'] is False
          assert got['decision']['FEW_LARGEST_COMPONENTS_DRIVE_LATE_SHIFT'] is False
          assert got['interpretation_boundary']['graph_component_equals_true_parametric_family_claim'] is False
          assert got['interpretation_boundary']['asymptotic_claim'] is False
          PY
      - name: Check result contract
        run: |
          grep -q 'SAME_DIAGONAL_MULTIPLICITY_MATERIALLY_REDUCES_LATE_SHIFT=false' stages/stage14/14-num-alpha11-diag5/result.md
          grep -q 'GRAPH_COMPONENT_EQUAL_WEIGHT_MATERIALLY_REDUCES_LATE_SHIFT=false' stages/stage14/14-num-alpha11-diag5/result.md
          grep -q 'FEW_LARGEST_COMPONENTS_DRIVE_LATE_SHIFT=false' stages/stage14/14-num-alpha11-diag5/result.md
          grep -q 'NEXT=Stage14-num-alpha11-diag6' stages/stage14/14-num-alpha11-diag5/result.md
