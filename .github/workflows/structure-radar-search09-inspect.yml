name: StructureRadar search09 inspect
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: github.head_ref == 'structure-radar-search-09-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Materialize compact final cards
        run: |
          python - <<'PY'
          import json, pathlib
          ids={'SR-STR-071','SR-STR-072'}
          r=json.load(open('docs/structure-radar/structure-registry.json'))
          cards=[]
          for c in r['structures']:
            if c['structure_id'] in ids:
              cards.append({k:c.get(k) for k in ['structure_id','canonical_math_name','exact_equations_or_object','search_terms_primary','search_terms_aliases','theorem_species','target_populations','potential_weapon_types','applicability_gaps','existing_radar_overlap','search_status','arsenal_decision','card_status']})
          assert len(cards)==2
          pathlib.Path('docs/structure-radar/TEMP-search09-final-cards.json').write_text(json.dumps(cards,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/structure-radar/TEMP-search09-final-cards.json
          git commit -m 'TEMP: materialize final StructureRadar search09 cards'
          git push origin HEAD:${{ github.head_ref }}
