name: Stage32-21au narrow-coordinate exact disjoint split

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stage32-21au-narrow-coordinate-disjoint-split.yml'
      - 'stages/stage32/32-21/32-21ap-unknown-frontier.json'
      - 'stages/stage32/residual-32-01-production/certify_stage32_21au_narrow_coordinate_split.py'
      - 'stages/stage32/residual-32-01-production/certify_stage32_21at_lll_preconditioned_unknown.py'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_21ak_affine_2adic_membership.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'

permissions:
  contents: read

concurrency:
  group: stage32-21au-narrow-split-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'

      - name: Install exact algebra and SMT dependencies
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.13.4.0'

      - name: Exhaust the narrowest exact reduced coordinate
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python certify_stage32_21au_narrow_coordinate_split.py \
            --frontier "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21ap-unknown-frontier.json" \
            --retained "$GITHUB_WORKSPACE/stages/stage33/33-07/picard_base_rows_retained.py" \
            --marking "$GITHUB_WORKSPACE/stages/stage33/33-07/stage32_picard_marking_retained.py" \
            --branch-timeout-ms 25000 \
            --output "$GITHUB_WORKSPACE/stage32-21au-narrow-coordinate-disjoint-split.json"

      - name: Upload compact exact branch evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-21au-narrow-coordinate-disjoint-split
          path: stage32-21au-narrow-coordinate-disjoint-split.json
          retention-days: 3
          compression-level: 9
