name: StructureRadar batch14 finalize
on:
  push:
    branches: [structure-radar-deep-corpus-batch-14]
    paths:
      - '.github/structure-radar-batch-14-finalize-trigger.txt'
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize batch14 and verify
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          batch='SR-BATCH-STAGE14_15_DEEP_CORPUS-14-R01'
          task='SR-CENSUS-STAGE14_15_DEEP_CORPUS-01'
          items=json.loads((root/'.github/structure-radar-batch-14-summary.json').read_text())
          assert len(items)==60
          # 1-based source index -> normalized existing structure IDs.
          mp={
            1:['SR-STR-200','SR-STR-201'],
            2:['SR-STR-202'],3:['SR-STR-202'],4:['SR-STR-201'],5:['SR-STR-202'],
            6:['SR-STR-201'],7:['SR-STR-201'],8:['SR-STR-202'],9:['SR-STR-201'],
            10:['SR-STR-202'],11:['SR-STR-202'],12:['SR-STR-200','SR-STR-202'],
            13:['SR-STR-205'],
            14:['SR-STR-203'],15:['SR-STR-203'],16:['SR-STR-203'],17:['SR-STR-203'],18:['SR-STR-203'],
            19:['SR-STR-204'],20:['SR-STR-204'],21:['SR-STR-204'],
            22:['SR-STR-205'],23:['SR-STR-205'],24:['SR-STR-205'],
            26:['SR-STR-205'],27:['SR-STR-205'],28:['SR-STR-205'],29:['SR-STR-205'],30:['SR-STR-205'],
            31:['SR-STR-206'],32:['SR-STR-206'],33:['SR-STR-206'],34:['SR-STR-206'],35:['SR-STR-206'],36:['SR-STR-206'],
            37:['SR-STR-206','SR-STR-207'],38:['SR-STR-207'],39:['SR-STR-207'],40:['SR-STR-207'],
            41:['SR-STR-208'],42:['SR-STR-208'],43:['SR-STR-208'],44:['SR-STR-208'],
            45:['SR-STR-209'],46:['SR-STR-209'],47:['SR-STR-209'],48:['SR-STR-209'],
            49:['SR-STR-209','SR-STR-210'],50:['SR-STR-210'],51:['SR-STR-210'],52:['SR-STR-210'],53:['SR-STR-210'],
            54:['SR-STR-212'],55:['SR-STR-212'],56:['SR-STR-212'],57:['SR-STR-212'],58:['SR-STR-212'],59:['SR-STR-212'],60:['SR-STR-212']
          }
          assert set(mp)==set(range(1,61))-{25}
          progress_path=root/'docs/structure-radar/progress.json'
          prog=json.loads(progress_path.read_text())
          reviews=prog['source_reviews']
          for x in items:
            n=x['n']; sid=x['source_id']
            rec={'fingerprint':x['fingerprint'],'batch_id':batch}
            if n==25:
              rec['status']='NO_DISTINCT_STRUCTURE'
            else:
              rec['status']='STRUCTURES_RECORDED'; rec['structure_ids']=mp[n]
            reviews[sid]=rec
          prog['audit_batches']=[b for b in prog.get('audit_batches',[]) if b.get('batch_id')!=batch]
          prog['audit_batches'].append({
            'batch_id':batch,'task_id':task,'status':'SUBMITTED_FOR_AUDIT',
            'source_ids':[x['source_id'] for x in items],
            'sources_reviewed':60,'structures_added':0,'structures_updated':12,
            'structure_carrier_sources':59,'structures_deduped':1,
            'searches_completed':0,'arsenal_decisions':0,'audit_required':True,
            'duplicate_source':0,'no_distinct_structure':1
          })
          progress_path.write_text(json.dumps(prog,indent=2,ensure_ascii=False)+'\n')
          reg_path=root/'docs/structure-radar/structure-registry.json'
          reg=json.loads(reg_path.read_text())
          reg['status']='BATCH_SUBMITTED_FOR_AUDIT'
          cards={c['structure_id']:c for c in reg['structures']}
          used=set()
          for x in items:
            if x['n']==25: continue
            for cid in mp[x['n']]:
              used.add(cid); c=cards[cid]
              prov=c.setdefault('repo_provenance',[])
              if not any(p.get('source_id')==x['source_id'] for p in prov):
                prov.append({'source_id':x['source_id'],'path':x['path'],'locator':x['title'] or 'batch14 normalized Stage14 s7 source','fingerprint':x['fingerprint']})
          assert used=={'SR-STR-200','SR-STR-201','SR-STR-202','SR-STR-203','SR-STR-204','SR-STR-205','SR-STR-206','SR-STR-207','SR-STR-208','SR-STR-209','SR-STR-210','SR-STR-212'}
          historical_note='Batch14 Stage14-s7 historical whole-family exponents are superseded by the current square-root exponent 1/2; only the reusable exact mechanism/provenance is normalized here, with no strict sub-square-root claim.'
          for cid in used:
            gaps=cards[cid].setdefault('applicability_gaps',[])
            if historical_note not in gaps: gaps.append(historical_note)
            cards[cid]['card_status']='SUBMITTED_FOR_AUDIT'
          reg_path.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python scripts/verify_research_arsenal.py
          git diff --check
          rm -f .github/structure-radar-batch-14-summary.json \
                .github/structure-radar-batch-14-summary.txt \
                .github/structure-radar-batch-14-trigger.txt \
                .github/structure-radar-batch-14-finalize-trigger.txt \
                .github/workflows/structure-radar-batch-14-select.yml \
                .github/workflows/structure-radar-batch-14-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'StructureRadar batch14 normalize Stage14 s7 corpus' || exit 0
          git push
