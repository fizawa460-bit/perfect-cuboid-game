name: Stage32EX5 HPADJ22 fast bands0-6 scratch recovery
on:
  push:
    branches: [stage32ex5-hpadj22-speedup-scratch-20260918]
    paths:
      - 'stages/stage32-ex5/runkeys/hpadj22-fast06-scratch.json'
      - '.github/workflows/stage32-ex5-hpadj22-fast06-scratch.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: stage32ex5-hpadj22-fast06-scratch
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          KEY='stages/stage32-ex5/runkeys/hpadj22-fast06-scratch.json'
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || exit 0
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          git show "$BEFORE:$KEY" > /tmp/old.json 2>/dev/null || exit 0
          git diff --name-only "$BEFORE" "$HEAD_SHA" | grep -Fxq "$KEY" || exit 0
          python - <<'PY' || exit 0
          import json
          d=json.load(open('stages/stage32-ex5/runkeys/hpadj22-fast06-scratch.json'))
          raise SystemExit(0 if d.get('armed') is True else 1)
          PY
          python - <<'PY'
          import json, subprocess
          old=json.load(open('/tmp/old.json'))
          new=json.load(open('stages/stage32-ex5/runkeys/hpadj22-fast06-scratch.json'))
          assert old['schema']==new['schema']=='STAGE32EX5_HPADJ22_FAST06_SCRATCH_RUNKEY_V1'
          assert int(new['generation'])==int(old['generation'])+1
          assert new['armed'] is True
          assert new['resource']['max_parallel']==4
          assert new['resource']['user_parallel_budget']==10
          assert int(new['resource']['timeout_minutes'])==300

          expected_matrix=[(0,8),(1,8),(2,8),(3,8),(4,8),(5,9),(6,20)]
          got_matrix=[(int(x['band']),int(x['start'])) for x in new['matrix']]
          assert got_matrix==expected_matrix

          locks=new['source_locks']
          expected_paths={
              'fast_worker':'stages/stage32-ex5/hpadj-22_ex5/run_full_bband_fast.py',
              'row_range':'stages/stage32-ex5/hpadj-22_ex5/run_fast_row_range.py',
              'assembler':'stages/stage32-ex5/hpadj-22_ex5/assemble_fast_band.py',
              'h21_cert':'stages/stage32-ex5/hpadj-22_ex5/HPADJ21-FULL178-CELL-CERT.json',
          }
          for key,path in expected_paths.items():
              assert locks[key]['path']==path
              actual=subprocess.check_output(['git','rev-parse',f'HEAD:{path}'],text=True).strip()
              assert actual==locks[key]['blob_sha1'], (key,actual,locks[key]['blob_sha1'])
          assert locks['h21_cert']['canonical']=='fd276094f4647ecdc348e18a376e2d61313b782cdb23659890707726707ed13a'
          assert int(locks['carry_run']['run_id'])==35303482505
          assert locks['carry_run']['exact_head']=='c066f8dbb3312a5626e47554ec83530c42288465'
          PY

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35303482505" > /tmp/carry-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35303482505/artifacts?per_page=100" > /tmp/carry-artifacts.json
          python - <<'PY'
          import json
          key=json.load(open('stages/stage32-ex5/runkeys/hpadj22-fast06-scratch.json'))
          run=json.load(open('/tmp/carry-run.json'))
          assert int(run['id'])==int(key['source_locks']['carry_run']['run_id'])
          assert run['head_sha']==key['source_locks']['carry_run']['exact_head']
          assert run['status']=='completed'

          payload=json.load(open('/tmp/carry-artifacts.json'))
          arts={a['name']:a for a in payload['artifacts']}
          for rec in key['matrix']:
              band=int(rec['band'])
              a=arts[f'hpadj22-band-{band}']
              assert int(a['id'])==int(rec['artifact_id']), (band,a['id'],rec['artifact_id'])
              assert a.get('digest')==rec['digest'], (band,a.get('digest'),rec['digest'])
              assert not a.get('expired',False), (band,'expired')
          PY
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  bands:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {band: 0, start: 8}
          - {band: 1, start: 8}
          - {band: 2, start: 8}
          - {band: 3, start: 8}
          - {band: 4, start: 8}
          - {band: 5, start: 9}
          - {band: 6, start: 20}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.10.6'}
      - uses: actions/download-artifact@v4
        with:
          name: hpadj22-band-${{ matrix.band }}
          path: carry
          run-id: 35303482505
          github-token: ${{ github.token }}
      - name: Compute fast remaining rows
        run: |
          mkdir -p fast
          python stages/stage32-ex5/hpadj-22_ex5/run_fast_row_range.py \
            --band-position ${{ matrix.band }} --row-start ${{ matrix.start }} --row-stop 177 \
            --output-dir fast
      - name: Assemble complete exact band
        run: |
          mkdir -p out
          python stages/stage32-ex5/hpadj-22_ex5/assemble_fast_band.py \
            --band-position ${{ matrix.band }} --carry-dir carry --fast-dir fast --output-dir out
          python stages/stage32-ex5/hpadj-22_ex5/run_full_bband.py \
            --band-position ${{ matrix.band }} --output-dir out --verify-complete out
      - uses: actions/upload-artifact@v4
        with:
          name: hpadj22-fast-band-${{ matrix.band }}-complete-scratch
          path: out/
          retention-days: 3
