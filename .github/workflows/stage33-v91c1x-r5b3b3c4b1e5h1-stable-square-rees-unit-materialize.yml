name: Stage33 V91C1X C4B1E5H1 stable-square Rees unit materialize

on:
  push:
    branches:
      - stage33-v91c1x-r5b3b3c4b1e-1757-refinement-unit-preflight
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b1e5h1-stable-square-rees-unit-materialize.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e5h1_stable_square_transition_rees_unit_attachment.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e5h-square17-swap23-square-root-transition-preflight.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Materialize exact C4B1E5H1 Rees-unit attachment
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e5h1_stable_square_transition_rees_unit_attachment.py --write
      - name: Enforce artifact-only bounded delta
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e5h1-stable-square-transition-rees-unit-attachment.json'
          changed="$(git status --porcelain | sed 's/^...//')"
          test -n "$changed"
          test "$changed" = "$artifact"
          git diff --check
      - name: Commit generated certificate
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e5h1-stable-square-transition-rees-unit-attachment.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$artifact"
          git diff --cached --quiet || git commit -m '[Stage33] materialize C4B1E5H1 stable-square Rees unit artifact'
          git push
