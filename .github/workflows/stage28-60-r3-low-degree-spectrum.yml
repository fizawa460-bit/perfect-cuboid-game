name: Stage28-60-r3 low-degree K3 spectrum

on:
  pull_request:
    paths:
      - '.github/workflows/stage28-60-r3-low-degree-spectrum.yml'
      - 'stages/stage28/28-60-r3/**'
      - 'stages/stage14/scripts/14-4/shimada_stage14_identify.py'
      - 'stages/stage14/scripts/14-4/shimada_stage14_refine.py'
      - 'stages/stage14/scripts/14-4/shimada_stage14_equiv.py'
  workflow_dispatch:

jobs:
  low-degree-spectrum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install exact lattice enumerator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pari-gp
      - name: Download official Shimada level-4 data
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            'https://home.hiroshima-u.ac.jp/ichiro-shimada/preprints/X0X3/PreprintX0X3/compdata/compdata.zip' \
            -o /tmp/shimada.zip
          unzip -q /tmp/shimada.zip -d /tmp/shimada
      - name: Identify Stage14 physical classes
        run: |
          python stages/stage14/scripts/14-4/shimada_stage14_identify.py \
            /tmp/shimada --out /tmp/identify.json > /tmp/identify.log
      - name: Refine physical labeling
        run: |
          python stages/stage14/scripts/14-4/shimada_stage14_refine.py \
            /tmp/shimada /tmp/identify.json --out /tmp/refine.json
      - name: Prove surviving labelings equivalent under AutX0f
        run: |
          python stages/stage14/scripts/14-4/shimada_stage14_equiv.py \
            /tmp/shimada /tmp/refine.json --out /tmp/equiv.json
      - name: Probe anti-invariant norms and low-degree obstruction
        run: |
          python stages/stage28/28-60-r3/anti_invariant_norm_probe.py \
            /tmp/shimada /tmp/refine.json /tmp/equiv.json \
            --out /tmp/low-degree-spectrum.json
      - name: Assert odd-degree obstruction and print M6 diagnostic
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/low-degree-spectrum.json'))
          assert d['status']=='PASS'
          assert d['physical_labelings_equivalent_under_AutX0f'] is True
          assert d['anti_invariant_rank']==6
          assert d['anti_invariant_positive_form_determinant']==256
          assert d['every_anti_invariant_norm_divisible_by_4'] is True
          assert d['odd_degree_required_residue_mod4']==2
          assert d['all_odd_physical_M_degrees_excluded_subject_to_branch_firewall'] is True
          assert d['M_degree_5_excluded_subject_to_branch_firewall'] is True
          assert d['M_degree_6_excluded_by_mod4'] is False
          print('STAGE28_60_R3_ODD_M_DEGREE_OBSTRUCTION=PASS')
          print('STAGE28_60_R3_M5_OBSTRUCTION=PASS')
          print('L40_M_DEGREE_HISTOGRAM=',d['distinguished_L40_diagnostic']['M_degree_histogram'])
          print('L40_M6_INDICES=',d['distinguished_L40_diagnostic']['M_degree_6_indices_1based'])
          print('M6_REMAINS_COMPLETE_CLASSIFICATION_GATE=true')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage28-60-r3-low-degree-spectrum
          path: |
            /tmp/identify.json
            /tmp/refine.json
            /tmp/equiv.json
            /tmp/low-degree-spectrum.json
