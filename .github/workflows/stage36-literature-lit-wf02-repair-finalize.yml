name: Stage36 literature LIT-WF02 repair finalizer

on:
  push:
    branches:
      - arsenal-stage36-literature-strengthening-implementation

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize repaired LIT-WF02 metadata
        run: python3 -B docs/arsenal/_lit_wf02_repair_finalize.py

      - name: Regenerate Arsenal card and catalog
        run: python3 -B docs/arsenal/sync_arsenal_catalog.py

      - name: Run fail-closed adversarial self-check
        shell: bash
        run: |
          python3 -m py_compile docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py
          out="$(python3 -B docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py --self-check)"
          echo "$out"
          grep -q '^SELF_CHECK_OK:' <<<"$out"
          if grep -q '^PASS:' <<<"$out"; then
            echo 'self-check must not emit applicability PASS' >&2
            exit 1
          fi

      - name: Remove temporary repair machinery
        run: |
          rm -f docs/arsenal/_lit_wf02_repair_finalize.py
          rm -f .github/workflows/stage36-literature-lit-wf02-repair-finalize.yml

      - name: Validate repaired tree
        run: |
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          git diff --check
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          base = 'e758e05953df2cf8cd4ab26ac1e9d72374e99760'
          idx = json.loads(Path('docs/arsenal/index.json').read_text())
          c = json.loads(Path('docs/arsenal/lit-wf02-global-h1-localization-reciprocity-contract.json').read_text())
          s = idx['stage36_literature_strengthening']
          wf = s['workflow_metadata']['LIT-WF02']
          assert c['schema'] == 'LIT-WF02-GLOBAL-H1-LOCALIZATION-RECIPROCITY-CONTRACT-V2'
          assert c['package_schema'] == 'LIT-WF02-GLOBAL-H1-LOCALIZATION-PACKAGE-V2'
          assert c['self_check_is_applicability_pass'] is False
          assert c['current_stage36_applicability_status'] == 'FAIL_CLOSED_MISSING_GLOBAL_CLASS_AND_LOCALIZATION_ADAPTER_EVIDENCE'
          assert c['phase3_freeze_blob_sha'] == 'd3f90093c0a6655da9874c9141b15ab4682c4409'
          assert wf['support_artifact_blob_sha'] == '6fc62623ee59b4aaf1fc053ad42df2dcbba0855b'
          assert wf['verifier_blob_sha'] == 'ee066a55f95184916c02dc1f1bbd9f07d1840dc8'
          assert wf['adapter_status'] == 'FAIL_CLOSED_MISSING_GLOBAL_CLASS_AND_LOCALIZATION_ADAPTER_EVIDENCE'
          assert wf['self_check_is_applicability_pass'] is False
          assert wf['boolean_flags_are_proof_evidence'] is False
          assert s['implementation_manifest']['research_gaps'] == [
              'GLOBAL-HILBERT-SELMER-COMPATIBILITY-TERMINAL',
              'S36-PW03/B12 exact Loughran-Salgado hypothesis match',
              'S36-PW04 chart-to-global-H1 adapter',
              'S36-PW06 full-MW basis/saturation only if stronger claim attempted',
              'B01 source subgroup equivalence',
          ]
          for key in ['STAGE36_PROGRESS_INCREMENT','STAGE36_THEOREM_CREDIT_INCREMENT','RECEIVER_CLOSURE_INCREMENT','MW_CLOSURE_INCREMENT','LOCAL_GLOBAL_OBSTRUCTION_INCREMENT','ENDPOINT_CREDIT_INCREMENT']:
              assert s['credit_firewall'][key] == 0
          card = Path('docs/arsenal/cards/workflows/LIT-WF02.md').read_text()
          assert 'FAIL_CLOSED_MISSING_GLOBAL_CLASS_AND_LOCALIZATION_ADAPTER_EVIDENCE' in card
          assert 'SELF_CHECK_OK' in card
          assert 'never proof evidence by itself' in card
          changed = set(subprocess.check_output(['git','diff','--name-only',base], text=True).splitlines())
          expected = {
              'docs/arsenal/cards/workflows/LIT-WF02.md',
              'docs/arsenal/catalog.md',
              'docs/arsenal/index.json',
              'docs/arsenal/lit-wf02-global-h1-localization-reciprocity-contract.json',
              'docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py',
              'docs/stage36-literature-strengthening-promotion.md',
          }
          assert changed == expected, (changed, expected)
          print('PASS: repaired LIT-WF02 tree, Phase3 gaps, and zero-credit firewall')
          PY

      - name: Commit repaired final state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[Arsenal][Literature][Stage36] repair LIT-WF02 fail-close evidence gate'

      - name: Exact committed-head validation
        shell: bash
        run: |
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          python3 -m py_compile docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py
          out="$(python3 -B docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py --self-check)"
          echo "$out"
          grep -q '^SELF_CHECK_OK:' <<<"$out"
          if grep -q '^PASS:' <<<"$out"; then exit 1; fi
          git diff --check HEAD^ HEAD
          test -z "$(git status --porcelain)"
          test ! -e docs/arsenal/_lit_wf02_repair_finalize.py
          test ! -e .github/workflows/stage36-literature-lit-wf02-repair-finalize.yml
          python3 - <<'PY'
          import subprocess
          base = 'e758e05953df2cf8cd4ab26ac1e9d72374e99760'
          changed = set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'], text=True).splitlines())
          expected = {
              'docs/arsenal/cards/workflows/LIT-WF02.md',
              'docs/arsenal/catalog.md',
              'docs/arsenal/index.json',
              'docs/arsenal/lit-wf02-global-h1-localization-reciprocity-contract.json',
              'docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py',
              'docs/stage36-literature-strengthening-promotion.md',
          }
          assert changed == expected, (changed, expected)
          print('PASS: exact repaired committed head')
          print('EXACT_HEAD=' + subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          PY

      - name: Push exact validated repair head
        run: git push origin HEAD:arsenal-stage36-literature-strengthening-implementation
