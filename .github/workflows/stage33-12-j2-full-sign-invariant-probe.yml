name: Stage33 J2 order4 state sync
on:
  push:
    branches: [stage33-12-j2-ptsK-qPicK-continuation]
    paths: [.github/workflows/stage33-12-j2-full-sign-invariant-probe.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sync compact state
        run: |
          set -euo pipefail
          python3 stages/stage33/33-12/certify_j2_order4_brauer_lift_reduction.py
          python3 stages/stage33/33-12/_tmp_sync_j2_order4_leaf.py
          python3 stages/stage33/33-12/verify_j2_order4_brauer_lift_reduction.py
          python3 stages/stage33/sync_main_state.py
          python3 stages/stage33/sync_main_state.py --check
          rm stages/stage33/33-12/_tmp_sync_j2_order4_leaf.py
          rm .github/workflows/stage33-12-j2-full-sign-invariant-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage33: narrow J2 adapter to four order4 rows"
          git push origin HEAD:stage33-12-j2-ptsK-qPicK-continuation
