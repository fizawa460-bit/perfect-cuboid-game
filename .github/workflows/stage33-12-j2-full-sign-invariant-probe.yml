name: Stage33 J2 order4 state sync

on:
  push:
    branches:
      - stage33-12-j2-ptsK-qPicK-continuation
    paths:
      - .github/workflows/stage33-12-j2-full-sign-invariant-probe.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Sync order4 leaf state and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage33/33-12/certify_j2_order4_brauer_lift_reduction.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          ROOT = Path('.')
          S = ROOT / 'stages/stage33'
          cert_path = S / '33-12/j2-order4-brauer-lift-reduction.json'
          cert = json.loads(cert_path.read_text())
          assert cert['canonical_sha256'] == 'a524121930e1c712bd8d8220415ef1836b11cd6eb11f2bb44f70dc844f6d85b0'
          assert cert['next_numeric_leaf']['materialize_additional_BigK_pullback_rows_1based'] == [20,35,39,67]

          verifier = r'''#!/usr/bin/env python3
          from __future__ import annotations
          from fractions import Fraction
          import hashlib
          import json
          from pathlib import Path

          HERE = Path(__file__).resolve().parent
          CERT = HERE / "j2-order4-brauer-lift-reduction.json"
          ORIENTATION = HERE / "j2-cv-d2-semantic-orientation.json"
          SEMANTIC = HERE / "j2-semantic-kc-picard-basis.json"
          U1 = HERE / "j2-semantic-u1-full-surface-smith-source.json"

          def csha(obj):
              return hashlib.sha256(json.dumps(obj, sort_keys=True, separators=(",", ":")).encode()).hexdigest()

          obj = json.loads(CERT.read_text())
          body = dict(obj); claimed = body.pop("canonical_sha256")
          assert claimed == "a524121930e1c712bd8d8220415ef1836b11cd6eb11f2bb44f70dc844f6d85b0" == csha(body)
          ori = json.loads(ORIENTATION.read_text())
          sem = json.loads(SEMANTIC.read_text())
          u1 = json.loads(U1.read_text())
          for src, key in [
              (ori, "semantic_orientation_sha256"),
              (sem, "semantic_picard_basis_sha256"),
              (u1, "semantic_u1_full_surface_smith_source_sha256"),
          ]:
              b = dict(src); got = b.pop("canonical_sha256")
              assert got == obj["source_locks"][key] == csha(b)
          frac = ori["anti_isometry_check"]["generator_image_semantic_fractional_coordinates"]
          coeff4 = [int(Fraction(x) * 4) for x in frac]
          assert coeff4 == obj["semantic_order4_generator"]["fourfold_integer_coefficients"]
          ind = sem["upstream_source_lock"]["indlistK_1based"]
          terms = [[ind[i], coeff4[i]] for i in range(20) if coeff4[i] % 4]
          assert terms == obj["semantic_order4_generator"]["BigK_terms_row_and_coefficient_mod4"]
          doubled = [ind[i] for i,c in enumerate(coeff4) if c & 1]
          assert doubled == [2,4,9,10,47,49] == u1["semantic_u1_pullback"]["BigK_support_1based"]
          extra = [r for r,_ in terms if r not in doubled]
          assert extra == [20,35,39,67]
          assert obj["promotion_firewall"]["proper_Br2_14D_coordinate_materialized"] is False
          print(json.dumps({"success": True, "canonical_sha256": claimed, "additional_rows": extra}, sort_keys=True))
          '''
          # De-indent the raw embedded script.
          lines = verifier.splitlines()
          verifier = '\n'.join((line[10:] if line.startswith('          ') else line) for line in lines).lstrip() + '\n'
          (S / '33-12/verify_j2_order4_brauer_lift_reduction.py').write_text(verifier)

          controller_path = S / 'controller.json'
          c = json.loads(controller_path.read_text())
          c['schema'] = 'STAGE33_BRAUER_EXPLICIT_DAG_CONTROLLER_V50_J2_ORDER4_LIFT_FOUR_ROW_REDUCTION'
          cur = c['current']
          cur['substep'] = 'MATERIALIZE_CORRECTED_J2_ORDER4_LIFT_ADDITIONAL_PULLBACK_ROWS'
          cur['active_missing_interface'] = 'CORRECTED_J2_ORDER4_DUAL_LIFT_TO_FULL_SURFACE_PROPER_BR2_PARITY_ADAPTER'
          cur['next_exact_leaf'] = 'MATERIALIZE_BIGK_ROWS_20_35_39_67_THEN_COMPUTE_Z4_EQUALS_N4_PMPIC_OVER4_AND_Y4_EQUALS_Z4V_TEST_PROPER14_RETAINED10_PLACE_TARGET'
          s = c['stage33_12']
          s['corrected_J2_order4_lift_reduction_certificate'] = 'stages/stage33/33-12/j2-order4-brauer-lift-reduction.json'
          s['corrected_J2_order4_lift_reduction_certificate_sha256'] = cert['canonical_sha256']
          s['corrected_J2_order4_required_BigK_pullback_rows_1based'] = [2,4,9,10,20,35,39,47,49,67]
          s['corrected_J2_order4_reuse_BigK_pullback_rows_1based'] = [2,4,9,10,47,49]
          s['corrected_J2_order4_missing_BigK_pullback_rows_1based'] = [20,35,39,67]
          s['corrected_J2_order4_terms_row_and_coefficient_mod4'] = [[2,1],[4,3],[9,3],[10,1],[20,2],[35,2],[39,2],[47,3],[49,3],[67,2]]
          s['corrected_J2_order4_candidate_dual_normalization'] = 'n4=sum(c_j*MatKtoS[row_j]); z4=(n4*pmPic)/4 integral; y4=z4*V; candidate proper14=y4_nontrivial mod2, then require cc/ct invariance and retained10 membership'
          s['minimal_missing_exact_datum'] = 'FOUR_ORDER4_BIGK_PULLBACK_ROWS_20_35_39_67_AND_LIFT_PARITY_REPLAY'
          c['execution']['next_item'] = 'Stage33-12_33-13_MATERIALIZE_ORDER4_BIGK_ROWS_20_35_39_67_THEN_TEST_PROPER14_PARITY'
          c['loop_state']['last_cycle_route_status'] = 'PASS_J2_ORDER4_LIFT_ROUTE_REDUCED_TO_FOUR_ADDITIONAL_ROWS'
          c['loop_state']['last_new_view'] = 'Named J2 beta1=t1/8 is lift-sensitive: transport the order-4 generator t1/4, not only its doubled u1=t1/2 class. Its semantic support needs ten BigK rows; six are already retained and the only new rows are [20,35,39,67]. These four had coefficient 1/2 and disappeared after doubling, explaining the prior zero finite-pairing dead end. Proper14 remains unpromoted until z4/y4 integrality, cc/ct invariance, and retained10 membership pass.'
          c['next_item'] = c['execution']['next_item']
          controller_path.write_text(json.dumps(c, indent=2) + '\n')

          sync_path = S / 'sync_main_state.py'
          t = sync_path.read_text()
          t = t.replace(
              'U1_DUAL_BLOCKER = HERE / "33-12" / "j2-semantic-u1-at2-to-proper-br2-dual-adapter-blocker.json"\nOUT = HERE / "MAIN-STATE.json"',
              'U1_DUAL_BLOCKER = HERE / "33-12" / "j2-semantic-u1-at2-to-proper-br2-dual-adapter-blocker.json"\nORDER4 = HERE / "33-12" / "j2-order4-brauer-lift-reduction.json"\nOUT = HERE / "MAIN-STATE.json"')
          t = t.replace(
              '    U1_DUAL_BLOCKER: "f5d1336e21dd5563ec6466811b5e1c3cacc6def17e4dbe4968023d9bd3756399",\n}',
              '    U1_DUAL_BLOCKER: "f5d1336e21dd5563ec6466811b5e1c3cacc6def17e4dbe4968023d9bd3756399",\n    ORDER4: "a524121930e1c712bd8d8220415ef1836b11cd6eb11f2bb44f70dc844f6d85b0",\n}')
          t = t.replace(
              'u1_dual_blocker = locked(U1_DUAL_BLOCKER)\n\ncurrent = controller["current"]',
              'u1_dual_blocker = locked(U1_DUAL_BLOCKER)\norder4 = locked(ORDER4)\n\ncurrent = controller["current"]')
          t = t.replace(
              'assert missing_dual["proper_Br2_14D_coordinate_materialized"] is False\n\ncoordinates = target["coordinates_f2"]',
              'assert missing_dual["proper_Br2_14D_coordinate_materialized"] is False\nassert order4["next_numeric_leaf"]["materialize_additional_BigK_pullback_rows_1based"] == [20, 35, 39, 67]\nassert order4["promotion_firewall"]["proper_Br2_14D_coordinate_materialized"] is False\n\ncoordinates = target["coordinates_f2"]')
          t = t.replace('"schema": "STAGE33_MAIN_COMPACT_STATE_V3"', '"schema": "STAGE33_MAIN_COMPACT_STATE_V4"')
          needle = '''        "semantic_u1_to_proper_Br2_dual_blocker": {
            "copied_A_T_2_coefficients_rejected": True,
            "copied_dual_cc_invariance_defect_f2": shortcut["copied_vector_cc_invariance_defect_f2"],
            "active_missing_interface": missing_dual["name"],
            "certificate": "stages/stage33/33-12/j2-semantic-u1-at2-to-proper-br2-dual-adapter-blocker.json",
            "canonical_sha256": LOCKS[U1_DUAL_BLOCKER],
        },
'''
          insert = needle + '''        "j2_order4_brauer_lift_reduction": {
            "materialized": True,
            "required_BigK_rows_1based": order4["semantic_order4_generator"]["required_BigK_rows_1based"],
            "reuse_rows_1based": order4["next_numeric_leaf"]["reuse_already_materialized_BigK_rows_1based"],
            "missing_rows_1based": order4["next_numeric_leaf"]["materialize_additional_BigK_pullback_rows_1based"],
            "candidate_normalization": order4["candidate_full_surface_brauer_lift_normalization"],
            "certificate": "stages/stage33/33-12/j2-order4-brauer-lift-reduction.json",
            "canonical_sha256": LOCKS[ORDER4],
        },
'''
          assert needle in t
          t = t.replace(needle, insert, 1)
          t = t.replace(
              '        "A_T_2_coefficients_to_proper_dual_shortcut": {',
              '''        "order4_lift_reduction": {
            "status": "RESOLVED_EXACT_NEXT_NUMERIC_LEAF_FOUR_ROWS_ONLY",
            "fact": "Transporting t1/4 instead of only doubled u1=t1/2 exposes exactly four additional required BigK rows [20,35,39,67]; no repo-wide search is required.",
            "source_certificate": "stages/stage33/33-12/j2-order4-brauer-lift-reduction.json",
            "source_canonical_sha256": LOCKS[ORDER4],
        },
        "A_T_2_coefficients_to_proper_dual_shortcut": {''', 1)
          t = t.replace('"required_BigK_pullback_rows_missing_1based": [],', '"required_BigK_pullback_rows_missing_1based": [20, 35, 39, 67],', 1)
          t = t.replace('"active_missing_interface": missing_dual["name"],', '"active_missing_interface": current["active_missing_interface"],', 1)
          t = t.replace(
              '        "retained_full_surface_Magma_Smith_right_transform_V_retained": True,\n        "active_missing_interface": current["active_missing_interface"],',
              '        "retained_full_surface_Magma_Smith_right_transform_V_retained": True,\n        "order4_lift_reduction_materialized": True,\n        "order4_missing_BigK_pullback_rows_1based": [20, 35, 39, 67],\n        "active_missing_interface": current["active_missing_interface"],')
          a = t.index('    "current_leaf_working_set": [')
          b = t.index('    "targeted_expansion_hints": {', a)
          new_ws = '''    "current_leaf_working_set": [
        "stages/stage33/33-12/j2-order4-brauer-lift-reduction.json",
        "stages/stage33/33-12/certify_j2_order4_brauer_lift_reduction.py",
        "stages/stage33/33-12/verify_j2_order4_brauer_lift_reduction.py",
        "stages/stage33/33-12/j2-semantic-u1-full-surface-smith-source.json",
        "stages/stage33/33-07/proper-brauer2-from-discriminant.json",
        "stages/stage33/33-12/full-surface-pic2-kummer-target.json",
    ],
'''
          t = t[:a] + new_ws + t[b:]
          t = t.replace(
              '        "proper_dual_adapter_blocker": "stages/stage33/33-12/j2-semantic-u1-at2-to-proper-br2-dual-adapter-blocker.json",',
              '        "proper_dual_adapter_blocker": "stages/stage33/33-12/j2-semantic-u1-at2-to-proper-br2-dual-adapter-blocker.json",\n        "order4_lift_reduction": "stages/stage33/33-12/j2-order4-brauer-lift-reduction.json",')
          sync_path.write_text(t)

          result_path = S / '33-12/result.md'
          r = result_path.read_text()
          marker = '## Named J2 order-4 Brauer lift reduction — exact'
          if marker not in r:
              r += '''\n\n## Named J2 order-4 Brauer lift reduction — exact\n\nThe remaining proper-Br2 adapter is lift-sensitive. The marked class is `beta1=t1/8`, so the relevant transported discriminant datum is the order-4 generator `t1/4`, not only its doubled order-2 class `u1=t1/2`. In the semantic PicK basis, `t1/4` uses BigK rows `[2,4,9,10,20,35,39,47,49,67]`; the prior u1 replay already materialized `[2,4,9,10,47,49]`. The only new rows are therefore `[20,35,39,67]`. Each has coefficient `2/4=1/2`, so doubling makes it integral and it disappears modulo PicK, exactly explaining why the previous order-2 replay could not see this lift parity.\n\n```text\nORDER4_REQUIRED_BIGK_ROWS=[2,4,9,10,20,35,39,47,49,67]\nORDER4_REUSE_BIGK_ROWS=[2,4,9,10,47,49]\nORDER4_MISSING_BIGK_ROWS=[20,35,39,67]\nCANDIDATE_ROUTE=n4 -> z4=(n4*pmPic)/4 -> y4=z4*V -> y4_nontrivial mod2\nPROPER_BR2_14D_COORDINATE_MATERIALIZED=false\nRETAINED_10D_COORDINATE_MATERIALIZED=false\nFINITE_V4_KUMMER_COLUMNS_MATERIALIZED=0/10\ncanonical_sha256=a524121930e1c712bd8d8220415ef1836b11cd6eb11f2bb44f70dc844f6d85b0\n```\n\nPromotion remains blocked until `z4` is integral, the resulting 14-bit parity vector is fixed by the current proper-Br2 `cc/ct` actions, and it lies in the retained 10D domain. No closure, release, theorem, receiver, or endpoint credit is restored here.\n'''
              result_path.write_text(r)
          PY
          python3 stages/stage33/33-12/verify_j2_order4_brauer_lift_reduction.py
          python3 stages/stage33/sync_main_state.py
          python3 stages/stage33/sync_main_state.py --check
          rm .github/workflows/stage33-12-j2-full-sign-invariant-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stages/stage33 .github/workflows/stage33-12-j2-full-sign-invariant-probe.yml
          git commit -m "Stage33: narrow J2 adapter to four order4 rows"
          git push origin HEAD:stage33-12-j2-ptsK-qPicK-continuation
