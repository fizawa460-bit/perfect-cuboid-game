name: Stage33 J2 order4 lift reduction probe

on:
  push:
    branches:
      - stage33-12-j2-ptsK-qPicK-continuation
    paths:
      - .github/workflows/stage33-12-j2-full-sign-invariant-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run order4 reduction producer
        shell: bash
        run: |
          python3 stages/stage33/33-12/certify_j2_order4_brauer_lift_reduction.py
          cat stages/stage33/33-12/j2-order4-brauer-lift-reduction.json
