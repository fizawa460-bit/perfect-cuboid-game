name: Arsenal literature locator repair

on:
  push:
    branches:
      - arsenal-literature-strengthening-audit

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arsenal-literature-strengthening-audit
      - name: Repair exact Creutz-Viray locator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('docs/arsenal/literature-brauer-kummer-audit.json'): [
                  ('"theorem_locator": "Theorem 1.7 and Theorem 1.9 / Appendix Theorem A.1"',
                   '"theorem_locator": "Theorem 1.7; Theorem 1.8; Appendix Theorem A.1"'),
              ],
              Path('docs/arsenal/literature-brauer-kummer-audit.md'): [
                  ('Theorem 1.7: Kummer varieties satisfy `BM_2`. Theorem 1.9 / Appendix Theorem A.1 gives the more useful subgroup statement:',
                   'Theorem 1.7: Kummer varieties satisfy `BM_2`. Theorem 1.8 / Appendix Theorem A.1 gives the more useful subgroup statement:'),
              ],
              Path('docs/arsenal/literature-strengthening-hostile-freeze.json'): [
                  ('"locator":"Theorems 1.7, 1.9 and Appendix Theorem A.1"',
                   '"locator":"Theorem 1.7; Theorem 1.8; Appendix Theorem A.1"'),
              ],
              Path('docs/arsenal/literature-strengthening-hostile-freeze.md'): [
                  ('Theorems 1.7, 1.9 and Appendix Theorem A.1.',
                   'Theorem 1.7; Theorem 1.8; Appendix Theorem A.1.'),
              ],
          }

          for path, reps in replacements.items():
              text = path.read_text()
              for old, new in reps:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one old locator, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)

          # Hostile locator checks: Creutz-Viray records must point to 1.7/1.8/A.1,
          # while unrelated papers (e.g. Morgan Theorem 1.9) remain untouched.
          j = Path('docs/arsenal/literature-brauer-kummer-audit.json').read_text()
          if '"key": "L4-KUM03"' not in j or '"theorem_locator": "Theorem 1.7; Theorem 1.8; Appendix Theorem A.1"' not in j:
              raise SystemExit('Phase4 Creutz-Viray locator not repaired')
          f = Path('docs/arsenal/literature-strengthening-hostile-freeze.json').read_text()
          if '"CREUTZ_VIRAY_2018"' not in f or '"locator":"Theorem 1.7; Theorem 1.8; Appendix Theorem A.1"' not in f:
              raise SystemExit('Phase6 Creutz-Viray locator not repaired')
          if 'Theorems 1.7, 1.9 and Appendix Theorem A.1' in f:
              raise SystemExit('stale Creutz-Viray locator remains in freeze JSON')
          PY

          git diff --check
          git rm .github/workflows/arsenal-literature-locator-repair.yml
          git add docs/arsenal/literature-brauer-kummer-audit.json \
                  docs/arsenal/literature-brauer-kummer-audit.md \
                  docs/arsenal/literature-strengthening-hostile-freeze.json \
                  docs/arsenal/literature-strengthening-hostile-freeze.md
          git commit -m 'docs(arsenal): repair Creutz-Viray theorem locator'

          # Validate the exact committed tree before push.
          test -z "$(git status --porcelain)"
          git show --check --oneline --stat HEAD
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/arsenal/literature-strengthening-hostile-freeze.json').read_text())
          assert x['candidate_population']['total'] == 36
          c=x['classification_counts']
          assert c == {
            'LITERATURE_DIRECT':0,'LITERATURE_ADAPTED':6,'EXTEND_EXISTING':9,
            'NEW_LITERATURE_WEAPON':9,'NEW_LITERATURE_WORKFLOW':1,
            'SOURCE_ANCHOR_ONLY':2,'REPO_SPECIFIC':0,'NO_STRENGTHENING':0,
            'NOT_APPLICABLE':2,'REJECT_DUPLICATE':2,'RESEARCH_GAP':5,
            'POSSIBLY_NOVEL':0
          }
          assert x['fixed_snapshot']['STAGE36_EXCLUDED'] is True
          PY
          git push origin HEAD:arsenal-literature-strengthening-audit
