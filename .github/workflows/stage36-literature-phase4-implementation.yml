name: Stage36 literature Phase4 implementation

on:
  push:
    branches:
      - arsenal-stage36-literature-strengthening-implementation

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin Phase3 discovery manifest
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/fizawa460-bit/perfect-cuboid-game/f1a2d3074e802b0fd4555cb827e165c3de2bdfc9/docs/arsenal/literature-stage36-hostile-freeze.json \
            -o /tmp/stage36-phase3-freeze.json

      - name: Materialize registry mutation
        run: python3 -B docs/arsenal/_stage36_lit_phase4_impl.py

      - name: Generate catalog and cards
        run: python3 -B docs/arsenal/sync_arsenal_catalog.py

      - name: Remove temporary implementation machinery
        run: |
          rm -f docs/arsenal/.stage36-literature-phase4-runkey
          rm -f docs/arsenal/_stage36_lit_phase4_impl.py
          rm -f .github/workflows/stage36-literature-phase4-implementation.yml

      - name: Precommit validation after temporary workflow deletion
        env:
          BASE_MAIN: e758e05953df2cf8cd4ab26ac1e9d72374e99760
        run: |
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path

          idx = json.loads(Path('docs/arsenal/index.json').read_text())
          p3 = json.loads(Path('/tmp/stage36-phase3-freeze.json').read_text())
          s = idx['stage36_literature_strengthening']
          assert s['literature_audit_pr'] == 1690
          assert s['literature_audit_exact_head'] == 'f1a2d3074e802b0fd4555cb827e165c3de2bdfc9'
          assert s['arsenal_base_main'] == '386b6a52d7bfec2e8903412c7ca56976b46c288b'
          assert s['implementation_base_main'] == 'e758e05953df2cf8cd4ab26ac1e9d72374e99760'
          assert s['stage36_arsenal_source_head'] == '2fc3f4b8afb28bb23765bd861cbd7c52aafd6563'
          assert s['literature_population_expanded'] is False
          f = s['credit_firewall']
          required_zero = ['STAGE36_PROGRESS_INCREMENT','STAGE36_THEOREM_CREDIT_INCREMENT','RECEIVER_CLOSURE_INCREMENT','MW_CLOSURE_INCREMENT','LOCAL_GLOBAL_OBSTRUCTION_INCREMENT','ENDPOINT_CREDIT_INCREMENT']
          assert all(f[k] == 0 for k in required_zero)
          assert f['LITERATURE_ARSENAL_REGISTRATION_DOES_NOT_CHANGE_STAGE36_MATHEMATICAL_AUTHORITY'] is True
          assert f['PERFECT_CUBOID_EXISTENCE_CLAIM'] is False
          assert f['PERFECT_CUBOID_NONEXISTENCE_CLAIM'] is False
          assert f['NOVEL'] is False and f['FIRST_PROOF'] is False and f['NEW_THEOREM'] is False

          phase3 = dict(p3['classifications'])
          expected = {
            'S36-PW02':'LITERATURE_DIRECT',
            'S36-PW03':'EXTEND_STAGE36_EXISTING',
            'S36-PW04':'LITERATURE_ADAPTED',
            'S36-PW06':'LITERATURE_DIRECT',
            'S36-PW07':'LITERATURE_ADAPTED',
            'DISC-S36-B01->S30-W01':'EXTEND_OLDER_EXISTING',
            'DISC-S36-B08->S31-W01':'EXTEND_OLDER_EXISTING',
            'DISC-S36-B12->S34-W02':'EXTEND_OLDER_EXISTING',
            'S36-PW01':'SOURCE_ANCHOR_ONLY',
            'S36-PW05':'SOURCE_ANCHOR_ONLY',
            'GLOBAL-H1-LOCALIZATION-RECIPROCITY-AUDIT':'NEW_LITERATURE_WORKFLOW',
            'GLOBAL-HILBERT-SELMER-COMPATIBILITY-TERMINAL':'RESEARCH_GAP',
            'MILLER-STOLL2013-TO-S36-PW05-2ISOGENY':'NOT_APPLICABLE',
          }
          for key, value in expected.items():
              assert phase3[key] == value, (key, phase3.get(key), value)

          m = s['implementation_manifest']
          assert m['new_literature_weapons'] == []
          assert [x['stable_id'] for x in m['new_literature_workflows']] == ['LIT-WF02']
          assert m['source_anchor_only'] == ['S36-PW01','S36-PW05']
          assert set(m['duplicates']) == {
            'HOSTILE-RECIPROCAL-METHODS','HOSTILE-FINITE-PRIME-WEIL-COMPLETION','HOSTILE-TRANSVECTION-SYMPLECTIC-STRUCTURE','HOSTILE-FINITE-GROUP-RECONSTRUCTION','HOSTILE-MW-LOCAL-SIEVE','HOSTILE-FACTOR-SQUARECLASS-LINEARIZATION','HOSTILE-GAUSSIAN-ORIENTATION-NORM'
          }
          assert m['research_gaps'] == ['GLOBAL-HILBERT-SELMER-COMPATIBILITY-TERMINAL']
          assert m['possible_novelty_flags'] == []

          accepted = s['accepted_item_metadata']
          assert set(accepted) == {'S36-PW02','S36-PW03','S36-PW04','S36-PW06','S36-PW07','DISC-S36-B01->S30-W01','DISC-S36-B08->S31-W01','DISC-S36-B12->S34-W02'}
          for item in accepted.values():
              assert item['literature']
              assert item['repo']['stage36_source_pr']
              assert len(item['repo']['stage36_source_exact_head']) == 40
              assert item['repo']['source_or_certificate_path'].startswith('stages/stage36/')
              assert len(item['repo']['source_or_certificate_blob_sha']) == 40
              assert item['repo']['verifier_path'].startswith('stages/stage36/')
              assert len(item['repo']['verifier_blob_sha']) == 40
              assert item['repo']['repo_adapter_contract']
              for paper in item['literature']:
                  for key in ('authors','title','journal_or_publisher','year','theorem_identifier','source_type','conditional_assumptions'):
                      assert paper.get(key) not in (None,''), (item['proposed_role'], key)
                  assert paper.get('doi') or paper.get('canonical_url')

          wf = s['workflow_metadata']['LIT-WF02']
          assert wf['classification'] == 'NEW_LITERATURE_WORKFLOW'
          assert wf['adapter_source_verifier'].startswith('none at registration')
          assert 'zero mathematical credit' in wf['adapter_source_verifier']

          src = Path('docs/stage36-literature-strengthening-promotion.md').read_text()
          for marker in [
              'LITERATURE_ARSENAL_REGISTRATION_DOES_NOT_CHANGE_STAGE36_MATHEMATICAL_AUTHORITY=true',
              'STAGE36_PROGRESS_INCREMENT=0', 'STAGE36_THEOREM_CREDIT_INCREMENT=0',
              'RECEIVER_CLOSURE_INCREMENT=0', 'MW_CLOSURE_INCREMENT=0',
              'LOCAL_GLOBAL_OBSTRUCTION_INCREMENT=0', 'ENDPOINT_CREDIT_INCREMENT=0',
              'PERFECT_CUBOID_EXISTENCE_CLAIM=false', 'PERFECT_CUBOID_NONEXISTENCE_CLAIM=false',
              'NOVEL=false', 'FIRST_PROOF=false', 'NEW_THEOREM=false']:
              assert marker in src
          print('PASS: Phase3 manifest, literature metadata, adapter separation, and credit firewall validated')
          PY

      - name: Commit final materialized state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[Arsenal][Literature][Stage36] materialize provisional literature strengthening'

      - name: Exact committed-head validation
        env:
          BASE_MAIN: e758e05953df2cf8cd4ab26ac1e9d72374e99760
        run: |
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          git show --check --oneline --no-renames HEAD
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          base = 'e758e05953df2cf8cd4ab26ac1e9d72374e99760'
          changed = set(subprocess.check_output(['git','diff','--name-only',base+'...HEAD'], text=True).splitlines())
          allowed = {
              'docs/stage36-literature-strengthening-promotion.md',
              'docs/arsenal/index.json',
              'docs/arsenal/catalog.md',
              'docs/arsenal/cards/workflows/LIT-WF02.md',
          }
          assert changed == allowed, (changed, allowed)
          assert not any(p.startswith('stages/stage36/') for p in changed)
          assert '.github/workflows/stage36-literature-phase4-implementation.yml' not in changed
          assert 'docs/arsenal/_stage36_lit_phase4_impl.py' not in changed
          assert 'docs/arsenal/.stage36-literature-phase4-runkey' not in changed

          idx = json.loads(Path('docs/arsenal/index.json').read_text())
          active = []
          retired = {}
          active += [x['id'] for x in idx.get('selectors',[])]
          active += [x['id'] for x in idx.get('formal_router_weapons',[])]
          active += [x['id'] for x in idx.get('formal_workflows',[])]
          for h in idx.get('provisional_harvests',[]):
              active += h.get('active_cards',[]) + h.get('active_workflows',[])
              retired.update(h.get('retired_merged_ids',{}))
          assert len(active) == len(set(active))
          assert not (set(active) & set(retired))
          assert active.count('LIT-WF02') == 1
          assert all(not x.startswith('S36-LIT-') for x in active)
          print('PASS: exact committed scope, unique IDs, retired-ID firewall, and Stage36 source-tree emptiness validated')
          print('FINAL_HEAD='+subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          PY

      - name: Push exact validated final head
        run: git push origin HEAD:arsenal-stage36-literature-strengthening-implementation
