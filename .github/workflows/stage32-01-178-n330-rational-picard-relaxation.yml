name: Stage32 32-01-178 N330 rational Picard relaxation

# Trigger lifecycle: RETIRED
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.13.0.0'
      - name: Verify N330 exact rational nonnegative Picard relaxation
        run: python stages/stage32/32-01-178/nodes/N330/verify_n330_rational_nonnegative_picard_relaxation.py
