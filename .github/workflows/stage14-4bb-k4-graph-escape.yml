name: Stage14-4bb K4 graph escape

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4bb/**'
      - 'stages/stage14/data/14-4/k4_graph_escape_summary.json'
      - 'stages/stage14/scripts/14-4/k4_graph_escape_audit.py'
      - '.github/workflows/stage14-4bb-k4-graph-escape.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/14-4/k4_graph_escape_audit.py
      - name: Run deterministic audit
        run: python stages/stage14/scripts/14-4/k4_graph_escape_audit.py
      - name: Check boundary flags
        run: |
          grep -q 'K4_2CORE_TYPES_CONTROLLED=true' stages/stage14/14-4bb/result.md
          grep -q 'K4_GRAPH_ASSEMBLY_SAVING_EXPONENT=1/200' stages/stage14/14-4bb/result.md
          grep -q 'DEGREE_2_PRODUCT_CONDUCTOR_INTRINSIC_OBSTRUCTION=false' stages/stage14/14-4bb/result.md
          grep -q 'PERSISTENT_RESONANT_K4_SUBGRAPH_FOUND=false' stages/stage14/14-4bb/result.md
          grep -q 'AUXILIARY_INCIDENCE_UNIFORMITY_PROVED=false' stages/stage14/14-4bb/result.md
          grep -q 'STATE_SPLIT_E_MULTI_EDGE_ASSEMBLY_PROVED=false' stages/stage14/14-4bb/result.md
          grep -q 'NEXT=Stage14-4bc' stages/stage14/14-4bb/result.md
