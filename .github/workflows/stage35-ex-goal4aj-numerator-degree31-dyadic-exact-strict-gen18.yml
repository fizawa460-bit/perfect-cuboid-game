name: Stage35-EX Goal4AJ numerator degree31 dyadic exact strict gen18

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage35-ex/runkeys/goal4aj-numerator-degree31-dyadic-exact-strict-gen18.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          KEY='stages/stage35-ex/runkeys/goal4aj-numerator-degree31-dyadic-exact-strict-gen18.json'
          SCRIPT='stages/stage35-ex/diagnose_stage35_ex_35_goal4aj_numerator_degree31_dyadic_exact_strict_gen18.py'
          EXPECTED_SCRIPT_BLOB='0653516b77e7ae6fd8ddd07dda6901cc46994fdd'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test "$EVENT" = 'pull_request' || exit 0
          test "$ACTION" = 'synchronize' || exit 0
          test "$PR_NUMBER" = '1698' || exit 0
          test "$HEAD_BRANCH" = 'stage35-ex-goal4aj-degree19-truncated-kernel' || exit 0
          test "$BASE_BRANCH" = 'main' || exit 0
          test -n "$BEFORE" || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || exit 0
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          test "$(git diff --name-only "$BEFORE" "$HEAD" | wc -l)" -eq 1 || exit 0
          git diff --name-only "$BEFORE" "$HEAD" | grep -Fxq "$KEY" || exit 0
          if git cat-file -e "$BEFORE:$KEY" 2>/dev/null; then exit 0; fi
          test "$(git hash-object "$SCRIPT")" = "$EXPECTED_SCRIPT_BLOB" || exit 0
          python - "$KEY" <<'PY'
          import json,sys
          k=json.loads(open(sys.argv[1],encoding='utf-8').read())
          assert k['schema']=='STAGE35_EX_GOAL4AJ_NUMERATOR_DEGREE31_DYADIC_EXACT_STRICT_GEN18_RUNKEY_V1'
          assert k['generation']==1 and k['armed'] is True
          assert k['observed_current_main_sha']=='5c8c3b1ca903003cff3b5843cdb1add63ce23917'
          assert k['branch_merge_base_sha']=='1d7bfd98ef8eab7bd849fe7bfdbcdaf5c0b575e7'
          assert k['script_blob_sha1']=='0653516b77e7ae6fd8ddd07dda6901cc46994fdd'
          assert k['gen17_success_run']==34183119045 and k['gen17_success_job']==101926079352
          assert k['gen17_canonical_sha256']=='80cf6f47003c9791501c7f87248f803b9c495f2f42de46c6a3e500ced9c8a9c0'
          assert k['modular_candidate_sha256']=='7d0020181c37b6ee7e203061bda0088ea5f072ac358b275e4b7446b2c40282a5'
          assert k['field_prime']==32009 and k['degree']==31 and k['lift_multiplier']==8
          assert k['planned_jobs']==1 and k['artifact_upload'] is False
          PY
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  diagnose:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Singular
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends singular
          Singular --version | head -n 3
      - name: Replay exact numerator strict conditions
        run: |
          set -euo pipefail
          python -u -B stages/stage35-ex/diagnose_stage35_ex_35_goal4aj_numerator_degree31_dyadic_exact_strict_gen18.py | tee /tmp/goal4aj-num31-exact-gen18.log
          grep -q '^GOAL4AJ_NUM31_EXACT_STRICT_GEN18_JSON=' /tmp/goal4aj-num31-exact-gen18.log
          grep -q '^GOAL4AJ_NUM31_EXACT_STRICT_GEN18=DONE$' /tmp/goal4aj-num31-exact-gen18.log
          test "$(wc -c </tmp/goal4aj-num31-exact-gen18.log)" -le 262144
