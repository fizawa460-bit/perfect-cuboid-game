name: Stage15-6be fixed diagonal fiber

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6be/**'
      - 'stages/stage15/evidence/stage15_6be_fixed_diagonal_fiber.json'
      - 'stages/stage15/replay/verify_stage15_6be.py'
      - 'stages/stage15/scripts/stage15_6be_fixed_diagonal_fiber.py'
      - '.github/workflows/stage15-6be-fixed-diagonal-fiber.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python stages/stage15/replay/verify_stage15_6be.py
      - run: python -m py_compile stages/stage15/scripts/stage15_6be_fixed_diagonal_fiber.py stages/stage15/replay/verify_stage15_6be.py
