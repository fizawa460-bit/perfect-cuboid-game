name: Stage14-s7-08 multi-modulus second moment audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-08/**'
      - 'stages/stage14/scripts/14-s7-08/**'
      - '.github/workflows/stage14-s7-08-multimodulus-second-moment.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile s7-08 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-08/multimodulus_second_moment_audit.py

      - name: Run predecessor s7-07 audit
        run: python stages/stage14/scripts/14-s7-07/balanced_strip_inert_trace_audit.py

      - name: Run s7-08 deterministic audit
        run: python stages/stage14/scripts/14-s7-08/multimodulus_second_moment_audit.py | tee /tmp/s708.log

      - name: Check audit flags
        run: |
          grep -q 'DIRECT_INERT_SQUARE_SIEVE_9_5_AUDIT=true' /tmp/s708.log
          grep -q 'SEPARATE_SIDE_CAUCHY_EXPONENT_ONE_AUDIT=true' /tmp/s708.log
          grep -q 'PERFECT_MARGINAL_CANCELLATION_COUNTERMODEL=true' /tmp/s708.log
          grep -q 'MARGINAL_EQUIDISTRIBUTION_DOES_NOT_FORCE_TRANSVERSALITY=true' /tmp/s708.log
          grep -q 'CROSS_SCALE_RECURRENCE_REQUIRED=true' /tmp/s708.log
          grep -q 'ALL_AUDITS_PASS=true' /tmp/s708.log

      - name: Check theorem boundary
        run: |
          grep -q 'STAGE14_S7_08=COMPLETE_MULTIMODULUS_SECOND_MOMENT_AUDIT_AND_CROSS_SCALE_RECURRENCE_BARRIER' stages/stage14/14-s7-08/result.md
          grep -q 'DIRECT_INERT_SQUARE_SIEVE_OPTIMAL_RAW_EXPONENT=9/5' stages/stage14/14-s7-08/result.md
          grep -q 'SEPARATE_SIDE_CAUCHY_CEILING=U\*V\*B\^o(1)' stages/stage14/14-s7-08/result.md
          grep -q 'MARGINAL_INERT_SECOND_MOMENT_BEATS_20_21=false' stages/stage14/14-s7-08/result.md
          grep -q 'CROSS_SCALE_FIXED_SAVING_REQUIRED_AT_CENTER=1/21' stages/stage14/14-s7-08/result.md
          grep -q 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=20/21' stages/stage14/14-s7-08/result.md
          grep -q 'NEXT=Stage14-s7-09' stages/stage14/14-s7-08/result.md
