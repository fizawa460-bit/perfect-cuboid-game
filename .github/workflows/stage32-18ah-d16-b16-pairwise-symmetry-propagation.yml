name: Stage32-18AH d16 b16 pairwise symmetry propagation

on:
  push:
    branches: [stage32-18ah-b16-pairwise-symmetry-propagation]
    paths: ['stages/stage32/runkeys/18ah-b16-pairwise-symmetry-propagation.json']

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-18ah-b16-pairwise-symmetry-propagation
  cancel-in-progress: true

jobs:
  validate-run-key:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.key.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Require dedicated ARM commit
        run: |
          set -euo pipefail
          KEY='stages/stage32/runkeys/18ah-b16-pairwise-symmetry-propagation.json'
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$KEY"
          test "$(git log -1 --pretty=%s)" = 'Stage32-18AH: ARM B16 PAIRWISE SYMMETRY PROPAGATION'
      - id: key
        name: Validate exact propagation contract
        run: |
          python - <<'PY'
          import json,pathlib,os
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18ah-b16-pairwise-symmetry-propagation.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1' and d['armed'] is True and d['bound']==16
          assert d['source_18af_run_id']==33071642441 and d['source_18ag_run_id']==33116482731
          assert d['source_exact_artifact_id']==9574308138
          assert d['symmetry_schedule_margin']==1.0 and d['pairwise_candidate_limit']==6 and d['pairwise_schedule_ratio']==0.20
          assert d['primary_split_coordinate']==54 and d['secondary_split_coordinate']==48 and d['shard_count']==1024
          assert d['node_cap']==18000000 and d['allow_finer_split'] is False
          walls={436:[5,362],503:[118,665],922:[13,38]}; assert {int(k):v for k,v in d['remaining_x1024_walls'].items()}==walls
          inc=[{'tag':f'p{p}-s{s}','primary':p,'secondary':s} for p in (436,503,922) for s in walls[p]]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('matrix='+json.dumps({'include':inc},separators=(',',':'))+'\n')
          PY

  prepare:
    needs: validate-run-key
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pairwise exact certifiers from immutable source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++ libboost-dev
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/prepared"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/source.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          for p in 436 503 922; do
            python stages/stage32/32-18X/build_two_stage_certifier.py --source "$RUNNER_TEMP/source/d16-exact-symmetry-sharded.cpp" --output "$RUNNER_TEMP/prepared/d16-two-stage-$p.cpp" --primary-id "$p"
            SRC="$RUNNER_TEMP/prepared/d16-two-stage-$p.cpp" python stages/stage32/32-18AF/patch_symmetry_schedule.py
            SRC="$RUNNER_TEMP/prepared/d16-two-stage-$p.cpp" python stages/stage32/32-18AH/patch_pairwise_symmetry.py
            g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic "$RUNNER_TEMP/prepared/d16-two-stage-$p.cpp" -o "$RUNNER_TEMP/prepared/d16-two-stage-$p"
          done
          cp "$RUNNER_TEMP/source/d16-hperp.txt" "$RUNNER_TEMP/prepared/"
          cp "$RUNNER_TEMP/source/d16-aut-prefix256-bundle.txt" "$RUNNER_TEMP/prepared/"
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18ah-prepared-g1
          path: ${{ runner.temp }}/prepared/
          retention-days: 7
          if-no-files-found: error

  propagate:
    needs: [validate-run-key, prepare]
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.validate-run-key.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/download-artifact@v4
        with: {name: stage32-18ah-prepared-g1, path: '${{ runner.temp }}/prepared'}
      - run: chmod +x "$RUNNER_TEMP/prepared/d16-two-stage-436" "$RUNNER_TEMP/prepared/d16-two-stage-503" "$RUNNER_TEMP/prepared/d16-two-stage-922"
      - name: Exact pairwise propagation wall ${{ matrix.tag }}
        env:
          PRIMARY: ${{ matrix.primary }}
          SECONDARY: ${{ matrix.secondary }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"; exe="$RUNNER_TEMP/prepared/d16-two-stage-$PRIMARY"
          set +e
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" timeout --signal=TERM --kill-after=30s 45m "$exe" --input "$RUNNER_TEMP/prepared/d16-hperp.txt" --bundle "$RUNNER_TEMP/prepared/d16-aut-prefix256-bundle.txt" --output "$RUNNER_TEMP/out/cert.json" --dump-canonical "$RUNNER_TEMP/out/dump.bin" --bound 16 --shard-id "$SECONDARY" --shard-count 1024 --split-coordinate 48 --node-cap 18000000 >"$RUNNER_TEMP/out/stdout.txt" 2>"$RUNNER_TEMP/out/stderr.txt"
          rc=$?; set -e
          if [ "$rc" -ne 0 ]; then
            if grep -q 'exact traversal node cap exceeded' "$RUNNER_TEMP/out/stderr.txt"; then status=RESOURCE_WALL_NODE_CAP; elif [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$rc" -eq 143 ]; then status=RESOURCE_WALL_WALLCLOCK; else status=UNEXPECTED_FAILURE; fi
            STATUS="$status" RC="$rc" python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'; rt=root/'runtime.txt'; runtime=float(rt.read_text().strip().splitlines()[-1]) if rt.exists() and rt.read_text().strip() else None
          out={'schema':'STAGE32_18AH_B16_PAIRWISE_SYMMETRY_RESULT_V1','tag':os.environ['TAG'],'primary_residue':int(os.environ['PRIMARY']),'secondary_shard':int(os.environ['SECONDARY']),'status':os.environ['STATUS'],'runtime_seconds':runtime,'exit_code':int(os.environ['RC']),'node_cap':18000000,'pairwise_exact_gram_kkt':True,'D16_B16_NUMERICAL_CREDIT':False}
          (root/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
            test "$status" != UNEXPECTED_FAILURE
          else
            python - <<'PY'
          import json,os,pathlib,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'; d=json.loads((root/'cert.json').read_text())
          assert d['schema']=='STAGE32_18X_D16_B16_TWO_STAGE_SHARD_V1' and d['status']=='COMPLETE' and d['bound']==16
          assert d['pairwise_symmetry_exact_gram_kkt'] is True and d['TRAVERSAL_COMPLETENESS_CERTIFICATE'] is True
          p=int(os.environ['PRIMARY']); s=int(os.environ['SECONDARY']); assert (d['primary_shard_id'],d['primary_shard_count'],d['primary_split_coordinate'])==(p,1024,54); assert (d['secondary_shard_id'],d['secondary_shard_count'],d['secondary_split_coordinate'])==(s,1024,48)
          raw=(root/'dump.bin').read_bytes(); runtime=float((root/'runtime.txt').read_text().strip().splitlines()[-1])
          out={'schema':'STAGE32_18AH_B16_PAIRWISE_SYMMETRY_RESULT_V1','tag':os.environ['TAG'],'primary_residue':p,'secondary_shard':s,'status':'COMPLETE','runtime_seconds':runtime,'nodes':d['nodes'],'pairwise_symmetry_checks':d['pairwise_symmetry_checks'],'pairwise_symmetry_prunes':d['pairwise_symmetry_prunes'],'canonical_survivors_including_zero':d['canonical_survivors_including_zero'],'canonical_dump_sha256':hashlib.sha256(raw).hexdigest(),'pairwise_exact_gram_kkt':True,'D16_B16_NUMERICAL_CREDIT':False}
          (root/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18ah-${{ matrix.tag }}-g1
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error

  summarize:
    needs: [validate-run-key, propagate]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-18ah-p*-g1
          path: ${{ runner.temp }}/runs
      - name: Freeze pairwise propagation verdict
        run: |
          python - <<'PY'
          import json,os,pathlib
          docs=[json.loads(p.read_text()) for p in (pathlib.Path(os.environ['RUNNER_TEMP'])/'runs').rglob('compact.json')]; assert len(docs)==6
          allowed={'COMPLETE','RESOURCE_WALL_NODE_CAP','RESOURCE_WALL_WALLCLOCK'}; assert all(d['status'] in allowed for d in docs)
          c=sum(d['status']=='COMPLETE' for d in docs); w=6-c
          if c==6: verdict='PASS_B16_THIRD_ALGORITHM_REDIRECTION__PAIRWISE_EXACT_SYMMETRY_CLOSES_ALL_6_WALLS'; nxt='32-18AI-D16-B16-RESOURCE-SAFE-EXACT-PRODUCTION-DESIGN'
          elif c>0: verdict='PARTIAL_B16_THIRD_ALGORITHM_REDIRECTION__PAIRWISE_EXACT_SYMMETRY_REDUCES_WALL_SET'; nxt='32-18AI-D16-B16-PAIRWISE-PROPAGATION-REFINEMENT'
          else: verdict='FAIL_B16_THIRD_ALGORITHM_REDIRECTION__PAIRWISE_EXACT_SYMMETRY_NO_WALL_CLOSURE'; nxt='32-18AI-D16-B16-BASIS-REDUCTION-REDIRECTION'
          out={'schema':'STAGE32_18AH_B16_PAIRWISE_SYMMETRY_SUMMARY_V1','verdict':verdict,'source_wall_count':6,'new_complete_count':c,'tail_exact_complete_count':6+c,'remaining_wall_count':w,'results':sorted(docs,key=lambda d:(d['primary_residue'],d['secondary_shard'])),'next_item':nxt,'D16_B16_NUMERICAL_CREDIT':False,'GLOBAL_B16_AGGREGATION_COMPLETE':False,'FULL_D16_G0_ROW_COMPLETE':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False,'CONTROLLER_MODIFIED':False}
          outdir=pathlib.Path(os.environ['RUNNER_TEMP'])/'summary'; outdir.mkdir(); (outdir/'stage32-18ah-b16-pairwise-symmetry-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps({'verdict':verdict,'new_complete_count':c,'remaining_wall_count':w,'next_item':nxt},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18ah-b16-pairwise-symmetry-summary-g1
          path: ${{ runner.temp }}/summary/
          retention-days: 14
          if-no-files-found: error
