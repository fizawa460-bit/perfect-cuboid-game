name: SR search05 force diagnostic
on:
  push:
    branches: [agent/sr-search05-analysis]
permissions:
  contents: write
jobs:
  force:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sr-search05-analysis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize idempotently
        run: |
          python - <<'PY'
          import json, pathlib
          targets={'SR-STR-031':'ACTIVE','SR-STR-032':'PARKED','SR-STR-033':'PARKED','SR-STR-036':'PARKED','SR-STR-037':'ACTIVE','SR-STR-038':'ACTIVE','SR-STR-039':'ACTIVE','SR-STR-040':'ACTIVE'}
          ledger='docs/structure-radar/literature/SR-SEARCH-05.md'
          p=pathlib.Path('docs/structure-radar/structure-registry.json'); reg=json.loads(p.read_text())
          for c in reg['structures']:
            sid=c.get('structure_id')
            if sid in targets:
              c['search_status']='SEARCHED'; c['arsenal_decision']=targets[sid]; c['search_ledger']=ledger
          p.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')
          pp=pathlib.Path('docs/structure-radar/progress.json'); prog=json.loads(pp.read_text())
          bid='SR-BATCH-LITERATURE_SEARCH-05-R01'
          if not any(x.get('batch_id')==bid for x in prog.get('audit_batches',[])):
            prog.setdefault('audit_batches',[]).append({'batch_id':bid,'task_id':'SR-SEARCH-01','status':'SUBMITTED_FOR_AUDIT','source_ids':[],'sources_reviewed':0,'structures_added':0,'structures_updated':8,'structure_carrier_sources':0,'structures_deduped':0,'searches_completed':8,'arsenal_decisions':8,'audit_required':True,'duplicate_source':0,'no_distinct_structure':0})
          pp.write_text(json.dumps(prog,indent=2,ensure_ascii=False)+'\n')
          pathlib.Path(ledger).write_text('''# StructureRadar literature ledger — search batch 05

SEARCH_TASK=SR-SEARCH-01
BATCH_ID=SR-BATCH-LITERATURE_SEARCH-05-R01
SEARCH_DATE=2026-08-19
STRUCTURES=SR-STR-031,SR-STR-032,SR-STR-033,SR-STR-036,SR-STR-037,SR-STR-038,SR-STR-039,SR-STR-040
SEARCH_BATCH_SIZE=8
EVIDENCE_POLICY=primary sources for external theorem claims; audited repo arsenal checked first
NOVELTY_BY_SEARCH_ABSENCE=false

## Primary sources checked
- de la Bretèche--Tenenbaum, *Remarks on the Selberg--Delange method*, Acta Arith. 200 (2021), arXiv:2010.12929: supports the `zeta(s)^rho G(s)` theorem species; receiver-specific factorization, regularity, vertical growth, coefficient majorant and uniformity remain mandatory.
- Yekutieli, *Pythagorean Triples, Complex Numbers, Abelian Groups and Prime Numbers*, arXiv:2101.12166: normalized Pythagorean triples and fixed-hypotenuse enumeration; background only for the cuboid convolution/Euclid receivers.
- Sharipov, *A note on a perfect Euler cuboid*, arXiv:1104.1716: adjacent perfect-Euler-cuboid Diophantine reduction, not the exactly-one family or the Stage14 half-power theorem.
- Ramsden--Sharipov, *On two algebraic parametrizations for rational solutions of the cuboid equations*, arXiv:1208.2587: adjacent rational perfect-cuboid parametrization, not a replacement for the population/cutoff-specific repo results.

## Decisions
- SR-STR-031 / AR-037: `ACTIVE`. Finite-order Selberg--Delange contract is active reusable; no uncontrolled conductor or parameter-dependent expansion depth.
- SR-STR-032 / AR-038: `PARKED`. Exact shared-hypotenuse raw convolution is background reusable after exact adapter; `H(p)L_B(p)` is not a primitive unique-object count and moving-base triple correction remains.
- SR-STR-033 / AR-039: `PARKED`. Mod-7 two-parameter exactly-one family is a proved lower subfamily/regression asset only; no full `N1` asymptotic or `N2` comparison.
- SR-STR-036 / AR-002: `PARKED`. Primitive Euclid distinguished-leg decomposition is exact background; orientation, parity and common scale stay explicit.
- SR-STR-037 / AR-003: `ACTIVE`. Exact two-face gluing/multiplicity-one reconstruction is direct reuse under its original primitive/canonical hypotheses.
- SR-STR-038 / AR-004: `ACTIVE`. Raw-pair Stage14 graph identity keeps triple multiplicity three and the original cutoff; `9T(B)^2<=Q_edge(B)` is an exact collision-measure statement, not a saving.
- SR-STR-039 / AR-006: `ACTIVE`. Stage14 primitive canonical integral-space exactly-two theorem remains `N2(B)<<B^(1/2+o(1))`; no ambient `M2`, lower, strict sub-half-power, or perfect-cuboid conclusion follows. Targeted literature absence is not novelty.
- SR-STR-040 / AR-028: `ACTIVE`. No-double-charge/recharge discipline is an internal proof-accounting firewall, not an external theorem receiver.

ACTIVE=SR-STR-031,SR-STR-037,SR-STR-038,SR-STR-039,SR-STR-040
PARKED=SR-STR-032,SR-STR-033,SR-STR-036
EXTERNAL_GATE=none
NEW_EXTERNAL_ACTIVE_WEAPONS=0
SEARCHES_COMPLETED=8
ARSENAL_DECISIONS_RESOLVED=8

Firewalls: search absence is not novelty; Selberg--Delange uniformity is receiver-specific; raw representation weight is not primitive-object multiplicity; lower subfamily is not a full asymptotic; face primitivity is not cuboid primitivity; Stage14 population/cutoff is preserved; no perfect-cuboid existence/nonexistence claim.
''')
          PY
      - name: Run validations without aborting diagnostic commit
        run: |
          mkdir -p .tmp
          set +e
          python scripts/structure_radar.py refresh >.tmp/sr-search05-refresh.log 2>&1; echo $? >.tmp/sr-search05-refresh.code
          python scripts/structure_radar.py verify >.tmp/sr-search05-verify.log 2>&1; echo $? >.tmp/sr-search05-verify.code
          git diff --check >.tmp/sr-search05-diffcheck.log 2>&1; echo $? >.tmp/sr-search05-diffcheck.code
          python - <<'PY'
          import json, pathlib
          out={}
          for f in ['controller.json','exploration-queue.json','progress.json']:
            p=pathlib.Path('docs/structure-radar')/f
            d=json.loads(p.read_text())
            if f=='controller.json': out['controller']=d
            elif f=='exploration-queue.json': out['next_task']=d['tasks'][0] if d.get('tasks') else None
            else: out['last_batch']=d.get('audit_batches',[])[-1] if d.get('audit_batches') else None
          pathlib.Path('.tmp/sr-search05-state.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/structure-radar .tmp/sr-search05-*.log .tmp/sr-search05-*.code .tmp/sr-search05-state.json
          git commit -m 'temp: materialize and diagnose search05' || exit 0
          git push origin HEAD:agent/sr-search05-analysis
