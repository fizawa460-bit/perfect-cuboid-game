name: Stage32-18AK d16 b16 six-wall weapon matrix

on:
  push:
    branches: [stage32-18ak-b16-active-set-scout]
    paths: ['stages/stage32/runkeys/18ak-b16-active-set-scout.json']

permissions: {contents: read, actions: read}
concurrency: {group: stage32-18ak-b16-active-set-scout, cancel-in-progress: true}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs: {matrix: '${{ steps.k.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Require dedicated ARM commit
        run: |
          set -euo pipefail
          KEY=stages/stage32/runkeys/18ak-b16-active-set-scout.json
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1 && test "${changed[0]}" = "$KEY"
          test "$(git log -1 --pretty=%s)" = 'Stage32-18AK: ARM B16 SIX WALL WEAPON MATRIX'
      - id: k
        run: |
          python - <<'PY'
          import json,pathlib,os
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18ak-b16-active-set-scout.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1' and d['armed'] and d['bound']==16
          assert d['source_18aj_run_id']==33126100211 and d['source_18aj_summary_artifact_id']==9669160823
          assert d['source_exact_artifact_id']==9574308138 and d['shard_count']==1024 and d['secondary_split_coordinate']==48
          assert d['node_cap']==18000000 and d['wallclock_minutes']==60 and d['max_parallel']==15 and d['allow_finer_split'] is False
          alg=d['algorithms']; walls=[tuple(x) for x in d['walls']]
          assert alg==['pairwise-cached','cap-sym-active','combined-active']
          assert walls==[(436,5),(436,362),(503,118),(503,665),(922,13),(922,38)]
          inc=[{'algo':a,'primary':p,'secondary':s,'tag':f'{a}-p{p}-s{s}'} for a in alg for p,s in walls]
          assert len(inc)==18
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':inc},separators=(',',':'))+'\n')
          PY

  weapon:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Build exact weapon variant
        env: {GH_TOKEN: '${{ github.token }}', ALGO: '${{ matrix.algo }}', PRIMARY: '${{ matrix.primary }}'}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++ libboost-dev
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/source.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/src"
          python stages/stage32/32-18X/build_two_stage_certifier.py --source "$RUNNER_TEMP/src/d16-exact-symmetry-sharded.cpp" --output "$RUNNER_TEMP/work/cert.cpp" --primary-id "$PRIMARY"
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AF/patch_symmetry_schedule.py
          if [ "$ALGO" = pairwise-cached ]; then SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AK/patch_pairwise_cached.py; fi
          if [ "$ALGO" = cap-sym-active ]; then SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AK/patch_cap_sym_active.py; fi
          if [ "$ALGO" = combined-active ]; then SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AK/patch_combined_active.py; fi
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic "$RUNNER_TEMP/work/cert.cpp" -o "$RUNNER_TEMP/work/cert"
          cp "$RUNNER_TEMP/src/d16-hperp.txt" "$RUNNER_TEMP/work/"; cp "$RUNNER_TEMP/src/d16-aut-prefix256-bundle.txt" "$RUNNER_TEMP/work/"
      - name: Run full weapon ${{ matrix.tag }}
        env: {ALGO: '${{ matrix.algo }}', PRIMARY: '${{ matrix.primary }}', SECONDARY: '${{ matrix.secondary }}', TAG: '${{ matrix.tag }}'}
        run: |
          set -euo pipefail; set +e
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" timeout --signal=TERM --kill-after=20s 60m "$RUNNER_TEMP/work/cert" --input "$RUNNER_TEMP/work/d16-hperp.txt" --bundle "$RUNNER_TEMP/work/d16-aut-prefix256-bundle.txt" --output "$RUNNER_TEMP/out/cert.json" --dump-canonical "$RUNNER_TEMP/out/dump.bin" --bound 16 --shard-id "$SECONDARY" --shard-count 1024 --split-coordinate 48 --node-cap 18000000 >"$RUNNER_TEMP/out/stdout.txt" 2>"$RUNNER_TEMP/out/stderr.txt"
          rc=$?; set -e
          STATUS=COMPLETE
          if [ "$rc" -ne 0 ]; then if grep -q 'exact traversal node cap exceeded' "$RUNNER_TEMP/out/stderr.txt"; then STATUS=RESOURCE_WALL_NODE_CAP; elif [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$rc" -eq 143 ]; then STATUS=RESOURCE_WALL_WALLCLOCK; else STATUS=UNEXPECTED_FAILURE; fi; fi
          export STATUS
          python - <<'PY'
          import json,os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'; cert={}
          if (r/'cert.json').exists():
              try: cert=json.loads((r/'cert.json').read_text())
              except: cert={}
          rt=float((r/'runtime.txt').read_text().strip().splitlines()[-1]) if (r/'runtime.txt').exists() and (r/'runtime.txt').read_text().strip() else None
          keys=['nodes','exact_symmetry_prune_checks','exact_symmetry_prunes','pairwise_symmetry_checks','pairwise_symmetry_prunes','pairwise_crossgram_cache_hits','cap_sym_active_checks','cap_sym_active_prunes','canonical_survivors_including_zero']
          out={'schema':'STAGE32_18AK_B16_SIX_WALL_WEAPON_RESULT_V1','algorithm':os.environ['ALGO'],'tag':os.environ['TAG'],'primary_residue':int(os.environ['PRIMARY']),'secondary_shard':int(os.environ['SECONDARY']),'status':os.environ['STATUS'],'runtime_seconds':rt,'D16_B16_NUMERICAL_CREDIT':False}
          out.update({k:cert.get(k) for k in keys}); (r/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          test "$STATUS" != UNEXPECTED_FAILURE
      - uses: actions/upload-artifact@v4
        with: {name: 'stage32-18ak-${{ matrix.tag }}-g2', path: '${{ runner.temp }}/out/', retention-days: 7, if-no-files-found: error}

  summarize:
    needs: weapon
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'stage32-18ak-*-g2', path: '${{ runner.temp }}/runs'}
      - run: |
          python - <<'PY'
          import json,os,pathlib
          docs=[json.loads(p.read_text()) for p in (pathlib.Path(os.environ['RUNNER_TEMP'])/'runs').rglob('compact.json')]; assert len(docs)==18
          walls={}
          for d in docs: walls.setdefault((d['primary_residue'],d['secondary_shard']),[]).append(d)
          closure={f'p{p}-s{s}':[x['algorithm'] for x in xs if x['status']=='COMPLETE'] for (p,s),xs in sorted(walls.items())}
          closed=sum(bool(v) for v in closure.values())
          out={'schema':'STAGE32_18AK_B16_SIX_WALL_WEAPON_SUMMARY_V1','verdict':'SIX_WALL_WEAPON_MATRIX_COMPLETE','closed_wall_count':closed,'remaining_wall_count':6-closed,'complete_algorithms_by_wall':closure,'results':sorted(docs,key=lambda d:(d['primary_residue'],d['secondary_shard'],d['algorithm'])),'next_item':'32-18AL-D16-B16-AGGREGATE-CLOSED-WALLS' if closed else '32-18AL-D16-B16-NEW-WEAPON-FAMILY','D16_B16_NUMERICAL_CREDIT':False,'GLOBAL_B16_AGGREGATION_COMPLETE':False,'FULL_D16_G0_ROW_COMPLETE':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False,'CONTROLLER_MODIFIED':False}
          o=pathlib.Path(os.environ['RUNNER_TEMP'])/'summary'; o.mkdir(); (o/'stage32-18ak-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps({'closed_wall_count':closed,'closure':closure},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: stage32-18ak-b16-six-wall-weapon-summary-g2, path: '${{ runner.temp }}/summary/', retention-days: 14, if-no-files-found: error}
