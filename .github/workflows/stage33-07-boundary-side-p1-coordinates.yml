name: Stage33-07 boundary side P1 coordinates

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/certify_boundary_side_p1_crossing_coordinates.py'
      - 'stages/stage33/33-07/stoll_cuboid_source.py'
      - '.github/workflows/stage33-07-boundary-side-p1-coordinates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Cheap latest-commit gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        shell: bash
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo 'run=false' >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "${{ github.event_name }}" == pull_request ]] || exit 0
          [[ "$ACTION" == synchronize ]] || exit 0
          [[ -n "$BEFORE" && -n "$HEAD" ]] || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || true
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          files="$(git diff --name-only "$BEFORE" "$HEAD")"
          printf '%s\n' "$files"
          if grep -Eq '^stages/stage33/33-07/(certify_boundary_side_p1_crossing_coordinates\.py|stoll_cuboid_source\.py)$' <<<"$files"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  exact-side-coordinate-model:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Certify all 24 side P1 models and 144 crossing coordinates
        working-directory: stages/stage33/33-07
        run: python certify_boundary_side_p1_crossing_coordinates.py
      - name: Validate exact certificate and promotion firewalls
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import hashlib, json
          x=json.load(open('boundary-side-p1-crossing-coordinates.json'))
          h=x.pop('canonical_sha256')
          assert hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()==h
          assert x['physical_side_count']==24
          assert x['singular_point_exceptional_count']==48
          assert x['side_exceptional_crossing_count']==144
          assert x['parameter_support']==['0','infinity','1','-1','i','-i']
          assert x['exceptional_incidence_degree_histogram']=={'2':24,'4':24}
          assert len(x['side_models'])==24 and len(x['exceptional_incidence'])==48
          assert all(len(s['crossings'])==6 for s in x['side_models'])
          assert all(x['exact_checks'].values())
          p=x['constructive_progress']
          assert p['physical_side_first_residue_function_coordinates_materialized']
          assert not p['exceptional_P1_tangent_coordinates_materialized']
          assert not p['order2_source_first_residue_functions_materialized']
          assert not p['project_14x26_L_squareclass_tensor_materialized']
          assert not p['absolute_delta_loc_computed']
          assert not x['arithmetic_hs_closed']
          assert x['stage33_progress']=='6/11'
          assert not x['stage33_08_released']
          assert not x['theorem_credit'] and not x['endpoint_credit']
          print('BOUNDARY_SIDE_P1_COORDINATES=PASS')
          print('SIDES=24')
          print('CROSSINGS=144')
          print('PROJECT_14x26_SQUARECLASSES_COMPUTED=False')
          print('CERTIFICATE_SHA256='+h)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-boundary-side-p1-coordinates
          retention-days: 3
          path: stages/stage33/33-07/boundary-side-p1-crossing-coordinates.json
