name: Stage32 scout d16 parent polytope

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/scouts/d16_parent_polytope_prepare.py'
      - 'stages/stage32/scouts/d16_parent_polytope_enum.cpp'
      - '.github/workflows/stage32-scout-d16-parent-polytope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d16-parent-polytope-scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact lattice tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pari-gp g++
      - name: Rebuild source-locked Stage32 Picard core
        run: |
          python stages/stage32/32-01/run_sparse_picard_export.py
          test -s stages/stage32/32-01/picard-core.json
          mkdir -p "$RUNNER_TEMP/core"
          cp stages/stage32/32-01/picard-core.json "$RUNNER_TEMP/core/picard-core.json"
      - name: Build Hperp coordinates and exact 282-parent polytope cuts
        run: |
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          python stages/stage32/scouts/d16_constrained_hperp_prepare.py \
            --core "$RUNNER_TEMP/core/picard-core.json" \
            --output "$RUNNER_TEMP/work/d16-base.txt"
          python stages/stage32/scouts/d16_parent_polytope_prepare.py \
            --input "$RUNNER_TEMP/work/d16-base.txt" \
            --output "$RUNNER_TEMP/work/d16-parent-polytope.txt"
      - name: Compile parent-polytope branch and bound
        run: |
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic \
            stages/stage32/scouts/d16_parent_polytope_enum.cpp \
            -o "$RUNNER_TEMP/work/d16-parent-polytope-enum"
      - name: Enumerate with parent cuts inside the same norm search tree
        run: |
          "$RUNNER_TEMP/work/d16-parent-polytope-enum" \
            --input "$RUNNER_TEMP/work/d16-parent-polytope.txt" \
            --output "$RUNNER_TEMP/out/d16-parent-polytope-scout.json" \
            --bounds 2,4,6,8,10,12,16,20,26,34 \
            --per-bound-seconds 90 \
            --node-cap 250000000 \
            --survivor-cap 5000000
      - name: Enforce regression and scout firewalls
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'/'d16-parent-polytope-scout.json'
          assert p.stat().st_size < 2_000_000
          r=json.loads(p.read_text())
          assert r['regression']['pass'] is True
          assert r['THEOREM_CREDIT'] is False
          assert r['RECEIVER_CREDIT'] is False
          assert r['FULL_D16_G0_ROW_COMPLETE'] is False
          assert r['architecture']['materialized_branch_count_constructed']==0
          for t in r['tiers']:
              print({k:t.get(k) for k in ('bound','status','nodes','constraint_prunes','parent_band_prunes','parent_lower_envelope_prunes','exact_survivors_including_zero','elapsed_seconds')})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-scout-d16-parent-polytope
          path: ${{ runner.temp }}/out/d16-parent-polytope-scout.json
          retention-days: 5
          if-no-files-found: error
