name: Stage32-01 Magma preflight

on:
  pull_request:
    paths:
      - 'stages/stage32/32-01/preflight_after_upstream.m'
      - 'stages/stage32/32-01/run_magma_preflight.py'
      - 'stages/stage32/32-01/verify_preflight.py'
      - 'stages/stage32/32-01/run_sparse_picard_export.py'
      - 'stages/stage32/32-01/run_polyhedral_pilot.py'
      - 'stages/stage32/32-01/polyhedral_pilot_after_upstream.m'
      - '.github/workflows/stage32-01-magma-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  magma-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pinned Stage32 Magma preflight
        working-directory: stages/stage32/32-01
        run: python run_magma_preflight.py
      - name: Verify all 183 genus-degree rows
        working-directory: stages/stage32/32-01
        run: python verify_preflight.py
      - name: Export exact Picard core in bounded chunks
        working-directory: stages/stage32/32-01
        run: python run_sparse_picard_export.py
      - name: Test known-curve polyhedral compactness
        working-directory: stages/stage32/32-01
        run: python run_polyhedral_pilot.py
      - name: Upload Stage32-01 exact transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage32-01-magma-preflight
          path: |
            stages/stage32/32-01/magma-preflight-response.json
            stages/stage32/32-01/magma-preflight-stdout.txt
            stages/stage32/32-01/magma-core-export-part*.xml
            stages/stage32/32-01/magma-core-export-part*.txt
            stages/stage32/32-01/magma-core-export-part*-http-error.txt
            stages/stage32/32-01/picard-core.json
            stages/stage32/32-01/polyhedral-pilot-response.json
            stages/stage32/32-01/polyhedral-pilot-response.xml
            stages/stage32/32-01/polyhedral-pilot-stdout.txt
          if-no-files-found: warn
