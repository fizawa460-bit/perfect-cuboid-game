name: Stage32 MB-FIB Gen30 cold affine materialization
# Trigger lifecycle: ACTIVE_AUTO TEMPORARY — one-shot cheap exact design; retire after output commit.
on:
  push:
    branches:
      - stage32mb-fib-isotropic-shells-20260920
    paths:
      - '.github/workflows/stage32-mb-fib-gen30-cold-materialize.yml'
      - 'stages/stage32/final-chain/32-03-multibranch/nodes/MB104/derive_mb104_000707_gen30_adaptive_affine_cold.py'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact cold-design dependencies
        run: python -m pip install --disable-pip-version-check z3-solver sympy
      - name: Materialize exact Gen30 affine-conditioned cold design
        run: |
          set -euo pipefail
          python stages/stage32/final-chain/32-03-multibranch/nodes/MB104/derive_mb104_000707_gen30_adaptive_affine_cold.py \
            --output stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN30-ADAPTIVE-AFFINE-COLD.json
      - name: Check zero-credit cold contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN30-ADAPTIVE-AFFINE-COLD.json').read_text())
          assert p['schema']=='STAGE32_MB104_000707_GEN30_ADAPTIVE_AFFINE_COLD_V1'
          assert p['residual_timeout_singleton_count']==49
          assert p['heavy_surface_present'] is False and p['heavy_armed'] is False and p['execution_authorized'] is False
          assert all(v is False for v in p['credit_firewall'].values())
          assert len(p['leaves'])==49
          PY
      - name: Commit cold design only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN30-ADAPTIVE-AFFINE-COLD.json
          git diff --cached --quiet && { echo 'no cold-design delta'; exit 1; }
          git commit -m 'stage32mb-fib: retain exact Gen30 affine-conditioned cold design'
          git push origin "HEAD:stage32mb-fib-isotropic-shells-20260920"
