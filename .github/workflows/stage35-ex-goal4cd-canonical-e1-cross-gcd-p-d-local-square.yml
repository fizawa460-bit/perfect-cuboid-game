name: Stage35-EX Goal4CD canonical E1 cross gcd p d local square

on:
  pull_request:
    paths:
      - 'stages/stage35-ex/35ex-35/goal4cc-post-source-bridge-local-completion-fresh-route-audit-source-lock.md'
      - 'stages/stage35-ex/35ex-35/goal4cc-post-source-bridge-local-completion-fresh-route-audit.json'
      - 'stages/stage35-ex/verify_stage35_ex_35_goal4cc_post_source_bridge_local_completion_fresh_route_audit.py'
      - 'stages/stage35-ex/35ex-35/goal4cd-canonical-e1-cross-gcd-p-d-local-square-source-lock.md'
      - 'stages/stage35-ex/35ex-35/goal4cd-canonical-e1-cross-gcd-p-d-local-square.json'
      - 'stages/stage35-ex/verify_stage35_ex_35_goal4cd_canonical_e1_cross_gcd_p_d_local_square.py'
      - '.github/workflows/stage35-ex-goal4cd-canonical-e1-cross-gcd-p-d-local-square.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-goal4cd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head checkout
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "ACTUAL_HEAD_SHA=${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay Goal4CC parent
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4cc_post_source_bridge_local_completion_fresh_route_audit.py
      - name: Verify Goal4CD canonical p/d local square sieve
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4cd_canonical_e1_cross_gcd_p_d_local_square.py
