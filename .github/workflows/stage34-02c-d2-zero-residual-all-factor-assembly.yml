name: Stage34-02c D2 zero-residual all-factor assembly replay

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage34/34-02/verify_d2_stageA2_zero_residual_all_factor_closure.py'
      - 'stages/stage34/34-02/d2-stageA2-zero-residual-all-factor-closure-assembly-certificate.json'
      - 'stages/stage34/34-02/d2-stageA2-two-adic-pattern-lock.json'
      - 'stages/stage34/34-02/d2-stageA2-factor-branch-local-lock.json'
      - 'stages/stage34/34-02/d2-stageA2-factor-branch-support-lock.json'
      - 'stages/stage34/34-02/d2-stageA2-reconstruction-rank-lock.json'
      - 'stages/stage34/34-02/d2-stageA2-full-support-projective-lock.json'
      - 'stages/stage34/34-02/d2-stageA2-rankzero-AB-complete-pullback.json'
      - 'stages/stage34/34-02/d2-stageA2-rank1-mw-congruence-sieve-certificate.json'
      - 'stages/stage34/34-02/d2-stageA2-genus2-rankzero-closure-certificate.json'
      - 'stages/stage34/34-02/d2-stageA2-genus2-rankle1-14-closure-certificate.json'
      - 'stages/stage34/34-02/d2-stageA2-two-orbit-audit-promotion-certificate.json'
      - 'stages/stage34/34-02/d2-stageA2-two-rankzero-alternate-audit-promotion-certificate.json'
      - 'stages/stage34/34-02/d2-stageA2-candidateAB-hostile-reaudit-promotion-certificate.json'
      - 'stages/stage34/34-02/d2-stageA2-pr1486-q8039-hostile-audit-promotion-certificate.json'
      - 'stages/stage34/34-02/d2-stageA2-pr1489-q8413-hostile-audit-promotion-certificate.json'
      - '.github/workflows/stage34-02c-d2-zero-residual-all-factor-assembly.yml'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact cumulative closure assembly
        run: |
          python3 -m py_compile stages/stage34/34-02/verify_d2_stageA2_zero_residual_all_factor_closure.py
          python3 stages/stage34/34-02/verify_d2_stageA2_zero_residual_all_factor_closure.py
