name: Stage34-02c D2 zero-residual all-factor assembly replay

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact cumulative closure assembly and audit repair
        run: |
          python3 -m py_compile stages/stage34/34-02/verify_d2_stageA2_zero_residual_all_factor_closure.py
          python3 -m py_compile stages/stage34/34-02/verify_d2_stageA2_zero_residual_all_factor_closure_repair.py
          python3 stages/stage34/34-02/verify_d2_stageA2_zero_residual_all_factor_closure_repair.py
      - name: Verify receiver-level closure adapter preaudit
        run: |
          python3 -m py_compile stages/stage34/34-02/verify_d2_stageA2_receiver_level_closure_assembly_preaudit.py
          python3 stages/stage34/34-02/verify_d2_stageA2_receiver_level_closure_assembly_preaudit.py
      - name: Verify Stage29 receiver writeback
        run: |
          python3 -m py_compile stages/stage34/34-09/verify_stage29_receiver_writeback.py
          python3 stages/stage34/34-09/verify_stage29_receiver_writeback.py
