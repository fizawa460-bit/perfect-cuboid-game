name: Stage32-21ag true anti-fixed coordinate penalty diagnostic

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: stage32-21ag-true-antifixed-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'

      - name: Install exact local algebra dependency
        run: python -m pip install 'sympy==1.14.0'

      - name: Restrict coordinate Cauchy bound to true Reynolds anti-fixed kernel
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python diagnose_stage32_21ag_true_antifixed_coordinate_penalty.py \
            --manifest "$GITHUB_WORKSPACE/stages/stage32/residual-32-01-production/full178-manifest.json" \
            --retained "$GITHUB_WORKSPACE/stages/stage33/33-07/picard_base_rows_retained.py" \
            --marking "$GITHUB_WORKSPACE/stages/stage33/33-07/stage32_picard_marking_retained.py" \
            --row-shards 16 \
            --shard-index 0 \
            --output "$GITHUB_WORKSPACE/stage32-21ag-true-antifixed-coordinate-penalty.json"

      - name: Upload compact diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-21ag-true-antifixed-coordinate-penalty
          path: stage32-21ag-true-antifixed-coordinate-penalty.json
          retention-days: 3
          compression-level: 9
