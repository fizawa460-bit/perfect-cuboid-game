name: Stage32-18BF d16 b16 deeper child split

on:
  push:
    branches: [stage32-18ax-b16-remaining-walls-tier3-planner]
    paths: ['stages/stage32/runkeys/18bf-b16-deeper-child-split.json']

permissions: {contents: read, actions: read}
concurrency: {group: stage32-18bf-b16-deeper-child-split, cancel-in-progress: true}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          KEY=stages/stage32/runkeys/18bf-b16-deeper-child-split.json
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          [ -n "$BEFORE" ] || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || true
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          [ "$(git diff --name-only "$BEFORE" "$HEAD_SHA" | wc -l)" -eq 1 ] || exit 0
          git diff --name-only "$BEFORE" "$HEAD_SHA" | grep -Fxq "$KEY" || exit 0
          [ "$(git log -1 --pretty=%s)" = 'Stage32-18BF: ARM DEEPER CHILD2 SPLIT38' ] || exit 0
          python - <<'PY'
          import json,os,pathlib,subprocess
          key='stages/stage32/runkeys/18bf-b16-deeper-child-split.json'
          d=json.loads(pathlib.Path(key).read_text())
          old=json.loads(subprocess.check_output(['git','show',os.environ['BEFORE']+':'+key],text=True))
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1'
          assert old['generation']==1 and old['armed'] is False
          assert d['generation']==2 and d['armed'] is True
          assert d['bound']==16 and d['algorithm']=='pairwise6_strict_below_cut39_deeper_child_split38'
          assert d['parent_cut']==39 and d['fixed_z39']==0 and d['grandchild_coordinate']==38
          assert d['grandchild_probe_budget']==2000000 and d['max_parallel']==2
          assert d['source_exact_artifact_id']==9574308138
          assert d['source_summary_artifact_id']==9687893070
          assert d['source_summary_artifact_sha256']=='eb1a85f4a2e7e751c6b7de9aa30235f5083d94dba20849fc1bb11295bb393233'
          assert d['parent_stream_gate_run_id']==33155002856 and d['source_unresolved_child_total']==2
          assert d['require_parent_stream_byte_identity'] is True
          targets=d['targets']; assert len(targets)==2
          assert {(x['wall'],x['parent_id'],x['z39']) for x in targets}=={('p436-s362',886,0),('p922-s13',1200,0)}
          assert d['storage_preflight']['operating_budget_mb']==500 and d['storage_preflight']['projected_new_peak_mb_lt']<=1
          assert d['concurrency_preflight']['planned_effective_heavy_concurrency']==2
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('authorized=true\n')
              f.write('matrix='+json.dumps({'include':targets},separators=(',',':'))+'\n')
          PY

  deeper_split:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.authorize.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked source and child-split summary
        env:
          GH_TOKEN: ${{ github.token }}
          WALL: ${{ matrix.wall }}
          PARENT_ID: ${{ matrix.parent_id }}
          Z39: ${{ matrix.z39 }}
        run: |
          set -euo pipefail
          for f in /etc/apt/sources.list.d/*; do
            [ -f "$f" ] || continue
            if grep -q 'packages.microsoft.com' "$f"; then sudo rm -f "$f"; fi
          done
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends libboost-dev
          command -v g++ >/dev/null
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/summary" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/source.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/src"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/summary.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9687893070/zip"
          echo 'eb1a85f4a2e7e751c6b7de9aa30235f5083d94dba20849fc1bb11295bb393233  '"$RUNNER_TEMP/summary.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/summary.zip" -d "$RUNNER_TEMP/summary"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          d=json.loads(next((root/'summary').rglob('summary.json')).read_text())
          assert d['schema']=='STAGE32_18BE_REPAIRED_RESIDUAL_CHILD_SPLIT_SUMMARY_V1'
          assert d['parent_input_total']==6 and d['completed_parent_total']==4
          assert d['unresolved_parent_total']==2 and d['unresolved_child_total']==2
          assert d['parent_stream_identity_gate']=='PASSED_6_OF_6' and d['verdict']=='DEEPER_CHILD_SPLIT_REQUIRED'
          wall=os.environ['WALL']; pid=int(os.environ['PARENT_ID']); z39=int(os.environ['Z39'])
          row=next(x for x in d['walls'] if x['wall']==wall)
          assert row['unresolved_children']==[{'child_index':0,'parent_id':pid,'probe_nodes':2000000,'z39':z39}]
          (root/'work'/'ids.txt').write_text(f'{pid}\n')
          PY
      - name: Build deeper child-split certifier
        env:
          PRIMARY: ${{ matrix.primary }}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/work/cert.cpp"
          python stages/stage32/32-18X/build_two_stage_certifier.py --source "$RUNNER_TEMP/src/d16-exact-symmetry-sharded.cpp" --output "$SRC" --primary-id "$PRIMARY"
          SRC="$SRC" python stages/stage32/32-18AF/patch_symmetry_schedule.py
          SRC="$SRC" PAIR_LIMIT=6 python stages/stage32/32-18AY/patch_pairwise_symmetry.py
          SRC="$SRC" python stages/stage32/32-18AO/patch_block_frontier.py
          SRC="$SRC" python stages/stage32/32-18AP/patch_lower_block_replay.py
          SRC="$SRC" python stages/stage32/32-18AR/patch_frontier_cost_planner.py
          SRC="$SRC" python stages/stage32/32-18AS/patch_selective_frontier_planner.py
          SRC="$SRC" python stages/stage32/32-18BE/patch_parent_child_split.py
          SRC="$SRC" python stages/stage32/32-18BF/patch_deeper_child_split.py
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic "$SRC" -o "$RUNNER_TEMP/work/cert"
          cp "$RUNNER_TEMP/src/d16-hperp.txt" "$RUNNER_TEMP/work/"
          cp "$RUNNER_TEMP/src/d16-aut-prefix256-bundle.txt" "$RUNNER_TEMP/work/"
      - name: Split z39 child at coordinate 38
        env:
          SHARD: ${{ matrix.shard }}
          WALL: ${{ matrix.wall }}
          PARENT_ID: ${{ matrix.parent_id }}
          Z39: ${{ matrix.z39 }}
          EXPECTED_FRONTIER: ${{ matrix.frontier }}
        run: |
          set -euo pipefail
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" timeout --signal=TERM --kill-after=20s 45m "$RUNNER_TEMP/work/cert" --input "$RUNNER_TEMP/work/d16-hperp.txt" --bundle "$RUNNER_TEMP/work/d16-aut-prefix256-bundle.txt" --output "$RUNNER_TEMP/out/cert.json" --dump-canonical "$RUNNER_TEMP/out/dump.bin" --bound 16 --shard-id "$SHARD" --shard-count 1024 --split-coordinate 48 --block-cut 39 --frontier-cap 50000 --replay-limit 0 --deep-split-probe-budget 2000000 --deep-split-output "$RUNNER_TEMP/out/deep.csv" --deep-split-id-file "$RUNNER_TEMP/work/ids.txt" --deep-split-z39 "$Z39" --node-cap 12000000 >/dev/null 2>"$RUNNER_TEMP/out/stderr.txt"
          python - <<'PY'
          import csv,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']); out=root/'out'
          cert=json.loads((out/'cert.json').read_text()); pid=int(os.environ['PARENT_ID']); z39=int(os.environ['Z39'])
          assert cert['frontier_states']==int(os.environ['EXPECTED_FRONTIER'])
          assert cert['pairwise_parent_partition_stable'] is True and cert['pairwise_strictly_below_block_cut'] is True
          assert cert['deep_split_enabled'] is True and cert['deep_split_selected_ids']==1
          assert cert['deep_split_parents_seen']==1 and cert['deep_split_target_children_seen']==1 and cert['deep_split_z39']==z39
          rows=list(csv.DictReader((out/'deep.csv').open())); pr=[r for r in rows if r['record']=='PARENT']; gc=[r for r in rows if r['record']=='GRANDCHILD']
          assert len(pr)==1 and int(pr[0]['parent_id'])==pid and int(pr[0]['z39'])==z39 and int(pr[0]['target_child_seen'])==1
          assert [int(r['grandchild_index']) for r in gc]==list(range(len(gc)))
          unresolved=[{'parent_id':pid,'z39':z39,'grandchild_index':int(r['grandchild_index']),'z38':int(r['z38']),'probe_nodes':int(r['probe_nodes'])} for r in gc if r['complete']!='1']
          complete=len(gc)-len(unresolved)
          assert int(pr[0]['grandchild_index'])==len(gc)
          assert (pr[0]['complete']=='1')==(not unresolved)
          result={'schema':'STAGE32_18BF_DEEPER_CHILD_SPLIT_RESULT_V1','wall':os.environ['WALL'],'parent_id':pid,'z39':z39,'grandchild_coordinate':38,'grandchild_count':len(gc),'completed_grandchild_count':complete,'unresolved_grandchild_count':len(unresolved),'unresolved_grandchildren':unresolved,'grandchild_probe_budget':2000000,'runtime_seconds':float((out/'runtime.txt').read_text().strip()),'parent_cut':39,'parent_stream_identity_gate':'PASSED_6_OF_6','D16_B16_NUMERICAL_CREDIT':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False}
          (out/'compact.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          for x in ['cert.json','dump.bin','deep.csv','stderr.txt','runtime.txt']:(out/x).unlink(missing_ok=True)
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18bf-deep-${{ matrix.wall }}-p${{ matrix.parent_id }}
          path: ${{ runner.temp }}/out/compact.json
          retention-days: 2
          if-no-files-found: error

  summarize:
    needs: [authorize, deeper_split]
    if: always() && needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-18bf-deep-*
          path: ${{ runner.temp }}/runs
      - run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']); docs=[json.loads(p.read_text()) for p in (root/'runs').rglob('compact.json')]
          assert len(docs)==2,len(docs)
          assert {(d['wall'],d['parent_id'],d['z39']) for d in docs}=={('p436-s362',886,0),('p922-s13',1200,0)}
          unresolved=[x for d in docs for x in d['unresolved_grandchildren']]
          out={'schema':'STAGE32_18BF_DEEPER_CHILD_SPLIT_SUMMARY_V1','source_18be_summary_artifact_id':9687893070,'source_g4_run_id':33155002856,'parent_stream_identity_gate':'PASSED_6_OF_6','input_child_total':2,'resolved_child_total':sum(d['unresolved_grandchild_count']==0 for d in docs),'unresolved_grandchild_total':len(unresolved),'targets':sorted(docs,key=lambda d:d['wall']),'verdict':'ALL_REPAIRED_RESIDUAL_CHILDREN_RESOLVED' if not unresolved else 'DEEPER_SPLIT_REQUIRED','next_item':'32-18BG_D16_B16_CLOSE_EVIDENCE_REBUILD' if not unresolved else '32-18BG_D16_B16_DEEPER_SPLIT','D16_B16_NUMERICAL_CREDIT':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False}
          outdir=root/'summary'; outdir.mkdir(); (outdir/'summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18bf-deeper-child-split-summary
          path: ${{ runner.temp }}/summary/summary.json
          retention-days: 7
          if-no-files-found: error
