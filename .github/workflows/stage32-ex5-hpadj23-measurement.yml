name: Stage32EX5 HPADJ23 scaleout measurement

# Lifecycle: ACTIVE_COLD — representative sizing only.
# No FULL178 production is reachable from this workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32-ex5/runkeys/hpadj23-scaleout-measurement.json'
      - 'stages/stage32-ex5/hpadj-23_ex5/measure_scaleout_shard.py'
      - 'stages/stage32-ex5/hpadj-23_ex5/HPADJ23-MEASUREMENT-EXECUTION-CONTRACT.json'
      - 'stages/stage32-ex5/hpadj-23_ex5/verify_hpadj23_measurement_authorization.py'
      - '.github/workflows/stage32-ex5-hpadj23-measurement.yml'
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact 40-hex head for an explicitly authorized measurement replay
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stage32ex5-hpadj23-measurement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      exact_sha: ${{ steps.gate.outputs.exact_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Fresh HPADJ23 measurement authorization gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          KEY='stages/stage32-ex5/runkeys/hpadj23-scaleout-measurement.json'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          echo "exact_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python stages/stage32-ex5/hpadj-23_ex5/verify_hpadj23_measurement_authorization.py               --require-armed --expected-head "$HEAD_SHA"
          else
            [ "$EVENT_NAME" = pull_request ] || exit 0
            [ "$PR_ACTION" = synchronize ] || exit 0
            [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || exit 0
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
            git diff --name-only "$BEFORE" "$HEAD_SHA" | grep -Fxq "$KEY" || exit 0
            git show "$BEFORE:$KEY" > /tmp/old-key.json 2>/dev/null || exit 0
            python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('/tmp/old-key.json').read_text())
          new=json.loads(Path('stages/stage32-ex5/runkeys/hpadj23-scaleout-measurement.json').read_text())
          assert old['schema']==new['schema']=='STAGE32EX5_HPADJ23_SCALEOUT_MEASUREMENT_RUNKEY_V1'
          assert int(new['generation'])>int(old['generation'])>=0
          assert new['armed'] is True
          assert new['mode']=='MEASUREMENT'
          assert new['authorized_operation']=='H32_B0_11_MEASUREMENT'
          PY
            python stages/stage32-ex5/hpadj-23_ex5/verify_hpadj23_measurement_authorization.py               --require-armed --expected-head "$HEAD_SHA"
          fi

          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  measure:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.exact_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Run representative H32 b0..11 exact-t measurement
        run: |
          set -euo pipefail
          mkdir -p out
          python stages/stage32-ex5/hpadj-23_ex5/verify_hpadj23_measurement_authorization.py             --require-armed --expected-head "${{ needs.authorize.outputs.exact_sha }}"
          python stages/stage32-ex5/hpadj-23_ex5/measure_scaleout_shard.py             --H 32 --b-start 0 --b-stop 11             --exact-head "${{ needs.authorize.outputs.exact_sha }}"             --raw-output out/hpadj23-H32-b000-011.jsonl             --output out/MEASUREMENT.json | tee /tmp/hpadj23-measurement-summary.json
      - name: Enforce measurement-only artifact cap
        run: |
          set -euo pipefail
          bytes="$(du -cb out/* | tail -1 | awk '{print $1}')"
          echo "measurement_artifact_bytes=$bytes"
          test "$bytes" -le 134217728
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/MEASUREMENT.json').read_text())
          assert d['status']=='REPRESENTATIVE_SHARD_MEASUREMENT_ONLY_ZERO_MATHEMATICAL_CREDIT'
          assert d['target']=={'H':32,'b_start':0,'b_stop':11}
          assert d['semantics']['not_a_full178_production_result'] is True
          assert all(v is False for v in d['credit'].values())
          print(json.dumps(d['metrics'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hpadj23-scaleout-measurement
          path: out/
          retention-days: 3
          if-no-files-found: error
