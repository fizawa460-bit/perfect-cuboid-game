        if: always()
        run: |
          CERT="$RUNNER_TEMP/mb-fib-x59-aggregate.json"
          test -f "$CERT"
          python stages/stage32/final-chain/32-03-multibranch/nodes/MB104/verify_mb104_000707_fibration_shell0_x59_aggregate.py --certificate "$CERT"
      - name: Upload x59 aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage32-mb-fib-shell0-x59-aggregate
          path: ${{ runner.temp }}/mb-fib-x59-aggregate.json
          retention-days: 7
          if-no-files-found: warn
