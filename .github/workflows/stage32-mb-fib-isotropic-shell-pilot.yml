name: Stage32 MB-FIB isotropic shell pilot
# Trigger lifecycle: ACTIVE_AUTO — current MB-FIB Gen25 adaptive COLD frontier; heavy remains runkey-gated.
# Gen27 durable carry trigger marker: evidence-only, no heavy release.
on:
  push:
    branches:
      - 'stage32mb-fib-isotropic-shells-20260920'
    paths:
      - '.github/workflows/stage32-mb-fib-isotropic-shell-pilot.yml'
      - 'stages/stage32/final-chain/32-03-multibranch/fib/STATE.json'
      - 'stages/stage32/final-chain/32-03-multibranch/nodes/MB104/**'
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/stage32-mb-fib-isotropic-shell-pilot.yml'
      - 'stages/stage32/final-chain/32-03-multibranch/fib/STATE.json'
      - 'stages/stage32/final-chain/32-03-multibranch/nodes/MB104/**'
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact head to replay
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      exact_sha: ${{ steps.gate.outputs.exact_sha }}
      cold_surface: ${{ steps.gate.outputs.cold_surface }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact recovery dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.13.4.0'
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          DISPATCH_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          KEY='stages/stage32/final-chain/32-03-multibranch/nodes/MB104/runkeys/000707-FIBRATION-ISOTROPIC-SHELLS-V1.json'
          STATE='stages/stage32/final-chain/32-03-multibranch/fib/STATE.json'
          PREFLIGHT='stages/stage32/final-chain/32-03-multibranch/nodes/MB104/verify_mb104_000707_gen26_adaptive_x58_preflight.py'
          LIVE_CONCURRENCY_CHECK="$RUNNER_TEMP/mb-fib-live-stage32-concurrency.py"
          cat > "$LIVE_CONCURRENCY_CHECK" <<'PY'
          import json, os, sys, urllib.request
          repo=os.environ["REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          current_run=int(os.environ["CURRENT_RUN_ID"])
          key_path=sys.argv[1]
          enforce=sys.argv[2]=="enforce"
          k=json.load(open(key_path))
          c=k["concurrency"]
          planned=int(c["planned_effective_heavy_concurrency"])
          cap=int(c["stage_heavy_cap"])
          max_other=int(c["max_other_live_stage32_concurrency_for_arm"])
          assert planned==8 and cap==18 and max_other==10
          coordination=c["current_main_coordination"]
          expected_main=coordination["repository_main"]
          headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"stage32-mb-fib-live-concurrency-gate",
          }
          def get(path):
              req=urllib.request.Request("https://api.github.com"+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as resp:
                  return json.load(resp)
          main=get(f"/repos/{repo}/branches/main")["commit"]["sha"]
          assert main==expected_main,(main,expected_main)
          def paged(path,item_key):
              out=[]
              for page_num in range(1,21):
                  sep="&" if "?" in path else "?"
                  payload=get(f"{path}{sep}per_page=100&page={page_num}")
                  batch=payload[item_key]
                  out.extend(batch)
                  if len(batch)<100:
                      return out
              raise AssertionError(("pagination overflow",path,len(out)))
          runs={}
          for status in ("queued","in_progress"):
              for run in paged(f"/repos/{repo}/actions/runs?status={status}","workflow_runs"):
                  name=str(run.get("name",""))
                  path=str(run.get("path",""))
                  if "stage32" not in (name+" "+path).lower():
                      continue
                  rid=int(run["id"])
                  if rid==current_run:
                      continue
                  runs[rid]=run
          other=0
          detail=[]
          for rid,run in sorted(runs.items()):
              all_jobs=paged(f"/repos/{repo}/actions/runs/{rid}/jobs?filter=latest","jobs")
              active=[j for j in all_jobs if j.get("status") in ("queued","in_progress")]
              if active:
                  other+=len(active)
                  detail.append({"run_id":rid,"workflow":run.get("name"),"active_jobs":len(active),
                                 "job_names":[j.get("name") for j in active]})
          total=other+planned
          record={"success":total<=cap,"enforced":enforce,"repository_main":main,
                  "other_live_stage32_concurrency":other,"planned_mb_fib_concurrency":planned,
                  "effective_total":total,"stage_heavy_cap":cap,"max_other_for_arm":max_other,
                  "other_live_detail":detail}
          print(json.dumps(record,sort_keys=True))
          if enforce:
              assert other<=max_other,(other,max_other,detail)
              assert total<=cap,(total,cap,detail)
          PY
          HEAD_SHA="$PR_HEAD"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then HEAD_SHA="$DISPATCH_SHA"; fi
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          echo 'cold_surface=false' >> "$GITHUB_OUTPUT"
          echo "exact_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 0
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          EXPECTED_PREFLIGHT_BLOB="$(python - "$KEY" <<'PY'
          import json,sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text())["source_locks"]["adaptive_x58_preflight_git_blob"])
          PY
          )"
          test "$(git hash-object "$PREFLIGHT")" = "$EXPECTED_PREFLIGHT_BLOB"
          python "$PREFLIGHT"
          set +e
          python - "$KEY" "$STATE" <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          k=json.loads(Path(sys.argv[1]).read_text()); s=json.loads(Path(sys.argv[2]).read_text())
          gen=int(k["generation"]); mode=k["mode"]
          pred=k["execution_gate"]["predecessor_audited_surface"]
          assert pred["status"]=="PASS"
          assert pred["exact_head"]=="3a6107d19c0cc166e0e05efd8cf64c867460ab93"
          assert int(pred["review_id"])==5310669573
          assert s["execution"]["runkey_generation"]==gen
          if gen==28 and mode=="COLD" and k["armed"] is False:
              assert k["execution_gate"]["automatic_execution_authorized"] is False
              assert s["execution"]["heavy_armed"] is False and s["execution"]["execution_authorized"] is False
              raise SystemExit(28)
          assert gen>=29 and mode=="RECOVERY" and k["armed"] is True
          assert k["execution_gate"]["automatic_execution_authorized"] is True
          audited=k["execution_gate"]["audited_surface"]
          assert audited["status"]=="PASS" and isinstance(audited["exact_head"],str) and len(audited["exact_head"])==40
          assert isinstance(audited["review_id"],int)
          assert s["audit"]["status"]=="PASS"
          assert s["audit"]["audited_exact_head"]==audited["exact_head"]
          assert int(s["audit"]["hostile_audit_review_id"])==int(audited["review_id"])
          receipt=s["audit"]["freeze_evidence"]["load_bearing_source_locks"]
          sl=k["source_locks"]
          paths={
            "workflow_git_blob":".github/workflows/stage32-mb-fib-isotropic-shell-pilot.yml",
            "local_exact_engine_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/run_mb104_000707_fibration_shell_local_exact.py",
            "x60_packet_runner_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/run_mb104_000707_fibration_shell0_x60_packet.py",
            "gen19_carry_manifest_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN19-X61-PACKET-CARRY-MANIFEST.json",
            "recovery_runner_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/run_mb104_000707_fibration_shell0_recovery_singleton.py",
            "gen23_carry_source_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN23-X60-SINGLETON-CARRY-SOURCE.json",
            "gen23_carry_index_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN23-X60-SINGLETON-CARRY-INDEX.json",
            "gen23_carry_verifier_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/verify_mb104_000707_gen23_x60_singleton_carry.py",
            "gen24_residual_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN24-X60-SINGLETON-RESIDUAL30.json",
            "gen25_successor_design_spec_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN25-SUCCESSOR-REDESIGN-COLD-SPEC.json",
            "gen25_successor_cold_diagnostic_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/derive_mb104_000707_gen25_adaptive_affine_cold.py",
            "gen25_successor_cold_verifier_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/verify_mb104_000707_gen25_adaptive_affine_cold.py",
            "gen25_adaptive_cold_output_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN25-ADAPTIVE-AFFINE-COLD.json",
            "gen27_adaptive_carry_source_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN27-ADAPTIVE-X58-CARRY-SOURCE.json",
            "gen27_adaptive_carry_index_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN27-ADAPTIVE-X58-CARRY-INDEX.json",
            "gen27_adaptive_carry_verifier_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/verify_mb104_000707_gen27_adaptive_x58_carry.py",
            "gen28_adaptive_x58_residual_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN28-ADAPTIVE-X58-RESIDUAL54.json",
            "adaptive_x58_preflight_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/verify_mb104_000707_gen26_adaptive_x58_preflight.py",
            "adaptive_x58_packet_runner_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/run_mb104_000707_fibration_shell0_adaptive_x58_packet.py",
            "adaptive_x58_packet_verifier_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/verify_mb104_000707_fibration_shell0_adaptive_x58_packet.py",
            "adaptive_x58_aggregate_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/aggregate_mb104_000707_fibration_shell0_adaptive_x58_packets.py",
            "adaptive_x58_aggregate_verifier_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/verify_mb104_000707_fibration_shell0_adaptive_x58_aggregate.py",
            "runner_git_blob":"stages/stage32/final-chain/32-03-multibranch/nodes/MB104/run_mb104_000707_fibration_isotropic_shells.py",
            "stage33_stoll_helper_blob":"stages/stage33/33-07/stoll_cuboid_source.py",
            "stage33_picard_marking_blob":"stages/stage33/33-07/stage32_picard_marking_retained.py",
            "stage33_picard_base_rows_blob":"stages/stage33/33-07/picard_base_rows_retained.py",
            "hperp_integral_adapter_blob":"stages/stage32/residual-32-01-production/hperp_integral_adapter.py",
            "pairing_prefix_engine_blob":"stages/stage32/residual-32-01-production/pairing_prefix_engine.py",
          }
          subprocess.run(["git","fetch","--no-tags","--depth=1","origin",audited["exact_head"]],check=True)
          for field,path in paths.items():
              current=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert current==sl[field]==receipt[field],(field,current,sl[field],receipt[field])
              frozen=subprocess.check_output(["git","rev-parse",f'{audited["exact_head"]}:{path}'],text=True).strip()
              assert frozen==receipt[field],(field,frozen,receipt[field])
          PY
          RC=$?
          set -e
          if [ "$RC" = 28 ]; then
            python "$LIVE_CONCURRENCY_CHECK" "$KEY" diagnostic
            echo 'cold_surface=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$RC" = 0 ] || exit "$RC"
          if [ "$EVENT_NAME" = pull_request ]; then
            [ "$PR_ACTION" = synchronize ] || exit 0
            BEFORE="$EVENT_BEFORE"
            [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || exit 0
            git fetch --no-tags --depth=1 origin "$BEFORE" || exit 0
            git diff --name-only "$BEFORE" "$HEAD_SHA" | grep -Fxq "$KEY" || exit 0
            python - "$BEFORE" "$KEY" <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          before,path=sys.argv[1:]
          new=json.loads(Path(path).read_text())
          p=subprocess.run(["git","show",f"{before}:{path}"],text=True,capture_output=True)
          assert p.returncode==0
          old=json.loads(p.stdout)
          assert int(new["generation"])>int(old["generation"])
          PY
          fi
          python "$LIVE_CONCURRENCY_CHECK" "$KEY" enforce
          echo 'authorized=true' >> "$GITHUB_OUTPUT"
      - name: Report Gen28 residual x58 singleton COLD surface
        if: steps.gate.outputs.cold_surface == 'true'
        run: |
          echo 'Gen28 COLD residual x58 singleton surface verified: 54 packets / 160 singleton children; heavy remains blocked.'
