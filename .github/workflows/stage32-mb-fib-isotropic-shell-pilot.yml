    name: MB-FIB Gen23 carry + x59 residual30 union
    needs: [authorize,recovery-x59-interval-packet]
    if: ${{ false }} # RETIRED: rejected Gen24 x59 route must never re-arm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.exact_sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact aggregate dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.13.4.0'
      - name: Verify exact Gen24 x59 source locks
        run: python stages/stage32/final-chain/32-03-multibranch/nodes/MB104/verify_mb104_000707_fibration_shell0_x60_singleton_preflight.py
      - name: Verify durable Gen23 carry
        run: python stages/stage32/final-chain/32-03-multibranch/nodes/MB104/verify_mb104_000707_gen23_x60_singleton_carry.py
      - name: Download x59 certificates
        uses: actions/download-artifact@v4
        with:
          pattern: stage32-mb-fib-x59-*
          path: ${{ runner.temp }}/packets
          merge-multiple: true
      - name: Verify exact x59 union
        continue-on-error: true
        run: |
          python stages/stage32/final-chain/32-03-multibranch/nodes/MB104/aggregate_mb104_000707_fibration_shell0_x59_packets.py --input-dir "$RUNNER_TEMP/packets" --output "$RUNNER_TEMP/mb-fib-x59-aggregate.json"
