name: Stage14-t-batch t147-t149 residue host normalized endpoint

on:
  pull_request:
    paths:
      - 'stages/stage14/14-t147/**'
      - 'stages/stage14/14-t148/**'
      - 'stages/stage14/14-t149/**'
      - 'stages/stage14/14-t-batch-t147-149/**'
      - 'stages/stage14/14-t-batch-t144-146/audit.py'
      - '.github/workflows/stage14-t-batch-t147-149.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Audit t147-t149
        run: python stages/stage14/14-t-batch-t147-149/audit.py
      - name: Replay repaired t144-t146 audit
        run: python stages/stage14/14-t-batch-t144-146/audit.py
      - name: Regression tH32-t143
        run: python stages/stage14/14-t-batch-th32-t143/audit.py
      - name: Regression t140-t142
        run: python stages/stage14/14-t-batch-t140-142/audit.py
