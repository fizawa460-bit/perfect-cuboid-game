name: Stage32 post1648B Cecotti generator-pair marking preflight

on:
  pull_request:
    paths:
      - 'stages/stage32/residual-32-01-production/post1648b-cecotti-generator-pair-absolute-marking-preflight.json'
      - 'stages/stage32/residual-32-01-production/post1648b-cecotti-generator-pair-absolute-marking-preflight-source-note.md'
      - 'stages/stage32/residual-32-01-production/verify_stage32_post1648b_cecotti_generator_pair_absolute_marking_preflight.py'
      - '.github/workflows/stage32-post1648b-cecotti-generator-pair-marking-preflight.yml'

jobs:
  generator-pair-marking-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Verify conditional unique marking preflight
        run: python3 -B stages/stage32/residual-32-01-production/verify_stage32_post1648b_cecotti_generator_pair_absolute_marking_preflight.py
      - name: Diff check
        run: git diff --check
