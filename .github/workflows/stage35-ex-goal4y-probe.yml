name: Stage35-EX Goal4Y exact two-class lift probe

on:
  pull_request:
    paths:
      - 'stages/stage35-ex/**'
      - '.github/workflows/stage35-ex-goal4y-probe.yml'

jobs:
  probe-goal4y:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 320
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sympy
        run: python -m pip install --disable-pip-version-check sympy
      - name: Compute Goal4Y two-class UPic transgression and boundary residues
        run: python -B stages/stage35-ex/probe_goal4y_two_class_lift.py
