name: Stage33 C4B2B2H hostile-audit PASS consumption

on:
  push:
    paths:
      - '.github/workflows/stage33-c4b2b2h-hostile-audit-pass-consumption.yml'
      - 'stages/stage33/33-12/consume_c4b2b2h_hostile_audit_pass.py'
      - 'stages/stage33/33-12/c4b2b2h-hostile-audit-pass-consumption.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage33-c4b2b2h-hostile-audit-pass-consumption
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact audited receipt ancestry and freshness boundary
        shell: bash
        run: |
          set -euo pipefail
          audited='0e6af14e8b806eb857b8a8844f206a118008a15f'
          audit_main='e2da76d90a0994af5038023613c6c4084c4c507e'
          git merge-base --is-ancestor "$audited" HEAD
          git merge-base --is-ancestor "$audit_main" "$audited"
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$audit_main"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('stages/stage33/33-12/c4b2b2h-hostile-audit-pass-consumption.json').read_text())
          assert r['pr']==1722
          assert r['audited_exact_head']=='0e6af14e8b806eb857b8a8844f206a118008a15f'
          assert r['hostile_audit_review_id']==5152927668
          assert r['hostile_audit_verdict']=='PASS'
          assert r['current_main_at_audit']=='e2da76d90a0994af5038023613c6c4084c4c507e'
          assert r['c4b2b2h_certificate_sha256']=='5c37431587bf30ccd11f3212db1ef6ecc2f4bd134b439303386fce1bc6089ae6'
          assert r['stage33_11_close_credit_granted'] is True
          PY

      - name: Replay C4B2B2H exact-exit candidate
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b2b2h_repaired_stage33_11g_exact_exit.py
      - name: Consume C4B2B2H hostile-audit PASS and close repaired Stage33-11
        run: python stages/stage33/33-12/consume_c4b2b2h_hostile_audit_pass.py --write
      - name: Verify C4B2B2H hostile-audit PASS consumption
        run: python stages/stage33/33-12/consume_c4b2b2h_hostile_audit_pass.py --check
      - name: Verify Stage33 MAIN state contract
        run: python stages/stage33/sync_main_state.py --check

      - name: Commit bounded Stage33-11 exact-close state delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t files < <(git diff --name-only | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = 'stages/stage33/MAIN-STATE.json'
          test "${files[1]}" = 'stages/stage33/sync_main_state.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage33/MAIN-STATE.json stages/stage33/sync_main_state.py
          git commit -m '[Stage33] consume C4B2B2H hostile PASS and close repaired Stage33-11'

      - name: Verify clean exact-close checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python stages/stage33/33-12/consume_c4b2b2h_hostile_audit_pass.py --check
          python stages/stage33/sync_main_state.py --check
          git diff --check
          test -z "$(git status --porcelain)"
          echo "EXACT_LOCAL_HEAD=$(git rev-parse HEAD)"

      - name: Push only from exact triggering remote head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          remote_sha="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          test "$remote_sha" = "$GITHUB_SHA"
          git push origin HEAD:"${GITHUB_REF_NAME}"
