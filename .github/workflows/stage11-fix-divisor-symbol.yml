name: Stage11 fix divisor symbol

on:
  pull_request:
    paths:
      - ".github/workflows/stage11-fix-divisor-symbol.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  fix-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stage11 branch
        uses: actions/checkout@v4
        with:
          ref: agent/shared-p-convolution-stage11

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correct divisor variable and regenerate memo
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/update_shared_p_convolution_stage11_memo.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith("L_B(p)=")]
          if len(matches) != 1:
              raise SystemExit(f"expected one L_B definition, found {len(matches)}")
          i = matches[0]
          lines[i] = r"L_B(p)=\#\left\{u\mid p^2:u<p,\quad"
          lines[i + 1] = r"u\equiv\frac{p^2}{u}\pmod2,\quad"
          lines[i + 2] = r"u+\frac{p^2}{u}\le2B"
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          python scripts/update_shared_p_convolution_stage11_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --report data/shared_p_convolution_stage11_report.json \
            --output generated-face-ratio-geometry-research.md
          mv generated-face-ratio-geometry-research.md docs/face-ratio-geometry-research.md
          rm -f .github/workflows/stage11-fix-divisor-symbol.yml

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Stage11 divisor variable"
          git push origin HEAD:agent/shared-p-convolution-stage11
