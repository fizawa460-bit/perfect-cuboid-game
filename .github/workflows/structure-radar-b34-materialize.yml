name: StructureRadar b34 materialize

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'structure-radar-external-gate-34'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append batch34 progress and self-clean
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/structure-radar/progress.json')
          data = json.loads(p.read_text())
          bid = 'SR-BATCH-EXTERNAL_GATE_CLOSURE-34-R01'
          rows = data['audit_batches']
          if not any(x.get('batch_id') == bid for x in rows):
              rows.append({
                  'batch_id': bid,
                  'phase': 'EXTERNAL_GATE_CLOSURE',
                  'status': 'SUBMITTED_FOR_AUDIT',
                  'structure_ids': ['SR-STR-169'],
                  'gates_attacked': 1,
                  'gates_closed': 0,
                  'external_gate_count_before': 13,
                  'external_gate_count_after': 13,
                  'deep_attack': True,
                  'normalized_fourier_l2_identity': 'PROVED',
                  'normalized_fourier_l1_no_q_loss': 'PROVED',
                  'fourier_weak_l2_tail': 'PROVED',
                  'noncoprime_gauss_descent': 'PROVED',
                  'two_primary_primitive_completion': 'PROVED',
                  'published_kloosterman_range_adapter_proved': False,
                  'first_missing_lemma': 'MAINWallCompletedInverseFrequencyCoefficientSeparationAndPublishedRangeAdapter',
                  'stage27_receiver': 'UniformWallSlabMAINArithmeticHostCorrelationPowerDeficit',
                  'work_delegation_recommended': True,
                  'audit_required': True
              })
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          rm .github/workflows/structure-radar-b34-materialize.yml
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add docs/structure-radar/progress.json .github/workflows/structure-radar-b34-materialize.yml
          git commit -m 'StructureRadar: materialize external gate batch 34' || true
          git push origin HEAD:${{ github.head_ref }}
