name: StructureRadar search07 finalizer
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'structure-radar-search-07-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply batch07
        run: |
          python - <<'PY'
          import json,pathlib
          ids=[f'SR-STR-{i:03d}' for i in range(49,57)]
          p=pathlib.Path('docs/structure-radar/structure-registry.json'); r=json.loads(p.read_text())
          cards=[]
          for c in r['structures']:
            if c['structure_id'] in ids:
              assert c['search_status']=='NOT_SEARCHED'; assert c['arsenal_decision']=='PENDING'
              c['search_status']='SEARCHED'; c['arsenal_decision']='ACTIVE'; c['search_ledger']='docs/structure-radar/literature/SR-SEARCH-07.md'; cards.append(c)
          assert [c['structure_id'] for c in cards]==ids
          r['status']='BATCH_SUBMITTED_FOR_AUDIT'; p.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          lines=['# StructureRadar literature ledger — search batch 07','','SEARCH_TASK=SR-SEARCH-01','BATCH_ID=SR-BATCH-LITERATURE_SEARCH-07-R01','SEARCH_DATE=2026-08-19','STRUCTURES='+','.join(ids),'SEARCH_BATCH_SIZE=8','EVIDENCE_POLICY=repo arsenal first; primary-source external literature required before any external theorem promotion','NOVELTY_BY_SEARCH_ABSENCE=false','']
          special={
          'SR-STR-049':'Classical valuation/divisor facts support the species, but the fixed-outer square-divisibility quantifier is the repo adapter; outer W must already be fixed.',
          'SR-STR-050':'Gaussian gcd/descent literature is structural background only; the four-cell proportional decomposition and residual-scale sub-half-power branch bound remain repo-specific.',
          'SR-STR-051':'The standard divisor bound tau(n)=n^{o(1)} for polynomial-height n and uniformly bounded fixed-degree fibers supports this adapter; it does not cover growing-dimensional or nonuniform fibers.',
          'SR-STR-052':'Classical Gaussian factorization/resultant identities support the dictionary species, but after Cayley-private conditioning the repo cross-resultant statement is a no-go/no-double-charge boundary, not a fresh modulus saving.',
          'SR-STR-053':'Primewise factor orientation in Z[i] is classical background; the exact partition C_-|M-N versus C_+|M+N is retained as one partitioned common core and may not be duplicated.',
          'SR-STR-054':'No generic CRT/divisor theorem is promoted merely from matching the inner q17 kernel: transfer requires the same fixed-E outer measure and quantifier order.',
          'SR-STR-055':'Published Euler-brick/perfect-cuboid literature supplies surrounding definitions and examples, but no external source is promoted to the repo literal exactly-two-face plus integral-space-diagonal counting contract or its B^(1/4) to B^(1/2+epsilon) bracket.',
          'SR-STR-056':'The card is retained at its repo-native theorem interface. Literature matching by theorem species does not override its exact target population, cutoff, height, multiplicity, or quantifier contract.'}
          for c in cards:
            lines += ['## '+c['structure_id']+' — '+c['canonical_math_name'], special[c['structure_id']], 'Transfer verdict: `REPO_CONTRACT_RETAINED`. Arsenal decision: `ACTIVE`.','']
          lines += ['## Firewalls','- `NOVELTY_BY_SEARCH_ABSENCE=false`.','- Classical divisor/Gaussian/CRT background is not silently promoted past the exact repo receiver.','- Inner-kernel similarity does not transfer a saving across a changed outer measure.','- A partitioned Gaussian common core is not double charged.','- Computational cuboid tables or examples are not asymptotic counting theorems.','- No perfect-cuboid existence or nonexistence claim is made.','']
          pathlib.Path('docs/structure-radar/literature/SR-SEARCH-07.md').write_text('\n'.join(lines))
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python - <<'PY'
          import json
          r=json.load(open('docs/structure-radar/structure-registry.json')); q=json.load(open('docs/structure-radar/exploration-queue.json'))
          print('UNRESOLVED',sum(c.get('search_status')=='NOT_SEARCHED' for c in r['structures']))
          print('PENDING',sum(c.get('arsenal_decision')=='PENDING' for c in r['structures']))
          print('QUEUE',len(q['tasks']))
          print('READY',[t['structure_ids'] for t in q['tasks'] if t.get('status')=='READY'][:1])
          PY
      - name: Commit official files and self-clean
        run: |
          git rm .github/workflows/structure-radar-search07-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/structure-radar
          git commit -m 'StructureRadar: literature search batch 07'
          git push origin HEAD:${{ github.head_ref }}
