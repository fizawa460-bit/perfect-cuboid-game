name: Stage32 post1518 O210 Q602 retained-geometry 18-to-18 test

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-post1518-o210-q602-18-diagonal-retained-geometry-test.yml'
      - 'stages/stage32/controller.json'
      - 'stages/stage32/residual-32-01-production/post1518-o210-q602-18-diagonal-retained-geometry-test*'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1518_o210_q602_18_diagonal_retained_geometry_test.py'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1518_o210_q602_trace_spectrum_promotion.py'
      - 'stages/stage32/residual-32-01-production/post1518-o210-q602-residue73-trace-spectrum.json'
      - 'stages/stage32/residual-32-01-production/post1500-common-cover-marked-branch-geometry-certificate.json'
      - 'stages/stage32/residual-32-01-production/post1500-hostile-audit-rosati-trace-repair-source-note.md'
      - 'stages/stage32/residual-32-01-production/post1473-x8-marked-exceptional-incidence.json'
      - 'stages/stage32/residual-32-01-production/post1473-x8-v4-cusp-quotient.json'
      - 'docs/arsenal/index.json'
      - 'docs/arsenal/cards/provisional/S32-PW05.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-post1518-retained-geometry-18-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Certify retained-geometry 18-to-18 boundary
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1518_o210_q602_18_diagonal_retained_geometry_test.py --check stages/stage32/residual-32-01-production/post1518-o210-q602-18-diagonal-retained-geometry-test.json
      - name: Preserve hostile-audited post1518 spectrum under successor authority
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1518_o210_q602_trace_spectrum_promotion.py
      - name: Diff check
        run: git diff --check
