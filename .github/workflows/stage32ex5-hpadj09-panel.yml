name: Stage32EX5 HPADJ09 bounded panel (ephemeral)

# lifecycle: ACTIVE_AUTO
# scope: current PR #1814 / HPADJ09 bounded diagnostic only
# retirement: delete this workflow immediately after freezing the exact result
on:
  pull_request:
    paths:
      - 'stages/stage32-ex5/hpadj-09_ex5/**'
      - '.github/workflows/stage32ex5-hpadj09-panel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-panel:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'stage32ex5-hpadj09-successor-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact diagnostic dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.13.3'
      - name: Replay retained HPADJ09 quotient
        run: python stages/stage32-ex5/hpadj-09_ex5/verify_hpadj09_mod8_quotient.py
      - name: Measure bounded actual-terminal rejection panel
        run: |
          python stages/stage32-ex5/hpadj-09_ex5/measure_hpadj09_bounded_panel.py | tee /tmp/hpadj09-panel.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/hpadj09-panel.json')
          data = json.loads(p.read_text())
          assert data['status'] == 'NONZERO_ACTUAL_HPADJ_TERMINAL_REJECTION_ON_BOUNDED_PANEL'
          print('PANEL_CANONICAL=' + data['canonical_sha256_without_this_field'])
          print('PANEL_TESTED=' + str(data['aggregate']['tested_actual_hpadj_terminals']))
          print('PANEL_REJECTED=' + str(data['aggregate']['kernel_rejected_terminals']))
          PY
