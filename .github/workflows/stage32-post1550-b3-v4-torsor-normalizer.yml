name: Stage32 post1550 b3 V4 torsor normalizer

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-post1550-b3-v4-torsor-normalizer.yml'
      - 'stages/stage32/controller.json'
      - 'stages/stage32/residual-32-01-production/post1550-b3-v4-torsor-normalizer*'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1550_b3_v4_torsor_normalizer.py'
      - 'stages/stage32/residual-32-01-production/post1505-o210-q4-x8-v4-torsor-plane-retained-f2-4-adapter.json'
      - 'stages/stage32/residual-32-01-production/post1532-q602-single-b3-commutator.json'
      - 'stages/stage32/residual-32-01-production/post1503-o210-q4-relative-v4-torsor-mod2-coupling.json'
      - 'stages/stage32/residual-32-01-production/post1536-intrinsic-b3-common-cover-reentry-negative-source-note.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Certify ambient b3 relative-V4 normalizer
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1550_b3_v4_torsor_normalizer.py
      - name: Check Arsenal generated cards
        run: python3 -B docs/arsenal/sync_arsenal_catalog.py --check
      - name: Enforce no controller edit
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -qx 'stages/stage32/controller.json'; then
            echo 'controller.json must remain unchanged in this bounded normalizer leaf'
            exit 1
          fi
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
