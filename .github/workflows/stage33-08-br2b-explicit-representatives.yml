name: Stage33-08 BR2B explicit representatives

on:
  pull_request:
    paths:
      - 'stages/stage33/33-08/**'
      - 'stages/stage33/controller.json'
      - '.github/workflows/stage33-08-br2b-explicit-representatives.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  representative-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Materialize Stage33-08 representative coverage prefix
        working-directory: stages/stage33/33-08
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python materialize_representative_coverage_prefix.py
      - name: Saturate all 14 Q-unit directions with low-degree boundary sections
        working-directory: stages/stage33/33-08
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python find_saturated_q_unit_generators.py
      - name: Integrate saturated rank-14 Q-unit basis
        working-directory: stages/stage33/33-08
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python integrate_saturated_q_units.py
      - name: Materialize U44 quaternion symbols and J2 generic CSA
        working-directory: stages/stage33/33-08
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python materialize_u44_and_j2_representatives.py
      - name: Isolate constructive global Gersten-to-CSA effectivity kernel
        working-directory: stages/stage33/33-08
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python isolate_global_gersten_csa_effectivity_kernel.py
      - name: Validate Stage33-08 blocked-new-kernel firewall
        working-directory: stages/stage33/33-08
        run: |
          python - <<'PY'
          import json
          q=json.load(open('saturated-q-unit-generators.json'))
          b=json.load(open('br0b-left-explicit-representatives.json'))
          x=json.load(open('u44-j2-explicit-representatives.json'))
          k=json.load(open('global-gersten-csa-effectivity-kernel.json'))
          assert q['full_rank14_saturated_unit_lattice_generated']
          assert q['smith_nonzero_diagonal']==[1]*14
          assert b['br0b_left_filtration_parametric_representatives_complete']
          assert x['u44_explicit_representatives_complete'] and x['u44_generator_count']==44
          assert x['u44_all_evaluable_on_full_physical_open']
          assert x['j2_generic_exact_representative_complete']
          assert k['new_kernel_exposed']
          assert k['new_kernel_id']=='R33-BR2B-GLOBAL-GERSTEN-CSA-SECTION-EFFECTIVITY'
          assert k['closure_criteria_total']==10 and k['closure_criteria_satisfied']==2
          assert k['every_stage33_07_relevant_class_accounted']
          assert k['every_surviving_class_has_primary_order_and_provenance']
          assert not k['every_surviving_class_has_exact_evaluable_representative']
          assert k['unresolved_unknown_in_scope']==1
          assert k['unit_status']=='BLOCKED_NEW_KERNEL' and not k['unit_closed']
          assert not k['downstream_released'] and not k['stage33_09_released']
          assert k['stage33_progress']=='7/11'
          print('STAGE33_08_EXACT_PREFIX=PASS')
          print('FULL_U_D_EXPLICIT_Q_RATIONAL_BASIS=TRUE')
          print('U44_EXPLICIT_QUATERNION_REPRESENTATIVES=44/44')
          print('J2_GENERIC_Q_DEFINED_CSA=TRUE')
          print('NEW_KERNEL=R33-BR2B-GLOBAL-GERSTEN-CSA-SECTION-EFFECTIVITY')
          print('UNIT_STATUS=BLOCKED_NEW_KERNEL')
          print('STAGE33_PROGRESS=7/11')
          print('STAGE33_09_RELEASED=false')
          PY
      - name: Upload Stage33-08 blocked checkpoint certificates
        uses: actions/upload-artifact@v4
        with:
          name: stage33-08-br2b-blocked-checkpoint
          path: |
            stages/stage33/33-08/representative-coverage-prefix.json
            stages/stage33/33-08/saturated-q-unit-generators.json
            stages/stage33/33-08/saturated-q-unit-magma-stdout.txt
            stages/stage33/33-08/br0b-left-explicit-representatives.json
            stages/stage33/33-08/u44-j2-explicit-representatives.json
            stages/stage33/33-08/global-gersten-csa-effectivity-kernel.json
