name: Stage33-08 BR2B explicit representatives

on:
  pull_request:
    paths:
      - 'stages/stage33/33-08/**'
      - 'stages/stage33/controller.json'
      - '.github/workflows/stage33-08-br2b-explicit-representatives.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  representative-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Materialize Stage33-08 representative coverage prefix
        working-directory: stages/stage33/33-08
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python materialize_representative_coverage_prefix.py
      - name: Replay full rank-14 explicit Q-unit lattice
        working-directory: stages/stage33/33-04
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python materialize_q_units.py
      - name: Integrate BR0B left-filtration explicit representatives
        working-directory: stages/stage33/33-08
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python integrate_explicit_q_units.py
      - name: Validate Stage33-08 running firewall
        working-directory: stages/stage33/33-08
        run: |
          python - <<'PY'
          import json
          p=json.load(open('representative-coverage-prefix.json'))
          q=json.load(open('../33-04/explicit-q-units.json'))
          b=json.load(open('br0b-left-explicit-representatives.json'))
          assert p['every_stage33_07_relevant_class_accounted']
          assert p['every_surviving_class_has_primary_order_and_provenance']
          assert p['j2_exact_evaluable_representative_materialized']
          assert not p['every_surviving_class_has_exact_evaluable_representative']
          assert q['explicit_q_unit_count']==14
          assert q['explicit_q_unit_divisor_lattice_rank']==14
          assert q['explicit_q_unit_divisor_lattice_equals_audited_U_D']
          assert b['br0b_left_filtration_parametric_representatives_complete']
          assert len(b['unit_representatives'])==14
          assert all(x['exact_evaluable_on_physical_open'] for x in b['unit_representatives'])
          assert b['unit_status']=='RUNNING' and not b['unit_closed']
          assert not b['downstream_released'] and not b['stage33_09_released']
          assert b['unresolved_unknown_in_scope']==4
          print('STAGE33_08_PREFIX=PASS')
          print('J2_EXACT_REPRESENTATIVE=True')
          print('BR0B_LEFT_EXPLICIT_REPRESENTATIVES=COMPLETE')
          print('FULL_BR2B=CLEARLY_NOT_CLOSED')
          PY
      - name: Upload Stage33-08 working certificates
        uses: actions/upload-artifact@v4
        with:
          name: stage33-08-br2b-working
          path: |
            stages/stage33/33-08/representative-coverage-prefix.json
            stages/stage33/33-04/explicit-q-units.json
            stages/stage33/33-04/q-unit-magma-stdout.txt
            stages/stage33/33-08/br0b-left-explicit-representatives.json
