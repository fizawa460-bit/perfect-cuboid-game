name: Stage32 post1648AV canonical coordinate hyperplane final verifier

on:
  push:
    branches:
      - stage32-scratch-post1648av-canonical-node-hyperplane-capacity

permissions:
  contents: read

jobs:
  verify-av-canonical-hyperplanes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact scratch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install exact verifier dependency
        run: python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify AV source lock, node incidence, and retained Picard recovery
        run: python3 -B stages/stage32/residual-32-01-production/verify_stage32_post1648av_canonical_coordinate_hyperplane_recovery.py
      - name: Diff hygiene
        run: test -z "$(git status --porcelain)"
