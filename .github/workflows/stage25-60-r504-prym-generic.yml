name: Stage25-60 R504 generic Prym audit

on:
  pull_request:
    paths:
      - 'stages/stage25/25-60/r504-full-split-prym-generic.md'
      - 'stages/stage25/25-60/r504-full-split-prym-generic-audit.py'
      - 'stages/stage25/25-60/r504-full-split-prym-generic-discovery-ledger.md'
      - 'stages/stage25/25-60/r504-exceptional-search-controller.json'
      - '.github/workflows/stage25-60-r504-prym-generic.yml'
  workflow_dispatch:

jobs:
  generic-prym-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic verifier dependency
        run: python -m pip install sympy
      - name: Verify full-split generic Prym specialization obstruction
        run: python stages/stage25/25-60/r504-full-split-prym-generic-audit.py
