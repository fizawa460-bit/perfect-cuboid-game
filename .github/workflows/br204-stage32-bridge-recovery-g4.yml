name: Stage32 BRIDGE BR204 generation4 compact recovery

# Lifecycle: ACTIVE_AUTO — heavy recovery is commit-range/runkey gated fail-closed.
on:
  push:
    branches: [stage32bridge-g4-mainline]
    paths:
      - '.github/workflows/br204-stage32-bridge-recovery-g4.yml'
      - 'stages/stage32/generalization-bridge/runkeys/br204-recovery-g4.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: stage32-bridge-br204-g4-heavy
  cancel-in-progress: false

env:
  RUNKEY: stages/stage32/generalization-bridge/runkeys/br204-recovery-g4.json
  PLAN: stages/stage32/generalization-bridge/BR204-GENERATION4-RECOVERY-PLAN.json
  DESIGN: stages/stage32/generalization-bridge/BR204-GENERATION4-RECOVERY-DESIGN.json
  STATE: stages/stage32/generalization-bridge/STATE.json
  PREDECESSOR: stages/stage32/generalization-bridge/BR204-G4-PREDECESSOR-CERTIFICATE.json
  PLAN_BLOB: ff067e47f5cef53031b9eb3d1a70d11c16db93e2
  DESIGN_BLOB: 6265374f0edd0dc143ffa45c08e42f90dec2207b
  PLAN_VERIFIER_BLOB: e9a6b164f94a9b49a99c62ea8496daff1314421e
  STATE_BLOB: 03d01292c19acda50adcc8a82fc0c07609cf516b
  PREDECESSOR_BLOB: 5a4a990a1588c71facbb9640a4c26b8641e44b02
  WORKER_BLOB: ca0a4985e788455432eb59d603da54fc3c703ea6
  COMBINER_BLOB: 33089c2ca4876650a4ee9c6477e1e6242ad3741c
  GROUP_COMBINER_BLOB: 5986168bca8ec63e1d1aab2e417e9157ae09ef23
  CURRENT_MAIN: a834864923086e5f7c1647e462804f45ff9ac28d
  MAIN_STATE_BLOB: 070847c669120aef1ab3777239d45878937b41f3
  PREDECESSOR_ARTIFACT_ID: '10628120960'
  PREDECESSOR_ARTIFACT_DIGEST: sha256:dd76c0d102af75b6313c485a264ee3b5fdd7734aec940c97d88c185a8f590cee

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      runkey_blob: ${{ steps.gate.outputs.runkey_blob }}
      generation: ${{ steps.gate.outputs.generation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - id: gate
        name: Authorize only audited generation-2 runkey-only transition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test "\${GITHUB_EVENT_NAME}" = push || exit 0
          test "\${GITHUB_REF_NAME}" = stage32bridge-g4-mainline || exit 0
          BEFORE='${{ github.event.before }}'
          export BEFORE
          test -n "$BEFORE" && test "$BEFORE" != 0000000000000000000000000000000000000000 || exit 0
          mapfile -t changed < <(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if [ "\${#changed[@]}" -ne 1 ] || [ "\${changed[0]}" != "$RUNKEY" ]; then
            echo "cold/non-runkey-only commit: heavy remains blocked"
            exit 0
          fi
          git show "$BEFORE:$RUNKEY" > /tmp/old-runkey.json
          python - <<'PY'
          import json,os
          old=json.load(open('/tmp/old-runkey.json'))
          new=json.load(open(os.environ['RUNKEY']))
          assert old['schema']==new['schema']=='STAGE32_BR204_RECOVERY_G4_RUNKEY_V2_COMPACT_CERT'
          assert old['generation']==1 and new['generation']==2
          assert old['armed'] is True and new['armed'] is True
          for k in ('execution','source_locks','storage','resume','credit'):
              assert old[k]==new[k], k
          ac=new['arm_contract']
          assert ac['audited_doorstep_head']==os.environ['BEFORE']
          assert ac['hostile_audit_status']=='PASS'
          assert ac.get('execution_surface_audit_status')=='PASS'
          assert isinstance(ac['audited_doorstep_review_id'],int) and ac['audited_doorstep_review_id']>0
          assert ac['planned_effective_heavy_concurrency']==12
          assert ac['repository_stage_concurrency_ceiling']==18
          assert 0 <= ac['observed_other_stage32_heavy_concurrency_at_arm'] <= 6
          assert ac['combined_effective_heavy_concurrency_at_arm'] == 12 + ac['observed_other_stage32_heavy_concurrency_at_arm']
          assert ac['combined_effective_heavy_concurrency_at_arm'] <= 18
          assert all(v is False for v in new['credit'].values())
          PY
          test "$(git hash-object "$PLAN")" = "$PLAN_BLOB"
          test "$(git hash-object "$DESIGN")" = "$DESIGN_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/verify_br204_generation4_recovery_plan.py)" = "$PLAN_VERIFIER_BLOB"
          test "$(git hash-object "$STATE")" = "$STATE_BLOB"
          test "$(git hash-object "$PREDECESSOR")" = "$PREDECESSOR_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/run_br204_full178_bc_shard.cpp)" = "$WORKER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/combine_br204_bc_shards.py)" = "$COMBINER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/combine_br204_bc64_to_bc16_parent.py)" = "$GROUP_COMBINER_BLOB"
          python stages/stage32/generalization-bridge/verify_br204_generation4_recovery_plan.py
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$CURRENT_MAIN"
          test "$(git rev-parse FETCH_HEAD:stages/stage32/MAIN-STATE.json)" = "$MAIN_STATE_BLOB"
          review_id="$(python -c 'import json,os; print(json.load(open(os.environ["RUNKEY"]))["arm_contract"]["audited_doorstep_review_id"])')"
          gh api "repos/${{ github.repository }}/pulls/1833/reviews?per_page=100" > /tmp/reviews.json
          REVIEW_ID="$review_id" BEFORE="$BEFORE" python - <<'PY'
          import json,os
          rows=json.load(open('/tmp/reviews.json'))
          hit=[r for r in rows if r['id']==int(os.environ['REVIEW_ID'])]
          assert len(hit)==1
          r=hit[0]
          assert r.get('commit_id')==os.environ['BEFORE']
          assert 'HOSTILE AUDIT: PASS' in (r.get('body') or '')
          PY
          blob="$(git hash-object "$RUNKEY")"
          gen="$(python -c 'import json,os; print(json.load(open(os.environ["RUNKEY"]))["generation"])')"
          echo "runkey_blob=$blob" >> "$GITHUB_OUTPUT"
          echo "generation=$gen" >> "$GITHUB_OUTPUT"
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  runtime:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Build source-locked runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/runtime
          g++ -std=c++20 -O3 -DNDEBUG -pthread -I stages/stage32/generalization-bridge \
            stages/stage32/generalization-bridge/run_br204_full178_bc_shard.cpp -o /tmp/runtime/br204-worker
          cp stages/stage32/generalization-bridge/combine_br204_bc_shards.py /tmp/runtime/
          cp stages/stage32/generalization-bridge/combine_br204_bc64_to_bc16_parent.py /tmp/runtime/
          /tmp/runtime/br204-worker --self-test >/tmp/runtime/selftest.json
      - uses: actions/upload-artifact@v4
        with:
          name: br204-g4-runtime-${{ needs.authorize.outputs.generation }}
          path: /tmp/runtime
          retention-days: 1
          if-no-files-found: error

  plan:
    needs: [authorize, runtime]
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open("stages/stage32/generalization-bridge/BR204-GENERATION4-RECOVERY-PLAN.json"))
          rows=[]
          for x in p["flat_targets"]:
              rows.append({"b":x["b"],"d":x["d"],"mode":"flat16"})
          for x in p["hierarchical_targets"]:
              rows.append({"b":x["b"],"d":x["d"],"mode":"hier64"})
          assert len(rows)==69 and len({(x["b"],x["d"]) for x in rows})==69
          print("matrix="+json.dumps({"include":rows},separators=(",",":")))
          PY

  target:
    needs: [authorize, runtime, plan]
    if: needs.authorize.outputs.authorized == 'true'
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      B: ${{ matrix.b }}
      D: ${{ matrix.d }}
      MODE: ${{ matrix.mode }}
      RUNKEY_BLOB: ${{ needs.authorize.outputs.runkey_blob }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: br204-g4-runtime-${{ needs.authorize.outputs.generation }}
          path: /tmp/runtime
      - name: Restore certified predecessor children only for b2 d148
        if: matrix.b == 2 && matrix.d == 148
        uses: actions/download-artifact@v4
        with:
          name: br204-g3-replacement-b2-d148-bc0of16
          run-id: 35574528620
          github-token: ${{ github.token }}
          path: /tmp/predecessor
      - name: Execute target with lossless compact child retention
        id: compute
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x /tmp/runtime/br204-worker
          mkdir -p /tmp/out/certs /tmp/work /tmp/recon
          python - <<'PY'
          import hashlib,json,os,subprocess,time
          from pathlib import Path

          b=int(os.environ["B"]); d=int(os.environ["D"]); mode=os.environ["MODE"]
          worker=os.environ["WORKER_BLOB"]; plan=os.environ["PLAN_BLOB"]; runkey=os.environ["RUNKEY_BLOB"]
          count=16 if mode=="flat16" else 64
          certdir=Path("/tmp/out/certs"); work=Path("/tmp/work"); runtime=Path("/tmp/runtime")
          started=time.monotonic(); soft=13500; timeout=1200
          expected_carry={
            0:"5881148242d36fcf98c713a4711397e1b3f414afade2effc263aa8476fb29442",
            16:"2fa5982933d06d855a9a56493c23a23351f2b289bbebae7471550ac5732f5f83",
            32:"f7a7d36d5f5b812e445926df5ce11f9d9cd13803d650b3c73b14011f406e3dff",
            48:"044a708ae4e4a263cc3755b7c5f18d754397660dc4c1dd1c81ad9e2d6dae4fa1",
          }
          completed=[]; stop="COMPLETE"
          def compact(src:Path,i:int):
              dst=certdir/f"child-{i}.json"
              subprocess.run(["python",str(runtime/"combine_br204_bc_shards.py"),"compact-child",
                  "--input",str(src),"--output",str(dst),"--worker-blob",worker,
                  "--plan-blob",plan,"--runkey-blob",runkey],check=True)
              subprocess.run(["python",str(runtime/"combine_br204_bc_shards.py"),"verify-compact-child",
                  "--certificate",str(dst),"--expected-worker-blob",worker,
                  "--expected-plan-blob",plan,"--expected-runkey-blob",runkey],check=True)
              assert dst.stat().st_size<=65536
          for i in range(count):
              if time.monotonic()-started > soft:
                  stop="SOFT_DEADLINE"; break
              if b==2 and d==148 and mode=="hier64" and i in expected_carry:
                  src=Path(f"/tmp/predecessor/children/br204-f-b2-d148-bc{i}of64.tsv.gz")
                  assert src.is_file()
                  assert hashlib.sha256(src.read_bytes()).hexdigest()==expected_carry[i]
                  compact(src,i); completed.append(i); continue
              raw=work/f"br204-f-b{b}-d{d}-bc{i}of{count}.tsv"
              cmd=[str(runtime/"br204-worker"),"--b",str(b),"--d-lo",str(d),"--d-hi",str(d),
                   "--bc-shard-index",str(i),"--bc-shard-count",str(count),
                   "--worker-blob",worker,"--out",str(raw)]
              try:
                  subprocess.run(cmd,check=True,timeout=timeout)
              except subprocess.TimeoutExpired:
                  stop=f"CHILD_TIMEOUT_{i}"; break
              compact(raw,i); raw.unlink(missing_ok=True); completed.append(i)
          complete=(len(completed)==count)
          target_sha=None
          if complete:
              childroot=Path("/tmp/recon/children"); childroot.mkdir(parents=True,exist_ok=True)
              for i in range(count):
                  out=childroot/f"br204-f-b{b}-d{d}-bc{i}of{count}.tsv"
                  subprocess.run(["python",str(runtime/"combine_br204_bc_shards.py"),"verify-compact-child",
                      "--certificate",str(certdir/f"child-{i}.json"),"--output-raw",str(out),
                      "--expected-worker-blob",worker,"--expected-plan-blob",plan],check=True)
              if mode=="flat16":
                  target=Path("/tmp/recon/target.tsv")
                  subprocess.run(["python",str(runtime/"combine_br204_bc_shards.py"),
                      "--input-dir",str(childroot),"--b",str(b),"--d",str(d),"--shard-count","16",
                      "--worker-blob",worker,"--out",str(target)],check=True)
              else:
                  parentroot=Path("/tmp/recon/parents"); parentroot.mkdir(parents=True,exist_ok=True)
                  for p in range(16):
                      out=parentroot/f"br204-f-b{b}-d{d}-bc{p}of16.tsv"
                      subprocess.run(["python",str(runtime/"combine_br204_bc64_to_bc16_parent.py"),
                          "--input-dir",str(childroot),"--b",str(b),"--d",str(d),
                          "--parent-index",str(p),"--worker-blob",worker,"--out",str(out)],check=True)
                  target=Path("/tmp/recon/target.tsv")
                  subprocess.run(["python",str(runtime/"combine_br204_bc_shards.py"),
                      "--input-dir",str(parentroot),"--b",str(b),"--d",str(d),"--shard-count","16",
                      "--worker-blob",worker,"--out",str(target)],check=True)
              target_sha=hashlib.sha256(target.read_bytes()).hexdigest()
          rows=[]
          for p in sorted(certdir.glob("child-*.json")):
              rows.append({"name":p.name,"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()})
          status={
            "schema":"STAGE32_BR204_G4_TARGET_STATUS_V1","b":b,"d":d,"mode":mode,
            "expected_child_count":count,"completed_child_indices":completed,
            "complete":complete,"stop_reason":stop,"target_canonical_sha256":target_sha,
            "runkey_blob":runkey,"plan_blob":plan,"worker_blob":worker,
            "compact_certificates":rows,"credit":False
          }
          Path("/tmp/out/STATUS.json").write_text(json.dumps(status,sort_keys=True,indent=2)+"\n")
          raise SystemExit(0 if complete else 75)
          PY
      - name: Upload compact recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: br204-g4-target-b${{ matrix.b }}-d${{ matrix.d }}
          path: /tmp/out
          retention-days: 14
          if-no-files-found: error
      - name: Require target completion for this generation
        if: always()
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/out/STATUS.json'))
          assert x['complete'] is True, x
          PY

  summary:
    needs: [authorize, plan, target]
    if: always() && needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download current-generation target artifacts with pagination
        run: |
          set -euo pipefail
          mkdir -p /tmp/all
          page=1
          while :; do
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100&page=$page" > "/tmp/a-$page.json"
            n="$(python -c "import json; print(len(json.load(open('/tmp/a-$page.json'))['artifacts']))")"
            [ "$n" -gt 0 ] || break
            python - "$page" <<'PY' > /tmp/ids.tsv
          import json,sys
          for a in json.load(open(f"/tmp/a-{sys.argv[1]}.json"))["artifacts"]:
              if a["name"].startswith("br204-g4-target-"):
                  print(a["id"],a["name"],sep="\t")
          PY
            while IFS=$'\t' read -r id name; do
              [ -n "$id" ] || continue
              mkdir -p "/tmp/all/$name"
              gh api -H 'Accept: application/vnd.github+json' "repos/${{ github.repository }}/actions/artifacts/$id/zip" > /tmp/x.zip
              unzip -q /tmp/x.zip -d "/tmp/all/$name"
            done < /tmp/ids.tsv
            page=$((page+1))
          done
      - name: Validate 69-target recovery boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open("stages/stage32/generalization-bridge/BR204-GENERATION4-RECOVERY-PLAN.json"))
          expected={(x["b"],x["d"]) for x in p["flat_targets"]}|{(x["b"],x["d"]) for x in p["hierarchical_targets"]}
          rows={}
          for s in Path("/tmp/all").rglob("STATUS.json"):
              x=json.load(open(s)); key=(x["b"],x["d"])
              assert key in expected and key not in rows
              assert x["credit"] is False
              rows[key]=x
          complete=sorted(k for k,x in rows.items() if x["complete"])
          missing=sorted(expected-set(complete))
          out={"schema":"STAGE32_BR204_G4_RECOVERY_SUMMARY_V1",
               "expected_target_count":69,"observed_target_count":len(rows),
               "complete_target_count":len(complete),"complete_targets":complete,
               "missing_targets":missing,"wave_complete":not missing,
               "interpretation":"Hard-target recovery evidence only. No FULL178 global aggregate or MAIN credit.",
               "credit":{"stage32_main":False,"full178_complete":False,"theorem":False,
                         "effectivity":False,"receiver":False,"endpoint":False,
                         "perfect_cuboid":False,"merge":False}}
          Path("/tmp/BR204-G4-RECOVERY-SUMMARY.json").write_text(json.dumps(out,sort_keys=True,indent=2)+"\n")
          print(json.dumps({"complete":len(complete),"missing":len(missing)},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: br204-g4-recovery-summary-${{ needs.authorize.outputs.generation }}
          path: /tmp/BR204-G4-RECOVERY-SUMMARY.json
          retention-days: 14
          if-no-files-found: error
