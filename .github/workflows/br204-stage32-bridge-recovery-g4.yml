name: Stage32 BRIDGE BR204 generation4 recovery cold gate

# Lifecycle: MANUAL — cold G4 execution surface. Heavy compute is intentionally absent
# until a distinct hostile audit accepts this exact surface and a runkey-only arm commit follows.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAN: stages/stage32/generalization-bridge/BR204-GENERATION4-RECOVERY-PLAN.json
  PLAN_BLOB: d29a312a259468fe1d4ad023b130af6bd3bf9ac4
  PLAN_VERIFIER: stages/stage32/generalization-bridge/verify_br204_generation4_recovery_plan.py
  PLAN_VERIFIER_BLOB: f898c37de89c920c333df73ad94b8e3dff690376
  RUNKEY: stages/stage32/generalization-bridge/runkeys/br204-recovery-g4.json
  RUNKEY_BLOB: fe7a49bffa5581f629ac80a6aac3b2e56afb668e
  DESIGN: stages/stage32/generalization-bridge/BR204-GENERATION4-RECOVERY-DESIGN.json
  DESIGN_BLOB: 13037b1271f66161dd7ef590d1ac4ffd85319878
  TARGETS: stages/stage32/generalization-bridge/BR204-GENERATION3-RECOVERY-TARGETS.json
  TARGETS_BLOB: 975fadbe0f3ee0dfd7c792be7807c154421dec20
  CURRENT_MAIN: e7fd29d24dd21e8529dbdb45b221a53f2cc21ed3
  CURRENT_MAIN_STATE_BLOB: 070847c669120aef1ab3777239d45878937b41f3
  STATE: stages/stage32/generalization-bridge/STATE.json
  STATE_BLOB: d537e62389b6ddf0806f1c547f251444761ddff3
  MEASURE: stages/stage32/generalization-bridge/measure_br204_g4_compact_child.py
  MEASUREMENT_RECEIPT: stages/stage32/generalization-bridge/BR204-G4-REPRESENTATIVE-STORAGE-MEASUREMENT.json
  MEASUREMENT_RECEIPT_BLOB: 69331aa90b901c3de282d0ee641b2dc82a42b0bb
  MEASUREMENT_PAYLOAD: stages/stage32/generalization-bridge/BR204-G4-REPRESENTATIVE-COMPACT-CHILD.json
  MEASUREMENT_PAYLOAD_BLOB: 26ca9fcaf37b02daa18acd641c32627e91ab7afc
  MEASURE_BLOB: 69d6a162d83bdbf6c4ebb4d490961bb0f838aa92

jobs:
  cold-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify frozen G4 cold surface
        run: |
          set -euo pipefail
          test "$(git hash-object "$PLAN")" = "$PLAN_BLOB"
          test "$(git hash-object "$PLAN_VERIFIER")" = "$PLAN_VERIFIER_BLOB"
          test "$(git hash-object "$RUNKEY")" = "$RUNKEY_BLOB"
          test "$(git hash-object "$DESIGN")" = "$DESIGN_BLOB"
          test "$(git hash-object "$TARGETS")" = "$TARGETS_BLOB"
          test "$(git hash-object "$STATE")" = "$STATE_BLOB"
          test "$(git hash-object "$MEASURE")" = "$MEASURE_BLOB"
          test "$(git hash-object "$MEASUREMENT_RECEIPT")" = "$MEASUREMENT_RECEIPT_BLOB"
          test "$(git hash-object "$MEASUREMENT_PAYLOAD")" = "$MEASUREMENT_PAYLOAD_BLOB"
          python "$PLAN_VERIFIER"
          python - <<'PY'
          import json,os
          x=json.load(open(os.environ['RUNKEY']))
          assert x['schema']=='STAGE32_BR204_RECOVERY_G4_RUNKEY_V1'
          assert x['generation']==0 and x['armed'] is False
          assert x['storage']['storage_gate_passed'] is True
          assert x['arm_contract']['audited_doorstep_head'] is None
          assert x['arm_contract']['audited_doorstep_review_id'] is None
          assert all(v is False for v in x['credit'].values())
          PY
      - name: Measure representative compact child
        run: |
          set -euo pipefail
          python "$MEASURE"
          python - <<'PY'
          import json
          r=json.load(open('stages/stage32/generalization-bridge/BR204-G4-REPRESENTATIVE-STORAGE-MEASUREMENT.json'))
          assert r['payload_bytes'] <= r['hard_cap_bytes'] == 65536
          assert r['within_hard_cap'] is True
          print('representative payload bytes',r['payload_bytes'])
          PY
      - name: Verify current MAIN source lock
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$CURRENT_MAIN"
          test "$(git rev-parse FETCH_HEAD:stages/stage32/MAIN-STATE.json)" = "$CURRENT_MAIN_STATE_BLOB"
      - name: Confirm no heavy authorization exists
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          p=json.load(open(os.environ['PLAN']))
          r=json.load(open(os.environ['RUNKEY']))
          assert p['authorization']['workflow_implemented'] is True
          assert p['authorization']['heavy_compute_authorized'] is False
          assert r['armed'] is False
          assert p['resource_preflight']['representative_payload_measurement_required'] is True
          assert p['resource_preflight']['storage_gate_passed'] is True
          assert p['resource_preflight']['measured_representative_payload_bytes'] == 448
          print('G4 cold gate only: heavy compute unavailable; measurement gate open')
          PY
