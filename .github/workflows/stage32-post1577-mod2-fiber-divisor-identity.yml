name: Stage32 post1577 direct mod2 fiber-divisor identity

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-post1577-mod2-fiber-divisor-identity.yml'
      - 'stages/stage32/controller.json'
      - 'stages/stage32/residual-32-01-production/post1577-mod2-fiber-divisor-identity*'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1577_mod2_fiber_divisor_identity.py'
      - 'stages/stage32/residual-32-01-production/post1484-v6-modular-factor-bidegree-source-note.md'
      - 'stages/stage32/residual-32-01-production/post1570-three-involution-q602-exclusion-batch.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-post1577-mod2-fiber-divisor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Resolve freshness authority
        run: |
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr_base="${{ github.event.pull_request.base.sha }}"
            test "$pr_base" = "$current_main"
            expected_base="$pr_base"
          else
            expected_base="$current_main"
          fi
          echo "STAGE32_EXPECTED_BASE_SHA=$expected_base" >> "$GITHUB_ENV"
      - name: Certify direct mod2 fiber-divisor identity
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1577_mod2_fiber_divisor_identity.py
      - name: Enforce no controller edit
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -qx 'stages/stage32/controller.json'; then
            echo 'controller.json must remain unchanged in post1577 preflight'
            exit 1
          fi
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
