name: Stage12-N1-2p final bookkeeping

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/stage12-n1-2p-final-bookkeeping.md"
      - "scripts/audit_final_bookkeeping_stage12_n1_2p.py"
      - "data/final_bookkeeping_stage12_n1_2p_report.json"
      - ".github/workflows/stage12-n1-2p-final-bookkeeping.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Stage12-N1-2p audit
        run: |
          python -m py_compile scripts/audit_final_bookkeeping_stage12_n1_2p.py
          python scripts/audit_final_bookkeeping_stage12_n1_2p.py > /tmp/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('data/final_bookkeeping_stage12_n1_2p_report.json').read_text())
          actual = json.loads(Path('/tmp/report.json').read_text())
          assert expected == actual, (expected, actual)
          PY
