name: Stage33 V91C1X R5B3B3C4B1E5B Rees gauge cross-action divisor transport

on:
  push:
    branches:
      - stage33-v91c1x-r5b3b3c4b1e-1757-refinement-unit-preflight
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b1e5b-rees-gauge-cross-action-divisor-transport.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e5b_rees_gauge_cross_action_divisor_transport.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e5a-rees-gauge-factor-carrier-binding.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e3-hilbert90-divisor-rees-attachment.json'
      - 'stages/stage33/33-07/exceptional-p1-tangent-coordinates.json'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b2d2_swap23_317_cover_common_refinement.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Materialize exact C4B1E5B cross-action divisor transport
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e5b_rees_gauge_cross_action_divisor_transport.py --write
      - name: Enforce artifact-only bounded delta
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e5b-rees-gauge-cross-action-divisor-transport.json'
          changed="$(git status --porcelain | sed 's/^...//')"
          test -n "$changed"
          test "$changed" = "$artifact"
          git diff --check
      - name: Commit generated certificate
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e5b-rees-gauge-cross-action-divisor-transport.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$artifact"
          git diff --cached --quiet || git commit -m '[Stage33] materialize C4B1E5B cross-action divisor transport artifact'
          git push
