name: Stage32 EX6 scratch degree8 hyperelliptic reconstruction

on:
  push:
    branches:
      - scratch/stage32-ex6-simultaneous-critical-support
    paths:
      - stages/stage32-ex6/scratch_diagnose_v6_degree8_hyperelliptic_fibers.py
      - .github/workflows/stage32-ex6-scratch-degree8-hyperelliptic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/stage32-ex6-simultaneous-critical-support
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact lightweight dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Reconstruct degree8 hyperelliptic fiber candidates
        run: |
          python -B stages/stage32-ex6/scratch_diagnose_v6_degree8_hyperelliptic_fibers.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --witness stages/stage32/32-21/post1473-v6-witness-body-recovered.json \
            --adapter-dir stages/stage32/residual-32-01-production | tee /tmp/ex6-degree8.json
      - name: Show compact decision
        run: |
          python -B - <<'PY'
          import json
          x=json.load(open('/tmp/ex6-degree8.json'))
          print(json.dumps(x['summary'], indent=2, sort_keys=True))
          for c in x['last_four_fibration_classes']:
              print({
                  'degree': c['fibration_v6_degree'],
                  'candidate_pair_count': c['candidate_pair_count'],
                  'perfect_matching': c['candidate_pairs_form_perfect_matching'],
                  'negative_D1': c['negative_D1_candidate_count'],
                  'D1_hist': c['candidate_D1_dot_R_histogram'],
              })
          PY
      - name: Enforce read-only replay
        run: git diff --exit-code && test -z "$(git status --porcelain)"
