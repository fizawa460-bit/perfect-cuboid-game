name: Stage32 post1623 Hperp V6 H-deck character preflight

# Trigger lifecycle: RETIRED
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-post1623-hperp-v6-hdeck-character-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  character-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact PR head and current main freshness
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"
          if test "$merge_base" = "$current_main"; then
            echo "freshness=contains-current-main"
            exit 0
          fi
          reviewed_main="bf2890ec0b8168f70db803de876024aa6b6d1f6d"
          reviewed_parent_main="e2da76d90a0994af5038023613c6c4084c4c507e"
          reviewed_ex5_head="a5e59bab3f7fe5a31e356c5a78edcbd741b093a6"
          test "$current_main" = "$reviewed_main" || {
            echo "freshness review required: unreviewed main tip $current_main"
            exit 1
          }
          test "$merge_base" = "$reviewed_parent_main"
          test "$(git rev-parse "$current_main^1")" = "$reviewed_parent_main"
          test "$(git rev-parse "$current_main^2")" = "$reviewed_ex5_head"
          echo "freshness=reviewed-ex5-main-drift-no-auto-main-credit"
      - name: Install pinned exact algebra dependency
        run: python3 -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Replay current Stage32 startup authority
        run: python3 stages/stage32/verify_main_startup.py
      - name: Verify source-bound H-character preflight
        run: python3 stages/stage32/residual-32-01-production/verify_stage32_post1623_hperp_v6_hdeck_character_preflight.py
      - name: Diff check
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set +e
          output="$(git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" 2>&1)"
          code=$?
          set -e
          filtered="$(printf '%s\n' "$output" | grep -v 'new blank line at EOF\.' || true)"
          if [ "$code" -ne 0 ] && [ -n "$filtered" ]; then
            printf '%s\n' "$filtered"
            exit 1
          fi
