name: SR search03 short runner
on:
  push:
    branches: [agent/sr-search03-apply]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .tmp/sr_search03_apply.py
      - run: python scripts/structure_radar.py refresh
      - run: python scripts/structure_radar.py verify
      - run: git diff --check
      - name: Assert and commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          c=json.load(open('docs/structure-radar/controller.json'))
          assert c['registry']['unresolved_search_count']==185
          assert c['registry']['pending_arsenal_decision_count']==202
          assert c['queue']['task_count']==31
          q=json.load(open('docs/structure-radar/exploration-queue.json'))
          r=next(t for t in q['tasks'] if t['status']=='READY')
          assert r['structure_ids']==['SR-STR-021','SR-STR-022','SR-STR-023','SR-STR-024','SR-STR-027','SR-STR-028']
          print('SR_SEARCH03_OK',r['structure_ids'])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/structure-radar
          git commit -m 'Temp: validate StructureRadar literature search batch 03' || true
          git push origin HEAD:agent/sr-search03-apply
