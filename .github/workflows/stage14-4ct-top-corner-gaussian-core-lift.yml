name: Stage14-4ct top-corner Gaussian core lift
on:
  pull_request:
    paths:
      - 'stages/stage14/14-4ct/**'
      - 'stages/stage14/scripts/14-4/top_corner_gaussian_core_lift_audit.py'
      - 'stages/stage14/data/14-4/top_corner_gaussian_core_lift_summary.json'
      - '.github/workflows/stage14-4ct-top-corner-gaussian-core-lift.yml'
      - 'stages/stage14/14-s7-32/**'
      - 'stages/stage14/14-4cs/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Stage14-4ct audit
        run: python stages/stage14/scripts/14-4/top_corner_gaussian_core_lift_audit.py
      - name: Run s7-32 regression
        run: python stages/stage14/scripts/14-s7-32/one_host_gaussian_boundary_audit.py
      - name: Run 4cs regression
        run: python stages/stage14/scripts/14-4/five_eighths_boundary_split_audit.py
      - name: Lock theorem boundary
        run: |
          f=stages/stage14/14-4ct/result.md
          grep -Fq 'STAGE14_4CT=COMPLETE_TOP_CORNER_RESIDUAL_HOST_GCD_PEEL_AND_PRIMITIVE_GAUSSIAN_COMMON_CORE_LIFT' "$f"
          grep -Fq 'UNIQUE_FIVE_EIGHTHS_SATURATION_THETA=5/16' "$f"
          grep -Fq 'UNIQUE_FIVE_EIGHTHS_SATURATION_PHI=1/4' "$f"
          grep -Fq 'RESIDUAL_HOST_EXCESS_SQUARE_DIVIDES_VRES=true' "$f"
          grep -Fq 'CANONICAL_GOOD_COMMON_CORE_GAUSSIAN_DIVISOR_EXISTS=true' "$f"
          grep -Fq 'GCD_STRATIFIED_XI_HOST_BLOCK_EXPONENT=5/8-rho' "$f"
          grep -Fq 'FIVE_EIGHTHS_SATURATION_REQUIRES_RESIDUAL_HOST_GCD=Bo1' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=5/8' "$f"
          grep -Fq 'REMAINING_RECEIVER=TopCornerPrimitiveXiResidualGaussianCoreAgreementIncidence' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-4cu' "$f"
