name: Stage25 reentry r010a two-face backflow

on:
  pull_request:
    paths:
      - 'stages/stage25/25-reentry-r010a/**'
      - 'stages/stage18/post-stage25-r010a.md'
      - 'stages/stage20/post-stage25-r010a.md'
      - 'stages/stage22/post-stage25-r010a.md'
      - 'stages/stage25/25-reentry-controller.json'
      - '.github/workflows/stage25-reentry-r010a-backflow.yml'

jobs:
  verify-r010a:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage25 reentry r010a receiver synchronization
        run: python stages/stage25/25-reentry-r010a/verify_r010a.py
