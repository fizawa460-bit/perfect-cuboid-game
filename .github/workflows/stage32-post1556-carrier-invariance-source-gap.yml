name: Stage32 post1556 carrier invariance source gap

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-post1556-carrier-invariance-source-gap.yml'
      - 'stages/stage32/controller.json'
      - 'stages/stage32/residual-32-01-production/post1556-carrier-invariance-source-gap*'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1556_carrier_invariance_source_gap.py'
      - 'stages/stage32/residual-32-01-production/post1555-b3-full-g-box-quotient-normalizer.json'
      - 'stages/stage32/residual-32-01-production/post1484-o210-q4-common-double-cover-cartesian-identity.json'
      - 'stages/stage32/residual-32-01-production/post1484-v6-modular-factor-bidegree-source-note.md'
      - 'docs/arsenal/index.json'
      - 'docs/arsenal/cards/provisional/S32-PW05.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Certify retained carrier-invariance source gap
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1556_carrier_invariance_source_gap.py
      - name: Check Arsenal generated cards
        run: python3 -B docs/arsenal/sync_arsenal_catalog.py --check
      - name: Enforce no controller edit
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -qx 'stages/stage32/controller.json'; then
            echo 'controller.json must remain unchanged in this bounded source-gap leaf'
            exit 1
          fi
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
