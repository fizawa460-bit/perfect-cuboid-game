name: Stage15-2b third-face thin cover

on:
  pull_request:
    paths:
      - 'stages/stage15/15-2b/**'
      - 'stages/stage15/replay/verify_stage15_2b.py'
      - '.github/workflows/stage15-2b-third-face-thin.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-2b thin-cover subtraction
        run: python stages/stage15/replay/verify_stage15_2b.py
