name: Repository workflow lifecycle migration (one shot)

on:
  push:
    branches:
      - repo-agents-active-workflow-trigger-policy

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repo-agents-active-workflow-trigger-policy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize repo workflow lifecycle and generate inventory
        run: python docs/research-os/policies/verify_repo_workflow_trigger_inventory.py --fix --write-inventory
      - name: Remove one-shot workflow and commit migration
        shell: bash
        run: |
          rm .github/workflows/repo-workflow-lifecycle-migration-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows docs/research-os/policies/repo-workflow-trigger-inventory-20260911.json
          if git diff --cached --quiet; then
            echo 'No migration changes to commit'
            exit 0
          fi
          git commit -m '[workflow] normalize repository lifecycle triggers'
          git push origin HEAD:repo-agents-active-workflow-trigger-policy
