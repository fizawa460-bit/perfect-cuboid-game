# synchronize trigger
name: StructureRadar SR-SEARCH batch02 validator
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sr-search02-apply
      - name: Apply literature search batch 02
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          r = pathlib.Path('.')
          ids = [f'SR-STR-{i:03d}' for i in range(7,13)]
          batch = 'SR-BATCH-LITERATURE_SEARCH-02-R01'
          task = 'SR-SEARCH-01'
          ledger = 'docs/structure-radar/literature/SR-SEARCH-02.md'
          rp = r/'docs/structure-radar/structure-registry.json'
          reg = json.loads(rp.read_text())
          cards = {c['structure_id']: c for c in reg['structures']}
          pp = r/'docs/structure-radar/progress.json'
          prog = json.loads(pp.read_text())
          existing = next((x for x in prog['audit_batches'] if x.get('batch_id') == batch), None)
          desired = {'SR-STR-007':'ACTIVE','SR-STR-008':'ACTIVE','SR-STR-009':'ACTIVE','SR-STR-010':'ACTIVE','SR-STR-011':'ACTIVE','SR-STR-012':'EXTERNAL_GATE'}
          if existing is None:
              for cid in ids:
                  c = cards[cid]
                  assert c['search_status'] == 'NOT_SEARCHED', (cid,c['search_status'])
                  if cid != 'SR-STR-012': assert c['arsenal_decision'] == 'PENDING', (cid,c['arsenal_decision'])
                  else: assert c['arsenal_decision'] == 'EXTERNAL_GATE', c['arsenal_decision']
                  assert c['card_status'] == 'NORMALIZED', (cid,c['card_status'])
                  c['search_status']='SEARCHED'; c['arsenal_decision']=desired[cid]; c['search_ledger']=ledger
              rp.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')
              prog['audit_batches'].append({'batch_id':batch,'task_id':task,'status':'SUBMITTED_FOR_AUDIT','source_ids':[],'sources_reviewed':0,'structures_added':0,'structures_updated':6,'structure_carrier_sources':0,'structures_deduped':0,'searches_completed':6,'arsenal_decisions':5,'audit_required':True,'duplicate_source':0,'no_distinct_structure':0})
              pp.write_text(json.dumps(prog,indent=2,ensure_ascii=False)+'\n')
              lp=r/ledger; lp.parent.mkdir(parents=True,exist_ok=True)
              lp.write_text(r'''# StructureRadar literature ledger — search batch 02

SEARCH_TASK=SR-SEARCH-01
BATCH_ID=SR-BATCH-LITERATURE_SEARCH-02-R01
SEARCH_DATE=2026-08-19
STRUCTURES=SR-STR-007,SR-STR-008,SR-STR-009,SR-STR-010,SR-STR-011,SR-STR-012
EVIDENCE_POLICY=primary sources for external theorem claims; repo arsenal checked first
NOVELTY_BY_SEARCH_ABSENCE=false

This batch evaluates the next six normalized cards after the audited/merged first literature batch. `ACTIVE` means the existing audited repo weapon remains reusable on its exact population/height/multiplicity contract. `EXTERNAL_GATE` means an external theorem exists but a receiver must still prove the stated repo-native model/height adapter before reuse.

## SR-STR-007 — Directional exactly-two face-mask identities
Repo identity: `N2,a=A_ab,ac-A3`, `N2,b=A_ab,bc-A3`, `N2,c=A_ac,bc-A3`; directional contrasts cancel the common `A3` exactly. Existing weapon: `S23-W02`. This is finite inclusion/exclusion on repo incidence masks, not a literature-dependent analytic theorem. Transfer verdict: `REPO_EXACT_IDENTITY; NO_EXTERNAL_UPGRADE_NEEDED`. Smallest transfer test: reproduce the exactly-two truth table and preserve the same directional incidence measure. Arsenal decision: `ACTIVE`.

## SR-STR-008 — Thin but infinite space-diagonal cover of the exactly-two-face host
Repo theorem: `B^(1/4) << N2(B) <<_epsilon B^(1/2+epsilon)`, hence `N2/M2 -> 0` while `N2 -> infinity`; true exponent unresolved. Existing weapons: `S24-W-THIN-COVER`, `S25-W01`, `S25-W03` and the Stage14 half-power upper interface. Takumi Yoshida, arXiv:2407.09825, constructs a 32:1 surjection from elliptic-curve data to equivalence classes of rational face cuboids and proves infinitely many classes, but not the repo primitive-canonical integer Euclidean-height corridor. Browning--Loughran, arXiv:1705.01999, gives general sieve/thin-set machinery but not this cuboid corridor without exact model/height adapters. Transfer verdict: `ADJACENT_INFINITUDE + GENERAL_THIN_SET_METHOD; NO_STRONGER_DIRECT_HEIGHT_COLLISION`. Arsenal decision: `ACTIVE`.

## SR-STR-009 — Euler-completion proportion on the unmarked at-least-two-face host
Repo object: `H_ge2=M2+M3`, `Phi=M3/(M2+M3)`, `Phi -> 0`. Existing exact weapon: `S26-W02 Phi`. Primary Euler-brick literature located does not state this same-measure primitive-canonical Euclidean-height completion ratio. General toric Manin/equidistribution results govern the ambient side only after repo-specific model/height identification and do not independently count the Euler-brick numerator under the exact height. Transfer verdict: `REPO_MEASURE_ADAPTER + EXISTING_AUDITED_COUNTING_INPUTS; NO_DIRECT_EXTERNAL_RATIO`. Keep distinct from raw incidence `P=M2+3M3` and adjacent-stratum `M3/M2`. Arsenal decision: `ACTIVE`.

## SR-STR-010 — Multiplicity-three Euler-completion proportion on raw face-pair incidences
Repo object: `P_j=M2,j+M3`, `P=M2+3M3`, `Theta_j=M3/P_j`, `Theta=3M3/(M2+3M3)`. Existing weapons: `S25-W05` and `S26-W02 Theta`. The factor three is exact incidence multiplicity, not an independence factor. No primary source found states the exact raw-incidence cuboid measure together with the repo primitive/canonical Euclidean-height corridor. Transfer verdict: `REPO_EXACT_MULTIPLICITY_ADAPTER; NO_DIRECT_EXTERNAL_RAW_INCIDENCE_COLLISION`. Smallest transfer test: each Euler brick contributes three raw face-pair incidences and once to each directional `P_j`. Arsenal decision: `ACTIVE`.

## SR-STR-011 — Balanced Cayley-Gaussian packet normal form
Repo object: every active Stage14 face is covered by finitely decorated Cayley/Gaussian strips after gcd, sign, 2-primary and dyadic localization. Existing weapon: `AR-007`. Classical Euclid/Gaussian parametrizations explain individual primitive Pythagorean faces, but the balanced strip, common-core bookkeeping, decorations, physical masks and Stage14 height ranges are repo-specific. Focused primary-source search found no theorem with this exact packet measure and all decorations. Transfer verdict: `CLASSICAL_ALGEBRAIC_CONTEXT + REPO_SPECIFIC_NORMAL_FORM`. Smallest transfer test: preserve gcd, sign, 2-primary, dyadic, cutoff and face/space masks in both directions. Arsenal decision: `ACTIVE`.

## SR-STR-012 — Uniform elliptic finite-fiber degree bridge
Repo object: `E_t:Y^2=X(X-1)(X+t^2)` plus rational 2-torsion and polynomial model/point height control yields `deg_B(F)=B^o(1)`. Existing interface: `AR-005`. Marta Dujella, arXiv:2312.03655, Theorem 1.1, gives a uniform `exp(C log B/log log B)` bound for rational points of exponential height at most `B` on elliptic curves over a fixed number field with a rational point of exact prime order, above the curve-height threshold; for `ell=2` this applies over `Q`. Francesco Naccarato, arXiv:2105.04032, proves the same quality over `Q` with one nontrivial rational 2-torsion point. Variable dictionary: the theorem height must dominate the relevant elliptic-point height and the curve-height threshold. Repo reuse therefore still needs a uniform polynomial physical-to-Weil/curve-height comparison. Transfer verdict: `EXTERNAL_THEOREM_FOUND; EXACT_MODEL_AND_HEIGHT_ADAPTER_REQUIRED`. Smallest transfer test: nonsingularity, rational 2-torsion, fixed-degree Weierstrass change, `h(E_t)=O(log B_phys)`, and point exponential height `<=B_phys^C` uniformly. Arsenal decision: `EXTERNAL_GATE` retained.

## Batch decision
SEARCHES_COMPLETED=6
ARSENAL_DECISIONS_RESOLVED_FROM_PENDING=5
EXISTING_ACTIVE_WEAPONS_CONFIRMED=5
EXTERNAL_GATES_CONFIRMED=1
NEW_EXTERNAL_ACTIVE_WEAPONS=0
DIRECT_STRONGER_SAME_POPULATION_HEIGHT_COLLISIONS=0
NOVELTY_BY_SEARCH_ABSENCE=false
PERFECT_CUBOID_EXISTENCE_PROMOTED=false
PERFECT_CUBOID_NONEXISTENCE_PROMOTED=false
''')
          else:
              for cid in ids:
                  assert cards[cid]['search_status']=='SEARCHED'; assert cards[cid]['arsenal_decision']==desired[cid]; assert cards[cid].get('search_ledger')==ledger
          PY
      - name: Refresh verify and assert
        shell: bash
        run: |
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git diff --check
          python - <<'PY'
          import json,pathlib
          r=pathlib.Path('.'); reg=json.loads((r/'docs/structure-radar/structure-registry.json').read_text()); cards={c['structure_id']:c for c in reg['structures']}; ids=[f'SR-STR-{i:03d}' for i in range(7,13)]
          assert all(cards[x]['search_status']=='SEARCHED' for x in ids)
          assert [cards[x]['arsenal_decision'] for x in ids]==['ACTIVE','ACTIVE','ACTIVE','ACTIVE','ACTIVE','EXTERNAL_GATE']
          c=json.loads((r/'docs/structure-radar/controller.json').read_text()); assert c['registry']['unresolved_search_count']==191,c['registry']; assert c['registry']['pending_arsenal_decision_count']==206,c['registry']; assert c['queue']['task_count']==32,c['queue']
          q=json.loads((r/'docs/structure-radar/exploration-queue.json').read_text()); ready=next(t for t in q['tasks'] if t['status']=='READY'); assert ready['phase']=='LITERATURE_SEARCH'; assert ready['structure_ids']==['SR-STR-013','SR-STR-015','SR-STR-017','SR-STR-018','SR-STR-019','SR-STR-020'],ready
          print('SR_SEARCH02_VALIDATED',ready['task_id'],ready['structure_ids'])
          PY
      - name: Commit validated official blobs
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/structure-radar
          git commit -m 'Temp: validate StructureRadar literature search batch 02' || true
          git push origin HEAD:agent/sr-search02-apply
