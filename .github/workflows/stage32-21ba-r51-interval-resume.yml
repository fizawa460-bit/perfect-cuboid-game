name: Stage32-21ba exact r51 interval suffix resume

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stage32-21ba-r51-interval-resume.yml'
      - 'stages/stage32/32-21/32-21ba-prefix-lock.json'
      - 'stages/stage32/32-21/32-21az-survivor-prism.json'
      - 'stages/stage32/residual-32-01-production/certify_stage32_21ba_r51_interval_resume.py'
      - 'stages/stage32/residual-32-01-production/certify_stage32_21ba_r51_interval_census.py'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_21ak_affine_2adic_membership.py'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_21aj_2adic_pairing_saturation.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'

permissions:
  contents: read

concurrency:
  group: stage32-21ba-r51-interval-resume-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Resume remaining exact r51 intervals
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python certify_stage32_21ba_r51_interval_resume.py \
            --source-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21az-survivor-prism.json" \
            --prefix-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21ba-prefix-lock.json" \
            --retained "$GITHUB_WORKSPACE/stages/stage33/33-07/picard_base_rows_retained.py" \
            --marking "$GITHUB_WORKSPACE/stages/stage33/33-07/stage32_picard_marking_retained.py" \
            --wall-seconds 180 \
            --per-check-timeout-ms 1000 \
            --output "$GITHUB_WORKSPACE/stage32-21ba-r51-interval-resume.json"
      - name: Upload compact exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-21ba-r51-interval-resume
          path: stage32-21ba-r51-interval-resume.json
          retention-days: 3
          compression-level: 9
