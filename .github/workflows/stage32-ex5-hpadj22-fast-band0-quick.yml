name: Stage32EX5 HPADJ22 quick speed benchmark band0
on:
  push:
    branches: [stage32ex5-hpadj22-speedup-scratch-20260918]
    paths:
      - 'stages/stage32-ex5/hpadj-22_ex5/benchmark_fast_band0_quick.py'
      - '.github/workflows/stage32-ex5-hpadj22-fast-band0-quick.yml'
permissions:
  contents: read
  actions: read
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10.6'}
      - uses: actions/download-artifact@v4
        with:
          name: hpadj21-carry-bundle
          path: h21
          run-id: 35275839413
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: hpadj22-band-0
          path: old0
          run-id: 35303482505
          github-token: ${{ github.token }}
      - run: python stages/stage32-ex5/hpadj-22_ex5/benchmark_fast_band0_quick.py --h21-dir h21 --old-dir old0
