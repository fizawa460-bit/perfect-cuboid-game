name: Stage15-6ai genus-one model

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6ai/**'
      - 'stages/stage15/evidence/stage15_6ai_genus_one_model.json'
      - 'stages/stage15/replay/verify_stage15_6ai.py'
      - 'stages/stage15/scripts/stage15_6ai_genus_one_model.py'
      - '.github/workflows/stage15-6ai-genus-one-model.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6ai projective genus-one model
        run: python stages/stage15/replay/verify_stage15_6ai.py
      - name: Compile Stage15-6ai utility
        run: python -m py_compile stages/stage15/scripts/stage15_6ai_genus_one_model.py stages/stage15/replay/verify_stage15_6ai.py
