name: Stage32 32-01-178 N280 all48 x4 normal-mass lattice

on:
  pull_request:
    paths:
      - 'stages/stage32/32-01-178/nodes/N260/**'
      - 'stages/stage32/32-01-178/nodes/N280/**'
      - 'stages/stage32/residual-32-01-production/hperp_integral_adapter.py'
      - '.github/workflows/stage32-01-178-n280-all48-normalmass-lattice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify N280 all48+x4+normal-mass exact lattice condition
        run: python stages/stage32/32-01-178/nodes/N280/verify_n280_all48_x4_normalmass_lattice.py
