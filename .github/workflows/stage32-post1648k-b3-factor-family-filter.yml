name: Stage32 post1648K b3 factor-family filter

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  b3-factor-family-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Run exact factor-family filter
        run: python3 -B stages/stage32/residual-32-01-production/diagnose_stage32_post1648k_b3_factor_family_filter.py
      - name: Diff check
        run: git diff --check
