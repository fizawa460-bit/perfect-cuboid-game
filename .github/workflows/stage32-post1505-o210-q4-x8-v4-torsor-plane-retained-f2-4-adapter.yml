name: Stage32 post1505 O210 retained F2^4 W adapter

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-post1505-o210-q4-x8-v4-torsor-plane-retained-f2-4-adapter.yml'
      - 'stages/stage32/controller.json'
      - 'stages/stage32/residual-32-01-production/post1505-o210-q4-x8-v4-torsor-plane-retained-f2-4-adapter*'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1505_o210_q4_x8_v4_torsor_plane_retained_f2_4_adapter.py'
      - 'stages/stage32/residual-32-01-production/post1505-o210-q4-x8-v4-torsor-plane-weierstrass-lock.json'
      - 'stages/stage32/residual-32-01-production/post1490-o210-q4-bolza-principal-rosati-lock.json'
      - 'stages/stage32/residual-32-01-production/post1503-o210-q4-relative-v4-torsor-mod2-coupling.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Certify retained F2^4 W adapter and pointwise Q602 pruning
        run: python stages/stage32/residual-32-01-production/certify_stage32_post1505_o210_q4_x8_v4_torsor_plane_retained_f2_4_adapter.py --check stages/stage32/residual-32-01-production/post1505-o210-q4-x8-v4-torsor-plane-retained-f2-4-adapter.json
