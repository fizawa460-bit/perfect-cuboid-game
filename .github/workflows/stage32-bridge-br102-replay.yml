# lifecycle: ACTIVE_AUTO (temporary BR102 research replay; delete after retained compact result)
name: Stage32 BRIDGE BR102 replay

on:
  push:
    branches:
      - stage32bridge-mainbatch
    paths:
      - 'stages/stage32/generalization-bridge/**'
      - '.github/workflows/stage32-bridge-br102-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  br102-kres-picard64:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact lightweight dependency
        run: python -m pip install --disable-pip-version-check sympy==1.13.3
      - name: Replay BR102 K_res Picard64 covector adapter
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/br102-kres.json"
          python stages/stage32/generalization-bridge/verify_br102_kres_picard64_covector_adapter.py > "$out"
          python - "$out" <<'PY'
          import hashlib, json, sys
          p = sys.argv[1]
          d = json.load(open(p))
          free = d['ell_free_nonzero']
          fixed = d['ell_fixed_nonzero']
          compact = {
              'status': d['status'],
              'kres_square': d['kres_square'],
              'terminal_visible_on_hpadj_interface': d['terminal_visible_on_hpadj_interface'],
              'next_route': d['next_route'],
              'fixed_nonzero_count': len(fixed),
              'fixed_nonzero': fixed,
              'free_nonzero_count': len(free),
              'free_nonzero': free,
              'relevant_node_to_retained_exceptional': {
                  str(node): label
                  for label, node in d['retained_exceptional_to_mb104_node'].items()
                  if int(node) in {24,25,26,27,32,33,34,35}
              },
              'result_sha256': hashlib.sha256(open(p,'rb').read()).hexdigest(),
          }
          print('BR102_COMPACT_RESULT=' + json.dumps(compact, sort_keys=True, separators=(',', ':')))
          PY
