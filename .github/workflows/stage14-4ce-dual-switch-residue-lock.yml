name: Stage14-4ce dual switch residue lock

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4ce/**'
      - 'stages/stage14/data/14-4/dual_switch_residue_lock_summary.json'
      - 'stages/stage14/scripts/14-4/dual_switch_residue_lock_audit.py'
      - 'stages/stage14/scripts/14-4/dual_pythagorean_switch_audit.py'
      - '.github/workflows/stage14-4ce-dual-switch-residue-lock.yml'
      - 'stages/stage14/14-4cd/**'
      - 'stages/stage14/14-s7-18/**'
      - 'stages/stage14/14-s7-19/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile audits
        run: |
          python -m py_compile stages/stage14/scripts/14-4/dual_switch_residue_lock_audit.py
          python -m py_compile stages/stage14/scripts/14-4/dual_pythagorean_switch_audit.py
      - name: Run dual-switch audit
        run: python stages/stage14/scripts/14-4/dual_switch_residue_lock_audit.py
      - name: Run dual-Pythagorean audit
        run: python stages/stage14/scripts/14-4/dual_pythagorean_switch_audit.py
      - name: Lock theorem boundary
        shell: bash
        run: |
          set -euo pipefail
          f=stages/stage14/14-4ce/result.md
          a=stages/stage14/14-4ce/s7-19-addendum.md
          grep -F 'STAGE14_4CE=COMPLETE_DUAL_SPLIT_SWITCH_RIGIDITY_AND_PRIMEWISE_RESIDUE_LOCK' "$f"
          grep -F 'FOUR_CD_ENDPOINT_XI_SWITCH_LOWER_EXPONENT=1/4' "$f"
          grep -F 'FOUR_CD_ENDPOINT_K_SWITCH_LOWER_EXPONENT=3/8' "$f"
          grep -F 'ODD_XI_SWITCH_PRIMES_ARE_1_MOD_4=true' "$f"
          grep -F 'ODD_K_SWITCH_PRIMES_ARE_1_MOD_4=true' "$f"
          grep -F 'DUAL_SWITCH_PRIMEWISE_RESIDUE_INCIDENCE_PROVED=false' "$f"
          grep -F 'MERGED_S7_19_IMPORTED=true' "$a"
          grep -F 'DUAL_PRIMITIVE_PYTHAGOREAN_COMPOSITION_PROVED=true' "$a"
          grep -F 'DUAL_TRANSVERSE_K0_LOWER_EXPONENT=3/8' "$a"
          grep -F 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/8' "$a"
          grep -F 'MAINLINE_H_NEEDED=false' "$a"
          grep -F 'NEXT=Stage14-4cf' "$a"
