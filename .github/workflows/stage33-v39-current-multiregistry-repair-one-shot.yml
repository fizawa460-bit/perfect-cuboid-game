name: Stage33 V39 current-multiregistry audit repair one-shot

on:
  push:
    branches:
      - stage33-post1488-v25-cech-lattice-continuation
    paths:
      - stages/stage33/apply_post_audit_multiregistry_v40.py
      - .github/workflows/stage33-v39-current-multiregistry-repair-one-shot.yml

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage33-post1488-v25-cech-lattice-continuation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply current-multiregistry hostile-audit repair
        run: |
          python stages/stage33/apply_post_audit_multiregistry_v40.py
      - name: Commit repaired Stage33 authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            stages/stage33/controller.json \
            stages/stage33/sync_main_state.py \
            stages/stage33/MAIN-START-HERE.md \
            stages/stage33/CURRENT.md \
            stages/stage33/33-12/j2-post-v38-locator-first-construction-policy-v39.json \
            stages/stage33/33-12/verify_j2_post_v38_locator_first_construction_policy_v39.py
          git add -f stages/stage33/MAIN-STATE.json
          git diff --cached --check
          git commit -m "Stage33: source-lock current multi-registry locator"
          git push origin HEAD:stage33-post1488-v25-cech-lattice-continuation
