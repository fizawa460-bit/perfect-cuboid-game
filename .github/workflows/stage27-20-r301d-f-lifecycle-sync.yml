name: Stage27-20-r301d-f lifecycle sync
on:
  push:
    branches: [agent/stage27-20-r301d-f-local-sieve-batch]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-20-r301d-f-local-sieve-batch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply canonical lifecycle sync
        run: python stages/stage27/27-20-r301d-f/lifecycle_sync.py
      - name: Verify synchronized state
        run: |
          python stages/stage27/27-20-r301d-f/verify_27_20_r301d_f.py
          python -m json.tool stages/stage27/27-controller.json >/dev/null
          git diff --check
      - name: Commit synchronized state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage27/27-controller.json
          if ! git diff --cached --quiet; then
            git commit -m 'Stage27-20-r301d-f canonical lifecycle sync [r301df-sync]'
            git push origin HEAD:agent/stage27-20-r301d-f-local-sieve-batch
          fi
