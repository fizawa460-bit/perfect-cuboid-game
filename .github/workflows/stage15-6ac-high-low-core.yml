name: Stage15-6ac high-low core

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6ac/**'
      - 'stages/stage15/evidence/stage15_6ac_high_low_core.json'
      - 'stages/stage15/replay/verify_stage15_6ac.py'
      - 'stages/stage15/scripts/stage15_6ac_high_low_core.py'
      - '.github/workflows/stage15-6ac-high-low-core.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6ac high/low core split
        run: python stages/stage15/replay/verify_stage15_6ac.py
