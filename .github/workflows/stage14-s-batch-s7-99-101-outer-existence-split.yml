name: Stage14-s-batch s7-99..101 outer existence split

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-99/**'
      - 'stages/stage14/14-s7-100/**'
      - 'stages/stage14/14-s7-101/**'
      - 'stages/stage14/14-s-batch/s7-99-101-report.md'
      - 'stages/stage14/scripts/14-s-batch/s7_99_101_outer_existence_split_audit.py'
      - '.github/workflows/stage14-s-batch-s7-99-101-outer-existence-split.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Batch deterministic audit
        run: python stages/stage14/scripts/14-s-batch/s7_99_101_outer_existence_split_audit.py

      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/14-s-batch/s7_99_101_outer_existence_split_audit.py

      - name: Regress merged s7-96..98
        run: python stages/stage14/scripts/14-s-batch/s7_96_98_weight_factorization_audit.py

      - name: Regress merged mainline 4fn..4fp
        run: python stages/stage14/scripts/14-4/batch_4fn_4fp_outer_physical_support_audit.py

      - name: Regress merged Work-buX33
        run: python stages/stage14/scripts/14-Work-buX33/support_occupancy_adapter_audit.py

      - name: Lock common and s batch contracts
        run: |
          grep -Fq '## Integrated sH work unit' docs/stage14-s-batch-task-contract.md
          grep -Fq 'BATCH_INTEGRATED_H_UNITS=' docs/stage14-batch-common-contract.md
          grep -Fq 'unresolved_external_gate' docs/stage14-batch-common-contract.md

      - name: Lock batch boundary
        run: |
          grep -Fq 'STAGE14_S7_99=COMPLETE_OUTER_PHYSICAL_EXISTENCE_SUPPORT_SYNCHRONIZATION_AND_S_REALIZATION_SPLIT' stages/stage14/14-s7-99/result.md
          grep -Fq 'STAGE14_S7_100=COMPLETE_FIXED_PRIMITIVE_PRODUCT_TO_ONE_DIMENSIONAL_COMPLEMENTARY_DILATION_PHYSICAL_COMPLETION_SUPPORT' stages/stage14/14-s7-100/result.md
          grep -Fq 'STAGE14_S7_101=COMPLETE_FIXED_E_OUTER_EXISTENCE_SUPPORT_TO_PRIMITIVE_ENDPOINT_OR_TWO_SIDED_UNITARY_PARTITION_RECEIVERS' stages/stage14/14-s7-101/result.md
          grep -Fq 'WORK_BUX33_REVISIT_TRIGGER_S7_101_REACHED=true' stages/stage14/14-s7-101/result.md
          grep -Fq 'BATCH_SUBSTANTIVE_WORK_UNIT_COUNT=3' stages/stage14/14-s-batch/s7-99-101-report.md
          grep -Fq 'BATCH_INTEGRATED_H_UNITS=NONE' stages/stage14/14-s-batch/s7-99-101-report.md
          grep -Fq 'BATCH_STOP_REASON=receiver_change' stages/stage14/14-s-batch/s7-99-101-report.md
          grep -Fq 'NEXT=Stage14-s7-102' stages/stage14/14-s-batch/s7-99-101-report.md

      - name: Diff check
        run: git diff --check origin/main...HEAD
