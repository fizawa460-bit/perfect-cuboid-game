name: Stage25-30 ratio consistency audit

on:
  pull_request:
    paths:
      - 'stages/stage25/25-30/**'
      - 'stages/stage25/25-controller.json'
      - '.github/workflows/stage25-30-ratio-audit.yml'
  workflow_dispatch:

jobs:
  ratio-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage25 checkpoint30 ratio consistency
        run: python stages/stage25/25-30/ratio_audit.py
