name: StructureRadar history batch32 finalizer
on:
  push:
    branches: [structure-radar-history-batch-32]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply batch32 census
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('.')
          batch_id='SR-BATCH-STAGE02_13_HISTORY-32-R01'
          task_id='SR-CENSUS-STAGE02_13_HISTORY-01'
          M={
          'SRC-29353DDF7796':None,
          'SRC-43D95E9569D3':['SR-STR-029','SR-STR-030','SR-STR-031','SR-STR-227'],
          'SRC-EE7549EBC7C3':None,
          'SRC-C44BB40760B2':None,
          'SRC-1278175CBA48':None,
          'SRC-7ABF960F2716':['SR-STR-029','SR-STR-030','SR-STR-041','SR-STR-226','SR-STR-227'],
          'SRC-52E11A8760D5':['SR-STR-031','SR-STR-227'],
          'SRC-F4C4521CAF2D':['SR-STR-031','SR-STR-227'],
          'SRC-7BF07E159F3B':['SR-STR-028','SR-STR-029','SR-STR-030','SR-STR-031','SR-STR-041','SR-STR-226','SR-STR-227'],
          'SRC-897FB0917009':['SR-STR-028','SR-STR-029','SR-STR-030','SR-STR-031','SR-STR-041','SR-STR-226','SR-STR-227'],
          'SRC-361FD4B35E7B':None,
          'SRC-8D33AC33A463':None,
          'SRC-BE7D7B8511A7':None,
          'SRC-869B08648BF5':None,
          'SRC-A38ABEF612DC':None,
          'SRC-4FA6BA5BB0C2':None,
          'SRC-DDCC775B8DA4':None,
          'SRC-D867B0129332':None,
          'SRC-127CA0B9FC25':['SR-STR-030','SR-STR-227'],
          'SRC-A73E3165B2F5':['SR-STR-227'],
          'SRC-96E88B854574':['SR-STR-227'],
          'SRC-8D0A87943C94':['SR-STR-028','SR-STR-227'],
          'SRC-397EC26FF331':['SR-STR-028','SR-STR-227'],
          'SRC-8A248C059524':['SR-STR-227'],
          'SRC-E5931D885808':['SR-STR-227'],
          'SRC-A0B3BDB5F8BD':['SR-STR-041','SR-STR-226','SR-STR-227'],
          'SRC-7733025CDB7A':['SR-STR-013','SR-STR-041','SR-STR-226','SR-STR-227'],
          'SRC-B1452E59C0BF':['SR-STR-031','SR-STR-227'],
          'SRC-34BB7AE2325C':['SR-STR-031','SR-STR-227'],
          'SRC-D6C6478BC65B':['SR-STR-029','SR-STR-227'],
          'SRC-CB3F8F318EE8':['SR-STR-029','SR-STR-227'],
          'SRC-1C2EA7918966':['SR-STR-028','SR-STR-029','SR-STR-030','SR-STR-031','SR-STR-041','SR-STR-226','SR-STR-227'],
          'SRC-E6BAA386E137':['SR-STR-028','SR-STR-029','SR-STR-030','SR-STR-031','SR-STR-041','SR-STR-226','SR-STR-227'],
          'SRC-A4ABFBC94A85':None,
          'SRC-55C1A28F9766':None,
          'SRC-117BE983BF6D':None,
          'SRC-B262D5C850B8':None,
          'SRC-5A754ABED58B':None,
          'SRC-FE872260AE1A':None,
          'SRC-AB1FDF34758C':None,
          'SRC-BCB57B0D375D':None,
          'SRC-78620B3E055F':['SR-STR-227'],
          'SRC-D57F34DC9AB9':['SR-STR-227'],
          'SRC-A4584ABBF648':None,
          'SRC-20495E983080':['SR-STR-029','SR-STR-227'],
          'SRC-CA5C83D9AD14':['SR-STR-029','SR-STR-227'],
          'SRC-9649F401E67A':['SR-STR-028','SR-STR-029','SR-STR-030','SR-STR-031','SR-STR-041','SR-STR-226','SR-STR-227'],
          'SRC-D18F0F877C6D':['SR-STR-028','SR-STR-029','SR-STR-030','SR-STR-031','SR-STR-041','SR-STR-226','SR-STR-227'],
          'SRC-5BD56989CE7E':None,
          'SRC-E58BE7EC3270':None,
          'SRC-EF686A98AE01':None,
          'SRC-98E61D715B9D':None,
          'SRC-9D9F935E7666':None,
          'SRC-3C2D4A571240':None,
          'SRC-E6BCD73E628E':None,
          'SRC-B87C63920A29':None,
          'SRC-BA4D3A609E27':None,
          'SRC-D867368C60D3':None,
          'SRC-797C84C7DDA9':None,
          'SRC-9C96545FAB1C':None
          }
          qpath=root/'docs/structure-radar/exploration-queue.json'
          q=json.loads(qpath.read_text())
          task=next(t for t in q['tasks'] if t['status']=='READY' and t['phase']=='SOURCE_CENSUS')
          ids=task['source_ids']
          assert task['task_id']==task_id, task['task_id']
          assert len(ids)==60 and ids==list(M.keys()), (len(ids),ids[:3],list(M)[:3],ids[-3:],list(M)[-3:])
          source_map={}; part_docs={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              d=json.loads(p.read_text()); part_docs[p]=d
              for s in d['sources']: source_map[s['source_id']]=s
          prog_path=root/'docs/structure-radar/progress.json'
          prog=json.loads(prog_path.read_text())
          assert not any(b.get('batch_id')==batch_id for b in prog['audit_batches'])
          reg_path=root/'docs/structure-radar/structure-registry.json'
          reg=json.loads(reg_path.read_text())
          cards={c['structure_id']:c for c in reg['structures']}
          expected_union=['SR-STR-013','SR-STR-028','SR-STR-029','SR-STR-030','SR-STR-031','SR-STR-041','SR-STR-226','SR-STR-227']
          assert all(cid in cards for cid in expected_union)
          locator={
            'SR-STR-013':'Stage13 hardening Stage12 primitive-first counting-interface carrier',
            'SR-STR-028':'Stage13 hardening core-wing/curved-region proof carrier',
            'SR-STR-029':'Stage13 hardening fixed-inert-prime ordered-limit overlap carrier',
            'SR-STR-030':'Stage13 hardening chamber/coarea directional carrier',
            'SR-STR-031':'Stage13 hardening external analytic/Perron contract carrier',
            'SR-STR-041':'Stage13 hardening Stage12-to-canonical factor-two projection carrier',
            'SR-STR-226':'Stage13 hardening frozen Stage12 R09 input carrier only',
            'SR-STR-227':'Stage13 R03-R06 proof-hardening carrier; canonical exactly-one theorem scope unchanged'
          }
          for sid in ids:
              s=source_map[sid]
              assert s['review_state']=='NEW', (sid,s['review_state'])
              assert sid not in prog['source_reviews'], sid
              cids=M[sid]
              if cids is None:
                  prog['source_reviews'][sid]={'fingerprint':s['fingerprint'],'status':'NO_DISTINCT_STRUCTURE','batch_id':batch_id}
              else:
                  assert len(cids)==len(set(cids))
                  prog['source_reviews'][sid]={'fingerprint':s['fingerprint'],'status':'STRUCTURES_RECORDED','batch_id':batch_id,'structure_ids':cids}
                  for cid in cids:
                      pv=cards[cid].setdefault('repo_provenance',[])
                      if not any(x.get('source_id')==sid for x in pv):
                          pv.append({'source_id':sid,'path':s['path'],'locator':locator[cid],'fingerprint':s['fingerprint']})
              s['review_state']='CURRENT_REVIEWED'
          union=sorted({cid for sid in ids if M[sid] for cid in M[sid]})
          assert union==sorted(expected_union), union
          carrier=sum(M[sid] is not None for sid in ids); nodist=60-carrier
          assert (carrier,nodist)==(27,33), (carrier,nodist)
          prog['audit_batches'].append({
            'batch_id':batch_id,'task_id':task_id,'status':'SUBMITTED_FOR_AUDIT','source_ids':ids,
            'sources_reviewed':60,'structures_added':0,'structures_updated':8,
            'structure_carrier_sources':27,'structures_deduped':33,'searches_completed':0,
            'arsenal_decisions':0,'audit_required':True,'duplicate_source':0,'no_distinct_structure':33})
          prog_path.write_text(json.dumps(prog,indent=2,ensure_ascii=False)+'\n')
          reg_path.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')
          for p,d in part_docs.items():
              if any(s['source_id'] in M for s in d['sources']):
                  p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Refresh and verify
        shell: bash
        run: |
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git diff --check
      - name: Assert batch32 accounting
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          r=pathlib.Path('.')
          c=json.loads((r/'docs/structure-radar/controller.json').read_text())
          assert c['corpus']['review_states']=={'CURRENT_REVIEWED':2450,'NEW':106}, c['corpus']['review_states']
          assert c['registry']['structure_count']==227, c['registry']['structure_count']
          p=json.loads((r/'docs/structure-radar/progress.json').read_text())
          b=next(x for x in p['audit_batches'] if x['batch_id']=='SR-BATCH-STAGE02_13_HISTORY-32-R01')
          assert b['sources_reviewed']==60 and b['structures_added']==0 and b['structures_updated']==8
          assert b['structure_carrier_sources']==27 and b['no_distinct_structure']==33 and b['duplicate_source']==0
          rv=[v for v in p['source_reviews'].values() if v.get('batch_id')==b['batch_id']]
          assert len(rv)==60 and sum(v['status']=='STRUCTURES_RECORDED' for v in rv)==27 and sum(v['status']=='NO_DISTINCT_STRUCTURE' for v in rv)==33
          q=json.loads((r/'docs/structure-radar/exploration-queue.json').read_text())
          ready=next(t for t in q['tasks'] if t['status']=='READY' and t['phase']=='SOURCE_CENSUS')
          assert ready['source_ids'][0]=='SRC-0E2873D1E474', ready['source_ids'][0]
          print('BATCH32_OK',len(rv),c['corpus']['review_states'],ready['task_id'],ready['source_ids'][0])
          PY
      - name: Commit official ledger only
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f --ignore-unmatch \
            .github/workflows/sr-b32-analyzer.yml \
            .github/workflows/sr-b32-compact.yml \
            .github/workflows/sr-b32-finalizer.yml
          git rm -f --ignore-unmatch \
            .tmp/sr-b32-summary.tsv \
            .tmp/sr-b32-compact.tsv \
            .tmp/sr-b32-trigger.txt \
            .tmp/sr-b32-compact-trigger.txt \
            .tmp/sr-b32-finalizer-trigger.txt
          git add docs/structure-radar
          git status --short
          git commit -m 'StructureRadar: census Stage02-13 history batch 32'
          git push origin HEAD:structure-radar-history-batch-32
