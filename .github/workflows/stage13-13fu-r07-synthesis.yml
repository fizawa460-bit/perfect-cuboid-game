name: Stage13-13fu R07 canonical synthesis

on:
  pull_request:
    paths:
      - 'stages/stage13/13-13fu/**'
      - 'stages/stage13/scripts/13-13fu/**'
      - '.github/workflows/stage13-13fu-r07-synthesis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit R07 canonical synthesis
        run: python stages/stage13/scripts/13-13fu/r07_synthesis_audit.py
