name: StructureRadar search15 finalize
on: pull_request
permissions: {contents: write}
jobs:
  finalize:
    if: github.head_ref == 'structure-radar-search-15-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - run: |
          python - <<'PY'
          import json,pathlib
          ids=[f'SR-STR-{i:03d}' for i in range(124,134)]
          ledger='docs/structure-radar/literature/SR-SEARCH-15.md'
          rp='docs/structure-radar/structure-registry.json'; r=json.load(open(rp)); cards=[]
          for c in r['structures']:
            if c['structure_id'] in ids:
              assert c['search_status'] in {'NOT_SEARCHED','NEEDS_REFRESH'} and c['arsenal_decision']=='PENDING'
              cards.append(c); c['search_status']='SEARCHED'; c['arsenal_decision']='ACTIVE'; c['search_ledger']=ledger
          assert [c['structure_id'] for c in cards]==ids
          open(rp,'w').write(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          z=['# StructureRadar literature ledger — search batch 15','','SEARCH_TASK=SR-SEARCH-01','BATCH_ID=SR-BATCH-LITERATURE_SEARCH-15-R01','SEARCH_DATE=2026-08-19','STRUCTURES='+','.join(ids),'SEARCH_BATCH_SIZE=10','NOVELTY_BY_SEARCH_ABSENCE=false','',
             '## Primary-source literature checked',
             '- Bonolis–Browning, *Uniform bounds for rational points on hyperelliptic fibrations* (arXiv:2007.14182): uniform bounded-height counting on a fibration via a square-sieve. Relevant only as adjacent fiberwise-counting literature; its parameter space, weights, and fibers do not equal the Stage27 MAIN wall host.',
             '- Dimitrov–Gao–Habegger, *Uniform bound for the number of rational points on a pencil of curves* (arXiv:1904.07268): uniform fiber bounds for a fixed one-parameter family of genus >=2 curves in terms of Mordell–Weil rank. It does not provide the repo same-measure weighted exceptional-mass deficit.',
             '- Alpoge, *The average number of rational points on genus two curves is bounded* (arXiv:1804.05859): an average rational-point theorem in a specific height-ordered genus-two family. It illustrates that averaging can be powerful, but its family measure is not the Stage27 physical wall measure.','']
          for c in cards:
            z += ['## '+c['structure_id']+' — '+c['canonical_math_name'],c['exact_equations_or_object'],'Potential weapon types: '+', '.join(c.get('potential_weapon_types',[]))+'.','Applicability gaps: '+'; '.join(c.get('applicability_gaps',[])),'Transfer verdict: `REPO_EXACT_RECEIVER_RETAINED` — searched adjacent fiberwise/average literature does not match the exact MAIN wall population, physical weights, exceptional-mass quantifier, or support projection required here.','Arsenal decision: `ACTIVE`.','']
          z += ['## Firewalls','- SR-STR-124..126 are exact wall-reduction and monotone-transfer adapters; no generic boundary-layer theorem is promoted to a power saving.','- SR-STR-127..130 require a same-measure physically weighted good/bad decomposition. Unweighted exceptional-cell counts or averages in a different family are insufficient.','- SR-STR-131 is finite diagnostic evidence only.','- SR-STR-132..133 are repo receiver calculus/taxonomy, not external theorems.','- CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT remains 1/2; no strict sub-square-root theorem and no perfect-cuboid existence/nonexistence claim is made.','']
          pathlib.Path(ledger).write_text('\n'.join(z))
          pp='docs/structure-radar/progress.json'; p=json.load(open(pp)); bid='SR-BATCH-LITERATURE_SEARCH-15-R01'
          assert not any(x.get('batch_id')==bid for x in p['audit_batches'])
          p['audit_batches'].append({'batch_id':bid,'task_id':'SR-SEARCH-01','status':'SUBMITTED_FOR_AUDIT','source_ids':[],'sources_reviewed':3,'structures_added':0,'structures_updated':10,'structure_carrier_sources':0,'structures_deduped':0,'searches_completed':10,'arsenal_decisions':10,'audit_required':True,'duplicate_source':0,'no_distinct_structure':0})
          open(pp,'w').write(json.dumps(p,indent=2,ensure_ascii=False)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python - <<'PY'
          import json
          q=json.load(open('docs/structure-radar/exploration-queue.json')); ready=next(t for t in q['tasks'] if t['status']=='READY'); assert ready['structure_ids']==[f'SR-STR-{i:03d}' for i in range(134,144)], ready
          c=json.load(open('docs/structure-radar/controller.json')); assert c['registry']['unresolved_search_count']==77 and c['registry']['pending_arsenal_decision_count']==96, c['registry']
          PY
          rm .github/workflows/structure-radar-search15-finalize.yml
          git config user.name github-actions; git config user.email github-actions@github.com
          git add -A && git commit -m 'StructureRadar: literature search batch15' && git push
