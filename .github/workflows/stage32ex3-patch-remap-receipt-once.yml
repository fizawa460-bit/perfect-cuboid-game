name: Stage32EX3 patch remap receipt once

on:
  push:
    branches:
      - stage32ex3-ex3-00-typed-cover-tower
    paths:
      - '.github/workflows/stage32ex3-patch-remap-receipt-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage32ex3-ex3-00-typed-cover-tower
          fetch-depth: 1
      - name: Patch corrected remap workflow exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/stage32ex3-main-o210-v2-remap-fixed-once.yml')
          s=p.read_text()
          old="          by[AD2]['authority_status']='SUPERSEDED'\n"
          new=old+"          by[AD2]['audit_receipt']=None\n"
          assert s.count(old)==1
          assert "by[AD2]['audit_receipt']=None" not in s
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- .github/workflows/stage32ex3-main-o210-v2-remap-fixed-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/stage32ex3-main-o210-v2-remap-fixed-once.yml
          git commit -m '[Stage32EX3][management] make superseded V2 receipt registry-compatible'
          git push origin HEAD:stage32ex3-ex3-00-typed-cover-tower
