name: Stage32-18AV d16 b16 remaining walls cost scout

on:
  push:
    branches: [stage32-18as-b16-heavy-tier2-cost-planner]
    paths: ['stages/stage32/runkeys/18av-b16-remaining-walls-cost-scout.json']

permissions: {contents: read, actions: read}
concurrency: {group: stage32-18av-b16-remaining-walls-cost-scout, cancel-in-progress: true}

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        wall:
          - {name: p436-s362, primary: 436, shard: 362}
          - {name: p503-s118, primary: 503, shard: 118}
          - {name: p503-s665, primary: 503, shard: 665}
          - {name: p922-s13, primary: 922, shard: 13}
          - {name: p922-s38, primary: 922, shard: 38}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Require dedicated ARM commit and locked key
        run: |
          set -euo pipefail
          KEY=stages/stage32/runkeys/18av-b16-remaining-walls-cost-scout.json
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1 && test "${changed[0]}" = "$KEY"
          test "$(git log -1 --pretty=%s)" = 'Stage32-18AV: ARM B16 REMAINING WALLS COST SCOUT'
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18av-b16-remaining-walls-cost-scout.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1' and d['generation']==1 and d['armed'] and d['bound']==16
          assert d['targets']==[[436,362],[503,118],[503,665],[922,13],[922,38]]
          assert d['source_exact_artifact_id']==9574308138
          assert d['source_exact_zip_sha256']=='0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4'
          assert d['shard_count']==1024 and d['secondary_split_coordinate']==48 and d['block_cut']==39
          assert d['frontier_cap']==50000 and d['planner_probe_budget']==2048
          assert d['upper_node_cap']==2000000 and d['wallclock_minutes']==45 and d['max_parallel']==5
          assert d['allow_finer_split'] is False
          assert not d['D16_B16_NUMERICAL_CREDIT'] and not d['GLOBAL_B16_AGGREGATION_COMPLETE']
          assert not d['FULL_D16_G0_ROW_COMPLETE'] and not d['THEOREM_CREDIT'] and not d['RECEIVER_CREDIT']
          PY
      - name: Fetch locked exact source and build planner
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++ libboost-dev
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/source.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/src"
          python stages/stage32/32-18X/build_two_stage_certifier.py --source "$RUNNER_TEMP/src/d16-exact-symmetry-sharded.cpp" --output "$RUNNER_TEMP/work/cert.cpp" --primary-id '${{ matrix.wall.primary }}'
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AF/patch_symmetry_schedule.py
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AO/patch_block_frontier.py
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AP/patch_lower_block_replay.py
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AR/patch_frontier_cost_planner.py
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic "$RUNNER_TEMP/work/cert.cpp" -o "$RUNNER_TEMP/work/cert"
          cp "$RUNNER_TEMP/src/d16-hperp.txt" "$RUNNER_TEMP/work/"
          cp "$RUNNER_TEMP/src/d16-aut-prefix256-bundle.txt" "$RUNNER_TEMP/work/"
      - name: Measure full cut39 frontier at 2048-node local budget
        run: |
          set -euo pipefail
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" timeout --signal=TERM --kill-after=20s 45m "$RUNNER_TEMP/work/cert" --input "$RUNNER_TEMP/work/d16-hperp.txt" --bundle "$RUNNER_TEMP/work/d16-aut-prefix256-bundle.txt" --output "$RUNNER_TEMP/out/cert.json" --dump-canonical "$RUNNER_TEMP/out/dump.bin" --bound 16 --shard-id '${{ matrix.wall.shard }}' --shard-count 1024 --split-coordinate 48 --block-cut 39 --frontier-cap 50000 --replay-limit 0 --planner-probe-budget 2048 --planner-output "$RUNNER_TEMP/out/frontier-costs.csv" --node-cap 2000000 >"$RUNNER_TEMP/out/stdout.txt" 2>"$RUNNER_TEMP/out/stderr.txt"
      - name: Build compact wall cost certificate
        env:
          WALL_NAME: '${{ matrix.wall.name }}'
          PRIMARY_ID: '${{ matrix.wall.primary }}'
          SHARD_ID: '${{ matrix.wall.shard }}'
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,os,pathlib,math,hashlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          cert=json.loads((out/'cert.json').read_text())
          rows=[]
          with (out/'frontier-costs.csv').open() as f:
              for r in csv.DictReader(f):
                  rows.append({'frontier_id':int(r['frontier_id']),'probe_nodes':int(r['probe_nodes']),'complete':r['complete']=='1'})
          n=cert['frontier_states']
          assert cert['status']=='FRONTIER_COMPLETE' and 0 < n <= 50000
          assert cert['planner_completed']+cert['planner_capped']==n and len(rows)==n
          assert sorted(r['frontier_id'] for r in rows)==list(range(n))
          light=[r for r in rows if r['complete']]; heavy=[r for r in rows if not r['complete']]
          costs=sorted(r['probe_nodes'] for r in light)
          def pct(p):
              if not costs:return None
              return costs[min(len(costs)-1,max(0,math.ceil(p*len(costs))-1))]
          hist={str(t):sum(1 for x in costs if x<=t) for t in [16,64,256,512,1024,2048]}
          runtime=None
          try:runtime=float((out/'runtime.txt').read_text().strip())
          except Exception:pass
          wall=[int(os.environ['PRIMARY_ID']),int(os.environ['SHARD_ID'])]
          result={
            'schema':'STAGE32_18AV_B16_REMAINING_WALL_COST_SCOUT_V1',
            'verdict':'FULL_FRONTIER_COST_DISTRIBUTION_MEASURED',
            'target_wall':wall,
            'block_cut':39,
            'frontier_states':n,
            'probe_budget':2048,
            'probe_total_nodes':cert['planner_total_nodes'],
            'complete_probe_count':len(light),
            'capped_heavy_count':len(heavy),
            'heavy_frontier_ids':[r['frontier_id'] for r in heavy],
            'completed_cost_quantiles':{'p50':pct(.50),'p90':pct(.90),'p95':pct(.95),'p99':pct(.99),'max':max(costs) if costs else None},
            'completed_cumulative_histogram':hist,
            'exact_light_total_nodes':sum(costs),
            'minimum_total_lower_nodes_given_capped_floor':sum(costs)+len(heavy)*2048,
            'runtime_seconds':runtime,
            'next_item':'COMPARE_ALL_SIX_WALL_COST_SHAPES_THEN_TIER_HEAVY_TAILS_ONLY',
            'D16_B16_NUMERICAL_CREDIT':False,
            'GLOBAL_B16_AGGREGATION_COMPLETE':False,
            'FULL_D16_G0_ROW_COMPLETE':False,
            'THEOREM_CREDIT':False,
            'RECEIVER_CREDIT':False
          }
          p=out/f"stage32-18av-{os.environ['WALL_NAME']}-cost.json"
          p.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'wall':wall,'frontier':n,'complete':len(light),'heavy':len(heavy),'quantiles':result['completed_cost_quantiles']},sort_keys=True))
          (out/'dump.bin').unlink(missing_ok=True)
          (out/'cert.json').unlink(missing_ok=True)
          (out/'frontier-costs.csv').unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18av-${{ matrix.wall.name }}-cost-scout-g1
          path: '${{ runner.temp }}/out/'
          retention-days: 7
          if-no-files-found: error
