name: Stage32 residual32-01 full178 cold preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/residual-32-01-production/full178-manifest.json'
      - 'stages/stage32/residual-32-01-production/full178-production-preflight.json'
      - 'stages/stage32/residual-32-01-production/full178-wave128-preflight.json'
      - 'stages/stage32/residual-32-01-production/verify_full178_preflight.py'
      - 'stages/stage32/runkeys/residual32-01-full178-production.json'
      - '.github/workflows/stage32-residual32-01-full178-preflight.yml'

permissions:
  contents: read

jobs:
  verify-cold-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Verify exact 178-row manifest and resource contract
        run: python stages/stage32/residual-32-01-production/verify_full178_preflight.py
      - name: Verify 128-unit wave / 17-runner operational preflight
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stages/stage32/residual-32-01-production/full178-wave128-preflight.json'))
          assert x['schema']=='STAGE32_RESIDUAL32_01_FULL178_WAVE128_CONCURRENCY17_PREFLIGHT_V1'
          assert x['scope']=='OPERATIONAL_WAVE_EXPANSION_ONLY_NO_MATHEMATICAL_SEMANTICS_CHANGE'
          assert x['source_and_math_contract_unchanged'] is True
          assert x['runner_schema']=='STAGE32_RESIDUAL32_01_FULL178_PREFIX_WORK_UNIT_V2'
          assert x['nodes_used_accounting']=='SUM_TELEMETRY_NODES_V2'
          assert x['node_ceiling_per_work_unit']==64000000
          assert x['max_work_units_per_wave']==128
          assert x['full178_heavy_concurrency']==17
          assert x['other_stage32_heavy_overlap_bound']==1
          assert x['maximum_effective_stage32_heavy_overlap']==18
          assert x['hard_stage_cap']==18 and x['stage_cap_pass'] is True
          assert x['storage_safe_under_operating_budget'] is True
          assert x['unknown_is_unsat'] is False
          assert x['fresh_runkey_only_authorization_required'] is True
          assert x['B18_RELEASE_AUTHORIZED'] is False
          assert x['THEOREM_CREDIT'] is False and x['RECEIVER_CREDIT'] is False
          PY
      - name: Validate production run-key safety state without authorizing compute
        run: |
          python - <<'PY'
          import json
          x=json.load(open('stages/stage32/runkeys/residual32-01-full178-production.json'))
          assert x['schema']=='STAGE32_RESIDUAL32_01_FULL178_PRODUCTION_RUNKEY_V1'
          generation=int(x['generation']); assert generation>=0
          assert x['FULL178_PREFLIGHT_COMPLETE'] is True
          expected_concurrency=17 if generation>=19 else (16 if generation>=14 else 8)
          assert x['effective_heavy_concurrency']==expected_concurrency<=18
          assert x['projected_peak_artifact_mb']<500
          assert x['B18_RELEASE_AUTHORIZED'] is False
          assert x['THEOREM_CREDIT'] is False and x['RECEIVER_CREDIT'] is False
          if generation==0:
              assert x['armed'] is False
              assert x.get('FULL178_HEAVY_PRODUCTION_AUTHORIZED',False) is False
              assert x['FULL_178_ROW_SWEEP_AUTHORIZED'] is False
              print('FULL178_CAMPAIGN_STATE=COLD_GENERATION0')
          else:
              assert x['armed'] is True
              assert x['FULL178_HEAVY_PRODUCTION_AUTHORIZED'] is True
              assert x['FULL_178_ROW_SWEEP_AUTHORIZED'] is True
              if 14<=generation<=30:
                  units=x.get('work_units'); assert isinstance(units,list) and 1<=len(units)<=128
                  if generation<=18: assert len(units)==16
              if generation==31:
                  assert x['first_pass_node_ceiling']==64000000
                  assert x['work_units_source']=='LOCKED_PRIOR_WAVE_MANIFEST_SLICE_V1'
                  assert x['source_run_id']==33249640508
                  assert x['source_manifest_artifact_id']==9714094354
                  assert x['source_artifact_zip_sha256']=='35959bc4611d2967766d5dc4ae3eb8624dc851cab23444f3b50c01d98311f5b4'
                  assert x['source_manifest_canonical_sha256']=='0a33257cd04ff3b67dcca85a6366502329d49206269fc1bddd7e21d879977bca'
                  assert x['source_next_exact_start']==4 and x['source_next_exact_end']==132
                  assert x['work_units_count']==128
                  assert x['work_units_canonical_sha256']=='56a7771f66bf0feb6bab8f77c7da56e3c448bfaab280de787f85f42751ab70b7'
              if generation>=32:
                  assert x['first_pass_node_ceiling']==64000000
                  assert x['work_units_source']=='LOCKED_PRIOR_WAVE_MANIFEST_CONCAT_V1'
                  assert isinstance(x['source_slices'],list) and len(x['source_slices'])>=1
                  assert x['work_units_count']==128
                  assert isinstance(x['work_units_canonical_sha256'],str) and len(x['work_units_canonical_sha256'])==64
              print(f'FULL178_CAMPAIGN_STATE=ARMED_HISTORY_GENERATION_{generation}_CHEAP_VALIDATION_ONLY')
          print('THIS_WORKFLOW_AUTHORIZES_HEAVY_COMPUTE=false')
          PY
