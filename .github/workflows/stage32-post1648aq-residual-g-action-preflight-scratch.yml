name: Stage32 post1648AQ residual-G action preflight

on:
  push:
    branches:
      - stage32-scratch-post1648aq-residual-g-action-preflight

permissions:
  contents: read

jobs:
  diagnose-aq-residual-g:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact scratch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Run AQ residual-G action preflight
        run: |
          python3 -B stages/stage32/residual-32-01-production/diagnose_stage32_post1648aq_residual_g_action_preflight.py | tee /tmp/post1648aq.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/post1648aq.json'))
          assert x['mode']=='SCRATCH_POST1648AQ_RESIDUAL_G_ACTION_PREFLIGHT'
          assert x['firewalls']['residual_G_semantic_identification_granted'] is False
          print(json.dumps({
              'closed_group_order':x['closed_group_order'],
              'stored_generator_count':x['stored_generator_count'],
              'aut_action_keys':x['aut_action_keys'],
              'top_level_keys':x['top_level_keys'],
          }, sort_keys=True))
          PY
      - name: Diff hygiene
        run: test -z "$(git status --porcelain)"
