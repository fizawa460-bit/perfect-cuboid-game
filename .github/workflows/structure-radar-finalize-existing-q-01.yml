name: StructureRadar finalize existing q literature 01

on:
  push:
    branches:
      - structureradar/existing-q-literature-01
    paths:
      - '.github/workflows/structure-radar-finalize-existing-q-01.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structureradar/existing-q-literature-01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize literature census and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, glob
          from pathlib import Path

          ROOT = Path('.')
          progress_p = ROOT/'docs/structure-radar/progress.json'
          registry_p = ROOT/'docs/structure-radar/structure-registry.json'
          progress = json.loads(progress_p.read_text())
          registry = json.loads(registry_p.read_text())

          source_ids = [
            'SRC-11D96DC30768','SRC-F7955199079F','SRC-59646D8EE051','SRC-B9D386C4B890','SRC-3C23A1631DF2',
            'SRC-658A293BD0DF','SRC-5794C5CFF5C4','SRC-1678D51CBBB9','SRC-A9E249AA6E7B','SRC-70F8C8B4900B',
            'SRC-1E02BF59A42F','SRC-9FD1DCB15986','SRC-3FE6F3651739','SRC-DC08AC483578','SRC-3835273022FE',
            'SRC-B03FCA8C049F','SRC-7B18C07D8442','SRC-DA0B1AC53584','SRC-1781CF7EF68F','SRC-32F49B43E360',
            'SRC-38DE6BE3C9B2','SRC-8286A6A47524','SRC-93E463C5BE3D','SRC-4F9B8FA7B80F','SRC-B59FDB4D741E',
            'SRC-B7C650E6176C','SRC-FA62E0DE785E','SRC-4B06E5267169','SRC-2CDD1166A2F1','SRC-F20094751CFB',
            'SRC-1BAEF7232062','SRC-7124222C8C33','SRC-39ED93935098','SRC-87E78960CD55','SRC-28FA96D43B09',
            'SRC-A10039A24059','SRC-DB3C72E56F47','SRC-31711246D9BC','SRC-B36D2DAEEBE4'
          ]
          assert len(source_ids) == 39 and len(set(source_ids)) == 39

          manifest = {}
          for fn in glob.glob('docs/structure-radar/source-manifest/part-*.json'):
            for rec in json.loads(Path(fn).read_text())['sources']:
              manifest[rec['source_id']] = rec
          missing = [s for s in source_ids if s not in manifest]
          assert not missing, missing
          already = [s for s in source_ids if s in progress['source_reviews']]
          assert not already, already
          assert len(registry['structures']) == 160, len(registry['structures'])
          assert registry['structures'][-1]['structure_id'] == 'SR-STR-160'

          def prov(sid, locator):
            r = manifest[sid]
            return {'source_id':sid,'path':r['path'],'locator':locator,'fingerprint':r['fingerprint']}

          def card(sid, name, obj, srcs, terms, aliases, species, targets, weapons, gaps, overlap):
            return {
              'structure_id': sid,
              'canonical_math_name': name,
              'exact_equations_or_object': obj,
              'search_terms_primary': terms,
              'search_terms_aliases': aliases,
              'theorem_species': species,
              'repo_provenance': [prov(s, loc) for s,loc in srcs],
              'target_populations': targets,
              'potential_weapon_types': weapons,
              'applicability_gaps': gaps,
              'existing_radar_overlap': overlap,
              'search_status': 'SEARCHED',
              'arsenal_decision': 'PENDING',
              'card_status': 'SUBMITTED_FOR_AUDIT'
            }

          new_cards = [
            card('SR-STR-161','Separated quadratic-Jacobi large-sieve and hyperbolic-boundary firewall',
              'After genuine one-variable coefficient separation, quadratic-character blocks sum by Heath-Brown/Liu and Wilson-type rectangular/hyperbolic estimates; the one-small-variable switched boundary may use Wilson neutraliser technology. No such theorem licenses an arbitrary correlated matrix W(u,v): separation or an L2/covariance reduction must be proved first.',
              [('SRC-59646D8EE051','q1 quadratic-large-sieve weapon ledger'),('SRC-4F9B8FA7B80F','q2 correlated bilinear literature pass'),('SRC-A10039A24059','q8 switched-boundary update')],
              ['quadratic large sieve Jacobi bilinear separated coefficients','Wilson hyperbolic Jacobi neutraliser large sieve'],
              ['Euclid-correlated quadratic large sieve firewall','one-small-variable switched Jacobi boundary'],
              ['quadratic character large sieve','bilinear forms','dispersion'],
              ['Stage14 reciprocal-character blocks after coefficient separation'],
              ['LARGE_SIEVE','BILINEAR_ESTIMATE','FIREWALL'],
              ['Does not create coefficient separation or control an arbitrary two-variable incidence matrix.','Near-axis/neutraliser use still requires theorem-compatible multiplicative weights and coefficient norms.'],
              ['Stage14-q1','Stage14-q2','Stage14-q8']),

            card('SR-STR-162','Moving first-small-point height pipeline via large prime plus complete 2-descent',
              'For E_F: W^2=Z(Z-S^2)(Z+X^2) on primitive Pythagorean fibers, the odd conductor is rad((SXH)_odd) while the displayed discriminant is fourth-powerful. Petsche/Naccarato are fixed-fiber tools only; the family-level transfer target is Le-Boudec-style: isolate a large prime in m,n,m-n,m+n, or m^2+n^2, force it through the exact full-2-descent cover, impose the physical logarithmic height window, and count exceptional configurations.',
              [('SRC-59646D8EE051','q1 first-small-point literature ledger'),('SRC-2CDD1166A2F1','q3 small-point height pass'),('SRC-A10039A24059','q8 retained height handoff'),('SRC-31711246D9BC','q9 partially validated large-prime routing')],
              ['least non-torsion canonical height moving elliptic family large prime 2-descent','Le Boudec congruent number height transfer Pythagorean'],
              ['first-small-point lower tail','large-prime complete-descent height route'],
              ['canonical height','2-descent','moving-family frequency'],
              ['Stage14 moving Pythagorean elliptic fibers and later analogous first-point gates'],
              ['HEIGHT_LOWER_TAIL','DESCENT','FAMILY_COUNT'],
              ['Petsche-scale logarithmic lower bounds alone do not beat the physical logarithmic window.','Fixed-fiber point multiplicity is not a frequency theorem for fibers.','Ambient density-one elliptic-curve theorems do not restrict automatically to the thin Pythagorean family.'],
              ['Stage14-q1','Stage14-q3','Stage14-q8','Stage14-q9']),

            card('SR-STR-163','Branch-sensitive generalized-Jacobian/Prym and rational-2-torsion descent interface',
              'Branched squareclass conditions should first be encoded by the correct generalized-Jacobian/Prym or explicit 2-isogeny/higher-descent cover. Creutz/Bruin-Poonen-Stoll-type descent supplies the branch-sensitive Kummer interface; Fisher-style rational-2-torsion descent supplies explicit dual homogeneous spaces. These are structural reductions, not moving-family power-saving theorems.',
              [('SRC-59646D8EE051','q1 generalized-Jacobian/Prym descent shelf'),('SRC-31711246D9BC','q9 Fisher rational-2-torsion / dual-isogeny transfer')],
              ['generalized Jacobian Prym explicit descent branched double cover','rational 2-torsion higher descent dual isogeny homogeneous space'],
              ['branch-sensitive Kummer descent','explicit dual-cover normalization'],
              ['Prym descent','2-isogeny descent','Kummer map'],
              ['branched squareclass receivers and rational-2-torsion elliptic fibers'],
              ['DESCENT','NORMAL_FORM','STRUCTURAL_REDUCTION'],
              ['An explicit Stage-specific cover and variable dictionary are required before counting.','Selmer or isogeny statistics alone do not control physical least-point height or collision energy.'],
              ['SR-STR-015','SR-STR-114','Stage14-q1','Stage14-q9']),

            card('SR-STR-164','Square/polynomial-sieve collision-cover transfer',
              'Squareclass equality [K(theta)]=[K(theta_prime)] is equivalent to a square-lift equation Y^2=K(theta)K(theta_prime). After removing diagonal/symmetry/square components and auditing irreducibility, nonsquareness, singular loci and height conversion, Heath-Brown/Browning square-polynomial sieves or Bonolis-Pierce nonseparable polynomial sieve become the primary collision-energy weapons.',
              [('SRC-F20094751CFB','q4 squareclass collision literature pass'),('SRC-A10039A24059','q8 binary-quartic factorized square-sieve update')],
              ['square sieve polynomial sieve squareclass collision energy','Bonolis Pierce polynomial sieve nonseparable cover'],
              ['square-lift collision cover','binary quartic squareclass collision'],
              ['square sieve','polynomial sieve','thin-set counting'],
              ['Stage14 missing-face squareclass collision and analogous kernel-collision second moments'],
              ['SIEVE','SECOND_MOMENT','THIN_COVER'],
              ['No sieve may be invoked before the actual collision polynomial/charts and diagonal components are explicit.','Parameter-height saving must survive conversion to the physical height.'],
              ['Stage14-q4','Stage14-q8']),

            card('SR-STR-165','Gaussian quadratic-Hecke large-sieve transfer with ray-class correction',
              'For E=m^2+n^2=(m+in)(m-in), split-prime root choices are Gaussian prime-ideal choices. If a Stage14 state tensor becomes a finite sum of one-ideal-at-a-time quadratic Hecke symbols chi_a(b), Goldmakher-Louvel/Onodera Q(i) large-sieve technology applies after fixed unit/ray-class corrections and coprimality cleanup.',
              [('SRC-31711246D9BC','q9 Gaussian/Hecke transfer radar')],
              ['quadratic large sieve number fields Q(i) Gaussian Hecke characters','Onodera Gaussian Jacobi symbol large sieve'],
              ['Gaussian root-sign Hecke packaging','Q(i) quadratic reciprocity tensor'],
              ['Hecke large sieve','Gaussian integers','quadratic reciprocity'],
              ['state-split sum-of-two-squares tensors and Gaussian allocation energies'],
              ['LARGE_SIEVE','GAUSSIAN_FACTORIZATION','HECKE_CHARACTERS'],
              ['Residual Euclid incidence must separate into one-ideal coefficient vectors.','The theorem does not directly cover arbitrary composite correlated physical weights.'],
              ['Stage14-q9','SR-STR-011','SR-STR-053']),

            card('SR-STR-166','Dual-root-line eliminant determinant/Kloosterman transfer dichotomy',
              'For a charged-once common core carrying one Gaussian root line and one endpoint root line, derive the exact reciprocal-completion eliminant first. If it is irreducible bilinear/trilinear with a new determinant or hyperdeterminant factor, use Reuss-type lattice counts; if an exact zero-loss transform yields an inverse-fraction bilinear kernel, use Dong-Robles-Zeindler/Bettin-Chandee Kloosterman-fraction bounds.',
              [('SRC-B9D386C4B890','q10 post-sqrt dual-root-line literature radar')],
              ['Reuss bilinear trilinear hypersurface determinant count','bilinear Kloosterman fractions reciprocal completion'],
              ['dual root line eliminant','charged-once reciprocal completion'],
              ['bilinear point counting','Kloosterman fractions','eliminant'],
              ['Stage14 dual-root-line square-root saturation packets'],
              ['INCIDENCE_BOUND','BILINEAR_ESTIMATE','TRANSFER_DICHOTOMY'],
              ['No second spacing charge on the already-paid common core is allowed.','The exact eliminant/transform and theorem parameter ranges must be proved before transfer.'],
              ['Stage14-q10']),

            card('SR-STR-167','Pythagorean multiplicative structured-versus-uniform correlation gate',
              'Near-maximal Pythagorean pair/triple correlations may be split into aperiodic Gowers-uniform and pretentious structured components only if the physical selectors admit a B^o(1)-complexity multiplicative/Hecke-multiplicative phase decomposition. Azevedo-Moreira plus Frantzikinakis-Host supplies the architecture; pretentious Pythagorean recurrence is a firewall showing that structure alone is not a saving.',
              [('SRC-658A293BD0DF','q11 near-max Pythagorean correlation radar')],
              ['Pythagorean multiplicative functions structured uniform Gowers','pretentious Pythagorean recurrence correlation'],
              ['Pythagorean structured uniform dichotomy','multiplicative phase adapter'],
              ['higher-order Fourier analysis','multiplicative functions','Pythagorean correlations'],
              ['near-max pair correlations and connected third cumulants on primitive Pythagorean cells'],
              ['STRUCTURE_UNIFORMITY','CORRELATION','GOWERS'],
              ['Physical selectors are not yet proved to be bounded-complexity multiplicative systems.','Pretentious structure can sustain recurrence, so a separate physical density deficit or signed anticorrelation is required.'],
              ['Stage14-q11']),

            card('SR-STR-168','Weighted Gaussian norm-ratio collision transfer gate',
              'Repeated mover candidates lead to weighted Gaussian norm collisions x2*N(z1)=x1*N(z2). Parkkonen-Paulin multiplicative pair-correlation of quadratic norm values is the closest structural theorem; Baier-Bansal sparse Gaussian-modulus large sieve becomes quantitative only if a genuinely polynomial-length modulus/sample family is exposed.',
              [('SRC-1678D51CBBB9','q12 Gaussian norm-collision radar')],
              ['multiplicative pair correlations sums of two squares Gaussian norms','Gaussian sparse modulus large sieve collision energy'],
              ['weighted Gaussian norm-ratio collision','mover candidate collision energy'],
              ['norm-form correlation','Gaussian large sieve','collision energy'],
              ['Stage14 mover-candidate image/collision branches'],
              ['CORRELATION','GAUSSIAN_NORM','ENERGY_BOUND'],
              ['Published pair-correlation ensembles do not retain the frozen cofactor and physical masks automatically.','A B^o(1) mover-prime family cannot yield a fixed-power large-sieve saving by itself.'],
              ['Stage14-q12']),

            card('SR-STR-169','Correlation-only canonical-divisor/projective-mover transfer suite',
              'Once marginal-density mechanisms are exhausted, three external architectures remain conditional on exact adapters: multivariable arithmetic-function means on (a,b,a^2+b^2) for charged canonical allocation; Kloosterman-fraction transforms for fixed-C projective determinant movers; and partially-fixed/diffuse-modulus dispersion with a verified convolution plus Siegel-Walfisz input.',
              [('SRC-70F8C8B4900B','q13 correlation-only literature radar')],
              ['multivariable arithmetic functions polynomial arguments divisor allocation','projective Kloosterman mover diffuse modulus dispersion'],
              ['canonical three-divisor correlation suite','fixed common-core projective mover'],
              ['multivariable mean values','Kloosterman fractions','dispersion'],
              ['Stage14 low-core canonical allocation, concentrated mover, and diffuse common-core branches'],
              ['CORRELATION','DIVISOR_SUM','DISPERSION'],
              ['Expected-order or logarithmic multiplicity control is not a fixed-power density saving.','Every branch requires its exact Stage14 weight/modulus adapter and quantifier check.'],
              ['Stage14-q13']),

            card('SR-STR-170','Reciprocal squareclass divisor-window transfer gate',
              'The heavy global/s receiver becomes an existential divisor-window condition on a normalized radial integer with an admissible squareclass divisor L=J*a^2 and a reciprocal partner window. Ford divisor-in-an-interval theory is the nearest geometry, but transfer requires uniform window reduction, only B^o(1) distortion from the squareclass restriction, and domination of the charged physical n-measure.',
              [('SRC-9FD1DCB15986','q14 reciprocal divisor-window radar')],
              ['Ford divisor in an interval squareclass restriction reciprocal window','rough integers divisor interval physical subfamily'],
              ['reciprocal squareclass divisor window','radial divisor occupancy'],
              ['divisor distribution','support theorem','window counting'],
              ['Stage14 heavy radial reciprocal-divisor packets'],
              ['DIVISOR_WINDOW','SUPPORT_BOUND','TRANSFER_GATE'],
              ['Unrestricted integer density cannot be cross-promoted to an adversarially correlated physical subfamily.','The reciprocal partner and reverse-completion masks remain separate.'],
              ['Stage14-q14']),

            card('SR-STR-171','Localized unitary-divisor shadow gate',
              'The bare shadow is A_bare(m)=1 iff there exists a unitary divisor u||m in a transported short multiplicative interval. Ford/Drappeau-Mounier ordinary localized-divisor results become usable only after a unitary-to-ordinary bounded-distortion adapter and a window-width compatibility check; the conditional canonical/reverse completion mechanism is not part of this shadow theorem.',
              [('SRC-DC08AC483578','q15 summary'),('SRC-3835273022FE','q15 unitary-shadow literature radar')],
              ['localized unitary divisor short interval support','unitary to ordinary divisor transfer Ford Drappeau Mounier'],
              ['bare unitary shadow','localized unitary divisor occupancy'],
              ['unitary divisors','localized divisor density','support theorem'],
              ['Stage14 fixed-complementary-dilation heavy shadow'],
              ['DIVISOR_WINDOW','UNITARY_DIVISOR','TRANSFER_GATE'],
              ['u||m is stronger than u|m; coprime-complement distortion is unproved in the charged family.','Fixed-width localized-divisor results cannot be extrapolated to shrinking exponent windows.','Shadow savings cannot be recharged as conditional physical-completion savings.'],
              ['Stage14-q15']),

            card('SR-STR-172','Rectangular arithmetic-progression product set has full fixed-power exponent',
              'For nonempty fixed-E interval rectangles D,V, Xu-Zhou asymmetric arithmetic-progression product-set bounds give |D*V| >= |D||V|/(log max(|D|,|V|))^O(1) when both sides are polynomial; if one side is B^o(1), an injective slice gives the same exponent conclusion. Thus |D*V|=B^(kappa_D+kappa_V+o(1)) and ambient multiplication collisions provide no fixed B-power saving.',
              [('SRC-B03FCA8C049F','q16 rectangular product-capacity radar')],
              ['product sets arithmetic progressions Xu Zhou multiplication table','rectangular integer interval product set multiplicative energy'],
              ['fixed-E distinct product capacity','full exponent product image'],
              ['product-set lower bound','multiplicative energy','direct transfer'],
              ['Stage14 fixed-E two-sided ambient product rectangles'],
              ['DIRECT_THEOREM','PRODUCT_SET','NEGATIVE_SAVING_CERTIFICATE'],
              ['This is an ambient product-image theorem only; the physical accepted support can still be a sparse subset.','No cross-promotion to polynomial-E or fixed-U branches without rectangular straightening.'],
              ['Stage14-q16']),

            card('SR-STR-173','Conditioned divisor-support hierarchy from reciprocal CRT through second reverse',
              'For nonnegative witness counts, support requires same-measure control rather than an unconditioned divisor average. The q17-q20 hierarchy runs: exact reciprocal-CRT witness N_rec with first/second moments implying support by Cauchy-Schwarz; filtered ternary-product first layer g*x*y=c_C*z; conditioned second-reverse extension through cp,dq and reciprocal factor pairs; and the stable joint divisor-extension moment J_rev2=sum_lambda sum_{f|W1(lambda)} R_rev2(lambda;f). Charged scalar and (E,m) pair measures may not be silently scalarized.',
              [('SRC-DA0B1AC53584','q17 reciprocal CRT support radar'),('SRC-32F49B43E360','q18 filtered triple-product reverse radar'),('SRC-8286A6A47524','q19 conditioned second-reverse extension radar'),('SRC-B59FDB4D741E','q20 conditioned divisor-correlation radar')],
              ['divisor AP moment to existential support conditioned witness','filtered tau3 second reverse divisor correlation'],
              ['reciprocal CRT support hierarchy','conditioned second reverse extension'],
              ['divisor correlations','support from moments','generalized divisor functions'],
              ['Stage14 reciprocal CRT and filtered-tau3 reverse-support branches'],
              ['MOMENT_TO_SUPPORT','DIVISOR_CORRELATION','CONDITIONED_MEASURE'],
              ['Mean divisor counts are not every-cell nonempty-support theorems.','First-layer support does not imply second-reverse support.','A B^o(1) host factorization fiber does not justify replacing a charged pair measure by a scalar measure.'],
              ['Stage14-q17','Stage14-q18','Stage14-q19','Stage14-q20']),

            card('SR-STR-174','Q17-good packet / filtered-tau3 pushforward intersection gate',
              'After prior kernels are normalized, the residual support is H=G intersect pi(Lambda), where G is the q17-good reciprocal-CRT packet and pi(Lambda) is the deterministic pushforward of charged filtered-tau3 witnesses. A direct theorem must control #Lambda_H=sum_{lambda in Lambda}1_G(pi(lambda)) on every principal cell with both filters and the scalar or (E,m) measure intact; generic AP equidistribution of a larger ambient sequence is insufficient without an indicator-correlation adapter.',
              [('SRC-FA62E0DE785E','q21 good-packet pushforward intersection radar')],
              ['pushforward intersection lower coverage divisor AP good packet','conditioned indicator correlation support'],
              ['q17-good packet intersection','filtered tau3 pushforward support'],
              ['intersection support','indicator correlation','arithmetic progression distribution'],
              ['Stage14 q17-good / filtered-tau3 intersection receiver'],
              ['INTERSECTION_SUPPORT','CORRELATION','TRANSFER_GATE'],
              ['The q17-good predicate must be expanded as an exact fixed-complexity weight against the pushforward measure.','Average distribution over moduli/residues cannot replace an every-principal-cell lower ratio without an exceptional-set charge.'],
              ['Stage14-q21','SR-STR-173'])
          ]
          assert [c['structure_id'] for c in new_cards] == [f'SR-STR-{i:03d}' for i in range(161,175)]
          registry['structures'].extend(new_cards)

          # Existing-card provenance update: q5 is exactly the computational/literature closure behind SR-STR-155.
          s155 = next(x for x in registry['structures'] if x['structure_id']=='SR-STR-155')
          existing_keys = {(p['source_id'],p['path']) for p in s155['repo_provenance']}
          for sid,loc in [('SRC-1BAEF7232062','q5 Shimada exact lattice/parity-coset closure'),('SRC-7124222C8C33','q5 Shimada refresh closure certificate')]:
            p = prov(sid,loc)
            if (p['source_id'],p['path']) not in existing_keys:
              s155['repo_provenance'].append(p)
          if 'Stage14-q5 Shimada M.C=4 closure' not in s155['existing_radar_overlap']:
            s155['existing_radar_overlap'].append('Stage14-q5 Shimada M.C=4 closure')

          carrier = {
            'SRC-59646D8EE051':['SR-STR-161','SR-STR-162','SR-STR-163'],
            'SRC-B9D386C4B890':['SR-STR-166'],
            'SRC-658A293BD0DF':['SR-STR-167'],
            'SRC-1678D51CBBB9':['SR-STR-168'],
            'SRC-70F8C8B4900B':['SR-STR-169'],
            'SRC-9FD1DCB15986':['SR-STR-170'],
            'SRC-DC08AC483578':['SR-STR-171'],
            'SRC-3835273022FE':['SR-STR-171'],
            'SRC-B03FCA8C049F':['SR-STR-172'],
            'SRC-DA0B1AC53584':['SR-STR-173'],
            'SRC-32F49B43E360':['SR-STR-173'],
            'SRC-8286A6A47524':['SR-STR-173'],
            'SRC-4F9B8FA7B80F':['SR-STR-161'],
            'SRC-B59FDB4D741E':['SR-STR-173'],
            'SRC-FA62E0DE785E':['SR-STR-174'],
            'SRC-2CDD1166A2F1':['SR-STR-162'],
            'SRC-F20094751CFB':['SR-STR-164'],
            'SRC-1BAEF7232062':['SR-STR-155'],
            'SRC-7124222C8C33':['SR-STR-155'],
            'SRC-A10039A24059':['SR-STR-161','SR-STR-162','SR-STR-164'],
            'SRC-31711246D9BC':['SR-STR-162','SR-STR-163','SR-STR-165']
          }
          assert len(carrier)==21
          no_distinct = {'SRC-11D96DC30768','SRC-F7955199079F','SRC-39ED93935098','SRC-87E78960CD55'}
          duplicates = set(source_ids) - set(carrier) - no_distinct
          assert len(duplicates)==14 and len(no_distinct)==4
          batch_id = 'SR-BATCH-EXISTING_Q_LITERATURE-01-R01'
          for sid in source_ids:
            rec = {'fingerprint':manifest[sid]['fingerprint'],'batch_id':batch_id}
            if sid in carrier:
              rec['status']='STRUCTURES_RECORDED'
              rec['structure_ids']=carrier[sid]
            elif sid in no_distinct:
              rec['status']='NO_DISTINCT_STRUCTURE'
            else:
              rec['status']='DUPLICATE_SOURCE'
            progress['source_reviews'][sid]=rec

          progress['audit_batches'].append({
            'batch_id':batch_id,
            'task_id':'SR-CENSUS-EXISTING_Q_LITERATURE-01',
            'status':'SUBMITTED_FOR_AUDIT',
            'source_ids':source_ids,
            'sources_reviewed':39,
            'structures_added':14,
            'structures_updated':1,
            'structures_deduped':18,
            'searches_completed':0,
            'arsenal_decisions':0,
            'audit_required':True
          })
          registry['status']='BATCH_SUBMITTED_FOR_AUDIT'
          registry_p.write_text(json.dumps(registry,indent=2,ensure_ascii=False)+'\n')
          progress_p.write_text(json.dumps(progress,indent=2,ensure_ascii=False)+'\n')
          PY

          rm -rf docs/structure-radar/partial-existing-q-literature-01
          rm -f .github/workflows/structure-radar-finalize-existing-q-01.yml
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git diff --check
          test ! -e docs/structure-radar/partial-existing-q-literature-01
          test ! -e .github/workflows/structure-radar-finalize-existing-q-01.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/structure-radar .github/workflows/structure-radar-finalize-existing-q-01.yml
          git status --short
          git commit -m 'StructureRadar: census existing q literature batch 01'
          git push origin HEAD:structureradar/existing-q-literature-01
