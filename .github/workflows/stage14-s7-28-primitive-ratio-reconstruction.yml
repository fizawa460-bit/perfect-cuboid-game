name: Stage14-s7-28 primitive ratio reconstruction

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-28/**'
      - 'stages/stage14/scripts/14-s7-28/**'
      - '.github/workflows/stage14-s7-28-primitive-ratio-reconstruction.yml'
      - 'stages/stage14/14-s7-27/**'
      - 'stages/stage14/14-4cm/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run s7-28 primitive ratio reconstruction audit
        run: python stages/stage14/scripts/14-s7-28/primitive_ratio_reconstruction_audit.py

      - name: Compile s7-28 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-28/primitive_ratio_reconstruction_audit.py

      - name: Run merged s7-27 regression
        run: python stages/stage14/scripts/14-s7-27/full_signed_quotient_curve_audit.py

      - name: Run merged 4cm regression
        run: python stages/stage14/scripts/14-4/signed_linear_reciprocal_audit.py

      - name: Lock predecessor boundaries
        run: |
          grep -Fq 'STAGE14_S7_27=COMPLETE_FULL_SIGNED_QUOTIENT_DIVISOR_COLLAPSE_AND_RECIPROCAL_BIQUADRATIC_REDUCTION' stages/stage14/14-s7-27/result.md
          grep -Fq 'FIXED_RESIDUAL_FULL_SIGNED_QUOTIENT_QUADRUPLE_MULTIPLICITY=Bo1' stages/stage14/14-s7-27/result.md
          grep -Fq 'RECIPROCAL_FOUR_MODULUS_QUADRATIC_SYSTEM_PROVED=true' stages/stage14/14-s7-27/result.md
          grep -Fq 'RECIPROCAL_RATIO_BIDEGREE_2_2_CURVE_PROVED=true' stages/stage14/14-s7-27/result.md

      - name: Lock s7-28 theorem boundary
        run: |
          f=stages/stage14/14-s7-28/result.md
          grep -Fq 'STAGE14_S7_28=COMPLETE_RATIO_SINGULAR_CLASSIFICATION_AND_PRIMITIVE_MODULUS_PAIR_RECONSTRUCTION' "$f"
          grep -Fq 'RATIO_CURVE_SINGULAR_IFF_K_EQUALS_4ABCD=true' "$f"
          grep -Fq 'RATIO_CURVE_REDUCIBLE_IFF_SINGULAR=true' "$f"
          grep -Fq 'SINGULAR_PHYSICAL_BRANCH_RATIONAL=true' "$f"
          grep -Fq 'GENERIC_GENUS_ONE_RECEIVER_MINIMAL=false' "$f"
          grep -Fq 'PRIMITIVE_RATIO_RECOVERS_X_MODULUS_PAIR_EXACTLY=true' "$f"
          grep -Fq 'PRIMITIVE_RATIO_RECOVERS_K_MODULUS_PAIR_EXACTLY=true' "$f"
          grep -Fq 'ABSOLUTE_MODULUS_SCALE_DEFECT=1' "$f"
          grep -Fq 'OPPOSITE_AGREEMENT_PRODUCT_RECONSTRUCTED_FROM_PRIMITIVE_X_PAIR=true' "$f"
          grep -Fq 'MOVING_XY_RECONSTRUCTED_FROM_PRIMITIVE_MODULI=true' "$f"
          grep -Fq 'XI_SWITCH_PRODUCT_RECONSTRUCTED_FROM_PRIMITIVE_X_PAIR=true' "$f"
          grep -Fq 'REMAINING_RECEIVER=TopThetaPrimitiveAgreementQuadraticValueDivisibilityIncidence' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/8' "$f"
          grep -Fq 'S7_28_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-s7-29' "$f"
