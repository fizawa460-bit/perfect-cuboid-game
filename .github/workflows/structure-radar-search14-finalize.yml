# diagnose
name: StructureRadar search14 finalize
on: pull_request
permissions: {contents: write}
jobs:
  finalize:
    if: github.head_ref == 'structure-radar-search-14-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - run: |
          python - <<'PY'
          import json
          ids=[f'SR-STR-{i:03d}' for i in range(114,124)]
          r=json.load(open('docs/structure-radar/structure-registry.json'))
          for c in r['structures']:
            if c['structure_id'] in ids:
              print(c['structure_id'],c.get('search_status'),c.get('arsenal_decision'),c.get('search_ledger'))
          raise SystemExit(1)
          PY
