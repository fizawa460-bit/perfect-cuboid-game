name: Stage12-N1bc normalize memo

on:
  pull_request:
    paths:
      - "scripts/update_shared_p_primitive_joint_stage12_n1b_memo.py"
      - "scripts/update_shared_p_global_mobius_stage12_n1c_memo.py"
      - ".github/workflows/stage12-n1bc-normalize-memo.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage12-n1-primitive-joint
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate both memo blocks
        run: |
          python -m py_compile scripts/update_shared_p_primitive_joint_stage12_n1b_memo.py
          python -m py_compile scripts/update_shared_p_global_mobius_stage12_n1c_memo.py
          python scripts/update_shared_p_primitive_joint_stage12_n1b_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --report data/shared_p_primitive_joint_stage12_n1b_report.json \
            --output generated-memo-b.md
          python scripts/update_shared_p_global_mobius_stage12_n1c_memo.py \
            --input generated-memo-b.md \
            --report data/shared_p_global_mobius_stage12_n1c_report.json \
            --output docs/face-ratio-geometry-research.md
          rm -f generated-memo-b.md .github/workflows/stage12-n1bc-normalize-memo.yml
      - name: Commit normalized memo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Stage12-N1 primitive memo blocks"
          git push origin HEAD:agent/stage12-n1-primitive-joint
