name: Stage32 post1570 three-involution Q602 batch

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: stage32-post1570-three-involution-q602-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Resolve freshness authority
        run: |
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr_base="${{ github.event.pull_request.base.sha }}"
            test "$pr_base" = "$current_main"
            expected_base="$pr_base"
          else
            expected_base="$current_main"
          fi
          echo "STAGE32_EXPECTED_BASE_SHA=$expected_base" >> "$GITHUB_ENV"
      - name: Recompute three-involution and mod2 blowdown diagnostic
        run: python3 stages/stage32/residual-32-01-production/diagnose_stage32_post1570_three_involution_q602.py
      - name: Certify terminal symmetry-parity batch
        shell: bash
        run: |
          set -o pipefail
          python3 stages/stage32/residual-32-01-production/certify_stage32_post1570_three_involution_q602_exclusion_batch.py 2>&1 | tee stage32-post1570-certifier.log
      - name: Retain certifier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage32-post1570-certifier-log
          path: stage32-post1570-certifier.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce no controller edit
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -qx 'stages/stage32/controller.json'; then
            echo 'controller.json must remain unchanged in post1570 batch'
            exit 1
          fi
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
