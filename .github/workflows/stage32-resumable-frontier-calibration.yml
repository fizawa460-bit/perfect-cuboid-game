name: Stage32 resumable current-frontier calibration

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage32/runkeys/residual32-01-resumable-frontier-calibration.json'

permissions:
  contents: read
  actions: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      matrix: ${{ steps.gate.outputs.matrix }}
      revision: ${{ steps.gate.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        name: Verify fresh dedicated calibration arm and exact source slice
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          KEY='stages/stage32/runkeys/residual32-01-resumable-frontier-calibration.json'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          echo 'matrix={"work_unit":[]}' >> "$GITHUB_OUTPUT"
          echo 'revision=0' >> "$GITHUB_OUTPUT"
          [ -n "${BEFORE:-}" ] || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || exit 0
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          mapfile -t changed < <(git diff --name-only "$BEFORE" "$HEAD")
          [ "${#changed[@]}" -eq 1 ] || exit 0
          [ "${changed[0]}" = "$KEY" ] || exit 0
          python - "$BEFORE" "$KEY" "$GITHUB_OUTPUT" <<'PY'
          import json,subprocess,sys
          before,key,out=sys.argv[1:]
          old=json.loads(subprocess.check_output(['git','show',f'{before}:{key}'],text=True))
          new=json.load(open(key))
          assert old['schema']==new['schema']=='STAGE32_RESIDUAL32_01_RESUMABLE_FRONTIER_CALIBRATION_RUNKEY_V1'
          assert new['workload']=='FULL178_CURRENT_FRONTIER_OLD_VS_RESUMABLE_64M_CALIBRATION'
          assert int(new['revision'])==int(old['revision'])+1==1
          assert old['armed'] is False and new['armed'] is True
          assert int(new['source_generation'])==31
          assert int(new['source_run_id'])==33252271559
          assert int(new['source_artifact_id'])==9715047774
          assert new['source_artifact_zip_sha256']=='44831de7c31c6dd7464598e0fe7233de4d25fac88e81fb021233e504bd15b69c'
          assert new['source_manifest_canonical_sha256']=='d9adbdd73abb0edea4c27f0f72d6f0a09e3bb6deb6388e0f50547a676511f4aa'
          assert (int(new['source_slice_start']),int(new['source_slice_end']))==(68,76)
          assert int(new['sample_count'])==8
          assert int(new['node_limit_per_method'])==64000000
          assert int(new['effective_heavy_concurrency'])==8 <= 18
          assert float(new['projected_peak_artifact_mb']) <= 1.0 < 500
          assert new['persisted_artifact']=='COMPACT_COMPARISON_CERTIFICATES_ONLY'
          assert new['FULL_178_ROW_SWEEP_AUTHORIZED'] is True
          assert new['B18_RELEASE_AUTHORIZED'] is False
          assert new['THEOREM_CREDIT'] is False and new['RECEIVER_CREDIT'] is False
          PY
          mkdir -p "$RUNNER_TEMP/source"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9715047774/zip" \
            -o "$RUNNER_TEMP/source/source.zip"
          echo '44831de7c31c6dd7464598e0fe7233de4d25fac88e81fb021233e504bd15b69c  '"$RUNNER_TEMP/source/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source/source.zip" -d "$RUNNER_TEMP/source/unzip"
          python - "$RUNNER_TEMP/source/unzip/wave-manifest.json" "$GITHUB_OUTPUT" <<'PY'
          import hashlib,json,sys
          path,out=sys.argv[1:]
          m=json.load(open(path))
          raw=dict(m); expected=raw.pop('canonical_sha256_without_this_field',None)
          digest=hashlib.sha256(json.dumps(raw,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert digest=='d9adbdd73abb0edea4c27f0f72d6f0a09e3bb6deb6388e0f50547a676511f4aa'
          if expected is not None: assert expected==digest
          units=m['next_exact_work_units'][68:76]
          assert len(units)==8 and len({u['work_unit_id'] for u in units})==8
          with open(out,'a') as f:
              f.write('authorized=true\n')
              f.write('matrix='+json.dumps({'work_unit':units},separators=(',',':'))+'\n')
              f.write('revision=1\n')
          PY

  calibrate:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.authorize.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WORK_UNIT_JSON: ${{ toJSON(matrix.work_unit) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Compare old split and resumable cursor at 64M
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage32-resumable-calibration"
          ID=$(python -c 'import json,os; print(json.loads(os.environ["WORK_UNIT_JSON"])["work_unit_id"])')
          OLD="$RUNNER_TEMP/old.json"; NEW="$RUNNER_TEMP/new.json"
          COMMON=(--retained stages/stage33/33-07/picard_base_rows_retained.py --marking stages/stage33/33-07/stage32_picard_marking_retained.py --work-unit-json "$WORK_UNIT_JSON" --node-limit 64000000)
          python stages/stage32/residual-32-01-production/run_full178_prefix_work_unit.py "${COMMON[@]}" --output "$OLD"
          python stages/stage32/residual-32-01-production/run_full178_resumable_work_unit.py "${COMMON[@]}" --output "$NEW"
          python - "$OLD" "$NEW" "$RUNNER_TEMP/stage32-resumable-calibration/${ID}.json" <<'PY'
          import hashlib,json,pathlib,sys
          old=json.load(open(sys.argv[1])); new=json.load(open(sys.argv[2])); out=pathlib.Path(sys.argv[3])
          assert old['row_id']==new['row_id']
          assert old['nodes_used']==new['nodes_used']
          # Both traverse the same exact DFS prefix until the resource wall.
          ot=old['telemetry'][0]; nt=new['telemetry'][0]
          for k in ('nodes','membership_prunes','symmetry_prunes','terminal_count','terminal_stream_sha256','complete'):
              assert ot[k]==nt[k], (k,ot[k],nt[k])
          payload={
            'schema':'STAGE32_RESIDUAL32_01_RESUMABLE_FRONTIER_COMPARISON_V1',
            'work_unit_id':old['input_work_unit']['work_unit_id'],'row_id':old['row_id'],
            'node_limit':64000000,'nodes_used':old['nodes_used'],
            'old_children':old['unknown_count'],'resumable_children':new['unknown_count'],
            'old_completed':len(old['completed_prefix_partitions']),
            'resumable_completed':len(new['completed_prefix_partitions']),
            'terminal_stream_sha256':ot['terminal_stream_sha256'],
            'membership_prunes':ot['membership_prunes'],'symmetry_prunes':ot['symmetry_prunes'],
            'terminal_count':ot['terminal_count'],
            'resumable_structural_reproduction_upper_bound':1.0,
            'unknown_is_unsat':False,'prefix_stage_only':True,
            'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False
          }
          payload['canonical_sha256_without_this_field']=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          assert out.stat().st_size < 16*1024
          print(json.dumps(payload,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-resumable-frontier-r${{ needs.authorize.outputs.revision }}-${{ matrix.work_unit.work_unit_id }}
          path: ${{ runner.temp }}/stage32-resumable-calibration/*.json
          retention-days: 1
          if-no-files-found: error

  aggregate:
    needs: [authorize, calibrate]
    if: needs.authorize.outputs.authorized == 'true' && needs.calibrate.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-resumable-frontier-r${{ needs.authorize.outputs.revision }}-wu-*
          path: ${{ runner.temp }}/aggregate
          merge-multiple: true
      - name: Aggregate compact comparison evidence
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'aggregate'; files=sorted(root.glob('*.json'))
          assert len(files)==8
          rows=[json.load(open(p)) for p in files]
          old=sum(x['old_children'] for x in rows); new=sum(x['resumable_children'] for x in rows)
          payload={'schema':'STAGE32_RESIDUAL32_01_RESUMABLE_FRONTIER_CALIBRATION_MANIFEST_V1',
                   'sample_count':8,'node_limit_per_method':64000000,
                   'old_children_total':old,'resumable_children_total':new,
                   'old_children_per_input':old/8,'resumable_children_per_input':new/8,
                   'resumable_children_le_one_each':all(x['resumable_children']<=1 for x in rows),
                   'exact_prefix_equivalence_each':True,'sample_results':rows,
                   'unknown_is_unsat':False,'prefix_stage_only':True,
                   'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False}
          payload['canonical_sha256_without_this_field']=hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          out=root/'resumable-frontier-manifest.json'; out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          assert out.stat().st_size < 1024*1024
          print(json.dumps({'old_children_total':old,'resumable_children_total':new,
                            'old_ratio':old/8,'new_ratio':new/8,
                            'sha256':payload['canonical_sha256_without_this_field']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-resumable-frontier-r${{ needs.authorize.outputs.revision }}-manifest
          path: ${{ runner.temp }}/aggregate/resumable-frontier-manifest.json
          retention-days: 7
          if-no-files-found: error
