name: Stage32EX5 HPADJ21 b-chunk preflight

# Lifecycle: ACTIVE_AUTO bounded equivalence/resume-plumbing gate; no scaleout.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32-ex5/hpadj-21_ex5/run_full_hist_bchunk.py'
      - 'stages/stage32-ex5/hpadj-21_ex5/assemble_full_hist_row_from_bchunks.py'
      - 'stages/stage32-ex5/hpadj-21_ex5/verify_bchunk_equivalence_bounded.py'
      - '.github/workflows/stage32-ex5-hpadj21-bchunk-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32ex5-hpadj21-bchunk-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Syntax check
        run: python -m py_compile stages/stage32-ex5/hpadj-21_ex5/run_full_hist_bchunk.py stages/stage32-ex5/hpadj-21_ex5/assemble_full_hist_row_from_bchunks.py stages/stage32-ex5/hpadj-21_ex5/verify_bchunk_equivalence_bounded.py
      - name: Exact bounded direct-vs-bchunk equivalence
        run: python stages/stage32-ex5/hpadj-21_ex5/verify_bchunk_equivalence_bounded.py

  resume-seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Produce one tiny exact checkpoint
        run: |
          set -euo pipefail
          mkdir -p out
          python stages/stage32-ex5/hpadj-21_ex5/run_full_hist_bchunk.py --row-index 0 --b-start 0 --b-stop 0 --output out/hpadj21-bchunk-resume-seed.json
      - uses: actions/upload-artifact@v4
        with:
          name: hpadj21-bchunk-resume-seed
          path: out/hpadj21-bchunk-resume-seed.json
          retention-days: 1
          if-no-files-found: error
          compression-level: 9

  resume-readback:
    needs: resume-seed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Download checkpoint through recovery-style artifact path
        uses: actions/download-artifact@v4
        with:
          name: hpadj21-bchunk-resume-seed
          path: recovered
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Verify recovered checkpoint without recomputation
        run: |
          set -euo pipefail
          test -s recovered/hpadj21-bchunk-resume-seed.json
          python stages/stage32-ex5/hpadj-21_ex5/run_full_hist_bchunk.py --row-index 0 --b-start 0 --b-stop 0 --verify-existing recovered/hpadj21-bchunk-resume-seed.json
          echo HPADJ21_RESUME_READBACK_PASS_NO_RECOMPUTE
