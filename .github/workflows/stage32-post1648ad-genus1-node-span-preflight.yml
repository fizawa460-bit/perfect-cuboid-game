name: Stage32 post1648AD genus1 node-span preflight
on:
  push:
    branches:
      - stage32-scratch-post1648ad-genus1-node-span-preflight
permissions:
  contents: read
jobs:
  exact-genus1-node-span-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact scratch head
        uses: actions/checkout@v4
      - name: Assert event exact head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify exact genus1 node-span preflight
        run: python3 -B stages/stage32/residual-32-01-production/verify_stage32_post1648ad_genus1_node_span_preflight.py
      - name: Commit whitespace check
        run: git show --check --oneline --no-patch HEAD
