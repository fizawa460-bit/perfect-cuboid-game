name: Stage36 literature Phase4 locator repair

on:
  push:
    branches:
      - arsenal-stage36-literature-strengthening-implementation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add canonical locator for Taylor monograph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/arsenal/_stage36_lit_phase4_impl.py')
          s = p.read_text()
          old = 'taylor = lit("Donald E. Taylor", "The Geometry of the Classical Groups", "Heldermann Verlag, Sigma Series in Pure Mathematics 9", 1992, None, None, "Theorem 8.5", "authoritative monograph", "transvection result is duplicate-routed to S32-PW06; it does not identify Stage36 source-labelled orbits")'
          new = 'taylor = lit("Donald E. Taylor", "The Geometry of the Classical Groups", "Heldermann Verlag, Sigma Series in Pure Mathematics 9", 1992, None, "https://www.heldermann.de/SSPM/SSPM09/sspm09.htm", "Theorem 8.5", "authoritative monograph", "transvection result is duplicate-routed to S32-PW06; it does not identify Stage36 source-labelled orbits")'
          assert old in s
          p.write_text(s.replace(old,new))
          print('PASS: Taylor canonical publisher locator added')
          PY
          python3 -m py_compile docs/arsenal/_stage36_lit_phase4_impl.py
      - name: Commit repaired temporary materializer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/arsenal/_stage36_lit_phase4_impl.py
          git commit -m '[Arsenal][Literature][Stage36] add Taylor canonical source locator'
          git push origin HEAD:arsenal-stage36-literature-strengthening-implementation
