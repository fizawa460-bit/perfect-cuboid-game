name: StructureRadar batch22 audit repair runner

on:
  push:
    branches:
      - structure-radar-batch22-audit-repair-runner

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-batch22-audit-repair-runner
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Repair audited batch22 count and forward PR branch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/structure-radar/progress.json')
          data = json.loads(p.read_text())
          batch_id = 'SR-BATCH-STAGE14_15_DEEP_CORPUS-22-R01'
          batch = next(b for b in data['audit_batches'] if b.get('batch_id') == batch_id)
          union = set()
          carriers = 0
          no_distinct = 0
          for sid in batch['source_ids']:
              review = data['source_reviews'][sid]
              ids = review.get('structure_ids', [])
              if ids:
                  carriers += 1
                  union.update(ids)
              elif review.get('status') == 'NO_DISTINCT_STRUCTURE':
                  no_distinct += 1
          assert len(batch['source_ids']) == 60
          assert carriers == 59
          assert no_distinct == 1
          assert len(union) == 36
          batch['structures_updated'] = 36
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
          python scripts/structure_radar.py verify
          git diff --check
          rm -f \
            .github/workflows/structure-radar-batch22-audit-repair.yml \
            .github/workflows/structure-radar-batch22-audit-repair-direct.yml \
            .github/workflows/structure-radar-batch22-audit-repair-runner.yml \
            docs/structure-radar/.batch22-audit-repair-trigger \
            docs/structure-radar/.batch22-audit-repair-runner-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair StructureRadar batch22 audit count"
          git push origin HEAD:structure-radar-deep-corpus-batch-22
