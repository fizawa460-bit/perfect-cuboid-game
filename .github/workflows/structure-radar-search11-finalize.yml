name: StructureRadar search11 finalize
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'structure-radar-search-11-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply batch
        run: |
          python .github/structure-radar-search11-finalize.py
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python - <<'PY'
          import json
          q=json.load(open('docs/structure-radar/exploration-queue.json'))
          ready=next(t for t in q['tasks'] if t['status']=='READY')
          assert ready['structure_ids']==[f'SR-STR-{i:03d}' for i in range(94,104)]
          c=json.load(open('docs/structure-radar/controller.json'))
          assert c['registry']['unresolved_search_count']==117
          assert c['registry']['pending_arsenal_decision_count']==136
          PY
          rm .github/workflows/structure-radar-search11-finalize.yml .github/structure-radar-search11-finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'StructureRadar: literature search batch11'
          git push origin HEAD:${{ github.head_ref }}
