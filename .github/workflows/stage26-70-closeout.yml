name: Stage26-70 closeout synthesis

on:
  pull_request:
    paths:
      - 'stages/stage26/26-70/**'
      - 'stages/stage26/26-controller.json'
      - 'stages/stage26/26-60/**'
      - 'docs/stage26-arsenal-promotion.md'
      - 'docs/00_CURRENT_RESEARCH_STATUS.md'
      - '.github/workflows/stage26-70-closeout.yml'
  workflow_dispatch:

jobs:
  verify-stage26-70:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage26 checkpoint70 closeout
        run: python stages/stage26/26-70/verify_26_70.py
