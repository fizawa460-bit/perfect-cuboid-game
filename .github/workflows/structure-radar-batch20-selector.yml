name: StructureRadar batch20 selector

on:
  push:
    branches:
      - structure-radar-deep-corpus-batch-20
    paths:
      - .github/structure-radar-batch20-selector-trigger.txt

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-20
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build batch20 source digest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path

          q=json.loads(Path('docs/structure-radar/exploration-queue.json').read_text())
          ready=[t for t in q['tasks'] if t.get('status')=='READY']
          if len(ready)!=1: raise SystemExit(f'expected one READY task, got {len(ready)}')
          task=ready[0]
          ids=task['source_ids']
          if len(ids)!=60: raise SystemExit(f'expected 60 ids, got {len(ids)}')
          entries={}
          for p in sorted(Path('docs/structure-radar/source-manifest').glob('part-*.json')):
              d=json.loads(p.read_text())
              for s in d['sources']:
                  if s['source_id'] in ids: entries[s['source_id']]=s
          missing=[x for x in ids if x not in entries]
          if missing: raise SystemExit('missing '+','.join(missing))
          keyre=re.compile(r'(theorem|lemma|proposition|corollary|result|conclusion|boundary|status|saving|exponent|sqrt|square-root|proved|unproved|not proved|target|receiver|gate|obstruction|park|conditional|final|summary|verdict|power|density|collision|kummer|hecke|pell|gaussian|selector|sieve|rank|curve|fiber|projective|residue|conductor)',re.I)
          out=[]
          for i,sid in enumerate(ids,1):
              s=entries[sid]; p=Path(s['path'])
              text=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
              lines=text.splitlines()
              title=next((ln.strip() for ln in lines if ln.strip().startswith('#')), '')
              out.append(f'=== {i:02d} {sid} ===')
              out.append(f'PATH: {s["path"]}')
              out.append(f'FINGERPRINT: {s["fingerprint"]}')
              out.append(f'KIND: {s.get("kind")} ROLE: {s.get("evidence_role")}')
              out.append(f'TITLE: {title}')
              out.append('FIRST_NONEMPTY:')
              for ln in [x for x in lines if x.strip()][:25]: out.append(ln[:500])
              out.append('KEY_LINES:')
              hits=[]
              for n,ln in enumerate(lines,1):
                  if keyre.search(ln): hits.append(f'{n}: {ln[:700]}')
                  if len(hits)>=45: break
              out.extend(hits)
              out.append('')
          Path('docs/structure-radar/batch20-source-digest.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          Path('docs/structure-radar/batch20-selected.json').write_text(json.dumps({'task_id':task['task_id'],'source_ids':ids,'sources':[entries[x] for x in ids]},indent=2)+'\n')
          print('BATCH20_SELECTOR=PASS')
          print('TASK_ID='+task['task_id'])
          print('SOURCE_COUNT='+str(len(ids)))
          PY
      - name: Commit digest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/structure-radar/batch20-source-digest.txt docs/structure-radar/batch20-selected.json
          git diff --cached --check
          git commit -m 'StructureRadar batch20 source digest'
          git push origin HEAD:structure-radar-deep-corpus-batch-20
