name: Stage33 V91C1X R5B3B3C4A tame-residue parity exact check

on:
  push:
    branches:
      - stage33-v91c1x-r5b2d0-swap23-source-lock
    paths:
      - stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4a_tame_residue_parity_and_cross_carrier_preflight.py
      - stages/stage33/33-12/e3-v91c1x-r5b3b3c4a-tame-residue-parity-and-cross-carrier-preflight.json
      - .github/workflows/stage33-v91c1x-r5b3b3c4a-tame-residue-parity-check.yml

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  exact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact checker dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Rebuild and compare C4A exact artifact
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4a_tame_residue_parity_and_cross_carrier_preflight.py
      - name: Check MAIN state synchronization
        run: python stages/stage33/sync_main_state.py --check
      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
