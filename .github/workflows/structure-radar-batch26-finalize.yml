name: StructureRadar batch26 finalizer

on:
  push:
    branches:
      - structure-radar-deep-corpus-batch-26

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize batch 26
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import scripts.structure_radar as sr

          ROOT = Path('.')
          PROGRESS = ROOT / 'docs/structure-radar/progress.json'
          REGISTRY = ROOT / 'docs/structure-radar/structure-registry.json'
          BATCH = 'SR-BATCH-STAGE14_15_DEEP_CORPUS-26-R01'
          TASK = 'SR-CENSUS-STAGE14_15_DEEP_CORPUS-01'
          LOCATOR = 'normalized Stage14-15 deep-corpus batch26 carrier'

          progress = json.loads(PROGRESS.read_text(encoding='utf-8'))
          registry = json.loads(REGISTRY.read_text(encoding='utf-8'))
          manifest, queue, controller = sr.generated_documents()
          ready = next((t for t in queue['tasks'] if t.get('status') == 'READY'), None)
          assert ready is not None, 'no READY StructureRadar task'
          assert ready['task_id'] == TASK, ready['task_id']
          source_ids = ready['source_ids']
          assert len(source_ids) == 60, len(source_ids)
          assert source_ids[0] == 'SRC-E3AFD568D83F', source_ids[0]
          assert source_ids[-1] == 'SRC-3E6CC63D6AD1', source_ids[-1]
          source_map = {s['source_id']: s for s in manifest['sources']}

          fixed = {
            'stages/stage15/15-2b/result.md': ['SR-STR-003','SR-STR-005','SR-STR-216'],
            'stages/stage15/15-3/result.md': ['SR-STR-145'],
            'stages/stage15/15-4/result.md': ['SR-STR-145','SR-STR-053','SR-STR-200'],
            'stages/stage15/15-5/result.md': ['SR-STR-039','SR-STR-216'],
            'stages/stage15/15-6-controller.json': None,
            'stages/stage15/15-6-cycle/6an-6aq.md': ['SR-STR-195','SR-STR-219','SR-STR-162','SR-STR-169'],
            'stages/stage15/15-6-cycle/6ar-6au.md': ['SR-STR-195','SR-STR-162'],
            'stages/stage15/15-6-cycle/6av-6ay.md': ['SR-STR-162','SR-STR-163','SR-STR-175'],
            'stages/stage15/15-6-cycle/6az-6bc.md': ['SR-STR-162','SR-STR-163','SR-STR-169'],
            'stages/stage15/15-6-cycle/6bd-6bg.md': ['SR-STR-164','SR-STR-151','SR-STR-133'],
            'stages/stage15/15-6-cycle/6bh-6bk.md': ['SR-STR-053','SR-STR-200','SR-STR-133'],
            'stages/stage15/15-6-cycle/6bl-6bo.md': ['SR-STR-200','SR-STR-102','SR-STR-133'],
            'stages/stage15/15-6-cycle/6bp-6bs.md': ['SR-STR-102','SR-STR-133'],
            'stages/stage15/15-6-cycle/6bt-6bx.md': ['SR-STR-102','SR-STR-200','SR-STR-169','SR-STR-133'],
            'stages/stage15/15-6-cycle/result.md': ['SR-STR-200','SR-STR-164','SR-STR-162'],
            'stages/stage15/15-6-final.md': ['SR-STR-145','SR-STR-187'],
          }
          individual = {
            'aa':['SR-STR-145','SR-STR-053','SR-STR-200'],
            'ab':['SR-STR-200'],
            'ac':['SR-STR-200','SR-STR-164'],
            'ad':['SR-STR-164'],
            'ae':['SR-STR-164','SR-STR-133'],
            'af':['SR-STR-169','SR-STR-164'],
            'ag':['SR-STR-169'],
            'ah':['SR-STR-200','SR-STR-169'],
            'ai':['SR-STR-175','SR-STR-162','SR-STR-163'],
            'aj':['SR-STR-164','SR-STR-151'],
            'ak':['SR-STR-164'],
            'al':['SR-STR-200','SR-STR-186'],
            'am':['SR-STR-200','SR-STR-195','SR-STR-162'],
            'an':['SR-STR-195','SR-STR-219'],
            'ao':['SR-STR-219'],
            'ap':['SR-STR-219','SR-STR-169'],
            'aq':['SR-STR-169','SR-STR-133'],
            'ar':['SR-STR-195'],
            'as':['SR-STR-162'],
            'at':['SR-STR-162','SR-STR-133'],
            'au':['SR-STR-162'],
            'av':['SR-STR-163','SR-STR-162'],
            'aw':['SR-STR-162','SR-STR-195'],
            'ax':['SR-STR-162'],
            'ay':['SR-STR-162','SR-STR-163','SR-STR-175'],
            'az':['SR-STR-162'],
            'ba':None,
            'bb':['SR-STR-163','SR-STR-164'],
            'bc':['SR-STR-169','SR-STR-162'],
            'bd':['SR-STR-164','SR-STR-151'],
            'be':['SR-STR-151','SR-STR-164'],
            'bf':['SR-STR-163'],
            'bg':['SR-STR-151','SR-STR-164','SR-STR-133'],
            'bh':['SR-STR-133'],
            'bi':['SR-STR-053','SR-STR-200','SR-STR-164'],
            'bj':None,
            'bk':['SR-STR-200','SR-STR-133'],
            'bl':['SR-STR-200'],
            'bm':['SR-STR-102','SR-STR-200'],
            'bn':['SR-STR-102'],
            'bo':['SR-STR-102','SR-STR-133'],
            'bp':['SR-STR-102'],
            'bq':['SR-STR-102'],
            'br':['SR-STR-102','SR-STR-133'],
          }

          def targets(path):
            if path in fixed:
              return fixed[path]
            m = re.fullmatch(r'stages/stage15/15-6([a-z]{2})/result\.md', path)
            if m and m.group(1) in individual:
              return individual[m.group(1)]
            raise AssertionError(f'unclassified batch26 source: {path}')

          cards = {c['structure_id']: c for c in registry['structures']}
          touched = set()
          carriers = 0
          no_distinct = 0
          classifications = {}
          for source_id in source_ids:
            src = source_map[source_id]
            path = src['path']
            tgts = targets(path)
            if tgts is None:
              progress['source_reviews'][source_id] = {
                'fingerprint': src['fingerprint'],
                'status': 'NO_DISTINCT_STRUCTURE',
                'batch_id': BATCH,
              }
              no_distinct += 1
              classifications[path] = []
              continue
            carriers += 1
            classifications[path] = tgts
            progress['source_reviews'][source_id] = {
              'fingerprint': src['fingerprint'],
              'status': 'STRUCTURES_RECORDED',
              'batch_id': BATCH,
              'structure_ids': tgts,
            }
            for sid in tgts:
              assert sid in cards, sid
              touched.add(sid)
              prov = cards[sid]['repo_provenance']
              if not any(p.get('source_id') == source_id for p in prov):
                prov.append({
                  'source_id': source_id,
                  'path': path,
                  'locator': LOCATOR,
                  'fingerprint': src['fingerprint'],
                })

          assert carriers == 57, carriers
          assert no_distinct == 3, no_distinct
          expected_touched = {
            'SR-STR-003','SR-STR-005','SR-STR-039','SR-STR-053','SR-STR-102',
            'SR-STR-133','SR-STR-145','SR-STR-151','SR-STR-162','SR-STR-163',
            'SR-STR-164','SR-STR-169','SR-STR-175','SR-STR-186','SR-STR-187',
            'SR-STR-195','SR-STR-200','SR-STR-216','SR-STR-219'
          }
          assert touched == expected_touched, (sorted(touched), sorted(expected_touched))
          assert not any(b.get('batch_id') == BATCH for b in progress.get('audit_batches', []))
          progress.setdefault('audit_batches', []).append({
            'batch_id': BATCH,
            'task_id': TASK,
            'status': 'SUBMITTED_FOR_AUDIT',
            'source_ids': source_ids,
            'sources_reviewed': 60,
            'structures_added': 0,
            'structures_updated': len(touched),
            'structure_carrier_sources': carriers,
            'structures_deduped': no_distinct,
            'searches_completed': 0,
            'arsenal_decisions': 0,
            'audit_required': True,
            'duplicate_source': 0,
            'no_distinct_structure': no_distinct,
          })

          PROGRESS.write_text(json.dumps(progress, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          REGISTRY.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('BATCH26_CARRIERS', carriers)
          print('BATCH26_NO_DISTINCT', no_distinct)
          print('BATCH26_STRUCTURES_UPDATED', len(touched))
          print('BATCH26_TOUCHED', ','.join(sorted(touched)))
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git diff --check
      - name: Commit official StructureRadar files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/structure-radar-batch26-finalize.yml
          git add docs/structure-radar
          python scripts/structure_radar.py verify
          git diff --cached --check
          git commit -m "StructureRadar census Stage14-15 deep corpus batch 26"
          git push origin HEAD:structure-radar-deep-corpus-batch-26
