name: Stage32 BRIDGE BR203 Picard mu

# lifecycle: ACTIVE_AUTO while STATE.json active_leaf is BR203_PICARD_MU_16_STATE_INTEGRATION.
# Retire to workflow_dispatch-only in the same transition that activates BR204.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/generalization-bridge/**'
      - 'stages/stage32/residual-32-01-production/pairing_prefix_engine.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - '.github/workflows/stage32-bridge-br203.yml'

permissions:
  contents: read

jobs:
  br203-picard-mu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify active BR203 frontier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('stages/stage32/generalization-bridge/STATE.json')
          s = json.loads(p.read_text())
          assert s['active_leaf'] == 'BR203_PICARD_MU_16_STATE_INTEGRATION', s['active_leaf']
          assert s['routing']['BR203_authorized'] is True
          assert s['routing']['BR204_FULL178_scaleout_authorized'] is False
          print('BR203 ACTIVE_AUTO frontier confirmed')
          PY
      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run source-locked BR203 16-state verifier
        run: |
          python stages/stage32/generalization-bridge/verify_br203_picard_mu_16_state.py \
            --output /tmp/BR203-PICARD-MU-16-STATE-RESULT.json
          python - <<'PY'
          import json
          p='/tmp/BR203-PICARD-MU-16-STATE-RESULT.json'
          x=json.load(open(p))
          print('BR203_RESULT_BEGIN')
          print(json.dumps(x, sort_keys=True, separators=(',', ':')))
          print('BR203_RESULT_END')
          PY
