name: Stage32EX5 HPADJ09 quotient diagnostic

# lifecycle: ACTIVE_AUTO while stage32ex5-hpadj09-successor-20260915 is the active HPADJ09 successor surface.
# Lightweight exact diagnostic only: no artifacts, no FULL178 scaleout, no heavy authorization.
on:
  push:
    branches:
      - stage32ex5-hpadj09-successor-20260915
    paths:
      - 'stages/stage32-ex5/hpadj-09_ex5/**'
      - '.github/workflows/stage32-ex5-hpadj09-quotient.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-mod8-quotient:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact lightweight dependency
        run: python -m pip install --disable-pip-version-check sympy==1.13.3
      - name: Verify HPADJ09 finite quotient obstruction
        run: python stages/stage32-ex5/hpadj-09_ex5/verify_hpadj09_mod8_quotient.py
