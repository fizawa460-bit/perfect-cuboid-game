name: Stage15-6bd diagonal product

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6bd/**'
      - 'stages/stage15/evidence/stage15_6bd_diagonal_product.json'
      - 'stages/stage15/replay/verify_stage15_6bd.py'
      - 'stages/stage15/scripts/stage15_6bd_diagonal_product.py'
      - '.github/workflows/stage15-6bd-diagonal-product.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python stages/stage15/replay/verify_stage15_6bd.py
      - run: python -m py_compile stages/stage15/scripts/stage15_6bd_diagonal_product.py stages/stage15/replay/verify_stage15_6bd.py
