name: Stage14-s-batch s7-66..68 allocation normalization

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-66/**'
      - 'stages/stage14/14-s7-67/**'
      - 'stages/stage14/14-s7-68/**'
      - 'stages/stage14/14-s-batch/**'
      - 'stages/stage14/scripts/14-s-batch/**'
      - '.github/workflows/stage14-s-batch-s7-66-68-allocation-normalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Batch deterministic audit
        run: python stages/stage14/scripts/14-s-batch/s7_66_68_allocation_normalization_audit.py

      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/14-s-batch/s7_66_68_allocation_normalization_audit.py

      - name: Regress merged s7-65
        run: python stages/stage14/scripts/14-s7-65/primitive_slope_witness_decomposition_audit.py

      - name: Regress merged 4dz
        run: python stages/stage14/scripts/14-4/nested_acceptance_density_audit.py

      - name: Lock batch boundary
        run: |
          grep -Fq 'RECEIVER_MATERIALLY_CHANGED=false' stages/stage14/14-s7-66/result.md
          grep -Fq 'RECEIVER_MATERIALLY_CHANGED=false' stages/stage14/14-s7-67/result.md
          grep -Fq 'RECEIVER_MATERIALLY_CHANGED=true' stages/stage14/14-s7-68/result.md
          grep -Fq 'NEXT=Stage14-s7-69' stages/stage14/14-s7-68/result.md
          grep -Fq 'BATCH_STOP_REASON=receiver_change' stages/stage14/14-s-batch/s7-66-68-report.md
          grep -Fq 'BATCH_SUBSTANTIVE_STAGE_COUNT=3' stages/stage14/14-s-batch/s7-66-68-report.md

      - name: Diff check
        run: git diff --check origin/main...HEAD
