name: Stage14-t46 twist-translation conductor energy

on:
  pull_request:
    paths:
      - 'stages/stage14/14-t46/**'
      - 'stages/stage14/scripts/14-t/t46_twist_translation_conductor_energy_audit.py'
      - 'stages/stage14/data/14-t46/**'
      - '.github/workflows/stage14-t46-twist-translation-conductor-energy.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run t45 regression
        run: python stages/stage14/scripts/14-t/t45_two_canonical_character_audit.py
      - name: Run t46 twist-translation conductor-energy audit
        run: python stages/stage14/scripts/14-t/t46_twist_translation_conductor_energy_audit.py
