name: StructureRadar history batch33 finalizer
on:
  push:
    branches: [structure-radar-history-batch-33]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply batch33 census
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('.')
          batch_id='SR-BATCH-STAGE02_13_HISTORY-33-R01'
          task_id='SR-CENSUS-STAGE02_13_HISTORY-01'
          M={
          'SRC-0E2873D1E474':['SR-STR-031','SR-STR-227'],
          'SRC-9D279EE67C73':None,
          'SRC-70493AE98E3A':['SR-STR-031','SR-STR-227'],
          'SRC-1F02135E3A4D':None,
          'SRC-0929BAD356A5':['SR-STR-029','SR-STR-227'],
          'SRC-0756E0EE277F':['SR-STR-029','SR-STR-227'],
          'SRC-4DD13664227C':['SR-STR-028','SR-STR-227'],
          'SRC-2F8E62DF2513':['SR-STR-028','SR-STR-227'],
          'SRC-378777AF1683':['SR-STR-028','SR-STR-029','SR-STR-041','SR-STR-227'],
          'SRC-94D587F0C7D8':['SR-STR-028','SR-STR-029','SR-STR-041','SR-STR-227'],
          'SRC-F29AB8E114A9':['SR-STR-028','SR-STR-029','SR-STR-031','SR-STR-041','SR-STR-226','SR-STR-227'],
          'SRC-BC95DF81B103':None,
          'SRC-DB239BC66545':['SR-STR-028','SR-STR-029','SR-STR-030','SR-STR-031','SR-STR-041','SR-STR-226','SR-STR-227'],
          'SRC-19A7D40060E7':None,
          'SRC-5A1BD59C67AD':None,
          'SRC-A1C4009DF738':None,
          'SRC-EC2A8CB1E7E4':None,
          'SRC-EADCECFE1D01':None,
          'SRC-3B269BAA4928':None,
          'SRC-C75C3AE1F5EE':None,
          'SRC-2D42ACB868ED':None,
          'SRC-427A5BE2319C':None,
          'SRC-9399A62C0D3C':None,
          'SRC-188E0C211990':None,
          'SRC-3CD023931C3E':None,
          'SRC-D1442F101BC9':None,
          'SRC-43D6FF380545':None,
          'SRC-B9487BC5B5A9':None,
          'SRC-59E40AD883D5':None,
          'SRC-6A0CFE3EA410':None,
          'SRC-185191E61C57':None,
          'SRC-54AA2E86B11E':None,
          'SRC-F4F62A4D244B':None,
          'SRC-7045046FBB2F':None,
          'SRC-BD6E963B6232':None,
          'SRC-0C1FFDCF0519':None,
          'SRC-96DB9A4E54FC':None,
          'SRC-99BAA97D2DFA':None,
          'SRC-879AFF66DA13':None,
          'SRC-B5D920FC14E2':None,
          'SRC-5668F4B30651':None,
          'SRC-8C2D3F038198':None,
          'SRC-7689108E45BA':None,
          'SRC-AAC4D8C51DAF':None,
          'SRC-AD48B63B97D6':None,
          'SRC-B6B8A5864834':None,
          'SRC-389206705A87':None,
          'SRC-77A69E4F606B':None,
          'SRC-5BADCB48F72F':None,
          'SRC-2D8949354F6F':None,
          'SRC-EFF443F52D23':None,
          'SRC-BAC6D29AECF1':None,
          'SRC-6853F55A4787':None,
          'SRC-C7693203B90F':None,
          'SRC-16149CCE0680':None,
          'SRC-F0D3F5FE534A':None,
          'SRC-83EF504D17BB':None,
          'SRC-2B765380ADA6':None,
          'SRC-851610541515':None,
          'SRC-D08CBFBD9EA9':None
          }
          qpath=root/'docs/structure-radar/exploration-queue.json'
          q=json.loads(qpath.read_text())
          task=next(t for t in q['tasks'] if t['status']=='READY' and t['phase']=='SOURCE_CENSUS')
          ids=task['source_ids']
          assert task['task_id']==task_id, task['task_id']
          assert len(ids)==60 and ids==list(M.keys()), (len(ids),ids[:3],list(M)[:3],ids[-3:],list(M)[-3:])
          source_map={}; part_docs={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              d=json.loads(p.read_text()); part_docs[p]=d
              for s in d['sources']: source_map[s['source_id']]=s
          prog_path=root/'docs/structure-radar/progress.json'; prog=json.loads(prog_path.read_text())
          assert not any(b.get('batch_id')==batch_id for b in prog['audit_batches'])
          reg_path=root/'docs/structure-radar/structure-registry.json'; reg=json.loads(reg_path.read_text())
          cards={c['structure_id']:c for c in reg['structures']}
          expected_union=['SR-STR-028','SR-STR-029','SR-STR-030','SR-STR-031','SR-STR-041','SR-STR-226','SR-STR-227']
          assert all(cid in cards for cid in expected_union)
          locator={
            'SR-STR-028':'Stage13 R07 curved-region/core-wing hardening provenance',
            'SR-STR-029':'Stage13 R07 fixed-S inert-prime overlap and epsilon-squeeze provenance',
            'SR-STR-030':'Stage13 R07 canonical chamber/coarea directional proof provenance',
            'SR-STR-031':'Stage13 R07 fixed finite Hecke/ray-class and analytic-contract provenance',
            'SR-STR-041':'Stage13 R07 exact oriented-record factor-two projection provenance',
            'SR-STR-226':'Stage13 R07 frozen Stage12 R09 input provenance only',
            'SR-STR-227':'Stage13 R07 proof-hardening/canonical-synthesis provenance; theorem scope unchanged'
          }
          for sid in ids:
              s=source_map[sid]
              assert s['review_state']=='NEW', (sid,s['review_state'])
              assert sid not in prog['source_reviews'], sid
              cids=M[sid]
              if cids is None:
                  prog['source_reviews'][sid]={'fingerprint':s['fingerprint'],'status':'NO_DISTINCT_STRUCTURE','batch_id':batch_id}
              else:
                  prog['source_reviews'][sid]={'fingerprint':s['fingerprint'],'status':'STRUCTURES_RECORDED','batch_id':batch_id,'structure_ids':cids}
                  for cid in cids:
                      pv=cards[cid].setdefault('repo_provenance',[])
                      if not any(x.get('source_id')==sid for x in pv):
                          pv.append({'source_id':sid,'path':s['path'],'locator':locator[cid],'fingerprint':s['fingerprint']})
              s['review_state']='CURRENT_REVIEWED'
          union=sorted({cid for sid in ids if M[sid] for cid in M[sid]})
          assert union==sorted(expected_union), union
          carrier=sum(M[sid] is not None for sid in ids); nodist=60-carrier
          assert (carrier,nodist)==(10,50), (carrier,nodist)
          prog['audit_batches'].append({
            'batch_id':batch_id,'task_id':task_id,'status':'SUBMITTED_FOR_AUDIT','source_ids':ids,
            'sources_reviewed':60,'structures_added':0,'structures_updated':7,
            'structure_carrier_sources':10,'structures_deduped':50,'searches_completed':0,
            'arsenal_decisions':0,'audit_required':True,'duplicate_source':0,'no_distinct_structure':50})
          prog_path.write_text(json.dumps(prog,indent=2,ensure_ascii=False)+'\n')
          reg_path.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')
          for p,d in part_docs.items():
              if any(s['source_id'] in M for s in d['sources']): p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Refresh and verify
        shell: bash
        run: |
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git diff --check
      - name: Assert batch33 accounting
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          r=pathlib.Path('.')
          c=json.loads((r/'docs/structure-radar/controller.json').read_text())
          assert c['corpus']['review_states']=={'CURRENT_REVIEWED':2510,'NEW':46}, c['corpus']['review_states']
          assert c['registry']['structure_count']==227, c['registry']['structure_count']
          p=json.loads((r/'docs/structure-radar/progress.json').read_text())
          b=next(x for x in p['audit_batches'] if x['batch_id']=='SR-BATCH-STAGE02_13_HISTORY-33-R01')
          assert b['sources_reviewed']==60 and b['structures_added']==0 and b['structures_updated']==7
          assert b['structure_carrier_sources']==10 and b['no_distinct_structure']==50 and b['duplicate_source']==0
          rv=[v for v in p['source_reviews'].values() if v.get('batch_id')==b['batch_id']]
          assert len(rv)==60 and sum(v['status']=='STRUCTURES_RECORDED' for v in rv)==10 and sum(v['status']=='NO_DISTINCT_STRUCTURE' for v in rv)==50
          q=json.loads((r/'docs/structure-radar/exploration-queue.json').read_text())
          ready=next(t for t in q['tasks'] if t['status']=='READY' and t['phase']=='SOURCE_CENSUS')
          assert ready['source_ids'][0]=='SRC-3E64FADC77F8', ready['source_ids'][0]
          print('BATCH33_OK',len(rv),c['corpus']['review_states'],ready['task_id'],ready['source_ids'][0])
          PY
      - name: Commit official ledger only
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f --ignore-unmatch .github/workflows/sr-b33-analyzer.yml .github/workflows/sr-b33-compact.yml .github/workflows/sr-b33-finalizer.yml
          git rm -f --ignore-unmatch .tmp/sr-b33-summary.tsv .tmp/sr-b33-compact.tsv .tmp/sr-b33-trigger.txt .tmp/sr-b33-compact-trigger.txt .tmp/sr-b33-finalizer-trigger.txt
          git add docs/structure-radar
          git status --short
          git commit -m 'StructureRadar: census Stage02-13 history batch 33'
          git push origin HEAD:structure-radar-history-batch-33
