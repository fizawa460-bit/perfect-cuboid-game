name: StructureRadar batch22 card peek
on:
  push:
    branches:
      - structure-radar-deep-corpus-batch-22
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('docs/structure-radar')
          cards={c['structure_id']:c for c in json.loads((r/'structure-registry.json').read_text())['structures']}
          want=['SR-STR-038','SR-STR-155','SR-STR-157','SR-STR-162','SR-STR-175','SR-STR-223']
          out={k:cards[k] for k in want}
          (r/'.batch22-cardpeek.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/structure-radar/.batch22-cardpeek.json
          if ! git diff --cached --quiet; then
            git commit -m "Build StructureRadar batch22 card peek"
            git push origin HEAD:structure-radar-deep-corpus-batch-22
          fi
