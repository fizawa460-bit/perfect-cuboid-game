name: Stage32EX1 1728 audit PASS sync

on:
  push:
    paths:
      - '.github/workflows/stage32ex1-1728-audit-pass-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize exact hostile-audit PASS receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          CLAIM='S32.EX1.ALL_V6_GENUS1_CARRIERS_EXCLUDED_CANDIDATE.V2'
          AUDITED_HEAD='e3c4a04d5010e6dca9428722e334890e2614297a'
          REVIEW=5147627146
          EXPECTED_CORE='84e7a4b6990d7c687eebe341fbea296fad1da2cae4785cb87580a0d84572437a'
          CORE_KEYS=['claim_id','kind','statement','scope_key','scope','proves','does_not_prove','requires','bridges','source_locks','replay_verifier']
          def core_sha(c):
              d={k:c[k] for k in CORE_KEYS if k in c}
              return hashlib.sha256(json.dumps(d,sort_keys=True,separators=(',',':')).encode()).hexdigest()

          regp=Path('stages/stage32/proof/CLAIM-REGISTRY.json')
          reg=json.loads(regp.read_text())
          c=next(x for x in reg['claims'] if x['claim_id']==CLAIM)
          assert c['claim_core_sha256']==EXPECTED_CORE
          assert core_sha(c)==EXPECTED_CORE
          assert c['authority_status']=='PROVISIONAL'
          assert c['audit_receipt'] is None
          c['authority_status']='AUDITED'
          c['audit_receipt']={'status':'PASS','pr':1728,'exact_head':AUDITED_HEAD,'review_id':REVIEW}
          assert core_sha(c)==EXPECTED_CORE
          regp.write_text(json.dumps(reg,sort_keys=True,separators=(',',':'))+'\n')

          lanep=Path('stages/stage32/proof/LANE-ADAPTERS.json')
          lanes=json.loads(lanep.read_text())
          ex1=next(x for x in lanes['lanes'] if x['lane']=='EX1')
          assert CLAIM in ex1['claim_refs']
          ex1['notes']=(
              'S32.EX1.ALL_V6_GENUS1_CARRIERS_EXCLUDED_CANDIDATE.V2 is AUDITED by PR #1728 exact head '
              + AUDITED_HEAD + ', hostile-audit review 5147627146. Audited EX1 credit is '
              'FULL_TARGET_CLOSURE / ALL_V6_GENUS1_CARRIERS_EXCLUDED for the exact Stage32EX1 population: '
              'all 29 fixed-V6 h=4 Q states and residues [73,97,235] are excluded there by the actual independently '
              'certified cellular Smith cokernel bridge (24576/24576 nonzero order-two classes). Historical V1 remains '
              'SUPERSEDED. This audited EX1 claim does not self-promote to Stage32 MAIN, does not by itself exclude '
              'Q602/O210 at MAIN scope, and requires a separate explicit current-target promotion adapter before MAIN consumption.'
          )
          lanep.write_text(json.dumps(lanes,sort_keys=True,separators=(',',':'))+'\n')

          pp=Path('stages/stage32/STAGE32-PROOF-PATH.md')
          s=pp.read_text()
          old=('The current repaired retained candidate is `S32.EX1.ALL_V6_GENUS1_CARRIERS_EXCLUDED_CANDIDATE.V2`, registered as **PROVISIONAL** with no hostile-audit PASS receipt. Its manifest is `stages/stage32-ex1/ex1-05af-retained-terminal-consolidation-v2.json`, its wrapper is `stages/stage32-ex1/verify_ex1_05af_retained_terminal_consolidation_v2.py`, and its load-bearing terminal bridge is `stages/stage32-ex1/verify_ex1_05af_cellular_obstruction_bridge.py`.')
          new=('The repaired retained candidate `S32.EX1.ALL_V6_GENUS1_CARRIERS_EXCLUDED_CANDIDATE.V2` is now **AUDITED** by PR #1728 exact head `'+AUDITED_HEAD+'`, hostile-audit review `5147627146`. Its immutable core remains unchanged: manifest `stages/stage32-ex1/ex1-05af-retained-terminal-consolidation-v2.json`, wrapper `stages/stage32-ex1/verify_ex1_05af_retained_terminal_consolidation_v2.py`, and load-bearing bridge `stages/stage32-ex1/verify_ex1_05af_cellular_obstruction_bridge.py`. The retained manifest itself remains the exact audited evidence snapshot; authority is advanced only in claim metadata from the external PASS receipt.')
          assert old in s
          s=s.replace(old,new,1)
          old2=('The re-audit of exact head `beec62400f5f2b49d325083fd9b745c3fd66763f` found no new mathematical defect in this repaired 05AF package; its sole remaining blocker was that this proof-path section still projected V1 as the current PROVISIONAL claim. This section now synchronizes that management projection to V1=`SUPERSEDED` and V2=`PROVISIONAL`; it does not itself grant hostile-audit credit.')
          new2=('The re-audit of exact head `beec62400f5f2b49d325083fd9b745c3fd66763f` found no new mathematical defect and left one proof-path synchronization blocker. After that blocker was repaired, hostile re-audit of exact head `'+AUDITED_HEAD+'` returned **PASS**. Claim synchronization therefore advances V2 from `PROVISIONAL` to `AUDITED` using review `5147627146`; this prose records that external receipt and does not self-award audit credit.')
          assert old2 in s
          s=s.replace(old2,new2,1)
          pp.write_text(s)

          projp=Path('stages/stage32-ex1/RETAINED-AUDIT-PROJECTION.json')
          proj=json.loads(projp.read_text())
          proj['candidate']['candidate_status']='HOSTILE_AUDIT_PASS_SYNCED_AUDITED_EX1_TERMINAL_NO_MAIN_PROMOTION'
          proj['candidate']['audit_receipt']={'status':'PASS','pr':1728,'exact_head':AUDITED_HEAD,'review_id':REVIEW}
          proj['candidate']['audit_route_status']='COMPLETED_PASS_AT_RECORDED_EXACT_HEAD'
          projp.write_text(json.dumps(proj,indent=2)+'\n')
          PY
          python3 stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python3 stages/stage32/proof/verify_stage32_active_frontier.py
          python3 stages/stage32-ex1/verify_ex1_05af_retained_terminal_consolidation_v2.py
      - name: Commit synchronized authority metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fizawa460-bit'
          git config user.email 'fizawa460@gmail.com'
          git add stages/stage32/proof/CLAIM-REGISTRY.json stages/stage32/proof/LANE-ADAPTERS.json stages/stage32/STAGE32-PROOF-PATH.md stages/stage32-ex1/RETAINED-AUDIT-PROJECTION.json
          git commit -m '[Stage32EX1][claim-sync] consume hostile-audit PASS 5147627146'
          git push origin HEAD:stage32ex1-terminal-05af-retained-consolidation
