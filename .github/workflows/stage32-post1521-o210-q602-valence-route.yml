name: Stage32 post1521 O210 Q602 conditional valence route

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: stage32-post1521-valence-route-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Certify conditional valence route
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1521_o210_q602_valence_route.py --check stages/stage32/residual-32-01-production/post1521-o210-q602-valence-route.json
      - name: Preserve audited post1520 boundary
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1518_o210_q602_18_diagonal_retained_geometry_test.py --check stages/stage32/residual-32-01-production/post1518-o210-q602-18-diagonal-retained-geometry-test.json
      - name: Diff check
        run: git diff --check
