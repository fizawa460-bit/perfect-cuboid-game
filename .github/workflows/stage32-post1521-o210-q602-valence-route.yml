name: Stage32 post1521 O210 Q602 conditional valence route

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-post1521-o210-q602-valence-route.yml'
      - 'stages/stage32/controller.json'
      - 'stages/stage32/residual-32-01-production/post1521-o210-q602-valence-route*'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1521_o210_q602_valence_route.py'
      - 'stages/stage32/residual-32-01-production/post1518-o210-q602-residue73-trace-spectrum.json'
      - 'stages/stage32/residual-32-01-production/post1500-hostile-audit-rosati-trace-repair-source-note.md'
      - 'stages/stage32/residual-32-01-production/post1490-o210-q4-bolza-correspondence-rosati-source-note.md'
      - 'docs/arsenal/index.json'
      - 'docs/arsenal/cards/formal/S34-W03.md'
      - 'docs/arsenal/cards/provisional/S32-PW03.md'
      - 'docs/arsenal/cards/formal/S28-W04.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-post1521-valence-route-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Certify conditional valence route
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1521_o210_q602_valence_route.py --check stages/stage32/residual-32-01-production/post1521-o210-q602-valence-route.json
      - name: Preserve audited post1520 boundary
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1518_o210_q602_18_diagonal_retained_geometry_test.py --check stages/stage32/residual-32-01-production/post1518-o210-q602-18-diagonal-retained-geometry-test.json
      - name: Diff check
        run: git diff --check
