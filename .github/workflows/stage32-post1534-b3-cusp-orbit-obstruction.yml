name: Stage32 post1534 b3 cusp-orbit obstruction

on:
  push:
    branches:
      - stage32-post1534-b3-cusp-orbit-obstruction
    paths:
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_post1534_b3_cusp_orbit_obstruction.py'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1536_b3_cusp_orbit_ambient_equivariance_negative.py'
      - 'stages/stage32/residual-32-01-production/post1536-b3-cusp-orbit-ambient-equivariance-negative*'
      - '.github/workflows/stage32-post1534-b3-cusp-orbit-obstruction.yml'
  pull_request:
    branches: [main]
    paths:
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_post1534_b3_cusp_orbit_obstruction.py'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1536_b3_cusp_orbit_ambient_equivariance_negative.py'
      - 'stages/stage32/residual-32-01-production/post1536-b3-cusp-orbit-ambient-equivariance-negative*'
      - '.github/workflows/stage32-post1534-b3-cusp-orbit-obstruction.yml'

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Re-run bounded b3 cusp-orbit diagnostic
        run: python3 stages/stage32/residual-32-01-production/diagnose_stage32_post1534_b3_cusp_orbit_obstruction.py
      - name: Certify bounded ambient b3 cusp-profile obstruction
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1536_b3_cusp_orbit_ambient_equivariance_negative.py --check stages/stage32/residual-32-01-production/post1536-b3-cusp-orbit-ambient-equivariance-negative.json
      - name: Preserve hostile-audited single-b3 predecessor replay
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1532_q602_single_b3_commutator.py --check stages/stage32/residual-32-01-production/post1532-q602-single-b3-commutator.json
      - name: Enforce no controller edit
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            git fetch origin main --quiet
            BASE="$(git merge-base origin/main HEAD)"
          fi
          if git diff --name-only "$BASE" HEAD | grep -qx 'stages/stage32/controller.json'; then
            echo 'controller.json must remain unchanged in this bounded-negative leaf'
            exit 1
          fi
      - name: Diff check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            git fetch origin main --quiet
            BASE="$(git merge-base origin/main HEAD)"
          fi
          git diff --check "$BASE" HEAD
