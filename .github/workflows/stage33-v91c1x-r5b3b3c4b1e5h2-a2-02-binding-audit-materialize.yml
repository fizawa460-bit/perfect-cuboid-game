name: Stage33 V91C1X C4B1E5H2 A2-02 binding audit materialize

on:
  push:
    branches:
      - stage33-v91c1x-r5b3b3c4b1e-1757-refinement-unit-preflight
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b1e5h2-a2-02-binding-audit-materialize.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e5h2_squareclass_gauge_to_a2_02_representative_binding_audit.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e5h1-stable-square-transition-rees-unit-attachment.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact C4B1E5H2 binding audit
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e5h2_squareclass_gauge_to_a2_02_representative_binding_audit.py --write
      - name: Enforce artifact-only bounded delta
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e5h2-squareclass-gauge-to-a2-02-representative-binding-audit.json'
          changed="$(git status --porcelain | sed 's/^...//')"
          test -n "$changed"
          test "$changed" = "$artifact"
          git diff --check
      - name: Commit generated certificate
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e5h2-squareclass-gauge-to-a2-02-representative-binding-audit.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$artifact"
          git diff --cached --quiet || git commit -m '[Stage33] materialize C4B1E5H2 binding-audit artifact'
          git push
