name: Stage32 scratch post1648AA Deraux Weierstrass orbit B9 nonselection

on:
  push:
    branches:
      - stage32-scratch-post1648aa-deraux-weierstrass-orbit
    paths:
      - '.github/workflows/stage32-scratch-post1648aa-deraux-weierstrass-orbit.yml'
      - 'stages/stage32/residual-32-01-production/post1648aa-deraux-weierstrass-orbit-b9-fixed-pair-nonselection.json'
      - 'stages/stage32/residual-32-01-production/post1648aa-deraux-weierstrass-orbit-b9-fixed-pair-nonselection-source-note.md'
