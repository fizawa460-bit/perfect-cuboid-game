name: Temporary Stage27-19-r5aq lifecycle sync
on:
  push:
    branches: ['agent/stage27-19-r5aq-weighted-kappa']
    paths: ['.github/workflows/tmp-stage27-19-r5aq-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-19-r5aq-weighted-kappa
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize lifecycle and active route
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('stages/stage27/27-controller.json')
          d=json.loads(p.read_text())
          def find_parent(x,key):
              if isinstance(x,dict):
                  if key in x: return x
                  for v in x.values():
                      z=find_parent(v,key)
                      if z is not None: return z
              elif isinstance(x,list):
                  for v in x:
                      z=find_parent(v,key)
                      if z is not None: return z
              return None
          box=find_parent(d,'Stage27-19-r5ao-r5ap')
          assert box is not None
          old=box['Stage27-19-r5ao-r5ap']
          old.update({
            'status':'AUDITED_PASS_MERGED','audit_status':'PASS','advance_allowed':True,'merge_allowed':True,
            'audit_record':'stages/stage27/27-19-r5ao/audit-final.md','pr':1066,
            'merge_commit':'f95b259ffcc0c7ab75e9eb8ecaae2c27ceaa6b3a','next_derived_route':'27-19-r5aq'})
          box['Stage27-19-r5aq-r5as']={
            'status':'BATCH_SUBMITTED_PENDING_FRESH_AUDIT','trigger_checkpoint':40,
            'route_kind':'UPPER_REENTRY_PARALLEL','source_stage':'Stage19','parent_route':'Stage27-19-r5ao-r5ap',
            'batch_routes':['27-19-r5aq','27-19-r5ar','27-19-r5as'],
            'purpose':'physical-weighted fixed-kappa sieve, modulus-entropy barrier, and double-Pell compression',
            'physical_weighted_fixed_kappa_sieve_proved':True,'modulus_entropy_barrier_proved':True,
            'double_pell_compression_proved':True,'seven_outer_cell_fixed_power_count_proved':False,
            'strict_sub_sqrt_upper_proved':False,'new_mu_lt_half_proved':False,'true_N2_exponent_identified':False,
            'audit_status':'PENDING','advance_to_checkpoint50':False,'advance_allowed':False,'merge_allowed':False,
            'next_derived_route':'27-19-r5at','next_target':'SEVEN_OUTER_CELL_SUPPORT_COUNT_OR_SELF_GENERATED_KAPPA_AVERAGE'}
          d['status']='OPEN_CHECKPOINT40_WITH_STAGE19_UPPER_REENTRY_R5AQ_R5AS_PENDING_FRESH_AUDIT'
          d['checkpoint_status']['40']='UPPER_ATTACK_AUDITED_PASS_MERGED_WITH_R5AO_R5AP_AUDITED_PASS_MERGED_AND_R5AQ_R5AS_PENDING_AUDIT'
          d['state'].update({'CURRENT_CHECKPOINT':40,'MAIN_STATUS':'UPPER_REENTRY_STAGE27_19_R5AQ_R5AS_SUBMITTED_PENDING_FRESH_AUDIT','AUDIT_STATUS':'PENDING','ADVANCE_ALLOWED':False,'NEXT_CHECKPOINT':40,'MERGE_ALLOWED':False})
          d['next_expected_command']='Stage27-19-r5-audit'
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          q=Path('docs/00_CURRENT_RESEARCH_STATUS.md')
          s=q.read_text()
          s=s.replace('CURRENT_STAGE=Stage27-19-r5ao-r5ap-BATCH-SUBMITTED-PENDING-FRESH-AUDIT','CURRENT_STAGE=Stage27-19-r5aq-r5as-BATCH-SUBMITTED-PENDING-FRESH-AUDIT')
          s=s.replace('STAGE27_STATUS=OPEN_CHECKPOINT40_WITH_STAGE19_UPPER_REENTRY_R5AO_R5AP_PENDING_FRESH_AUDIT','STAGE27_STATUS=OPEN_CHECKPOINT40_WITH_STAGE19_UPPER_REENTRY_R5AQ_R5AS_PENDING_FRESH_AUDIT')
          s=s.replace('STAGE27_19_R5AO_R5AP_STATUS=BATCH_SUBMITTED_PENDING_FRESH_AUDIT','STAGE27_19_R5AO_R5AP_STATUS=AUDITED_PASS_MERGED_PR1066\nSTAGE27_19_R5AQ_R5AS_STATUS=BATCH_SUBMITTED_PENDING_FRESH_AUDIT')
          s=s.replace('STAGE27_ACTIVE_UPPER_REENTRY=27-19-r5ao-r5ap','STAGE27_ACTIVE_UPPER_REENTRY=27-19-r5aq-r5as')
          q.write_text(s)
          PY
      - name: Commit synchronization and self-clean
        run: |
          rm .github/workflows/tmp-stage27-19-r5aq-sync.yml
          git config user.name 'fizawa460-bit'
          git config user.email 'fizawa460@gmail.com'
          git add stages/stage27/27-controller.json docs/00_CURRENT_RESEARCH_STATUS.md .github/workflows/tmp-stage27-19-r5aq-sync.yml
          git commit -m 'Stage27-19-r5aq-r5as: synchronize lifecycle and controller'
          git push origin HEAD:agent/stage27-19-r5aq-weighted-kappa
