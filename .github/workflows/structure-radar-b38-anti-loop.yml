name: StructureRadar b38 anti-loop

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'structure-radar-anti-loop-38'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append anti-loop checkpoint and self-clean
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/structure-radar/progress.json')
          data=json.loads(p.read_text())
          bid='SR-BATCH-ANTI-LOOP-38-R01'
          rows=data['audit_batches']
          if not any(x.get('batch_id')==bid for x in rows):
              rows.append({
                  'batch_id': bid,
                  'phase': 'EXTERNAL_GATE_CLOSURE',
                  'status': 'SUBMITTED_FOR_AUDIT',
                  'mode': 'ONE_PR_FOUR_LANE_CHECKPOINT',
                  'anti_loop_policy': 'docs/structure-radar/anti-loop-policy.json',
                  'structure_ids': ['SR-STR-169','SR-STR-170','SR-STR-171','SR-STR-168'],
                  'parallel_lane_count': 4,
                  'single_pr_for_all_lanes': True,
                  'gates_checkpointed': 4,
                  'gates_closed': 0,
                  'external_gate_count_before': 13,
                  'external_gate_count_after': 13,
                  'sr_str_169_anti_loop_state': 'WORK_ONLY',
                  'sr_str_169_frozen_missing_lemma': 'MAINWallPrimitiveInverseFrequencySameMeasureLargeSieveQuadraticFormDeficit',
                  'sr_str_170_anti_loop_state': 'THEOREM_GATE_PAUSED',
                  'sr_str_170_frozen_missing_lemma': 'PhysicalSquareDivisorDyadicThresholdEventSameMeasureDeficit',
                  'sr_str_171_anti_loop_state': 'THEOREM_GATE_PAUSED',
                  'sr_str_171_frozen_missing_lemma': 'PhysicalLocalizedDivisorDyadicThresholdEventSameMeasureDeficit',
                  'sr_str_168_anti_loop_state': 'THEOREM_GATE_PAUSED',
                  'sr_str_168_frozen_missing_lemma': 'SameMeasurePhysicalGaussianMobiusSquareFunctionCorrelationDeficit',
                  'normal_chatgpt_stopped_count': 1,
                  'theorem_gate_paused_count': 3,
                  'next_rotation_structure_ids': ['SR-STR-167','SR-STR-174','SR-STR-019','SR-STR-024'],
                  'overall_pause_recommended': False,
                  'work_delegation_recommended': True,
                  'work_target': 'SR-STR-169 / MAINWallPrimitiveInverseFrequencySameMeasureLargeSieveQuadraticFormDeficit',
                  'audit_required': True
              })
          p.write_text(json.dumps(data, indent=2)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          rm .github/workflows/structure-radar-b38-anti-loop.yml
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add docs/structure-radar/progress.json .github/workflows/structure-radar-b38-anti-loop.yml
          git commit -m 'StructureRadar: materialize anti-loop checkpoint 38' || true
          git push origin HEAD:${{ github.head_ref }}
