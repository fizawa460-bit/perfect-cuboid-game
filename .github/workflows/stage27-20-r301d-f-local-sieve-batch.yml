name: Stage27-20-r301d-f local sieve batch
on:
  push:
    branches: [agent/stage27-20-r301d-f-local-sieve-batch]
  pull_request:
    paths:
      - 'stages/stage27/27-20-r301d/**'
      - 'stages/stage27/27-20-r301e/**'
      - 'stages/stage27/27-20-r301f/**'
      - 'stages/stage27/27-20-r301d-f/**'
      - 'stages/stage27/27-controller.json'
      - '.github/workflows/stage27-20-r301d-f-local-sieve-batch.yml'
jobs:
  verify-stage27-20-r301d-f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Stage27-20-r301d-f local sieve batch
        run: python stages/stage27/27-20-r301d-f/verify_27_20_r301d_f.py
      - name: Validate controller JSON
        run: python -m json.tool stages/stage27/27-controller.json >/dev/null
      - name: Diff hygiene
        run: git diff --check
