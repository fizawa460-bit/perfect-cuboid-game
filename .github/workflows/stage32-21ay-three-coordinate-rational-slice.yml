name: Stage32-21ay exact three-coordinate rational slice census

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stage32-21ay-three-coordinate-rational-slice.yml'
      - 'stages/stage32/32-21/32-21ax-bound-frontier.json'
      - 'stages/stage32/residual-32-01-production/certify_stage32_21ay_three_coordinate_rational_slice.py'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_21ak_affine_2adic_membership.py'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_21aj_2adic_pairing_saturation.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'

permissions:
  contents: read

concurrency:
  group: stage32-21ay-three-coordinate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Exhaust exact three-coordinate rational slices
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python certify_stage32_21ay_three_coordinate_rational_slice.py \
            --seed "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21ax-bound-frontier.json" \
            --retained "$GITHUB_WORKSPACE/stages/stage33/33-07/picard_base_rows_retained.py" \
            --marking "$GITHUB_WORKSPACE/stages/stage33/33-07/stage32_picard_marking_retained.py" \
            --wall-seconds 300 \
            --per-check-timeout-ms 1000 \
            --output "$GITHUB_WORKSPACE/stage32-21ay-three-coordinate-rational-slice.json"
      - name: Upload compact exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-21ay-three-coordinate-rational-slice
          path: stage32-21ay-three-coordinate-rational-slice.json
          retention-days: 3
          compression-level: 9
