name: Stage35-EX Goal4AK explicit F_B assembly

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Goal4AK F_B assembly
        run: |
          set -euo pipefail
          python -u -B stages/stage35-ex/verify_stage35_ex_35_goal4ak_explicit_fb.py
