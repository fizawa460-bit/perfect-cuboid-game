name: Stage15-5 survival thinning

on:
  pull_request:
    paths:
      - 'stages/stage15/15-5/**'
      - 'stages/stage15/evidence/stage15_5_survival_theorem.json'
      - 'stages/stage15/replay/verify_stage15_5.py'
      - '.github/workflows/stage15-5-survival-thinning.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-5 survival/thinning theorem bridge
        run: python stages/stage15/replay/verify_stage15_5.py
