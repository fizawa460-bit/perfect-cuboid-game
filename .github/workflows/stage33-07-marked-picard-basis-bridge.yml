name: Stage33-07 marked Picard basis bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage33/33-07/indlist-to-magma-picard-basis.json'
      - 'stages/stage33/33-07/certify_marked_picard_basis_bridge.py'
      - 'stages/stage33/33-07/certify_actual_galois_at2_actions.py'
      - 'stages/stage33/33-07/certify_actual_coordinate_swap_at2_actions.py'
      - 'stages/stage33/33-07/certify_two_coordinate_swap_picard_rows.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/picard_coordinate_sign_rows_retained.py'
      - '.github/workflows/stage33-07-marked-picard-basis-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: stages/stage33/33-07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Require retained source-locked Magma producer evidence
        run: |
          if [ ! -f indlist-to-magma-picard-basis.json ]; then
            echo 'BLOCKED: retained indlist-to-magma-picard-basis.json is absent.' >&2
            echo 'Run the manual Stage33-07 marked Picard basis bridge producer, audit its source locks, then retain the compact bridge before this PR verifier can pass.' >&2
            exit 1
          fi
      - name: Certify Gram and nine named-action transport and actual swaps locally
        run: python certify_marked_picard_basis_bridge.py
      - name: Enforce exact marked bridge and firewalls
        run: |
          python - <<'PY'
          import hashlib,json
          p='marked-picard-basis-bridge-certified.json'
          x=json.load(open(p)); h=x.pop('canonical_sha256')
          assert h==hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert x['schema']=='STAGE33_07_MARKED_PICARD_BASIS_BRIDGE_CERTIFIED_V1'
          b=x['basis_bridge']
          assert abs(b['determinant'])==1 and b['full_gram_transport_exact']
          assert b['named_action_intertwining_verified']==['cc','ct','a1','a2','a3','b1','b2','b3','c']
          assert len(b['matrix_64x64'])==64 and len(b['inverse_64x64'])==64
          a=x['actual_coordinate_swaps_in_historical_magma_picard_basis']
          assert len(a['swap12_action_64x64'])==64 and len(a['swap13_action_64x64'])==64
          assert a['both_integral_unimodular_gram_isometries'] and a['both_involutions']
          assert a['s3_braid_exact'] and a['commute_with_cc_ct'] and a['seven_sign_conjugations_exact']
          e=x['exact_consequence']
          assert e['historical_retained_picard_basis_now_marked_by_actual_140_class_geometry']
          assert e['actual_integral_swaps_now_available_in_historical_q256_picard_basis']
          assert e['common_smith_transport_can_be_replayed_without_basis_guess']
          assert e['connecting_matrix_columns_explicitly_materialized']==0
          assert not e['middle_gersten_module_action_materialized'] and not e['absolute_delta_loc_computed'] and not e['arithmetic_hs_closed']
          assert not x['execution']['generic_lattice_isometry_search_used'] and x['execution']['bridge_obtained_from_pinned_upstream_qPic_marking']
          assert not x['execution']['smith_form_used']
          assert x['stage33_progress']=='6/11' and not x['stage33_08_released'] and not x['theorem_credit'] and not x['endpoint_credit']
          print('STAGE33_07_MARKED_PICARD_BASIS_BRIDGE=PASS_EXACT_LOCAL_REVERIFY')
          print('BRIDGE_DET='+str(b['determinant']))
          print('CERTIFICATE_SHA256='+h)
          print('NEXT='+x['next_exact_leaf'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-marked-picard-basis-bridge-local-reverify
          retention-days: 7
          if-no-files-found: error
          path: |
            stages/stage33/33-07/indlist-to-magma-picard-basis.json
            stages/stage33/33-07/marked-picard-basis-bridge-certified.json
