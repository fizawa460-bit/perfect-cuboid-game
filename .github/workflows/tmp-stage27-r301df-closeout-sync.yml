name: TEMP Stage27 r301d-f closeout sync

on:
  push:
    branches:
      - agent/stage27-20-r301d-f-closeout
    paths:
      - '.github/workflows/tmp-stage27-r301df-closeout-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-20-r301d-f-closeout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize audited PASS merged lifecycle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('stages/stage27/27-controller.json')
          ctl = json.loads(path.read_text())
          dr = ctl['derived_routes']
          audit_record = 'stages/stage27/27-20-r301d-f/audit.md'
          merge_commit = '11bab78346d6535ba17fb268b42c89defff9a7eb'

          for key in ['Stage27-20-r301d','Stage27-20-r301e','Stage27-20-r301f']:
              route = dr[key]
              route['status'] = 'AUDITED_PASS_MERGED'
              route['audit_status'] = 'PASS'
              route['audit_record'] = audit_record
              route['pr'] = 1043
              route['merge_commit'] = merge_commit
              route['merge_allowed'] = True
              route['advance_allowed'] = True
              route['advance_to_checkpoint50'] = False
              route['strict_sub_sqrt_upper_proved'] = False
              route['new_mu_lt_half_proved'] = False
              route['true_N2_exponent_identified'] = False

          dr['Stage27-20-r301e']['source_justification_repaired'] = True
          dr['Stage27-20-r301e']['source_justification_audited_pass'] = True
          dr['Stage27-20-r301e']['fresh_reaudit_required'] = False

          assert ctl['state']['CURRENT_CHECKPOINT'] == 40
          assert ctl['state']['NEXT_CHECKPOINT'] == 40
          path.write_text(json.dumps(ctl, indent=2) + '\n')
          PY
      - name: Verify closeout
        run: python stages/stage27/27-20-r301d-f/verify_27_20_r301d_f.py
      - name: Commit controller sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage27/27-controller.json
          if git diff --cached --quiet; then
            echo 'No controller changes required'
          else
            git commit -m 'Stage27-20-r301d-f materialize audit PASS on controller'
            git push origin HEAD:agent/stage27-20-r301d-f-closeout
          fi
