name: Stage33-07 ambient carrier boundary offboundary split

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/certify_ambient_linear_carrier_boundary_offboundary_split.py'
      - 'stages/stage33/33-07/inventory_mixed_order_ambient_linear_divisor_support.py'
      - 'stages/stage33/33-07/materialize_mixed_order_side_ambient_function_lifts.py'
      - 'stages/stage33/33-07/materialize_mixed_order_exceptional_ambient_tangent_function_lifts.py'
      - 'stages/stage33/33-07/certify_order2_quotient_raw_order4_bockstein.py'
      - 'stages/stage33/33-07/order2-first-residue-function-liftability.json'
      - 'stages/stage33/33-07/exceptional-p1-tangent-coordinates.json'
      - 'stages/stage33/33-07/br0b-boundary-raw-residue-map.json'
      - 'stages/stage33/33-07/br0g-finite-ramified-residue-presentation.json'
      - 'stages/stage33/33-07/two-primary-residue-invariant-basis.json'
      - '.github/workflows/stage33-07-ambient-carrier-boundary-offboundary-split.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: gate
        env: {EVENT: '${{ github.event_name }}', ACTION: '${{ github.event.action }}', BEFORE: '${{ github.event.before }}', HEAD: '${{ github.event.pull_request.head.sha }}', WORKFLOW_REF: '${{ github.workflow_ref }}'}
        run: python .github/scripts/stage33_commit_range_gate.py
  certify:
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact integer algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Reproduce mixed-order boundary ambient lifts
        working-directory: stages/stage33/33-07
        run: |
          python certify_order2_quotient_raw_order4_bockstein.py
          python materialize_mixed_order_side_ambient_function_lifts.py
          python materialize_mixed_order_exceptional_ambient_tangent_function_lifts.py
          python inventory_mixed_order_ambient_linear_divisor_support.py
      - name: Split boundary-only versus off-boundary carriers
        working-directory: stages/stage33/33-07
        run: python certify_ambient_linear_carrier_boundary_offboundary_split.py
      - name: Validate exact carrier split firewall
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import hashlib,json
          p='ambient-linear-carrier-boundary-offboundary-split.json'
          x=json.load(open(p)); h=x.pop('canonical_sha256')
          assert h==hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          s=x['carrier_split']
          assert s['total_distinct_projective_ambient_linear_forms']==33
          assert s['boundary_only_hyperplanes']==18
          assert s['off_boundary_candidate_hyperplanes']==15
          assert s['boundary_only_occurrences']==530
          assert s['off_boundary_candidate_occurrences']==190
          assert s['off_boundary_split_linear_hyperplanes']==3
          assert s['off_boundary_irreducible_quartic_norm_hyperplanes']==12
          assert s['distinct_noncoordinate_base_norm_factors']==12
          assert s['noncoordinate_base_norm_factor_degree_histogram']=={'1':6,'4':6}
          assert all(x['exact_checks'].values())
          prog=x['constructive_progress']
          assert prog['boundary_vs_offboundary_carrier_split_closed']
          assert prog['off_boundary_hyperplane_sections_remaining_to_decompose']==15
          assert prog['global_geometric_Gersten_lifts_materialized_count']==0
          assert prog['off_boundary_codimension1_residue_certificates_materialized_count']==0
          assert not prog['project_14x26_L_squareclass_tensor_materialized']
          assert not prog['absolute_delta_loc_computed'] and not prog['arithmetic_HS_closed']
          assert x['stage33_progress']=='6/11' and not x['stage33_08_released']
          print('STAGE33_07_AMBIENT_CARRIER_BOUNDARY_OFFBOUNDARY_SPLIT=PASS')
          print('CERTIFICATE_SHA256='+h)
          print('HYPERPLANE_SPLIT=18_BOUNDARY_ONLY+15_OFFBOUNDARY')
          print('OCCURRENCE_SPLIT=530_BOUNDARY_ONLY+190_OFFBOUNDARY')
          print('NEXT='+x['next_exact_leaf'])
          PY
      - name: Upload carrier split certificate
        uses: actions/upload-artifact@v4
        with:
          name: stage33-07-ambient-carrier-boundary-offboundary-split
          retention-days: 3
          path: stages/stage33/33-07/ambient-linear-carrier-boundary-offboundary-split.json
