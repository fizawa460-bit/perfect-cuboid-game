name: Stage32 post1648AS residual inertia tangent preflight

on:
  push:
    branches:
      - stage32-scratch-post1648as-residual-inertia-tangent-preflight

permissions:
  contents: read

jobs:
  verify-as-residual-inertia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact scratch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install exact verifier dependency
        run: python3 -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run AS final verifier
        run: python3 -B stages/stage32/residual-32-01-production/verify_stage32_post1648as_residual_inertia_tangent_preflight.py
      - name: Diff hygiene
        run: test -z "$(git status --porcelain)"
