name: Stage32 MAIN GRF04 x HPADJ22 FULL178

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-main-grf04-hpadj22-full178.yml'
      - 'stages/stage32/management/grf04-hpadj22-joint/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-main-grf04-hpadj22-full178-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    name: FULL178 authorize
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      carry_run_id: ${{ steps.gate.outputs.carry_run_id }}
      carry_topology: ${{ steps.gate.outputs.carry_topology }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          key="stages/stage32/management/grf04-hpadj22-joint/runkeys/V46-GRF04-HPADJ22-FULL178.json"
          before='${{ github.event.before }}'
          head='${{ github.event.pull_request.head.sha }}'
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "carry_run_id=0" >> "$GITHUB_OUTPUT"
          echo "carry_topology=NONE" >> "$GITHUB_OUTPUT"
          test -n "$before"
          git fetch --no-tags --depth=1 origin "$before" || true
          git cat-file -e "$before^{commit}"
          git diff --name-only "$before" "$head" | grep -Fxq "$key" || exit 0
          git show "$before:$key" > "$RUNNER_TEMP/old-runkey.json" || true
          python - "$RUNNER_TEMP/old-runkey.json" "$key" <<'PY'
          import json,sys,pathlib
          oldp=pathlib.Path(sys.argv[1])
          p=json.load(open(sys.argv[2]))
          assert p["schema"]=="STAGE32_MAIN_V46_GRF04_HPADJ22_FULL178_RUNKEY_V2_WINDOWED"
          assert p["generation"]>=2 and p["armed"] is True
          if oldp.exists() and oldp.stat().st_size:
              old=json.load(open(oldp))
              if old.get("schema")=="STAGE32_MAIN_V46_GRF04_HPADJ22_FULL178_RUNKEY_V1":
                  assert old["generation"]==1 and old["armed"] is True
                  assert p["generation"]==2
              else:
                  assert old["schema"]==p["schema"]
                  assert p["generation"]>old["generation"]
          else:
              raise AssertionError("windowed generation requires predecessor runkey")
          s=p["source_locks"]
          assert s["row_compute_worker_blob_sha1"]=="c9fbf71242581f096718ebf0dbc9ac88878c91f1"
          assert s["window_wrapper_blob_sha1"]=="d62c7d05097c6dba4a6275658db75f75a2e091d4"
          assert s["window_aggregator_blob_sha1"]=="a2a8eef9e8741d9085a2c6d4e199ca3d980d0d64"
          assert s["highd_helper_blob_sha1"]=="99eef03657b07eb5cf86be8d880050fd8aa2d13b"
          assert s["highd_generation8_retained_blob_sha1"]=="d154b3cff576c2d5a2853be88e77cf6d195e7490"
          assert s["hpadj22_source_head"]=="4bd68dedffa9ca49b0fecc41a89e5e2bc39585a2"
          assert p["benchmark_gate"]["strict"] is True
          assert p["benchmark_gate"]["aggregate_canonical_sha256"]=="7f1acd8a9033ce0c45674f96a816357e7784630cf4e6f77828102abc5a53f3dc"
          assert p["partition"]["parents"]==96
          assert p["partition"]["row_windows"]==[[0,59],[60,119],[120,177]]
          assert p["partition"]["computed_row_chunk_certificates"]==2967
          assert p["resource_preflight"]["planned_effective_heavy_concurrency"]==3 <= p["resource_preflight"]["repo_stage_heavy_cap"]
          assert p["resource_preflight"]["artifact_count_upper_bound"]==97 < 100
          assert p["resource_preflight"]["projected_peak_artifact_mb_upper_bound"]<=227
          assert p["credit"]["main"] is False and p["credit"]["merge"] is False
          carry=p["carry"]
          assert carry["predecessor_run_id"]>0
          assert carry["predecessor_topology"] in ("V1_FULL_PARENT","V2_ROW_WINDOW")
          print("carry_run_id="+str(int(carry["predecessor_run_id"])))
          print("carry_topology="+carry["predecessor_topology"])
          PY
          test "$(git hash-object stages/stage32/management/grf04-hpadj22-joint/run_grf04_hpadj22_full178_parent.py)" = "c9fbf71242581f096718ebf0dbc9ac88878c91f1"
          test "$(git hash-object stages/stage32/management/grf04-hpadj22-joint/run_grf04_hpadj22_full178_parent_window.py)" = "d62c7d05097c6dba4a6275658db75f75a2e091d4"
          test "$(git hash-object stages/stage32/management/grf04-hpadj22-joint/aggregate_grf04_hpadj22_full178_windowed.py)" = "a2a8eef9e8741d9085a2c6d4e199ca3d980d0d64"
          test "$(git hash-object stages/stage32/management/grf04-hpadj22-joint/benchmark_grf04_hpadj22_highd_bchunk.py)" = "99eef03657b07eb5cf86be8d880050fd8aa2d13b"
          test "$(git hash-object stages/stage32/management/grf04-hpadj22-joint/GRF04-HPADJ22-V46-HIGHD-G8-RETAINED.json)" = "d154b3cff576c2d5a2853be88e77cf6d195e7490"
          carry="$(python -c 'import json;print(int(json.load(open("'"$key"'"))["carry"]["predecessor_run_id"]))')"
          topology="$(python -c 'import json;print(json.load(open("'"$key"'"))["carry"]["predecessor_topology"])')"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "carry_run_id=$carry" >> "$GITHUB_OUTPUT"
          echo "carry_topology=$topology" >> "$GITHUB_OUTPUT"

  parents:
    name: FULL178 checkpoint b${{ matrix.band }} c${{ matrix.chunk }} w${{ matrix.window }}
    needs: authorize
    if: needs.authorize.outputs.run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        band: [0,1,2,3,4,5,6,7]
        chunk: [0,1,2,3]
        window: [0,1,2]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: 4bd68dedffa9ca49b0fecc41a89e5e2bc39585a2
          path: .stage32-ex5-hpadj22-full178
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'
      - name: Fetch V1 predecessor carry artifact
        if: needs.authorize.outputs.carry_topology == 'V1_FULL_PARENT'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: stage32-main-v46-grf04-hpadj22-full178-parent-${{ matrix.band }}-${{ matrix.chunk }}
          path: carry-parent
          run-id: ${{ needs.authorize.outputs.carry_run_id }}
          github-token: ${{ github.token }}
      - name: Fetch V2 predecessor carry artifact
        if: needs.authorize.outputs.carry_topology == 'V2_ROW_WINDOW'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: stage32-main-v46-grf04-hpadj22-full178-window-${{ matrix.band }}-${{ matrix.chunk }}-${{ matrix.window }}
          path: carry-parent
          run-id: ${{ needs.authorize.outputs.carry_run_id }}
          github-token: ${{ github.token }}
      - id: compute
        name: Run resumable exact row-window with soft wall
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/full178-parent"
          carry=()
          if [ -d carry-parent ]; then carry=(--carry-root carry-parent); fi
          set +e
          timeout --signal=TERM --kill-after=60s 78m             python stages/stage32/management/grf04-hpadj22-joint/run_grf04_hpadj22_full178_parent_window.py               --source-root .stage32-ex5-hpadj22-full178               --band-position ${{ matrix.band }}               --chunk-position ${{ matrix.chunk }}               --row-window-position ${{ matrix.window }}               --output-dir "$RUNNER_TEMP/full178-parent"               --expected-wrapper-blob d62c7d05097c6dba4a6275658db75f75a2e091d4               "${carry[@]}"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "checkpoint_status=COMPLETE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo "checkpoint_status=SOFT_TIMEOUT_PARTIAL" >> "$GITHUB_OUTPUT"
            echo "soft timeout: completed row certificates will be uploaded as valid zero-credit carry"
            exit 0
          fi
          echo "unexpected compute failure code=$code"
          exit "$code"
      - name: Upload parent-window checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage32-main-v46-grf04-hpadj22-full178-window-${{ matrix.band }}-${{ matrix.chunk }}-${{ matrix.window }}
          path: ${{ runner.temp }}/full178-parent
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

  summarize:
    name: FULL178 generation recovery summary
    needs: [authorize, parents]
    if: always() && needs.authorize.result == 'success' && needs.authorize.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      complete: ${{ steps.scan.outputs.complete }}
      complete_parents: ${{ steps.scan.outputs.complete_parents }}
      row_certificates: ${{ steps.scan.outputs.row_certificates }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-main-v46-grf04-hpadj22-full178-window-*
          path: full178-parents
      - id: scan
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("full178-parents")
          artifact_dirs=[p for p in root.iterdir() if p.is_dir()]
          if len(artifact_dirs)!=96:
              raise SystemExit(f"FAIL: expected 96 parent-window artifacts, found {len(artifact_dirs)}")
          complete=list(root.rglob("PARENT-WINDOW-COMPLETE.json"))
          rows=list(root.rglob("row-*.json"))
          out={
            "schema":"STAGE32_MAIN_V46_GRF04_HPADJ22_FULL178_RECOVERY_SNAPSHOT_V2",
            "stage":32,
            "status":"GENERATION_COMPLETE" if len(complete)==96 else "CHECKPOINTED_INCOMPLETE_ZERO_CREDIT",
            "coverage":{"expected_parent_windows":96,"discovered_parent_artifacts":len(artifact_dirs),
                        "complete_parent_windows":len(complete),"incomplete_parent_windows":96-len(complete),
                        "persisted_row_certificates":len(rows)},
            "firewalls":{"main_pruning_credit":False,"full178_complete":False,
                         "theorem_credit":False,"effectivity_credit":False,
                         "receiver_credit":False,"route_credit":False,
                         "endpoint_credit":False,"merge_authorized":False}
          }
          canon=hashlib.sha256(json.dumps(out,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          out["canonical_sha256_without_this_field"]=canon
          pathlib.Path("RECOVERY-SNAPSHOT.json").write_text(json.dumps(out,sort_keys=True,separators=(",",":"))+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"complete={'true' if len(complete)==96 else 'false'}\n")
              f.write(f"complete_parents={len(complete)}\n")
              f.write(f"row_certificates={len(rows)}\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-main-v46-grf04-hpadj22-full178-recovery-snapshot
          path: RECOVERY-SNAPSHOT.json
          retention-days: 2
          compression-level: 9

  aggregate:
    name: FULL178 exact aggregate
    needs: summarize
    if: needs.summarize.outputs.complete == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-main-v46-grf04-hpadj22-full178-window-*
          path: full178-parents
      - name: Aggregate exact 96-window union
        run: |
          python stages/stage32/management/grf04-hpadj22-joint/aggregate_grf04_hpadj22_full178_windowed.py             --parents-root full178-parents             --output "$RUNNER_TEMP/grf04-hpadj22-full178.json"
      - name: Validate aggregate firewalls
        run: |
          python - "$RUNNER_TEMP/grf04-hpadj22-full178.json" <<'PY'
          import hashlib,json,sys
          p=json.load(open(sys.argv[1]))
          stored=p.pop("canonical_sha256_without_this_field")
          calc=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest()
          assert stored==calc
          assert p["schema"]=="STAGE32_MAIN_V46_GRF04_HPADJ22_FULL178_AGGREGATE_V2_WINDOWED"
          assert p["coverage"]["parents"]==96 and p["coverage"]["row_windows"]==3
          assert p["coverage"]["gaps"]==0 and p["coverage"]["overlaps"]==0
          assert p["totals"]["hpadj22_exact_survivors"]=="138652739800650593494"
          assert int(p["totals"]["joint_exact_survivors"])<=int(p["totals"]["hpadj22_exact_survivors"])
          assert p["firewalls"]["main_pruning_credit"] is False
          assert p["firewalls"]["hostile_audit_required_before_promotion"] is True
          assert p["firewalls"]["merge_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-main-v46-grf04-hpadj22-full178-aggregate
          path: ${{ runner.temp }}/grf04-hpadj22-full178.json
          retention-days: 3
          compression-level: 9
