name: "[Stage32][32-01-178][N352] degree-sum scalar Hurwitz contraction"

# Trigger lifecycle: RETIRED
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      contradicted: ${{ steps.ledger.outputs.contradicted }}
      canonical: ${{ steps.ledger.outputs.canonical }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.x"
      - name: Install exact verifier dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.3.0'
      - name: Replay N352 exact scalar contraction
        run: |
          python stages/stage32/32-01-178/nodes/N352/verify_n352_degree_sum_scalar_hurwitz.py \
            --output /tmp/n352-result.json
      - name: Expose compact ledger
        id: ledger
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('/tmp/n352-result.json'))
          print(f"contradicted={d['aggregate']['contradicted_row_count']}")
          print(f"canonical={d['canonical_sha256_without_this_field']}")
          PY
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

  report:
    needs: verify
    runs-on: ubuntu-latest
    name: "N352 scalar contradictions=${{ needs.verify.outputs.contradicted }}/4"
    steps:
      - name: Report N352 compact ledger
        run: |
          echo "canonical=${{ needs.verify.outputs.canonical }}"
          echo "N352 uses no SMT feasibility search"
          echo "N351 geometric source audit remains required"
          echo "MAIN/FULL178/N350/theorem/receiver/endpoint credit=false"
