name: Stage32EX5-B runtime point export

on:
  push:
    branches:
      - stage32ex5-b
    paths:
      - 'stages/stage32-ex5/parallel/lane-b/export_stoll_runtime_points.m'
      - 'stages/stage32-ex5/parallel/lane-b/run_magma_runtime_points.py'
      - 'stages/stage32-ex5/parallel/lane-b/verify_stage32ex5_b_result.py'
      - 'stages/stage32-ex5/parallel/results/stage32ex5-b-*.json'
      - '.github/workflows/stage32ex5-b-runtime-points.yml'

permissions:
  contents: read

jobs:
  runtime-point-export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact retained-matrix dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Export exact Stoll runtime singular points
        run: python stages/stage32-ex5/parallel/lane-b/run_magma_runtime_points.py
      - name: Verify retained B-lane handoff
        run: python stages/stage32-ex5/parallel/lane-b/verify_stage32ex5_b_result.py
