name: Repository workflow inventory refresh (one shot)

on:
  push:
    branches:
      - repo-agents-active-workflow-trigger-policy

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repo-agents-active-workflow-trigger-policy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate inventory after removing this one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/repo-workflow-inventory-refresh-once.yml
          python docs/research-os/policies/verify_repo_workflow_trigger_inventory.py --write-inventory
          python docs/research-os/policies/verify_repo_workflow_trigger_inventory.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/repo-workflow-inventory-refresh-once.yml docs/research-os/policies/repo-workflow-trigger-inventory-20260911.json
          git commit -m '[workflow] refresh repository lifecycle inventory'
          git push origin HEAD:repo-agents-active-workflow-trigger-policy
