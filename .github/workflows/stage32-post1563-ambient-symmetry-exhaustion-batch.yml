name: Stage32 post1563 ambient symmetry exhaustion batch

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-post1563-ambient-symmetry-exhaustion-batch.yml'
      - 'stages/stage32/controller.json'
      - 'stages/stage32/residual-32-01-production/post1563-ambient-symmetry-exhaustion-batch*'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1563_ambient_symmetry_exhaustion_batch.py'
      - 'stages/stage32/residual-32-01-production/post1561-b3-picard-action-adapter-gap.json'
      - 'stages/stage32/residual-32-01-production/post1555-b3-full-g-box-quotient-normalizer.json'
      - 'stages/stage32/residual-32-01-production/post1532-full-stoll-h-orbit-symmetry-negative.json'
      - 'stages/stage32/residual-32-01-production/post1532-q602-single-b3-commutator.json'
      - 'stages/stage32/residual-32-01-production/post1490-o210-q4-equivariant-beauville-deck-cross-exclusion.json'
      - 'stages/stage32/residual-32-01-production/post1484-v6-modular-factor-bidegree-source-note.md'
      - 'docs/arsenal/index.json'
      - 'docs/arsenal/cards/formal/S30-W01.md'
      - 'docs/arsenal/cards/formal/S30-W02.md'
      - 'docs/arsenal/cards/provisional/S32-PW05.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-post1563-ambient-symmetry-batch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Resolve freshness authority
        run: |
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr_base="${{ github.event.pull_request.base.sha }}"
            test "$pr_base" = "$current_main"
            expected_base="$pr_base"
          else
            expected_base="$current_main"
          fi
          echo "STAGE32_EXPECTED_BASE_SHA=$expected_base" >> "$GITHUB_ENV"
      - name: Certify ambient symmetry exhaustion batch
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1563_ambient_symmetry_exhaustion_batch.py
      - name: Enforce no controller edit
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -qx 'stages/stage32/controller.json'; then
            echo 'controller.json must remain unchanged in bounded post1563 symmetry batch'
            exit 1
          fi
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
