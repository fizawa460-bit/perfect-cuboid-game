name: Stage32 32-01-178 HPADJ21 g1d192 b36-47 cell replay

# lifecycle: ACTIVE_AUTO
# One bounded current cell only; retire immediately after exact-head replay.
on:
  push:
    branches:
      - stage32-01-178-post-td02-fibration-nef
    paths:
      - 'stages/stage32/32-01-178/fibration-nef/verify_hpadj21_g1d192_b36_47_cell_replay.py'
      - '.github/workflows/stage32-01-178-hpadj21-g1d192-b36-47-cell-replay.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-01-178-hpadj21-g1d192-b36-47-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact audited HPADJ sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/s32cell/stages/stage32-ex5/hpadj-21_ex5
          mkdir -p /tmp/s32cell/stages/stage32-ex5/hpadj-18_ex5
          mkdir -p /tmp/s32cell/stages/stage32-ex5/hpadj-16_ex5
          mkdir -p /tmp/s32cell/stages/stage32-ex5/hpadj-15_ex5
          mkdir -p /tmp/s32cell/stages/stage32-ex5/hpadj-10_ex5
          git fetch --no-tags origin 265fbef0a67014494fcf773af6c3a9f1b095ef95
          git show 265fbef0a67014494fcf773af6c3a9f1b095ef95:stages/stage32-ex5/hpadj-21_ex5/run_full_hist_row.py > /tmp/s32cell/stages/stage32-ex5/hpadj-21_ex5/run_full_hist_row.py
          git show 265fbef0a67014494fcf773af6c3a9f1b095ef95:stages/stage32-ex5/hpadj-18_ex5/derive_q_quadratic_exact_predomain_picard_parity_lp_bound.py > /tmp/s32cell/stages/stage32-ex5/hpadj-18_ex5/derive_q_quadratic_exact_predomain_picard_parity_lp_bound.py
          git show 265fbef0a67014494fcf773af6c3a9f1b095ef95:stages/stage32-ex5/hpadj-16_ex5/derive_q_quadratic_b_shard_mass_lp_bound.py > /tmp/s32cell/stages/stage32-ex5/hpadj-16_ex5/derive_q_quadratic_b_shard_mass_lp_bound.py
          git show 265fbef0a67014494fcf773af6c3a9f1b095ef95:stages/stage32-ex5/hpadj-15_ex5/derive_b_shard_row_exact_grf04_picard_capacity_bound.py > /tmp/s32cell/stages/stage32-ex5/hpadj-15_ex5/derive_b_shard_row_exact_grf04_picard_capacity_bound.py
          git show 265fbef0a67014494fcf773af6c3a9f1b095ef95:stages/stage32-ex5/hpadj-10_ex5/count_hpadj_kernel_population.py > /tmp/s32cell/stages/stage32-ex5/hpadj-10_ex5/count_hpadj_kernel_population.py
      - name: Download retained HPADJ21 g1-d192 row certificate
        uses: actions/download-artifact@v4
        with:
          name: hpadj21-carry-bundle
          path: /tmp/s32cell/carry
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35275839413
      - name: Exact one-cell reconstruction and LP cutoff
        run: |
          python stages/stage32/32-01-178/fibration-nef/verify_hpadj21_g1d192_b36_47_cell_replay.py \
            --row-worker /tmp/s32cell/stages/stage32-ex5/hpadj-21_ex5/run_full_hist_row.py \
            --hpadj18 /tmp/s32cell/stages/stage32-ex5/hpadj-18_ex5/derive_q_quadratic_exact_predomain_picard_parity_lp_bound.py \
            --hpadj16 /tmp/s32cell/stages/stage32-ex5/hpadj-16_ex5/derive_q_quadratic_b_shard_mass_lp_bound.py \
            --hpadj15 /tmp/s32cell/stages/stage32-ex5/hpadj-15_ex5/derive_b_shard_row_exact_grf04_picard_capacity_bound.py \
            --hpadj10 /tmp/s32cell/stages/stage32-ex5/hpadj-10_ex5/count_hpadj_kernel_population.py \
            --row-cert /tmp/s32cell/carry/hpadj21-row-22.json
      - name: Diff hygiene
        run: git diff --check
