name: Stage33 V91C1X R5B3B3C4B1E4 Rees Cartier gauge materialize

on:
  push:
    branches:
      - stage33-v91c1x-r5b3b3c4b1e-1757-refinement-unit-preflight
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b1e4-rees-cartier-gauge-materialize.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e4_rees_cartier_rational_gauge_lift.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e3-hilbert90-divisor-rees-attachment.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e2-hilbert90-swap23-residue-gauge.json'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1d_swap23_tangent_pullback_comparison.py'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b2d2_swap23_317_cover_common_refinement.py'
      - 'stages/stage33/33-07/exceptional-p1-tangent-coordinates.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Materialize exact C4B1E4 Rees Cartier gauge lift
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e4_rees_cartier_rational_gauge_lift.py --write
      - name: Enforce artifact-only bounded delta
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e4-rees-cartier-rational-gauge-lift.json'
          changed="$(git status --porcelain | sed 's/^...//')"
          test -n "$changed"
          test "$changed" = "$artifact"
          git diff --check
      - name: Commit generated certificate
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e4-rees-cartier-rational-gauge-lift.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$artifact"
          git diff --cached --quiet || git commit -m '[Stage33] materialize C4B1E4 Rees Cartier rational gauge lift artifact'
          git push
