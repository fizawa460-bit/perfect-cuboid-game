name: Stage32 compressed terminal family selftest

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/residual-32-01-production/compressed_terminal_family.py'
      - 'stages/stage32/residual-32-01-production/test_compressed_terminal_family.py'
      - '.github/workflows/stage32-compressed-terminal-family-selftest.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Compare symbolic family with the current exact production engine
        run: |
          python -m unittest -v \
            stages/stage32/residual-32-01-production/test_compressed_terminal_family.py
