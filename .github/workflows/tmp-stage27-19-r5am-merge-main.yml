name: Temporary Stage27-19-r5am merge main

on:
  push:
    branches:
      - agent/stage27-19-r5am-pell-compression
    paths:
      - '.github/workflows/tmp-stage27-19-r5am-merge-main.yml'

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-19-r5am-pell-compression
          fetch-depth: 0
      - name: Merge latest main and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/tmp-stage27-19-r5am-merge-main.yml
          git add -A
          git diff --cached --check
          git commit -m 'Stage27-19-r5am: remove temporary main merge helper'
          git push origin HEAD:agent/stage27-19-r5am-pell-compression
