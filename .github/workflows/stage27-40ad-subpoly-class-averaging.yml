name: Stage27-40ad fixed-U class averaging

on:
  pull_request:
    paths:
      - 'stages/stage27/**'
      - 'stages/stage14/archive/tasks/14-t135/result.md'
      - 'stages/stage14/archive/tasks/14-t157/result.md'
      - '.github/workflows/stage27-40ad-subpoly-class-averaging.yml'
  workflow_dispatch:

jobs:
  verify-stage27-40ad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage27-40ad fixed-U class averaging
        run: python stages/stage27/27-40ad/verify_27_40ad.py
