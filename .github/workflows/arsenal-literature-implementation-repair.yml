name: Arsenal literature implementation repair

on:
  push:
    branches: [arsenal-literature-strengthening-implementation]

permissions:
  contents: write

env:
  OLD_AUDIT_HEAD: 44f635f364f9904c2048197bc84eea58938fdb16
  NEW_AUDIT_HEAD: 288c3fac93774806a96cd7cb0076493e173f859c

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arsenal-literature-strengthening-implementation

      - name: Fetch fresh main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          FRESH_MAIN=$(git rev-parse FETCH_HEAD)
          echo "FRESH_MAIN=$FRESH_MAIN" >> "$GITHUB_ENV"
          echo "$FRESH_MAIN"

      - name: Verify discovery exact head
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git ls-remote origin refs/heads/arsenal-literature-strengthening-audit | cut -f1)
          test "$ACTUAL" = "$NEW_AUDIT_HEAD"

      - name: Fail-close on Arsenal main drift
        shell: bash
        run: |
          set -euo pipefail
          MERGE_BASE=$(git merge-base HEAD "$FRESH_MAIN")
          git diff --name-only "$MERGE_BASE".."$FRESH_MAIN" | tee /tmp/main-drift.txt
          if grep -E '^(docs/arsenal/|docs/arsenal-literature-strengthening-promotion\.md$)' /tmp/main-drift.txt; then
            echo 'FAIL: current-main drift touches Arsenal implementation scope' >&2
            exit 1
          fi

      - name: Merge fresh main into implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$FRESH_MAIN"

      - name: Relock discovery and repair Creutz-Viray locator
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OLD_AUDIT_HEAD" "$NEW_AUDIT_HEAD" "$FRESH_MAIN" <<'PY'
          from pathlib import Path
          import sys
          old_head, new_head, fresh_main = sys.argv[1:]
          source = Path('docs/arsenal-literature-strengthening-promotion.md')
          index = Path('docs/arsenal/index.json')
          paths = [source, index]
          n_head=n_loc=0
          stale_locators=(
              'Theorems 1.7, 1.9; Appendix Theorem A.1',
              'Theorems 1.7, 1.9 and Appendix Theorem A.1',
              'Theorem 1.7 and Theorem 1.9 / Appendix Theorem A.1',
          )
          for p in paths:
              text=p.read_text()
              n_head += text.count(old_head)
              text=text.replace(old_head,new_head)
              for old in stale_locators:
                  n_loc += text.count(old)
                  text=text.replace(old,'Theorem 1.7; Theorem 1.8; Appendix Theorem A.1')
              p.write_text(text)
          if n_head < 1: raise SystemExit('old discovery head was not found')
          if n_loc < 1: raise SystemExit('old Creutz-Viray locator was not found')
          text=source.read_text()
          marker='IMPLEMENTATION_BASE_MAIN=24215fa27a631cd3cb370c0dfd76866dd2e916f1\n'
          if 'FRESHNESS_SYNC_MAIN=' in text:
              text=''.join((f'FRESHNESS_SYNC_MAIN={fresh_main}\n' if line.startswith('FRESHNESS_SYNC_MAIN=') else line) for line in text.splitlines(True))
          else:
              if marker not in text: raise SystemExit('implementation base marker missing')
              text=text.replace(marker,marker+f'FRESHNESS_SYNC_MAIN={fresh_main}\n',1)
          source.write_text(text)
          for p in paths:
              t=p.read_text()
              if old_head in t: raise SystemExit(f'stale discovery head remains in {p}')
              if 'Theorems 1.7, 1.9' in t or 'Theorem 1.7 and Theorem 1.9' in t:
                  raise SystemExit(f'stale Creutz-Viray locator remains in {p}')
          PY

      - name: Materialize registry
        shell: bash
        run: |
          set -euo pipefail
          python3 -B docs/arsenal/sync_arsenal_catalog.py
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          git diff --check

      - name: Commit final materialized tree without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/arsenal-literature-implementation-repair.yml
          git add docs/arsenal-literature-strengthening-promotion.md docs/arsenal/index.json docs/arsenal/catalog.md docs/arsenal/cards
          git commit -m 'fix(arsenal): relock literature audit and refresh implementation'
          test -z "$(git status --porcelain)"

      - name: Exact-head generator and scope validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          git diff --check "$FRESH_MAIN"..HEAD
          git diff --name-only "$FRESH_MAIN"..HEAD | sort > /tmp/final-scope.txt
          cat /tmp/final-scope.txt
          python3 - <<'PY'
          from pathlib import Path
          allowed={'docs/arsenal-literature-strengthening-promotion.md','docs/arsenal/index.json','docs/arsenal/catalog.md'}
          allowed|={f'docs/arsenal/cards/provisional/LIT-PW{i:02d}.md' for i in range(1,16)}
          allowed.add('docs/arsenal/cards/workflows/LIT-WF01.md')
          got=set(Path('/tmp/final-scope.txt').read_text().splitlines())
          if got != allowed:
              raise SystemExit(f'exact scope mismatch extra={sorted(got-allowed)} missing={sorted(allowed-got)}')
          PY
          test -z "$(grep -E '^(stages/|\.github/|.*MAIN-STATE|.*controller)' /tmp/final-scope.txt || true)"

      - name: Exact-head provenance firewalls
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git grep -n "$OLD_AUDIT_HEAD" -- docs/arsenal-literature-strengthening-promotion.md docs/arsenal/index.json docs/arsenal/cards/provisional/LIT-PW05.md || true)"
          test -z "$(git grep -n 'Theorems 1.7, 1.9\|Theorem 1.7 and Theorem 1.9' -- docs/arsenal-literature-strengthening-promotion.md docs/arsenal/index.json docs/arsenal/cards/provisional/LIT-PW05.md || true)"
          git grep -n 'Theorem 1.7; Theorem 1.8; Appendix Theorem A.1' -- docs/arsenal-literature-strengthening-promotion.md docs/arsenal/index.json docs/arsenal/cards/provisional/LIT-PW05.md
          git grep -n "LITERATURE_AUDIT_EXACT_HEAD=$NEW_AUDIT_HEAD" -- docs/arsenal-literature-strengthening-promotion.md
          git grep -n "FRESHNESS_SYNC_MAIN=$FRESH_MAIN" -- docs/arsenal-literature-strengthening-promotion.md
          git grep -n 'STAGE36_EXCLUDED=true' -- docs/arsenal-literature-strengthening-promotion.md
          git grep -n 'MATHEMATICAL_STAGE_CREDIT_INCREMENT=0' -- docs/arsenal-literature-strengthening-promotion.md
          for f in docs/arsenal/cards/provisional/LIT-PW*.md docs/arsenal/cards/workflows/LIT-WF01.md; do
            grep -q 'DO_NOT_USE_FOR' "$f"
            grep -q 'Theorem/algorithm locator' "$f"
            grep -q 'Conditional' "$f"
            grep -q 'Repo adapter' "$f"
          done

      - name: Active ID uniqueness and retired successor sanity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/arsenal/index.json').read_text())
          active=[]
          active += [e['id'] for e in x['selectors']]
          active += [e['id'] for e in x['formal_router_weapons']]
          active += [e['id'] for e in x['formal_workflows']]
          retired={}
          for h in x['provisional_harvests']:
              active += h.get('active_cards',[])
              active += h.get('active_workflows',[])
              retired.update(h.get('retired_merged_ids',{}))
          if len(active)!=67:
              raise SystemExit(f'active ID count {len(active)} != 67')
          if len(active)!=len(set(active)):
              dup=sorted({i for i in active if active.count(i)>1})
              raise SystemExit(f'duplicate active IDs: {dup}')
          if set(retired) & set(active):
              raise SystemExit(f'retired IDs reused as active: {sorted(set(retired)&set(active))}')
          missing=sorted({succ for succ in retired.values() if succ not in set(active)})
          if missing:
              raise SystemExit(f'retired successor missing: {missing}')
          required={f'LIT-PW{i:02d}' for i in range(1,16)}|{'LIT-WF01'}
          if not required.issubset(set(active)):
              raise SystemExit(f'missing literature IDs: {sorted(required-set(active))}')
          print('PASS active IDs unique:',len(active),'retired:',len(retired))
          PY

      - name: Stage36 registry equality
        shell: bash
        run: |
          set -euo pipefail
          git show "$FRESH_MAIN":docs/arsenal/index.json > /tmp/main-index.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          cur=json.loads(Path('docs/arsenal/index.json').read_text())
          base=json.loads(Path('/tmp/main-index.json').read_text())
          def stage36(x):
              hits=[h for h in x['provisional_harvests'] if h.get('source_stage')=='Stage36']
              if len(hits)!=1: raise SystemExit(f'Stage36 harvest count={len(hits)}')
              return hits[0]
          if stage36(cur) != stage36(base):
              raise SystemExit('Stage36 registry harvest changed relative to fresh main')
          print('PASS Stage36 registry harvest unchanged')
          PY
          git show --check --oneline --stat HEAD

      - name: Push exact validated head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:arsenal-literature-strengthening-implementation
