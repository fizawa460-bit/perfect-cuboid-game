name: Stage32-18BE d16 b16 repaired residual child split

on:
  push:
    branches: [stage32-18ax-b16-remaining-walls-tier3-planner]
    paths: ['stages/stage32/runkeys/18be-b16-repaired-residual-child-split.json']

permissions: {contents: read, actions: read}
concurrency: {group: stage32-18be-b16-repaired-residual-child-split, cancel-in-progress: true}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: gate
        env: {BEFORE: '${{ github.event.before }}', HEAD_SHA: '${{ github.sha }}'}
        run: |
          set -euo pipefail
          KEY=stages/stage32/runkeys/18be-b16-repaired-residual-child-split.json
          echo 'authorized=false' >> "$GITHUB_OUTPUT"; echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          [ -n "$BEFORE" ] || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || true
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          [ "$(git diff --name-only "$BEFORE" "$HEAD_SHA" | wc -l)" -eq 1 ] || exit 0
          git diff --name-only "$BEFORE" "$HEAD_SHA" | grep -Fxq "$KEY" || exit 0
          [ "$(git log -1 --pretty=%s)" = 'Stage32-18BE: ARM REPAIRED RESIDUAL6 CHILD SPLIT' ] || exit 0
          python - <<'PY'
          import json,os,pathlib,subprocess
          key='stages/stage32/runkeys/18be-b16-repaired-residual-child-split.json'
          d=json.loads(pathlib.Path(key).read_text()); old=json.loads(subprocess.check_output(['git','show',os.environ['BEFORE']+':'+key],text=True))
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1' and old['generation']==1 and old['armed'] is False
          assert d['generation']==2 and d['armed'] is True and d['bound']==16
          assert d['algorithm']=='pairwise6_strict_below_cut39_child_split39'
          assert d['parent_cut']==39 and d['child_coordinate']==39 and d['child_probe_budget']==2000000
          assert d['source_exact_artifact_id']==9574308138
          assert d['source_summary_artifact_id']==9685982339
          assert d['source_summary_artifact_sha256']=='096446e8d7b5d945d5f01194363b9c476c213d01976b7d3ce3c63965eeb35670'
          assert d['parent_stream_gate_run_id']==33155002856 and d['source_residual_total']==6
          assert d['max_parallel']==5 and d['require_parent_stream_byte_identity'] is True
          walls=d['walls']; assert len(walls)==5 and sum(len(x['parent_ids']) for x in walls)==6
          assert d['storage_preflight']['projected_new_peak_mb_lt']<=2 and d['concurrency_preflight']['planned_effective_heavy_concurrency']==5
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('authorized=true\n'); f.write('matrix='+json.dumps({'include':walls},separators=(',',':'))+'\n')
          PY

  child_split:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.authorize.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked source and residual6 summary
        env:
          GH_TOKEN: '${{ github.token }}'
          WALL: '${{ matrix.wall }}'
          EXPECTED_IDS: '${{ join(matrix.parent_ids, ',') }}'
        run: |
          set -euo pipefail
          for f in /etc/apt/sources.list.d/*; do [ -f "$f" ] || continue; grep -q 'packages.microsoft.com' "$f" && sudo rm -f "$f" || true; done
          sudo apt-get update -qq -o Acquire::Retries=3; sudo apt-get install -y --no-install-recommends libboost-dev; command -v g++ >/dev/null
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/summary" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/source.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/src"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/summary.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9685982339/zip"
          echo '096446e8d7b5d945d5f01194363b9c476c213d01976b7d3ce3c63965eeb35670  '"$RUNNER_TEMP/summary.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/summary.zip" -d "$RUNNER_TEMP/summary"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']); d=json.loads(next((root/'summary').rglob('summary.json')).read_text())
          assert d['schema']=='STAGE32_18BD_REPAIRED_RESIDUAL_DEEP_REPLAY_SUMMARY_V1' and d['residual_input_total']==150 and d['completed_total']==144 and d['unresolved_total']==6
          assert d['parent_stream_identity_gate']=='PASSED_6_OF_6' and d['verdict']=='TRUE_SELECTIVE_CHILD_SPLIT_REQUIRED'
          wall=os.environ['WALL']; row=next(x for x in d['walls'] if x['wall']==wall); expected=[int(x) for x in os.environ['EXPECTED_IDS'].split(',') if x]
          assert row['unresolved_frontier_ids']==expected
          (root/'work'/'ids.txt').write_text(''.join(f'{x}\n' for x in expected))
          PY
      - name: Build child-split certifier
        env: {PRIMARY: '${{ matrix.primary }}'}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/work/cert.cpp"
          python stages/stage32/32-18X/build_two_stage_certifier.py --source "$RUNNER_TEMP/src/d16-exact-symmetry-sharded.cpp" --output "$SRC" --primary-id "$PRIMARY"
          SRC="$SRC" python stages/stage32/32-18AF/patch_symmetry_schedule.py
          SRC="$SRC" PAIR_LIMIT=6 python stages/stage32/32-18AY/patch_pairwise_symmetry.py
          SRC="$SRC" python stages/stage32/32-18AO/patch_block_frontier.py
          SRC="$SRC" python stages/stage32/32-18AP/patch_lower_block_replay.py
          SRC="$SRC" python stages/stage32/32-18AR/patch_frontier_cost_planner.py
          SRC="$SRC" python stages/stage32/32-18AS/patch_selective_frontier_planner.py
          SRC="$SRC" python stages/stage32/32-18BE/patch_parent_child_split.py
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic "$SRC" -o "$RUNNER_TEMP/work/cert"
          cp "$RUNNER_TEMP/src/d16-hperp.txt" "$RUNNER_TEMP/work/"; cp "$RUNNER_TEMP/src/d16-aut-prefix256-bundle.txt" "$RUNNER_TEMP/work/"
      - name: Split and probe children
        env:
          SHARD: '${{ matrix.shard }}'
          WALL: '${{ matrix.wall }}'
          EXPECTED_FRONTIER: '${{ matrix.frontier }}'
          PARENT_COUNT: '${{ matrix.parent_count }}'
        run: |
          set -euo pipefail
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" timeout --signal=TERM --kill-after=20s 45m "$RUNNER_TEMP/work/cert" --input "$RUNNER_TEMP/work/d16-hperp.txt" --bundle "$RUNNER_TEMP/work/d16-aut-prefix256-bundle.txt" --output "$RUNNER_TEMP/out/cert.json" --dump-canonical "$RUNNER_TEMP/out/dump.bin" --bound 16 --shard-id "$SHARD" --shard-count 1024 --split-coordinate 48 --block-cut 39 --frontier-cap 50000 --replay-limit 0 --child-split-probe-budget 2000000 --child-split-output "$RUNNER_TEMP/out/children.csv" --child-split-id-file "$RUNNER_TEMP/work/ids.txt" --node-cap 12000000 >/dev/null 2>"$RUNNER_TEMP/out/stderr.txt"
          python - <<'PY'
          import csv,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']); out=root/'out'; cert=json.loads((out/'cert.json').read_text()); parents=[int(x) for x in (root/'work'/'ids.txt').read_text().split()]
          assert cert['frontier_states']==int(os.environ['EXPECTED_FRONTIER']); assert cert['pairwise_parent_partition_stable'] is True and cert['pairwise_strictly_below_block_cut'] is True
          assert cert['child_split_enabled'] is True and cert['child_split_selected_ids']==len(parents)==int(os.environ['PARENT_COUNT']) and cert['child_split_parents_seen']==len(parents)
          rows=list(csv.DictReader((out/'children.csv').open())); pr=[r for r in rows if r['record']=='PARENT']; ch=[r for r in rows if r['record']=='CHILD']
          assert [int(r['parent_id']) for r in pr]==parents
          unresolved=[]; complete_parents=[]; children_by_parent={}
          for p in parents:
              cs=[r for r in ch if int(r['parent_id'])==p]; rr=next(r for r in pr if int(r['parent_id'])==p)
              assert int(rr['child_index'])==len(cs); assert [int(r['child_index']) for r in cs]==list(range(len(cs)))
              bad=[{'parent_id':p,'child_index':int(r['child_index']),'z39':int(r['z_value']),'probe_nodes':int(r['probe_nodes'])} for r in cs if r['complete']!='1']
              unresolved.extend(bad); children_by_parent[str(p)]={'child_count':len(cs),'completed_children':len(cs)-len(bad),'unresolved_children':bad}
              if rr['complete']=='1': assert not bad; complete_parents.append(p)
              else: assert bad
          result={'schema':'STAGE32_18BE_REPAIRED_RESIDUAL_CHILD_SPLIT_RESULT_V1','wall':os.environ['WALL'],'parent_input_count':len(parents),'parent_ids':parents,'completed_parent_count':len(complete_parents),'completed_parent_ids':complete_parents,'unresolved_parent_count':len(parents)-len(complete_parents),'unresolved_children':unresolved,'children_by_parent':children_by_parent,'child_coordinate':39,'child_probe_budget':2000000,'runtime_seconds':float((out/'runtime.txt').read_text().strip()),'parent_cut':39,'parent_stream_identity_gate':'PASSED_6_OF_6','D16_B16_NUMERICAL_CREDIT':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False}
          (out/'compact.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          for x in ['cert.json','dump.bin','children.csv','stderr.txt','runtime.txt']:(out/x).unlink(missing_ok=True)
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18be-child-${{ matrix.wall }}
          path: ${{ runner.temp }}/out/compact.json
          retention-days: 2
          if-no-files-found: error

  summarize:
    needs: [authorize, child_split]
    if: always() && needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'stage32-18be-child-*', path: '${{ runner.temp }}/runs'}
      - run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']); docs=[json.loads(p.read_text()) for p in (root/'runs').rglob('compact.json')]; assert len(docs)==5,len(docs)
          pin=sum(d['parent_input_count'] for d in docs); done=sum(d['completed_parent_count'] for d in docs); children=[x for d in docs for x in d['unresolved_children']]
          assert pin==6 and done+len({(x['parent_id'],d['wall']) for d in docs for x in d['unresolved_children']})<=6
          out={'schema':'STAGE32_18BE_REPAIRED_RESIDUAL_CHILD_SPLIT_SUMMARY_V1','source_18bd_summary_artifact_id':9685982339,'source_g4_run_id':33155002856,'parent_stream_identity_gate':'PASSED_6_OF_6','parent_input_total':6,'completed_parent_total':done,'unresolved_parent_total':sum(d['unresolved_parent_count'] for d in docs),'unresolved_child_total':len(children),'walls':sorted(docs,key=lambda d:d['wall']),'verdict':'ALL_REPAIRED_RESIDUAL6_RESOLVED' if not children else 'DEEPER_CHILD_SPLIT_REQUIRED','next_item':'32-18BF_D16_B16_CLOSE_EVIDENCE_REBUILD' if not children else '32-18BF_D16_B16_DEEPER_CHILD_SPLIT','D16_B16_NUMERICAL_CREDIT':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False}
          outdir=root/'summary'; outdir.mkdir(); (outdir/'summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18be-repaired-residual-child-split-summary
          path: ${{ runner.temp }}/summary/summary.json
          retention-days: 7
          if-no-files-found: error
