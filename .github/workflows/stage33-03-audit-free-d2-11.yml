name: Stage33-03 hostile audit free d2_11

on:
  pull_request:
    paths:
      - 'stages/stage33/33-03/audit_materialize_free_d2_11.py'
      - '.github/workflows/stage33-03-audit-free-d2-11.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  direct-free-d2-11:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact integer algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Restore locked predecessor certificate artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import io, os, pathlib, urllib.parse, urllib.request, zipfile
          artifact_id = 9513603089
          url = f'https://api.github.com/repos/fizawa460-bit/perfect-cuboid-game/actions/artifacts/{artifact_id}/zip'
          class StripCrossHostAuthRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  newreq = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if newreq is not None and urllib.parse.urlsplit(req.full_url).netloc != urllib.parse.urlsplit(newurl).netloc:
                      newreq.remove_header('Authorization')
                  return newreq
          req = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'perfect-cuboid-stage33-audit/1.0',
          })
          opener = urllib.request.build_opener(StripCrossHostAuthRedirect())
          with opener.open(req, timeout=60) as resp:
              raw = resp.read()
          target = pathlib.Path('stages/stage33/33-03')
          with zipfile.ZipFile(io.BytesIO(raw)) as zf:
              zf.extractall(target)
          print('restored', artifact_id, 'files', len(zipfile.ZipFile(io.BytesIO(raw)).namelist()))
          PY
      - name: Directly materialize free-side finite d2_11
        working-directory: stages/stage33/33-03
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if python audit_materialize_free_d2_11.py; then exit 0; fi
            echo "focused audit d2_11 attempt ${attempt} incomplete"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          exit 1
      - name: Upload hostile-audit verifier certificate
        uses: actions/upload-artifact@v4
        with:
          name: stage33-03-audit-free-d2-11
          path: |
            stages/stage33/33-03/audit-free-d2-11-magma-stdout.txt
            stages/stage33/33-03/audit-free-d2-11-direct.json
