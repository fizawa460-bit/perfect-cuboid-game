# This is a single exact verifier, not heavy/artifact-producing production compute.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-01-178-hpadj22-e192-zero-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
