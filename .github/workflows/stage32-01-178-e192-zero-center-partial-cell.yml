name: Stage32 32-01-178 HPADJ22 e192 zero-center current-authority replay

# lifecycle: ACTIVE_AUTO
# Current 178 frontier: one bounded V45 HPADJ22 current-authority subset refinement.
# This is a single exact verifier, not heavy/artifact-producing production compute.
on:
  push:
    branches:
      - stage32-01-178-post-td02-fibration-nef
    paths:
      - 'stages/stage32/32-01-178/fibration-nef/verify_hpadj22_e192_zero_center_top16_bc_cells.py'
      - 'stages/stage32/32-01-178/fibration-nef/verify_hpadj22_e192_zero_center_top8_bc_cells.py'
      - 'stages/stage32/32-01-178/fibration-nef/verify_hpadj22_e192_zero_center_all_a_all_unequal_support7_family.py'
      - 'stages/stage32/32-01-178/fibration-nef/verify_hpadj22_e192_zero_center_all_unequal_support7_family.py'
      - 'stages/stage32/32-01-178/fibration-nef/verify_hpadj22_e192_zero_center_fixed_h_family.py'
      - 'stages/stage32/32-01-178/fibration-nef/verify_hpadj22_e192_zero_center_single_witness.py'
      - '.github/workflows/stage32-01-178-e192-zero-center-partial-cell.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-01-178-hpadj22-e192-zero-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - name: Materialize exact HPADJ22 producer source
        run: |
          set -euo pipefail
          git fetch --no-tags origin 4bd68dedffa9ca49b0fecc41a89e5e2bc39585a2
          rm -rf /tmp/s32h22src
          git worktree add --detach /tmp/s32h22src 4bd68dedffa9ca49b0fecc41a89e5e2bc39585a2
      - name: Exact V45 HPADJ22 e192 zero-center top16 disjoint bc cells
        run: |
          set -euo pipefail
          mkdir -p /tmp/s32h22ref
          python stages/stage32/32-01-178/fibration-nef/verify_hpadj22_e192_zero_center_top16_bc_cells.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --source-root /tmp/s32h22src \
            --output /tmp/s32h22ref/result.json
      - name: Diff hygiene
        run: git diff --check
