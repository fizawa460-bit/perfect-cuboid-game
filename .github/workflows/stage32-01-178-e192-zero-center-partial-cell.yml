          set -euo pipefail
          git fetch --no-tags origin 4bd68dedffa9ca49b0fecc41a89e5e2bc39585a2
          rm -rf /tmp/s32h22src
          git worktree add --detach /tmp/s32h22src 4bd68dedffa9ca49b0fecc41a89e5e2bc39585a2
      - name: Retained top16 exact-head boundary
        run: |
          set -euo pipefail
          echo "top16 exact-head replay already SUCCESS at fdb8f55c791df8bfd18db162fb66b854f6c210c0 / run 35588376541"
      - name: Exact g1-d192 band4 zero-center t-interval probe
        run: |
          set -euo pipefail
          python stages/stage32/32-01-178/fibration-nef/verify_hpadj22_zero_center_tinterval_g1d192_band4.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --source-root /tmp/s32h22src
