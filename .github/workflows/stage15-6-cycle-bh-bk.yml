name: Stage15-6 cycle bh-bk
on:
  pull_request:
    paths:
      - 'stages/stage15/15-6bh/**'
      - 'stages/stage15/15-6bi/**'
      - 'stages/stage15/15-6bj/**'
      - 'stages/stage15/15-6bk/**'
      - 'stages/stage15/15-6-cycle/6bh-6bk.md'
      - 'stages/stage15/evidence/stage15_6bh_support_restatement.json'
      - 'stages/stage15/evidence/stage15_6bi_complementary_products.json'
      - 'stages/stage15/evidence/stage15_6bj_equal_hypotenuse_audit.json'
      - 'stages/stage15/evidence/stage15_6bk_joint_core_endpoint.json'
      - 'stages/stage15/replay/verify_stage15_6bh.py'
      - 'stages/stage15/replay/verify_stage15_6bi.py'
      - 'stages/stage15/replay/verify_stage15_6bj.py'
      - 'stages/stage15/replay/verify_stage15_6bk.py'
      - '.github/workflows/stage15-6-cycle-bh-bk.yml'
  workflow_dispatch:
jobs:
  verify-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python stages/stage15/replay/verify_stage15_6bh.py
      - run: python stages/stage15/replay/verify_stage15_6bi.py
      - run: python stages/stage15/replay/verify_stage15_6bj.py
      - run: python stages/stage15/replay/verify_stage15_6bk.py
      - run: python -m py_compile stages/stage15/scripts/stage15_6bh_support_restatement.py stages/stage15/scripts/stage15_6bi_complementary_products.py stages/stage15/scripts/stage15_6bj_equal_hypotenuse_audit.py stages/stage15/scripts/stage15_6bk_joint_core_endpoint.py
