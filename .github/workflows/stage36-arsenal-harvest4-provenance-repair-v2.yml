name: Stage36 Arsenal Harvest4 provenance repair v2

on:
  push:
    branches:
      - stage36-arsenal-initial-provisional-harvest-promotion
    paths:
      - .github/workflows/stage36-arsenal-harvest4-provenance-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve frozen provenance and validate exact final head
        shell: bash
        run: |
          set -euo pipefail
          H3_HEAD=0ad4a2fc78ebd3ee55c47d9bf5100d8e4cee3b66
          FROZEN_LOWER=62c26297ebeb159e9cdd1e6b9c2129dff6a4acdc
          FROZEN_UPPER=07a465cb5025e7c0188fb63610bb40e4b54e7a84
          BRANCH=stage36-arsenal-initial-provisional-harvest-promotion
          WF1=.github/workflows/stage36-arsenal-harvest4-provenance-repair.yml
          WF2=.github/workflows/stage36-arsenal-harvest4-provenance-repair-v2.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          BASE_MAIN=$(git rev-parse origin/main)
          echo "REPAIR_BASE_MAIN=$BASE_MAIN"
          git merge --no-edit "$BASE_MAIN"
          git merge-base --is-ancestor "$BASE_MAIN" HEAD

          git fetch origin "$H3_HEAD" --depth=1
          git show "$H3_HEAD":docs/arsenal/stage36-initial-hostile-dedup.json > /tmp/h3.json
          git show "$H3_HEAD":docs/arsenal/stage36-initial-hostile-dedup-new-weapons.json > /tmp/h3-new.json
          git show "$H3_HEAD":docs/arsenal/stage36-initial-hostile-dedup-extensions.json > /tmp/h3-ext.json

          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('docs/stage36-arsenal-promotion.md')
          text=p.read_text()
          h3=json.load(open('/tmp/h3.json'))
          new=json.load(open('/tmp/h3-new.json'))
          ext=json.load(open('/tmp/h3-ext.json'))
          lower='62c26297ebeb159e9cdd1e6b9c2129dff6a4acdc'
          upper='07a465cb5025e7c0188fb63610bb40e4b54e7a84'
          mapping={'DISC-S36-A01':'S36-PW01','DISC-S36-A05':'S36-PW02','DISC-S36-A06':'S36-PW03','DISC-S36-B03':'S36-PW04','DISC-S36-B10':'S36-PW05','DISC-S36-B11':'S36-PW06','DISC-S36-B14':'S36-PW07'}
          assert h3['discovery_pr']==1673
          assert h3['frozen_bounds']=={'harvest_lower_bound':lower,'harvest_upper_bound':upper,'scope_widened':False}
          assert h3['classification_summary']=={'total':36,'NEW_WEAPON':7,'EXTEND_EXISTING':5,'NEW_WORKFLOW':0,'HISTORICAL_OR_NEGATIVE':11,'STAGE36_SPECIFIC':2,'REJECT_DUPLICATE':11}
          assert set(mapping)==set(h3['final_classification']['NEW_WEAPON'])
          assert [r['temporary_candidate_id'] for r in new['records']]==h3['final_classification']['NEW_WEAPON']
          assert [r['temporary_candidate_id'] for r in ext['records']]==h3['final_classification']['EXTEND_EXISTING']

          def q(v):
              if v is None: return 'null'
              if isinstance(v,(dict,list)): return json.dumps(v,sort_keys=True,separators=(',',':'))
              return str(v)
          def enrich(doc,marker,next_markers,rec):
              s=doc.index(marker)
              ends=[x for m in next_markers if (x:=doc.find(m,s+len(marker)))!=-1]
              e=min(ends) if ends else len(doc)
              sec=doc[s:e]
              v=rec['verifier_source_lock']
              anchor=f"source_lock={q(v.get('source_lock'))}\n```"
              assert anchor in sec,(rec['temporary_candidate_id'],'source-lock anchor missing')
              lines=[]
              if 'audited_wrapper_blob_sha' in v: lines.append(f"audited_wrapper_blob_sha={v['audited_wrapper_blob_sha']}")
              if 'supporting_locked_inputs' in v: lines.append(f"supporting_locked_inputs={q(v['supporting_locked_inputs'])}")
              if 'audit' in rec:
                  lines += [f"audit_status={q(rec['audit'].get('status'))}",f"audit_review={q(rec['audit'].get('review'))}"]
              for k in ('audit_note','source_lock_note','firewall'):
                  if k in rec: lines.append(f"{k}={q(rec[k])}")
              assert lines
              for line in lines: assert line not in sec,(rec['temporary_candidate_id'],'already materialized',line)
              sec=sec.replace(anchor,f"source_lock={q(v.get('source_lock'))}\n"+'\n'.join(lines)+'\n```',1)
              return doc[:s]+sec+doc[e:]

          for r in new['records']:
              text=enrich(text,f"## {mapping[r['temporary_candidate_id']]} {r['proposed_role_name']}",['\n## '],r)
          for r in ext['records']:
              text=enrich(text,f"### {r['temporary_candidate_id']} -> {r['target_existing_card']} — {r['proposed_role_name']}",['\n### ','\n## Historical / negative exclusions'],r)
          p.write_text(text)

          wrappers=[r['temporary_candidate_id'] for r in new['records']+ext['records'] if 'audited_wrapper_blob_sha' in r['verifier_source_lock']]
          supports=[r['temporary_candidate_id'] for r in new['records']+ext['records'] if 'supporting_locked_inputs' in r['verifier_source_lock']]
          notes=[r['temporary_candidate_id'] for r in new['records']+ext['records'] if 'audit_note' in r]
          assert wrappers==['DISC-S36-A05','DISC-S36-B03','DISC-S36-B10','DISC-S36-B11','DISC-S36-B08','DISC-S36-B12']
          assert supports==['DISC-S36-B14']
          assert notes==['DISC-S36-B04']
          b14=next(r for r in new['records'] if r['temporary_candidate_id']=='DISC-S36-B14')
          assert len(b14['verifier_source_lock']['supporting_locked_inputs'])==2
          print('PASS_FROZEN_OPTIONAL_PROVENANCE_DISCOVERY',wrappers,supports,notes)
          PY

          python3 -B docs/arsenal/sync_arsenal_catalog.py
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          git diff --check

          python3 - <<'PY'
          import json,pathlib
          promo=pathlib.Path('docs/stage36-arsenal-promotion.md').read_text()
          new=json.load(open('/tmp/h3-new.json')); ext=json.load(open('/tmp/h3-ext.json'))
          mapping={'DISC-S36-A01':'S36-PW01','DISC-S36-A05':'S36-PW02','DISC-S36-A06':'S36-PW03','DISC-S36-B03':'S36-PW04','DISC-S36-B10':'S36-PW05','DISC-S36-B11':'S36-PW06','DISC-S36-B14':'S36-PW07'}
          def q(v):
              if v is None:return 'null'
              if isinstance(v,(dict,list)):return json.dumps(v,sort_keys=True,separators=(',',':'))
              return str(v)
          def fields(r):
              v=r['verifier_source_lock']; a=[]
              if 'audited_wrapper_blob_sha' in v:a.append(f"audited_wrapper_blob_sha={v['audited_wrapper_blob_sha']}")
              if 'supporting_locked_inputs' in v:a.append(f"supporting_locked_inputs={q(v['supporting_locked_inputs'])}")
              if 'audit' in r:a += [f"audit_status={q(r['audit'].get('status'))}",f"audit_review={q(r['audit'].get('review'))}"]
              for k in ('audit_note','source_lock_note','firewall'):
                  if k in r:a.append(f"{k}={q(r[k])}")
              return a
          for r in new['records']+ext['records']:
              for x in fields(r):assert x in promo,(r['temporary_candidate_id'],x)
          for r in new['records']:
              c=pathlib.Path('docs/arsenal/cards/provisional',mapping[r['temporary_candidate_id']]+'.md').read_text()
              for x in fields(r):assert x in c,(mapping[r['temporary_candidate_id']],x)
          assert 'audited_wrapper_blob_sha=2cff9386cf9393b53725db7bc124c6b5ede221b3' in pathlib.Path('docs/arsenal/cards/provisional/S36-PW02.md').read_text()
          b14=pathlib.Path('docs/arsenal/cards/provisional/S36-PW07.md').read_text()
          assert '9fdec16f920104cc6c1961fb092185a0371258d5' in b14 and '3eb6e42b563ee2b5042917467a62e7606f27a869' in b14
          assert 'audit_note=Harvest1 found no separately relocked hostile-review ID for this retained wrapper; maturity remains PROVISIONAL.' in promo
          print('PASS_FROZEN_PROVENANCE_SURVIVES_MATERIALIZATION')
          PY

          git rm "$WF1" "$WF2"
          git add docs/stage36-arsenal-promotion.md docs/arsenal
          git commit -m "arsenal: preserve frozen Stage36 harvest provenance"
          FINAL=$(git rev-parse HEAD)
          echo "EXACT_FINAL_REPAIR_HEAD=$FINAL"

          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          git diff --check "$BASE_MAIN" HEAD
          test -z "$(git diff --name-only "$BASE_MAIN" HEAD -- stages/stage36)"
          git merge-base --is-ancestor "$BASE_MAIN" HEAD

          BASE_MAIN="$BASE_MAIN" python3 - <<'PY'
          import json,os,pathlib,subprocess
          base=os.environ['BASE_MAIN']; h3head='0ad4a2fc78ebd3ee55c47d9bf5100d8e4cee3b66'; upper='07a465cb5025e7c0188fb63610bb40e4b54e7a84'
          expected={'docs/stage36-arsenal-promotion.md','docs/arsenal/index.json','docs/arsenal/catalog.md',*{f'docs/arsenal/cards/provisional/S36-PW{i:02d}.md' for i in range(1,8)}}
          got=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines());assert got==expected,got^expected
          new=json.load(open('/tmp/h3-new.json'));ext=json.load(open('/tmp/h3-ext.json'));promo=pathlib.Path('docs/stage36-arsenal-promotion.md').read_text()
          def q(v):
              if v is None:return 'null'
              if isinstance(v,(dict,list)):return json.dumps(v,sort_keys=True,separators=(',',':'))
              return str(v)
          for r in new['records']+ext['records']:
              v=r['verifier_source_lock']
              if 'audited_wrapper_blob_sha' in v:assert f"audited_wrapper_blob_sha={v['audited_wrapper_blob_sha']}" in promo
              if 'supporting_locked_inputs' in v:assert f"supporting_locked_inputs={q(v['supporting_locked_inputs'])}" in promo
              if 'audit_note' in r:assert f"audit_note={r['audit_note']}" in promo
          data=json.loads(pathlib.Path('docs/arsenal/index.json').read_text());hs=[h for h in data['provisional_harvests'] if h.get('source_stage')=='Stage36'];assert len(hs)==1
          h=hs[0];assert h['active_cards']==[f'S36-PW{i:02d}' for i in range(1,8)] and h['active_workflows']==[]
          assert h['harvest_snapshot_head']==upper and h['initial_harvest']['discovery_exact_head']==h3head and h['initial_harvest']['harvest_upper_bound']==upper
          assert h['initial_harvest']['range_expanded_after_harvest1'] is False and h['initial_harvest']['stage36_mathematical_credit_added'] is False
          ids=[];retired=set()
          for k in ('selectors','formal_router_weapons','formal_workflows'):ids += [x['id'] for x in data.get(k,[]) if x.get('id')]
          for ph in data.get('provisional_harvests',[]):ids += ph.get('active_cards',[])+ph.get('active_workflows',[]);retired |= set(ph.get('retired_merged_ids',{}))
          assert len(ids)==len(set(ids)) and not(set(ids)&retired)
          assert 'ARSENAL_REGISTRATION_DOES_NOT_CHANGE_STAGE36_MATHEMATICAL_AUTHORITY=true' in promo and 'STAGE36_PROGRESS_INCREMENT=0' in promo
          print('PASS_EXACT_SCOPE_ASSERTION',len(got));print('PASS_EXACT_HEAD_PROVENANCE_ASSERTIONS');print('PASS_ID_UNIQUENESS_RETIRED_REUSE_FIREWALL')
          PY

          test -z "$(git status --porcelain)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          git push origin "HEAD:$BRANCH"
