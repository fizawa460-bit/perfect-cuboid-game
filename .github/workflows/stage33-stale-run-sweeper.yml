name: Stage33 stale-run sweeper

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/**'
      - '.github/workflows/stage33-stale-run-sweeper.yml'
      - '.github/workflows/stage33-07-br2a-integration.yml'
      - '.github/workflows/stage33-07-nonelementary-k12-integral-cc-ct.yml'
      - '.github/workflows/stage33-07-nonelementary-k12-full-q4-scout.yml'
  workflow_dispatch:

concurrency:
  group: stage33-stale-run-sweeper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  cancel-old-heads:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel queued or running Stage33 runs from older PR heads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          CURRENT_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          repo = os.environ['REPO']
          branch = os.environ['HEAD_REF']
          current_sha = os.environ['CURRENT_SHA']
          current_run = int(os.environ['CURRENT_RUN_ID'])
          token = os.environ['GH_TOKEN']
          active = {'queued', 'in_progress', 'waiting', 'requested', 'pending'}
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'stage33-stale-run-sweeper',
          }

          stale = []
          page = 1
          while True:
              query = urllib.parse.urlencode({
                  'branch': branch,
                  'event': 'pull_request',
                  'per_page': 100,
                  'page': page,
              })
              url = f'https://api.github.com/repos/{repo}/actions/runs?{query}'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              runs = payload.get('workflow_runs', [])
              if not runs:
                  break
              for run in runs:
                  if int(run['id']) == current_run:
                      continue
                  if run.get('head_sha') == current_sha:
                      continue
                  if run.get('status') not in active:
                      continue
                  name = str(run.get('name') or '')
                  if not name.startswith('Stage33'):
                      continue
                  stale.append((int(run['id']), name, run.get('head_sha'), run.get('status')))
              if len(runs) < 100:
                  break
              page += 1

          cancelled = 0
          races = 0
          for run_id, name, sha, status in stale:
              url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel'
              req = urllib.request.Request(url, data=b'', method='POST', headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      if response.status != 202:
                          raise SystemExit(f'unexpected cancel status {response.status} for {run_id}')
                  cancelled += 1
                  print(f'CANCELLED run={run_id} status={status} head={sha} name={name}')
              except urllib.error.HTTPError as exc:
                  if exc.code == 409:
                      races += 1
                      print(f'ALREADY_FINISHING run={run_id} name={name}')
                  else:
                      raise

          print(f'STAGE33_STALE_RUNS_FOUND={len(stale)}')
          print(f'STAGE33_STALE_RUNS_CANCELLED={cancelled}')
          print(f'STAGE33_STALE_RUN_CANCEL_RACES={races}')
          print(f'CURRENT_HEAD_PRESERVED={current_sha}')
          PY
