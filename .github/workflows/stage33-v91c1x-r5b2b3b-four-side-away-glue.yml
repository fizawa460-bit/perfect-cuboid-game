name: Stage33 V91C1X R5B2B3B four side away glue

on:
  push:
    branches:
      - stage33-v91c1x-r5-cover-glue-package
    paths:
      - 'stages/stage33/33-12/e3-v91c1x-r5a-a2-02-component-p1-atlas-seeds.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2a-a2-02-target-side-incidence-closure.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2b1-a2-02-full-closure-local-germs.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2b3a-a2-02-24-side-exceptional-crossing-uniformizer-charts.json'
      - 'stages/stage33/33-07/materialize_mixed_order_side_ambient_function_lifts.py'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b2b3b_four_side_away_glue.py'
      - 'stages/stage33/33-12/verify_stage33_v91c1x_r5b2b3b_four_side_away_glue_v124.py'
      - '.github/workflows/stage33-v91c1x-r5b2b3b-four-side-away-glue.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install sympy
      - name: Materialize R5B2B3B four-side away/glue package
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b2b3b_four_side_away_glue.py --write
      - name: Verify R5B2B3B four-side away/glue package
        run: python stages/stage33/33-12/verify_stage33_v91c1x_r5b2b3b_four_side_away_glue_v124.py
      - name: Verify live Stage33 state remains synchronized
        run: python stages/stage33/sync_main_state.py --check
      - name: Diff check
        run: git diff --check
      - name: Commit R5B2B3B certificate
        shell: bash
        run: |
          CERT='stages/stage33/33-12/e3-v91c1x-r5b2b3b-a2-02-four-side-away-from-exceptional-glue.json'
          if [ -z "$(git status --porcelain -- "$CERT")" ]; then
            echo 'R5B2B3B certificate already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CERT"
          git commit -m '[Stage33] materialize R5B2B3B four-side away/glue package'
          git push origin HEAD:${GITHUB_REF_NAME}
