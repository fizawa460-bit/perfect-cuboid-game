name: "[Stage32][32-01-178][N351] general factor Hurwitz mass cap"

# Trigger lifecycle: RETIRED
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sat: ${{ steps.ledger.outputs.sat }}
      unsat: ${{ steps.ledger.outputs.unsat }}
      unknown: ${{ steps.ledger.outputs.unknown }}
      canonical: ${{ steps.ledger.outputs.canonical }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.x"
      - name: Install exact verifier dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.3.0'
      - name: Replay N351 mass-only factor-Hurwitz obstruction
        run: |
          python stages/stage32/32-01-178/nodes/N351/verify_n351_general_factor_hurwitz_mass_cap.py \
            --output /tmp/n351-result.json
      - name: Expose compact ledger
        id: ledger
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('/tmp/n351-result.json'))
          a=d['aggregate']
          print(f"sat={a['sat_row_count']}")
          print(f"unsat={a['unsat_row_count']}")
          print(f"unknown={a['unknown_row_count']}")
          print(f"canonical={d['canonical_sha256_without_this_field']}")
          PY
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

  report:
    needs: verify
    runs-on: ubuntu-latest
    name: "N351 rows SAT=${{ needs.verify.outputs.sat }} UNSAT=${{ needs.verify.outputs.unsat }} UNKNOWN=${{ needs.verify.outputs.unknown }}"
    steps:
      - name: Report N351 compact ledger
        run: |
          echo "canonical=${{ needs.verify.outputs.canonical }}"
          echo "N351 uses neither N349 local44 nor N260 allones"
          echo "N351 itself remains hostile-audit-required"
          echo "MAIN/FULL178/N350/theorem/receiver/endpoint credit=false"
