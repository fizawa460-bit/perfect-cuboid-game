name: Stage15-6ah full common support

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6ah/**'
      - 'stages/stage15/evidence/stage15_6ah_full_common_support.json'
      - 'stages/stage15/replay/verify_stage15_6ah.py'
      - 'stages/stage15/scripts/stage15_6ah_full_common_support.py'
      - '.github/workflows/stage15-6ah-full-common-support.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6ah full common-support reduction
        run: python stages/stage15/replay/verify_stage15_6ah.py
      - name: Compile Stage15-6ah utility
        run: python -m py_compile stages/stage15/scripts/stage15_6ah_full_common_support.py stages/stage15/replay/verify_stage15_6ah.py
