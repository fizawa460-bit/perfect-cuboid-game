name: Stage14-4cx Cayley annulus collapse 23/44

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4cx/**'
      - 'stages/stage14/scripts/14-4/cayley_annulus_collapse_23_44_audit.py'
      - 'stages/stage14/data/14-4/cayley_annulus_collapse_23_44_summary.json'
      - '.github/workflows/stage14-4cx-cayley-annulus-collapse-23-44.yml'
      - 'stages/stage14/14-4cw/**'
      - 'stages/stage14/14-s7-38/**'
      - 'stages/stage14/14-X12/**'
      - 'stages/stage14/14-4cq/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage14-4cx deterministic audit
        run: python stages/stage14/scripts/14-4/cayley_annulus_collapse_23_44_audit.py

      - name: Compile Stage14-4cx audit
        run: python -m py_compile stages/stage14/scripts/14-4/cayley_annulus_collapse_23_44_audit.py

      - name: Stage14-4cw regression
        run: python stages/stage14/scripts/14-4/full_row_fourth_root_61_112_audit.py

      - name: Stage14-s7-38 regression
        run: python stages/stage14/scripts/14-s7-38/full_cayley_row_11_20_audit.py

      - name: Stage14-X12 regression
        run: python stages/stage14/scripts/14-X12/lost_core_fourth_root_71_128_audit.py

      - name: Boundary locks
        run: |
          f=stages/stage14/14-4cx/result.md
          grep -Fq 'STAGE14_4CX=COMPLETE_CAYLEY_ANNULUS_COLLAPSE_FULL_LOST_CORE_COLUMN_DIVISOR_AND_23_44_PROMOTION' "$f"
          grep -Fq 'CAYLEY_ONLY_ANNULUS_FIXED_POWER_EMPTY=true' "$f"
          grep -Fq 'FULL_LOST_CORE_DIVIDES_COLUMN_COFACTOR_PRODUCT=true' "$f"
          grep -Fq 'FIXED_POWER_HIGH_CORE_NONPROPORTIONAL_BRANCH_EMPTY=true' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=23/44' "$f"
          grep -Fq 'CURRENT_GAP_TO_SQRT=1/44' "$f"
          grep -Fq 'TWENTYTHREE_44_SATURATION_THETA=23/88' "$f"
          grep -Fq 'TWENTYTHREE_44_SATURATION_PHI_MIN=19/88' "$f"
          grep -Fq 'TWENTYTHREE_44_SATURATION_PHI_MAX=21/88' "$f"
          grep -Fq 'REMAINING_RECEIVER=TwentyThreeFortyFourthsCayleyAnnulusCollapseLostCoreColumnRowLiftTradeoff' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-4cy' "$f"
