name: Stage32EX3 MAIN O210 V3 audit sync once

on:
  push:
    branches:
      - stage32ex3-ex3-00-typed-cover-tower
    paths:
      - stages/stage32-ex3/apply_main_o210_v3_audit_sync_once.py
      - .github/workflows/stage32ex3-main-o210-v3-audit-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage32ex3-ex3-00-typed-cover-tower
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact V3 PASS receipt sync
        run: python stages/stage32-ex3/apply_main_o210_v3_audit_sync_once.py
      - name: Replay V3 and Stage32 management
        run: |
          python stages/stage32-ex3/verify_main_o210_exclusion_v3_candidate.py
          python stages/stage32-ex3/verify_main_state.py
          python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Diff guard
        run: |
          git diff --name-only | sort > /tmp/changed
          printf '%s\n' \
            stages/stage32-ex3/MAIN-STATE.json \
            stages/stage32/proof/ACTIVE-FRONTIER.json \
            stages/stage32/proof/CLAIM-REGISTRY.json | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
      - name: Commit synchronized authority metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stages/stage32-ex3/MAIN-STATE.json stages/stage32/proof/ACTIVE-FRONTIER.json stages/stage32/proof/CLAIM-REGISTRY.json
          git commit -m '[Stage32EX3][management] sync MAIN O210 V3 hostile-audit PASS receipt'
          git push origin HEAD:stage32ex3-ex3-00-typed-cover-tower
