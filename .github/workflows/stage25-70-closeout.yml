name: Stage25-70 closeout audit

on:
  pull_request:
    paths:
      - 'stages/stage25/**'
      - 'docs/stage25-arsenal-promotion.md'
      - '.github/workflows/stage25-70-closeout.yml'
  workflow_dispatch:

jobs:
  closeout-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage25 checkpoint70 closeout contract
        run: python stages/stage25/25-70/closeout_audit.py
