name: StructureRadar refresh batch04

on:
  push:
    branches:
      - structureradar/stage16-25-04
    paths:
      - .github/workflows/structure-radar-refresh-04.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structureradar/stage16-25-04
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and verify StructureRadar
        run: |
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
      - name: Remove temporary workflow
        run: rm -f .github/workflows/structure-radar-refresh-04.yml
      - name: Commit compacted queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --check --cached
          if git diff --cached --quiet; then
            echo 'No refresh diff'
          else
            git commit -m 'StructureRadar: compact queue before batch 04'
          fi
          git push origin HEAD:structureradar/stage16-25-04
