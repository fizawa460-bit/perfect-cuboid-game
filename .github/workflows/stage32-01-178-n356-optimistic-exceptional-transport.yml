name: "[Stage32][32-01-178][N356] optimistic exceptional transport cap"

# Trigger lifecycle: ACTIVE_AUTO — audited N356 replay guard while N357 successor is researched
on:
  pull_request:
    paths:
      - "stages/stage32/32-01-178/nodes/N220/**"
      - "stages/stage32/32-01-178/nodes/N345/**"
      - "stages/stage32/32-01-178/nodes/N355/**"
      - "stages/stage32/32-01-178/nodes/N356/**"
      - "stages/stage32/32-01-178/nodes/N357/**"
      - "stages/stage32/32-01-178/nodes/N357-engine/**"
      - "stages/stage32/residual-32-01-production/full178-manifest.json"
      - "stages/stage32/management/post-n355-n356-candidate-checkpoint-20260910.json"
      - "stages/stage32/management/post-n356-hostile-pass-n357-checkpoint-20260911.json"
      - "stages/stage32/MAIN-STATE.json"
      - "stages/stage32/verify_main_startup.py"
      - "stages/stage33/33-07/picard_base_rows_retained.py"
      - "stages/stage33/33-07/stage32_picard_marking_retained.py"
      - ".github/workflows/stage32-01-178-n356-optimistic-exceptional-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-n356:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.x"
      - name: Install exact verifier dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.3.0'
      - name: Replay N356 optimistic exceptional transport census
        run: |
          python stages/stage32/32-01-178/nodes/N356/verify_n356_optimistic_exceptional_transport_parallel.py --output /tmp/n356-result.json
          cat /tmp/n356-result.json
          cmp /tmp/n356-result.json stages/stage32/32-01-178/nodes/N356/RESULT.json
      - name: Diff check
        run: git diff --check

  research-n357:
    name: research-n357-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.x"
      - name: Install exact verifier dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.3.0'
      - name: Research N357 all178 shard
        run: |
          python stages/stage32/32-01-178/nodes/N357/verify_n357_all178_support_capacity_shard.py \
            --shard-index ${{ matrix.shard }} --shard-count 8 \
            --output /tmp/n357-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: n357-shard-${{ matrix.shard }}
          path: /tmp/n357-shard-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error
      - name: Diff check
        run: git diff --check

  aggregate-n357:
    needs: research-n357
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: n357-shard-*
          path: /tmp/n357-shards
          merge-multiple: true
      - name: Aggregate N357 all178 candidate
        run: |
          python stages/stage32/32-01-178/nodes/N357/aggregate_n357_all178_support_capacity_shards.py \
            --shard-dir /tmp/n357-shards \
            --output /tmp/n357-all178-candidate.json
          cat /tmp/n357-all178-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: n357-all178-candidate
          path: /tmp/n357-all178-candidate.json
          retention-days: 1
          if-no-files-found: error
      - name: Diff check
        run: git diff --check
