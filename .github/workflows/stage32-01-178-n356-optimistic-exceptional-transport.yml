name: "[Stage32][32-01-178][N356] optimistic exceptional transport cap"

# Trigger lifecycle: MANUAL — N356 is already hostile-audited/consumed MAIN evidence.
# Keep the exact heavy replay available on demand, but do not rerun it on every PR
# synchronize that merely touches live Stage32 authority/startup files.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.x"
      - name: Install exact verifier dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.3.0'
      - name: Replay N356 optimistic exceptional transport census
        run: |
          python stages/stage32/32-01-178/nodes/N356/verify_n356_optimistic_exceptional_transport_parallel.py --output /tmp/n356-result.json
          cat /tmp/n356-result.json
          cmp /tmp/n356-result.json stages/stage32/32-01-178/nodes/N356/RESULT.json
      - name: Diff check
        run: git diff --check
