name: "[Stage32][32-01-178][N356] optimistic exceptional transport cap"

on:
  pull_request:
    paths:
      - "stages/stage32/32-01-178/nodes/N220/**"
      - "stages/stage32/32-01-178/nodes/N345/**"
      - "stages/stage32/32-01-178/nodes/N355/**"
      - "stages/stage32/32-01-178/nodes/N356/**"
      - "stages/stage32/residual-32-01-production/full178-manifest.json"
      - "stages/stage33/33-07/picard_base_rows_retained.py"
      - "stages/stage33/33-07/stage32_picard_marking_retained.py"
      - ".github/workflows/stage32-01-178-n356-optimistic-exceptional-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.x"
      - name: Install exact verifier dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.3.0'
      - name: Replay N356 optimistic exceptional transport census
        run: |
          python stages/stage32/32-01-178/nodes/N356/verify_n356_optimistic_exceptional_transport.py --output /tmp/n356-result.json
          cat /tmp/n356-result.json
      - name: Diff check
        run: git diff --check
