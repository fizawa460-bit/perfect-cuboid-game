name: Stage14-t101 principal centered split

on:
  pull_request:
    paths:
      - 'stages/stage14/14-t101/**'
      - '.github/workflows/stage14-t101.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify predecessors
        run: |
          grep -q 'NEXT=Stage14-t101' stages/stage14/14-t100/boundary.md
          grep -q 'STAGE14_TH27=' stages/stage14/14-tH27/result.md
          grep -q 'NEXT_H_NEEDED=false' stages/stage14/14-tH27/result.md
      - name: Run deterministic audit
        run: python stages/stage14/14-t101/audit.py
      - name: Verify t101 boundary
        run: |
          f=stages/stage14/14-t101/frozen-boundary.txt
          grep -q 'SINGLE_MOVER_BOUNDARY_PRINCIPAL_CENTERED_SPLIT_PROVED=true' "$f"
          grep -q 'TH28_NEEDED=false' "$f"
          grep -q 'NEXT=Stage14-t102' "$f"
