name: Stage12-N1b bootstrap outputs

on:
  pull_request:
    paths:
      - "scripts/audit_shared_p_primitive_joint_stage12_n1b.py"
      - ".github/workflows/stage12-n1b-bootstrap.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage12-n1-primitive-joint
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate report
        run: |
          python scripts/audit_shared_p_primitive_joint_stage12_n1b.py \
            --write-report data/shared_p_primitive_joint_stage12_n1b_report.json
      - name: Commit generated report
        run: |
          rm -f .github/workflows/stage12-n1b-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate Stage12-N1b primitive joint report"
          git push origin HEAD:agent/stage12-n1-primitive-joint
