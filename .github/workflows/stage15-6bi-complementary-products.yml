name: Stage15-6bi complementary products
on:
  pull_request:
    paths:
      - 'stages/stage15/15-6bi/**'
      - 'stages/stage15/evidence/stage15_6bi_complementary_products.json'
      - 'stages/stage15/replay/verify_stage15_6bi.py'
      - 'stages/stage15/scripts/stage15_6bi_complementary_products.py'
      - '.github/workflows/stage15-6bi-complementary-products.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python stages/stage15/replay/verify_stage15_6bi.py
      - run: python -m py_compile stages/stage15/scripts/stage15_6bi_complementary_products.py
