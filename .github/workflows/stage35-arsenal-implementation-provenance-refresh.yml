name: Stage35 Arsenal implementation provenance refresh

on:
  push:
    branches:
      - stage35-arsenal-initial-provisional-harvest-promotion
    paths:
      - .github/workflows/stage35-arsenal-implementation-provenance-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 128

      - name: Pin fresh audited discovery candidate head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C stage35-arsenal-initial-provisional-harvest-promotion "$GITHUB_SHA"
          git fetch origin stage35-arsenal-initial-harvest-discovery main --depth=128
          test "$(git rev-parse origin/main)" = "bd1f40297f8dcf79e5bb4ef0b8cdc13fdb844177"
          test "$(git rev-parse origin/stage35-arsenal-initial-harvest-discovery)" = "2131828e9e775826842d3501fcc39ff214c0c157"
          git merge-base --is-ancestor bd1f40297f8dcf79e5bb4ef0b8cdc13fdb844177 2131828e9e775826842d3501fcc39ff214c0c157
          python3 - <<'PY'
          from pathlib import Path
          old='28282d3f01a47bfedb4290c6219b36dbde89c784'
          new='2131828e9e775826842d3501fcc39ff214c0c157'
          for name in ['docs/stage35-arsenal-promotion.md','docs/arsenal/index.json']:
              p=Path(name)
              text=p.read_text()
              assert old in text, (name, 'old discovery head missing')
              text=text.replace(old,new)
              p.write_text(text)
          PY

      - name: Regenerate Arsenal catalog and cards
        run: python3 -B docs/arsenal/sync_arsenal_catalog.py

      - name: Precommit validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          new='2131828e9e775826842d3501fcc39ff214c0c157'
          old='28282d3f01a47bfedb4290c6219b36dbde89c784'
          data=json.loads(Path('docs/arsenal/index.json').read_text())
          h=next(h for h in data['provisional_harvests'] if h['source_stage']=='Stage35 / Stage35-EX')
          assert h['initial_harvest']['discovery_exact_head'] == new
          assert h['initial_harvest']['harvest_upper_bound'] == '9184c7ab694415592cc428a675c0ebed27cac510'
          assert h['initial_harvest']['range_expanded_after_harvest1'] is False
          assert h['theorem_credit'] is False
          promo=Path('docs/stage35-arsenal-promotion.md').read_text()
          assert f'DISCOVERY_EXACT_HEAD={new}' in promo
          assert old not in promo
          assert old not in Path('docs/arsenal/index.json').read_text()
          PY
          git diff --exit-code bd1f40297f8dcf79e5bb4ef0b8cdc13fdb844177 -- stages/stage35 stages/stage35-ex

      - name: Commit refreshed provenance and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/stage35-arsenal-implementation-provenance-refresh.yml
          git add docs/stage35-arsenal-promotion.md docs/arsenal/index.json docs/arsenal/catalog.md docs/arsenal/cards
          git commit -m 'arsenal: refresh Stage35 discovery provenance'

      - name: Exact-head implementation validation
        shell: bash
        run: |
          set -euo pipefail
          echo "EXACT_IMPLEMENTATION_REFRESH_HEAD=$(git rev-parse HEAD)"
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          git diff --check bd1f40297f8dcf79e5bb4ef0b8cdc13fdb844177 HEAD
          git diff --exit-code bd1f40297f8dcf79e5bb4ef0b8cdc13fdb844177 -- stages/stage35 stages/stage35-ex
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          main='bd1f40297f8dcf79e5bb4ef0b8cdc13fdb844177'
          fresh='2131828e9e775826842d3501fcc39ff214c0c157'
          allowed={
            'docs/stage35-arsenal-promotion.md',
            'docs/arsenal/index.json',
            'docs/arsenal/catalog.md',
            'docs/arsenal/cards/provisional/S35-PW01.md',
            'docs/arsenal/cards/provisional/S35-PW02.md',
            'docs/arsenal/cards/provisional/S35-PW03.md',
            'docs/arsenal/cards/provisional/S35-PW04.md',
            'docs/arsenal/cards/provisional/S35-PW05.md',
            'docs/arsenal/cards/workflows/S35-WF01.md',
          }
          got=set(subprocess.check_output(['git','diff','--name-only',main,'HEAD'], text=True).splitlines())
          assert got == allowed, (got-allowed, allowed-got)
          data=json.loads(Path('docs/arsenal/index.json').read_text())
          h=next(h for h in data['provisional_harvests'] if h['source_stage']=='Stage35 / Stage35-EX')
          assert h['initial_harvest']['discovery_exact_head'] == fresh
          assert h['initial_harvest']['harvest_upper_bound'] == '9184c7ab694415592cc428a675c0ebed27cac510'
          ids=[]; retired={}
          for harvest in data.get('provisional_harvests',[]):
              ids += harvest.get('active_cards',[]) + harvest.get('active_workflows',[])
              retired.update(harvest.get('retired_merged_ids',{}))
          for x in ['S35-PW01','S35-PW02','S35-PW03','S35-PW04','S35-PW05','S35-WF01']:
              assert ids.count(x)==1 and x not in retired
          assert data['firewalls']['arsenal_registration_implies_stage35_progress_increment'] is False
          print('PASS_IMPLEMENTATION_SCOPE_ASSERTION', len(got))
          print('PASS_DISCOVERY_PROVENANCE_HEAD', fresh)
          PY

      - name: Push refreshed exact head
        run: git push origin HEAD:stage35-arsenal-initial-provisional-harvest-promotion
