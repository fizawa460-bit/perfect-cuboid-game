name: Stage25-60 R504 rank-two height audit

on:
  pull_request:
    paths:
      - 'stages/stage25/25-60/r504-rank-two-height-lattice.md'
      - 'stages/stage25/25-60/r504-rank-two-height-audit.py'
      - 'stages/stage25/25-60/r504-rank-two-height-discovery-ledger.md'
      - 'stages/stage25/25-60/r504-exceptional-search-controller.json'
      - '.github/workflows/stage25-60-r504-rank-two-height.yml'
  workflow_dispatch:

jobs:
  rank-two-height-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic verifier dependency
        run: python -m pip install sympy
      - name: Verify rank-two height-lattice premises and minimum physical class
        run: python stages/stage25/25-60/r504-rank-two-height-audit.py
