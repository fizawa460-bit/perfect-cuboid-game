name: Stage33 V91C1X R5B3B3C4B1E 1757 refinement-unit preflight materialize

on:
  push:
    branches:
      - stage33-v91c1x-r5b3b3c4b1e-1757-refinement-unit-preflight
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b1e-1757-refinement-unit-preflight-materialize.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e_1757_refinement_unit_or_cech_cochain_preflight.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2d2-swap23-317-cover-common-refinement.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1d-swap23-tangent-pullback-comparison.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact C4B1E refinement-unit preflight
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e_1757_refinement_unit_or_cech_cochain_preflight.py --write
      - name: Enforce artifact-only bounded delta
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e-1757-refinement-unit-or-cech-cochain-preflight.json'
          changed="$(git status --porcelain | sed 's/^...//')"
          test -n "$changed"
          test "$changed" = "$artifact"
          git diff --check
      - name: Commit generated certificate
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e-1757-refinement-unit-or-cech-cochain-preflight.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$artifact"
          git diff --cached --quiet || git commit -m '[Stage33] materialize C4B1E 1757 refinement-unit preflight artifact'
          git push
