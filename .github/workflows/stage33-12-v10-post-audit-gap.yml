name: Stage33-12 V10 post-audit source-gap replay

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify audit receipt and narrowed named-J2 source gap
        run: |
          python stages/stage33/33-12/verify_j2_named_order4_actual_s3_source_lock_gap_v10.py
          python stages/stage33/33-12/verify_j2_order4_retained_pullback_row_availability_v11.py
          git diff --check
