name: Stage32EX3 MAIN O210 V2 corrected remap once

on:
  push:
    branches:
      - stage32ex3-ex3-00-typed-cover-tower
    paths:
      - '.github/workflows/stage32ex3-main-o210-v2-remap-fixed-once.yml'

permissions:
  contents: write

jobs:
  remap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage32ex3-ex3-00-typed-cover-tower
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply corrected provisional MAIN O210 V2 remap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, hashlib, json
          from pathlib import Path

          REG=Path('stages/stage32/proof/CLAIM-REGISTRY.json')
          ACTIVE=Path('stages/stage32/proof/ACTIVE-FRONTIER.json')
          LANES=Path('stages/stage32/proof/LANE-ADAPTERS.json')
          AV=Path('stages/stage32/proof/verify_stage32_active_frontier.py')
          DAG=Path('stages/stage32/proof/verify_stage32_claim_dag.py')
          HIST=Path('stages/stage32/proof/historical-routing-blobs/93dee109899185602d9e8e4bb200f614a3b421e0.json')
          STATE=Path('stages/stage32-ex3/MAIN-STATE.json')
          REPLAY=Path('.github/workflows/stage32ex3-ex3-09-retained-exact-replay.yml')

          OLD='S32.O210.EXCLUSION.V1'
          NEW='S32.O210.EXCLUSION.V2'
          CTX='S32.MAIN.CURRENT_TARGET_CONTEXT.V1'
          EX3='S32.EX3.O210_COVER_GEOMETRY_EXCLUSION_TERMINAL.V1'
          AD1='S32.ADAPTER.EX3_O210_TO_MAIN_O210.V1'
          AD2='S32.ADAPTER.EX3_O210_TO_MAIN_O210.V2'
          V3='S32.ADAPTER.EX3_O210_TO_MAIN_O210.V3'
          CORE='178c0a8a381abacbfb5662f44f2faab2f2f6076f4be653172f7e586f77476746'
          CORE_KEYS=['claim_id','kind','statement','scope_key','scope','proves','does_not_prove','requires','source_locks','replay_verifier']
          def csha(x): return hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          def bsha(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()

          # Preserve exact pre-remap ACTIVE-FRONTIER bytes for historical V1/V2 adapter locks.
          active_bytes=ACTIVE.read_bytes()
          assert bsha(active_bytes)=='93dee109899185602d9e8e4bb200f614a3b421e0'
          HIST.parent.mkdir(parents=True,exist_ok=True)
          HIST.write_bytes(active_bytes)
          assert bsha(HIST.read_bytes())=='93dee109899185602d9e8e4bb200f614a3b421e0'

          reg=json.loads(REG.read_text())
          by={c['claim_id']:c for c in reg['claims']}
          assert OLD not in by and NEW not in by
          assert by[EX3]['authority_status']=='AUDITED' and by[EX3]['audit_receipt']['review_id']==5141988194
          assert by[V3]['authority_status']=='AUDITED' and by[V3]['audit_receipt']['review_id']==5143014619
          assert by[AD1]['authority_status']=='SUPERSEDED'
          assert by[AD2]['authority_status']=='AUDITED' and by[AD2]['audit_receipt']['review_id']==5142601472
          # V2 remains an audited historical fact, but V3 supersedes it as current bridge because V2 locks mutable frontier bytes.
          by[AD2]['authority_status']='SUPERSEDED'

          active=json.loads(ACTIVE.read_text()); active_before=copy.deepcopy(active)
          old_idx=next(i for i,c in enumerate(active['claims']) if c['claim_id']==OLD)
          old=copy.deepcopy(active['claims'][old_idx])
          assert old['authority_status']=='DECLARED_GOAL'
          assert old['scope']=={'row_id':'g1-d186','picard_class':'V6','O':210,'qprime':4,'target':'population_wide_exclusion'}
          assert old['claim_core_sha256']=='38124e42fde826b6e3abf89b945d3633edf29cad9ccc21ad2140b99b77727d6c'
          historical={k:v for k,v in old.items() if k not in {'frontier_status','blockers','lane_links'}}
          historical['authority_status']='SUPERSEDED'; historical['audit_receipt']=None
          assert historical['claim_core_sha256']==csha({k:historical[k] for k in CORE_KEYS})
          reg['claims'].append(historical)

          new={
            'claim_id':NEW,'kind':'mathematical_claim',
            'statement':'Under the exact current g1-d186, V6, qprime=4 receiver semantics, the full O=210 carrier/cover population is excluded because the hostile-audited Stage32EX3 population-wide exclusion transfers through the hostile-audited drift-robust population-identity adapter V3.',
            'scope_key':'S32.O210.COVER',
            'scope':{'row_id':'g1-d186','picard_class':'V6','O':210,'qprime':4,'target':'population_wide_exclusion'},
            'proves':['O210 is excluded for the exact registered Stage32 target population once this MAIN claim itself is AUDITED.'],
            'does_not_prove':['This PROVISIONAL active remap is not hostile-audit PASS for the MAIN O210 claim.','It does not by itself exclude Q602 or alter the audited survivor set [73,97,235].','It does not prove Stage32 closure or any Perfect Cuboid endpoint.'],
            'requires':[CTX,EX3,V3],
            'source_locks':[
              {'path':'stages/stage32-ex3/ex3-09-o210-cover-geometry-exclusion-candidate.json','blob_sha1':'0114531c52730730e9a35ad1c8d8aea21eed03e9','canonical_sha256':'9244f82daef79306abe99d8a3ccee111c80c4c057f1b5f7df3bafd5500d8ca21'},
              {'path':'stages/stage32-ex3/ex3-10-main-o210-promotion-adapter-candidate-v3.json','blob_sha1':'dd548d20e4f9bd007395606a5450d1ffc964cde9','canonical_sha256':'63dc72b89f59709fcce13cbc4e9c777819a419f7b6213a6ccd2c7c5977fce37c'}
            ],
            'replay_verifier':'stages/stage32-ex3/verify_main_o210_exclusion_v2_candidate.py',
            'authority_status':'PROVISIONAL','audit_receipt':None,'frontier_status':'ACTIVE_INCOMPLETE',
            'blockers':['Hostile audit of the explicit MAIN O210 V2 claim has not yet been performed.'],
            'lane_links':[{'lane':'MAIN','role':'OWNER'},{'lane':'EX3','role':'ATTACKS'}]
          }
          new['claim_core_sha256']=csha({k:new[k] for k in CORE_KEYS}); assert new['claim_core_sha256']==CORE
          active['claims'][old_idx]=new
          before_by={c['claim_id']:c for c in active_before['claims']}; after_by={c['claim_id']:c for c in active['claims']}
          for cid,obj in before_by.items():
              if cid!=OLD: assert after_by[cid]==obj, cid
          ACTIVE.write_text(json.dumps(active,separators=(',',':'))+'\n')
          REG.write_text(json.dumps(reg,separators=(',',':'))+'\n')

          lanes=json.loads(LANES.read_text()); lanes_before=copy.deepcopy(lanes)
          touched=[]
          for lane in lanes['lanes']:
              refs=lane.get('active_frontier_refs',[])
              if OLD in refs:
                  assert lane['lane'] in {'MAIN','EX3'}
                  lane['active_frontier_refs']=[NEW if x==OLD else x for x in refs]
                  touched.append(lane['lane'])
          assert sorted(touched)==['EX3','MAIN']
          ex3lane=next(x for x in lanes['lanes'] if x['lane']=='EX3')
          ex3lane['claim_refs']=[x for x in ex3lane['claim_refs'] if x not in {AD1,AD2}]
          assert V3 in ex3lane['claim_refs'] and EX3 in ex3lane['claim_refs']
          ex3lane['notes']=('EX3 terminal O210 exclusion is AUDITED (review 5141988194) and drift-robust adapter V3 is the current AUDITED bridge (review 5143014619). Adapter V1/V2 are retained only as SUPERSEDED provenance. Active MAIN O210 routing is remapped to S32.O210.EXCLUSION.V2 as PROVISIONAL; no MAIN O210 credit exists before hostile audit of that explicit MAIN claim and separate receipt synchronization.')
          before={x['lane']:x for x in lanes_before['lanes']}; after={x['lane']:x for x in lanes['lanes']}
          for lane,obj in before.items():
              if lane not in {'MAIN','EX3'}: assert after[lane]==obj, lane
          LANES.write_text(json.dumps(lanes,indent=2)+'\n')

          text=AV.read_text(); old_line='    "S32.O210.EXCLUSION.V1",'; new_line='    "S32.O210.EXCLUSION.V2",'
          assert text.count(old_line)==1; AV.write_text(text.replace(old_line,new_line))

          # Extend historical-routing provenance to the one mutable ACTIVE-FRONTIER file.
          dag=DAG.read_text()
          old_fn='''def _is_mutable_routing_state(lock: dict) -> bool:\n    path = lock.get("path")\n    return isinstance(path, str) and path.endswith("/MAIN-STATE.json")\n'''
          new_fn='''def _is_mutable_routing_state(lock: dict) -> bool:\n    path = lock.get("path")\n    return isinstance(path, str) and (\n        path.endswith("/MAIN-STATE.json")\n        or path == "stages/stage32/proof/ACTIVE-FRONTIER.json"\n    )\n'''
          assert dag.count(old_fn)==1
          dag=dag.replace(old_fn,new_fn)
          dag=dag.replace('A MAIN-STATE.json lock attached to DECLARED_GOAL/SUPERSEDED/REVOKED records is','A mutable routing-state lock attached to DECLARED_GOAL/SUPERSEDED/REVOKED records is')
          DAG.write_text(dag)

          state=json.loads(STATE.read_text())
          assert state['candidate_frontier']['promotion_adapter_v3_audited'] is True
          assert state['credit']['O210_excluded'] is False and state['credit']['stage32_main_credit'] is False
          state['schema']='STAGE32EX3_MAIN_COMPACT_STATE_V1_MAIN_O210_V2_PROVISIONAL_ACTIVE_AUDIT_PENDING'
          state['current'].update({'status':'MAIN_O210_V2_PROVISIONAL_ACTIVE_REMAP_AUDIT_PENDING','subroute':'MAIN_O210_V2_HOSTILE_AUDIT_HANDOFF','objective':'Hostile-audit the explicit MAIN O210 V2 claim derived from audited EX3 terminal plus audited V3; do not grant MAIN credit before PASS receipt synchronization.','next_route_on_success':'MAIN_O210_V2_HOSTILE_AUDIT','next_route_on_block':'REPAIR_MAIN_O210_V2_OR_REVERT_TO_OPEN_GOAL_WITH_AUDITED_EX3_V3_PRESERVED','stop_semantics':'MAIN_O210_V2_PROVISIONAL_ONLY_O210_EXCLUDED_FALSE_NO_O212_ADVANCE_NO_MERGE'})
          cf=state['candidate_frontier']; cf.update({'main_o210_active_claim_id':NEW,'main_o210_v2_core_sha256':CORE,'main_o210_v2_registered_provisional':True,'main_o210_v2_hostile_audited':False,'main_o210_v1_superseded_to_history':True,'active_frontier_remap_complete':True,'promotion_adapter_v2_superseded_after_v3_audit':True})
          leaf2=state['retained_leaves']['EX3_10_PROMOTION_ADAPTER_V2']; leaf2['status']='RETAINED_AUDITED_PROVENANCE_SUPERSEDED_BY_V3_FOR_FRONTIER_REMAP'; leaf2['credit_ceiling']='HISTORICAL_AUDITED_SCOPE_ADAPTER_PROVENANCE_NO_CURRENT_PROMOTION'
          mg=state['management']; mg.update({'claim_sync_trigger':'ACTIVE_FRONTIER_REMAP','claim_sync_status':'COMPLETE_MAIN_O210_V2_PROVISIONAL_ACTIVE_REMAP_AUDIT_PENDING_NO_MAIN_CREDIT','active_frontier_not_remapped_by_this_transition':False,'active_frontier_remap_claim_id':NEW,'active_frontier_remap_authority':'PROVISIONAL','main_o210_v2_hostile_audit_required':True,'promotion_adapter_claim_id':V3,'promotion_adapter_core_sha256':'55505658e272ec7d60372f2d67cb93c9c007d782145f18d5ef9d2c1146582c88','promotion_adapter_authority':'AUDITED','promotion_adapter_audit_review_id':5143014619,'promotion_adapter_audited_exact_head':'280595ed892ae2ef70e049a3f722ea024452e206'})
          state['promotion_adapter']['status']='AUDITED_PROVENANCE_SUPERSEDED_BY_V3_FOR_FRONTIER_REMAP'; state['promotion_adapter']['main_O210_promotion_complete']=False
          state['main_o210_v2']={'status':'RETAINED_PROVISIONAL_ACTIVE_CLAIM_AUDIT_PENDING','claim_id':NEW,'claim_core_sha256':CORE,'requires':[CTX,EX3,V3],'hostile_audit_required':True,'hostile_audit_result':None,'main_O210_promotion_complete':False,'credit_ceiling':'PROVISIONAL_MAIN_O210_ACTIVE_CLAIM_ONLY_NO_O210_EXCLUSION_CREDIT'}
          for p in ['stages/stage32-ex3/main-o210-exclusion-v2-candidate.json','stages/stage32-ex3/verify_main_o210_exclusion_v2_candidate.py','stages/stage32/proof/ACTIVE-FRONTIER.json','stages/stage32/proof/verify_stage32_active_frontier.py','stages/stage32/proof/verify_stage32_claim_dag.py']:
              if p not in state['current_leaf_working_set']: state['current_leaf_working_set'].append(p)
          for key in ['stage32_main_credit','Q602_excluded','O210_excluded','receiver_credit','theorem_credit','endpoint_credit']: assert state['credit'][key] is False
          for key in ['stage32_main_credit','Q602_excluded','O210_excluded','O212_plus_advance_allowed','stage32_closed']: assert state['firewalls'][key] is False
          STATE.write_text(json.dumps(state,indent=2)+'\n')

          replay=REPLAY.read_text(); needle='          python stages/stage32-ex3/verify_ex3_10_main_o210_promotion_adapter_candidate_v3.py\n'; addition=needle+'          python stages/stage32-ex3/verify_main_o210_exclusion_v2_candidate.py\n'
          if 'verify_main_o210_exclusion_v2_candidate.py' not in replay:
              assert replay.count(needle)==1; replay=replay.replace(needle,addition)
          REPLAY.write_text(replay)
          print('ACTIVE_FRONTIER_REMAP',OLD,'->',NEW,CORE)
          print('ADAPTER_V1_V2_SUPERSEDED_V3_CURRENT_AUDITED')
          print('MAIN_O210_CREDIT_FALSE_AUDIT_PENDING')
          PY

      - name: Replay audited dependencies and provisional MAIN O210 V2
        run: |
          python stages/stage32-ex3/verify_ex3_09_o210_cover_geometry_exclusion_candidate.py
          python stages/stage32-ex3/verify_ex3_10_main_o210_promotion_adapter_candidate_v3.py
          python stages/stage32-ex3/verify_main_o210_exclusion_v2_candidate.py
          python stages/stage32-ex3/verify_main_state.py
      - name: Verify Stage32 claim DAG and remapped active frontier
        run: |
          python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Diff guard
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          changed="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/stage32ex3-ex3-09-retained-exact-replay.yml' \
            'stages/stage32-ex3/MAIN-STATE.json' \
            'stages/stage32/proof/ACTIVE-FRONTIER.json' \
            'stages/stage32/proof/CLAIM-REGISTRY.json' \
            'stages/stage32/proof/LANE-ADAPTERS.json' \
            'stages/stage32/proof/historical-routing-blobs/93dee109899185602d9e8e4bb200f614a3b421e0.json' \
            'stages/stage32/proof/verify_stage32_active_frontier.py' \
            'stages/stage32/proof/verify_stage32_claim_dag.py' | sort)"
          printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
      - name: Commit corrected provisional MAIN O210 V2 remap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/stage32ex3-ex3-09-retained-exact-replay.yml stages/stage32-ex3/MAIN-STATE.json stages/stage32/proof/ACTIVE-FRONTIER.json stages/stage32/proof/CLAIM-REGISTRY.json stages/stage32/proof/LANE-ADAPTERS.json stages/stage32/proof/historical-routing-blobs/93dee109899185602d9e8e4bb200f614a3b421e0.json stages/stage32/proof/verify_stage32_active_frontier.py stages/stage32/proof/verify_stage32_claim_dag.py
          git commit -m '[Stage32EX3][claim-sync] remap MAIN O210 V2 provisional, audit pending'
          git push origin HEAD:stage32ex3-ex3-00-typed-cover-tower
