name: Stage32-18R d16 b14 rescue-aware global integration

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage32/runkeys/18r-b14-rescue-aware-global-integration.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-18r-b14-global-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-run-key:
    runs-on: ubuntu-latest
    outputs:
      generation: ${{ steps.key.outputs.generation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate commit-range authorization
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          test -n "$BEFORE" && test -n "$AFTER"
          mapfile -t changed < <(git diff --name-only "$BEFORE" "$AFTER")
          printf 'authorized change: %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'stages/stage32/runkeys/18r-b14-rescue-aware-global-integration.json'
          test "$(git log -1 --pretty=%s "$AFTER")" = 'Stage32-18R: ARM FINAL B14 INTEGRATION'
      - id: key
        name: Validate explicit union final-integration key
        run: |
          python - <<'PY'
          import json,os,pathlib,re
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18r-b14-rescue-aware-global-integration.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1'
          assert d['workflow']=='stage32-18r-d16-b14-rescue-aware-global-integration'
          assert d['armed'] is True and d['generation']==1
          assert d['bound']==14 and d['breaker_count']==256
          assert d['legacy_run_id']==32915934318
          assert isinstance(d['resume_run_id'],int) and d['resume_run_id']>0
          assert isinstance(d['source_snapshot_artifact_id'],int) and d['source_snapshot_artifact_id']>0
          assert re.fullmatch(r'[0-9a-f]{64}',d['source_snapshot_artifact_zip_sha256'])
          assert d['prepared_artifact_id']==9588229672
          assert d['prepared_artifact_zip_sha256']=='6e4e6e5350717296f0e76e5c972e945b72a61d32e039718a535e245826b5b159'
          assert d['pilot_run_id']==32912029522 and d['pilot_packet_ids_reused']==[63,64,173]
          assert d['hot_run_id']==32924346866 and d['hot_primary_residues']==[26,748]
          assert d['hot26_artifact_id']==9591499652 and d['hot26_artifact_zip_sha256']=='d337a178ae3b156236903aca46f12e5ad8c04348519212526b98a67b5885fd37'
          assert d['hot748_artifact_id']==9591500024 and d['hot748_artifact_zip_sha256']=='c120a9c14ba8575de1df86dc02f928bfa049aa6d344ff5b969182708aaea2d4a'
          assert d['audited_b12_artifact_id']==9585370018
          assert d['audited_b12_artifact_zip_sha256']=='6e702a36e427a0c2360ca14bfd6e7f003b6960566ad2a1c9b48ab721c396c658'
          assert d['bulk_packet_ids_excluded']==[0,15,63,64,173]
          assert d['handoff_policy']=='UNION_SNAPSHOT_V2_EXACT_COMPLEMENT'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('generation=1\n')
          print(json.dumps(d,sort_keys=True))
          PY

  integrate-and-verify:
    needs: validate-run-key
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch exact union handoff, pilot, audited 18S hot parents, and b12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18r-b14-rescue-aware-global-integration.json').read_text())
          cmd=['python','stages/stage32/32-18R/fetch_b14_integration_inputs.py',
            '--repo',os.environ['GITHUB_REPOSITORY'],
            '--legacy-run-id',str(d['legacy_run_id']),
            '--resume-run-id',str(d['resume_run_id']),
            '--snapshot-artifact-id',str(d['source_snapshot_artifact_id']),
            '--snapshot-artifact-zip-sha256',d['source_snapshot_artifact_zip_sha256'],
            '--prepared-artifact-id',str(d['prepared_artifact_id']),
            '--prepared-artifact-zip-sha256',d['prepared_artifact_zip_sha256'],
            '--pilot-run-id',str(d['pilot_run_id']),
            '--hot-run-id',str(d['hot_run_id']),
            '--hot26-artifact-id',str(d['hot26_artifact_id']),
            '--hot26-artifact-zip-sha256',d['hot26_artifact_zip_sha256'],
            '--hot748-artifact-id',str(d['hot748_artifact_id']),
            '--hot748-artifact-zip-sha256',d['hot748_artifact_zip_sha256'],
            '--b12-artifact-id',str(d['audited_b12_artifact_id']),
            '--b12-artifact-zip-sha256',d['audited_b12_artifact_zip_sha256'],
            '--output',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'inputs')]
          subprocess.run(cmd,check=True)
          PY
          python - <<'PY'
          import json,os,pathlib
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'inputs/artifact-inventory.json').read_text())
          assert d['handoff_exact'] is True
          assert d['legacy_packet_count']+d['resume_complement_packet_count']==251
          assert d['carryover_packet_count']+d['current_resume_packet_count']==d['resume_complement_packet_count']
          assert len(d['bulk_packet_sources'])==251
          assert d['hot_artifact_ids']=={'26':9591499652,'748':9591500024}
          print({'handoff':'PASS','legacy':d['legacy_packet_count'],'resume':d['resume_complement_packet_count'],
                 'carry':d['carryover_packet_count'],'current':d['current_resume_packet_count'],'artifact_count':len(d['artifacts'])})
          PY
      - name: Build exact rescue-aware global b14 aggregate
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python stages/stage32/32-18R/aggregate_b14_rescue_aware.py \
            --bulk "$RUNNER_TEMP/inputs/bulk" \
            --pilot "$RUNNER_TEMP/inputs/pilot" \
            --hot "$RUNNER_TEMP/inputs/hot" \
            --manifest "$RUNNER_TEMP/inputs/prepared/packet-manifest.json" \
            --audited-b12-dump "$RUNNER_TEMP/inputs/b12/d16-b12-exact-final-aggregate.bin" \
            --inventory "$RUNNER_TEMP/inputs/artifact-inventory.json" \
            --output-json "$RUNNER_TEMP/out/d16-b14-exact-rescue-aware-aggregate.json" \
            --output-dump "$RUNNER_TEMP/out/d16-b14-exact-rescue-aware-aggregate.bin" \
            --certificate "$RUNNER_TEMP/out/stage32-18r-b14-certificate.json"
          cp "$RUNNER_TEMP/inputs/artifact-inventory.json" "$RUNNER_TEMP/out/"
      - name: Independently full-Aut verify final b14 aggregate
        run: |
          python stages/stage32/32-18B/verify_d16_bound_canonical.py \
            --aut "$RUNNER_TEMP/inputs/prepared/d16-aut-action.json" \
            --dump "$RUNNER_TEMP/out/d16-b14-exact-rescue-aware-aggregate.bin" \
            --enum-json "$RUNNER_TEMP/out/d16-b14-exact-rescue-aware-aggregate.json" \
            --output "$RUNNER_TEMP/out/d16-b14-exact-rescue-aware-aggregate-verify.json" \
            --bound 14
      - name: Enforce hostile-audit stop
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          c=json.loads((r/'stage32-18r-b14-certificate.json').read_text()); v=json.loads((r/'d16-b14-exact-rescue-aware-aggregate-verify.json').read_text())
          assert c['verdict']=='PASS_EXACT_RESCUE_AWARE_D16_B14_PRODUCTION_PENDING_HOSTILE_AUDIT'
          assert c['logical_packet_partition_exact'] is True and c['logical_residue_partition_exact'] is True
          assert c['legacy_frozen_packet_count']+c['resume_complement_packet_count']==251
          assert c['carryover_packet_count']+c['current_resume_packet_count']==c['resume_complement_packet_count']
          assert c['audited_b12_predecessor_set_identical'] is True and c['TRAVERSAL_COMPLETENESS_CERTIFICATE'] is True
          assert c['GLOBAL_B14_AGGREGATION_COMPLETE'] is True
          assert c['D16_B14_NUMERICAL_CREDIT'] is False and c['D16_B14_NUMERICAL_CREDIT_PENDING_HOSTILE_AUDIT'] is True
          assert c['FULL_D16_G0_ROW_COMPLETE'] is False and c['THEOREM_CREDIT'] is False and c['RECEIVER_CREDIT'] is False and c['CONTROLLER_MODIFIED'] is False
          assert v['aut_group_order']==1536 and v['canonical_survivors_including_zero']==c['canonical_survivors_including_zero']
          print(json.dumps({'certificate':c,'aut_verify':v},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18r-d16-b14-final-production-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/out/
          retention-days: 14
          if-no-files-found: error
