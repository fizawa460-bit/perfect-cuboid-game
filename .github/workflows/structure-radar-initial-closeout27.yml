name: StructureRadar initial closeout27
on: pull_request
permissions:
  contents: write
jobs:
  closeout:
    if: github.head_ref == 'structure-radar-initial-closeout-27'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize audited initial-campaign closeout
        run: |
          python - <<'PY'
          import json, pathlib, re

          script_path = pathlib.Path('scripts/structure_radar.py')
          s = script_path.read_text()

          old = 'def build_controller(manifest: dict[str, Any], queue: dict[str, Any], registry: dict[str, Any]) -> dict[str, Any]:'
          new = 'def build_controller(manifest: dict[str, Any], queue: dict[str, Any], registry: dict[str, Any], progress: dict[str, Any]) -> dict[str, Any]:'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    campaign_close = (\n        source_complete\n        and unresolved_search == 0\n        and unresolved_decisions == 0\n        and stale_cards == 0\n        and not manifest["arsenal_backflow_gaps"]\n        and bool(registry.get("structures"))\n    )\n    return {\n'''
          new = '''    campaign_close = (\n        source_complete\n        and unresolved_search == 0\n        and unresolved_decisions == 0\n        and stale_cards == 0\n        and not manifest["arsenal_backflow_gaps"]\n        and bool(registry.get("structures"))\n    )\n    closeout = progress.get("campaign_closeout") or {}\n    campaign_closed = (\n        campaign_close\n        and closeout.get("status") == "CLOSED"\n        and closeout.get("final_audit_verdict") == "PASS"\n        and closeout.get("corpus_fingerprint") == manifest["corpus_fingerprint"]\n    )\n    return {\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '        "status": "READY" if ready else ("AUDIT_REQUIRED" if campaign_close else "WAITING_FOR_REGISTRY_WORK"),'
          new = '        "status": "CLOSED" if campaign_closed else ("READY" if ready else ("AUDIT_REQUIRED" if campaign_close else "WAITING_FOR_REGISTRY_WORK")),'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            "arsenal_backflow_clear": not manifest["arsenal_backflow_gaps"],\n            "final_independent_audit_required": True,\n            "campaign_close_allowed_before_final_audit": campaign_close,\n        },\n        "next_expected_command": "StructureRadar-main-batch" if ready else "StructureRadar-audit" if campaign_close else "StructureRadar-main-batch",\n'''
          new = '''            "arsenal_backflow_clear": not manifest["arsenal_backflow_gaps"],\n            "final_independent_audit_required": not campaign_closed,\n            "final_independent_audit_completed": campaign_closed,\n            "campaign_close_allowed_before_final_audit": campaign_close and not campaign_closed,\n            "campaign_closed": campaign_closed,\n        },\n        "post_close": {\n            "phase": "EXTERNAL_GATE_CLOSURE" if campaign_closed else None,\n            "initial_campaign_closed": campaign_closed,\n            "reopen_on_corpus_change": True,\n        },\n        "next_expected_command": "StructureRadar-main-batch" if campaign_closed or ready else "StructureRadar-audit" if campaign_close else "StructureRadar-main-batch",\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    controller = build_controller(manifest, queue, registry)\n'''
          new = '''    controller = build_controller(manifest, queue, registry, progress)\n'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''        if not re.fullmatch(r"[0-9a-f]{64}", review.get("fingerprint", "")):\n            die(f"invalid progress fingerprint: {source_id}")\n\n\ndef build_controller'''
          replacement = '''        if not re.fullmatch(r"[0-9a-f]{64}", review.get("fingerprint", "")):\n            die(f"invalid progress fingerprint: {source_id}")\n    closeout = progress.get("campaign_closeout")\n    if closeout is not None:\n        required = {\n            "campaign_id",\n            "status",\n            "corpus_fingerprint",\n            "final_audit_pr",\n            "final_audit_head",\n            "final_audit_merge_commit",\n            "final_audit_verdict",\n            "closed_at",\n            "next_phase",\n            "reopen_on_corpus_change",\n        }\n        missing = sorted(required - set(closeout))\n        if missing:\n            die("campaign closeout missing: " + ", ".join(missing))\n        if closeout["status"] != "CLOSED" or closeout["final_audit_verdict"] != "PASS":\n            die("invalid campaign closeout status")\n        if not re.fullmatch(r"[0-9a-f]{64}", closeout["corpus_fingerprint"]):\n            die("invalid campaign closeout fingerprint")\n        for key in ("final_audit_head", "final_audit_merge_commit"):\n            if not re.fullmatch(r"[0-9a-f]{40}", closeout[key]):\n                die(f"invalid campaign closeout {key}")\n\n\ndef build_controller'''
          assert marker in s
          s = s.replace(marker, replacement, 1)
          script_path.write_text(s)

          progress_path = pathlib.Path('docs/structure-radar/progress.json')
          progress = json.loads(progress_path.read_text())
          assert 'campaign_closeout' not in progress
          progress['campaign_closeout'] = {
              'campaign_id': 'SR-INITIAL-CAMPAIGN-R01',
              'status': 'CLOSED',
              'corpus_fingerprint': '937a4303232691693ac14a8b5d4b647df29924ccd17f6d8b402f411427b58492',
              'final_audit_pr': 1196,
              'final_audit_head': '1f9664fe89643d0f2d3d2491e28c4c70a0b90ab7',
              'final_audit_merge_commit': 'c5f7bec47c0e037ebf048c1ddd713726b2bb408e',
              'final_audit_verdict': 'PASS',
              'closed_at': '2026-08-19T16:50:02+09:00',
              'next_phase': 'EXTERNAL_GATE_CLOSURE',
              'reopen_on_corpus_change': True,
          }
          progress_path.write_text(json.dumps(progress, indent=2, ensure_ascii=False) + '\n')

          pathlib.Path('docs/structure-radar/INITIAL-CAMPAIGN-CLOSED.md').write_text('''# StructureRadar initial campaign — CLOSED\n\nCAMPAIGN_ID=SR-INITIAL-CAMPAIGN-R01\nSTATUS=CLOSED\nCLOSED_AT=2026-08-19T16:50:02+09:00\nCORPUS_FINGERPRINT=937a4303232691693ac14a8b5d4b647df29924ccd17f6d8b402f411427b58492\nSOURCE_COUNT=2556\nSTRUCTURE_COUNT=228\nUNRESOLVED_SEARCH=0\nPENDING_ARSENAL_DECISION=0\nQUEUE_TASKS=0\nARSENAL_BACKFLOW_GAPS=0\nFINAL_AUDIT_PR=1196\nFINAL_AUDIT_HEAD=1f9664fe89643d0f2d3d2491e28c4c70a0b90ab7\nFINAL_AUDIT_MERGE_COMMIT=c5f7bec47c0e037ebf048c1ddd713726b2bb408e\nFINAL_AUDIT_VERDICT=PASS\nNEXT_PHASE=EXTERNAL_GATE_CLOSURE\nREOPEN_ON_CORPUS_CHANGE=true\nNEXT_EXPECTED_COMMAND=StructureRadar-main-batch\n\nThe initial repository-wide StructureRadar census/search/Arsenal/backflow campaign is closed at the audited corpus fingerprint above. The close marker is fingerprint-bound: a future merged source or changed canonical source changes the corpus fingerprint and automatically removes CLOSED status after refresh, preserving future-stage auto-discovery.\n\nThis lifecycle closeout introduces no new mathematical theorem, no new Arsenal promotion, no whole-family exponent improvement, and no perfect-cuboid existence/nonexistence claim. Post-close work resumes at the explicit EXTERNAL_GATE_CLOSURE phase.\n''')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python - <<'PY'
          import json
          c=json.load(open('docs/structure-radar/controller.json'))
          assert c['status']=='CLOSED', c['status']
          assert c['close_conditions']['campaign_closed'] is True
          assert c['close_conditions']['final_independent_audit_completed'] is True
          assert c['close_conditions']['final_independent_audit_required'] is False
          assert c['close_conditions']['campaign_close_allowed_before_final_audit'] is False
          assert c['post_close']['phase']=='EXTERNAL_GATE_CLOSURE'
          assert c['next_expected_command']=='StructureRadar-main-batch'
          assert c['queue']['task_count']==0
          assert c['registry']['unresolved_search_count']==0
          assert c['registry']['pending_arsenal_decision_count']==0
          assert c['corpus']['arsenal_backflow_gaps']==[]
          print('STATUS',c['status'])
          print('POST_CLOSE_PHASE',c['post_close']['phase'])
          PY
          rm .github/workflows/structure-radar-initial-closeout27.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'StructureRadar: close initial campaign'
          git push
