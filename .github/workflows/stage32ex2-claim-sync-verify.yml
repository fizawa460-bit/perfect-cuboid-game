name: stage32ex2-claim-sync-verify

on:
  push:
    branches:
      - stage32ex2-ex2-00-source-lock-continuation
    paths:
      - 'stages/stage32-ex2/MAIN-STATE.json'
      - 'stages/stage32-ex2/verify_main_state.py'
      - 'stages/stage32/proof/CLAIM-REGISTRY.json'
      - 'stages/stage32/proof/LANE-ADAPTERS.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact EX2 replay dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify current-main reconciliation
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "70265586b3f97be21c7621af73f443311f1f3fa3"
      - name: Verify Stage32 claim DAG integrity
        run: python -B stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify Stage32 active frontier
        run: python -B stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Verify EX2-04A
        run: python -B stages/stage32-ex2/verify_ex2_04a_two_divisor_section_pencil.py
      - name: Verify EX2-04B
        run: python -B stages/stage32-ex2/verify_ex2_04b_third_section_valuation_separation.py
      - name: Verify Stage32EX2 state
        run: python -B stages/stage32-ex2/verify_main_state.py
