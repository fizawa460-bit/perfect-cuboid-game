name: Stage32EX3 MAIN O210 V3 repair launcher

# one-shot launcher; bot commit excludes workflow-file mutation because GITHUB_TOKEN lacks workflows permission
on:
  push:
    branches:
      - stage32ex3-ex3-00-typed-cover-tower
    paths:
      - '.github/workflows/stage32ex3-main-o210-v3-repair-launch-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage32ex3-ex3-00-typed-cover-tower
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V3 repair
        run: python stages/stage32-ex3/apply_main_o210_v3_repair_once.py
      - name: Replay repaired package
        run: |
          python stages/stage32-ex3/verify_ex3_09_o210_cover_geometry_exclusion_candidate.py
          python stages/stage32-ex3/verify_ex3_10_main_o210_promotion_adapter_candidate_v3.py
          python stages/stage32-ex3/verify_main_o210_exclusion_v3_candidate.py
          python stages/stage32-ex3/verify_main_state.py
          python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Guard and commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/stage32ex3-ex3-09-retained-exact-replay.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          python - <<'PY'
          import subprocess
          expected={
            'stages/stage32-ex3/main-o210-exclusion-v3-candidate.json',
            'stages/stage32-ex3/verify_main_o210_exclusion_v3_candidate.py',
            'stages/stage32-ex3/MAIN-STATE.json',
            'stages/stage32/proof/ACTIVE-FRONTIER.json',
            'stages/stage32/proof/CLAIM-REGISTRY.json',
            'stages/stage32/proof/LANE-ADAPTERS.json',
            'stages/stage32/proof/verify_stage32_active_frontier.py',
          }
          got={x[3:] for x in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()}
          assert got==expected,(got,expected)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage32-ex3/main-o210-exclusion-v3-candidate.json stages/stage32-ex3/verify_main_o210_exclusion_v3_candidate.py stages/stage32-ex3/MAIN-STATE.json stages/stage32/proof/ACTIVE-FRONTIER.json stages/stage32/proof/CLAIM-REGISTRY.json stages/stage32/proof/LANE-ADAPTERS.json stages/stage32/proof/verify_stage32_active_frontier.py
          git commit -m '[Stage32EX3][claim-sync] replace failed MAIN O210 V2 core with authority-neutral V3'
          git push origin HEAD:stage32ex3-ex3-00-typed-cover-tower
