name: Stage33 V91C1X R5B3B3C2B novel20 action-orbit preflight check

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay C2A reused-prime partition
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c2a_reused_prime_refinement_partition.py
      - name: Verify C2B novel20 certified-action orbit partition
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c2b_novel20_surface_action_orbit_preflight.py
      - name: Verify live Stage33 state remains synchronized
        run: python stages/stage33/sync_main_state.py --check
      - name: Diff hygiene and read-only cleanliness
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
