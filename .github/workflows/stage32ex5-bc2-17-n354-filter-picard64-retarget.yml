name: Stage32EX5 BC2-17 N354-filter Picard64 retarget

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_17_n354_filter_picard64_retarget.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_03_generic_indexed_terminal_adaptive_exceptional_partition.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-02-full178-target-to-59d-model-adapter-preflight.json'
      - 'stages/stage32-ex5/runkeys/bc2-17-n354-filter-picard64-retarget.json'
      - 'stages/stage32/residual-32-01-production/full178-manifest.json'
      - 'stages/stage32/residual-32-01-production/full178-prefix-indexed-compression-main-checkpoint.json'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - '.github/workflows/stage32ex5-bc2-17-n354-filter-picard64-retarget.yml'

permissions:
  contents: read

concurrency:
  group: stage32ex5-bc2-17-n354-filter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Validate fresh BC2-17 run-key arm in synchronize commit range
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          KEY='stages/stage32-ex5/runkeys/bc2-17-n354-filter-picard64-retarget.json'
          BEFORE='${{ github.event.before }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          authorized=false
          if [ "${{ github.event.action }}" = "synchronize" ] && [ -n "$BEFORE" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && git diff --name-only "$BEFORE" "$HEAD" | grep -Fxq "$KEY"; then
              python - "$KEY" "$BEFORE" "$HEAD" <<'PY'
          import json,subprocess,sys
          key,before,head=sys.argv[1:]
          new=json.load(open(key))
          if new.get('schema')!='STAGE32EX5_BC2_17_N354_FILTER_PICARD64_RETARGET_RUNKEY_V1':
              raise SystemExit('run-key schema mismatch')
          if new.get('armed') is not True:
              print('BC2_17_RUNKEY_COLD')
              raise SystemExit(3)
          if int(new.get('generation',-1)) != 1:
              raise SystemExit('BC2-17 generation must be 1')
          if new.get('source_commit') != before:
              raise SystemExit('BC2-17 source commit must equal immediate pre-arm commit')
          if new.get('target') != {'row_id':'g1-d008','g':1,'d':8,'e':8}:
              raise SystemExit('BC2-17 target lock mismatch')
          if new.get('symbolic_x4_rank_block') != [0,112]:
              raise SystemExit('BC2-17 symbolic block lock mismatch')
          if int(new.get('solver_timeout_ms',0)) != 60000:
              raise SystemExit('BC2-17 solver timeout lock mismatch')
          if int(new.get('projected_max_artifact_bytes',0)) > 200000:
              raise SystemExit('BC2-17 artifact projection exceeds ceiling')
          if int(new.get('artifact_retention_days',0)) != 1:
              raise SystemExit('BC2-17 artifact retention must be one day')
          if int(new.get('effective_heavy_concurrency',0)) != 1:
              raise SystemExit('BC2-17 heavy concurrency must be one')
          old=json.loads(subprocess.check_output(['git','show',f'{before}:{key}'],text=True))
          if int(old.get('generation',-1)) >= int(new['generation']):
              raise SystemExit('BC2-17 generation did not advance')
          changed=subprocess.check_output(['git','diff','--name-only',before,head],text=True).splitlines()
          if changed != [key]:
              raise SystemExit(f'BC2-17 arm commit must change only run-key: {changed}')
          print('BC2_17_RUNKEY_FRESH_ARM_OK')
          PY
              rc=$?
              if [ "$rc" -eq 0 ]; then
                authorized=true
              elif [ "$rc" -eq 3 ]; then
                authorized=false
              else
                exit "$rc"
              fi
            fi
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "BC2_17_HEAVY_AUTHORIZED=$authorized"

  n354-filter-picard64-retarget:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact solver dependencies
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Compile BC2-17 retarget probe
        run: python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_17_n354_filter_picard64_retarget.py
      - name: Run exact N354-filter Picard64 retarget probe
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_17_n354_filter_picard64_retarget.py \
            --manifest stages/stage32/residual-32-01-production/full178-manifest.json \
            --prefix-checkpoint stages/stage32/residual-32-01-production/full178-prefix-indexed-compression-main-checkpoint.json \
            --adapter-preflight stages/stage32-ex5/breadth-cycle-2/bc2-02-full178-target-to-59d-model-adapter-preflight.json \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --solver-timeout-ms 60000 \
            --output "$RUNNER_TEMP/bc2-17-n354-filter-picard64-retarget.json"
      - name: Validate candidate-filter and credit firewalls
        run: |
          python - "$RUNNER_TEMP/bc2-17-n354-filter-picard64-retarget.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); f=p['firewalls']; c=p['main_candidate_filter']; r=p['retarget']; q=p['picard64_integrality_probe']
          assert p['schema']=='STAGE32EX5_BC2_17_N354_FILTER_PICARD64_RETARGET_V1'
          assert c['candidate_strata_count_replayed']==17128
          assert c['used_as_mathematical_authority'] is False and c['used_for_target_selection_only'] is True
          assert r['prior_target']['filter_status']=='N353_REJECT'
          assert r['selected_target']=={'d':8,'e':8,'filter_status':'N354_REMAIN','g':1,'row_id':'g1-d008'}
          assert r['first_block_rank_start']==0 and r['first_block_rank_end']==112 and r['first_block_width']==113
          assert q['result'] in ('SAT','UNSAT','UNKNOWN')
          assert f['n354_candidate_filter_promoted_to_authority'] is False
          assert f['old_e4_local_prefix_promoted_to_current_main_population'] is False
          assert f['retarget_probe_promoted_to_full178'] is False and f['stage32_main_credit'] is False
          assert f['n350_production_coverage_credit'] is False and f['theorem_credit'] is False and f['endpoint_credit'] is False
          assert f['merge_authorized'] is False
          print('BC2_17_RETARGET_SCOPE_OK',q['result'],q['sat_witness']['x4'] if q['sat_witness'] else None)
          PY
      - name: Upload compact BC2-17 evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-17-n354-filter-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/bc2-17-n354-filter-picard64-retarget.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
