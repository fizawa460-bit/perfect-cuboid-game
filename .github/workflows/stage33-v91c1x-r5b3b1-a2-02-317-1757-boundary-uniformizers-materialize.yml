name: Stage33 V91C1X R5B3B1 A2_02 317/1757 boundary uniformizers materialize

on:
  push:
    branches:
      - stage33-v91c1x-r5b2d0-swap23-source-lock
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b1-a2-02-317-1757-boundary-uniformizers-materialize.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b1_a2_02_317_1757_boundary_uniformizers.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage33-v91c1x-r5b2d0-swap23-source-lock
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Reproduce retained Stage33-07 boundary-uniformizer prefix
        working-directory: stages/stage33/33-07
        run: |
          python certify_order2_quotient_raw_order4_bockstein.py
          python materialize_mixed_order_side_ambient_function_lifts.py
          python materialize_mixed_order_exceptional_ambient_tangent_function_lifts.py
          python inventory_mixed_order_ambient_linear_divisor_support.py
          python certify_ambient_linear_carrier_boundary_offboundary_split.py
          python certify_bj_offboundary_genus1_components.py
          python certify_quartic_norm_biquadratic_cover_reduction.py
          python certify_six_unramified_kummer_classes_nonsquare.py
          python certify_six_unramified_kummer_classes_nonsquare_over_L.py
          python certify_26x24_offboundary_prime_valuation_tensor_over_L.py
          python certify_72_boundary_weak_approximation_uniformizers.py
      - name: Materialize R5B3B1 cover-indexed A2_02 boundary uniformizers
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b1_a2_02_317_1757_boundary_uniformizers.py --write
      - name: Restore transient Stage33-07 producer outputs
        run: |
          git restore --worktree stages/stage33/33-07
          git clean -f stages/stage33/33-07
      - name: Bound generated delta
        run: |
          git diff --check
          git status --porcelain
          test "$(git status --porcelain | wc -l)" -eq 1
          git status --porcelain | grep 'stages/stage33/33-12/e3-v91c1x-r5b3b1-a2-02-317-1757-boundary-uniformizers.json'
      - name: Commit exact generated certificate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stages/stage33/33-12/e3-v91c1x-r5b3b1-a2-02-317-1757-boundary-uniformizers.json
          git commit -m '[Stage33] materialize R5B3B1 A2_02 317/1757 boundary uniformizers'
          git push origin HEAD:stage33-v91c1x-r5b2d0-swap23-source-lock
