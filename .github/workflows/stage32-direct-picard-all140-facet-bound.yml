name: Stage32 direct Picard all140 single-facet envelope

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - 'stages/stage32/residual-32-01-production/direct_picard_all140_facet_bound.py'
      - 'stages/stage32/residual-32-01-production/build_direct_picard_all140_facet_census.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_slice_bridge.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_slice_quadratic_bound.py'
      - 'stages/stage32/residual-32-01-production/hperp_integral_adapter.py'
      - 'stages/stage32/residual-32-01-production/full178-manifest.json'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - '.github/workflows/stage32-direct-picard-all140-facet-bound.yml'

permissions:
  contents: read

jobs:
  all140-single-facet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Build exact all140 single-facet envelope
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib, sys
          root=pathlib.Path.cwd()
          prod=root/'stages/stage32/residual-32-01-production'
          sys.path.insert(0,str(prod))
          from direct_picard_all140_facet_bound import DirectPicardAll140SingleFacetBound
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path)
              assert spec and spec.loader
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod.load()
          bundle=load(root/'stages/stage33/33-07/picard_base_rows_retained.py','s32_all140_picard')
          marking=load(root/'stages/stage33/33-07/stage32_picard_marking_retained.py','s32_all140_marking')
          model=DirectPicardAll140SingleFacetBound.from_retained(marking,bundle)
          c=model.certificate
          assert c['known_curve_count']==140
          assert c['rule_multiplicity_sum']==140
          assert c['proof']['safe_necessary_prune'] is True
          pathlib.Path('direct-picard-all140-single-facet-bound.json').write_text(
              json.dumps(c,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps({
              'verdict':'PASS_DIRECT_PICARD_ALL140_SINGLE_FACET_BOUND',
              'rank3_fixed':c['augmented_rank3_fixed_functional_count'],
              'rank4_facets':c['augmented_rank4_true_facet_count'],
              'unique_rules':c['unique_exact_facet_rule_count'],
              'canonical_sha256':c['canonical_sha256_without_this_field'],
          },sort_keys=True))
          PY
      - name: Apply envelope to FULL178 direct slices
        run: |
          python stages/stage32/residual-32-01-production/build_direct_picard_all140_facet_census.py \
            --manifest stages/stage32/residual-32-01-production/full178-manifest.json \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --output direct-picard-all140-single-facet-census.json
      - name: Upload compact all140 facet evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-direct-picard-all140-single-facet
          path: |
            direct-picard-all140-single-facet-bound.json
            direct-picard-all140-single-facet-census.json
          retention-days: 7
          compression-level: 9
