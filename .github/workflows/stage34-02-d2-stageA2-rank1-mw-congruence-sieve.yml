name: Stage34-02 D2 StageA2 rank-one MW congruence sieve

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage34/runkeys/stage34-02-d2-stageA2-rank1-mw-congruence-sieve.json'
      - 'stages/stage34/34-02/d2-stageA2-rank1-mw-congruence-sieve-lock.json'
      - 'stages/stage34/34-02/run_d2_stageA2-rank1-mw-congruence-sieve.py'
      - 'stages/stage34/34-02/run_d2_stageA2_rank1_mw_congruence_sieve.py'
      - 'stages/stage34/34-02/validate_d2_stageA2_rank1_mw_congruence_sieve_runkey.py'
      - 'stages/stage34/34-02/run_d2_stageA2_rank1_cover_selection.py'
      - '.github/workflows/stage34-02-d2-stageA2-rank1-mw-congruence-sieve.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch event-before commit if needed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ]; then git fetch --no-tags --depth=1 origin "$BEFORE" || true; fi
      - name: Validate dedicated run key against actual commit range
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 stages/stage34/34-02/validate_d2_stageA2_rank1_mw_congruence_sieve_runkey.py "$BEFORE" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Report authorization
        run: echo "authorized=${{ steps.gate.outputs.authorized }} reason=${{ steps.gate.outputs.reason }}"

  prove-24-closures:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate exact 92 d1 survivors and 76 rank-one assignments
        run: |
          python3 stages/stage34/34-02/run_d2_stageA2_factor_branch_local.py
          python3 stages/stage34/34-02/refine_d2_stageA2_factor_branch_support.py
          python3 stages/stage34/34-02/run_d2_stageA2_full_support_projective.py
          python3 stages/stage34/34-02/run_d2_stageA2_rank1_cover_selection.py
      - name: Prove exact MW congruence closures
        run: python3 stages/stage34/34-02/run_d2_stageA2_rank1_mw_congruence_sieve.py
      - name: Enforce compact artifact cap
        if: always()
        run: |
          test -f stages/stage34/34-02/d2-stageA2-rank1-mw-congruence-sieve.json
          test $(wc -c < stages/stage34/34-02/d2-stageA2-rank1-mw-congruence-sieve.json) -le 1048576
      - name: Upload compact sieve certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-02-d2-stageA2-rank1-mw-congruence-sieve
          path: stages/stage34/34-02/d2-stageA2-rank1-mw-congruence-sieve.json
          if-no-files-found: warn
          retention-days: 1
