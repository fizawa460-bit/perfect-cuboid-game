name: Stage15-6 cycle bd-bg

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6bd/**'
      - 'stages/stage15/15-6be/**'
      - 'stages/stage15/15-6bf/**'
      - 'stages/stage15/15-6bg/**'
      - 'stages/stage15/15-6-cycle/6bd-6bg.md'
      - 'stages/stage15/evidence/stage15_6bd_diagonal_product.json'
      - 'stages/stage15/evidence/stage15_6be_fixed_diagonal_fiber.json'
      - 'stages/stage15/evidence/stage15_6bf_denominator_rigidity.json'
      - 'stages/stage15/evidence/stage15_6bg_support_gate.json'
      - 'stages/stage15/replay/verify_stage15_6bd.py'
      - 'stages/stage15/replay/verify_stage15_6be.py'
      - 'stages/stage15/replay/verify_stage15_6bf.py'
      - 'stages/stage15/replay/verify_stage15_6bg.py'
      - '.github/workflows/stage15-6-cycle-bd-bg.yml'
  workflow_dispatch:

jobs:
  verify-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 6bd
        run: python stages/stage15/replay/verify_stage15_6bd.py
      - name: Verify 6be
        run: python stages/stage15/replay/verify_stage15_6be.py
      - name: Verify 6bf
        run: python stages/stage15/replay/verify_stage15_6bf.py
      - name: Verify 6bg
        run: python stages/stage15/replay/verify_stage15_6bg.py
      - name: Compile utilities
        run: python -m py_compile stages/stage15/scripts/stage15_6bd_diagonal_product.py stages/stage15/scripts/stage15_6be_fixed_diagonal_fiber.py stages/stage15/scripts/stage15_6bf_denominator_rigidity.py stages/stage15/scripts/stage15_6bg_support_gate.py
