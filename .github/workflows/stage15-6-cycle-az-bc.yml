name: Stage15-6 cycle az-bc

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6az/**'
      - 'stages/stage15/15-6ba/**'
      - 'stages/stage15/15-6bb/**'
      - 'stages/stage15/15-6bc/**'
      - 'stages/stage15/15-6-cycle/6az-6bc.md'
      - 'stages/stage15/evidence/stage15_6az_small_height_size_audit.json'
      - 'stages/stage15/evidence/stage15_6ba_ar012_false_trigger.json'
      - 'stages/stage15/evidence/stage15_6bb_rational_reciprocal.json'
      - 'stages/stage15/evidence/stage15_6bc_weighted_twist_gate.json'
      - 'stages/stage15/replay/verify_stage15_6az.py'
      - 'stages/stage15/replay/verify_stage15_6ba.py'
      - 'stages/stage15/replay/verify_stage15_6bb.py'
      - 'stages/stage15/replay/verify_stage15_6bc.py'
      - '.github/workflows/stage15-6-cycle-az-bc.yml'
  workflow_dispatch:

jobs:
  verify-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 6az
        run: python stages/stage15/replay/verify_stage15_6az.py
      - name: Verify 6ba
        run: python stages/stage15/replay/verify_stage15_6ba.py
      - name: Verify 6bb
        run: python stages/stage15/replay/verify_stage15_6bb.py
      - name: Verify 6bc
        run: python stages/stage15/replay/verify_stage15_6bc.py
      - name: Compile utilities
        run: python -m py_compile stages/stage15/scripts/stage15_6az_small_height_size_audit.py stages/stage15/scripts/stage15_6ba_ar012_false_trigger.py stages/stage15/scripts/stage15_6bb_rational_reciprocal.py stages/stage15/scripts/stage15_6bc_weighted_twist_gate.py
