name: StructureRadar batch22 origin matcher

on:
  push:
    branches:
      - structure-radar-deep-corpus-batch-22
permissions:
  contents: write
jobs:
  origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Match producer stage to reviewed archive result
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.'); r=root/'docs/structure-radar'
          q=json.loads((r/'exploration-queue.json').read_text()); ids=next(t for t in q['tasks'] if t['status']=='READY')['source_ids'][:60]
          sources={}; bypath={}
          for p in sorted((r/'source-manifest').glob('part-*.json')):
              for s in json.loads(p.read_text())['sources']:
                  sources[s['source_id']]=s; bypath[s['path'].lower()]=s
          reviews=json.loads((r/'progress.json').read_text())['source_reviews']
          lines=['# idx | source | producer | archive review']
          for i,sid in enumerate(ids,1):
              s=sources[sid]; obj=json.loads((root/s['path']).read_text())
              vals=[]
              if isinstance(obj,dict):
                  for k in ['stage','source_stage','producer_stage']:
                      if isinstance(obj.get(k),str): vals.append(obj[k])
                  md=obj.get('metadata',{})
                  if isinstance(md,dict) and isinstance(md.get('stage'),str): vals.insert(0,md['stage'])
              producer='-'; review='-'
              for v in vals:
                  m=re.search(r'(?i)(?:Stage14-|14-)([A-Za-z0-9]+)',v)
                  if not m: continue
                  slug=m.group(1); producer='14-'+slug
                  for cp in [f'stages/stage14/archive/tasks/14-{slug}/result.md'.lower(),f'stages/stage14/tasks/14-{slug}/result.md'.lower()]:
                      old=bypath.get(cp)
                      if old:
                          rv=reviews.get(old['source_id'],{}); review=f"{old['source_id']}:{','.join(rv.get('structure_ids',[])) or rv.get('status','?')}"
                          break
                  break
              lines.append(f'{i:02d} | {sid} | {producer} | {review}')
          (r/'.batch22-origin.txt').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/structure-radar/.batch22-origin.txt
          if ! git diff --cached --quiet; then
            git commit -m "Build StructureRadar batch22 origin map"
            git push origin HEAD:structure-radar-deep-corpus-batch-22
          fi
