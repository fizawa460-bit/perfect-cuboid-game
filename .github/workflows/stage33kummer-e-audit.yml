name: stage33kummer-e exact ambiguity audit

on:
  push:
    branches: [stage33kummer-e]
    paths:
      - 'stages/stage33/33-07/parallel/lane-e/audit_kummer_matrix_ambiguity.py'
      - '.github/workflows/stage33kummer-e-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compute exact F2 ambiguity certificate
        run: |
          python stages/stage33/33-07/parallel/lane-e/audit_kummer_matrix_ambiguity.py > stages/stage33/33-07/parallel/lane-e/RESULT.json
          python - <<'PY'
          import json
          p='stages/stage33/33-07/parallel/lane-e/RESULT.json'
          x=json.load(open(p))
          print('extension=', x['extension_solution_space'])
          print('matrix_summary=', {k:v for k,v in x['matrix'].items() if k not in ('forced_entries',)})
          print('measurement_count=', x['minimal_coordinate_measurement_plan']['minimum_scalar_entry_measurements'])
          print('measurement_entries=', [(e['source_one_based'],e['h1_one_based']) for e in x['minimal_coordinate_measurement_plan']['entries']])
          print('canonical_sha256=', x['canonical_sha256'])
          PY
      - name: Commit compact exact certificate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage33/33-07/parallel/lane-e/RESULT.json
          if ! git diff --cached --quiet; then
            git commit -m 'stage33kummer-e: materialize exact ambiguity certificate'
            git push
          fi
