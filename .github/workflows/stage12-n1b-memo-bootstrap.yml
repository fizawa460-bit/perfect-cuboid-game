name: Stage12-N1b memo bootstrap

on:
  pull_request:
    paths:
      - "scripts/update_shared_p_primitive_joint_stage12_n1b_memo.py"
      - ".github/workflows/stage12-n1b-memo-bootstrap.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage12-n1-primitive-joint
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate memo
        run: |
          python scripts/update_shared_p_primitive_joint_stage12_n1b_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --report data/shared_p_primitive_joint_stage12_n1b_report.json \
            --output generated-face-ratio-geometry-research.md
          mv generated-face-ratio-geometry-research.md docs/face-ratio-geometry-research.md
          rm -f docs/stage12-n1b-placeholder.md docs/stage12-n1b-scope.md
          rm -f .github/workflows/stage12-n1b-memo-bootstrap.yml
      - name: Commit memo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document Stage12-N1b primitive joint identity"
          git push origin HEAD:agent/stage12-n1-primitive-joint
