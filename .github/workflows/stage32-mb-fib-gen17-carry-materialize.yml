name: Stage32 MB-FIB Gen17 durable carry materialization
# Trigger lifecycle: RETIRED — Gen17 exact carry is source-committed; manual replay only.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      exact_sha: ${{ steps.gate.outputs.exact_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          KEY='stages/stage32/final-chain/32-03-multibranch/nodes/MB104/runkeys/000707-GEN17-CARRY-MATERIALIZE-V1.json'
          authorized=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            authorized=true
          elif [ -n "$BEFORE" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git diff --name-only "$BEFORE" "$HEAD_SHA" | grep -Fxq "$KEY"; then authorized=true; fi
          fi
          if [ "$authorized" = true ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          k=json.loads(Path('stages/stage32/final-chain/32-03-multibranch/nodes/MB104/runkeys/000707-GEN17-CARRY-MATERIALIZE-V1.json').read_text())
          assert k["schema"]=="STAGE32_MB104_000707_GEN17_CARRY_MATERIALIZE_RUNKEY_V1" and int(k["revision"])==1 and k["armed"] is True
          assert k["expected_execution_head"]=="4d4f48f4f69e27731444117bc83a9c9ab7d51c50" and int(k["expected_workflow_run_id"])==35548407737
          assert int(k["expected_complete_count"])==27 and int(k["expected_incomplete_count"])==29 and k["credit"] is False and k["merge_authorized"] is False
          PY
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "exact_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
  materialize:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.exact_sha }}
          fetch-depth: 1
      - name: Fetch and preserve exact Gen17 COMPLETE certificate bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python stages/stage32/final-chain/32-03-multibranch/nodes/MB104/materialize_mb104_000707_gen17_secondary_carry.py \
            --source stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN17-SECONDARY-CARRY-SOURCE.json \
            --bundle stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN17-SECONDARY-CARRY-BUNDLE.json \
            --manifest stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN17-SECONDARY-CARRY-MANIFEST.json
      - name: Commit durable Gen17 carry evidence only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN17-SECONDARY-CARRY-BUNDLE.json stages/stage32/final-chain/32-03-multibranch/nodes/MB104/MB104-000707-GEN17-SECONDARY-CARRY-MANIFEST.json
          git commit -m 'stage32 mb-fib: retain exact Gen17 secondary carry evidence'
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
