name: Temporary StructureRadar batch05 cleanup
on:
  push:
    branches: [structureradar/batch05]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify curated closeout
        run: |
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
      - name: Self-clean helper files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .tmp-structure-radar-task.json .github/workflows/tmp-structureradar-batch05-report.yml
          git add docs/structure-radar
          git diff --check --cached
          git commit -m 'StructureRadar: close curated Stage14-15 census'
          git push
