name: Stage25-60 deep-stop synchronization audit

on:
  pull_request:
    paths:
      - 'stages/stage25/25-60/checkpoint60-deep-stop-sync.md'
      - 'stages/stage25/25-60/checkpoint60-deep-stop-controller.json'
      - 'stages/stage25/25-60/checkpoint60-deep-stop-audit.py'
      - 'stages/stage25/25-60/result.md'
      - 'stages/stage25/25-60/deeper-lane-triage.md'
      - 'stages/stage23/post-stage25-r01/result.md'
      - 'stages/stage24/post-stage25-r01/result.md'
      - '.github/workflows/stage25-60-deep-stop-sync.yml'
  workflow_dispatch:

jobs:
  deep-stop-sync-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify checkpoint60 route and backflow synchronization
        run: python stages/stage25/25-60/checkpoint60-deep-stop-audit.py
