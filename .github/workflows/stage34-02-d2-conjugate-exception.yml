name: Stage34-02 D2 conjugate exception certificate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage34/runkeys/stage34-02-d2-conjugate-exception.json'
      - 'stages/stage34/34-02/run_d2_magma_conjugate_exception.py'
      - 'stages/stage34/34-02/validate_d2_conjugate_exception_runkey.py'
      - '.github/workflows/stage34-02-d2-conjugate-exception.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch event-before commit if needed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ]; then git fetch --no-tags --depth=1 origin "$BEFORE" || true; fi
      - name: Validate dedicated run key against actual commit range
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 stages/stage34/34-02/validate_d2_conjugate_exception_runkey.py "$BEFORE" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - run: echo "authorized=${{ steps.gate.outputs.authorized }} reason=${{ steps.gate.outputs.reason }}"

  conjugate-exception:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate all fourteen conjugate base-point images
        run: python3 stages/stage34/34-02/run_d2_magma_conjugate_exception.py
      - name: Enforce compact artifact cap
        run: test $(wc -c < stages/stage34/34-02/d2-conjugate-exception-certificate.json) -le 1048576
      - name: Upload compact certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-02-d2-conjugate-exception
          path: |
            stages/stage34/34-02/d2-conjugate-exception-certificate.json
            stages/stage34/34-02/d2-conjugate-exception-stdout.txt
          if-no-files-found: warn
          retention-days: 1
