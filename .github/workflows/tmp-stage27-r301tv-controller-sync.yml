name: TEMP Stage27 r301t-v controller sync

on:
  push:
    branches:
      - agent/stage27-20-r301t-v-critical-support
    paths:
      - '.github/workflows/tmp-stage27-r301tv-controller-sync.yml'

permissions:
  contents: write

jobs:
  sync-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-20-r301t-v-critical-support
          fetch-depth: 0
      - name: Rebase controller content onto live main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp stages/stage27/27-controller.json /tmp/branch-controller.json
          git fetch origin main
          git show origin/main:stages/stage27/27-controller.json > /tmp/main-controller.json
          python - <<'PY'
          import json
          from pathlib import Path
          branch=json.loads(Path('/tmp/branch-controller.json').read_text())
          main=json.loads(Path('/tmp/main-controller.json').read_text())
          for name in ('Stage27-20-r301t','Stage27-20-r301u','Stage27-20-r301v'):
              assert name in branch['derived_routes']
              main['derived_routes'][name]=branch['derived_routes'][name]
          assert main['derived_routes']['Stage27-19-r5af-r5ag']['status']=='BATCH_SUBMITTED_PENDING_FRESH_AUDIT'
          assert main['state']['CURRENT_CHECKPOINT']==40
          assert main['state']['NEXT_CHECKPOINT']==40
          assert main['state']['MAIN_STATUS']=='UPPER_REENTRY_STAGE27_19_R5AF_R5AG_SUBMITTED_PENDING_FRESH_AUDIT'
          assert main['checkpoint_status']['50']=='BLOCKED_BY_ACTIVE_CHECKPOINT40_DERIVED_ROUTE'
          assert main['stage20_r301_numbering_contract']['after_r301z']=='Stage27-20-r302-main-batch'
          assert main['stage20_r301_numbering_contract']['r301aa_forbidden'] is True
          Path('stages/stage27/27-controller.json').write_text(json.dumps(main,indent=2)+'\n')
          PY
          python -m json.tool stages/stage27/27-controller.json >/dev/null
          git add stages/stage27/27-controller.json
          git diff --check --cached
          git commit -m 'Sync r301t-v controller with live main'
          git push origin HEAD:agent/stage27-20-r301t-v-critical-support
