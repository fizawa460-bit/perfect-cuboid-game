name: StructureRadar parallel33 integrate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'structure-radar-parallel-33-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append parallel integration progress and self-clean
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/structure-radar/progress.json')
          data = json.loads(p.read_text())
          bid = 'SR-BATCH-PARALLEL-INTEGRATION-33-R01'
          if not any(x.get('batch_id') == bid for x in data['batches']):
              data['batches'].append({
                  'batch_id': bid,
                  'phase': 'EXTERNAL_GATE_CLOSURE',
                  'status': 'SUBMITTED_FOR_AUDIT',
                  'structure_ids': ['SR-STR-169','SR-STR-170','SR-STR-171','SR-STR-168'],
                  'parallel_integration': True,
                  'parallel_lane_count': 4,
                  'parallel_lane_prs': [1205,1206,1207,1208],
                  'parallel_audits_pass': 4,
                  'progress_entries_deferred_by_lanes': 4,
                  'progress_integration_completed': True,
                  'gates_closed': 0,
                  'external_gate_count_before': 13,
                  'external_gate_count_after': 13,
                  'sr_str_169_first_missing_lemma': 'MAINWallPhysicalResidueFourierCompletionNormAndBadGCDControl',
                  'sr_str_170_first_missing_lemma': 'PhysicalSquareDivisorWindowOrdinaryShadowMeasureCompatibility',
                  'sr_str_171_first_missing_lemma': 'PhysicalLocalizedOrdinaryDivisorWindowMeasureAndWidthCompatibility',
                  'sr_str_168_first_missing_lemma': 'SameMeasurePhysicalCommonNormQuotientCorrelationDeficit',
                  'audit_required': True
              })
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          rm .github/workflows/structure-radar-parallel33-integration.yml
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add docs/structure-radar/progress.json .github/workflows/structure-radar-parallel33-integration.yml
          git commit -m 'StructureRadar: materialize parallel33 integration' || true
          git push origin HEAD:${{ github.head_ref }}
