name: StructureRadar b35 integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'structure-radar-parallel-35-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append batch35 integration and self-clean
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/structure-radar/progress.json')
          data = json.loads(p.read_text())
          bid = 'SR-BATCH-PARALLEL-INTEGRATION-35-R01'
          rows = data['audit_batches']
          if not any(x.get('batch_id') == bid for x in rows):
              rows.append({
                  'batch_id': bid,
                  'phase': 'EXTERNAL_GATE_CLOSURE',
                  'status': 'SUBMITTED_FOR_AUDIT',
                  'structure_ids': ['SR-STR-169','SR-STR-170','SR-STR-171','SR-STR-168'],
                  'parallel_integration': True,
                  'parallel_lane_count': 4,
                  'parallel_lane_prs': [1211,1212,1213,1214],
                  'parallel_audits_pass': 4,
                  'parallel_audit_repairs': 4,
                  'progress_entries_deferred_by_lanes': 4,
                  'progress_integration_completed': True,
                  'gates_closed': 0,
                  'external_gate_count_before': 13,
                  'external_gate_count_after': 13,
                  'sr_str_169_audited_head': '7023b9e4b57e9c9c3ed02243225bdf5698cd185c',
                  'sr_str_169_merge_commit': '27f123f417439ea7b87a3ee960b808a4466d0227',
                  'sr_str_169_first_missing_lemma': 'MAINWallPrimitiveInverseFrequencySameMeasureOperatorNormAdapter',
                  'sr_str_170_audited_head': '922c0d19ffb64ebc56ce761146587f8fc4773219',
                  'sr_str_170_merge_commit': 'caef66127d381634f723e3e3ea408034e44d69b0',
                  'sr_str_170_first_missing_lemma': 'PhysicalSquareDilateWitnessWeightedMassDeficit',
                  'sr_str_171_audited_head': '4b3769c14791c6704d3e67082d36c7c9f558b4aa',
                  'sr_str_171_merge_commit': '200cd3a295c0bbf5921b6e4a900b211cedcbaa7d',
                  'sr_str_171_first_missing_lemma': 'PhysicalLocalizedDivisorDilationWitnessWeightedMassDeficit',
                  'sr_str_168_audited_head': '23e6a5a854b4b38b4d6cda8880eb9b06e002e054',
                  'sr_str_168_merge_commit': 'e9f9066f9b402b4b2d0320cdfc21a1eccd1b98da',
                  'sr_str_168_first_missing_lemma': 'SameMeasurePhysicalRestrictedGaussianToTwistedDivisorConvolutionAdapter',
                  'audit_required': True
              })
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          rm .github/workflows/structure-radar-b35-integration.yml
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add docs/structure-radar/progress.json .github/workflows/structure-radar-b35-integration.yml
          git commit -m 'StructureRadar: materialize parallel integration 35' || true
          git push origin HEAD:${{ github.head_ref }}
