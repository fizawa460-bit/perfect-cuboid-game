name: Stage32 32-01-178 V47 support-qBC exact intersection

# lifecycle: ACTIVE_AUTO
# Exact same-population V47 x support-qBC execution. ACTIVE 178 frontier; runkey-gated.
on:
  push:
    branches:
      - stage32-01-178-post-td02-fibration-nef
    paths:
      - '.github/workflows/stage32-01-178-v47-support-qbc-intersection.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-01-178-v47-support-qbc-intersection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix_a: ${{ steps.coords.outputs.matrix_a }}
      matrix_b: ${{ steps.coords.outputs.matrix_b }}
    steps:
      - uses: actions/checkout@v4
      - id: coords
        name: Freeze two 192-coordinate matrices
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("stages/stage32/32-01-178/fibration-nef/local-support-qbc/GENERATION4-COMPLETE.json")
          m=json.load(open(p))
          coords=sorted({(int(x["verified"]["row_index"]),int(x["verified"]["b"])) for x in m["receipts"]})
          assert len(coords)==384
          halves=(coords[:192],coords[192:])
          with open(os.environ["GITHUB_OUTPUT"],"a") as fh:
              for name,xs in zip(("matrix_a","matrix_b"),halves):
                  value=json.dumps({"include":[{"row":r,"b":b} for r,b in xs]},separators=(",",":"))
                  fh.write(f"{name}={value}\n")
          PY

  exact-intersection-a:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix_a) }}
    uses: ./.github/workflows/stage32-01-178-v47-support-qbc-unit.yml
    with:
      row: ${{ matrix.row }}
      b: ${{ matrix.b }}

  exact-intersection-b:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix_b) }}
    uses: ./.github/workflows/stage32-01-178-v47-support-qbc-unit.yml
    with:
      row: ${{ matrix.row }}
      b: ${{ matrix.b }}

  aggregate:
    needs: [exact-intersection-a, exact-intersection-b]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: v47-support-qbc-row*-b*
          path: /tmp/all
          merge-multiple: true
      - name: Require all 384 durable receipts and verify exact aggregate
        run: |
          set -euo pipefail
          test "$(find /tmp/all -maxdepth 1 -name 'row*-b*.json' | wc -l)" -eq 384
          mkdir -p stages/stage32/32-01-178/fibration-nef/v47-support-qbc-intersection
          cp /tmp/all/row*-b*.json stages/stage32/32-01-178/fibration-nef/v47-support-qbc-intersection/
          python stages/stage32/32-01-178/fibration-nef/aggregate_v47_support_qbc_intersection.py
          cp stages/stage32/32-01-178/fibration-nef/V47-SUPPORT-QBC-INTERSECTION-AGGREGATE.json /tmp/
      - uses: actions/upload-artifact@v4
        with:
          name: v47-support-qbc-intersection-exact-aggregate
          path: /tmp/V47-SUPPORT-QBC-INTERSECTION-AGGREGATE.json
          if-no-files-found: error
          retention-days: 14
      - name: Diff hygiene
        run: git diff --check
