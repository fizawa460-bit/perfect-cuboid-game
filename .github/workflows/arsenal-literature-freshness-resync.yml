name: Arsenal literature freshness resync

on:
  push:
    branches: [arsenal-literature-strengthening-implementation]

permissions:
  contents: write

jobs:
  resync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arsenal-literature-strengthening-implementation

      - name: Freeze fresh main and fail-close on net Arsenal drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          FRESH_MAIN=$(git rev-parse FETCH_HEAD)
          echo "FRESH_MAIN=$FRESH_MAIN" >> "$GITHUB_ENV"
          MERGE_BASE=$(git merge-base HEAD "$FRESH_MAIN")
          echo "fresh_main=$FRESH_MAIN merge_base=$MERGE_BASE"
          git diff --name-only "$MERGE_BASE".."$FRESH_MAIN" | tee /tmp/main-drift.txt
          if grep -E '^(docs/arsenal/|docs/arsenal-literature-strengthening-promotion\.md$)' /tmp/main-drift.txt; then
            echo 'FAIL: net current-main drift touches Arsenal implementation scope' >&2
            exit 1
          fi

      - name: Merge repaired main and refresh provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$FRESH_MAIN"
          python3 - "$FRESH_MAIN" <<'PY'
          from pathlib import Path
          import sys
          fresh=sys.argv[1]
          p=Path('docs/arsenal-literature-strengthening-promotion.md')
          text=p.read_text()
          lines=[]
          seen=0
          for line in text.splitlines(True):
              if line.startswith('FRESHNESS_SYNC_MAIN='):
                  lines.append(f'FRESHNESS_SYNC_MAIN={fresh}\n')
                  seen += 1
              else:
                  lines.append(line)
          if seen != 1:
              raise SystemExit(f'expected exactly one FRESHNESS_SYNC_MAIN, found {seen}')
          p.write_text(''.join(lines))
          PY
          python3 -B docs/arsenal/sync_arsenal_catalog.py
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          git diff --check

      - name: Materialize final tree without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/arsenal-literature-freshness-resync.yml
          git add docs/arsenal-literature-strengthening-promotion.md docs/arsenal/index.json docs/arsenal/catalog.md docs/arsenal/cards
          git commit -m 'chore(arsenal): resync literature implementation freshness'
          test -z "$(git status --porcelain)"

      - name: Exact-head validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          git diff --check "$FRESH_MAIN"..HEAD
          git diff --name-only "$FRESH_MAIN"..HEAD | sort > /tmp/final-scope.txt
          cat /tmp/final-scope.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          allowed={'docs/arsenal-literature-strengthening-promotion.md','docs/arsenal/index.json','docs/arsenal/catalog.md'}
          allowed|={f'docs/arsenal/cards/provisional/LIT-PW{i:02d}.md' for i in range(1,16)}
          allowed.add('docs/arsenal/cards/workflows/LIT-WF01.md')
          got=set(Path('/tmp/final-scope.txt').read_text().splitlines())
          if got != allowed:
              raise SystemExit(f'exact scope mismatch extra={sorted(got-allowed)} missing={sorted(allowed-got)}')
          x=json.loads(Path('docs/arsenal/index.json').read_text())
          active=[]
          active += [e['id'] for e in x['selectors']]
          active += [e['id'] for e in x['formal_router_weapons']]
          active += [e['id'] for e in x['formal_workflows']]
          retired={}
          for h in x['provisional_harvests']:
              active += h.get('active_cards',[])
              active += h.get('active_workflows',[])
              retired.update(h.get('retired_merged_ids',{}))
          if len(active)!=67 or len(active)!=len(set(active)):
              raise SystemExit(f'active ID uniqueness/count failure: {len(active)}')
          if set(retired) & set(active):
              raise SystemExit('retired ID reused')
          if any(s not in set(active) for s in retired.values()):
              raise SystemExit('retired successor missing')
          required={f'LIT-PW{i:02d}' for i in range(1,16)}|{'LIT-WF01'}
          if not required.issubset(set(active)):
              raise SystemExit('literature ID missing')
          print('PASS active IDs unique=67')
          PY
          test -z "$(grep -E '^(stages/|\.github/|.*MAIN-STATE|.*controller)' /tmp/final-scope.txt || true)"
          git grep -n 'LITERATURE_AUDIT_EXACT_HEAD=288c3fac93774806a96cd7cb0076493e173f859c' -- docs/arsenal-literature-strengthening-promotion.md
          git grep -n "FRESHNESS_SYNC_MAIN=$FRESH_MAIN" -- docs/arsenal-literature-strengthening-promotion.md
          git grep -n 'STAGE36_EXCLUDED=true' -- docs/arsenal-literature-strengthening-promotion.md
          git grep -n 'MATHEMATICAL_STAGE_CREDIT_INCREMENT=0' -- docs/arsenal-literature-strengthening-promotion.md
          test -z "$(git grep -n '44f635f364f9904c2048197bc84eea58938fdb16' -- docs/arsenal-literature-strengthening-promotion.md docs/arsenal/index.json docs/arsenal/cards/provisional/LIT-PW05.md || true)"
          test -z "$(git grep -n 'Theorems 1.7, 1.9\|Theorem 1.7 and Theorem 1.9' -- docs/arsenal-literature-strengthening-promotion.md docs/arsenal/index.json docs/arsenal/cards/provisional/LIT-PW05.md || true)"
          git grep -n 'Theorem 1.7; Theorem 1.8; Appendix Theorem A.1' -- docs/arsenal-literature-strengthening-promotion.md docs/arsenal/index.json docs/arsenal/cards/provisional/LIT-PW05.md

      - name: Stage36 registry equality against repaired main
        shell: bash
        run: |
          set -euo pipefail
          git show "$FRESH_MAIN":docs/arsenal/index.json > /tmp/main-index.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          cur=json.loads(Path('docs/arsenal/index.json').read_text())
          base=json.loads(Path('/tmp/main-index.json').read_text())
          def s36(x):
              h=[v for v in x['provisional_harvests'] if v.get('source_stage')=='Stage36']
              if len(h)!=1: raise SystemExit(f'Stage36 harvest count={len(h)}')
              return h[0]
          if s36(cur)!=s36(base): raise SystemExit('Stage36 harvest changed')
          print('PASS Stage36 harvest unchanged')
          PY
          git show --check --oneline --stat HEAD

      - name: Push exact validated head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:arsenal-literature-strengthening-implementation
