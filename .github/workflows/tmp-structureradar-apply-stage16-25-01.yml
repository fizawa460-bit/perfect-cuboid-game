name: Temporary StructureRadar apply Stage16-25 census 01
on:
  push:
    branches: [structureradar/stage16-25-01]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Normalize task 01
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          radar=Path('docs/structure-radar'); report=json.loads((radar/'stage16-25-current-01-report.json').read_text())
          progress=json.loads((radar/'progress.json').read_text()); registry=json.loads((radar/'structure-registry.json').read_text())
          batch='SR-BATCH-STAGE16_25_CURRENT-01-R01'; cards={c['structure_id']:c for c in registry['structures']}
          # Two genuinely missing normalized structures in this slice. Stage17 transition itself already exists as SR-STR-004.
          new=[
            {
              'structure_id':'SR-STR-141','canonical_math_name':'Exactly-one-face ambient population order and Pythagorean scale mechanism',
              'exact_equations_or_object':'For primitive canonical R<=B cuboids with exactly one integral face and no space condition, M1(B) asymp B^2 log B and M1(B)/U(B) asymp log(B)/B. The power drop comes from replacing one free edge-pair by scaled primitive Pythagorean faces; the logarithm comes from the harmonic face-scale sum.',
              'search_terms_primary':['exactly one integral face cuboid B^2 log B','scaled primitive Pythagorean face harmonic scale count'],
              'search_terms_aliases':['Stage16 one-face ambient law','M1(B) one-face population'],
              'theorem_species':['asymptotic order','population thinning','Pythagorean parametrization counting'],
              'repo_provenance':[{'source_id':'SRC-F05B172FE361','path':'stages/stage16/16-70/result.md','locator':'intrinsic-status and causal verdict','fingerprint':next(r['fingerprint'] for r in report if r['source_id']=='SRC-F05B172FE361')}],
              'target_populations':['primitive canonical exactly-one-face cuboids without space-diagonal integrality'],
              'potential_weapon_types':['ASYMPTOTIC','POPULATION_BASELINE','CAUSAL_DECOMPOSITION'],
              'applicability_gaps':['No leading constant for M1(B) is proved; integral space diagonal is not imposed and must not be charged here.'],
              'existing_radar_overlap':['SR-STR-004','SR-STR-036'],'search_status':'NOT_SEARCHED','arsenal_decision':'PENDING','card_status':'SUBMITTED_FOR_AUDIT'
            },
            {
              'structure_id':'SR-STR-142','canonical_math_name':'Ambient integral-space-diagonal cuboid asymptotic and zero-face dominance',
              'exact_equations_or_object':'For primitive canonical R<=B cuboids with integral space diagonal and no face restriction, N_S^all(B)~B^2/(32G). The zero-integral-face subpopulation N_S^0(B) has the same main term, while the faceful complement is O_epsilon(B^(1+epsilon)); hence the intrinsic ambient space-diagonal cost relative to U(B) is one power of B.',
              'search_terms_primary':['primitive cuboids integral space diagonal asymptotic Catalan constant','Hurlimann primitive cuboid count B^2 32G'],
              'search_terms_aliases':['Stage16S space baseline','SPACE_AT_LEAST SPACE_ONLY'],
              'theorem_species':['asymptotic counting','population thinning','complement upper bound'],
              'repo_provenance':[{'source_id':'SRC-04B449D7B538','path':'stages/stage16s/16s-70/result.md','locator':'intrinsic-status and face-condition verdict','fingerprint':next(r['fingerprint'] for r in report if r['source_id']=='SRC-04B449D7B538')},{'source_id':'SRC-EF18FEA0A133','path':'stages/stage16s/16s-30/result.md','locator':'Hurlimann asymptotic adapter','fingerprint':next(r['fingerprint'] for r in report if r['source_id']=='SRC-EF18FEA0A133')}],
              'target_populations':['primitive canonical integral-space-diagonal cuboids with arbitrary or zero integral faces'],
              'potential_weapon_types':['ASYMPTOTIC','POPULATION_BASELINE','UPPER_BOUND'],
              'applicability_gaps':['The faceful-complement O_epsilon(B^(1+epsilon)) bound is not asserted sharp; interaction with face conditions belongs to transition stages.'],
              'existing_radar_overlap':['SR-STR-004','SR-STR-055'],'search_status':'NOT_SEARCHED','arsenal_decision':'PENDING','card_status':'SUBMITTED_FOR_AUDIT'
            }
          ]
          for c in new:
              if c['structure_id'] not in cards: registry['structures'].append(c); cards[c['structure_id']]=c
          # Add canonical Stage17 closeout provenance to existing transition card.
          r17=next(r for r in report if r['source_id']=='SRC-6CB31AF2AA1E')
          p={'source_id':r17['source_id'],'path':r17['path'],'locator':'frozen Stage17 theorem and matched Stage16 survival law','fingerprint':r17['fingerprint']}
          if not any(x.get('source_id')==p['source_id'] for x in cards['SR-STR-004']['repo_provenance']): cards['SR-STR-004']['repo_provenance'].append(p)
          # Per-source explicit decisions: operational/lifecycle/audit docs are duplicate evidence; result docs are mapped to the nearest normalized card.
          reviews=progress.setdefault('source_reviews',{})
          for r in report:
              sid=r['source_id']; path=r['path']; status='DUPLICATE_SOURCE'; ids=None
              if sid in {'SRC-F05B172FE361','SRC-BA764688B4DD','SRC-E9E9C8216D12','SRC-A92952D26297','SRC-E673AFE7BA6A','SRC-7F259555007B'}: status='STRUCTURES_RECORDED'; ids=['SR-STR-141']
              elif sid in {'SRC-04B449D7B538','SRC-EF18FEA0A133','SRC-91D2A531337E','SRC-C1D9F041B89C','SRC-EAB40C1DED8D','SRC-EC905A37EBC5','SRC-E77ECFF45443'}: status='STRUCTURES_RECORDED'; ids=['SR-STR-142']
              elif sid in {'SRC-B06923974C56','SRC-A641A907F120','SRC-CA0DB6B4155F','SRC-D431D7F5FB30','SRC-D03E7C921BB8','SRC-8DCBF0BD7589','SRC-6CB31AF2AA1E'}: status='STRUCTURES_RECORDED'; ids=['SR-STR-004']
              reviews[sid]={'fingerprint':r['fingerprint'],'status':status,'batch_id':batch}
              if ids: reviews[sid]['structure_ids']=ids
          registry['status']='BATCH_SUBMITTED_FOR_AUDIT'
          batches=progress.setdefault('audit_batches',[]); batches[:]=[b for b in batches if b.get('batch_id')!=batch]
          batches.append({'batch_id':batch,'task_id':'SR-CENSUS-STAGE16_25_CURRENT-01','status':'SUBMITTED_FOR_AUDIT','source_ids':[r['source_id'] for r in report],'sources_reviewed':60,'structures_added':2,'structures_updated':1,'structures_deduped':57,'searches_completed':0,'arsenal_decisions':0,'audit_required':True})
          (radar/'progress.json').write_text(json.dumps(progress,indent=2,ensure_ascii=False)+'\n'); (radar/'structure-registry.json').write_text(json.dumps(registry,indent=2,ensure_ascii=False)+'\n')
          (radar/'stage16-25-current-01-report.json').unlink()
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
      - name: Commit and self-clean
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-structureradar-apply-stage16-25-01.yml
          git add docs/structure-radar
          git diff --check --cached
          git commit -m 'StructureRadar: census Stage16-25 current batch 01'
          git push
