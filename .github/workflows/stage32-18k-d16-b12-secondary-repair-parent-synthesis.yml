name: Stage32-18K d16 b12 secondary repair and logical parent synthesis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/runkeys/18k-b12-secondary-repair-parent-synthesis.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-18k-b12-parent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-run-key:
    runs-on: ubuntu-latest
    outputs:
      generation: ${{ steps.key.outputs.generation }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        name: Validate explicit integration run key
        run: |
          python - <<'PY'
          import json,os,pathlib
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18k-b12-secondary-repair-parent-synthesis.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1'
          assert d['workflow']=='stage32-18k-d16-b12-secondary-repair-parent-synthesis'
          assert d['armed'] is True and d['generation']==1
          assert d['bound']==12 and d['breaker_count']==256
          assert d['ordinary_run_id']==32903188011 and d['rescue_run_id']==32904153727
          assert d['prepared_artifact_id']==9583859427 and d['repair_secondary_ids']==[8,15]
          assert d['primary_split_coordinate']==54 and d['primary_shard_count']==1024 and d['primary_shard_id']==26
          assert d['secondary_split_coordinate']==45 and d['secondary_shard_count']==32
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('generation=1\n')
          print(json.dumps(d,sort_keys=True))
          PY

  repair-secondary:
    needs: validate-run-key
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [8,15]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch immutable Stage32-18I prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/out"
          curl -L --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RUNNER_TEMP/prepared.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9583859427/zip"
          echo '7644f66b977419549a75aeee8c230a9a97330b712bbb35dd801ad4412e21a6ef  '"$RUNNER_TEMP/prepared.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/prepared.zip" -d "$RUNNER_TEMP/prepared"
          chmod +x "$RUNNER_TEMP/prepared/d16-exact-two-stage"
      - name: Exact repair secondary ${{ matrix.shard }} of 32
        run: |
          "$RUNNER_TEMP/prepared/d16-exact-two-stage" \
            --input "$RUNNER_TEMP/prepared/d16-hperp.txt" \
            --bundle "$RUNNER_TEMP/prepared/d16-aut-prefix256-bundle.txt" \
            --output "$RUNNER_TEMP/out/d16-b12-exact-secondary-${{ matrix.shard }}-of32.json" \
            --dump-canonical "$RUNNER_TEMP/out/d16-b12-exact-secondary-${{ matrix.shard }}-of32.bin" \
            --bound 12 --shard-id ${{ matrix.shard }} --shard-count 32 --split-coordinate 45 --node-cap 120000000
          python - <<'PY'
          import json,os,pathlib
          sid=int('${{ matrix.shard }}'); p=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'out'/f'd16-b12-exact-secondary-{sid}-of32.json').read_text())
          assert p['schema']=='STAGE32_18I_D16_EXACT_TWO_STAGE_SHARDED_TRAVERSAL_CERT_V1'
          assert p['status']=='COMPLETE' and p['bound']==12 and p['two_stage_partition'] is True
          assert (p['primary_split_coordinate'],p['primary_shard_id'],p['primary_shard_count'])==(54,26,1024)
          assert (p['secondary_split_coordinate'],p['secondary_shard_id'],p['secondary_shard_count'])==(45,sid,32)
          assert p['TRAVERSAL_COMPLETENESS_CERTIFICATE'] is True and p['all_symmetry_branch_rejections_exact_rational_cauchy_schwarz'] is True
          print(json.dumps({'repair_secondary':sid,'nodes':p['nodes'],'canonical':p['canonical_survivors_including_zero']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18k-b12-repair-secondary-${{ matrix.shard }}-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/out/
          retention-days: 5
          if-no-files-found: error

  synthesize-logical-26-of1024:
    needs: [validate-run-key, repair-secondary]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SHA-verified inherited and nested-rescue inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/inputs"
          python stages/stage32/32-18K/fetch_cross_run_secondary_inputs.py --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/inputs"
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-18k-b12-repair-secondary-*-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/repairs
          merge-multiple: true
      - name: Assemble exactly 32 logical secondaries
        run: |
          cp "$RUNNER_TEMP/repairs"/d16-b12-exact-secondary-*-of32.json "$RUNNER_TEMP/inputs/secondaries/"
          cp "$RUNNER_TEMP/repairs"/d16-b12-exact-secondary-*-of32.bin "$RUNNER_TEMP/inputs/secondaries/"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'inputs/secondaries'
          js=list(root.glob('d16-b12-exact-secondary-*-of32.json')); bs=list(root.glob('d16-b12-exact-secondary-*-of32.bin'))
          ids=sorted(json.loads(p.read_text())['secondary_shard_id'] for p in js)
          assert len(js)==32 and len(bs)==32 and ids==list(range(32)), (len(js),len(bs),ids)
          print({'logical_secondary_count':32,'ids':ids})
          PY
      - name: Synthesize exact logical 26-of1024
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python stages/stage32/32-18I/synthesize_logical_26_of1024.py \
            --input "$RUNNER_TEMP/inputs/secondaries" \
            --output-json "$RUNNER_TEMP/out/d16-b12-exact-subshard-26-of1024.json" \
            --output-dump "$RUNNER_TEMP/out/d16-b12-exact-subshard-26-of1024.bin" \
            --certificate "$RUNNER_TEMP/out/stage32-18k-logical-26-of1024-certificate.json"
      - name: Independently full-Aut verify logical parent
        run: |
          python stages/stage32/32-18B/verify_d16_bound_canonical.py \
            --aut "$RUNNER_TEMP/inputs/prepared/d16-aut-action.json" \
            --dump "$RUNNER_TEMP/out/d16-b12-exact-subshard-26-of1024.bin" \
            --enum-json "$RUNNER_TEMP/out/d16-b12-exact-subshard-26-of1024.json" \
            --output "$RUNNER_TEMP/out/d16-b12-exact-subshard-26-of1024-verify.json" \
            --bound 12
      - name: Enforce audit stop
        run: |
          cp "$RUNNER_TEMP/inputs/cross-run-inventory.json" "$RUNNER_TEMP/out/"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          p=json.loads((root/'d16-b12-exact-subshard-26-of1024.json').read_text())
          c=json.loads((root/'stage32-18k-logical-26-of1024-certificate.json').read_text())
          assert p['status']=='COMPLETE' and p['shard_id']==26 and p['shard_count']==1024
          assert p['two_stage_partition_certificate'] is True and p['execution_work_counters_not_parent_equivalent'] is True
          assert c['secondary_partition_complete'] is True
          assert c['D16_B12_NUMERICAL_CREDIT'] is False and c['GLOBAL_B12_AGGREGATION_COMPLETE'] is False
          assert c['THEOREM_CREDIT'] is False and c['RECEIVER_CREDIT'] is False
          print(json.dumps(c,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18k-b12-logical-26-of1024-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
