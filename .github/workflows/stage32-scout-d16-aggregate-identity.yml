name: Stage32 scout d16 aggregate identity

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  d16-aggregate-identity-scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact lattice tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pari-gp g++
      - name: Download source-locked Stage32 Picard core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/core"
          gh run download 32624596141 --repo fizawa460-bit/perfect-cuboid-game \
            --name stage32-01-low-degree-verified-prefix --dir "$RUNNER_TEMP/core"
          test -s "$RUNNER_TEMP/core/picard-core.json"
      - name: Build inputs
        run: |
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          python stages/stage32/scouts/d16_constrained_hperp_prepare.py --core "$RUNNER_TEMP/core/picard-core.json" --output "$RUNNER_TEMP/work/d16-base.txt"
          python stages/stage32/scouts/d16_aggregate_identity_prepare.py --input "$RUNNER_TEMP/work/d16-base.txt" --output "$RUNNER_TEMP/work/d16-aggregate.txt"
          python stages/stage32/scouts/d16_aggregate_identity_baseline.py --input "$RUNNER_TEMP/work/d16-aggregate.txt" --output "$RUNNER_TEMP/out/d16-aggregate-baseline.json"
      - name: Compile and run
        run: |
          g++ -O3 -DNDEBUG -std=c++17 stages/stage32/scouts/d16_aggregate_identity_enum.cpp -o "$RUNNER_TEMP/work/d16-aggregate-enum"
          "$RUNNER_TEMP/work/d16-aggregate-enum" --input "$RUNNER_TEMP/work/d16-aggregate.txt" --output "$RUNNER_TEMP/out/d16-aggregate-identity-scout.json" --bounds 2,4,6,8,10,12,16,20,26,34 --per-bound-seconds 90 --node-cap 200000000 --survivor-cap 5000000
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-scout-d16-aggregate-identity
          path: ${{ runner.temp }}/out/
          retention-days: 5
          if-no-files-found: error
