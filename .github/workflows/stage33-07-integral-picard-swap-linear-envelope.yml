name: Stage33-07 integral Picard swap linear envelope

on:
  pull_request:
    branches: [main]
    paths:
      - 'stages/stage33/33-07/certify_integral_picard_swap_linear_envelope.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/picard_coordinate_sign_rows_retained.py'
      - '.github/workflows/stage33-07-integral-picard-swap-linear-envelope.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-07-integral-picard-swap-linear-envelope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: stages/stage33/33-07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact linear algebra
        run: python -m pip install --disable-pip-version-check --no-input sympy==1.14.0
      - name: Certify retained integral Picard linear envelope
        run: python certify_integral_picard_swap_linear_envelope.py
      - name: Enforce exact boundary and Stage33 firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('integral-picard-swap-linear-envelope.json'))
          assert x['schema']=='STAGE33_07_INTEGRAL_PICARD_SWAP_LINEAR_ENVELOPE_V1'
          d=x['exact_joint_character_decomposition']
          assert d['character_count']==40 and d['multiplicity_histogram']=={'1':21,'2':18,'7':1}
          e=x['coordinate_swap_linear_envelope_over_Q']
          assert e['swap12_intertwiner_dimension']==142 and e['swap13_intertwiner_dimension']==142
          assert not e['actual_integral_picard_swap_identified']
          b=x['exact_information_boundary'];p=x['project_status']
          assert b['connecting_matrix_columns_materialized']==0
          assert not b['middle_gersten_module_action_materialized']
          assert not b['project_14x26_L_squareclass_tensor_materialized']
          assert not b['absolute_delta_loc_computed']
          assert not p['actual_index512_glue_identified'] and not p['arithmetic_HS_closed']
          assert p['stage33_progress']=='6/11' and not p['stage33_08_released']
          assert not p['theorem_credit'] and not p['endpoint_credit']
          print('INTEGRAL_PICARD_SWAP_LINEAR_ENVELOPE=PASS_EXACT')
          print('SWAP12_HOM_DIM=142')
          print('SWAP13_HOM_DIM=142')
          print('CERT_SHA256='+x['canonical_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-integral-picard-swap-linear-envelope
          path: stages/stage33/33-07/integral-picard-swap-linear-envelope.json
          retention-days: 3
