name: Stage25-60 R504 rank-jump audit

on:
  pull_request:
    paths:
      - 'stages/stage25/25-60/r504-full-split-normal-form.md'
      - 'stages/stage25/25-60/r504-full-split-audit.py'
      - 'stages/stage25/25-60/r504-nonsplit-commuting-involution.md'
      - 'stages/stage25/25-60/r504-nonsplit-commuting-audit.py'
      - 'stages/stage25/25-60/r504-nonsplit-rank-jump.md'
      - 'stages/stage25/25-60/r504-nonsplit-rank-jump-audit.py'
      - 'stages/stage25/25-60/r504-rank-jump-discovery-ledger.md'
      - 'stages/stage25/25-60/r504-exceptional-search-controller.json'
      - '.github/workflows/stage25-60-r504-rank-jump.yml'
  workflow_dispatch:

jobs:
  r504-rank-jump-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full split symbolic certificate
        run: python stages/stage25/25-60/r504-full-split-audit.py
      - name: Verify nonsplit commuting lift certificate
        run: python stages/stage25/25-60/r504-nonsplit-commuting-audit.py
      - name: Verify explicit nonsplit rank jump
        run: python stages/stage25/25-60/r504-nonsplit-rank-jump-audit.py
