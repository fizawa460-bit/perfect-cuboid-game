name: StructureRadar batch27 analyzer

on:
  push:
    branches:
      - agent/sr-b27-analyzer

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build candidate map
        shell: bash
        run: |
          python - <<'PY'
          import json, re, pathlib, collections
          root = pathlib.Path('.')
          out = root / '.tmp' / 'sr-b27-analysis.json'
          if out.exists():
              print('analysis already exists')
              raise SystemExit(0)
          queue = json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          task = next(t for t in queue['tasks'] if t['status']=='READY' and t['phase']=='SOURCE_CENSUS')
          ids = task['source_ids']
          source_map = {}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              d = json.loads(p.read_text())
              for s in d['sources']:
                  source_map[s['source_id']] = s
          reg = json.loads((root/'docs/structure-radar/structure-registry.json').read_text())['structures']
          stop = set('the and for with from into this that stage result true false current fixed moving exact only does not are was were has have had can could should would through under over all each one two three four five six seven eight nine zero main batch proof theorem bound bounds source card audit json markdown md data stages stage14 stage15'.split())
          def toks(x):
              xs = re.findall(r'[a-z][a-z0-9_+-]{2,}', x.lower())
              return [z for z in xs if z not in stop and not z.startswith('src') and not z.startswith('str')]
          card_data=[]
          for c in reg:
              fields=[]
              for k in ['canonical_math_name','exact_equations_or_object','search_terms_primary','search_terms_aliases','theorem_species','target_populations','potential_weapon_types','applicability_gaps']:
                  v=c.get(k,[])
                  if isinstance(v,list): fields += [str(x) for x in v]
                  else: fields.append(str(v))
              text=' '.join(fields).lower()
              ct=collections.Counter(toks(text))
              prov=[p.get('path','') for p in c.get('repo_provenance',[])]
              card_data.append((c, text, ct, prov))
          rows=[]
          for sid in ids:
              s=source_map[sid]
              p=root/s['path']
              text=p.read_text(errors='replace') if p.exists() else ''
              low=text.lower()
              st=collections.Counter(toks(s['path']+' '+text))
              top_terms=[k for k,v in st.most_common(30)]
              cands=[]
              for c,ctext,ct,prov in card_data:
                  score=0
                  hits=[]
                  # weighted token overlap
                  for term in top_terms:
                      if term in ct:
                          w=min(st[term],4)*min(ct[term],3)
                          score += w
                          if w>=2 and len(hits)<12: hits.append(term)
                  # exact search phrases appearing in source
                  for phrase in c.get('search_terms_primary',[]):
                      ph=str(phrase).lower().strip()
                      if len(ph)>=8 and ph in low:
                          score += 20; hits.append('phrase:'+ph[:80])
                  # same Stage15 lane provenance gets a small prior
                  if s['path'].startswith('stages/stage15/15-6') and any(x.startswith('stages/stage15/15-6') for x in prov):
                      score += 4
                  if s['path'].startswith('stages/stage15/15-') and any(x.startswith('stages/stage15/') for x in prov):
                      score += 2
                  if score:
                      cands.append({'card':c['structure_id'],'name':c['canonical_math_name'],'score':score,'hits':hits[:12]})
              cands.sort(key=lambda x:(-x['score'],x['card']))
              # compact excerpt: headings + first nonempty lines
              lines=[ln.strip() for ln in text.splitlines() if ln.strip()]
              excerpt='\n'.join(lines[:28])[:4500]
              rows.append({'source_id':sid,'path':s['path'],'kind':s['kind'],'top_terms':top_terms[:24],'excerpt':excerpt,'candidates':cands[:10]})
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({'task_id':task['task_id'],'source_count':len(rows),'rows':rows},indent=2,ensure_ascii=False)+'\n')
          print(out)
          PY
      - name: Commit analyzer output
        shell: bash
        run: |
          if git diff --quiet -- .tmp/sr-b27-analysis.json && git ls-files --error-unmatch .tmp/sr-b27-analysis.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp/sr-b27-analysis.json
          git commit -m 'Temp: batch27 analyzer output' || exit 0
          git push
