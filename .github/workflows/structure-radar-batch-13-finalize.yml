name: StructureRadar batch13 finalizer
on:
  push:
    branches: [structure-radar-deep-corpus-batch-13]
    paths:
      - '.github/structure-radar-batch-13-finalize-trigger.txt'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-13
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize batch13 and verify
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          batch='SR-BATCH-STAGE14_15_DEEP_CORPUS-13-R01'
          task_id='SR-CENSUS-STAGE14_15_DEEP_CORPUS-01'
          q=json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          task=next(t for t in q['tasks'] if t['status']=='READY')
          ids=task['source_ids']
          assert len(ids)==60
          manifest={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              d=json.loads(p.read_text())
              for s in d.get('sources',[]): manifest[s['source_id']]=s
          # Exact normalization by source position in the frozen READY slice.
          mp={}
          def assign(a,b,*cards):
              for n in range(a,b+1): mp[ids[n-1]]=list(cards)
          assign(1,5,'SR-STR-173')
          assign(6,6,'SR-STR-196')
          assign(7,16,'SR-STR-173')
          assign(17,17,'SR-STR-196')
          assign(18,27,'SR-STR-174')
          assign(28,28,'SR-STR-190')
          assign(29,36,'SR-STR-173')
          assign(37,38,'SR-STR-024')
          assign(39,39,'SR-STR-190')
          assign(40,44,'SR-STR-024')
          assign(45,45,'SR-STR-190')
          assign(46,48,'SR-STR-197')
          assign(49,52,'SR-STR-198')
          assign(53,56,'SR-STR-199')
          assign(57,58,'SR-STR-200')
          assign(59,60,'SR-STR-201')
          assert set(mp)==set(ids)
          progress_path=root/'docs/structure-radar/progress.json'
          progress=json.loads(progress_path.read_text())
          for sid in ids:
              s=manifest[sid]
              progress['source_reviews'][sid]={
                  'fingerprint':s['fingerprint'],
                  'batch_id':batch,
                  'status':'STRUCTURES_RECORDED',
                  'structure_ids':mp[sid]
              }
          progress.setdefault('audit_batches',[]).append({
              'batch_id':batch,
              'task_id':task_id,
              'status':'SUBMITTED_FOR_AUDIT',
              'source_ids':ids,
              'sources_reviewed':60,
              'structures_added':0,
              'structures_updated':10,
              'structure_carrier_sources':60,
              'structures_deduped':0,
              'searches_completed':0,
              'arsenal_decisions':0,
              'audit_required':True,
              'duplicate_source':0,
              'no_distinct_structure':0
          })
          progress_path.write_text(json.dumps(progress,ensure_ascii=False,indent=2)+'\n')
          reg_path=root/'docs/structure-radar/structure-registry.json'
          reg=json.loads(reg_path.read_text())
          byid={x['structure_id']:x for x in reg['structures']}
          locators={
            'SR-STR-024':'s7-158..164 valuation/nonunit recombination, reduced-modulus character complexity and AP adapter boundary',
            'SR-STR-173':'s7-125..139 and 150..157 filtered-tau3, conditioned second-reverse and common-core/coprime-side refinements',
            'SR-STR-174':'s7-140..149 q17-good pushforward intersection and first-moment encoding',
            'SR-STR-190':'s7-15..17 centered split-k collision/Fourier/projective-slope chain',
            'SR-STR-196':'s7-13..14 full-coordinate min-envelope and transverse k-shell localization',
            'SR-STR-197':'s7-18..20 split disagreement, cross-split Pythagorean incidence and dual-xi injection',
            'SR-STR-198':'s7-21..24 dual CRT short-vector rank elimination and Plucker rigidity',
            'SR-STR-199':'s7-25..28 agreement allocation, reciprocal biquadratic/Cayley reduction and singular rigidity',
            'SR-STR-200':'s7-29..30 common-core Gaussian root-line primitive lattice counting',
            'SR-STR-201':'s7-31..32 fixed-outer gcd-square divisibility and one-host Gaussian reconstruction'
          }
          for sid in ids:
              s=manifest[sid]
              for cid in mp[sid]:
                  card=byid[cid]
                  prov=card.setdefault('repo_provenance',[])
                  if not any(x.get('source_id')==sid for x in prov):
                      prov.append({'source_id':sid,'path':s['path'],'locator':locators[cid],'fingerprint':s['fingerprint']})
          # Preserve the modern no-overclaim boundary explicitly on the three live receiver cards.
          def add_gap(cid,text):
              gaps=byid[cid].setdefault('applicability_gaps',[])
              if text not in gaps:gaps.append(text)
          add_gap('SR-STR-173','Filtered-tau3 witness multiplicity is B^o(1) but is not a density saving; q17 inner-kernel identity does not transfer the conditioned measure, and the residual post-mask remains separately charged.')
          add_gap('SR-STR-174','Good-packet support and its first moment are exponent-equivalent only after the existing B^o(1) pushforward-fiber envelope; the missing lower bound remains on the same charged scalar or (E,m) measure.')
          add_gap('SR-STR-024','Reduced-modulus character families can have polynomial size phi(Q_nu); nonnegativity and character orthogonality alone do not force the target residue class to carry its principal mean.')
          reg['status']='BATCH_SUBMITTED_FOR_AUDIT'
          reg_path.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python scripts/verify_research_arsenal.py
          git diff --check
          rm -f .github/structure-radar-batch-13-summary.txt .github/structure-radar-batch-13-chunk-*.json .github/structure-radar-batch-13-trigger.txt .github/structure-radar-batch-13-finalize-trigger.txt
          rm -f .github/workflows/structure-radar-batch-13-select.yml .github/workflows/structure-radar-batch-13-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'StructureRadar: normalize deep corpus batch 13'
          git push
