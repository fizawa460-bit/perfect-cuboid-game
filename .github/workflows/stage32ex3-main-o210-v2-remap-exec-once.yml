name: Stage32EX3 MAIN O210 V2 executable remap once

on:
  push:
    branches:
      - stage32ex3-ex3-00-typed-cover-tower
    paths:
      - '.github/workflows/stage32ex3-main-o210-v2-remap-exec-once.yml'

permissions:
  contents: write

jobs:
  remap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage32ex3-ex3-00-typed-cover-tower
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute corrected remap body without workflow-file mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/stage32ex3-main-o210-v2-remap-fixed-once.yml')
          s=p.read_text()
          old="          by[AD2]['authority_status']='SUPERSEDED'\n"
          assert s.count(old)==1
          s=s.replace(old,old+"          by[AD2]['audit_receipt']=None\n")
          marker="          python - <<'PY'\n"
          start=s.index(marker)+len(marker)
          end=s.index("          PY\n",start)
          raw=s[start:end]
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())+'\n'
          exec(compile(body,'<corrected-remap-body>','exec'),{'__name__':'__main__'})
          PY
          # Do not let the Actions token push workflow-file changes. The retained
          # read-only replay workflow is updated later through the repository API.
          git checkout -- .github/workflows/stage32ex3-ex3-09-retained-exact-replay.yml
      - name: Replay audited dependencies and provisional MAIN O210 V2
        run: |
          python stages/stage32-ex3/verify_ex3_09_o210_cover_geometry_exclusion_candidate.py
          python stages/stage32-ex3/verify_ex3_10_main_o210_promotion_adapter_candidate_v3.py
          python stages/stage32-ex3/verify_main_o210_exclusion_v2_candidate.py
          python stages/stage32-ex3/verify_main_state.py
      - name: Verify Stage32 claim DAG and remapped active frontier
        run: |
          python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Diff guard
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          changed="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            'stages/stage32-ex3/MAIN-STATE.json' \
            'stages/stage32/proof/ACTIVE-FRONTIER.json' \
            'stages/stage32/proof/CLAIM-REGISTRY.json' \
            'stages/stage32/proof/LANE-ADAPTERS.json' \
            'stages/stage32/proof/historical-routing-blobs/93dee109899185602d9e8e4bb200f614a3b421e0.json' \
            'stages/stage32/proof/verify_stage32_active_frontier.py' \
            'stages/stage32/proof/verify_stage32_claim_dag.py' | sort)"
          printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
      - name: Commit provisional MAIN O210 V2 remap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage32-ex3/MAIN-STATE.json stages/stage32/proof/ACTIVE-FRONTIER.json stages/stage32/proof/CLAIM-REGISTRY.json stages/stage32/proof/LANE-ADAPTERS.json stages/stage32/proof/historical-routing-blobs/93dee109899185602d9e8e4bb200f614a3b421e0.json stages/stage32/proof/verify_stage32_active_frontier.py stages/stage32/proof/verify_stage32_claim_dag.py
          git commit -m '[Stage32EX3][claim-sync] remap MAIN O210 V2 provisional, audit pending'
          git push origin HEAD:stage32ex3-ex3-00-typed-cover-tower
