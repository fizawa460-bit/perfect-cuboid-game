name: Temporary Stage27 r5aj exact verifier repair

on:
  push:
    branches:
      - agent/stage27-19-r5aj-residual-chart
    paths:
      - 'scripts/tmp_repair_stage27_historical_verifiers.py'
      - '.github/workflows/tmp-stage27-r5aj-verifier-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-19-r5aj-residual-chart
          fetch-depth: 0
      - name: Fetch main provenance
        run: git fetch origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore theorem verifiers and apply exact lifecycle-only edits
        run: |
          python scripts/tmp_repair_stage27_historical_verifiers.py
          python -m py_compile \
            stages/stage27/27-19-r401/verify_27_19_r401.py \
            stages/stage27/27-19-r401a/verify_27_19_r401a.py \
            stages/stage27/27-19-r401b/verify_27_19_r401b.py \
            stages/stage27/27-19-r401c/verify_27_19_r401c.py \
            stages/stage27/27-19-r401d/verify_27_19_r401d.py \
            stages/stage27/27-19-r402/verify_27_19_r402.py \
            stages/stage27/27-19-r402a/verify_27_19_r402a.py \
            stages/stage27/27-19-r402b/verify_27_19_r402b.py \
            stages/stage27/27-19-r402c-f/verify_27_19_r402c_f.py \
            stages/stage27/27-19-r5ah/verify_27_19_r5ah_r5ai.py
          python stages/stage27/27-19-r401/verify_27_19_r401.py
          python stages/stage27/27-19-r401a/verify_27_19_r401a.py
          python stages/stage27/27-19-r401b/verify_27_19_r401b.py
          python stages/stage27/27-19-r401c/verify_27_19_r401c.py
          python stages/stage27/27-19-r401d/verify_27_19_r401d.py
          python stages/stage27/27-19-r402/verify_27_19_r402.py
          python stages/stage27/27-19-r402a/verify_27_19_r402a.py
          python stages/stage27/27-19-r402b/verify_27_19_r402b.py
          python stages/stage27/27-19-r402c-f/verify_27_19_r402c_f.py
          python stages/stage27/27-19-r5ah/verify_27_19_r5ah_r5ai.py
          python stages/stage27/27-19-r5aj/verify_27_19_r5aj_r5ak.py
          git diff --check
      - name: Commit exact repair and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stages/stage27/27-19-r401* stages/stage27/27-19-r402* stages/stage27/27-19-r5ah/verify_27_19_r5ah_r5ai.py
          git rm scripts/tmp_repair_stage27_historical_verifiers.py .github/workflows/tmp-stage27-r5aj-verifier-repair.yml
          git add -A
          git commit -m 'Stage27-19-r5aj: repair historical verifier lifecycle checks exactly'
          git push origin HEAD:agent/stage27-19-r5aj-residual-chart
