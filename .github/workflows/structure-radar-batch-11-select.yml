name: StructureRadar batch11 selector
on:
  push:
    branches: [structure-radar-deep-corpus-batch-11]
permissions:
  contents: write
jobs:
  select:
    if: contains(github.event.head_commit.message, 'trigger batch11 selector')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize next 60-source compact indexes
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')
          q=json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          t=next(x for x in q['tasks'] if x['status']=='READY')
          ids=t['source_ids']
          src={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              for s in json.loads(p.read_text())['sources']:
                  src[s['source_id']]=s
          selected=[src[i] for i in ids]
          out={'batch_id':'SR-BATCH-STAGE14_15_DEEP_CORPUS-11-R01','task_id':t['task_id'],'source_count':len(selected),'sources':selected}
          (root/'.github/structure-radar-batch-11-selection.json').write_text(json.dumps(out,indent=2)+'\n')
          idx=[]
          for n,s in enumerate(selected,1):
              p=root/s['path']; text=p.read_text(errors='replace')
              title=next((ln[2:].strip() for ln in text.splitlines() if ln.startswith('# ')), '')
              flags=[]
              for ln in text.splitlines():
                  z=ln.strip()
                  if re.match(r'^[A-Z][A-Z0-9_]*(?:=|:)',z): flags.append(z)
              seen=set(); compact=[]
              for z in reversed(flags):
                  if z not in seen:
                      seen.add(z); compact.append(z)
                  if len(compact)>=40: break
              compact=list(reversed(compact))
              idx.append({'n':n,'source_id':s['source_id'],'path':s['path'],'kind':s['kind'],'title':title,'boundary_fields':compact})
          for j in range(12):
              (root/f'.github/structure-radar-batch-11-index-{j+1:02d}.json').write_text(json.dumps(idx[j*5:(j+1)*5],indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/structure-radar-batch-11-selection.json .github/structure-radar-batch-11-index-*.json
          git commit -m 'StructureRadar: materialize batch11 source indexes' || exit 0
          git push origin HEAD:structure-radar-deep-corpus-batch-11
