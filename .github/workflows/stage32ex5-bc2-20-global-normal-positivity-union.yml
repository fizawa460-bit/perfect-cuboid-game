name: Stage32EX5 BC2-20 global normal positivity union

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_20_global_normal_positivity_union_check.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-19-n354-survivor-normal-positivity-mass-checkpoint.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-18-n354-survivor-selected-exceptional-mod8-checkpoint.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-17-n354-authority-picard64-retarget-v2-evidence.json'
      - 'stages/stage32-ex5/runkeys/bc2-20-global-normal-positivity-union.json'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - 'stages/stage32/residual-32-01-production/hperp_integral_adapter.py'
      - '.github/workflows/stage32ex5-bc2-20-global-normal-positivity-union.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - id: gate
        name: Validate fresh BC2-20 run-key arm
        shell: bash
        run: |
          set -euo pipefail
          KEY='stages/stage32-ex5/runkeys/bc2-20-global-normal-positivity-union.json'
          SOURCE='stages/stage32-ex5/breadth-cycle-2/bc2_20_global_normal_positivity_union_check.py'
          BEFORE='${{ github.event.before }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test '${{ github.event.action }}' = synchronize || exit 0
          test -n "$BEFORE" || exit 0
          test "$(git rev-parse HEAD)" = "$HEAD" || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || exit 0
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          git diff --name-only "$BEFORE" "$HEAD" | grep -Fxq "$KEY" || exit 0
          test -f "$KEY" -a -f "$SOURCE" || exit 0
          python - "$KEY" "$SOURCE" "$BEFORE" <<'PY'
          import json, subprocess, sys
          key_path, source_path, before = sys.argv[1:]
          new = json.load(open(key_path))
          assert new['schema'] == 'STAGE32EX5_BC2_20_GLOBAL_NORMAL_POSITIVITY_UNION_RUNKEY_V1'
          assert new['armed'] is True
          assert int(new['generation']) > 0
          assert new['target'] == {
              'g': 1, 'd': 8, 'e': 8, 'first_block': [0,112],
              'input_bc2_18_parent_count': 7336,
              'bc2_19_unknown_parent_count': 236,
          }
          assert new['bc2_19_checkpoint_canonical'] == '62e97cdb8bd6a8d14c0ac176576bd2cf2ec51020295f8703cbefc3bc85f001eb'
          source_blob = subprocess.check_output(['git','hash-object',source_path], text=True).strip()
          assert new['source_git_blob_sha'] == source_blob
          old_raw = subprocess.run(['git','show',f'{before}:{key_path}'], text=True, capture_output=True)
          if old_raw.returncode == 0:
              old = json.loads(old_raw.stdout)
              assert int(new['generation']) > int(old.get('generation', -1))
          ex = new['execution']
          assert ex['solver_timeout_ms'] == 300000
          assert ex['workflow_timeout_minutes'] == 10
          assert ex['effective_heavy_concurrency'] == 1
          assert ex['artifact_retention_days'] == 1
          assert ex['projected_peak_artifact_bytes'] <= 100000
          assert ex['repository_storage_budget_bytes'] == 524288000
          PY
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  global-union:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Compile BC2-20
        run: python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_20_global_normal_positivity_union_check.py
      - name: Run exact global union check
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_20_global_normal_positivity_union_check.py \
            --solver-timeout-ms 300000 \
            --output "$RUNNER_TEMP/bc2-20.json"
          cat "$RUNNER_TEMP/bc2-20.json"
      - name: Validate scope firewalls
        run: |
          python - "$RUNNER_TEMP/bc2-20.json" <<'PY'
          import json, sys
          p = json.load(open(sys.argv[1]))
          assert p['union_equivalence']['bc2_18_mod8_parent_count'] == 7336
          assert p['union_equivalence']['global_sat_iff_some_bc2_18_parent_sat'] is True
          assert p['credit']['whole_stratum_closed'] is False
          assert p['credit']['full178_complete'] is False
          assert p['credit']['stage32_main_credit'] is False
          assert p['credit']['effectivity_or_actual_curve_existence_proved'] is False
          assert p['firewalls']['unknown_relabelled_unsat'] is False
          assert p['firewalls']['main_promotion'] is False
          assert p['firewalls']['merge_authorized'] is False
          print('BC2_20_SCOPE_OK', p['status'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-20-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/bc2-20.json
          retention-days: 1
          compression-level: 0
