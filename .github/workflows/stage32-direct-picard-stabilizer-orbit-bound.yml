name: Stage32 direct Picard slice stabilizer orbit bound

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - 'stages/stage32/residual-32-01-production/direct_picard_slice_stabilizer_orbit_bound.py'
      - 'stages/stage32/residual-32-01-production/build_direct_picard_stabilizer_orbit_census.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_slice_bridge.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_slice_quadratic_bound.py'
      - 'stages/stage32/residual-32-01-production/hperp_integral_adapter.py'
      - 'stages/stage32/residual-32-01-production/pairing_prefix_engine.py'
      - 'stages/stage32/residual-32-01-production/full178-manifest.json'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - '.github/workflows/stage32-direct-picard-stabilizer-orbit-bound.yml'

permissions:
  contents: read

jobs:
  stabilizer-orbit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Build exact slice-stabilizer orbit certificate
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib, sys
          root=pathlib.Path.cwd()
          prod=root/'stages/stage32/residual-32-01-production'
          sys.path.insert(0,str(prod))
          from direct_picard_slice_stabilizer_orbit_bound import DirectPicardSliceStabilizerOrbitBound
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path)
              assert spec and spec.loader
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod.load()
          bundle=load(root/'stages/stage33/33-07/picard_base_rows_retained.py','s32_stabilizer_picard')
          marking=load(root/'stages/stage33/33-07/stage32_picard_marking_retained.py','s32_stabilizer_marking')
          model=DirectPicardSliceStabilizerOrbitBound.from_retained(marking,bundle)
          c=model.certificate
          assert c['full_aut_group_order']==1536
          assert sum(c['orbit_sizes'])==140
          pathlib.Path('direct-picard-slice-stabilizer-orbit-bound.json').write_text(
              json.dumps(c,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps({
              'verdict':'PASS_DIRECT_PICARD_SLICE_STABILIZER_ORBIT_BOUND',
              'stabilizer_order':c['slice_stabilizer_group_order'],
              'orbit_count':c['known_curve_orbit_count'],
              'orbit_sizes':c['orbit_sizes'],
              'fixed_orbits':c['fixed_orbit_sum_count'],
              'nonfixed_orbits':c['nonfixed_orbit_sum_count'],
              'canonical_sha256':c['canonical_sha256_without_this_field'],
          },sort_keys=True))
          PY
      - name: Apply fixed orbit-sum gates to FULL178 direct slices
        run: |
          python stages/stage32/residual-32-01-production/build_direct_picard_stabilizer_orbit_census.py \
            --manifest stages/stage32/residual-32-01-production/full178-manifest.json \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --output direct-picard-stabilizer-orbit-census.json
      - name: Upload compact stabilizer-orbit evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-direct-picard-stabilizer-orbit
          path: |
            direct-picard-slice-stabilizer-orbit-bound.json
            direct-picard-stabilizer-orbit-census.json
          retention-days: 7
          compression-level: 9
