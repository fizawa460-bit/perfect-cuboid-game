name: Stage34-02b D2 remaining26 sign-orbit lock replay

on:
  push:
    branches:
      - stage34-02b-genus2-rankle1-rationalpoints
    paths:
      - '.github/workflows/stage34-02b-d2-remaining26-sign-orbit-lock.yml'
      - 'stages/stage34/34-02/build_d2_stageA2_remaining26_sign_orbit_representatives.py'
      - 'stages/stage34/34-02/d2-stageA2-sign-involution-remaining30-pair-lock.json'
      - 'stages/stage34/34-02/d2-stageA2-two-orbit-audit-promotion-certificate.json'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify exact remaining 13-orbit lock
        run: |
          python3 stages/stage34/34-02/build_d2_stageA2_remaining26_sign_orbit_representatives.py
          cat stages/stage34/34-02/d2-stageA2-remaining26-sign-orbit-representatives-lock.json
      - name: Upload compact lock
        uses: actions/upload-artifact@v4
        with:
          name: stage34-02b-remaining26-sign-orbit-lock
          path: stages/stage34/34-02/d2-stageA2-remaining26-sign-orbit-representatives-lock.json
          if-no-files-found: error
          retention-days: 1
