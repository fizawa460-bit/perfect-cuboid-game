name: Stage33 R5B3B3C1 QQ unique-norm factorization scratch
on:
  push:
    branches: [stage33-r5b3b3c1-modular-factor-scratch]
    paths:
      - '.github/workflows/stage33-r5b3b3c1-qq-unique-norm-factorization-scratch.yml'
      - 'stages/stage33/33-12/diagnose_e3_v91c1x_r5b3b3c1_qq_unique_norm_factorization.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage33-r5b3b3c1-modular-factor-scratch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Factor unique offboundary norms over QQ
        run: python stages/stage33/33-12/diagnose_e3_v91c1x_r5b3b3c1_qq_unique_norm_factorization.py --write
      - name: Commit scratch result
        run: |
          git diff --check
          test "$(git status --porcelain | wc -l)" -eq 1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stages/stage33/33-12/e3-v91c1x-r5b3b3c1-qq-unique-norm-factorization-scratch.json
          git commit -m '[Stage33] materialize QQ unique-norm factorization scratch'
          git push origin HEAD:stage33-r5b3b3c1-modular-factor-scratch
