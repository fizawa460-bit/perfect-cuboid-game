name: Stage33 V91C1X_R4 exceptional chart compact selector

on:
  push:
    branches:
      - stage33-v91c1x-r4-cover-indexed-h2-representative
    paths:
      - '.github/workflows/stage33-v91c1x-r4-exceptional-chart-selector.yml'
      - 'stages/stage33/33-12/diagnose_e3_v91c1x_r4_exceptional_chart_selector.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selector:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage33-v91c1x-r4-cover-indexed-h2-representative
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select only A2_02 exceptional chart schema
        run: python stages/stage33/33-12/diagnose_e3_v91c1x_r4_exceptional_chart_selector.py
      - name: Verify bounded output only
        run: |
          git diff --check
          test "$(git status --porcelain | wc -l)" -eq 1
          git status --porcelain | grep 'stages/stage33/33-12/e3-v91c1x-r4-exceptional-chart-selector.json'
      - name: Commit compact selector output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stages/stage33/33-12/e3-v91c1x-r4-exceptional-chart-selector.json
          git commit -m '[Stage33] materialize R4 exceptional chart selector'
          git push origin HEAD:stage33-v91c1x-r4-cover-indexed-h2-representative
