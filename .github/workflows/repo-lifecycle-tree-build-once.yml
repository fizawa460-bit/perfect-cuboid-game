name: Repository lifecycle tree build (one shot)

on:
  push:
    branches:
      - impl/stage32ex5-bc2-12-outer-rank3

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/stage32ex5-bc2-12-outer-rank3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build normalized repository tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/repo-lifecycle-tree-build-once.yml
          python - <<'PY'
          from pathlib import Path
          import json, os, re, subprocess

          root=Path('.')
          wf=root/'.github/workflows'
          active={
            '.github/workflows/pages.yml',
            '.github/workflows/research-arsenal.yml',
            '.github/workflows/structure-radar.yml',
            '.github/workflows/stage32-01-178-n356-optimistic-exceptional-transport.yml',
            '.github/workflows/stage32-main-startup-authority.yml',
            '.github/workflows/stage32-claim-frontier-integrity.yml',
            '.github/workflows/stage32-stale-run-sweeper.yml',
            '.github/workflows/stage32-ex5-main.yml',
            '.github/workflows/stage32ex5-bc2-24-explicit-fibre-degree-partition.yml',
            '.github/workflows/stage35-35-01-to-09-audit.yml',
            '.github/workflows/stage35-ex-goal4cf-selected-discriminant-height.yml',
            '.github/workflows/stage36-bootstrap-audit.yml',
          }
          manual={
            '.github/workflows/stage32-01-178-n350-production-leaf-contract.yml',
            '.github/workflows/stage32-root-cleanup-phase-b.yml',
            '.github/workflows/stage32-n350-symbolic-mirror-generator.yml',
            '.github/workflows/stage32-q604-opposite-pair-residue-pack.yml',
          }
          def cls(p):
            if p in active: return 'ACTIVE_AUTO'
            if p in manual: return 'MANUAL'
            if re.match(r'\.github/workflows/stage\d',p): return 'RETIRED'
            return 'MANUAL'
          def span(lines):
            for i,line in enumerate(lines):
              if line.startswith('on:'):
                end=i+1
                if line.strip()!='on:': return i,end
                while end<len(lines):
                  s=lines[end]
                  if s and not s[0].isspace() and not s.lstrip().startswith('#'): break
                  end+=1
                return i,end
            return None
          def events(text):
            lines=text.splitlines(); sp=span(lines)
            if sp is None: return set()
            start,end=sp; first=lines[start].strip()
            if first!='on:':
              rhs=first.split(':',1)[1].strip()
              if rhs.startswith('[') and rhs.endswith(']'):
                return {x.strip().strip("'\"") for x in rhs[1:-1].split(',') if x.strip()}
              return {rhs.strip("'\"")} if rhs else set()
            out=set()
            for line in lines[start+1:end]:
              m=re.match(r'^  ([A-Za-z0-9_-]+):',line)
              if m: out.add(m.group(1))
            return out
          def manualize(text):
            lines=text.splitlines(); start,end=span(lines)
            return '\n'.join(lines[:start]+['on:','  workflow_dispatch:']+lines[end:])+('\n' if text.endswith('\n') else '')

          paths=sorted([*wf.glob('*.yml'),*wf.glob('*.yaml')])
          changed=[]; counts={'ACTIVE_AUTO':0,'MANUAL':0,'RETIRED':0}
          for p in paths:
            r=p.as_posix(); c=cls(r); counts[c]+=1
            text=p.read_text()
            if c in {'MANUAL','RETIRED'} and events(text)!={'workflow_dispatch'}:
              p.write_text(manualize(text)); changed.append(r)
          # Safety: every retained ACTIVE_AUTO present on this branch must still be automatic.
          bad=[]
          for p in paths:
            r=p.as_posix()
            if cls(r)=='ACTIVE_AUTO' and not (events(p.read_text())-{'workflow_dispatch','workflow_call'}): bad.append(r)
          if bad: raise SystemExit('ACTIVE_AUTO lost automatic trigger: '+','.join(bad))
          residual=[]
          for p in paths:
            r=p.as_posix(); c=cls(r)
            if c in {'MANUAL','RETIRED'} and events(p.read_text())!={'workflow_dispatch'}: residual.append(r)
          if residual: raise SystemExit('residual auto trigger: '+','.join(residual))

          base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          tree=[]
          for r in changed:
            data=Path(r).read_bytes()
            import base64
            payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'})
            out=subprocess.run(['gh','api','--method','POST',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs','--input','-'],input=payload,text=True,capture_output=True,check=True)
            sha=json.loads(out.stdout)['sha']
            tree.append({'path':r,'mode':'100644','type':'blob','sha':sha})
          tree.append({'path':'.github/workflows/repo-lifecycle-tree-build-once.yml','mode':'100644','type':'blob','sha':None})
          payload=json.dumps({'base_tree':base_tree,'tree':tree})
          out=subprocess.run(['gh','api','--method','POST',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/trees','--input','-'],input=payload,text=True,capture_output=True,check=True)
          final_tree=json.loads(out.stdout)['sha']
          print('FINAL_TREE_SHA='+final_tree)
          print('WORKFLOW_TOTAL='+str(len(paths)))
          print('COUNTS='+json.dumps(counts,sort_keys=True))
          print('CHANGED_COUNT='+str(len(changed)))
          print('CHANGED_BEGIN')
          for r in changed: print(r)
          print('CHANGED_END')
          print('historical_or_manual_automatic_triggers=0')
          PY
