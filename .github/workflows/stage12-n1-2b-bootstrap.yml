name: Stage12-N1-2b bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage12-n1-2b-average
    paths:
      - "scripts/audit_shared_p_average_stage12_n1_2b.py"
      - "scripts/update_shared_p_average_stage12_n1_2b_memo.py"
      - ".github/workflows/stage12-n1-2b-bootstrap.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage12-n1-2b-average
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate report and memo
        run: |
          python -m py_compile scripts/audit_shared_p_average_stage12_n1_2b.py
          python -m py_compile scripts/update_shared_p_average_stage12_n1_2b_memo.py
          python scripts/audit_shared_p_average_stage12_n1_2b.py \
            --write-report data/shared_p_average_stage12_n1_2b_report.json
          python scripts/update_shared_p_average_stage12_n1_2b_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --report data/shared_p_average_stage12_n1_2b_report.json \
            --output generated-face-ratio-geometry-research.md
          mv generated-face-ratio-geometry-research.md docs/face-ratio-geometry-research.md
          rm -f .github/workflows/stage12-n1-2b-bootstrap.yml
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/face-ratio-geometry-research.md data/shared_p_average_stage12_n1_2b_report.json .github/workflows/stage12-n1-2b-bootstrap.yml
          git commit -m "Generate Stage12-N1-2b outputs"
          git push origin HEAD:agent/stage12-n1-2b-average
