name: Stage32 post1532 full Stoll H-orbit negative certificate

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-post1529-full-stoll-h-orbit.yml'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_post1529_full_stoll_h_orbit.py'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1532_full_stoll_h_orbit_symmetry_negative.py'
      - 'stages/stage32/residual-32-01-production/post1532-full-stoll-h-orbit-symmetry-negative.json'
      - 'stages/stage32/residual-32-01-production/post1532-full-stoll-h-orbit-symmetry-negative-source-note.md'
      - 'stages/stage32/residual-32-01-production/post1490-o210-q4-equivariant-beauville-deck-cross-exclusion.json'
      - 'stages/stage32/32-21/post1473-v6-witness-body-recovered.json'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - 'stages/stage32/controller.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enumerate full retained Stoll action against V6 H-orbit
        run: python3 stages/stage32/residual-32-01-production/diagnose_stage32_post1529_full_stoll_h_orbit.py
      - name: Certify exact bounded-negative full-Stoll route closure
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1532_full_stoll_h_orbit_symmetry_negative.py
      - name: Enforce no controller edit in this bounded-negative leaf
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -qx 'stages/stage32/controller.json'; then
            echo 'controller.json must remain unchanged in this bounded-negative leaf'
            exit 1
          fi
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
