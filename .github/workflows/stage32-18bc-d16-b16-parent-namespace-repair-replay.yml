name: Stage32-18BC d16 b16 timeout recovery chunks

on:
  push:
    branches: [stage32-18ax-b16-remaining-walls-tier3-planner]
    paths: ['stages/stage32/runkeys/18bc-b16-parent-namespace-repair-replay.json']

permissions: {contents: read, actions: read}
concurrency: {group: stage32-18bc-b16-parent-namespace-repair-replay, cancel-in-progress: true}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          KEY=stages/stage32/runkeys/18bc-b16-parent-namespace-repair-replay.json
          authorized=false
          if [ -n "$BEFORE" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git diff --name-only "$BEFORE" "$HEAD_SHA" | grep -Fxq "$KEY"; then
              python - <<'PY'
          import json,os,pathlib,subprocess
          key='stages/stage32/runkeys/18bc-b16-parent-namespace-repair-replay.json'
          d=json.loads(pathlib.Path(key).read_text())
          old=json.loads(subprocess.check_output(['git','show',os.environ['BEFORE']+':'+key],text=True))
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1'
          assert old['generation']==4 and d['generation']==5 and d['generation']==old['generation']+1 and d['armed']
          assert d['bound']==16 and d['algorithm']=='pairwise6_strict_below_cut39'
          assert d['mode']=='timeout_recovery_chunks' and d['chunk_size']==8
          assert d['source_exact_artifact_id']==9574308138 and d['planner_probe_budget']==262144
          assert d['max_parallel']==6 and d['parent_cut']==39 and d['require_parent_stream_byte_identity'] is True
          assert d['parent_stream_gate_run_id']==33155002856 and len(d['parent_stream_gate_artifacts'])==6
          assert set(d['successful_replay_artifacts'])=={'p503-s665','p922-s13','p922-s38'}
          assert [(x['wall'],x['monster_count']) for x in d['recovery_walls']]==[('p436-s5',36),('p436-s362',34),('p503-s118',31)]
          assert d['storage_preflight']['projected_new_peak_mb_lt']<=2 and d['concurrency_preflight']['planned_effective_heavy_concurrency']==6
          PY
              authorized=true
            fi
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"

  recover_timeout_chunks:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {wall: p436-s5, primary: 436, shard: 5, frontier: 4103, monster_count: 36, artifact: 9675439606, chunk: 0}
          - {wall: p436-s5, primary: 436, shard: 5, frontier: 4103, monster_count: 36, artifact: 9675439606, chunk: 1}
          - {wall: p436-s5, primary: 436, shard: 5, frontier: 4103, monster_count: 36, artifact: 9675439606, chunk: 2}
          - {wall: p436-s5, primary: 436, shard: 5, frontier: 4103, monster_count: 36, artifact: 9675439606, chunk: 3}
          - {wall: p436-s5, primary: 436, shard: 5, frontier: 4103, monster_count: 36, artifact: 9675439606, chunk: 4}
          - {wall: p436-s362, primary: 436, shard: 362, frontier: 3897, monster_count: 34, artifact: 9676696013, chunk: 0}
          - {wall: p436-s362, primary: 436, shard: 362, frontier: 3897, monster_count: 34, artifact: 9676696013, chunk: 1}
          - {wall: p436-s362, primary: 436, shard: 362, frontier: 3897, monster_count: 34, artifact: 9676696013, chunk: 2}
          - {wall: p436-s362, primary: 436, shard: 362, frontier: 3897, monster_count: 34, artifact: 9676696013, chunk: 3}
          - {wall: p436-s362, primary: 436, shard: 362, frontier: 3897, monster_count: 34, artifact: 9676696013, chunk: 4}
          - {wall: p503-s118, primary: 503, shard: 118, frontier: 3596, monster_count: 31, artifact: 9676719989, chunk: 0}
          - {wall: p503-s118, primary: 503, shard: 118, frontier: 3596, monster_count: 31, artifact: 9676719989, chunk: 1}
          - {wall: p503-s118, primary: 503, shard: 118, frontier: 3596, monster_count: 31, artifact: 9676719989, chunk: 2}
          - {wall: p503-s118, primary: 503, shard: 118, frontier: 3596, monster_count: 31, artifact: 9676719989, chunk: 3}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked source and select original monster chunk
        env:
          GH_TOKEN: '${{ github.token }}'
          ARTIFACT: '${{ matrix.artifact }}'
          MONSTER_COUNT: '${{ matrix.monster_count }}'
          CHUNK: '${{ matrix.chunk }}'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++ libboost-dev
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/monster" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/source.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/src"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/monster.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT}/zip"
          unzip -q "$RUNNER_TEMP/monster.zip" -d "$RUNNER_TEMP/monster"
          python - <<'PY'
          import hashlib,json,os,pathlib
          ids=None
          for p in (pathlib.Path(os.environ['RUNNER_TEMP'])/'monster').rglob('*.json'):
              try:
                  d=json.loads(p.read_text())
                  if 'monster_frontier_ids' in d: ids=d['monster_frontier_ids']; break
                  if 'tier4_frontier_ids' in d: ids=d['tier4_frontier_ids']; break
              except Exception: pass
          n=int(os.environ['MONSTER_COUNT']); chunk=int(os.environ['CHUNK']); size=8
          assert ids is not None and len(ids)==n and len(ids)==len(set(ids))
          selected=ids[chunk*size:(chunk+1)*size]
          last=(len(ids)-1)//size
          assert 0 <= chunk <= last and selected
          if chunk < last:
              assert len(selected)==size
          else:
              assert len(selected)==len(ids)-last*size
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'work'
          root.joinpath('monster-ids.txt').write_text(''.join(f'{x}\n' for x in selected))
          root.joinpath('source-ids.sha256').write_text(hashlib.sha256((''.join(f'{x}\n' for x in ids)).encode()).hexdigest()+'\n')
          PY
      - name: Build repaired pairwise6 certifier
        env: {PRIMARY: '${{ matrix.primary }}'}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/work/cert.cpp"
          python stages/stage32/32-18X/build_two_stage_certifier.py --source "$RUNNER_TEMP/src/d16-exact-symmetry-sharded.cpp" --output "$SRC" --primary-id "$PRIMARY"
          SRC="$SRC" python stages/stage32/32-18AF/patch_symmetry_schedule.py
          SRC="$SRC" PAIR_LIMIT=6 python stages/stage32/32-18AY/patch_pairwise_symmetry.py
          SRC="$SRC" python stages/stage32/32-18AO/patch_block_frontier.py
          SRC="$SRC" python stages/stage32/32-18AP/patch_lower_block_replay.py
          SRC="$SRC" python stages/stage32/32-18AR/patch_frontier_cost_planner.py
          SRC="$SRC" python stages/stage32/32-18AS/patch_selective_frontier_planner.py
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic "$SRC" -o "$RUNNER_TEMP/work/cert"
          cp "$RUNNER_TEMP/src/d16-hperp.txt" "$RUNNER_TEMP/work/"
          cp "$RUNNER_TEMP/src/d16-aut-prefix256-bundle.txt" "$RUNNER_TEMP/work/"
      - name: Replay selected original monster parents
        env:
          SHARD: '${{ matrix.shard }}'
          WALL: '${{ matrix.wall }}'
          CHUNK: '${{ matrix.chunk }}'
          MONSTER_COUNT: '${{ matrix.monster_count }}'
          EXPECTED_FRONTIER: '${{ matrix.frontier }}'
          SOURCE_ARTIFACT: '${{ matrix.artifact }}'
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" timeout --signal=TERM --kill-after=20s 40m "$RUNNER_TEMP/work/cert" --input "$RUNNER_TEMP/work/d16-hperp.txt" --bundle "$RUNNER_TEMP/work/d16-aut-prefix256-bundle.txt" --output "$RUNNER_TEMP/out/cert.json" --dump-canonical "$RUNNER_TEMP/out/dump.bin" --bound 16 --shard-id "$SHARD" --shard-count 1024 --split-coordinate 48 --block-cut 39 --frontier-cap 50000 --replay-limit 0 --planner-probe-budget 262144 --planner-output "$RUNNER_TEMP/out/costs.csv" --planner-id-file "$RUNNER_TEMP/work/monster-ids.txt" --node-cap 12000000 >/dev/null 2>"$RUNNER_TEMP/out/stderr.txt"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then cat "$RUNNER_TEMP/out/stderr.txt" >&2; exit "$rc"; fi
          RC="$rc" python - <<'PY'
          import csv,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']); outdir=root/'out'
          selected=[int(x) for x in (root/'work'/'monster-ids.txt').read_text().split()]
          rows=[]
          if (outdir/'costs.csv').exists():
              rows=list(csv.DictReader((outdir/'costs.csv').open()))
          processed=[int(r['frontier_id']) for r in rows]
          assert processed==selected[:len(processed)]
          rc=int(os.environ['RC'])
          if rc==0:
              assert len(rows)==len(selected)
              cert=json.loads((outdir/'cert.json').read_text()); assert cert['frontier_states']==int(os.environ['EXPECTED_FRONTIER'])
          else:
              assert rc==124 and len(rows)<=len(selected)
          completed=[int(r['frontier_id']) for r in rows if r['complete']=='1']
          unresolved=[x for x in selected if x not in set(completed)]
          runtime=float((outdir/'runtime.txt').read_text().strip()) if (outdir/'runtime.txt').exists() else None
          result={'schema':'STAGE32_18BC_TIMEOUT_RECOVERY_CHUNK_V1','algorithm':'pairwise6_strict_below_cut39','wall':os.environ['WALL'],'chunk_index':int(os.environ['CHUNK']),'source_monster_artifact_id':int(os.environ['SOURCE_ARTIFACT']),'source_ids_sha256':(root/'work'/'source-ids.sha256').read_text().strip(),'original_wall_monster_count':int(os.environ['MONSTER_COUNT']),'selected_count':len(selected),'selected_frontier_ids':selected,'processed_count':len(rows),'completed_count':len(completed),'completed_frontier_ids':completed,'unresolved_count':len(unresolved),'unresolved_frontier_ids':unresolved,'timeout_exit_124':rc==124,'probe_budget_per_state':262144,'runtime_seconds':runtime,'parent_cut':39,'parent_partition_stable_from_g4':True,'D16_B16_NUMERICAL_CREDIT':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False}
          (outdir/'compact.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          for x in ['cert.json','dump.bin','costs.csv','stderr.txt']:(outdir/x).unlink(missing_ok=True)
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18bc-g5-${{ matrix.wall }}-c${{ matrix.chunk }}
          path: ${{ runner.temp }}/out/
          retention-days: 2
          if-no-files-found: error

  summarize:
    needs: [authorize, recover_timeout_chunks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-18bc-g5-*
          path: ${{ runner.temp }}/chunks
      - name: Fetch successful G4 wall certificates
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prior"
          for spec in p503-s665:9680367318 p922-s13:9680561371 p922-s38:9680338221; do
            wall=${spec%%:*}; aid=${spec##*:}; mkdir -p "$RUNNER_TEMP/prior/$wall"
            curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/$wall.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip"
            unzip -q "$RUNNER_TEMP/$wall.zip" -d "$RUNNER_TEMP/prior/$wall"
          done
      - name: Build repaired original-172 summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          chunks=[json.loads(p.read_text()) for p in (root/'chunks').rglob('compact.json')]
          assert len(chunks)==14,len(chunks)
          expected={'p436-s5':(36,5),'p436-s362':(34,5),'p503-s118':(31,4)}
          wall_docs=[]; all_residual={}
          for wall,(n,nchunks) in expected.items():
              ds=sorted((d for d in chunks if d['wall']==wall),key=lambda d:d['chunk_index'])
              assert len(ds)==nchunks and [d['chunk_index'] for d in ds]==list(range(nchunks))
              assert len({d['source_ids_sha256'] for d in ds})==1
              selected=[x for d in ds for x in d['selected_frontier_ids']]
              assert len(selected)==len(set(selected))==n and sum(d['selected_count'] for d in ds)==n
              completed=sum(d['completed_count'] for d in ds)
              residual=[x for d in ds for x in d['unresolved_frontier_ids']]
              assert len(residual)==n-completed and len(residual)==len(set(residual))
              wall_docs.append({'wall':wall,'monster_count':n,'completed_count':completed,'unresolved_count':len(residual),'unresolved_frontier_ids':residual,'chunk_count':nchunks,'timeout_chunks':sum(d['timeout_exit_124'] for d in ds),'source_ids_sha256':ds[0]['source_ids_sha256']})
              all_residual[wall]=residual
          prior=[]
          for wall in ['p503-s665','p922-s13','p922-s38']:
              docs=[json.loads(p.read_text()) for p in (root/'prior'/wall).rglob('compact.json')]
              assert len(docs)==1, (wall,len(docs)); d=docs[0]
              assert d['wall']==wall and d['schema']=='STAGE32_18BC_REPAIRED_ORIGINAL_MONSTER_RESULT_V1' and d['parent_partition_stable'] is True
              prior.append(d); all_residual[wall]=d['unresolved_frontier_ids']
          monster_total=sum(d['monster_count'] for d in wall_docs)+sum(d['monster_count'] for d in prior)
          completed_total=sum(d['completed_count'] for d in wall_docs)+sum(d['completed_count'] for d in prior)
          unresolved_total=sum(d['unresolved_count'] for d in wall_docs)+sum(d['unresolved_count'] for d in prior)
          assert monster_total==172 and completed_total+unresolved_total==172
          out={'schema':'STAGE32_18BC_REPAIRED_ORIGINAL_172_SUMMARY_V2','source_g4_run_id':33155002856,'parent_stream_identity_gate':'PASSED_6_OF_6','monster_total':172,'completed_total':completed_total,'unresolved_total':unresolved_total,'walls':sorted(wall_docs+[{'wall':d['wall'],'monster_count':d['monster_count'],'completed_count':d['completed_count'],'unresolved_count':d['unresolved_count'],'unresolved_frontier_ids':d['unresolved_frontier_ids'],'source_g4_artifact':{'p503-s665':9680367318,'p922-s13':9680561371,'p922-s38':9680338221}[d['wall']]} for d in prior],key=lambda d:d['wall']),'residual_frontier_ids_by_wall':all_residual,'verdict':'ALL_ORIGINAL_172_RESOLVED' if unresolved_total==0 else 'REPAIRED_NAMESPACE_RESIDUALS_REQUIRE_DEEP_REPLAY','next_item':'32-18BD_D16_B16_CLOSE_EVIDENCE_REBUILD' if unresolved_total==0 else '32-18BD_REPAIRED_RESIDUAL_DEEP_REPLAY','D16_B16_NUMERICAL_CREDIT':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False}
          outdir=root/'summary'; outdir.mkdir(); (outdir/'summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18bc-g5-repaired-original-172-summary
          path: ${{ runner.temp }}/summary/
          retention-days: 7
          if-no-files-found: error
