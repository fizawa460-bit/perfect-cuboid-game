name: Stage12-N1-2 Round 2 review bundle R03

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage12-n1-2-review-r03
    paths:
      - "scripts/build_stage12_n1_2_review_page_r03.py"
      - "docs/stage12-n1-2*.md"
      - "data/*stage12_n1_2*.json"
      - "scripts/audit_*stage12_n1_2*.py"
      - ".github/workflows/stage12-n1-2-review-r03.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage12-n1-2-review-r03
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build R03
        run: python scripts/build_stage12_n1_2_review_page_r03.py
      - name: Validate extractor-safe handshakes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('review/PC-N1-2-PROOF-REVIEW-20260806-R03.html')
          s=p.read_text(encoding='utf-8')
          required=['BUNDLE_ID=PC-N1-2-PROOF-REVIEW-20260806-1845-R03','COMPLETED_THROUGH=Stage12-N1-2n','CHECKPOINT=START_OF_MAIN','CHECKPOINT=END_OF_MAIN','docs/stage12-n1-2n-coupled-region.md','audit_coupled_region_stage12_n1_2n.py']
          for x in required:
              assert x in s, x
          assert len(s.encode('utf-8')) > 300000
          print(len(s.encode('utf-8')))
          PY
      - name: Commit generated bundle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add review/PC-N1-2-PROOF-REVIEW-20260806-R03.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Stage12-N1-2 Round 2 R03 review bundle"
          git push origin HEAD:agent/stage12-n1-2-review-r03
