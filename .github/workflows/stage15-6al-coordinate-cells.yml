name: Stage15-6al coordinate cells

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6al/**'
      - 'stages/stage15/evidence/stage15_6al_coordinate_cells.json'
      - 'stages/stage15/replay/verify_stage15_6al.py'
      - 'stages/stage15/scripts/stage15_6al_coordinate_cells.py'
      - '.github/workflows/stage15-6al-coordinate-cells.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6al coordinate squareclass cells
        run: python stages/stage15/replay/verify_stage15_6al.py
      - name: Compile Stage15-6al utility
        run: python -m py_compile stages/stage15/scripts/stage15_6al_coordinate_cells.py stages/stage15/replay/verify_stage15_6al.py
