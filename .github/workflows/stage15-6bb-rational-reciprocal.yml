name: Stage15-6bb rational reciprocal receiver

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6bb/**'
      - 'stages/stage15/evidence/stage15_6bb_rational_reciprocal.json'
      - 'stages/stage15/replay/verify_stage15_6bb.py'
      - 'stages/stage15/scripts/stage15_6bb_rational_reciprocal.py'
      - '.github/workflows/stage15-6bb-rational-reciprocal.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python stages/stage15/replay/verify_stage15_6bb.py
      - run: python -m py_compile stages/stage15/scripts/stage15_6bb_rational_reciprocal.py
