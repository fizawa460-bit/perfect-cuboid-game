name: StructureRadar search20 inspect
on: pull_request
permissions: {contents: write}
jobs:
  inspect:
    if: github.head_ref == 'structure-radar-search-20-inspect'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - run: |
          python - <<'PY'
          import json,pathlib
          ids=[f'SR-STR-{i:03d}' for i in range(189,199)]
          r=json.load(open('docs/structure-radar/structure-registry.json'))
          out=[]
          for c in r['structures']:
            if c['structure_id'] in ids:
              out += ['## '+c['structure_id']+' — '+c['canonical_math_name'], c['exact_equations_or_object'], 'SEARCH: '+' | '.join(c.get('search_terms_primary',[])), 'TYPES: '+' | '.join(c.get('theorem_species',[])), 'WEAPONS: '+', '.join(c.get('potential_weapon_types',[])), 'GAPS: '+' | '.join(c.get('applicability_gaps',[])), 'TARGETS: '+' | '.join(c.get('target_populations',[])), '']
          assert len([x for x in out if x.startswith('## SR-STR-')])==10
          pathlib.Path('docs/structure-radar/TEMP-search20-summary.md').write_text('\n'.join(out))
          PY
          rm .github/workflows/structure-radar-search20-inspect.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A && git commit -m 'TEMP: inspect StructureRadar search20' && git push
