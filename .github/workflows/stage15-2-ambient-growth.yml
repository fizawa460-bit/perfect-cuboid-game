name: Stage15-2 ambient growth

on:
  pull_request:
    paths:
      - 'stages/stage15/15-2/**'
      - 'stages/stage15/replay/verify_stage15_2.py'
      - 'stages/stage15/scripts/paired_enumerator.py'
      - '.github/workflows/stage15-2-ambient-growth.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-2 ambient growth
        run: python stages/stage15/replay/verify_stage15_2.py
