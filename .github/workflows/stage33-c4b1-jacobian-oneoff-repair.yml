name: Stage33 C4B1 Jacobian one-off repair

on:
  push:
    branches:
      - stage33-v91c1x-r5b2d0-swap23-source-lock
    paths:
      - .github/workflows/stage33-c4b1-jacobian-oneoff-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair missing seventh Jacobian coordinate
        shell: bash
        run: |
          set -euo pipefail
          target='stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1_exceptional_p1_targeted_residue_field_squareclass.py'
          python - <<'PY'
          from pathlib import Path
          p = Path('stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1_exceptional_p1_targeted_residue_field_squareclass.py')
          s = p.read_text()
          old = '        [2 * a1, 0, 2 * a3, 0, -2 * b2, 0],\n'
          new = '        [2 * a1, 0, 2 * a3, 0, -2 * b2, 0, 0],\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one repair target, got {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          changed="$(git status --porcelain | sed -E 's/^.. //' || true)"
          test "$changed" = "$target"
          git diff --check
      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1_exceptional_p1_targeted_residue_field_squareclass.py
          git commit -m '[Stage33] repair C4B1 Jacobian width'
          git push
