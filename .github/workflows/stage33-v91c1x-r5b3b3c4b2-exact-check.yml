name: Stage33 V91C1X C4B2 exact check

on:
  push:
    branches:
      - stage33-v91c1x-r5b3b3c4b1e-1757-refinement-unit-preflight
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b2-exact-check.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b2a_strict_prime_cross_carrier_geometric_incidence.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2a-strict-prime-cross-carrier-geometric-incidence.json'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b2b1_explicit_a1_boundary_residue_field_squareclass.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b1-explicit-a1-boundary-residue-field-squareclass.json'
      - 'stages/stage33/MAIN-STATE.json'
      - 'stages/stage33/sync_main_state.py'
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  exact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Rebuild and compare C4B2A read-only
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b2a_strict_prime_cross_carrier_geometric_incidence.py
      - name: Rebuild and compare C4B2B1 read-only
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b2b1_explicit_a1_boundary_residue_field_squareclass.py
      - name: Verify Stage33 mutable authority remains synchronized
        run: python stages/stage33/sync_main_state.py --check
      - name: Verify clean exact head
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
