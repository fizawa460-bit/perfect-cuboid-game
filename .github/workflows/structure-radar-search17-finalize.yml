name: StructureRadar search17 finalize
on: pull_request
permissions: {contents: write}
jobs:
  finalize:
    if: github.head_ref == 'structure-radar-search-17-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - run: |
          python - <<'PY'
          import json,pathlib
          ids=[f'SR-STR-{i:03d}' for i in range(144,154)]
          ledger='docs/structure-radar/literature/SR-SEARCH-17.md'
          rp='docs/structure-radar/structure-registry.json'
          r=json.load(open(rp)); cards=[]
          for c in r['structures']:
            if c['structure_id'] in ids:
              assert c['search_status'] in {'NOT_SEARCHED','NEEDS_REFRESH'} and c['arsenal_decision']=='PENDING'
              cards.append(c); c['search_status']='SEARCHED'; c['arsenal_decision']='ACTIVE'; c['search_ledger']=ledger
          assert [c['structure_id'] for c in cards]==ids
          open(rp,'w').write(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          z=['# StructureRadar literature ledger — search batch 17','','SEARCH_TASK=SR-SEARCH-01','BATCH_ID=SR-BATCH-LITERATURE_SEARCH-17-R01','SEARCH_DATE=2026-08-19','STRUCTURES='+','.join(ids),'SEARCH_BATCH_SIZE=10','NOVELTY_BY_SEARCH_ABSENCE=false','',
          '## Primary-source literature checked',
          '- Djamel Himane, *Primitive Euler brick generator* (arXiv:2405.13061). Gives an explicit primitive Euler-brick generating construction building on a Saunderson-type parametrization. It is constructive evidence adjacent to SR-STR-146, not a counting theorem for the primitive canonical population under the repo radius height.',
          '- Andreas Malmendier and Yih Sung, *Counting Rational Points on Kummer surfaces* (arXiv:1901.11151). Counts rational points in a two-parameter family of Kummer surfaces attached to two non-isogenous elliptic curves using elliptic-fibration presentations. The family and height are not the Stage23/Stage19 moving physical receiver.',
          '- David McKinnon, *Counting Rational Points on K3 Surfaces* (arXiv:math/9903013). Computes counting behavior for Kummer surfaces associated to products of elliptic curves and identifies accumulating curves for an ample height. This is fixed-surface/height information, not a uniform moving-transverse-family estimate.',
          '- T. D. Browning and R. de la Bretèche, *Manin\'s conjecture for quartic del Pezzo surfaces with a conic fibration* (arXiv:0808.1616). Establishes an asymptotic for rational points on a nonsingular quartic del Pezzo surface with conic-bundle structure. It supports the general geometric log-exponent viewpoint but not the repo Q(i)-twisted 4A1 transition identities.',
          '- Daniel Loughran, *Manin\'s conjecture for a singular quartic del Pezzo surface* (arXiv:1109.6253). Proves Manin\'s conjecture for a split singular quartic del Pezzo surface of type 2A1 with eight lines; adjacent to SR-STR-148/149, but singularity type, field twist, open subset and height differ from the repo receiver.','',
          '## Search outcome',
          '- SR-STR-144: no external source is needed to certify the shared-edge double-Pythagorean normal form; generic Euler-brick parametrizations do not replace the repo uniqueness/exact-two-face statement.',
          '- SR-STR-145 and SR-STR-147: targeted search did not identify a published theorem matching the repo exact Gaussian-norm parity acceptance law or third-face blocker density on the same physical host. Keep both as repo-exact local-sieve mechanisms and do not combine them with already-charged global savings.',
          '- SR-STR-146: Himane supplies a constructive Euler-brick generator, but no checked source states the repo global exponent bracket. Keep the Stage26 lower / Stage20 thin-cover upper as the exact current envelope.',
          '- SR-STR-148/149: quartic-del-Pezzo Manin literature supports the general role of geometric a,b/Picard data in logarithmic exponents, but no checked source matches the exact Q(i)-twisted 4A1 model, physical height, exact-face populations, or transition ratios.',
          '- SR-STR-150 and SR-STR-153: the mod-8/mod-16 exclusions are elementary exact congruence certificates for the stated slices only.',
          '- SR-STR-151: Kummer rational-point counting literature is genuinely adjacent, but the fixed/two-parameter Kummer heights and populations do not furnish uniform dispersion for the repo moving transverse Jacobi/Kummer family in exact physical height.',
          '- SR-STR-152: retain the repo same-host pair-overlap theorem; no second charge for the already-imposed space condition.','']
          verdicts={
            'SR-STR-144':'`REPO_EXACT_NORMAL_FORM` — shared-edge uniqueness and exact-two-face exclusion remain repo-specific; generic Euler-brick parametrizations are adjacent only.',
            'SR-STR-145':'`REPO_EXACT_LOCAL_SIEVE` — preserve the exact Gaussian-norm squareclass parity law and the no-double-charge boundary.',
            'SR-STR-146':'`REPO_CURRENT_GLOBAL_ENVELOPE` — external constructive generators do not prove the repo counting exponents or close the true-exponent gap.',
            'SR-STR-147':'`REPO_EXACT_BLOCKER_SIEVE` — local blocker densities give zero-density mechanism only and are not an independent global exponent saving.',
            'SR-STR-148':'`ADJACENT_MANIN_GEOMETRY_ONLY` — geometric counting literature supports interpretation, not the exact one-face-conditioned physical transition asymptotic.',
            'SR-STR-149':'`ADJACENT_MANIN_GEOMETRY_ONLY` — log-exponent/Picard heuristics are compatible, but the exact b-invariant transition remains repo-specific.',
            'SR-STR-150':'`ELEMENTARY_CONGRUENCE_CERTIFICATE` — the mod-8 obstruction kills only the selected one-parameter slice.',
            'SR-STR-151':'`ADJACENT_KUMMER_COUNTING_ONLY` — fixed/two-parameter Kummer point counts do not give the required uniform moving-family physical-height dispersion.',
            'SR-STR-152':'`REPO_SAME_HOST_OVERLAP` — pair-overlap zero density is retained without recharging the space condition.',
            'SR-STR-153':'`ELEMENTARY_CONGRUENCE_CERTIFICATE` — the mod-16 obstruction is parity-specific and not a global Stage19 theorem.'
          }
          for c in cards:
            z += ['## '+c['structure_id']+' — '+c['canonical_math_name'],c['exact_equations_or_object'],'Potential weapon types: '+', '.join(c.get('potential_weapon_types',[]))+'.','Applicability gaps: '+'; '.join(c.get('applicability_gaps',[])),'Transfer verdict: '+verdicts[c['structure_id']],'Arsenal decision: `ACTIVE`.','']
          z += ['## Firewalls','- Search absence is not a novelty claim.','- Local zero-density products in SR-STR-145/147 are not multiplied into the separate certified global half-power/thin-cover bounds.','- External Euler-brick generators do not imply a primitive-canonical counting exponent.','- Del-Pezzo/Kummer results transfer only after exact variety, open subset, height, family-uniformity and physical-measure contracts are matched.','- Slice congruence obstructions SR-STR-150/153 are not promoted to global nonexistence statements.','- CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT remains 1/2; no strict sub-square-root Stage19 whole-family theorem is claimed.','- No perfect-cuboid existence or nonexistence claim is made.','']
          pathlib.Path(ledger).write_text('\n'.join(z))
          pp='docs/structure-radar/progress.json'; p=json.load(open(pp)); bid='SR-BATCH-LITERATURE_SEARCH-17-R01'
          assert not any(x.get('batch_id')==bid for x in p['audit_batches'])
          p['audit_batches'].append({'batch_id':bid,'task_id':'SR-SEARCH-01','status':'SUBMITTED_FOR_AUDIT','source_ids':[],'sources_reviewed':5,'structures_added':0,'structures_updated':10,'structure_carrier_sources':0,'structures_deduped':0,'searches_completed':10,'arsenal_decisions':10,'audit_required':True,'duplicate_source':0,'no_distinct_structure':0})
          open(pp,'w').write(json.dumps(p,indent=2,ensure_ascii=False)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python - <<'PY'
          import json
          q=json.load(open('docs/structure-radar/exploration-queue.json'))
          ready=next(t for t in q['tasks'] if t['status']=='READY')
          assert ready['structure_ids']==['SR-STR-155','SR-STR-156','SR-STR-157','SR-STR-158','SR-STR-159','SR-STR-160','SR-STR-175','SR-STR-176','SR-STR-177','SR-STR-178'], ready
          c=json.load(open('docs/structure-radar/controller.json'))
          assert c['registry']['unresolved_search_count']==57 and c['registry']['pending_arsenal_decision_count']==76, c['registry']
          PY
          rm .github/workflows/structure-radar-search17-finalize.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'StructureRadar: literature search batch17'
          git push
