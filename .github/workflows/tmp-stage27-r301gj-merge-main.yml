name: TEMP Stage27 r301g-j merge latest main

on:
  push:
    branches:
      - agent/stage27-20-r301g-j-squareclass-fiber-batch
    paths:
      - '.github/workflows/tmp-stage27-r301gj-merge-main.yml'

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-20-r301g-j-squareclass-fiber-batch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge latest main preserving r301g-j controller entries
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp stages/stage27/27-controller.json /tmp/r301gj-head-controller.json
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Conflicts: $conflicts"
            test "$conflicts" = "stages/stage27/27-controller.json"
            git checkout --theirs stages/stage27/27-controller.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          current_path=Path('stages/stage27/27-controller.json')
          current=json.loads(current_path.read_text())
          old=json.loads(Path('/tmp/r301gj-head-controller.json').read_text())
          for key in ['Stage27-20-r301g','Stage27-20-r301h','Stage27-20-r301i','Stage27-20-r301j']:
              assert key in old['derived_routes'], key
              current['derived_routes'][key]=old['derived_routes'][key]
          for key in ['Stage27-20-r301d','Stage27-20-r301e','Stage27-20-r301f']:
              r=current['derived_routes'][key]
              assert r['status']=='AUDITED_PASS_MERGED', (key,r['status'])
              assert r['audit_status']=='PASS', (key,r['audit_status'])
              assert r['merge_allowed'] is True
          assert current['state']['CURRENT_CHECKPOINT']==40
          assert current['state']['NEXT_CHECKPOINT']==40
          current_path.write_text(json.dumps(current, indent=2)+'\n')
          PY
          git add stages/stage27/27-controller.json
          git diff --check --cached
          git commit -m 'Merge latest main into Stage27-20-r301g-j'
          git push origin HEAD:agent/stage27-20-r301g-j-squareclass-fiber-batch
