name: Stage25 reentry phase30 mask audit

on:
  pull_request:
    paths:
      - 'stages/stage25/25-reentry-30/**'
      - 'stages/stage25/25-reentry-controller.json'
      - 'docs/00_CURRENT_RESEARCH_STATUS.md'
      - '.github/workflows/stage25-reentry-30-mask.yml'

jobs:
  verify-phase30-mask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage25 reentry phase30 mask receiver theorem candidate
        run: python stages/stage25/25-reentry-30/verify_phase30.py
