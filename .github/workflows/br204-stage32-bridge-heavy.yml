name: Stage32 BRIDGE BR204 FULL178 heavy

# Trigger lifecycle: MANUAL — expensive BR204 scaleout. A distinct audited-parent
# run-key arm commit is mandatory; this workflow never auto-runs on PR synchronization.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: stage32-bridge-br204-heavy-${{ github.ref }}
  cancel-in-progress: false

env:
  RUNKEY: stages/stage32/generalization-bridge/runkeys/br204-full178-heavy.json
  WORKER: stages/stage32/generalization-bridge/run_br204_full178_b_unit.cpp
  AGGREGATOR: stages/stage32/generalization-bridge/aggregate_br204_full178.py
  CONTRACT: stages/stage32/generalization-bridge/BR204-HEAVY-EXECUTION-CONTRACT.json
  WORKER_BLOB: b180c71ae32f8da4a85daec30cc6a03bf57278fc
  AGGREGATOR_BLOB: 3b5f9be4b7bf126cf562b8e69a6733be0a3f9fee
  CONTRACT_BLOB: d9a7546f10049f915bfa29b32e3528bedf06c5ae
  BASE_BLOB: b7fc7e0c6c889c92cb152d4e8b54d05d2b71a5d1
  REPOSITORY_MAIN_HEAD: 37bb811b95399d73cc46fe899badcfa8eb5fca7d
  MAIN_STATE_BLOB: dd7dba27eb062e6a6ad4d440094ba26c290900d7
  ENVELOPE: '6703403803993209250491'
  MAIN_BOUND: '179119009547804181594'

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      carry_run_id: ${{ steps.auth.outputs.carry_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify exact sources, live main, and semantic arm commit
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git hash-object "$WORKER")" = "$WORKER_BLOB"
          test "$(git hash-object "$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git hash-object "$CONTRACT")" = "$CONTRACT_BLOB"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$REPOSITORY_MAIN_HEAD"
          test "$(git rev-parse FETCH_HEAD:stages/stage32/MAIN-STATE.json)" = "$MAIN_STATE_BLOB"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=Path(os.environ['RUNKEY'])
          cur=json.loads(p.read_text())
          assert cur['schema']=='STAGE32_BR204_FULL178_HEAVY_RUNKEY_V3_DURABLE_PREFIX'
          assert cur['armed'] is True and cur['generation'] > 0
          assert cur['execution']['b_unit_count']==97
          assert cur['execution']['durable_subunit_count']==250 and cur['execution']['max_parallel']==8
          assert cur['resume']['generation_start_prefix_reemit'] is True
          assert cur['resume']['single_previous_run_suffices'] is True
          assert cur['execution']['d_bands']==[[8,54],[56,100],[102,146],[148,192]]
          assert cur['execution']['main_bound_snapshot']==os.environ['MAIN_BOUND']
          locks=cur['source_locks']
          assert locks['worker_blob']==os.environ['WORKER_BLOB']
          assert locks['aggregator_blob']==os.environ['AGGREGATOR_BLOB']
          assert locks['execution_contract_blob']==os.environ['CONTRACT_BLOB']
          assert locks['compact_mu_base_blob']==os.environ['BASE_BLOB']
          assert locks['repository_main_head']==os.environ['REPOSITORY_MAIN_HEAD']
          assert locks['repository_main_state_blob']==os.environ['MAIN_STATE_BLOB']
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert cur['arm_contract']['audited_doorstep_head']==parent
          review=cur['arm_contract']['audited_doorstep_review_id']
          assert isinstance(review,int)
          old=json.loads(subprocess.check_output(['git','show',f'{parent}:{p.as_posix()}'],text=True))
          assert old['armed'] is False and cur['generation'] > old['generation']
          changed=subprocess.check_output(['git','diff','--name-only',parent,'HEAD'],text=True).splitlines()
          assert changed == [p.as_posix()], 'arm commit must mutate only dedicated run-key'
          Path('/tmp/auth.json').write_text(json.dumps({'parent':parent,'review':review}))
          PY
          gh api "repos/$REPO/pulls/1813/reviews" --paginate > /tmp/reviews.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/auth.json')); rs=json.load(open('/tmp/reviews.json'))
          m=[r for r in rs if r.get('id')==a['review'] and r.get('commit_id')==a['parent']]
          assert m, 'audited doorstep review/head pair not found'
          body=m[0].get('body') or ''
          assert 'HOSTILE AUDIT: PASS' in body and 'VERDICT: PASS' in body
          PY
          carry="$(python -c 'import json;print(json.load(open("'"$RUNKEY"'")).get("carry_run_id") or "")')"
          echo "carry_run_id=$carry" >> "$GITHUB_OUTPUT"


  carry:
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      prefix_count: ${{ steps.recover.outputs.prefix_count }}
      pilot_low_present: ${{ steps.recover.outputs.pilot_low_present }}
      pilot_high_present: ${{ steps.recover.outputs.pilot_high_present }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Recover prior durable union and pre-clean superseded ancestors
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CARRY_RUN_ID: ${{ needs.authorize.outputs.carry_run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/prior-prefix /tmp/prior-units /tmp/reemit
          delete_recovery_artifacts() {
            local rid="$1"
            [ -n "$rid" ] || return 0
            gh api --paginate "repos/$REPO/actions/runs/$rid/artifacts?per_page=100"               --jq '.artifacts[] | select(.name=="br204-prefix" or (.name|startswith("br204-u-"))) | .id'               > "/tmp/delete-$rid.ids"
            while IFS= read -r aid; do
              [ -n "$aid" ] || continue
              gh api -X DELETE "repos/$REPO/actions/artifacts/$aid"
            done < "/tmp/delete-$rid.ids"
          }
          if [ -n "$CARRY_RUN_ID" ]; then
            names="$(gh api --paginate "repos/$REPO/actions/runs/$CARRY_RUN_ID/artifacts?per_page=100" --jq '.artifacts[].name')"
            if printf '%s
' "$names" | grep -Fxq 'br204-prefix'; then
              gh run download "$CARRY_RUN_ID" -n br204-prefix -D /tmp/prior-prefix
            fi
            if printf '%s
' "$names" | grep -Eq '^br204-u-'; then
              gh run download "$CARRY_RUN_ID" -p 'br204-u-*' -D /tmp/prior-units
            fi
            python - <<'PY' > /tmp/ancestor-runs.txt
          import json
          from pathlib import Path
          ids=set()
          for p in Path('/tmp/prior-prefix').rglob('RECOVERY-LINEAGE.json'):
              x=json.loads(p.read_text())
              for rid in x.get('superseded_run_ids', []):
                  ids.add(int(rid))
          for rid in sorted(ids):
              print(rid)
          PY
            while IFS= read -r rid; do
              [ -n "$rid" ] || continue
              delete_recovery_artifacts "$rid"
            done < /tmp/ancestor-runs.txt
          fi
          python "$AGGREGATOR" checkpoint             --input-dir /tmp/prior-units             --input-dir /tmp/prior-prefix             --worker-blob "$WORKER_BLOB"             --out-dir /tmp/reemit             --manifest /tmp/reemit/RECOVERY-MANIFEST.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          m=json.loads(Path('/tmp/reemit/RECOVERY-MANIFEST.json').read_text())
          units={(x['b'],x['d_lo'],x['d_hi']) for x in m['subunits']}
          print(f"prefix_count={m['validated_subunit_count']}")
          print("pilot_low_present="+str((0,8,54) in units).lower())
          print("pilot_high_present="+str((96,148,192) in units).lower())
          carry=os.environ.get('CARRY_RUN_ID','').strip()
          Path('/tmp/reemit/RECOVERY-LINEAGE.json').write_text(json.dumps({
              'schema':'STAGE32_BR204_RECOVERY_LINEAGE_V1',
              'superseded_run_ids':[int(carry)] if carry else [],
          },sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.recover.outputs.prefix_count != '0'
        with:
          name: br204-prefix
          path: /tmp/reemit
          retention-days: 1
          if-no-files-found: error
      - name: Delete superseded prior recovery artifacts after prefix re-emission
        if: needs.authorize.outputs.carry_run_id != '' && steps.recover.outputs.prefix_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CARRY_RUN_ID: ${{ needs.authorize.outputs.carry_run_id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/runs/$CARRY_RUN_ID/artifacts?per_page=100"             --jq '.artifacts[] | select(.name=="br204-prefix" or (.name|startswith("br204-u-"))) | .id'             > /tmp/delete-current-carry.ids
          while IFS= read -r aid; do
            [ -n "$aid" ] || continue
            gh api -X DELETE "repos/$REPO/actions/artifacts/$aid"
          done < /tmp/delete-current-carry.ids

  runtime:
    needs: [authorize, carry]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Compile exact source-locked worker and recovery-aware aggregator
        run: |
          set -euo pipefail
          test "$(git hash-object "$WORKER")" = "$WORKER_BLOB"
          test "$(git hash-object "$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git hash-object "$CONTRACT")" = "$CONTRACT_BLOB"
          python stages/stage32/generalization-bridge/verify_br203_picard_mu_16_state_v2.py --output /tmp/mu.json
          python stages/stage32/generalization-bridge/emit_br203_bounded_mu_header.py /tmp/mu.json /tmp/br203_mu_generated.hpp
          g++ -std=c++20 -O3 -DNDEBUG -I/tmp "$WORKER" -o /tmp/br204-worker
          /tmp/br204-worker --self-test > /tmp/worker-selftest.json
          python "$AGGREGATOR" self-test
      - uses: actions/upload-artifact@v4
        with:
          name: br204-worker-runtime
          path: /tmp/br204-worker
          retention-days: 1
          if-no-files-found: error

  pilot_low:
    needs: [carry, runtime]
    if: needs.carry.outputs.pilot_low_present != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: br204-worker-runtime
          path: /tmp/runtime
      - name: Compute and immediately preserve pilot b0 d8..54
        run: |
          set -euo pipefail
          chmod +x /tmp/runtime/br204-worker
          mkdir -p /tmp/unit
          /tmp/runtime/br204-worker --b 0 --d-lo 8 --d-hi 54 --worker-blob "$WORKER_BLOB" --out /tmp/unit/br204-u-b0-d8-54.tsv
          gzip -9 -n /tmp/unit/br204-u-b0-d8-54.tsv
          test "$(stat -c %s /tmp/unit/br204-u-b0-d8-54.tsv.gz)" -le 900000
      - uses: actions/upload-artifact@v4
        with:
          name: br204-u-b0-d8-54
          path: /tmp/unit/br204-u-b0-d8-54.tsv.gz
          retention-days: 1
          if-no-files-found: error

  pilot_high:
    needs: [carry, runtime]
    if: needs.carry.outputs.pilot_high_present != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: br204-worker-runtime
          path: /tmp/runtime
      - name: Compute and immediately preserve pilot b96 d148..192
        run: |
          set -euo pipefail
          chmod +x /tmp/runtime/br204-worker
          mkdir -p /tmp/unit
          /tmp/runtime/br204-worker --b 96 --d-lo 148 --d-hi 192 --worker-blob "$WORKER_BLOB" --out /tmp/unit/br204-u-b96-d148-192.tsv
          gzip -9 -n /tmp/unit/br204-u-b96-d148-192.tsv
          test "$(stat -c %s /tmp/unit/br204-u-b96-d148-192.tsv.gz)" -le 900000
      - uses: actions/upload-artifact@v4
        with:
          name: br204-u-b96-d148-192
          path: /tmp/unit/br204-u-b96-d148-192.tsv.gz
          retention-days: 1
          if-no-files-found: error

  plan:
    needs: [authorize, carry, runtime, pilot_low, pilot_high]
    if: ${{ always() && needs.authorize.result == 'success' && needs.carry.result == 'success' && needs.runtime.result == 'success' && (needs.pilot_low.result == 'success' || needs.pilot_low.result == 'skipped') && (needs.pilot_high.result == 'success' || needs.pilot_high.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        if: needs.carry.outputs.prefix_count != '0'
        with:
          name: br204-prefix
          path: /tmp/prefix
      - uses: actions/download-artifact@v4
        if: needs.pilot_low.result == 'success' || needs.pilot_high.result == 'success'
        with:
          pattern: br204-u-*
          path: /tmp/current
          merge-multiple: true
      - id: plan
        run: |
          set -euo pipefail
          python "$AGGREGATOR" plan             --input-dir /tmp/current             --input-dir /tmp/prefix             --worker-blob "$WORKER_BLOB"             --out /tmp/plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          names=['br204-u-b0-d8-54.tsv.gz','br204-u-b96-d148-192.tsv.gz']
          sizes={}
          for name in names:
              hits=list(Path('/tmp').rglob(name))
              assert len(hits)==1, (name,hits)
              sizes[name]=hits[0].stat().st_size
          hard_cap=900_000
          budget=524_288_000
          overhead=20_971_520
          assert all(x <= hard_cap for x in sizes.values())
          absolute_rollover_peak=2*250*hard_cap + overhead
          projected=2*250*max(sizes.values()) + overhead
          assert absolute_rollover_peak <= budget
          assert projected <= budget
          Path('/tmp/pilot-storage.json').write_text(json.dumps({
              'pilot_subunits':sizes,
              'per_subunit_hard_cap_bytes':hard_cap,
              'absolute_rollover_peak_bytes':absolute_rollover_peak,
              'projection_bytes':projected,
              'budget_bytes':budget,
          },sort_keys=True,indent=2)+'\n')
          PY
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m=json.load(open('/tmp/plan.json'))['missing_units']
          assert len(m) <= 248
          sentinel=[{'b':-1,'d_lo':-1,'d_hi':-1}]
          print('matrix='+json.dumps(m if m else sentinel,separators=(',',':')))
          print('missing_count='+str(len(m)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: br204-plan
          path: |
            /tmp/plan.json
            /tmp/pilot-storage.json
          retention-days: 1
          if-no-files-found: error

  units:
    needs: [runtime, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        if: matrix.b != -1
        with:
          name: br204-worker-runtime
          path: /tmp/runtime
      - name: Compute one missing durable b x d-band subunit
        if: matrix.b != -1
        run: |
          set -euo pipefail
          chmod +x /tmp/runtime/br204-worker
          mkdir -p /tmp/unit
          out="/tmp/unit/br204-u-b${{ matrix.b }}-d${{ matrix.d_lo }}-${{ matrix.d_hi }}.tsv"
          /tmp/runtime/br204-worker --b "${{ matrix.b }}" --d-lo "${{ matrix.d_lo }}" --d-hi "${{ matrix.d_hi }}" --worker-blob "$WORKER_BLOB" --out "$out"
          gzip -9 -n "$out"
          test "$(stat -c %s "$out.gz")" -le 900000
      - uses: actions/upload-artifact@v4
        if: matrix.b != -1
        with:
          name: br204-u-b${{ matrix.b }}-d${{ matrix.d_lo }}-${{ matrix.d_hi }}
          path: /tmp/unit/br204-u-b${{ matrix.b }}-d${{ matrix.d_lo }}-${{ matrix.d_hi }}.tsv.gz
          retention-days: 1
          if-no-files-found: error

  aggregate:
    if: ${{ always() && needs.authorize.result == 'success' && needs.carry.result == 'success' && needs.plan.result == 'success' && needs.units.result == 'success' }}
    needs: [authorize, carry, pilot_low, pilot_high, plan, units]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        if: needs.carry.outputs.prefix_count != '0'
        with:
          name: br204-prefix
          path: /tmp/prefix
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.missing_count != '0' || needs.pilot_low.result == 'success' || needs.pilot_high.result == 'success'
        with:
          pattern: br204-u-*
          path: /tmp/current
          merge-multiple: true
      - name: Exact union, one ratio-class rational LP, and tail attribution
        run: |
          set -euo pipefail
          python "$AGGREGATOR" aggregate             --input-dir /tmp/current             --input-dir /tmp/prefix             --worker-blob "$WORKER_BLOB"             --envelope "$ENVELOPE"             --main-bound "$MAIN_BOUND"             --out /tmp/BR204-FULL178-HEAVY-RESULT.json
          cat /tmp/BR204-FULL178-HEAVY-RESULT.json
      - uses: actions/upload-artifact@v4
        with:
          name: br204-full178-parent-result
          path: /tmp/BR204-FULL178-HEAVY-RESULT.json
          retention-days: 3
          if-no-files-found: error
