name: Stage32 BRIDGE BR204 FULL178 heavy

# Trigger lifecycle: MANUAL — expensive BR204 scaleout. A distinct audited-parent
# run-key arm commit is mandatory; this workflow never auto-runs on PR synchronization.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: stage32-bridge-br204-heavy-${{ github.ref }}
  cancel-in-progress: false

env:
  RUNKEY: stages/stage32/generalization-bridge/runkeys/br204-full178-heavy.json
  WORKER: stages/stage32/generalization-bridge/run_br204_full178_b_unit.cpp
  AGGREGATOR: stages/stage32/generalization-bridge/aggregate_br204_full178.py
  CONTRACT: stages/stage32/generalization-bridge/BR204-HEAVY-EXECUTION-CONTRACT.json
  WORKER_BLOB: 922a257559d0d5a69d56f110442b6a911820db7f
  AGGREGATOR_BLOB: 97f975c5959db3513a086d75976ca0012766a2fd
  CONTRACT_BLOB: 199632bbf53c943cf07824c2f0a2c0324b8d9bca
  BASE_BLOB: b7fc7e0c6c889c92cb152d4e8b54d05d2b71a5d1
  ENVELOPE: '6703403803993209250491'
  MAIN_BOUND: '179119009547804181594'

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      generation: ${{ steps.auth.outputs.generation }}
      carry_run_id: ${{ steps.auth.outputs.carry_run_id }}
    steps:
      - name: Checkout exact dispatch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify exact source locks and semantic arm commit
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git hash-object "$WORKER")" = "$WORKER_BLOB"
          test "$(git hash-object "$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git hash-object "$CONTRACT")" = "$CONTRACT_BLOB"

          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=Path(os.environ["RUNKEY"])
          cur=json.loads(p.read_text())
          assert cur["schema"]=="STAGE32_BR204_FULL178_HEAVY_RUNKEY_V1"
          assert cur["armed"] is True
          assert cur["generation"] > 0
          assert cur["source_locks"]["worker_blob"]==os.environ["WORKER_BLOB"]
          assert cur["source_locks"]["aggregator_blob"]==os.environ["AGGREGATOR_BLOB"]
          assert cur["source_locks"]["execution_contract_blob"]==os.environ["CONTRACT_BLOB"]
          assert cur["source_locks"]["compact_mu_base_blob"]==os.environ["BASE_BLOB"]
          assert cur["execution"]["unit_count"]==97
          assert cur["execution"]["max_parallel"]==8
          parent=subprocess.check_output(["git","rev-parse","HEAD^"], text=True).strip()
          assert cur["arm_contract"]["audited_doorstep_head"]==parent
          assert isinstance(cur["arm_contract"]["audited_doorstep_review_id"], int)
          old=json.loads(subprocess.check_output(["git","show",f"{parent}:{p.as_posix()}"], text=True))
          assert old["armed"] is False
          assert cur["generation"] > old["generation"]
          changed=subprocess.check_output(["git","diff","--name-only",parent,"HEAD"], text=True).splitlines()
          assert p.as_posix() in changed
          Path("/tmp/auth.json").write_text(json.dumps({
              "generation":cur["generation"],
              "carry_run_id":cur.get("carry_run_id"),
              "parent":parent,
              "review":cur["arm_contract"]["audited_doorstep_review_id"],
          }))
          PY

          review="$(python -c 'import json;print(json.load(open("/tmp/auth.json"))["review"])')"
          parent="$(python -c 'import json;print(json.load(open("/tmp/auth.json"))["parent"])')"
          gh api "repos/$REPO/pulls/1813/reviews" --paginate > /tmp/reviews.json
          python - <<'PY'
          import json, os
          a=json.load(open("/tmp/auth.json"))
          reviews=json.load(open("/tmp/reviews.json"))
          matches=[r for r in reviews if r.get("id")==a["review"] and r.get("commit_id")==a["parent"]]
          assert matches, "audited doorstep review/head pair not found"
          body=matches[0].get("body") or ""
          assert "HOSTILE AUDIT: PASS" in body and "VERDICT: PASS" in body, "doorstep review is not PASS"
          PY

          generation="$(python -c 'import json;print(json.load(open("/tmp/auth.json"))["generation"])')"
          carry="$(python -c 'import json;print(json.load(open("'"$RUNKEY"'")).get("carry_run_id") or "")')"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "carry_run_id=$carry" >> "$GITHUB_OUTPUT"

  pilot:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout authorized exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'

      - name: Generate source-locked BR203 mu header
        run: |
          python stages/stage32/generalization-bridge/verify_br203_picard_mu_16_state_v2.py \
            --output /tmp/BR203-PICARD-MU-16-STATE-RESULT.json
          python stages/stage32/generalization-bridge/emit_br203_bounded_mu_header.py \
            /tmp/BR203-PICARD-MU-16-STATE-RESULT.json \
            /tmp/br203_mu_generated.hpp

      - name: Compile and self-test BR204 heavy surfaces
        run: |
          set -euo pipefail
          test "$(git hash-object "$WORKER")" = "$WORKER_BLOB"
          test "$(git hash-object "$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          g++ -std=c++20 -O3 -DNDEBUG -I/tmp "$WORKER" -o /tmp/br204-worker
          /tmp/br204-worker --self-test > /tmp/br204-worker-selftest.json
          python "$AGGREGATOR" self-test

      - name: Run representative b=96 storage pilot and durable unit
        run: |
          set -euo pipefail
          mkdir -p /tmp/pilot
          /tmp/br204-worker --b 96 --worker-blob "$WORKER_BLOB" \
            --out /tmp/pilot/br204-b-96.tsv
          gzip -9 -n /tmp/pilot/br204-b-96.tsv
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("/tmp/pilot/br204-b-96.tsv.gz")
          size=p.stat().st_size
          hard=4_000_000
          budget=524_288_000
          projected=size*97*2 + 20_971_520
          assert size <= hard, f"pilot gzip {size} exceeds per-b hard cap {hard}"
          assert projected <= budget, f"projected peak {projected} exceeds budget {budget}"
          Path("/tmp/pilot-storage.json").write_text(json.dumps({
              "pilot_b":96,"gzip_bytes":size,"projection_bytes":projected,
              "budget_bytes":budget,"safety_multiplier":2
          },sort_keys=True,indent=2)+"\n")
          print(Path("/tmp/pilot-storage.json").read_text())
          PY

      - name: Upload pilot durable unit
        uses: actions/upload-artifact@v4
        with:
          name: br204-b-96
          path: /tmp/pilot/br204-b-96.tsv.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload worker runtime and pilot storage receipt
        uses: actions/upload-artifact@v4
        with:
          name: br204-worker-runtime
          path: |
            /tmp/br204-worker
            /tmp/pilot-storage.json
          retention-days: 1
          if-no-files-found: error

  plan:
    needs: [authorize, pilot]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download current pilot unit
        uses: actions/download-artifact@v4
        with:
          name: br204-b-96
          path: /tmp/current

      - name: Download prior carried units
        if: needs.authorize.outputs.carry_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize.outputs.carry_run_id }}
          pattern: br204-b-*
          path: /tmp/prior
          merge-multiple: true

      - name: Validate carry and emit missing durable units
        id: plan
        run: |
          set -euo pipefail
          python "$AGGREGATOR" plan \
            --input-dir /tmp/current --input-dir /tmp/prior \
            --worker-blob "$WORKER_BLOB" --out /tmp/plan.json > /tmp/missing.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open("/tmp/plan.json"))
          m=p["missing_units"]
          print("matrix="+json.dumps(m if m else [-1],separators=(",",":")))
          print("missing_count="+str(len(m)))
          PY
          cat /tmp/plan.json

  units:
    needs: [authorize, pilot, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        b: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Download worker runtime
        if: matrix.b != -1
        uses: actions/download-artifact@v4
        with:
          name: br204-worker-runtime
          path: /tmp/runtime

      - name: Compute one missing durable b unit
        if: matrix.b != -1
        run: |
          set -euo pipefail
          chmod +x /tmp/runtime/br204-worker
          mkdir -p /tmp/unit
          /tmp/runtime/br204-worker --b "${{ matrix.b }}" --worker-blob "$WORKER_BLOB" \
            --out "/tmp/unit/br204-b-${{ matrix.b }}.tsv"
          gzip -9 -n "/tmp/unit/br204-b-${{ matrix.b }}.tsv"
          size="$(stat -c %s "/tmp/unit/br204-b-${{ matrix.b }}.tsv.gz")"
          test "$size" -le 4000000

      - name: Upload durable b unit
        if: matrix.b != -1
        uses: actions/upload-artifact@v4
        with:
          name: br204-b-${{ matrix.b }}
          path: /tmp/unit/br204-b-${{ matrix.b }}.tsv.gz
          retention-days: 1
          if-no-files-found: error

  aggregate:
    if: ${{ always() && needs.authorize.result == 'success' && needs.pilot.result == 'success' && needs.plan.result == 'success' && needs.units.result == 'success' }}
    needs: [authorize, pilot, plan, units]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download current-run durable units
        uses: actions/download-artifact@v4
        with:
          pattern: br204-b-*
          path: /tmp/current
          merge-multiple: true

      - name: Download prior carried units
        if: needs.authorize.outputs.carry_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.authorize.outputs.carry_run_id }}
          pattern: br204-b-*
          path: /tmp/prior
          merge-multiple: true

      - name: Exact union, one global rational LP, and tail attribution
        run: |
          set -euo pipefail
          python "$AGGREGATOR" aggregate \
            --input-dir /tmp/current --input-dir /tmp/prior \
            --worker-blob "$WORKER_BLOB" \
            --envelope "$ENVELOPE" --main-bound "$MAIN_BOUND" \
            --out /tmp/BR204-FULL178-HEAVY-RESULT.json
          cat /tmp/BR204-FULL178-HEAVY-RESULT.json

      - name: Upload compact parent result
        uses: actions/upload-artifact@v4
        with:
          name: br204-full178-parent-result
          path: /tmp/BR204-FULL178-HEAVY-RESULT.json
          retention-days: 3
          if-no-files-found: error
