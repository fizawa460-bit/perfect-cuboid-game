name: Stage32 BRIDGE BR204 FULL178 heavy

# Lifecycle: ACTIVE_AUTO — current BR204 FULL178 heavy producer surface.
# Research OS heavy authorization is fail-closed behind one dedicated runkey-only
# pull_request synchronize commit. opened/reopened and ordinary synchronizations are cold.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/generalization-bridge/runkeys/br204-full178-heavy.json'
      - '.github/workflows/br204-stage32-bridge-heavy.yml'

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: stage32-bridge-br204-heavy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  RUNKEY: stages/stage32/generalization-bridge/runkeys/br204-full178-heavy.json
  WORKER: stages/stage32/generalization-bridge/run_br204_full178_b_unit.cpp
  COMBINER: stages/stage32/generalization-bridge/combine_br204_d_slices.py
  BAND_RUNNER: stages/stage32/generalization-bridge/run_br204_resumable_band.py
  FINALIZER: stages/stage32/generalization-bridge/finalize_br204_band_checkpoint.py
  AGGREGATOR: stages/stage32/generalization-bridge/aggregate_br204_full178.py
  CONTRACT: stages/stage32/generalization-bridge/BR204-HEAVY-EXECUTION-CONTRACT.json
  WORKER_BLOB: 0d5ee8e1013cab6120e957707a363e86b3c0d41e
  COMBINER_BLOB: 4571f04f8a1f44c5e6aa19f25763569f2ccd4432
  BAND_RUNNER_BLOB: 0680132cab6da3e06a13f15c55993ed9b84f9a27
  FINALIZER_BLOB: e8e9219a6697e017efcf28ccdf8a6eaf5e181519
  AGGREGATOR_BLOB: 3b5f9be4b7bf126cf562b8e69a6733be0a3f9fee
  CONTRACT_BLOB: 0e4c9b2818233dfc641ea890903f3633ef6a701c
  BASE_BLOB: b7fc7e0c6c889c92cb152d4e8b54d05d2b71a5d1
  REPOSITORY_MAIN_HEAD: 37bb811b95399d73cc46fe899badcfa8eb5fca7d
  MAIN_STATE_BLOB: 232732e29f72b55c34d540bf1c7cfcc4a626851c
  ENVELOPE: '6703403803993209250491'
  MAIN_BOUND: '157570677819451133507'
  RECOVERY_SLOT_CAP: '900000'
  SOFT_SECONDS: '13500'
  SLICE_TIMEOUT_SECONDS: '3600'

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
      exact_sha: ${{ steps.auth.outputs.exact_sha }}
      carry_run_id: ${{ steps.auth.outputs.carry_run_id }}
      generation: ${{ steps.auth.outputs.generation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Research OS commit-range runkey authorization gate
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          echo "exact_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo 'carry_run_id=' >> "$GITHUB_OUTPUT"
          echo 'generation=0' >> "$GITHUB_OUTPUT"

          [ "$EVENT_NAME" = pull_request ] || exit 0
          [ "$BASE_REF" = main ] || exit 0
          [ "$HEAD_REF" = stage32bridge-mainbatch ] || exit 0
          [ "$PR_NUMBER" = 1813 ] || exit 0
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          # opened/reopened are deliberately cold. Only synchronize may arm.
          [ "$PR_ACTION" = synchronize ] || exit 0
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || true
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0

          # The event commit range itself, not cumulative PR paths, must contain the key.
          git diff --name-only "$BEFORE" "$HEAD_SHA" > /tmp/changed-paths.txt
          grep -Fxq "$RUNKEY" /tmp/changed-paths.txt || exit 0
          git show "$BEFORE:$RUNKEY" > /tmp/old-key.json 2>/dev/null || exit 1

          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          old=json.loads(Path('/tmp/old-key.json').read_text())
          cur=json.loads(Path(os.environ['RUNKEY']).read_text())
          schema='STAGE32_BR204_FULL178_HEAVY_RUNKEY_V8_RESEARCH_OS_PR_ARM'
          assert old['schema']==cur['schema']==schema

          old_g=int(old['generation']); new_g=int(cur['generation'])
          old_a=bool(old['armed']); new_a=bool(cur['armed'])
          if not new_a:
              # Cold source-lock/setup refresh is allowed only while still generation 0.
              assert old_g==new_g==0 and old_a is False
              Path('/tmp/auth-mode.json').write_text(json.dumps({'mode':'cold','generation':new_g}))
              raise SystemExit(0)

          changed=Path('/tmp/changed-paths.txt').read_text().splitlines()
          assert changed==[os.environ['RUNKEY']], 'arm/resume synchronize commit must mutate only the dedicated runkey'
          assert new_g==old_g+1 and new_g>0
          for k in ('execution','source_locks','resume','storage','credit'):
              assert cur[k]==old[k], f'{k} drift in execution commit'

          rp=cur['resource_preflight']
          assert rp['planned_effective_heavy_concurrency']==8
          assert rp['repository_stage_concurrency_ceiling']==18
          assert rp['maximum_other_stage32_heavy_concurrency_at_arm']==10
          observed=rp['observed_other_stage32_heavy_concurrency_at_arm']
          assert isinstance(observed,int) and not isinstance(observed,bool) and 0<=observed<=10
          assert 8+observed<=18

          assert cur['execution']['b_unit_count']==97
          assert cur['execution']['durable_subunit_count']==250
          assert cur['execution']['exact_inner_checkpoint_count']==4743
          assert cur['execution']['max_parallel']==8
          assert cur['execution']['d_bands']==[[8,54],[56,100],[102,146],[148,192]]
          assert cur['execution']['main_bound_snapshot']==os.environ['MAIN_BOUND']
          trig=cur['execution']['trigger']
          assert trig['event']=='pull_request'
          assert trig['automatic_arm_action']=='synchronize'
          assert trig['base_branch']=='main'
          assert trig['head_branch']=='stage32bridge-mainbatch'
          assert trig['runkey_only_arm_commit_required'] is True
          assert trig['commit_range_runkey_change_required'] is True

          locks=cur['source_locks']
          assert locks['worker_blob']==os.environ['WORKER_BLOB']
          assert locks['d_slice_combiner_blob']==os.environ['COMBINER_BLOB']
          assert locks['resumable_band_runner_blob']==os.environ['BAND_RUNNER_BLOB']
          assert locks['band_checkpoint_finalizer_blob']==os.environ['FINALIZER_BLOB']
          assert locks['aggregator_blob']==os.environ['AGGREGATOR_BLOB']
          assert locks['execution_contract_blob']==os.environ['CONTRACT_BLOB']
          assert locks['compact_mu_base_blob']==os.environ['BASE_BLOB']
          assert locks['repository_main_head']==os.environ['REPOSITORY_MAIN_HEAD']
          assert locks['repository_main_state_blob']==os.environ['MAIN_STATE_BLOB']
          actual_wf=subprocess.check_output(['git','hash-object','.github/workflows/br204-stage32-bridge-heavy.yml'],text=True).strip()
          assert locks['heavy_workflow_blob']==actual_wf

          assert cur['resume']['exact_restart_quantum']=='b_x_d'
          assert cur['resume']['checkpoint_after_each_completed_d'] is True
          assert cur['resume']['always_path_checkpoint_finalizer'] is True
          assert cur['resume']['always_path_artifact_upload'] is True
          assert cur['resume']['soft_deadline_seconds']==int(os.environ['SOFT_SECONDS'])
          assert cur['resume']['single_d_timeout_seconds']==int(os.environ['SLICE_TIMEOUT_SECONDS'])

          if not old_a:
              assert old_g==0 and new_g==1
              assert cur.get('carry_run_id') is None
              assert cur['arm_contract']['audited_doorstep_head']==os.environ['BEFORE']
              assert isinstance(cur['arm_contract']['audited_doorstep_review_id'],int)
              mode='initial'
          else:
              assert old_a is True and new_g>=2
              assert isinstance(cur.get('carry_run_id'),int)
              assert cur['arm_contract']==old['arm_contract']
              mode='resume'
          Path('/tmp/auth-mode.json').write_text(json.dumps({
              'mode':mode,'parent':os.environ['BEFORE'],'generation':new_g,
              'review':cur['arm_contract']['audited_doorstep_review_id'],
              'carry_run_id':cur.get('carry_run_id')
          }))
          PY

          mode="$(python -c 'import json;print(json.load(open("/tmp/auth-mode.json"))["mode"])')"
          [ "$mode" != cold ] || exit 0

          # Fail closed if live MAIN moved after the audited cold-doorstep locks.
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$REPOSITORY_MAIN_HEAD"
          test "$(git rev-parse FETCH_HEAD:stages/stage32/MAIN-STATE.json)" = "$MAIN_STATE_BLOB"
          test "$(git hash-object "$WORKER")" = "$WORKER_BLOB"
          test "$(git hash-object "$COMBINER")" = "$COMBINER_BLOB"
          test "$(git hash-object "$BAND_RUNNER")" = "$BAND_RUNNER_BLOB"
          test "$(git hash-object "$FINALIZER")" = "$FINALIZER_BLOB"
          test "$(git hash-object "$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git hash-object "$CONTRACT")" = "$CONTRACT_BLOB"

          if [ "$mode" = initial ]; then
            gh api "repos/$REPO/pulls/1813/reviews" --paginate > /tmp/reviews.json
            python - <<'PY'
          import json
          a=json.load(open('/tmp/auth-mode.json')); rs=json.load(open('/tmp/reviews.json'))
          hit=[r for r in rs if r.get('id')==a['review'] and r.get('commit_id')==a['parent']]
          assert hit, 'fresh hostile-audit review/head pair not found'
          body=hit[0].get('body') or ''
          assert 'HOSTILE AUDIT: PASS' in body and 'VERDICT: PASS' in body
          PY
          else
            carry="$(python -c 'import json;print(json.load(open("/tmp/auth-mode.json"))["carry_run_id"])')"
            gh api "repos/$REPO/actions/runs/$carry" > /tmp/carry-run.json
            gh api --paginate "repos/$REPO/actions/runs/$carry/artifacts?per_page=100" --jq '.artifacts[] | [.id,.name,(.expired|tostring)] | @tsv' > /tmp/carry-artifacts.tsv
            python - <<'PY'
          import json,os,subprocess,zipfile
          from pathlib import Path
          a=json.load(open('/tmp/auth-mode.json')); r=json.load(open('/tmp/carry-run.json'))
          assert r.get('head_sha')==a['parent'], 'carry run must belong to immediate previous generation head'
          assert r.get('path')=='.github/workflows/br204-stage32-bridge-heavy.yml'
          assert r.get('status')=='completed'
          conclusion=r.get('conclusion')
          assert conclusion in {'failure','cancelled','timed_out'}
          if conclusion=='failure':
              rows=[ln.split('\t') for ln in Path('/tmp/carry-artifacts.tsv').read_text().splitlines() if ln]
              hits=[row for row in rows if row[1]=='br204-recovery-summary' and row[2]=='false']
              assert len(hits)==1, 'failed generation requires exactly one nonexpired recovery summary'
              aid=hits[0][0]
              subprocess.run(['gh','api','-H','Accept: application/vnd.github+json',f'repos/{os.environ["REPO"]}/actions/artifacts/{aid}/zip'],check=True,stdout=open('/tmp/summary.zip','wb'))
              with zipfile.ZipFile('/tmp/summary.zip') as z: z.extractall('/tmp/summary')
              s=json.loads(next(Path('/tmp/summary').rglob('RECOVERY-SUMMARY.json')).read_text())
              assert s['resume_eligible'] is True, 'prior failure contains a hard-stop d slice; finer partition required'
          PY
          fi

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          a=json.load(open('/tmp/auth-mode.json'))
          print('authorized=true')
          print('carry_run_id='+('' if a['carry_run_id'] is None else str(a['carry_run_id'])))
          print('generation='+str(a['generation']))
          PY

  carry:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    outputs:
      prefix_count: ${{ steps.recover.outputs.prefix_count }}
      partial_band_count: ${{ steps.recover.outputs.partial_band_count }}
      pilot_low_present: ${{ steps.recover.outputs.pilot_low_present }}
      pilot_high_present: ${{ steps.recover.outputs.pilot_high_present }}
      discovered_artifact_count: ${{ steps.recover.outputs.discovered_artifact_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Recover every artifact page and validate complete plus partial work
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CARRY_RUN_ID: ${{ needs.authorize.outputs.carry_run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/prior-prefix /tmp/prior-units /tmp/prior-partials /tmp/prior-meta /tmp/reemit /tmp/reemit-partials /tmp/reemit-meta
          : > /tmp/carry-artifacts.tsv
          if [ -n "$CARRY_RUN_ID" ]; then
            gh api --paginate "repos/$REPO/actions/runs/$CARRY_RUN_ID/artifacts?per_page=100"               --jq '.artifacts[] | [.id,.name,(.expired|tostring)] | @tsv' > /tmp/carry-artifacts.tsv
            while IFS=$'\t' read -r aid name expired; do
              [ -n "$aid" ] || continue
              [ "$expired" = false ] || continue
              case "$name" in
                br204-prefix) dest=/tmp/prior-prefix ;;
                br204-partials|br204-p-*) dest=/tmp/prior-partials ;;
                br204-u-*) dest=/tmp/prior-units ;;
                br204-recovery-meta|br204-plan) dest=/tmp/prior-meta ;;
                *) continue ;;
              esac
              mkdir -p "$dest/artifact-$aid"
              gh api -H 'Accept: application/vnd.github+json'                 "repos/$REPO/actions/artifacts/$aid/zip" > "/tmp/a-$aid.zip"
              unzip -q "/tmp/a-$aid.zip" -d "$dest/artifact-$aid"
            done < /tmp/carry-artifacts.tsv
          fi
          python "$AGGREGATOR" checkpoint             --input-dir /tmp/prior-units             --input-dir /tmp/prior-prefix             --worker-blob "$WORKER_BLOB"             --out-dir /tmp/reemit             --manifest /tmp/reemit/RECOVERY-MANIFEST.json
          python "$COMBINER" bundle             --input-dir /tmp/prior-partials             --input-dir /tmp/prior-meta             --input-dir /tmp/prior-units             --out-dir /tmp/reemit-partials             --manifest /tmp/reemit-partials/PARTIAL-MANIFEST.json             --complete-manifest /tmp/reemit/RECOVERY-MANIFEST.json             --worker-blob "$WORKER_BLOB"
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          dst=Path('/tmp/reemit-meta'); dst.mkdir(exist_ok=True)
          for root in (Path('/tmp/prior-meta'),Path('/tmp/prior-units')):
              if not root.exists(): continue
              for pat in ('PILOT-MEASUREMENT-*.json','PILOT-STORAGE-PREFLIGHT.json'):
                  for p in root.rglob(pat):
                      q=dst/p.name
                      if q.exists():
                          assert q.read_bytes()==p.read_bytes(), f'conflicting recovery metadata {p.name}'
                      else: shutil.copy2(p,q)
          complete=json.loads(Path('/tmp/reemit/RECOVERY-MANIFEST.json').read_text())
          partial=json.loads(Path('/tmp/reemit-partials/PARTIAL-MANIFEST.json').read_text())
          rows=[ln.split('\t') for ln in Path('/tmp/carry-artifacts.tsv').read_text().splitlines() if ln]
          inv={
            'schema':'STAGE32_BR204_RECOVERY_DISCOVERY_V1',
            'carry_run_id':None if not rows else int(__import__('os').environ['CARRY_RUN_ID']),
            'discovered_artifact_count':len(rows),
            'discovered_complete_unit_artifact_count':sum(1 for r in rows if r[1].startswith('br204-u-')),
            'discovered_partial_band_artifact_count':sum(1 for r in rows if r[1].startswith('br204-p-')),
            'validated_carried_outer_unit_count':complete['validated_subunit_count'],
            'validated_carried_partial_band_count':partial['validated_partial_band_count'],
          }
          (dst/'RECOVERY-DISCOVERY.json').write_text(json.dumps(inv,sort_keys=True,indent=2)+'\n')
          PY
          python - <<'PY' > /tmp/ancestor-runs.txt
          import json
          from pathlib import Path
          ids=set()
          for p in Path('/tmp/prior-prefix').rglob('RECOVERY-LINEAGE.json'):
              ids.update(int(v) for v in json.loads(p.read_text()).get('superseded_run_ids',[]))
          for v in sorted(ids): print(v)
          PY
          if [ -n "$CARRY_RUN_ID" ]; then
            CARRY_RUN_ID="$CARRY_RUN_ID" python -c 'import json,os; from pathlib import Path; Path("/tmp/reemit/RECOVERY-LINEAGE.json").write_text(json.dumps({"schema":"STAGE32_BR204_RECOVERY_LINEAGE_V3","superseded_run_ids":[int(os.environ["CARRY_RUN_ID"])]},sort_keys=True,indent=2)+"\n")'
          else
            python -c 'import json; from pathlib import Path; Path("/tmp/reemit/RECOVERY-LINEAGE.json").write_text(json.dumps({"schema":"STAGE32_BR204_RECOVERY_LINEAGE_V3","superseded_run_ids":[]},sort_keys=True,indent=2)+"\n")'
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/reemit/RECOVERY-MANIFEST.json').read_text())
          p=json.loads(Path('/tmp/reemit-partials/PARTIAL-MANIFEST.json').read_text())
          d=json.loads(Path('/tmp/reemit-meta/RECOVERY-DISCOVERY.json').read_text())
          units={(x['b'],x['d_lo'],x['d_hi']) for x in c['subunits']}
          print('prefix_count='+str(c['validated_subunit_count']))
          print('partial_band_count='+str(p['validated_partial_band_count']))
          print('pilot_low_present='+str((0,8,54) in units).lower())
          print('pilot_high_present='+str((96,148,192) in units).lower())
          print('discovered_artifact_count='+str(d['discovered_artifact_count']))
          PY
      - uses: actions/upload-artifact@v4
        if: "${{ steps.recover.outputs.prefix_count != '0' }}"
        with:
          name: br204-prefix
          path: /tmp/reemit
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: "${{ steps.recover.outputs.partial_band_count != '0' }}"
        with:
          name: br204-partials
          path: /tmp/reemit-partials
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: br204-recovery-meta
          path: /tmp/reemit-meta
          retention-days: 1
          if-no-files-found: error
      - name: Delete superseded recovery artifacts only after re-emission
        if: "${{ needs.authorize.outputs.carry_run_id != '' }}"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CARRY_RUN_ID: ${{ needs.authorize.outputs.carry_run_id }}
        run: |
          set -euo pipefail
          delete_run_artifacts() {
            rid="$1"
            gh api --paginate "repos/$REPO/actions/runs/$rid/artifacts?per_page=100"               --jq '.artifacts[] | select(.name=="br204-prefix" or .name=="br204-partials" or .name=="br204-recovery-meta" or .name=="br204-plan" or .name=="br204-recovery-summary" or (.name|startswith("br204-u-")) or (.name|startswith("br204-p-"))) | .id' > "/tmp/delete-$rid.ids"
            while IFS= read -r aid; do
              [ -n "$aid" ] || continue
              gh api -X DELETE "repos/$REPO/actions/artifacts/$aid"
            done < "/tmp/delete-$rid.ids"
          }
          while IFS= read -r rid; do [ -n "$rid" ] && delete_run_artifacts "$rid"; done < /tmp/ancestor-runs.txt
          delete_run_artifacts "$CARRY_RUN_ID"

  runtime:
    needs: [authorize, carry]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Compile and self-test exact checkpoint-aware runtime
        run: |
          set -euo pipefail
          test "$(git hash-object "$WORKER")" = "$WORKER_BLOB"
          test "$(git hash-object "$COMBINER")" = "$COMBINER_BLOB"
          test "$(git hash-object "$BAND_RUNNER")" = "$BAND_RUNNER_BLOB"
          test "$(git hash-object "$AGGREGATOR")" = "$AGGREGATOR_BLOB"
          test "$(git hash-object "$CONTRACT")" = "$CONTRACT_BLOB"
          python stages/stage32/generalization-bridge/verify_br203_picard_mu_16_state_v2.py --output /tmp/mu.json
          python stages/stage32/generalization-bridge/emit_br203_bounded_mu_header.py /tmp/mu.json /tmp/br203_mu_generated.hpp
          mkdir -p /tmp/runtime
          g++ -std=c++20 -O3 -DNDEBUG -I/tmp "$WORKER" -o /tmp/runtime/br204-worker
          cp "$COMBINER" /tmp/runtime/
          cp "$BAND_RUNNER" /tmp/runtime/
          cp "$FINALIZER" /tmp/runtime/
          /tmp/runtime/br204-worker --self-test > /tmp/worker-selftest.json
          python /tmp/runtime/combine_br204_d_slices.py self-test | tee /tmp/combiner-selftest.json
          grep -Fq '"expected_single_d_checkpoints": 4743' /tmp/combiner-selftest.json
          python -m py_compile /tmp/runtime/combine_br204_d_slices.py /tmp/runtime/run_br204_resumable_band.py /tmp/runtime/finalize_br204_band_checkpoint.py
          python "$AGGREGATOR" self-test
      - uses: actions/upload-artifact@v4
        with:
          name: br204-worker-runtime
          path: /tmp/runtime
          retention-days: 1
          if-no-files-found: error

  pilot_low:
    needs: [carry, runtime]
    if: needs.carry.outputs.pilot_low_present != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      complete: ${{ steps.measure.outputs.complete }}
      final_bytes: ${{ steps.measure.outputs.final_bytes }}
      slice_bytes: ${{ steps.measure.outputs.slice_bytes }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: br204-worker-runtime
          path: /tmp/runtime
      - uses: actions/download-artifact@v4
        if: needs.carry.outputs.partial_band_count != '0'
        with:
          name: br204-partials
          path: /tmp/partials
      - name: Run resumable pilot b0 d8..54
        run: |
          set -euo pipefail
          chmod +x /tmp/runtime/br204-worker
          python /tmp/runtime/run_br204_resumable_band.py             --worker /tmp/runtime/br204-worker             --combiner /tmp/runtime/combine_br204_d_slices.py             --b 0 --band-lo 8 --band-hi 54             --worker-blob "$WORKER_BLOB" --resume-dir /tmp/partials             --out-dir /tmp/band --soft-seconds "$SOFT_SECONDS"             --slice-timeout-seconds "$SLICE_TIMEOUT_SECONDS"
      - name: Finalize pilot checkpoint on every outcome
        id: measure
        if: always()
        run: |
          set -euo pipefail
          python /tmp/runtime/finalize_br204_band_checkpoint.py \
            --combiner /tmp/runtime/combine_br204_d_slices.py \
            --out-dir /tmp/band --b 0 --band-lo 8 --band-hi 54 \
            --worker-blob "$WORKER_BLOB" > /tmp/finalize.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/finalize.json').read_text())
          m={'schema':'STAGE32_BR204_PILOT_RECOVERY_MEASUREMENT_V3_ALWAYS_CHECKPOINT','b':0,'band':[8,54],'complete':x['complete'],'recovery_slot_payload_bytes':x['payload_bytes'],'final_band_gzip_bytes':x['final_bytes'],'stop_reason':x['stop_reason'],'worker_blob':'0d5ee8e1013cab6120e957707a363e86b3c0d41e'}
          Path('/tmp/band/PILOT-MEASUREMENT-b0.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          print('complete='+str(x['complete']).lower())
          print('slice_bytes='+str(x['payload_bytes']))
          print('final_bytes='+str(x['final_bytes']))
          print('stop_reason='+str(x['stop_reason']))
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.measure.outputs.complete == 'true'
        with:
          name: br204-u-b0-d8-54
          path: |
            /tmp/band/br204-u-b0-d8-54.tsv.gz
            /tmp/band/PILOT-MEASUREMENT-b0.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.measure.outputs.complete != 'true'
        with:
          name: br204-p-b0-d8-54
          path: |
            /tmp/band/br204-partial-*
            /tmp/band/STATUS.json
            /tmp/band/PILOT-MEASUREMENT-b0.json
          retention-days: 1
          if-no-files-found: error
      - name: Require complete pilot or mark generation recovery-required
        if: steps.measure.outputs.complete != 'true'
        run: exit 1

  pilot_high:
    needs: [carry, runtime]
    if: needs.carry.outputs.pilot_high_present != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      complete: ${{ steps.measure.outputs.complete }}
      final_bytes: ${{ steps.measure.outputs.final_bytes }}
      slice_bytes: ${{ steps.measure.outputs.slice_bytes }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: br204-worker-runtime
          path: /tmp/runtime
      - uses: actions/download-artifact@v4
        if: needs.carry.outputs.partial_band_count != '0'
        with:
          name: br204-partials
          path: /tmp/partials
      - name: Run resumable pilot b96 d148..192
        run: |
          set -euo pipefail
          chmod +x /tmp/runtime/br204-worker
          python /tmp/runtime/run_br204_resumable_band.py             --worker /tmp/runtime/br204-worker             --combiner /tmp/runtime/combine_br204_d_slices.py             --b 96 --band-lo 148 --band-hi 192             --worker-blob "$WORKER_BLOB" --resume-dir /tmp/partials             --out-dir /tmp/band --soft-seconds "$SOFT_SECONDS"             --slice-timeout-seconds "$SLICE_TIMEOUT_SECONDS"
      - name: Finalize pilot checkpoint on every outcome
        id: measure
        if: always()
        run: |
          set -euo pipefail
          python /tmp/runtime/finalize_br204_band_checkpoint.py \
            --combiner /tmp/runtime/combine_br204_d_slices.py \
            --out-dir /tmp/band --b 96 --band-lo 148 --band-hi 192 \
            --worker-blob "$WORKER_BLOB" > /tmp/finalize.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/finalize.json').read_text())
          m={'schema':'STAGE32_BR204_PILOT_RECOVERY_MEASUREMENT_V3_ALWAYS_CHECKPOINT','b':96,'band':[148,192],'complete':x['complete'],'recovery_slot_payload_bytes':x['payload_bytes'],'final_band_gzip_bytes':x['final_bytes'],'stop_reason':x['stop_reason'],'worker_blob':'0d5ee8e1013cab6120e957707a363e86b3c0d41e'}
          Path('/tmp/band/PILOT-MEASUREMENT-b96.json').write_text(json.dumps(m,sort_keys=True,indent=2)+'\n')
          print('complete='+str(x['complete']).lower())
          print('slice_bytes='+str(x['payload_bytes']))
          print('final_bytes='+str(x['final_bytes']))
          print('stop_reason='+str(x['stop_reason']))
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.measure.outputs.complete == 'true'
        with:
          name: br204-u-b96-d148-192
          path: |
            /tmp/band/br204-u-b96-d148-192.tsv.gz
            /tmp/band/PILOT-MEASUREMENT-b96.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.measure.outputs.complete != 'true'
        with:
          name: br204-p-b96-d148-192
          path: |
            /tmp/band/br204-partial-*
            /tmp/band/STATUS.json
            /tmp/band/PILOT-MEASUREMENT-b96.json
          retention-days: 1
          if-no-files-found: error
      - name: Require complete pilot or mark generation recovery-required
        if: steps.measure.outputs.complete != 'true'
        run: exit 1

  plan:
    needs: [authorize, carry, runtime, pilot_low, pilot_high]
    if: ${{ always() && needs.authorize.result == 'success' && needs.carry.result == 'success' && needs.runtime.result == 'success' && (needs.pilot_low.result == 'success' || needs.pilot_low.result == 'skipped') && (needs.pilot_high.result == 'success' || needs.pilot_high.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        if: needs.carry.outputs.prefix_count != '0'
        with:
          name: br204-prefix
          path: /tmp/prefix
      - uses: actions/download-artifact@v4
        if: needs.pilot_low.result == 'success' || needs.pilot_high.result == 'success'
        with:
          pattern: br204-u-*
          path: /tmp/current
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: br204-recovery-meta
          path: /tmp/meta
      - id: plan
        run: |
          set -euo pipefail
          python "$AGGREGATOR" plan             --input-dir /tmp/current --input-dir /tmp/prefix             --worker-blob "$WORKER_BLOB" --out /tmp/plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          found={}
          for root in (Path('/tmp/current'),Path('/tmp/meta')):
              if not root.exists(): continue
              for p in root.rglob('PILOT-MEASUREMENT-b*.json'):
                  x=json.loads(p.read_text()); b=int(x['b'])
                  if b in found: assert found[b]==x, f'conflicting pilot measurement b={b}'
                  found[b]=x
          assert set(found)=={0,96}, found
          slots={b:max(int(x['recovery_slot_payload_bytes']),int(x['final_band_gzip_bytes'])) for b,x in found.items()}
          hard=900000; budget=524288000; overhead=20971520
          assert all(v<=hard for v in slots.values())
          measured=2*250*max(slots.values())+overhead
          absolute=2*250*hard+overhead
          assert measured<=budget and absolute<=budget
          out={'schema':'STAGE32_BR204_PILOT_STORAGE_PREFLIGHT_V2_D_SLICE','pilot_measurements':found,'recovery_slot_bytes':slots,'hard_cap_bytes':hard,'measured_rollover_projection_bytes':measured,'absolute_rollover_peak_bytes':absolute,'budget_bytes':budget}
          Path('/tmp/PILOT-STORAGE-PREFLIGHT.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          PY
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m=json.load(open('/tmp/plan.json'))['missing_units']
          assert len(m)<=248
          sentinel=[{'b':-1,'d_lo':-1,'d_hi':-1}]
          print('matrix='+json.dumps(m if m else sentinel,separators=(',',':')))
          print('missing_count='+str(len(m)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: br204-plan
          path: |
            /tmp/plan.json
            /tmp/PILOT-STORAGE-PREFLIGHT.json
          retention-days: 1
          if-no-files-found: error

  units:
    needs: [carry, runtime, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        if: matrix.b != -1
        with:
          name: br204-worker-runtime
          path: /tmp/runtime
      - uses: actions/download-artifact@v4
        if: matrix.b != -1 && needs.carry.outputs.partial_band_count != '0'
        with:
          name: br204-partials
          path: /tmp/partials
      - name: Resume only missing exact d slices inside one b x d-band
        id: compute
        if: matrix.b != -1
        run: |
          set -euo pipefail
          chmod +x /tmp/runtime/br204-worker
          python /tmp/runtime/run_br204_resumable_band.py             --worker /tmp/runtime/br204-worker             --combiner /tmp/runtime/combine_br204_d_slices.py             --b "${{ matrix.b }}" --band-lo "${{ matrix.d_lo }}" --band-hi "${{ matrix.d_hi }}"             --worker-blob "$WORKER_BLOB" --resume-dir /tmp/partials             --out-dir /tmp/band --soft-seconds "$SOFT_SECONDS"             --slice-timeout-seconds "$SLICE_TIMEOUT_SECONDS"
      - name: Finalize checkpoint on every outcome
        id: classify
        if: always() && matrix.b != -1
        run: |
          set -euo pipefail
          python /tmp/runtime/finalize_br204_band_checkpoint.py \
            --combiner /tmp/runtime/combine_br204_d_slices.py \
            --out-dir /tmp/band --b "${{ matrix.b }}" \
            --band-lo "${{ matrix.d_lo }}" --band-hi "${{ matrix.d_hi }}" \
            --worker-blob "$WORKER_BLOB" > /tmp/finalize.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open('/tmp/finalize.json'))
          print('complete='+str(x['complete']).lower())
          print('stop_reason='+str(x['stop_reason']))
          print('slice_bytes='+str(x['payload_bytes']))
          print('final_bytes='+str(x['final_bytes']))
          PY
      - uses: actions/upload-artifact@v4
        if: always() && matrix.b != -1 && steps.classify.outputs.complete == 'true'
        with:
          name: br204-u-b${{ matrix.b }}-d${{ matrix.d_lo }}-${{ matrix.d_hi }}
          path: /tmp/band/br204-u-b${{ matrix.b }}-d${{ matrix.d_lo }}-${{ matrix.d_hi }}.tsv.gz
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.b != -1 && steps.classify.outputs.complete != 'true'
        with:
          name: br204-p-b${{ matrix.b }}-d${{ matrix.d_lo }}-${{ matrix.d_hi }}
          path: |
            /tmp/band/br204-partial-*
            /tmp/band/STATUS.json
          retention-days: 1
          if-no-files-found: error
      - name: Require complete outer unit or force recovery generation
        if: matrix.b != -1 && steps.classify.outputs.complete != 'true'
        run: exit 1

  recovery_summary:
    needs: [authorize, carry, pilot_low, pilot_high, plan, units]
    if: ${{ always() && needs.authorize.result == 'success' && needs.carry.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Paginate current artifacts and classify partial reasons
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/partials /tmp/out
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100"             --jq '.artifacts[] | [.id,.name,(.expired|tostring)] | @tsv' > /tmp/current-artifacts.tsv
          while IFS=$'\t' read -r aid name expired; do
            [ "$expired" = false ] || continue
            case "$name" in br204-p-*) ;; *) continue ;; esac
            mkdir -p "/tmp/partials/$aid"
            gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/artifacts/$aid/zip" > "/tmp/p-$aid.zip"
            unzip -q "/tmp/p-$aid.zip" -d "/tmp/partials/$aid"
          done < /tmp/current-artifacts.tsv
          python - <<'PY'
          import json
          from pathlib import Path
          statuses=[json.loads(p.read_text()) for p in Path('/tmp/partials').rglob('STATUS.json')]
          resumable={'SOFT_DEADLINE','INTERRUPTED_AFTER_LAST_D_CHECKPOINT','INTERRUPTED_WITHOUT_DURABLE_D_CHECKPOINT'}
          hard=[s for s in statuses if s.get('stop_reason') not in resumable]
          out={
            'schema':'STAGE32_BR204_RECOVERY_SUMMARY_V1',
            'discovered_artifact_count':len(Path('/tmp/current-artifacts.tsv').read_text().splitlines()),
            'partial_band_status_count':len(statuses),
            'soft_deadline_partial_count':sum(s.get('stop_reason')=='SOFT_DEADLINE' for s in statuses),
            'hard_stop_statuses':[{'b':s.get('b'),'band':s.get('band'),'reason':s.get('stop_reason'),'failed_d':s.get('failed_d')} for s in hard],
            'resume_eligible':not hard,
          }
          Path('/tmp/out/RECOVERY-SUMMARY.json').write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: br204-recovery-summary
          path: /tmp/out/RECOVERY-SUMMARY.json
          retention-days: 1
          if-no-files-found: error

  aggregate:
    if: ${{ always() && needs.authorize.result == 'success' && needs.carry.result == 'success' && needs.plan.result == 'success' && needs.units.result == 'success' && (needs.pilot_low.result == 'success' || needs.pilot_low.result == 'skipped') && (needs.pilot_high.result == 'success' || needs.pilot_high.result == 'skipped') }}
    needs: [authorize, carry, pilot_low, pilot_high, plan, units]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        if: needs.carry.outputs.prefix_count != '0'
        with:
          name: br204-prefix
          path: /tmp/prefix
      - name: Paginate and download every current complete outer unit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/current
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100"             --jq '.artifacts[] | [.id,.name,(.expired|tostring)] | @tsv' > /tmp/current-artifacts.tsv
          while IFS=$'\t' read -r aid name expired; do
            [ "$expired" = false ] || continue
            case "$name" in br204-u-*) ;; *) continue ;; esac
            mkdir -p "/tmp/current/$aid"
            gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/artifacts/$aid/zip" > "/tmp/u-$aid.zip"
            unzip -q "/tmp/u-$aid.zip" -d "/tmp/current/$aid"
          done < /tmp/current-artifacts.tsv
      - name: Exact 250-unit union, ratio-class LP, and tail attribution
        run: |
          set -euo pipefail
          python "$AGGREGATOR" aggregate             --input-dir /tmp/current --input-dir /tmp/prefix             --worker-blob "$WORKER_BLOB" --envelope "$ENVELOPE"             --main-bound "$MAIN_BOUND" --out /tmp/BR204-FULL178-HEAVY-RESULT.json
          cat /tmp/BR204-FULL178-HEAVY-RESULT.json
      - uses: actions/upload-artifact@v4
        with:
          name: br204-full178-parent-result
          path: /tmp/BR204-FULL178-HEAVY-RESULT.json
          retention-days: 3
          if-no-files-found: error
