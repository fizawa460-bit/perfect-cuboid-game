name: StructureRadar search09 finalize
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'structure-radar-search-09-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply literature batch09
        run: |
          python - <<'PY'
          import json, pathlib
          ids=[f'SR-STR-{i:03d}' for i in range(65,73)]
          ledger='docs/structure-radar/literature/SR-SEARCH-09.md'
          rp='docs/structure-radar/structure-registry.json'
          r=json.load(open(rp)); found=[]
          for c in r['structures']:
            if c['structure_id'] in ids:
              assert c['search_status']=='NOT_SEARCHED'
              assert c['arsenal_decision']=='PENDING'
              c['search_status']='SEARCHED'
              c['arsenal_decision']='ACTIVE'
              c['search_ledger']=ledger
              found.append(c['structure_id'])
          assert sorted(found)==ids
          open(rp,'w').write(json.dumps(r,indent=2,ensure_ascii=False)+'\n')

          pp='docs/structure-radar/progress.json'
          p=json.load(open(pp)); bid='SR-BATCH-LITERATURE_SEARCH-09-R01'
          assert not any(x.get('batch_id')==bid for x in p['audit_batches'])
          p['audit_batches'].append({
            'batch_id':bid,'task_id':'SR-SEARCH-01','status':'SUBMITTED_FOR_AUDIT',
            'source_ids':[],'sources_reviewed':0,'structures_added':0,'structures_updated':8,
            'structure_carrier_sources':0,'structures_deduped':0,'searches_completed':8,
            'arsenal_decisions':8,'audit_required':True,'duplicate_source':0,'no_distinct_structure':0
          })
          open(pp,'w').write(json.dumps(p,indent=2,ensure_ascii=False)+'\n')

          pathlib.Path(ledger).write_text('''# StructureRadar literature ledger — search batch 09\n\nSEARCH_TASK=SR-SEARCH-01\nBATCH_ID=SR-BATCH-LITERATURE_SEARCH-09-R01\nSEARCH_DATE=2026-08-19\nSTRUCTURES=SR-STR-065,SR-STR-066,SR-STR-067,SR-STR-068,SR-STR-069,SR-STR-070,SR-STR-071,SR-STR-072\nSEARCH_BATCH_SIZE=8\nEVIDENCE_POLICY=repo exact receiver first; external primary literature is adjacent unless population, height and quantifiers match\nNOVELTY_BY_SEARCH_ABSENCE=false\n\n## SR-STR-065 — Support-energy upper exponent gate\nThe Cauchy--Schwarz implication #T<=B^sigma and sum w^2<=B^eta => N2<=B^((sigma+eta)/2+o(1)) is retained as an elementary repo gate. The full energy includes the diagonal N2 term, so no ambient energy estimate may be double-charged to obtain a strict saving. Transfer verdict: `REPO_EXACT_ENERGY_GATE`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-066 — Reduced tau height bound and height-only support no-go\nThe reduced physical-height adapter H(tau)<2B^2 is repo-specific. Counting rational parameters by height at this scale does not improve the certified half-power support bound. Transfer verdict: `REPO_HEIGHT_ADAPTER_AND_NEGATIVE_ROUTE_CERTIFICATE`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-067 — Fixed-tau ambient conic before the space-square filter\nFor reduced tau=p/q, p y^2-q x^2=p+q is retained as the exact ambient conic on the two-face toric host. It is not the Stage19 survivor fibre until the integral-space-square condition is imposed. Transfer verdict: `REPO_EXACT_AMBIENT_CONIC`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-068 — Pointwise subpower fibre bound versus uniform max-fibre firewall\nPointwise fixed-fibre bounds depending on rank do not supply the uniform max_tau estimate needed by the Stage19 counting gate. Naccarato, *Counting rational points on elliptic curves with a rational 2-torsion point* (arXiv:2105.04032), and Dujella, *Uniform Bounds for the Number of Rational Points of Bounded Height on Certain Elliptic Curves* (arXiv:2312.03655), give strong bounded-height estimates under rational torsion hypotheses; they are adjacent literature only unless the Stage19 fibres satisfy the same torsion, height and family-uniformity contracts. Transfer verdict: `REPO_QUANTIFIER_FIREWALL_WITH_ADJACENT_ELLIPTIC_LITERATURE`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-069 — Reduced tau core-scale decomposition\nThe exact decomposition A=pg, D=qg and core bound g<2B^2/H(tau) are retained as the repo dyadic-height adapter. They stratify collision packets but do not count representations or collisions. Transfer verdict: `REPO_EXACT_CORE_SCALE_ADAPTER`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-070 — Full collision-energy diagonal barrier\nE_tau=N2+C_tau with E_tau>=N2 is an exact bookkeeping identity. A half-power bound for the full energy cannot by itself prove a strict sub-half estimate for N2; only off-diagonal or bandwise savings can do that. Transfer verdict: `REPO_DIAGONAL_BARRIER`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-071 — Support/off-diagonal collision hybrid gate\nThe inequality N2<=S+sqrt(S C) is retained as the exact no-double-charge hybrid gate. Strict sub-half requires separate bounds sigma<1/2 and sigma+kappa<1, with C genuinely off-diagonal. Transfer verdict: `REPO_EXACT_HYBRID_GATE`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-072 — Dyadic tau-height/core restart contract\nOn H(tau)~T, the core bound g<<B^2/T together with N_T<=S_T+sqrt(S_T C_T) defines the correct restart interface. No external theorem located here supplies the required uniform bandwise support and off-diagonal collision savings in the same primitive canonical physical measure. Transfer verdict: `REPO_DYADIC_RESTART_INTERFACE`. Arsenal decision: `ACTIVE`.\n\n## Firewalls\n- `NOVELTY_BY_SEARCH_ABSENCE=false`.\n- Full collision energy may not be reused as an independent off-diagonal saving.\n- Ambient fixed-tau conics are not survivor fibres until the space-square filter is imposed.\n- Pointwise fixed-fibre bounds do not imply a uniform max-fibre bound.\n- Rational-height support counting at H(tau)<2B^2 does not cross the half-power wall.\n- Torsion-specific elliptic-curve literature is not transferred without matching torsion, height and family-uniformity hypotheses.\n- Core-scale and dyadic decompositions are adapters, not collision estimates.\n- No perfect-cuboid existence or nonexistence claim is made.\n''')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          rm .github/workflows/structure-radar-search09-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'StructureRadar: literature search batch 09'
          git push origin HEAD:${{ github.head_ref }}
