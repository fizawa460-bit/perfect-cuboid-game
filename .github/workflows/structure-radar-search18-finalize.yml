name: StructureRadar search18 finalize
on: pull_request
permissions: {contents: write}
jobs:
  finalize:
    if: github.head_ref == 'structure-radar-search-18-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - run: |
          python - <<'PY'
          import json,pathlib
          ids=['SR-STR-155','SR-STR-156','SR-STR-157','SR-STR-158','SR-STR-159','SR-STR-160','SR-STR-175','SR-STR-176','SR-STR-177','SR-STR-178']
          ledger='docs/structure-radar/literature/SR-SEARCH-18.md'
          rp='docs/structure-radar/structure-registry.json'
          r=json.load(open(rp)); cards=[]
          for c in r['structures']:
            if c['structure_id'] in ids:
              assert c['search_status'] in {'NOT_SEARCHED','NEEDS_REFRESH'} and c['arsenal_decision']=='PENDING'
              cards.append(c); c['search_status']='SEARCHED'; c['arsenal_decision']='ACTIVE'; c['search_ledger']=ledger
          assert [c['structure_id'] for c in cards]==ids
          open(rp,'w').write(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          z=['# StructureRadar literature ledger — search batch 18','','SEARCH_TASK=SR-SEARCH-01','BATCH_ID=SR-BATCH-LITERATURE_SEARCH-18-R01','SEARCH_DATE=2026-08-19','STRUCTURES='+','.join(ids),'SEARCH_BATCH_SIZE=10','NOVELTY_BY_SEARCH_ABSENCE=false','',
          '## Primary-source literature checked',
          '- Takumi Yoshida, *The relationship between face cuboids and elliptic curves* (arXiv:2407.09825). The paper defines the exact family E_{1,s}: y^2=x(x-(2s)^2)(x+(s^2-1)^2), proves the face-cuboid correspondence, records the rank-one fiber s=5/3, and proves infinitely many positive-rank specializations. It does not by itself prove the repo geometric generic-rank-zero statement or a global quantitative exceptional-fiber bound.',
          '- Remke Kloosterman, *Chevalley-Weil formula for hypersurfaces in P^n-bundles over curves and Mordell-Weil ranks in function field towers* (arXiv:1501.05184). Gives general Mordell-Weil rank bounds under Galois base change; adjacent to SR-STR-157/158 but not an exact classification of the repo degree-two maps or commuting lifts.',
          '- Yusuke Kimura, *F-theory models on K3 surfaces with various Mordell-Weil ranks — constructions that use quadratic base change of rational elliptic surfaces* (arXiv:1802.05195). Demonstrates Mordell-Weil rank growth under quadratic base change in elliptic K3 constructions; adjacent mechanism only, not the explicit R504 quotient calculation.',
          '- John Cremona, Tom Fisher, Michael Stoll, *Minimisation and reduction of 2-, 3- and 4-coverings of elliptic curves* (arXiv:0908.1741). Treats degree-4 genus-one models arising in explicit descent, including the two-quadrics framework; this is a direct external carrier for the general genus-one complete-intersection species behind SR-STR-175, not for its repo packet equations or physical denominator.',
          '- Tom Fisher, Graham Sills, *Local solubility and height bounds for coverings of elliptic curves* (arXiv:1103.4944). Gives local-solubility algorithms and height comparisons for 2-,3-,4-coverings; adjacent to SR-STR-175/178 but does not identify the repo compact physical denominator or its five-column routing.',
          '- Tom Fisher, *Higher descents on an elliptic curve with a rational 2-torsion point* (arXiv:1509.03234). Gives higher-descent machinery tailored to rational 2-torsion, including full rational 2-torsion cases; adjacent to SR-STR-176/178, not a carrier for the repo-specific torsion-translation denominator cancellation.','',
          '## Search outcome',
          '- SR-STR-155: keep the repo fixed-curve B^(2/5+o(1)) ceiling and moving-family quantifier firewall. Standard fixed-curve height counting does not provide constants uniform over a B-dependent Jacobi/Kummer family.',
          '- SR-STR-156: Yoshida directly carries the E_{1,s} family, the s=5/3 positive-rank example, and infinitely many positive-rank specializations; the geometric generic-rank-zero and orbit-height sparsity assertions remain repo-specific and are not attributed to Yoshida.',
          '- SR-STR-157/158: general base-change rank literature is adjacent, while the split/nonsplit degree-two normal forms, commuting-lift loci, and explicit R504 V4 quotient/rank-jump calculation remain repo-exact.',
          '- SR-STR-159: the common-squarefree-core equivalence is an exact repo receiver; descent literature does not turn it into a whole-family physical-height counting theorem.',
          '- SR-STR-160: retain the three directional quarter-power lower bounds as repo explicit-family results; no checked external theorem was promoted to the exact primitive/canonical Stage19 directional populations.',
          '- SR-STR-175: the smooth two-quadrics genus-one structure is externally standard in explicit degree-4 descent, but existence of a rational point and uniform moving-family counting remain separate.',
          '- SR-STR-176: rational 2-torsion descent literature is adjacent; the compact translation denominator D_T and four physical sign/orientation packets are repo-specific.',
          '- SR-STR-177: the four-cell selector gcd matrix is an exact algebraic cancellation certificate; its automatic square cannot be recharged as a new independent saving.',
          '- SR-STR-178: Fisher-Sills/Fisher support local covering and rational-2-torsion descent machinery, but the Euclid five-column routing and covering-specific local image conditions remain repo-specific.','']
          verdicts={
            'SR-STR-155':'`FIXED_CURVE_CEILING_WITH_UNIFORMITY_FIREWALL` — fixed rational curves are strict sub-half, but no uniform moving-family summation theorem is supplied.',
            'SR-STR-156':'`PARTIAL_DIRECT_YOSHIDA_CARRIER` — Yoshida carries the exact family and positive-rank specializations; generic-rank-zero and quantitative height-sparsity remain repo results.',
            'SR-STR-157':'`REPO_EXACT_DEGREE_TWO_DESCENT_CLASSIFICATION` — general base-change literature does not replace the split/nonsplit PGL2 and commuting-lift classification.',
            'SR-STR-158':'`REPO_EXPLICIT_RANK_JUMP` — quadratic-base-change rank growth is externally standard, but the R504 quotient and differential independence are repo-exact.',
            'SR-STR-159':'`REPO_EXACT_COMMON_CORE_RECEIVER` — descent language does not discharge the moving-core whole-family physical-height gate.',
            'SR-STR-160':'`REPO_DIRECTIONAL_QUARTER_POWER_LOWER` — all three directional lower families remain active with no global-exponent overclaim.',
            'SR-STR-175':'`DIRECT_EXTERNAL_DESCENT_SPECIES_CARRIER` — degree-4 genus-one/two-quadrics descent is externally standard; repo packet equations and moving count remain separate.',
            'SR-STR-176':'`RATIONAL_TWO_TORSION_ADJACENT_ONLY` — general torsion descent does not identify the repo compact physical denominator.',
            'SR-STR-177':'`REPO_EXACT_GCD_CANCELLATION` — automatic square factors are recorded only as an adapter and are not double charged.',
            'SR-STR-178':'`LOCAL_DESCENT_ADJACENT_WITH_IMAGE_FIREWALL` — general local-solubility/Hilbert machinery is useful, but covering-specific image conditions are still required.'
          }
          for c in cards:
            z += ['## '+c['structure_id']+' — '+c['canonical_math_name'],c['exact_equations_or_object'],'Potential weapon types: '+', '.join(c.get('potential_weapon_types',[]))+'.','Applicability gaps: '+'; '.join(c.get('applicability_gaps',[])),'Transfer verdict: '+verdicts[c['structure_id']],'Arsenal decision: `ACTIVE`.','']
          z += ['## Firewalls','- Search absence is not a novelty claim.','- Yoshida is not credited with the repo generic-rank-zero or quantitative exceptional-fiber theorem.','- General quadratic-base-change results are not substituted for the exact R504/R505 degree-two classification or physical-height adapters.','- Degree-4 descent literature carries the genus-one/two-quadrics species, not rational solvability or uniform moving-family counts.','- Automatic gcd/square cancellations are not recharged as independent savings.','- Fixed-curve sub-half bounds are not summed over growing families without uniform constants and quantifiers.','- No perfect-cuboid existence or nonexistence claim is made.','']
          pathlib.Path(ledger).write_text('\n'.join(z))
          pp='docs/structure-radar/progress.json'; p=json.load(open(pp)); bid='SR-BATCH-LITERATURE_SEARCH-18-R01'
          assert not any(x.get('batch_id')==bid for x in p['audit_batches'])
          p['audit_batches'].append({'batch_id':bid,'task_id':'SR-SEARCH-01','status':'SUBMITTED_FOR_AUDIT','source_ids':[],'sources_reviewed':6,'structures_added':0,'structures_updated':10,'structure_carrier_sources':2,'structures_deduped':0,'searches_completed':10,'arsenal_decisions':10,'audit_required':True,'duplicate_source':0,'no_distinct_structure':0})
          open(pp,'w').write(json.dumps(p,indent=2,ensure_ascii=False)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python - <<'PY'
          import json
          q=json.load(open('docs/structure-radar/exploration-queue.json'))
          ready=next(t for t in q['tasks'] if t['status']=='READY')
          assert ready['structure_ids']==[f'SR-STR-{i:03d}' for i in range(179,189)], ready
          c=json.load(open('docs/structure-radar/controller.json'))
          assert c['registry']['unresolved_search_count']==47 and c['registry']['pending_arsenal_decision_count']==66, c['registry']
          PY
          rm .github/workflows/structure-radar-search18-finalize.yml
          git config user.name github-actions; git config user.email github-actions@github.com
          git add -A
          git commit -m 'StructureRadar: literature search batch18'
          git push
