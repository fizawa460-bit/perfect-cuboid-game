name: Stage32EX5 BC2-02 exact support adapter

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_02_exact_witness_to_node_support.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_02_one_indexed_full178_terminal_to_picard64_completion.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-02-full178-target-to-59d-model-adapter-preflight.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-01b-runtime-node-coordinate-bridge.json'
      - 'stages/stage32/residual-32-01-production/full178-manifest.json'
      - 'stages/stage32/residual-32-01-production/full178-prefix-indexed-compression-main-checkpoint.json'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_indexer.py'
      - 'stages/stage32/32-21/32-21bl-joint-integer-witness.json'
      - '.github/workflows/stage32ex5-bc2-02-exact-support-adapter.yml'

permissions:
  contents: read

concurrency:
  group: stage32ex5-bc2-02-exact-support-adapter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  representative-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Replay generic 59D witness to exact 48-node support
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_02_exact_witness_to_node_support.py \
            --evidence stages/stage32/32-21/32-21bl-joint-integer-witness.json \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --node-bridge stages/stage32-ex5/breadth-cycle-2/bc2-01b-runtime-node-coordinate-bridge.json \
            --output "$RUNNER_TEMP/bc2-02-exact-support.json"
      - name: Check retained representative regression values
        run: |
          python - "$RUNNER_TEMP/bc2-02-exact-support.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          expected=[5,0,1,1,3,0,0,0,5,3,6,6,6,7,10,9,6,8,8,5,4,1,8,10,5,9,7,4,5,12,9,5,3,1,9,4,11,1,16,1,9,12,1,11,1,3,1,14]
          s=p['exceptional_support']
          assert p['status']=='PASS_EXACT_WITNESS_TO_NODE_SUPPORT'
          assert p['candidate']['row_id']=='g1-d186'
          assert s['pairings_last48']==expected
          assert s['sum']==266
          assert s['support_count']==44
          assert s['zero_indices_0based']==[1,5,6,7]
          assert s['canonical_node_vector_rank']==7
          assert s['projective_span_dimension']==6
          assert s['spans_p6'] is True
          print('BC2_02_GENERIC_ADAPTER_REPRESENTATIVE_REGRESSION_OK')
          PY
      - name: Upload compact adapter evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-02-exact-support-adapter
          path: ${{ runner.temp }}/bc2-02-exact-support.json
          retention-days: 7
          compression-level: 9

  indexed-terminal-prototype:
    needs: representative-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact solver dependencies
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Complete one indexed FULL178 terminal to exact Picard64 and rank-5 projection
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_02_one_indexed_full178_terminal_to_picard64_completion.py \
            --manifest stages/stage32/residual-32-01-production/full178-manifest.json \
            --prefix-checkpoint stages/stage32/residual-32-01-production/full178-prefix-indexed-compression-main-checkpoint.json \
            --adapter-preflight stages/stage32-ex5/breadth-cycle-2/bc2-02-full178-target-to-59d-model-adapter-preflight.json \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --solver-timeout-ms 60000 \
            --output "$RUNNER_TEMP/bc2-02-indexed-completion.json"
      - name: Validate bounded prototype semantics
        run: |
          python - "$RUNNER_TEMP/bc2-02-indexed-completion.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1]))
          assert p['schema']=='STAGE32EX5_BC2_02_ONE_INDEXED_FULL178_TERMINAL_TO_PICARD64_COMPLETION_V1'
          assert p['indexed_terminal']['row_id']=='g1-d008'
          assert p['indexed_terminal']['e']==4
          assert p['indexed_terminal']['terminal_rank']==0
          assert p['indexed_terminal']['rank_unrank_replay_exact'] is True
          assert p['exact_completion_problem']['result'] in {'SAT','UNSAT','UNKNOWN'}
          assert p['exact_completion_problem']['21az_fixed_projection_prism_imported'] is False
          assert p['exact_completion_problem']['21bk_21bh_21bi_21bj_chain_bands_imported'] is False
          assert p['firewalls']['heavy_scaleout_authorized'] is False
          assert p['firewalls']['FULL178_complete'] is False
          if p['result']['status']=='SAT':
              c=p['result']['completion']
              assert len(p['target']['z'])==5
              assert len(p['result']['witness_r_reduced'])==59
              assert c['all140_nonnegative'] is True
              assert c['projection_z_equals_C_times_picard'] is True
              assert c['reduced_59d_reconstructs_same_picard64'] is True
          print(json.dumps({'prototype_result':p['result']['status'],'canonical':p['canonical_sha256_without_this_field']},sort_keys=True))
          PY
      - name: Feed SAT completion into exact BC2 node-support consumer
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(python - "$RUNNER_TEMP/bc2-02-indexed-completion.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['result']['status'])
          PY
          )
          if [ "$STATUS" = SAT ]; then
            python stages/stage32-ex5/breadth-cycle-2/bc2_02_exact_witness_to_node_support.py \
              --evidence "$RUNNER_TEMP/bc2-02-indexed-completion.json" \
              --retained stages/stage33/33-07/picard_base_rows_retained.py \
              --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
              --node-bridge stages/stage32-ex5/breadth-cycle-2/bc2-01b-runtime-node-coordinate-bridge.json \
              --output "$RUNNER_TEMP/bc2-02-indexed-support.json"
            python - "$RUNNER_TEMP/bc2-02-indexed-support.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['status']=='PASS_EXACT_WITNESS_TO_NODE_SUPPORT'
          assert p['candidate']['row_id']=='g1-d008'
          assert p['reconstruction']['all140_nonnegative'] is True
          assert p['reconstruction']['checks']['fixed_projection_exact'] is True
          assert p['reconstruction']['checks']['slice_exact'] is True
          print(json.dumps({'support_count':p['exceptional_support']['support_count'],'span_dimension':p['exceptional_support']['projective_span_dimension']},sort_keys=True))
          PY
          else
            echo "bounded indexed completion result=$STATUS; exact node-support consumer intentionally not invoked"
          fi
      - name: Upload bounded indexed completion evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-02-indexed-picard64-prototype
          path: ${{ runner.temp }}/bc2-02-indexed-*.json
          retention-days: 7
          compression-level: 9
