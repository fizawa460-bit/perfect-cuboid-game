name: Stage15-6at branch-memory audit

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6at/**'
      - 'stages/stage15/evidence/stage15_6at_branch_memory_audit.json'
      - 'stages/stage15/replay/verify_stage15_6at.py'
      - 'stages/stage15/scripts/stage15_6at_branch_memory_audit.py'
      - '.github/workflows/stage15-6at-branch-memory-audit.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6at branch-memory audit
        run: python stages/stage15/replay/verify_stage15_6at.py
      - name: Compile Stage15-6at utility
        run: python -m py_compile stages/stage15/scripts/stage15_6at_branch_memory_audit.py stages/stage15/replay/verify_stage15_6at.py
