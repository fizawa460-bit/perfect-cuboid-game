name: Stage33-07 retained geometric sign intertwiner

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/certify_retained_geometric_sign_intertwiner_space.py'
      - 'stages/stage33/33-07/retained-q256-geometric-sign-endpoint.json'
      - 'stages/stage33/33-07/exceptional-p1-tangent-coordinates.json'
      - 'stages/stage33/33-07/materialize_order2_first_residue_functions.py'
      - 'stages/stage33/33-07/materialize_order2_localization_receiver.py'
      - 'stages/stage33/33-07/two-primary-residue-invariant-basis.json'
      - 'stages/stage33/33-07/br0b-boundary-raw-residue-map.json'
      - 'stages/stage33/33-07/br0g-finite-ramified-residue-presentation.json'
      - '.github/workflows/stage33-07-retained-geometric-sign-intertwiner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Reproduce exact finite localization receiver
        working-directory: stages/stage33/33-07
        run: python materialize_order2_localization_receiver.py
      - name: Compute seven-sign naturality intertwiner exactly
        working-directory: stages/stage33/33-07
        run: python certify_retained_geometric_sign_intertwiner_space.py
      - name: Validate exact retained-sign reduction and firewalls
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import hashlib,json
          p='retained-geometric-sign-delta-loc-intertwiner-space.json'
          x=json.load(open(p));h=x.pop('canonical_sha256')
          assert h==hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert x['execution']['remote_cas_used'] is False
          n=x['naturality_statement']
          assert n['generator_count']==7 and n['independent_generator_rank']==6
          assert n['seven_sign_product_is_projective_identity']
          assert n['boundary_permutations_reconstructed_from_exact_qi_node_coordinates']
          assert n['all_signs_preserve_U44_and_exact_29_generator_source_quotient']
          r=x['retained_receiver_reconstruction']
          assert (r['proper_Br2_dimension_f2'],r['finite_Z1_dimension_f2'],r['finite_B1_dimension_f2'],r['finite_H1_dimension_f2'])==(14,20,4,16)
          f=x['final_intertwiner']
          assert f['ambient_matrix_space_dimension_f2']==416
          assert f['naturality_constraint_rank_f2']+f['intertwiner_dimension_f2']==416
          e=x['exact_consequence']
          assert e['all_26_source_columns_treated_uniformly']
          assert e['connecting_matrix_columns_explicitly_materialized']==0
          assert not e['middle_gersten_module_action_materialized']
          assert not e['absolute_delta_loc_computed']
          assert not e['project_14x26_L_squareclass_tensor_materialized']
          assert not e['arithmetic_HS_closed']
          assert x['stage33_progress']=='6/11' and not x['stage33_08_released']
          print('STAGE33_07_RETAINED_GEOMETRIC_SIGN_INTERTWINER=PASS_EXACT')
          print('CERTIFICATE_SHA256='+h)
          print('NATURALITY_CONSTRAINT_RANK_F2='+str(f['naturality_constraint_rank_f2']))
          print('REMAINING_INTERTWINER_DIMENSION_F2='+str(f['intertwiner_dimension_f2']))
          print('FINITE_V4_DELTA_LOC_FORCED_ZERO='+str(f['finite_v4_delta_loc_forced_zero_by_seven_sign_naturality']).lower())
          print('NEXT='+x['next_exact_leaf'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-retained-geometric-sign-intertwiner
          retention-days: 5
          path: stages/stage33/33-07/retained-geometric-sign-delta-loc-intertwiner-space.json
