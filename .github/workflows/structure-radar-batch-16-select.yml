name: StructureRadar batch16 selector
on:
  push:
    branches: [structure-radar-recent-stage26-plus-batch-16]
    paths:
      - '.github/structure-radar-batch-16-trigger.txt'
jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-recent-stage26-plus-batch-16
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build selected source summary
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')
          ctl=json.loads((root/'docs/structure-radar/controller.json').read_text())
          q=json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          tid=ctl['queue']['current_task']
          task=next(t for t in q['tasks'] if t['task_id']==tid and t['status']=='READY')
          ids=task['source_ids']
          entries={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              d=json.loads(p.read_text())
              for e in d.get('sources',[]):
                  if e.get('source_id') in ids: entries[e['source_id']]=e
          assert len(entries)==len(ids),(len(entries),len(ids))
          out=[]
          pats=[r'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT',r'STRICT_SUBSQRT',r'=true',r'=false',r'boxed',r'\\biff\\b',r'\\bgcd\\b',r'\\bmod\\b',r'RECEIVER',r'THEOREM',r'PROVED',r'FAIL',r'PASS',r'NEXT=',r'BOUND',r'ASYMPTOTIC',r'EXTERNAL',r'ARSENAL']
          for i,sid in enumerate(ids,1):
              e=entries[sid]; path=e['path']; text=(root/path).read_text(errors='replace') if (root/path).exists() else ''
              title=''
              for ln in text.splitlines():
                  if ln.startswith('# '): title=ln[2:].strip(); break
              keys=[]
              for ln in text.splitlines():
                  s=ln.strip()
                  if s and any(re.search(p,s,re.I) for p in pats): keys.append(s[:360])
                  if len(keys)>=55: break
              out.append({'n':i,'source_id':sid,'path':path,'fingerprint':e.get('fingerprint',''),'stage':e.get('stage'),'kind':e.get('kind'),'evidence_role':e.get('evidence_role'),'title':title,'key_lines':keys,'excerpt':text[:12000]})
          (root/'.github/structure-radar-batch-16-summary.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          (root/'.github/structure-radar-batch-16-summary.txt').write_text('\n'.join(f"{x['n']:02d}\t{x['source_id']}\t{x['path']}\t{x['title']}" for x in out)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/structure-radar-batch-16-summary.json .github/structure-radar-batch-16-summary.txt
          git commit -m 'StructureRadar batch16 materialize current source summary' || exit 0
          git push
