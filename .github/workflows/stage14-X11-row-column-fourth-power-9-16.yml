name: Stage14-X11 row-column fourth-power 9/16

on:
  pull_request:
    paths:
      - 'stages/stage14/14-X11/**'
      - 'stages/stage14/data/14-X11/**'
      - 'stages/stage14/scripts/14-X11/**'
      - '.github/workflows/stage14-X11-row-column-fourth-power-9-16.yml'
      - 'stages/stage14/14-s7-35/**'
      - 'stages/stage14/14-s7-34/**'
      - 'stages/stage14/14-s7-33/**'
      - 'stages/stage14/14-4cu/**'
      - 'stages/stage14/14-X10/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage14-X11 exact audit
        run: python stages/stage14/scripts/14-X11/row_column_fourth_power_9_16_audit.py

      - name: Compile Stage14-X11 audit
        run: python -m py_compile stages/stage14/scripts/14-X11/row_column_fourth_power_9_16_audit.py

      - name: Run merged Stage14-s7-35 regression
        run: python stages/stage14/scripts/14-s7-35/extra_gcd_collapse_4_7_audit.py

      - name: Run merged Stage14-s7-34 regression
        run: python stages/stage14/scripts/14-s7-34/fourth_power_root_transfer_47_80_audit.py

      - name: Run merged Stage14-4cu regression
        run: python stages/stage14/scripts/14-4/orientation_linear_product_19_32_audit.py

      - name: Run merged Stage14-s7-33 boundary regression
        run: python stages/stage14/scripts/14-s7-33/theorem_boundary_audit.py

      - name: Run merged Stage14-X10 regression
        run: python stages/stage14/scripts/14-X10/top_corner_h_cayley_cofactor_audit.py

      - name: Lock predecessor boundaries
        run: |
          grep -Fq 'STAGE14_S7_35=COMPLETE_EXTRA_XI_RESIDUAL_GCD_COLLAPSE_AND_4_7_PROMOTION' stages/stage14/14-s7-35/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=4/7' stages/stage14/14-s7-35/result.md
          grep -Fq 'XI_EXTRA_GCD_FIXED_POWER_SUPPORT=false' stages/stage14/14-s7-35/result.md
          grep -Fq 'STAGE14_S7_34=COMPLETE_XI_FOURTH_POWER_ROOT_GCD_TRANSFER_AND_47_80_PROMOTION' stages/stage14/14-s7-34/result.md
          grep -Fq 'STAGE14_4CU=COMPLETE_RESIDUAL_CAYLEY_ORIENTATION_LINEAR_PRODUCT_TRANSFER_AND_19_32_PROMOTION' stages/stage14/14-4cu/result.md
          grep -Fq 'STAGE14_S7_33=COMPLETE_COMMON_CORE_GAUSSIAN_ORIENTATION_IDENTIFICATION_AND_TRANSFER_NOGO' stages/stage14/14-s7-33/result.md
          grep -Fq 'STAGE14_X10=COMPLETE_TOP_CORNER_ROOT_GCD_DICHOTOMY_AND_DOMINANT_CAYLEY_SHORT_COFACTOR_REDUCTION' stages/stage14/14-X10/result.md

      - name: Lock Stage14-X11 theorem boundary
        run: |
          f=stages/stage14/14-X11/result.md
          grep -Fq 'STAGE14_X11=COMPLETE_NONPROPORTIONAL_ROW_COLUMN_FOURTH_POWER_COLLAPSE_AND_9_16_PROMOTION' "$f"
          grep -Fq 'MERGED_S7_35_IMPORTED=true' "$f"
          grep -Fq 'MERGED_4CV_COMPATIBILITY_CHECKED=true' "$f"
          grep -Fq 'OPEN_4CV_PR_540_USED_AS_THEOREM_INPUT=false' "$f"
          grep -Fq 'NONPROPORTIONAL_WEIGHTED_COMBINATION=8:3' "$f"
          grep -Fq 'NONPROPORTIONAL_BRANCH_UPPER_BOUND_EXPONENT=19/34' "$f"
          grep -Fq 'PROPORTIONAL_BRANCH_UPPER_BOUND_EXPONENT=9/16' "$f"
          grep -Fq 'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=9/16' "$f"
          grep -Fq 'IMPROVEMENT_OVER_MERGED_4_7=1/112' "$f"
          grep -Fq 'NINE_SIXTEENTHS_SATURATION_THETA=5/16' "$f"
          grep -Fq 'NINE_SIXTEENTHS_SATURATION_PHI_LOWER=47/192' "$f"
          grep -Fq 'PROPORTIONAL_LINEAR_MINUS_ZERO_REQUIRED=true' "$f"
          grep -Fq 'REMAINING_RECEIVER=NineSixteenthsProportionalKResidualCommonScaleXiRowTransferIncidence' "$f"
          grep -Fq 'X11_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'NEXT_RECOMMENDED=Stage14-X12' "$f"

      - name: Diff check
        run: git diff --check HEAD^ HEAD
