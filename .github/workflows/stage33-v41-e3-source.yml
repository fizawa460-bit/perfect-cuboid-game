name: Stage33 V41 independent e3 source

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/proper-brauer2-from-discriminant.json'
      - 'stages/stage33/33-12/full-surface-pic2-kummer-target.json'
      - 'stages/stage33/33-12/j2-adapted-first-kummer-column-v34.json'
      - 'stages/stage33/33-12/e3-independent-proper14-source-v41.json'
      - 'stages/stage33/33-12/certify_e3_independent_proper14_source_v41.py'
      - 'stages/stage33/33-12/verify_e3_independent_proper14_source_v41.py'
      - '.github/workflows/stage33-v41-e3-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-v41-e3-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-e3-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V41 independent e3 source
        run: |
          python stages/stage33/33-12/verify_e3_independent_proper14_source_v41.py
          python stages/stage33/33-12/verify_j2_post_v38_locator_first_construction_policy_v39.py
          python stages/stage33/sync_main_state.py --check
          git diff --check
