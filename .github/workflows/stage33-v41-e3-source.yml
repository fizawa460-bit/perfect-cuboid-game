name: Stage33 V41-V67 e3 source, geometry, routing, and frontier replay

on:
  pull_request:
    paths:
      - 'stages/stage33/**'
      - 'docs/arsenal/**'
      - 'docs/research-os/**'
      - '.github/workflows/stage33-v41-e3-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-v41-v67-e3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-e3-source-geometry-routing-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V41-V67 e3 chain and current frontier
        run: |
          python stages/stage33/33-12/verify_e3_independent_proper14_source_v41.py
          python stages/stage33/33-12/verify_e3_v25_transfer_obstruction_v42.py
          python stages/stage33/33-12/verify_e3_generic_cech_adapter_gap_v43.py
          python stages/stage33/33-12/verify_e3_proper14_boundary_basis_definitions_v45.py
          python stages/stage33/33-12/verify_e3_proper14_boundary_bridge_absence_lock_v46.py
          python stages/stage33/33-12/verify_e3_proper14_boundary_bridge_construction_contract_v47.py
          python stages/stage33/33-12/verify_e3_pw05_action_generator_alignment_gap_v48.py
          python stages/stage33/33-12/verify_e3_pw05_naive_divisor_module_bridge_rejection_v49.py
          python stages/stage33/33-12/verify_e3_a1_1_type_correction_v50.py
          python stages/stage33/33-12/verify_e3_v25_method_rewire_v51.py
          python stages/stage33/33-12/verify_e3_mask20_literal_cech_preimage_gap_v52.py
          python stages/stage33/33-12/verify_e3_mask20_picard_adjoint_candidate_v53.py
          python stages/stage33/33-12/verify_e3_mask20_adjoint_u1_label_v54.py
          python stages/stage33/33-12/verify_e3_mask20_u1_fiber_cardinality_v55.py
          python stages/stage33/33-12/verify_e3_mask20_marked_picard_to_literal_geometry_bridge_gap_v56.py
          python stages/stage33/33-12/verify_e3_mask20_b1_gysin_image_gate_v57.py
          python stages/stage33/33-12/verify_e3_search_routing_supersession_v58.py
          python stages/stage33/33-12/verify_stage33_v58_effective_routing_state_v59.py
          python stages/stage33/33-12/verify_stage33_roadmap_v60_alignment.py
          python stages/stage33/33-12/verify_e3_b1_c22_pic0_2_basis_v61.py
          python stages/stage33/33-12/verify_e3_b1_full_domain_basis_v62.py
          python stages/stage33/33-12/verify_e3_b1_c22_kappa_a_literal_cech_lift_v63.py
          python stages/stage33/33-12/verify_e3_b1_c22_named_torsion_normalization_bridge_v64.py
          python stages/stage33/33-12/verify_e3_b1_j1_marked_kc_discriminator_gate_v65.py
          python stages/stage33/33-12/verify_stage33_v65_frontier_state_v66.py
          python stages/stage33/33-12/verify_e3_b1_j1_post1529_equivariance_scope_gate_v67.py
          python stages/stage33/33-12/verify_j2_post_v39_arsenal_first_bounded_search_policy_v41.py
          python stages/stage33/sync_main_state.py --check
          git diff --check
