name: Stage33 V41-V91C1W audit-repair semantic-bridge blocker replay

on:
  pull_request:
    paths:
      - 'stages/stage33/**'
      - 'docs/arsenal/**'
      - 'docs/research-os/**'
      - '.github/workflows/stage33-v41-e3-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-v41-v91c1w-audit-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-e3-source-geometry-routing-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact retained Stage33-07 dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' z3-solver
      - name: Rebuild retained Stage33-07 ambient localization inputs
        working-directory: stages/stage33/33-07
        run: |
          python materialize_order2_localization_receiver.py
          python certify_order2_quotient_raw_order4_bockstein.py
          python materialize_mixed_order_side_ambient_function_lifts.py
          python materialize_mixed_order_exceptional_ambient_tangent_function_lifts.py
