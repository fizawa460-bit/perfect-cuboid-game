name: Stage33 V41-V42 e3 source and lift-interface replay

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/proper-brauer2-from-discriminant.json'
      - 'stages/stage33/33-12/full-surface-pic2-kummer-target.json'
      - 'stages/stage33/33-12/j2-adapted-first-kummer-column-v34.json'
      - 'stages/stage33/33-12/j2-genuine-h2-mu2-kummer-adapter-v25.json'
      - 'stages/stage33/33-12/j2-corrected-explicit-cech-mu2-lift.json'
      - 'stages/stage33/33-12/e3-independent-proper14-source-v41.json'
      - 'stages/stage33/33-12/certify_e3_independent_proper14_source_v41.py'
      - 'stages/stage33/33-12/verify_e3_independent_proper14_source_v41.py'
      - 'stages/stage33/33-12/e3-v25-transfer-obstruction-v42.json'
      - 'stages/stage33/33-12/verify_e3_v25_transfer_obstruction_v42.py'
      - '.github/workflows/stage33-v41-e3-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-v41-v42-e3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-e3-source-and-lift-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V41 source and V42 V25-transfer obstruction
        run: |
          python stages/stage33/33-12/verify_e3_independent_proper14_source_v41.py
          python stages/stage33/33-12/verify_e3_v25_transfer_obstruction_v42.py
          python stages/stage33/33-12/verify_j2_post_v38_locator_first_construction_policy_v39.py
          python stages/stage33/sync_main_state.py --check
          git diff --check
