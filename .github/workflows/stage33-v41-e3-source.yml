name: Stage33 V41-V52 e3 source and lift-route replay

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/proper-brauer2-from-discriminant.json'
      - 'stages/stage33/33-12/full-surface-pic2-kummer-target.json'
      - 'stages/stage33/33-12/j2-adapted-first-kummer-column-v34.json'
      - 'stages/stage33/33-12/j2-genuine-h2-mu2-kummer-adapter-v25.json'
      - 'stages/stage33/33-12/j2-corrected-explicit-cech-mu2-lift.json'
      - 'stages/stage33/33-12/j2-cv-d2-semantic-orientation.json'
      - 'stages/stage33/33-12/j2-picard-adjoint-proper-br2.json'
      - 'stages/stage33/33-09/marked-picard-basis-bridge-certified.json'
      - 'stages/stage33/33-12/boundary-function-generator-source-lock.json'
      - 'stages/stage33/33-12/boundary-function-scalar-descent-certificate.json'
      - 'stages/stage33/33-12/e3-independent-proper14-source-v41.json'
      - 'stages/stage33/33-12/certify_e3_independent_proper14_source_v41.py'
      - 'stages/stage33/33-12/verify_e3_independent_proper14_source_v41.py'
      - 'stages/stage33/33-12/e3-v25-transfer-obstruction-v42.json'
      - 'stages/stage33/33-12/verify_e3_v25_transfer_obstruction_v42.py'
      - 'stages/stage33/33-12/e3-generic-cech-adapter-gap-v43.json'
      - 'stages/stage33/33-12/verify_e3_generic_cech_adapter_gap_v43.py'
      - 'stages/stage33/33-12/e3-proper14-boundary-basis-definitions-v45.json'
      - 'stages/stage33/33-12/verify_e3_proper14_boundary_basis_definitions_v45.py'
      - 'stages/stage33/33-12/e3-proper14-boundary-bridge-absence-lock-v46.json'
      - 'stages/stage33/33-12/verify_e3_proper14_boundary_bridge_absence_lock_v46.py'
      - 'stages/stage33/33-12/e3-proper14-boundary-bridge-construction-contract-v47.json'
      - 'stages/stage33/33-12/verify_e3_proper14_boundary_bridge_construction_contract_v47.py'
      - 'stages/stage33/33-12/e3-pw05-action-generator-alignment-gap-v48.json'
      - 'stages/stage33/33-12/verify_e3_pw05_action_generator_alignment_gap_v48.py'
      - 'stages/stage33/33-12/e3-pw05-naive-divisor-module-bridge-rejection-v49.json'
      - 'stages/stage33/33-12/verify_e3_pw05_naive_divisor_module_bridge_rejection_v49.py'
      - 'stages/stage33/33-12/e3-a1-1-type-correction-v50.json'
      - 'stages/stage33/33-12/verify_e3_a1_1_type_correction_v50.py'
      - 'stages/stage33/33-12/e3-v25-method-rewire-v51.json'
      - 'stages/stage33/33-12/verify_e3_v25_method_rewire_v51.py'
      - 'stages/stage33/33-12/e3-mask20-literal-cech-preimage-gap-v52.json'
      - 'stages/stage33/33-12/verify_e3_mask20_literal_cech_preimage_gap_v52.py'
      - 'stages/stage33/33-12/verify_stage33_roadmap_v52_alignment.py'
      - 'stages/stage33/ROADMAP-33-12-MICROGOALS.md'
      - '.github/workflows/stage33-v41-e3-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-v41-v52-e3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-e3-source-and-lift-route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V41-V52 e3 source and lift route
        run: |
          python stages/stage33/33-12/verify_e3_independent_proper14_source_v41.py
          python stages/stage33/33-12/verify_e3_v25_transfer_obstruction_v42.py
          python stages/stage33/33-12/verify_e3_generic_cech_adapter_gap_v43.py
          python stages/stage33/33-12/verify_e3_proper14_boundary_basis_definitions_v45.py
          python stages/stage33/33-12/verify_e3_proper14_boundary_bridge_absence_lock_v46.py
          python stages/stage33/33-12/verify_e3_proper14_boundary_bridge_construction_contract_v47.py
          python stages/stage33/33-12/verify_e3_pw05_action_generator_alignment_gap_v48.py
          python stages/stage33/33-12/verify_e3_pw05_naive_divisor_module_bridge_rejection_v49.py
          python stages/stage33/33-12/verify_e3_a1_1_type_correction_v50.py
          python stages/stage33/33-12/verify_e3_v25_method_rewire_v51.py
          python stages/stage33/33-12/verify_e3_mask20_literal_cech_preimage_gap_v52.py
          python stages/stage33/33-12/verify_stage33_roadmap_v52_alignment.py
          python stages/stage33/33-12/verify_j2_post_v38_locator_first_construction_policy_v39.py
          python stages/stage33/sync_main_state.py --check
          git diff --check
