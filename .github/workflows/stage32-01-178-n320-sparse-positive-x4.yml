name: Stage32 32-01-178 N320 sparse positive x4 relations

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/32-01-178/nodes/N320/**'
      - '.github/workflows/stage32-01-178-n320-sparse-positive-x4.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify N320 exact sparse-positive quotient relations
        run: python stages/stage32/32-01-178/nodes/N320/verify_n320_sparse_positive_x4_relations.py
