name: StructureRadar pending inspect
on: pull_request
permissions: {contents: write}
jobs:
  inspect:
    if: github.head_ref == 'structure-radar-registry-24-inspect'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - run: |
          python - <<'PY'
          import json, pathlib
          ids=['SR-STR-076','SR-STR-154','SR-STR-161','SR-STR-162','SR-STR-163','SR-STR-164','SR-STR-165','SR-STR-166','SR-STR-167','SR-STR-168']
          decisions={'SR-STR-076':'PARKED','SR-STR-154':'PARKED','SR-STR-161':'ACTIVE','SR-STR-162':'EXTERNAL_GATE','SR-STR-163':'ACTIVE','SR-STR-164':'ACTIVE','SR-STR-165':'ACTIVE','SR-STR-166':'ACTIVE','SR-STR-167':'EXTERNAL_GATE','SR-STR-168':'EXTERNAL_GATE'}
          rp='docs/structure-radar/structure-registry.json'; r=json.load(open(rp)); seen=[]
          for c in r['structures']:
            if c['structure_id'] in ids:
              assert c['arsenal_decision']=='PENDING', (c['structure_id'],c['arsenal_decision'])
              c['arsenal_decision']=decisions[c['structure_id']]; seen.append(c['structure_id'])
          assert seen==ids, seen
          open(rp,'w').write(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          ledger=pathlib.Path('docs/structure-radar/arsenal/SR-ARSENAL-24.md'); ledger.parent.mkdir(parents=True,exist_ok=True)
          ledger.write_text('''# StructureRadar Arsenal classification — batch 24

BATCH_ID=SR-BATCH-ARSENAL_DECISION-24-R01
STRUCTURES=SR-STR-076,SR-STR-154,SR-STR-161,SR-STR-162,SR-STR-163,SR-STR-164,SR-STR-165,SR-STR-166,SR-STR-167,SR-STR-168
ARSENAL_DECISIONS=10
ACTIVE=5
PARKED=2
EXTERNAL_GATE=3
REJECTED=0
NOVELTY_BY_SEARCH_ABSENCE=false
CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=1/2
STRICT_SUBSQRT_POWER_SAVING_PROVED=false

- SR-STR-076 = PARKED: matched finite M2-M3 panel is a certified numerical/regression oracle, not an asymptotic theorem.
- SR-STR-154 = PARKED: matched M2-to-N2 census through one million is a strong finite oracle; effective slopes/directional ordering remain diagnostic only.
- SR-STR-161 = ACTIVE: separated quadratic/Jacobi large-sieve package is reusable after genuine coefficient separation; arbitrary correlated W(u,v) remains outside the theorem contract.
- SR-STR-162 = EXTERNAL_GATE: missing theorem is the thin-Pythagorean-family first-small-point large-prime + complete-2-descent frequency bound in the physical logarithmic height window.
- SR-STR-163 = ACTIVE: generalized-Jacobian/Prym and rational-2-torsion descent is a reusable structural interface; ramified lifts are kept distinct from unramified E[2]-torsors.
- SR-STR-164 = ACTIVE: exact squareclass-collision cover plus square/polynomial-sieve routing is reusable after diagonal, irreducibility, singularity and physical-height checks.
- SR-STR-165 = ACTIVE: Gaussian prime-ideal / quadratic-Hecke large-sieve transfer is reusable after one-ideal separation, ray-class normalization and conductor cleanup; sparse selector remains explicit.
- SR-STR-166 = ACTIVE: eliminant-first determinant/Kloosterman dichotomy is a reusable routing/firewall and forbids a second spacing charge on the same common core.
- SR-STR-167 = EXTERNAL_GATE: missing adapter is a proved B^o(1)-complexity multiplicative/Hecke-multiplicative decomposition of the actual physical selectors.
- SR-STR-168 = EXTERNAL_GATE: missing adapter is a same-measure weighted Gaussian norm-ratio collision theorem, or a verified polynomial-length Gaussian modulus/sample family retaining frozen cofactor and physical masks.

Firewalls: ACTIVE means reusable only at the exact stated receiver; EXTERNAL_GATE is a falsifiable missing theorem/adapter, not novelty by absence; finite panels stay validators; population/height/multiplicity/modulus/selector/quantifier contracts are unchanged; whole-family exponent stays 1/2; no perfect-cuboid existence/nonexistence claim is made.
''')
          pp='docs/structure-radar/progress.json'; p=json.load(open(pp)); bid='SR-BATCH-ARSENAL_DECISION-24-R01'
          assert not any(x.get('batch_id')==bid for x in p['audit_batches'])
          p['audit_batches'].append({'batch_id':bid,'task_id':'SR-REGISTRY-ARSENAL-01','status':'SUBMITTED_FOR_AUDIT','source_ids':[],'sources_reviewed':0,'structures_added':0,'structures_updated':10,'structure_carrier_sources':0,'structures_deduped':0,'searches_completed':0,'arsenal_decisions':10,'audit_required':True,'duplicate_source':0,'no_distinct_structure':0,'decision_breakdown':{'ACTIVE':5,'PARKED':2,'EXTERNAL_GATE':3,'REJECTED':0}})
          open(pp,'w').write(json.dumps(p,indent=2,ensure_ascii=False)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python - <<'PY'
          import json
          c=json.load(open('docs/structure-radar/controller.json')); r=json.load(open('docs/structure-radar/structure-registry.json'))
          assert c['registry']['unresolved_search_count']==0
          assert c['registry']['pending_arsenal_decision_count']==9
          assert c['queue']['task_count']==0
          assert c['status']=='WAITING_FOR_REGISTRY_WORK'
          pending=[x['structure_id'] for x in r['structures'] if x.get('arsenal_decision')=='PENDING']
          assert pending==['SR-STR-169','SR-STR-170','SR-STR-171','SR-STR-172','SR-STR-173','SR-STR-174','SR-STR-216','SR-STR-222','SR-STR-223'], pending
          print('NEXT_PENDING',pending)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/structure-radar/controller.json docs/structure-radar/progress.json docs/structure-radar/structure-registry.json docs/structure-radar/arsenal/SR-ARSENAL-24.md
          git commit -m 'TEMP: materialize Arsenal decision batch24'
          git push
