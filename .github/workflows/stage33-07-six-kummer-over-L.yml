name: Stage33-07 six Kummer classes over L

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/certify_six_unramified_kummer_classes_nonsquare.py'
      - 'stages/stage33/33-07/certify_six_unramified_kummer_classes_nonsquare_over_L.py'
      - 'stages/stage33/33-07/certify_quartic_norm_biquadratic_cover_reduction.py'
      - 'stages/stage33/33-07/certify_bj_offboundary_genus1_components.py'
      - 'stages/stage33/33-07/certify_ambient_linear_carrier_boundary_offboundary_split.py'
      - 'stages/stage33/33-07/inventory_mixed_order_ambient_linear_divisor_support.py'
      - 'stages/stage33/33-07/materialize_mixed_order_side_ambient_function_lifts.py'
      - 'stages/stage33/33-07/materialize_mixed_order_exceptional_ambient_tangent_function_lifts.py'
      - 'stages/stage33/33-07/certify_order2_quotient_raw_order4_bockstein.py'
      - '.github/workflows/stage33-07-six-kummer-over-L.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: gate
        env: {EVENT: '${{ github.event_name }}', ACTION: '${{ github.event.action }}', BEFORE: '${{ github.event.before }}', HEAD: '${{ github.event.pull_request.head.sha }}', WORKFLOW_REF: '${{ github.workflow_ref }}'}
        run: python .github/scripts/stage33_commit_range_gate.py
  certify:
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Reproduce exact quartic Kummer prefix
        working-directory: stages/stage33/33-07
        run: |
          python certify_order2_quotient_raw_order4_bockstein.py
          python materialize_mixed_order_side_ambient_function_lifts.py
          python materialize_mixed_order_exceptional_ambient_tangent_function_lifts.py
          python inventory_mixed_order_ambient_linear_divisor_support.py
          python certify_ambient_linear_carrier_boundary_offboundary_split.py
          python certify_bj_offboundary_genus1_components.py
          python certify_quartic_norm_biquadratic_cover_reduction.py
      - name: Close six unramified Kummer classes over Q(i)
        working-directory: stages/stage33/33-07
        run: python certify_six_unramified_kummer_classes_nonsquare.py
      - name: Recheck all six after constant-field extension to L
        working-directory: stages/stage33/33-07
        run: python certify_six_unramified_kummer_classes_nonsquare_over_L.py
      - name: Validate exact over-L prime inventory firewall
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import hashlib,json
          p='six-unramified-kummer-classes-nonsquare-over-L.json'
          x=json.load(open(p)); h=x.pop('canonical_sha256')
          assert h==hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          s=x['summary']
          assert s['Kummer_groups_checked_over_L']==6
          assert s['Sx_nonsquare_over_L_count']==6
          assert s['squareclass_rank2_groups_over_L']==6
          assert s['quartic_offboundary_prime_strict_transforms_over_L']==12
          assert s['total_offboundary_carrier_prime_divisors_over_L']==24
          assert len(x['group_records'])==6
          assert all(r['irreducible_over_L_t_y'] for r in x['group_records'])
          assert all(r['prime_components_per_carrier_over_L']==1 for r in x['group_records'])
          assert all(x['exact_checks'].values())
          prog=x['constructive_progress']
          assert prog['off_boundary_prime_divisor_decomposition_over_L_fully_closed']
          assert prog['off_boundary_carrier_prime_divisor_count_over_L']==24
          assert prog['unramified_Kummer_square_triviality_tests_over_L_remaining']==0
          assert prog['global_geometric_Gersten_lifts_materialized_count']==0
          assert prog['off_boundary_codimension1_residue_certificates_materialized_count']==0
          assert not prog['project_14x26_L_squareclass_tensor_materialized']
          assert not prog['absolute_delta_loc_computed'] and not prog['arithmetic_HS_closed']
          assert x['stage33_progress']=='6/11' and not x['stage33_08_released']
          print('STAGE33_07_SIX_KUMMER_OVER_L=PASS')
          print('CERTIFICATE_SHA256='+h)
          print('OFFBOUNDARY_PRIME_DIVISORS_OVER_L=24')
          print('KUMMER_TESTS_REMAINING=0')
          print('NEXT='+x['next_exact_leaf'])
          PY
      - name: Upload over-L Kummer closure certificates
        uses: actions/upload-artifact@v4
        with:
          name: stage33-07-six-kummer-over-L
          retention-days: 3
          path: |
            stages/stage33/33-07/six-unramified-kummer-classes-nonsquare.json
            stages/stage33/33-07/six-unramified-kummer-classes-nonsquare-over-L.json
