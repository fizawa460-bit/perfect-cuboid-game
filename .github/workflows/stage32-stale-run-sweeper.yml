name: Stage32 stale-run sweeper

on:
  pull_request:
    paths:
      - 'stages/stage32/**'
      - '.github/workflows/stage32-*.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: stage32-stale-run-sweeper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cancel-old-heads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref }}
      CURRENT_SHA: ${{ github.event.pull_request.head.sha }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout current controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Cancel stale heads and obsolete same-head Stage32 runs
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          repo = os.environ['REPO']
          branch = os.environ['HEAD_REF']
          current_sha = os.environ['CURRENT_SHA']
          current_run = int(os.environ['CURRENT_RUN_ID'])
          token = os.environ['GH_TOKEN']
          active = {'queued', 'in_progress', 'waiting', 'requested', 'pending'}
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'stage32-stale-run-sweeper',
          }

          controller = json.loads(Path('stages/stage32/controller.json').read_text())
          current_item = str(controller.get('current_item') or '')
          match = re.search(r'32-([0-9]+[A-Z]{1,3})', current_item)
          leaf_token = match.group(1).lower() if match else None
          print(f'CURRENT_ITEM={current_item}')
          print(f'CURRENT_LEAF_TOKEN={leaf_token or "NONE_FAIL_SAFE"}')

          stale = []
          page = 1
          while True:
              query = urllib.parse.urlencode({
                  'branch': branch,
                  'event': 'pull_request',
                  'per_page': 100,
                  'page': page,
              })
              url = f'https://api.github.com/repos/{repo}/actions/runs?{query}'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              runs = payload.get('workflow_runs', [])
              if not runs:
                  break
              for run in runs:
                  run_id = int(run['id'])
                  if run_id == current_run:
                      continue
                  if run.get('status') not in active:
                      continue
                  name = str(run.get('name') or '')
                  if not name.startswith('Stage32'):
                      continue
                  sha = run.get('head_sha')
                  if sha != current_sha:
                      stale.append((run_id, name, sha, run.get('status'), 'OLDER_HEAD'))
                      continue
                  if name == 'Stage32 stale-run sweeper':
                      continue
                  if leaf_token is None:
                      continue
                  if leaf_token in name.lower():
                      continue
                  stale.append((run_id, name, sha, run.get('status'), 'OBSOLETE_SAME_HEAD'))
              if len(runs) < 100:
                  break
              page += 1

          cancelled = 0
          races = 0
          transient_failures = 0
          same_head_cancelled = 0
          for run_id, name, sha, status, reason in stale:
              url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel'
              for attempt in range(3):
                  req = urllib.request.Request(url, data=b'', method='POST', headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          if response.status != 202:
                              raise RuntimeError(
                                  f'unexpected cancel status {response.status} for {run_id}'
                              )
                      cancelled += 1
                      if reason == 'OBSOLETE_SAME_HEAD':
                          same_head_cancelled += 1
                      print(
                          f'CANCELLED reason={reason} run={run_id} status={status} '
                          f'head={sha} name={name}'
                      )
                      break
                  except urllib.error.HTTPError as exc:
                      if exc.code == 409:
                          races += 1
                          print(f'ALREADY_FINISHING reason={reason} run={run_id} name={name}')
                          break
                      if 500 <= exc.code <= 599:
                          print(
                              f'TRANSIENT_CANCEL_HTTP_{exc.code} attempt={attempt + 1} '
                              f'reason={reason} run={run_id} name={name}'
                          )
                          if attempt < 2:
                              time.sleep(1 + attempt)
                              continue
                          transient_failures += 1
                          break
                      raise

          print(f'STAGE32_STALE_RUNS_FOUND={len(stale)}')
          print(f'STAGE32_STALE_RUNS_CANCELLED={cancelled}')
          print(f'STAGE32_OBSOLETE_SAME_HEAD_CANCELLED={same_head_cancelled}')
          print(f'STAGE32_STALE_RUN_CANCEL_RACES={races}')
          print(f'STAGE32_STALE_RUN_TRANSIENT_FAILURES={transient_failures}')
          print(f'CURRENT_HEAD_PRESERVED={current_sha}')
          PY
