name: Stage25-60 R505 R506 boundary audit

on:
  pull_request:
    paths:
      - 'stages/stage25/25-60/r504-base-change-boundary.md'
      - 'stages/stage25/25-60/r505-common-core-gate.md'
      - 'stages/stage25/25-60/r506-common-leg-subsumption.md'
      - 'stages/stage25/25-60/r505-r506-discovery-ledger.md'
      - 'stages/stage25/25-60/r505-r506-iteration-controller.json'
      - 'stages/stage25/25-60/r505-r506-audit.py'
      - 'stages/stage25/25-60/deeper-lane-triage.md'
      - 'stages/stage25/25-60/continuation-policy.md'
      - '.github/workflows/stage25-60-r505-r506.yml'
  workflow_dispatch:

jobs:
  r505-r506-boundary-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage25 checkpoint60 R505/R506 boundary
        run: python stages/stage25/25-60/r505-r506-audit.py
