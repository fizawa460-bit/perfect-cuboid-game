name: Stage15-6 cycle bt-bx
on: [pull_request, workflow_dispatch]
jobs:
  verify-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python stages/stage15/replay/verify_stage15_6bt.py
      - run: python stages/stage15/replay/verify_stage15_6bu.py
      - run: python stages/stage15/replay/verify_stage15_6bv.py
      - run: python stages/stage15/replay/verify_stage15_6bw.py
      - run: python stages/stage15/replay/verify_stage15_6bx.py
      - run: python -m py_compile stages/stage15/scripts/stage15_6bt_sieve_audit.py stages/stage15/scripts/stage15_6bu_torsor_lattice.py stages/stage15/scripts/stage15_6bv_dispersion_audit.py stages/stage15/scripts/stage15_6bw_channel_gcd.py stages/stage15/scripts/stage15_6bx_gcd_moment_gate.py
