name: Stage14-4dg centered principal covariance

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4dg/**'
      - 'stages/stage14/data/14-4/centered_principal_covariance_summary.json'
      - 'stages/stage14/scripts/14-4/centered_principal_covariance_audit.py'
      - '.github/workflows/stage14-4dg-centered-principal-covariance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage14-4dg deterministic audit
        run: python stages/stage14/scripts/14-4/centered_principal_covariance_audit.py

      - name: Compile Stage14-4dg audit
        run: python -m py_compile stages/stage14/scripts/14-4/centered_principal_covariance_audit.py

      - name: Merged 4df source regression
        run: |
          f=stages/stage14/14-4df/result.md
          grep -Fq 'STAGE14_4DF=COMPLETE_S7_47_MAINLINE_CONSUMPTION_SIX_BLOCK_PAIRWISE_SEPARATION_AND_SQUARE_RECONSTRUCTION' "$f"
          grep -Fq 'SIX_ATOMIC_NORM_BLOCKS_PAIRWISE_SEPARATED=true' "$f"
          grep -Fq 'SIX_BLOCK_PACKET_TO_BALANCED_PAIR_MULTIPLICITY=Bo1' "$f"
          grep -Fq 'D_A_INDEPENDENT_FIXED_POWER_SUPPORT_AFTER_SIX_BLOCKS=false' "$f"

      - name: Merged s7-48 product norm regression
        run: |
          f=stages/stage14/14-s7-48/result.md
          grep -Fq 'PLUS_TO_MINUS_DIVISOR_SWITCH_FIBER=Bo1' "$f"
          grep -Fq 'MINUS_TO_PLUS_GAUSSIAN_SWITCH_FIBER=Bo1' "$f"
          grep -Fq 'BALANCED_SPLIT_CORRELATION_IS_ARITHMETIC_NOT_ALGEBRAIC=true' "$f"
          grep -Fq 'EXACT_S_ROUTE_ALGEBRA_EXHAUSTED_AT_THIS_RECEIVER=true' "$f"

      - name: Merged sH48 applicability regression
        run: |
          f=stages/stage14/14-sH48/result.md
          grep -Fq 'STAGE14_SH48=COMPLETE_S7_48_SNAPSHOT_GAUSSIAN_PRODUCT_SUM_CORRELATION_APPLICABILITY_AUDIT' "$f"
          grep -Fq 'OFF_THE_SHELF_THEOREM_APPLICABLE=false' "$f"
          grep -Fq 'FIXED_POWER_SAVING_PROVED=false' "$f"
          grep -Fq 'PREFERRED_RECEIVER=CenteredPrimitiveQuarterPairProductNormDualBalancedCellFactorizationDispersion' "$f"
          grep -Fq 'NEXT_H_NEEDED=false' "$f"

      - name: Fixed U route non cross promotion locks
        run: |
          grep -Fq 'STAGE14_T87=' stages/stage14/14-t87/result.md
          grep -Fq 'STAGE14_TH25=' stages/stage14/14-tH25/result.md

      - name: Stage14-4dg theorem boundary
        run: |
          f=stages/stage14/14-4dg/result.md
          grep -Fq 'STAGE14_4DG=COMPLETE_PRIMITIVE_PRODUCT_NORM_CENTERING_AND_PRINCIPAL_DENSITY_BOUNDARY' "$f"
          grep -Fq 'MERGED_4DF_IMPORTED=true' "$f"
          grep -Fq 'MERGED_S7_48_IMPORTED=true' "$f"
          grep -Fq 'MERGED_SH48_IMPORTED=true' "$f"
          grep -Fq 'GLOBAL_TWO_SIDED_CENTERING_IDENTITY_PROVED=true' "$f"
          grep -Fq 'CONDITIONAL_CENTERING_IDENTITY_PROVED=true' "$f"
          grep -Fq 'ABSOLUTE_CENTERED_DISPERSION_ALONE_SUFFICIENT=false' "$f"
          grep -Fq 'PRINCIPAL_DENSITY_CONTROL_REQUIRED_FOR_ABSOLUTE_DISPERSION_ROUTE=true' "$f"
          grep -Fq 'MARGINAL_FIXED_POWER_MEAN_SAVING_CERTIFIED=false' "$f"
          grep -Fq 'PRINCIPAL_TERM_FIXED_POWER_SAVING_PROVED=false' "$f"
          grep -Fq 'REMAINING_RECEIVER=ConditionallyCenteredPrimitiveQuarterPairProductNormDualBalancedCellFactorizationDispersionWithPrincipalDensityControl' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=1/2' "$f"
          grep -Fq 'STRICT_SUBSQRT_POWER_SAVING_PROVED=false' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'ROADMAP_MODIFIED_BY_4DG=false' "$f"
          grep -Fq 'NEXT=Stage14-4dh' "$f"

      - name: Diff check
        run: git diff --check origin/main...HEAD
