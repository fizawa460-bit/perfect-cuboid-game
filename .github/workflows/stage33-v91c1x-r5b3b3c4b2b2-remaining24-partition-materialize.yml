name: Stage33 V91C1X C4B2B2 remaining24 strict-prime partition materialize

on:
  push:
    branches:
      - stage33-v91c1x-r5b3b3c4b1e-1757-refinement-unit-preflight
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b2b2-remaining24-partition-materialize.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b2b2_remaining24_strict_prime_squareclass_partition.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c1-offboundary-norm-factorization.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c2c-orbit-representative-strict-prime-decomposition-and-transport.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4a-tame-residue-parity-and-cross-carrier-preflight.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2a-strict-prime-cross-carrier-geometric-incidence.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b1-explicit-a1-boundary-residue-field-squareclass.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact C4B2B2 remaining24 partition
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b2b2_remaining24_strict_prime_squareclass_partition.py --write
      - name: Enforce artifact-only bounded delta
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b2-remaining24-strict-prime-squareclass-partition.json'
          changed="$(git status --porcelain | sed 's/^...//')"
          test -n "$changed"
          test "$changed" = "$artifact"
          git diff --check
      - name: Commit generated certificate
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b2-remaining24-strict-prime-squareclass-partition.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$artifact"
          git diff --cached --quiet || git commit -m '[Stage33] materialize C4B2B2 remaining24 strict-prime partition artifact'
          git push
