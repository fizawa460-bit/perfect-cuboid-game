name: Stage35-EX Goal4AJ numerator degree31 second prime gen20

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage35-ex/runkeys/goal4aj-numerator-degree31-second-prime-gen20.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          KEY='stages/stage35-ex/runkeys/goal4aj-numerator-degree31-second-prime-gen20.json'
          SCRIPT='stages/stage35-ex/diagnose_stage35_ex_35_goal4aj_numerator_degree31_second_prime_gen20.py'
          EXPECTED_SCRIPT_BLOB='9277f2345d74a02016967f5a241385e7f540fad2'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test "$EVENT" = 'pull_request' || exit 0
          test "$ACTION" = 'synchronize' || exit 0
          test "$PR_NUMBER" = '1698' || exit 0
          test "$HEAD_BRANCH" = 'stage35-ex-goal4aj-degree19-truncated-kernel' || exit 0
          test "$BASE_BRANCH" = 'main' || exit 0
          test -n "$BEFORE" || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || exit 0
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          test "$(git diff --name-only "$BEFORE" "$HEAD" | wc -l)" -eq 1 || exit 0
          git diff --name-only "$BEFORE" "$HEAD" | grep -Fxq "$KEY" || exit 0
          if git cat-file -e "$BEFORE:$KEY" 2>/dev/null; then exit 0; fi
          test "$(git hash-object "$SCRIPT")" = "$EXPECTED_SCRIPT_BLOB" || exit 0
          python - "$KEY" <<'PY'
          import json,sys
          k=json.loads(open(sys.argv[1],encoding='utf-8').read())
          assert k['schema']=='STAGE35_EX_GOAL4AJ_NUMERATOR_DEGREE31_SECOND_PRIME_GEN20_RUNKEY_V1'
          assert k['generation']==1 and k['armed'] is True
          assert k['observed_current_main_sha']=='d5545b32e6b3088bca53318998d434f2745b03e9'
          assert k['branch_merge_base_sha']=='1d7bfd98ef8eab7bd849fe7bfdbcdaf5c0b575e7'
          assert k['script_blob_sha1']=='9277f2345d74a02016967f5a241385e7f540fad2'
          assert k['gen19_run']==34186299860 and k['gen19_job']==101935224637
          assert k['gen19_canonical_sha256']=='b01efb62377c5a629e24e7a2006f256610054e238f663a9d184f9626b3a33afd'
          assert k['gen19_route']=='ONE_PRIME_RATIONAL_RECONSTRUCTION_COMPLETE_BUT_FIRST_STRICT_EXACT_FAIL'
          assert k['second_prime']==32057 and k['degree']==31
          assert k['planned_jobs']==1 and k['artifact_upload'] is False
          PY
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  diagnose:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Singular
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends singular
          Singular --version | head -n 3
      - name: Replay strict kernel at independent second prime
        run: |
          set -euo pipefail
          python -u -B stages/stage35-ex/diagnose_stage35_ex_35_goal4aj_numerator_degree31_second_prime_gen20.py | tee /tmp/goal4aj-num31-second-prime-gen20.log
          grep -q '^GOAL4AJ_NUM31_SECOND_PRIME_GEN20_JSON=' /tmp/goal4aj-num31-second-prime-gen20.log
          grep -q '^GOAL4AJ_NUM31_SECOND_PRIME_GEN20=DONE$' /tmp/goal4aj-num31-second-prime-gen20.log
          test "$(wc -c </tmp/goal4aj-num31-second-prime-gen20.log)" -le 65536
