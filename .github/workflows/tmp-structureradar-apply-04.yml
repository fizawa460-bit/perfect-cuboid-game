name: Temporary StructureRadar apply batch 04

on:
  push:
    branches:
      - structureradar/recent-stage26-plus-04

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply census decisions
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('.')
          radar = root / 'docs/structure-radar'
          progress_path = radar / 'progress.json'
          registry_path = radar / 'structure-registry.json'
          progress = json.loads(progress_path.read_text())
          registry = json.loads(registry_path.read_text())

          batch_id = 'SR-BATCH-RECENT_STAGE26_PLUS-04-R01'
          reviews = progress.setdefault('source_reviews', {})

          decisions = {
              'SRC-184E6C818E09': ('stages/stage27/27-20-r302d-f/audit.md', 'DUPLICATE_SOURCE', None),
              'SRC-703BAC0CFA37': ('stages/stage27/27-20-r302d-f/batch-registry.json', 'DUPLICATE_SOURCE', None),
              'SRC-EBA5AE9CCC85': ('stages/stage27/27-20-r302d-f/controller-sync-delta.json', 'DUPLICATE_SOURCE', None),
              'SRC-A69A2015AEEA': ('stages/stage27/27-20-r302g-i/audit.md', 'DUPLICATE_SOURCE', None),
              'SRC-5842D0300959': ('stages/stage27/27-20-r302g-i/batch-registry.json', 'DUPLICATE_SOURCE', None),
              'SRC-89808B528C67': ('stages/stage27/27-20-r302g-i/controller-sync-delta.json', 'DUPLICATE_SOURCE', None),
              'SRC-D05FFE806FAA': ('stages/stage27/27-20-r302g/result.md', 'STRUCTURES_RECORDED', ['SR-STR-138']),
              'SRC-57AF4F81D846': ('stages/stage27/27-20-r302h/result.md', 'STRUCTURES_RECORDED', ['SR-STR-139']),
              'SRC-73421CDA5357': ('stages/stage27/27-20-r302i/result.md', 'STRUCTURES_RECORDED', ['SR-STR-140']),
              'SRC-F7CB4498F3B6': ('stages/stage27/27-r401a/audit.md', 'DUPLICATE_SOURCE', None),
              'SRC-DC0391818F4D': ('stages/stage27/27-r401a/critical-wall-registry.json', 'DUPLICATE_SOURCE', None),
              'SRC-556201056A53': ('stages/stage27/27-r401a/result.md', 'STRUCTURES_RECORDED', ['SR-STR-119', 'SR-STR-120', 'SR-STR-124']),
              'SRC-1229F5FE942F': ('stages/stage27/27-r401a/terminal-gate-audit.md', 'DUPLICATE_SOURCE', None),
          }

          def fp(path):
              return hashlib.sha256((root / path).read_bytes()).hexdigest()

          for source_id, (path, status, structure_ids) in decisions.items():
              row = {'fingerprint': fp(path), 'status': status, 'batch_id': batch_id}
              if structure_ids:
                  row['structure_ids'] = structure_ids
              reviews[source_id] = row

          cards = {c['structure_id']: c for c in registry['structures']}

          def add_prov(card_id, source_id, path, locator):
              prov = {
                  'source_id': source_id,
                  'path': path,
                  'locator': locator,
                  'fingerprint': fp(path),
              }
              card = cards[card_id]
              if not any(p.get('source_id') == source_id and p.get('locator') == locator for p in card['repo_provenance']):
                  card['repo_provenance'].append(prov)

          add_prov('SR-STR-138', 'SRC-D05FFE806FAA', 'stages/stage27/27-20-r302g/result.md', 'Physical occupancy ratio and same-measure wall deficit normalization')
          add_prov('SR-STR-119', 'SRC-556201056A53', 'stages/stage27/27-r401a/result.md', 'Fixed-width localization')
          add_prov('SR-STR-120', 'SRC-556201056A53', 'stages/stage27/27-r401a/result.md', 'Exact critical wall')
          add_prov('SR-STR-124', 'SRC-556201056A53', 'stages/stage27/27-r401a/result.md', 'Exact next theorem contract')

          new_cards = [
              {
                  'structure_id': 'SR-STR-139',
                  'canonical_math_name': 'Same-measure physical occupancy L1/L2/exceptional-tail equivalence',
                  'exact_equations_or_object': 'On MAIN physical fibers, mu_x=H_x/H and rho_x=F_x/H_x in [0,1]. A fixed-power deficit in sum mu_x rho_x, sum mu_x rho_x^2, or the weighted tail mu{rho_x>B^-alpha} is equivalent up to constant exponent loss by Cauchy, rho^2<=rho, splitting, and Markov.',
                  'search_terms_primary': ['weighted occupancy L1 L2 exceptional-tail equivalence', 'same-measure exceptional-mass moment comparison'],
                  'search_terms_aliases': ['MAIN physical occupancy moment equivalence', 'high-occupancy tail versus weighted moments'],
                  'theorem_species': ['moment comparison', 'exceptional-set equivalence', 'same-measure counting lemma'],
                  'repo_provenance': [{
                      'source_id': 'SRC-57AF4F81D846',
                      'path': 'stages/stage27/27-20-r302h/result.md',
                      'locator': 'Fixed-power L1, L2, and exceptional-tail forms',
                      'fingerprint': fp('stages/stage27/27-20-r302h/result.md'),
                  }],
                  'target_populations': ['the fixed-width critical wall subpopulation of the Stage27 MAIN physical host'],
                  'potential_weapon_types': ['COUNTING_LEMMA', 'MEASURE_ADAPTER'],
                  'applicability_gaps': ['The equivalence creates no fixed-power saving by itself; an arithmetic occupancy or host-mass estimate is still required.'],
                  'existing_radar_overlap': ['SR-STR-138'],
                  'search_status': 'NOT_SEARCHED',
                  'arsenal_decision': 'PENDING',
                  'card_status': 'SUBMITTED_FOR_AUDIT',
              },
              {
                  'structure_id': 'SR-STR-140',
                  'canonical_math_name': 'Uniform high-occupancy physical-mass deficit gate on the MAIN wall slab',
                  'exact_equations_or_object': 'For fixed eta0, alpha,beta>0, with E_alpha={(P,U):F_MAIN(P,U;B)>B^-alpha H_phys^MAIN(P,U;B)}, the missing theorem is sum_{E_alpha} H_phys^MAIN << B^-beta+o(1) sum_{P,U} H_phys^MAIN. It would imply a strict wall power deficit; no such alpha,beta are proved.',
                  'search_terms_primary': ['weighted high-occupancy exceptional mass arithmetic fibers', 'uniform wall slab physical host mass deficit'],
                  'search_terms_aliases': ['UniformWallSlabMAINHighOccupancyPhysicalMassDeficit', 'MAIN high-occupancy physical-mass gate'],
                  'theorem_species': ['weighted exceptional-set theorem', 'upper-bound gate', 'physical-measure large-deviation estimate'],
                  'repo_provenance': [{
                      'source_id': 'SRC-73421CDA5357',
                      'path': 'stages/stage27/27-20-r302i/result.md',
                      'locator': 'UniformWallSlabMAINHighOccupancyPhysicalMassDeficit',
                      'fingerprint': fp('stages/stage27/27-20-r302i/result.md'),
                  }],
                  'target_populations': ['the fixed-width critical wall subpopulation of the Stage27 MAIN physical host'],
                  'potential_weapon_types': ['EXTERNAL_GATE', 'UPPER_BOUND_GATE'],
                  'applicability_gaps': ['No fixed alpha,beta are proved; the estimate must use the same MAIN physical-host measure, and the already-charged row CRT product modulus cannot be reused as a new saving.'],
                  'existing_radar_overlap': ['SR-STR-138', 'SR-STR-139'],
                  'search_status': 'NOT_SEARCHED',
                  'arsenal_decision': 'PENDING',
                  'card_status': 'SUBMITTED_FOR_AUDIT',
              },
          ]
          for card in new_cards:
              if card['structure_id'] not in cards:
                  registry['structures'].append(card)
                  cards[card['structure_id']] = card

          registry['status'] = 'BATCH_SUBMITTED_FOR_AUDIT'
          batches = progress.setdefault('audit_batches', [])
          batches[:] = [b for b in batches if b.get('batch_id') != batch_id]
          batches.append({
              'batch_id': batch_id,
              'task_id': 'SR-CENSUS-RECENT_STAGE26_PLUS-01',
              'status': 'SUBMITTED_FOR_AUDIT',
              'source_ids': list(decisions),
              'sources_reviewed': len(decisions),
              'structures_added': 2,
              'structures_updated': 4,
              'structures_deduped': 9,
              'searches_completed': 0,
              'arsenal_decisions': 0,
              'audit_required': True,
          })

          progress_path.write_text(json.dumps(progress, indent=2, ensure_ascii=False) + '\n')
          registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
      - name: Commit batch and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-structureradar-apply-04.yml
          git add docs/structure-radar
          git diff --check --cached
          git commit -m "StructureRadar: census recent Stage26 plus batch 4"
          git push
