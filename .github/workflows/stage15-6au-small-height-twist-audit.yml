name: Stage15-6au small-height twist audit

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6au/**'
      - 'stages/stage15/evidence/stage15_6au_small_height_twist_audit.json'
      - 'stages/stage15/replay/verify_stage15_6au.py'
      - 'stages/stage15/scripts/stage15_6au_small_height_twist_audit.py'
      - '.github/workflows/stage15-6au-small-height-twist-audit.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6au theorem audit
        run: python stages/stage15/replay/verify_stage15_6au.py
      - name: Compile Stage15-6au utility
        run: python -m py_compile stages/stage15/scripts/stage15_6au_small_height_twist_audit.py stages/stage15/replay/verify_stage15_6au.py
