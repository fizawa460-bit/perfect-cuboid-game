name: Stage14-4al collective first-hit audit

on:
  pull_request:
    paths:
      - 'stages/stage14/scripts/14-4/collective_first_hit_audit.py'
      - 'stages/stage14/data/14-4/collective_first_hit_audit.json'
      - 'stages/stage14/archive/stage14-4al-*'
      - 'stages/stage14/main.md'
      - 'stages/stage14/README.md'
      - 'stages/stage14/roadmap.md'
      - '.github/workflows/stage14-4al-collective-first-hit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PARI/GP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pari-gp
      - name: Run collective first-hit audit
        run: python stages/stage14/scripts/14-4/collective_first_hit_audit.py
      - name: Validate Stage14-4al boundary
        run: |
          python - <<'PY'
          import json
          p='stages/stage14/data/14-4/collective_first_hit_audit.json'
          d=json.load(open(p))
          assert d['metadata']['active_vertices_at_max']==490
          assert d['profile'][-1]['active_vertices_V']==490
          assert d['decision']['COLLECTIVE_FIRST_HIT_IDENTITY_LOCKED'] is True
          assert d['decision']['SQRTB_EQUIVALENT_TO_INVERSE_SQRT_ACTIVATION_DENSITY'] is True
          assert d['decision']['FIXED_CURVE_MECHANISM_REOPENED'] is False
          assert d['decision']['POSITIVE_RANK_DENSITY_PROVED'] is False
          assert d['decision']['UNIFORM_FIRST_SMALL_POINT_LOWER_TAIL_PROVED'] is False
          assert d['decision']['ACTIVE_VERTEX_SQRT_B_ASYMPTOTIC_PROVED'] is False
          print(json.dumps(d['late_diagnostics'],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage14-4al-collective-first-hit
          path: |
            stages/stage14/data/14-4/collective_first_hit_audit.json
            stages/stage14/data/14-s4a/active_fingerprint_census.json
