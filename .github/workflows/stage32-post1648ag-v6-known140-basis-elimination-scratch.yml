name: Stage32 scratch post1648ag V6 known140 basis elimination

on:
  push:
    branches:
      - stage32-scratch-post1648ag-v6-known140-basis-elimination
    paths:
      - '.github/workflows/stage32-post1648ag-v6-known140-basis-elimination-scratch.yml'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_post1648ag_v6_known140_basis_elimination.py'

permissions:
  contents: write

concurrency:
  group: stage32-post1648ag-v6-known140-basis-elimination-scratch
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact scratch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact locked dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.4.0' 'scipy==1.15.3' 'numpy==2.2.6'
      - name: Run basis-eliminated diagnostic
        run: python stages/stage32/residual-32-01-production/diagnose_stage32_post1648ag_v6_known140_basis_elimination.py
      - name: Commit scratch result only
        run: |
          RESULT=stages/stage32/residual-32-01-production/post1648ag-v6-known140-basis-elimination.json
          test -f "$RESULT"
          git add "$RESULT"
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage32 scratch AG: fix exact basis-eliminated V6 result'
          git push origin HEAD:${{ github.ref_name }}
