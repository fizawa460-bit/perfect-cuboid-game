name: Stage25-60 R504 exceptional Prym gate audit

on:
  pull_request:
    paths:
      - 'stages/stage25/25-60/r504-full-split-prym-external-gate.md'
      - 'stages/stage25/25-60/r504-full-split-prym-external-gate-audit.py'
      - 'stages/stage25/25-60/r504-full-split-prym-external-gate-discovery-ledger.md'
      - 'stages/stage25/25-60/r504-exceptional-search-controller.json'
      - '.github/workflows/stage25-60-r504-prym-external-gate.yml'
  workflow_dispatch:

jobs:
  exceptional-prym-gate-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify finite-field exceptional Prym sieve
        run: python stages/stage25/25-60/r504-full-split-prym-external-gate-audit.py
