name: Stage32 Reynolds rank2 integral projection bound

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - 'stages/stage32/residual-32-01-production/direct_picard_reynolds_rank2_integral_projection_bound.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_reynolds_lattice_diagnostic.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_orbit_sum_qp_bound.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_slice_stabilizer_orbit_bound.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_slice_bridge.py'
      - 'stages/stage32/residual-32-01-production/hperp_integral_adapter.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - '.github/workflows/stage32-direct-picard-reynolds-rank2-integral-projection-bound.yml'

permissions:
  contents: read

jobs:
  rank2-integral-projection-bound:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Certify exact rank2 Reynolds integral projection bound
        run: |
          python stages/stage32/residual-32-01-production/direct_picard_reynolds_rank2_integral_projection_bound.py \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --output direct-picard-reynolds-rank2-integral-projection-bound.json
      - name: Upload compact rank2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-direct-picard-reynolds-rank2-integral-projection-bound
          path: direct-picard-reynolds-rank2-integral-projection-bound.json
          retention-days: 7
          compression-level: 9
