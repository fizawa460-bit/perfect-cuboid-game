name: Stage33-07 non-elementary k1 k2 Q4 exact 2Q profile fast

on:
  push:
    branches:
      - stage33-07-k12-2q-profile-fast-scout
    paths:
      - 'stages/stage33/33-07/**'
      - '.github/workflows/stage33-07-nonelementary-k12-q4-2q-profile-fast.yml'
  workflow_dispatch:

concurrency:
  group: stage33-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact structural predecessor files
        working-directory: stages/stage33/33-07
        run: |
          python certify_nonelementary_target_q4_rank_obstruction.py
          python certify_nonelementary_target_q8_exponent_reduction.py
          python certify_nonelementary_k12_q2_support_reduction.py
          python certify_nonelementary_k12_2q_support_reduction.py
      - name: Formally certify retained-Q4 exact 2Q profile filter
        working-directory: stages/stage33/33-07
        run: python certify_nonelementary_k12_q4_2q_exact_profile_fast.py
      - name: Enforce exact census and conservative firewall
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import json
          x=json.load(open('nonelementary-k12-q4-2q-exact-profile-certified.json'))
          assert x['schema']=='STAGE33_07_NONELEMENTARY_K12_Q4_2Q_EXACT_PROFILE_CERT_V1'
          assert x['source_exact_2Q_scout_sha256']=='bf083cf26236e49f6596bd0ccb8b63e50a8734a70418a4064f100eada758456d'
          assert x['source_Q4_survivor_bitsets_sha256']=='d4a96195628a12f1b69da4a1ed82b5cf638b29dbff304b9ce2083a875ee49471'
          assert x['source_formal_Q4_certificate_sha256']=='cc7350ecd3a5f7d1c3eca0b96649df0fb1219283190f806ec1e537d28cbd4b19'
          assert x['source_endpoint_finite_q_sha256']=='4ca7567205455175a5f9bef7a74bc9ec31cd68f831aec60aa88a637b5c0cfdf0'
          assert x['endpoint_2Q_profile_mod16']=={'0':8192,'8':8192} and x['section_independent']
          assert x['k1']['Q4_surviving_skeleton_orbits']==3187 and x['k1']['skeleton_orbits_matching_exact_2Q_profile']==2227
          assert x['k1']['Q4_surviving_H']==2012416 and x['k1']['weighted_H_matching_exact_2Q_profile']==1493632
          assert x['k1']['weighted_H_rejected_by_exact_2Q_profile']==518784
          assert x['k2']['Q4_surviving_skeleton_orbits']==294 and x['k2']['skeleton_orbits_matching_exact_2Q_profile']==294
          assert x['k2']['Q4_surviving_H']==8867840 and x['k2']['weighted_H_matching_exact_2Q_profile']==8867840
          assert x['combined_skeleton_orbits_matching_exact_2Q_profile']==2521
          assert x['combined_H_matching_exact_2Q_profile']==10361472 and x['combined_H_rejected_by_exact_2Q_profile']==518784
          assert x['exact_2Q_profile_certified'] and not x['planning_only']
          assert not x['endpoint_finite_q_certified'] and not x['endpoint_full_action_certified']
          assert not x['actual_index512_glue_identified'] and not x['arithmetic_HS_closed']
          assert x['stage33_progress']=='6/11' and not x['stage33_08_released'] and not x['stage33_09_released']
          assert not x['theorem_credit'] and not x['endpoint_credit'] and not x['perfect_cuboid_nonexistence_claim']
          print('K12_Q4_2Q_PROFILE_FAST=PASS_EXACT_CERTIFIED')
          print('SURVIVING_SKELETON_ORBITS=2521')
          print('SURVIVING_H=10361472')
          print('CERT_SHA256='+x['canonical_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-k12-q4-2q-exact-profile-certified
          path: stages/stage33/33-07/nonelementary-k12-q4-2q-exact-profile-certified.json
          retention-days: 5
