name: Stage32 scratch post1648V retained target theta normalization

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  retained-target-theta-normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify retained target theta normalization circularity
        run: python3 -B stages/stage32/residual-32-01-production/verify_stage32_post1648v_retained_target_theta_normalization_circularity.py
      - name: Diff check
        run: git diff --check
