name: StructureRadar search23 finalize
on: pull_request
permissions: {contents: write}
jobs:
  finalize:
    if: github.head_ref == 'structure-radar-search-23-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - run: |
          python - <<'PY'
          import json, pathlib
          ids=['SR-STR-220','SR-STR-221','SR-STR-224','SR-STR-225','SR-STR-226','SR-STR-227','SR-STR-228']
          ledger='docs/structure-radar/literature/SR-SEARCH-23.md'
          rp='docs/structure-radar/structure-registry.json'
          r=json.load(open(rp)); cards=[]
          for c in r['structures']:
            if c['structure_id'] in ids:
              assert c['search_status'] in {'NOT_SEARCHED','NEEDS_REFRESH'} and c['arsenal_decision']=='PENDING'
              cards.append(c)
              c['search_status']='SEARCHED'; c['arsenal_decision']='ACTIVE'; c['search_ledger']=ledger
          assert [c['structure_id'] for c in cards]==ids, [c['structure_id'] for c in cards]
          open(rp,'w').write(json.dumps(r,indent=2,ensure_ascii=False)+'\n')

          z=['# StructureRadar literature ledger — search batch 23','',
             'SEARCH_TASK=SR-SEARCH-01','BATCH_ID=SR-BATCH-LITERATURE_SEARCH-23-R01','SEARCH_DATE=2026-08-19',
             'STRUCTURES='+','.join(ids),'SEARCH_BATCH_SIZE=7','TERMINAL_TAIL=true','NOVELTY_BY_SEARCH_ABSENCE=false','',
             '## Primary-source literature checked',
             '- Régis de la Bretèche and Gérald Tenenbaum, *Remarks on the Selberg--Delange method*, arXiv:2010.12929. This is the general finite-order Selberg--Delange method carrier adjacent to SR-STR-226 and the divisor-average step in SR-STR-228; it does not by itself identify the repo primitive orientation constants, exactly-one projection, or directional chamber weights.',
             '- Ping Xi, *Bilinear forms with trace functions over arbitrary sets, and applications to Sato-Tate*, arXiv:2211.14702. Sparse-support trace-function bilinear bounds are adjacent to SR-STR-225, but the repo receiver is a signed physical mass-vector Rayleigh/vertical TT* statement with correlated reconstruction masks; arbitrary-set bilinear control is not promoted to that stronger exact receiver.',
             '- Étienne Fouvry, Emmanuel Kowalski, Philippe Michel, *Algebraic trace functions over the primes*, arXiv:1211.6043. General trace-function cancellation is relevant context for SR-STR-220/225, but it does not override the exact torus-quotient fiber identities or the physical signed-selector quantifier.',
             '- Kevin Ford, *The distribution of integers with a divisor in a given interval*, arXiv:math/0401223. Divisor-window technology is adjacent to the fixed-R hyperbolic boundary problem in SR-STR-224; the repo still needs an actual fixed-power count of physical outer support or a boundary-factorization saving.',
             '- D. R. Heath-Brown, *The square sieve and consecutive square-free numbers*, Math. Ann. 266 (1984), 251–259. The square-sieve method is adjacent to the shared-squareclass detector in SR-STR-220/221; it does not make higher-cell quotient fibers independent or license multiplication of alternative same-set savings.','',
             '## Search outcome',
             '- SR-STR-220: retain the exact torus-quotient no-compounding barrier. General square-sieve/trace-function theory does not break the fiber identities or create independent higher-cell savings.',
             '- SR-STR-221: retain the short-denominator square-part versus two-cell minimum receiver. The two complete bounds act on the same restricted set and are combined by minimum, not product; the historical 10/11 ceiling remains superseded provenance.',
             '- SR-STR-224: Ford-type divisor-window estimates are adjacent, but the fixed-R accumulated hyperbolic boundary still contributes full R^(1+o(1)) scale until the physical outer-support or boundary theorem is supplied.',
             '- SR-STR-225: sparse-set trace-function literature is adjacent only. The minimal legal target remains the signed physical mass-vector Rayleigh / vertical TT* defect; polar/Schatten or arbitrary-support operator substitution is not promoted.',
             '- SR-STR-226: finite-order Selberg--Delange is the external analytic method carrier for the primitive oriented one-face incidence asymptotic. The exact constant and orientation/distinguished-face interpretation remain the repo theorem statement.',
             '- SR-STR-227: the canonical exactly-one directional chamber law is a repo projection/Archimedean adapter built on the Stage12 arithmetic population and lower-order overlap control; no separate external theorem is substituted for the chamber vector.',
             '- SR-STR-228: Selberg--Delange/divisor-average technology supports the lower-order fixed-edge overlap input, but the unrestricted-space B^2 log B host is kept strictly separate from integral-space populations and from the true Euler-brick exponent.','']
          verdicts={
            'SR-STR-220':'`REPO_TORUS_QUOTIENT_NO_COMPOUNDING_BARRIER` — higher-cell detectors factor through the same effective quotient; no independent saving is charged.',
            'SR-STR-221':'`REPO_MIN_ENVELOPE_UNBALANCED_RECEIVER` — square-part sparsity and two-cell saving are alternative complete bounds on one set and combine by minimum.',
            'SR-STR-224':'`ADJACENT_DIVISOR_WINDOW_WITH_FIXED_R_BOUNDARY_GATE` — divisor-window theory does not remove the accumulated physical hyperbolic boundary.',
            'SR-STR-225':'`ADJACENT_TRACE_BILINEAR_WITH_SIGNED_PHYSICAL_RAYLEIGH_GATE` — sparse trace cancellation does not replace the exact signed mass-vector Rayleigh/TT* receiver.',
            'SR-STR-226':'`DIRECT_SELBERG_DELANGE_METHOD_CARRIER_WITH_ORIENTATION_ADAPTER` — the analytic method is external; primitive orientation constants and exactly-one projection remain repo-specific.',
            'SR-STR-227':'`REPO_DIRECTIONAL_CHAMBER_PROJECTION` — the non-2:1:1 limit vector is retained as the canonical Stage13 projection, not inferred from generic angular equidistribution.',
            'SR-STR-228':'`ADJACENT_SELBERG_DELANGE_DIVISOR_INPUT_WITH_EULER_SPACE_FIREWALL` — the unrestricted-space one-face asymptotic and overlap thinning do not transfer to integral-space or Euler-brick exponents.'}
          for c in cards:
            z += ['## '+c['structure_id']+' — '+c['canonical_math_name'],
                  c['exact_equations_or_object'],
                  'Potential weapon types: '+', '.join(c.get('potential_weapon_types',[]))+'.',
                  'Applicability gaps: '+'; '.join(c.get('applicability_gaps',[])),
                  'Transfer verdict: '+verdicts[c['structure_id']],
                  'Arsenal decision: `ACTIVE`.','']
          z += ['## Firewalls',
                '- Search absence is not a novelty claim.',
                '- Higher-cell squareclass fibers and alternative same-set bounds are not multiplied as independent savings.',
                '- Fixed-R divisor-window and hyperbolic boundary estimates remain conditioned on the exact physical diagonal and support measure.',
                '- Signed Kummer/Rayleigh receivers are not replaced by polar/Schatten or arbitrary-support operator bounds.',
                '- Primitive oriented incidence, canonical exactly-one, and unrestricted-space Euler-side populations remain distinct counting measures.',
                '- CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT remains 1/2; STRICT_SUBSQRT_POWER_SAVING_PROVED=false.',
                '- No perfect-cuboid existence or nonexistence claim is made.','']
          pathlib.Path(ledger).write_text('\n'.join(z))

          pp='docs/structure-radar/progress.json'; p=json.load(open(pp)); bid='SR-BATCH-LITERATURE_SEARCH-23-R01'
          assert not any(x.get('batch_id')==bid for x in p['audit_batches'])
          p['audit_batches'].append({'batch_id':bid,'task_id':'SR-SEARCH-01','status':'SUBMITTED_FOR_AUDIT','source_ids':[],'sources_reviewed':5,'structures_added':0,'structures_updated':7,'structure_carrier_sources':1,'structures_deduped':0,'searches_completed':7,'arsenal_decisions':7,'audit_required':True,'duplicate_source':0,'no_distinct_structure':0})
          open(pp,'w').write(json.dumps(p,indent=2,ensure_ascii=False)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python - <<'PY'
          import json
          c=json.load(open('docs/structure-radar/controller.json'))
          assert c['registry']['unresolved_search_count']==0, c['registry']
          assert c['registry']['pending_arsenal_decision_count']==19, c['registry']
          q=json.load(open('docs/structure-radar/exploration-queue.json'))
          print('POST_QUEUE',json.dumps(q,ensure_ascii=False))
          print('POST_CONTROLLER',json.dumps(c,ensure_ascii=False))
          PY
          rm .github/workflows/structure-radar-search23-finalize.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A && git commit -m 'StructureRadar: literature search batch23 terminal tail' && git push
