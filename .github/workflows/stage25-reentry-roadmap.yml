name: Stage25 reentry roadmap contract

on:
  pull_request:
    paths:
      - 'docs/stage25-reentry-roadmap.md'
      - 'docs/stage25-reentry-operations.md'
      - 'stages/stage25/25-reentry-controller.json'
      - 'stages/stage25/scripts/verify_25_reentry_controller.py'
      - '.github/workflows/stage25-reentry-roadmap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python stages/stage25/scripts/verify_25_reentry_controller.py
