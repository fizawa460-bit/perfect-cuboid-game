name: Stage14-4cp three-quarter root-line promotion
on:
  pull_request:
    paths:
      - 'stages/stage14/14-4cp/**'
      - 'stages/stage14/scripts/14-4/three_quarter_rootline_promotion_audit.py'
      - 'stages/stage14/data/14-4/three_quarter_rootline_promotion_summary.json'
      - '.github/workflows/stage14-4cp-three-quarter-rootline.yml'
      - 'stages/stage14/14-s7-29/**'
      - 'stages/stage14/14-X6/**'
      - 'stages/stage14/14-4co/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Stage14-4cp audit
        run: python stages/stage14/scripts/14-4/three_quarter_rootline_promotion_audit.py
      - name: Run s7-29 predecessor regression
        run: python stages/stage14/scripts/14-s7-29/common_core_primitive_root_line_audit.py
      - name: Run X6 predecessor regression
        run: python stages/stage14/scripts/14-X6/singular_elimination_four_root_crt_audit.py
      - name: Lock Stage14-4cp theorem boundary
        run: |
          f=stages/stage14/14-4cp/result.md
          grep -Fq 'STAGE14_4CP=COMPLETE_THREE_QUARTER_PROMOTION_SINGULAR_ELIMINATION_AND_QUARTER_PHI_ROOTLINE_REDUCTION' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=3/4' "$f"
          grep -Fq 'IMPROVEMENT_OVER_PREVIOUS_7_8=1/8' "$f"
          grep -Fq 'NEW_WHOLE_FAMILY_POWER_SAVING_PROVED=true' "$f"
          grep -Fq 'THREE_QUARTER_SATURATION_REQUIRES_PHI=1/4' "$f"
          grep -Fq 'TOP_THETA_LAMBDA4_SINGULAR_BRANCH_EMPTY=true' "$f"
          grep -Fq 'SELF_GENERATED_FOUR_ROOT_MODULI_CHARGED_AS_INDEPENDENT_SPACING=false' "$f"
          grep -Fq 'REMAINING_RECEIVER=QuarterPhiCommonCorePrimitiveFourRootQuadraticValueEnergy' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-4cq' "$f"
