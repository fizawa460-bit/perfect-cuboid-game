name: Stage14-s-batch s7-81..83 radial support dilation

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-81/**'
      - 'stages/stage14/14-s7-82/**'
      - 'stages/stage14/14-s7-83/**'
      - 'stages/stage14/14-s-batch/s7-81-83-report.md'
      - 'stages/stage14/scripts/14-s-batch/s7_81_83_radial_support_dilation_audit.py'
      - '.github/workflows/stage14-s-batch-s7-81-83-radial-support-dilation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Batch deterministic audit
        run: python stages/stage14/scripts/14-s-batch/s7_81_83_radial_support_dilation_audit.py

      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/14-s-batch/s7_81_83_radial_support_dilation_audit.py

      - name: Regress merged s7-78..80
        run: python stages/stage14/scripts/14-s-batch/s7_78_80_heavy_ray_reverse_incidence_audit.py

      - name: Regress merged mainline 4eq..4eu
        run: python stages/stage14/scripts/14-4/batch_4eq_4eu_radial_diffuse_audit.py

      - name: Regress merged Work-boX27
        run: python stages/stage14/scripts/14-Work-boX27/polynomial_outer_mobility_audit.py

      - name: Lock integrated sH batch contract
        run: |
          grep -Fq 'STAGE14_S_BATCH_INTEGRATES_NEW_SH=true' docs/stage14-s-batch-task-contract.md
          grep -Fq 'STAGE14_S_BATCH_H_COUNTS_AS_WORK_UNIT=true' docs/stage14-s-batch-task-contract.md

      - name: Lock batch boundary
        run: |
          grep -Fq 'STAGE14_S7_81=COMPLETE_HEAVY_RAY_RADIAL_SUPPORT_CAPACITY_AND_PRIMITIVE_RAY_HEIGHT_GAP' stages/stage14/14-s7-81/result.md
          grep -Fq 'HEAVY_RAY_POLYNOMIAL_MASS_FORCES_POLYNOMIAL_RADIAL_CAPACITY=true' stages/stage14/14-s7-81/result.md
          grep -Fq 'STAGE14_S7_82=COMPLETE_HEAVY_RAY_RADIAL_SCALE_TO_EXACT_SQUARE_DILATE_SECOND_RECIPROCAL_PACKET' stages/stage14/14-s7-82/result.md
          grep -Fq 'HEAVY_RAY_SECOND_RECIPROCAL_SQUARE_DILATE_IDENTITY_EXACT=true' stages/stage14/14-s7-82/result.md
          grep -Fq 'STAGE14_S7_83=COMPLETE_HEAVY_RAY_RADIAL_SUPPORT_TO_SQUARE_DILATE_PHYSICAL_FACTOR_ACCEPTANCE_RECEIVER' stages/stage14/14-s7-83/result.md
          grep -Fq 'CURRENT_HEAVY_RAY_RECEIVER=FixedPrimitiveReciprocalRayPolynomialRadialSquareDilationPhysicalFactorSupport' stages/stage14/14-s7-83/result.md
          grep -Fq 'BATCH_SUBSTANTIVE_WORK_UNIT_COUNT=3' stages/stage14/14-s-batch/s7-81-83-report.md
          grep -Fq 'BATCH_INTEGRATED_H_UNITS=NONE' stages/stage14/14-s-batch/s7-81-83-report.md
          grep -Fq 'BATCH_STOP_REASON=receiver_change' stages/stage14/14-s-batch/s7-81-83-report.md
          grep -Fq 'NEXT=Stage14-s7-84' stages/stage14/14-s-batch/s7-81-83-report.md

      - name: Diff check
        run: git diff --check origin/main...HEAD
