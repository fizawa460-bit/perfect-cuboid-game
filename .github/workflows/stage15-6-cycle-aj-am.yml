name: Stage15-6 cycle aj-am

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6aj/**'
      - 'stages/stage15/15-6ak/**'
      - 'stages/stage15/15-6al/**'
      - 'stages/stage15/15-6am/**'
      - 'stages/stage15/15-6-cycle/**'
      - 'stages/stage15/evidence/stage15_6aj_height_bridge.json'
      - 'stages/stage15/evidence/stage15_6ak_outer_reconstruction.json'
      - 'stages/stage15/evidence/stage15_6al_coordinate_cells.json'
      - 'stages/stage15/evidence/stage15_6am_coordinate_core_split.json'
      - 'stages/stage15/replay/verify_stage15_6aj.py'
      - 'stages/stage15/replay/verify_stage15_6ak.py'
      - 'stages/stage15/replay/verify_stage15_6al.py'
      - 'stages/stage15/replay/verify_stage15_6am.py'
      - '.github/workflows/stage15-6-cycle-aj-am.yml'
  workflow_dispatch:

jobs:
  verify-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 6aj
        run: python stages/stage15/replay/verify_stage15_6aj.py
      - name: Verify 6ak
        run: python stages/stage15/replay/verify_stage15_6ak.py
      - name: Verify 6al
        run: python stages/stage15/replay/verify_stage15_6al.py
      - name: Verify 6am
        run: python stages/stage15/replay/verify_stage15_6am.py
