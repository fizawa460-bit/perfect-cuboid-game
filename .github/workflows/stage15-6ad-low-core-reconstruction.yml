name: Stage15-6ad low-core reconstruction

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6ad/**'
      - 'stages/stage15/evidence/stage15_6ad_reconstruction.json'
      - 'stages/stage15/replay/verify_stage15_6ad.py'
      - 'stages/stage15/scripts/stage15_6ad_low_core_reconstruction.py'
      - '.github/workflows/stage15-6ad-low-core-reconstruction.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6ad low-core reconstruction
        run: python stages/stage15/replay/verify_stage15_6ad.py
