name: Stage14-X7 Gaussian quotient resultant energy

on:
  pull_request:
    paths:
      - 'stages/stage14/14-X7/**'
      - 'stages/stage14/data/14-X7/**'
      - 'stages/stage14/scripts/14-X7/**'
      - '.github/workflows/stage14-X7-gaussian-quotient-resultant-energy.yml'
      - 'stages/stage14/14-X6/**'
      - 'stages/stage14/14-s7-29/**'
      - 'stages/stage14/14-4cp/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage14-X7 Gaussian quotient/resultant audit
        run: python stages/stage14/scripts/14-X7/gaussian_quotient_resultant_audit.py

      - name: Compile Stage14-X7 audit
        run: python -m py_compile stages/stage14/scripts/14-X7/gaussian_quotient_resultant_audit.py

      - name: Run merged Stage14-X6 regression
        run: python stages/stage14/scripts/14-X6/singular_elimination_four_root_crt_audit.py

      - name: Run merged Stage14-s7-29 regression
        run: python stages/stage14/scripts/14-s7-29/common_core_primitive_root_line_audit.py

      - name: Run merged Stage14-4cp regression
        run: python stages/stage14/scripts/14-4/three_quarter_rootline_promotion_audit.py

      - name: Lock predecessor boundaries
        run: |
          grep -Fq 'STAGE14_X6=COMPLETE_TOP_THETA_SINGULAR_ELIMINATION_AND_PRIMITIVE_FOUR_ROOT_CRT_REDUCTION' stages/stage14/14-X6/result.md
          grep -Fq 'STAGE14_S7_29=COMPLETE_COMMON_CORE_GAUSSIAN_ROOT_LINE_PRIMITIVE_LATTICE_COUNT_AND_3_4_BOUND' stages/stage14/14-s7-29/result.md
          grep -Fq 'STAGE14_4CP=COMPLETE_THREE_QUARTER_PROMOTION_SINGULAR_ELIMINATION_AND_QUARTER_PHI_ROOTLINE_REDUCTION' stages/stage14/14-4cp/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=3/4' stages/stage14/14-4cp/result.md
          grep -Fq 'SELF_GENERATED_FOUR_ROOT_MODULI_CHARGED_AS_INDEPENDENT_SPACING=false' stages/stage14/14-4cp/result.md

      - name: Lock Stage14-X7 theorem boundary
        run: |
          f=stages/stage14/14-X7/result.md
          grep -Fq 'STAGE14_X7=COMPLETE_SELF_GENERATED_FOUR_ROOT_UNCHARGING_AND_GAUSSIAN_QUOTIENT_RESULTANT_REDUCTION' "$f"
          grep -Fq 'MERGED_X6_IMPORTED=true' "$f"
          grep -Fq 'MERGED_S7_29_IMPORTED=true' "$f"
          grep -Fq 'MERGED_4CP_IMPORTED=true' "$f"
          grep -Fq 'MERGED_THREE_QUARTER_BOUND_IMPORTED=true' "$f"
          grep -Fq 'REAL_FOUR_ROOT_MASK_REDUCES_TO_TWO_LINEAR_VALUES=true' "$f"
          grep -Fq 'COMMON_CORE_ROOT_LINE_LIFTS_TO_GAUSSIAN_DIVISOR=true' "$f"
          grep -Fq 'COMMON_CORE_GAUSSIAN_QUOTIENT_DEFINED=true' "$f"
          grep -Fq 'TWISTED_FOUR_ROOT_MASK_REDUCES_TO_GAUSSIAN_QUOTIENT_NORM=true' "$f"
          grep -Fq 'XI_SWITCH_GOOD_SUPPORT_EQUALS_GAUSSIAN_QUOTIENT_NORM_SUPPORT=true' "$f"
          grep -Fq 'SECOND_DETERMINANT_SPACING_FROM_POINTWISE_FOUR_ROOT_DATA=false' "$f"
          grep -Fq 'FOUR_ROOT_CROSS_RESULTANT_DICTIONARY_PROVED=true' "$f"
          grep -Fq 'PRIVATE_GENERATED_PRIME_FORCES_CROSS_SPACING=false' "$f"
          grep -Fq 'REMAINING_RECEIVER=QuarterPhiCommonCoreLinearGaussianQuotientCrossResultantEnergy' "$f"
          grep -Fq 'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=3/4' "$f"
          grep -Fq 'X7_PROVES_ADDITIONAL_WHOLE_FAMILY_POWER_SAVING=false' "$f"
          grep -Fq 'X7_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'NEXT_RECOMMENDED=Stage14-X8' "$f"
