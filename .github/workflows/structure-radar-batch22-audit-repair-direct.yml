name: StructureRadar batch23 registered finalizer

on:
  pull_request:
    branches:
      - structure-radar-deep-corpus-batch-23

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'structure-radar-batch23-analysis-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-23
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize batch23
        run: |
          python scripts/.structure_radar_batch23_finalize.py
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/structure-radar/controller.json').read_text())
          assert c['corpus']['review_states'].get('CURRENT_REVIEWED')==1962
          assert c['corpus']['review_states'].get('NEW')==594
          assert c['registry']['structure_count']==225
          p=json.loads(Path('docs/structure-radar/progress.json').read_text())
          b=next(x for x in p['audit_batches'] if x['batch_id']=='SR-BATCH-STAGE14_15_DEEP_CORPUS-23-R01')
          assert b['structures_updated']==22 and b['structure_carrier_sources']==56 and b['no_distinct_structure']==4
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "StructureRadar census Stage14-15 deep corpus batch 23"
          git push origin HEAD:structure-radar-deep-corpus-batch-23
