name: Stage15-6ap kappa coupling

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6ap/**'
      - 'stages/stage15/evidence/stage15_6ap_kappa_coupling.json'
      - 'stages/stage15/replay/verify_stage15_6ap.py'
      - 'stages/stage15/scripts/stage15_6ap_kappa_coupling.py'
      - '.github/workflows/stage15-6ap-kappa-coupling.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6ap kappa coupling
        run: python stages/stage15/replay/verify_stage15_6ap.py
      - name: Compile Stage15-6ap utility
        run: python -m py_compile stages/stage15/scripts/stage15_6ap_kappa_coupling.py stages/stage15/replay/verify_stage15_6ap.py
