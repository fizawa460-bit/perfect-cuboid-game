name: Stage33-12 exact assembly

on:
  pull_request:
    paths:
      - 'stages/stage33/33-12/**'
      - 'stages/stage33/controller.json'
      - '.github/workflows/stage33-12-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage33-12-exact-assembly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-local-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay exact obstruction inventory
        run: |
          cp stages/stage33/33-12/boundary-function-scalar-descent-certificate.json /tmp/expected-boundary-scalars.json
          python stages/stage33/33-12/certify_boundary_function_scalar_descent.py
          cmp /tmp/expected-boundary-scalars.json stages/stage33/33-12/boundary-function-scalar-descent-certificate.json
          cp stages/stage33/33-12/full-surface-hs-adjustment-contract.json /tmp/expected-hs-adjustment.json
          python stages/stage33/33-12/certify_full_surface_hs_adjustment_contract.py
          cmp /tmp/expected-hs-adjustment.json stages/stage33/33-12/full-surface-hs-adjustment-contract.json
          cp stages/stage33/33-12/j2-full-surface-mu2-zero-defect-contract.json /tmp/expected-j2-mu2-zero-defect.json
          python stages/stage33/33-12/certify_j2_full_surface_mu2_zero_defect_contract.py
          cmp /tmp/expected-j2-mu2-zero-defect.json stages/stage33/33-12/j2-full-surface-mu2-zero-defect-contract.json
          cp stages/stage33/33-12/j2-kc-coordinate-ambiguity-reduction.json /tmp/expected-j2-kc-ambiguity.json
          python stages/stage33/33-12/certify_j2_kc_coordinate_ambiguity_reduction.py
          cmp /tmp/expected-j2-kc-ambiguity.json stages/stage33/33-12/j2-kc-coordinate-ambiguity-reduction.json
          cp stages/stage33/33-12/full-surface-pic2-kummer-target.json /tmp/expected-pic2-kummer-target.json
          python stages/stage33/33-12/certify_full_surface_pic2_kummer_target.py
          cmp /tmp/expected-pic2-kummer-target.json stages/stage33/33-12/full-surface-pic2-kummer-target.json
          cp stages/stage33/33-12/stage33-12-exact-obstruction-inventory.json /tmp/expected.json
          python stages/stage33/33-12/assemble_exact_obstruction_inventory.py
          cmp /tmp/expected.json stages/stage33/33-12/stage33-12-exact-obstruction-inventory.json
      - name: Materialize J2 carrier and infinity exceptional in marked PicK
        run: python stages/stage33/33-12/materialize_j2_stoll_marked_picard_input.py
      - name: Write Stage33-12 result and controller checkpoint
        run: python stages/stage33/33-12/finalize_j2_stoll_marked_picard_checkpoint.py
      - name: Commit compact exact checkpoint to the same PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- stages/stage33/33-12/j2-stoll-marked-picard-input.json stages/stage33/33-12/result.md stages/stage33/controller.json; then
            echo 'No checkpoint changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage33/33-12/j2-stoll-marked-picard-input.json stages/stage33/33-12/result.md stages/stage33/controller.json
          git commit -m 'Stage33-12: materialize J2 marked Kc Picard input'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
