name: Stage33-12 exact checkpoint replay

# Exact lightweight replay after the fresh-super-hostile R3->R4 bridge pass.
# Attempt4 remains only the orientation/phi-cover certificate by itself; named
# J2 torsor credit is supplied by the separately audited CV Brauer-Sha bridge.
on:
  pull_request:
    paths:
      - 'stages/stage33/33-05/**'
      - 'stages/stage33/33-12/**'
      - 'stages/stage33/ROADMAP-33-05-J2-REPRESENTATIVE-REPAIR.md'
      - 'stages/stage33/controller.json'
      - '.github/workflows/stage33-12-main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-12-exact-checkpoint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-local-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay audited R3-R4 bridge and R4-open firewalls
        run: |
          set -euo pipefail

          cp stages/stage33/33-12/boundary-function-scalar-descent-certificate.json /tmp/expected-boundary-scalars.json
          python stages/stage33/33-12/certify_boundary_function_scalar_descent.py
          cmp /tmp/expected-boundary-scalars.json stages/stage33/33-12/boundary-function-scalar-descent-certificate.json

          cp stages/stage33/33-12/full-surface-hs-adjustment-contract.json /tmp/expected-hs-adjustment.json
          python stages/stage33/33-12/certify_full_surface_hs_adjustment_contract.py
          cmp /tmp/expected-hs-adjustment.json stages/stage33/33-12/full-surface-hs-adjustment-contract.json

          cp stages/stage33/33-12/j2-full-surface-mu2-zero-defect-contract.json /tmp/expected-j2-mu2-zero-defect.json
          python stages/stage33/33-12/certify_j2_full_surface_mu2_zero_defect_contract.py
          cmp /tmp/expected-j2-mu2-zero-defect.json stages/stage33/33-12/j2-full-surface-mu2-zero-defect-contract.json

          python stages/stage33/33-12/certify_j2_semantic_kc_picard_basis.py
          python stages/stage33/33-12/certify_j2_kc_transcendental_lattice_isometry.py
          python stages/stage33/33-12/certify_j2_kc_bfield_halfdual_target.py
          python stages/stage33/33-12/certify_j2_brauer_kernel_lattice_fingerprints.py

          cp stages/stage33/33-12/j2-cv-lclass-zero-regression.json /tmp/expected-j2-cv-lclass-zero.json
          python stages/stage33/33-12/certify_j2_cv_lclass_zero_regression.py
          cmp /tmp/expected-j2-cv-lclass-zero.json stages/stage33/33-12/j2-cv-lclass-zero-regression.json

          python stages/stage33/33-05/certify_j2_abstract_nonzero_reaudit.py
          cp stages/stage33/33-05/j2-corrected-full-l-representative.json /tmp/expected-j2-corrected-full-l.json
          python stages/stage33/33-05/certify_j2_corrected_full_l_representative.py
          cmp /tmp/expected-j2-corrected-full-l.json stages/stage33/33-05/j2-corrected-full-l-representative.json
          cp stages/stage33/33-05/j2-corrected-cv-e2-cocycle.json /tmp/expected-j2-corrected-e2.json
          python stages/stage33/33-05/certify_j2_corrected_cv_e2_cocycle.py
          cmp /tmp/expected-j2-corrected-e2.json stages/stage33/33-05/j2-corrected-cv-e2-cocycle.json

          python - <<'PY'
          import json
          s=json.load(open('stages/stage33/33-05/j2-r4-historical-attempts-semantic-status.json'))
          assert s['attempts']['attempt1']['not_valid_as_named_kc_torsor_evidence'] is True
          assert s['attempts']['attempt2']['not_valid_as_named_kc_torsor_evidence'] is True
          assert s['attempts']['attempt4']['semantic_status']=='CURRENT_R4_ORIENTATION_AUTHORITY'
          PY

          cp stages/stage33/33-05/j2-r4-2isogeny-orientation-correction.json /tmp/expected-j2-r4-orientation.json
          python stages/stage33/33-05/certify_j2_r4_2isogeny_orientation_correction.py
          cmp /tmp/expected-j2-r4-orientation.json stages/stage33/33-05/j2-r4-2isogeny-orientation-correction.json

          cp stages/stage33/33-05/j2-r3-r4-brauer-sha-bridge.json /tmp/expected-j2-r3-r4-bridge.json
          python stages/stage33/33-05/certify_j2_r3_r4_brauer_sha_bridge.py
          cmp /tmp/expected-j2-r3-r4-bridge.json stages/stage33/33-05/j2-r3-r4-brauer-sha-bridge.json

          python - <<'PY'
          import json
          c=json.load(open('stages/stage33/controller.json'))
          s=c['stage33_05_hostile_reopen']
          j=next(x for x in c['repair_children'] if x['id']=='33-12')
          r=json.load(open('stages/stage33/33-05/j2-representative-repair-state.json'))
          a=json.load(open('stages/stage33/33-05/audit-state.json'))
          b=json.load(open('stages/stage33/33-05/j2-r3-r4-brauer-sha-bridge.json'))
          e=json.load(open('stages/stage33/33-12/j2-brauer-to-sha-leray-edge-interface.json'))
          t=json.load(open('stages/stage33/33-12/j2-twisted-poincare-torsor-target.json'))

          assert s['reopened'] is True
          assert s['Q_descent_of_corrected_representative_established'] is False
          assert s['j2_brauer_sha_bridge_fresh_super_hostile_passed'] is True
          assert s['j2_generic_weil_chatelet_class_nonzero'] is True
          assert s['named_J2_torsor_authoritative_credit'] is True

          assert r['current_leaf']=='R4' and r['current_leaf_attempts']==4
          assert r['leaves']['R3']['brauer_sha_bridge']['fresh_super_hostile_verdict']=='PASS_FRESH_SUPER_HOSTILE_MATHEMATICALLY'
          assert r['leaves']['R3']['brauer_sha_bridge']['generic_weil_chatelet_class_nonzero'] is True
          assert r['leaves']['R4']['named_J2_torsor_authoritative_credit'] is True
          assert r['leaves']['R4']['primitive_NS_T_discriminant_form_materialized'] is False
          assert r['leaves']['R4']['candidate_minimum_norms']==[4,8,12]
          assert r['leaves']['R4']['minimum_norm_selected'] is False
          assert r['leaves']['R4']['marked_brauer_coordinate_selected'] is False
          assert r['leaves']['R5']['state']=='NOT_RUN_BLOCKED_BY_R4'

          assert b['canonical_sha256']=='4289ef568ce4c793c1ecc91fd55dac9e74f5ecd01e5aad99c5b98917e1df2a66'
          assert b['exact_conclusion']['fresh_super_hostile_audit_passed'] is True
          assert b['exact_conclusion']['generic_weil_chatelet_class_nonzero'] is True
          assert b['exact_conclusion']['named_J2_torsor_authoritative_credit'] is True
          assert b['exact_conclusion']['R4_exit_4_8_12_selected'] is False

          assert e['status']=='RESOLVED_FRESH_SUPER_HOSTILE_PASS_NAMED_J2_TORSOR_AUTHORITATIVE'
          assert t['current_target']['named_identity_authoritative_after_fresh_super_hostile'] is True
          assert a['current_audit_verdict']=='PASS_FRESH_SUPER_HOSTILE_MATHEMATICALLY_R3_R4_BRIDGE_HARDENED_AUTHORITATIVE'
          assert a['unit_closed'] is False and a['downstream_released'] is False and a['merge_allowed'] is False

          assert j['j2_named_torsor_authoritative_credit'] is True
          assert j['j2_generic_weil_chatelet_class_nonzero'] is True
          assert j['j2_marked_brauer_coordinate_selected'] is False
          assert j['j2_twisted_transcendental_kernel_identified'] is False
          assert j['stage33_12_closed_exact'] is False
          assert j['heavy_actions_authorized'] is False
          assert next(x for x in c['repair_children'] if x['id']=='33-13')['released'] is False
          assert c['stage33_progress']=='5/11'
          assert c['merge_allowed'] is False
          assert c['theorem_credit'] is False and c['receiver_credit'] is False and c['endpoint_credit'] is False
          assert c['perfect_cuboid_existence_claim'] is False and c['perfect_cuboid_nonexistence_claim'] is False
          print('R3-R4 bridge FRESH SUPER-HOSTILE PASS; named X_J2 authoritative; R4 primitive NS/T and 4/8/12 OPEN; R5 blocked')
          PY
