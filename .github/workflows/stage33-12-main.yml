name: Stage33-12 exact checkpoint replay

# Merge gate after hostile reopen and Stage33-05 repair-band activation.
# Historical R4 attempts 1/2 are NOT regenerated as current named-torsor
# evidence. Their algebra is frozen history and their current semantic status is
# controlled by j2-r4-historical-attempts-semantic-status.json. Attempt4 is the
# current 2-isogeny-orientation authority.
on:
  pull_request:
    paths:
      - 'stages/stage33/33-05/**'
      - 'stages/stage33/33-12/**'
      - 'stages/stage33/ROADMAP-33-05-J2-REPRESENTATIVE-REPAIR.md'
      - 'stages/stage33/controller.json'
      - '.github/workflows/stage33-12-main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-12-exact-checkpoint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-local-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay authoritative hostile-reopen through R4 attempt4
        run: |
          cp stages/stage33/33-12/boundary-function-scalar-descent-certificate.json /tmp/expected-boundary-scalars.json
          python stages/stage33/33-12/certify_boundary_function_scalar_descent.py
          cmp /tmp/expected-boundary-scalars.json stages/stage33/33-12/boundary-function-scalar-descent-certificate.json

          cp stages/stage33/33-12/full-surface-hs-adjustment-contract.json /tmp/expected-hs-adjustment.json
          python stages/stage33/33-12/certify_full_surface_hs_adjustment_contract.py
          cmp /tmp/expected-hs-adjustment.json stages/stage33/33-12/full-surface-hs-adjustment-contract.json

          cp stages/stage33/33-12/j2-full-surface-mu2-zero-defect-contract.json /tmp/expected-j2-mu2-zero-defect.json
          python stages/stage33/33-12/certify_j2_full_surface_mu2_zero_defect_contract.py
          cmp /tmp/expected-j2-mu2-zero-defect.json stages/stage33/33-12/j2-full-surface-mu2-zero-defect-contract.json

          python stages/stage33/33-12/certify_j2_semantic_kc_picard_basis.py
          python stages/stage33/33-12/certify_j2_kc_transcendental_lattice_isometry.py
          python stages/stage33/33-12/certify_j2_kc_bfield_halfdual_target.py
          python stages/stage33/33-12/certify_j2_brauer_kernel_lattice_fingerprints.py

          # Load-bearing hostile regression: historical Q-defined ell is CV-zero.
          cp stages/stage33/33-12/j2-cv-lclass-zero-regression.json /tmp/expected-j2-cv-lclass-zero.json
          python stages/stage33/33-12/certify_j2_cv_lclass_zero_regression.py
          cmp /tmp/expected-j2-cv-lclass-zero.json stages/stage33/33-12/j2-cv-lclass-zero-regression.json

          # Retained repaired geometric chain R1-R3.
          python stages/stage33/33-05/certify_j2_abstract_nonzero_reaudit.py

          cp stages/stage33/33-05/j2-corrected-full-l-representative.json /tmp/expected-j2-corrected-full-l.json
          python stages/stage33/33-05/certify_j2_corrected_full_l_representative.py
          cmp /tmp/expected-j2-corrected-full-l.json stages/stage33/33-05/j2-corrected-full-l-representative.json

          cp stages/stage33/33-05/j2-corrected-cv-e2-cocycle.json /tmp/expected-j2-corrected-e2.json
          python stages/stage33/33-05/certify_j2_corrected_cv_e2_cocycle.py
          cmp /tmp/expected-j2-corrected-e2.json stages/stage33/33-05/j2-corrected-cv-e2-cocycle.json

          # DO NOT execute attempt1/attempt2 generators here. Their old equations
          # are preserved as historical algebra but are semantically superseded as
          # named Kc-torsor evidence by attempt4.
          python - <<'PY'
          import json
          s=json.load(open('stages/stage33/33-05/j2-r4-historical-attempts-semantic-status.json'))
          a1=s['attempts']['attempt1']
          a2=s['attempts']['attempt2']
          a3=s['attempts']['attempt3']
          a4=s['attempts']['attempt4']
          assert a1['semantic_status']=='SUPERSEDED'
          assert a1['not_valid_as_named_kc_torsor_evidence'] is True
          assert a2['semantic_status']=='SUPERSEDED_AS_NAMED_TORSOR_EVIDENCE'
          assert a2['not_valid_as_named_kc_torsor_evidence'] is True
          assert a3['semantic_status']=='RETAINED_EXACT_FIXED_JACOBIAN_TORSION_IDENTITIES_ONLY'
          assert a4['semantic_status']=='CURRENT_R4_ORIENTATION_AUTHORITY'
          assert a4['minimum_norm_selected'] is False
          assert a4['marked_brauer_coordinate_selected'] is False
          print('R4_HISTORICAL_SEMANTIC_SUPERSESSION=PASS')
          PY

          # R4 attempt4 is the current named genus-one orientation authority.
          cp stages/stage33/33-05/j2-r4-2isogeny-orientation-correction.json /tmp/expected-j2-r4-orientation.json
          python stages/stage33/33-05/certify_j2_r4_2isogeny_orientation_correction.py
          cmp /tmp/expected-j2-r4-orientation.json stages/stage33/33-05/j2-r4-2isogeny-orientation-correction.json

          python - <<'PY'
          import json
          c=json.load(open('stages/stage33/controller.json'))
          s=c['stage33_05_hostile_reopen']
          j=next(x for x in c['repair_children'] if x['id']=='33-12')
          r=json.load(open('stages/stage33/33-05/j2-representative-repair-state.json'))
          o=json.load(open('stages/stage33/33-05/j2-r4-2isogeny-orientation-correction.json'))
          a=json.load(open('stages/stage33/33-05/audit-state.json'))

          assert s['reopened'] is True
          assert s['named_representative_credit']=='REVOKED_PENDING_REPAIR'
          assert s['abstract_J2_nonzero_reconfirmed'] is True
          assert s['corrected_geometric_J2_representative_nonzero'] is True
          assert s['corrected_geometric_J2_E2_cocycle_materialized'] is True
          assert s['Q_descent_of_corrected_representative_established'] is False
          assert s['repair_leaf']=='R4'

          assert r['current_leaf']=='R4' and r['current_leaf_attempts']==4
          assert r['current_leaf_stagnation_count']==0
          assert r['leaves']['R1']['state']=='DONE_ABSTRACT_J2_NONZERO_CONFIRMED'
          assert r['leaves']['R2']['state']=='DONE_CORRECTED_ELL_J2_NONZERO_CONFIRMED'
          assert r['leaves']['R3']['state']=='DONE_EXPLICIT_NONZERO_CV_E2_COCYCLE_AND_KUMMER_COORDINATES'
          assert r['leaves']['R4']['state']=='IN_PROGRESS_2ISOGENY_ORIENTATION_CORRECTED_KC_JACOBIAN_TORSOR_MATERIALIZED_NS_PENDING'
          assert r['leaves']['R4']['old_attempt1_quartic_jacobian']=='Eprime_Tr'
          assert r['leaves']['R4']['corrected_named_2cover_jacobian']=='E_Kc'

          assert o['attempt']==4
          assert o['orientation_audit']['attempt1_named_torsor_credit_revoked'] is True
          assert o['corrected_named_geometric_torsor']['jacobian']=='E_Kc'
          assert o['corrected_named_geometric_torsor']['degree2_map_target']=='Eprime_Tr'
          assert o['historical_no_go_reaudit']['global_K3_minimal_regular_model_NS_discriminant_form_materialized'] is False
          assert o['historical_no_go_reaudit']['candidate_minimum_norms']==[4,8,12]
          assert o['historical_no_go_reaudit']['minimum_norm_selected'] is False
          assert o['historical_no_go_reaudit']['marked_Brauer_functional_selected'] is False

          # Current audit state must explicitly supersede the historical CLOSED state.
          assert a['semantic_status']=='SUPERSEDED_BY_HOSTILE_REOPEN'
          assert a['do_not_use_as_current_credit'] is True
          assert a['unit_closed'] is False
          assert a['downstream_released'] is False
          assert a['merge_allowed'] is False

          # Controller must point to the current PR/attempt4 state.
          assert j['pr']==1464
          assert j['j2_torsor_equation_materialized'] is True
          assert j['j2_explicit_torsor_surface_materialized'] is True
          assert j['j2_repair_leaf']=='R4'
          assert j['j2_marked_brauer_coordinate_selected'] is False
          assert j['j2_twisted_transcendental_kernel_identified'] is False
          assert j['stage33_12_closed_exact'] is False
          assert j['heavy_actions_authorized'] is False

          assert r['firewalls']['Q_defined_descent_credit_restored'] is False
          assert r['firewalls']['stage33_05_reclosed'] is False
          assert next(x for x in c['repair_children'] if x['id']=='33-13')['released'] is False
          assert c['stage33_progress']=='5/11'
          assert c['merge_allowed'] is False
          assert c['theorem_credit'] is False and c['receiver_credit'] is False and c['endpoint_credit'] is False
          assert c['perfect_cuboid_existence_claim'] is False and c['perfect_cuboid_nonexistence_claim'] is False
          print('R1-R3 PASS; R4 attempt4 orientation PASS; 4/8/12 OPEN; stale evidence paths blocked')
          PY
