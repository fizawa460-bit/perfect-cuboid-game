name: Stage33-12 exact checkpoint replay

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'stages/stage33/33-05/**'
      - 'stages/stage33/33-12/**'
      - 'stages/stage33/MAIN-START-HERE.md'
      - 'stages/stage33/MAIN-STATE.json'
      - 'stages/stage33/RULES.md'
      - 'stages/stage33/controller.json'
      - '.github/workflows/stage33-12-main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-12-exact-checkpoint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-local-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay current authoritative Stage33 checkpoint
        run: |
          python stages/stage33/sync_main_state.py --check

          cp stages/stage33/33-05/j2-r5f-hs-d2-nonzero-hostile-replay.json /tmp/expected-j2-r5f.json
          python stages/stage33/33-05/certify_j2_r5f_hs_d2_nonzero_hostile_replay.py
          python -c "import json; assert json.load(open('/tmp/expected-j2-r5f.json')) == json.load(open('stages/stage33/33-05/j2-r5f-hs-d2-nonzero-hostile-replay.json'))"
          mv /tmp/expected-j2-r5f.json stages/stage33/33-05/j2-r5f-hs-d2-nonzero-hostile-replay.json

          cp stages/stage33/33-05/stage33-05-br2-zero-q-survival-hostile-replay.json /tmp/expected-zero-survival.json
          python stages/stage33/33-05/certify_stage33_05_br2_zero_q_survival_hostile_replay.py
          python -c "import json; assert json.load(open('/tmp/expected-zero-survival.json')) == json.load(open('stages/stage33/33-05/stage33-05-br2-zero-q-survival-hostile-replay.json'))"
          mv /tmp/expected-zero-survival.json stages/stage33/33-05/stage33-05-br2-zero-q-survival-hostile-replay.json

          python stages/stage33/33-12/verify_j2_cc_actual_cech_global_square_overlap.py
          python stages/stage33/33-12/verify_j2_ct_six_kc_support_fullpic64_pullbacks.py

          cp stages/stage33/33-12/j2-cv-d2-semantic-orientation.json /tmp/expected-j2-orientation.json
          python stages/stage33/33-12/certify_j2_cv_d2_semantic_orientation.py
          cmp /tmp/expected-j2-orientation.json stages/stage33/33-12/j2-cv-d2-semantic-orientation.json

          python stages/stage33/33-12/verify_j2_named_transport_first_column_rigidity.py
          python stages/stage33/33-12/verify_j2_named_v4_h1_target_before_source_orientation.py

          git diff --check
          git diff --exit-code
