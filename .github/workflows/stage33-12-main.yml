name: Stage33-12 exact checkpoint replay

# Historical R1-R4 certificates are replayed from immutable evidence. Current
# Stage33 state is checked only through the compact MAIN-STATE interface so this
# replay does not pin obsolete controller schemas or old repair-leaf wording.
on:
  pull_request:
    paths:
      - 'stages/stage33/33-05/**'
      - 'stages/stage33/33-12/**'
      - 'stages/stage33/MAIN-STATE.json'
      - 'stages/stage33/controller.json'
      - '.github/workflows/stage33-12-main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-12-exact-checkpoint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-local-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay immutable Stage33-05/R4 evidence and current compact state
        run: |
          cp stages/stage33/33-12/boundary-function-scalar-descent-certificate.json /tmp/expected-boundary-scalars.json
          python stages/stage33/33-12/certify_boundary_function_scalar_descent.py
          cmp /tmp/expected-boundary-scalars.json stages/stage33/33-12/boundary-function-scalar-descent-certificate.json

          cp stages/stage33/33-12/full-surface-hs-adjustment-contract.json /tmp/expected-hs-adjustment.json
          python stages/stage33/33-12/certify_full_surface_hs_adjustment_contract.py
          cmp /tmp/expected-hs-adjustment.json stages/stage33/33-12/full-surface-hs-adjustment-contract.json

          cp stages/stage33/33-12/j2-full-surface-mu2-zero-defect-contract.json /tmp/expected-j2-mu2-zero-defect.json
          python stages/stage33/33-12/certify_j2_full_surface_mu2_zero_defect_contract.py
          cmp /tmp/expected-j2-mu2-zero-defect.json stages/stage33/33-12/j2-full-surface-mu2-zero-defect-contract.json

          python stages/stage33/33-12/certify_j2_semantic_kc_picard_basis.py
          python stages/stage33/33-12/certify_j2_kc_transcendental_lattice_isometry.py
          python stages/stage33/33-12/certify_j2_kc_bfield_halfdual_target.py
          python stages/stage33/33-12/certify_j2_brauer_kernel_lattice_fingerprints.py

          cp stages/stage33/33-12/j2-cv-lclass-zero-regression.json /tmp/expected-j2-cv-lclass-zero.json
          python stages/stage33/33-12/certify_j2_cv_lclass_zero_regression.py
          cmp /tmp/expected-j2-cv-lclass-zero.json stages/stage33/33-12/j2-cv-lclass-zero-regression.json

          python stages/stage33/33-05/certify_j2_abstract_nonzero_reaudit.py

          cp stages/stage33/33-05/j2-corrected-full-l-representative.json /tmp/expected-j2-corrected-full-l.json
          python stages/stage33/33-05/certify_j2_corrected_full_l_representative.py
          cmp /tmp/expected-j2-corrected-full-l.json stages/stage33/33-05/j2-corrected-full-l-representative.json

          cp stages/stage33/33-05/j2-corrected-cv-e2-cocycle.json /tmp/expected-j2-corrected-e2.json
          python stages/stage33/33-05/certify_j2_corrected_cv_e2_cocycle.py
          cmp /tmp/expected-j2-corrected-e2.json stages/stage33/33-05/j2-corrected-cv-e2-cocycle.json

          cp stages/stage33/33-05/j2-r4-tr-kernel-torsor-reduction.json /tmp/expected-j2-r4-tr-torsor.json
          python stages/stage33/33-05/certify_j2_r4_tr_kernel_torsor_reduction.py
          cmp /tmp/expected-j2-r4-tr-torsor.json stages/stage33/33-05/j2-r4-tr-kernel-torsor-reduction.json

          python stages/stage33/33-05/certify_j2_r4_translation_quotient_lattice.py

          python - <<'PY'
          import json
          r=json.load(open('stages/stage33/33-05/j2-representative-repair-state.json'))
          z=json.load(open('stages/stage33/33-05/j2-r4-tr-kernel-torsor-reduction.json'))
          y=json.load(open('stages/stage33/33-05/j2-r4-correct-translation-torsor.json'))
          x=json.load(open('stages/stage33/33-05/j2-r4-translation-quotient-lattice.json'))
          m=json.load(open('stages/stage33/MAIN-STATE.json'))

          assert r['leaves']['R1']['state']=='DONE_ABSTRACT_J2_NONZERO_CONFIRMED'
          assert r['leaves']['R2']['state']=='DONE_CORRECTED_ELL_J2_NONZERO_CONFIRMED'
          assert r['leaves']['R3']['state']=='DONE_EXPLICIT_NONZERO_CV_E2_COCYCLE_AND_KUMMER_COORDINATES'
          assert r['leaves']['R4']['state']=='DONE_MINIMUM_NORM_8_MARKED_J2_1_0'
          assert r['leaves']['R4']['attempts']==3
          assert z['named_repaired_J2_2cover']['kernel']=='<Tr>'
          assert z['tr_kernel_2isogenous_comparison_surface']['is_named_J2_torsor'] is False
          assert z['lattice_reduction']['minimum_norm_selected'] is False
          assert z['lattice_reduction']['marked_brauer_coordinate_selected'] is False
          assert y['attempt1_diagnosis']['old_ns_glue_target_revoked'] is True
          assert y['correct_translation_descent']['jacobian'].startswith('E:')
          assert x['correct_torsor_degree_two_quotient']['generic_degree']==2
          assert x['comparison_k3_isomorphism']['base_change_degree']==1
          assert x['lattice_conclusion']['torsor_transcendental_gram']==[[8,0],[0,16]]
          assert x['lattice_conclusion']['minimum_norm']==8
          assert x['lattice_conclusion']['marked_brauer_coordinate']==[1,0]
          assert r['firewalls']['Q_defined_descent_credit_restored'] is False

          assert m['schema']=='STAGE33_MAIN_COMPACT_STATE_V6'
          assert m['stage33_progress']=='6/11'
          assert m['current']['unit']=='33-12'
          assert m['current']['active_missing_interface']=='J2_SOURCE_TARGET_BINDING_INCOMPATIBLE_WITH_LOCKED_V4_MODULE_ACTIONS'
          assert m['exact_reusable_inputs']['named_J2_semantic_orientation']['fixed_marked_Kc_coordinate_f2']==[1,0]
          assert m['open_datum']['named_J2_source_target_relation_materialized'] is False
          assert m['open_datum']['named_source_target_relation_rank_f2']==0
          assert m['open_datum']['matrix_standard_columns_materialized']==0
          assert m['firewalls']['stage33_12_closed_exact'] is False
          assert m['firewalls']['stage33_07_reclosed'] is False
          assert m['firewalls']['stage33_08_released'] is False
          assert m['firewalls']['theorem_credit'] is False
          assert m['firewalls']['receiver_credit'] is False
          assert m['firewalls']['endpoint_credit'] is False
          assert m['firewalls']['perfect_cuboid_existence_claim'] is False
          assert m['firewalls']['perfect_cuboid_nonexistence_claim'] is False
          print('historical R1-R4 replay PASS; current Stage33 MAIN-STATE V6 binding-repair firewall PASS')
          PY

          python stages/stage33/sync_main_state.py --check
          git diff --check
