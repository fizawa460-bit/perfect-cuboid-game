name: Stage32 BRIDGE BR103 C3 replay

# Trigger lifecycle: ACTIVE_AUTO — temporary active-leaf replay; delete after result retention.
on:
  pull_request:
    branches: [main]
    paths:
      - 'stages/stage32/generalization-bridge/**'
      - '.github/workflows/stage32-bridge-br103-c3-replay.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact verifier dependency
        run: python -m pip install sympy
      - name: Verify BR103 C3 Picard64 fixed-pairing projection
        run: python stages/stage32/generalization-bridge/verify_br103_c3_picard64_fixed_pairing_projection.py
