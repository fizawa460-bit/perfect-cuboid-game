name: Stage33-07 non-elementary k1 k2 integral cc ct
on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/**'
      - '.github/workflows/stage33-07-nonelementary-k12-integral-cc-ct.yml'
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact k1 k2 integral cc ct certificate
        working-directory: stages/stage33/33-07
        run: python certify_nonelementary_k12_integral_cc_ct.py
      - name: Enforce conservative firewall
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import json
          x=json.load(open('nonelementary-k12-integral-cc-ct-certified.json'))
          assert x['integral_cc_ct_certified']
          assert x['combined_H_before']==74364480
          assert x['combined_H_after_integral_cc_ct']==14794944
          assert x['k1']['H_after_integral_cc_ct']==2928832
          assert x['k2']['H_after_integral_cc_ct']==11866112
          assert x['all_raw_cc_choices_induce_same_normalized_affine_locus_on_every_orbit']
          assert x['ct_adds_no_affine_equation_on_every_orbit']
          assert not x['full_Q4_condition_certified'] and not x['endpoint_finite_q_certified'] and not x['endpoint_full_action_certified']
          assert not x['actual_index512_glue_identified'] and not x['arithmetic_HS_closed']
          assert x['stage33_progress']=='6/11' and not x['stage33_08_released'] and not x['stage33_09_released']
          assert not x['theorem_credit'] and not x['endpoint_credit'] and not x['perfect_cuboid_nonexistence_claim']
          print('NONELEMENTARY_K12_INTEGRAL_CC_CT=PASS_EXACT')
          print('CERT_SHA256='+x['canonical_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-k12-integral-cc-ct-certified
          path: stages/stage33/33-07/nonelementary-k12-integral-cc-ct-certified.json
          retention-days: 5
