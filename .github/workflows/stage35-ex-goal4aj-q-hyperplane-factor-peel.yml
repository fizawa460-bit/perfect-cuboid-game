name: Stage35-EX Goal4AJ Q hyperplane factor peel

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage35-ex/runkeys/goal4aj-q-hyperplane-factor-peel.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage35-ex-goal4aj-q-hyperplane-peel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          KEY='stages/stage35-ex/runkeys/goal4aj-q-hyperplane-factor-peel.json'
          PROBE='stages/stage35-ex/diagnose_stage35_ex_35_goal4aj_q_hyperplane_factor_peel.py'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test '${{ github.event_name }}' = 'pull_request' || exit 0
          test "${PR_NUMBER}" = '1659' || exit 0
          test "${HEAD_REF}" = 'stage35-ex-goal4x-open-receiver-boundary-picard' || exit 0
          test -n "${BEFORE}" || exit 0
          git fetch --no-tags --depth=1 origin "${BEFORE}" || exit 0
          git show "${BEFORE}:${KEY}" > /tmp/old-key.json || exit 0
          python - <<'PY' > /tmp/auth
          import json,os,subprocess
          from pathlib import Path
          k=json.loads(Path('stages/stage35-ex/runkeys/goal4aj-q-hyperplane-factor-peel.json').read_text())
          old=json.loads(Path('/tmp/old-key.json').read_text())
          blob=subprocess.check_output(['git','hash-object','stages/stage35-ex/diagnose_stage35_ex_35_goal4aj_q_hyperplane_factor_peel.py'],text=True).strip()
          ok=(k.get('schema')=='STAGE35_EX_GOAL4AJ_Q_HYPERPLANE_FACTOR_PEEL_RUNKEY_V1' and
              k.get('armed') is True and old.get('armed') is False and
              old.get('generation')==0 and k.get('generation')==1 and
              k.get('armed_from_head_sha')==os.environ['BEFORE'] and
              blob==k.get('probe_blob_sha1')=='e5b41410e570d5e442afe985dd5b7f3355d5d653' and
              k.get('planned_jobs')==1 and k.get('planned_shards')==1 and
              k.get('persisted_output_upper_bound_bytes')==32768 and
              k.get('actions_artifact_upload') is False)
          print('true' if ok else 'false')
          PY
          echo "authorized=$(cat /tmp/auth)" >> "$GITHUB_OUTPUT"

  diagnose:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 380
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded numerical dependencies
        run: python -m pip install --disable-pip-version-check sympy==1.14.0 scipy==1.16.1
      - name: Maximize Q-defined retained hyperplane factor peel
        run: |
          set -euo pipefail
          python -B stages/stage35-ex/diagnose_stage35_ex_35_goal4aj_q_hyperplane_factor_peel.py | tee /tmp/goal4aj-qpeel.log
          grep -q '^GOAL4AJ_Q_HYPERPLANE_FACTOR_PEEL_JSON=' /tmp/goal4aj-qpeel.log
          grep -q '^GOAL4AJ_Q_HYPERPLANE_FACTOR_PEEL=PASS$' /tmp/goal4aj-qpeel.log
          test "$(wc -c </tmp/goal4aj-qpeel.log)" -le 32768
