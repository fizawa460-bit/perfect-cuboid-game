name: Stage33-07 BR2A integration regression

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/**'
      - 'stages/stage33/controller.json'
      - '.github/workflows/stage33-07-br2a-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  br2a-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact integer algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Recheck retained J2 endpoint pullback
        working-directory: stages/stage33/33-07
        run: python probe_j2_endpoint_q2.py
      - name: Recheck retained J2 Q2 nonconstancy
        working-directory: stages/stage33/33-07
        run: python scan_j2_endpoint_q2_variation.py
      - name: Recheck BR0B integration prefix
        working-directory: stages/stage33/33-07
        run: python assemble_integration_prefix_v2.py
      - name: Recheck BR0B boundary residue map
        working-directory: stages/stage33/33-07
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python materialize_br0b_boundary_residue_map.py
      - name: Recheck BR0G boundary finite presentation
        working-directory: stages/stage33/33-07
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python materialize_br0g_finite_ramified_presentation.py
      - name: Recheck full BR0B boundary injection
        working-directory: stages/stage33/33-07
        run: python certify_full_br0b_boundary_injection.py
      - name: Materialize exact arithmetic Hochschild-Serre repair quotient
        working-directory: stages/stage33/33-07
        run: python materialize_arithmetic_hs_descent_problem.py
      - name: Kill odd-primary proper Brauer invariants by exact Frobenius unit certificates
        working-directory: stages/stage33/33-07
        run: python certify_proper_brauer_odd_invariants_zero.py
      - name: Extract proper Picard Gram and cc-ct Galois action from pinned Stoll source
        working-directory: stages/stage33/33-07
        run: python extract_picard_gram_galois.py
      - name: Derive proper Br4 Galois module from Picard discriminant
        working-directory: stages/stage33/33-07
        run: python derive_proper_brauer4_from_picard_discriminant.py
      - name: Replay historical global presentation for regression only
        working-directory: stages/stage33/33-07
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python materialize_global_two_primary_presentation_v2.py
      - name: Validate retained exact mathematics and HS reduction
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import json
          r=json.load(open('br0b-boundary-raw-residue-map.json'))
          f=json.load(open('br0g-finite-ramified-residue-presentation.json'))
          g=json.load(open('full-br0b-boundary-injection.json'))
          s=json.load(open('j2-endpoint-q2-variation.json'))
          h=json.load(open('arithmetic-hs-descent-problem.json'))
          o=json.load(open('proper-brauer-odd-invariants-zero.json'))
          p=json.load(open('picard-gram-galois.json'))
          b4=json.load(open('proper-brauer4-picard-discriminant.json'))
          assert r['induced_left_filtration_boundary_map_injective']
          assert f['unit_symbol_rank_f2']==44
          assert f['graph_residual_rank_f2']==17
          assert f['combined_exponent_two_rank_f2']==61
          assert f['finite_ramified_boundary_residue_module']=='(Z/2)^49 direct_sum (Z/4)^12'
          assert g['full_br0b_boundary_map_injective']
          assert g['br0b_all_primary_classes_accounted']
          assert s['evaluation_nonconstant_on_endpoint_Q2_locus_certified']
          assert s['both_invariants_0_and_half_observed']
          assert h['known_q_defined_global_residue_image']['u44']['generator_count']==44
          q=h['boundary_candidates_not_yet_promoted_to_global_q_classes']['finite_ramified_after_u44']
          assert q['exact_unknown_quotient']=='(Z/2)^23 direct_sum (Z/4)^3'
          assert q['minimal_invariant_factor_generators']==26
          assert h['geometric_lift_fiber']['proper_transcendental_rank']==14
          assert h['arithmetic_hs_obstruction_package']['blanket_global_gersten_surjectivity_used'] is False
          assert o['proper_geometric_brauer_odd_galois_invariants_zero']
          assert o['constant_odd_global_image_equals_br0b_odd_image']
          assert o['constant_odd_boundary_cokernel_globally_liftable_part']=='0'
          assert o['repair_reduced_to_two_primary']
          assert o['frobenius_certificates'][0]['full_rank14_det_Frob_minus_1_v2']==38
          assert o['frobenius_certificates'][1]['full_rank14_det_Frob_minus_1_v2']==46
          assert len(p['picard_gram_64x64'])==64
          assert len(p['cc_picard_action_64x64'])==64
          assert len(p['ct_picard_action_64x64'])==64
          print('STAGE33_07_RETAINED_MATH=PASS')
          print('HS_FINITE_UNKNOWN=(Z/2)^23+(Z/4)^3')
          print('HS_FINITE_UNKNOWN_GENERATORS=26')
          print('PROPER_TRANSCENDENTAL_RANK=14')
          print('PROPER_BRAUER_ODD_GQ_INVARIANTS=0')
          print('ODD_CONSTANT_COKERNEL_GLOBAL_IMAGE=0')
          print('REPAIR_REDUCED_TO_TWO_PRIMARY=True')
          print('PICARD_GRAM_GALOIS_EXTRACTED=True')
          print('PICARD_DISCRIMINANT=',b4['picard_discriminant_abs'])
          print('BRAUER4_RECONSTRUCTION_COMPLETE=',b4['brauer4_reconstruction_complete'])
          if b4['brauer4_reconstruction_complete']:
              print('PROPER_BR2_GQ_INVARIANT_DIM=',b4['proper_Br2_GQ_invariant_dimension_f2'])
              print('PROPER_BR4_GQ_INVARIANT_GROUP=',b4['proper_Br4_GQ_invariant_group'])
          PY
      - name: Validate re-audited blocked arithmetic descent state
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import json
          a=json.load(open('audit-state.json'))
          h=json.load(open('handoff.json'))
          ctl=json.load(open('../controller.json'))
          assert a['unit_status']=='BLOCKED_NEW_KERNEL'
          assert not a['unit_closed'] and not a['downstream_released']
          assert a['br2a']=='BLOCKED_NEW_KERNEL'
          assert a['new_kernel_id']=='R33-BR0G-BR2A-GLOBAL-RESIDUE-LIFT-ARITHMETIC-HS-DESCENT'
          assert a['j2']['q_defined'] and a['j2']['endpoint_pullback_nonzero']
          assert a['j2']['q2_evaluation_nonconstant']
          assert a['br0g_boundary_data']['boundary_residue_presentation_exact']
          assert not a['br0g_boundary_data']['q_defined_global_lifts_complete']
          assert a['revoked_or_pending_credit']['complete_relevant_q_defined_class_list_for_stage33_brauer_scope'] is False
          assert h['unit_status']=='BLOCKED_NEW_KERNEL'
          assert h['stage33_progress']=='6/11'
          assert not h['stage33_08_released']
          assert ctl['stage33_progress']=='6/11'
          assert ctl['stage33_04']['unit_status']=='CLOSED'
          assert ctl['stage33_07']['unit_status']=='BLOCKED_NEW_KERNEL'
          assert ctl['stage33_08']['unit_status']=='BLOCKED_NEW_KERNEL'
          assert not ctl['stage33_08_released'] and not ctl['stage33_09_released']
          assert ctl['next_item']=='Stage33-07_REPAIR_GLOBAL_RESIDUE_LIFT_ARITHMETIC_HS_DESCENT'
          print('STAGE33_07_REAUDIT=BLOCKED_NEW_KERNEL')
          print('STAGE33_PROGRESS=6/11')
          print('STAGE33_08_RELEASED=False')
          PY
      - name: Upload Stage33-07 retained/re-audit/HS-repair certificates
        uses: actions/upload-artifact@v4
        with:
          name: stage33-07-br2a-hs-repair
          path: |
            stages/stage33/33-07/j2-endpoint-q2-pullback.json
            stages/stage33/33-07/j2-endpoint-q2-variation.json
            stages/stage33/33-07/br0b-boundary-raw-residue-map.json
            stages/stage33/33-07/br0g-finite-ramified-residue-presentation.json
            stages/stage33/33-07/full-br0b-boundary-injection.json
            stages/stage33/33-07/arithmetic-hs-descent-problem.json
            stages/stage33/33-07/proper-brauer-odd-invariants-zero.json
            stages/stage33/33-07/picard-gram-galois.json
            stages/stage33/33-07/picard-gram-galois-magma-stdout.txt
            stages/stage33/33-07/proper-brauer4-picard-discriminant.json
            stages/stage33/33-07/audit-state.json
            stages/stage33/33-07/handoff.json
