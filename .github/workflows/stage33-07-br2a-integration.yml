name: Stage33-07 BR2A full inventory

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/**'
      - 'stages/stage33/controller.json'
      - '.github/workflows/stage33-07-br2a-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  br2a-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact integer algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Certify nonzero endpoint pullback of Kc J2
        working-directory: stages/stage33/33-07
        run: python probe_j2_endpoint_q2.py
      - name: Scan J2 evaluation on several genuine Q2 endpoint lifts
        working-directory: stages/stage33/33-07
        run: python scan_j2_endpoint_q2_variation.py
      - name: Assemble audited Stage33-07 integration prefix
        working-directory: stages/stage33/33-07
        run: python assemble_integration_prefix_v2.py
      - name: Materialize exact BR0B left-filtration boundary residue map
        working-directory: stages/stage33/33-07
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python materialize_br0b_boundary_residue_map.py
      - name: Materialize exact BR0G finite ramified residue presentation
        working-directory: stages/stage33/33-07
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python materialize_br0g_finite_ramified_presentation.py
      - name: Certify full BR0B injection into boundary character block
        working-directory: stages/stage33/33-07
        run: python certify_full_br0b_boundary_injection.py
      - name: Materialize global two-primary presentation and complete frozen-scope inventory
        working-directory: stages/stage33/33-07
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python materialize_global_two_primary_presentation_v2.py
      - name: Validate main-batch audit handoff
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import json
          c=json.load(open('integration-prefix.json'))
          r=json.load(open('br0b-boundary-raw-residue-map.json'))
          f=json.load(open('br0g-finite-ramified-residue-presentation.json'))
          g=json.load(open('full-br0b-boundary-injection.json'))
          s=json.load(open('j2-endpoint-q2-variation.json'))
          z=json.load(open('global-two-primary-presentation.json'))
          p=c['closure_prefix']
          assert p['br0b_all_primary_classes_imported']
          assert p['br0g_relevant_classes_imported']
          assert p['theorem_hypotheses_source_locked']
          assert p['variable_dictionary_complete']
          assert p['nf_phys2_camp4_invocations_hypothesis_gated']
          assert p['br0b_all_primary_classes_accounted']
          assert r['basis_correction']['stage33_03_smith_unit_basis_reconstructed']
          assert r['full_coefficient_matrix_rank']==14
          assert r['full_coefficient_matrix_smith_nonzero_diagonal']==[1]*14
          assert r['q_component_coefficient_matrix_smith_nonzero_diagonal']==[1]*12+[2,2]
          assert r['q_component_mod2_kernel_dimension']==2
          assert r['kappa_span_equals_q_component_mod2_kernel']
          assert r['qi_pattern_rank_f2']==2
          assert r['kappa_residue_zero']['both_q_component_patterns_zero']
          assert r['kappa_residue_zero']['both_qi_component_patterns_zero']
          assert r['induced_left_filtration_boundary_map_injective']
          assert r['left_filtration_br0b_br0g_duplicate_overlap_exact']
          assert f['unit_symbol_rank_f2']==44
          assert f['graph_residual_rank_f2']==17
          assert f['combined_exponent_two_rank_f2']==61
          assert f['order4_double_rank_f2']==12
          assert f['order4_double_projection_to_R17_rank_f2']==3
          assert f['order4_double_intersection_U44_rank_f2']==9
          assert f['finite_ramified_boundary_residue_module_exact']
          assert f['finite_ramified_boundary_residue_module']=='(Z/2)^49 direct_sum (Z/4)^12'
          assert f['diagnostic_quotient_by_U44']=='(Z/2)^23 direct_sum (Z/4)^3'
          assert f['firewall']['this_is_boundary_residue_level_not_yet_full_global_BrU_relation_matrix']
          assert g['proper_cuboid_surface_H1_Q_Pic']==0
          assert g['full_br0b_boundary_map_injective']
          assert g['right_filtration_quadratic_family_boundary_map_injective']
          assert g['right_filtration_five_finite_classes_boundary_map_injective']
          assert g['br0b_duplicate_with_br0g_constant_block_exactly_its_injective_image']
          assert g['trivial_algebraic_duplicate_quotient_exact']
          assert g['br0b_all_primary_classes_accounted']
          assert len(s['evaluations'])==7
          assert s['evaluation_nonconstant_on_endpoint_Q2_locus_certified'] is True
          assert s['both_invariants_0_and_half_observed'] is True
          assert z['coefficient_gersten_exponent_preserving_lifts']
          assert z['finite_ramified_extension_by_j2_split_noncanonically']
          assert z['constant_character_block_algebraic']
          assert z['j2_transcendental_independent_from_constant_block']
          assert z['finite_relation_symbol_compatibility_exact']
          assert len(z['finite_relation_matrix_74x74'])==74
          assert len(z['finite_symbol_matrix_74x120_mixed_mod4_encoding'])==74
          assert z['relation_matrix_exact_for_two_primary_branch']
          assert z['symbol_matrix_exact_for_two_primary_branch']
          assert z['theorem_hypotheses_source_locked']
          assert z['variable_dictionary_complete']
          assert z['trivial_algebraic_duplicate_quotient_exact']
          assert z['nf_phys2_camp4_invocations_hypothesis_gated']
          assert z['complete_relevant_q_defined_class_list_for_stage33_brauer_scope']
          assert z['every_class_has_primary_order_and_provenance']
          assert z['br0b_all_primary_classes_accounted']
          assert z['br2a']=='CLAIMED_DISCHARGED_PENDING_HOSTILE_AUDIT'
          assert z['unresolved_unknown_in_scope']==0
          assert z['closure_criteria_non_audit_satisfied']==13
          assert z['unit_status']=='AUDIT_REQUIRED' and not z['unit_closed']
          assert not z['downstream_released'] and not z['stage33_08_released']
          print('STAGE33_07_MAIN_PRODUCTION=PASS_NONAUDIT_13_OF_13')
          print('J2_Q2_EVALUATION_NONCONSTANT=True')
          print('BR2A=CLAIMED_DISCHARGED_PENDING_HOSTILE_AUDIT')
          print('NEXT=Stage33-audit')
          PY
      - name: Upload Stage33-07 working certificates
        uses: actions/upload-artifact@v4
        with:
          name: stage33-07-br2a-working
          path: |
            stages/stage33/33-07/j2-endpoint-q2-pullback.json
            stages/stage33/33-07/j2-q2-magma-stdout.txt
            stages/stage33/33-07/j2-endpoint-q2-variation.json
            stages/stage33/33-07/j2-q2-variation-magma-stdout.txt
            stages/stage33/33-07/integration-prefix.json
            stages/stage33/33-07/br0b-boundary-raw-residue-map.json
            stages/stage33/33-07/br0g-finite-ramified-residue-presentation.json
            stages/stage33/33-07/full-br0b-boundary-injection.json
            stages/stage33/33-07/global-two-primary-presentation.json
