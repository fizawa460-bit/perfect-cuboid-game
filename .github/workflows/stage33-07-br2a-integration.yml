name: Stage33-07 BR2A full inventory

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/**'
      - 'stages/stage33/controller.json'
      - '.github/workflows/stage33-07-br2a-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  br2a-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact integer algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Certify nonzero endpoint pullback of Kc J2
        working-directory: stages/stage33/33-07
        run: python probe_j2_endpoint_q2.py
      - name: Assemble audited Stage33-07 integration prefix
        working-directory: stages/stage33/33-07
        run: python assemble_integration_prefix_v2.py
      - name: Materialize exact BR0B left-filtration boundary residue map
        working-directory: stages/stage33/33-07
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python materialize_br0b_boundary_residue_map.py
      - name: Validate main-batch firewall and sharpened residual
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import json
          c=json.load(open('integration-prefix.json'))
          r=json.load(open('br0b-boundary-raw-residue-map.json'))
          p=c['closure_prefix']
          assert p['br0b_all_primary_classes_imported']
          assert p['br0g_relevant_classes_imported']
          assert p['theorem_hypotheses_source_locked']
          assert p['variable_dictionary_complete']
          assert p['nf_phys2_camp4_invocations_hypothesis_gated']
          assert p['br0b_all_primary_classes_accounted']
          assert r['basis_correction']['stage33_03_smith_unit_basis_reconstructed']
          assert r['full_coefficient_matrix_rank']==14
          assert r['full_coefficient_matrix_smith_nonzero_diagonal']==[1]*14
          assert r['q_component_coefficient_matrix_smith_nonzero_diagonal']==[1]*12+[2,2]
          assert r['q_component_mod2_kernel_dimension']==2
          assert r['kappa_span_equals_q_component_mod2_kernel']
          assert r['qi_pattern_rank_f2']==2
          assert r['kappa_residue_zero']['both_q_component_patterns_zero']
          assert r['kappa_residue_zero']['both_qi_component_patterns_zero']
          assert r['induced_left_filtration_boundary_map_injective']
          assert r['left_filtration_br0b_br0g_duplicate_overlap_exact']
          assert r['unresolved_unknown_in_scope']==1
          assert r['unit_status']=='RUNNING'
          assert r['unit_closed'] is False
          assert r['downstream_released'] is False
          assert r['stage33_progress']=='6/11'
          assert r['stage33_08_released'] is False
          print('STAGE33_07_PREFIX_AND_LEFT_OVERLAP=PASS')
          print('RESIDUAL='+r['new_residual_kernel'])
          print('NEXT_LEAF='+r['next_exact_leaf'])
          PY
      - name: Upload Stage33-07 working certificates
        uses: actions/upload-artifact@v4
        with:
          name: stage33-07-br2a-working
          path: |
            stages/stage33/33-07/j2-endpoint-q2-pullback.json
            stages/stage33/33-07/j2-q2-magma-stdout.txt
            stages/stage33/33-07/integration-prefix.json
            stages/stage33/33-07/br0b-boundary-raw-residue-map.json
