name: Stage33-07 BR2A integration regression

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/**'
      - 'stages/stage33/controller.json'
      - '.github/workflows/stage33-07-br2a-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Cheap latest-commit gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        shell: bash
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo 'run=false' >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "${{ github.event_name }}" == pull_request ]] || exit 0
          [[ "$ACTION" == synchronize ]] || exit 0
          [[ -n "$BEFORE" && -n "$HEAD" ]] || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || true
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          files="$(git diff --name-only "$BEFORE" "$HEAD")"
          printf '%s\n' "$files"
          if grep -Eq '^(stages/stage33/33-07/|stages/stage33/controller\.json$|\.github/workflows/stage33-07-br2a-integration\.yml$)' <<<"$files"; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  br2a-integration:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact integer algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Recheck retained J2 endpoint pullback and nonconstancy
        working-directory: stages/stage33/33-07
        run: |
          python probe_j2_endpoint_q2.py
          python scan_j2_endpoint_q2_variation.py
      - name: Recheck retained BR0B BR0G integration prefix
        working-directory: stages/stage33/33-07
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python assemble_integration_prefix_v2.py
          python materialize_br0b_boundary_residue_map.py
          python validate_retained_br0g_finite.py
          python certify_full_br0b_boundary_injection.py
      - name: Materialize exact arithmetic HS repair quotient and odd-primary closure
        working-directory: stages/stage33/33-07
        run: |
          python materialize_arithmetic_hs_descent_problem.py
          python certify_proper_brauer_odd_invariants_zero.py
      - name: Recheck exact coordinate-K3 index512 glue reduction
        working-directory: stages/stage33/33-07
        run: python certify_coordinate_k3_transcendental_glue_index.py
      - name: Validate retained compact endpoint discriminant form and V4 action
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import hashlib,json
          x=json.load(open('picard-discriminant-compact.json'))
          h=x.pop('canonical_sha256')
          assert hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()==h
          assert h=='4ca7567205455175a5f9bef7a74bc9ec31cd68f831aec60aa88a637b5c0cfdf0'
          assert x['discriminant_moduli']==[2]*4+[4]*6+[8]*4
          assert abs(x['picard_determinant'])==2**28
          assert x['mixed_action_well_defined']
          assert x['cc_ct_involutions_and_commute']
          assert x['cc_ct_preserve_discriminant_quadratic_form']
          assert not x['actual_index512_k3_glue_identified']
          print('PICARD_DISCRIMINANT_COMPACT_RETAINED=PASS')
          PY
      - name: Certify exact V4-fixed target discriminant module
        working-directory: stages/stage33/33-07
        run: python certify_target_discriminant_v4_fixed_module.py
      - name: Derive exact proper geometric Br2 V4 module
        working-directory: stages/stage33/33-07
        run: python certify_proper_brauer2_from_discriminant.py
      - name: Certify explicit two-primary boundary-residue invariant basis
        working-directory: stages/stage33/33-07
        run: python certify_two_primary_residue_invariant_basis.py
      - name: Validate rejected historical global-presentation route stays firewalled
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import json
          h=json.load(open('arithmetic-hs-descent-problem.json'))
          a=json.load(open('audit-state.json'))
          assert h['arithmetic_hs_obstruction_package']['blanket_global_gersten_surjectivity_used'] is False
          assert h['arithmetic_hs_obstruction_package']['semilocal_panin_zainoulline_promoted_to_global_sections'] is False
          assert h['exact_reduction']['stage33_07_complete_global_inventory_still_unproved'] is True
          assert h['unit_status']=='RUNNING_REPAIR'
          assert a['unit_status']=='BLOCKED_NEW_KERNEL' and not a['unit_closed']
          print('HISTORICAL_GLOBAL_PRESENTATION_FIREWALL=PASS')
          PY
      - name: Validate retained mathematics and conservative repair state
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import json
          r=json.load(open('br0b-boundary-raw-residue-map.json'))
          f=json.load(open('br0g-finite-ramified-residue-presentation.json'))
          g=json.load(open('full-br0b-boundary-injection.json'))
          s=json.load(open('j2-endpoint-q2-variation.json'))
          h=json.load(open('arithmetic-hs-descent-problem.json'))
          o=json.load(open('proper-brauer-odd-invariants-zero.json'))
          k=json.load(open('coordinate-k3-transcendental-glue-index.json'))
          v=json.load(open('target-discriminant-v4-fixed-module.json'))
          b2=json.load(open('proper-brauer2-from-discriminant.json'))
          ib=json.load(open('two-primary-residue-invariant-basis.json'))
          a=json.load(open('audit-state.json'))
          hand=json.load(open('handoff.json'))
          ctl=json.load(open('../controller.json'))
          assert r['induced_left_filtration_boundary_map_injective']
          assert f['finite_ramified_boundary_residue_module']=='(Z/2)^49 direct_sum (Z/4)^12'
          assert g['full_br0b_boundary_map_injective'] and g['br0b_all_primary_classes_accounted']
          assert s['evaluation_nonconstant_on_endpoint_Q2_locus_certified']
          q=h['boundary_candidates_not_yet_promoted_to_global_q_classes']['finite_ramified_after_u44']
          assert q['exact_unknown_quotient']=='(Z/2)^23 direct_sum (Z/4)^3'
          assert q['minimal_invariant_factor_generators']==26
          assert h['geometric_lift_fiber']['proper_transcendental_rank']==14
          assert h['arithmetic_hs_obstruction_package']['blanket_global_gersten_surjectivity_used'] is False
          assert o['proper_geometric_brauer_odd_galois_invariants_zero'] and o['repair_reduced_to_two_primary']
          assert k['integral_glue']['index_T_over_L0']==512 and k['integral_glue']['index_v2']==9
          assert not k['integral_glue']['actual_glue_subgroup_identified']
          assert v['joint_v4_fixed_subgroup_exact']=='(Z/2)^5 direct_sum (Z/4)^3 direct_sum Z/8'
          assert v['proper_Br4_identification_claimed'] is False
          assert b2['equivariant_identification']=='T/2T ~= A_T[2] via x mod 2T -> x/2 mod T'
          assert b2['proper_Br2_joint_v4_fixed_dimension_f2']==10
          assert b2['finite_v4_H1_proper_Br2']['H1_dimension_f2']==16
          assert b2['finite_v4_H1_proper_Br2']['absolute_H1_identified_with_finite_H1'] is False
          assert not b2['order2_boundary_residual_promoted_to_global_q_classes']
          assert ib['diagnostic_quotient_exact']=='(Z/2)^23 direct_sum (Z/4)^3'
          assert ib['minimal_invariant_factor_generator_count']==26
          assert ib['invariant_factor_counts']=={'order2':23,'order4':3}
          assert ib['exact_checks']['D_equals_S_M_T']
          assert ib['exact_checks']['T_T_inverse_equals_identity']
          assert not ib['arithmetic_localization_connecting_map_computed']
          assert not ib['absolute_H1_identified_with_finite_V4_H1']
          assert not ib['boundary_residual_promoted_to_global_q_classes']
          assert not ib['actual_index512_k3_glue_identified']
          assert not ib['arithmetic_HS_closed']
          assert a['unit_status']=='BLOCKED_NEW_KERNEL' and not a['unit_closed'] and not a['downstream_released']
          assert hand['stage33_progress']=='6/11' and not hand['stage33_08_released']
          assert hand['repair_exact_reduction']['finite_boundary_quotient_after_u44']=='(Z/2)^23 direct_sum (Z/4)^3'
          assert hand['repair_exact_reduction']['minimal_invariant_factor_generators']==26
          assert not hand['repair_exact_reduction']['arithmetic_localization_connecting_map_computed']
          assert ctl['stage33_progress']=='6/11'
          assert ctl['stage33_07']['unit_status']=='BLOCKED_NEW_KERNEL'
          assert ctl['stage33_07']['repair_reduced_to_two_primary']
          assert ctl['stage33_07']['two_primary_residue_invariant_factor_generator_count']==26
          assert not ctl['stage33_07']['arithmetic_hs_d2_computed']
          assert not ctl['stage33_08_released'] and not ctl['stage33_09_released']
          print('STAGE33_07_RETAINED_MATH=PASS')
          print('HS_FINITE_UNKNOWN=(Z/2)^23+(Z/4)^3')
          print('HS_FINITE_UNKNOWN_GENERATORS=26')
          print('K3_PULLBACK_LATTICE=<8>^10+<16>^4')
          print('K3_GLUE_INDEX=512')
          print('TARGET_DISC_V4_FIXED=(Z/2)^5+(Z/4)^3+Z/8')
          print('PROPER_BR2_V4_FIXED_DIM=10')
          print('FINITE_V4_H1_PROPER_BR2_DIM=16')
          print('ORDER2_GLUE_DEPENDENCY_REMOVED=True')
          print('TWO_PRIMARY_RESIDUE_INVARIANT_BASIS=Z2^23+Z4^3')
          print('TWO_PRIMARY_RESIDUE_INVARIANT_GENERATORS=26')
          print('ACTUAL_GLUE_IDENTIFIED=False')
          print('STAGE33_PROGRESS=6/11')
          PY
      - name: Upload compact repair certificates
        uses: actions/upload-artifact@v4
        with:
          name: stage33-07-br2a-hs-repair
          retention-days: 3
          path: |
            stages/stage33/33-07/j2-endpoint-q2-pullback.json
            stages/stage33/33-07/j2-endpoint-q2-variation.json
            stages/stage33/33-07/br0b-boundary-raw-residue-map.json
            stages/stage33/33-07/br0g-finite-ramified-residue-presentation.json
            stages/stage33/33-07/full-br0b-boundary-injection.json
            stages/stage33/33-07/arithmetic-hs-descent-problem.json
            stages/stage33/33-07/proper-brauer-odd-invariants-zero.json
            stages/stage33/33-07/kb-picard-lattice.json
            stages/stage33/33-07/kc-picard-lattice.json
            stages/stage33/33-07/coordinate-k3-transcendental-glue-index.json
            stages/stage33/33-07/picard-discriminant-compact.json
            stages/stage33/33-07/target-discriminant-v4-fixed-module.json
            stages/stage33/33-07/proper-brauer2-from-discriminant.json
            stages/stage33/33-07/two-primary-residue-invariant-basis.json
            stages/stage33/33-07/audit-state.json
            stages/stage33/33-07/handoff.json
