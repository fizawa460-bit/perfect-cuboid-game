name: Stage33 V91C1X R5B3B3C4A tame-residue parity materialize

on:
  push:
    branches:
      - stage33-v91c1x-r5b2d0-swap23-source-lock
    paths:
      - stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4a_tame_residue_parity_and_cross_carrier_preflight.py
      - .github/workflows/stage33-v91c1x-r5b3b3c4a-tame-residue-parity-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact materializer dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Materialize C4A exact preflight
        shell: bash
        run: |
          set +e
          python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4a_tame_residue_parity_and_cross_carrier_preflight.py --write > /tmp/c4a.log 2>&1
          rc=$?
          cat /tmp/c4a.log
          if [ "$rc" -ne 0 ]; then
            cp /tmp/c4a.log stages/stage33/33-12/e3-v91c1x-r5b3b3c4a-debug.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add stages/stage33/33-12/e3-v91c1x-r5b3b3c4a-debug.txt
            git commit -m '[Stage33] update R5B3B3C4A materializer diagnostic'
            git push
            exit "$rc"
          fi
      - name: Enforce bounded generated delta
        shell: bash
        run: |
          set -euo pipefail
          expected='stages/stage33/33-12/e3-v91c1x-r5b3b3c4a-tame-residue-parity-and-cross-carrier-preflight.json'
          changed="$(git status --porcelain | sed -E 's/^.. //' || true)"
          test "$changed" = "$expected"
          git diff --check
      - name: Commit generated artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage33/33-12/e3-v91c1x-r5b3b3c4a-tame-residue-parity-and-cross-carrier-preflight.json
          git commit -m '[Stage33] materialize R5B3B3C4A tame-residue parity preflight'
          git push
