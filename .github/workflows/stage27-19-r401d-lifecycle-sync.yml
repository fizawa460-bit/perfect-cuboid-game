name: Stage27-19-r401d lifecycle sync runner

on:
  push:
    branches:
      - agent/stage27-19-r401d-r501-r502-calibration

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[lifecycle-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-19-r401d-r501-r502-calibration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply canonical lifecycle sync
        run: python stages/stage27/27-19-r401d/lifecycle_sync.py
      - name: Verify sync helper output
        run: |
          python -m json.tool stages/stage27/27-controller.json >/dev/null
          python stages/stage27/27-19-r401d/verify_27_19_r401d.py
          git diff --check
      - name: Commit synchronized canonical state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage27/27-controller.json docs/00_CURRENT_RESEARCH_STATUS.md stages/stage27/27-19-r401d/verify_27_19_r401d.py
          if git diff --cached --quiet; then
            echo 'No lifecycle changes required.'
          else
            git commit -m 'Stage27-19-r401d canonical lifecycle sync [lifecycle-sync]'
            git push origin HEAD:agent/stage27-19-r401d-r501-r502-calibration
          fi
