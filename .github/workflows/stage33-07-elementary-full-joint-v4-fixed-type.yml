name: Stage33-07 elementary full joint V4 fixed type

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/**'
      - '.github/workflows/stage33-07-elementary-full-joint-v4-fixed-type.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  elementary-full-joint-v4-fixed-type:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: stages/stage33/33-07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact integer algebra dependency
        run: python -m pip install --disable-pip-version-check --no-input sympy==1.14.0
      - name: Materialize H0 regression prerequisite
        run: python certify_elementary_index512_glue_candidate.py
      - name: Recompute structural reduction prerequisite
        run: python certify_elementary_index512_structural_reduction.py
      - name: Recompute complete ct fixed-type prerequisite
        run: python certify_elementary_index512_full_ct_fixed_type_reduction.py
      - name: Recompute forced V4 commutator prerequisite
        run: python certify_elementary_index512_forced_commutator_reduction.py
      - name: Certify canonical full joint V4 fixed-subgroup reduction
        run: python certify_elementary_index512_full_joint_v4_fixed_type_reduction_v2.py
      - name: Enforce conservative Stage33-07 firewall
        run: |
          python - <<'PY'
          import json
          x=json.load(open('elementary-index512-full-joint-v4-fixed-type-reduction.json'))
          assert x['schema']=='STAGE33_07_ELEMENTARY_INDEX512_FULL_JOINT_V4_FIXED_TYPE_REDUCTION_V2'
          assert x['before_full_joint_v4']==17024
          assert x['raw_global_scaled_cc_ct_pair_count']==131072
          assert x['global_joint_relation_pair_type_count']==8
          assert x['raw_multiplicity_per_relation_pair_type']==16384
          assert x['matching_relation_type_count_per_H_census']=={'0':8832,'8':8192}
          assert x['elementary_candidates_after_full_joint_v4_fixed_type_total']==8192
          assert x['survivors_match_target_joint_type_for_all_131072_raw_action_pairs']
          assert not x['all_elementary_order512_glue_rejected']
          assert not x['actual_index512_glue_identified']
          assert not x['simultaneous_endpoint_cc_ct_action_conjugacy_certified']
          assert x['unit_status']=='RUNNING_REPAIR'
          assert x['stage33_progress']=='6/11'
          assert not x['stage33_08_released']
          assert not x['theorem_credit']
          assert not x['endpoint_credit']
          print('ELEMENTARY_INDEX512_FULL_JOINT_V4_FIXED_TYPE_REDUCTION=PASS_EXACT')
          print('SURVIVOR_CENSUS=8192')
          print('STAGE33_08_RELEASED=False')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-elementary-full-joint-v4-fixed-type
          path: stages/stage33/33-07/elementary-index512-full-joint-v4-fixed-type-reduction.json
          retention-days: 5
