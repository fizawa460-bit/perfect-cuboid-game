name: StructureRadar batch 06 PR finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'structure-radar-deep-corpus-batch-06'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: structure-radar-deep-corpus-batch-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and run batch logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/structure-radar-batch-06-finalize.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          body = src.split(start, 1)[1].split(end, 1)[0]
          lines = []
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/structure_radar_batch_06.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/structure_radar_batch_06.py
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python scripts/verify_research_arsenal.py
          git diff --check
          rm .github/workflows/structure-radar-batch-06-finalize.yml
          rm .github/workflows/structure-radar-batch-06-pr-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/structure-radar .github/workflows/structure-radar-batch-06-finalize.yml .github/workflows/structure-radar-batch-06-pr-finalize.yml
          git commit -m 'StructureRadar: review deep corpus batch 06'
          git push origin HEAD:structure-radar-deep-corpus-batch-06
