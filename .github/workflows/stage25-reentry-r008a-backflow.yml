name: Stage25 reentry r008a directional backflow

on:
  pull_request:
    paths:
      - 'stages/stage25/25-reentry-r008a/**'
      - 'stages/stage19/post-stage25-50-supersession.md'
      - 'stages/stage23/post-stage25-r01/result.md'
      - 'stages/stage24/post-stage25-r01/result.md'
      - 'stages/stage25/25-reentry-controller.json'
      - 'stages/stage25/scripts/verify_25_reentry_controller.py'
      - 'stages/stage25/25-reentry-20/verify_phase20.py'
      - 'docs/00_CURRENT_RESEARCH_STATUS.md'
      - '.github/workflows/stage25-reentry-r008a-backflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r008a-backflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage25 reentry r008a directional backflow
        run: python stages/stage25/25-reentry-r008a/verify_r008a.py
