name: StructureRadar batch23 analysis helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  analyze:
    if: github.head_ref == 'structure-radar-deep-corpus-batch-23'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-23
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build batch23 review report
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from collections import Counter

          root = Path('.')
          progress = json.loads(Path('docs/structure-radar/progress.json').read_text())
          registry = json.loads(Path('docs/structure-radar/structure-registry.json').read_text())
          sources=[]
          for p in sorted(Path('docs/structure-radar/source-manifest').glob('part-*.json')):
              sources += json.loads(p.read_text()).get('sources',[])
          path_by_id={s['source_id']:s['path'] for s in sources}
          id_by_path={s['path']:s['source_id'] for s in sources}
          new=[s for s in sources if s.get('queue_group')=='STAGE14_15_DEEP_CORPUS' and s.get('review_state') in ('NEW','CHANGED','UNRESOLVED')]
          new.sort(key=lambda s:(s.get('priority',99),s['path']))
          batch=new[:60]
          reviews=progress.get('source_reviews',{})

          structs = registry.get('structures') or registry.get('cards') or []
          if isinstance(structs, dict):
              structs=list(structs.values())
          def flat(x):
              if isinstance(x,dict): return ' '.join(flat(v) for v in x.values())
              if isinstance(x,list): return ' '.join(flat(v) for v in x)
              return str(x)
          def toks(text):
              return {t.lower() for t in re.findall(r'[A-Za-z][A-Za-z0-9_-]{2,}', text) if t.lower() not in {'stage14','stage15','result','summary','audit','json','data','stage'}}
          card_text=[]
          for c in structs:
              cid=c.get('structure_id') or c.get('id') or c.get('card_id')
              if cid:
                  card_text.append((cid, flat(c), toks(flat(c))))

          out=[]
          for s in batch:
              path=s['path']; p=Path(path)
              try: txt=p.read_text(errors='replace')
              except Exception: txt=''
              explicit=sorted(set(re.findall(r'SR-STR-\d{3}',txt)))
              producer=None
              m=re.search(r'/data/(14-[^/]+)/',path)
              if m: producer=m.group(1)
              lineage=[]
              if producer:
                  cand_paths=[
                    f'stages/stage14/tasks/{producer}/result.md',
                    f'stages/stage14/archive/tasks/{producer}/result.md',
                  ]
                  for cp in cand_paths:
                      sid=id_by_path.get(cp)
                      if sid and sid in reviews:
                          lineage += reviews[sid].get('structure_ids',[])
              stage_refs=sorted(set(re.findall(r'\b14-[A-Za-z0-9][A-Za-z0-9_-]*\b',txt)))[:30]
              ref_lineage=[]
              for r in stage_refs:
                  for cp in (f'stages/stage14/tasks/{r}/result.md',f'stages/stage14/archive/tasks/{r}/result.md'):
                      sid=id_by_path.get(cp)
                      if sid and sid in reviews:
                          ref_lineage += reviews[sid].get('structure_ids',[])
              qt=toks(path+' '+txt[:12000])
              scored=[]
              for cid,ct,tt in card_text:
                  overlap=len(qt & tt)
                  if overlap:
                      bonus=3 if cid in explicit else 0
                      bonus += 2 if cid in lineage else 0
                      bonus += 1 if cid in ref_lineage else 0
                      scored.append((overlap+bonus,cid,sorted(qt&tt)[:12]))
              scored.sort(reverse=True)
              # compact machine-readable hints
              parsed=None
              if p.suffix=='.json':
                  try: parsed=json.loads(txt)
                  except Exception: pass
              keys=[]
              flags={}
              if isinstance(parsed,dict):
                  keys=list(parsed.keys())[:30]
                  for k,v in parsed.items():
                      kl=k.lower()
                      if isinstance(v,(bool,int,float,str)) and any(z in kl for z in ['proved','status','verdict','gate','saving','power','bound','exponent','result','decision']):
                          flags[k]=v
              out.append({
                'source_id':s['source_id'],'path':path,'kind':s.get('kind'),'producer':producer,
                'explicit_cards':explicit,'producer_lineage':sorted(set(lineage)),
                'referenced_stages':stage_refs,'referenced_stage_lineage':sorted(set(ref_lineage)),
                'top_candidates':[{'score':a,'card':b,'terms':c} for a,b,c in scored[:10]],
                'json_keys':keys,'flags':flags,
                'preview':' '.join(txt[:1200].split())
              })
          report={'batch_size':len(batch),'remaining_before':len(new),'sources':out,
                  'next_after_batch': new[60]['source_id'] if len(new)>60 else None,
                  'next_after_path': new[60]['path'] if len(new)>60 else None}
          Path('docs/structure-radar/.batch23-analysis.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/structure-radar/.batch23-analysis.json
          git commit -m "Build StructureRadar batch23 analysis report"
          git push origin HEAD:structure-radar-deep-corpus-batch-23
