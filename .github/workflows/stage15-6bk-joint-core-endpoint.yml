name: Stage15-6bk joint core endpoint audit
on:
  pull_request:
    paths:
      - 'stages/stage15/15-6bk/**'
      - 'stages/stage15/evidence/stage15_6bk_joint_core_endpoint.json'
      - 'stages/stage15/replay/verify_stage15_6bk.py'
      - 'stages/stage15/scripts/stage15_6bk_joint_core_endpoint.py'
      - '.github/workflows/stage15-6bk-joint-core-endpoint.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python stages/stage15/replay/verify_stage15_6bk.py
      - run: python -m py_compile stages/stage15/scripts/stage15_6bk_joint_core_endpoint.py
