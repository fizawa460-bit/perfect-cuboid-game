name: Stage32 residual32-01 full178 production

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/residual-32-01-production/run_full178_prefix_work_unit.py'
      - 'stages/stage32/runkeys/residual32-01-full178-production.json'
      - '.github/workflows/stage32-residual32-01-full178-production.yml'
      - 'stages/stage32/residual-32-01-production/full178-manifest.json'
      - 'stages/stage32/residual-32-01-production/full178-production-preflight.json'
      - 'stages/stage32/residual-32-01-production/full178-wave128-preflight.json'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      matrix: ${{ steps.gate.outputs.matrix }}
      generation: ${{ steps.gate.outputs.generation }}
      work_unit_count: ${{ steps.gate.outputs.work_unit_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Reverify hostile-audited cold preflight
        run: python stages/stage32/residual-32-01-production/verify_full178_preflight.py
      - name: Verify 128-unit wave / 17-runner operational preflight
        run: |
          python - <<'PY'
          import json
          p='stages/stage32/residual-32-01-production/full178-wave128-preflight.json'
          x=json.load(open(p))
          assert x['schema']=='STAGE32_RESIDUAL32_01_FULL178_WAVE128_CONCURRENCY17_PREFLIGHT_V1'
          assert x['scope']=='OPERATIONAL_WAVE_EXPANSION_ONLY_NO_MATHEMATICAL_SEMANTICS_CHANGE'
          assert x['source_and_math_contract_unchanged'] is True
          assert x['runner_schema']=='STAGE32_RESIDUAL32_01_FULL178_PREFIX_WORK_UNIT_V2'
          assert x['nodes_used_accounting']=='SUM_TELEMETRY_NODES_V2'
          assert x['node_ceiling_per_work_unit']==64000000
          assert x['max_work_units_per_wave']==128
          assert x['full178_heavy_concurrency']==17
          assert x['other_stage32_heavy_overlap_bound']==1
          assert x['maximum_effective_stage32_heavy_overlap']==18
          assert x['hard_stage_cap']==18
          assert x['stage_cap_pass'] is True
          assert x['storage_safe_under_operating_budget'] is True
          assert x['unknown_is_unsat'] is False
          assert x['fresh_runkey_only_authorization_required'] is True
          assert x['B18_RELEASE_AUTHORIZED'] is False
          assert x['THEOREM_CREDIT'] is False and x['RECEIVER_CREDIT'] is False
          PY
      - id: gate
        name: Verify fresh full178 production run-key arm
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          KEY='stages/stage32/runkeys/residual32-01-full178-production.json'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          echo 'matrix={"work_unit":[]}' >> "$GITHUB_OUTPUT"
          echo 'generation=0' >> "$GITHUB_OUTPUT"
          echo 'work_unit_count=0' >> "$GITHUB_OUTPUT"
          [ "$ACTION" = synchronize ] || exit 0
          [ -n "${BEFORE:-}" ] || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || exit 0
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          mapfile -t changed < <(git diff --name-only "$BEFORE" "$HEAD")
          [ "${#changed[@]}" -eq 1 ] || exit 0
          [ "${changed[0]}" = "$KEY" ] || exit 0
          python - "$BEFORE" "$KEY" "$GITHUB_OUTPUT" <<'PY'
          import hashlib, json, subprocess, sys
          before, key, output = sys.argv[1:]
          old = json.loads(subprocess.check_output(['git','show',f'{before}:{key}'], text=True))
          new = json.load(open(key))
          assert old['schema'] == new['schema'] == 'STAGE32_RESIDUAL32_01_FULL178_PRODUCTION_RUNKEY_V1'
          assert old['workload'] == new['workload'] == 'FULL178_EXACT_PAIRING_PREFIX_PRODUCTION'
          assert int(new['generation']) == int(old['generation']) + 1
          assert new['armed'] is True
          assert new['manifest_sha256'] == '46809e2cb9851434b56778369beac131771902c026f10d49b2c0328680383e23'
          assert new['hostile_reaudit_review_id'] == 5057163230
          assert new['prefix_stage_only'] is True
          assert int(new['first_pass_node_ceiling']) == 64000000
          assert int(new['effective_heavy_concurrency']) == 17
          assert int(new['effective_heavy_concurrency']) <= 18
          assert float(new['projected_peak_artifact_mb']) < 500
          assert new['FULL178_HEAVY_PRODUCTION_AUTHORIZED'] is True
          assert new['FULL_178_ROW_SWEEP_AUTHORIZED'] is True
          assert new['B18_RELEASE_AUTHORIZED'] is False
          assert new['THEOREM_CREDIT'] is False
          assert new['RECEIVER_CREDIT'] is False

          manifest = json.load(open('stages/stage32/residual-32-01-production/full178-manifest.json'))
          row_ids = {row for rows in manifest['m_class_rows'].values() for row in rows}
          labels = [95,99,103,102,49,97,94,101,93,98,96]

          def digest(v):
              return hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':')).encode()).hexdigest()

          def parse_row(row_id):
              assert row_id in row_ids
              g,d = row_id.split('-')
              return int(g[1:]), int(d[1:])

          def verify_unit(u):
              assert isinstance(u, dict)
              kind = u['kind']; row_id = u['row_id']
              genus, degree = parse_row(row_id)
              emin = 8 if genus == 0 else 4
              emax = (19 * degree) // 5
              if kind == 'ROW_TAIL':
                  base = {'kind':kind,'row_id':row_id,'e_start':int(u['e_start'])}
                  assert emin <= base['e_start'] <= emax
              elif kind == 'STRATUM_PARTITION':
                  e = int(u['e']); prefix = [int(v) for v in u.get('prefix',[])]
                  lo = int(u['next_min']); hi = int(u['next_max'])
                  assert emin <= e <= emax
                  assert len(prefix) < len(labels)
                  assert all(v >= 0 for v in prefix)
                  exceptional = sum(v for label,v in zip(labels,prefix) if label > 92)
                  normal = sum(v for label,v in zip(labels,prefix) if label <= 92)
                  assert exceptional <= e
                  normal_mass = 19 * degree - 5 * e
                  assert normal <= normal_mass
                  next_label = labels[len(prefix)]
                  upper = e - exceptional if next_label > 92 else normal_mass - normal
                  assert 0 <= lo <= hi <= upper
                  base = {'kind':kind,'row_id':row_id,'e':e,'prefix':prefix,'next_min':lo,'next_max':hi}
              else:
                  raise AssertionError(kind)
              expected = 'wu-' + digest(base)[:20]
              assert u.get('work_unit_id') == expected
              return base | {'work_unit_id': expected}

          units = [verify_unit(u) for u in new['work_units']]
          assert 1 <= len(units) <= 128
          assert len({u['work_unit_id'] for u in units}) == len(units)
          matrix = json.dumps({'work_unit': units}, separators=(',', ':'))
          with open(output, 'a') as f:
              f.write('authorized=true\n')
              f.write('matrix=' + matrix + '\n')
              f.write('generation=' + str(new['generation']) + '\n')
              f.write('work_unit_count=' + str(len(units)) + '\n')
          PY

  produce:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix: ${{ fromJSON(needs.authorize.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WORK_UNIT_JSON: ${{ toJSON(matrix.work_unit) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Execute one fail-closed prefix-production work unit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage32-full178"
          UNIT_ID=$(python -c 'import json,os; print(json.loads(os.environ["WORK_UNIT_JSON"])["work_unit_id"])')
          OUT="$RUNNER_TEMP/stage32-full178/${UNIT_ID}.json"
          python stages/stage32/residual-32-01-production/run_full178_prefix_work_unit.py \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --work-unit-json "$WORK_UNIT_JSON" \
            --node-limit 64000000 \
            --output "$OUT"
          python - "$OUT" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1]); x=json.loads(p.read_text())
          assert x['schema']=='STAGE32_RESIDUAL32_01_FULL178_PREFIX_WORK_UNIT_V2'
          assert x['nodes_used_accounting']=='SUM_TELEMETRY_NODES_V2'
          assert x['nodes_used']==sum(int(t['nodes']) for t in x['telemetry'])
          assert 0 <= x['nodes_used'] <= x['node_limit'] == 64000000
          assert x['prefix_stage_only'] is True
          assert x['unknown_is_unsat'] is False
          assert x['numerical_row_complete'] is False
          assert x['FULL_D176_D192_NUMERICAL_ORBIT_CENSUS'] is False
          assert x['R29_LG2']=='NOT_DISCHARGED'
          assert x['B18_RELEASE_AUTHORIZED'] is False
          assert x['THEOREM_CREDIT'] is False and x['RECEIVER_CREDIT'] is False
          assert p.stat().st_size <= 16*1024, p.stat().st_size
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-full178-wave-${{ needs.authorize.outputs.generation }}-${{ matrix.work_unit.work_unit_id }}
          path: ${{ runner.temp }}/stage32-full178/*.json
          retention-days: 3
          if-no-files-found: error

  aggregate:
    needs: [authorize, produce]
    if: needs.authorize.outputs.authorized == 'true' && needs.produce.result == 'success'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_COUNT: ${{ needs.authorize.outputs.work_unit_count }}
      GENERATION: ${{ needs.authorize.outputs.generation }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-full178-wave-${{ needs.authorize.outputs.generation }}-wu-*
          path: ${{ runner.temp }}/stage32-full178-aggregate
          merge-multiple: true
      - name: Build compact wave manifest
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'stage32-full178-aggregate'
          files=sorted(root.glob('*.json'))
          expected=int(os.environ['EXPECTED_COUNT'])
          assert 1 <= expected <= 128
          assert len(files)==expected, (len(files), expected)
          work=[]; children=[]
          for p in files:
              x=json.loads(p.read_text())
              assert x['schema']=='STAGE32_RESIDUAL32_01_FULL178_PREFIX_WORK_UNIT_V2'
              assert x['nodes_used']==sum(int(t['nodes']) for t in x['telemetry'])
              work.append({'work_unit_id':x['input_work_unit']['work_unit_id'],'row_id':x['row_id'],
                           'nodes_used':x['nodes_used'],
                           'completed_prefix_partitions':len(x['completed_prefix_partitions']),
                           'unknown_count':x['unknown_count'],
                           'certificate_sha256':x['canonical_sha256_without_this_field']})
              children.extend(x['unresolved_exact_child_work_units'])
          payload={'schema':'STAGE32_RESIDUAL32_01_FULL178_PREFIX_WAVE_MANIFEST_V3',
                   'generation':int(os.environ['GENERATION']),'input_work_unit_count':expected,
                   'work_units':sorted(work,key=lambda v:v['work_unit_id']),
                   'total_nodes_used':sum(v['nodes_used'] for v in work),
                   'next_exact_work_units':children,
                   'prefix_stage_only':True,'unknown_is_unsat':False,
                   'FULL_D176_D192_NUMERICAL_ORBIT_CENSUS':False,
                   'R29_LG2':'NOT_DISCHARGED','THEOREM_CREDIT':False,'RECEIVER_CREDIT':False}
          raw=json.dumps(payload,sort_keys=True,separators=(',',':')).encode()
          payload['canonical_sha256_without_this_field']=hashlib.sha256(raw).hexdigest()
          out=root/'wave-manifest.json'; out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          assert out.stat().st_size < 1024*1024
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-full178-wave-${{ needs.authorize.outputs.generation }}-manifest
          path: ${{ runner.temp }}/stage32-full178-aggregate/wave-manifest.json
          retention-days: 7
          if-no-files-found: error
