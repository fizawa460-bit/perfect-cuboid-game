name: Stage33-07 Q automorphism delta_loc intertwiner

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/certify_q_automorphism_intertwiner_space_for_delta_loc.py'
      - 'stages/stage33/33-07/stoll_cuboid_source.py'
      - 'stages/stage33/33-07/materialize_order2_first_residue_functions.py'
      - 'stages/stage33/33-07/materialize_order2_localization_receiver.py'
      - 'stages/stage33/33-07/two-primary-residue-invariant-basis.json'
      - 'stages/stage33/33-07/proper-brauer2-from-discriminant.json'
      - 'stages/stage33/33-07/br0b-boundary-raw-residue-map.json'
      - 'stages/stage33/33-07/br0g-finite-ramified-residue-presentation.json'
      - 'stages/stage33/33-07/exceptional-p1-tangent-coordinates.json'
      - '.github/workflows/stage33-07-q-automorphism-delta-loc-intertwiner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact integer algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Reproduce exact finite localization receiver
        working-directory: stages/stage33/33-07
        run: python materialize_order2_localization_receiver.py
      - name: Compute Q-automorphism intertwiner space
        working-directory: stages/stage33/33-07
        run: python certify_q_automorphism_intertwiner_space_for_delta_loc.py
      - name: Validate exact naturality reduction and firewall
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import hashlib,json
          p='q-automorphism-delta-loc-intertwiner-space.json'
          x=json.load(open(p)); h=x.pop('canonical_sha256')
          assert h==hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          n=x['naturality_statement']
          assert n['generator_count']==8
          assert n['all_generators_preserve_the_24_physical_side_curves_and_48_exceptional_curves']
          assert n['all_generators_commute_with_V4_galois_action']
          f=x['final_intertwiner']
          assert f['ambient_matrix_space_dimension_f2']==416
          assert f['naturality_constraint_rank_f2'] + f['intertwiner_dimension_f2'] == 416
          e=x['exact_consequence']
          assert e['all_26_source_columns_treated_uniformly']
          assert e['arbitrary_endpoint_compatible_extension_dimension_f2_before_naturality']==416
          assert e['remaining_extension_ambiguity_dimension_f2_after_q_automorphism_naturality']==f['intertwiner_dimension_f2']
          assert e['connecting_matrix_columns_explicitly_materialized']==0
          assert not e['middle_gersten_module_action_materialized']
          assert not e['absolute_delta_loc_computed']
          assert not e['project_14x26_L_squareclass_tensor_materialized']
          assert not e['arithmetic_HS_closed']
          assert x['stage33_progress']=='6/11' and not x['stage33_08_released']
          print('STAGE33_07_Q_AUTOMORPHISM_DELTA_LOC_INTERTWINER=PASS')
          print('CERTIFICATE_SHA256='+h)
          print('NATURALITY_CONSTRAINT_RANK_F2='+str(f['naturality_constraint_rank_f2']))
          print('REMAINING_INTERTWINER_DIMENSION_F2='+str(f['intertwiner_dimension_f2']))
          print('FINITE_V4_DELTA_LOC_FORCED_ZERO='+str(f['finite_v4_delta_loc_forced_zero_by_q_automorphism_naturality']).lower())
          print('NEXT='+x['next_exact_leaf'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-q-automorphism-delta-loc-intertwiner
          retention-days: 3
          path: stages/stage33/33-07/q-automorphism-delta-loc-intertwiner-space.json
