name: Stage33-07 Q automorphism delta_loc intertwiner

on:
  # Manual diagnostic only: the public calculator repeatedly returns HTTP 500.
  # Do not restart this remote-CAS path on unrelated PR synchronizations.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact integer algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Reproduce exact finite localization receiver
        working-directory: stages/stage33/33-07
        run: python materialize_order2_localization_receiver.py
      - name: Reuse pinned upstream automorphism and Galois actions
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('certify_q_automorphism_intertwiner_space_for_delta_loc.py')
          s=p.read_text()
          start='_, core, upstream_blob, source_attempt = load_pinned_source()\nextra = r\'\'\''
          a=s.index(start)
          b=s.index('stdout, magma_attempt = run_magma(\n',a)
          replacement=r"""full_source, core, upstream_blob, source_attempt = load_pinned_source()
          auto_start = full_source.index("// The automorphism group (see Proposition 4)")
          auto_end = full_source.index("// Automorphisms + Galois on Pic/2*Pic", auto_start)
          auto_block = full_source[auto_start:auto_end]
          auto_block = "\n".join(
              line for line in auto_block.splitlines()
              if not line.startswith("AutS :=") and not line.startswith('printf "#Aut(S) =')
          ) + "\n"
          tail = r'''
          D, _, V := SmithForm(pmPic);
          diag := [Abs(Integers()!D[j,j]) : j in [1..64]];
          pos := [j : j in [1..64] | diag[j] gt 1];
          mods := [diag[j] : j in pos];
          assert mods eq [2 : j in [1..4]] cat [4 : j in [1..6]] cat [8 : j in [1..4]];
          scales := [m div 2 : m in mods];
          Vin := V^-1;

          function AT2Rows(G)
            B := Vin * Transpose(G^-1) * V;
            rows := [];
            for a in [1..14] do
              row := [];
              for b in [1..14] do
                num := scales[a] * Integers()!B[pos[a],pos[b]];
                assert num mod scales[b] eq 0;
                Append(~row, (num div scales[b]) mod 2);
              end for;
              Append(~rows,row);
            end for;
            return rows;
          end function;

          cc2 := AT2Rows(ccPic); ct2 := AT2Rows(ctPic);
          for a in [1..14] do
            printf "GALCC_ROW_%o=%o\n",a,cc2[a];
            printf "GALCT_ROW_%o=%o\n",a,ct2[a];
          end for;

          selected := [1,2,4,5,6,7,8,9];
          I64 := IdentityMatrix(Integers(),64);
          for z in [1..#selected] do
            idx := selected[z];
            sidep := perms[idx][1..24];
            pointp := [perms[idx][#Cs+j]-#Cs : j in [1..#pts]];
            assert forall{x : x in sidep | 1 le x and x le 24};
            assert Seqset(pointp) eq {1..48};
            G := action[idx];
            assert G*pmPic*Transpose(G) eq pmPic;
            assert G^2 eq I64;
            assert G*ccPic eq ccPic*G and G*ctPic eq ctPic*G;
            rows := AT2Rows(G);
            printf "AUTO_%o_SIDE=%o\n",z,sidep;
            printf "AUTO_%o_POINT=%o\n",z,pointp;
            for a in [1..14] do
              printf "AUTO_%o_AT2_ROW_%o=%o\n",z,a,rows[a];
            end for;
          end for;
          printf "STAGE33_Q_AUTOMORPHISM_DONE\n";
          '''
          code = "SetColumns(0);\nquick := true;\n" + core + "\n" + auto_block + "\n" + tail
          """
          replacement=textwrap.dedent(replacement)
          p.write_text(s[:a]+replacement+s[b:])
          PY
      - name: Compute Q-automorphism intertwiner space
        working-directory: stages/stage33/33-07
        run: python certify_q_automorphism_intertwiner_space_for_delta_loc.py
      - name: Validate exact naturality reduction and firewall
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import hashlib,json
          p='q-automorphism-delta-loc-intertwiner-space.json'
          x=json.load(open(p)); h=x.pop('canonical_sha256')
          assert h==hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          n=x['naturality_statement']
          assert n['generator_count']==8
          assert n['all_generators_preserve_the_24_physical_side_curves_and_48_exceptional_curves']
          assert n['all_generators_commute_with_V4_galois_action']
          f=x['final_intertwiner']
          assert f['ambient_matrix_space_dimension_f2']==416
          assert f['naturality_constraint_rank_f2'] + f['intertwiner_dimension_f2'] == 416
          e=x['exact_consequence']
          assert e['all_26_source_columns_treated_uniformly']
          assert e['arbitrary_endpoint_compatible_extension_dimension_f2_before_naturality']==416
          assert e['remaining_extension_ambiguity_dimension_f2_after_q_automorphism_naturality']==f['intertwiner_dimension_f2']
          assert e['connecting_matrix_columns_explicitly_materialized']==0
          assert not e['middle_gersten_module_action_materialized']
          assert not e['absolute_delta_loc_computed']
          assert not e['project_14x26_L_squareclass_tensor_materialized']
          assert not e['arithmetic_hs_closed']
          assert x['stage33_progress']=='6/11' and not x['stage33_08_released']
          print('STAGE33_07_Q_AUTOMORPHISM_DELTA_LOC_INTERTWINER=PASS')
          print('CERTIFICATE_SHA256='+h)
          print('NATURALITY_CONSTRAINT_RANK_F2='+str(f['naturality_constraint_rank_f2']))
          print('REMAINING_INTERTWINER_DIMENSION_F2='+str(f['intertwiner_dimension_f2']))
          print('FINITE_V4_DELTA_LOC_FORCED_ZERO='+str(f['finite_v4_delta_loc_forced_zero_by_q_automorphism_naturality']).lower())
          print('NEXT='+x['next_exact_leaf'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-q-automorphism-delta-loc-intertwiner
          retention-days: 3
          path: stages/stage33/33-07/q-automorphism-delta-loc-intertwiner-space.json
