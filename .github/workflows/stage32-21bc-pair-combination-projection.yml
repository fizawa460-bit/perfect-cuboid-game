name: Stage32-21bc exact pair-combination projection

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: stage32-21bc-pair-combination-projection-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Project exact small pair combinations
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python certify_stage32_21bc_pair_combination_projection.py \
            --source-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bb-r51-interval-formula.json" \
            --retained "$GITHUB_WORKSPACE/stages/stage33/33-07/picard_base_rows_retained.py" \
            --marking "$GITHUB_WORKSPACE/stages/stage33/33-07/stage32_picard_marking_retained.py" \
            --per-check-timeout-ms 2000 \
            --output "$GITHUB_WORKSPACE/stage32-21bc-pair-combination-projection.json"
      - name: Upload compact exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-21bc-pair-combination-projection
          path: stage32-21bc-pair-combination-projection.json
          retention-days: 3
          compression-level: 9
