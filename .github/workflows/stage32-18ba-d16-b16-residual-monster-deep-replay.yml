name: Stage32-18BA d16 b16 residual monster deep replay

on:
  push:
    branches: [stage32-18ax-b16-remaining-walls-tier3-planner]
    paths: ['stages/stage32/runkeys/18ba-b16-residual-monster-deep-replay.json']

permissions: {contents: read, actions: read}
concurrency: {group: stage32-18ba-b16-residual-monster-deep-replay, cancel-in-progress: true}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: gate
        run: |
          set -euo pipefail
          KEY=stages/stage32/runkeys/18ba-b16-residual-monster-deep-replay.json
          authorized=false
          if git cat-file -e HEAD^\^{commit} 2>/dev/null && [ "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 1 ] && git diff --name-only HEAD^ HEAD | grep -Fxq "$KEY" && [ "$(git log -1 --pretty=%s)" = 'Stage32-18BA: ARM RESIDUAL5 DEEP REPLAY' ]; then
            python - <<'PY'
          import json,pathlib,os,subprocess
          key='stages/stage32/runkeys/18ba-b16-residual-monster-deep-replay.json'
          d=json.loads(pathlib.Path(key).read_text())
          old=json.loads(subprocess.check_output(['git','show','HEAD^:'+key],text=True))
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1' and d['generation']==old['generation']+1==2 and d['armed'] and not old['armed']
          assert d['bound']==16 and d['algorithm']=='pairwise6_parent_stable_deep_replay'
          assert d['planner_probe_budget']==2000000 and d['max_parallel']==4
          assert d['source_exact_artifact_id']==9574308138 and d['source_summary_artifact_id']==9678028840
          walls=d['walls']; assert len(walls)==4 and sum(len(x['residual_ids']) for x in walls)==5
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':walls},separators=(',',':'))+'\n')
          PY
            authorized=true
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"

  solve:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.authorize.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked source and 18AZ summary
        env:
          GH_TOKEN: ${{ github.token }}
          WALL: ${{ matrix.wall }}
          EXPECTED_IDS: ${{ join(matrix.residual_ids, ',') }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++ libboost-dev
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/summary" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/source.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/src"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/summary.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9678028840/zip"
          echo '9ec5ac2a6f8e520f23b96a7e029be264b451b37fdcba211bc61bc96d95f3e4c6  '"$RUNNER_TEMP/summary.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/summary.zip" -d "$RUNNER_TEMP/summary"
          python - <<'PY'
          import json,os,pathlib
          d=json.loads(next((pathlib.Path(os.environ['RUNNER_TEMP'])/'summary').rglob('summary.json')).read_text())
          assert d['schema']=='STAGE32_18AZ_PAIRWISE6_FULL_MONSTER_SUMMARY_V1' and d['monster_total']==172 and d['unresolved_total']==5
          wall=os.environ['WALL']; row=next(x for x in d['walls'] if x['wall']==wall)
          expected=[int(x) for x in os.environ['EXPECTED_IDS'].split(',') if x]
          assert row['unresolved_frontier_ids']==expected
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'work'/'ids.txt').write_text(''.join(f'{x}\n' for x in expected))
          PY
      - name: Build parent-stable pairwise6 certifier
        env: {PRIMARY: '${{ matrix.primary }}'}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/work/cert.cpp"
          python stages/stage32/32-18X/build_two_stage_certifier.py --source "$RUNNER_TEMP/src/d16-exact-symmetry-sharded.cpp" --output "$SRC" --primary-id "$PRIMARY"
          SRC="$SRC" python stages/stage32/32-18AF/patch_symmetry_schedule.py
          SRC="$SRC" PAIRWISE_CAND_LIMIT=6 PAIRWISE_ACTIVATE_BELOW=39 python stages/stage32/32-18AY/patch_pairwise_symmetry.py
          SRC="$SRC" python stages/stage32/32-18AO/patch_block_frontier.py
          SRC="$SRC" python stages/stage32/32-18AP/patch_lower_block_replay.py
          SRC="$SRC" python stages/stage32/32-18AR/patch_frontier_cost_planner.py
          SRC="$SRC" python stages/stage32/32-18AS/patch_selective_frontier_planner.py
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic "$SRC" -o "$RUNNER_TEMP/work/cert"
          cp "$RUNNER_TEMP/src/d16-hperp.txt" "$RUNNER_TEMP/work/"
          cp "$RUNNER_TEMP/src/d16-aut-prefix256-bundle.txt" "$RUNNER_TEMP/work/"
      - name: Deep replay residual parents only
        env:
          SHARD: ${{ matrix.shard }}
          WALL: ${{ matrix.wall }}
        run: |
          set -euo pipefail
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" timeout --signal=TERM --kill-after=20s 45m "$RUNNER_TEMP/work/cert" --input "$RUNNER_TEMP/work/d16-hperp.txt" --bundle "$RUNNER_TEMP/work/d16-aut-prefix256-bundle.txt" --output "$RUNNER_TEMP/out/cert.json" --dump-canonical "$RUNNER_TEMP/out/dump.bin" --bound 16 --shard-id "$SHARD" --shard-count 1024 --split-coordinate 48 --block-cut 39 --frontier-cap 50000 --replay-limit 0 --planner-probe-budget 2000000 --planner-output "$RUNNER_TEMP/out/costs.csv" --planner-id-file "$RUNNER_TEMP/work/ids.txt" --node-cap 12000000 >/dev/null 2>"$RUNNER_TEMP/out/stderr.txt"
          python - <<'PY'
          import csv,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']); rows=list(csv.DictReader((root/'out'/'costs.csv').open())); expected=[int(x) for x in (root/'work'/'ids.txt').read_text().split()]
          assert [int(r['frontier_id']) for r in rows]==expected
          done=sum(r['complete']=='1' for r in rows); unresolved=[int(r['frontier_id']) for r in rows if r['complete']!='1']
          out={'schema':'STAGE32_18BA_RESIDUAL_MONSTER_DEEP_REPLAY_RESULT_V1','algorithm':'pairwise6_parent_stable_deep_replay','wall':os.environ['WALL'],'residual_input_count':len(expected),'completed_count':done,'unresolved_count':len(unresolved),'unresolved_frontier_ids':unresolved,'total_probe_nodes':sum(int(r['probe_nodes']) for r in rows),'probe_budget_per_state':2000000,'runtime_seconds':float((root/'out'/'runtime.txt').read_text().strip()),'parent_cut':39,'parent_partition_stable':True,'D16_B16_NUMERICAL_CREDIT':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False}
          (root/'out'/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          for x in ['cert.json','dump.bin','costs.csv','stderr.txt']:(root/'out'/x).unlink(missing_ok=True)
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18ba-deep-${{ matrix.wall }}
          path: ${{ runner.temp }}/out/
          retention-days: 3
          if-no-files-found: error

  summarize:
    needs: [authorize,solve]
    if: always() && needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-18ba-deep-*
          path: ${{ runner.temp }}/runs
      - run: |
          python - <<'PY'
          import json,os,pathlib
          docs=[json.loads(p.read_text()) for p in (pathlib.Path(os.environ['RUNNER_TEMP'])/'runs').rglob('compact.json')]; assert len(docs)==4,len(docs)
          total=sum(d['residual_input_count'] for d in docs); done=sum(d['completed_count'] for d in docs); unresolved=sum(d['unresolved_count'] for d in docs)
          out={'schema':'STAGE32_18BA_RESIDUAL_MONSTER_DEEP_REPLAY_SUMMARY_V1','residual_total':total,'completed_total':done,'unresolved_total':unresolved,'walls':sorted(docs,key=lambda d:d['wall']),'verdict':'ALL_RESIDUAL5_RESOLVED' if unresolved==0 else 'TRUE_SELECTIVE_CHILD_SPLIT_REQUIRED','next_item':'32-18BB_D16_B16_CLOSE_EVIDENCE' if unresolved==0 else '32-18BB_D16_B16_RESIDUAL_CHILD_SPLIT','D16_B16_NUMERICAL_CREDIT':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False}
          outdir=pathlib.Path(os.environ['RUNNER_TEMP'])/'summary'; outdir.mkdir(); (outdir/'summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18ba-residual-deep-summary
          path: ${{ runner.temp }}/summary/
          retention-days: 7
          if-no-files-found: error
