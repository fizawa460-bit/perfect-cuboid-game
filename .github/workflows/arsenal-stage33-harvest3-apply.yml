name: Arsenal Stage33 Harvest3 apply

on:
  push:
    branches:
      - stage33-arsenal-post1478-harvest-promotion
    paths:
      - '.github/workflows/arsenal-stage33-harvest3-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage33-arsenal-post1478-harvest-promotion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply frozen Harvest2 classification
        run: |
          cat .github/harvest3/patch.part.* > /tmp/apply_h3.py
          python -m py_compile /tmp/apply_h3.py
          python /tmp/apply_h3.py
      - name: Generate and check Arsenal registry outputs
        run: |
          python3 -B docs/arsenal/sync_arsenal_catalog.py
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          git diff --check
      - name: Assert Harvest3 registry semantics and scope
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/arsenal/index.json').read_text())
          h=next(x for x in d['provisional_harvests'] if x['source_stage']=='Stage33')
          assert h['post1478_harvest']['harvest_upper_bound']=='a3c64f5704f3d1fd297e3b95377ba1938d277178'
          assert h['post1478_harvest']['range_expanded_after_harvest1'] is False
          assert h['post1478_harvest']['new_weapon_ids']==['S33-PW09','S33-PW10']
          assert h['post1478_harvest']['extended_ids']==['S33-PW04']
          assert h['active_workflows']==['S33-WF01','S33-WF02']
          assert h['retired_merged_ids']['S33-PW03']=='S33-PW02'
          assert 'S33-PW03' not in h['active_cards']
          assert h['theorem_credit'] is False
          assert h['post1478_harvest']['arsenal_registration_adds_stage33_mathematical_credit'] is False
          for p in ['docs/arsenal/cards/provisional/S33-PW09.md','docs/arsenal/cards/provisional/S33-PW10.md','docs/arsenal/cards/workflows/S33-WF01.md','docs/arsenal/cards/workflows/S33-WF02.md']:
              assert Path(p).is_file(), p
          PY
          bad=$(git diff --name-only | grep -Ev '^(docs/stage33-arsenal-promotion\.md|docs/arsenal/(index\.json|catalog\.md|cards/.*))$' || true)
          if [ -n "$bad" ]; then
            echo "unexpected generated/apply diff:"
            echo "$bad"
            exit 1
          fi
      - name: Commit generated Arsenal implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stage33-arsenal-promotion.md docs/arsenal/index.json docs/arsenal/catalog.md docs/arsenal/cards
          git commit -m 'Arsenal: promote Stage33 post-1478 provisional harvest'
          git push origin HEAD:stage33-arsenal-post1478-harvest-promotion
