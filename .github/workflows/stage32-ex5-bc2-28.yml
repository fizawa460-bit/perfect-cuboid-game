name: Stage32EX5 BC2-28 bounded executor
# lifecycle: TEMPORARY_AUTO — remove immediately after retained BC2-28 result

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage32-ex5/runkeys/bc2-28-boundary38-partition.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_28_boundary38_partition.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-28-residual-p35-leaf-manifest.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-28-boundary38-partition-preflight.json'
      - 'stages/stage32-ex5/MAIN-STATE.json'
      - 'stages/stage32-ex5/verify_main_state.py'
      - '.github/workflows/stage32-ex5-bc2-28.yml'

permissions:
  contents: read

jobs:
  authorize-bc2-28:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: gate
        name: Authorize only fresh BC2-28 generation-1 runkey
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          key=Path('stages/stage32-ex5/runkeys/bc2-28-boundary38-partition.json')
          before=os.environ.get('BEFORE','').strip(); head=os.environ.get('HEAD_SHA','').strip()
          authorized=False; reason='cold'
          if before and head and key.exists():
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',before],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              old_ok=subprocess.run(['git','cat-file','-e',before+'^{commit}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if old_ok:
                  changed=subprocess.check_output(['git','diff','--name-only',before,head],text=True).splitlines()
                  if str(key) in changed:
                      r=json.loads(key.read_text())
                      try:
                          old=json.loads(subprocess.check_output(['git','show',before+':'+str(key)],text=True,stderr=subprocess.DEVNULL))
                          generation_ok=int(r.get('generation',0))>int(old.get('generation',0))
                      except subprocess.CalledProcessError:
                          generation_ok=int(r.get('generation',0))==1
                      source='stages/stage32-ex5/breadth-cycle-2/bc2_28_boundary38_partition.py'
                      manifest='stages/stage32-ex5/breadth-cycle-2/bc2-28-residual-p35-leaf-manifest.json'
                      preflight='stages/stage32-ex5/breadth-cycle-2/bc2-28-boundary38-partition-preflight.json'
                      sb=subprocess.check_output(['git','hash-object',source],text=True).strip()
                      mb=subprocess.check_output(['git','hash-object',manifest],text=True).strip()
                      pb=subprocess.check_output(['git','hash-object',preflight],text=True).strip()
                      a=r.get('audit_consumption',{}); t=r.get('target',{}); ex=r.get('execution',{})
                      authorized=(r.get('schema')=='STAGE32EX5_BC2_28_BOUNDARY38_PARTITION_RUNKEY_V1'
                          and r.get('generation')==1 and r.get('armed') is True and generation_ok
                          and a.get('bc2_27_hostile_audit_status')=='PASS'
                          and a.get('bc2_27_hostile_audit_exact_head')=='b70bc51909f5ed78641ee3b727a2258382ef950c'
                          and a.get('bc2_27_hostile_audit_review_id')==5179488973
                          and r.get('source_git_blob_sha')==sb=='5b5f8f927d5445d006eea19de9886b6e628a6150'
                          and r.get('residual_manifest_git_blob_sha')==mb=='7995a64e1953149e4e2445a7e611541932cf2ebe'
                          and r.get('preflight_git_blob_sha')==pb=='470f3c3d3513047d1db2696aaa84ffc57b10de26'
                          and r.get('bc2_27_checkpoint_canonical')=='0f9278799809fd1a48c187f9a9668631422ab3136478cb3f9f64fd423df71462'
                          and r.get('residual_manifest_canonical')=='635bc832c61c539333f39f3732edd9f82397f8dc3d4a8c0a00406b2c79572477'
                          and r.get('preflight_canonical')=='afd747ef826fe0c0287d0188f5cdc7e38ae704cc50709014f1b10b7db1a471e0'
                          and t.get('retained_unknown_parent_count')==9
                          and t.get('residual_unknown_p35_leaf_count')==13
                          and t.get('maximum_subbranch_checks')==42
                          and t.get('unretained_bc2_19_unknown_identity_count')==172
                          and ex.get('per_subbranch_timeout_ms')==2000
                          and ex.get('effective_heavy_concurrency')==1
                          and ex.get('heavy_scaleout_authorized') is False)
                      reason='fresh-runkey' if authorized else 'semantic-gate-failed'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('authorized='+('true' if authorized else 'false')+'\n')
          print('BC2-28 authorized:',authorized,'reason:',reason,'before:',before,'head:',head)
          PY

  bc2-28-boundary38-bounded:
    needs: authorize-bc2-28
    if: needs.authorize-bc2-28.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact BC2-28 dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Verify BC2-28 authority and retained predecessor
        run: |
          python stages/stage32-ex5/verify_main_state.py
          python stages/stage32-ex5/breadth-cycle-2/verify_bc2_27_boundary35_partition_checkpoint.py
          python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Compile BC2-28 producer
        run: python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_28_boundary38_partition.py
      - name: Run bounded BC2-28 boundary38 exact partition
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_28_boundary38_partition.py \
            --per-subbranch-timeout-ms 2000 \
            --output "$RUNNER_TEMP/bc2-28.json"
          cat "$RUNNER_TEMP/bc2-28.json"
      - name: Validate BC2-28 scope firewalls
        run: |
          python - "$RUNNER_TEMP/bc2-28.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['audit_consumption']['bc2_27_hostile_audit_status']=='PASS'
          assert p['audit_consumption']['bc2_27_hostile_audit_review_id']==5179488973
          assert p['target']['checked_parent_count']==9
          assert p['target']['checked_bc2_27_unknown_p35_leaf_count']==13
          assert p['target']['unretained_bc2_19_unknown_identity_count']==172
          assert p['partition_certificate']['boundary_pairing_label']==38
          assert p['partition_certificate']['coverage_exact'] is True
          assert p['partition_certificate']['disjoint'] is True
          assert p['partition_certificate']['maximum_possible_subbranch_count']==42
          assert p['credit']['whole_first_block_unsat'] is False
          assert p['credit']['full178_complete'] is False
          assert p['credit']['stage32_main_credit'] is False
          assert p['firewalls']['unknown_relabelled_unsat'] is False
          assert p['firewalls']['partition_leaf_unknown_dropped'] is False
          assert p['firewalls']['main_promotion'] is False
          assert p['firewalls']['merge_authorized'] is False
          assert p['firewalls']['perfect_cuboid_existence_claim'] is False
          assert p['firewalls']['perfect_cuboid_nonexistence_claim'] is False
          print('BC2_28_SCOPE_OK',p['status'],p['canonical_sha256_without_this_field'])
          PY
      - name: Upload BC2-28 exact result
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-28-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/bc2-28.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
