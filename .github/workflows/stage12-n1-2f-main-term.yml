name: Stage12-N1-2f main-term audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage12-n1-2f-main-term
    paths:
      - "scripts/audit_main_term_stage12_n1_2f.py"
      - "data/main_term_stage12_n1_2f_report.json"
      - "docs/stage12-n1-2f-main-term.md"
      - ".github/workflows/stage12-n1-2f-main-term.yml"
  pull_request:
    paths:
      - "scripts/audit_main_term_stage12_n1_2f.py"
      - "data/main_term_stage12_n1_2f_report.json"
      - "docs/stage12-n1-2f-main-term.md"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run main-term audit
        run: |
          python -m py_compile scripts/audit_main_term_stage12_n1_2f.py
          python scripts/audit_main_term_stage12_n1_2f.py --write-report /tmp/report.json
          diff -u data/main_term_stage12_n1_2f_report.json /tmp/report.json
