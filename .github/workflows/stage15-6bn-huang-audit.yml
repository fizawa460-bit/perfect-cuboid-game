name: Stage15-6bn Huang audit
on:
  pull_request:
    paths: ['stages/stage15/15-6bn/**','stages/stage15/evidence/stage15_6bn_huang_audit.json','stages/stage15/replay/verify_stage15_6bn.py','stages/stage15/scripts/stage15_6bn_huang_audit.py','.github/workflows/stage15-6bn-huang-audit.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python stages/stage15/replay/verify_stage15_6bn.py
