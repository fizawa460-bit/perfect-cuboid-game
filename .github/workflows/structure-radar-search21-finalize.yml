name: StructureRadar search21 finalize
on: pull_request
permissions: {contents: write}
jobs:
  finalize:
    if: github.head_ref == 'structure-radar-search-21-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - run: |
          python - <<'PY'
          import json,pathlib
          ids=[f'SR-STR-{i:03d}' for i in range(199,209)]
          ledger='docs/structure-radar/literature/SR-SEARCH-21.md'
          rp='docs/structure-radar/structure-registry.json'; r=json.load(open(rp)); cards=[]
          for c in r['structures']:
            if c['structure_id'] in ids:
              assert c['search_status'] in {'NOT_SEARCHED','NEEDS_REFRESH'} and c['arsenal_decision']=='PENDING'
              cards.append(c); c['search_status']='SEARCHED'; c['arsenal_decision']='ACTIVE'; c['search_ledger']=ledger
          assert [c['structure_id'] for c in cards]==ids
          open(rp,'w').write(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          z=['# StructureRadar literature ledger — search batch 21','','SEARCH_TASK=SR-SEARCH-01','BATCH_ID=SR-BATCH-LITERATURE_SEARCH-21-R01','SEARCH_DATE=2026-08-19','STRUCTURES='+','.join(ids),'SEARCH_BATCH_SIZE=10','NOVELTY_BY_SEARCH_ABSENCE=false','',
          '## Primary-source literature checked',
          '- D. R. Heath-Brown, *The density of rational points on curves and surfaces*, Annals of Mathematics 155 (2002), 553–598, DOI 10.2307/3062125; arXiv:math/0405392. Uniform fixed-degree bounded-height curve bounds are adjacent to SR-STR-199, but do not supply the repo moving equal-value allocation, physical height, or reciprocal-divisibility theorem.',
          '- D. R. Heath-Brown, *Small solutions of quadratic congruences, and character sums with binary quadratic forms*, Mathematika 62 (2016), 551–571, DOI 10.1112/S0025579315000364; arXiv:1411.4816. This gives quadratic-congruence small-solution/character-sum technology adjacent to SR-STR-200/208, not the self-generated common-core no-double-charge reconstruction.',
          '- J. Kahn, G. Kalai, N. Linial, *The Influence of Variables on Boolean Functions*, FOCS 1988, 68–80, DOI 10.1109/SFCS.1988.21923. This supplies the classical abstract influence mechanism adjacent to SR-STR-205/206, but its product-cube measure does not identify the repo arithmetic orientation distribution or physical selector.',
          '- Étienne Fouvry, Emmanuel Kowalski, Philippe Michel, *Algebraic trace functions over the primes*, arXiv:1211.6043. Power-saving trace-function cancellation is adjacent to the correlation/centering receivers SR-STR-204/205, but it does not remove the repo principal zero mode or preserve the exact shared physical masks automatically.',
          '- D. R. Heath-Brown, *The density of rational points on Cayley\'s cubic surface*, arXiv:math/0210333. The Cayley surface has an explicit rational-point counting theory, but it is not the repo one-dimensional physical Cayley component in SR-STR-199 and supplies no transfer to the balanced packet count.','',
          '## Search outcome',
          '- SR-STR-199: the generic (2,2) genus-one and Cayley component remain structural receivers. Uniform fixed-degree curve bounds and Cayley-surface counts do not replace the reciprocal allocation/divisibility theorem on the moving physical family.',
          '- SR-STR-200/201: common-core Gaussian root-line spacing, orientation compression, and row/column reconstruction remain exact repo mechanisms. The same self-generated joint modulus cannot be charged twice.',
          '- SR-STR-202/203: square-divisor saturation and six-block reconstruction refine the equality geometry of the existing square-root upper bound only; no checked external theorem creates a uniform fixed delta.',
          '- SR-STR-204: Ramanujan full-conductor synchronization is a charged-once Fourier decomposition. Generic trace-function cancellation does not make the synchronized third projection an independent saving.',
          '- SR-STR-205/206: KKL-type influence theory is conceptually adjacent, but the repo orientation measure is arithmetic and dependent; localization of an influential split-prime bit is not a fixed-power density loss.',
          '- SR-STR-207: the conditional-density chain is an exact factorization of one packet; without a proved deficit on the charged measure it is exponent-neutral.',
          '- SR-STR-208: the remaining minus/plus Gaussian divisor-root receiver is genuinely correlated. Quadratic-congruence technology does not justify multiplying one-sided marginal density estimates.','']
          verdicts={
          'SR-STR-199':'`ADJACENT_UNIFORM_CURVE_AND_CAYLEY_LITERATURE_WITH_PHYSICAL_ALLOCATION_GATE` — external counting frameworks do not discharge the moving equal-value reciprocal packet.',
          'SR-STR-200':'`REPO_COMMON_CORE_SPACING_ORIENTATION` — common-core spacing and Gaussian orientation are one charged-once mechanism.',
          'SR-STR-201':'`REPO_JOINT_CORE_RECONSTRUCTION` — row and column CRT are two views of the same joint modulus and are not multiplied.',
          'SR-STR-202':'`REPO_SATURATION_RIGIDITY_ONLY` — fixed-power gcd strata are sub-half, but no uniform whole-family delta follows.',
          'SR-STR-203':'`REPO_SIX_BLOCK_RECONSTRUCTION` — reconstruction leaves a genuine density/correlation problem and no new exponent.',
          'SR-STR-204':'`ADJACENT_TRACE_CORRELATION_WITH_SYNCHRONIZATION_FIREWALL` — generic cancellation does not unsynchronize the same arithmetic root event.',
          'SR-STR-205':'`ADJACENT_BOOLEAN_INFLUENCE_WITH_ARITHMETIC_MEASURE_GATE` — abstract influence theory does not remove the positive principal zero mode on the physical measure.',
          'SR-STR-206':'`ADJACENT_INFLUENCE_LOCALIZATION_WITH_BOUNDARY_SAVING_GATE` — localization to one split-prime boundary class is not itself sparsity.',
          'SR-STR-207':'`REPO_CONDITIONAL_DENSITY_RECEIVER` — formal conditional factors are exponent-neutral until a same-measure deficit is proved.',
          'SR-STR-208':'`REPO_CORRELATED_INTEGER_GAUSSIAN_DIVISOR_ROOT_RECEIVER` — one-sided ledgers remain dependent and cannot be multiplied.'}
          for c in cards:
            z += ['## '+c['structure_id']+' — '+c['canonical_math_name'],c['exact_equations_or_object'],'Potential weapon types: '+', '.join(c.get('potential_weapon_types',[]))+'.','Applicability gaps: '+'; '.join(c.get('applicability_gaps',[])),'Transfer verdict: '+verdicts[c['structure_id']],'Arsenal decision: `ACTIVE`.','']
          z += ['## Firewalls','- Search absence is not a novelty claim.','- Common-core, Cayley, Gaussian-root, Ramanujan and selector coordinates are charged once; equivalent reconstructions are not multiplied.','- Fixed-fiber or fixed-degree curve bounds are not promoted to a growing physical-family theorem without uniform height/multiplicity control.','- Boolean-cube influence results are not transferred to the arithmetic orientation measure without a measure adapter.','- Generic trace-function cancellation does not remove the principal zero mode or synchronized root events automatically.','- CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT remains 1/2; STRICT_SUBSQRT_POWER_SAVING_PROVED=false.','- No perfect-cuboid existence or nonexistence claim is made.','']
          pathlib.Path(ledger).write_text('\n'.join(z))
          pp='docs/structure-radar/progress.json'; p=json.load(open(pp)); bid='SR-BATCH-LITERATURE_SEARCH-21-R01'; assert not any(x.get('batch_id')==bid for x in p['audit_batches'])
          p['audit_batches'].append({'batch_id':bid,'task_id':'SR-SEARCH-01','status':'SUBMITTED_FOR_AUDIT','source_ids':[],'sources_reviewed':5,'structures_added':0,'structures_updated':10,'structure_carrier_sources':0,'structures_deduped':0,'searches_completed':10,'arsenal_decisions':10,'audit_required':True,'duplicate_source':0,'no_distinct_structure':0})
          open(pp,'w').write(json.dumps(p,indent=2,ensure_ascii=False)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python - <<'PY'
          import json
          q=json.load(open('docs/structure-radar/exploration-queue.json')); ready=next(t for t in q['tasks'] if t['status']=='READY')
          assert ready['structure_ids']==['SR-STR-209','SR-STR-210','SR-STR-211','SR-STR-212','SR-STR-213','SR-STR-214','SR-STR-215','SR-STR-217','SR-STR-218','SR-STR-219'], ready
          c=json.load(open('docs/structure-radar/controller.json')); assert c['registry']['unresolved_search_count']==17 and c['registry']['pending_arsenal_decision_count']==36; assert c['queue']['task_count']==2
          PY
          rm .github/workflows/structure-radar-search21-finalize.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A && git commit -m 'StructureRadar: literature search batch21' && git push
