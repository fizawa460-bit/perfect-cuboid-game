name: StructureRadar b37 onepr

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'structure-radar-parallel-37-onepr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append batch37 shared accounting and self-clean
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/structure-radar/progress.json')
          data=json.loads(p.read_text())
          bid='SR-BATCH-PARALLEL-37-ONEPR-R01'
          rows=data['audit_batches']
          if not any(x.get('batch_id')==bid for x in rows):
              rows.append({
                  'batch_id': bid,
                  'phase': 'EXTERNAL_GATE_CLOSURE',
                  'status': 'SUBMITTED_FOR_AUDIT',
                  'mode': 'ONE_PR_FOUR_LANES',
                  'structure_ids': ['SR-STR-169','SR-STR-170','SR-STR-171','SR-STR-168'],
                  'parallel_lane_count': 4,
                  'single_pr_for_all_lanes': True,
                  'separate_integration_pr_required': False,
                  'gates_closed': 0,
                  'external_gate_count_before': 13,
                  'external_gate_count_after': 13,
                  'sr_str_169_first_missing_lemma': 'MAINWallPrimitiveInverseFrequencySameMeasureLargeSieveQuadraticFormDeficit',
                  'sr_str_170_first_missing_lemma': 'PhysicalSquareDivisorDyadicThresholdEventSameMeasureDeficit',
                  'sr_str_171_first_missing_lemma': 'PhysicalLocalizedDivisorDyadicThresholdEventSameMeasureDeficit',
                  'sr_str_168_first_missing_lemma': 'SameMeasurePhysicalGaussianMobiusSquareFunctionCorrelationDeficit',
                  'lane_169_work_delegation_recommended': True,
                  'audit_required': True
              })
          p.write_text(json.dumps(data, indent=2)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          rm .github/workflows/structure-radar-b37-onepr.yml
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add docs/structure-radar/progress.json .github/workflows/structure-radar-b37-onepr.yml
          git commit -m 'StructureRadar: materialize one-PR parallel batch 37' || true
          git push origin HEAD:${{ github.head_ref }}
