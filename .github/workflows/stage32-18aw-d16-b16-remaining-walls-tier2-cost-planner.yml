name: Stage32-18AW d16 b16 remaining walls tier2 cost planner

on:
  push:
    branches: [stage32-18as-b16-heavy-tier2-cost-planner]
    paths: ['stages/stage32/runkeys/18aw-b16-remaining-walls-tier2-cost-planner.json']

permissions: {contents: read, actions: read}
concurrency: {group: stage32-18aw-b16-remaining-walls-tier2, cancel-in-progress: true}

jobs:
  planner:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {name: p436-s362, primary: 436, shard: 362, frontier: 3897, heavy: 718, artifact: 9674929039, digest: '117c93ce009ce9e2254437c34bf01ac1c313b56430160bd155892473205bcd62'}
          - {name: p503-s118, primary: 503, shard: 118, frontier: 3596, heavy: 685, artifact: 9674933098, digest: '2779e9df3049b19920adbeda0717b79eb3b43245a2ca50e008685f0ecf78a797'}
          - {name: p503-s665, primary: 503, shard: 665, frontier: 3761, heavy: 721, artifact: 9674937831, digest: '6f775cce6627379d880586f64e97fba138f7bca920f2ded74595de666b716132'}
          - {name: p922-s13, primary: 922, shard: 13, frontier: 4095, heavy: 685, artifact: 9674934144, digest: 'a8e2588a52d7fd138ebd085ff02806aff888cf29080fabdf064d662991ec4d9c'}
          - {name: p922-s38, primary: 922, shard: 38, frontier: 4203, heavy: 671, artifact: 9674933223, digest: '1cbd16a3dccff3601cf498998a703a70e6f91cba0f30d8832def9dcc60af8286'}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      WALL_NAME: ${{ matrix.name }}
      PRIMARY_ID: ${{ matrix.primary }}
      SHARD_ID: ${{ matrix.shard }}
      EXPECTED_FRONTIER: ${{ matrix.frontier }}
      EXPECTED_HEAVY: ${{ matrix.heavy }}
      TIER1_ARTIFACT: ${{ matrix.artifact }}
      TIER1_DIGEST: ${{ matrix.digest }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Require dedicated ARM commit and locked key
        run: |
          set -euo pipefail
          KEY=stages/stage32/runkeys/18aw-b16-remaining-walls-tier2-cost-planner.json
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1 && test "${changed[0]}" = "$KEY"
          test "$(git log -1 --pretty=%s)" = 'Stage32-18AW: ARM B16 REMAINING WALLS TIER2 COST PLANNER'
          python - <<'PY'
          import json,pathlib,os
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18aw-b16-remaining-walls-tier2-cost-planner.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1' and d['generation']==1 and d['armed'] and d['bound']==16
          assert d['source_exact_artifact_id']==9574308138 and d['source_tier1_run_id']==33143519365
          assert d['tier2_probe_budget']==32768 and d['max_parallel']==5 and d['allow_finer_split'] is False
          wall=[int(os.environ['PRIMARY_ID']),int(os.environ['SHARD_ID'])]
          x=next(x for x in d['targets'] if x['wall']==wall)
          assert x['name']==os.environ['WALL_NAME'] and x['frontier']==int(os.environ['EXPECTED_FRONTIER']) and x['heavy']==int(os.environ['EXPECTED_HEAVY'])
          assert x['artifact_id']==int(os.environ['TIER1_ARTIFACT']) and x['artifact_digest']=='sha256:'+os.environ['TIER1_DIGEST']
          PY
      - name: Fetch locked source and wall tier1 artifact
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++ libboost-dev
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/tier1" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/source.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/src"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/tier1.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TIER1_ARTIFACT}/zip"
          echo "${TIER1_DIGEST}  $RUNNER_TEMP/tier1.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/tier1.zip" -d "$RUNNER_TEMP/tier1"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          p=json.loads((root/'tier1'/f"stage32-18av-{os.environ['WALL_NAME']}-cost.json").read_text())
          assert p['schema']=='STAGE32_18AV_B16_REMAINING_WALL_COST_SCOUT_V1'
          assert p['target_wall']==[int(os.environ['PRIMARY_ID']),int(os.environ['SHARD_ID'])]
          assert p['frontier_states']==int(os.environ['EXPECTED_FRONTIER']) and p['capped_heavy_count']==int(os.environ['EXPECTED_HEAVY'])
          ids=p['heavy_frontier_ids']; assert len(ids)==len(set(ids))==int(os.environ['EXPECTED_HEAVY'])
          (root/'work'/'tier2-ids.txt').write_text(''.join(f'{x}\n' for x in ids))
          PY
      - name: Build exact selective planner
        run: |
          set -euo pipefail
          python stages/stage32/32-18X/build_two_stage_certifier.py --source "$RUNNER_TEMP/src/d16-exact-symmetry-sharded.cpp" --output "$RUNNER_TEMP/work/cert.cpp" --primary-id "$PRIMARY_ID"
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AF/patch_symmetry_schedule.py
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AO/patch_block_frontier.py
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AP/patch_lower_block_replay.py
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AR/patch_frontier_cost_planner.py
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AS/patch_selective_frontier_planner.py
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic "$RUNNER_TEMP/work/cert.cpp" -o "$RUNNER_TEMP/work/cert"
          cp "$RUNNER_TEMP/src/d16-hperp.txt" "$RUNNER_TEMP/work/"
          cp "$RUNNER_TEMP/src/d16-aut-prefix256-bundle.txt" "$RUNNER_TEMP/work/"
      - name: Probe only tier1-capped frontier states at 32768 nodes
        run: |
          set -euo pipefail
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" timeout --signal=TERM --kill-after=20s 45m "$RUNNER_TEMP/work/cert" --input "$RUNNER_TEMP/work/d16-hperp.txt" --bundle "$RUNNER_TEMP/work/d16-aut-prefix256-bundle.txt" --output "$RUNNER_TEMP/out/cert.json" --dump-canonical "$RUNNER_TEMP/out/dump.bin" --bound 16 --shard-id "$SHARD_ID" --shard-count 1024 --split-coordinate 48 --block-cut 39 --frontier-cap 50000 --replay-limit 0 --planner-probe-budget 32768 --planner-output "$RUNNER_TEMP/out/tier2-costs.csv" --planner-id-file "$RUNNER_TEMP/work/tier2-ids.txt" --node-cap 2000000 >"$RUNNER_TEMP/out/stdout.txt" 2>"$RUNNER_TEMP/out/stderr.txt"
      - name: Build compact tier2 certificate
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,os,pathlib,math
          root=pathlib.Path(os.environ['RUNNER_TEMP']); out=root/'out'
          cert=json.loads((out/'cert.json').read_text())
          ids=[int(x) for x in (root/'work'/'tier2-ids.txt').read_text().split()]
          with (out/'tier2-costs.csv').open() as f:
              rows=[{'frontier_id':int(r['frontier_id']),'probe_nodes':int(r['probe_nodes']),'complete':r['complete']=='1'} for r in csv.DictReader(f)]
          assert cert['status']=='FRONTIER_COMPLETE' and cert['frontier_states']==int(os.environ['EXPECTED_FRONTIER'])
          assert cert['planner_selected_ids']==len(ids)==int(os.environ['EXPECTED_HEAVY']) and [r['frontier_id'] for r in rows]==ids
          complete=[r for r in rows if r['complete']]; heavy=[r for r in rows if not r['complete']]; costs=sorted(r['probe_nodes'] for r in complete)
          def pct(p):
              return costs[min(len(costs)-1,max(0,math.ceil(p*len(costs))-1))] if costs else None
          result={'schema':'STAGE32_18AW_B16_REMAINING_WALL_TIER2_COST_PLAN_V1','verdict':'TIER2_HEAVY_DISTRIBUTION_MEASURED','target_wall':[int(os.environ['PRIMARY_ID']),int(os.environ['SHARD_ID'])],'frontier_states':int(os.environ['EXPECTED_FRONTIER']),'tier2_input_count':len(ids),'tier2_probe_budget':32768,'tier2_completed_count':len(complete),'tier2_capped_count':len(heavy),'tier3_frontier_ids':[r['frontier_id'] for r in heavy],'tier2_completed_quantiles':{'p50':pct(.50),'p90':pct(.90),'p95':pct(.95),'p99':pct(.99),'max':max(costs) if costs else None},'total_resolved_frontier_count_after_tier2':int(os.environ['EXPECTED_FRONTIER'])-len(heavy),'next_item':'COMPARE_SIX_WALL_TIER2_TAILS_THEN_TIER3_OR_MONSTER_ISOLATION','D16_B16_NUMERICAL_CREDIT':False,'GLOBAL_B16_AGGREGATION_COMPLETE':False,'FULL_D16_G0_ROW_COMPLETE':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False}
          (out/f"stage32-18aw-{os.environ['WALL_NAME']}-tier2.json").write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'wall':result['target_wall'],'tier2_input':len(ids),'completed':len(complete),'tier3':len(heavy),'total_resolved':result['total_resolved_frontier_count_after_tier2']},sort_keys=True))
          for x in ['dump.bin','cert.json','tier2-costs.csv']:(out/x).unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18aw-${{ matrix.name }}-tier2-cost-g1
          path: '${{ runner.temp }}/out/'
          retention-days: 7
          if-no-files-found: error
