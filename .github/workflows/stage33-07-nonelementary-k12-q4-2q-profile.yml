name: Stage33-07 non-elementary k1 k2 Q4 exact 2Q profile

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/**'
      - '.github/workflows/stage33-07-nonelementary-k12-q4-2q-profile.yml'
  workflow_dispatch:

concurrency:
  group: stage33-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact non-elementary predecessor chain
        working-directory: stages/stage33/33-07
        run: |
          python certify_nonelementary_target_q4_rank_obstruction.py
          python certify_nonelementary_target_q8_exponent_reduction.py
          python certify_nonelementary_k12_q2_support_reduction.py
          python certify_nonelementary_k12_2q_support_reduction.py
      - name: Rebuild formal Q4 certificate
        working-directory: stages/stage33/33-07
        run: python certify_nonelementary_k12_full_q4.py
      - name: Profile exact 2Q quadratic values on all Q4 surviving skeletons
        working-directory: stages/stage33/33-07
        run: python profile_nonelementary_k12_q4_2q_exact_profile.py
      - name: Enforce exact scout coverage and conservative firewall
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import json
          x=json.load(open('nonelementary-k12-q4-2q-exact-profile-scout.json'))
          assert x['source_Q4_certificate_sha256']=='cc7350ecd3a5f7d1c3eca0b96649df0fb1219283190f806ec1e537d28cbd4b19'
          assert x['source_endpoint_finite_q_sha256']=='4ca7567205455175a5f9bef7a74bc9ec31cd68f831aec60aa88a637b5c0cfdf0'
          assert x['endpoint_2Q_profile_mod16']=={'0':8192,'8':8192}
          assert x['section_independent']
          assert x['combined_Q4_surviving_H']==10880256
          assert x['k1']['Q4_surviving_skeleton_orbits']==3187
          assert x['k1']['Q4_surviving_H']==2012416
          assert x['k2']['Q4_surviving_skeleton_orbits']==294
          assert x['k2']['Q4_surviving_H']==8867840
          assert x['planning_only'] and not x['exact_2Q_profile_certified']
          assert not x['endpoint_finite_q_certified'] and not x['endpoint_full_action_certified']
          assert not x['actual_index512_glue_identified'] and not x['arithmetic_HS_closed']
          assert x['stage33_progress']=='6/11' and not x['stage33_08_released'] and not x['stage33_09_released']
          assert not x['theorem_credit'] and not x['endpoint_credit'] and not x['perfect_cuboid_nonexistence_claim']
          print('K12_Q4_2Q_PROFILE=PASS_EXACT_SCOUT')
          print('SURVIVING_SKELETON_ORBITS='+str(x['combined_skeleton_orbits_matching_exact_2Q_profile']))
          print('SURVIVING_H='+str(x['combined_H_matching_exact_2Q_profile']))
          print('CERT_SHA256='+x['canonical_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-k12-q4-2q-exact-profile-scout
          path: stages/stage33/33-07/nonelementary-k12-q4-2q-exact-profile-scout.json
          retention-days: 5
