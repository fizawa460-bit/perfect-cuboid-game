name: Stage12-N1-2 self-contained review page

on:
  pull_request:
    paths:
      - "docs/00_CURRENT_RESEARCH_STATUS.md"
      - "docs/stage12-n1-2*.md"
      - "data/*stage12_n1_2*.json"
      - "scripts/audit_*stage12_n1_2*.py"
      - "scripts/build_stage12_n1_2_review_page.py"
      - "scripts/build_stage12_n1_2_review_page_r02.py"
      - "scripts/verify_stage12_n1_review_manifest.py"
      - "review/PC-N1-2-PROOF-REVIEW-20260806-R01.html"
      - "review/PC-N1-2-PROOF-REVIEW-20260806-R02.html"
      - ".github/workflows/stage12-n1-2-review-page.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-review-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build extractor-safe R02 review page
        run: python scripts/build_stage12_n1_2_review_page_r02.py
      - name: Verify mandatory markers are inside main
        shell: bash
        run: |
          page=review/PC-N1-2-PROOF-REVIEW-20260806-R02.html
          status=docs/00_CURRENT_RESEARCH_STATUS.md
          test -s "$page"
          python - <<'PY'
          from pathlib import Path
          page = Path("review/PC-N1-2-PROOF-REVIEW-20260806-R02.html").read_text(encoding="utf-8")
          start = page.index('<main id="review-bundle-main">')
          end = page.index('</main>', start)
          main = page[start:end]
          markers = [
              'BUNDLE_ID=PC-N1-2-PROOF-REVIEW-20260806-1645-R02',
              'COMPLETED_THROUGH=Stage12-N1-2k',
              'SOURCE_SNAPSHOT_COMMIT=8d6910e8e68145e474f92716460a1cc6f384ecf1',
              'CONTENT_SHA256=201cad458d172e0939e5508b78e6e06abe894d908390f0c1b54c51a16e63d586',
              'LAST_SOURCE_DOCUMENT=docs/stage12-n1-2k-final-remainder.md',
              'END_OF_BUNDLE=PC-N1-2-PROOF-REVIEW-20260806-1645-R02',
          ]
          for marker in markers:
              assert main.count(marker) >= 4, (marker, main.count(marker))
          assert 'CHECKPOINT=START_OF_MAIN' in main
          assert 'CHECKPOINT=END_OF_MAIN' in main
          assert 'audit_final_remainder_stage12_n1_2k.py' in main
          assert len(page.encode('utf-8')) > 250_000
          PY
          grep -Fq 'LATEST_SELF_CONTAINED_REVIEW_PAGE:** `review/PC-N1-2-PROOF-REVIEW-20260806-R02.html`' "$status"
          grep -Fq 'LATEST_BUNDLE_ID:** `PC-N1-2-PROOF-REVIEW-20260806-1645-R02`' "$status"
          python scripts/verify_stage12_n1_review_manifest.py
      - name: Commit generated page to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          page=review/PC-N1-2-PROOF-REVIEW-20260806-R02.html
          if git diff --quiet -- "$page" && git ls-files --error-unmatch "$page" >/dev/null 2>&1; then
            echo "R02 review page is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$page"
          git commit -m "Generate extractor-safe Stage12 N1-2 R02 review page"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload generated review page
        uses: actions/upload-artifact@v4
        with:
          name: stage12-n1-2-proof-review-page-r02
          path: review/PC-N1-2-PROOF-REVIEW-20260806-R02.html
          if-no-files-found: error
          retention-days: 7
