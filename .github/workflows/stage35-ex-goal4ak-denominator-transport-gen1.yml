name: Stage35-EX Goal4AK denominator transport gen1

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage35-ex/runkeys/goal4ak-denominator-transport-gen1.json'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          KEY='stages/stage35-ex/runkeys/goal4ak-denominator-transport-gen1.json'
          SRC='stages/stage35-ex/diagnose_stage35_ex_35_goal4ak_denominator_transport_gen1.py'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test '${{ github.event.pull_request.number }}' = '1720' || exit 0
          test '${{ github.event.pull_request.head.ref }}' = 'stage35-ex-goal4aj-audited-sync-fb-assembly' || exit 0
          test '${{ github.event.pull_request.base.ref }}' = 'main' || exit 0
          test -n "$BEFORE" || exit 0
          git cat-file -e "$BEFORE^{commit}" || exit 0
          mapfile -t changed < <(git diff --name-only "$BEFORE" "$HEAD")
          test "${#changed[@]}" -eq 1 || exit 0
          test "${changed[0]}" = "$KEY" || exit 0
          python - "$KEY" "$SRC" <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          key=pathlib.Path(sys.argv[1]); src=pathlib.Path(sys.argv[2])
          def blob(p):
              b=p.read_bytes(); return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          r=json.loads(key.read_text())
          assert r['schema']=='STAGE35_EX_GOAL4AK_DENOMINATOR_TRANSPORT_GEN1_RUNKEY_V1'
          assert r['generation']==1 and r['armed'] is True
          assert r['pr_number']==1720
          assert r['branch']=='stage35-ex-goal4aj-audited-sync-fb-assembly' and r['base']=='main'
          assert blob(src)==r['source_blob_sha1']=='923cecb73d5413ffda1811fc2a23c993826a9646'
          subprocess.run(['git','fetch','--no-tags','origin','main'],check=True,stdout=subprocess.DEVNULL)
          main=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          assert main==r['observed_current_main_sha']
          mb=subprocess.check_output(['git','merge-base','HEAD','origin/main'],text=True).strip()
          assert mb==r['branch_merge_base_sha']
          assert r['planned_jobs']==1 and r['max_parallel']==1
          assert r['projected_peak_artifact_bytes']<=100000
          assert r['artifact_retention_days']==1
          PY
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  materialize:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 400
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact replay dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends singular
          python -m pip install --disable-pip-version-check sympy==1.14.0 scipy==1.16.1
      - name: Reproduce exact denominator and compact transport
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/goal4ak-den-gen1"
          python -u -B stages/stage35-ex/diagnose_stage35_ex_35_goal4ak_denominator_transport_gen1.py --output-dir "$OUT" | tee "$RUNNER_TEMP/goal4ak-den-gen1.log"
          grep -q '^GOAL4AK_DEN_TRANSPORT_GEN1_JSON=' "$RUNNER_TEMP/goal4ak-den-gen1.log"
          grep -q '^GOAL4AK_DEN_TRANSPORT_GEN1=PASS$' "$RUNNER_TEMP/goal4ak-den-gen1.log"
          test "$(wc -c <"$OUT/denominator.txt.gz")" -le 100000
          test "$(wc -c <"$OUT/certificate.json")" -le 16384
      - uses: actions/upload-artifact@v4
        with:
          name: goal4ak-denominator-transport-gen1
          path: |
            ${{ runner.temp }}/goal4ak-den-gen1/denominator.txt.gz
            ${{ runner.temp }}/goal4ak-den-gen1/certificate.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
