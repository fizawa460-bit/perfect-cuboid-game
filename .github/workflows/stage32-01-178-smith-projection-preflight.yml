name: Stage32 32-01-178 Smith projection preflight

on:
  push:
    branches:
      - stage32-01-178-smith
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact audited PW10 source head
        run: |
          git fetch --no-tags --depth=1 origin e3c4a04d5010e6dca9428722e334890e2614297a
          git cat-file -e e3c4a04d5010e6dca9428722e334890e2614297a^{commit}
      - name: Replay certified Smith projection
        run: |
          python stages/stage32/32-01-178-smith/verify_smith_projection_preflight.py | tee /tmp/smith-projection.json
      - name: Replay old legal assemblies and find minimal Smith detector
        run: |
          python stages/stage32/32-01-178-smith/verify_smith_minimal_detector_preflight.py | tee /tmp/smith-detector.json
      - name: Reduce detector to source H1 mod2 observable
        run: |
          python stages/stage32/32-01-178-smith/verify_smith_mod2_observable_preflight.py | tee /tmp/smith-mod2.json
      - name: Compute affine mod2 invariant space
        run: |
          python stages/stage32/32-01-178-smith/verify_smith_affine_mod2_invariants.py | tee /tmp/smith-affine.json
      - name: Compact ledger
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/smith-projection.json'))
          d=json.load(open('/tmp/smith-detector.json'))
          o=json.load(open('/tmp/smith-mod2.json'))
          a=json.load(open('/tmp/smith-affine.json'))
          m=x['map']; r=d['exact_replay']; z=o['old_legal_F_replay']; f=a['family']; q=a['dual_affine_constraints']
          print('projection_canonical='+x['canonical_sha256_without_this_field'])
          print('middle_B_only_image_order='+str(m['middle_B_only_image_order']))
          print('detector_canonical='+d['canonical_sha256_without_this_field'])
          print('minimal_detector_size='+str(r['minimal_detector_coordinate_count']))
          print('mod2_observable_canonical='+o['canonical_sha256_without_this_field'])
          print('smith0='+o['smith_coordinate_0']['formula_in_assembly_coordinates'])
          print('required_F_entries='+str(o['smith_coordinate_0']['required_F_entries']))
          print('affine_canonical='+a['canonical_sha256_without_this_field'])
          print('unique_F_mod2='+str(f['unique_legal_F_mod2']))
          print('affine_dim='+str(f['affine_span_dimension']))
          print('affine_codim='+str(f['affine_codimension']))
          print('fixed_coords='+str(f['fixed_coordinates']))
          print('min_odd_weight='+str(q['minimal_constant_one_weight']))
          print('min_odd_supports='+str(q['minimal_constant_one_supports']))
          print('CURRENT_FULL178_SEMANTIC_ADAPTER=false')
          print('MAIN_PRUNING_CREDIT=false')
          PY
