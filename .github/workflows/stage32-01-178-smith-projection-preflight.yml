name: Stage32 32-01-178 Smith projection preflight

on:
  push:
    branches:
      - stage32-01-178-smith
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact audited PW10 source head
        run: |
          git fetch --no-tags --depth=1 origin e3c4a04d5010e6dca9428722e334890e2614297a
          git cat-file -e e3c4a04d5010e6dca9428722e334890e2614297a^{commit}
      - name: Replay certified Smith projection
        run: |
          set -o pipefail
          python stages/stage32/32-01-178-smith/verify_smith_projection_preflight.py | tee /tmp/smith-projection.json
      - name: Replay old legal assemblies and find minimal Smith detector
        run: |
          set -o pipefail
          python stages/stage32/32-01-178-smith/verify_smith_minimal_detector_preflight.py | tee /tmp/smith-detector.json
      - name: Reduce detector to source H1 mod2 observable
        run: |
          set -o pipefail
          python stages/stage32/32-01-178-smith/verify_smith_mod2_observable_preflight.py | tee /tmp/smith-mod2.json
      - name: Compute affine mod2 invariant space
        run: |
          set -o pipefail
          python stages/stage32/32-01-178-smith/verify_smith_affine_mod2_invariants.py | tee /tmp/smith-affine.json
      - name: Verify one-bit source formula
        run: |
          set -o pipefail
          python stages/stage32/32-01-178-smith/verify_smith_one_bit_source_formula.py | tee /tmp/smith-formula.json
      - name: Isolate transvection-only Smith bit
        run: |
          set -o pipefail
          python stages/stage32/32-01-178-smith/verify_smith_transvection_universal_mod2_preflight.py | tee /tmp/smith-transvection.json
      - name: Install exact linear algebra dependency
        run: |
          python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Quantify current prefix true pair-mass parity gap
        run: |
          set -o pipefail
          python stages/stage32/32-01-178-smith/verify_smith_current_prefix_boundary_parity_gap.py | tee /tmp/smith-prefix-gap.json
      - name: Classify current pair-mass parity image
        run: |
          set -o pipefail
          python stages/stage32/32-01-178-smith/verify_smith_pair_mass_image_classifier.py | tee /tmp/smith-pair-image.json
      - name: Compact ledger
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/smith-projection.json'))
          d=json.load(open('/tmp/smith-detector.json'))
          o=json.load(open('/tmp/smith-mod2.json'))
          a=json.load(open('/tmp/smith-affine.json'))
          s=json.load(open('/tmp/smith-formula.json'))
          u=json.load(open('/tmp/smith-transvection.json'))
          p=json.load(open('/tmp/smith-prefix-gap.json'))
          z=json.load(open('/tmp/smith-pair-image.json'))
          m=x['map']; r=d['exact_replay']; f=a['family']
          g=p['exact_gap']; c=p['selected64_comparison']
          ur=u['full_ring_mod2_replay']; ui=u['integral_gluing_parity_replay']
          zi=z['linear_image']; zf=z['fibre_parity_structure']; ze=z['current_prefix_extension']
          print('projection_canonical='+x['canonical_sha256_without_this_field'])
          print('middle_B_only_image_order='+str(m['middle_B_only_image_order']))
          print('detector_canonical='+d['canonical_sha256_without_this_field'])
          print('minimal_detector_size='+str(r['minimal_detector_coordinate_count']))
          print('mod2_observable_canonical='+o['canonical_sha256_without_this_field'])
          print('smith0='+o['smith_coordinate_0']['formula_in_assembly_coordinates'])
          print('affine_canonical='+a['canonical_sha256_without_this_field'])
          print('unique_F_mod2='+str(f['unique_legal_F_mod2']))
          print('affine_dim='+str(f['affine_span_dimension']))
          print('source_formula_canonical='+s['canonical_sha256_without_this_field'])
          print('source_common_bit='+s['exact_formula']['common_mod2'])
          print('transvection_universal_canonical='+u['canonical_sha256_without_this_field'])
          print('transvection_compatible_ring_residues='+str(ur['transvection_compatible_residue_count']))
          print('transvection_counts_by_factor='+str(ur['counts_by_selected_prym_factor']))
          print('transvection_all_force_bit1='+str(ur['all_transvection_compatible_residues_force_source_bit_one']))
          print('transvection_mod4_lifts_checked='+str(ui['mod4_lifts_checked']))
          print('transvection_integral_builds='+str(ui['integral_builds']))
          print('v6_norms_needed_for_mod2='+str(u['interpretation']['v6_specific_norm_137_9_9_is_needed_for_this_mod2_obstruction']))
          print('pair_mass_gap_canonical='+p['canonical_sha256_without_this_field'])
          print('invalid_boundary_sum_model_superseded=True')
          print('pair_mass_rank='+str(g['pair_mass_parity_map_rank']))
          print('pair_mass_residual_rank='+str(g['residual_pair_mass_parity_rank_beyond_current_observables']))
          print('individually_determined_pairs='+str(g['individually_determined_pair_indices_0based']))
          print('minimal_extra_pair_group_sums='+str(g['minimal_additional_true_pair_group_sums_to_determine_all_pair_parities']))
          print('selected64_exceptional_labels='+str(c['selected_exceptional_labels']))
          print('residual_after_all_selected_exceptional='+str(c['residual_pair_mass_rank_after_current_plus_all_selected_exceptional_labels']))
          print('pair_image_canonical='+z['canonical_sha256_without_this_field'])
          print('pair_image_signature_count='+str(zi['signature_count']))
          print('pair_image_permutation_count='+str(zi['permutation_signature_count']))
          print('pair_image_single_transposition_count='+str(zi['single_transposition_signature_count']))
          print('pair_image_all_row_forms_equal='+str(zf['all_six_first_factor_row_sum_forms_equal']))
          print('pair_image_all_col_forms_equal='+str(zf['all_six_second_factor_column_sum_forms_equal']))
          print('pair_image_common_row_col_form='+str(zf['first_row_sum_form_equals_second_column_sum_form']))
          print('pair_image_min_extra_individual_exceptional='+str(ze['minimal_additional_individual_exceptional_pairings']))
          print('pair_image_min_extra_individual_subsets_first50='+str(ze['minimal_subsets_first50']))
          print('CURRENT_FULL178_SEMANTIC_ADAPTER=false')
          print('MAIN_PRUNING_CREDIT=false')
          PY
