name: StructureRadar batch17 selector
on:
  push:
    branches: [structure-radar-deep-corpus-batch-17]
    paths: ['.github/structure-radar-batch17-trigger.txt']
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect schemas
        shell: python
        run: |
          import json, pathlib, traceback
          report={}
          try:
              idx=json.loads(pathlib.Path('.github/structure-radar-batch17-index.json').read_text())
              progress=json.loads(pathlib.Path('docs/structure-radar/progress.json').read_text())
              reg=json.loads(pathlib.Path('docs/structure-radar/structure-registry.json').read_text())
              report['index_len']=len(idx)
              report['index_ns']=[x.get('n') for x in idx]
              report['progress_keys']=list(progress.keys())
              report['batches_type']=type(progress.get('batches')).__name__
              report['batches_len']=len(progress.get('batches',[])) if isinstance(progress.get('batches'),list) else None
              report['registry_keys']=list(reg.keys())
              report['structure_count']=len(reg.get('structures',[]))
              ids=[c.get('structure_id') for c in reg.get('structures',[]) if c.get('structure_id','').startswith('SR-STR-')]
              report['max_structure_id']=max(ids,key=lambda x:int(x.rsplit('-',1)[1])) if ids else None
              report['target_cards']={cid:any(c.get('structure_id')==cid for c in reg.get('structures',[])) for cid in ['SR-STR-032','SR-STR-163','SR-STR-222','SR-STR-223']}
          except Exception:
              report['traceback']=traceback.format_exc()
          pathlib.Path('.github/structure-radar-batch17-debug.json').write_text(json.dumps(report,indent=2)+'\n')
      - name: Commit debug
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/structure-radar-batch17-debug.json
          git commit -m 'StructureRadar batch17 debug schema' || exit 0
          git push
