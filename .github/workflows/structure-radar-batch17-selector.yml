name: StructureRadar batch17 selector
on:
  push:
    branches: [structure-radar-deep-corpus-batch-17]
    paths: ['.github/structure-radar-batch17-trigger.txt']
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract exact READY slice
        shell: python
        run: |
          import json, pathlib, re
          ids = '''SRC-BE0B747AD352 SRC-CA67ADC8611A SRC-D386FBA73FDB SRC-4AD563D6499A SRC-0CDA03AD6196 SRC-0F4DC9A1EF3B SRC-4C3C3F3BB666 SRC-FBED47ACCDEC SRC-A7880AEF5B36 SRC-19D1C3D588D7 SRC-A09738F0657D SRC-2E70CDFB1CFA SRC-7F7C869D330C SRC-84DB174DC7A8 SRC-8DDEF0969313 SRC-0518A8A6D9D4 SRC-1547249B5AFF SRC-9DD84CB3D366 SRC-A445C6C42239 SRC-8D5BCAD70B25 SRC-C21D7FBBFD31 SRC-2E8D5D346C21 SRC-61E374977241 SRC-AC57401B0C45 SRC-8A777C0EC02D SRC-3CB0CCE6928A SRC-939C18F89F5C SRC-83C47B842C52 SRC-2B6169293574 SRC-4F438A26A99C SRC-942605C4333A SRC-5FD6A9146060 SRC-F593741E0D42 SRC-EC2629C2186D SRC-318FF5ECE0E3 SRC-B2978C722038 SRC-DCC1215E886D SRC-F30917B4BF13 SRC-5FE4382DA5BD SRC-13FF22C0E724 SRC-ADE11F10F32E SRC-92DE14BD709C SRC-CAF736B0E9ED SRC-38E956166DC0 SRC-E88D393B913E SRC-C90500AB33FB SRC-6BC689C798F1 SRC-F2F7291B92EB SRC-52504B6B2216 SRC-39701F9D1E06 SRC-0B3FF9785992 SRC-E6B6997E2794 SRC-3C264E281925 SRC-37E0A2EE3D85 SRC-F6E3A8136807 SRC-064FFAFD9378 SRC-75ABF425B2DD SRC-05A496190768 SRC-1D0C837EA267 SRC-1CF992BBEC52'''.split()
          entries={}
          for p in sorted(pathlib.Path('docs/structure-radar/source-manifest').glob('part-*.json')):
              data=json.loads(p.read_text())
              arr=data.get('sources', data if isinstance(data,list) else [])
              for e in arr:
                  if e.get('source_id') in ids: entries[e['source_id']]=e
          assert set(entries)==set(ids), (len(entries), sorted(set(ids)-set(entries)))
          out=[]; lines=[]
          keys_rx=re.compile(r'(PROVED|BOUND|BARRIER|TARGET|RECEIVER|STATUS|CURRENT|NEXT|false|true|sqrt|power|Pell|sieve|fiber|support|moment|height|divisor|gcd|rank|elliptic|quartic|character)',re.I)
          for n,sid in enumerate(ids,1):
              e=entries[sid]; path=e.get('path',''); txt=''
              pp=pathlib.Path(path)
              if pp.is_file():
                  try: txt=pp.read_text(errors='replace')
                  except: pass
              title=''
              for ln in txt.splitlines():
                  if ln.startswith('# '): title=ln[2:].strip(); break
              key=[]
              for ln in txt.splitlines():
                  z=ln.strip()
                  if z and keys_rx.search(z):
                      key.append(z[:700])
                      if len(key)>=24: break
              excerpt='\n'.join(txt.splitlines()[:90])[:12000]
              rec={k:e.get(k) for k in ['source_id','path','fingerprint','stage','kind','evidence_role']}
              rec.update(n=n,title=title,key_lines=key,excerpt=excerpt)
              out.append(rec)
              lines.append(f'{n:02d}\t{sid}\t{path}\t{title}')
          pathlib.Path('.github/structure-radar-batch17-index.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          pathlib.Path('.github/structure-radar-batch17-summary.txt').write_text('\n'.join(lines)+'\n')
      - name: Commit selector output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/structure-radar-batch17-index.json .github/structure-radar-batch17-summary.txt
          git commit -m 'StructureRadar batch17 source index' || exit 0
          git push
