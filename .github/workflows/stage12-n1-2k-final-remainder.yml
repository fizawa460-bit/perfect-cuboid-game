name: Stage12-N1-2k final-remainder audit

on:
  pull_request:
    paths:
      - "scripts/audit_final_remainder_stage12_n1_2k.py"
      - "data/final_remainder_stage12_n1_2k_report.json"
      - "docs/stage12-n1-2k-final-remainder.md"
      - ".github/workflows/stage12-n1-2k-final-remainder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deterministic report
        run: |
          python scripts/audit_final_remainder_stage12_n1_2k.py --check
