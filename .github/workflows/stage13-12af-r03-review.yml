name: Stage13-12af R03 frozen review bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-r03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify reviewed R03 identity only
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          html = Path('review/STAGE13-FINAL-SELF-CONTAINED-20260809-R03.html')
          manifest = json.loads(Path('stages/stage13/data/13-12af/review_bundle_manifest.json').read_text())

          assert manifest['bundle_id'] == 'STAGE13-FINAL-SELF-CONTAINED-20260809-R03'
          assert manifest['content_sha256'] == '0cf573e546d8e952f36ee5ed8f1f899b3718f0d29751cf4ee64640328ad37b93'
          assert manifest['source_ledger_sha256'] == '06e06c68ced77eb52ab937878f638243e9c43cb4dc4b02be9cba474a94bad2b2'
          assert manifest['source_snapshot_commit'] == 'a6830e80f752fca327470ae3a79e2c88e038ae4e'
          assert manifest['source_count'] == 105
          assert manifest['html_bytes'] == 1026122
          assert html.stat().st_size == 1026122

          blob = subprocess.check_output(['git', 'hash-object', str(html)], text=True).strip()
          assert blob == '6cf9b696cc02f2d556d8f67c30fb85ad77b57373'

          print('Reviewed R03 snapshot is frozen: PASS')
          PY
