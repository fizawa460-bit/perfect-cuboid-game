name: Stage11 bootstrap outputs

on:
  pull_request:
    paths:
      - "scripts/audit_shared_p_convolution_stage11.py"
      - "scripts/update_shared_p_convolution_stage11_memo.py"
      - "data/shared_p_convolution_stage11_report.json"
      - ".github/workflows/stage11-bootstrap.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  generate-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Stage11 branch
        uses: actions/checkout@v4
        with:
          ref: agent/shared-p-convolution-stage11

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate deterministic report and memo
        run: |
          python scripts/audit_shared_p_convolution_stage11.py \
            --write-report data/shared_p_convolution_stage11_report.json
          python scripts/update_shared_p_convolution_stage11_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --report data/shared_p_convolution_stage11_report.json \
            --output generated-face-ratio-geometry-research.md
          mv generated-face-ratio-geometry-research.md docs/face-ratio-geometry-research.md

      - name: Remove temporary bootstrap workflow
        run: rm -f .github/workflows/stage11-bootstrap.yml

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate Stage11 report and research memo"
          git push origin HEAD:agent/shared-p-convolution-stage11
