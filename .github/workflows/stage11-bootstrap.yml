name: Stage11 bootstrap memo

on:
  push:
    branches:
      - agent/shared-p-convolution-stage11
    paths:
      - ".github/workflows/stage11-bootstrap.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Stage11 branch
        uses: actions/checkout@v4
        with:
          ref: agent/shared-p-convolution-stage11

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify report and generate memo
        run: |
          python scripts/audit_shared_p_convolution_stage11.py \
            --write-report generated-shared-p-convolution-stage11-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          committed = json.loads(Path("data/shared_p_convolution_stage11_report.json").read_text(encoding="utf-8"))
          generated = json.loads(Path("generated-shared-p-convolution-stage11-report.json").read_text(encoding="utf-8"))
          if committed != generated:
              raise SystemExit("committed Stage11 report differs before memo generation")
          PY
          python scripts/update_shared_p_convolution_stage11_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --report data/shared_p_convolution_stage11_report.json \
            --output generated-face-ratio-geometry-research.md
          mv generated-face-ratio-geometry-research.md docs/face-ratio-geometry-research.md

      - name: Remove temporary bootstrap workflow
        run: rm -f .github/workflows/stage11-bootstrap.yml

      - name: Commit generated memo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate Stage11 research memo"
          git push origin HEAD:agent/shared-p-convolution-stage11
