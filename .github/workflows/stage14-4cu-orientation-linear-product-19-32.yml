name: Stage14-4cu orientation linear product 19/32
on:
  pull_request:
    paths:
      - 'stages/stage14/14-4cu/**'
      - 'stages/stage14/scripts/14-4/orientation_linear_product_19_32_audit.py'
      - 'stages/stage14/data/14-4/orientation_linear_product_19_32_summary.json'
      - '.github/workflows/stage14-4cu-orientation-linear-product-19-32.yml'
      - 'stages/stage14/14-4ct/**'
      - 'stages/stage14/14-s7-32/**'
      - 'stages/stage14/14-4cs/**'
      - 'stages/stage14/14-4cr/**'
      - 'stages/stage14/14-X10/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Stage14-4cu audit
        run: python stages/stage14/scripts/14-4/orientation_linear_product_19_32_audit.py
      - name: Run 4ct regression
        run: python stages/stage14/scripts/14-4/top_corner_gaussian_core_lift_audit.py
      - name: Run s7-32 regression
        run: python stages/stage14/scripts/14-s7-32/one_host_gaussian_boundary_audit.py
      - name: Run 4cs regression
        run: python stages/stage14/scripts/14-4/five_eighths_boundary_split_audit.py
      - name: Run X10 compatibility regression
        run: python stages/stage14/scripts/14-X10/top_corner_h_cayley_cofactor_audit.py
      - name: Lock theorem boundary
        run: |
          f=stages/stage14/14-4cu/result.md
          grep -Fq 'STAGE14_4CU=COMPLETE_RESIDUAL_CAYLEY_ORIENTATION_LINEAR_PRODUCT_TRANSFER_AND_19_32_PROMOTION' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=19/32' "$f"
          grep -Fq 'IMPROVEMENT_OVER_PREVIOUS_5_8=1/32' "$f"
          grep -Fq 'JOINT_CORE_DIVIDES_ENDPOINT_LINEAR_PRODUCT=true' "$f"
          grep -Fq 'NONPROPORTIONAL_BRANCH_UPPER_BOUND_EXPONENT=19/32' "$f"
          grep -Fq 'PROPORTIONAL_BRANCH_UPPER_BOUND_EXPONENT=9/16' "$f"
          grep -Fq 'NINETEEN_THIRTYSECONDS_SATURATION_THETA=19/64' "$f"
          grep -Fq 'NINETEEN_THIRTYSECONDS_SATURATION_PHI=1/4' "$f"
          grep -Fq 'REMAINING_RECEIVER=NineteenThirtySecondsJointCoreCayleyResidualLinearProductIncidence' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-4cv' "$f"
