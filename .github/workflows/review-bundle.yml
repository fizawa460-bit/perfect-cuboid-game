name: Review bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/stage12-n1-2-final.md"
      - "scripts/build_review_bundle.py"
      - ".github/workflows/review-bundle.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build final review bundle
        run: |
          python -m py_compile scripts/build_review_bundle.py
          python scripts/build_review_bundle.py
          grep -q '^CHECKPOINT=START_OF_MAIN$' review/stage12-n1-2-final-review.md
          grep -q '^CHECKPOINT=END_OF_MAIN$' review/stage12-n1-2-final-review.md
      - name: Upload final review bundle
        uses: actions/upload-artifact@v4
        with:
          name: stage12-n1-2-final-review
          path: review/stage12-n1-2-final-review.md
          if-no-files-found: error
