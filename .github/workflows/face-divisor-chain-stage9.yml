name: Face divisor-chain stage 9

on:
  pull_request:
    paths:
      - "data/two_face_cuboids_1e6_fixed.json"
      - "data/face_divisor_chain_stage9_report.json"
      - "docs/face-ratio-geometry-research.md"
      - "scripts/audit_face_divisor_chain_stage9.py"
      - "scripts/update_face_divisor_chain_stage9_memo.py"
      - ".github/workflows/face-divisor-chain-stage9.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  divisor-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install symbolic dependency for compatibility checks
        run: python -m pip install --disable-pip-version-check sympy

      - name: Run stage-nine divisor-chain audit
        run: |
          python scripts/audit_face_divisor_chain_stage9.py \
            --write-report generated-face-divisor-chain-stage9-report.json

      - name: Regenerate stage-nine research memo
        run: |
          python scripts/update_face_divisor_chain_stage9_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --report generated-face-divisor-chain-stage9-report.json \
            --output generated-face-ratio-geometry-research.md
          grep -n "4.18.*二段階約数鎖" generated-face-ratio-geometry-research.md
          grep -n "oriented divisor chain" generated-face-ratio-geometry-research.md
          grep -n "標準的なsquare sieve" generated-face-ratio-geometry-research.md
          if grep -P "\t" generated-face-ratio-geometry-research.md; then
            echo "Unexpected tab found in generated Markdown" >&2
            exit 1
          fi

      - name: Compare committed stage-nine outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          committed = json.loads(Path("data/face_divisor_chain_stage9_report.json").read_text(encoding="utf-8"))
          generated = json.loads(Path("generated-face-divisor-chain-stage9-report.json").read_text(encoding="utf-8"))
          if committed != generated:
              raise SystemExit("committed stage-nine report differs from regenerated output")

          def compact(path: str) -> list[str]:
              return [line.rstrip() for line in Path(path).read_text(encoding="utf-8").splitlines() if line.strip()]

          if compact("docs/face-ratio-geometry-research.md") != compact("generated-face-ratio-geometry-research.md"):
              raise SystemExit("stage-nine memo content differs after regeneration")
          PY

      - name: Check stage-eight memo compatibility
        run: |
          python scripts/audit_two_face_local_sieve_stage8.py \
            --write-report generated-two-face-stage8-local-sieve-report.json
          python scripts/update_two_face_stage8_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --report generated-two-face-stage8-local-sieve-report.json \
            --output generated-stage8-compatible-memo.md
          python - <<'PY'
          import json
          from pathlib import Path

          committed = json.loads(Path("data/two_face_cuboids_1e6_stage8_local_sieve_report.json").read_text(encoding="utf-8"))
          generated = json.loads(Path("generated-two-face-stage8-local-sieve-report.json").read_text(encoding="utf-8"))
          if committed != generated:
              raise SystemExit("stage-eight report changed under stage nine")

          def compact(path: str) -> list[str]:
              return [line.rstrip() for line in Path(path).read_text(encoding="utf-8").splitlines() if line.strip()]

          if compact("docs/face-ratio-geometry-research.md") != compact("generated-stage8-compatible-memo.md"):
              raise SystemExit("stage-eight updater does not preserve stage-nine memo content")
          PY

      - name: Check stage-seven memo compatibility
        run: |
          python scripts/audit_two_face_inverse_height_stage7.py \
            --write-report generated-two-face-stage7-inverse-height-report.json
          python scripts/update_two_face_stage7_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --report generated-two-face-stage7-inverse-height-report.json \
            --output unnormalized-stage7-compatible-memo.md
          python scripts/normalize_two_face_stage7_memo.py \
            --input unnormalized-stage7-compatible-memo.md \
            --output generated-stage7-compatible-memo.md
          python - <<'PY'
          import json
          from pathlib import Path

          committed = json.loads(Path("data/two_face_cuboids_1e6_stage7_inverse_height_report.json").read_text(encoding="utf-8"))
          generated = json.loads(Path("generated-two-face-stage7-inverse-height-report.json").read_text(encoding="utf-8"))
          if committed != generated:
              raise SystemExit("stage-seven report changed under stage nine")

          def compact(path: str) -> list[str]:
              return [line.rstrip() for line in Path(path).read_text(encoding="utf-8").splitlines() if line.strip()]

          if compact("docs/face-ratio-geometry-research.md") != compact("generated-stage7-compatible-memo.md"):
              raise SystemExit("stage-seven updater does not preserve stage-nine memo content")
          PY

      - name: Upload stage-nine outputs
        uses: actions/upload-artifact@v4
        with:
          name: face-divisor-chain-stage9
          path: |
            generated-face-divisor-chain-stage9-report.json
            generated-face-ratio-geometry-research.md
