name: Stage32 MB intermediate hostile-audit checkpoint

# Lifecycle: ACTIVE_AUTO. This is the current MB104 frozen audit frontier.
# Retire or demote this workflow before substantive MB104 research resumes.
on:
  pull_request:
    paths:
      - 'stages/stage32/final-chain/32-03-multibranch/**'
      - '.github/workflows/stage32-mb-intermediate-audit-checkpoint.yml'
      - '.github/workflows/stage32-mb-z40-p-null-picard64.yml'
      - '.github/workflows/stage32-mb-z40-picard64.yml'
      - 'docs/research-os/policies/repo-workflow-trigger-inventory-20260911.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-mb-intermediate-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact PR head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Verify corrected pair-map boundary
        run: |
          set -euo pipefail
          python stages/stage32/final-chain/32-03-multibranch/nodes/MB104/verify_mb104_000707_deg4_pair_map_audit_boundary.py

      - name: Verify frozen R4 zero-credit result
        run: |
          set -euo pipefail
          python stages/stage32/final-chain/32-03-multibranch/nodes/MB104/verify_mb104_shallow_fresh_weapon_portfolio_r4.py

      - name: Verify lifecycle inventory and controller freeze
        run: |
          set -euo pipefail
          python stages/stage32/final-chain/32-03-multibranch/nodes/MB104/verify_mb104_intermediate_audit_lifecycle.py

      - name: Exact-head workflow lifecycle replay
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path

          repo=os.environ["REPOSITORY"]
          head=os.environ["HEAD_SHA"]
          event_sha=os.environ["EVENT_SHA"]
          pr=int(os.environ["PR_NUMBER"])
          token=os.environ["GH_TOKEN"]

          inv=json.loads(Path("docs/research-os/policies/repo-workflow-trigger-inventory-20260911.json").read_text())
          classes={}
          for cls, paths in inv["classifications"].items():
              for p in paths:
                  classes[p]=cls

          url=f"https://api.github.com/repos/{repo}/actions/runs?event=pull_request&per_page=100"
          req=urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req) as resp:
              payload=json.load(resp)

          exact=[]
          for run in payload.get("workflow_runs", []):
              prs=run.get("pull_requests") or []
              same_pr=any(int(x.get("number",-1))==pr for x in prs)
              same_sha=run.get("head_sha") in {head,event_sha}
              if same_pr and same_sha:
                  exact.append(run)

          rows=[]
          bad=[]
          for run in exact:
              path=run.get("path")
              cls=classes.get(path,"UNCLASSIFIED")
              row={
                  "id":run.get("id"),
                  "name":run.get("name"),
                  "path":path,
                  "event":run.get("event"),
                  "status":run.get("status"),
                  "conclusion":run.get("conclusion"),
                  "head_sha":run.get("head_sha"),
                  "class":cls,
              }
              rows.append(row)
              if cls in {"MANUAL","RETIRED","UNCLASSIFIED"}:
                  bad.append(row)

          print(json.dumps({
              "pr":pr,
              "requested_head":head,
              "event_sha":event_sha,
              "total_pr_triggered_exact_head_runs":len(rows),
              "manual_retired_or_unclassified_automatic_runs":len(bad),
              "runs":rows,
          }, indent=2, sort_keys=True))

          if not rows:
              raise SystemExit("FAIL: no exact-head PR-triggered workflow replay evidence")
          if bad:
              raise SystemExit("FAIL: MANUAL/RETIRED/unclassified automatic run detected")
          PY
