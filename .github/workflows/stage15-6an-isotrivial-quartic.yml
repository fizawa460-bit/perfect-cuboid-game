name: Stage15-6an isotrivial quartic

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6an/**'
      - 'stages/stage15/evidence/stage15_6an_isotrivial_quartic.json'
      - 'stages/stage15/replay/verify_stage15_6an.py'
      - 'stages/stage15/scripts/stage15_6an_isotrivial_quartic.py'
      - '.github/workflows/stage15-6an-isotrivial-quartic.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6an isotrivial quartic audit
        run: python stages/stage15/replay/verify_stage15_6an.py
      - name: Compile Stage15-6an utility
        run: python -m py_compile stages/stage15/scripts/stage15_6an_isotrivial_quartic.py stages/stage15/replay/verify_stage15_6an.py
