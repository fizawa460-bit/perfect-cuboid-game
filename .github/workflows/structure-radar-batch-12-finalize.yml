name: StructureRadar batch12 finalize
on:
  push:
    branches: [structure-radar-deep-corpus-batch-12]
permissions:
  contents: write
jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'trigger batch12 finalizer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-12
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize batch12 and verify
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')
          batch_id='SR-BATCH-STAGE14_15_DEEP_CORPUS-12-R01'
          task_id='SR-CENSUS-STAGE14_15_DEEP_CORPUS-01'
          q=json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          task=next(t for t in q['tasks'] if t['status']=='READY' and t['group']=='STAGE14_15_DEEP_CORPUS')
          ids=task['source_ids']
          assert len(ids)==60
          manifest={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
            for s in json.loads(p.read_text())['sources']:
              manifest[s['source_id']]=s
          rows={sid:manifest[sid] for sid in ids}
          assert all(rows[sid]['kind']=='RESULT' for sid in ids)
          stage_sid={pathlib.Path(rows[sid]['path']).parent.name:sid for sid in ids}
          expected_stages={
            '14-s5k','14-s5l','14-s5m','14-s5n','14-s5o','14-s5p','14-s5q','14-s5r','14-s5s','14-s5t','14-s5u',
            '14-s6-00','14-s6-01','14-s6-02','14-s6-03','14-s6-04','14-s6-05','14-s6-06','14-s6-07','14-s6-08','14-s6-09','14-s6-10',
            '14-s7-00','14-s7-01','14-s7-02','14-s7-03','14-s7-04','14-s7-05','14-s7-06','14-s7-07','14-s7-08','14-s7-09','14-s7-10','14-s7-11','14-s7-12',
            '14-s7-100','14-s7-101','14-s7-102','14-s7-103','14-s7-104','14-s7-105','14-s7-106','14-s7-107','14-s7-108','14-s7-109','14-s7-110','14-s7-111','14-s7-112','14-s7-113','14-s7-114','14-s7-115','14-s7-116','14-s7-117','14-s7-118','14-s7-119','14-s7-120','14-s7-121','14-s7-122','14-s7-123','14-s7-124'
          }
          assert set(stage_sid)==expected_stages, (len(stage_sid), sorted(expected_stages-set(stage_sid)), sorted(set(stage_sid)-expected_stages))

          mapping={
            '14-s5k':['SR-STR-161'],
            '14-s5l':['SR-STR-161','SR-STR-193'],
            '14-s5m':['SR-STR-161','SR-STR-193'],
            '14-s5n':['SR-STR-161'],
            '14-s5o':['SR-STR-192'],
            '14-s5p':['SR-STR-192'],
            '14-s5q':['SR-STR-193'],
            '14-s5r':['SR-STR-193'],
            '14-s5s':['SR-STR-162'],
            '14-s5t':['SR-STR-192','SR-STR-193'],
            '14-s5u':['SR-STR-192','SR-STR-193','SR-STR-218'],
            '14-s6-00':['SR-STR-162'],
            '14-s6-01':['SR-STR-175','SR-STR-185'],
            '14-s6-02':['SR-STR-175'],
            '14-s6-03':['SR-STR-189'],
            '14-s6-04':['SR-STR-176','SR-STR-189'],
            '14-s6-05':['SR-STR-176'],
            '14-s6-06':['SR-STR-177'],
            '14-s6-07':['SR-STR-177','SR-STR-184'],
            '14-s6-08':['SR-STR-184','SR-STR-190'],
            '14-s6-09':['SR-STR-195','SR-STR-219'],
            '14-s6-10':['SR-STR-162','SR-STR-195','SR-STR-219'],
            '14-s7-00':['SR-STR-162','SR-STR-219'],
            '14-s7-01':['SR-STR-162'],
            '14-s7-02':['SR-STR-162'],
            '14-s7-03':['SR-STR-162'],
            '14-s7-04':['SR-STR-162'],
            '14-s7-05':['SR-STR-195'],
            '14-s7-06':['SR-STR-195'],
            '14-s7-07':['SR-STR-186','SR-STR-195'],
            '14-s7-08':['SR-STR-186','SR-STR-194'],
            '14-s7-09':['SR-STR-188'],
            '14-s7-10':['SR-STR-188'],
            '14-s7-11':['SR-STR-220'],
            '14-s7-12':['SR-STR-221'],
            '14-s7-100':['SR-STR-213'],
            '14-s7-101':['SR-STR-213'],
            '14-s7-102':['SR-STR-213'],
            '14-s7-103':['SR-STR-213'],
            '14-s7-104':['SR-STR-213'],
            '14-s7-105':['SR-STR-214'],
            '14-s7-106':['SR-STR-213'],
            '14-s7-107':['SR-STR-213','SR-STR-214'],
            '14-s7-108':['SR-STR-214'],
            '14-s7-109':['SR-STR-214'],
            '14-s7-110':['SR-STR-214'],
            '14-s7-111':['SR-STR-213'],
            '14-s7-112':['SR-STR-213'],
            '14-s7-113':['SR-STR-213'],
            '14-s7-114':['SR-STR-214'],
            '14-s7-115':['SR-STR-214'],
            '14-s7-116':['SR-STR-214'],
            '14-s7-117':['SR-STR-215'],
            '14-s7-118':['SR-STR-213'],
            '14-s7-119':['SR-STR-215'],
            '14-s7-120':['SR-STR-215'],
            '14-s7-121':['SR-STR-215'],
            '14-s7-122':['SR-STR-215'],
            '14-s7-123':['SR-STR-215'],
            '14-s7-124':['SR-STR-215'],
          }
          assert set(mapping)==expected_stages

          regp=root/'docs/structure-radar/structure-registry.json'
          progp=root/'docs/structure-radar/progress.json'
          reg=json.loads(regp.read_text())
          prog=json.loads(progp.read_text())
          assert batch_id not in {b['batch_id'] for b in prog['audit_batches']}
          cards={c['structure_id']:c for c in reg['structures']}
          assert all(f'SR-STR-{i:03d}' not in cards for i in range(218,222))

          def prov(stage, locator):
            sid=stage_sid[stage]; s=rows[sid]
            return {'source_id':sid,'path':s['path'],'locator':locator,'fingerprint':s['fingerprint']}
          def title_for(stage):
            text=(root/rows[stage_sid[stage]]['path']).read_text(errors='replace')
            for line in text.splitlines():
              if line.strip().startswith('#'):
                return line.lstrip('# ').strip()
            return stage

          new_cards=[
            {
              'structure_id':'SR-STR-218',
              'canonical_math_name':'Fixed-tuple projective all-short lattice refinement and cross-tuple energy quantifier firewall',
              'exact_equations_or_object':'After projective root data are fixed, a complete all-short local state tuple is a rank-two projective lattice whose index is the product state modulus, so its centered boundary discrepancy is O(M B^epsilon) on a regular Euclid box and the generic positive q-loss disappears. The Hilbert/Fourier l2 bounds are conditional on a fixed physical support cell and therefore cannot be summed as one globally normalized coefficient vector over all moving modulus tuples; cross-tuple cardinality must remain explicit.',
              'search_terms_primary':['projective all-short state tuple lattice index product modulus','cross-tuple Hilbert energy quantifier mismatch'],
              'search_terms_aliases':['s5u all-short projective refinement','global tuple cardinality firewall'],
              'theorem_species':['projective lattice incidence','boundary discrepancy','quantifier firewall'],
              'repo_provenance':[prov('14-s5u','projective all-short lattice refinement and cross-tuple energy boundary')],
              'target_populations':['Stage14 local 2-descent all-short state tuples'],
              'potential_weapon_types':['LATTICE_COUNT','NO_DOUBLE_COUNT','QUANTIFIER_FIREWALL'],
              'applicability_gaps':['The fixed-tuple lattice estimate does not remove the number of distinct moving modulus tuples.','Historical 41/42-type optimization values are superseded; the reusable content is the fixed-tuple geometry and the cross-tuple quantifier boundary.'],
              'existing_radar_overlap':['SR-STR-161','SR-STR-192','SR-STR-193'],
              'search_status':'NOT_SEARCHED','arsenal_decision':'PENDING','card_status':'SUBMITTED_FOR_AUDIT'
            },
            {
              'structure_id':'SR-STR-219',
              'canonical_math_name':'Fixed-direction j=1728 fiber compression versus active-direction sparsity barrier',
              'exact_equations_or_object':'The s6 half-angle cross-square quartic is the fixed-direction j=1728 squareclass quartic up to the fixed class -1, so each primitive direction has only B^o(1) physical partners in the polynomial-height window. Consequently physical edge count and active-direction count have the same power exponent. This fixed-fiber compression, local solvability, and the universal boundary rational anchor do not force a power-sparse set of active directions; a family-level first-nonboundary-point or specialization theorem is required.',
              'search_terms_primary':['fixed direction j1728 squareclass fiber active direction sparsity','first nonboundary point family specialization active directions'],
              'search_terms_aliases':['s6 active-direction barrier','subpolynomial partner degree does not sparse vertices'],
              'theorem_species':['genus-one fixed-fiber compression','active-direction reduction','family-level obstruction'],
              'repo_provenance':[prov('14-s6-09','fixed-direction squareclass-energy transfer'),prov('14-s6-10','active-direction obstruction and method closure'),prov('14-s7-00','family first-nonboundary-point architecture')],
              'target_populations':['Stage14 physical partner-direction graph after fixed-fiber compression'],
              'potential_weapon_types':['FIBER_COMPRESSION','OBSTRUCTION','SPECIALIZATION_GATE'],
              'applicability_gaps':['Subpolynomial degree per active direction alone gives no power saving for the number of active directions.','Global solubility of the direction curve is not a useful filter when the universal boundary point is always present.'],
              'existing_radar_overlap':['SR-STR-162','SR-STR-184','SR-STR-195'],
              'search_status':'NOT_SEARCHED','arsenal_decision':'PENDING','card_status':'SUBMITTED_FOR_AUDIT'
            },
            {
              'structure_id':'SR-STR-220',
              'canonical_math_name':'Higher-cell torus-quotient barrier for shared-squareclass detectors',
              'exact_equations_or_object':'The three-cell and four-cell shared-squareclass detectors factor through the same effective two-cell torus quotient, with kernel dimensions one and two respectively. Their Fourier sums satisfy exact fiber identities, so pairwise two-cell savings are not independent and cannot be multiplied. A direct ideal d-cell square sieve gives only relative scale V^(-1/(d+1)), making the higher-cell enlargement no stronger than the established two-cell receiver.',
              'search_terms_primary':['multicell torus quotient shared squareclass square sieve','three cell four cell detector Fourier fiber identity'],
              'search_terms_aliases':['s7 multicell barrier','pairwise two-cell savings do not multiply'],
              'theorem_species':['torus quotient','Fourier fiber identity','square-sieve no-go'],
              'repo_provenance':[prov('14-s7-11','multicell torus quotient and architecture barrier')],
              'target_populations':['Stage14 shared-squareclass four-cell packets'],
              'potential_weapon_types':['NO_GO','TRACE_FUNCTION','QUANTIFIER_FIREWALL'],
              'applicability_gaps':['The statement blocks naive higher-cell compounding; it does not rule out a genuinely new common-refinement theorem.','Historical whole-family exponent values are not the normalized reusable claim.'],
              'existing_radar_overlap':['SR-STR-186','SR-STR-188','SR-STR-194'],
              'search_status':'NOT_SEARCHED','arsenal_decision':'PENDING','card_status':'SUBMITTED_FOR_AUDIT'
            },
            {
              'structure_id':'SR-STR-221',
              'canonical_math_name':'Unbalanced short-denominator square-part versus two-cell minimum receiver',
              'exact_equations_or_object':'Canonically orient the reduced-coordinate pair so Q<=S and write Q=b*y^2. Large square part y>=Y gives coordinate-support sparsity D^2/Y, while y<Y forces a large adjacent two-cell coefficient b>=Q/Y^2 and activates the proved b^(-1/3) two-cell saving. The same restricted set is bounded by both mechanisms, so one takes their minimum rather than multiplying correlated savings. The historical one-parameter minimax occurs at Y=B^(1/11), Q=B^(5/11) and yielded the then-current 10/11 whole-family bound.',
              'search_terms_primary':['short denominator square part two cell minimum receiver','unbalanced denominator support sparsity adjacent coefficient'],
              'search_terms_aliases':['s7-12 10/11 receiver','min not product squarepart two-cell'],
              'theorem_species':['support sparsity','adaptive dyadic minimax','quantifier-safe receiver'],
              'repo_provenance':[prov('14-s7-12','unbalanced short-denominator receiver and exact minimax barrier')],
              'target_populations':['Stage14 reduced-coordinate physical two-point family'],
              'potential_weapon_types':['UPPER_BOUND_RECEIVER','DYADIC_SPLIT','NO_DOUBLE_COUNT'],
              'applicability_gaps':['The 10/11 exponent is historical and superseded by later Stage14 work; retain the mechanism, not the obsolete global ceiling.','The fixed-coordinate and two-cell savings are alternative upper bounds on the same set and must not be multiplied.'],
              'existing_radar_overlap':['SR-STR-186','SR-STR-194','SR-STR-220'],
              'search_status':'NOT_SEARCHED','arsenal_decision':'PENDING','card_status':'SUBMITTED_FOR_AUDIT'
            }
          ]
          reg['structures'].extend(new_cards)
          cards.update({c['structure_id']:c for c in new_cards})

          new_ids={'SR-STR-218','SR-STR-219','SR-STR-220','SR-STR-221'}
          existing_touched=set()
          for stage,sids in mapping.items():
            sid=stage_sid[stage]; s=rows[sid]
            prog['source_reviews'][sid]={
              'fingerprint':s['fingerprint'],
              'batch_id':batch_id,
              'status':'STRUCTURES_RECORDED',
              'structure_ids':sids,
            }
            for cid in sids:
              if cid in new_ids: continue
              assert cid in cards, cid
              existing_touched.add(cid)
              c=cards[cid]
              p={'source_id':sid,'path':s['path'],'locator':f'batch12 normalized provenance: {title_for(stage)}','fingerprint':s['fingerprint']}
              if not any(x.get('source_id')==sid and x.get('path')==s['path'] for x in c.get('repo_provenance',[])):
                c.setdefault('repo_provenance',[]).append(p)
              c['card_status']='SUBMITTED_FOR_AUDIT'
          assert len(existing_touched)==18, sorted(existing_touched)

          prog['audit_batches'].append({
            'batch_id':batch_id,
            'task_id':task_id,
            'status':'SUBMITTED_FOR_AUDIT',
            'source_ids':ids,
            'sources_reviewed':60,
            'structures_added':4,
            'structures_updated':18,
            'structure_carrier_sources':60,
            'structures_deduped':0,
            'searches_completed':0,
            'arsenal_decisions':0,
            'audit_required':True,
            'duplicate_source':0,
            'no_distinct_structure':0,
          })
          reg['status']='BATCH_SUBMITTED_FOR_AUDIT'
          regp.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')
          progp.write_text(json.dumps(prog,indent=2,ensure_ascii=False)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python scripts/verify_research_arsenal.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/structure-radar-batch-12-index-trigger.txt .github/structure-radar-batch-12-summary-trigger.txt .github/structure-radar-batch-12-summary.txt .github/structure-radar-batch-12-index-*.json || true
          git rm -f .github/workflows/structure-radar-batch-12-index.yml .github/workflows/structure-radar-batch-12-summary.yml .github/workflows/structure-radar-batch-12-finalize.yml || true
          git rm -f .github/structure-radar-batch-12-finalize-trigger.txt || true
          git add docs/structure-radar
          git commit -m 'StructureRadar: census Stage14-15 deep corpus batch 12'
          git push origin HEAD:structure-radar-deep-corpus-batch-12
