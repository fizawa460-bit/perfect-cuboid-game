name: Stage32EX5 BC2-40 historical replay

# Trigger lifecycle: RETIRED.
# BC2-40 generation 4 is already hostile-audited and consumed into EX5 authority.
# Historical replay is explicit/manual only. No new BC2-40 heavy generation is authorized here.
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Optional exact commit/ref to replay; defaults to dispatch ref'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-consumed-bc2-40:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Verify retained BC2-40 resume-first contract
        run: python stages/stage32-ex5/breadth-cycle-2/verify_bc2_40_resume_first_contract.py
