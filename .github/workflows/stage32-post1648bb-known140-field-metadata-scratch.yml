name: Stage32 post1648BB known140 field metadata inventory

on:
  push:
    branches:
      - stage32-scratch-post1648bb-known140-field-metadata

permissions:
  contents: read

jobs:
  diagnose-bb-known140-field-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact scratch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Run BB known140 field metadata inventory
        run: python3 -B stages/stage32/residual-32-01-production/diagnose_stage32_post1648bb_known140_field_metadata_inventory.py | tee /tmp/bb-field.json
      - name: Assert bounded inventory
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/bb-field.json'))
          assert x['mode']=='SCRATCH_POST1648BB_KNOWN140_FIELD_METADATA_INVENTORY'
          assert x['firewalls']['runner_side_import_only'] is True
          assert x['firewalls']['giant_retained_payload_whole_fetch_used'] is False
          assert x['firewalls']['repository_absence_claimed'] is False
          print(json.dumps({
            'top_keys':x['top_level_keys'],
            'counts':x['counts'],
            'keyword_hits':x['keyword_path_hits'],
          }, sort_keys=True))
          PY
      - name: Diff hygiene
        run: test -z "$(git status --porcelain)"
