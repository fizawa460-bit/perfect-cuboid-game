name: Stage29-01 audit lock

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify audited Stage29-01 state
        run: python stages/stage29/29-01/verify_29_01.py
