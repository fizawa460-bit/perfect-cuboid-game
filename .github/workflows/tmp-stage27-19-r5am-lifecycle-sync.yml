name: Temporary Stage27-19-r5am lifecycle sync

on:
  push:
    branches:
      - agent/stage27-19-r5am-pell-compression
    paths:
      - 'stages/stage27/27-19-r5am/_sync_successor_lifecycle.py'
      - '.github/workflows/tmp-stage27-19-r5am-lifecycle-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-19-r5am-pell-compression
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply successor lifecycle synchronization
        run: |
          python stages/stage27/27-19-r5am/_sync_successor_lifecycle.py
          python -m json.tool stages/stage27/27-controller.json >/dev/null
          python -m json.tool stages/stage27/27-19-r5aj/route-contract.json >/dev/null
          python -m json.tool stages/stage27/27-19-r5al/route-contract.json >/dev/null
          python -m json.tool stages/stage27/27-19-r5am/route-contract.json >/dev/null
          python stages/stage27/27-19-r5aj/verify_27_19_r5aj_r5ak.py
          python stages/stage27/27-19-r5al/verify_27_19_r5al.py
          python stages/stage27/27-19-r5am/verify_27_19_r5am_r5an.py
          git diff --check
      - name: Commit synchronization and self-clean
        run: |
          rm stages/stage27/27-19-r5am/_sync_successor_lifecycle.py
          rm .github/workflows/tmp-stage27-19-r5am-lifecycle-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Stage27-19-r5am: sync audited predecessors and activate r5am-r5an'
          git push origin HEAD:agent/stage27-19-r5am-pell-compression
