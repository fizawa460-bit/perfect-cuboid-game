name: Stage35-EX Goal4AH degree31 RR effectivity

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage35-ex/runkeys/goal4ah-degree31-rr.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          KEY='stages/stage35-ex/runkeys/goal4ah-degree31-rr.json'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test '${{ github.event_name }}' = 'pull_request' || exit 0
          test "${PR_NUMBER}" = '1659' || exit 0
          test "${HEAD_REF}" = 'stage35-ex-goal4x-open-receiver-boundary-picard' || exit 0
          test -n "${BEFORE}" || exit 0
          git fetch --no-tags --depth=1 origin "${BEFORE}" || exit 0
          git diff --name-only "${BEFORE}" "${HEAD_SHA}" | grep -Fxq "$KEY" || exit 0
          python - <<'PY' > /tmp/auth
          import hashlib,json
          from pathlib import Path
          k=json.loads(Path('stages/stage35-ex/runkeys/goal4ah-degree31-rr.json').read_text())
          p=Path('stages/stage35-ex/diagnose_stage35_ex_35_goal4ah_degree31_rr.py')
          b=p.read_bytes(); blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          ok=(k.get('schema')=='STAGE35_EX_GOAL4AH_DEGREE31_RR_RUNKEY_V1' and k.get('armed') is True and
              k.get('generation')==1 and blob==k.get('probe_blob_sha1')=='d797ee20d7ee6f81f159249b61c492230d8eb306' and
              k.get('planned_jobs')==1 and k.get('actions_artifact_upload') is False)
          print('true' if ok else 'false')
          PY
          test "$(tail -n1 /tmp/auth)" = true || exit 0
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  diagnose:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic dependency
        run: pip install sympy==1.14.0
      - name: Exact d31 strip, Galois and Riemann-Roch replay
        run: |
          set -euo pipefail
          python -B stages/stage35-ex/diagnose_stage35_ex_35_goal4ah_degree31_rr.py | tee /tmp/rr.log
          grep -q '^GOAL4AH_RR_JSON=' /tmp/rr.log
          test "$(wc -c </tmp/rr.log)" -le 65536
      - name: Enforce no-credit boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=next(x.split('=',1)[1] for x in Path('/tmp/rr.log').read_text().splitlines() if x.startswith('GOAL4AH_RR_JSON='))
          d=json.loads(s)
          assert d['schema']=='STAGE35_EX_GOAL4AH_DEGREE31_RR_EFFECTIVITY_DIAGNOSTIC_V1'
          assert d['degree']==31 and d['strip_steps']==325
          assert d['stripped_residual_H_degree']==96 and d['stripped_residual_square']==212
          assert d['surface_K_square']==16 and d['surface_chi_O']==8
          assert d['chi_O_D']==66 and d['H_dot_K_minus_D']==-80
          assert d['explicit_F_B_materialized'] is False
          assert d['theorem_credit'] is False and d['endpoint_credit'] is False
          assert d['E1_proved'] is False and d['stage35_closed'] is False
          print('GOAL4AH_RR_BOUNDARY=PASS')
          PY
