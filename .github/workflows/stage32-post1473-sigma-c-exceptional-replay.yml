name: Stage32 post-1473 sigma-c exceptional replay

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/stage32-post1473-sigma-c-exceptional-replay.yml'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_post1473_sigma_c_exceptional_replay.py'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_post1473_kc_pinned_replay.py'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_post1473_kc_pinned_replay_v7.py'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_post1473_kc_pinned_replay_v8.py'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_post1473_kc_pinned_replay_v9.py'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_post1473_kc_pinned_replay_v10.py'

permissions:
  contents: read

concurrency:
  group: stage32-post1473-sigma-c-exceptional-replay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Replay compact c-sign, Picard64, E_pi ordering and Kc pushforward square
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python diagnose_stage32_post1473_kc_pinned_replay_v10.py \
            --tangent "$GITHUB_WORKSPACE/stages/stage33/33-07/exceptional-p1-tangent-coordinates.json" \
            --marking "$GITHUB_WORKSPACE/stages/stage33/33-07/stage32_picard_marking_retained.py" \
            --output "$RUNNER_TEMP/stage32-post1473-sigma-c-exceptional-replay.json"
      - name: Enforce compact evidence size
        run: |
          test -f "$RUNNER_TEMP/stage32-post1473-sigma-c-exceptional-replay.json"
          BYTES=$(wc -c < "$RUNNER_TEMP/stage32-post1473-sigma-c-exceptional-replay.json")
          echo "artifact_bytes=$BYTES"
          test "$BYTES" -le 100000
      - name: Upload compact replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-post1473-sigma-c-exceptional-replay
          path: ${{ runner.temp }}/stage32-post1473-sigma-c-exceptional-replay.json
          retention-days: 3
          compression-level: 9
