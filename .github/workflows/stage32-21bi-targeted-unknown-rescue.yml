name: Stage32-21bi targeted UNKNOWN rescue

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/stage32-21bi-targeted-unknown-rescue.yml'
      - 'stages/stage32/residual-32-01-production/audit_stage32_21bi_targeted_unknown_rescue.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-21bi-targeted-unknown-rescue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - id: gate
        name: Authorize only from current synchronization range
        shell: bash
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          authorized=false
          if [ -n "$BEFORE" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$BEFORE" "$HEAD")"
              if printf '%s\n' "$changed" | grep -Eq '^(\.github/workflows/stage32-21bi-targeted-unknown-rescue\.yml|stages/stage32/residual-32-01-production/audit_stage32_21bi_targeted_unknown_rescue\.py)$'; then
                authorized=true
              fi
            fi
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "authorized=$authorized"

  rescue:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Download the two exact source shards from run 33362677934
        uses: actions/download-artifact@v4
        with:
          run-id: 33362677934
          github-token: ${{ github.token }}
          pattern: stage32-21bi-r57-projection-*
          path: source-artifacts
      - name: Rescue the sole timeout and repair the exact aggregate
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python audit_stage32_21bi_targeted_unknown_rescue.py \
            --input-dir "$GITHUB_WORKSPACE/source-artifacts" \
            --source-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21az-survivor-prism.json" \
            --formula-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bb-r51-interval-formula.json" \
            --pair-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bc-pair-combination-bounds.json" \
            --audit-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21be-r51-endpoint-audit.json" \
            --fifth-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bf-r49-per-triple-projection.json" \
            --sixth-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bg-r42-corrected-domain-audit.json" \
            --seventh-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bh-r54-lossless-table.json" \
            --retained "$GITHUB_WORKSPACE/stages/stage33/33-07/picard_base_rows_retained.py" \
            --marking "$GITHUB_WORKSPACE/stages/stage33/33-07/stage32_picard_marking_retained.py" \
            --per-check-timeout-ms 20000 \
            --output "$GITHUB_WORKSPACE/stage32-21bi-r57-targeted-rescue-aggregate.json"
      - name: Upload repaired compact aggregate
        uses: actions/upload-artifact@v4
        with:
          name: stage32-21bi-r57-targeted-rescue-aggregate
          path: stage32-21bi-r57-targeted-rescue-aggregate.json
          retention-days: 3
          compression-level: 9
