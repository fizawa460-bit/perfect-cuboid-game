name: Stage14-4co singular Cayley squareclass lock
on:
  pull_request:
    paths:
      - 'stages/stage14/14-4co/**'
      - 'stages/stage14/scripts/14-4/singular_cayley_squareclass_lock_audit.py'
      - 'stages/stage14/data/14-4/singular_cayley_squareclass_lock_summary.json'
      - '.github/workflows/stage14-4co-singular-cayley-squareclass-lock.yml'
      - 'stages/stage14/14-4cn/**'
      - 'stages/stage14/14-s7-28/**'
      - 'stages/stage14/14-X5/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Stage14-4co audit
        run: python stages/stage14/scripts/14-4/singular_cayley_squareclass_lock_audit.py
      - name: Run 4cn predecessor regression
        run: python stages/stage14/scripts/14-4/reciprocal_edwards_reduction_audit.py
      - name: Lock theorem boundary
        run: |
          f=stages/stage14/14-4co/result.md
          grep -Fq 'STAGE14_4CO=COMPLETE_SINGULAR_CAYLEY_GCD_SQUARE_AND_RESIDUAL_SQUARECLASS_LOCK' "$f"
          grep -Fq 'SINGULAR_ODD_VRES_SQUARECLASS_EQUALS_ODD_RS=true' "$f"
          grep -Fq 'SINGULAR_ODD_URES_SQUARECLASS_EQUALS_ODD_XY=true' "$f"
          grep -Fq 'FIXED_ROOT_SINGULAR_RESIDUAL_PAIR_SUPPORT_EXPONENT=1/8' "$f"
          grep -Fq 'SINGULAR_RELAXED_PRIMITIVE_LINEAR_FAMILY_EXISTS=true' "$f"
          grep -Fq 'SINGULAR_CAYLEY_FIBER_BO1_PROVED=false' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/8' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=true' "$f"
          grep -Fq 'SINGULAR_BRANCH_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-4cp' "$f"
