name: Stage32 32-01-178 lowmass separable Picard preflight

# lifecycle: ACTIVE_AUTO
# Current Stage32 178 frontier only. Remove automatic trigger after exact-head replay.
on:
  push:
    branches:
      - stage32-01-178-post-td02-fibration-nef
    paths:
      - 'stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_lowmass_parity_separable_picard_min.py'
      - '.github/workflows/stage32-01-178-lowmass-separable-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-01-178-lowmass-separable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy
      - name: Exact low-mass parity-separable Picard minimum
        run: python stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_lowmass_parity_separable_picard_min.py
      - name: Diff hygiene
        run: git diff --check
