name: Temporary StructureRadar audit repair 1082
on:
  push:
    branches: [structureradar/stage16-25-02]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Repair current M3 envelope normalization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          radar=Path('docs/structure-radar')
          rp=radar/'structure-registry.json'; pp=radar/'progress.json'
          reg=json.loads(rp.read_text()); prog=json.loads(pp.read_text())
          cards={c['structure_id']:c for c in reg['structures']}
          c=cards['SR-STR-146']
          c['canonical_math_name']='Current certified Euler-cuboid global envelope with unresolved true exponent'
          c['exact_equations_or_object']='For the primitive canonical Euler population under R<=B, the current project-wide bounds are: for every epsilon>0, M3(B)>>_epsilon B^(1/3-epsilon), and for every fixed eta<1/46, M3(B)<<_eta B(log B)^(5-eta). The lower is the generalized two-parameter Saunderson theorem promoted by Stage26; the upper is the explicit thin-cover bound inherited by the Stage20 closeout. No epsilon-free one-third lower, asymptotic, or true exponent is identified.'
          c['search_terms_primary']=['Euler cuboid current global upper lower exponent','primitive Euler brick B one third epsilon lower log power upper']
          c['search_terms_aliases']=['current Euler population envelope','M3 current project-wide bracket']
          # Add already-reviewed Stage26 supersession provenance if absent.
          add=[
            {'source_id':'SRC-EB6285D8A4E2','path':'docs/stage26-arsenal-promotion.md','locator':'S26-W01 generalized Saunderson current lower','fingerprint':'0af5d96fa5d3ba5a1df18d6105f4925f0f69a36cc506c466557f3d3fe059fdbd'},
            {'source_id':'SRC-66781CB77DD9','path':'stages/stage26/26-60/result.md','locator':'generalized two-parameter Saunderson B^(1/3-epsilon) lower','fingerprint':'d87690f91e10f3bcf4d3e49ae5d2030c8ff8a9d12fe4e3e7a2eb133463354a9e'}
          ]
          seen={(p.get('source_id'),p.get('locator')) for p in c['repo_provenance']}
          for p in add:
            if (p['source_id'],p['locator']) not in seen: c['repo_provenance'].append(p)
          c['applicability_gaps']=['No epsilon-free B^(1/3) lower is proved; no fixed polynomial upper saving, asymptotic, or true exponent is known. The Stage20 one-parameter B^(1/6) lower remains valid historically but is superseded as the strongest current lower by the Stage26 generalized Saunderson theorem.']
          c['existing_radar_overlap']=['SR-STR-002','SR-STR-003','SR-STR-077']
          # Keep source-review provenance index synchronized for already-reviewed Stage26 sources.
          for sid in ['SRC-EB6285D8A4E2','SRC-66781CB77DD9']:
            row=prog['source_reviews'][sid]
            ids=row.setdefault('structure_ids',[])
            if 'SR-STR-146' not in ids: ids.append('SR-STR-146')
          rp.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')
          pp.write_text(json.dumps(prog,indent=2,ensure_ascii=False)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
      - name: Commit repair and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-structureradar-audit-repair-1082.yml
          git add docs/structure-radar
          git diff --check --cached
          git commit -m 'StructureRadar audit: repair current Euler envelope'
          git push
