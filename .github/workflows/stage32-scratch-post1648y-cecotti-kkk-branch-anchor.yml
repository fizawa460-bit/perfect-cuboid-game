name: Stage32 scratch post1648Y Cecotti KKK branch-anchor subsumption

on:
  push:
    branches:
      - stage32-scratch-post1648n-marked-ppav-basis
    paths:
      - '.github/workflows/stage32-scratch-post1648y-cecotti-kkk-branch-anchor.yml'
      - 'stages/stage32/residual-32-01-production/post1648y-cecotti-kkk-literal-branch-anchor-subsumption.json'
      - 'stages/stage32/residual-32-01-production/post1648y-cecotti-kkk-literal-branch-anchor-subsumption-source-note.md'
      - 'stages/stage32/residual-32-01-production/verify_stage32_post1648y_cecotti_kkk_literal_branch_anchor_subsumption.py'
      - 'stages/stage32/residual-32-01-production/post1648n-canonical-period-marked-ppav-torsor-obstruction.json'
      - 'stages/stage32/residual-32-01-production/post1648u-kkk-delta0inf-explicit-half-period-nonpruning.json'
      - 'stages/stage32/residual-32-01-production/post1648j-cecotti-trace-orientation-correction.json'
      - 'stages/stage32/residual-32-01-production/post1648s-inner-conjugacy-invariant-nonselection-theorem.json'

permissions:
  contents: read

jobs:
  cecotti-kkk-branch-anchor-subsumption:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Replay post1648N exact ppav torsor
        run: python3 -B stages/stage32/residual-32-01-production/verify_stage32_post1648n_canonical_period_marked_ppav_torsor_obstruction.py
      - name: Verify post1648Y anti-loop subsumption
        run: python3 -B stages/stage32/residual-32-01-production/verify_stage32_post1648y_cecotti_kkk_literal_branch_anchor_subsumption.py
      - name: Diff check
        run: git diff --check
