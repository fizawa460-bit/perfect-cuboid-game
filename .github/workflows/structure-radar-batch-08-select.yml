name: StructureRadar batch08 selector
on:
  push:
    branches: [structure-radar-deep-corpus-batch-08]
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  select:
    if: github.event_name == 'push' || github.head_ref == 'structure-radar-deep-corpus-batch-08'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-08
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize next 60-source bundle
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          q=json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          t=next(x for x in q['tasks'] if x['status']=='READY')
          ids=t['source_ids']
          src={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              for s in json.loads(p.read_text())['sources']:
                  src[s['source_id']]=s
          selected=[src[i] for i in ids]
          out={'batch_id':'SR-BATCH-STAGE14_15_DEEP_CORPUS-08-R01','task_id':t['task_id'],'source_count':len(selected),'sources':selected}
          (root/'.github/structure-radar-batch-08-selection.json').write_text(json.dumps(out,indent=2)+'\n')
          parts=[]
          for n,s in enumerate(selected,1):
              p=root/s['path']
              parts += [f'===== SOURCE {n:02d}/60 =====',f"SOURCE_ID={s['source_id']}",f"PATH={s['path']}",f"KIND={s['kind']}",f"EVIDENCE_ROLE={s['evidence_role']}",'----- CONTENT -----',p.read_text(errors='replace'),'===== END SOURCE =====','']
          (root/'.github/structure-radar-batch-08-bundle.txt').write_text('\n'.join(parts))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/structure-radar-batch-08-selection.json .github/structure-radar-batch-08-bundle.txt
          git commit -m 'StructureRadar: materialize batch08 source bundle' || exit 0
          git push origin HEAD:structure-radar-deep-corpus-batch-08
