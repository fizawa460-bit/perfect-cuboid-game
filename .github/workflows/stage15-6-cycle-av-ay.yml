name: Stage15-6 cycle av-ay

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6av/**'
      - 'stages/stage15/15-6aw/**'
      - 'stages/stage15/15-6ax/**'
      - 'stages/stage15/15-6ay/**'
      - 'stages/stage15/15-6-cycle/6av-6ay.md'
      - 'stages/stage15/evidence/stage15_6av_covering_map.json'
      - 'stages/stage15/evidence/stage15_6aw_nontorsion_audit.json'
      - 'stages/stage15/evidence/stage15_6ax_height_bridge_audit.json'
      - 'stages/stage15/evidence/stage15_6ay_complete_2descent.json'
      - 'stages/stage15/replay/verify_stage15_6av.py'
      - 'stages/stage15/replay/verify_stage15_6aw.py'
      - 'stages/stage15/replay/verify_stage15_6ax.py'
      - 'stages/stage15/replay/verify_stage15_6ay.py'
      - '.github/workflows/stage15-6-cycle-av-ay.yml'
  workflow_dispatch:

jobs:
  verify-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 6av
        run: python stages/stage15/replay/verify_stage15_6av.py
      - name: Verify 6aw
        run: python stages/stage15/replay/verify_stage15_6aw.py
      - name: Verify 6ax
        run: python stages/stage15/replay/verify_stage15_6ax.py
      - name: Verify 6ay
        run: python stages/stage15/replay/verify_stage15_6ay.py
      - name: Compile cycle utilities
        run: python -m py_compile stages/stage15/scripts/stage15_6av_covering_map.py stages/stage15/scripts/stage15_6aw_nontorsion_audit.py stages/stage15/scripts/stage15_6ax_height_bridge_audit.py stages/stage15/scripts/stage15_6ay_complete_2descent.py
