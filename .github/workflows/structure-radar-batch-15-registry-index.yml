name: StructureRadar batch15 registry index
on:
  push:
    branches: [structure-radar-deep-corpus-batch-15]
    paths:
      - '.github/structure-radar-batch-15-registry-trigger.txt'
jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-15
      - name: Build compact registry index
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('docs/structure-radar/structure-registry.json')
          d=json.loads(p.read_text())
          lines=[]
          for c in d['structures']:
              obj=' '.join(c.get('exact_equations_or_object','').split())[:900]
              gaps=' | '.join(c.get('applicability_gaps',[]))[:500]
              lines.append(f"{c['structure_id']}\t{c.get('canonical_math_name','')}\t{obj}\tGAPS:{gaps}")
          pathlib.Path('.github/structure-radar-batch-15-registry-index.txt').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/structure-radar-batch-15-registry-index.txt
          git commit -m 'StructureRadar batch15 materialize registry index' || exit 0
          git push
