name: Stage32 post1490 fixed V6 all-genus1 exclusion replay

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-post1490-fixed-v6-all-genus1-exclusion.yml'
      - 'stages/stage32/controller.json'
      - 'stages/stage32/residual-32-01-production/post1490-audit-promotion-next-overlap-boundary.json'
      - 'stages/stage32/residual-32-01-production/post1490-fixed-v6-q4-all-overlap-deck-cross-exclusion-source-note.md'
      - 'stages/stage32/residual-32-01-production/post1490-fixed-v6-all-genus1-deck-cross-exclusion.json'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1490_fixed_v6_all_genus1_deck_cross_exclusion.py'
      - 'stages/stage32/residual-32-01-production/post1490-o210-q4-*'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1490_o210_q4_*'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_post1490_o210_q4_*'
      - 'stages/stage32/residual-32-01-production/post1473-specific-class-multibranch-beauville-odd-branch-wall.md'
      - 'stages/stage32/residual-32-01-production/post1484-v6-modular-factor-bidegree-boundary.json'
      - 'stages/stage33/33-07/certify_two_coordinate_swap_picard_rows.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replay provisional fixed-V6 all-genus1 deck-cross exclusion
        run: python stages/stage32/residual-32-01-production/certify_stage32_post1490_fixed_v6_all_genus1_deck_cross_exclusion.py --check stages/stage32/residual-32-01-production/post1490-fixed-v6-all-genus1-deck-cross-exclusion.json
