name: StructureRadar batch12 summary
on:
  push:
    branches: [structure-radar-deep-corpus-batch-12]
permissions:
  contents: write
jobs:
  summarize:
    if: contains(github.event.head_commit.message, 'trigger batch12 summary')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-12
      - name: Build title summary
        run: |
          python - <<'PY'
          import json, glob, pathlib
          rows=[]
          for p in sorted(glob.glob('.github/structure-radar-batch-12-index-*.json')):
            rows += json.loads(pathlib.Path(p).read_text())
          lines=[f"{r['n']:02d}\t{r['source_id']}\t{r['kind']}\t{r['path']}\t{r['title']}" for r in rows]
          pathlib.Path('.github/structure-radar-batch-12-summary.txt').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/structure-radar-batch-12-summary.txt
          git commit -m 'StructureRadar: materialize batch12 title summary'
          git push origin HEAD:structure-radar-deep-corpus-batch-12
