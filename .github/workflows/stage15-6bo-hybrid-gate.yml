name: Stage15-6bo hybrid gate
on:
  pull_request:
    paths: ['stages/stage15/15-6bo/**','stages/stage15/evidence/stage15_6bo_hybrid_gate.json','stages/stage15/replay/verify_stage15_6bo.py','stages/stage15/scripts/stage15_6bo_hybrid_gate.py','.github/workflows/stage15-6bo-hybrid-gate.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python stages/stage15/replay/verify_stage15_6bo.py
