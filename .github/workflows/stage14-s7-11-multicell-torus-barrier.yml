name: Stage14-s7-11 multicell torus barrier audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-11/**'
      - 'stages/stage14/scripts/14-s7-11/**'
      - '.github/workflows/stage14-s7-11-multicell-torus-barrier.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile s7-11 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-11/multicell_torus_barrier_audit.py

      - name: Run merged s7-10 regression
        run: python stages/stage14/scripts/14-s7-10/uniform_two_cell_fourier_audit.py

      - name: Run merged 4by regression
        run: python stages/stage14/scripts/14-4/fu_two_cell_13_14_audit.py

      - name: Run s7-11 deterministic audit
        run: python stages/stage14/scripts/14-s7-11/multicell_torus_barrier_audit.py | tee /tmp/s711.log

      - name: Check audit flags
        run: |
          grep -q 'THREE_CELL_DETECTOR_FACTORS_THROUGH_TWO_CELL_QUOTIENT=true' /tmp/s711.log
          grep -q 'FOUR_CELL_DETECTOR_FACTORS_THROUGH_TWO_CELL_QUOTIENT=true' /tmp/s711.log
          grep -q 'THREE_CELL_FOURIER_FIBER_IDENTITY_EXACT=true' /tmp/s711.log
          grep -q 'FOUR_CELL_FOURIER_FIBER_IDENTITY_EXACT=true' /tmp/s711.log
          grep -q 'MULTICELL_IMPROVES_PROVED_TWO_CELL_SAVING=false' /tmp/s711.log
          grep -q 'PAIRWISE_TWO_CELL_SAVINGS_MULTIPLY=false' /tmp/s711.log
          grep -q 'CURRENT_ARCHITECTURE_BARRIER=13/14' /tmp/s711.log
          grep -q 'ALL_AUDITS_PASS=true' /tmp/s711.log

      - name: Check theorem boundary
        run: |
          grep -q 'STAGE14_S7_11=COMPLETE_MULTICELL_TORUS_QUOTIENT_AND_13_14_ARCHITECTURE_BARRIER' stages/stage14/14-s7-11/result.md
          grep -q 'MERGED_S7_10_IMPORTED=true' stages/stage14/14-s7-11/result.md
          grep -q 'MERGED_4BY_IMPORTED=true' stages/stage14/14-s7-11/result.md
          grep -q 'THREE_CELL_TORUS_KERNEL_DIMENSION=1' stages/stage14/14-s7-11/result.md
          grep -q 'FOUR_CELL_TORUS_KERNEL_DIMENSION=2' stages/stage14/14-s7-11/result.md
          grep -q 'IDEAL_THREE_CELL_RELATIVE_SAVING=V^(-1/4)' stages/stage14/14-s7-11/result.md
          grep -q 'IDEAL_FOUR_CELL_RELATIVE_SAVING=V^(-1/5)' stages/stage14/14-s7-11/result.md
          grep -q 'OPTIMIZED_THICK_TWO_CELL_ARCHITECTURE_BARRIER=13/14' stages/stage14/14-s7-11/result.md
          grep -q 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=13/14' stages/stage14/14-s7-11/result.md
          grep -q 'NEW_WHOLE_FAMILY_POWER_SAVING_PROVED=false' stages/stage14/14-s7-11/result.md
          grep -q 'NEXT=Stage14-s7-12' stages/stage14/14-s7-11/result.md
