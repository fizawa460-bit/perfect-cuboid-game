name: Stage32EX5 HPADJ08 FULL178 par4

# lifecycle: RETIRED — retained only for explicit historical replay.
# This workflow must not run automatically on PR events.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUNKEY: stages/stage32-ex5/runkeys/hpadj08-full178-scaleout.json

jobs:
  authorize-par4:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: gate
        shell: bash
        run: |
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          echo 'RETIRED: automatic/heavy authorization disabled; retained for provenance only.'

  full178-shards-par4:
    needs: authorize-par4
    if: ${{ needs.authorize-par4.outputs.authorized == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.authorize-par4.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Run exact FULL178 b-shard
        run: |
          python stages/stage32-ex5/hpadj-08_ex5/hpadj08_ex5_full178_b_shard.py \
            --b-start ${{ matrix.b_start }} --b-end ${{ matrix.b_end }} \
            --output "$RUNNER_TEMP/hpadj08-${{ matrix.b_start }}-${{ matrix.b_end }}.json"
      - name: Upload compact shard certificate
        uses: actions/upload-artifact@v4
        with:
          name: hpadj08-par4-shard-${{ matrix.b_start }}-${{ matrix.b_end }}-${{ github.sha }}
          path: ${{ runner.temp }}/hpadj08-${{ matrix.b_start }}-${{ matrix.b_end }}.json
          retention-days: 1
          if-no-files-found: error
