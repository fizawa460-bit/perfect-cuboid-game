name: Stage33 R5B3B3C1 Singular factor scratch

on:
  push:
    branches:
      - stage33-r5b3b3c1-singular-factor-scratch
    paths:
      - '.github/workflows/stage33-r5b3b3c1-singular-factor-scratch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factor-unique-norms:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependencies
        run: |
          python -m pip install --disable-pip-version-check 'sympy==1.14.0'
          sudo apt-get update -qq
          sudo apt-get install -y singular
      - name: Validate machine-readable Singular factor parser
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, sys, tempfile
          from pathlib import Path
          import sympy as sp

          HERE = Path('stages/stage33/33-12')
          sys.path.insert(0, str(HERE))
          import materialize_e3_v91c1x_r5b3b3b_classify_20_novel_carriers_and_unify_27 as b

          B3B2_SHA = '52429d1197e1383daef8c25acdb1224822d7f5c22ecb7046c8b47766438a547e'
          B3B3B_SHA = '7f52f0988cb82983afc0759272e2420e73944b4258940aeffc8a9923816c4a7d'
          def csha(obj):
              return hashlib.sha256(json.dumps(obj, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          def load(path, expected):
              obj = json.loads(path.read_text())
              body = dict(obj)
              declared = body.pop('canonical_sha256', None)
              actual = csha(body)
              if declared != expected or actual != expected:
                  raise SystemExit(f'source lock moved: {path.name}')
              return obj

          b3b2 = load(HERE / 'e3-v91c1x-r5b3b2-a2-02-formal-tame-symbol-hidden-carrier-inventory.json', B3B2_SHA)
          b3b3b = load(HERE / 'e3-v91c1x-r5b3b3b-classify-20-novel-carriers-and-unify-27.json', B3B3B_SHA)
          rows = {r['carrier_id']: r for r in b3b2['finite_linear_carrier_inventory']['carrier_rows']}
          off_ids = set(b3b3b['unified_27_classification']['off_boundary_carrier_ids'])

          def singular_factor(poly):
              expr = sp.sstr(poly.as_expr()).replace('**', '^').replace('I', 'i')
              script = (
                  'ring r=(0,i),(a1,a2,a3),dp;\n'
                  'minpoly=i2+1;\n'
                  f'poly f={expr};\n'
                  'list L=factorize(f);\n'
                  'ideal F=L[1];\n'
                  'intvec M=L[2];\n'
                  'int n=size(F);\n'
                  'print("COUNT|"+string(n));\n'
                  'for (int k=1; k<=n; k=k+1) {\n'
                  '  print("MULT|"+string(M[k]));\n'
                  '  print("FACTOR|"+string(F[k]));\n'
                  '}\n'
              )
              with tempfile.NamedTemporaryFile('w', suffix='.sing', delete=False) as fh:
                  fh.write(script)
                  path = fh.name
              proc = subprocess.run(['Singular', '-q', path], text=True, capture_output=True, check=True)
              Path(path).unlink(missing_ok=True)
              lines = [x.strip() for x in proc.stdout.splitlines() if x.strip()]
              count = int(next(x.split('|',1)[1] for x in lines if x.startswith('COUNT|')))
              mults = [int(x.split('|',1)[1]) for x in lines if x.startswith('MULT|')]
              facs = [x.split('|',1)[1] for x in lines if x.startswith('FACTOR|')]
              if len(mults) != count or len(facs) != count:
                  raise SystemExit(f'parse mismatch count={count} mults={mults} factors={len(facs)} stdout={proc.stdout}')
              rebuilt = sp.Poly(1, *b.BASE, extension=sp.I)
              parsed = []
              local = {'a1': b.BASE[0], 'a2': b.BASE[1], 'a3': b.BASE[2], 'i': sp.I}
              for raw, mult in zip(facs, mults):
                  expr2 = sp.sympify(raw.replace('^','**'), locals=local)
                  fac = sp.Poly(expr2, *b.BASE, extension=sp.I)
                  rebuilt *= fac**mult
                  parsed.append((int(fac.total_degree()), mult))
              if sp.Poly(rebuilt - poly, *b.BASE, extension=sp.I) != sp.Poly(0, *b.BASE, extension=sp.I):
                  raise SystemExit(f'exact reconstruction failed: {parsed}')
              return [(d,m) for d,m in parsed if d > 0]

          expected = {
              'LIN_021': [(16,1)],
              'LIN_008': [(14,1),(1,2)],
              'LIN_024': [(1,8),(1,8)],
          }
          for cid, want in expected.items():
              if cid not in off_ids:
                  raise SystemExit(f'target escaped off-boundary set: {cid}')
              poly = b.full_sign_norm_poly(rows[cid]['normalized_coefficients_Qi'])
              got = singular_factor(poly)
              print(f'{cid}|got={got}|want={want}')
              if sorted(got) != sorted(want):
                  raise SystemExit(f'pattern mismatch {cid}: got={got} want={want}')
          print('MACHINE_PARSER_EXACT_OK')
          PY
