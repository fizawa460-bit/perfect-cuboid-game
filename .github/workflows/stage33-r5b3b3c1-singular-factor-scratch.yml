name: Stage33 R5B3B3C1 Singular factor scratch

on:
  push:
    branches:
      - stage33-r5b3b3c1-singular-factor-scratch
    paths:
      - '.github/workflows/stage33-r5b3b3c1-singular-factor-scratch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factor-unique-norms:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependencies
        run: |
          python -m pip install --disable-pip-version-check 'sympy==1.14.0'
          sudo apt-get update -qq
          sudo apt-get install -y singular
      - name: Emit all 19 exact unique norms to Singular inputs
        run: |
          python - <<'PY'
          import hashlib, json, sys
          from collections import defaultdict
          from pathlib import Path
          import sympy as sp

          HERE = Path('stages/stage33/33-12')
          sys.path.insert(0, str(HERE))
          import materialize_e3_v91c1x_r5b3b3b_classify_20_novel_carriers_and_unify_27 as b

          B3B2_SHA = '52429d1197e1383daef8c25acdb1224822d7f5c22ecb7046c8b47766438a547e'
          B3B3B_SHA = '7f52f0988cb82983afc0759272e2420e73944b4258940aeffc8a9923816c4a7d'
          def csha(obj):
              return hashlib.sha256(json.dumps(obj, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          def load(path, expected):
              obj = json.loads(path.read_text())
              body = dict(obj)
              declared = body.pop('canonical_sha256', None)
              actual = csha(body)
              if declared != expected or actual != expected:
                  raise SystemExit(f'source lock moved: {path.name} declared={declared} actual={actual}')
              return obj

          b3b2 = load(HERE / 'e3-v91c1x-r5b3b2-a2-02-formal-tame-symbol-hidden-carrier-inventory.json', B3B2_SHA)
          b3b3b = load(HERE / 'e3-v91c1x-r5b3b3b-classify-20-novel-carriers-and-unify-27.json', B3B3B_SHA)
          off_ids = list(b3b3b['unified_27_classification']['off_boundary_carrier_ids'])
          if len(off_ids) != 23:
              raise SystemExit(f'off-boundary count moved: {len(off_ids)}')
          rows = {r['carrier_id']: r for r in b3b2['finite_linear_carrier_inventory']['carrier_rows']}
          groups = defaultdict(list)
          polys = {}
          normalized_by_sha = {}
          for cid in off_ids:
              poly = b.full_sign_norm_poly(rows[cid]['normalized_coefficients_Qi'])
              if poly.total_degree() != 16:
                  raise SystemExit(f'degree moved: {cid}')
              norm = b.normalize_norm(poly)
              sha = csha(norm)
              if sha in normalized_by_sha and normalized_by_sha[sha] != norm:
                  raise SystemExit(f'norm hash collision: {sha}')
              normalized_by_sha.setdefault(sha, norm)
              groups[sha].append(cid)
              polys[cid] = poly
          if len(groups) != 19:
              raise SystemExit(f'unique norm count moved: {len(groups)}')

          outdir = Path('/tmp/stage33-singular-19')
          outdir.mkdir(exist_ok=True)
          manifest = []
          for pos, (sha, ids) in enumerate(sorted(groups.items()), 1):
              rep = ids[0]
              poly = polys[rep]
              expr = sp.sstr(poly.as_expr()).replace('**', '^').replace('I', 'i')
              p = outdir / f'{pos:02d}_{rep}.sing'
              p.write_text(
                  'ring r=(0,i),(a1,a2,a3),dp;\n'
                  'minpoly=i2+1;\n'
                  f'poly f={expr};\n'
                  f'print("REP_BEGIN|{pos:02d}|{rep}|{sha}|{len(ids)}");\n'
                  'factorize(f);\n'
                  f'print("REP_END|{pos:02d}|{rep}|{sha}");\n', encoding='utf-8')
              manifest.append((pos, rep, sha, ids, len(b.normalize_norm(poly))))
          print(f'OFFBOUNDARY={len(off_ids)} UNIQUE={len(groups)} DUPLICATE_REUSE={len(off_ids)-len(groups)}')
          for pos, rep, sha, ids, terms in manifest:
              print(f'MANIFEST|{pos:02d}|{rep}|{sha}|terms={terms}|carriers={ids}')
          PY
      - name: Exact Singular factorization sweep
        run: |
          set -euo pipefail
          for f in /tmp/stage33-singular-19/*.sing; do
            echo "FILE_BEGIN|$(basename "$f")"
            /usr/bin/time -f 'TIME|elapsed=%E|maxrss_kb=%M' Singular -q "$f"
            echo "FILE_END|$(basename "$f")"
          done
