name: Two-face inverse height stage 7

on:
  pull_request:
    paths:
      - "data/two_face_cuboids_1e6_kummer_classification.json"
      - "data/two_face_cuboids_1e6_mordell_weil_relations.json"
      - "data/two_face_cuboids_1e6_stage5_report.json"
      - "data/two_face_cuboids_1e6_stage7_inverse_height_report.json"
      - "docs/face-ratio-geometry-research.md"
      - "scripts/audit_two_face_inverse_height_stage7.py"
      - "scripts/update_two_face_stage7_memo.py"
      - "scripts/normalize_two_face_stage7_memo.py"
      - ".github/workflows/two-face-inverse-height-stage7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inverse-height:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy

      - name: Run stage-seven inverse-height audit
        run: |
          python scripts/audit_two_face_inverse_height_stage7.py \
            --write-report generated-two-face-stage7-inverse-height-report.json

      - name: Regenerate and normalize stage-seven research memo
        run: |
          python scripts/update_two_face_stage7_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --report generated-two-face-stage7-inverse-height-report.json \
            --output unnormalized-face-ratio-geometry-research.md
          python scripts/normalize_two_face_stage7_memo.py \
            --input unnormalized-face-ratio-geometry-research.md \
            --output generated-face-ratio-geometry-research.md
          grep -n "4.16 逆写像" generated-face-ratio-geometry-research.md
          grep -n "log d.*6h(x)" generated-face-ratio-geometry-research.md
          grep -n "壁打ち" generated-face-ratio-geometry-research.md
          if grep -P "\t" generated-face-ratio-geometry-research.md; then
            echo "Unexpected tab found in generated Markdown" >&2
            exit 1
          fi

      - name: Compare committed stage-seven outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          committed_report = Path("data/two_face_cuboids_1e6_stage7_inverse_height_report.json")
          generated_report = Path("generated-two-face-stage7-inverse-height-report.json")
          if not committed_report.exists():
              raise SystemExit(f"required committed output is missing: {committed_report}")
          expected = json.loads(committed_report.read_text(encoding="utf-8"))
          actual = json.loads(generated_report.read_text(encoding="utf-8"))
          if expected != actual:
              raise SystemExit(f"{committed_report} differs from regenerated output")

          committed_text = Path("docs/face-ratio-geometry-research.md").read_text(encoding="utf-8")
          generated_text = Path("generated-face-ratio-geometry-research.md").read_text(encoding="utf-8")
          start = "<!-- TWO_FACE_STAGE7_START -->"
          end = "<!-- TWO_FACE_STAGE7_END -->"

          def extract_block(text: str) -> str:
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit("stage-seven markers are missing or duplicated")
              return text.split(start, 1)[1].split(end, 1)[0].strip()

          if extract_block(committed_text) != extract_block(generated_text):
              raise SystemExit("committed stage-seven memo block differs from regenerated block")

          prefix = "- 二面成立楕円ファイバーの正の滑らかな整数点について、明示的な逆写像と "
          committed_lines = [line for line in committed_text.splitlines() if line.startswith(prefix)]
          generated_lines = [line for line in generated_text.splitlines() if line.startswith(prefix)]
          if committed_lines != generated_lines or len(committed_lines) != 1:
              raise SystemExit("stage-seven conclusion line mismatch")
          PY

      - name: Upload stage-seven outputs
        uses: actions/upload-artifact@v4
        with:
          name: two-face-inverse-height-stage7
          path: |
            generated-two-face-stage7-inverse-height-report.json
            generated-face-ratio-geometry-research.md
