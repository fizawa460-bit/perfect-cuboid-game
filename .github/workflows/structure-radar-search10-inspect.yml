name: StructureRadar search10 inspect
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: github.head_ref == 'structure-radar-search-10-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Materialize exact next 10 cards
        run: |
          python - <<'PY'
          import json, pathlib
          ids=['SR-STR-073','SR-STR-074','SR-STR-075','SR-STR-077','SR-STR-078','SR-STR-079','SR-STR-080','SR-STR-081','SR-STR-082','SR-STR-083']
          r=json.load(open('docs/structure-radar/structure-registry.json'))
          cards=[c for c in r['structures'] if c['structure_id'] in ids]
          assert [c['structure_id'] for c in cards]==ids, [c['structure_id'] for c in cards]
          pathlib.Path('docs/structure-radar/TEMP-search10-cards.json').write_text(json.dumps(cards,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/structure-radar/TEMP-search10-cards.json
          git commit -m 'TEMP: materialize StructureRadar search10 cards'
          git push origin HEAD:${{ github.head_ref }}
