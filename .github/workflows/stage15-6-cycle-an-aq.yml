name: Stage15-6 cycle an-aq

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6an/**'
      - 'stages/stage15/15-6ao/**'
      - 'stages/stage15/15-6ap/**'
      - 'stages/stage15/15-6aq/**'
      - 'stages/stage15/15-6-cycle/6an-6aq.md'
      - 'stages/stage15/evidence/stage15_6an_isotrivial_quartic.json'
      - 'stages/stage15/evidence/stage15_6ao_projective_curve_bound.json'
      - 'stages/stage15/evidence/stage15_6ap_kappa_coupling.json'
      - 'stages/stage15/evidence/stage15_6aq_norm_core_gate.json'
      - 'stages/stage15/replay/verify_stage15_6an.py'
      - 'stages/stage15/replay/verify_stage15_6ao.py'
      - 'stages/stage15/replay/verify_stage15_6ap.py'
      - 'stages/stage15/replay/verify_stage15_6aq.py'
      - '.github/workflows/stage15-6-cycle-an-aq.yml'
  workflow_dispatch:

jobs:
  verify-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 6an
        run: python stages/stage15/replay/verify_stage15_6an.py
      - name: Verify 6ao
        run: python stages/stage15/replay/verify_stage15_6ao.py
      - name: Verify 6ap
        run: python stages/stage15/replay/verify_stage15_6ap.py
      - name: Verify 6aq
        run: python stages/stage15/replay/verify_stage15_6aq.py
      - name: Compile cycle utilities
        run: python -m py_compile stages/stage15/scripts/stage15_6an_isotrivial_quartic.py stages/stage15/scripts/stage15_6ao_projective_curve_bound.py stages/stage15/scripts/stage15_6ap_kappa_coupling.py stages/stage15/scripts/stage15_6aq_norm_core_gate.py
