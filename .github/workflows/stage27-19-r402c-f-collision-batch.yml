name: Stage27-19-r402c-f collision batch

on:
  push:
    branches:
      - agent/stage27-19-r402c-f-collision-batch
  pull_request:
    paths:
      - 'stages/stage27/27-19-r402c/**'
      - 'stages/stage27/27-19-r402d/**'
      - 'stages/stage27/27-19-r402e/**'
      - 'stages/stage27/27-19-r402f/**'
      - 'stages/stage27/27-19-r402c-f/**'
      - 'stages/stage27/27-controller.json'
      - 'docs/00_CURRENT_RESEARCH_STATUS.md'
      - '.github/workflows/stage27-19-r402c-f-collision-batch.yml'

jobs:
  verify-stage27-19-r402c-f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Stage27-19-r402c-f collision batch
        run: |
          python -m json.tool stages/stage27/27-controller.json >/dev/null
          python -m json.tool stages/stage27/27-19-r402c-f/batch-registry.json >/dev/null
          python stages/stage27/27-19-r402c-f/verify_27_19_r402c_f.py
          git diff --check
