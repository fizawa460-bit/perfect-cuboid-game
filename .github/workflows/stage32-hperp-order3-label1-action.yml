name: Stage32 Hperp order3 label1 action

on:
  pull_request:
    paths:
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_hperp_order3_label1_action.py'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_hperp_b3_h_normalizer_action.py'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1629_hperp_order3_membership_insufficiency.py'
      - 'stages/stage32/residual-32-01-production/post1629-hperp-order3-membership-insufficiency.json'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1629_b3_h_normalizer_zero_pruning.py'
      - 'stages/stage32/residual-32-01-production/post1629-b3-h-normalizer-zero-pruning.json'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1629_full_g_retained_stoll_extra_involution_gap.py'
      - 'stages/stage32/residual-32-01-production/post1629-full-g-retained-stoll-extra-involution-gap.json'
      - 'stages/stage32/residual-32-01-production/post1629-full-g-retained-stoll-extra-involution-gap-source-note.md'
      - 'stages/stage32/residual-32-01-production/hperp_integral_adapter.py'
      - 'stages/stage32/residual-32-01-production/pairing_prefix_engine.py'
      - 'stages/stage32/residual-32-01-production/post1588-hperp-nonexceptional-mod2-witness.json'
      - 'stages/stage32/residual-32-01-production/post1563-ambient-symmetry-exhaustion-batch.json'
      - 'stages/stage32/residual-32-01-production/post1550-b3-v4-torsor-normalizer.json'
      - 'stages/stage32/residual-32-01-production/post1555-b3-full-g-box-quotient-normalizer.json'
      - 'stages/stage32/residual-32-01-production/post1473-x8-v4-cusp-quotient.json'
      - 'stages/stage32/residual-32-01-production/post1532-full-stoll-h-orbit-symmetry-negative.json'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - '.github/workflows/stage32-hperp-order3-label1-action.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-hperp-order3-label1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Assert exact PR head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Resolve current-main freshness
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --no-tags --depth=1
          current_main="$(git rev-parse origin/main)"
          test "${{ github.event.pull_request.base.sha }}" = "$current_main"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned algebra dependency
        run: python3 -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Run exact retained-basis order-3 action sweep
        id: sweep
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage32/residual-32-01-production/diagnose_stage32_hperp_order3_label1_action.py | tee /tmp/stage32-order3.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('/tmp/stage32-order3.json'))
          o=d['order3_sweep']
          print(f"order3={o['order3_element_count']}")
          print(f"images={len(o['label1_image_set'])}")
          print(f"fix={o['fix_label1_count']}")
          print(f"qfix={o['fix_label1_mod_exceptional_span_count']}")
          print(f"same={o['separator_same_count']}")
          PY
      - name: Verify frozen bounded negative certificate
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1629_hperp_order3_membership_insufficiency.py
      - name: Run source-bound H-normalizer constrained b3 sweep
        id: hnorm
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage32/residual-32-01-production/diagnose_stage32_hperp_b3_h_normalizer_action.py | tee /tmp/stage32-hnorm.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('/tmp/stage32-hnorm.json'))
          f=d['finite_filter']
          print(f"hnorm={f['H_normalizing_order3_count']}")
          print(f"candidates={f['H_cycling_order3_candidate_count']}")
          print(f"images={f['label1_image_cardinality']}")
          print(f"fix={f['fix_label1_count']}")
          print(f"qfix={f['fix_label1_mod_exceptional_span_count']}")
          print(f"same={f['separator_same_count']}")
          PY
      - name: Verify frozen H-normalizer zero-pruning certificate
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1629_b3_h_normalizer_zero_pruning.py
      - name: Verify full-G to retained-Stoll interface gap
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1629_full_g_retained_stoll_extra_involution_gap.py
      - name: Upload compact finite results
        uses: actions/upload-artifact@v4
        with:
          name: stage32-o3-${{ steps.sweep.outputs.order3 }}-hn${{ steps.hnorm.outputs.hnorm }}-cand${{ steps.hnorm.outputs.candidates }}-img${{ steps.hnorm.outputs.images }}-fix${{ steps.hnorm.outputs.fix }}-qfix${{ steps.hnorm.outputs.qfix }}-same${{ steps.hnorm.outputs.same }}
          path: |
            /tmp/stage32-order3.json
            /tmp/stage32-hnorm.json
          if-no-files-found: error
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
