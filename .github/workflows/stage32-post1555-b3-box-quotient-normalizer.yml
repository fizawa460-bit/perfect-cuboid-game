name: Stage32 post1555 b3 box quotient normalizer

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-post1555-b3-box-quotient-normalizer.yml'
      - 'stages/stage32/controller.json'
      - 'stages/stage32/residual-32-01-production/post1555-b3-full-g-box-quotient-normalizer*'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1555_b3_full_g_box_quotient_normalizer.py'
      - 'stages/stage32/residual-32-01-production/post1550-b3-v4-torsor-normalizer.json'
      - 'stages/stage32/residual-32-01-production/post1473-x8-v4-cusp-quotient.json'
      - 'stages/stage32/residual-32-01-production/post1484-o210-q4-common-double-cover-cartesian-identity.json'
      - 'stages/stage32/residual-32-01-production/post1532-q602-single-b3-commutator.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Certify b3 full-G and box quotient normalizer
        run: python3 stages/stage32/residual-32-01-production/certify_stage32_post1555_b3_full_g_box_quotient_normalizer.py
      - name: Check Arsenal generated cards
        run: python3 -B docs/arsenal/sync_arsenal_catalog.py --check
      - name: Enforce no controller edit
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -qx 'stages/stage32/controller.json'; then
            echo 'controller.json must remain unchanged in this bounded box-quotient normalizer leaf'
            exit 1
          fi
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
