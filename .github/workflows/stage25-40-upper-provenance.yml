name: Stage25-40 upper provenance audit

on:
  pull_request:
    paths:
      - 'stages/stage25/25-40/**'
      - 'stages/stage25/25-controller.json'
      - '.github/workflows/stage25-40-upper-provenance.yml'
  workflow_dispatch:

jobs:
  upper-provenance-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage25 checkpoint40 upper provenance
        run: python stages/stage25/25-40/upper_provenance_audit.py
