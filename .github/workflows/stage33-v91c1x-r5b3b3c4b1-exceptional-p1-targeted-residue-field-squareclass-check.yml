name: Stage33 V91C1X R5B3B3C4B1 exceptional P1 squareclass check

on:
  push:
    branches:
      - stage33-v91c1x-r5b2d0-swap23-source-lock
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b1-exceptional-p1-targeted-residue-field-squareclass-check.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1_exceptional_p1_targeted_residue_field_squareclass.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1-exceptional-p1-targeted-residue-field-squareclass.json'
  pull_request:
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b1-exceptional-p1-targeted-residue-field-squareclass-check.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1_exceptional_p1_targeted_residue_field_squareclass.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1-exceptional-p1-targeted-residue-field-squareclass.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4a-tame-residue-parity-and-cross-carrier-preflight.json'
      - 'stages/stage33/33-07/exceptional-p1-tangent-coordinates.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Verify C4B1 exceptional P1 residue-field squareclasses
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1_exceptional_p1_targeted_residue_field_squareclass.py
      - name: Verify live Stage33 state remains synchronized
        run: python stages/stage33/sync_main_state.py --check
      - name: Diff hygiene and read-only cleanliness
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
