name: Stage33 V91C1X R5B2D2 swap23 317-cover common-refinement check

on:
  push:
    branches:
      - stage33-v91c1x-r5b2d0-swap23-source-lock
    paths:
      - '.github/workflows/stage33-v91c1x-r5b2d2-swap23-317-cover-common-refinement-check.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b2d2_swap23_317_cover_common_refinement.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2d2-swap23-317-cover-common-refinement.json'
      - 'stages/stage33/33-12/verify_stage33_v91c1x_r5b2d2_swap23_317_cover_common_refinement_v130.py'
  pull_request:
    paths:
      - '.github/workflows/stage33-v91c1x-r5b2d2-swap23-317-cover-common-refinement-check.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b2d2_swap23_317_cover_common_refinement.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2d2-swap23-317-cover-common-refinement.json'
      - 'stages/stage33/33-12/verify_stage33_v91c1x_r5b2d2_swap23_317_cover_common_refinement_v130.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Replay R5B2D1 source-bound action adapter
        run: python stages/stage33/33-12/verify_stage33_v91c1x_r5b2d1_source_bound_swap23_action_adapter_v129.py
      - name: Replay R5B2D2 exact common refinement
        run: python stages/stage33/33-12/verify_stage33_v91c1x_r5b2d2_swap23_317_cover_common_refinement_v130.py
      - name: Diff hygiene
        run: git diff --check
