# BC2-18 exact decomposition runner
name: Stage32EX5 BC2-18 exceptional/mod8 decomposition

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_18_n354_survivor_exceptional_mod8_decomposition.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-17-n354-authority-picard64-retarget-v2-evidence.json'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - 'stages/stage32/residual-32-01-production/hperp_integral_adapter.py'
      - 'stages/stage32/residual-32-01-production/pairing_prefix_engine.py'
      - '.github/workflows/stage32-ex5-bc2-18-decompose.yml'

permissions:
  contents: read

jobs:
  decompose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Compile BC2-18
        run: python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_18_n354_survivor_exceptional_mod8_decomposition.py
      - name: Run exact exceptional/mod8 decomposition
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_18_n354_survivor_exceptional_mod8_decomposition.py --output /tmp/bc2-18.json
          cat /tmp/bc2-18.json
      - name: Scope firewall
        run: |
          python - /tmp/bc2-18.json <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['credit']['solver_used'] is False
          assert p['credit']['heavy_compute'] is False
          assert p['credit']['full178_complete'] is False
          assert p['credit']['stage32_main_credit'] is False
          assert p['firewalls']['n355_audit_candidate_self_promoted'] is False
          assert p['firewalls']['merge_authorized'] is False
          print('BC2_18_SCOPE_OK', p['status'])
          PY
