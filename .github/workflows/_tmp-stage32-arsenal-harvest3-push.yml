name: TEMP Stage32 Arsenal Harvest 3 push materialization

on:
  push:
    branches:
      - stage32-arsenal-post1478-harvest-promotion

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout triggering branch head
        uses: actions/checkout@v4
        with:
          ref: stage32-arsenal-post1478-harvest-promotion
          fetch-depth: 0
      - name: Assert frozen main and branch head
        run: |
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "714bd143f0c20082edcbb81c3905a86b1a56b4bf"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Materialize Stage32 Harvest 3 registry update
        run: |
          python3 docs/arsenal/_tmp_stage32_arsenal_harvest3.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/stage32-arsenal-promotion.md')
          p.write_text(p.read_text().rstrip() + '\n')
          PY
      - name: Remove all temporary materialization files
        run: |
          git rm .github/workflows/_tmp-stage32-arsenal-harvest3.yml
          git rm .github/workflows/_tmp-stage32-arsenal-harvest3-push.yml
          git rm docs/arsenal/_tmp_stage32_arsenal_harvest3.py
      - name: Generate and verify Arsenal outputs
        run: |
          python3 -B docs/arsenal/sync_arsenal_catalog.py
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          python3 -B stages/stage32/residual-32-01-production/certify_stage32_post1505_o210_q602_weierstrass_parity_transvection_refinement.py --check stages/stage32/residual-32-01-production/post1505-o210-q602-weierstrass-parity-transvection-refinement.json
      - name: Assert registry semantics before commit
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/arsenal/index.json').read_text())
          h=next(x for x in d['provisional_harvests'] if x['source_stage']=='Stage32')
          assert h['active_cards']==['S32-PW01','S32-PW03','S32-PW04','S32-PW05','S32-PW06']
          assert h['retired_merged_ids']=={'S32-PW02':'S32-PW01'}
          assert h['post1478_harvest']['discovery_lower_bound']=='b5b810be420eedc74cfa8074ae043d681598b412'
          assert h['post1478_harvest']['harvest_upper_bound']=='714bd143f0c20082edcbb81c3905a86b1a56b4bf'
          assert h['post1478_harvest']['range_expanded_after_harvest1'] is False
          assert h['post1478_harvest']['new_weapon_ids']==['S32-PW06']
          assert h['post1478_harvest']['extended_ids']==[]
          assert h['post1478_harvest']['new_workflow_ids']==[]
          assert len(h['post1478_harvest']['promotion_blocked_candidates'])==2
          assert d['firewalls']['arsenal_registration_implies_stage32_progress_increment'] is False
          assert d['firewalls']['arsenal_registration_implies_stage32_main_authority_change'] is False
          assert d['firewalls']['arsenal_registration_implies_stage32_closure'] is False
          PY
      - name: Commit exact final tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stage32-arsenal-promotion.md docs/arsenal/index.json docs/arsenal/catalog.md docs/arsenal/cards/provisional/S32-PW06.md
          git commit -m '[Arsenal][Stage32] post-#1478 provisional harvest promotion'
          echo "FINAL_HARVEST3_HEAD=$(git rev-parse HEAD)"
          python3 -B docs/arsenal/sync_arsenal_catalog.py --check
          git diff --check 714bd143f0c20082edcbb81c3905a86b1a56b4bf HEAD
          changed="$(git diff --name-only 714bd143f0c20082edcbb81c3905a86b1a56b4bf HEAD)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 4
          ! printf '%s\n' "$changed" | grep -q '^stages/stage32/'
          ! printf '%s\n' "$changed" | grep -q '^\.github/'
          ! printf '%s\n' "$changed" | grep -q '_tmp'
      - name: Push final Harvest 3 head
        run: git push origin HEAD:stage32-arsenal-post1478-harvest-promotion
