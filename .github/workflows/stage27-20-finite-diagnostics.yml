name: Stage27-20 finite N2 diagnostics

on:
  pull_request:
    paths:
      - 'stages/stage27/27-20/**'
      - 'stages/stage27/27-controller.json'
      - 'stages/stage27/27-10/**'
      - 'docs/00_CURRENT_RESEARCH_STATUS.md'
      - '.github/workflows/stage27-20-finite-diagnostics.yml'
  workflow_dispatch:

jobs:
  verify-stage27-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage27 checkpoint20 finite diagnostics
        run: python stages/stage27/27-20/verify_27_20.py
