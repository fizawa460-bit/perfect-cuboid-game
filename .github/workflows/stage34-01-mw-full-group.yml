name: Stage34-01 MW full-group certificate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage34/runkeys/stage34-01-mw-full-group.json'
      - 'stages/stage34/34-01/mw-full-group-preflight.json'
      - 'stages/stage34/34-01/verify_mw_full_group_inputs.py'
      - 'stages/stage34/34-01/run_eclib_mw_certificate.py'
      - 'stages/stage34/34-01/validate_mw_runkey.py'
      - '.github/workflows/stage34-01-mw-full-group.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch event-before commit if needed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
          fi
      - name: Validate dedicated run key against actual commit range
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 stages/stage34/34-01/validate_mw_runkey.py "$BEFORE" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Report authorization
        run: echo "authorized=${{ steps.gate.outputs.authorized }} reason=${{ steps.gate.outputs.reason }}"

  eclib-mw-residual:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Stage34 MW inputs
        run: python3 stages/stage34/34-01/verify_mw_full_group_inputs.py
      - name: Install proof-capable eclib mwrank
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends eclib-tools
          dpkg-query -W eclib-tools
      - name: Run residual full-basis saturation and exact torsion replay
        run: python3 stages/stage34/34-01/run_eclib_mw_certificate.py
      - name: Upload compact certificate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-01-eclib-mw-certificate
          path: |
            stages/stage34/34-01/mw-eclib-certificate.json
            stages/stage34/34-01/mw-eclib-stdout.txt
          if-no-files-found: warn
          retention-days: 1
