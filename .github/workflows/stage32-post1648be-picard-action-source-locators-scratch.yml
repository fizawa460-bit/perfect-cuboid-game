name: Stage32 post1648BE Picard action source locators

on:
  push:
    branches:
      - stage32-scratch-post1648be-cc-ct-source-semantics

permissions:
  contents: read

jobs:
  diagnose-be-picard-action-source-locators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact scratch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Run BE source locator recovery
        run: python3 -B stages/stage32/residual-32-01-production/diagnose_stage32_post1648be_picard_action_source_locators.py | tee /tmp/be.json
      - name: Assert bounded locator recovery
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/be.json'))
          assert x['mode']=='SCRATCH_POST1648BE_PICARD_ACTION_SOURCE_LOCATORS'
          assert x['has_picard_action_cc'] is True
          assert x['has_picard_action_ct'] is True
          assert x['firewalls']['runner_side_import_only'] is True
          assert x['firewalls']['giant_retained_payload_whole_fetch_used'] is False
          print(json.dumps(x['locators'],sort_keys=True))
          PY
      - name: Diff hygiene
        run: test -z "$(git status --porcelain)"
