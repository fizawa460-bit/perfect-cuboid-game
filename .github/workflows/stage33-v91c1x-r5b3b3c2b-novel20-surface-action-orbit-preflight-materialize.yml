name: Stage33 V91C1X R5B3B3C2B novel20 action-orbit preflight materialize

on:
  push:
    branches:
      - stage33-v91c1x-r5b2d0-swap23-source-lock
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c2b-novel20-surface-action-orbit-preflight-materialize.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c2b_novel20_surface_action_orbit_preflight.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage33-v91c1x-r5b2d0-swap23-source-lock
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact C2B novel20 certified-action orbit preflight
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c2b_novel20_surface_action_orbit_preflight.py --write
      - name: Bound generated delta
        shell: bash
        run: |
          git diff --check
          test "$(git status --porcelain | wc -l)" -eq 1
          git status --porcelain | grep 'stages/stage33/33-12/e3-v91c1x-r5b3b3c2b-novel20-surface-action-orbit-preflight.json'
      - name: Commit exact generated certificate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stages/stage33/33-12/e3-v91c1x-r5b3b3c2b-novel20-surface-action-orbit-preflight.json
          git commit -m '[Stage33] materialize R5B3B3C2B novel20 action-orbit preflight'
          git push origin HEAD:stage33-v91c1x-r5b2d0-swap23-source-lock
