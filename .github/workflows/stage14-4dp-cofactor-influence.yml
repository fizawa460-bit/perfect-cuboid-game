name: Stage14-4dp cofactor influence decomposition

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4dp/**'
      - 'stages/stage14/scripts/14-4/cofactor_influence_audit.py'
      - '.github/workflows/stage14-4dp-cofactor-influence.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile stages/stage14/scripts/14-4/cofactor_influence_audit.py
      - run: python stages/stage14/scripts/14-4/cofactor_influence_audit.py
      - name: Lock boundary
        run: |
          f=stages/stage14/14-4dp/result.md
          grep -q 'STAGE14_4DP=COMPLETE_ORIENTATION_VS_NONMULTIPLICATIVE_PHYSICAL_MASK_INFLUENCE_DECOMPOSITION' "$f"
          grep -q 'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=1/2' "$f"
          grep -q 'NEXT_H_NEEDED=false' "$f"
      - run: git diff --check origin/main...HEAD
