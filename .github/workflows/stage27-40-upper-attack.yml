name: Stage27-40 strict sub-square-root upper attack

on:
  pull_request:
    paths:
      - 'stages/stage27/**'
      - 'stages/stage14/final.md'
      - 'stages/stage15/15-5/result.md'
      - 'stages/stage15/15-6-final.md'
      - 'docs/stage14-15-bound-deep-review-queue.md'
      - 'docs/00_CURRENT_RESEARCH_STATUS.md'
      - '.github/workflows/stage27-40-upper-attack.yml'
  workflow_dispatch:

jobs:
  verify-stage27-40:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage27 checkpoint40 upper attack
        run: python stages/stage27/27-40/verify_27_40.py
