name: StructureRadar search16 inspect
on: pull_request
permissions: {contents: write}
jobs:
  inspect:
    if: github.head_ref == 'structure-radar-search-16-inspect'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - run: |
          python - <<'PY'
          import json,pathlib
          ids=[f'SR-STR-{i:03d}' for i in range(134,144)]
          r=json.load(open('docs/structure-radar/structure-registry.json'))
          cards=[c for c in r['structures'] if c['structure_id'] in ids]
          assert [c['structure_id'] for c in cards]==ids
          pathlib.Path('docs/structure-radar/TEMP-search16-cards.json').write_text(json.dumps(cards,indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name github-actions; git config user.email github-actions@github.com
          git add docs/structure-radar/TEMP-search16-cards.json
          git commit -m 'TEMP: extract StructureRadar search16 cards'
          git push
