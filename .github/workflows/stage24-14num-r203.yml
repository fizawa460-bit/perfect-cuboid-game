name: 24-14num-r203 finite matched-ratio audit

on:
  pull_request:
    paths:
      - 'stages/stage24/24-14num-r203/**'
      - '.github/workflows/stage24-14num-r203.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-interpret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute the deterministic r203 audit
        run: >-
          python stages/stage24/24-14num-r203/analyze.py
          --input stages/stage24/24-14num-r203/input.json
          --output /tmp/r203-analysis.json
      - name: Show audit output
        run: cat /tmp/r203-analysis.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage24-r203-analysis
          path: /tmp/r203-analysis.json
