name: Stage34-02 D2 StageA2 pair model6 PARI rank interval

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage34/runkeys/stage34-02-d2-stageA2-pair-model6-pari.json'
      - 'stages/stage34/34-02/d2-stageA2-pair-model6-pari-rank-lock.json'
      - 'stages/stage34/34-02/run_d2_stageA2_pair_model6_pari_rank.py'
      - 'stages/stage34/34-02/validate_d2_stageA2_pair_model6_pari_runkey.py'
      - '.github/workflows/stage34-02-d2-stageA2-pair-model6-pari.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch event-before commit if needed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ]; then git fetch --no-tags --depth=1 origin "$BEFORE" || true; fi
      - name: Validate dedicated run key against actual commit range
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 stages/stage34/34-02/validate_d2_stageA2_pair_model6_pari_runkey.py "$BEFORE" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Report authorization
        run: echo "authorized=${{ steps.gate.outputs.authorized }} reason=${{ steps.gate.outputs.reason }}"

  pair-model6-pari:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install PARI GP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pari-gp
          dpkg-query -W pari-gp
      - name: Decide model 6 zero versus nonzero rank by exact 2-descent interval
        run: python3 stages/stage34/34-02/run_d2_stageA2_pair_model6_pari_rank.py
      - name: Enforce compact artifact cap
        if: always()
        run: |
          test -f stages/stage34/34-02/d2-stageA2-pair-model6-pari-rank.json
          test -f stages/stage34/34-02/d2-stageA2-pair-model6-pari-rank-stdout.txt
          test $(wc -c < stages/stage34/34-02/d2-stageA2-pair-model6-pari-rank.json) -le 1048576
          test $(wc -c < stages/stage34/34-02/d2-stageA2-pair-model6-pari-rank-stdout.txt) -le 1048576
      - name: Upload compact PARI interval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-02-d2-stageA2-pair-model6-pari
          path: |
            stages/stage34/34-02/d2-stageA2-pair-model6-pari-rank.json
            stages/stage34/34-02/d2-stageA2-pair-model6-pari-rank-stdout.txt
          if-no-files-found: warn
          retention-days: 1
