name: Stage33 V91C1X_R4 state gate materializer

on:
  push:
    branches:
      - stage33-v91c1x-r4-cover-indexed-h2-representative
    paths:
      - '.github/workflows/stage33-v91c1x-r4-state-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage33-v91c1x-r4-cover-indexed-h2-representative
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize audited R3 to R4 construction gate
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r3_audit_pass_r4_main_state.py --write
      - name: Verify only MAIN-STATE changed
        run: |
          git diff --check
          test "$(git status --porcelain | wc -l)" -eq 1
          git status --porcelain | grep 'stages/stage33/MAIN-STATE.json'
      - name: Commit exact routing state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stages/stage33/MAIN-STATE.json
          git commit -m '[Stage33] route audited R3 checkpoint to R4 construction'
          git push origin HEAD:stage33-v91c1x-r4-cover-indexed-h2-representative
