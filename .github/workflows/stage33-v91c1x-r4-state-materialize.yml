name: Stage33 V91C1X_R4 negative construction checkpoint materializer

on:
  push:
    branches:
      - stage33-v91c1x-r4-cover-indexed-h2-representative
    paths:
      - '.github/workflows/stage33-v91c1x-r4-state-materialize.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r4_retained_boundary_resolution_insufficient.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage33-v91c1x-r4-negative-checkpoint
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage33-v91c1x-r4-cover-indexed-h2-representative
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize R4 exact noncredit construction blocker
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r4_retained_boundary_resolution_insufficient.py --write
      - name: Verify exact generated scope
        run: |
          git diff --check
          test "$(git status --porcelain | wc -l)" -eq 2
          git status --porcelain | grep 'stages/stage33/MAIN-STATE.json'
          git status --porcelain | grep 'stages/stage33/33-12/e3-v91c1x-r4-retained-boundary-resolution-insufficient-for-cover-indexed-h2.json'
      - name: Commit exact R4 checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stages/stage33/MAIN-STATE.json
          git add stages/stage33/33-12/e3-v91c1x-r4-retained-boundary-resolution-insufficient-for-cover-indexed-h2.json
          git commit -m '[Stage33] materialize R4 retained boundary resolution blocker'
          git push origin HEAD:stage33-v91c1x-r4-cover-indexed-h2-representative
