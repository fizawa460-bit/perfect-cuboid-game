name: Stage33-12 bounded workspace export

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage33/runkeys/stage33-12-workspace-export.json'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Verify bounded export key
        run: |
          python - <<'PY'
          import json
          p='stages/stage33/runkeys/stage33-12-workspace-export.json'
          x=json.load(open(p))
          assert x['schema']=='STAGE33_12_WORKSPACE_EXPORT_V1'
          assert x['generation']==1 and x['armed'] is True
          assert x['heavy_compute'] is False
          assert x['planned_jobs']==1
          assert x['projected_artifact_bytes_upper_bound']<=5000000
          assert x['retention_days']==1
          print('STAGE33_12_WORKSPACE_EXPORT=AUTHORIZED_BOUNDED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-12-bounded-workspace-export
          retention-days: 1
          if-no-files-found: error
          path: |
            stages/stage33/controller.json
            stages/stage33/sync_main_state.py
            stages/stage33/MAIN-STATE.json
            stages/stage33/MAIN-BATCH-HANDOFF.md
            stages/stage33/33-12/qpic-bridge-local-recertification-receipt.json
            stages/stage33/33-12/j2-semantic-u1-full-surface-smith-source.json
            stages/stage33/33-12/j2-order4-brauer-lift-reduction.json
            stages/stage33/33-12/j2-marked-order4-lift-label-gap.json
            stages/stage33/33-12/j2-marked-order4-geometric-sign-indistinguishability.json
            stages/stage33/33-12/j2-marked-discriminant-proper-br2-adapter-source-lock-gap.json
            stages/stage33/33-07/marked-picard-basis-bridge-certified.json
            stages/stage33/33-07/proper-brauer2-from-discriminant.json
