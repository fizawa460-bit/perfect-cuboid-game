name: Stage32 post1648 delta0inf retained-W marking localization

on:
  pull_request:
    paths:
      - 'stages/stage32/residual-32-01-production/post1648-delta0inf-retained-w-absolute-marking-localization.json'
      - 'stages/stage32/residual-32-01-production/post1648-delta0inf-retained-w-absolute-marking-localization-source-note.md'
      - 'stages/stage32/residual-32-01-production/verify_stage32_post1648_delta0inf_retained_w_absolute_marking_localization.py'
      - '.github/workflows/stage32-post1648-delta0inf-retained-w-marking-localization.yml'

jobs:
  marking-localization:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Verify finite marking localization
        run: python3 -B stages/stage32/residual-32-01-production/verify_stage32_post1648_delta0inf_retained_w_absolute_marking_localization.py
      - name: Diff check
        run: git diff --check
