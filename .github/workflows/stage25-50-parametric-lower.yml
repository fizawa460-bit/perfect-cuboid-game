name: Stage25-50 parametric lower audit

on:
  pull_request:
    paths:
      - 'stages/stage25/25-50/**'
      - 'stages/stage25/25-controller.json'
      - '.github/workflows/stage25-50-parametric-lower.yml'
  workflow_dispatch:

jobs:
  parametric-lower-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage25 checkpoint50 parametric family
        run: python stages/stage25/25-50/parametric_family_audit.py
