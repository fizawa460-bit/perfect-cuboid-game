name: Stage15-6bf denominator rigidity

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6bf/**'
      - 'stages/stage15/evidence/stage15_6bf_denominator_rigidity.json'
      - 'stages/stage15/replay/verify_stage15_6bf.py'
      - 'stages/stage15/scripts/stage15_6bf_denominator_rigidity.py'
      - '.github/workflows/stage15-6bf-denominator-rigidity.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python stages/stage15/replay/verify_stage15_6bf.py
      - run: python -m py_compile stages/stage15/scripts/stage15_6bf_denominator_rigidity.py stages/stage15/replay/verify_stage15_6bf.py
