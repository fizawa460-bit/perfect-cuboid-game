name: Stage12-N1-2 review bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/stage12-n1-2m-iterated-selberg-delange.md"
      - "docs/stage12-n1-2n-coupled-region.md"
      - "docs/stage12-n1-2o-analytic-closure.md"
      - "scripts/build_stage12_n1_2_review_bundle.py"
      - ".github/workflows/stage12-n1-2-review-bundle.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build R04 review bundle
        run: |
          python -m py_compile scripts/build_stage12_n1_2_review_bundle.py
          python scripts/build_stage12_n1_2_review_bundle.py
          grep -q '^CHECKPOINT=START_OF_MAIN$' review/stage12-n1-2-proof-review-r04.md
          grep -q '^CHECKPOINT=END_OF_MAIN$' review/stage12-n1-2-proof-review-r04.md
          test "$(grep -c '^END_OF_BUNDLE=PC-N1-2-PROOF-REVIEW-R04$' review/stage12-n1-2-proof-review-r04.md)" -eq 2
      - name: Upload review bundle
        uses: actions/upload-artifact@v4
        with:
          name: stage12-n1-2-proof-review-r04
          path: review/stage12-n1-2-proof-review-r04.md
          if-no-files-found: error
