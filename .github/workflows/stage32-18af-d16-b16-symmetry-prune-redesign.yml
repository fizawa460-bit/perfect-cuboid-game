name: Stage32-18AF d16 b16 symmetry-prune redesign pilot

on:
  push:
    branches:
      - stage32-18af-b16-symmetry-prune-redesign
    paths:
      - 'stages/stage32/runkeys/18af-b16-symmetry-prune-redesign.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-18af-b16-symmetry-prune-redesign
  cancel-in-progress: true

jobs:
  validate-run-key:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.key.outputs.matrix }}
      generation: ${{ steps.key.outputs.generation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require dedicated ARM commit
        run: |
          set -euo pipefail
          KEY='stages/stage32/runkeys/18af-b16-symmetry-prune-redesign.json'
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$KEY"
          test "$(git log -1 --pretty=%s)" = 'Stage32-18AF: ARM B16 SYMMETRY PRUNE REDESIGN'
      - id: key
        name: Validate redesign contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,urllib.request
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18af-b16-symmetry-prune-redesign.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1'
          assert d['workflow']=='stage32-18af-d16-b16-symmetry-prune-redesign'
          assert d['armed'] is True and d['generation']==1 and d['bound']==16
          assert d['source_x1024_run_id']==33068629260
          assert d['source_x1024_summary_artifact_id']==9645843013
          assert d['source_x1024_summary_digest']=='sha256:609e0c36e1b65d8e542e8463346cdbad680eb303a6264f0dbf9eec2a170a9328'
          assert d['source_exact_artifact_id']==9574308138
          assert d['source_exact_zip_sha256']=='0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4'
          assert d['symmetry_schedule_margin_old']==1.25 and d['symmetry_schedule_margin_new']==1.0
          assert d['secondary_shard_count']==1024 and d['secondary_coordinate']==48
          assert d['node_cap']==18000000 and d['max_parallel']==12 and d['max_parallel']<=18
          walls={436:[176,5,362],503:[147,118,665],922:[800,17,883,38,13,334]}
          got={int(k):v for k,v in d['remaining_x1024_walls'].items()}; assert got==walls
          inc=[{'tag':f'p{p}-s{s}','primary':p,'secondary':s} for p in (436,503,922) for s in walls[p]]
          assert len(inc)==12
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'stage32-18af-preflight'}
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/artifacts/{d['source_x1024_summary_artifact_id']}",headers=headers)
          with urllib.request.urlopen(req) as r: a=json.load(r)
          assert a['workflow_run']['id']==d['source_x1024_run_id'] and not a['expired'] and a['digest']==d['source_x1024_summary_digest']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('generation=1\n'); f.write('matrix='+json.dumps({'include':inc},separators=(',',':'))+'\n')
          print(json.dumps({'jobs':len(inc),'old_margin':1.25,'new_margin':1.0,'node_cap':d['node_cap']},sort_keys=True))
          PY

  prepare:
    needs: validate-run-key
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build exact redesigned certifiers from immutable source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libboost-dev
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/prepared"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RUNNER_TEMP/source.zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          for p in 436 503 922; do
            python stages/stage32/32-18X/build_two_stage_certifier.py \
              --source "$RUNNER_TEMP/source/d16-exact-symmetry-sharded.cpp" \
              --output "$RUNNER_TEMP/prepared/d16-two-stage-$p.cpp" --primary-id "$p"
            SRC="$RUNNER_TEMP/prepared/d16-two-stage-$p.cpp" python stages/stage32/32-18AF/patch_symmetry_schedule.py
            g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic \
              "$RUNNER_TEMP/prepared/d16-two-stage-$p.cpp" -o "$RUNNER_TEMP/prepared/d16-two-stage-$p"
          done
          cp "$RUNNER_TEMP/source/d16-hperp.txt" "$RUNNER_TEMP/prepared/"
          cp "$RUNNER_TEMP/source/d16-aut-prefix256-bundle.txt" "$RUNNER_TEMP/prepared/"
          sha256sum "$RUNNER_TEMP/prepared"/* > "$RUNNER_TEMP/prepared/files.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18af-prepared-g1
          path: ${{ runner.temp }}/prepared/
          retention-days: 7
          if-no-files-found: error

  redesign:
    needs: [validate-run-key, prepare]
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.validate-run-key.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage32-18af-prepared-g1
          path: ${{ runner.temp }}/prepared
      - name: Restore executable modes
        run: chmod +x "$RUNNER_TEMP/prepared/d16-two-stage-436" "$RUNNER_TEMP/prepared/d16-two-stage-503" "$RUNNER_TEMP/prepared/d16-two-stage-922"
      - name: Exact redesigned wall ${{ matrix.tag }}
        env:
          PRIMARY: ${{ matrix.primary }}
          SECONDARY: ${{ matrix.secondary }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          exe="$RUNNER_TEMP/prepared/d16-two-stage-$PRIMARY"
          set +e
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" \
            timeout --signal=TERM --kill-after=30s 45m \
            "$exe" --input "$RUNNER_TEMP/prepared/d16-hperp.txt" \
              --bundle "$RUNNER_TEMP/prepared/d16-aut-prefix256-bundle.txt" \
              --output "$RUNNER_TEMP/out/cert.json" --dump-canonical "$RUNNER_TEMP/out/dump.bin" \
              --bound 16 --shard-id "$SECONDARY" --shard-count 1024 --split-coordinate 48 --node-cap 18000000 \
              >"$RUNNER_TEMP/out/stdout.txt" 2>"$RUNNER_TEMP/out/stderr.txt"
          rc=$?; set -e
          if [ "$rc" -ne 0 ]; then
            if grep -q 'exact traversal node cap exceeded' "$RUNNER_TEMP/out/stderr.txt"; then status=RESOURCE_WALL_NODE_CAP; else status=UNEXPECTED_FAILURE; fi
            STATUS="$status" RC="$rc" python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          runtime=float((root/'runtime.txt').read_text().strip().splitlines()[-1])
          out={'schema':'STAGE32_18AF_B16_SYMMETRY_PRUNE_REDESIGN_RESULT_V1','tag':os.environ['TAG'],'primary_residue':int(os.environ['PRIMARY']),'secondary_shard':int(os.environ['SECONDARY']),'secondary_shard_count':1024,'status':os.environ['STATUS'],'node_cap':18000000,'runtime_seconds':runtime,'exit_code':int(os.environ['RC']),'symmetry_schedule_margin':1.0,'D16_B16_NUMERICAL_CREDIT':False}
          (root/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,sort_keys=True))
          PY
            test "$status" != UNEXPECTED_FAILURE
          else
            python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'; d=json.loads((root/'cert.json').read_text())
          assert d['schema']=='STAGE32_18X_D16_B16_TWO_STAGE_SHARD_V1' and d['status']=='COMPLETE' and d['bound']==16
          assert d['TRAVERSAL_COMPLETENESS_CERTIFICATE'] is True and d['all_symmetry_branch_rejections_exact_rational_cauchy_schwarz'] is True
          assert d['aut_group_order']==1536 and d['dfs_symmetry_breaker_count']==256
          p=int(os.environ['PRIMARY']); s=int(os.environ['SECONDARY']); assert (d['primary_shard_id'],d['primary_shard_count'],d['primary_split_coordinate'])==(p,1024,54)
          assert (d['secondary_shard_id'],d['secondary_shard_count'],d['secondary_split_coordinate'])==(s,1024,48)
          raw=(root/'dump.bin').read_bytes(); runtime=float((root/'runtime.txt').read_text().strip().splitlines()[-1])
          out={'schema':'STAGE32_18AF_B16_SYMMETRY_PRUNE_REDESIGN_RESULT_V1','tag':os.environ['TAG'],'primary_residue':p,'secondary_shard':s,'secondary_shard_count':1024,'status':'COMPLETE','node_cap':18000000,'runtime_seconds':runtime,'nodes':d.get('nodes'),'coordinate_trials':d.get('coordinate_trials'),'exact_symmetry_prune_checks':d.get('exact_symmetry_prune_checks'),'symmetry_prunes':d.get('symmetry_prunes'),'canonical_survivors_including_zero':d['canonical_survivors_including_zero'],'canonical_dump_sha256':hashlib.sha256(raw).hexdigest(),'symmetry_schedule_margin':1.0,'D16_B16_NUMERICAL_CREDIT':False}
          (root/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,sort_keys=True))
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18af-${{ matrix.tag }}-g1
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error

  summarize:
    needs: [validate-run-key, redesign]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-18af-p*-g1
          path: ${{ runner.temp }}/runs
      - name: Freeze redesign verdict
        run: |
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'runs'; docs=[]
          for p in root.rglob('compact.json'): docs.append(json.loads(p.read_text()))
          assert len(docs)==12,len(docs)
          complete=sum(d['status']=='COMPLETE' for d in docs); walls=sum(d['status']=='RESOURCE_WALL_NODE_CAP' for d in docs)
          assert complete+walls==12
          if complete==12:
              verdict='PASS_B16_TAIL_ALGORITHM_REDESIGN__SYMMETRY_SCHEDULE_1P0_CLOSES_ALL_12_WALLS'
              next_item='32-18AG-D16-B16-RESOURCE-SAFE-EXACT-PRODUCTION-DESIGN'
          elif complete>0:
              verdict='PARTIAL_B16_TAIL_ALGORITHM_REDESIGN__SYMMETRY_SCHEDULE_1P0_REDUCES_WALL_SET'
              next_item='32-18AG-D16-B16-SECOND_ALGORITHM_REDIRECTION'
          else:
              verdict='FAIL_B16_TAIL_ALGORITHM_REDESIGN__SYMMETRY_SCHEDULE_1P0_NO_WALL_CLOSURE'
              next_item='32-18AG-D16-B16-SECOND_ALGORITHM_REDIRECTION'
          out={'schema':'STAGE32_18AF_B16_SYMMETRY_PRUNE_REDESIGN_SUMMARY_V1','verdict':verdict,'source_wall_count':12,'new_complete_count':complete,'remaining_wall_count':walls,'results':sorted(docs,key=lambda d:(d['primary_residue'],d['secondary_shard'])),'next_item':next_item,'D16_B16_NUMERICAL_CREDIT':False,'GLOBAL_B16_AGGREGATION_COMPLETE':False,'FULL_D16_G0_ROW_COMPLETE':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False,'CONTROLLER_MODIFIED':False}
          outdir=pathlib.Path(os.environ['RUNNER_TEMP'])/'summary'; outdir.mkdir(); (outdir/'stage32-18af-b16-symmetry-prune-redesign-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'verdict':verdict,'new_complete_count':complete,'remaining_wall_count':walls,'next_item':next_item},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18af-b16-symmetry-prune-redesign-summary-g1
          path: ${{ runner.temp }}/summary/
          retention-days: 14
          if-no-files-found: error
