name: Stage14-s7-15 centered k-collision audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-15/**'
      - 'stages/stage14/scripts/14-s7-15/**'
      - '.github/workflows/stage14-s7-15-centered-k-collision.yml'
      - 'stages/stage14/14-s7-14/**'
      - 'stages/stage14/14-t50/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regress Stage14-s7-14 xi-k receiver
        run: python stages/stage14/scripts/14-s7-14/large_xi_k_collision_audit.py

      - name: Audit Stage14-s7-15 centered k-collision amplifier
        run: python stages/stage14/scripts/14-s7-15/centered_k_collision_audit.py

      - name: Lock Stage14-s7-15 theorem boundary
        shell: bash
        run: |
          set -euo pipefail
          f=stages/stage14/14-s7-15/result.md
          grep -F 'STAGE14_S7_15=COMPLETE_CENTERED_XI_K_COLLISION_AMPLIFIER_AND_TH14_CONTRACT' "$f"
          grep -F 'CENTERED_FROBENIUS_IDENTITY_EXACT=true' "$f"
          grep -F 'RAW_A1_NEAR_LINEAR_ALONE_BEATS_7_8=false' "$f"
          grep -F 'CENTERED_NATURAL_SCALE_THEOREM_PROVED=false' "$f"
          grep -F 'CONDITIONAL_PHYSICAL_UPPER_BOUND_EXPONENT=6/7' "$f"
          grep -F 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/8' "$f"
          grep -F 'TH14_NEEDED=true' "$f"
          grep -F 'TH14_S7_REQUEST=CenteredXiKCollisionSecondMoment' "$f"
          grep -F 'SQRT_B_UPPER_BOUND_PROVED=false' "$f"
          grep -F 'NEXT=Stage14-s7-16' "$f"
