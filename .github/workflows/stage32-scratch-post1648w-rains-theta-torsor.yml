name: Stage32 scratch post1648W Rains ST12 theta torsor nonselection

on:
  push:
    branches:
      - stage32-scratch-post1648n-marked-ppav-basis
    paths:
      - '.github/workflows/stage32-scratch-post1648w-rains-theta-torsor.yml'
      - 'stages/stage32/residual-32-01-production/post1648w-rains-st12-theta-torsor-cohomology-nonselection.json'
