name: Stage15-6am coordinate-core split

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6am/**'
      - 'stages/stage15/evidence/stage15_6am_coordinate_core_split.json'
      - 'stages/stage15/replay/verify_stage15_6am.py'
      - 'stages/stage15/scripts/stage15_6am_coordinate_core_split.py'
      - '.github/workflows/stage15-6am-coordinate-core-split.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6am coordinate-core size split
        run: python stages/stage15/replay/verify_stage15_6am.py
      - name: Compile Stage15-6am utility
        run: python -m py_compile stages/stage15/scripts/stage15_6am_coordinate_core_split.py stages/stage15/replay/verify_stage15_6am.py
