name: Stage33 V41 Arsenal-first bounded-search routing

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: stage33-v41-routing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify V41 Arsenal-first bounded-search contract
        run: |
          python stages/stage33/33-12/verify_j2_post_v39_arsenal_first_bounded_search_policy_v41.py
          python stages/stage33/sync_main_state.py --check
          git diff --check
