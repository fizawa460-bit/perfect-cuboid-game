name: Stage14-s7-30 reciprocal discriminant short cofactor

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-30/**'
      - 'stages/stage14/scripts/14-s7-30/**'
      - '.github/workflows/stage14-s7-30-reciprocal-discriminant-short-cofactor.yml'
      - 'stages/stage14/14-s7-29/**'
      - 'stages/stage14/14-s7-28/**'
      - 'stages/stage14/14-4cp/**'
      - 'stages/stage14/14-toolbox-aw/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run s7-30 reciprocal discriminant audit
        run: python stages/stage14/scripts/14-s7-30/reciprocal_discriminant_short_cofactor_audit.py

      - name: Compile s7-30 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-30/reciprocal_discriminant_short_cofactor_audit.py

      - name: Run merged s7-29 regression
        run: python stages/stage14/scripts/14-s7-29/common_core_primitive_root_line_audit.py

      - name: Run merged s7-28 regression
        run: python stages/stage14/scripts/14-s7-28/primitive_ratio_reconstruction_audit.py

      - name: Lock imported boundaries
        run: |
          grep -Fq 'STAGE14_S7_29=COMPLETE_COMMON_CORE_GAUSSIAN_ROOT_LINE_PRIMITIVE_LATTICE_COUNT_AND_3_4_BOUND' stages/stage14/14-s7-29/result.md
          grep -Fq 'STAGE14_4CP=COMPLETE_THREE_QUARTER_PROMOTION_SINGULAR_ELIMINATION_AND_QUARTER_PHI_ROOTLINE_REDUCTION' stages/stage14/14-4cp/result.md
          grep -Fq 'THREE_QUARTER_SATURATION_REQUIRES_THETA=5/16' stages/stage14/14-4cp/result.md
          grep -Fq 'THREE_QUARTER_SATURATION_REQUIRES_PHI=1/4' stages/stage14/14-4cp/result.md
          grep -Fq 'TOP_THETA_LAMBDA4_SINGULAR_BRANCH_EMPTY=true' stages/stage14/14-4cp/result.md
          grep -Fq 'CURRENT_MAIN_S_RECEIVER=QuarterPhiCommonCorePrimitiveFourRootQuadraticValueEnergy' stages/stage14/14-toolbox-aw/result.md

      - name: Lock s7-30 theorem boundary
        run: |
          f=stages/stage14/14-s7-30/result.md
          grep -Fq 'STAGE14_S7_30=COMPLETE_RECIPROCAL_COMMON_CORE_DISCRIMINANT_DIVISIBILITY_AND_SHORT_COFACTOR_REDUCTION' "$f"
          grep -Fq 'RECIPROCAL_COMMON_CORE_DISCRIMINANT_DIVISIBILITY_PROVED=true' "$f"
          grep -Fq 'RECIPROCAL_DISCRIMINANT_BAD_CORE_MULTIPLICITY=Bo1' "$f"
          grep -Fq 'RECIPROCAL_DISCRIMINANT_TWO_WAY_ALLOCATION_PROVED=true' "$f"
          grep -Fq 'RECIPROCAL_DISCRIMINANT_DOMINANT_CORE_SQRT_LOWER_BOUND=true' "$f"
          grep -Fq 'QUARTER_PHI_RECIPROCAL_DISCRIMINANT_COFACTOR_EXPONENT=1/4-c/2' "$f"
          grep -Fq 'RECIPROCAL_DISCRIMINANT_SHORT_COFACTOR_RECONSTRUCTS_XY=true' "$f"
          grep -Fq 'COMMON_CORE_DOUBLE_CHARGE_FORBIDDEN=true' "$f"
          grep -Fq 'FIXED_XY_COMMON_CORE_RECIPROCAL_FIBER_THRESHOLD=1/4-c/2' "$f"
          grep -Fq 'REMAINING_RECEIVER=QuarterPhiFixedXYCommonCoreReciprocalFiber' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=3/4' "$f"
          grep -Fq 'NEW_S7_30_WHOLE_FAMILY_POWER_SAVING_PROVED=false' "$f"
          grep -Fq 'S7_30_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-s7-31' "$f"
