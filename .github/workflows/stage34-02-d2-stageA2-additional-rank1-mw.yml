name: Stage34-02 D2 StageA2 additional rank-one MW

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage34/runkeys/stage34-02-d2-stageA2-additional-rank1-mw.json'
      - 'stages/stage34/34-02/d2-stageA2-additional-rank1-selection-lock.json'
      - 'stages/stage34/34-02/run_d2_stageA2_additional_rank1_selection.py'
      - 'stages/stage34/34-02/d2-stageA2-additional-rank1-mw-default-lock.json'
      - 'stages/stage34/34-02/run_d2_stageA2_additional_rank1_mw_default.py'
      - 'stages/stage34/34-02/validate_d2_stageA2_additional_rank1_mw_runkey.py'
      - '.github/workflows/stage34-02-d2-stageA2-additional-rank1-mw.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch event-before commit if needed
        env: {BEFORE: '${{ github.event.before }}'}
        run: 'if [ -n "$BEFORE" ]; then git fetch --no-tags --depth=1 origin "$BEFORE" || true; fi'
      - name: Validate dedicated run key against actual commit range
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 stages/stage34/34-02/validate_d2_stageA2_additional_rank1_mw_runkey.py "$BEFORE" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Report authorization
        run: echo "authorized=${{ steps.gate.outputs.authorized }} reason=${{ steps.gate.outputs.reason }}"

  certify-seven:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate exact residual and seven-model selection
        run: |
          python3 stages/stage34/34-02/run_d2_stageA2_factor_branch_local.py
          python3 stages/stage34/34-02/refine_d2_stageA2_factor_branch_support.py
          python3 stages/stage34/34-02/run_d2_stageA2_full_support_projective.py
          python3 stages/stage34/34-02/run_d2_stageA2_rank1_cover_selection.py
          python3 stages/stage34/34-02/run_d2_stageA2_additional_rank1_selection.py
      - name: Install proof-capable eclib mwrank
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends eclib-tools
          dpkg-query -W eclib-tools
      - name: Default-bound full MW basis pass on seven additional models
        run: python3 stages/stage34/34-02/run_d2_stageA2_additional_rank1_mw_default.py
      - name: Enforce compact artifact cap
        if: always()
        run: |
          test -f stages/stage34/34-02/d2-stageA2-additional-rank1-mw-default.json
          test -f stages/stage34/34-02/d2-stageA2-additional-rank1-mw-default-stdout.txt
          test $(wc -c < stages/stage34/34-02/d2-stageA2-additional-rank1-mw-default.json) -le 1048576
          test $(wc -c < stages/stage34/34-02/d2-stageA2-additional-rank1-mw-default-stdout.txt) -le 1048576
      - name: Upload compact additional MW evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-02-d2-stageA2-additional-rank1-mw
          path: |
            stages/stage34/34-02/d2-stageA2-additional-rank1-selection.json
            stages/stage34/34-02/d2-stageA2-additional-rank1-mw-default.json
            stages/stage34/34-02/d2-stageA2-additional-rank1-mw-default-stdout.txt
          if-no-files-found: warn
          retention-days: 1
