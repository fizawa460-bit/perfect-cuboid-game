name: Stage17-20 finite-data
on:
  pull_request:
    paths: ["stages/stage17/17-20/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python stages/stage17/17-20/enumerate.py --verify stages/stage17/17-20/counts.csv --self-check-b 200
