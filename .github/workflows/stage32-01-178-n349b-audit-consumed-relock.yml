name: "[Stage32][32-01-178][N349B] audit-consumed relock"

on:
  pull_request:
    paths:
      - "stages/stage32/32-01-178/nodes/N349/HOSTILE-AUDIT-PASS.json"
      - "stages/stage32/32-01-178/nodes/N349B/**"
      - ".github/workflows/stage32-01-178-n349b-audit-consumed-relock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sat: ${{ steps.ledger.outputs.sat }}
      unsat: ${{ steps.ledger.outputs.unsat }}
      unknown: ${{ steps.ledger.outputs.unknown }}
      canonical: ${{ steps.ledger.outputs.canonical }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.x"
      - name: Install exact verifier dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.3.0'
      - name: Replay exact N349B and consume external N349 audit
        run: |
          python stages/stage32/32-01-178/nodes/N349B/verify_n349b_audit_consumed_relock.py \
            --output /tmp/n349b-audit-consumed.json
      - name: Expose compact ledger
        id: ledger
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('/tmp/n349b-audit-consumed.json'))
          a=d['aggregate']
          print(f"sat={a['sat_count']}")
          print(f"unsat={a['unsat_count']}")
          print(f"unknown={a['unknown_count']}")
          print(f"canonical={d['canonical_sha256_without_this_field']}")
          PY
      - name: Diff check
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

  report:
    needs: verify
    runs-on: ubuntu-latest
    name: "N349B audited-input ledger SAT=${{ needs.verify.outputs.sat }} UNSAT=${{ needs.verify.outputs.unsat }} UNKNOWN=${{ needs.verify.outputs.unknown }}"
    steps:
      - name: Report relocked exact ledger
        run: |
          echo "canonical=${{ needs.verify.outputs.canonical }}"
          echo "N349 hostile audit consumed; N349B itself remains audit-required"
          echo "MAIN/FULL178/N350/theorem/receiver/endpoint credit=false"
