name: Stage33 V91C1X R5B2C3 exact-head read-only replay

on:
  push:
    paths:
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b2c3_all_double_overlaps_317_cover.py'
      - 'stages/stage33/33-12/verify_stage33_v91c1x_r5b2c3_all_double_overlaps_317_cover_v127.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2c3-all-double-overlaps-317-cover.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2c2-jacobian-minor-smooth-cover-node-glue.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2c1-all-48-node-isolating-rees-neighborhoods.json'
      - 'stages/stage33/33-07/exceptional-p1-tangent-coordinates.json'
      - 'stages/stage33/MAIN-STATE.json'
      - 'stages/stage33/sync_main_state.py'
      - '.github/workflows/stage33-v91c1x-r5b2c3-all-double-overlaps-317-cover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assert exact checkout head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "exact_head=$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependency
        run: python -m pip install sympy
      - name: Replay R5B2C3 materializer read-only
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b2c3_all_double_overlaps_317_cover.py
      - name: Verify R5B2C3 all double overlaps
        run: python stages/stage33/33-12/verify_stage33_v91c1x_r5b2c3_all_double_overlaps_317_cover_v127.py
      - name: Verify live Stage33 state remains synchronized
        run: python stages/stage33/sync_main_state.py --check
      - name: Diff check
        run: git diff --check
      - name: Assert read-only replay left checkout clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi
