name: Stage27-20-r301k-m moduli twist batch

on:
  push:
    branches:
      - agent/stage27-20-r301k-m-moduli-twist-batch
  pull_request:
    paths:
      - 'stages/stage27/27-20-r301g-j/**'
      - 'stages/stage27/27-20-r301g/**'
      - 'stages/stage27/27-20-r301h/**'
      - 'stages/stage27/27-20-r301i/**'
      - 'stages/stage27/27-20-r301j/**'
      - 'stages/stage27/27-20-r301k-m/**'
      - 'stages/stage27/27-20-r301k/**'
      - 'stages/stage27/27-20-r301l/**'
      - 'stages/stage27/27-20-r301m/**'
      - 'stages/stage27/27-controller.json'
      - '.github/workflows/stage27-20-r301k-m-moduli-twist.yml'

jobs:
  verify-stage27-20-r301k-m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage27-20-r301k-m moduli twist batch
        run: python stages/stage27/27-20-r301k-m/verify_27_20_r301k_m.py
      - name: Validate controller and registries
        run: |
          python -m json.tool stages/stage27/27-controller.json >/dev/null
          python -m json.tool stages/stage27/27-20-r301g-j/batch-registry.json >/dev/null
          python -m json.tool stages/stage27/27-20-r301k-m/batch-registry.json >/dev/null
      - name: Diff hygiene
        run: |
          git diff --check HEAD^
          test ! -e .github/workflows/tmp-stage27-r301km-sync.yml
