name: Stage35-EX Goal4AJ numerator reflexive generator gen2

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage35-ex/runkeys/goal4aj-numerator-reflexive-generator-gen2.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage35-ex-goal4aj-num-reflexive-generator-gen2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          KEY='stages/stage35-ex/runkeys/goal4aj-numerator-reflexive-generator-gen2.json'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test '${{ github.event_name }}' = 'pull_request' || exit 0
          test "${PR_NUMBER}" = '1659' || exit 0
          test "${HEAD_REF}" = 'stage35-ex-goal4x-open-receiver-boundary-picard' || exit 0
          test -n "${BEFORE}" || exit 0
          git fetch --no-tags --depth=1 origin "${BEFORE}" || exit 0
          git diff --name-only "${BEFORE}" HEAD | grep -Fxq "${KEY}" || exit 0
          git show "${BEFORE}:${KEY}" > /tmp/old-key.json || exit 0
          python - <<'PY' > /tmp/auth
          import json,os,subprocess
          from pathlib import Path
          k=json.loads(Path('stages/stage35-ex/runkeys/goal4aj-numerator-reflexive-generator-gen2.json').read_text())
          old=json.loads(Path('/tmp/old-key.json').read_text())
          blob=subprocess.check_output(['git','hash-object','stages/stage35-ex/diagnose_stage35_ex_35_goal4aj_numerator_reflexive_generator_gen2.py'],text=True).strip()
          ok=(k.get('schema')=='STAGE35_EX_GOAL4AJ_NUMERATOR_REFLEXIVE_GENERATOR_GEN2_RUNKEY_V1' and k.get('armed') is True and old.get('armed') is False and old.get('generation')==0 and k.get('generation')==1 and k.get('armed_from_head_sha')==os.environ['BEFORE'] and blob==k.get('probe_blob_sha1')=='a6c4a4f6e1db1817149c09d02d440d612e4549b2' and k.get('planned_jobs')==1 and k.get('planned_shards')==1 and k.get('actions_artifact_upload') is False)
          print('true' if ok else 'false')
          PY
          test "$(tail -n1 /tmp/auth)" = true || exit 0
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  diagnose:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Singular
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends singular
      - name: Build numerator degree31 candidate by one-shot hull
        run: |
          set -euo pipefail
          python -B stages/stage35-ex/diagnose_stage35_ex_35_goal4aj_numerator_reflexive_generator_gen2.py | tee /tmp/goal4aj-num-gen2.log
          grep -q '^GOAL4AJ_NUM_GEN2_JSON=' /tmp/goal4aj-num-gen2.log
          grep -q '^GOAL4AJ_NUM_GEN2=PASS$' /tmp/goal4aj-num-gen2.log
          test "$(wc -c </tmp/goal4aj-num-gen2.log)" -le 131072
