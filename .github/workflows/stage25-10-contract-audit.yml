name: Stage25-10 contract audit

on:
  pull_request:
    paths:
      - 'stages/stage25/**'
      - '.github/workflows/stage25-10-contract-audit.yml'

jobs:
  contract-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage25 checkpoint10 contract
        run: python stages/stage25/25-10/contract_audit.py
