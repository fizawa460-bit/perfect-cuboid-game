name: Stage32 resumable prefix selftest

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/residual-32-01-production/resumable_prefix_engine.py'
      - 'stages/stage32/residual-32-01-production/run_full178_resumable_work_unit.py'
      - 'stages/stage32/residual-32-01-production/test_resumable_prefix_engine.py'
      - 'stages/stage32/residual-32-01-production/test_resumable_prefix_engine_stage32.py'
      - 'stages/stage32/residual-32-01-production/test_resumable_full178_runner.py'
      - '.github/workflows/stage32-resumable-prefix-selftest.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Exact synthetic segmented-vs-one-shot regression
        run: python stages/stage32/residual-32-01-production/test_resumable_prefix_engine.py
      - name: Exact real Stage32 oracle segmented-vs-one-shot regression
        run: python stages/stage32/residual-32-01-production/test_resumable_prefix_engine_stage32.py
      - name: Exact real row-tail branching collapse regression
        run: python stages/stage32/residual-32-01-production/test_resumable_full178_runner.py
