name: StructureRadar batch19 ledger fix

on:
  push:
    branches:
      - structure-radar-deep-corpus-batch-19
    paths:
      - .github/structure-radar-batch19-ledger-fix-trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move batch19 into audit_batches and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/structure-radar/progress.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          batch_id = 'SR-BATCH-STAGE14_15_DEEP_CORPUS-19-R01'

          batches = data.get('batches')
          if not isinstance(batches, list):
              raise SystemExit('top-level batches is missing or not a list')
          matches = [x for x in batches if x.get('batch_id') == batch_id]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one batch19 in batches, got {len(matches)}')
          if len(batches) != 1:
              raise SystemExit(f'expected top-level batches to contain only batch19, got {len(batches)} entries')

          obj = matches[0]
          audit_batches = data.get('audit_batches')
          if not isinstance(audit_batches, list):
              raise SystemExit('audit_batches is missing or not a list')
          if any(x.get('batch_id') == batch_id for x in audit_batches):
              raise SystemExit('batch19 already present in audit_batches')

          audit_batches.append(obj)
          del data['batches']
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          check = json.loads(path.read_text(encoding='utf-8'))
          assert 'batches' not in check
          assert check['audit_batches'][-1] == obj
          assert check['audit_batches'][-1]['batch_id'] == batch_id
          print('LEDGER_FIX_OK')
          PY
          python scripts/structure_radar.py verify
          git diff --check
      - name: Commit only corrected ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/structure-radar-batch19-ledger-fix.yml .github/structure-radar-batch19-ledger-fix-trigger.txt
          git add docs/structure-radar/progress.json
          git diff --cached --check
          git commit -m 'StructureRadar: fix batch19 progress ledger placement'
          git push origin HEAD:structure-radar-deep-corpus-batch-19
