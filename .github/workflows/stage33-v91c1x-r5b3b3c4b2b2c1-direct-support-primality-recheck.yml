name: Stage33 V91C1X C4B2B2C1 direct-support primality recheck

on:
  push:
    branches:
      - stage33-v91c1x-r5b3b3c4b1e-1757-refinement-unit-preflight
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b2b2c1-direct-support-primality-recheck.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b2b2c1_inherited_direct_support_primality_recheck.py'
      - 'stages/stage33/33-11d/stage33-11d-prime-refinement-certificate.json'
      - 'stages/stage33/33-11e/stage33-11e-prime-galois-transport-certificate.json'
      - 'stages/stage33/33-11e/verify_stage33_11e_prime_galois_transport.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c3-c1-factor-to-strict-prime-and-exceptional-attachment.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b2c-unique-degree16-residue-norm-sweep.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Materialize exact direct-support primality recheck
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b2b2c1_inherited_direct_support_primality_recheck.py --write
      - name: Enforce artifact-only bounded delta
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b2c1-inherited-direct-support-primality-recheck.json'
          changed="$(git status --porcelain | sed 's/^...//')"
          test -n "$changed"
          test "$changed" = "$artifact"
          git diff --check
      - name: Commit generated certificate
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b2c1-inherited-direct-support-primality-recheck.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$artifact"
          git diff --cached --quiet || git commit -m '[Stage33] materialize C4B2B2C1 direct-support primality recheck'
          git push
