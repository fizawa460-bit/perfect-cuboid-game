name: Stage32-21bf exact per-triple r49 projection

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/stage32-21bf-r49-per-triple-projection.yml'
      - 'stages/stage32/residual-32-01-production/certify_stage32_21bf_r49_per_triple_projection.py'
      - 'stages/stage32/32-21/32-21az-survivor-prism.json'
      - 'stages/stage32/32-21/32-21bb-r51-interval-formula.json'
      - 'stages/stage32/32-21/32-21bc-pair-combination-bounds.json'
      - 'stages/stage32/32-21/32-21be-r51-endpoint-audit.json'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-21bf-r49-per-triple-projection-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - id: gate
        name: Authorize only from current synchronization range
        shell: bash
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          authorized=false
          if [ -n "$BEFORE" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$BEFORE" "$HEAD")"
              if printf '%s\n' "$changed" | grep -Eq '^(\.github/workflows/stage32-21bf-r49-per-triple-projection\.yml|stages/stage32/residual-32-01-production/certify_stage32_21bf_r49_per_triple_projection\.py|stages/stage32/32-21/32-21az-survivor-prism\.json|stages/stage32/32-21/32-21bb-r51-interval-formula\.json|stages/stage32/32-21/32-21bc-pair-combination-bounds\.json|stages/stage32/32-21/32-21be-r51-endpoint-audit\.json|stages/stage33/33-07/picard_base_rows_retained\.py|stages/stage33/33-07/stage32_picard_marking_retained\.py)$'; then
                authorized=true
              fi
            fi
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "authorized=$authorized"

  project:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Project exact per-triple r49 interval
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python certify_stage32_21bf_r49_per_triple_projection.py shard \
            --source-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21az-survivor-prism.json" \
            --formula-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bb-r51-interval-formula.json" \
            --pair-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21bc-pair-combination-bounds.json" \
            --audit-lock "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21be-r51-endpoint-audit.json" \
            --retained "$GITHUB_WORKSPACE/stages/stage33/33-07/picard_base_rows_retained.py" \
            --marking "$GITHUB_WORKSPACE/stages/stage33/33-07/stage32_picard_marking_retained.py" \
            --shard-index ${{ matrix.shard }} \
            --shard-count 2 \
            --per-check-timeout-ms 2000 \
            --output "$GITHUB_WORKSPACE/stage32-21bf-r49-projection-${{ matrix.shard }}.json"
      - name: Upload compact shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-21bf-r49-projection-${{ matrix.shard }}
          path: stage32-21bf-r49-projection-${{ matrix.shard }}.json
          retention-days: 3
          compression-level: 9

  aggregate:
    needs: [authorize, project]
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependency
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Download shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: stage32-21bf-r49-projection-*
          path: projection-artifacts
      - name: Aggregate exact r49 projection
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python certify_stage32_21bf_r49_per_triple_projection.py aggregate \
            --input-dir "$GITHUB_WORKSPACE/projection-artifacts" \
            --shard-count 2 \
            --output "$GITHUB_WORKSPACE/stage32-21bf-r49-projection-aggregate.json"
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-21bf-r49-projection-aggregate
          path: stage32-21bf-r49-projection-aggregate.json
          retention-days: 3
          compression-level: 9
