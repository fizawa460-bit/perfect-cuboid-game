name: Stage32EX5 BC2-29 bounded executor
# lifecycle: ACTIVE_AUTO — current one-generation BC2-29 executor; remove after retained result

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage32-ex5/runkeys/bc2-29-boundary39-partition.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_29_boundary39_partition.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-29-residual-p38-leaf-manifest.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-29-boundary39-partition-preflight.json'
      - '.github/workflows/stage32-ex5-bc2-29.yml'

permissions:
  contents: read

jobs:
  authorize-bc2-29:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: gate
        name: Authorize only fresh BC2-29 generation-1 runkey
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          key=Path('stages/stage32-ex5/runkeys/bc2-29-boundary39-partition.json')
          before=os.environ.get('BEFORE','').strip(); head=os.environ.get('HEAD_SHA','').strip()
          authorized=False; reason='cold'
          if before and head and key.exists():
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',before],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              old_ok=subprocess.run(['git','cat-file','-e',before+'^{commit}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if old_ok:
                  changed=subprocess.check_output(['git','diff','--name-only',before,head],text=True).splitlines()
                  if str(key) in changed:
                      r=json.loads(key.read_text())
                      try:
                          old=json.loads(subprocess.check_output(['git','show',before+':'+str(key)],text=True,stderr=subprocess.DEVNULL))
                          generation_ok=int(r.get('generation',0))>int(old.get('generation',0))
                      except subprocess.CalledProcessError:
                          generation_ok=int(r.get('generation',0))==1
                      source='stages/stage32-ex5/breadth-cycle-2/bc2_29_boundary39_partition.py'
                      manifest='stages/stage32-ex5/breadth-cycle-2/bc2-29-residual-p38-leaf-manifest.json'
                      preflight='stages/stage32-ex5/breadth-cycle-2/bc2-29-boundary39-partition-preflight.json'
                      sb=subprocess.check_output(['git','hash-object',source],text=True).strip()
                      mb=subprocess.check_output(['git','hash-object',manifest],text=True).strip()
                      pb=subprocess.check_output(['git','hash-object',preflight],text=True).strip()
                      a=r.get('audit_consumption',{}); t=r.get('target',{}); ex=r.get('execution',{})
                      authorized=(r.get('schema')=='STAGE32EX5_BC2_29_BOUNDARY39_PARTITION_RUNKEY_V1'
                          and r.get('generation')==1 and r.get('armed') is True and generation_ok
                          and a.get('bc2_28_hostile_audit_status')=='PASS'
                          and a.get('bc2_28_hostile_audit_exact_head')=='4221d7f9816590e808976da37ba479880f35dc22'
                          and a.get('bc2_28_hostile_audit_review_id')==5183082213
                          and r.get('source_git_blob_sha')==sb=='5586ca655d0fb87cc9fabb2511b11699aa0ca298'
                          and r.get('residual_manifest_git_blob_sha')==mb=='5f74aceb08822f51e9602d4883f84c9a84ed8f76'
                          and r.get('preflight_git_blob_sha')==pb=='84246d50e6bab17bf6e2d3eeb9dba33fb52e332a'
                          and r.get('bc2_28_checkpoint_canonical')=='52138e7c417d69814d5007479420b56fcc27031679bf88f432916e6c89c77ec4'
                          and r.get('residual_manifest_canonical')=='f04ffdd2c34f145e7650208e7fc39d69dbf08530ab699a9884f056db3c4402e4'
                          and r.get('preflight_canonical')=='1ea7f9d509f42ad688a696c8011b858e48e25a7b11909726c92cc9732d8858e9'
                          and t.get('retained_unknown_parent_count')==4
                          and t.get('residual_unknown_p38_leaf_count')==4
                          and t.get('maximum_subbranch_checks')==16
                          and t.get('unretained_bc2_19_unknown_identity_count')==172
                          and ex.get('per_subbranch_timeout_ms')==2000
                          and ex.get('effective_heavy_concurrency')==1
                          and ex.get('heavy_scaleout_authorized') is False)
                      reason='fresh-runkey' if authorized else 'semantic-gate-failed'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('authorized='+('true' if authorized else 'false')+'\n')
          print('BC2-29 authorized:',authorized,'reason:',reason,'before:',before,'head:',head)
          PY

  bc2-29-boundary39-bounded:
    needs: authorize-bc2-29
    if: needs.authorize-bc2-29.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact BC2-29 dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Verify audited BC2-28 predecessor and Stage32 firewalls
        run: |
          python stages/stage32-ex5/breadth-cycle-2/verify_bc2_28_boundary38_partition_checkpoint.py
          python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Compile BC2-29 producer
        run: python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_29_boundary39_partition.py
      - name: Run bounded BC2-29 boundary39 exact partition
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_29_boundary39_partition.py \
            --per-subbranch-timeout-ms 2000 \
            --output "$RUNNER_TEMP/bc2-29.json"
          cat "$RUNNER_TEMP/bc2-29.json"
      - name: Validate BC2-29 scope firewalls
        run: |
          python - "$RUNNER_TEMP/bc2-29.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['audit_consumption']['bc2_28_hostile_audit_status']=='PASS'
          assert p['audit_consumption']['bc2_28_hostile_audit_review_id']==5183082213
          assert p['target']['checked_parent_count']==4
          assert p['target']['checked_bc2_28_unknown_p38_leaf_count']==4
          assert p['target']['unretained_bc2_19_unknown_identity_count']==172
          assert p['partition_certificate']['boundary_pairing_label']==39
          assert p['partition_certificate']['coverage_exact'] is True
          assert p['partition_certificate']['disjoint'] is True
          assert p['partition_certificate']['maximum_possible_subbranch_count']==16
          assert p['credit']['whole_first_block_unsat'] is False
          assert p['credit']['full178_complete'] is False
          assert p['credit']['stage32_main_credit'] is False
          assert p['firewalls']['unknown_relabelled_unsat'] is False
          assert p['firewalls']['partition_leaf_unknown_dropped'] is False
          assert p['firewalls']['main_promotion'] is False
          assert p['firewalls']['merge_authorized'] is False
          assert p['firewalls']['perfect_cuboid_existence_claim'] is False
          assert p['firewalls']['perfect_cuboid_nonexistence_claim'] is False
          print('BC2_29_SCOPE_OK',p['status'],p['canonical_sha256_without_this_field'])
          PY
      - name: Upload BC2-29 exact result
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-29-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/bc2-29.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
