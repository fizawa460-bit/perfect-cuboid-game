name: Stage25 reentry phase40 two-face audit

on:
  pull_request:
    paths:
      - 'stages/stage25/25-reentry-40/**'
      - 'stages/stage25/25-reentry-controller.json'
      - '.github/workflows/stage25-reentry-40-twoface.yml'
  workflow_dispatch:

jobs:
  verify-phase40-twoface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage25 reentry phase40 two-face theorem candidate
        run: python stages/stage25/25-reentry-40/verify_phase40.py
