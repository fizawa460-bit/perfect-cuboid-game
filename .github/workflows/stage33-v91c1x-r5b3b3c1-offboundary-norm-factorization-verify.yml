name: Stage33 V91C1X R5B3B3C1 offboundary norm factorization replay

on:
  push:
    branches:
      - stage33-v91c1x-r5b2d0-swap23-source-lock
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c1-offboundary-norm-factorization-verify.yml'
      - 'stages/stage33/33-12/verify_e3_v91c1x_r5b3b3c1_offboundary_norm_factorization.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c1-offboundary-norm-factorization.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b2-a2-02-formal-tame-symbol-hidden-carrier-inventory.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3b-classify-20-novel-carriers-and-unify-27.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependencies
        run: |
          python -m pip install --disable-pip-version-check 'sympy==1.14.0'
          sudo apt-get update -qq
          sudo apt-get install -y singular
      - name: Replay C1 from source locks
        run: python stages/stage33/33-12/verify_e3_v91c1x_r5b3b3c1_offboundary_norm_factorization.py
      - name: Keep Stage33 mutable authority unchanged
        run: python stages/stage33/sync_main_state.py --check
      - name: Repository diff check
        run: git diff --check
