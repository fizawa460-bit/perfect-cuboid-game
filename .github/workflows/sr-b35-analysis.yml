name: StructureRadar batch35 analyzer
on:
  push:
    branches: [agent/sr-b35-analysis]
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build batch35 source summary
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,re,math
          root=pathlib.Path('.')
          q=json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          task=next(t for t in q['tasks'] if t['status']=='READY' and t['phase']=='SOURCE_CENSUS')
          ids=task['source_ids']; assert len(ids)==17
          sm={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              d=json.loads(p.read_text())
              for s in d['sources']: sm[s['source_id']]=s
          reg=json.loads((root/'docs/structure-radar/structure-registry.json').read_text())['structures']
          def toks(s): return set(re.findall(r'[A-Za-z0-9_]+',s.lower()))
          card_t=[(c['structure_id'],c.get('canonical_math_name',''),toks(c.get('canonical_math_name','')+' '+c.get('exact_equations_or_object',''))) for c in reg]
          out=['sid\tpath\tkind\trole\tpreview\ttop_cards']
          for sid in ids:
              s=sm[sid]; p=root/s['path']; text=''
              if p.exists() and p.is_file():
                  try:text=p.read_text(errors='ignore')[:20000]
                  except:text=''
              compact=' | '.join(x.strip() for x in text.splitlines() if x.strip())[:1800]
              tt=toks(s['path']+' '+compact); scored=[]
              for cid,name,ct in card_t:
                  inter=len(tt&ct)
                  if inter: scored.append((inter/math.sqrt(max(1,len(ct))),cid,name))
              scored=sorted(scored,reverse=True)[:8]
              top='; '.join(f'{cid}:{score:.2f}:{name}' for score,cid,name in scored)
              vals=[sid,s['path'],s.get('kind',''),s.get('evidence_role',''),compact,top]
              out.append('\t'.join(v.replace('\t',' ').replace('\n',' ') for v in vals))
          pathlib.Path('.tmp').mkdir(exist_ok=True)
          pathlib.Path('.tmp/sr-b35-summary.tsv').write_text('\n'.join(out)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp/sr-b35-summary.tsv
          git commit -m 'Temp: record batch35 source summary' || true
          git push origin HEAD:agent/sr-b35-analysis
