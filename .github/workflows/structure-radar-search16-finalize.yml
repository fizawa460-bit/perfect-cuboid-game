name: StructureRadar search16 finalize
on: pull_request
permissions: {contents: write}
jobs:
  finalize:
    if: github.head_ref == 'structure-radar-search-16-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}', fetch-depth: 0}
      - run: |
          python - <<'PY'
          import json,pathlib
          ids=[f'SR-STR-{i:03d}' for i in range(134,144)]
          ledger='docs/structure-radar/literature/SR-SEARCH-16.md'
          rp='docs/structure-radar/structure-registry.json'
          r=json.load(open(rp)); cards=[]
          for c in r['structures']:
            if c['structure_id'] in ids:
              assert c['search_status'] in {'NOT_SEARCHED','NEEDS_REFRESH'} and c['arsenal_decision']=='PENDING'
              cards.append(c); c['search_status']='SEARCHED'; c['arsenal_decision']='ACTIVE'; c['search_ledger']=ledger
          assert [c['structure_id'] for c in cards]==ids
          open(rp,'w').write(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          z=['# StructureRadar literature ledger — search batch 16','','SEARCH_TASK=SR-SEARCH-01','BATCH_ID=SR-BATCH-LITERATURE_SEARCH-16-R01','SEARCH_DATE=2026-08-19','STRUCTURES='+','.join(ids),'SEARCH_BATCH_SIZE=10','NOVELTY_BY_SEARCH_ABSENCE=false','',
          '## Primary-source literature checked',
          '- Werner Hürlimann, *Exact and Asymptotic Evaluation of the Number of Distinct Primitive Cuboids*, Journal of Integer Sequences 18 (2015), Article 15.2.5. Theorem 7 / equation (10) gives the cumulative primitive cuboid count by inner diagonal: N3(x) ~ x^2/(32G) with the displayed lower-order linear term. This is a direct external match for the ambient space-diagonal baseline in SR-STR-142, after identifying the repo radius with the inner diagonal and preserving canonical/distinct normalization.',
          '- Bonolis–Browning, *Uniform bounds for rational points on hyperelliptic fibrations* (arXiv:2007.14182): adjacent fiberwise-counting/square-sieve literature; it does not furnish the same MAIN physical wall measure or weighted high-occupancy tail required by SR-STR-135/138/140.',
          '- Dimitrov–Gao–Habegger, *Uniform bound for the number of rational points on a pencil of curves* (arXiv:1904.07268): adjacent uniform fibre bounds in a fixed pencil, not a same-measure exceptional-mass theorem for the moving Stage27 wall host.',
          '- Alpoge, *The average number of rational points on genus two curves is bounded* (arXiv:1804.05859): an average theorem for a different height-ordered genus-two family; its averaging measure is not the Stage27 MAIN physical measure.',
          '',
          '## Search outcome for the new ambient baselines',
          '- SR-STR-141: targeted search found classical primitive-Pythagorean cumulative counting as an input, but no published theorem was identified that directly states the repo exact-one-face B^2 log B law with its canonical primitive and exact-one exclusions. Retain the repo convolution/harmonic-scale proof as the exact receiver.',
          '- SR-STR-142: Hürlimann Theorem 7 is a direct external carrier for the ambient primitive integral-space-diagonal B^2/(32G) main term. The repo zero-face-dominance complement estimate remains a separate repo theorem and is not attributed to Hürlimann.',
          '- SR-STR-143: targeted search found computational/generative Euler-brick literature but no published theorem matching the repo exactly-two-face M2(B) ~ C_M2 B(log B)^5 law. Do not infer novelty from that search absence; retain the repo exact theorem as the receiver.',
          '']
          verdicts={
            'SR-STR-134':'`REPO_EXACT_MOMENT_FIREWALL` — fixed-moment reformulation is exponent-neutral unless an arithmetic moment deficit is proved in the same host.',
            'SR-STR-135':'`SAME_MEASURE_WEIGHTED_GATE_RETAINED` — adjacent averaged/fibrewise theorems use different populations or weights and do not control the T-to-MAIN physical exceptional mass.',
            'SR-STR-136':'`RECONSTRUCTION_BARRIER_RETAINED` — no external theorem licenses recharging root-line information already used to define the balanced-wall host.',
            'SR-STR-137':'`POINTWISE_QUANTIFIER_GATE_RETAINED` — subpolynomial class cardinality means class-count averaging alone yields no fixed-power saving.',
            'SR-STR-138':'`SAME_MEASURE_L2_OR_BAD_MASS_GATE_RETAINED` — closure still requires a weighted second moment or total bad physical mass bound in the complete MAIN measure.',
            'SR-STR-139':'`ELEMENTARY_MEASURE_ADAPTER_CONFIRMED` — L1/L2/tail comparisons are elementary same-measure adapters and create no arithmetic saving by themselves.',
            'SR-STR-140':'`EXTERNAL_GATE_UNDISCHARGED` — no checked source supplies fixed alpha,beta for the exact MAIN physical high-occupancy mass; prior CRT savings may not be double charged.',
            'SR-STR-141':'`REPO_EXACT_AMBIENT_BASELINE_RETAINED` — classical Pythagorean counting is only an input; no direct published match to the full exact-one-face B^2 log B theorem was identified.',
            'SR-STR-142':'`DIRECT_EXTERNAL_AMBIENT_CARRIER` — Hürlimann Theorem 7 matches the primitive ambient integral-space-diagonal quadratic main term; repo zero-face dominance remains separate.',
            'SR-STR-143':'`REPO_EXACT_AMBIENT_BASELINE_RETAINED` — no direct published match to the exactly-two-face B(log B)^5 asymptotic was identified in the targeted search.'
          }
          for c in cards:
            z += ['## '+c['structure_id']+' — '+c['canonical_math_name'],c['exact_equations_or_object'],'Potential weapon types: '+', '.join(c.get('potential_weapon_types',[]))+'.','Applicability gaps: '+'; '.join(c.get('applicability_gaps',[])),'Transfer verdict: '+verdicts[c['structure_id']],'Arsenal decision: `ACTIVE`.','']
          z += ['## Firewalls','- Search absence is not a novelty claim.','- Hürlimann is promoted only for the ambient primitive integral-space-diagonal count in SR-STR-142; it does not prove the repo zero-face complement bound or any face-conditioned transition theorem.','- SR-STR-141 and SR-STR-143 remain repo-exact asymptotic baselines unless an exact external theorem with matching primitive/canonical/exact-face population is located.','- SR-STR-134..140 retain the same-measure physical-host quantifier firewall; generic averages in other families cannot discharge the fixed-power wall deficit.','- CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT remains 1/2; no strict sub-square-root whole-family theorem is claimed.','- No perfect-cuboid existence or nonexistence claim is made.','']
          pathlib.Path(ledger).write_text('\n'.join(z))
          pp='docs/structure-radar/progress.json'; p=json.load(open(pp)); bid='SR-BATCH-LITERATURE_SEARCH-16-R01'
          assert not any(x.get('batch_id')==bid for x in p['audit_batches'])
          p['audit_batches'].append({'batch_id':bid,'task_id':'SR-SEARCH-01','status':'SUBMITTED_FOR_AUDIT','source_ids':[],'sources_reviewed':4,'structures_added':0,'structures_updated':10,'structure_carrier_sources':1,'structures_deduped':0,'searches_completed':10,'arsenal_decisions':10,'audit_required':True,'duplicate_source':0,'no_distinct_structure':0})
          open(pp,'w').write(json.dumps(p,indent=2,ensure_ascii=False)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python - <<'PY'
          import json
          q=json.load(open('docs/structure-radar/exploration-queue.json'))
          ready=next(t for t in q['tasks'] if t['status']=='READY')
          assert ready['structure_ids']==[f'SR-STR-{i:03d}' for i in range(144,154)], ready
          c=json.load(open('docs/structure-radar/controller.json'))
          assert c['registry']['unresolved_search_count']==67 and c['registry']['pending_arsenal_decision_count']==86, c['registry']
          PY
          rm .github/workflows/structure-radar-search16-finalize.yml
          git config user.name github-actions; git config user.email github-actions@github.com
          git add -A
          git commit -m 'StructureRadar: literature search batch16'
          git push
