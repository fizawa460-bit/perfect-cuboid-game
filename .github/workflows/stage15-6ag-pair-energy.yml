name: Stage15-6ag pair-energy boundary

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6ag/**'
      - 'stages/stage15/evidence/stage15_6ag_pair_energy.json'
      - 'stages/stage15/replay/verify_stage15_6ag.py'
      - 'stages/stage15/scripts/stage15_6ag_pair_energy.py'
      - '.github/workflows/stage15-6ag-pair-energy.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6ag pair-energy boundary
        run: python stages/stage15/replay/verify_stage15_6ag.py
      - name: Compile Stage15-6ag utility
        run: python -m py_compile stages/stage15/scripts/stage15_6ag_pair_energy.py stages/stage15/replay/verify_stage15_6ag.py
