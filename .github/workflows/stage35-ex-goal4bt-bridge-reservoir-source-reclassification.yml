name: Stage35-EX Goal4BT bridge reservoir source reclassification

on:
  pull_request:
    paths:
      - 'stages/stage35-ex/**'
      - '.github/workflows/stage35-ex-goal4bt-bridge-reservoir-source-reclassification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-goal4bt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head checkout
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "ACTUAL_HEAD_SHA=${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Goal4BT source-known bridge reservoir correction
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4bt_bridge_reservoir_source_reclassification.py
