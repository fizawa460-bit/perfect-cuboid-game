name: one-shot-research-os-migration

on:
  push:
    branches:
      - research-os-retire-evidence-locator
    paths:
      - .github/workflows/research-os-retire-evidence-locator-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-os-retire-evidence-locator
          fetch-depth: 0
      - name: Run corrected migration
        run: python scripts/research_os_migrate_tmp.py
