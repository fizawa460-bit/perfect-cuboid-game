name: StructureRadar registry phase analysis
on:
  push:
    branches: [agent/sr-registry-phase-analysis]
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze registry and queue eligibility
        shell: bash
        run: |
          python - <<'PY'
          import json,collections,pathlib
          r=pathlib.Path('.')
          reg=json.loads((r/'docs/structure-radar/structure-registry.json').read_text())
          prog=json.loads((r/'docs/structure-radar/progress.json').read_text())
          cards=reg['structures']
          cs=collections.Counter(c.get('card_status') for c in cards)
          ss=collections.Counter(c.get('search_status') for c in cards)
          ad=collections.Counter(c.get('arsenal_decision') for c in cards)
          combo=collections.Counter((c.get('card_status'),c.get('search_status'),c.get('arsenal_decision')) for c in cards)
          searchable=[c['structure_id'] for c in cards if c.get('card_status') in {'NORMALIZED','AUDITED'} and c.get('search_status') in {'NOT_SEARCHED','NEEDS_REFRESH'}]
          blocked=[c['structure_id'] for c in cards if c.get('search_status') in {'NOT_SEARCHED','NEEDS_REFRESH'} and c.get('card_status') not in {'NORMALIZED','AUDITED'}]
          batches=collections.Counter(b.get('status') for b in prog.get('audit_batches',[]))
          out={
            'card_count':len(cards),'card_status':dict(cs),'search_status':dict(ss),'arsenal_decision':dict(ad),
            'combo':{'|'.join(map(str,k)):v for k,v in combo.items()},
            'searchable_count':len(searchable),'searchable_first':searchable[:30],
            'blocked_search_count':len(blocked),'blocked_search_first':blocked[:50],
            'audit_batch_status':dict(batches),'audit_batch_count':len(prog.get('audit_batches',[])),
            'last_audit_batches':prog.get('audit_batches',[])[-12:]
          }
          p=r/'.tmp/sr-registry-phase-analysis.json'; p.parent.mkdir(exist_ok=True); p.write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp/sr-registry-phase-analysis.json
          git commit -m 'Temp: record StructureRadar registry phase analysis' || true
          git push origin HEAD:agent/sr-registry-phase-analysis
