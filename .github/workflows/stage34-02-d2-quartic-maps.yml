name: Stage34-02 D2 explicit quartic maps

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage34/runkeys/stage34-02-d2-quartic-maps.json'
      - 'stages/stage34/34-02/d2-quartic-map-preflight.json'
      - 'stages/stage34/34-02/run_d2_magma_quartic_maps.py'
      - 'stages/stage34/34-02/validate_d2_map_runkey.py'
      - '.github/workflows/stage34-02-d2-quartic-maps.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch event-before commit if needed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ]; then git fetch --no-tags --depth=1 origin "$BEFORE" || true; fi
      - name: Validate dedicated run key against actual commit range
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 stages/stage34/34-02/validate_d2_map_runkey.py "$BEFORE" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Report authorization
        run: echo "authorized=${{ steps.gate.outputs.authorized }} reason=${{ steps.gate.outputs.reason }}"

  d2-quartic-maps:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run exact official-Magma birational map certificates
        run: python3 stages/stage34/34-02/run_d2_magma_quartic_maps.py
      - name: Enforce artifact cap
        run: |
          test $(stat -c%s stages/stage34/34-02/d2-quartic-map-certificate.json) -le 1048576
          test $(stat -c%s stages/stage34/34-02/d2-quartic-map-stdout.txt) -le 1048576
      - name: Upload compact certificate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-02-d2-quartic-map-certificate
          path: |
            stages/stage34/34-02/d2-quartic-map-certificate.json
            stages/stage34/34-02/d2-quartic-map-stdout.txt
          if-no-files-found: warn
          retention-days: 1
