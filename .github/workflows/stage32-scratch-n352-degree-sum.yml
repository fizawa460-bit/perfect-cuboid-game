name: Stage32 scratch N352 factor degree sum identity

on:
  push:
    branches:
      - stage32-main-scratch-n352-degree-sum-20260910
    paths:
      - 'stages/stage32/scratch/n352_degree_sum_identity.py'
      - '.github/workflows/stage32-scratch-n352-degree-sum.yml'
      - 'stages/stage32/32-01-178/nodes/N345/**'
      - 'stages/stage32/residual-32-01-production/hperp_integral_adapter.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy z3-solver
      - name: Exact retained Picard degree-sum identity
        run: python3 -B stages/stage32/scratch/n352_degree_sum_identity.py
