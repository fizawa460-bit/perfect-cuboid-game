name: Stage35-EX Goal4CC post source bridge local completion fresh route audit

on:
  pull_request:
    paths:
      - 'stages/stage35-ex/35ex-35/goal4cb-source-bridge-norm-local-unit-squareclass-source-lock.md'
      - 'stages/stage35-ex/35ex-35/goal4cb-source-bridge-norm-local-unit-squareclass.json'
      - 'stages/stage35-ex/verify_stage35_ex_35_goal4cb_source_bridge_norm_local_unit_squareclass.py'
      - 'stages/stage35-ex/35ex-35/goal4cc-post-source-bridge-local-completion-fresh-route-audit-source-lock.md'
      - 'stages/stage35-ex/35ex-35/goal4cc-post-source-bridge-local-completion-fresh-route-audit.json'
      - 'stages/stage35-ex/verify_stage35_ex_35_goal4cc_post_source_bridge_local_completion_fresh_route_audit.py'
      - '.github/workflows/stage35-ex-goal4cc-post-source-bridge-local-completion-fresh-route-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-goal4cc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head checkout
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "ACTUAL_HEAD_SHA=${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay Goal4CB parent
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4cb_source_bridge_norm_local_unit_squareclass.py
      - name: Verify Goal4CC fresh-route audit
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4cc_post_source_bridge_local_completion_fresh_route_audit.py
