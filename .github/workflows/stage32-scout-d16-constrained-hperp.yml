name: Stage32 scout d16 constrained Hperp

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/scouts/d16_constrained_hperp_prepare.py'
      - 'stages/stage32/scouts/d16_constrained_hperp_enum.cpp'
      - '.github/workflows/stage32-scout-d16-constrained-hperp.yml'

permissions:
  contents: read
  actions: read

jobs:
  d16-constrained-hperp-scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact lattice preprocessing dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pari-gp g++
          gp --version
          g++ --version
      - name: Download source-locked Stage32 Picard core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/core"
          gh run download 32624596141 --repo fizawa460-bit/perfect-cuboid-game \
            --name stage32-01-low-degree-verified-prefix --dir "$RUNNER_TEMP/core"
          test -s "$RUNNER_TEMP/core/picard-core.json"
      - name: Build reduced Hperp coordinates and 140 transformed caps
        run: |
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          python stages/stage32/scouts/d16_constrained_hperp_prepare.py \
            --core "$RUNNER_TEMP/core/picard-core.json" \
            --output "$RUNNER_TEMP/work/d16-constrained-hperp.txt"
      - name: Compile integrated constrained lattice enumerator
        run: |
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic \
            stages/stage32/scouts/d16_constrained_hperp_enum.cpp \
            -o "$RUNNER_TEMP/work/d16-constrained-hperp-enum"
      - name: Enumerate with norm and all 140 caps inside the same search tree
        run: |
          "$RUNNER_TEMP/work/d16-constrained-hperp-enum" \
            --input "$RUNNER_TEMP/work/d16-constrained-hperp.txt" \
            --output "$RUNNER_TEMP/out/d16-constrained-hperp-scout.json" \
            --bounds 2,4,6,8,12,16,20,26,34 \
            --per-bound-seconds 90 \
            --node-cap 100000000 \
            --survivor-cap 5000000
      - name: Enforce regression, storage and scout firewalls
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'/'d16-constrained-hperp-scout.json'
          assert p.stat().st_size < 2_000_000
          r=json.loads(p.read_text())
          assert r['regression']['pass'] is True
          assert r['THEOREM_CREDIT'] is False
          assert r['RECEIVER_CREDIT'] is False
          assert r['FULL_D16_G0_ROW_COMPLETE'] is False
          assert r['architecture']['materialized_branch_count_constructed'] == 0
          assert r['architecture']['exact_integer_leaf_recheck'] is True
          assert r['architecture']['direction'] == 'H_PERP_COORDINATES_PLUS_140_CAPS_PLUS_NORM_IN_ONE_BRANCH_AND_BOUND'
          print('regression=', r['regression'])
          for t in r['tiers']:
              print({k:t.get(k) for k in ('bound','status','nodes','coordinate_trials','constraint_prunes','exact_leaves','exact_survivors_including_zero','nonzero_survivors','elapsed_seconds')})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-scout-d16-constrained-hperp
          path: ${{ runner.temp }}/out/d16-constrained-hperp-scout.json
          retention-days: 7
          if-no-files-found: error
