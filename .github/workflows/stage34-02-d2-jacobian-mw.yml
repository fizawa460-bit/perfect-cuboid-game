name: Stage34-02 D2 Jacobian MW certificate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage34/runkeys/stage34-02-d2-jacobian-mw.json'
      - 'stages/stage34/34-02/d2-jacobian-mw-preflight.json'
      - 'stages/stage34/34-02/run_d2_jacobian_mw_certificate.py'
      - 'stages/stage34/34-02/validate_d2_jacobian_runkey.py'
      - 'stages/stage34/34-02/d2-split-genus1-quotient-lock.json'
      - '.github/workflows/stage34-02-d2-jacobian-mw.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch event-before commit if needed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
          fi
      - name: Validate dedicated run key against actual commit range
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 stages/stage34/34-02/validate_d2_jacobian_runkey.py "$BEFORE" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Report authorization
        run: echo "authorized=${{ steps.gate.outputs.authorized }} reason=${{ steps.gate.outputs.reason }}"

  d2-jacobian-mw:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install proof-capable eclib mwrank
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends eclib-tools
          dpkg-query -W eclib-tools
      - name: Run seven common-Jacobian rank/full-basis certificates
        run: python3 stages/stage34/34-02/run_d2_jacobian_mw_certificate.py
      - name: Upload compact certificate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-02-d2-jacobian-mw-certificate
          path: |
            stages/stage34/34-02/d2-jacobian-mw-certificate.json
            stages/stage34/34-02/d2-jacobian-mw-stdout.txt
          if-no-files-found: warn
          retention-days: 1
