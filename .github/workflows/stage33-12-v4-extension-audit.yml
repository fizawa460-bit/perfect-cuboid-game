name: Stage33-12 V4 extension-space audit

on:
  push:
    branches:
      - stage33-12-j2-ptsK-qPicK-continuation
    paths:
      - stages/stage33/33-12/audit_v4_kummer_extension_space_after_j2_anchor.py
      - stages/stage33/33-12/certify_j2_kummer_source_target_module_compatibility.py
      - stages/stage33/33-12/verify_j2_kummer_source_target_module_compatibility.py
      - stages/stage33/33-12/promote_j2_kummer_binding_repair_state.py
      - stages/stage33/sync_main_state.py
      - .github/workflows/stage33-12-v4-extension-audit.yml

permissions:
  contents: write

concurrency:
  group: stage33-12-v4-extension-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          python -m py_compile stages/stage33/33-12/audit_v4_kummer_extension_space_after_j2_anchor.py
          python -m py_compile stages/stage33/33-12/certify_j2_kummer_source_target_module_compatibility.py
          python -m py_compile stages/stage33/33-12/verify_j2_kummer_source_target_module_compatibility.py
          python -m py_compile stages/stage33/33-12/promote_j2_kummer_binding_repair_state.py
          python -m py_compile stages/stage33/sync_main_state.py
      - name: Verify retained compatibility audit
        run: |
          python stages/stage33/33-12/certify_j2_kummer_source_target_module_compatibility.py --write
          python stages/stage33/33-12/verify_j2_kummer_source_target_module_compatibility.py
      - name: Promote exact binding repair state
        run: python stages/stage33/33-12/promote_j2_kummer_binding_repair_state.py
      - name: Sync compact MAIN state
        run: |
          python stages/stage33/sync_main_state.py
          python stages/stage33/sync_main_state.py --check
      - name: Reset transient handoff after promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('stages/stage33/MAIN-STATE.json')
          state=json.loads(p.read_text())
          h=state['canonical_sha256']
          Path('stages/stage33/MAIN-BATCH-HANDOFF.md').write_text(
              '# Stage33 MAIN transient handoff\n\n'
              'status: EMPTY\n'
              f'base_main_state_canonical_sha256: {h}\n\n'
              'No unpromoted delta. Start directly from `MAIN-STATE.json` current leaf.\n'
          )
          print('HANDOFF_RESET_TO_EMPTY', h)
          PY
      - name: Final exact checks
        run: |
          python stages/stage33/33-12/verify_j2_kummer_source_target_module_compatibility.py
          python stages/stage33/sync_main_state.py --check
          git diff --check
      - name: Commit repaired state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stages/stage33/controller.json \
                  stages/stage33/MAIN-STATE.json \
                  stages/stage33/MAIN-BATCH-HANDOFF.md \
                  stages/stage33/33-12/result.md \
                  stages/stage33/33-12/j2-kummer-source-target-module-compatibility-audit.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'no state diff'; exit 1; }
          git commit -m 'Stage33: revoke incompatible J2 Kummer relation'
          git push
