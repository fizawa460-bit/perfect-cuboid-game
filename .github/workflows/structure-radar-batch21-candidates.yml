name: StructureRadar batch21 candidate mapper

on:
  push:
    branches:
      - structure-radar-deep-corpus-batch-21

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rank existing cards by lexical overlap
        run: |
          python - <<'PY'
          import json,re,math
          from collections import Counter
          from pathlib import Path
          root=Path('.')
          q=json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          task=next(t for t in q['tasks'] if t['status']=='READY')
          ids=task['source_ids'][:60]
          sm={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              for s in json.loads(p.read_text())['sources']:
                  if s['source_id'] in ids: sm[s['source_id']]=s
          reg=json.loads((root/'docs/structure-radar/structure-registry.json').read_text())['structures']
          stop=set('the a an and or of to in for with on from is are be this that as by at it its stage current result true false proved proof receiver next complete physical fixed power saving theorem structure batch main route merged audit'.split())
          def toks(x):
              x=re.sub(r'([a-z0-9])([A-Z])',r'\1 \2',x)
              return [w for w in re.findall(r'[A-Za-z0-9]+',x.lower()) if len(w)>=3 and w not in stop and not w.isdigit()]
          card_tokens={}
          df=Counter()
          for c in reg:
              text=' '.join([c.get('canonical_math_name',''),c.get('exact_equations_or_object',''),' '.join(c.get('theorem_species',[])),' '.join(c.get('search_terms_primary',[])),' '.join(c.get('search_terms_aliases',[]))])
              ct=Counter(toks(text)); card_tokens[c['structure_id']]=ct
              for w in ct: df[w]+=1
          N=len(reg)
          def score(st,ct):
              common=set(st)&set(ct)
              return sum((1+math.log(st[w]))*(1+math.log(ct[w]))*math.log((N+1)/(df[w]+1)+1) for w in common)
          out=[]
          for sid in ids:
              s=sm[sid]; text=(root/s['path']).read_text(errors='replace') if (root/s['path']).exists() else ''
              st=Counter(toks(text))
              ranked=sorted(((score(st,card_tokens[c['structure_id']]),c['structure_id'],c['canonical_math_name']) for c in reg), reverse=True)[:6]
              # exact named receiver/target tokens
              named=[]
              for m in re.finditer(r'\b[A-Z][A-Za-z0-9]*(?:[A-Z][A-Za-z0-9]*){2,}\b',text):
                  v=m.group(0)
                  if len(v)>18 and v not in named: named.append(v)
                  if len(named)>=12: break
              out.append({'source_id':sid,'path':s['path'],'kind':s['kind'],'named_objects':named,'top_cards':[{'score':round(sc,2),'id':i,'name':n} for sc,i,n in ranked]})
          (root/'docs/structure-radar/.batch21-candidates.json').write_text(json.dumps({'count':len(out),'sources':out},indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/structure-radar/.batch21-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Build StructureRadar batch21 candidate map"
            git push origin HEAD:structure-radar-deep-corpus-batch-21
          fi
