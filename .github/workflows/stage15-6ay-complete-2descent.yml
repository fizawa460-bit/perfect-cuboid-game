name: Stage15-6ay complete 2-descent image

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6ay/**'
      - 'stages/stage15/evidence/stage15_6ay_complete_2descent.json'
      - 'stages/stage15/replay/verify_stage15_6ay.py'
      - 'stages/stage15/scripts/stage15_6ay_complete_2descent.py'
      - '.github/workflows/stage15-6ay-complete-2descent.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6ay complete 2-descent image
        run: python stages/stage15/replay/verify_stage15_6ay.py
      - name: Compile Stage15-6ay utility
        run: python -m py_compile stages/stage15/scripts/stage15_6ay_complete_2descent.py stages/stage15/replay/verify_stage15_6ay.py
