name: Stage32 BRIDGE BR103 C3 leaf replay

# Branch-local leaf verification only. No MAIN/pruning credit.
on:
  push:
    branches:
      - stage32bridge-mainbatch
    paths:
      - stages/stage32/generalization-bridge/verify_br103_c3_picard64_fixed_pairing_projection.py
      - .github/workflows/stage32bridge-c3-leaf-replay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32bridge-c3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install exact arithmetic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Replay BR103 C3 Picard64 fixed-pairing projection
        run: python stages/stage32/generalization-bridge/verify_br103_c3_picard64_fixed_pairing_projection.py | tee br103-c3-result.json
      - name: Upload compact replay result
        uses: actions/upload-artifact@v4
        with:
          name: stage32bridge-br103-c3-result
          path: br103-c3-result.json
          if-no-files-found: error
          retention-days: 7
