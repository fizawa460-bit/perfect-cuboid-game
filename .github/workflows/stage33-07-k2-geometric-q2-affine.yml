name: Stage33-07 k2 geometric exact Q2 affine compression

# Manual-only: pull_request.paths is evaluated against the whole PR diff and
# caused this completed heavy leaf to replay on every Stage33-07 commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-q2-affine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact Q4-rank prerequisite
        run: python stages/stage33/33-07/certify_nonelementary_target_q4_rank_obstruction.py
      - name: Exact pure-geometric Q2 profile and affine compression
        run: python stages/stage33/33-07/certify_nonelementary_k2_geometric_q2_affine.py
      - name: Upload exact certificate
        uses: actions/upload-artifact@v4
        with:
          name: stage33-07-k2-geometric-q2-affine
          path: stages/stage33/33-07/nonelementary-k2-geometric-q2-affine.json
          if-no-files-found: error
