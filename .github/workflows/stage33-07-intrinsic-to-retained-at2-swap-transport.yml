name: Stage33-07 intrinsic to retained A2 swap transport

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage33/33-07/certify_two_coordinate_swap_picard_rows.py'
      - 'stages/stage33/33-07/certify_actual_coordinate_swap_at2_actions.py'
      - 'stages/stage33/33-07/certify_intrinsic_to_retained_at2_swap_transport.py'
      - 'stages/stage33/33-07/certify_retained_geometric_sign_intertwiner_space.py'
      - 'stages/stage33/33-07/retained-q256-geometric-sign-endpoint.json'
      - 'stages/stage33/33-07/retained-q256-geometric-sign-quadratic.json'
      - 'stages/stage33/33-07/materialize_order2_localization_receiver.py'
      - '.github/workflows/stage33-07-intrinsic-to-retained-at2-swap-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stages/stage33/33-07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact finite algebra dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'sympy==1.14.0' 'z3-solver==4.15.3.0'
      - name: Reproduce exact finite localization receiver
        run: python materialize_order2_localization_receiver.py
      - name: Transport actual intrinsic swaps to retained receiver basis
        run: python certify_intrinsic_to_retained_at2_swap_transport.py
      - name: Enforce exact transport and firewalls
        run: |
          python - <<'PY'
          import hashlib,json
          p='intrinsic-to-retained-at2-swap-transport.json';x=json.load(open(p));h=x.pop('canonical_sha256')
          assert h==hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert x['schema']=='STAGE33_07_INTRINSIC_TO_RETAINED_AT2_SWAP_TRANSPORT_V1'
          t=x['transport'];assert t['seven_named_sign_actions_intertwined'] and t['quadratic_form_isometry']
          a=x['actual_swaps_in_retained_at2_basis'];assert len(a['swap12_action_14x14'])==14 and len(a['swap13_action_14x14'])==14 and a['both_commute_with_retained_cc_ct'] and a['s3_relations_exact']
          e=x['exact_consequence'];assert e['actual_geometric_swap_pair_materialized_in_retained_at2_basis']
          assert e['connecting_matrix_columns_explicitly_materialized']==0 and not e['middle_gersten_module_action_materialized'] and not e['absolute_delta_loc_computed'] and not e['arithmetic_hs_closed']
          ex=x['execution'];assert ex['z3_exact_boolean_solver_used'] and not ex['remote_cas_used'] and not ex['smith_recomputation_used']
          assert x['stage33_progress']=='6/11' and not x['stage33_08_released'] and not x['theorem_credit'] and not x['endpoint_credit']
          print('STAGE33_07_INTRINSIC_TO_RETAINED_AT2_SWAP_TRANSPORT=PASS_EXACT')
          print('ACTUAL_PAIR_UNIQUE='+str(a['pair_unique_over_all_exact_sign_quadratic_transports']).lower())
          print('CERTIFICATE_SHA256='+h)
          print('NEXT='+x['next_exact_leaf'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-intrinsic-to-retained-at2-swap-transport
          retention-days: 7
          if-no-files-found: error
          path: stages/stage33/33-07/intrinsic-to-retained-at2-swap-transport.json
