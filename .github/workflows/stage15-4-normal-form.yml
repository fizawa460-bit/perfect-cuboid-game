name: Stage15-4 exact normal form

on:
  pull_request:
    paths:
      - 'stages/stage15/15-4/**'
      - 'stages/stage15/evidence/stage15_4_normal_form.json'
      - 'stages/stage15/replay/verify_stage15_4.py'
      - 'stages/stage15/scripts/stage15_4_normal_form.py'
      - '.github/workflows/stage15-4-normal-form.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-4 exact normal form
        run: python stages/stage15/replay/verify_stage15_4.py
