            'Near-neighbor cards inspected: `S30-W01`, `S30-W02`, `S30-WF02`, `S30-WF03`, `S31-W01`, `S34-W01`, `S34-W02`, `S34-W03`, `S34-WF01`, `S33-PW09`, `S35-PW01`, `S35-PW03`, `S35-PW04`, `S35-PW05`.','',
            '## Harvest 1 classification','',f'- Total candidates: **{len(C)}**',f'- A probable NEW_WEAPON: **{counts["A"]}**',f'- B probable EXTEND_EXISTING: **{counts["B"]}**',f'- C probable NEW_WORKFLOW: **{counts["C"]}**',f'- D STAGE36_SPECIFIC: **{counts["D"]}**',f'- E HISTORICAL_OR_NEGATIVE: **{counts["E"]}**',f'- F unresolved: **{counts["F"]}**','']
          for letter,title in [('A','A. probable NEW_WEAPON'),('B','B. probable EXTEND_EXISTING'),('C','C. probable NEW_WORKFLOW'),('D','D. STAGE36_SPECIFIC'),('E','E. HISTORICAL_OR_NEGATIVE'),('F','F. unresolved')]:
            lines += [f'## {title}','']
            for r in C:
              if r['harvest1_classification'][0]==letter:
                lines.append(f"- `{r['temporary_candidate_id']}` — **{r['proposed_role_name']}** ({r['source_cluster']}). Output: {r['reusable_output']} Nearest: {', '.join(r['nearest_existing_arsenal_card'])}.")
            lines.append('')
          lines += ['## Strongest Harvest 2 abstraction targets','']
          for x in strongest:
            r=byid[x]; lines.append(f"- `{x}` — **{r['proposed_role_name']}**: {r['reusable_input']} -> {r['reusable_output']}")
          lines += ['','Key hostile-dedup warnings:','',
            '- `DISC-S36-A03` must be compared semantically with Stage35 `S35-PW04`; the shared word “reciprocal” is not enough either to merge or separate them.','- `DISC-S36-B09` is already an exact `S31-W01` type match and should not become a new weapon merely because Stage36 has new coefficients.','- `DISC-S36-B14` is a dynamic six-reservoir local character matrix, not Stage35 `S35-PW05` finite exceptional-prime classification.','- `DISC-S36-F01` remains unresolved because hostile audit found a verifier-coverage defect even though the mathematics recheck passed; later user-pass repair is not hostile re-audit credit.','',
            '## Negative-result firewall','',
            'The E-records are anti-loop/history assets. In particular: moving specialization support blocks fixed-S descent; parameter-only Hilbert product formula is not a receiver obstruction; locally admissible Kummer classes block pure-local uniform closure; explicit rank-jump witnesses prove the rank-jump locus is nonempty but do not imply receiver existence; known witnesses failing the receiver do not prove receiver-fiber emptiness.','',
            '## Harvest 2 exact handoff','',f'1. Keep lower `{LOWER}` and upper `{UPPER}` fixed.','2. Do not include #1670 / 36-09AB or later main movement.','3. Abstract only the 36 records in `stage36-initial-discovery.json`; strip Stage36 coefficients/payload and write exact reusable `input -> operation -> output` contracts.','4. Hostile-compare the priority overlap pairs listed in the JSON handoff; Stage34 and Stage35 overlap must be treated strictly.','5. Keep `DISC-S36-F01` audit-maturity unresolved until the repaired verifier is hostile re-audited or otherwise receives equivalent authority.','6. Do not assign stable IDs or modify Arsenal registry/cards/catalog in Harvest 2.','',
            '## Provenance notes','',
            '- Canonical inception basis: PR #1535 first authoritative Stage36 merge, not an older working branch/SOURCE_HEAD.','- Upper bound basis: `main` exactly at Harvest-start observation.','- U-AA source candidates use PR #1664 hostile-audited batch head `25229e7b0dfbbc5524266ce49e8edaf217841701`; their mutable promotion remains outside the frozen upper-state authority.','- Candidate-level source PR/head/path/blob, certificate blob, verifier/source-lock, audit status, field, quantifiers, exceptions and credit boundaries are in the JSON companion.','']
          Path('docs/arsenal/stage36-initial-discovery.md').write_text('\n'.join(lines)+'\n')
          PY
          git diff --check
      - name: Replace temporary indexes with final artifacts and commit
