name: Stage12-N1-2l de la Breteche hypothesis audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage12-n1-2l-dlb-hypotheses
    paths:
      - "scripts/audit_dlb_hypotheses_stage12_n1_2l.py"
      - "data/dlb_hypotheses_stage12_n1_2l_report.json"
      - "docs/stage12-n1-2l-dlb-hypotheses.md"
      - ".github/workflows/stage12-n1-2l-dlb-hypotheses.yml"
  pull_request:
    paths:
      - "scripts/audit_dlb_hypotheses_stage12_n1_2l.py"
      - "data/dlb_hypotheses_stage12_n1_2l_report.json"
      - "docs/stage12-n1-2l-dlb-hypotheses.md"
      - ".github/workflows/stage12-n1-2l-dlb-hypotheses.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run hypothesis audit
        run: |
          python -m py_compile scripts/audit_dlb_hypotheses_stage12_n1_2l.py
          python scripts/audit_dlb_hypotheses_stage12_n1_2l.py --write-report /tmp/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('data/dlb_hypotheses_stage12_n1_2l_report.json').read_text())
          generated = json.loads(Path('/tmp/report.json').read_text())
          if expected != generated:
              raise SystemExit('generated JSON structure differs from committed report')
          print('verified deterministic JSON structure')
          PY
