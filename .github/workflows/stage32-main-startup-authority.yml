name: Stage32 MAIN startup authority
# Trigger lifecycle: ACTIVE_AUTO — Stage32 startup/authority/coordination safety gate
# Current boundary: V41 synchronizes hostile-audit PASS for the exact V40 HPADJ20 numerical replacement; later MAIN-native preflights remain zero-credit until separately audited/promoted.
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/stage32-main-startup-authority.yml'
      - 'stages/stage32/**'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage32-main-startup-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Checkout hostile-audited V40 boundary
        uses: actions/checkout@v4
        with:
          ref: dc4dfdf7bea41116aa63d69a5bbd17fa053e741c
          path: .stage32-v40
          fetch-depth: 1

      - name: Assert fixed V40 boundary
        run: |
          test "$(git -C .stage32-v40 rev-parse HEAD)" = "dc4dfdf7bea41116aa63d69a5bbd17fa053e741c"
          test "$(git -C .stage32-v40 hash-object stages/stage32/MAIN-STATE.json)" = "a22cb78a4b8a495f1abb93b20d4a8048dbd98df4"
          test "$(git -C .stage32-v40 hash-object stages/stage32/verify_main_startup.py)" = "adc9c0ba91547504bea1a2121af595a94581bcbd"
          test "$(git -C .stage32-v40 hash-object stages/stage32/verify_main_startup_authority_v40_hpadj20_full178_bound_consumed.py)" = "b519b1d5df79ebc784337ac72cee4494fdc9d003"
          test "$(git -C .stage32-v40 hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V40-HPADJ20-FULL178-MAIN-BOUND-REPLACEMENT.json)" = "f9d984f64d2c428481e082be622848e33407baf1"
          test "$(git -C .stage32-v40 hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v40_hpadj20_full178_main_bound_replacement.py)" = "dd3073cd83ab8079d1fa16dd506e453a2d632ff7"

      - name: Checkout HPADJ21 source boundary
        uses: actions/checkout@v4
        with:
          ref: 3d4b9e190aa6d9feba596e60c8a6cecfa325b5d0
          path: .stage32-hpadj21
          fetch-depth: 1

      - name: Assert fixed HPADJ21 source boundary
        run: test "$(git -C .stage32-hpadj21 rev-parse HEAD)" = "3d4b9e190aa6d9feba596e60c8a6cecfa325b5d0"

      - name: Resolve research-head and merge-ready freshness separately
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"
          test -n "$merge_base"
          if git merge-base --is-ancestor "$current_main" HEAD && [ "$merge_base" = "$current_main" ]; then
            echo "merge_ready_freshness=CLEAR_CURRENT_MAIN_INTEGRATED"
          else
            echo "merge_ready_freshness=PENDING_MAIN_DRIFT_REQUIRES_SEPARATE_SEMANTIC_REVIEW"
          fi

      - name: Verify V41 retained source identities
        run: |
          test "$(git hash-object stages/stage32/MAIN-STATE.json)" = "c21ac0bfa1d91b6998499e67848dfaf28de85b49"
          test "$(git hash-object stages/stage32/verify_main_startup.py)" = "f1cf731589fcf3c2c904960b796393666fd9ed78"
          test "$(git hash-object stages/stage32/verify_main_startup_authority_v41_hpadj20_full178_audit_synced.py)" = "302b1819fe3e7e8f6330fb9d02d28ada0acfbbc6"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V41-HPADJ20-FULL178-AUDIT-SYNC.json)" = "ee6639e2b4a4ad5dd48e964d6a6b055f551e7bd1"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v41_hpadj20_full178_audit_sync.py)" = "65f058cc0c9db23ad2d0ce0cefc30af94bdf55a1"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/HPADJ21-KNOWN-STRICT-SUBSET-MAIN-PREFLIGHT.json)" = "c3949f06501debcd062dca2d8fc3962f725e337e"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_known_strict_subset_main_preflight.py)" = "e1d21297b2c9cb43df595d319c8b41db82375848"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_structural_refinement.py)" = "d786a2acdddec79ce1f072476a1da28df35b6dd2"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_event_compiled_capacity_preflight.py)" = "eda1baab64ffeaf41f03dbf810c2b24beb31bced"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_known_strict_independent_replay.py)" = "c335eb8c1e3394055c25c344227d712c21588eff"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/HPADJ21-KNOWN-STRICT-PROMOTION-PACKET.json)" = "4ab6264fa2b3f4fa742342d6883bf9440b1b3220"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_known_strict_promotion_packet.py)" = "ece37dba513bc665cd1908556d699b3f09810578"
          test "$(git hash-object stages/stage32/proof/verify_cross_lane_demands.py)" = "67c7137ea6c753e3728e93c9145c570f7e9a27c8"
          test "$(git hash-object stages/stage32/proof/CROSS-LANE-DEMANDS.json)" = "68a02f31431ad658b42ad695f9553c67fd6cff01"
          test "$(git hash-object stages/stage32/proof/CLAIM-REGISTRY.json)" = "f3a884adc1c82aace81cb73d049ff14720ace862"
          test "$(git hash-object stages/stage32/proof/ACTIVE-FRONTIER.json)" = "4c251be4aa5c355481fe3bcfc71c292fb6389ba4"
          test "$(git hash-object stages/stage32/proof/LANE-ADAPTERS.json)" = "c0ef34e5838e27046a20fed77063593009c56f40"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'

      - name: Replay exact hostile-audited V40 authority projection
        run: python .stage32-v40/stages/stage32/verify_main_startup.py

      - name: Verify V41 audit synchronization against exact V40 source
        run: python stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v41_hpadj20_full178_audit_sync.py --v40-root .stage32-v40

      - name: Verify HPADJ21 structural refinement theorem
        run: python stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_structural_refinement.py

      - name: Verify HPADJ21 known-strict subset MAIN preflight
        run: python stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_known_strict_subset_main_preflight.py

      - name: Verify HPADJ21 event-compiled capacity preflight
        run: python stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_event_compiled_capacity_preflight.py --source-root .stage32-hpadj21

      - name: Independently replay HPADJ21 known-strict measurements
        run: python stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_known_strict_independent_replay.py --source-root .stage32-hpadj21

      - name: Verify HPADJ21 promotion packet audit surface
        run: python stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_known_strict_promotion_packet.py --source-root .stage32-hpadj21

      - name: Verify Stage32 MAIN startup projection
        run: python stages/stage32/verify_main_startup.py

      - name: Verify Stage32 cross-lane coordination
        run: python stages/stage32/proof/verify_cross_lane_demands.py

      - name: Verify Stage32 final-chain 32-02 retained checks
        run: |
          python stages/stage32/final-chain/32-02-effectivity/verify_surface_invariant_source_lock.py
          python stages/stage32/final-chain/32-02-effectivity/verify_rr_effectivity_sufficient.py
          python stages/stage32/final-chain/32-02-effectivity/verify_rr_norm_quantization.py

      - name: Verify Stage32 claim DAG and active frontier
        run: |
          python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python stages/stage32/proof/verify_stage32_active_frontier.py

      - name: Enforce V41 process-sync and zero-credit preflight scope
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          printf '%s\n' "$changed"
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              .github/workflows/stage32-main-startup-authority.yml|docs/research-os/policies/heavy-checkpoint-and-resume.md|stages/stage32/MAIN-STATE.json|stages/stage32/verify_main_startup.py|stages/stage32/verify_main_startup_authority_v41_hpadj20_full178_audit_synced.py|stages/stage32/proof/verify_cross_lane_demands.py|stages/stage32/management/grf04-quadratic-capacity/GRF04-V41-HPADJ20-FULL178-AUDIT-SYNC.json|stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v41_hpadj20_full178_audit_sync.py|stages/stage32/management/grf04-quadratic-capacity/HPADJ21-KNOWN-STRICT-SUBSET-MAIN-PREFLIGHT.json|stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_known_strict_subset_main_preflight.py|stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_structural_refinement.py|stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_event_compiled_capacity_preflight.py|stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_known_strict_independent_replay.py|stages/stage32/management/grf04-quadratic-capacity/HPADJ21-KNOWN-STRICT-PROMOTION-PACKET.json|stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_known_strict_promotion_packet.py) ;;
              *) echo "unexpected V41/preflight path: $p"; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=-blank-at-eof diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
