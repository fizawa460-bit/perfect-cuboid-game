name: Stage32 MAIN startup authority
# Trigger lifecycle: ACTIVE_AUTO — Stage32 startup/authority/coordination safety gate
# Current boundary: V42 consumes hostile-audited EX5 HPADJ21 FULL178 as a same-population non-additive numerical replacement; replacement head awaits hostile reaudit.
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/stage32-main-startup-authority.yml'
      - 'stages/stage32/**'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-main-startup-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Checkout hostile-audited V40 boundary
        uses: actions/checkout@v4
        with:
          ref: dc4dfdf7bea41116aa63d69a5bbd17fa053e741c
          path: .stage32-v40
          fetch-depth: 1

      - name: Checkout exact V41 MAIN predecessor
        uses: actions/checkout@v4
        with:
          ref: cbe4a7c2f45710ccd2b0c6da70fc89b9dc11c80e
          path: .stage32-v41-predecessor
          fetch-depth: 1

      - name: Checkout merged V41 MAIN target
        uses: actions/checkout@v4
        with:
          ref: 37bb811b95399d73cc46fe899badcfa8eb5fca7d
          path: .stage32-v41-main
          fetch-depth: 1

      - name: Checkout hostile-audited EX5 HPADJ21 producer
        uses: actions/checkout@v4
        with:
          ref: 265fbef0a67014494fcf773af6c3a9f1b095ef95
          path: .stage32-ex5-hpadj21-audited
          fetch-depth: 1

      - name: Checkout EX5 HPADJ21 post-audit MAIN handoff
        uses: actions/checkout@v4
        with:
          ref: 33f63a4c0bb3dde9d56efd895f4e8eb19d9217e2
          path: .stage32-ex5-hpadj21-handoff
          fetch-depth: 1

      - name: Assert fixed source boundaries
        run: |
          set -euo pipefail
          test "$(git -C .stage32-v40 rev-parse HEAD)" = "dc4dfdf7bea41116aa63d69a5bbd17fa053e741c"
          test "$(git -C .stage32-v41-predecessor rev-parse HEAD)" = "cbe4a7c2f45710ccd2b0c6da70fc89b9dc11c80e"
          test "$(git -C .stage32-v41-main rev-parse HEAD)" = "37bb811b95399d73cc46fe899badcfa8eb5fca7d"
          test "$(git -C .stage32-ex5-hpadj21-audited rev-parse HEAD)" = "265fbef0a67014494fcf773af6c3a9f1b095ef95"
          test "$(git -C .stage32-ex5-hpadj21-handoff rev-parse HEAD)" = "33f63a4c0bb3dde9d56efd895f4e8eb19d9217e2"
          test "$(git -C .stage32-v41-predecessor hash-object stages/stage32/MAIN-STATE.json)" = "c21ac0bfa1d91b6998499e67848dfaf28de85b49"
          test "$(git -C .stage32-v41-main hash-object stages/stage32/MAIN-STATE.json)" = "dd7dba27eb062e6a6ad4d440094ba26c290900d7"
          test "$(git -C .stage32-ex5-hpadj21-handoff hash-object stages/stage32-ex5/hpadj-21_ex5/MAIN-HANDOFF.json)" = "c0a27ff6fdc78fba8e530d340bf4774be1f5341f"
          test "$(git -C .stage32-ex5-hpadj21-handoff hash-object stages/stage32-ex5/hpadj-21_ex5/verify_main_handoff.py)" = "81023950899a7576f2b9313c738a1697219f764c"

      - name: Resolve exact current-main freshness
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"
          test "$current_main" = "37bb811b95399d73cc46fe899badcfa8eb5fca7d"
          test "$merge_base" = "$current_main"
          git merge-base --is-ancestor "$current_main" HEAD

      - name: Verify V42 retained source identities
        run: |
          set -euo pipefail
          test "$(git hash-object stages/stage32/MAIN-STATE.json)" = "07d71175268085fd608443bdfef0c126ed4894c3"
          test "$(git hash-object stages/stage32/verify_main_startup.py)" = "7f2d8f1c84db40a33afaea43326a38395491715c"
          test "$(git hash-object stages/stage32/verify_main_startup_authority_v42_hpadj21_full178_bound_consumed.py)" = "52940cf924cc239584a7d1cb39b55fdc9c9d9289"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V42-HPADJ21-FULL178-MAIN-BOUND-REPLACEMENT.json)" = "3072d84981eaec239ba55a5e5e25a3481d37406b"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v42_hpadj21_full178_main_bound_replacement.py)" = "e7c88c208739ebe30b5f21a4c5b8be625442c02d"
          test "$(git hash-object stages/stage32/proof/verify_cross_lane_demands.py)" = "4c4aac1f8feb595af9ea40554121b8c8d7dfc98a"
          test "$(git hash-object stages/stage32/proof/CROSS-LANE-DEMANDS.json)" = "68a02f31431ad658b42ad695f9553c67fd6cff01"
          test "$(git hash-object stages/stage32/proof/CLAIM-REGISTRY.json)" = "f3a884adc1c82aace81cb73d049ff14720ace862"
          test "$(git hash-object stages/stage32/proof/ACTIVE-FRONTIER.json)" = "4c251be4aa5c355481fe3bcfc71c292fb6389ba4"
          test "$(git hash-object stages/stage32/proof/LANE-ADAPTERS.json)" = "c0ef34e5838e27046a20fed77063593009c56f40"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V41-HPADJ20-FULL178-AUDIT-SYNC.json)" = "ee6639e2b4a4ad5dd48e964d6a6b055f551e7bd1"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'

      - name: Replay exact V41 predecessor projection
        run: python .stage32-v41-predecessor/stages/stage32/verify_main_startup.py

      - name: Reverify V41 audit synchronization against exact V40 source
        run: python .stage32-v41-predecessor/stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v41_hpadj20_full178_audit_sync.py --v40-root .stage32-v40

      - name: Verify hostile-audited EX5 HPADJ21 MAIN handoff against merged V41 target
        run: python .stage32-ex5-hpadj21-handoff/stages/stage32-ex5/hpadj-21_ex5/verify_main_handoff.py --main-root .stage32-v41-main

      - name: Verify V42 HPADJ21 replacement with exact EX5 sources
        run: python stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v42_hpadj21_full178_main_bound_replacement.py --ex5-handoff-root .stage32-ex5-hpadj21-handoff --ex5-audited-root .stage32-ex5-hpadj21-audited

      - name: Verify Stage32 MAIN startup projection
        run: python stages/stage32/verify_main_startup.py

      - name: Verify Stage32 cross-lane coordination
        run: python stages/stage32/proof/verify_cross_lane_demands.py

      - name: Verify Stage32 final-chain 32-02 retained checks
        run: |
          python stages/stage32/final-chain/32-02-effectivity/verify_surface_invariant_source_lock.py
          python stages/stage32/final-chain/32-02-effectivity/verify_rr_effectivity_sufficient.py
          python stages/stage32/final-chain/32-02-effectivity/verify_rr_norm_quantization.py

      - name: Verify Stage32 claim DAG and active frontier
        run: |
          python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python stages/stage32/proof/verify_stage32_active_frontier.py

      - name: Enforce V42 replacement scope
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          printf '%s\n' "$changed"
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              .github/workflows/stage32-main-startup-authority.yml|docs/research-os/policies/heavy-checkpoint-and-resume.md|stages/stage32/MAIN-STATE.json|stages/stage32/verify_main_startup.py|stages/stage32/verify_main_startup_authority_v42_hpadj21_full178_bound_consumed.py|stages/stage32/proof/verify_cross_lane_demands.py|stages/stage32/management/grf04-quadratic-capacity/GRF04-V41-HPADJ20-FULL178-AUDIT-SYNC.json|stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v41_hpadj20_full178_audit_sync.py|stages/stage32/management/grf04-quadratic-capacity/HPADJ21-KNOWN-STRICT-SUBSET-MAIN-PREFLIGHT.json|stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_known_strict_subset_main_preflight.py|stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_structural_refinement.py|stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_event_compiled_capacity_preflight.py|stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_known_strict_independent_replay.py|stages/stage32/management/grf04-quadratic-capacity/HPADJ21-KNOWN-STRICT-PROMOTION-PACKET.json|stages/stage32/management/grf04-quadratic-capacity/verify_hpadj21_known_strict_promotion_packet.py|stages/stage32/management/grf04-quadratic-capacity/GRF04-V42-HPADJ21-FULL178-MAIN-BOUND-REPLACEMENT.json|stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v42_hpadj21_full178_main_bound_replacement.py) ;;
              *) echo "unexpected V42 replacement path: $p"; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=-blank-at-eof diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
