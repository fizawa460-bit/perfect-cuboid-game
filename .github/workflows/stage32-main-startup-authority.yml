name: Stage32 MAIN startup authority
# Trigger lifecycle: ACTIVE_AUTO — Stage32 startup/authority/coordination safety gate
# Current boundary: V39 synchronizes hostile-audit PASS for the V38 TD02 FULL178 integer-lattice numerical replacement; zero new pruning and FULL178 route resumed.
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/stage32-main-startup-authority.yml'
      - 'stages/stage32/**'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage32-main-startup-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  startup-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Checkout V34 process predecessor
        uses: actions/checkout@v4
        with:
          ref: 8ec716abbaebbdf91d8452f19145a66c310bd222
          path: .stage32-v34
          fetch-depth: 1
      - name: Checkout hostile-audited TD01 envelope
        uses: actions/checkout@v4
        with:
          ref: 54945927416a94a67533c7b06c59c5a24e50c4f1
          path: .stage32-audited-td01
          fetch-depth: 1
      - name: Checkout hostile-audited MAIN GRF04 symbolic kernel
        uses: actions/checkout@v4
        with:
          ref: d534e107bfcf68ab1d687366afd3671a152f6e2b
          path: .stage32-audited-grf04
          fetch-depth: 1
      - name: Checkout hostile-audited HPADJ08 domain source
        uses: actions/checkout@v4
        with:
          ref: 36eab50192cf80ec5ed48aba40f4a56076759fea
          path: .stage32-audited-hpadj08
          fetch-depth: 1
      - name: Checkout exact 178 TD02 formula source
        uses: actions/checkout@v4
        with:
          ref: f305d4f270a708051c9a2b3b04f7ab25f6cdfdbe
          path: .stage32-td02-source
          fetch-depth: 1
      - name: Checkout hostile-audited 178 bounded integer-lattice boundary
        uses: actions/checkout@v4
        with:
          ref: 23e53bfd145b722640481e34458fb689326e486a
          path: .stage32-audited-intlat-bounded
          fetch-depth: 1
      - name: Checkout hostile-audited 178 FULL178 boundary
        uses: actions/checkout@v4
        with:
          ref: 640195f158e2fa953ebd669820a794a56cef04fb
          path: .stage32-audited-intlat-full178
          fetch-depth: 1
      - name: Checkout V37-synchronized 178 handoff
        uses: actions/checkout@v4
        with:
          ref: df3b29d20ef0f7da1e34fa92beada6418ad3a4ea
          path: .stage32-178-handoff
          fetch-depth: 1
      - name: Checkout hostile-audited V38 replacement boundary
        uses: actions/checkout@v4
        with:
          ref: 2d675a9a89ddd15531f0ab0f891c1c9398f94779
          path: .stage32-v38
          fetch-depth: 1

      - name: Assert fixed historical source heads
        run: |
          test "$(git -C .stage32-v34 rev-parse HEAD)" = "8ec716abbaebbdf91d8452f19145a66c310bd222"
          test "$(git -C .stage32-audited-td01 rev-parse HEAD)" = "54945927416a94a67533c7b06c59c5a24e50c4f1"
          test "$(git -C .stage32-audited-grf04 rev-parse HEAD)" = "d534e107bfcf68ab1d687366afd3671a152f6e2b"
          test "$(git -C .stage32-audited-hpadj08 rev-parse HEAD)" = "36eab50192cf80ec5ed48aba40f4a56076759fea"
          test "$(git -C .stage32-td02-source rev-parse HEAD)" = "f305d4f270a708051c9a2b3b04f7ab25f6cdfdbe"
          test "$(git -C .stage32-audited-intlat-bounded rev-parse HEAD)" = "23e53bfd145b722640481e34458fb689326e486a"
          test "$(git -C .stage32-audited-intlat-full178 rev-parse HEAD)" = "640195f158e2fa953ebd669820a794a56cef04fb"
          test "$(git -C .stage32-178-handoff rev-parse HEAD)" = "df3b29d20ef0f7da1e34fa92beada6418ad3a4ea"
          test "$(git -C .stage32-v38 rev-parse HEAD)" = "2d675a9a89ddd15531f0ab0f891c1c9398f94779"

      - name: Resolve research-head and merge-ready freshness separately
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"
          test -n "$merge_base"
          if git merge-base --is-ancestor "$current_main" HEAD && [ "$merge_base" = "$current_main" ]; then
            echo "merge_ready_freshness=CLEAR_CURRENT_MAIN_INTEGRATED"
          else
            echo "merge_ready_freshness=PENDING_MAIN_DRIFT_REQUIRES_SEPARATE_SEMANTIC_REVIEW"
          fi

      - name: Verify retained authority source identities
        run: |
          # MAIN-STATE.json is mutable operational state. Current-state integrity is
          # canonical+semantic; historical V38 is exact-head/blob locked below.
          test "$(git hash-object stages/stage32/verify_main_startup.py)" = "5da5bfe704f4eb28ea130e41092645e888925983"
          test "$(git hash-object stages/stage32/verify_main_startup_authority_v39_full178_integer_lattice_audit_synced.py)" = "989b05352b93da0a7095bf2d25b533d059a49f53"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V39-TD02-FULL178-INTEGER-LATTICE-AUDIT-SYNC.json)" = "1524215fd43e22c3e3cc31f98c5f912754b7b487"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v39_td02_full178_integer_lattice_audit_sync.py)" = "0b23919222d011665c76ee12622ba348d0d126b9"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-MAIN-BC-QT-INTEGER-PROJECTION-PREFLIGHT.json)" = "45e1f112a8df9e34087a161a219c82323bbc4635"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_main_bc_qt_integer_projection_preflight.py)" = "5a7d69c44665a8625f66204648c08dafe139a76a"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/HPADJ20-FULL-QA-HISTOGRAM-MAIN-PARALLEL-PREFLIGHT.json)" = "0eb5672dea0712cbf5044d5376e60fe233e767c3"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_hpadj20_full_qa_histogram_main_parallel_preflight.py)" = "ef20539f03f68eec8d64fb1d6d3c05f4ac363152"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V38-TD02-FULL178-INTEGER-LATTICE-MAIN-BOUND-REPLACEMENT.json)" = "f959b922129354f58c2fd0e1b182d723bfa174e2"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v38_td02_full178_integer_lattice_main_bound_replacement.py)" = "db25e786156906c1d2c51c39771e83329261ab32"
          test "$(git -C .stage32-v38 hash-object stages/stage32/MAIN-STATE.json)" = "d965cb5c5e1d17e56acbbf5d5fede2569f217a91"
          test "$(git -C .stage32-v38 hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V38-TD02-FULL178-INTEGER-LATTICE-MAIN-BOUND-REPLACEMENT.json)" = "f959b922129354f58c2fd0e1b182d723bfa174e2"
          test "$(git -C .stage32-v38 hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v38_td02_full178_integer_lattice_main_bound_replacement.py)" = "db25e786156906c1d2c51c39771e83329261ab32"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V37-FULL178-INTEGER-LATTICE-ROUTING.json)" = "5e46668259fd6b162c7da43ee4dc21ede81ea158"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V36-Q-QUADRATIC-AUDIT-SYNC.json)" = "c5418f9ed2813f0a38b2342fd31e4f3ce23a017a"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V35-Q-QUADRATIC-MAIN-BOUND-REPLACEMENT.json)" = "b24731409f33a8e76d3924ee2f651fbfba86b044"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-MAIN-INDEPENDENT-QUADRATIC-CAPACITY-LP-CANDIDATE.json)" = "1d669114e930951b9d5f9f82a6abb2b59cd43884"
          test "$(git hash-object stages/stage32/proof/verify_cross_lane_demands.py)" = "eb63f82eaf65645f18f8c2cea760eafd942a4f9a"
          test "$(git hash-object stages/stage32/proof/CROSS-LANE-DEMANDS.json)" = "68a02f31431ad658b42ad695f9553c67fd6cff01"
          test "$(git hash-object stages/stage32/proof/CLAIM-REGISTRY.json)" = "f3a884adc1c82aace81cb73d049ff14720ace862"
          test "$(git hash-object stages/stage32/proof/ACTIVE-FRONTIER.json)" = "4c251be4aa5c355481fe3bcfc71c292fb6389ba4"
          test "$(git hash-object stages/stage32/proof/LANE-ADAPTERS.json)" = "c0ef34e5838e27046a20fed77063593009c56f40"
          test "$(git -C .stage32-v34 hash-object stages/stage32/MAIN-STATE.json)" = "ec0243cb998c5c58340100d8151559516c474193"
          test "$(git -C .stage32-audited-td01 hash-object stages/stage32/32-01-178/topdown-01/EXACT-X4-ENVELOPE-BOUND.json)" = "51271c11078459ad9171138c4fb6121d7a665c39"
          test "$(git -C .stage32-audited-grf04 hash-object stages/stage32/management/global-residual-feasibility/GRF-04-RATIONAL-QUADRATIC-LOWER-BOUND-KERNEL.json)" = "f7c1073edbf895f498fd9923e59eedf5a4e981c8"
          test "$(git -C .stage32-audited-hpadj08 hash-object stages/stage32-ex5/hpadj-08_ex5/hpadj08_ex5_full178_b_shard.py)" = "c5fc340ea734dfc54436f124bb302c1ec6c5677c"
          test "$(git -C .stage32-td02-source hash-object stages/stage32/32-01-178/topdown-02/verify_td02_grf04_bounded.py)" = "8dc7b6255b31a79aa7f51141f1ac5a5b8137efc0"
          test "$(git -C .stage32-audited-intlat-bounded hash-object stages/stage32/32-01-178/topdown-02/TD02-INTEGER-LATTICE-CAPACITY-BOUNDED-CHECKPOINT.json)" = "5dd8f37b3c46f3dc7c89ce3c915dc6b327b674b3"
          test "$(git -C .stage32-audited-intlat-full178 hash-object stages/stage32/32-01-178/topdown-02/TD02-INTEGER-LATTICE-CAPACITY-FULL178-CHECKPOINT.json)" = "896eefd68ce7804db28a533d61cb490f14730b1c"
          test "$(git -C .stage32-178-handoff hash-object stages/stage32/32-01-178/topdown-02/TD02-FULL178-V37-SYNC-HANDOFF.json)" = "f05dc4f04f77594204298bdfd9784d9e95810eb3"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'

      - name: Reverify V34 process predecessor
        run: python .stage32-v34/stages/stage32/verify_main_startup.py
      - name: Reverify hostile-audited MAIN GRF04 symbolic kernel
        run: python .stage32-audited-grf04/stages/stage32/management/global-residual-feasibility/verify_grf04_rational_quadratic_lower_bound_kernel.py
      - name: Reverify hostile-audited q-quadratic candidate mathematics
        run: python stages/stage32/management/grf04-quadratic-capacity/verify_grf04_main_independent_quadratic_capacity_candidate.py --v34-root .stage32-v34 --td01-root .stage32-audited-td01 --grf04-root .stage32-audited-grf04 --hpadj08-root .stage32-audited-hpadj08 --td02-root .stage32-td02-source
      - name: Reverify V36 q-quadratic hostile-audit synchronization
        run: |
          git worktree add --detach .stage32-v36 384bb29a3428bf5fbd1db776f863d02cabda59c1
          test "$(git -C .stage32-v36 rev-parse HEAD)" = "384bb29a3428bf5fbd1db776f863d02cabda59c1"
          python .stage32-v36/stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v36_q_quadratic_audit_sync.py
      - name: Reverify exact V37 predecessor projection
        run: |
          git worktree add --detach .stage32-v37 515adec9cde85e6d2285d71a590ab5c4e4d8c797
          test "$(git -C .stage32-v37 rev-parse HEAD)" = "515adec9cde85e6d2285d71a590ab5c4e4d8c797"
          python .stage32-v37/stages/stage32/verify_main_startup.py
      - name: Reverify hostile-audited V38 replacement boundary
        run: python .stage32-v38/stages/stage32/verify_main_startup.py
      - name: Verify V39 audit synchronization
        run: python stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v39_td02_full178_integer_lattice_audit_sync.py
      - name: Verify MAIN exact integer BC-QT projection preflight
        run: python stages/stage32/management/grf04-quadratic-capacity/verify_grf04_main_bc_qt_integer_projection_preflight.py
      - name: Verify MAIN parallel HPADJ20 full-qA histogram preflight
        run: python stages/stage32/management/grf04-quadratic-capacity/verify_hpadj20_full_qa_histogram_main_parallel_preflight.py
      - name: Verify Stage32 MAIN startup projection
        run: python stages/stage32/verify_main_startup.py
      - name: Verify Stage32 cross-lane coordination
        run: python stages/stage32/proof/verify_cross_lane_demands.py
      - name: Verify Stage32 final-chain 32-02 retained checks
        run: |
          python stages/stage32/final-chain/32-02-effectivity/verify_surface_invariant_source_lock.py
          python stages/stage32/final-chain/32-02-effectivity/verify_rr_effectivity_sufficient.py
          python stages/stage32/final-chain/32-02-effectivity/verify_rr_norm_quantization.py
      - name: Verify Stage32 claim DAG and active frontier
        run: |
          python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python stages/stage32/proof/verify_stage32_active_frontier.py

      - name: Enforce startup-only scope
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          for forbidden in stages/stage32/controller.json stages/stage32/residual-32-01-production/state.json stages/stage32/runkeys/residual32-01-full178-production.json; do
            if printf '%s\n' "$changed" | grep -qx "$forbidden"; then
              echo "startup authority PR must not modify legacy detailed file: $forbidden"
              exit 1
            fi
          done
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=-blank-at-eof diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
