name: Stage32 MAIN startup authority
# Trigger lifecycle: ACTIVE_AUTO — Stage32 startup/authority/coordination safety gate
# Current boundary: merged hostile-audited V43 authority; V44 BTVA static7 normal-mass research successor carries zero new pruning.
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/stage32-main-startup-authority.yml'
      - 'stages/stage32/**'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-main-startup-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Checkout hostile-audited V42 boundary
        uses: actions/checkout@v4
        with:
          ref: e4311c4ec31d5768c57308681ae60679987e2ced
          path: .stage32-v42
          fetch-depth: 1

      - name: Assert fixed V42 boundary
        run: |
          set -euo pipefail
          test "$(git -C .stage32-v42 rev-parse HEAD)" = "e4311c4ec31d5768c57308681ae60679987e2ced"
          test "$(git -C .stage32-v42 hash-object stages/stage32/MAIN-STATE.json)" = "07d71175268085fd608443bdfef0c126ed4894c3"
          test "$(git -C .stage32-v42 hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V42-HPADJ21-FULL178-MAIN-BOUND-REPLACEMENT.json)" = "3072d84981eaec239ba55a5e5e25a3481d37406b"
          test "$(git -C .stage32-v42 hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v42_hpadj21_full178_main_bound_replacement.py)" = "e7c88c208739ebe30b5f21a4c5b8be625442c02d"
          test "$(git -C .stage32-v42 hash-object stages/stage32/verify_main_startup_authority_v42_hpadj21_full178_bound_consumed.py)" = "52940cf924cc239584a7d1cb39b55fdc9c9d9289"
          test "$(git -C .stage32-v42 hash-object stages/stage32/verify_main_startup.py)" = "7f2d8f1c84db40a33afaea43326a38395491715c"

      - name: Checkout hostile-audited merged V43 boundary
        uses: actions/checkout@v4
        with:
          ref: 1dfea81c06f9e3f52b99e4c88e7da7e78c872cc2
          path: .stage32-v43
          fetch-depth: 1

      - name: Assert fixed V43 boundary
        run: |
          set -euo pipefail
          test "$(git -C .stage32-v43 rev-parse HEAD)" = "1dfea81c06f9e3f52b99e4c88e7da7e78c872cc2"
          test "$(git -C .stage32-v43 hash-object stages/stage32/MAIN-STATE.json)" = "232732e29f72b55c34d540bf1c7cfcc4a626851c"
          test "$(git -C .stage32-v43 hash-object stages/stage32/verify_main_startup.py)" = "a1ea5681a516ec2b0b405c086af810790b5e7e45"
          test "$(git -C .stage32-v43 hash-object stages/stage32/verify_main_startup_authority_v43_hpadj21_full178_audit_synced.py)" = "ad96a89ed52598b6d4f12c12ef63a119aa0dd961"
          test "$(git -C .stage32-v43 hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v43_hpadj21_full178_audit_sync.py)" = "60d7fea8876e9143cea7c5dc89a7a2b9a6d99008"
          test "$(git -C .stage32-v43 hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V43-HPADJ21-FULL178-AUDIT-SYNC.json)" = "588442bf55ea03858387f78e0566ff1d5ed7699a"

      - name: Checkout live 178 compressed-Picard source
        uses: actions/checkout@v4
        with:
          ref: e60f03cf5105bc6e26cb4615acabd6fe0c07625c
          path: .stage32-178-btva-source
          fetch-depth: 0

      - name: Assert fixed 178 compressed-Picard source
        run: |
          set -euo pipefail
          test "$(git -C .stage32-178-btva-source rev-parse HEAD)" = "e60f03cf5105bc6e26cb4615acabd6fe0c07625c"
          test "$(git -C .stage32-178-btva-source hash-object stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_aggregate_picard_lattice_preflight.py)" = "5fa9f1d67d6411cb550230b62398aff7bd6488ff"
          test "$(git -C .stage32-178-btva-source hash-object stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_recoverability.py)" = "fbd8dad2194378a6bf77d12cc2c65ac03782f112"

      - name: Resolve research-head and merge-ready freshness separately
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"
          test "$current_main" = "83ae3f66cfcbdfaaaebf149bea078d1b0ff11c49"
          test "$merge_base" = "$current_main"
          git merge-base --is-ancestor "$current_main" HEAD

      - name: Verify V44 retained source identities
        run: |
          set -euo pipefail
          test "$(git hash-object stages/stage32/MAIN-STATE.json)" = "68cca5665ffdd9da73916a6b5e50331532df52fc"
          test "$(git hash-object stages/stage32/verify_main_startup.py)" = "84db5ac98414883cea9d8c66ee1e5e4bb44e56bd"
          test "$(git hash-object stages/stage32/verify_main_startup_authority_v44_btva_static7_normalmass.py)" = "df56dcf0a49121b104dd009384756d8f6e69cc4c"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V43-HPADJ21-FULL178-AUDIT-SYNC.json)" = "588442bf55ea03858387f78e0566ff1d5ed7699a"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v43_hpadj21_full178_audit_sync.py)" = "60d7fea8876e9143cea7c5dc89a7a2b9a6d99008"
          test "$(git hash-object stages/stage32/proof/verify_cross_lane_demands.py)" = "eb39445304be38c90e7675cfcf6e6af464d4a189"
          test "$(git hash-object stages/stage32/proof/CROSS-LANE-DEMANDS.json)" = "68a02f31431ad658b42ad695f9553c67fd6cff01"
          test "$(git hash-object stages/stage32/proof/CLAIM-REGISTRY.json)" = "f3a884adc1c82aace81cb73d049ff14720ace862"
          test "$(git hash-object stages/stage32/proof/ACTIVE-FRONTIER.json)" = "4c251be4aa5c355481fe3bcfc71c292fb6389ba4"
          test "$(git hash-object stages/stage32/proof/LANE-ADAPTERS.json)" = "c0ef34e5838e27046a20fed77063593009c56f40"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/BTVA-COMPRESSED-PICARD-LIFT-INTERSECTION-PREFLIGHT.json)" = "68108dfb110c4ea1d9dc0d74564a431bbbffbbde"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/verify_btva_compressed_picard_lift_intersection_preflight.py)" = "f483ae0d6fa53d286289b53d4f4ace3929bfe023"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/BTVA-D8-FULL343-RETAINED-CHECKPOINT.json)" = "4ae970e17b0d7168f6d2ffd0644195f2ab57ae8d"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/BTVA-D8-ALL140-RECEIVER-SEMANTICS-RETAINED.json)" = "c4c94fc8e2b45ee51660fe3665160fde98659056"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/diagnose_btva_all140_receiver_nonnegativity.py)" = "1dc8650e8bf1029828c7971411c9bcb5212e040b"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/BTVA-D8-PLANE-CONIC-EXCEPTION-SEPARATION.json)" = "75d384c194c678ff6158ea793e943bce91741bb8"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'

      - name: Replay hostile-audited V42 authority projection
        run: python .stage32-v42/stages/stage32/verify_main_startup.py

      - name: Replay hostile-audited merged V43 boundary
        run: python .stage32-v43/stages/stage32/verify_main_startup.py

      - name: Verify Stage32 MAIN V44 startup projection
        run: python stages/stage32/verify_main_startup.py

      - name: Verify Stage32 cross-lane coordination
        run: python stages/stage32/proof/verify_cross_lane_demands.py

      - name: Verify MAIN compressed BTVA Picard-lift intersection preflight
        run: python stages/stage32/management/btva-compressed-lift/verify_btva_compressed_picard_lift_intersection_preflight.py --lane178-root .stage32-178-btva-source

      - name: Verify Stage32 final-chain 32-02 retained checks
        run: |
          python stages/stage32/final-chain/32-02-effectivity/verify_surface_invariant_source_lock.py
          python stages/stage32/final-chain/32-02-effectivity/verify_rr_effectivity_sufficient.py
          python stages/stage32/final-chain/32-02-effectivity/verify_rr_norm_quantization.py

      - name: Verify Stage32 claim DAG and active frontier
        run: |
          python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python stages/stage32/proof/verify_stage32_active_frontier.py

      - name: Gate V44 BTVA all140 receiver nonnegativity diagnostic
        id: btva_all140_receiver_gate
        shell: bash
        run: |
          set -euo pipefail
          target="stages/stage32/management/btva-compressed-lift/diagnose_btva_all140_receiver_nonnegativity.py"
          changed="$(git diff --name-only HEAD^ HEAD)"
          if printf '%s\n' "$changed" | grep -Fxq "$target"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install V44 BTVA all140 receiver diagnostic dependencies
        if: steps.btva_all140_receiver_gate.outputs.run == 'true'
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'

      - name: Run V44 BTVA all140 receiver nonnegativity diagnostic
        if: steps.btva_all140_receiver_gate.outputs.run == 'true'
        run: |
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/diagnose_btva_all140_receiver_nonnegativity.py)" = "1dc8650e8bf1029828c7971411c9bcb5212e040b"
          python stages/stage32/management/btva-compressed-lift/diagnose_btva_all140_receiver_nonnegativity.py \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --output "$RUNNER_TEMP/btva-all140-receiver-nonnegativity.json"

      - name: Validate V44 BTVA all140 receiver diagnostic
        if: steps.btva_all140_receiver_gate.outputs.run == 'true'
        run: |
          python - "$RUNNER_TEMP/btva-all140-receiver-nonnegativity.json" <<'PY'
          import hashlib,json,sys
          p=json.load(open(sys.argv[1]))
          stored=p.pop("canonical_sha256_without_this_field")
          calc=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest()
          assert stored==calc
          assert p["schema"]=="STAGE32_MAIN_BTVA_ALL140_RECEIVER_NONNEGATIVITY_DIAGNOSTIC_V1"
          assert p["target"]["degree"]==8
          assert p["reconstruction"]["all140_count"]==140
          assert p["reconstruction"]["target_degree_equal_row_count"]==0
          assert p["receiver_semantics"]["all140_nonnegativity_is_necessary_for_d8_integral_curve_receiver"] is True
          assert p["firewalls"]["main_pruning_credit"] is False
          assert p["firewalls"]["merge_authorized"] is False
          print(json.dumps({"status":p["status"],"reconstruction":p["reconstruction"],"canonical":stored},sort_keys=True))
          PY

      - name: Upload V44 BTVA all140 receiver diagnostic
        if: steps.btva_all140_receiver_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage32-main-btva-all140-receiver-nonnegativity
          path: ${{ runner.temp }}/btva-all140-receiver-nonnegativity.json
          retention-days: 7
          compression-level: 9

      - name: Gate V44 BTVA d8 timeout rescue top16
        id: btva_d8_rescue_gate
        shell: bash
        run: |
          set -euo pipefail
          target="stages/stage32/management/btva-compressed-lift/run_btva_d8_timeout_rescue_top16.py"
          changed="$(git diff --name-only HEAD^ HEAD)"
          if printf '%s\n' "$changed" | grep -Fxq "$target"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install V44 BTVA d8 timeout rescue dependencies
        if: steps.btva_d8_rescue_gate.outputs.run == 'true'
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'

      - name: Run V44 BTVA d8 timeout rescue top16
        if: steps.btva_d8_rescue_gate.outputs.run == 'true'
        run: |
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/run_btva_d8_timeout_rescue_top16.py)" = "f7268058ec2124a90f161c34cc94287dff64f843"
          python stages/stage32/management/btva-compressed-lift/run_btva_d8_timeout_rescue_top16.py \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --lane178-root .stage32-178-btva-source \
            --solver-timeout-ms 5000 \
            --max-flat-cuts 32 \
            --output "$RUNNER_TEMP/btva-d8-timeout-rescue-top16.json"

      - name: Validate V44 BTVA d8 timeout rescue top16
        if: steps.btva_d8_rescue_gate.outputs.run == 'true'
        run: |
          python - "$RUNNER_TEMP/btva-d8-timeout-rescue-top16.json" <<'PY'
          import hashlib,json,sys
          p=json.load(open(sys.argv[1]))
          stored=p.pop("canonical_sha256_without_this_field")
          calc=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest()
          assert stored==calc
          assert p["schema"]=="STAGE32_MAIN_BTVA_D8_TIMEOUT_RESCUE_TOP16_V1"
          assert p["target"]["selected_terminal_mass"]==128029
          assert p["summary"]["selected_count"]==16
          assert p["summary"]["candidate_d8_survivor_terminal_mass_after_rescue"]<=248374
          assert p["firewalls"]["main_pruning_credit"] is False
          assert p["firewalls"]["merge_authorized"] is False
          print(json.dumps({"summary":p["summary"],"canonical":stored},sort_keys=True))
          PY

      - name: Upload V44 BTVA d8 timeout rescue top16
        if: steps.btva_d8_rescue_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage32-main-btva-d8-timeout-rescue-top16
          path: ${{ runner.temp }}/btva-d8-timeout-rescue-top16.json
          retention-days: 7
          compression-level: 9

      - name: Gate V44 BTVA d8 timeout rescue round2
        id: btva_d8_rescue_r2_gate
        shell: bash
        run: |
          set -euo pipefail
          target="stages/stage32/management/btva-compressed-lift/run_btva_d8_timeout_rescue_round2.py"
          changed="$(git diff --name-only HEAD^ HEAD)"
          if printf '%s\n' "$changed" | grep -Fxq "$target"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install V44 BTVA d8 timeout rescue round2 dependencies
        if: steps.btva_d8_rescue_r2_gate.outputs.run == 'true'
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'

      - name: Run V44 BTVA d8 timeout rescue round2
        if: steps.btva_d8_rescue_r2_gate.outputs.run == 'true'
        run: |
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/run_btva_d8_timeout_rescue_round2.py)" = "979131845585d73c3e4caacde9aa71b4162fab90"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/BTVA-D8-TIMEOUT-RESCUE-TOP16-RETAINED.json)" = "e1c4b0e04fa7f291cdbb42b3aafd62c869f47220"
          python stages/stage32/management/btva-compressed-lift/run_btva_d8_timeout_rescue_round2.py \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --lane178-root .stage32-178-btva-source \
            --solver-timeout-ms 10000 \
            --max-flat-cuts 64 \
            --output "$RUNNER_TEMP/btva-d8-timeout-rescue-round2.json"

      - name: Validate V44 BTVA d8 timeout rescue round2
        if: steps.btva_d8_rescue_r2_gate.outputs.run == 'true'
        run: |
          python - "$RUNNER_TEMP/btva-d8-timeout-rescue-round2.json" <<'PY'
          import hashlib,json,sys
          p=json.load(open(sys.argv[1]))
          stored=p.pop("canonical_sha256_without_this_field")
          calc=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest()
          assert stored==calc
          assert p["schema"]=="STAGE32_MAIN_BTVA_D8_TIMEOUT_RESCUE_ROUND2_V1"
          assert p["target"]["selected_terminal_mass"]==111079
          assert p["summary"]["selected_count"]==14
          assert p["summary"]["candidate_d8_survivor_terminal_mass_after_round2"]<=231424
          assert p["firewalls"]["main_pruning_credit"] is False
          assert p["firewalls"]["merge_authorized"] is False
          print(json.dumps({"summary":p["summary"],"canonical":stored},sort_keys=True))
          PY

      - name: Upload V44 BTVA d8 timeout rescue round2
        if: steps.btva_d8_rescue_r2_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage32-main-btva-d8-timeout-rescue-round2
          path: ${{ runner.temp }}/btva-d8-timeout-rescue-round2.json
          retention-days: 7
          compression-level: 9

      - name: Gate V44 BTVA d8 static Picard HNF diagnostic
        id: btva_d8_static_hnf_gate
        shell: bash
        run: |
          set -euo pipefail
          target="stages/stage32/management/btva-compressed-lift/diagnose_btva_d8_static7_picard_image_hnf.py"
          changed="$(git diff --name-only HEAD^ HEAD)"
          if printf '%s\n' "$changed" | grep -Fxq "$target"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install V44 BTVA d8 static Picard HNF dependencies
        if: steps.btva_d8_static_hnf_gate.outputs.run == 'true'
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'

      - name: Run V44 BTVA d8 static Picard HNF diagnostic
        if: steps.btva_d8_static_hnf_gate.outputs.run == 'true'
        run: |
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/diagnose_btva_d8_static7_picard_image_hnf.py)" = "19fbf7ebfc15d8c9b69d14f26c0615096b2964c5"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/BTVA-D8-FULL343-RETAINED-CHECKPOINT.json)" = "4ae970e17b0d7168f6d2ffd0644195f2ab57ae8d"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/BTVA-D8-TIMEOUT-RESCUE-TOP16-RETAINED.json)" = "e1c4b0e04fa7f291cdbb42b3aafd62c869f47220"
          python stages/stage32/management/btva-compressed-lift/diagnose_btva_d8_static7_picard_image_hnf.py \
            --lane178-root .stage32-178-btva-source \
            --output "$RUNNER_TEMP/btva-d8-static-picard-hnf.json"

      - name: Validate V44 BTVA d8 static Picard HNF diagnostic
        if: steps.btva_d8_static_hnf_gate.outputs.run == 'true'
        run: |
          python - "$RUNNER_TEMP/btva-d8-static-picard-hnf.json" <<'PY'
          import hashlib,json,sys
          p=json.load(open(sys.argv[1]))
          stored=p.pop("canonical_sha256_without_this_field")
          calc=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest()
          assert stored==calc
          assert p["schema"]=="STAGE32_MAIN_BTVA_D8_STATIC7_PICARD_IMAGE_HNF_DIAGNOSTIC_V1"
          assert p["target"]["source_after_r1_survivor_terminal_mass"]==231424
          assert p["summary"]["candidate_d8_survivor_terminal_mass_after_static_picard_hnf"]<=231424
          assert p["certificate"]["rule_exact_for_linear_picard_lattice_extendability"] is True
          assert p["firewalls"]["main_pruning_credit"] is False
          print(json.dumps({"summary":p["summary"],"certificate":{k:p["certificate"][k] for k in ("membership_modulus","active_congruence_rows","image_lattice_index_in_Zm")},"canonical":stored},sort_keys=True))
          PY

      - name: Upload V44 BTVA d8 static Picard HNF diagnostic
        if: steps.btva_d8_static_hnf_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage32-main-btva-d8-static-picard-hnf
          path: ${{ runner.temp }}/btva-d8-static-picard-hnf.json
          retention-days: 7
          compression-level: 9

      - name: Gate V44 BTVA d8 residual-block Picard HNF diagnostic
        id: btva_d8_residual_hnf_gate
        shell: bash
        run: |
          set -euo pipefail
          target="stages/stage32/management/btva-compressed-lift/diagnose_btva_d8_residual_block_picard_hnf.py"
          changed="$(git diff --name-only HEAD^ HEAD)"
          if printf '%s\n' "$changed" | grep -Fxq "$target"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install V44 BTVA d8 residual-block HNF dependencies
        if: steps.btva_d8_residual_hnf_gate.outputs.run == 'true'
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'

      - name: Run V44 BTVA d8 residual-block Picard HNF diagnostic
        if: steps.btva_d8_residual_hnf_gate.outputs.run == 'true'
