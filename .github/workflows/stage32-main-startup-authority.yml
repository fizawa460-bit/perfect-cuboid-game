name: Stage32 MAIN startup authority
# Trigger lifecycle: ACTIVE_AUTO — Stage32 startup/authority/coordination safety gate
# Current boundary: V42 retains a strict low-d full-qA hybrid candidate pending hostile audit.
# Numerical MAIN authority remains the hostile-audited/synchronized V41 value until a separate transition.
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/stage32-main-startup-authority.yml'
      - 'stages/stage32/**'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage32-main-startup-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Checkout hostile-audited V40 boundary
        uses: actions/checkout@v4
        with:
          ref: dc4dfdf7bea41116aa63d69a5bbd17fa053e741c
          path: .stage32-v40
          fetch-depth: 1

      - name: Assert fixed V40 boundary
        run: |
          test "$(git -C .stage32-v40 rev-parse HEAD)" = "dc4dfdf7bea41116aa63d69a5bbd17fa053e741c"
          test "$(git -C .stage32-v40 hash-object stages/stage32/MAIN-STATE.json)" = "a22cb78a4b8a495f1abb93b20d4a8048dbd98df4"
          test "$(git -C .stage32-v40 hash-object stages/stage32/verify_main_startup.py)" = "adc9c0ba91547504bea1a2121af595a94581bcbd"
          test "$(git -C .stage32-v40 hash-object stages/stage32/verify_main_startup_authority_v40_hpadj20_full178_bound_consumed.py)" = "b519b1d5df79ebc784337ac72cee4494fdc9d003"
          test "$(git -C .stage32-v40 hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V40-HPADJ20-FULL178-MAIN-BOUND-REPLACEMENT.json)" = "f9d984f64d2c428481e082be622848e33407baf1"
          test "$(git -C .stage32-v40 hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v40_hpadj20_full178_main_bound_replacement.py)" = "dd3073cd83ab8079d1fa16dd506e453a2d632ff7"

      - name: Checkout exact V41 predecessor
        uses: actions/checkout@v4
        with:
          ref: 2a9fa0ca243d7bbe75d7539ab574d632fdc44981
          path: .stage32-v41
          fetch-depth: 1

      - name: Assert fixed V41 predecessor
        run: |
          test "$(git -C .stage32-v41 rev-parse HEAD)" = "2a9fa0ca243d7bbe75d7539ab574d632fdc44981"
          test "$(git -C .stage32-v41 hash-object stages/stage32/MAIN-STATE.json)" = "dd7dba27eb062e6a6ad4d440094ba26c290900d7"
          test "$(git -C .stage32-v41 hash-object stages/stage32/verify_main_startup.py)" = "d12c7d5c86a2a3d5b95fed6c02321d21bbbee2d8"
          test "$(git -C .stage32-v41 hash-object stages/stage32/verify_main_startup_authority_v41_hpadj20_full178_audit_synced.py)" = "302b1819fe3e7e8f6330fb9d02d28ada0acfbbc6"
          test "$(git -C .stage32-v41 hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V41-HPADJ20-FULL178-AUDIT-SYNC.json)" = "ee6639e2b4a4ad5dd48e964d6a6b055f551e7bd1"
          test "$(git -C .stage32-v41 hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v41_hpadj20_full178_audit_sync.py)" = "908bb4ce8a2ca80070537f69118145d4fc65bbed"

      - name: Resolve research-head and merge-ready freshness separately
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"
          test -n "$merge_base"
          if git merge-base --is-ancestor "$current_main" HEAD && [ "$merge_base" = "$current_main" ]; then
            echo "merge_ready_freshness=CLEAR_CURRENT_MAIN_INTEGRATED"
          else
            echo "merge_ready_freshness=PENDING_MAIN_DRIFT_REQUIRES_SEPARATE_SEMANTIC_REVIEW"
          fi

      - name: Verify V42 retained source identities
        run: |
          test "$(git hash-object stages/stage32/MAIN-STATE.json)" = "d9a882463fb72f7481a13f3df29ea96743612353"
          test "$(git hash-object stages/stage32/verify_main_startup.py)" = "fcd7470d63366b1a1cb5cb7243e3f2bda0648c27"
          test "$(git hash-object stages/stage32/verify_main_startup_authority_v42_hpadj20_low_d_full_qa_hybrid_candidate.py)" = "e067e31376180af65d2357b9bb81d29a77705c10"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V42-HPADJ20-LOW-D-FULL-QA-HYBRID-CANDIDATE.json)" = "c333040911a8f0fdadc72adc29788590681fe3bf"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v42_hpadj20_low_d_full_qa_hybrid_candidate.py)" = "ff3295c37d63050b80318f75b1796db55bdc4b9d"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/HPADJ20-FULL-QA-HISTOGRAM-MAIN-PARALLEL-PREFLIGHT.json)" = "0eb5672dea0712cbf5044d5376e60fe233e767c3"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/HPADJ20-FULL-QA-HISTOGRAM-LOW-D-NUMERICAL-PILOT.json)" = "ae4449029818f7e2c510e745c6572de72d844371"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_hpadj20_full_qa_histogram_low_d_numerical_pilot.py)" = "0197f7062df96777396bead619bcff4a7ba4063a"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V41-HPADJ20-FULL178-AUDIT-SYNC.json)" = "ee6639e2b4a4ad5dd48e964d6a6b055f551e7bd1"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v41_hpadj20_full178_audit_sync.py)" = "908bb4ce8a2ca80070537f69118145d4fc65bbed"
          test "$(git hash-object stages/stage32/proof/verify_cross_lane_demands.py)" = "2443eb00f08b6d271cbb350f629bd78e91241d5b"
          test "$(git hash-object stages/stage32/proof/CROSS-LANE-DEMANDS.json)" = "68a02f31431ad658b42ad695f9553c67fd6cff01"
          test "$(git hash-object stages/stage32/proof/CLAIM-REGISTRY.json)" = "f3a884adc1c82aace81cb73d049ff14720ace862"
          test "$(git hash-object stages/stage32/proof/ACTIVE-FRONTIER.json)" = "4c251be4aa5c355481fe3bcfc71c292fb6389ba4"
          test "$(git hash-object stages/stage32/proof/LANE-ADAPTERS.json)" = "c0ef34e5838e27046a20fed77063593009c56f40"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'

      - name: Replay exact hostile-audited V40 authority projection
        run: python .stage32-v40/stages/stage32/verify_main_startup.py

      - name: Replay exact V41 audit synchronization against V40
        run: python .stage32-v41/stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v41_hpadj20_full178_audit_sync.py --v40-root .stage32-v40

      - name: Replay exact V41 startup projection
        run: python .stage32-v41/stages/stage32/verify_main_startup.py

      - name: Verify retained low-d full-qA pilot
        run: python stages/stage32/management/grf04-quadratic-capacity/verify_hpadj20_full_qa_histogram_low_d_numerical_pilot.py

      - name: Verify V42 hybrid candidate against exact V41 source
        run: python stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v42_hpadj20_low_d_full_qa_hybrid_candidate.py --v41-root .stage32-v41

      - name: Verify Stage32 MAIN startup projection
        run: python stages/stage32/verify_main_startup.py

      - name: Verify Stage32 cross-lane coordination
        run: python stages/stage32/proof/verify_cross_lane_demands.py

      - name: Verify Stage32 final-chain 32-02 retained checks
        run: |
          python stages/stage32/final-chain/32-02-effectivity/verify_surface_invariant_source_lock.py
          python stages/stage32/final-chain/32-02-effectivity/verify_rr_effectivity_sufficient.py
          python stages/stage32/final-chain/32-02-effectivity/verify_rr_norm_quantization.py

      - name: Verify Stage32 claim DAG and active frontier
        run: |
          python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python stages/stage32/proof/verify_stage32_active_frontier.py

      - name: Enforce V41 sync plus V42 candidate bounded scope
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          printf '%s\n' "$changed"
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              .github/workflows/stage32-main-startup-authority.yml|\
              stages/stage32/MAIN-STATE.json|\
              stages/stage32/verify_main_startup.py|\
              stages/stage32/verify_main_startup_authority_v41_hpadj20_full178_audit_synced.py|\
              stages/stage32/verify_main_startup_authority_v42_hpadj20_low_d_full_qa_hybrid_candidate.py|\
              stages/stage32/proof/verify_cross_lane_demands.py|\
              stages/stage32/management/grf04-quadratic-capacity/GRF04-V41-HPADJ20-FULL178-AUDIT-SYNC.json|\
              stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v41_hpadj20_full178_audit_sync.py|\
              stages/stage32/management/grf04-quadratic-capacity/GRF04-V42-HPADJ20-LOW-D-FULL-QA-HYBRID-CANDIDATE.json|\
              stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v42_hpadj20_low_d_full_qa_hybrid_candidate.py) ;;
              *) echo "unexpected V41/V42 bounded-scope path: $p"; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=-blank-at-eof diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
