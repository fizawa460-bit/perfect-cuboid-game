name: Stage32 MAIN startup authority

# Trigger lifecycle: ACTIVE_AUTO — Stage32 startup/authority/coordination safety gate
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/stage32-main-startup-authority.yml'
      - 'stages/stage32/COMMANDS.md'
      - 'stages/stage32/MAIN-START-HERE.md'
      - 'stages/stage32/MAIN-STATE.json'
      - 'stages/stage32/verify_command_surface.py'
      - 'stages/stage32/verify_main_startup.py'
      - 'stages/stage32/verify_main_startup_authority_v*.py'
      - 'stages/stage32/management/**'
      - 'stages/stage32/proof/**'
      - 'stages/stage32/32-01-178/MAIN-START-HERE.md'
      - 'stages/stage32/final-chain/32-02-effectivity/**'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
      - 'stages/stage32/full178-cut/**'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_indexer.py'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_family.py'
      - 'stages/stage32/final-chain/32-03-multibranch/MISSION.json'
      - 'stages/stage32/final-chain/32-03-multibranch/MAIN-START-HERE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-main-startup-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Checkout hostile-audited HPADJ07 V23 predecessor
        uses: actions/checkout@v4
        with:
          ref: 8d8f1116d82f873d2cddafdd4d3619fb8649891b
          path: .stage32-audited-hpadj07-v23
          fetch-depth: 1
      - name: Assert hostile-audited HPADJ07 V23 predecessor
        run: test "$(git -C .stage32-audited-hpadj07-v23 rev-parse HEAD)" = "8d8f1116d82f873d2cddafdd4d3619fb8649891b"

      - name: Checkout hostile-audited CUT193
        uses: actions/checkout@v4
        with:
          ref: 5b2ebb3f67805eddefef835878ba4b9744bfdbd9
          path: .stage32-audited-cut193
          fetch-depth: 1
      - name: Checkout hostile-audited CUT194
        uses: actions/checkout@v4
        with:
          ref: 847f3bff0c5e0d0530bfb8db406e955b2d231d9a
          path: .stage32-audited-cut194
          fetch-depth: 1
      - name: Checkout hostile-audited CUT195
        uses: actions/checkout@v4
        with:
          ref: 2618f4dcd546d569b212753ac7abc10e07ee5828
          path: .stage32-audited-cut195
          fetch-depth: 1
      - name: Checkout hostile-audited CUT196
        uses: actions/checkout@v4
        with:
          ref: 85f4e988acf6446fa0d472208e21990621a650b4
          path: .stage32-audited-cut196
          fetch-depth: 1
      - name: Checkout hostile-audited CUT197
        uses: actions/checkout@v4
        with:
          ref: adce53dc9004c24bffb3ba9f88e9d5d6e51cf6a5
          path: .stage32-audited-cut197
          fetch-depth: 1
      - name: Checkout hostile-audited CUT198
        uses: actions/checkout@v4
        with:
          ref: 16e439bc65e723c9f2658c274d53fb839738dcd2
          path: .stage32-audited-cut198
          fetch-depth: 1
      - name: Assert audited CUT heads
        run: |
          test "$(git -C .stage32-audited-cut193 rev-parse HEAD)" = "5b2ebb3f67805eddefef835878ba4b9744bfdbd9"
          test "$(git -C .stage32-audited-cut194 rev-parse HEAD)" = "847f3bff0c5e0d0530bfb8db406e955b2d231d9a"
          test "$(git -C .stage32-audited-cut195 rev-parse HEAD)" = "2618f4dcd546d569b212753ac7abc10e07ee5828"
          test "$(git -C .stage32-audited-cut196 rev-parse HEAD)" = "85f4e988acf6446fa0d472208e21990621a650b4"
          test "$(git -C .stage32-audited-cut197 rev-parse HEAD)" = "adce53dc9004c24bffb3ba9f88e9d5d6e51cf6a5"
          test "$(git -C .stage32-audited-cut198 rev-parse HEAD)" = "16e439bc65e723c9f2658c274d53fb839738dcd2"

      - name: Checkout hostile-audited EX5 BC2-35 cross-lane basis
        uses: actions/checkout@v4
        with:
          ref: 8bea7a6be26e01db0deb138dbd8406f578447921
          path: .stage32-audited-ex5-bc2-35
          fetch-depth: 1
      - name: Assert hostile-audited EX5 BC2-35 head
        run: test "$(git -C .stage32-audited-ex5-bc2-35 rev-parse HEAD)" = "8bea7a6be26e01db0deb138dbd8406f578447921"

      - name: Checkout hostile-audited MAIN V22 mathematical authority
        uses: actions/checkout@v4
        with:
          ref: f8039b4ce479a4b91f2f0547e7049f629e9be5f5
          path: .stage32-audited-main-v22
          fetch-depth: 1
      - name: Checkout CERTLIFT-03 hostile-audited reviewed head
        uses: actions/checkout@v4
        with:
          ref: 289437a4a97a814c2388133cbde0c794d9502e4b
          path: .stage32-certlift-reviewed
          fetch-depth: 1
      - name: Checkout CERTLIFT-03 hostile-audit PASS receipt head
        uses: actions/checkout@v4
        with:
          ref: 51c56b5c3ee15177c2975b966ab546d0b548c4af
          path: .stage32-certlift-audit-pass
          fetch-depth: 1
      - name: Checkout hostile-audited V15 adapter semantic provenance
        uses: actions/checkout@v4
        with:
          ref: 7c3a9c301d9e1d98678fcd1532afce62c44d56e0
          path: .stage32-certlift-v15-adapter
          fetch-depth: 1
      - name: Assert CERTLIFT provenance heads
        run: |
          test "$(git -C .stage32-audited-main-v22 rev-parse HEAD)" = "f8039b4ce479a4b91f2f0547e7049f629e9be5f5"
          test "$(git -C .stage32-certlift-reviewed rev-parse HEAD)" = "289437a4a97a814c2388133cbde0c794d9502e4b"
          test "$(git -C .stage32-certlift-audit-pass rev-parse HEAD)" = "51c56b5c3ee15177c2975b966ab546d0b548c4af"
          test "$(git -C .stage32-certlift-v15-adapter rev-parse HEAD)" = "7c3a9c301d9e1d98678fcd1532afce62c44d56e0"

      - name: Checkout hostile-audited N358 census basis
        uses: actions/checkout@v4
        with:
          ref: 462174f74d6470ec7c64f5b6d078757c7b3372fc
          path: .stage32-audited-n358
          fetch-depth: 1
      - name: Checkout N358 hostile-audit PASS receipt retention head
        uses: actions/checkout@v4
        with:
          ref: 95122f8223226e51cfb77ea4be2e952b6a623387
          path: .stage32-n358-audit-receipt
          fetch-depth: 1
      - name: Source-lock and materialize N358 hostile-audit PASS receipt
        run: |
          receipt="stages/stage32/32-01-178/nodes/N358/HOSTILE-AUDIT-PASS.json"
          test "$(git -C .stage32-audited-n358 rev-parse HEAD)" = "462174f74d6470ec7c64f5b6d078757c7b3372fc"
          test "$(git -C .stage32-n358-audit-receipt rev-parse HEAD)" = "95122f8223226e51cfb77ea4be2e952b6a623387"
          test "$(git -C .stage32-n358-audit-receipt hash-object "$receipt")" = "7b36e0159987ef65485d36fa2d672c8ee3a1ff33"
          cp ".stage32-n358-audit-receipt/$receipt" ".stage32-audited-n358/$receipt"
          test "$(git -C .stage32-audited-n358 hash-object "$receipt")" = "7b36e0159987ef65485d36fa2d672c8ee3a1ff33"

      - name: Resolve research freshness authority
        if: github.event_name == 'pull_request'
        run: |
          baseline="e4d3b8b83626526ffeccdbd9c956081735fe1a6e"
          expected_current_main="4c51b4ea90a84f9a22a90f194c6d8ecadd9f0d1c"
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"
          test "$current_main" = "$expected_current_main"
          test "$(git merge-base "$baseline" "$current_main")" = "$baseline"
          drift="$(git diff --name-only "$baseline" "$current_main")"
          printf 'main_drift_paths=%s\n' "$drift"
          test "$drift" = "x"
          test "$merge_base" = "$baseline"
          echo "research_freshness=CLEAR_UNRELATED_MAIN_DRIFT"
          echo "merge_ready_freshness=PENDING_BEHIND_MAIN"

      - name: Verify V24 source identities
        run: |
          test "$(git hash-object stages/stage32/MAIN-STATE.json)" = "c7fac09b774d8fc75ba3daa1b9320dbb66b81a6d"
          test "$(git hash-object stages/stage32/verify_main_startup.py)" = "e44680ba0209607f234707ca5199dbd86e6972ab"
          test "$(git hash-object stages/stage32/verify_main_startup_authority_v24.py)" = "7a98893e7a8a427749da0facbd55b6c1c082640e"
          test "$(git hash-object stages/stage32/management/hpadj-07/HPADJ07-V23-MAIN-CONSUMPTION.json)" = "e942711b67ebc43b39a73ab55bc10862654059f8"
          test "$(git hash-object stages/stage32/management/hpadj-07/verify_hpadj07_v23_main_consumption.py)" = "923e81a61446da47f92239efc06be52a96b23466"
          test "$(git hash-object stages/stage32/proof/verify_cross_lane_demands.py)" = "6bacdbabf51ca2af591062f062201e0bfb3c26b1"
          test "$(git hash-object stages/stage32/proof/verify_cross_lane_demands_v23_historical.py)" = "56f66941608e6883e3110ca370cda5dac043e968"
          test "$(git hash-object stages/stage32/proof/historical-routing-blobs/bead809db3a008dd35d664a8923f06fecb7de5bb.json)" = "bead809db3a008dd35d664a8923f06fecb7de5bb"
          test "$(git hash-object stages/stage32/management/hpadj-07/proof-chain/GENERAL-TYPE-ADJUNCTION-CORRECTION.json)" = "c90b41dcfbd5bd081629a6fa62d9447d43cb3d5e"
          test "$(git hash-object stages/stage32/management/hpadj-07/proof-chain/verify_general_type_adjunction_correction.py)" = "e3efa7c27c1cb37324d588bac270d53f2b21620f"
          test "$(git hash-object stages/stage32/management/hpadj-07/proof-chain/PRUNING-DIRECTION-CONTRACT-REVIEW.json)" = "bd1beddf25b505c9f6c7e163606e6156dca10346"
          test "$(git hash-object stages/stage32/management/hpadj-07/proof-chain/verify_pruning_direction_contract_review.py)" = "97afaae92429bd8a2166414186ed719f141dc9cb"
          test "$(git hash-object stages/stage32/management/hpadj-07/proof-chain/CURRENT-V23-CONSERVATIVE-REBASE.json)" = "8883cfc59a6d48e34d7e256fad15e69714dc02d1"
          test "$(git hash-object stages/stage32/management/hpadj-07/CARRIER-REALIZATION-WALL.json)" = "e4a35aa9bdd174ac64162839ec391cd57f7d9315"

      - name: Replay hostile-audited CERTLIFT-03 V23 predecessor composition
        run: >-
          python3 .stage32-audited-hpadj07-v23/stages/stage32/management/verify_certlift03_current_v22_composition.py
          --audited-main-v22-root .stage32-audited-main-v22
          --certlift-reviewed-root .stage32-certlift-reviewed
          --certlift-audit-pass-root .stage32-certlift-audit-pass
          --audited-v15-adapter-root .stage32-certlift-v15-adapter
          --cut193-root .stage32-audited-cut193
          --cut194-root .stage32-audited-cut194
          --cut195-root .stage32-audited-cut195
          --cut196-root .stage32-audited-cut196
          --cut197-root .stage32-audited-cut197
          --cut198-root .stage32-audited-cut198

      - name: Setup exact EX5 adapter Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact EX5 adapter dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Probe cross-lane HNF syndrome compression
        run: |
          python stages/stage32/management/cross-lane-hnf-syndrome/hnf_syndrome_compression_probe.py \
            --audited-ex5-root .stage32-audited-ex5-bc2-35 \
            --json-output /tmp/stage32-hnf-syndrome-probe.json
          cat /tmp/stage32-hnf-syndrome-probe.json

      - name: Verify HPADJ-07 general-type adjunction correction replay
        run: >-
          python stages/stage32/management/hpadj-07/proof-chain/verify_general_type_adjunction_correction.py
          --audited-n358-root .stage32-audited-n358
      - name: Verify HPADJ-07 pruning-direction contract
        run: python stages/stage32/management/hpadj-07/proof-chain/verify_pruning_direction_contract_review.py
      - name: Replay hostile-audited HPADJ-07 V23 conservative rebase
        run: python .stage32-audited-hpadj07-v23/stages/stage32/management/hpadj-07/proof-chain/verify_current_v23_conservative_rebase.py
      - name: Replay hostile-audited HPADJ-07 general-type supersession wall
        run: python .stage32-audited-hpadj07-v23/stages/stage32/management/hpadj-07/verify_hpadj07_carrier_realization_wall.py

      - name: Verify HPADJ-07 V23 lower-bound MAIN consumption
        run: >-
          python stages/stage32/management/hpadj-07/verify_hpadj07_v23_main_consumption.py
          --audited-v23-root .stage32-audited-hpadj07-v23

      - name: Verify Stage32 MAIN startup authority V24
        run: python stages/stage32/verify_main_startup.py
      - name: Verify Stage32 cross-lane demand coordination after V24
        run: python stages/stage32/proof/verify_cross_lane_demands.py
      - name: Verify Stage32 final-chain 32-02 retained surface invariant source lock
        run: python stages/stage32/final-chain/32-02-effectivity/verify_surface_invariant_source_lock.py
      - name: Verify Stage32 final-chain 32-02 source-locked RR effectivity classifier
        run: python stages/stage32/final-chain/32-02-effectivity/verify_rr_effectivity_sufficient.py
      - name: Verify Stage32 claim-DAG integrity after V24 HPADJ transition
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify Stage32 active frontier after V24 HPADJ transition
        run: python stages/stage32/proof/verify_stage32_active_frontier.py

      - name: Enforce startup-only scope
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          for forbidden in stages/stage32/controller.json stages/stage32/residual-32-01-production/state.json stages/stage32/runkeys/residual32-01-full178-production.json; do
            if printf '%s\n' "$changed" | grep -qx "$forbidden"; then
              echo "startup authority PR must not modify legacy detailed file: $forbidden"
              exit 1
            fi
          done
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=-blank-at-eof diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
