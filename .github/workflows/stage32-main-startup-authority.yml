name: Stage32 MAIN startup authority
# Trigger lifecycle: ACTIVE_AUTO — Stage32 startup/authority/coordination safety gate
# Current boundary: merged hostile-audited V43 authority; V44 BTVA static7 normal-mass research successor carries zero new pruning.
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/stage32-main-startup-authority.yml'
      - 'stages/stage32/**'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-main-startup-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Checkout hostile-audited V42 boundary
        uses: actions/checkout@v4
        with:
          ref: e4311c4ec31d5768c57308681ae60679987e2ced
          path: .stage32-v42
          fetch-depth: 1

      - name: Assert fixed V42 boundary
        run: |
          set -euo pipefail
          test "$(git -C .stage32-v42 rev-parse HEAD)" = "e4311c4ec31d5768c57308681ae60679987e2ced"
          test "$(git -C .stage32-v42 hash-object stages/stage32/MAIN-STATE.json)" = "07d71175268085fd608443bdfef0c126ed4894c3"
          test "$(git -C .stage32-v42 hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V42-HPADJ21-FULL178-MAIN-BOUND-REPLACEMENT.json)" = "3072d84981eaec239ba55a5e5e25a3481d37406b"
          test "$(git -C .stage32-v42 hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v42_hpadj21_full178_main_bound_replacement.py)" = "e7c88c208739ebe30b5f21a4c5b8be625442c02d"
          test "$(git -C .stage32-v42 hash-object stages/stage32/verify_main_startup_authority_v42_hpadj21_full178_bound_consumed.py)" = "52940cf924cc239584a7d1cb39b55fdc9c9d9289"
          test "$(git -C .stage32-v42 hash-object stages/stage32/verify_main_startup.py)" = "7f2d8f1c84db40a33afaea43326a38395491715c"

      - name: Checkout hostile-audited merged V43 boundary
        uses: actions/checkout@v4
        with:
          ref: 1dfea81c06f9e3f52b99e4c88e7da7e78c872cc2
          path: .stage32-v43
          fetch-depth: 1

      - name: Assert fixed V43 boundary
        run: |
          set -euo pipefail
          test "$(git -C .stage32-v43 rev-parse HEAD)" = "1dfea81c06f9e3f52b99e4c88e7da7e78c872cc2"
          test "$(git -C .stage32-v43 hash-object stages/stage32/MAIN-STATE.json)" = "232732e29f72b55c34d540bf1c7cfcc4a626851c"
          test "$(git -C .stage32-v43 hash-object stages/stage32/verify_main_startup.py)" = "a1ea5681a516ec2b0b405c086af810790b5e7e45"
          test "$(git -C .stage32-v43 hash-object stages/stage32/verify_main_startup_authority_v43_hpadj21_full178_audit_synced.py)" = "ad96a89ed52598b6d4f12c12ef63a119aa0dd961"
          test "$(git -C .stage32-v43 hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v43_hpadj21_full178_audit_sync.py)" = "60d7fea8876e9143cea7c5dc89a7a2b9a6d99008"
          test "$(git -C .stage32-v43 hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V43-HPADJ21-FULL178-AUDIT-SYNC.json)" = "588442bf55ea03858387f78e0566ff1d5ed7699a"

      - name: Checkout live 178 compressed-Picard source
        uses: actions/checkout@v4
        with:
          ref: e60f03cf5105bc6e26cb4615acabd6fe0c07625c
          path: .stage32-178-btva-source
          fetch-depth: 0

      - name: Assert fixed 178 compressed-Picard source
        run: |
          set -euo pipefail
          test "$(git -C .stage32-178-btva-source rev-parse HEAD)" = "e60f03cf5105bc6e26cb4615acabd6fe0c07625c"
          test "$(git -C .stage32-178-btva-source hash-object stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_aggregate_picard_lattice_preflight.py)" = "5fa9f1d67d6411cb550230b62398aff7bd6488ff"
          test "$(git -C .stage32-178-btva-source hash-object stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_recoverability.py)" = "fbd8dad2194378a6bf77d12cc2c65ac03782f112"

      - name: Resolve research-head and merge-ready freshness separately
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"
          test "$current_main" = "83ae3f66cfcbdfaaaebf149bea078d1b0ff11c49"
          test "$merge_base" = "$current_main"
          git merge-base --is-ancestor "$current_main" HEAD

      - name: Verify V44 retained source identities
        run: |
          set -euo pipefail
          test "$(git hash-object stages/stage32/MAIN-STATE.json)" = "ea2a688d471440c337673c5d2ce287fa899bab8f"
          test "$(git hash-object stages/stage32/verify_main_startup.py)" = "84db5ac98414883cea9d8c66ee1e5e4bb44e56bd"
          test "$(git hash-object stages/stage32/verify_main_startup_authority_v44_btva_static7_normalmass.py)" = "7f78c1c5be9d1cd106876c784a9a0b312927bdd3"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/GRF04-V43-HPADJ21-FULL178-AUDIT-SYNC.json)" = "588442bf55ea03858387f78e0566ff1d5ed7699a"
          test "$(git hash-object stages/stage32/management/grf04-quadratic-capacity/verify_grf04_v43_hpadj21_full178_audit_sync.py)" = "60d7fea8876e9143cea7c5dc89a7a2b9a6d99008"
          test "$(git hash-object stages/stage32/proof/verify_cross_lane_demands.py)" = "29a66a60534353d47fb508cb10d0121c93f9ef09"
          test "$(git hash-object stages/stage32/proof/CROSS-LANE-DEMANDS.json)" = "68a02f31431ad658b42ad695f9553c67fd6cff01"
          test "$(git hash-object stages/stage32/proof/CLAIM-REGISTRY.json)" = "f3a884adc1c82aace81cb73d049ff14720ace862"
          test "$(git hash-object stages/stage32/proof/ACTIVE-FRONTIER.json)" = "4c251be4aa5c355481fe3bcfc71c292fb6389ba4"
          test "$(git hash-object stages/stage32/proof/LANE-ADAPTERS.json)" = "c0ef34e5838e27046a20fed77063593009c56f40"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/BTVA-COMPRESSED-PICARD-LIFT-INTERSECTION-PREFLIGHT.json)" = "68108dfb110c4ea1d9dc0d74564a431bbbffbbde"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/verify_btva_compressed_picard_lift_intersection_preflight.py)" = "f483ae0d6fa53d286289b53d4f4ace3929bfe023"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'

      - name: Replay hostile-audited V42 authority projection
        run: python .stage32-v42/stages/stage32/verify_main_startup.py

      - name: Replay hostile-audited merged V43 boundary
        run: python .stage32-v43/stages/stage32/verify_main_startup.py

      - name: Verify Stage32 MAIN V44 startup projection
        run: python stages/stage32/verify_main_startup.py

      - name: Verify Stage32 cross-lane coordination
        run: python stages/stage32/proof/verify_cross_lane_demands.py

      - name: Verify MAIN compressed BTVA Picard-lift intersection preflight
        run: python stages/stage32/management/btva-compressed-lift/verify_btva_compressed_picard_lift_intersection_preflight.py --lane178-root .stage32-178-btva-source

      - name: Verify Stage32 final-chain 32-02 retained checks
        run: |
          python stages/stage32/final-chain/32-02-effectivity/verify_surface_invariant_source_lock.py
          python stages/stage32/final-chain/32-02-effectivity/verify_rr_effectivity_sufficient.py
          python stages/stage32/final-chain/32-02-effectivity/verify_rr_norm_quantization.py

      - name: Verify Stage32 claim DAG and active frontier
        run: |
          python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python stages/stage32/proof/verify_stage32_active_frontier.py

      - name: Gate V44 BTVA normalmass bounded runkey
        id: btva_normalmass_gate
        shell: bash
        run: |
          set -euo pipefail
          runkey="stages/stage32/management/btva-compressed-lift/runkeys/V44-BTVA-STATIC7-NORMALMASS.json"
          if [ ! -f "$runkey" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^ HEAD)"
          if ! printf '%s\n' "$changed" | grep -Fxq "$runkey"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - "$runkey" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p["schema"]=="STAGE32_MAIN_BTVA_STATIC7_NORMALMASS_RUNKEY_V1"
          assert p["generation"]==1
          assert p["armed"] is True
          assert p["row_id"]=="g0-d008"
          assert p["degree"]==8 and p["exceptional_mass"]==8 and p["normal_mass"]==112
          assert p["authority_bound"]=="157570677819451133507"
          assert p["zero_credit"] is True
          assert p["merge_authorized"] is False
          PY
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Install V44 BTVA bounded solver dependencies
        if: steps.btva_normalmass_gate.outputs.run == 'true'
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'

      - name: Run V44 BTVA static7 normalmass bounded panel
        if: steps.btva_normalmass_gate.outputs.run == 'true'
        run: |
          python stages/stage32/management/btva-compressed-lift/run_btva_static7_normalmass_bounded_panel.py \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --lane178-root .stage32-178-btva-source \
            --solver-timeout-ms 10000 \
            --max-flat-cuts 32 \
            --output "$RUNNER_TEMP/btva-static7-normalmass-panel.json"

      - name: Validate V44 BTVA normalmass zero-credit result
        if: steps.btva_normalmass_gate.outputs.run == 'true'
        run: |
          python - "$RUNNER_TEMP/btva-static7-normalmass-panel.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p["schema"]=="STAGE32_MAIN_BTVA_STATIC7_NORMALMASS_BOUNDED_PANEL_V1"
          assert p["target"]["normal_mass"]==112
          assert p["target"]["exceptional_mass"]==8
          assert p["decision_problem"]["all140_pairings_nonnegative"] is True
          assert p["firewalls"]["main_pruning_credit"] is False
          assert p["firewalls"]["known_32_plane_conics_closed"] is False
          assert p["firewalls"]["merge_authorized"] is False
          print(json.dumps({"summary":p["summary"],"canonical":p["canonical_sha256_without_this_field"]},sort_keys=True))
          PY

      - name: Upload V44 BTVA normalmass bounded evidence
        if: steps.btva_normalmass_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage32-main-btva-static7-normalmass-bounded-panel
          path: ${{ runner.temp }}/btva-static7-normalmass-panel.json
          retention-days: 7
          compression-level: 9

      - name: Gate V44 BTVA static7 key census runkey
        id: btva_key_census_gate
        shell: bash
        run: |
          set -euo pipefail
          runkey="stages/stage32/management/btva-compressed-lift/runkeys/V44-BTVA-STATIC7-KEY-CENSUS.json"
          if [ ! -f "$runkey" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^ HEAD)"
          if ! printf '%s\n' "$changed" | grep -Fxq "$runkey"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - "$runkey" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p["schema"]=="STAGE32_MAIN_BTVA_STATIC7_KEY_CENSUS_RUNKEY_V1"
          assert p["generation"]==1
          assert p["armed"] is True
          assert p["row_id"]=="g0-d008"
          assert p["degree"]==8 and p["exceptional_mass"]==8
          assert p["authority_bound"]=="157570677819451133507"
          assert p["zero_credit"] is True
          assert p["merge_authorized"] is False
          PY
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/run_btva_static7_key_census.py)" = "111796cc524925487b3ff8e8c6e651a89efc0339"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Run V44 BTVA static7 exact key census
        if: steps.btva_key_census_gate.outputs.run == 'true'
        run: |
          python stages/stage32/management/btva-compressed-lift/run_btva_static7_key_census.py \
            --output "$RUNNER_TEMP/btva-static7-key-census.json"

      - name: Validate V44 BTVA static7 key census
        if: steps.btva_key_census_gate.outputs.run == 'true'
        run: |
          python - "$RUNNER_TEMP/btva-static7-key-census.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p["schema"]=="STAGE32_MAIN_BTVA_STATIC7_KEY_CENSUS_V1"
          assert p["target"]["row_id"]=="g0-d008"
          assert p["target"]["terminal_count"]==1278934
          assert p["factorization"]["full_terminal_materialization_performed"] is False
          assert p["factorization"]["reconstructed_terminal_mass"]==1278934
          assert p["firewalls"]["main_pruning_credit"] is False
          assert p["firewalls"]["merge_authorized"] is False
          print(json.dumps({
              "base4_keys":len(p["base4_keys"]),
              "static7_keys":p["factorization"]["static7_key_count"],
              "canonical":p["canonical_sha256_without_this_field"]
          },sort_keys=True))
          PY

      - name: Upload V44 BTVA static7 key census
        if: steps.btva_key_census_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage32-main-btva-static7-key-census
          path: ${{ runner.temp }}/btva-static7-key-census.json
          retention-days: 7
          compression-level: 9

      - name: Gate V44 BTVA base4 bounded runkey
        id: btva_base4_gate
        shell: bash
        run: |
          set -euo pipefail
          runkey="stages/stage32/management/btva-compressed-lift/runkeys/V44-BTVA-BASE4-NORMALMASS.json"
          if [ ! -f "$runkey" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^ HEAD)"
          if ! printf '%s\n' "$changed" | grep -Fxq "$runkey"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - "$runkey" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p["schema"]=="STAGE32_MAIN_BTVA_BASE4_NORMALMASS_RUNKEY_V1"
          assert p["generation"]==1
          assert p["armed"] is True
          assert p["row_id"]=="g0-d008"
          assert p["degree"]==8 and p["exceptional_mass"]==8 and p["normal_mass"]==112
          assert p["authority_bound"]=="157570677819451133507"
          assert p["zero_credit"] is True
          assert p["merge_authorized"] is False
          PY
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/run_btva_base4_normalmass_bounded_panel.py)" = "29114c0cd8a2c604d24b2a9ad3418fc2b5200171"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Install V44 BTVA base4 solver dependencies
        if: steps.btva_base4_gate.outputs.run == 'true'
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'

      - name: Run V44 BTVA base4 normalmass bounded panel
        if: steps.btva_base4_gate.outputs.run == 'true'
        run: |
          python stages/stage32/management/btva-compressed-lift/run_btva_base4_normalmass_bounded_panel.py \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --lane178-root .stage32-178-btva-source \
            --solver-timeout-ms 10000 \
            --max-flat-cuts 32 \
            --output "$RUNNER_TEMP/btva-base4-normalmass-panel.json"

      - name: Validate V44 BTVA base4 zero-credit result
        if: steps.btva_base4_gate.outputs.run == 'true'
        run: |
          python - "$RUNNER_TEMP/btva-base4-normalmass-panel.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p["schema"]=="STAGE32_MAIN_BTVA_BASE4_NORMALMASS_BOUNDED_PANEL_V1"
          assert p["target"]["base4_total_population"]==343
          assert p["target"]["x4_values_per_base4"]==113
          assert p["target"]["terminal_total_population"]==1278934
          assert p["decision_problem"]["x4_existential"] is True
          assert p["firewalls"]["main_pruning_credit"] is False
          assert p["firewalls"]["merge_authorized"] is False
          print(json.dumps({"summary":p["summary"],"canonical":p["canonical_sha256_without_this_field"]},sort_keys=True))
          PY

      - name: Upload V44 BTVA base4 bounded evidence
        if: steps.btva_base4_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage32-main-btva-base4-normalmass-bounded-panel
          path: ${{ runner.temp }}/btva-base4-normalmass-panel.json
          retention-days: 7
          compression-level: 9

      - name: Gate V44 BTVA full343 runkey
        id: btva_full343_gate
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          runkey="stages/stage32/management/btva-compressed-lift/runkeys/V44-BTVA-BASE4-FULL343.json"
          before="${{ github.event.before }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ ! -f "$runkey" ] || [ -z "$before" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$before" || true
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$before" "$head")"
          if [ "$changed" != "$runkey" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - "$before" "$runkey" <<'PY' > /tmp/full343-auth.json
          import json,subprocess,sys
          before,path=sys.argv[1:]
          cur=json.load(open(path))
          old=json.loads(subprocess.check_output(["git","show",f"{before}:{path}"],text=True))
          assert cur["schema"]=="STAGE32_MAIN_BTVA_BASE4_FULL343_RUNKEY_V1"
          assert old["schema"]==cur["schema"]
          assert old["generation"]==0 and old["armed"] is False
          assert cur["generation"]==1 and cur["armed"] is True
          assert cur["carry_run_id"] is None
          assert cur["target_shards"]==list(range(8))
          assert cur["execution"]==old["execution"]
          assert cur["source_locks"]==old["source_locks"]
          assert cur["source_locks"]["preflight_blob_sha1"]=="3d5bcd158ad784f746fe47fe54816527ef63c8d4"
          assert cur["source_locks"]["worker_blob_sha1"]=="30ed066431e47105faf5aff3d8dea18d5e418d51"
          assert cur["source_locks"]["aggregator_blob_sha1"]=="d7099df483bfd12b71969ec2ae7ce7b36534122a"
          assert cur["source_locks"]["repository_main_head"]=="83ae3f66cfcbdfaaaebf149bea078d1b0ff11c49"
          assert cur["source_locks"]["authority_bound"]=="157570677819451133507"
          assert cur["execution"]["effective_concurrency"]==1
          assert cur["execution"]["logical_shards"]==8
          assert cur["execution"]["solver_timeout_ms_per_key"]==1500
          assert cur["execution"]["max_flat_cuts_per_key"]==16
          assert cur["zero_credit"] is True
          assert cur["merge_authorized"] is False
          print(json.dumps({"run":True,"targets":cur["target_shards"]},sort_keys=True))
          PY
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/BTVA-BASE4-FULL343-SCALEOUT-PREFLIGHT.json)" = "3d5bcd158ad784f746fe47fe54816527ef63c8d4"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/run_btva_base4_full343_shard.py)" = "30ed066431e47105faf5aff3d8dea18d5e418d51"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/aggregate_btva_base4_full343.py)" = "d7099df483bfd12b71969ec2ae7ce7b36534122a"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Install V44 full343 solver dependencies
        if: steps.btva_full343_gate.outputs.run == 'true'
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'

      - name: Run V44 full343 exact shards sequentially
        id: btva_full343_run
        if: steps.btva_full343_gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/btva-full343-shards
          for shard in 0 1 2 3 4 5 6 7; do
            out="/tmp/btva-full343-shards/btva-base4-full343-shard-$shard.json"
            python stages/stage32/management/btva-compressed-lift/run_btva_base4_full343_shard.py \
              --retained stages/stage33/33-07/picard_base_rows_retained.py \
              --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
              --lane178-root .stage32-178-btva-source \
              --shard-index "$shard" \
              --shard-count 8 \
              --solver-timeout-ms 1500 \
              --max-flat-cuts 16 \
              --output "$out"
            test "$(stat -c %s "$out")" -le 262144
          done

      - name: Preserve V44 full343 shard bundle
        if: always() && steps.btva_full343_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stage32-main-btva-base4-full343-shards
          path: /tmp/btva-full343-shards
          retention-days: 1
          compression-level: 9
          if-no-files-found: warn

      - name: Aggregate V44 full343 exact coverage
        if: steps.btva_full343_gate.outputs.run == 'true' && steps.btva_full343_run.conclusion == 'success'
        run: |
          python stages/stage32/management/btva-compressed-lift/aggregate_btva_base4_full343.py \
