name: Stage32 MAIN startup authority

# Trigger lifecycle: ACTIVE_AUTO — Stage32 startup/authority/coordination safety gate
# Current boundary: V25 H8C-03A consumed; replacement-head hostile re-audit required.
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/stage32-main-startup-authority.yml'
      - 'stages/stage32/COMMANDS.md'
      - 'stages/stage32/MAIN-START-HERE.md'
      - 'stages/stage32/MAIN-STATE.json'
      - 'stages/stage32/verify_command_surface.py'
      - 'stages/stage32/verify_main_startup.py'
      - 'stages/stage32/verify_main_startup_authority_v*.py'
      - 'stages/stage32/management/**'
      - 'stages/stage32/proof/**'
      - 'stages/stage32/32-01-178/MAIN-START-HERE.md'
      - 'stages/stage32/32-01-178/hpadj-08_cut/**'
      - 'stages/stage32/final-chain/32-02-effectivity/**'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
      - 'stages/stage32/full178-cut/**'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_indexer.py'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_family.py'
      - 'stages/stage32/final-chain/32-03-multibranch/MISSION.json'
      - 'stages/stage32/final-chain/32-03-multibranch/MAIN-START-HERE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-main-startup-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Checkout exact pre-V25 MAIN authority
        uses: actions/checkout@v4
        with:
          ref: c6284abbb29930255892d56f800da0ea1e34734b
          path: .stage32-pre-v25-main
          fetch-depth: 1
      - name: Assert exact pre-V25 MAIN authority
        run: test "$(git -C .stage32-pre-v25-main rev-parse HEAD)" = "c6284abbb29930255892d56f800da0ea1e34734b"

      - name: Checkout hostile-audited V24 HPADJ07 boundary
        uses: actions/checkout@v4
        with:
          ref: 3c5915dee248660a2821f2ebe9c24e20b0ad1647
          path: .stage32-audited-hpadj07-v24
          fetch-depth: 1
      - name: Assert hostile-audited V24 HPADJ07 boundary
        run: test "$(git -C .stage32-audited-hpadj07-v24 rev-parse HEAD)" = "3c5915dee248660a2821f2ebe9c24e20b0ad1647"

      - name: Resolve research freshness authority
        if: github.event_name == 'pull_request'
        run: |
          expected_current_main="c6284abbb29930255892d56f800da0ea1e34734b"
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"
          test "$current_main" = "$expected_current_main"
          test "$(git -C .stage32-pre-v25-main rev-parse HEAD)" = "$expected_current_main"
          git merge-base --is-ancestor "$current_main" HEAD
          test "$merge_base" = "$current_main"
          echo "research_freshness=CLEAR_CURRENT_MAIN_INTEGRATED"
          echo "merge_ready_freshness=CLEAR_CURRENT_MAIN_INTEGRATED"

      - name: Verify exact pre-V25 V24 source identities
        run: |
          test "$(git -C .stage32-pre-v25-main hash-object stages/stage32/MAIN-STATE.json)" = "b8df16056625db5fbb1947f1e927593de258f1ff"
          test "$(git -C .stage32-pre-v25-main hash-object stages/stage32/verify_main_startup.py)" = "456dbb6bfba1e9e86df53adcf2d0d61b28222311"
          test "$(git -C .stage32-pre-v25-main hash-object stages/stage32/verify_main_startup_authority_v24_synced.py)" = "874689f538eda37aee53a2022eb85b65afdcca2c"
          test "$(git -C .stage32-pre-v25-main hash-object stages/stage32/management/hpadj-07/HPADJ07-V24-HOSTILE-AUDIT-PASS-SYNC.json)" = "37a1d7ed1af5d715220fd3c78e292f84eecbca72"
          test "$(git -C .stage32-pre-v25-main hash-object stages/stage32/management/hpadj-07/verify_hpadj07_v24_audit_sync.py)" = "2b57cecea5ac7b7e985ea07e6185f8ce9e780a08"
          test "$(git -C .stage32-pre-v25-main hash-object stages/stage32/proof/CLAIM-REGISTRY.json)" = "f3a884adc1c82aace81cb73d049ff14720ace862"
          test "$(git -C .stage32-pre-v25-main hash-object stages/stage32/proof/ACTIVE-FRONTIER.json)" = "4c251be4aa5c355481fe3bcfc71c292fb6389ba4"
          test "$(git -C .stage32-pre-v25-main hash-object stages/stage32/proof/LANE-ADAPTERS.json)" = "c0ef34e5838e27046a20fed77063593009c56f40"
          test "$(git -C .stage32-pre-v25-main hash-object stages/stage32/proof/verify_cross_lane_demands.py)" = "a61e78f64a16b9761888c3a31f71a679c9b91d80"

      - name: Reverify hostile-audited V24 predecessor startup boundary
        run: python .stage32-audited-hpadj07-v24/stages/stage32/verify_main_startup.py

      - name: Reverify exact pre-V25 V24 MAIN startup boundary
        working-directory: .stage32-pre-v25-main
        run: python stages/stage32/verify_main_startup.py

      - name: Verify frozen GRF-02 selected64 projected symbolic kernel
        run: python stages/stage32/management/global-residual-feasibility/verify_grf02_projected_kernel.py

      - name: Verify GRF-03 norm-ladder residue collapse no-go
        run: python stages/stage32/management/global-residual-feasibility/verify_grf03_norm_ladder_residue_collapse.py

      - name: Verify H8C-03A current-V24 overlap and double-charge rebase
        run: >-
          python stages/stage32/32-01-178/hpadj-08_cut/verify_h8c03a_current_v24_rebase.py
          --pre-v25-root .stage32-pre-v25-main

      - name: Verify H8C-03A V25 MAIN consumption
        run: >-
          python stages/stage32/32-01-178/hpadj-08_cut/verify_h8c03a_v25_main_consumption.py
          --pre-v25-root .stage32-pre-v25-main

      - name: Verify H8C-03A V25 claim-DAG synchronization checkpoint
        run: python stages/stage32/32-01-178/hpadj-08_cut/verify_h8c03a_v25_claim_sync.py

      - name: Verify Stage32 MAIN V25 startup authority
        run: python stages/stage32/verify_main_startup.py
      - name: Verify Stage32 cross-lane demand coordination at V25
        run: python stages/stage32/proof/verify_cross_lane_demands.py
      - name: Verify Stage32 final-chain 32-02 retained surface invariant source lock
        run: python stages/stage32/final-chain/32-02-effectivity/verify_surface_invariant_source_lock.py
      - name: Verify Stage32 final-chain 32-02 source-locked RR effectivity classifier
        run: python stages/stage32/final-chain/32-02-effectivity/verify_rr_effectivity_sufficient.py
      - name: Verify Stage32 claim-DAG integrity at V25
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify Stage32 active frontier at V25
        run: python stages/stage32/proof/verify_stage32_active_frontier.py

      - name: Enforce startup-only scope
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          for forbidden in stages/stage32/controller.json stages/stage32/residual-32-01-production/state.json stages/stage32/runkeys/residual32-01-full178-production.json; do
            if printf '%s\n' "$changed" | grep -qx "$forbidden"; then
              echo "startup authority PR must not modify legacy detailed file: $forbidden"
              exit 1
            fi
          done
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=-blank-at-eof diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
