name: Stage32 MAIN startup authority

# Trigger lifecycle: ACTIVE_AUTO — Stage32 startup/authority/coordination safety gate
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/stage32-main-startup-authority.yml'
      - 'stages/stage32/COMMANDS.md'
      - 'stages/stage32/MAIN-START-HERE.md'
      - 'stages/stage32/MAIN-STATE.json'
      - 'stages/stage32/verify_command_surface.py'
      - 'stages/stage32/verify_main_startup.py'
      - 'stages/stage32/verify_main_startup_authority_v*.py'
      - 'stages/stage32/management/**'
      - 'stages/stage32/proof/**'
      - 'stages/stage32/32-01-178/MAIN-START-HERE.md'
      - 'stages/stage32/final-chain/32-02-effectivity/**'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
      - 'stages/stage32/full178-cut/**'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_indexer.py'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_family.py'
      - 'stages/stage32/final-chain/32-03-multibranch/MISSION.json'
      - 'stages/stage32/final-chain/32-03-multibranch/MAIN-START-HERE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-main-startup-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Checkout hostile-audited MAIN V21 predecessor
        uses: actions/checkout@v4
        with:
          ref: 62768270a39b23c358f11b3a75bccae5d7cea0f6
          path: .stage32-audited-main-v21
          fetch-depth: 1
      - name: Assert hostile-audited MAIN V21 head
        run: test "$(git -C .stage32-audited-main-v21 rev-parse HEAD)" = "62768270a39b23c358f11b3a75bccae5d7cea0f6"
      - name: Checkout hostile-audited CUT193
        uses: actions/checkout@v4
        with:
          ref: 5b2ebb3f67805eddefef835878ba4b9744bfdbd9
          path: .stage32-audited-cut193
          fetch-depth: 1
      - name: Assert hostile-audited CUT193 head
        run: test "$(git -C .stage32-audited-cut193 rev-parse HEAD)" = "5b2ebb3f67805eddefef835878ba4b9744bfdbd9"
      - name: Checkout hostile-audited CUT197
        uses: actions/checkout@v4
        with:
          ref: adce53dc9004c24bffb3ba9f88e9d5d6e51cf6a5
          path: .stage32-audited-cut197
          fetch-depth: 1
      - name: Assert hostile-audited CUT197 head
        run: test "$(git -C .stage32-audited-cut197 rev-parse HEAD)" = "adce53dc9004c24bffb3ba9f88e9d5d6e51cf6a5"
      - name: Checkout hostile-audited CUT198
        uses: actions/checkout@v4
        with:
          ref: 16e439bc65e723c9f2658c274d53fb839738dcd2
          path: .stage32-audited-cut198
          fetch-depth: 1
      - name: Assert hostile-audited CUT198 head
        run: test "$(git -C .stage32-audited-cut198 rev-parse HEAD)" = "16e439bc65e723c9f2658c274d53fb839738dcd2"
      - name: Checkout hostile-audited N357 composition basis
        uses: actions/checkout@v4
        with:
          ref: 0bdc3b952b35ea3201d8619f21a3df7a3015ff85
          path: .stage32-audited-n357-composition
          fetch-depth: 1
      - name: Assert hostile-audited N357 composition head
        run: test "$(git -C .stage32-audited-n357-composition rev-parse HEAD)" = "0bdc3b952b35ea3201d8619f21a3df7a3015ff85"
      - name: Checkout hostile-audited EX5 BC2-35 cross-lane basis
        uses: actions/checkout@v4
        with:
          ref: 8bea7a6be26e01db0deb138dbd8406f578447921
          path: .stage32-audited-ex5-bc2-35
          fetch-depth: 1
      - name: Assert hostile-audited EX5 BC2-35 head
        run: test "$(git -C .stage32-audited-ex5-bc2-35 rev-parse HEAD)" = "8bea7a6be26e01db0deb138dbd8406f578447921"
      - name: Resolve research freshness authority
        if: github.event_name == 'pull_request'
        run: |
          baseline="e4d3b8b83626526ffeccdbd9c956081735fe1a6e"
          expected_current_main="62ca8fdf5ff71eeb4e5c1dc062df0ecc9024bc58"
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"
          test "$current_main" = "$expected_current_main"
          test "$(git merge-base "$baseline" "$current_main")" = "$baseline"
          drift="$(git diff --name-only "$baseline" "$current_main")"
          printf 'main_drift_paths=%s\n' "$drift"
          test "$drift" = "x"
          test "$merge_base" = "$baseline"
          echo "research_freshness=CLEAR_UNRELATED_MAIN_DRIFT"
          echo "merge_ready_freshness=PENDING_BEHIND_MAIN"
      - name: Verify V22 verifier source identities
        run: |
          test "$(git hash-object stages/stage32/verify_main_startup.py)" = "f350165a194fa02f29f6aed4dc283d3e6e744b56"
          test "$(git hash-object stages/stage32/verify_main_startup_authority_v22.py)" = "708482de47be700bb81f80e464554b60c4404514"
          test "$(git hash-object stages/stage32/management/verify_cut193_cut197_cut198_current_v21_batch_composition.py)" = "286abb04bb5c898c28187f4824311bdf779ef3f2"
          test "$(git hash-object stages/stage32/proof/verify_cross_lane_demands.py)" = "417e809b24e39fcf49e21aef2a653750765e675b"
          test "$(git hash-object stages/stage32/management/cross-lane-hnf-syndrome/hnf_syndrome_compression_probe.py)" = "6dc96469a173571753ca8ce3e6556b182db56387"
      - name: Verify CUT193 CUT197 CUT198 batch current-V21 composition fail-closed
        run: >-
          python3 stages/stage32/management/verify_cut193_cut197_cut198_current_v21_batch_composition.py
          --audited-main-v21-root .stage32-audited-main-v21
          --audited-cut193-root .stage32-audited-cut193
          --audited-cut197-root .stage32-audited-cut197
          --audited-cut198-root .stage32-audited-cut198
          --audited-n357-composition-root .stage32-audited-n357-composition
      - name: Probe cross-lane HNF syndrome compression
        run: |
          python3 stages/stage32/management/cross-lane-hnf-syndrome/hnf_syndrome_compression_probe.py \
            --audited-ex5-root .stage32-audited-ex5-bc2-35 \
            --json-output /tmp/stage32-hnf-syndrome-probe.json
          cat /tmp/stage32-hnf-syndrome-probe.json
      - name: Verify Stage32 MAIN startup authority
        run: python3 stages/stage32/verify_main_startup.py
      - name: Verify Stage32 cross-lane demand coordination
        run: python3 stages/stage32/proof/verify_cross_lane_demands.py
      - name: Verify Stage32 final-chain 32-02 retained surface invariant source lock
        run: python3 stages/stage32/final-chain/32-02-effectivity/verify_surface_invariant_source_lock.py
      - name: Verify Stage32 final-chain 32-02 source-locked RR effectivity classifier
        run: python3 stages/stage32/final-chain/32-02-effectivity/verify_rr_effectivity_sufficient.py
      - name: Verify Stage32 claim-DAG integrity after V22 batch CUT transition
        run: python3 stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify Stage32 active frontier after V22 batch CUT transition
        run: python3 stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Enforce startup-only scope
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          for forbidden in stages/stage32/controller.json stages/stage32/residual-32-01-production/state.json stages/stage32/runkeys/residual32-01-full178-production.json; do
            if printf '%s\n' "$changed" | grep -qx "$forbidden"; then
              echo "startup authority PR must not modify legacy detailed file: $forbidden"
              exit 1
            fi
          done
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=-blank-at-eof diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
