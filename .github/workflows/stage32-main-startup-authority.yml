name: Stage32 MAIN startup authority

# Trigger lifecycle: ACTIVE_AUTO — Stage32 startup/authority/coordination safety gate
# Current boundary: V34 synchronizes hostile-audited V33 HPADJ11 authority with zero new pruning; FULL178 resumes.
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/stage32-main-startup-authority.yml'
      - 'stages/stage32/COMMANDS.md'
      - 'stages/stage32/MAIN-START-HERE.md'
      - 'stages/stage32/MAIN-STATE.json'
      - 'stages/stage32/verify_command_surface.py'
      - 'stages/stage32/verify_main_startup.py'
      - 'stages/stage32/verify_main_startup_authority_v*.py'
      - 'stages/stage32/management/**'
      - 'stages/stage32/proof/**'
      - 'stages/stage32/32-01-178/MAIN-START-HERE.md'
      - 'stages/stage32/final-chain/32-02-effectivity/**'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
      - 'stages/stage32/full178-cut/**'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_indexer.py'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_family.py'
      - 'stages/stage32/final-chain/32-03-multibranch/MISSION.json'
      - 'stages/stage32/final-chain/32-03-multibranch/MAIN-START-HERE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-main-startup-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Checkout hostile-audited V33 MAIN boundary
        uses: actions/checkout@v4
        with:
          ref: 3c0c3b7b288853a2b5d4ebae47cc192d6089cbc6
          path: .stage32-audited-v33-main
          fetch-depth: 1
      - name: Assert hostile-audited V33 MAIN boundary
        run: test "$(git -C .stage32-audited-v33-main rev-parse HEAD)" = "3c0c3b7b288853a2b5d4ebae47cc192d6089cbc6"

      - name: Resolve research-head and merge-ready freshness separately
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"
          test -n "$merge_base"
          if git merge-base --is-ancestor "$current_main" HEAD && [ "$merge_base" = "$current_main" ]; then echo "merge_ready_freshness=CLEAR_CURRENT_MAIN_INTEGRATED"; else echo "merge_ready_freshness=PENDING_MAIN_DRIFT_REQUIRES_SEPARATE_SEMANTIC_REVIEW"; fi

      - name: Verify V34 audit-sync source identities
        run: |
          test "$(git hash-object stages/stage32/MAIN-STATE.json)" = "ec0243cb998c5c58340100d8151559516c474193"
          test "$(git hash-object stages/stage32/verify_main_startup.py)" = "6021b436e5550b68db842dd68486fe72429ab9c8"
          test "$(git hash-object stages/stage32/verify_main_startup_authority_v34_hpadj11_audit_synced.py)" = "ca9e454860207a54bd4673b055ec014a865f5acd"
          test "$(git hash-object stages/stage32/management/hpadj11-main-disposition/HPADJ11-V34-HOSTILE-AUDIT-PASS-SYNC.json)" = "0cb8f764cda214548869f24d27427acb1d611462"
          test "$(git hash-object stages/stage32/management/hpadj11-main-disposition/verify_hpadj11_v34_audit_sync.py)" = "9ae1968c82710efaec29906d8fab8337dc3f75f3"
          test "$(git hash-object stages/stage32/proof/ACTIVE-SPECIALIST-MONITOR-CONTRACT.json)" = "2d245205d2c4e597284fcefc6b5f6b43f8df7a2a"
          test "$(git hash-object stages/stage32/proof/verify_cross_lane_demands.py)" = "9d7c3ee0e74f8d32d54904faf817f1b387c1f01b"
          test "$(git hash-object stages/stage32/proof/CROSS-LANE-DEMANDS.json)" = "68a02f31431ad658b42ad695f9553c67fd6cff01"
          test "$(git hash-object stages/stage32/proof/CLAIM-REGISTRY.json)" = "f3a884adc1c82aace81cb73d049ff14720ace862"
          test "$(git hash-object stages/stage32/proof/ACTIVE-FRONTIER.json)" = "4c251be4aa5c355481fe3bcfc71c292fb6389ba4"
          test "$(git hash-object stages/stage32/proof/LANE-ADAPTERS.json)" = "c0ef34e5838e27046a20fed77063593009c56f40"
          test "$(git -C .stage32-audited-v33-main hash-object stages/stage32/MAIN-STATE.json)" = "d67244969defc7da77dfc431346e0d045da0978d"

      - name: Reverify hostile-audited V33 MAIN boundary
        run: python .stage32-audited-v33-main/stages/stage32/verify_main_startup.py
      - name: Verify HPADJ11 V34 hostile-audit synchronization
        run: python stages/stage32/management/hpadj11-main-disposition/verify_hpadj11_v34_audit_sync.py --audited-v33-root .stage32-audited-v33-main
      - name: Verify Stage32 MAIN V34 startup authority
        run: python stages/stage32/verify_main_startup.py
      - name: Verify Stage32 cross-lane coordination at V34
        run: python stages/stage32/proof/verify_cross_lane_demands.py
      - name: Verify Stage32 final-chain 32-02 retained surface invariant source lock
        run: python stages/stage32/final-chain/32-02-effectivity/verify_surface_invariant_source_lock.py
      - name: Verify Stage32 final-chain 32-02 source-locked RR effectivity classifier
        run: python stages/stage32/final-chain/32-02-effectivity/verify_rr_effectivity_sufficient.py
      - name: Verify Stage32 claim-DAG integrity at V34
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify Stage32 active frontier remains incomplete at V34
        run: python stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Enforce startup-only scope
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          for forbidden in stages/stage32/controller.json stages/stage32/residual-32-01-production/state.json stages/stage32/runkeys/residual32-01-full178-production.json; do
            if printf '%s\n' "$changed" | grep -qx "$forbidden"; then echo "startup authority PR must not modify legacy detailed file: $forbidden"; exit 1; fi
          done
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=-blank-at-eof diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
