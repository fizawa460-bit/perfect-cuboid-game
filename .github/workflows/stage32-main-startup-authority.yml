name: Stage32 MAIN startup authority

# Trigger lifecycle: ACTIVE_AUTO — Stage32 startup/authority/coordination safety gate
# Current boundary: V30 authority unchanged; live TD01/HPADJ10 audit-wait routing synchronized.
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/stage32-main-startup-authority.yml'
      - 'stages/stage32/COMMANDS.md'
      - 'stages/stage32/MAIN-START-HERE.md'
      - 'stages/stage32/MAIN-STATE.json'
      - 'stages/stage32/verify_command_surface.py'
      - 'stages/stage32/verify_main_startup.py'
      - 'stages/stage32/verify_main_startup_authority_v*.py'
      - 'stages/stage32/management/**'
      - 'stages/stage32/proof/**'
      - 'stages/stage32/32-01-178/MAIN-START-HERE.md'
      - 'stages/stage32/final-chain/32-02-effectivity/**'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
      - 'stages/stage32/full178-cut/**'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_indexer.py'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_family.py'
      - 'stages/stage32/final-chain/32-03-multibranch/MISSION.json'
      - 'stages/stage32/final-chain/32-03-multibranch/MAIN-START-HERE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-main-startup-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Checkout hostile-audited V29 replacement boundary
        uses: actions/checkout@v4
        with:
          ref: cfc23c7c633fa4192c281c8ba6a356ec071fc305
          path: .stage32-audited-v29-main
          fetch-depth: 1
      - name: Assert hostile-audited V29 replacement boundary
        run: test "$(git -C .stage32-audited-v29-main rev-parse HEAD)" = "cfc23c7c633fa4192c281c8ba6a356ec071fc305"

      - name: Checkout hostile-audited HPADJ08 EX5 adapter boundary
        uses: actions/checkout@v4
        with:
          ref: 36eab50192cf80ec5ed48aba40f4a56076759fea
          path: .stage32-audited-hpadj08-ex5
          fetch-depth: 1
      - name: Assert hostile-audited HPADJ08 EX5 adapter boundary
        run: test "$(git -C .stage32-audited-hpadj08-ex5 rev-parse HEAD)" = "36eab50192cf80ec5ed48aba40f4a56076759fea"

      - name: Resolve research-head and merge-ready freshness separately
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"
          test -n "$merge_base"
          if git merge-base --is-ancestor "$current_main" HEAD && [ "$merge_base" = "$current_main" ]; then
            echo "merge_ready_freshness=CLEAR_CURRENT_MAIN_INTEGRATED"
          else
            echo "merge_ready_freshness=PENDING_MAIN_DRIFT_REQUIRES_SEPARATE_SEMANTIC_REVIEW"
          fi
          echo "research_head_identity=EXACT_HEAD_CHECKED_SEPARATELY_FROM_MERGE_READY_FRESHNESS"

      - name: Verify V30 authority and live audit-wait routing source identities
        run: |
          test "$(git hash-object stages/stage32/MAIN-STATE.json)" = "76bf5e3d9d97297ff5fbee2bf4826a78d125e171"
          test "$(git hash-object stages/stage32/MAIN-START-HERE.md)" = "8eb1f518b349569d03d65bc9d21a27c2009cc3c2"
          test "$(git hash-object stages/stage32/verify_main_startup.py)" = "b645d3244b89acc638bb2137dabffaba36fd5e49"
          test "$(git hash-object stages/stage32/verify_main_startup_authority_v30_hpadj08_audit_synced.py)" = "f5892117b023879eceaa1a94f3368e9f577885dd"
          test "$(git hash-object stages/stage32/management/hpadj08-main-disposition/HPADJ08-V30-HOSTILE-AUDIT-PASS-SYNC.json)" = "45f636707149b05cbf18dd209194de515ee729f8"
          test "$(git hash-object stages/stage32/management/hpadj08-main-disposition/verify_hpadj08_v30_audit_sync.py)" = "07839c5809bd3d43f409df396484a10870718af1"
          test "$(git hash-object stages/stage32/management/hpadj08-main-disposition/HPADJ08-V29-MAIN-BOUND-REPLACEMENT.json)" = "68a01142d0af4285d2a7801bf0e6808321ee689c"
          test "$(git hash-object stages/stage32/management/hpadj08-main-disposition/HPADJ08-V29-CLAIM-SYNC.json)" = "7a98c733ee4ace141c89e40826f717f2462ebf95"
          test "$(git hash-object stages/stage32/management/hpadj08-main-disposition/verify_hpadj08_v29_main_bound_replacement.py)" = "c56fbdab6a90bd2b2603e365c261e19bc52c40e1"
          test "$(git hash-object stages/stage32/proof/CROSS-LANE-DEMANDS.json)" = "5cf674a9da2872fcea2dc1cc6e909fba59759bc2"
          test "$(git hash-object stages/stage32/proof/ACTIVE-SPECIALIST-MONITOR-CONTRACT.json)" = "213a8f4f9801f5a4f20c02ed7c74567ca7e447a9"
          test "$(git hash-object stages/stage32/proof/verify_cross_lane_demands.py)" = "4dce9ad4ad53a1dd99f4ef1a44062645e6d17d21"
          test "$(git hash-object stages/stage32/proof/CLAIM-REGISTRY.json)" = "f3a884adc1c82aace81cb73d049ff14720ace862"
          test "$(git hash-object stages/stage32/proof/ACTIVE-FRONTIER.json)" = "4c251be4aa5c355481fe3bcfc71c292fb6389ba4"
          test "$(git hash-object stages/stage32/proof/CLAIM-SYNC-CONTRACT.md)" = "bbab1b565afbd2e767fc6cc4325c5167d42919b4"
          test "$(git hash-object stages/stage32/proof/LANE-ADAPTERS.json)" = "c0ef34e5838e27046a20fed77063593009c56f40"
          test "$(git hash-object stages/stage32/verify_command_surface.py)" = "69e6c295221bf504681648b2b4e3a61115520294"

          test "$(git -C .stage32-audited-v29-main hash-object stages/stage32/MAIN-STATE.json)" = "bd663e70864d7279063fa4eea9745fdfa479346d"
          test "$(git -C .stage32-audited-v29-main hash-object stages/stage32/verify_main_startup.py)" = "f5bd5eb920b00ce3c532621abc7be8514fa871df"
          test "$(git -C .stage32-audited-v29-main hash-object stages/stage32/verify_main_startup_authority_v29_hpadj08_consumed.py)" = "5dbbe680a7c579dd498078486b693d7fc7341e6a"
          test "$(git -C .stage32-audited-v29-main hash-object stages/stage32/management/hpadj08-main-disposition/HPADJ08-V29-MAIN-BOUND-REPLACEMENT.json)" = "68a01142d0af4285d2a7801bf0e6808321ee689c"
          test "$(git -C .stage32-audited-v29-main hash-object stages/stage32/management/hpadj08-main-disposition/HPADJ08-V29-CLAIM-SYNC.json)" = "7a98c733ee4ace141c89e40826f717f2462ebf95"
          test "$(git -C .stage32-audited-v29-main hash-object stages/stage32/management/hpadj08-main-disposition/verify_hpadj08_v29_main_bound_replacement.py)" = "c56fbdab6a90bd2b2603e365c261e19bc52c40e1"
          test "$(git -C .stage32-audited-v29-main hash-object stages/stage32/proof/verify_cross_lane_demands.py)" = "a09e213bad7f86a3dcd14c0794616a4805271eaa"

          test "$(git -C .stage32-audited-hpadj08-ex5 hash-object stages/stage32-ex5/hpadj-08_ex5/CURRENT-MAIN-NO-DOUBLE-CHARGE-ADAPTER.json)" = "57bda3c27a9a2a7df2741e23a91c7a26ce3c7cc0"
          test "$(git -C .stage32-audited-hpadj08-ex5 hash-object stages/stage32-ex5/hpadj-08_ex5/verify_hpadj08_current_main_adapter.py)" = "65ed09517e1d37c318ca8c8798f10294ed5c6270"

      - name: Reverify hostile-audited HPADJ08 producer boundary
        run: python .stage32-audited-hpadj08-ex5/stages/stage32-ex5/hpadj-08_ex5/verify_hpadj08_current_main_adapter.py

      - name: Reverify hostile-audited V29 MAIN boundary
        run: python .stage32-audited-v29-main/stages/stage32/verify_main_startup.py

      - name: Verify HPADJ08 V30 hostile-audit synchronization
        run: >-
          python stages/stage32/management/hpadj08-main-disposition/verify_hpadj08_v30_audit_sync.py
          --audited-v29-root .stage32-audited-v29-main

      - name: Verify Stage32 MAIN V30 startup authority
        run: python stages/stage32/verify_main_startup.py
      - name: Verify Stage32 cross-lane demand coordination and audit waits
        run: python stages/stage32/proof/verify_cross_lane_demands.py
      - name: Verify Stage32 final-chain 32-02 retained surface invariant source lock
        run: python stages/stage32/final-chain/32-02-effectivity/verify_surface_invariant_source_lock.py
      - name: Verify Stage32 final-chain 32-02 source-locked RR effectivity classifier
        run: python stages/stage32/final-chain/32-02-effectivity/verify_rr_effectivity_sufficient.py
      - name: Verify Stage32 claim-DAG integrity at V30
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify Stage32 active frontier remains incomplete at V30
        run: python stages/stage32/proof/verify_stage32_active_frontier.py

      - name: Enforce startup-only scope
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          for forbidden in stages/stage32/controller.json stages/stage32/residual-32-01-production/state.json stages/stage32/runkeys/residual32-01-full178-production.json; do
            if printf '%s\n' "$changed" | grep -qx "$forbidden"; then
              echo "startup authority PR must not modify legacy detailed file: $forbidden"
              exit 1
            fi
          done
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=-blank-at-eof diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
