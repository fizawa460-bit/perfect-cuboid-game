name: Stage32 MAIN startup authority

# Trigger lifecycle: ACTIVE_AUTO — Stage32 startup/authority/coordination safety gate
# Current boundary: V27 consumption of hostile-audited CUT201 V26 adapter; replacement head requires hostile re-audit.
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/stage32-main-startup-authority.yml'
      - 'stages/stage32/COMMANDS.md'
      - 'stages/stage32/MAIN-START-HERE.md'
      - 'stages/stage32/MAIN-STATE.json'
      - 'stages/stage32/verify_command_surface.py'
      - 'stages/stage32/verify_main_startup.py'
      - 'stages/stage32/verify_main_startup_authority_v*.py'
      - 'stages/stage32/management/**'
      - 'stages/stage32/proof/**'
      - 'stages/stage32/32-01-178/MAIN-START-HERE.md'
      - 'stages/stage32/final-chain/32-02-effectivity/**'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
      - 'stages/stage32/full178-cut/**'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_indexer.py'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_family.py'
      - 'stages/stage32/final-chain/32-03-multibranch/MISSION.json'
      - 'stages/stage32/final-chain/32-03-multibranch/MAIN-START-HERE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-main-startup-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Checkout predecessor V26 MAIN boundary
        uses: actions/checkout@v4
        with:
          ref: 41f57132ca18d0b002e94d397210ac0c65e00f2e
          path: .stage32-v26-main
          fetch-depth: 1
      - name: Assert predecessor V26 MAIN boundary
        run: test "$(git -C .stage32-v26-main rev-parse HEAD)" = "41f57132ca18d0b002e94d397210ac0c65e00f2e"

      - name: Checkout hostile-audited V25 replacement boundary
        uses: actions/checkout@v4
        with:
          ref: f80b2c87979a980716c9fa3c9b2649f168e0fff8
          path: .stage32-audited-v25-main
          fetch-depth: 1
      - name: Assert hostile-audited V25 replacement boundary
        run: test "$(git -C .stage32-audited-v25-main rev-parse HEAD)" = "f80b2c87979a980716c9fa3c9b2649f168e0fff8"

      - name: Checkout pre-N400 MAIN authority boundary
        uses: actions/checkout@v4
        with:
          ref: 23a6512e0e14b98439e4c04d0c4367fb779359a5
          path: .stage32-pre-n400-main
          fetch-depth: 1
      - name: Assert pre-N400 MAIN authority boundary
        run: test "$(git -C .stage32-pre-n400-main rev-parse HEAD)" = "23a6512e0e14b98439e4c04d0c4367fb779359a5"

      - name: Checkout hostile-audited N400 producer boundary
        uses: actions/checkout@v4
        with:
          ref: b1a950cbc6edf3cb85e1ea79473105c6f1f67b03
          path: .stage32-audited-n400
          fetch-depth: 1
      - name: Assert hostile-audited N400 producer boundary
        run: test "$(git -C .stage32-audited-n400 rev-parse HEAD)" = "b1a950cbc6edf3cb85e1ea79473105c6f1f67b03"

      - name: Checkout N400 source-locked current MAIN root
        uses: actions/checkout@v4
        with:
          ref: 117310b6a9d40273683cab8c08cc9e5e0cc584d9
          path: .stage32-n400-current-main
          fetch-depth: 1
      - name: Assert N400 source-locked current MAIN root
        run: test "$(git -C .stage32-n400-current-main rev-parse HEAD)" = "117310b6a9d40273683cab8c08cc9e5e0cc584d9"

      - name: Checkout source-locked CUT201 boundary
        uses: actions/checkout@v4
        with:
          ref: 118c1df8f33759cc2e4da7e53fb8c8d7463a5bb0
          path: .stage32-cut201
          fetch-depth: 1
      - name: Assert source-locked CUT201 boundary
        run: test "$(git -C .stage32-cut201 rev-parse HEAD)" = "118c1df8f33759cc2e4da7e53fb8c8d7463a5bb0"

      - name: Checkout hostile-audited CUT201 V26 adapter boundary
        uses: actions/checkout@v4
        with:
          ref: 9b485b4e643b7ed041629547fdb4a867e31c00cd
          path: .stage32-audited-cut201-v26
          fetch-depth: 1
      - name: Assert hostile-audited CUT201 V26 adapter boundary
        run: test "$(git -C .stage32-audited-cut201-v26 rev-parse HEAD)" = "9b485b4e643b7ed041629547fdb4a867e31c00cd"

      - name: Resolve research-head and merge-ready freshness separately
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"
          test -n "$merge_base"
          if git merge-base --is-ancestor "$current_main" HEAD && [ "$merge_base" = "$current_main" ]; then
            echo "merge_ready_freshness=CLEAR_CURRENT_MAIN_INTEGRATED"
          else
            echo "merge_ready_freshness=PENDING_MAIN_DRIFT_REQUIRES_SEPARATE_SEMANTIC_REVIEW"
          fi
          echo "research_head_identity=EXACT_HEAD_CHECKED_SEPARATELY_FROM_MERGE_READY_FRESHNESS"

      - name: Verify V27 CUT201 consumption source identities
        run: |
          test "$(git hash-object stages/stage32/MAIN-STATE.json)" = "399221dc91733b3a9a2d79ae3473ea2365e409a3"
          test "$(git hash-object stages/stage32/MAIN-START-HERE.md)" = "8eb1f518b349569d03d65bc9d21a27c2009cc3c2"
          test "$(git hash-object stages/stage32/verify_main_startup.py)" = "f3ecce3c7600b08ca8b2065999d9708e9df20017"
          test "$(git hash-object stages/stage32/verify_main_startup_authority_v27_cut201_consumed.py)" = "f51e153b572147707d20280062e1b11d56317b05"
          test "$(git hash-object stages/stage32/management/cut201-main-disposition/CUT201-V27-MAIN-CONSUMPTION.json)" = "cdd766cae064430bb1aa901f1d023fcb48b39877"
          test "$(git hash-object stages/stage32/management/cut201-main-disposition/verify_cut201_g11_v26_main_disposition.py)" = "295d1bae9fbaa0dce183e71159505be90d53c030"
          test "$(git hash-object stages/stage32/management/cut201-main-disposition/verify_cut201_v26_main_consumption_preflight.py)" = "669b3bdbe43d8bf9f56f136af18db7ab44d8f839"
          test "$(git hash-object stages/stage32/proof/CROSS-LANE-DEMANDS.json)" = "e14bea1a62ec287710064a96f80abe57f8b0c3f4"
          test "$(git hash-object stages/stage32/proof/ACTIVE-SPECIALIST-MONITOR-CONTRACT.json)" = "53f286f78574cfad59fc397a9d3268d345331594"
          test "$(git hash-object stages/stage32/proof/verify_cross_lane_demands.py)" = "49d5ec492b5ed336a7602c8dd598a9dc85e64d96"
          test "$(git hash-object stages/stage32/proof/PICARD64-PARITY-CROSS-LANE-SYNTHESIS-V1.json)" = "e41ee562f8a940ad5041d2d5e64228f2ada7a207"
          test "$(git hash-object stages/stage32/proof/CLAIM-REGISTRY.json)" = "f3a884adc1c82aace81cb73d049ff14720ace862"
          test "$(git hash-object stages/stage32/proof/ACTIVE-FRONTIER.json)" = "4c251be4aa5c355481fe3bcfc71c292fb6389ba4"
          test "$(git hash-object stages/stage32/proof/CLAIM-SYNC-CONTRACT.md)" = "bbab1b565afbd2e767fc6cc4325c5167d42919b4"
          test "$(git hash-object stages/stage32/proof/LANE-ADAPTERS.json)" = "c0ef34e5838e27046a20fed77063593009c56f40"
          test "$(git hash-object stages/stage32/verify_command_surface.py)" = "69e6c295221bf504681648b2b4e3a61115520294"
          test "$(git hash-object stages/stage32/management/n400-main-consumption/N400-V26-HOSTILE-AUDIT-PASS-SYNC.json)" = "8f0603116bb3bb0e203651ecfb07c8e0bbe6c3f0"
          test "$(git hash-object stages/stage32/management/n400-main-consumption/verify_n400_v26_audit_sync.py)" = "1145f1fe16048130164556754a2b4ae35cab45af"
          test "$(git hash-object stages/stage32/management/n400-main-consumption/N400-HOSTILE-AUDIT-PASS-RECEIPT.json)" = "c43a50a417cb62228860c0c230a27110939ed6e7"
          test "$(git hash-object stages/stage32/management/n400-main-consumption/N400-V25-MAIN-CONSUMPTION.json)" = "e0eb8e7d0364dc11df0568d7bbd820488cd44678"
          test "$(git hash-object stages/stage32/management/n400-main-consumption/verify_n400_v25_main_consumption.py)" = "69413a17e31758e2c49aa56e5778c8694cbaa4a9"
          test "$(git -C .stage32-audited-cut201-v26 hash-object stages/stage32/full178-cut/CUT201-V26-current-authority-adapter-handoff.json)" = "a4a5bad33e552e121ad83e8777641121375aeb94"
          test "$(git -C .stage32-audited-cut201-v26 hash-object stages/stage32/full178-cut/verify_cut201_v26_current_authority_adapter.py)" = "fb219371c3d80471b087c5057aa0584af3474b92"

      - name: Reverify predecessor V26 N400 hostile-audit synchronization
        run: >-
          python .stage32-v26-main/stages/stage32/management/n400-main-consumption/verify_n400_v26_audit_sync.py
          --audited-v25-root .stage32-audited-v25-main

      - name: Verify retained N400 audited producer replay
        run: >-
          python .stage32-audited-n400/stages/stage32/32-01-178/nodes/N400/verify_n400_n399_compact_main_consumption_handoff.py
          --current-main-root .stage32-n400-current-main

      - name: Reverify hostile-audited V25 N400 MAIN consumption and no-double-charge
        run: >-
          python .stage32-audited-v25-main/stages/stage32/management/n400-main-consumption/verify_n400_v25_main_consumption.py
          --predecessor-main-root .stage32-pre-n400-main
          --n400-audited-root .stage32-audited-n400

      - name: Reverify pre-N400 V24 MAIN startup boundary
        run: python .stage32-pre-n400-main/stages/stage32/verify_main_startup.py

      - name: Verify retained GRF source identities
        run: |
          test "$(git hash-object stages/stage32/management/global-residual-feasibility/derive_grf02_selected64_projected_kernel.py)" = "05b5c5134261c4d35c3433d509d4968c820dc227"
          test "$(git hash-object stages/stage32/management/global-residual-feasibility/GRF-02-PROJECTED-KERNEL.json)" = "7c1cda07749fbfb90245995d1def2ae96fb5604b"
          test "$(git hash-object stages/stage32/management/global-residual-feasibility/verify_grf02_projected_kernel.py)" = "6c61d66a91bb6beeb2ad29165a269f5c98e20ad0"
          test "$(git hash-object stages/stage32/management/global-residual-feasibility/GRF-03-NORM-LADDER-RESIDUE-COLLAPSE.json)" = "d6777200cadb6809dc3b46374c8f714cb6ebd6cd"
          test "$(git hash-object stages/stage32/management/global-residual-feasibility/verify_grf03_norm_ladder_residue_collapse.py)" = "eaddc4eaa790742cc92ec0bac3043c6743f947fc"
          test "$(git hash-object stages/stage32/management/global-residual-feasibility/GRF-04-RATIONAL-QUADRATIC-LOWER-BOUND-KERNEL.json)" = "f7c1073edbf895f498fd9923e59eedf5a4e981c8"
          test "$(git hash-object stages/stage32/management/global-residual-feasibility/verify_grf04_rational_quadratic_lower_bound_kernel.py)" = "af883bd66600c626350f9e6ef4bc12c00e239f45"
          test "$(git hash-object stages/stage32/management/global-residual-feasibility/GRF-05-INTEGRAL-FINITE-QUOTIENT-LOWER-BOUND-KERNEL.json)" = "75e556dee57dff282232a57898924d7e1826a40c"
          test "$(git hash-object stages/stage32/management/global-residual-feasibility/verify_grf05_integral_finite_quotient_lower_bound_kernel.py)" = "75a92a3ec494481e89b671f4f8f6f7a9162befb8"
          test "$(git hash-object stages/stage32/management/global-residual-feasibility/GRF-08-GRF01-A-D-SYMBOLIC-SUITE-CHECKPOINT.json)" = "5a24d7a32be38e36bc00dfe004b10a4a9fe8fe3d"
          test "$(git hash-object stages/stage32/management/global-residual-feasibility/verify_grf08_grf01_a_d_symbolic_suite_checkpoint.py)" = "9e65e2cd87adb8220e1f4924f91705f1d79b003a"
          test "$(git hash-object stages/stage32/management/global-residual-feasibility/probe_grf09_e8_picard_completion_parity.py)" = "ff3c5037e720561c35fe44649f2faf4dc8c6ef8e"
          test "$(git hash-object stages/stage32/management/global-residual-feasibility/GRF-09-CUT201-E8-PICARD-PARITY-CHECKPOINT.json)" = "432a15f3c899f33e7d96cebde2247ae257318c46"
          test "$(git hash-object stages/stage32/management/global-residual-feasibility/verify_grf09_cut201_e8_picard_parity_checkpoint.py)" = "053ac2fd2fdb39c5c671c240dfa4b9717141c59d"
          test "$(git -C .stage32-cut201 hash-object stages/stage32/full178-cut/CUT201-e8-common-adapter-wave9-preflight.json)" = "87b2f139b576b3b8bddea336396c8c2da30014b1"
          test "$(git -C .stage32-cut201 hash-object stages/stage32-ex5/cut-handoff/e8_terminal_population_adapter.py)" = "6026d2c8b4a2eb69c453a2bd38c5923f46d6d74f"

      - name: Verify frozen GRF-02 selected64 projected symbolic kernel
        run: python stages/stage32/management/global-residual-feasibility/verify_grf02_projected_kernel.py
      - name: Verify GRF-03 norm-ladder residue collapse no-go
        run: python stages/stage32/management/global-residual-feasibility/verify_grf03_norm_ladder_residue_collapse.py
      - name: Verify GRF-04 rational quadratic lower-bound kernel
        run: python stages/stage32/management/global-residual-feasibility/verify_grf04_rational_quadratic_lower_bound_kernel.py
      - name: Verify GRF-05 integral finite-quotient lower-bound kernel
        run: python stages/stage32/management/global-residual-feasibility/verify_grf05_integral_finite_quotient_lower_bound_kernel.py
      - name: Verify GRF-08 GRF-01 A-D symbolic suite checkpoint
        run: python stages/stage32/management/global-residual-feasibility/verify_grf08_grf01_a_d_symbolic_suite_checkpoint.py

      - name: Install exact GRF-09 arithmetic dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Probe GRF-09 CUT201 e8 Picard completion parity compression
        run: |
          set -o pipefail
          python stages/stage32/management/global-residual-feasibility/probe_grf09_e8_picard_completion_parity.py | tee grf09-exact-output.txt
      - name: Verify GRF-09 exact parity checkpoint
        run: >-
          python stages/stage32/management/global-residual-feasibility/verify_grf09_cut201_e8_picard_parity_checkpoint.py
          --probe-output grf09-exact-output.txt

      - name: Verify historical CUT201 G11 V26 MAIN disposition remains zero-credit
        run: python stages/stage32/management/cut201-main-disposition/verify_cut201_g11_v26_main_disposition.py
      - name: Verify CUT201 V27 MAIN consumption and no-double-charge
        run: python stages/stage32/management/cut201-main-disposition/verify_cut201_v26_main_consumption_preflight.py

      - name: Verify Stage32 MAIN V27 startup authority
        run: python stages/stage32/verify_main_startup.py
      - name: Verify Stage32 cross-lane demand coordination after CUT201 V27 consumption
        run: python stages/stage32/proof/verify_cross_lane_demands.py
      - name: Verify Stage32 final-chain 32-02 retained surface invariant source lock
        run: python stages/stage32/final-chain/32-02-effectivity/verify_surface_invariant_source_lock.py
      - name: Verify Stage32 final-chain 32-02 source-locked RR effectivity classifier
        run: python stages/stage32/final-chain/32-02-effectivity/verify_rr_effectivity_sufficient.py
      - name: Verify Stage32 claim-DAG integrity after CUT201 V27 consumption
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify Stage32 active frontier remains incomplete
        run: python stages/stage32/proof/verify_stage32_active_frontier.py

      - name: Enforce startup-only scope
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          for forbidden in stages/stage32/controller.json stages/stage32/residual-32-01-production/state.json stages/stage32/runkeys/residual32-01-full178-production.json; do
            if printf '%s\n' "$changed" | grep -qx "$forbidden"; then
              echo "startup authority PR must not modify legacy detailed file: $forbidden"
              exit 1
            fi
          done
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=-blank-at-eof diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
