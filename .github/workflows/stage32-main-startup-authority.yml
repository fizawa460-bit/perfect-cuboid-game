name: Stage32 MAIN startup authority

# Trigger lifecycle: ACTIVE_AUTO — Stage32 startup/authority/coordination safety gate
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/stage32-main-startup-authority.yml'
      - 'stages/stage32/COMMANDS.md'
      - 'stages/stage32/MAIN-START-HERE.md'
      - 'stages/stage32/MAIN-STATE.json'
      - 'stages/stage32/verify_command_surface.py'
      - 'stages/stage32/verify_main_startup.py'
      - 'stages/stage32/verify_main_startup_authority_v10.py'
      - 'stages/stage32/verify_main_startup_authority_v11.py'
      - 'stages/stage32/verify_main_startup_authority_v12.py'
      - 'stages/stage32/verify_main_startup_authority_v13.py'
      - 'stages/stage32/verify_main_startup_authority_v14.py'
      - 'stages/stage32/verify_main_startup_authority_v15.py'
      - 'stages/stage32/verify_main_startup_authority_v16.py'
      - 'stages/stage32/verify_n357_v13_current_authority_composition.py'
      - 'stages/stage32/verify_n357_v13_current_authority_composition_fail_closed.py'
      - 'stages/stage32/verify_n357_main_consumption_v14.py'
      - 'stages/stage32/verify_cut195_main_consumption_v15.py'
      - 'stages/stage32/management/N357-V13-CURRENT-AUTHORITY-COMPOSITION.json'
      - 'stages/stage32/management/MAIN-STATE-V13-N357-PRECONSUMPTION.json'
      - 'stages/stage32/management/post-n357-composition-pass-consumption-20260912.json'
      - 'stages/stage32/management/post-cut195-current-v14-composition-consumption-20260912.json'
      - 'stages/stage32/management/post-cut195-v15-hostile-reaudit-pass-consumption-20260912.json'
      - 'stages/stage32/verify_cut191_main_consumption.py'
      - 'stages/stage32/proof/CROSS-LANE-DEMANDS.json'
      - 'stages/stage32/proof/CROSS-LANE-STARTUP-CONTRACT.md'
      - 'stages/stage32/proof/LANE-ADAPTERS.json'
      - 'stages/stage32/proof/verify_cross_lane_demands.py'
      - 'stages/stage32/proof/verify_cross_lane_demands_v13.py'
      - 'stages/stage32/32-01-178/MAIN-START-HERE.md'
      - 'stages/stage32/final-chain/32-02-effectivity/**'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
      - 'stages/stage32/full178-cut/CROSS-LANE-STATE.json'
      - 'stages/stage32/management/post-n356-hostile-pass-n357-checkpoint-20260911.json'
      - 'stages/stage32/management/post-cut191-hostile-pass-consumption-20260911.json'
      - 'stages/stage32/management/CUT191-MAIN-CONSUMPTION-HOSTILE-AUDIT-PASS.json'
      - 'stages/stage32/management/post-cut194-hostile-pass-consumption-20260912.json'
      - 'stages/stage32/full178-cut/CUT191-HOSTILE-AUDIT-PASS.json'
      - 'stages/stage32/full178-cut/CUT191-first-block-closure-checkpoint.json'
      - 'stages/stage32/full178-cut/CUT194-e8-common-adapter-wave2-result.json'
      - 'stages/stage32/32-01-178/nodes/N220/STATE-AUDITED.json'
      - 'stages/stage32/32-01-178/nodes/N355/FULL-PREFIX-RESULT.json'
      - 'stages/stage32/32-01-178/nodes/N356/HOSTILE-AUDIT-PASS.json'
      - 'stages/stage32/32-01-178/nodes/N356/AUDIT-HANDOFF.json'
      - 'stages/stage32/32-01-178/nodes/N356/RESULT.json'
      - 'stages/stage32/32-01-178/nodes/N356/verify_n356_dependency_source_locks.py'
      - 'stages/stage32/32-01-178/nodes/N356/verify_n356_optimistic_exceptional_transport.py'
      - 'stages/stage32/32-01-178/nodes/N356/verify_n356_optimistic_exceptional_transport_parallel.py'
      - 'stages/stage32/32-01-178/nodes/N356/verify_n356_optimistic_exceptional_transport_fast.py'
      - 'stages/stage32/32-01-178/nodes/N356-engine/**'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_indexer.py'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_family.py'
      - 'stages/stage32/full178-cut/MISSION.json'
      - 'stages/stage32/full178-cut/MAIN-START-HERE.md'
      - 'stages/stage32/final-chain/32-03-multibranch/MISSION.json'
      - 'stages/stage32/final-chain/32-03-multibranch/MAIN-START-HERE.md'
      - 'stages/stage32/proof/PR1753-INTEGRATION-AUDIT-HANDOFF.json'
      - 'stages/stage32/proof/verify_pr1753_integration_audit_handoff.py'
      - 'stages/stage32/residual-32-01-production/post1577-mod2-fiber-divisor-identity.json'
      - 'stages/stage32/residual-32-01-production/post1577-mod2-fiber-divisor-identity-source-note.md'
      - 'stages/stage32/residual-32-01-production/post1570-three-involution-q602-exclusion-batch.json'
      - 'stages/stage32/residual-32-01-production/post1484-v6-modular-factor-bidegree-source-note.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-main-startup-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Checkout exact hostile-reaudited MAIN V14 boundary
        uses: actions/checkout@v4
        with:
          ref: da1cdd5391ff7f298979ffacbb37e6f3823ba93f
          path: .stage32-audited-main-v14
          fetch-depth: 1

      - name: Assert exact hostile-reaudited MAIN V14 head
        run: test "$(git -C .stage32-audited-main-v14 rev-parse HEAD)" = "da1cdd5391ff7f298979ffacbb37e6f3823ba93f"

      - name: Checkout exact hostile-audited CUT195 boundary
        uses: actions/checkout@v4
        with:
          ref: 2618f4dcd546d569b212753ac7abc10e07ee5828
          path: .stage32-audited-cut195
          fetch-depth: 1

      - name: Assert exact hostile-audited CUT195 head
        run: test "$(git -C .stage32-audited-cut195 rev-parse HEAD)" = "2618f4dcd546d569b212753ac7abc10e07ee5828"

      - name: Checkout exact hostile-audited N357 candidate boundary
        uses: actions/checkout@v4
        with:
          ref: 0d787839b7e0dad4a42108c61d16e7849c50862f
          path: .stage32-audited-n357
          fetch-depth: 1

      - name: Assert exact hostile-audited N357 candidate head
        run: test "$(git -C .stage32-audited-n357 rev-parse HEAD)" = "0d787839b7e0dad4a42108c61d16e7849c50862f"

      - name: Checkout exact hostile-audited N357 composition boundary
        uses: actions/checkout@v4
        with:
          ref: 0bdc3b952b35ea3201d8619f21a3df7a3015ff85
          path: .stage32-audited-n357-composition
          fetch-depth: 1

      - name: Assert exact hostile-audited N357 composition head
        run: test "$(git -C .stage32-audited-n357-composition rev-parse HEAD)" = "0bdc3b952b35ea3201d8619f21a3df7a3015ff85"

      - name: Resolve freshness authority
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"

          if test "$merge_base" = "$current_main"; then
            echo "freshness=contains-current-main"
            exit 0
          fi

          reviewed_main="5ca6acba4b591d9e2d40057241c850598c1fa1df"
          previous_reviewed_main="bf2890ec0b8168f70db803de876024aa6b6d1f6d"
          reviewed_merge_base="e2da76d90a0994af5038023613c6c4084c4c507e"
          test "$current_main" = "$reviewed_main" || {
            echo "freshness review required: unreviewed main tip $current_main"
            exit 1
          }
          test "$merge_base" = "$reviewed_merge_base"
          git merge-base --is-ancestor "$previous_reviewed_main" "$reviewed_main"

          unexpected="$(git diff --name-only "$previous_reviewed_main" "$reviewed_main" | grep -Ev '^(docs/arsenal/|docs/stage32-arsenal-promotion\.md$|stages/stage32-ex5/|\.github/workflows/stage32-ex5-main\.yml$)' || true)"
          test -z "$unexpected" || {
            echo "freshness review scope violation:"
            printf '%s\n' "$unexpected"
            exit 1
          }
          echo "freshness=reviewed-ex5-arsenal-only-main-drift-no-auto-main-credit"

      - name: Verify Stage32 MAIN startup authority
        run: python3 stages/stage32/verify_main_startup.py

      - name: Verify Stage32 MAIN V16 CUT195 re-audit consumption frontier
        run: python3 stages/stage32/verify_main_startup_authority_v16.py

      - name: Verify Stage32 cross-lane demand coordination
        run: python3 stages/stage32/proof/verify_cross_lane_demands.py

      - name: Verify Stage32 final-chain 32-02 retained surface invariant source lock
        run: python3 stages/stage32/final-chain/32-02-effectivity/verify_surface_invariant_source_lock.py

      - name: Verify Stage32 final-chain 32-02 source-locked RR effectivity classifier
        run: python3 stages/stage32/final-chain/32-02-effectivity/verify_rr_effectivity_sufficient.py

      - name: Verify Stage32 claim-DAG integrity after V16 audit-consumption transition
        run: python3 stages/stage32/proof/verify_stage32_claim_dag.py --integrity

      - name: Verify Stage32 active frontier after V16 audit-consumption transition
        run: python3 stages/stage32/proof/verify_stage32_active_frontier.py

      - name: Detect edits to historical PR1753 handoff
        if: github.event_name == 'pull_request'
        id: pr1753_handoff
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- \
            stages/stage32/proof/PR1753-INTEGRATION-AUDIT-HANDOFF.json \
            stages/stage32/proof/verify_pr1753_integration_audit_handoff.py)"
          if test -n "$changed"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            printf 'historical PR1753 handoff touched:\n%s\n' "$changed"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "historical PR1753 handoff untouched"
          fi

      - name: Verify PR1753 integration-only audit handoff when touched
        if: github.event_name == 'pull_request' && steps.pr1753_handoff.outputs.changed == 'true'
        run: python3 stages/stage32/proof/verify_pr1753_integration_audit_handoff.py

      - name: Enforce startup-only scope
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          for forbidden in \
            stages/stage32/controller.json \
            stages/stage32/residual-32-01-production/state.json \
            stages/stage32/runkeys/residual32-01-full178-production.json; do
            if printf '%s\n' "$changed" | grep -qx "$forbidden"; then
              echo "startup authority PR must not modify legacy detailed file: $forbidden"
              exit 1
            fi
          done

      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=-blank-at-eof diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"