name: Stage32 MAIN startup authority

# Trigger lifecycle: ACTIVE_AUTO — Stage32 startup/authority/coordination safety gate
# Current boundary: V33 consumes hostile-audited HPADJ11 same-character upper bound; replacement MAIN head requires hostile re-audit.
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/workflows/stage32-main-startup-authority.yml'
      - 'stages/stage32/COMMANDS.md'
      - 'stages/stage32/MAIN-START-HERE.md'
      - 'stages/stage32/MAIN-STATE.json'
      - 'stages/stage32/verify_command_surface.py'
      - 'stages/stage32/verify_main_startup.py'
      - 'stages/stage32/verify_main_startup_authority_v*.py'
      - 'stages/stage32/management/**'
      - 'stages/stage32/proof/**'
      - 'stages/stage32/32-01-178/MAIN-START-HERE.md'
      - 'stages/stage32/final-chain/32-02-effectivity/**'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
      - 'stages/stage32/full178-cut/**'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_indexer.py'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_family.py'
      - 'stages/stage32/final-chain/32-03-multibranch/MISSION.json'
      - 'stages/stage32/final-chain/32-03-multibranch/MAIN-START-HERE.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage32-main-startup-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  startup-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Checkout V32 process predecessor
        uses: actions/checkout@v4
        with:
          ref: 626359a9f981313f40bbed71129f17b664e2bd49
          path: .stage32-v32
          fetch-depth: 1
      - name: Assert V32 predecessor
        run: test "$(git -C .stage32-v32 rev-parse HEAD)" = "626359a9f981313f40bbed71129f17b664e2bd49"
      - name: Checkout hostile-audited HPADJ11 producer
        uses: actions/checkout@v4
        with:
          ref: 1c694f6650125a8fb0121925beff7f800b5d6283
          path: .stage32-audited-hpadj11
          fetch-depth: 1
      - name: Assert HPADJ11 producer
        run: test "$(git -C .stage32-audited-hpadj11 rev-parse HEAD)" = "1c694f6650125a8fb0121925beff7f800b5d6283"
      - name: Resolve research-head and merge-ready freshness separately
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --no-tags
          current_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base HEAD "$current_main")"
          echo "current_main=$current_main"
          echo "merge_base=$merge_base"
          test -n "$merge_base"
          if git merge-base --is-ancestor "$current_main" HEAD && [ "$merge_base" = "$current_main" ]; then echo "merge_ready_freshness=CLEAR_CURRENT_MAIN_INTEGRATED"; else echo "merge_ready_freshness=PENDING_MAIN_DRIFT_REQUIRES_SEPARATE_SEMANTIC_REVIEW"; fi
      - name: Verify V33 source identities
        run: |
          test "$(git hash-object stages/stage32/MAIN-STATE.json)" = "d67244969defc7da77dfc431346e0d045da0978d"
          test "$(git hash-object stages/stage32/MAIN-START-HERE.md)" = "8eb1f518b349569d03d65bc9d21a27c2009cc3c2"
          test "$(git hash-object stages/stage32/verify_main_startup.py)" = "76bd66de1269401aa533f8a3e96303efea03f673"
          test "$(git hash-object stages/stage32/verify_main_startup_authority_v33_hpadj11_consumed.py)" = "e2853762a8950d5887e0e4e2c0d37496165185f1"
          test "$(git hash-object stages/stage32/management/hpadj11-main-disposition/HPADJ11-V33-MAIN-BOUND-REPLACEMENT.json)" = "6e2328f40bea32daf9ccee4c921700432dc6e369"
          test "$(git hash-object stages/stage32/management/hpadj11-main-disposition/verify_hpadj11_v33_main_bound_replacement.py)" = "29cf3f5282f903f3db5f1997840c780eb9e8d10d"
          test "$(git hash-object stages/stage32/proof/CROSS-LANE-DEMANDS.json)" = "68a02f31431ad658b42ad695f9553c67fd6cff01"
          test "$(git hash-object stages/stage32/proof/ACTIVE-SPECIALIST-MONITOR-CONTRACT.json)" = "803b7148e240b7f50aa6df33bdbafcacbcf2b46c"
          test "$(git hash-object stages/stage32/proof/verify_cross_lane_demands.py)" = "a07386860a0e7576511f7c87954b25660659e02c"
          test "$(git hash-object stages/stage32/proof/CLAIM-REGISTRY.json)" = "f3a884adc1c82aace81cb73d049ff14720ace862"
          test "$(git hash-object stages/stage32/proof/ACTIVE-FRONTIER.json)" = "4c251be4aa5c355481fe3bcfc71c292fb6389ba4"
          test "$(git hash-object stages/stage32/proof/LANE-ADAPTERS.json)" = "c0ef34e5838e27046a20fed77063593009c56f40"
          test "$(git -C .stage32-v32 hash-object stages/stage32/MAIN-STATE.json)" = "6fdcd15090d7951467675e0f732b6ce54c09d69d"
          test "$(git -C .stage32-audited-hpadj11 hash-object stages/stage32-ex5/hpadj-11_ex5/REMOVED-BLOCK-CHECKPOINT.json)" = "81abb4aa2c626ec2a77b5b1e751e99f4299c55ba"
          test "$(git -C .stage32-audited-hpadj11 hash-object stages/stage32-ex5/hpadj-11_ex5/refine_with_hpadj08_removed_blocks.py)" = "bda314b4ebbca59a209e2f4fd4d17dfc826cd17a"
      - name: Reverify V32 predecessor
        run: python .stage32-v32/stages/stage32/verify_main_startup.py
      - name: Replay HPADJ11 exact refiner
        run: python .stage32-audited-hpadj11/stages/stage32-ex5/hpadj-11_ex5/refine_with_hpadj08_removed_blocks.py > /tmp/hpadj11.json
      - name: Verify HPADJ11 V33 MAIN bound replacement
        run: python stages/stage32/management/hpadj11-main-disposition/verify_hpadj11_v33_main_bound_replacement.py --predecessor-v32-root .stage32-v32 --producer-root .stage32-audited-hpadj11
      - name: Verify Stage32 MAIN V33 startup authority
        run: python stages/stage32/verify_main_startup.py
      - name: Verify Stage32 cross-lane coordination at V33
        run: python stages/stage32/proof/verify_cross_lane_demands.py
      - name: Verify Stage32 final-chain 32-02 retained surface invariant source lock
        run: python stages/stage32/final-chain/32-02-effectivity/verify_surface_invariant_source_lock.py
      - name: Verify Stage32 final-chain 32-02 source-locked RR effectivity classifier
        run: python stages/stage32/final-chain/32-02-effectivity/verify_rr_effectivity_sufficient.py
      - name: Verify Stage32 claim-DAG integrity at V33
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify Stage32 active frontier remains incomplete at V33
        run: python stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Enforce startup-only scope
        if: github.event_name == 'pull_request'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          for forbidden in stages/stage32/controller.json stages/stage32/residual-32-01-production/state.json stages/stage32/runkeys/residual32-01-full178-production.json; do
            if printf '%s\n' "$changed" | grep -qx "$forbidden"; then echo "startup authority PR must not modify legacy detailed file: $forbidden"; exit 1; fi
          done
      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=-blank-at-eof diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
