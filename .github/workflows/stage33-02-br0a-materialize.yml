name: Stage33-02 BR0A exact materialization

on:
  pull_request:
    paths:
      - 'stages/stage33/33-02/**'
      - '.github/workflows/stage33-02-br0a-materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  br0a-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact verifier dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Run pinned exact BR0A Magma materialization
        working-directory: stages/stage33/33-02
        run: python run_magma_materialization.py
      - name: Independently verify rank, kernel, pairing, and Smith saturation data
        working-directory: stages/stage33/33-02
        run: python verify_materialization.py
      - name: Upload exact Stage33-02 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage33-02-br0a-exact
          path: |
            stages/stage33/33-02/magma-request-summary.json
            stages/stage33/33-02/magma-response.json
            stages/stage33/33-02/magma-response.xml
            stages/stage33/33-02/magma-stdout.txt
            stages/stage33/33-02/magma-http-error.txt
            stages/stage33/33-02/magma-network-error.txt
            stages/stage33/33-02/br0a-matrix-certificate.json
          if-no-files-found: warn
