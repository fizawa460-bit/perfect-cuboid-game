name: Stage35 Arsenal discovery freshness sync

on:
  push:
    branches:
      - stage35-arsenal-initial-harvest-discovery
    paths:
      - .github/workflows/stage35-arsenal-discovery-freshness-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 128

      - name: Merge audited current main without widening harvest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C stage35-arsenal-initial-harvest-discovery "$GITHUB_SHA"
          git fetch origin main --depth=128
          test "$(git rev-parse origin/main)" = "bd1f40297f8dcf79e5bb4ef0b8cdc13fdb844177"
          git merge --no-ff bd1f40297f8dcf79e5bb4ef0b8cdc13fdb844177 -m 'chore: sync Stage35 harvest discovery to current main'
          git rm .github/workflows/stage35-arsenal-discovery-freshness-sync.yml
          git commit --amend --no-edit

      - name: Exact-head freshness and frozen-scope validation
        shell: bash
        run: |
          set -euo pipefail
          FINAL=$(git rev-parse HEAD)
          echo "EXACT_DISCOVERY_FRESH_HEAD=$FINAL"
          git merge-base --is-ancestor bd1f40297f8dcf79e5bb4ef0b8cdc13fdb844177 HEAD
          git diff --check bd1f40297f8dcf79e5bb4ef0b8cdc13fdb844177 HEAD
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          old='28282d3f01a47bfedb4290c6219b36dbde89c784'
          main='bd1f40297f8dcf79e5bb4ef0b8cdc13fdb844177'
          upper='9184c7ab694415592cc428a675c0ebed27cac510'
          files={
            'docs/arsenal/stage35-initial-abstraction.json',
            'docs/arsenal/stage35-initial-discovery.json',
            'docs/arsenal/stage35-initial-discovery.md',
            'docs/arsenal/stage35-initial-hostile-dedup.json',
          }
          got=set(subprocess.check_output(['git','diff','--name-only',main,'HEAD'], text=True).splitlines())
          assert got == files, (got-files, files-got)
          for p in sorted(files):
              old_blob=subprocess.check_output(['git','rev-parse',f'{old}:{p}'], text=True).strip()
              new_blob=subprocess.check_output(['git','rev-parse',f'HEAD:{p}'], text=True).strip()
              assert old_blob == new_blob, (p, old_blob, new_blob)
          h3=json.loads(Path('docs/arsenal/stage35-initial-hostile-dedup.json').read_text())
          assert h3['frozen_bounds']['harvest_upper_bound'] == upper
          assert h3['frozen_bounds']['scope_widened'] is False
          s=h3['classification_summary']
          assert s == {'total':36,'NEW_WEAPON':5,'EXTEND_EXISTING':3,'NEW_WORKFLOW':1,'HISTORICAL_OR_NEGATIVE':9,'STAGE35_SPECIFIC':7,'REJECT_DUPLICATE':11}
          assert '9184c7ab694415592cc428a675c0ebed27cac510' in Path('docs/arsenal/stage35-initial-discovery.md').read_text()
          print('PASS_DISCOVERY_SCOPE_ASSERTION', len(got))
          print('PASS_HARVEST_UPPER_BOUND_FROZEN', upper)
          print('PASS_DISCOVERY_BLOBS_UNCHANGED_FROM_FAILED_AUDIT_HEAD', old)
          PY

      - name: Push fresh exact head
        run: git push origin HEAD:stage35-arsenal-initial-harvest-discovery
