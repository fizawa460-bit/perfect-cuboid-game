name: Stage35-EX Goal4AE C5 local c-fixed Picard extraction

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4ae_local_cfixed.py'
      - 'stages/stage35-ex/diagnose_stage35_ex_35_goal4ae_aut_source_map.py'
      - 'stages/stage35-ex/materialize_stage35_ex_35_goal4ae_local_cfixed.py'
      - 'stages/stage35-ex/runkeys/goal4ae-c5-picard-extraction.json'
      - '.github/workflows/stage35-ex-goal4ae-c5-picard-extraction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage35-ex-goal4ae-c5-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  diagnose-aut-source-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Emit bounded retained Aut generator metadata
        run: |
          set -euo pipefail
          python -B stages/stage35-ex/diagnose_stage35_ex_35_goal4ae_aut_source_map.py

  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          KEY='stages/stage35-ex/runkeys/goal4ae-c5-picard-extraction.json'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test '${{ github.event_name }}' = 'pull_request' || exit 0
          test "${PR_NUMBER}" = '1659' || exit 0
          test "${HEAD_REF}" = 'stage35-ex-goal4x-open-receiver-boundary-picard' || exit 0
          test -n "${BEFORE}" || exit 0
          git fetch --no-tags --depth=1 origin "${BEFORE}" || exit 0
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || exit 0
          git diff --name-only "${BEFORE}" "${HEAD_SHA}" | grep -Fxq "${KEY}" || exit 0
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          key=Path('stages/stage35-ex/runkeys/goal4ae-c5-picard-extraction.json')
          diag=Path('stages/stage35-ex/diagnose_stage35_ex_35_goal4ae_local_cfixed.py')
          mat=Path('stages/stage35-ex/materialize_stage35_ex_35_goal4ae_local_cfixed.py')
          new=json.loads(key.read_text())
          assert new['schema']=='STAGE35_EX_GOAL4AE_C5_PICARD_EXTRACTION_RUNKEY_V1'
          assert new['armed'] is True and new['generation']==7
          assert new['route']=='CFIXED_HPERP_NORM20_PARIFP'
          assert new['upstream_git_blob_sha1']=='0422b69847f2afb97cb7b3ed02ebef91279f61b1'
          assert new['goal4ad_blob_sha1']=='6cedfed8d5944a3a93ddfe106f488c2a75670c92'
          def blob(p):
              raw=p.read_bytes()
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob(diag)==new['local_diagnostic_blob_sha1']=='ba3a8c3aba36a56457e6428981498fa4235cde8e'
          assert blob(mat)==new['local_materializer_blob_sha1']=='c925c1ce79f10157ff1c8f3d09a6954533797f1f'
          assert new['planned_jobs']==1 and new['planned_shards']==1
          assert new['persisted_output_upper_bound_bytes']<=65536
          assert new['projected_peak_actions_storage_bytes']<=1048576
          assert new['actions_artifact_upload'] is False
          before='${{ github.event.before }}'
          oldtxt=subprocess.check_output(['git','show',f'{before}:{key.as_posix()}'],text=True)
          old=json.loads(oldtxt)
          assert new['generation']>int(old.get('generation',0))
          print('GOAL4AE_LOCAL_RUNKEY_AUTHORIZED=true')
          PY
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  extract:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact local lattice enumerator with bounded large stack
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pari-gp
          mkdir -p /tmp/goal4ae-bin
          cat > /tmp/goal4ae-bin/gp <<'SH'
          #!/usr/bin/env bash
          exec /usr/bin/gp -s 256M "$@"
          SH
          chmod +x /tmp/goal4ae-bin/gp
          echo '/tmp/goal4ae-bin' >> "$GITHUB_PATH"
      - name: Enumerate PicK-pullback norm-20 Picard candidates and materialize size-8 orbit
        run: |
          set -euo pipefail
          python -B stages/stage35-ex/materialize_stage35_ex_35_goal4ae_local_cfixed.py | tee /tmp/goal4ae-local.log
          grep -q '^GOAL4AE_LOCAL_MATERIALIZATION_JSON=' /tmp/goal4ae-local.log
      - name: Enforce compact no-credit boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/goal4ae-local.log').read_text()
          assert '"remote_cas_used": false' in s or '"remote_cas_used":false' in s
          assert '"theorem_credit": false' in s or '"theorem_credit":false' in s
          assert '"endpoint_credit": false' in s or '"endpoint_credit":false' in s
          print('GOAL4AE_LOCAL_DIAGNOSTIC_BOUNDARY=PASS')
          PY
