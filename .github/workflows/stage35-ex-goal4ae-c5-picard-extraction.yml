name: Stage35-EX Goal4AE C5 Picard extraction

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage35-ex/probe_stage35_ex_35_goal4ae_c5_pick_to_pics.py'
      - 'stages/stage35-ex/runkeys/goal4ae-c5-picard-extraction.json'
      - '.github/workflows/stage35-ex-goal4ae-c5-picard-extraction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          KEY='stages/stage35-ex/runkeys/goal4ae-c5-picard-extraction.json'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test '${{ github.event_name }}' = 'pull_request' || exit 0
          test -n "${BEFORE}" || exit 0
          git fetch --no-tags --depth=1 origin "${BEFORE}" || exit 0
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || exit 0
          git diff --name-only "${BEFORE}" "${HEAD_SHA}" | grep -Fxq "${KEY}" || exit 0
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          key=Path('stages/stage35-ex/runkeys/goal4ae-c5-picard-extraction.json')
          producer=Path('stages/stage35-ex/probe_stage35_ex_35_goal4ae_c5_pick_to_pics.py')
          new=json.loads(key.read_text())
          assert new['schema']=='STAGE35_EX_GOAL4AE_C5_PICARD_EXTRACTION_RUNKEY_V1'
          assert new['armed'] is True and new['generation']==2
          assert new['upstream_git_blob_sha1']=='0422b69847f2afb97cb7b3ed02ebef91279f61b1'
          assert new['goal4ad_blob_sha1']=='6cedfed8d5944a3a93ddfe106f488c2a75670c92'
          raw=producer.read_bytes()
          pblob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert pblob==new['producer_blob_sha1']=='632d4329974a24dce202981b86787df6b969a59d'
          assert new['source_slice_mode']=='S_PICARD_CORE_PLUS_K_THROUGH_PICKTOPICS'
          assert new['planned_jobs']==1
          assert new['persisted_output_upper_bound_bytes']<=65536
          assert new['projected_peak_actions_storage_bytes']<=1048576
          before='${{ github.event.before }}'
          try:
              oldtxt=subprocess.check_output(['git','show',f'{before}:{key.as_posix()}'],text=True,stderr=subprocess.DEVNULL)
          except subprocess.CalledProcessError:
              oldtxt=None
          if oldtxt is not None:
              old=json.loads(oldtxt)
              assert new['generation']>int(old.get('generation',0))
          print('GOAL4AE_RUNKEY_AUTHORIZED=true')
          PY
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  extract:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact C5 PicK to PicS to INDLIST64 rows
        run: python -B stages/stage35-ex/probe_stage35_ex_35_goal4ae_c5_pick_to_pics.py
      - name: Verify compact certificate before retention
        run: |
          python - <<'PY'
          import hashlib,json
          p='stages/stage35-ex/35ex-35/goal4ae-c5-direct-pick-to-pics-indlist64.json'
          x=json.load(open(p)); b=dict(x); h=b.pop('canonical_sha256')
          assert h==hashlib.sha256(json.dumps(b,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert x['schema']=='STAGE35_EX_35_GOAL4AE_C5_DIRECT_PICK_TO_PICS_INDLIST64_V1'
          assert len(x['c5_pair_rows'])==8 and len(x['goal4ac_residual_pairs'])==4
          assert x['execution']['source_slice_used'] and x['execution']['submitted_magma_code_bytes']<65536
          assert x['exact_checks']['all_rows_integral'] and x['exact_checks']['all_rows_distinct']
          assert x['exact_checks']['antipodal_pair_sum_equals_2H_for_all_8_labels']
          assert not x['semantic_firewall']['target_span_with_C5_pairs_computed']
          assert not x['semantic_firewall']['E1_proved'] and not x['semantic_firewall']['stage35_closed']
          print('GOAL4AE_COMPACT_CERTIFICATE=PASS_EXACT')
          print('CERTIFICATE_SHA256='+h)
          PY
      - name: Persist compact exact certificate on PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage35-ex/35ex-35/goal4ae-c5-direct-pick-to-pics-indlist64.json
          git diff --cached --quiet && exit 0
          git commit -m 'Stage35-EX Goal4AE materialize exact C5 Picard rows'
          git push origin "HEAD:${HEAD_BRANCH}"
