name: Stage32 Reynolds projected integral lattice diagnostic

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - 'stages/stage32/residual-32-01-production/direct_picard_reynolds_lattice_diagnostic.py'
      - 'stages/stage32/residual-32-01-production/hperp_integral_adapter.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_slice_bridge.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - '.github/workflows/stage32-direct-picard-reynolds-lattice-diagnostic.yml'

permissions:
  contents: read

jobs:
  reynolds-lattice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Diagnose finite projected integral lattice
        run: |
          python stages/stage32/residual-32-01-production/direct_picard_reynolds_lattice_diagnostic.py \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --output direct-picard-reynolds-lattice-diagnostic.json
      - name: Upload compact Reynolds lattice evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-direct-picard-reynolds-lattice-diagnostic
          path: direct-picard-reynolds-lattice-diagnostic.json
          retention-days: 7
          compression-level: 9
