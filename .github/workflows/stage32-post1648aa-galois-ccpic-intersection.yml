name: Stage32 post1648AA Galois ccPic intersection

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: stage32-post1648aa-galois-ccpic-intersection
  cancel-in-progress: true

jobs:
  exact-galois-intersection:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact scratch head
        uses: actions/checkout@v4
      - name: Assert exact scratch head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Verify exact Galois ccPic intersection leaf
        run: python3 -B stages/stage32/residual-32-01-production/verify_stage32_post1648aa_galois_ccpic_intersection.py
      - name: Commit whitespace check
        run: git show --check --oneline --no-patch HEAD
