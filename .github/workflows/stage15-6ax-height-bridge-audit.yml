name: Stage15-6ax canonical-height bridge audit

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6ax/**'
      - 'stages/stage15/evidence/stage15_6ax_height_bridge_audit.json'
      - 'stages/stage15/replay/verify_stage15_6ax.py'
      - 'stages/stage15/scripts/stage15_6ax_height_bridge_audit.py'
      - '.github/workflows/stage15-6ax-height-bridge-audit.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6ax height bridge audit
        run: python stages/stage15/replay/verify_stage15_6ax.py
      - name: Compile Stage15-6ax utility
        run: python -m py_compile stages/stage15/scripts/stage15_6ax_height_bridge_audit.py stages/stage15/replay/verify_stage15_6ax.py
