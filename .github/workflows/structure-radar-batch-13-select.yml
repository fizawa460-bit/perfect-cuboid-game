name: StructureRadar batch13 selector
on:
  push:
    branches: [structure-radar-deep-corpus-batch-13]
    paths:
      - '.github/structure-radar-batch-13-trigger.txt'
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact 60-source batch index
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')
          q=json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          task=next(t for t in q['tasks'] if t['status']=='READY')
          ids=task['source_ids']
          assert len(ids)==60, len(ids)
          entries={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              d=json.loads(p.read_text())
              for s in d.get('sources',[]): entries[s['source_id']]=s
          out=[]
          for i,sid in enumerate(ids,1):
              s=entries[sid]
              p=root/s['path']
              txt=p.read_text(errors='replace') if p.exists() else ''
              title=''
              for line in txt.splitlines():
                  if line.startswith('# '): title=line[2:].strip(); break
              keys=[]
              for line in txt.splitlines():
                  z=line.strip()
                  if ('=' in z or 'PROVED' in z or 'BOUND' in z or 'RECEIVER' in z or 'NEXT=' in z) and len(z)<=220:
                      keys.append(z)
                  if len(keys)>=45: break
              out.append({'n':i,'source_id':sid,'path':s['path'],'kind':s.get('kind'),'evidence_role':s.get('evidence_role'),'fingerprint':s['fingerprint'],'title':title,'key_lines':keys,'excerpt':txt[:8500]})
          (root/'.github/structure-radar-batch-13-summary.txt').write_text('\n'.join(f"{x['n']:02d}\t{x['source_id']}\t{x['kind']}\t{x['path']}\t{x['title']}" for x in out)+'\n')
          for j in range(0,60,10):
              (root/f'.github/structure-radar-batch-13-chunk-{j//10+1:02d}.json').write_text(json.dumps(out[j:j+10],ensure_ascii=False,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/structure-radar-batch-13-summary.txt .github/structure-radar-batch-13-chunk-*.json
          git commit -m 'StructureRadar batch13 materialize exact corpus'
          git push
