name: Stage14-toolbox-ad Pythagorean formula audit

on:
  pull_request:
    paths:
      - 'docs/stage14-toolbox/**'
      - 'stages/stage14/14-toolbox-ad/**'
      - 'stages/stage14/scripts/14-toolbox-ad/**'
      - 'stages/stage14/scripts/14-toolbox-ac/**'
      - '.github/workflows/stage14-toolbox-ad.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Pythagorean formula atlas audit
        run: python stages/stage14/scripts/14-toolbox-ad/pythagorean_formula_audit.py
      - name: Compile audits
        run: |
          python -m py_compile stages/stage14/scripts/14-toolbox-ad/pythagorean_formula_audit.py
          python -m py_compile stages/stage14/scripts/14-toolbox-ac/exponent_ledger_audit.py
      - name: Regress exponent ledger foundation
        run: python stages/stage14/scripts/14-toolbox-ac/exponent_ledger_audit.py
      - name: Validate toolbox-ad boundary
        run: |
          grep -q 'STAGE14_TOOLBOX_AD=COMPLETE_PYTHAGOREAN_EUCLID_CONVERSION_FORMULA_ATLAS' stages/stage14/14-toolbox-ad/result.md
          grep -q 'NEXT=Stage14-toolbox-ae local 2-descent and five-column interface' stages/stage14/14-toolbox-ad/result.md
