name: Stage15-6az small-height size audit

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6az/**'
      - 'stages/stage15/evidence/stage15_6az_small_height_size_audit.json'
      - 'stages/stage15/replay/verify_stage15_6az.py'
      - 'stages/stage15/scripts/stage15_6az_small_height_size_audit.py'
      - '.github/workflows/stage15-6az-small-height-size-audit.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python stages/stage15/replay/verify_stage15_6az.py
      - run: python -m py_compile stages/stage15/scripts/stage15_6az_small_height_size_audit.py
