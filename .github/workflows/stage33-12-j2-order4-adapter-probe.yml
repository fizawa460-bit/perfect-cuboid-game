name: Stage33 J2 half-lift functional probe
on:
  push:
    branches: [stage33-12-j2-ptsK-qPicK-continuation]
    paths: [.github/workflows/stage33-12-j2-order4-adapter-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate all order4 half-lift functionals
        run: python3 stages/stage33/33-12/certify_j2_order4_half_lift_functional_space.py
