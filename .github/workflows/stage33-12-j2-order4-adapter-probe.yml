name: Stage33 J2 relation state sync
on:
  push:
    branches: [stage33-12-j2-ptsK-qPicK-continuation]
    paths: [.github/workflows/stage33-12-j2-order4-adapter-probe.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact J2 source, materialize relation, and sync MAIN state
        run: |
          set -euo pipefail
          python3 stages/stage33/33-12/verify_j2_picard_adjoint_proper_br2.py
          python3 stages/stage33/33-12/certify_j2_named_kummer_source_target_relation.py
          python3 stages/stage33/33-12/verify_j2_named_kummer_source_target_relation.py
          python3 stages/stage33/33-12/promote_j2_picard_adjoint_relation_state.py
          python3 stages/stage33/sync_main_state.py
          python3 stages/stage33/sync_main_state.py --check
          python3 stages/stage33/33-12/verify_j2_picard_adjoint_proper_br2.py
          python3 stages/stage33/33-12/verify_j2_named_kummer_source_target_relation.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage33/controller.json stages/stage33/MAIN-STATE.json stages/stage33/33-12/result.md stages/stage33/33-12/j2-named-kummer-source-target-relation.json
          git diff --cached --check
          git commit -m 'Stage33: fix J2 named Kummer relation rank one'
          git push origin HEAD:stage33-12-j2-ptsK-qPicK-continuation
