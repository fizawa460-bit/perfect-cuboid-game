name: Stage32 post1505 O210 Q602 marked W-line gauge orbit

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-post1505-o210-q602-marked-w-line-gauge-orbit.yml'
      - 'stages/stage32/residual-32-01-production/post1505-o210-q602-marked-w-line-gauge-orbit*'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1505_o210_q602_marked_w_line_gauge_orbit.py'
      - 'stages/stage32/residual-32-01-production/post1505-o210-q602-weierstrass-parity-transvection-refinement.json'
      - 'stages/stage32/residual-32-01-production/post1490-o210-q4-bolza-principal-rosati-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Certify marked W-line gauge orbit
        run: python stages/stage32/residual-32-01-production/certify_stage32_post1505_o210_q602_marked_w_line_gauge_orbit.py --check stages/stage32/residual-32-01-production/post1505-o210-q602-marked-w-line-gauge-orbit.json
      - name: Preserve audited predecessor replay
        run: python stages/stage32/residual-32-01-production/certify_stage32_post1505_o210_q602_weierstrass_parity_transvection_refinement.py --check stages/stage32/residual-32-01-production/post1505-o210-q602-weierstrass-parity-transvection-refinement.json
      - name: Diff check
        run: git diff --check HEAD^
