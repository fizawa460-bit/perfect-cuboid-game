name: Stage33 V10 audit gate repair

on:
  push:
    paths:
      - '.github/workflows/stage33-v10-audit-gate-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Separate pending V10 audit from completed V9 audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          sp = Path('stages/stage33/sync_main_state.py')
          s = sp.read_text()

          anchor = "assert c['execution']['audit_scope']==c['audit_scope'] and c['execution']['advance_allowed'] is False\nassert c['merge_allowed'] is False and c['theorem_credit'] is False and c['receiver_credit'] is False and c['endpoint_credit'] is False"
          replacement = "assert c['execution']['audit_scope']==c['audit_scope'] and c['execution']['advance_allowed'] is False\nassert c['last_completed_audit_scope']=='STAGE33_12_V9_QPIC_BRIDGE_CONTROLLER_AUTHORITY_SYNC'\nassert c['last_completed_audit_review_id']==5080029385\nassert c['last_completed_audit_head_sha']=='8e61024cd12bcb55b3406701aea68f8bfbaa06a2'\nassert c['merge_allowed'] is False and c['theorem_credit'] is False and c['receiver_credit'] is False and c['endpoint_credit'] is False"
          if anchor not in s:
              raise SystemExit('expected V10 audit assertion anchor missing; fail closed')
          s = s.replace(anchor, replacement, 1)

          old_gate = "'execution_gate':{'audit_required':c['audit_required'],'audit_status':c['audit_status'],'last_completed_audit_scope':c['audit_scope'],'last_completed_audit_review_id':c['audit_review_id'],'last_completed_audit_head_sha':c['audit_head_sha'],'advance_allowed':c['advance_allowed'],'advance_scope':c['advance_scope'],'next_expected_command':c['next_expected_command']},"
          new_gate = "'execution_gate':{'audit_required':c['audit_required'],'audit_status':c['audit_status'],'audit_scope':c['audit_scope'],'audit_review_id':c['audit_review_id'],'audit_head_sha':c['audit_head_sha'],'last_completed_audit_scope':c['last_completed_audit_scope'],'last_completed_audit_review_id':c['last_completed_audit_review_id'],'last_completed_audit_head_sha':c['last_completed_audit_head_sha'],'advance_allowed':c['advance_allowed'],'advance_scope':c['advance_scope'],'next_expected_command':c['next_expected_command']},"
          if old_gate not in s:
              raise SystemExit('expected compact execution_gate mapping missing; fail closed')
          s = s.replace(old_gate, new_gate, 1)
          sp.write_text(s)
          PY

          python stages/stage33/sync_main_state.py
          python stages/stage33/sync_main_state.py --check
          python stages/stage33/33-12/verify_j2_actual_swap_mixed_discriminant_descent.py
          git diff --check

      - name: Commit bounded projection repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No repair diff produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage33/sync_main_state.py stages/stage33/MAIN-STATE.json
          git commit -m 'Stage33: separate pending V10 audit from V9 history'
          git push origin HEAD:${GITHUB_REF_NAME}
