name: Stage27-10 true N2 exponent contract

on:
  pull_request:
    paths:
      - 'stages/stage27/**'
      - 'stages/stage26/26-controller.json'
      - 'stages/stage26/postmerge-closeout.md'
      - 'docs/stage27-roadmap.md'
      - 'docs/00_CURRENT_RESEARCH_STATUS.md'
      - '.github/workflows/stage27-10-contract.yml'
  workflow_dispatch:

jobs:
  verify-stage27-10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage27 checkpoint10 contract
        run: python stages/stage27/27-10/verify_27_10.py
