name: Stage33 C4B2B2F exact-head freshness repair

on:
  push:
    branches:
      - stage33-v91c1x-r5b3b3c4b1e-1757-refinement-unit-preflight
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage33-c4b2b2f-exact-head-freshness-repair
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  exact-head-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependency
        run: python -m pip install 'sympy==1.14.0'

      - name: Synchronize current main content and ancestry
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          head_sha="$(git rev-parse HEAD)"
          echo "observed_main_sha=$main_sha"
          echo "observed_head_sha=$head_sha"
          if git merge-base --is-ancestor "$main_sha" HEAD; then
            echo 'pushed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$main_sha"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          echo 'pushed=true' >> "$GITHUB_OUTPUT"

      - name: Restore C4B2B2F hostile-audit operational lock
        if: steps.sync.outputs.pushed == 'false'
        run: python stages/stage33/33-12/repair_c4b2b2f_operational_checkpoint.py --write

      - name: Commit operational lock repair when needed
        if: steps.sync.outputs.pushed == 'false'
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t files < <(git diff --name-only | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'pushed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = 'stages/stage33/MAIN-STATE.json'
          test "${files[1]}" = 'stages/stage33/sync_main_state.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage33/MAIN-STATE.json stages/stage33/sync_main_state.py
          git commit -m '[Stage33] restore C4B2B2F hostile-audit lock after main sync'
          git push origin HEAD:"${GITHUB_REF_NAME}"
          echo 'pushed=true' >> "$GITHUB_OUTPUT"

      - name: Verify repo hostile-audit and freshness governance
        if: steps.sync.outputs.pushed == 'false' && steps.repair.outputs.pushed == 'false'
        run: python docs/research-os/policies/verify_hostile_audit_and_freshness.py

      - name: Verify exact C4B2B2F repaired transport replay
        if: steps.sync.outputs.pushed == 'false' && steps.repair.outputs.pushed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b2b2f_replay_stage33_11e_actual_direct_prime_transport.py --write
          git diff --check
          git diff --exit-code -- stages/stage33/33-12/e3-v91c1x-r5b3b3c4b2b2f-stage33-11e-actual-direct-prime-transport-replay.json

      - name: Verify C4B2B2F frontier alignment
        if: steps.sync.outputs.pushed == 'false' && steps.repair.outputs.pushed == 'false'
        run: python stages/stage33/33-12/repair_c4b2b2f_operational_checkpoint.py --check

      - name: Verify Stage33 MAIN state contract
        if: steps.sync.outputs.pushed == 'false' && steps.repair.outputs.pushed == 'false'
        run: python stages/stage33/sync_main_state.py --check

      - name: Verify exact-head freshness and clean replay
        if: steps.sync.outputs.pushed == 'false' && steps.repair.outputs.pushed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$main_sha" HEAD
          git diff --check
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD_SUCCESS=$(git rev-parse HEAD)"
          echo "CURRENT_MAIN_INCLUDED=$main_sha"

# Phase trigger: restore C4B2B2F audit lock after synchronized main.
