name: Stage33 V91C1X R5B2D1 source-bound swap23 action adapter

on:
  push:
    branches:
      - stage33-v91c1x-r5b2d0-swap23-source-lock
    paths:
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b2d1_source_bound_swap23_action_adapter.py'
      - 'stages/stage33/33-12/verify_stage33_v91c1x_r5b2d1_source_bound_swap23_action_adapter_v129.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2d1-source-bound-swap23-action-adapter.json'
      - 'stages/stage33/33-12/diagnose_e3_v91c1r_swap23_boundary_function_package_transport.py'
      - 'stages/stage33/33-12/e3-v91c1x-r1-chain-level-action-difference-preflight.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2c3-all-double-overlaps-317-cover.json'
      - 'stages/stage33/MAIN-STATE.json'
      - 'stages/stage33/sync_main_state.py'
      - '.github/workflows/stage33-v91c1x-r5b2d1-source-bound-swap23-action-adapter.yml'
  pull_request:
    paths:
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b2d1_source_bound_swap23_action_adapter.py'
      - 'stages/stage33/33-12/verify_stage33_v91c1x_r5b2d1_source_bound_swap23_action_adapter_v129.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2d1-source-bound-swap23-action-adapter.json'
      - '.github/workflows/stage33-v91c1x-r5b2d1-source-bound-swap23-action-adapter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay source-bound literal swap23 transport and materialize B2D1
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b2d1_source_bound_swap23_action_adapter.py --write
      - name: Independently verify B2D1 source-bound action adapter
        run: python stages/stage33/33-12/verify_stage33_v91c1x_r5b2d1_source_bound_swap23_action_adapter_v129.py
      - name: Verify live Stage33 state remains synchronized
        run: python stages/stage33/sync_main_state.py --check
      - name: Diff check
        run: git diff --check
      - name: Commit compact B2D1 certificate
        if: github.event_name == 'push'
        shell: bash
        run: |
          CERT='stages/stage33/33-12/e3-v91c1x-r5b2d1-source-bound-swap23-action-adapter.json'
          if [ -z "$(git status --porcelain -- "$CERT")" ]; then
            echo 'B2D1 certificate already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CERT"
          git commit -m '[Stage33] materialize R5B2D1 source-bound swap23 action adapter'
          git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
