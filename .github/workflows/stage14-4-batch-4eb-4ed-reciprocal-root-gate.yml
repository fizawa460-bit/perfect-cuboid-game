name: Stage14-4 batch 4eb-4ed reciprocal root gate

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4eb/**'
      - 'stages/stage14/14-4ec/**'
      - 'stages/stage14/14-4ed/**'
      - 'stages/stage14/14-4-batch/**'
      - 'stages/stage14/scripts/14-4/batch_4eb_4ed_reciprocal_root_gate_audit.py'
      - '.github/workflows/stage14-4-batch-4eb-4ed-reciprocal-root-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Stage14-4 batch audit
        run: python stages/stage14/scripts/14-4/batch_4eb_4ed_reciprocal_root_gate_audit.py
      - name: Compile batch audit
        run: python -m py_compile stages/stage14/scripts/14-4/batch_4eb_4ed_reciprocal_root_gate_audit.py
      - name: Regress merged 4ea
        run: python stages/stage14/scripts/14-4/canonical_allocation_reciprocal_density_audit.py
      - name: Regress newly merged s7-69..71 batch when present on PR merge ref
        run: |
          if [ -f stages/stage14/scripts/14-s-batch/s7_69_71_reciprocal_selector_audit.py ]; then
            python stages/stage14/scripts/14-s-batch/s7_69_71_reciprocal_selector_audit.py
          fi
      - name: Lock batch boundary
        run: |
          grep -Fq 'STAGE14_4EB=COMPLETE_CANONICAL_FIRST_RECIPROCAL_TAUTOLOGY_AND_SECOND_LAYER_LOCALIZATION' stages/stage14/14-4eb/result.md
          grep -Fq 'STAGE14_4EC=COMPLETE_OPPOSITE_RECIPROCAL_TO_PRIMITIVE_GAUSSIAN_NORM_DIVISIBILITY' stages/stage14/14-4ec/result.md
          grep -Fq 'STAGE14_4ED=COMPLETE_PRIMITIVE_GAUSSIAN_ROOT_DENSITY_BOUNDARY_AND_EXTERNAL_H_GATE' stages/stage14/14-4ed/result.md
          grep -Fq 'BATCH_SUBSTANTIVE_STAGE_COUNT=3' stages/stage14/14-4-batch/4eb-4ed-report.md
          grep -Fq 'BATCH_STOP_REASON=new_external_lemma_needed' stages/stage14/14-4-batch/4eb-4ed-report.md
          grep -Fq 'NEXT=Stage14-sH71' stages/stage14/14-4-batch/4eb-4ed-report.md
      - name: Diff check
        run: git diff --check origin/main...HEAD
