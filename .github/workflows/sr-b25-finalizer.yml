          git diff --check
          python - <<'PY'
          import subprocess
          allowed={'docs/structure-radar/controller.json','docs/structure-radar/exploration-queue.json','docs/structure-radar/progress.json','docs/structure-radar/source-manifest.json','docs/structure-radar/source-manifest/part-0009.json','docs/structure-radar/structure-registry.json','.github/workflows/sr-b25-finalizer.yml'}
