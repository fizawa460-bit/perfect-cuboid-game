name: StructureRadar batch25 finalizer
on:
  push:
    branches: ['structure-radar-deep-corpus-batch-25']
    paths: ['.github/workflows/sr-b25-finalizer.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Normalize batch25
        shell: bash
        run: |
          python - <<'PY'
