          from pathlib import Path
          B='SR-BATCH-STAGE14_15_DEEP_CORPUS-25-R01'
          ids=['SRC-46BF6932C6C9','SRC-B3A7BBE40177','SRC-E8BAEBE9C839','SRC-957A8D943102','SRC-14873C1DAA10','SRC-168567A89A24','SRC-3F4BF9D6133F','SRC-E1A15F928BEB','SRC-37C73CF1A4F8','SRC-9F1F139E9FF1','SRC-7869519E3D06','SRC-83F051F0D129','SRC-9F32F203B00D','SRC-FDBD639789D8','SRC-D38ADFE5E915','SRC-793F0C421FD7','SRC-5BA5C3F151DB','SRC-27934C691053','SRC-8FBA9CEA8407','SRC-C1D9C907C3B1','SRC-700C655023C8','SRC-EBF36EF17F15','SRC-78F5C6F08266','SRC-093263FCCC91','SRC-1C7C31378E5E','SRC-A816F9451B3F','SRC-A820F352CD0C','SRC-2EEA456A6FDD','SRC-34A57A6C4832','SRC-8EBB634FC3EF','SRC-C231F26B7E52','SRC-EBC97AA5796A','SRC-F2C4565B48E4','SRC-AE1393DDEF59','SRC-704C64FAA54C','SRC-EDB1998A866D','SRC-90416F832D8B','SRC-AEA6B6DBDD79','SRC-1F8C691A02ED','SRC-125BD465539E','SRC-2228EB177656','SRC-87F4EA5B1049','SRC-FB15998814D8','SRC-CBD58401E12A','SRC-E878F8BE8E70','SRC-F0E08E258557','SRC-A6CB05AD65E0','SRC-3168763C0152','SRC-CD302EDAFE72','SRC-B82A1B316971','SRC-D9020C8FEE98','SRC-6994AAD4730A','SRC-E8029BA44A81','SRC-848E711E5924','SRC-65C59235C50C','SRC-56CC0865D97B','SRC-08622627471C','SRC-6CB0A19917A0','SRC-F909EFA73B91','SRC-B1537511883F']
