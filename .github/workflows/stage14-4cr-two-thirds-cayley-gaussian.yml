name: Stage14-4cr two-thirds Cayley Gaussian
on:
  pull_request:
    paths:
      - 'stages/stage14/14-4cr/**'
      - 'stages/stage14/scripts/14-4/two_thirds_cayley_gaussian_audit.py'
      - 'stages/stage14/data/14-4/two_thirds_cayley_gaussian_summary.json'
      - '.github/workflows/stage14-4cr-two-thirds-cayley-gaussian.yml'
      - 'stages/stage14/14-s7-30/**'
      - 'stages/stage14/14-4cq/**'
      - 'stages/stage14/14-X7/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Stage14-4cr audit
        run: python stages/stage14/scripts/14-4/two_thirds_cayley_gaussian_audit.py
      - name: Run s7-30 regression
        run: python stages/stage14/scripts/14-s7-30/two_sided_common_core_root_pair_audit.py
      - name: Run 4cq regression
        run: python stages/stage14/scripts/14-4/dual_common_core_cayley_audit.py
      - name: Lock theorem boundary
        run: |
          f=stages/stage14/14-4cr/result.md
          grep -Fq 'STAGE14_4CR=COMPLETE_TWO_THIRDS_PROMOTION_AND_CAYLEY_GAUSSIAN_ORIENTATION_FACTORIZATION' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=2/3' "$f"
          grep -Fq 'IMPROVEMENT_OVER_11_16=1/48' "$f"
          grep -Fq 'TWO_THIRDS_SATURATION_THETA=7/24' "$f"
          grep -Fq 'TWO_THIRDS_SATURATION_PHI=1/4' "$f"
          grep -Fq 'TWO_THIRDS_SATURATION_COMMON_CORE_EXPONENT=1/3' "$f"
          grep -Fq 'CAYLEY_GOOD_CORE_SIGN_ALLOCATION_PROVED=true' "$f"
          grep -Fq 'CAYLEY_C_MINUS_OPPOSITE_GAUSSIAN_ORIENTATION=true' "$f"
          grep -Fq 'CAYLEY_C_PLUS_SAME_GAUSSIAN_ORIENTATION=true' "$f"
          grep -Fq 'REMAINING_RECEIVER=TwoThirdsCayleyGaussianCommonGcdRootProductIncidence' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-4cs' "$f"
