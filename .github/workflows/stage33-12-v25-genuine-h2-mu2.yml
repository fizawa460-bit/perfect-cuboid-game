name: Stage33-12 V25 genuine H2 mu2 adapter replay

on:
  pull_request:
    paths:
      - 'stages/stage33/33-12/j2-genuine-h2-mu2-kummer-adapter-v25.json'
      - 'stages/stage33/33-12/certify_j2_genuine_h2_mu2_kummer_adapter_v25.py'
      - 'stages/stage33/33-12/verify_j2_genuine_h2_mu2_kummer_adapter_v25.py'
      - '.github/workflows/stage33-12-v25-genuine-h2-mu2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-12-v25-genuine-h2-mu2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-v25-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay V21-V25 source-first Kummer adapter chain
        run: |
          python stages/stage33/33-12/verify_j2_order4_swap_functional_source_v21.py
          python stages/stage33/33-12/verify_j2_kummer_source_target_module_source_first_v22.py
          python stages/stage33/33-12/verify_j2_kummer_target_h1_coordinate41_trace_v23.py
          python stages/stage33/33-12/verify_j2_raw_h1_not_kummer_target_v24.py
          python stages/stage33/33-12/verify_j2_genuine_h2_mu2_kummer_adapter_v25.py
          python stages/stage33/sync_main_state.py --check
          git diff --check
