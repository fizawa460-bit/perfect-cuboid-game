name: StructureRadar search10 finalize
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'structure-radar-search-10-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply literature batch10
        run: |
          python - <<'PY'
          import json, pathlib
          ids=['SR-STR-073','SR-STR-074','SR-STR-075','SR-STR-077','SR-STR-078','SR-STR-079','SR-STR-080','SR-STR-081','SR-STR-082','SR-STR-083']
          ledger='docs/structure-radar/literature/SR-SEARCH-10.md'
          rp='docs/structure-radar/structure-registry.json'; r=json.load(open(rp)); found=[]
          for c in r['structures']:
            if c['structure_id'] in ids:
              assert c['search_status']=='NOT_SEARCHED'
              assert c['arsenal_decision']=='PENDING'
              c['search_status']='SEARCHED'; c['arsenal_decision']='ACTIVE'; c['search_ledger']=ledger
              found.append(c['structure_id'])
          assert found==ids, found
          open(rp,'w').write(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          pp='docs/structure-radar/progress.json'; p=json.load(open(pp)); bid='SR-BATCH-LITERATURE_SEARCH-10-R01'
          assert not any(x.get('batch_id')==bid for x in p['audit_batches'])
          p['audit_batches'].append({'batch_id':bid,'task_id':'SR-SEARCH-01','status':'SUBMITTED_FOR_AUDIT','source_ids':[],'sources_reviewed':0,'structures_added':0,'structures_updated':10,'structure_carrier_sources':0,'structures_deduped':0,'searches_completed':10,'arsenal_decisions':10,'audit_required':True,'duplicate_source':0,'no_distinct_structure':0})
          open(pp,'w').write(json.dumps(p,indent=2,ensure_ascii=False)+'\n')
          pathlib.Path(ledger).write_text('''# StructureRadar literature ledger — search batch 10\n\nSEARCH_TASK=SR-SEARCH-01\nBATCH_ID=SR-BATCH-LITERATURE_SEARCH-10-R01\nSEARCH_DATE=2026-08-19\nSTRUCTURES=SR-STR-073,SR-STR-074,SR-STR-075,SR-STR-077,SR-STR-078,SR-STR-079,SR-STR-080,SR-STR-081,SR-STR-082,SR-STR-083\nSEARCH_BATCH_SIZE=10\nEVIDENCE_POLICY=repo exact receiver first; external primary literature is adjacent unless target population, height, multiplicity and quantifiers match\nNOVELTY_BY_SEARCH_ABSENCE=false\n\n## SR-STR-073 — Space-filtered fixed-tau genus-one fiber\nThe fixed-tau physical survivor after reinstating the space-square equation is retained as the exact repo genus-one receiver. Generic genus-one fibration theory does not itself give a uniform Stage19 point count. Transfer verdict: `REPO_EXACT_GENUS_ONE_RECEIVER`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-074 — Physical-cutoff height transfer on a fixed-tau genus-one fiber\nThe bounds H(z)<3B and H(u)<5B^(3/2) are retained as the repo physical-height adapter. Polynomial coordinate height alone gives neither uniform rank nor a uniform max-fiber theorem. Transfer verdict: `REPO_HEIGHT_ADAPTER`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-075 — Master-Hit Mordell-Weil Euler-brick blocker/generator candidate\nPeschmann, *Exponent-one blockers and a Mordell-Weil construction of Euler bricks* (arXiv:2605.00573), directly studies Master-Hits, verifies the exponent-one blocker phenomenon on 151,575 fully factored records, and constructs further Euler bricks by bounded Mordell-Weil enumeration over fixed fibres. The blocker statement is computationally verified on the reported database and the generator is fibrewise; neither supplies a global primitive-canonical Euclidean-height population theorem or a perfect-cuboid nonexistence proof. Transfer verdict: `DIRECT_EXTERNAL_FIBERWISE_TOOL_WITH_GLOBAL_COUNT_FIREWALL`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-077 — Explicit one-parameter Saunderson coefficient floor\nThe explicit R<31m^6 construction and resulting B^(1/6) lower floor are retained as the repo exact one-parameter lower family. It is not promoted to the true M3 scale or an M3 asymptotic. Transfer verdict: `REPO_EXPLICIT_CONSTRUCTION_FLOOR`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-078 — Tau/core gcd square-factor normalization\nThe fixed-(tau,g) square-divisor reconstruction and subpower same-core multiplicity are retained as the repo exact normalization. Distinct-core collisions remain the unresolved counting problem. Transfer verdict: `REPO_MULTIPLICITY_ADAPTER`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-079 — Normalized space squareclass collapse and diagonal two-quadrics receiver\nThe normalized space condition is retained as the repo moving diagonal intersection-of-two-quadrics / core-quartic receiver. Tran, *Uniform bounds for rational points on complete intersections of two quadric surfaces* (arXiv:1703.06524), gives uniform bounded-height rational-point upper bounds for nonsingular complete intersections of two quadrics in P^3, but no automatic adapter identifies its projective height, nonsingularity and parameter-uniformity hypotheses with this moving primitive-canonical physical receiver. Transfer verdict: `REPO_EXACT_TWO_QUADRICS_RECEIVER_WITH_ADJACENT_UNIFORM_COUNTING_LITERATURE`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-080 — Three simultaneous norm-support restrictions on p q g\nThe simultaneous sum-of-two-squares / split-prime support and coprimality restrictions are retained as exact necessary support conditions. Classical norm-support sparsity is logarithmic-density scale and by itself does not provide the fixed-power saving required here. Transfer verdict: `REPO_EXACT_SUPPORT_RESTRICTION`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-081 — Uniform moving-tau distinct-core ceiling\nThe moving-tau bound D_B(tau)<<_epsilon B^epsilon(B/sqrt(H(tau))+sqrt(B)) is retained exactly. It is a useful core ceiling but saturates at half-power scale rather than crossing it. Transfer verdict: `REPO_EXACT_CORE_CEILING`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-082 — Norm-support-only power-saving barrier\nThe ambient necessary-condition set remains too large for a strict subhalf conclusion even after the simultaneous norm restrictions and core ceiling. This is a route-specific negative certificate, not a no-go for diagonal incidence methods. Transfer verdict: `REPO_SUPPORT_ONLY_NEGATIVE_CERTIFICATE`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-083 — Fixed-tau coarse-height half-power saturation family\nThe tau=1/4 stress family shows half-power saturation inside the coarse r402a height box while being forced exactly-two and non-space. It is therefore a countermodel to the coarse-height counting route, not an N2 lower family. Transfer verdict: `REPO_COARSE_HEIGHT_COUNTERMODEL`. Arsenal decision: `ACTIVE`.\n\n## Firewalls\n- `NOVELTY_BY_SEARCH_ABSENCE=false`.\n- Genus-one identification alone does not imply a uniform rational-point count.\n- Peschmann's blocker verification is finite/computational and is not a universal perfect-cuboid nonexistence theorem.\n- Fibrewise Mordell-Weil generation is not a global primitive-canonical population asymptotic.\n- Two-quadrics counting literature requires an exact projective-height, smoothness, moving-parameter and multiplicity adapter before transfer.\n- Norm-support sparsity alone is not a fixed-power saving.\n- The tau=1/4 stress family lies outside N2 after forcing space failure.\n- No perfect-cuboid existence or nonexistence claim is made.\n''')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          rm .github/workflows/structure-radar-search10-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'StructureRadar: literature search batch 10 (10 cards)'
          git push origin HEAD:${{ github.head_ref }}
