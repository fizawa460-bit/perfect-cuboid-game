name: Stage14-t27 trivial-kernel smooth barrier

on:
  pull_request:
    paths:
      - 'stages/stage14/14-t27/**'
      - 'stages/stage14/scripts/14-t/t27_trivial_kernel_smooth_barrier_audit.py'
      - 'stages/stage14/data/14-t27/**'
      - '.github/workflows/stage14-t27-trivial-kernel-smooth-barrier.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run t26 regression
        run: python stages/stage14/scripts/14-t/t26_complete_large_prime_routing_audit.py
      - name: Run t27 trivial-kernel/friability audit
        run: python stages/stage14/scripts/14-t/t27_trivial_kernel_smooth_barrier_audit.py
      - name: Check frozen t27 summary
        run: git diff --exit-code stages/stage14/data/14-t27/trivial_kernel_smooth_barrier.json
      - name: Validate locked t27 boundary
        run: |
          python - <<'PY'
          import json
          p='stages/stage14/data/14-t27/trivial_kernel_smooth_barrier.json'
          d=json.load(open(p)); a=d['finite_actual']; f=d['finite_candidate_universe']; q=d['decision']
          assert a['raw_pair_edges_B2m']==356
          assert a['triple_objects_B2m']==0
          assert a['alpha_beta_1_1_edges_B2m']==0
          assert f['cutoffs_computed']==11
          assert f['candidate_directions_D_le_B2m']==636640
          assert f['candidate_directions_top_shell_B2m']==318362
          assert d['final_cutoff']['top_dyadic_shell_B_over_2_lt_D_le_B']['smooth_eta_1/4']==0
          assert d['final_cutoff']['top_dyadic_shell_B_over_2_lt_D_le_B']['smooth_eta_3/10']==12
          assert q['TRIVIAL_KERNEL_PARTITION_ONLY_1_1'] is True
          assert q['N_11_EQUALS_3T'] is True
          assert q['GLOBAL_SECOND_MOMENT_REQUIRED_FOR_PRIMARY_T_TARGET'] is False
          assert q['ODD_LARGE_BRANCH_ROUTING_COMPLETE_FROM_T26'] is True
          assert q['JOINT_COVER_CONDITIONED_SMOOTH_POWER_SAVING_PROVED'] is False
          assert q['A_11_POWER_SAVING_PROVED'] is False
          assert q['T_O_SQRT_B_PROVED'] is False
          print(json.dumps(q,indent=2))
          PY
