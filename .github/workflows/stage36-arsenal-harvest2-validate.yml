name: Stage36 Arsenal Harvest2 validate
on:
  push:
    branches:
      - stage36-arsenal-initial-harvest-discovery
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 256
      - name: Remove one-shot validator and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage36-arsenal-harvest2-validate.yml
          git commit -m 'ci: finalize Stage36 Harvest2 abstraction validation'
      - name: Exact final-head validation
        shell: bash
        run: |
          set -euo pipefail
          UPPER=07a465cb5025e7c0188fb63610bb40e4b54e7a84
          echo "EXACT_HARVEST2_HEAD=$(git rev-parse HEAD)"
          git diff --check "$UPPER" HEAD
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          upper='07a465cb5025e7c0188fb63610bb40e4b54e7a84'
          lower='62c26297ebeb159e9cdd1e6b9c2129dff6a4acdc'
          h1=json.loads(Path('docs/arsenal/stage36-initial-discovery.json').read_text())
          h2=json.loads(Path('docs/arsenal/stage36-initial-abstraction.json').read_text())
          assert h1['frozen_bounds']['harvest_lower_bound']==lower
          assert h1['frozen_bounds']['harvest_upper_bound']==upper
          assert h2['frozen_bounds']['harvest_lower_bound']==lower
          assert h2['frozen_bounds']['harvest_upper_bound']==upper
          assert h2['frozen_bounds']['range_expanded'] is False
          assert h2['classification_summary']=={
              'total':36,
              'ABSTRACTABLE':12,
              'PARTIALLY_ABSTRACTABLE':8,
              'STAGE36_SPECIFIC':2,
              'NEGATIVE_ONLY':10,
              'WORKFLOW_ONLY':4,
          }
          h1_ids={x['temporary_candidate_id'] for x in h1['candidates']}
          h2_ids=[x['temporary_candidate_id'] for x in h2['sheets']]
          assert len(h2_ids)==36 and len(set(h2_ids))==36
          assert set(h2_ids)==h1_ids
          counts={k:0 for k in ['ABSTRACTABLE','PARTIALLY_ABSTRACTABLE','STAGE36_SPECIFIC','NEGATIVE_ONLY','WORKFLOW_ONLY']}
          for x in h2['sheets']:
              counts[x['harvest2_classification']]+=1
              for key in ['object_type','hypotheses','transformation','output','failure_contract','forward_converse_status','exceptional_locus','field_change','source_lock_requirement','reusability_test']:
                  assert key in x, (x['temporary_candidate_id'],key)
          assert counts=={'ABSTRACTABLE':12,'PARTIALLY_ABSTRACTABLE':8,'STAGE36_SPECIFIC':2,'NEGATIVE_ONLY':10,'WORKFLOW_ONLY':4}
          allowed={
              'docs/arsenal/stage36-initial-discovery.md',
              'docs/arsenal/stage36-initial-discovery.json',
              'docs/arsenal/stage36-initial-abstraction.json',
          }
          got=set(subprocess.check_output(['git','diff','--name-only',upper,'HEAD'],text=True).splitlines())
          assert got==allowed,(got-allowed,allowed-got)
          md=Path('docs/arsenal/stage36-initial-discovery.md').read_text()
          for marker in ['DISCOVERY + ABSTRACTION COMPLETE','HOSTILE DEDUP NOT YET COMPLETE','ARSENAL PROMOTION NOT PERFORMED']:
              assert marker in md
          print('PASS_STAGE36_HARVEST2_JSON_PARSE')
          print('PASS_STAGE36_HARVEST2_COUNTS', counts)
          print('PASS_STAGE36_HARVEST2_ID_BIJECTION', len(h2_ids))
          print('PASS_STAGE36_HARVEST2_SCOPE', len(got))
          print('PASS_STAGE36_HARVEST2_BOUNDS', lower, upper)
          PY
          git diff --exit-code "$UPPER" HEAD -- docs/arsenal/index.json docs/arsenal/catalog.md docs/arsenal/cards
          git diff --exit-code "$UPPER" HEAD -- stages/stage36/MAIN-STATE.json stages/stage36/MAIN-START-HERE.md stages/stage36/ROADMAP.md stages/stage36/MAIN-BATCH-HANDOFF.md
      - name: Push exact validated head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:stage36-arsenal-initial-harvest-discovery
