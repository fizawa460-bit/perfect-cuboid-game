name: Stage13-12ac R02 frozen bundle verifier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-r02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen R02 identity without regenerating it
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          html_path = Path('review/STAGE13-FINAL-SELF-CONTAINED-20260808-R02.html')
          manifest_path = Path('stages/stage13/data/13-12ac/review_bundle_manifest.json')
          html = html_path.read_text(encoding='utf-8')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          bundle = 'STAGE13-FINAL-SELF-CONTAINED-20260808-R02'
          expected_content = 'e75136805f0d4d7cfc2466b08e403eb2c895ebb1bce67564cabd24a216a682d0'
          expected_ledger = '3285b556ce80778993c93cec4581246909674083cf10402d37ede9b607212f13'
          expected_snapshot = '0c17c212646dea48780acdf6263fd403741dfea8'

          assert manifest['bundle_id'] == bundle
          assert manifest['content_sha256'] == expected_content
          assert manifest['source_ledger_sha256'] == expected_ledger
          assert manifest['source_snapshot_commit'] == expected_snapshot
          assert manifest['source_count'] == 98
          assert manifest['html_bytes'] == 947019
          assert f'BUNDLE_ID={bundle}' in html
          assert f'CONTENT_SHA256={expected_content}' in html
          assert f'END_OF_BUNDLE={bundle}' in html
          print('Frozen Stage13 R02 identity verification: PASS')
          PY

# R02 has already received external reviews. It is an immutable historical
# review snapshot from Stage13-12ac and must not be regenerated by later
# Stage13 repair PRs. A future review uses a new bundle ID (R03 or later).
