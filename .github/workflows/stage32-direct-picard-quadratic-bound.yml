name: Stage32 direct Picard quadratic bound

on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - 'stages/stage32/residual-32-01-production/direct_picard_slice_bridge.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_slice_quadratic_bound.py'
      - 'stages/stage32/residual-32-01-production/build_direct_picard_quadratic_census.py'
      - 'stages/stage32/residual-32-01-production/hperp_integral_adapter.py'
      - 'stages/stage32/residual-32-01-production/full178-manifest.json'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - '.github/workflows/stage32-direct-picard-quadratic-bound.yml'

permissions:
  contents: read

jobs:
  quadratic-bound:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify exact quadratic bound and small exhaustive intervals
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib, sys
          root=pathlib.Path.cwd(); prod=root/'stages/stage32/residual-32-01-production'; sys.path.insert(0,str(prod))
          from direct_picard_slice_quadratic_bound import DirectPicardSliceQuadraticBound
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path); assert spec and spec.loader
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod.load()
          bundle=load(root/'stages/stage33/33-07/picard_base_rows_retained.py','s32_quad_picard')
          marking=load(root/'stages/stage33/33-07/stage32_picard_marking_retained.py','s32_quad_marking')
          bound=DirectPicardSliceQuadraticBound.from_retained(marking,bundle)
          c=bound.certificate
          assert c['hperp_positive_definite_exact'] is True
          assert c['slice_kernel_negative_definite_exact'] is True
          assert c['a_quadratic_strictly_concave'] is True
          for g,d,e in [(0,8,8),(0,12,8),(1,4,4),(1,10,4),(1,16,7)]:
              upper=19*d-5*e; lower=-d-2+2*g
              brute=[a for a in range(upper+1) if bound.can_reach_selfsq(d,e,a,lower)]
              interval=bound.feasible_a_interval(d,e,upper,lower)
              expected=[] if interval is None else list(range(interval[0],interval[1]+1))
              assert brute==expected,(g,d,e,brute[:5],brute[-5:],interval)
          pathlib.Path('direct-picard-quadratic-bound.json').write_text(json.dumps(c,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'verdict':'PASS_DIRECT_PICARD_QUADRATIC_BOUND',
              'dual_denominator':bound.dual_denominator,
              'dual_integer_matrix':[list(r) for r in bound.dual_integer_matrix],
              'canonical_sha256':c['canonical_sha256_without_this_field'],
          },sort_keys=True))
          PY
      - name: Count FULL178 exact quadratic survivors
        run: |
          python stages/stage32/residual-32-01-production/build_direct_picard_quadratic_census.py \
            --manifest stages/stage32/residual-32-01-production/full178-manifest.json \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --output direct-picard-quadratic-census.json
      - name: Upload compact quadratic evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-direct-picard-quadratic-bound
          path: |
            direct-picard-quadratic-bound.json
            direct-picard-quadratic-census.json
          retention-days: 7
          compression-level: 9
