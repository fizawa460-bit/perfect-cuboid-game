name: StructureRadar batch14 selector
on:
  push:
    branches: [structure-radar-deep-corpus-batch-14]
    paths:
      - '.github/structure-radar-batch-14-trigger.txt'
jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build selected source summary
        run: |
          python - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('.')
          q=json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          task=next(t for t in q['tasks'] if t['status']=='READY' and t['group']=='STAGE14_15_DEEP_CORPUS')
          ids=task['source_ids']
          entries={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              d=json.loads(p.read_text())
              arr=d.get('sources',d.get('entries',d if isinstance(d,list) else []))
              for e in arr:
                  sid=e.get('source_id') or e.get('id')
                  if sid in ids: entries[sid]=e
          out=[]
          for i,sid in enumerate(ids,1):
              e=entries.get(sid,{})
              path=e.get('path','')
              fp=e.get('fingerprint','')
              text=''
              if path and (root/path).exists():
                  text=(root/path).read_text(errors='replace')
              title=''
              for ln in text.splitlines():
                  if ln.startswith('# '): title=ln[2:].strip(); break
              keys=[]
              pats=[r'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT',r'STRICT_SUBSQRT',r'=true',r'=false',r'boxed',r'<<',r'>>',r'\biff\b',r'\bgcd\b',r'\bmod\b',r'RECEIVER',r'THEOREM',r'PROVED',r'FAIL',r'PASS',r'NEXT=']
              for ln in text.splitlines():
                  s=ln.strip()
                  if s and any(re.search(p,s,re.I) for p in pats):
                      keys.append(s[:320])
                  if len(keys)>=45: break
              out.append({'n':i,'source_id':sid,'path':path,'fingerprint':fp,'title':title,'key_lines':keys,'excerpt':text[:9000]})
          pathlib.Path('.github/structure-radar-batch-14-summary.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          pathlib.Path('.github/structure-radar-batch-14-summary.txt').write_text('\n'.join(f"{x['n']:02d}\t{x['source_id']}\t{x['path']}\t{x['title']}" for x in out)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/structure-radar-batch-14-summary.json .github/structure-radar-batch-14-summary.txt
          git commit -m 'StructureRadar batch14 materialize selected source summary' || exit 0
          git push
