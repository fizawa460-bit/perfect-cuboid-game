name: Stage27-20-r301 lifecycle sync
on:
  push:
    branches: [agent/stage27-20-r301-upper-reentry]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-20-r301-upper-reentry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python stages/stage27/27-20-r301/lifecycle_sync.py
      - run: python stages/stage27/27-20-r301/verify_27_20_r301.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stages/stage27/27-controller.json
          if ! git diff --cached --quiet; then
            git commit -m 'Stage27-20-r301 canonical parallel registration [r301-sync]'
            git push origin HEAD:agent/stage27-20-r301-upper-reentry
          fi
