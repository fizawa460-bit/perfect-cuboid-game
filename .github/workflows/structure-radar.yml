          'SR-STR-225':'Stage14-tH17/r2 repairs the earlier ambient signed-receiver formulation by proving the actual-physical mass/vector inequality with the required internal r-Hölder/Schur penalty. The legal target is the signed physical rectangle/Rayleigh receiver after the exact physical masks; arbitrary-support operator norm or polar/Schatten substitution is a stronger and lossier statement, not an available replacement.',
          'SR-STR-222':'Stage14-tH18 and tH20--tH33 refine the fixed-U receiver into a sequence of exact external theorem targets: canonical-prime windowed correlation, small-kappa projective-ray Type-II/large-sieve forms, reciprocal-distance and prime-row transports, fixed-row density, Gaussian-residue occupancy, and finally the super-Kai individual-residue long-interval gate. Safe Mitsui/Kai ranges are discharged in tH31/tH32, but tH33 remains outside the verified individual-modulus range. None of these branch receivers improves the current whole-family exponent 1/2 by itself.',
          'SR-STR-165':'Stage14-tH2--tH4 and tH8/tH21--tH28 add the divisor-coupled Gaussian norm hyperbola, primary ray-class/conductor adapter, weighted Mellin transfer, and external-auxiliary Gaussian-spin/Hecke interfaces. These reductions preserve sparse physical selectors and conductor bookkeeping; complete or ambient Hecke cancellation cannot be substituted for the exact sparse physical theorem.',
          'SR-STR-166':'Stage14-tH23 gives a projective-chart route from the selected row to an inverse-fraction/Kloosterman profile, but direct theorem import still requires exact compatibility with the numerator/checksum sparse weights and conductor ranges; the transform is a receiver localization, not an automatic saving.',
          'SR-STR-169':'Stage14-tH2/tH8 make the real-divisor allocation and Gaussian external-auxiliary dependence explicit. The divisor/hyperbola reorganization is exponent-neutral until a theorem controls the same sparse physical weights without recharging already-used spacing.',
          'SR-STR-190':'Stage14-tH5/tH9 and toolbox-H0 place the residual problem into an exact diagonal/off-diagonal Gaussian-pair collision energy with signed coefficients. Diagonal extraction is charged once; off-diagonal cross-ratio or auxiliary-modulus dispersion must be proved on the original physical weights rather than after an absolute-value collapse.',
          'SR-STR-206':'Stage14-tH27 records the exact finite menu of selector-changing generic-prime boundary events. A non-negligible orientation influence is thereby localized to an explicit elementary boundary class or a genuinely new secondary statistic, but the localization/pigeonhole itself is not a fixed-power saving.'
          }
          boundary='Batch20 preserves CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=1/2 and STRICT_SUBSQRT_POWER_SAVING_PROVED=false; theorem targets, adapters, safe-range branch discharges and toolbox maps are provenance/receiver information, not a new whole-family exponent or a perfect-cuboid nonexistence theorem.'
          for cid,text in refinements.items():
              c=cards_by_id[cid]
              if text not in c['exact_equations_or_object']:
                  c['exact_equations_or_object'] += ' ' + text
              gaps=c.setdefault('applicability_gaps',[])
              if boundary not in gaps: gaps.append(boundary)

