name: StructureRadar controller

on:
  pull_request:
    paths:
      - 'docs/structure-radar/**'
      - 'scripts/structure_radar.py'
      - '.github/workflows/structure-radar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair search08 ledger linkage
        if: github.head_ref == 'structure-radar-search-08-finalizer'
        run: |
          python - <<'PY'
          import json
          path='docs/structure-radar/structure-registry.json'
          data=json.load(open(path))
          ids={f'SR-STR-{i:03d}' for i in range(57,65)}
          found=[]
          for card in data['structures']:
            if card.get('structure_id') in ids:
              assert card.get('search_status') == 'SEARCHED'
              assert card.get('arsenal_decision') == 'ACTIVE'
              card['search_ledger']='docs/structure-radar/literature/SR-SEARCH-08.md'
              found.append(card['structure_id'])
          assert set(found)==ids
          with open(path,'w') as f:
            json.dump(data,f,indent=2,ensure_ascii=False)
            f.write('\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git fetch origin main
          git checkout origin/main -- .github/workflows/structure-radar.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'StructureRadar: repair search08 ledger linkage'
          git push origin HEAD:${{ github.head_ref }}
      - name: Verify repository-wide StructureRadar corpus and queue
        if: github.head_ref != 'structure-radar-search-08-finalizer'
        run: python scripts/structure_radar.py verify
