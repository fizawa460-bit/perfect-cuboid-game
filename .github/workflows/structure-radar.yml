name: StructureRadar controller

on:
  pull_request:
    paths:
      - 'docs/structure-radar/**'
      - 'scripts/structure_radar.py'
      - '.github/workflows/structure-radar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository-wide StructureRadar corpus and queue
        run: python scripts/structure_radar.py verify

  batch23-card-index:
    if: github.base_ref == 'structure-radar-deep-corpus-batch-23' && github.head_ref == 'structure-radar-batch23-analysis-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-23
      - name: Build compact card index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('docs/structure-radar/structure-registry.json').read_text())
          lines=[]
          for c in reg.get('structures',[]):
              cid=c.get('structure_id','')
              title=c.get('title') or c.get('name') or c.get('canonical_name') or ''
              status=c.get('status','')
              desc=c.get('summary') or c.get('description') or c.get('statement') or ''
              if isinstance(desc,(dict,list)): desc=json.dumps(desc,ensure_ascii=False)
              lines.append(f"{cid}\t{title}\t{status}\t{' '.join(str(desc).split())[:500]}")
          Path('docs/structure-radar/.batch23-card-index.tsv').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/structure-radar/.batch23-card-index.tsv
          git commit -m "Index StructureRadar cards for batch23"
          git push origin HEAD:structure-radar-deep-corpus-batch-23
