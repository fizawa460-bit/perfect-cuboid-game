name: StructureRadar controller

on:
  pull_request:
    paths:
      - 'docs/structure-radar/**'
      - 'scripts/structure_radar.py'
      - '.github/workflows/structure-radar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize search08 on dedicated branch
        if: github.head_ref == 'structure-radar-search-08-finalizer'
        run: |
          python - <<'PY'
          import json, pathlib
          ids=[f'SR-STR-{i:03d}' for i in range(57,65)]
          rp='docs/structure-radar/structure-registry.json'; r=json.load(open(rp)); found=[]
          for c in r['structures']:
            if c['structure_id'] in ids:
              if c['search_status']=='NOT_SEARCHED':
                c['search_status']='SEARCHED'; c['arsenal_decision']='ACTIVE'; c['card_status']='ACTIVE'
              found.append(c['structure_id'])
          assert sorted(found)==ids
          open(rp,'w').write(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          pp='docs/structure-radar/progress.json'; p=json.load(open(pp)); bid='SR-BATCH-LITERATURE_SEARCH-08-R01'
          if not any(x.get('batch_id')==bid for x in p['audit_batches']):
            p['audit_batches'].append({'batch_id':bid,'task_id':'SR-SEARCH-01','status':'SUBMITTED_FOR_AUDIT','source_ids':[],'sources_reviewed':0,'structures_added':0,'structures_updated':8,'structure_carrier_sources':0,'structures_deduped':0,'searches_completed':8,'arsenal_decisions':8,'audit_required':True,'duplicate_source':0,'no_distinct_structure':0})
          open(pp,'w').write(json.dumps(p,indent=2,ensure_ascii=False)+'\n')
          pathlib.Path('docs/structure-radar/literature/SR-SEARCH-08.md').write_text('''# StructureRadar literature ledger — search batch 08\n\nSEARCH_TASK=SR-SEARCH-01\nBATCH_ID=SR-BATCH-LITERATURE_SEARCH-08-R01\nSEARCH_DATE=2026-08-19\nSTRUCTURES=SR-STR-057,SR-STR-058,SR-STR-059,SR-STR-060,SR-STR-061,SR-STR-062,SR-STR-063,SR-STR-064\nSEARCH_BATCH_SIZE=8\nEVIDENCE_POLICY=repo exact receiver first; external primary literature is adjacent unless population/height/quantifiers match\nNOVELTY_BY_SEARCH_ABSENCE=false\n\n## SR-STR-057 — Toric master space-diagonal receiver on the two-face host\nRetain the exact Stage19 rational-point receiver. Generic fibred-surface literature does not impose positivity, primitivity, exact-two-face, physical height R<=B or canonical multiplicity. Transfer verdict: `REPO_EXACT_RECEIVER`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-058 — Split-factor nonisotrivial genus-one tau torsor\nThe displayed split factorization and binary-quartic fibre remain the repo normal form. A genus-one model alone gives neither a rational section nor the physical counting saving. Transfer verdict: `REPO_EXACT_FIBRATION`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-059 — Tau-adic parity obstruction to a rational section\nThe tau-adic parity certificate is retained only for the generic function-field fibre; it is not a nonexistence statement for specialized physical fibres. Transfer verdict: `REPO_LOCAL_NO_SECTION_CERTIFICATE`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-060 — Constant-u bisection genus and physical-degeneration barrier\nThe constant-u genus/discriminant classification remains repo-specific; degree-two points on z^2=1 are boundary and are not promoted to physical lower families. Transfer verdict: `REPO_BISECTION_CLASSIFICATION`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-061 — Affine-linear moving-u multisection discriminant classification\nThe sextic/genus-two and rational discriminant-strata classification is retained exactly and is not extended to quadratic or higher-degree moving u. Transfer verdict: `REPO_LINEAR_MULTISECTION_CLASSIFICATION`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-062 — Universal toric physical-height ledger and degree-eight saturation\nThe formula h_alg=2d_x+2d_y-g is a repo physical-height adapter. R501/R502 saturation at h_alg=8 does not exclude polynomially thicker families. Transfer verdict: `REPO_HEIGHT_ADAPTER`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-063 — Tau pushforward invariant and collision receiver\nThe tau identity and equal-tau collision equation are retained as the exact pushforward receiver. Any external fibration theorem still needs uniform support/fibre bounds in the same physical measure. Transfer verdict: `REPO_PUSHFORWARD_RECEIVER`. Arsenal decision: `ACTIVE`.\n\n## SR-STR-064 — Support-times-max-fiber upper exponent gate\nThe inequality N2(B)<=#T(B) max_t w_B(t) is elementary, but sigma+phi<1/2 is valid only when both inputs are uniform in the same primitive canonical physical measure. Bonolis--Browning, *Uniform bounds for rational points on hyperelliptic fibrations* (arXiv:2007.14182), and Loughran--Smeets, *Fibrations with few rational points* (arXiv:1511.08027), are adjacent primary literature and are not promoted without an exact receiver adapter. Transfer verdict: `REPO_EXACT_COUNTING_GATE_WITH_ADJACENT_LITERATURE`. Arsenal decision: `ACTIVE`.\n\n## Firewalls\n- `NOVELTY_BY_SEARCH_ABSENCE=false`.\n- No-section does not imply no specialized rational points.\n- Boundary z^2=1 multisections are not physical lower families.\n- Linear multisection classification is not extrapolated to higher degree.\n- One-parameter height saturation does not rule out thicker families.\n- External fibration literature requires exact population, height, multiplicity and quantifier matching.\n- No perfect-cuboid existence or nonexistence claim is made.\n''')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git fetch origin main
          git checkout origin/main -- .github/workflows/structure-radar.yml
          rm -f .github/workflows/structure-radar-search08-finalize.yml docs/structure-radar/.search08-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'StructureRadar: literature search batch 08'
          git push origin HEAD:${{ github.head_ref }}
      - name: Verify repository-wide StructureRadar corpus and queue
        if: github.head_ref != 'structure-radar-search-08-finalizer'
        run: python scripts/structure_radar.py verify
