name: StructureRadar controller

on:
  pull_request:
    paths:
      - 'docs/structure-radar/**'
      - 'scripts/structure_radar.py'
      - '.github/workflows/structure-radar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize StructureRadar batch20 from manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          BATCH='SR-BATCH-STAGE14_15_DEEP_CORPUS-20-R01'
          TASK='SR-CENSUS-STAGE14_15_DEEP_CORPUS-01'
          LOCATOR='normalized Stage14 deep-corpus batch20 carrier'
          carrier_map={
            'SRC-5EE8528E4A54':['SR-STR-225'],
            'SRC-A1DBE55B1613':['SR-STR-225'],
            'SRC-7F11D4C7EFA7':['SR-STR-222'],
            'SRC-65C13750EF7A':['SR-STR-165','SR-STR-169'],
            'SRC-1D8B5F0170BF':['SR-STR-222'],
            'SRC-959C43C1D0A8':['SR-STR-165','SR-STR-222'],
            'SRC-17FEA7E6267C':['SR-STR-165','SR-STR-222'],
            'SRC-95FC297E959D':['SR-STR-166','SR-STR-222'],
            'SRC-AEEE5F705A1F':['SR-STR-222'],
            'SRC-356E48AF1706':['SR-STR-222'],
            'SRC-8B0154540FC5':['SR-STR-165','SR-STR-222'],
            'SRC-1F75E8314560':['SR-STR-206','SR-STR-222'],
            'SRC-435E1E19D8B7':['SR-STR-165','SR-STR-222'],
            'SRC-B0D9F76F6B4F':['SR-STR-222'],
            'SRC-6A08003B5793':['SR-STR-165'],
            'SRC-11DD0773FFA6':['SR-STR-222'],
            'SRC-DD48BD195AFE':['SR-STR-222'],
            'SRC-F1FE9CF45489':['SR-STR-222'],
            'SRC-B78FED2A71E6':['SR-STR-222'],
            'SRC-D6AE96619952':['SR-STR-165'],
            'SRC-149B14AACEC6':['SR-STR-190'],
            'SRC-BA7405D3ADF7':['SR-STR-165','SR-STR-169'],
            'SRC-9791D653A4A4':['SR-STR-190'],
            'SRC-9183F0143F98':['SR-STR-165','SR-STR-190'],
          }

          q=json.loads(Path('docs/structure-radar/exploration-queue.json').read_text())
          ready=[t for t in q['tasks'] if t.get('status')=='READY']
          if len(ready)!=1: raise SystemExit(f'expected exactly one READY task, got {len(ready)}')
          task=ready[0]
          ids=task['source_ids']
          if task['task_id']!=TASK or len(ids)!=60 or ids[0]!='SRC-5EE8528E4A54' or ids[-1]!='SRC-06F4989C42A0':
              raise SystemExit('READY slice changed; refusing stale batch20 materialization')
          if len(carrier_map)!=24 or not set(carrier_map).issubset(ids):
              raise SystemExit('carrier map mismatch')

          manifest={}
          for p in sorted(Path('docs/structure-radar/source-manifest').glob('part-*.json')):
              for s in json.loads(p.read_text())['sources']:
                  if s['source_id'] in ids: manifest[s['source_id']]=s
          if set(manifest)!=set(ids):
              raise SystemExit('manifest coverage mismatch')
          for sid in ids:
              if manifest[sid].get('review_state')!='NEW':
                  raise SystemExit(f'{sid} is not NEW')

          pp=Path('docs/structure-radar/progress.json')
          progress=json.loads(pp.read_text())
          if 'batches' in progress: raise SystemExit('forbidden top-level progress.batches key present')
          reviews=progress.setdefault('source_reviews',{})
          for sid in ids:
              s=manifest[sid]
              cards=carrier_map.get(sid,[])
              rec={'fingerprint':s['fingerprint'],'batch_id':BATCH,'status':'STRUCTURES_RECORDED' if cards else 'NO_DISTINCT_STRUCTURE'}
              if cards: rec['structure_ids']=cards
              reviews[sid]=rec
          batch={
            'batch_id':BATCH,'task_id':TASK,'status':'SUBMITTED_FOR_AUDIT','source_ids':ids,
            'sources_reviewed':60,'structures_added':0,'structures_updated':7,
            'structure_carrier_sources':24,'structures_deduped':36,
            'searches_completed':0,'arsenal_decisions':0,'audit_required':True,
            'duplicate_source':0,'no_distinct_structure':36
          }
          audits=[x for x in progress.setdefault('audit_batches',[]) if x.get('batch_id')!=BATCH]
          audits.append(batch)
          progress['audit_batches']=audits
          pp.write_text(json.dumps(progress,indent=2,ensure_ascii=False)+'\n')

          rp=Path('docs/structure-radar/structure-registry.json')
          registry=json.loads(rp.read_text())
          byid={c['structure_id']:c for c in registry['structures']}
          updated=['SR-STR-165','SR-STR-166','SR-STR-169','SR-STR-190','SR-STR-206','SR-STR-222','SR-STR-225']
          if any(cid not in byid for cid in updated): raise SystemExit('updated card missing')
          for sid,cards in carrier_map.items():
              s=manifest[sid]
              for cid in cards:
                  prov=byid[cid].setdefault('repo_provenance',[])
                  if not any(x.get('source_id')==sid for x in prov):
                      prov.append({'source_id':sid,'path':s['path'],'locator':LOCATOR,'fingerprint':s['fingerprint']})

          refinements={
            'SR-STR-225':'Stage14-tH17/r2 repairs the earlier ambient signed-receiver formulation by proving the actual-physical mass/vector inequality with the required internal r-Hölder/Schur penalty. The legal target is the signed physical rectangle/Rayleigh receiver after the exact physical masks; arbitrary-support operator norm or polar/Schatten substitution is a stronger and lossier statement, not an available replacement.',
            'SR-STR-222':'Stage14-tH18 and tH20--tH33 refine the fixed-U receiver into exact external theorem targets from canonical-prime windowed correlation through projective-ray Type-II, reciprocal-distance/prime-row transports and Gaussian-residue occupancy to the super-Kai individual-residue long-interval gate. Safe Mitsui/Kai ranges are discharged in tH31/tH32, but tH33 remains outside the verified individual-modulus range; none of these branch receivers improves the current whole-family exponent 1/2 by itself.',
            'SR-STR-165':'Stage14-tH2--tH4 and tH8/tH21--tH28 add the divisor-coupled Gaussian norm hyperbola, primary ray-class/conductor adapter, weighted Mellin transfer, and external-auxiliary Gaussian-spin/Hecke interfaces. These reductions preserve sparse physical selectors and conductor bookkeeping; complete or ambient Hecke cancellation cannot replace the exact sparse physical theorem.',
            'SR-STR-166':'Stage14-tH23 gives a projective-chart route from the selected row to an inverse-fraction/Kloosterman profile, but theorem import still requires exact compatibility with numerator/checksum sparse weights and conductor ranges; the transform is receiver localization, not an automatic saving.',
            'SR-STR-169':'Stage14-tH2/tH8 make the real-divisor allocation and Gaussian external-auxiliary dependence explicit. The divisor/hyperbola reorganization is exponent-neutral until a theorem controls the same sparse physical weights without recharging already-used spacing.',
            'SR-STR-190':'Stage14-tH5/tH9 and toolbox-H0 place the residual problem into an exact diagonal/off-diagonal Gaussian-pair collision energy with signed coefficients. Diagonal extraction is charged once; off-diagonal cross-ratio or auxiliary-modulus dispersion must be proved on the original physical weights rather than after an absolute-value collapse.',
            'SR-STR-206':'Stage14-tH27 records the finite menu of selector-changing generic-prime boundary events. A non-negligible orientation influence is localized to an explicit elementary boundary class or a genuinely new secondary statistic, but the localization/pigeonhole itself is not a fixed-power saving.'
          }
          boundary='Batch20 preserves CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=1/2 and STRICT_SUBSQRT_POWER_SAVING_PROVED=false; theorem targets, adapters, safe-range branch discharges and toolbox maps are receiver/provenance information, not a new whole-family exponent or a perfect-cuboid nonexistence theorem.'
          for cid,text in refinements.items():
              c=byid[cid]
              if text not in c['exact_equations_or_object']: c['exact_equations_or_object'] += ' ' + text
              gaps=c.setdefault('applicability_gaps',[])
              if boundary not in gaps: gaps.append(boundary)
          registry['status']='BATCH_SUBMITTED_FOR_AUDIT'
          rp.write_text(json.dumps(registry,indent=2,ensure_ascii=False)+'\n')
          print('BATCH20_LEDGER=PASS')
          print('SOURCES_REVIEWED=60 CARRIERS=24 NO_DISTINCT=36 UPDATED=7')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git diff --check
      - name: Commit official batch20 files and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/structure-radar.yml
          rm -f .github/workflows/structure-radar-batch20-selector.yml
          rm -f .github/structure-radar-batch20-selector-trigger.txt
          rm -f docs/structure-radar/batch20-source-digest.txt docs/structure-radar/batch20-selected.json
          git add -A
          git diff --cached --check
          git commit -m 'StructureRadar census Stage14-15 deep corpus batch 20'
          git push origin HEAD:structure-radar-deep-corpus-batch-20
