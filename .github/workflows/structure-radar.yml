name: StructureRadar controller

on:
  pull_request:
    paths:
      - 'docs/structure-radar/**'
      - 'scripts/structure_radar.py'
      - '.github/workflows/structure-radar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository-wide StructureRadar corpus and queue
        run: python scripts/structure_radar.py verify

  batch23-analysis:
    if: github.base_ref == 'structure-radar-deep-corpus-batch-23' && github.head_ref == 'structure-radar-batch23-analysis-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-23
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build batch23 lineage report
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          progress=json.loads(Path('docs/structure-radar/progress.json').read_text())
          registry=json.loads(Path('docs/structure-radar/structure-registry.json').read_text())
          sources=[]
          for p in sorted(Path('docs/structure-radar/source-manifest').glob('part-*.json')):
              sources += json.loads(p.read_text()).get('sources',[])
          reviews=progress.get('source_reviews',{})
          id_by_path={s['path']:s['source_id'] for s in sources}
          new=[s for s in sources if s.get('queue_group')=='STAGE14_15_DEEP_CORPUS' and s.get('review_state') in ('NEW','CHANGED','UNRESOLVED')]
          new.sort(key=lambda s:(s.get('priority',99),s['path']))
          batch=new[:60]

          def stage_mapping(stage):
              out=[]
              for p in (f'stages/stage14/archive/tasks/{stage}/result.md',f'stages/stage14/tasks/{stage}/result.md'):
                  sid=id_by_path.get(p)
                  if sid: out += reviews.get(sid,{}).get('structure_ids',[])
              return sorted(set(out))

          report=[]
          for s in batch:
              path=s['path']; p=Path(path)
              txt=p.read_text(errors='replace') if p.exists() else ''
              m=re.search(r'/data/(14-[^/]+)/',path); producer=m.group(1) if m else None
              producer_map=stage_mapping(producer) if producer else []
              refs=sorted(set(re.findall(r'\b14-(?:[A-Za-z]+[A-Za-z0-9-]*|\d+[A-Za-z][A-Za-z0-9-]*)\b',txt)))
              refmaps={r:stage_mapping(r) for r in refs if stage_mapping(r)}
              registry_hits=[]
              if producer:
                  needle=f'/tasks/{producer}/result.md'
                  for card in registry.get('structures',[]):
                      if any(needle in prov.get('path','') for prov in card.get('repo_provenance',[])):
                          registry_hits.append(card.get('structure_id'))
              boundary=[]
              for line in txt.splitlines():
                  z=line.strip()
                  if ('=' in z or ':' in z) and any(k in z.upper() for k in ['PROVED','STATUS','VERDICT','COMPLETE','BOUND','EXPONENT','SAVING','EMPTY','NEXT_RECOMMENDED','REMAINING_RECEIVER']):
                      if len(z)<260: boundary.append(z)
              report.append({'source_id':s['source_id'],'path':path,'fingerprint':s['fingerprint'],'producer':producer,
                  'producer_structure_ids':producer_map,'registry_producer_hits':sorted(set(registry_hits)),
                  'referenced_stage_structure_ids':refmaps,'boundary_lines':boundary[:35],'preview':' '.join(txt[:1800].split())})
          out={'batch_size':len(batch),'remaining_before':len(new),'next_after_batch':new[60] if len(new)>60 else None,'sources':report}
          Path('docs/structure-radar/.batch23-analysis.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          lines=[]
          for i,r in enumerate(report,1):
              ref_union=sorted({x for xs in r['referenced_stage_structure_ids'].values() for x in xs})
              flags=[]
              for b in r['boundary_lines']:
                  bu=b.upper()
                  if any(k in bu for k in ('NO_DISTINCT','NEW_WHOLE_FAMILY_POWER_SAVING_PROVED','ADDITIONAL_WHOLE_FAMILY_POWER_SAVING','PROVED\": FALSE','EMPTY\": TRUE')):
                      flags.append(b.replace('\t',' '))
              lines.append(f"{i:02d}\t{r['source_id']}\t{r['producer']}\tP={','.join(r['producer_structure_ids']) or '-'}\tR={','.join(r['registry_producer_hits']) or '-'}\tREF={','.join(ref_union) or '-'}\t{r['path']}\t{' ; '.join(flags[:3])}")
          Path('docs/structure-radar/.batch23-compact.tsv').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/structure-radar/.batch23-analysis.json docs/structure-radar/.batch23-compact.tsv
          if ! git diff --cached --quiet; then
            git commit -m "Refresh StructureRadar batch23 lineage report"
            git push origin HEAD:structure-radar-deep-corpus-batch-23
          fi
