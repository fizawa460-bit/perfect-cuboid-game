          for sid,path,fp,cards in rows:
              data=Path(path).read_bytes()
              actual=hashlib.sha256(data).hexdigest()
              if actual != fp: raise SystemExit(f'fingerprint mismatch {sid} {path}: {actual} != {fp}')

          pp=Path('docs/structure-radar/progress.json')
          progress=json.loads(pp.read_text())
          if 'batches' in progress: raise SystemExit('forbidden top-level progress.batches key present')
          reviews=progress.setdefault('source_reviews',{})
          for sid,path,fp,cards in rows:
              rec={'fingerprint':fp,'batch_id':BATCH,'status':'STRUCTURES_RECORDED' if cards else 'NO_DISTINCT_STRUCTURE'}
              if cards: rec['structure_ids']=cards
              reviews[sid]=rec

          batch={
            'batch_id':BATCH,
            'task_id':TASK,
            'status':'SUBMITTED_FOR_AUDIT',
            'source_ids':[r[0] for r in rows],
            'sources_reviewed':60,
            'structures_added':0,
