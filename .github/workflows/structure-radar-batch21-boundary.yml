name: StructureRadar batch21 boundary extractor

on:
  push:
    branches:
      - structure-radar-deep-corpus-batch-21

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Extract compact mathematical boundaries
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.')
          q=json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          task=next(t for t in q['tasks'] if t['status']=='READY')
          ids=task['source_ids'][:60]
          sm={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              for s in json.loads(p.read_text())['sources']:
                  if s['source_id'] in ids: sm[s['source_id']]=s
          keyrx=re.compile(r'\b([A-Z][A-Z0-9_]{3,})\s*=\s*([^`\n]+)')
          sig_rx=re.compile(r'(?i)(receiver|obstruction|unresolved|proved|not proved|does not|saving|exponent|theorem|lemma|identity|reduction|boundary|next=|current_|strict_|applicable|counterexample|rank|torsion|height|gcd|prime|gaussian|pell|kummer|dispersion|collision|sieve)')
          data=[]
          for sid in ids:
              s=sm[sid]; txt=(root/s['path']).read_text(errors='replace') if (root/s['path']).exists() else ''
              lines=txt.splitlines()
              title=next((x.strip('# ').strip() for x in lines if x.strip().startswith('#')), '')
              kv=[]
              for ln in lines:
                  for m in keyrx.finditer(ln):
                      item=f'{m.group(1)}={m.group(2).strip()}'
                      if item not in kv: kv.append(item)
              sig=[]
              for ln in lines:
                  st=' '.join(ln.strip().split())
                  if st and sig_rx.search(st) and st not in sig:
                      sig.append(st[:360])
                  if len(sig)>=18: break
              data.append({'source_id':sid,'path':s['path'],'kind':s['kind'],'title':title,'boundary':kv[-45:],'signals':sig})
          (root/'docs/structure-radar/.batch21-boundary-pack.json').write_text(json.dumps({'task':task['task_id'],'count':len(ids),'sources':data},indent=2,ensure_ascii=False)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/structure-radar/.batch21-boundary-pack.json
          if ! git diff --cached --quiet; then
            git commit -m "Build StructureRadar batch21 boundary pack"
            git push origin HEAD:structure-radar-deep-corpus-batch-21
          fi
