name: StructureRadar batch33 analyzer
on:
  push:
    branches: [structure-radar-history-batch-33]
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact source analysis
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,re,math
          root=pathlib.Path('.')
          q=json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          task=next(t for t in q['tasks'] if t['status']=='READY' and t['phase']=='SOURCE_CENSUS')
          ids=task['source_ids']; assert len(ids)==60
          sm={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              d=json.loads(p.read_text())
              for s in d['sources']: sm[s['source_id']]=s
          prog=json.loads((root/'docs/structure-radar/progress.json').read_text())
          reg=json.loads((root/'docs/structure-radar/structure-registry.json').read_text())
          def toks(s): return set(re.findall(r'[A-Za-z0-9_]+',s.lower()))
          card_t=[(c['structure_id'],c.get('canonical_math_name',''),toks(c.get('canonical_math_name','')+' '+c.get('exact_equations_or_object',''))) for c in reg['structures']]
          reviewed=[]
          for sid,rv in prog['source_reviews'].items():
              if rv.get('status')!='STRUCTURES_RECORDED': continue
              s=sm.get(sid)
              if s: reviewed.append((sid,s['path'],rv.get('structure_ids',[])))
          lines=['sid\tpath\tkind\trole\tpreview\ttop_cards\tbasename_neighbors']
          for sid in ids:
              s=sm[sid]; path=s['path']; p=root/path
              text=''
              if p.exists() and p.is_file():
                  try: text=p.read_text(errors='ignore')[:18000]
                  except: text=''
              compact=' | '.join(x.strip() for x in text.splitlines() if x.strip())[:1000]
              tt=toks(path+' '+compact)
              scored=[]
              for cid,name,ct in card_t:
                  if not ct: continue
                  inter=len(tt&ct)
                  if inter: scored.append((inter/math.sqrt(max(1,len(ct))),cid,name))
              scored=sorted(scored,reverse=True)[:6]
              top='; '.join(f'{cid}:{score:.2f}:{name}' for score,cid,name in scored)
              stem=p.stem.lower() if p.suffix else p.name.lower(); base=[]
              for rsid,rpath,cids in reviewed:
                  rp=pathlib.Path(rpath); sim=0
                  if rp.stem.lower()==stem: sim+=3
                  a=set(re.findall(r'\d+[a-z]+|\d+',path.lower())); b=set(re.findall(r'\d+[a-z]+|\d+',rpath.lower()))
                  sim+=len(a&b)
                  if sim>=3: base.append((sim,rsid,rpath,cids))
              base=sorted(base,reverse=True)[:4]
              neigh='; '.join(f'{rsid}|{rpath}|{",".join(cids)}' for _,rsid,rpath,cids in base)
              vals=[sid,path,s.get('kind',''),s.get('evidence_role',''),compact,top,neigh]
              lines.append('\t'.join(x.replace('\t',' ').replace('\n',' ') for x in vals))
          out=root/'.tmp/sr-b33-summary.tsv'; out.parent.mkdir(exist_ok=True); out.write_text('\n'.join(lines)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp/sr-b33-summary.tsv
          git commit -m 'Temp: record batch33 source analysis' || true
          git push origin HEAD:structure-radar-history-batch-33
