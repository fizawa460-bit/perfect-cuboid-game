name: Stage32-18AY d16 b16 parent-stable monster algorithm tournament

on:
  push:
    branches: [stage32-18ax-b16-remaining-walls-tier3-planner]
    paths: ['stages/stage32/runkeys/18ay-b16-monster-algorithm-tournament.json']

permissions: {contents: read, actions: read}
concurrency: {group: stage32-18ay-b16-monster-algorithm-tournament, cancel-in-progress: true}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: gate
        run: |
          set -euo pipefail
          KEY=stages/stage32/runkeys/18ay-b16-monster-algorithm-tournament.json
          authorized=false
          if git cat-file -e HEAD^\^{commit} 2>/dev/null && [ "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 1 ] && git diff --name-only HEAD^ HEAD | grep -Fxq "$KEY" && [ "$(git log -1 --pretty=%s)" = 'Stage32-18AY: ARM B16 PARENT-STABLE MONSTER TOURNAMENT G3' ]; then
            python - <<'PY'
          import json,pathlib,os
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18ay-b16-monster-algorithm-tournament.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1' and d['generation']==3 and d['armed'] and d['bound']==16
          assert d['source_exact_artifact_id']==9574308138 and d['planner_probe_budget']==262144
          assert d['sample_per_wall']==4 and d['max_parallel']==6 and d['allow_finer_split'] is False
          assert d['parent_cut']==39 and d['parent_partition_stable'] is True
          assert d['algorithms']==['pairwise6','pairwise12']
          walls=d['walls']; assert len(walls)==6 and sum(x['monster_count'] for x in walls)==172
          inc=[]
          for w in walls:
              for a in d['algorithms']: inc.append({'algo':a,**w})
          assert len(inc)==12
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':inc},separators=(',',':'))+'\n')
          PY
            authorized=true
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"

  tournament:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.authorize.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch locked source and baseline monster certificate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ matrix.artifact }}
          MONSTER_COUNT: ${{ matrix.monster_count }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++ libboost-dev
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/monster" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/source.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/src"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/monster.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT}/zip"
          unzip -q "$RUNNER_TEMP/monster.zip" -d "$RUNNER_TEMP/monster"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'monster'; docs=[]
          for p in root.rglob('*.json'):
              try:
                  d=json.loads(p.read_text())
                  ids=d.get('monster_frontier_ids',d.get('tier4_frontier_ids'))
                  if ids is not None: docs.append((d,ids))
              except Exception: pass
          assert len(docs)==1,len(docs)
          d,ids=docs[0]; assert len(ids)==int(os.environ['MONSTER_COUNT'])
          n=len(ids); ix=sorted(set([0,n//3,(2*n)//3,n-1])); assert len(ix)==4
          picked=[ids[i] for i in ix]
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'work'/'sample-ids.txt').write_text(''.join(f'{x}\n' for x in picked))
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'work'/'sample.json').write_text(json.dumps({'picked':picked},sort_keys=True))
          PY
      - name: Build parent-stable exact tournament certifier
        env:
          PRIMARY: ${{ matrix.primary }}
          ALGO: ${{ matrix.algo }}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/work/cert.cpp"
          python stages/stage32/32-18X/build_two_stage_certifier.py --source "$RUNNER_TEMP/src/d16-exact-symmetry-sharded.cpp" --output "$SRC" --primary-id "$PRIMARY"
          SRC="$SRC" python stages/stage32/32-18AF/patch_symmetry_schedule.py
          SRC="$SRC" python stages/stage32/32-18AO/patch_block_frontier.py
          SRC="$SRC" python stages/stage32/32-18AP/patch_lower_block_replay.py
          SRC="$SRC" python stages/stage32/32-18AR/patch_frontier_cost_planner.py
          SRC="$SRC" python stages/stage32/32-18AS/patch_selective_frontier_planner.py
          if [ "$ALGO" = pairwise6 ]; then PAIR_LIMIT=6 PAIR_RATIO=0.20 SRC="$SRC" python stages/stage32/32-18AY/patch_pairwise_symmetry.py; fi
          if [ "$ALGO" = pairwise12 ]; then PAIR_LIMIT=12 PAIR_RATIO=0.05 SRC="$SRC" python stages/stage32/32-18AY/patch_pairwise_symmetry.py; fi
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic "$SRC" -o "$RUNNER_TEMP/work/cert"
          cp "$RUNNER_TEMP/src/d16-hperp.txt" "$RUNNER_TEMP/work/"
          cp "$RUNNER_TEMP/src/d16-aut-prefix256-bundle.txt" "$RUNNER_TEMP/work/"
      - name: Probe the same baseline monster parents
        env:
          SHARD: ${{ matrix.shard }}
          ALGO: ${{ matrix.algo }}
          WALL: ${{ matrix.wall }}
        run: |
          set -euo pipefail
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" timeout --signal=TERM --kill-after=20s 40m "$RUNNER_TEMP/work/cert" --input "$RUNNER_TEMP/work/d16-hperp.txt" --bundle "$RUNNER_TEMP/work/d16-aut-prefix256-bundle.txt" --output "$RUNNER_TEMP/out/cert.json" --dump-canonical "$RUNNER_TEMP/out/dump.bin" --bound 16 --shard-id "$SHARD" --shard-count 1024 --split-coordinate 48 --block-cut 39 --frontier-cap 50000 --replay-limit 0 --planner-probe-budget 262144 --planner-output "$RUNNER_TEMP/out/costs.csv" --planner-id-file "$RUNNER_TEMP/work/sample-ids.txt" --node-cap 2000000 >/dev/null 2>"$RUNNER_TEMP/out/stderr.txt"
          python - <<'PY'
          import csv,json,os,pathlib,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']); rows=list(csv.DictReader((root/'out'/'costs.csv').open())); assert len(rows)==4
          picked=json.loads((root/'work'/'sample.json').read_text())['picked']; assert [int(r['frontier_id']) for r in rows]==picked
          done=sum(r['complete']=='1' for r in rows); nodes=sum(int(r['probe_nodes']) for r in rows)
          cert=json.loads((root/'out'/'cert.json').read_text()); assert cert['frontier_states']>max(picked); assert cert['pairwise_parent_partition_stable'] is True
          out={'schema':'STAGE32_18AY_PARENT_STABLE_MONSTER_TOURNAMENT_RESULT_V1','algorithm':os.environ['ALGO'],'wall':os.environ['WALL'],'sample_ids':picked,'sample_count':4,'completed_count':done,'unresolved_count':4-done,'total_probe_nodes':nodes,'probe_budget_per_state':262144,'runtime_seconds':float((root/'out'/'runtime.txt').read_text().strip()),'parent_cut':39,'parent_partition_stable':True,'pairwise_checks':cert.get('pairwise_symmetry_checks'),'pairwise_prunes':cert.get('pairwise_symmetry_prunes'),'sample_stream_sha256':hashlib.sha256(('\n'.join(map(str,picked))+'\n').encode()).hexdigest(),'D16_B16_NUMERICAL_CREDIT':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False}
          (root/'out'/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          for x in ['cert.json','dump.bin','costs.csv','stderr.txt']:(root/'out'/x).unlink(missing_ok=True)
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18ay-${{ matrix.algo }}-${{ matrix.wall }}-g3
          path: ${{ runner.temp }}/out/
          retention-days: 2
          if-no-files-found: error

  summarize:
    needs: [authorize,tournament]
    if: always() && needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-18ay-*-g3
          path: ${{ runner.temp }}/runs
      - run: |
          python - <<'PY'
          import json,os,pathlib
          docs=[json.loads(p.read_text()) for p in (pathlib.Path(os.environ['RUNNER_TEMP'])/'runs').rglob('compact.json')]; assert len(docs)==12,len(docs)
          agg={}
          for a in ('pairwise6','pairwise12'):
              xs=[d for d in docs if d['algorithm']==a]; assert len(xs)==6 and all(x['parent_partition_stable'] for x in xs)
              agg[a]={'completed':sum(x['completed_count'] for x in xs),'sample':24,'nodes':sum(x['total_probe_nodes'] for x in xs),'runtime_seconds':sum(x['runtime_seconds'] for x in xs)}
          best=max(agg,key=lambda a:(agg[a]['completed'],-agg[a]['nodes'])); other=[a for a in agg if a!=best][0]; b=agg[best]
          clear=b['completed']>=6 and (b['completed']>=agg[other]['completed']+4 or (b['completed']==agg[other]['completed'] and b['completed']>=12 and b['nodes']*2<=agg[other]['nodes']))
          verdict='CLEAR_WINNER' if clear else 'NO_CLEAR_WINNER_SPLIT_NEXT'
          out={'schema':'STAGE32_18AY_PARENT_STABLE_MONSTER_TOURNAMENT_SUMMARY_V1','known_baseline_completed':0,'parent_cut':39,'parent_partition_stable':True,'algorithms':agg,'verdict':verdict,'winner':best if clear else None,'next_item':'32-18AZ_D16_B16_172_MONSTER_WINNER_FULL_RUN' if clear else '32-18AZ_D16_B16_172_MONSTER_SELECTIVE_SPLIT','D16_B16_NUMERICAL_CREDIT':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False}
          outdir=pathlib.Path(os.environ['RUNNER_TEMP'])/'summary'; outdir.mkdir(); (outdir/'summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18ay-parent-stable-monster-tournament-summary-g3
          path: ${{ runner.temp }}/summary/
          retention-days: 7
          if-no-files-found: error
