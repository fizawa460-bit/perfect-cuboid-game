name: Stage33 V91C1X_R3 checkpoint state materializer

on:
  push:
    branches:
      - stage33-v91c1x-r1-chain-level-kummer-bridge
    paths:
      - '.github/workflows/stage33-v91c1x-r3-state-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage33-v91c1x-r1-chain-level-kummer-bridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize exact R3 checkpoint state
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r3_checkpoint_main_state.py --write
      - name: Verify only expected state changed
        run: |
          git diff --check
          test "$(git status --porcelain | wc -l)" -eq 1
          git status --porcelain | grep 'stages/stage33/MAIN-STATE.json'
      - name: Commit checkpoint state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stages/stage33/MAIN-STATE.json
          git commit -m '[Stage33] materialize V91C1X_R3 grouped-audit state'
          git push origin HEAD:stage33-v91c1x-r1-chain-level-kummer-bridge
