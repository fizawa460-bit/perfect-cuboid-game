name: StructureRadar batch 06 PR finalizer v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'structure-radar-deep-corpus-batch-06'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: structure-radar-deep-corpus-batch-06
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and run batch logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/structure-radar-batch-06-finalize.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          body = src.split(start, 1)[1].split(end, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          script = '\n'.join(lines) + '\n'
          script = script.replace(
              "source_map = {s['source_id']: s for s in manifest['sources']}",
              "def walk_sources(obj):\n    if isinstance(obj, dict):\n        if 'source_id' in obj and 'path' in obj:\n            yield obj\n        for value in obj.values():\n            yield from walk_sources(value)\n    elif isinstance(obj, list):\n        for value in obj:\n            yield from walk_sources(value)\n\nsource_map = {}\nfor part in sorted((RADAR / 'source-manifest').glob('part-*.json')):\n    for source in walk_sources(load(part)):\n        source_map[source['source_id']] = source"
          )
          script = script.replace(
              "by_path = {s['path']: s for s in manifest['sources']}",
              "by_path = {s['path']: s for s in source_map.values()}"
          )
          script = script.replace(
              "assert sum(1 for s in current if s['path'].endswith('/result.md')) == 30",
              "assert len(expected_carriers) == 30"
          )
          Path('/tmp/structure_radar_batch_06.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/structure_radar_batch_06.py
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python scripts/verify_research_arsenal.py
          git diff --check
          rm -f .github/workflows/structure-radar-batch-06-finalize.yml
          rm -f .github/workflows/structure-radar-batch-06-pr-finalize.yml
          rm -f .github/workflows/structure-radar-batch-06-pr-finalize-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/structure-radar .github/workflows
          git commit -m 'StructureRadar: review deep corpus batch 06'
          git push origin HEAD:structure-radar-deep-corpus-batch-06
