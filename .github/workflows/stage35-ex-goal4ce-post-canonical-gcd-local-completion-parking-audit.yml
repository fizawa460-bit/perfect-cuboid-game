name: Stage35-EX Goal4CE post canonical gcd local completion parking audit

on:
  pull_request:
    paths:
      - 'stages/stage35-ex/MAIN-STATE.json'
      - 'stages/stage35-ex/35ex-35/goal4cd-canonical-e1-cross-gcd-p-d-local-square-source-lock.md'
      - 'stages/stage35-ex/35ex-35/goal4cd-canonical-e1-cross-gcd-p-d-local-square.json'
      - 'stages/stage35-ex/verify_stage35_ex_35_goal4cd_canonical_e1_cross_gcd_p_d_local_square.py'
      - 'stages/stage35-ex/35ex-35/goal4ce-post-canonical-gcd-local-completion-parking-audit-source-lock.md'
      - 'stages/stage35-ex/35ex-35/goal4ce-post-canonical-gcd-local-completion-parking-audit.json'
      - 'stages/stage35-ex/verify_stage35_ex_35_goal4ce_post_canonical_gcd_local_completion_parking_audit.py'
      - '.github/workflows/stage35-ex-goal4ce-post-canonical-gcd-local-completion-parking-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-goal4ce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head checkout
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "ACTUAL_HEAD_SHA=${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay Goal4CD parent
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4cd_canonical_e1_cross_gcd_p_d_local_square.py
      - name: Verify Goal4CE parking audit
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4ce_post_canonical_gcd_local_completion_parking_audit.py
