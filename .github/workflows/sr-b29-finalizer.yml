name: StructureRadar batch29 finalizer

on:
  push:
    branches:
      - structure-radar-deep-corpus-batch-29

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply batch29 census
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          batch_id='SR-BATCH-STAGE14_15_DEEP_CORPUS-29-R01'
          task_id='SR-CENSUS-STAGE14_15_DEEP_CORPUS-01'
          M={
            'SRC-931EAC39437C':['SR-STR-017','SR-STR-216'],
            'SRC-6DE7FEFF1775':['SR-STR-044','SR-STR-200'],
            'SRC-C8ECB9E83664':['SR-STR-169','SR-STR-222'],
            'SRC-83CCA96E2A95':['SR-STR-200','SR-STR-202'],
            'SRC-6F52439F7C39':['SR-STR-215'],
            'SRC-E85B74645065':['SR-STR-039','SR-STR-143','SR-STR-145','SR-STR-187','SR-STR-216'],
            'SRC-6D6C2B609695':['SR-STR-039','SR-STR-143','SR-STR-145','SR-STR-187','SR-STR-216'],
            'SRC-B36469150E45':None,
          }
          qpath=root/'docs/structure-radar/exploration-queue.json'
          q=json.loads(qpath.read_text())
          task=next(t for t in q['tasks'] if t['status']=='READY' and t['phase']=='SOURCE_CENSUS')
          ids=task['source_ids']
          assert task['task_id']==task_id, task['task_id']
          assert len(ids)==8, len(ids)
          assert ids==list(M), ids

          source_map={}; part_docs={}
          for p in sorted((root/'docs/structure-radar/source-manifest').glob('part-*.json')):
              d=json.loads(p.read_text()); part_docs[p]=d
              for s in d['sources']:
                  source_map[s['source_id']]=s
          prog_path=root/'docs/structure-radar/progress.json'
          prog=json.loads(prog_path.read_text())
          assert not any(b.get('batch_id')==batch_id for b in prog['audit_batches'])
          reg_path=root/'docs/structure-radar/structure-registry.json'
          reg=json.loads(reg_path.read_text())
          cards={c['structure_id']:c for c in reg['structures']}

          for sid in ids:
              s=source_map[sid]
              assert s['review_state']=='NEW', (sid,s['review_state'])
              assert sid not in prog['source_reviews'], sid
              cids=M[sid]
              if cids is None:
                  prog['source_reviews'][sid]={
                      'fingerprint':s['fingerprint'],'status':'NO_DISTINCT_STRUCTURE','batch_id':batch_id}
              else:
                  assert len(cids)==len(set(cids))
                  for cid in cids: assert cid in cards, cid
                  prog['source_reviews'][sid]={
                      'fingerprint':s['fingerprint'],'status':'STRUCTURES_RECORDED','batch_id':batch_id,'structure_ids':cids}
                  for cid in cids:
                      pv=cards[cid].setdefault('repo_provenance',[])
                      if not any(x.get('source_id')==sid for x in pv):
                          pv.append({
                              'source_id':sid,'path':s['path'],
                              'locator':'normalized Stage14-15 deep-corpus batch29 carrier',
                              'fingerprint':s['fingerprint']})
              s['review_state']='CURRENT_REVIEWED'

          union=sorted({cid for sid in ids if M[sid] for cid in M[sid]})
          assert len(union)==12, union
          carrier=sum(M[sid] is not None for sid in ids)
          nodist=sum(M[sid] is None for sid in ids)
          assert (carrier,nodist)==(7,1)
          prog['audit_batches'].append({
              'batch_id':batch_id,'task_id':task_id,'status':'SUBMITTED_FOR_AUDIT','source_ids':ids,
              'sources_reviewed':8,'structures_added':0,'structures_updated':12,
              'structure_carrier_sources':7,'structures_deduped':1,'searches_completed':0,
              'arsenal_decisions':0,'audit_required':True,'duplicate_source':0,'no_distinct_structure':1})

          prog_path.write_text(json.dumps(prog,indent=2,ensure_ascii=False)+'\n')
          reg_path.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')
          for p,d in part_docs.items():
              if any(s['source_id'] in M for s in d['sources']):
                  p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Refresh and verify
        shell: bash
        run: |
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git diff --check
      - name: Assert batch29 accounting
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          r=pathlib.Path('.')
          c=json.loads((r/'docs/structure-radar/controller.json').read_text())
          assert c['corpus']['review_states']=={'CURRENT_REVIEWED':2270,'NEW':286}, c['corpus']['review_states']
          assert c['registry']['structure_count']==225
          p=json.loads((r/'docs/structure-radar/progress.json').read_text())
          b=next(x for x in p['audit_batches'] if x['batch_id']=='SR-BATCH-STAGE14_15_DEEP_CORPUS-29-R01')
          assert b['sources_reviewed']==8 and b['structures_updated']==12
          assert b['structure_carrier_sources']==7 and b['no_distinct_structure']==1 and b['duplicate_source']==0
          reviews=[v for v in p['source_reviews'].values() if v.get('batch_id')==b['batch_id']]
          assert len(reviews)==8
          assert sum(v['status']=='STRUCTURES_RECORDED' for v in reviews)==7
          assert sum(v['status']=='NO_DISTINCT_STRUCTURE' for v in reviews)==1
          union=sorted({x for v in reviews for x in v.get('structure_ids',[])})
          assert len(union)==12, union
          q=json.loads((r/'docs/structure-radar/exploration-queue.json').read_text())
          ready=next(t for t in q['tasks'] if t['status']=='READY' and t['phase']=='SOURCE_CENSUS')
          assert ready['task_id']=='SR-CENSUS-STAGE02_13_HISTORY-01', ready['task_id']
          assert ready['source_ids'][0]=='SRC-BF09C8BEAE3D', ready['source_ids'][0]
          print('BATCH29_OK',len(reviews),len(union),ready['task_id'],ready['source_ids'][0])
          PY
      - name: Commit final net diff
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/sr-b29-finalizer.yml
          git add docs/structure-radar
          git status --short
          git commit -m 'StructureRadar: census Stage14-15 deep corpus batch 29'
          git push origin HEAD:structure-radar-deep-corpus-batch-29
