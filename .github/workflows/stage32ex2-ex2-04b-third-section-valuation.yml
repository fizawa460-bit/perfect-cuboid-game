name: Stage32EX2 EX2-04B third-section valuation separation

on:
  push:
    branches:
      - stage32ex2-ex2-00-source-lock-continuation
    paths:
      - 'stages/stage32-ex2/EX2-04/third-section-valuation-separation.json'
      - 'stages/stage32-ex2/verify_ex2_04b_third_section_valuation_separation.py'
      - '.github/workflows/stage32ex2-ex2-04b-third-section-valuation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact head and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify EX2-04A dependency
        run: python -B stages/stage32-ex2/verify_ex2_04a_two_divisor_section_pencil.py
      - name: Verify EX2-04B valuation separator
        run: python -B stages/stage32-ex2/verify_ex2_04b_third_section_valuation_separation.py
      - name: Confirm shared claim sync remains freshness-gated
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          behind="$(git rev-list --count HEAD..origin/main)"
          echo "current_main=$(git rev-parse origin/main)"
          echo "behind_current_main=$behind"
          test "$behind" -gt 0
          python - <<'PY'
          import json
          a=json.load(open('stages/stage32-ex2/EX2-04/third-section-valuation-separation.json'))
          assert a['claim_sync']['shared_claim_registry_updated'] is False
          assert a['claim_sync']['authority_status']=='SCRATCH_PENDING_CURRENT_MAIN_RECONCILIATION'
          PY
