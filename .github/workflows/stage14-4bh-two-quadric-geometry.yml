name: Stage14-4bh two-quadric geometry

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4bh/**'
      - 'stages/stage14/data/14-4/two_quadric_geometry_summary.json'
      - 'stages/stage14/scripts/14-4/two_quadric_geometry_audit.py'
      - '.github/workflows/stage14-4bh-two-quadric-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile audit
        run: python -m py_compile stages/stage14/scripts/14-4/two_quadric_geometry_audit.py
      - name: Run deterministic audit
        run: python stages/stage14/scripts/14-4/two_quadric_geometry_audit.py
      - name: Check theorem boundary
        run: |
          grep -q 'STAGE14_4BH=TWO_QUADRIC_GENUS_ONE_GEOMETRY_AND_LARGE_KERNEL_INCIDENCE_SPLIT' stages/stage14/14-4bh/result.md
          grep -q 'FIXED_PACKET_CURVE_SMOOTH_GENUS_ONE=true' stages/stage14/14-4bh/result.md
          grep -q 'LARGE_KERNEL_EDGE_PRIME_TWO_LINE_CONGRUENCE=true' stages/stage14/14-4bh/result.md
          grep -q 'DIRECT_POST_LOCAL_LARGE_KERNEL_SECTOR_SAVING_PROVED=true' stages/stage14/14-4bh/result.md
          grep -q 'DIRECT_POST_LOCAL_POSITIVE_SAVING_PROVED=false' stages/stage14/14-4bh/result.md
          grep -q 'POST_LOCAL_SAVING_REQUIRED_FOR_SQRT_B_UPPER_BOUND=10/21' stages/stage14/14-4bh/result.md
          grep -q 'NEXT=Stage14-4bi' stages/stage14/14-4bh/result.md
