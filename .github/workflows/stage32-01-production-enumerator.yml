name: Stage32-01 production enumerator

on:
  pull_request:
    paths:
      - 'stages/stage32/32-01/run_numeric_magma_slice.py'
      - 'stages/stage32/32-01/run_numeric_magma_strata.py'
      - 'stages/stage32/32-01/run_numeric_magma_refine.py'
      - 'stages/stage32/32-01/verify_graded_slice_plan.py'
      - '.github/workflows/stage32-01-production-enumerator.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sharded-low-degree-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download audited source-locked Picard core artifact
        uses: actions/download-artifact@v4
        with:
          name: stage32-01-polytail-reduction
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32614857845
          path: /tmp/stage32-polytail
      - name: Install audited Picard core
        run: cp /tmp/stage32-polytail/picard-core.json stages/stage32/32-01/picard-core.json
      - name: Degree-2 genus-0 bounded-coset regression
        working-directory: stages/stage32/32-01
        run: python run_numeric_magma_slice.py
      - name: Degree-4 genus-1 all exceptional-mass strata
        working-directory: stages/stage32/32-01
        run: python run_numeric_magma_strata.py 4 1
      - name: Degree-6 genus-1 first-level exceptional-mass strata
        continue-on-error: true
        working-directory: stages/stage32/32-01
        run: python run_numeric_magma_strata.py 6 1
      - name: Refine degree-6 genus-1 e=0 by first exceptional coordinate
        working-directory: stages/stage32/32-01
        run: python run_numeric_magma_refine.py 6 1 0
      - name: Upload exact sharded transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage32-01-sharded-low-degree-batch
          path: |
            stages/stage32/32-01/picard-core.json
            stages/stage32/32-01/numeric-magma-slice-*.txt
            stages/stage32/32-01/numeric-magma-strata-*.json
            stages/stage32/32-01/numeric-magma-refine-*.json
          if-no-files-found: warn
