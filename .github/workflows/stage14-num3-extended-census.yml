name: Stage14-num3 extended exact census

on:
  pull_request:
    branches:
      - main
    paths:
      - 'stages/stage14/scripts/14-num3/**'
      - 'stages/stage14/data/14-num3/**'
      - 'stages/stage14/14-num3/**'
      - 'stages/stage14/data/14-num1/baseline_manifest.json'
      - '.github/workflows/stage14-num3-extended-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b20m-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run memory-bounded exact chunk through B20m
        run: |
          mkdir -p /tmp/num3
          /usr/bin/time -v -o /tmp/num3/time-${{ matrix.chunk }}.txt \
            python stages/stage14/scripts/14-num3/extended_exact_census.py \
              --bound 20000000 \
              --chunk-count 8 \
              --chunk-index ${{ matrix.chunk }} \
              --output /tmp/num3/chunk-${{ matrix.chunk }}.json \
            | tee /tmp/num3/console-${{ matrix.chunk }}.txt
          echo '--- /usr/bin/time -v ---'
          cat /tmp/num3/time-${{ matrix.chunk }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: num3-b20m-chunk-${{ matrix.chunk }}
          path: /tmp/num3/chunk-${{ matrix.chunk }}.json
          retention-days: 3

  b20m-aggregate:
    needs: b20m-chunks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: num3-b20m-chunk-*
          path: /tmp/num3-chunks
          merge-multiple: true
      - name: Merge chunks and enforce frozen 2m/5m/10m regression
        run: |
          python stages/stage14/scripts/14-num3/extended_exact_census.py \
            --bound 20000000 \
            --merge-dir /tmp/num3-chunks \
            --output /tmp/num3-b20m.json \
            | tee /tmp/num3-b20m-console.txt
      - name: Verify finite-only and emergency boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/num3-b20m.json').read_text())
          assert r['num1_regression']['all_four_sha256_match'] is True
          assert r['num1_regression']['counts_match'] is True
          assert r['num1_regression']['graph_match'] is True
          assert r['frozen_num3_milestone_regression']['verified_cutoffs']==[5000000,10000000]
          assert r['cutoff_summaries']['5000000']['counts']=={'a':207,'b':211,'c':113,'total':531,'triple':0}
          assert r['cutoff_summaries']['10000000']['counts']=={'a':293,'b':286,'c':141,'total':720,'triple':0}
          assert r['decision']['FROZEN_NUM3_MILESTONES_UNCHANGED'] is True
          assert r['decision']['FINITE_DIAGNOSTIC_ONLY'] is True
          assert r['decision']['ASYMPTOTIC_CLAIM'] is False
          assert r['decision']['SQRT_B_ASYMPTOTIC_CLAIM'] is False
          assert r['decision']['PERFECT_CUBOID_EXISTENCE_CLAIM'] is False
          assert r['decision']['PERFECT_CUBOID_NONEXISTENCE_CLAIM'] is False
          if r['perfect_cuboid_emergency']['triggered']:
              raise SystemExit('PERFECT CUBOID EMERGENCY: independent reproduction required before num3 closure')
          assert r['decision']['STAGE14_NUM3']=='COMPLETE_EXTENDED_EXACT_CENSUS'
          print('Stage14-num3 B=20m exact census: PASS')
          print(json.dumps(r['extended_census'], indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: num3-b20m-aggregate
          path: /tmp/num3-b20m.json
          retention-days: 3
