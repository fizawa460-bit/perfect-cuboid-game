name: Stage32 32-01-178 N270 all48 exceptional HNF obstruction

on:
  pull_request:
    paths:
      - 'stages/stage32/32-01-178/nodes/N260/**'
      - 'stages/stage32/32-01-178/nodes/N270/**'
      - 'stages/stage32/residual-32-01-production/aut_equivariant_pairing_adapter.py'
      - 'stages/stage32/residual-32-01-production/hperp_integral_adapter.py'
      - '.github/workflows/stage32-01-178-n270-all48-hnf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify N270 all48-exceptional exact HNF obstruction
        run: python stages/stage32/32-01-178/nodes/N270/verify_n270_all48_exceptional_hnf_obstruction.py
