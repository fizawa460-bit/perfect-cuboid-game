name: Stage33-07 Kb Picard lattice repair shard

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/extract_kb_picard_lattice.py'
      - '.github/workflows/stage33-07-kb-picard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kb-picard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract exact Kb Picard lattice and certify 2-saturation
        working-directory: stages/stage33/33-07
        run: python extract_kb_picard_lattice.py
      - name: Validate Kb lattice certificate
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open('kb-picard-lattice.json'))
          assert x['picard_rank']==20
          assert x['pullback_to_picS_mod2_rank']==20
          assert x['generated_lattice_2_saturated']
          assert x['full_picard_lattice_certified']
          d=abs(x['picard_determinant'])
          assert math.prod(x['picard_smith_diagonal'])==d
          print('KB_PICARD_RANK=20')
          print('KB_PICARD_DETERMINANT=',x['picard_determinant'])
          print('KB_PICARD_SMITH=',x['picard_smith_diagonal'])
          print('KB_PULLBACK_MOD2_RANK=20')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-kb-picard-lattice
          path: |
            stages/stage33/33-07/kb-picard-lattice.json
            stages/stage33/33-07/kb-picard-magma-stdout.txt
