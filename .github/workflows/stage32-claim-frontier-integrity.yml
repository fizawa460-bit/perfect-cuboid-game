name: Stage32 claim frontier integrity

# Trigger lifecycle: ACTIVE_AUTO — repository-wide workflow/claim/demand safety gate
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'stages/stage32/proof/**'
      - 'stages/stage32/STAGE32-PROOF-PATH.md'
      - 'stages/stage32/FINAL-CHECK.json'
      - 'stages/stage32/COMMANDS.md'
      - 'stages/stage32/MAIN-STATE.json'
      - 'stages/stage32/MAIN-START-HERE.md'
      - 'stages/stage32/32-01-178/MAIN-START-HERE.md'
      - 'stages/stage32/verify_main_startup.py'
      - 'stages/stage32/verify_main_startup_authority_v*.py'
      - 'stages/stage32/verify_cut191_main_consumption.py'
      - 'stages/stage32/management/post-cut191-hostile-pass-consumption-20260911.json'
      - 'stages/stage32/management/CUT191-MAIN-CONSUMPTION-HOSTILE-AUDIT-PASS.json'
      - 'stages/stage32/management/post-cut194-hostile-pass-consumption-20260912.json'
      - 'stages/stage32/full178-cut/CROSS-LANE-STATE.json'
      - 'stages/stage32/full178-cut/MAIN-START-HERE.md'
      - 'stages/stage32/full178-cut/CUT191-HOSTILE-AUDIT-PASS.json'
      - 'stages/stage32/full178-cut/CUT191-AUDIT-HANDOFF.json'
      - 'stages/stage32/full178-cut/CUT191-first-block-closure-checkpoint.json'
      - 'stages/stage32/full178-cut/verify_cut191_exact_head_audit.py'
      - 'stages/stage32/full178-cut/CUT194-e8-common-adapter-wave2-result.json'
      - 'stages/stage32/full178-cut/CUT194-e8-common-adapter-wave2-audit-handoff.json'
      - 'stages/stage32/full178-cut/CUT201-e8-wave9-recovery-preflight.json'
      - 'stages/stage32/full178-cut/runkeys/CUT201-e8-wave9.json'
      - 'stages/stage32/final-chain/32-03-multibranch/MAIN-START-HERE.md'
      - 'stages/stage32-ex*/MAIN-STATE.json'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
      - 'stages/stage32-ex3/**'
      - 'stages/stage32/verify_stage32_post1728_v6_negative_authority_consumption.py'
      - 'stages/stage32/post1728-v6-negative-authority-consumption-and-frontier-remap.json'
      - 'stages/stage32/post1730-o210-v3-main-consumption-preflight.json'
      - 'stages/stage32/verify_post1730_o210_v3_main_claim_sync.py'
      - 'stages/stage32/residual-32-01-production/post1623-hperp-v6-hdeck-character-preflight.json'
      - 'stages/stage32/residual-32-01-production/post1648ae-v6-carrier-member-source-gap.json'
      - 'stages/stage32/residual-32-01-production/post1648ag-v6-known140-basis-elimination.json'
      - 'stages/stage32/residual-32-01-production/post1648ah-fsm-unibranch-v6-exclusion.json'
      - 'stages/stage32/residual-32-01-production/state.json'
      - 'stages/stage32/GOAL_AND_STOP_CONTRACT.md'
      - 'AGENTS.md'
      - 'docs/research-os/policies/hostile-audit-and-freshness.md'
      - 'docs/research-os/policies/verify_hostile_audit_and_freshness.py'
      - 'docs/research-os/policies/pr-workflow-trigger-lifecycle.md'
      - 'docs/research-os/policies/stage32-pr-workflow-trigger-inventory-20260911.json'
      - 'docs/research-os/policies/verify_stage32_pr_workflow_trigger_inventory.py'
      - 'docs/research-os/policies/repo-workflow-trigger-inventory-20260911.json'
      - 'docs/research-os/policies/verify_repo_workflow_trigger_inventory.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Checkout exact audited pre-sync evidence separately
        uses: actions/checkout@v4
        with:
          ref: 6487de765b0d35e05d81018aeaff902af9b7d21a
          path: .stage32-audited-q602
      - name: Verify live Q602 V3 claim synchronization
        run: python stages/stage32/proof/verify_stage32_q602_sync.py
      - name: Verify repo-wide hostile-audit and freshness governance
        run: python docs/research-os/policies/verify_hostile_audit_and_freshness.py
      - name: Verify Stage32 PR workflow trigger lifecycle
        run: python docs/research-os/policies/verify_stage32_pr_workflow_trigger_inventory.py
      - name: Verify repository-wide PR workflow trigger lifecycle
        run: python docs/research-os/policies/verify_repo_workflow_trigger_inventory.py
      - name: Replay historical V6 authority consumption
        working-directory: .stage32-audited-q602
        run: python stages/stage32/verify_stage32_post1728_v6_negative_authority_consumption.py
      - name: Replay byte-exact imported EX3 O210 terminal mathematics
        run: python stages/stage32-ex3/verify_ex3_09_o210_cover_geometry_exclusion_candidate.py
      - name: Replay historical audited O210 post-sync authority
        working-directory: .stage32-audited-q602
        run: python stages/stage32/verify_post1730_o210_v3_main_claim_sync.py
      - name: Verify base Stage32 claim DAG
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify active Stage32 mathematical frontier and claim-sync hooks
        run: python stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Verify cross-lane demand DAG and lane coordination
        run: python stages/stage32/proof/verify_cross_lane_demands.py
      - name: Verify live synchronized MAIN authority boundary
        run: python stages/stage32/verify_main_startup.py
      - name: Verify stopped EX6 management enrollment
        run: python stages/stage32-ex6/verify_main_state.py
      - name: Replay synthetic fail-close regressions
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --self-test-fail-closed
      - name: Assert current FINAL-CHECK is NOT_READY
        shell: bash
        run: |
          set +e
          output="$(python stages/stage32/proof/verify_stage32_claim_dag.py --final)"
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -eq 2
          printf '%s\n' "$output" | python -c 'import json,sys; o=json.load(sys.stdin); assert o["verdict"] == "NOT_READY_STAGE32_FINAL_CHECK"; assert o["final_ready"] is False'

  authorize-cut201-wave9-recovery:
    needs: [integrity]
    if: github.event_name == 'pull_request' && github.head_ref == 'stage32cut-e8-common-adapter-wave9-20260913'
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - id: gate
        name: Authorize CUT201 generation2 shard5-only recovery
        shell: bash
        run: |
          set -euo pipefail
          KEY='stages/stage32/full178-cut/runkeys/CUT201-e8-wave9.json'
          HEAD_SHA="$(git rev-parse HEAD)"
          PARENT_SHA="$(git rev-parse HEAD^)"
          export HEAD_SHA PARENT_SHA KEY
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          def blob(path):
              raw=Path(path).read_bytes(); return hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          key=os.environ['KEY']
          try:
              old=json.loads(subprocess.check_output(['git','show',f"{os.environ['PARENT_SHA']}:{key}"],text=True))
          except Exception:
              old={}
          p=Path(key); new=json.loads(p.read_text()) if p.exists() else {}
          changed=subprocess.run(['git','diff','--quiet',os.environ['PARENT_SHA'],os.environ['HEAD_SHA'],'--',key]).returncode != 0
          ok=(changed
              and old.get('generation')==1 and old.get('armed') is False and old.get('consumed') is False
              and new.get('schema')=='STAGE32_CUT201_E8_COMMON_ADAPTER_WAVE9_RUNKEY_V1'
              and new.get('generation')==2 and new.get('generation',0)>old.get('generation',0)
              and new.get('armed') is True and new.get('consumed') is False
              and new.get('branch')=='stage32cut-e8-common-adapter-wave9-20260913'
              and new.get('parent_cut200_audited_head')=='a1073508a33dac1001657554054a74d3cf47034a'
              and new.get('parent_cut200_hostile_audit_review')==5189541446
              and new.get('main_parent_exact_head')=='6d63d798adb50dd4efc5f0d5abc553b3dfa23060'
              and new.get('ex5_producer_exact_head')=='fd00531181228c9f367a49eb61ddc3af6ab84ab3'
              and new.get('worker_blob')==blob('stages/stage32/full178-cut/cut201_e8_common_adapter_wave9.py')
              and new.get('aggregator_blob')==blob('stages/stage32/full178-cut/aggregate_cut201_e8_wave9.py')
              and new.get('recovery_preflight_blob')==blob('stages/stage32/full178-cut/CUT201-e8-wave9-recovery-preflight.json')
              and new.get('workflow_blob')==blob('.github/workflows/stage32-claim-frontier-integrity.yml')
              and new.get('recovery',{}).get('source_run_id')==34745899934
              and new.get('recovery',{}).get('rerun_shards')==[5]
              and new.get('recovery',{}).get('survivor_offset_start')==2201
              and new.get('recovery',{}).get('survivor_offset_count')==32
              and new.get('recovery',{}).get('job_timeout_minutes')==90
              and new.get('wave',{}).get('survivor_offset_range')==[2041,2295]
              and new.get('wave',{}).get('block_count')==255
              and new.get('wave',{}).get('terminal_count')==28815)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('authorized='+('true' if ok else 'false')+'\n')
          print('CUT201 wave9 recovery runkey changed:', changed)
          print('CUT201 wave9 recovery old/new generations:', old.get('generation'), new.get('generation'))
          print('CUT201 wave9 generation2 shard5-only recovery authorized:', ok)
          PY

  cut201-wave9-recovery-shard5:
    needs: [authorize-cut201-wave9-recovery]
    if: needs.authorize-cut201-wave9-recovery.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact checked-out head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact solver dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Execute only interrupted CUT201 shard 5
        run: |
          python stages/stage32/full178-cut/cut201_e8_common_adapter_wave9.py \
            --survivor-offset-start 2201 \
            --survivor-offset-count 32 \
            --timeout-ms 750 \
            --output "$RUNNER_TEMP/cut201-shard-5.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cut201-shard-5-recovery
          path: ${{ runner.temp }}/cut201-shard-5.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  cut201-wave9-recovery-aggregate:
    needs: [cut201-wave9-recovery-shard5]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Download retained generation1 successful shards
        uses: actions/download-artifact@v4
        with:
          pattern: cut201-shard-*
          path: ${{ runner.temp }}/cut201-shards
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34745899934
      - name: Download generation2 shard5 recovery
        uses: actions/download-artifact@v4
        with:
          name: cut201-shard-5-recovery
          path: ${{ runner.temp }}/cut201-shards
      - name: Assert exact eight-shard recovery population
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/cut201-shards" -maxdepth 1 -name 'cut201-shard-*.json' -type f | wc -l)" -eq 8
          test -f "$RUNNER_TEMP/cut201-shards/cut201-shard-5.json"
      - name: Aggregate fail-closed CUT201 wave9 recovery
        run: |
          python stages/stage32/full178-cut/aggregate_cut201_e8_wave9.py \
            --input-dir "$RUNNER_TEMP/cut201-shards" \
            --output "$RUNNER_TEMP/CUT201-wave9-recovery-aggregate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cut201-wave9-recovery-aggregate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/CUT201-wave9-recovery-aggregate.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
