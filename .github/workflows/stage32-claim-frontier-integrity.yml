name: Stage32 claim frontier integrity

# Trigger lifecycle: ACTIVE_AUTO — repository-wide workflow/claim/demand safety gate
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'stages/stage32/proof/**'
      - 'stages/stage32/STAGE32-PROOF-PATH.md'
      - 'stages/stage32/FINAL-CHECK.json'
      - 'stages/stage32/COMMANDS.md'
      - 'stages/stage32/MAIN-STATE.json'
      - 'stages/stage32/MAIN-START-HERE.md'
      - 'stages/stage32/32-01-178/MAIN-START-HERE.md'
      - 'stages/stage32/32-01-178/nodes/N342/RESULT.json'
      - 'stages/stage32/32-01-178/nodes/N361/**'
      - 'stages/stage32/32-01-178/nodes/N362/**'
      - 'stages/stage32/32-01-178/nodes/N363/**'
      - 'stages/stage32/32-01-178/nodes/N364/**'
      - 'stages/stage32/32-01-178/nodes/N365/**'
      - 'stages/stage32/32-01-178/nodes/N366/**'
      - 'stages/stage32/32-01-178/nodes/N367/**'
      - 'stages/stage32/32-01-178/nodes/N368/**'
      - 'stages/stage32/32-01-178/nodes/N369/**'
      - 'stages/stage32/32-01-178/nodes/N370/**'
      - 'stages/stage32/32-01-178/nodes/N371/**'
      - 'stages/stage32/32-01-178/nodes/N372/**'
      - 'stages/stage32/verify_main_startup.py'
      - 'stages/stage32/verify_main_startup_authority_v*.py'
      - 'stages/stage32/verify_cut191_main_consumption.py'
      - 'stages/stage32/management/post-cut191-hostile-pass-consumption-20260911.json'
      - 'stages/stage32/management/CUT191-MAIN-CONSUMPTION-HOSTILE-AUDIT-PASS.json'
      - 'stages/stage32/management/post-cut194-hostile-pass-consumption-20260912.json'
      - 'stages/stage32/full178-cut/CROSS-LANE-STATE.json'
      - 'stages/stage32/full178-cut/MAIN-START-HERE.md'
      - 'stages/stage32/full178-cut/CUT191-HOSTILE-AUDIT-PASS.json'
      - 'stages/stage32/full178-cut/CUT191-AUDIT-HANDOFF.json'
      - 'stages/stage32/full178-cut/CUT191-first-block-closure-checkpoint.json'
      - 'stages/stage32/full178-cut/verify_cut191_exact_head_audit.py'
      - 'stages/stage32/full178-cut/CUT194-e8-common-adapter-wave2-result.json'
      - 'stages/stage32/full178-cut/CUT194-e8-common-adapter-wave2-audit-handoff.json'
      - 'stages/stage32/final-chain/32-03-multibranch/MAIN-START-HERE.md'
      - 'stages/stage32-ex*/MAIN-STATE.json'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
      - 'stages/stage32-ex3/**'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_family.py'
      - 'stages/stage32/residual-32-01-production/compressed_terminal_indexer.py'
      - 'stages/stage32/residual-32-01-production/pairing_prefix_engine.py'
      - 'stages/stage32/residual-32-01-production/hperp_integral_adapter.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - 'stages/stage32/verify_stage32_post1728_v6_negative_authority_consumption.py'
      - 'stages/stage32/post1728-v6-negative-authority-consumption-and-frontier-remap.json'
      - 'stages/stage32/post1730-o210-v3-main-consumption-preflight.json'
      - 'stages/stage32/verify_post1730_o210_v3_main_claim_sync.py'
      - 'stages/stage32/residual-32-01-production/post1623-hperp-v6-hdeck-character-preflight.json'
      - 'stages/stage32/residual-32-01-production/post1648ae-v6-carrier-member-source-gap.json'
      - 'stages/stage32/residual-32-01-production/post1648ag-v6-known140-basis-elimination.json'
      - 'stages/stage32/residual-32-01-production/post1648ah-fsm-unibranch-v6-exclusion.json'
      - 'stages/stage32/residual-32-01-production/state.json'
      - 'stages/stage32/GOAL_AND_STOP_CONTRACT.md'
      - 'AGENTS.md'
      - 'docs/research-os/policies/hostile-audit-and-freshness.md'
      - 'docs/research-os/policies/verify_hostile_audit_and_freshness.py'
      - 'docs/research-os/policies/pr-workflow-trigger-lifecycle.md'
      - 'docs/research-os/policies/stage32-pr-workflow-trigger-inventory-20260911.json'
      - 'docs/research-os/policies/verify_stage32_pr_workflow_trigger_inventory.py'
      - 'docs/research-os/policies/repo-workflow-trigger-inventory-20260911.json'
      - 'docs/research-os/policies/verify_repo_workflow_trigger_inventory.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 20
      - name: Assert exact checked-out head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Checkout exact audited pre-sync evidence separately
        uses: actions/checkout@v4
        with:
          ref: 6487de765b0d35e05d81018aeaff902af9b7d21a
          path: .stage32-audited-q602
      - name: Verify live Q602 V3 claim synchronization
        run: python stages/stage32/proof/verify_stage32_q602_sync.py
      - name: Verify repo-wide hostile-audit and freshness governance
        run: python docs/research-os/policies/verify_hostile_audit_and_freshness.py
      - name: Verify Stage32 PR workflow trigger lifecycle
        run: python docs/research-os/policies/verify_stage32_pr_workflow_trigger_inventory.py
      - name: Verify repository-wide PR workflow trigger lifecycle
        run: python docs/research-os/policies/verify_repo_workflow_trigger_inventory.py
      - name: Replay historical V6 authority consumption
        working-directory: .stage32-audited-q602
        run: python stages/stage32/verify_stage32_post1728_v6_negative_authority_consumption.py
      - name: Replay byte-exact imported EX3 O210 terminal mathematics
        run: python stages/stage32-ex3/verify_ex3_09_o210_cover_geometry_exclusion_candidate.py
      - name: Replay historical audited O210 post-sync authority
        working-directory: .stage32-audited-q602
        run: python stages/stage32/verify_post1730_o210_v3_main_claim_sync.py
      - name: Verify base Stage32 claim DAG
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify active Stage32 mathematical frontier and claim-sync hooks
        run: python stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Verify cross-lane demand DAG and lane coordination
        run: python stages/stage32/proof/verify_cross_lane_demands.py
      - name: Verify live synchronized MAIN authority boundary
        run: python stages/stage32/verify_main_startup.py
      - name: Install exact N361 retained replay dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Verify N361 current-V15 retained sample rebase boundary
        run: python stages/stage32/32-01-178/nodes/N361/verify_n361_current_v15_rebase_audit_boundary.py
      - name: Checkout exact CUT196 evidence for N372 audit boundary
        uses: actions/checkout@v4
        with:
          ref: 5403328470df32c65aea9a38efe3916cb87d24a4
          path: .n372-audit-cut196
      - name: Checkout exact N357 composition evidence for N372 audit boundary
        uses: actions/checkout@v4
        with:
          ref: 0bdc3b952b35ea3201d8619f21a3df7a3015ff85
          path: .n372-audit-n357comp
      - name: Verify N372 exact audit boundary
        run: |
          python stages/stage32/32-01-178/nodes/N372/verify_n372_audit_boundary.py \
            --cut196-root .n372-audit-cut196 \
            --n357-composition-root .n372-audit-n357comp
      - name: Verify stopped EX6 management enrollment
        run: python stages/stage32-ex6/verify_main_state.py
      - name: Replay synthetic fail-close regressions
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --self-test-fail-closed
      - name: Assert current FINAL-CHECK is NOT_READY
        shell: bash
        run: |
          set +e
          output="$(python stages/stage32/proof/verify_stage32_claim_dag.py --final)"
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -eq 2
          printf '%s\n' "$output" | python -c 'import json,sys; o=json.load(sys.stdin); assert o["verdict"] == "NOT_READY_STAGE32_FINAL_CHECK"; assert o["final_ready"] is False'
