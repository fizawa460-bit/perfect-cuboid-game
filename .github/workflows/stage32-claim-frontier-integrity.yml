name: Stage32 claim frontier integrity

# Trigger lifecycle: ACTIVE_AUTO — repository-wide workflow/claim safety gate
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'stages/stage32/proof/verify_stage32_q602_sync.py'
      - 'AGENTS.md'
      - 'docs/research-os/policies/hostile-audit-and-freshness.md'
      - 'docs/research-os/policies/verify_hostile_audit_and_freshness.py'
      - 'docs/research-os/policies/pr-workflow-trigger-lifecycle.md'
      - 'docs/research-os/policies/stage32-pr-workflow-trigger-inventory-20260911.json'
      - 'docs/research-os/policies/verify_stage32_pr_workflow_trigger_inventory.py'
      - 'docs/research-os/policies/repo-workflow-trigger-inventory-20260911.json'
      - 'docs/research-os/policies/verify_repo_workflow_trigger_inventory.py'
      - 'stages/stage32/proof/**'
      - 'stages/stage32/STAGE32-PROOF-PATH.md'
      - 'stages/stage32/FINAL-CHECK.json'
      - 'stages/stage32/MAIN-STATE.json'
      - 'stages/stage32/MAIN-START-HERE.md'
      - 'stages/stage32/full178-cut/**'
      - 'stages/stage32/verify_stage32_post1728_v6_negative_authority_consumption.py'
      - 'stages/stage32/post1728-v6-negative-authority-consumption-and-frontier-remap.json'
      - 'stages/stage32/post1730-o210-v3-main-consumption-preflight.json'
      - 'stages/stage32/verify_post1730_o210_v3_main_claim_sync.py'
      - 'stages/stage32-ex3/**'
      - 'stages/stage32-ex*/MAIN-STATE.json'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32/residual-32-01-production/post1623-hperp-v6-hdeck-character-preflight.json'
      - 'stages/stage32/residual-32-01-production/post1648ae-v6-carrier-member-source-gap.json'
      - 'stages/stage32/residual-32-01-production/post1648ag-v6-known140-basis-elimination.json'
      - 'stages/stage32/residual-32-01-production/post1648ah-fsm-unibranch-v6-exclusion.json'
      - 'stages/stage32/residual-32-01-production/state.json'
      - 'stages/stage32/GOAL_AND_STOP_CONTRACT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Install CUT exact-head replay dependencies
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'stage32cut-mainbatch'
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Verify CUT191 exact-head audit boundary
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'stage32cut-mainbatch'
        run: python stages/stage32/full178-cut/verify_cut191_exact_head_audit.py
      - name: Checkout exact audited pre-sync evidence separately
        uses: actions/checkout@v4
        with:
          ref: 6487de765b0d35e05d81018aeaff902af9b7d21a
          path: .stage32-audited-q602
      - name: Verify live Q602 V3 claim synchronization
        run: python stages/stage32/proof/verify_stage32_q602_sync.py
      - name: Verify repo-wide hostile-audit and freshness governance
        run: python docs/research-os/policies/verify_hostile_audit_and_freshness.py
      - name: Verify Stage32 PR workflow trigger lifecycle
        run: python docs/research-os/policies/verify_stage32_pr_workflow_trigger_inventory.py
      - name: Verify repository-wide PR workflow trigger lifecycle
        run: python docs/research-os/policies/verify_repo_workflow_trigger_inventory.py
      - name: Replay historical V6 authority consumption
        working-directory: .stage32-audited-q602
        run: python stages/stage32/verify_stage32_post1728_v6_negative_authority_consumption.py
      - name: Replay byte-exact imported EX3 O210 terminal mathematics
        run: python stages/stage32-ex3/verify_ex3_09_o210_cover_geometry_exclusion_candidate.py
      - name: Replay historical audited O210 post-sync authority
        working-directory: .stage32-audited-q602
        run: python stages/stage32/verify_post1730_o210_v3_main_claim_sync.py
      - name: Verify base Stage32 claim DAG
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify active Stage32 mathematical frontier and claim-sync hooks
        run: python stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Verify stopped EX6 management enrollment
        run: python stages/stage32-ex6/verify_main_state.py
      - name: Replay synthetic fail-close regressions
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --self-test-fail-closed
      - name: Assert current FINAL-CHECK is NOT_READY
        shell: bash
        run: |
          set +e
          output="$(python stages/stage32/proof/verify_stage32_claim_dag.py --final)"
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -eq 2
          printf '%s\n' "$output" | python -c 'import json,sys; o=json.load(sys.stdin); assert o["verdict"] == "NOT_READY_STAGE32_FINAL_CHECK"; assert o["final_ready"] is False'

  authorize-cut192-block1-parent-cover:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'stage32cut-mainbatch'
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: gate
        name: Authorize only a fresh CUT192 block1 parent-cover runkey generation
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          key=Path('stages/stage32/full178-cut/runkeys/CUT192-block1-parent-cover.json')
          before=os.environ.get('BEFORE','').strip(); head=os.environ.get('HEAD_SHA','').strip()
          authorized=False; reason='cold'
          if before and head and key.exists():
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',before],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              old_ok=subprocess.run(['git','cat-file','-e',before+'^{commit}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if old_ok:
                  changed=subprocess.check_output(['git','diff','--name-only',before,head],text=True).splitlines()
                  if str(key) in changed:
                      new=json.loads(key.read_text())
                      try:
                          old=json.loads(subprocess.check_output(['git','show',before+':'+str(key)],text=True,stderr=subprocess.DEVNULL))
                          generation_ok=int(new.get('generation',0))>int(old.get('generation',0))
                      except subprocess.CalledProcessError:
                          generation_ok=int(new.get('generation',0))==1
                      scan='stages/stage32/full178-cut/cut192_e8_block1_parent_cover_scan.py'
                      agg='stages/stage32/full178-cut/cut192_e8_block1_parent_cover_aggregate.py'
                      handoff='stages/stage32/full178-cut/CUT192-EX5-E8-HANDOFF.json'
                      scan_blob=subprocess.check_output(['git','hash-object',scan],text=True).strip()
                      agg_blob=subprocess.check_output(['git','hash-object',agg],text=True).strip()
                      handoff_blob=subprocess.check_output(['git','hash-object',handoff],text=True).strip()
                      t=new.get('target',{}); ex=new.get('execution',{})
                      authorized=(new.get('schema')=='STAGE32_CUT192_BLOCK1_PARENT_COVER_RUNKEY_V1'
                          and new.get('armed') is True and generation_ok
                          and new.get('scan_git_blob_sha')==scan_blob=='4b9489fb88970039aa0d46dc4203395d45f55816'
                          and new.get('aggregate_git_blob_sha')==agg_blob=='3c1ccea9d0e21099e200dc0e06630cc58727a409'
                          and new.get('handoff_git_blob_sha')==handoff_blob=='011fe82cd97bfa192d4efbbafacb21b0ea724b44'
                          and new.get('ex5_exact_head')=='fd00531181228c9f367a49eb61ddc3af6ab84ab3'
                          and t.get('block_index')==1 and t.get('terminal_rank_range')==[113,225]
                          and t.get('hnf_parent_count')==2360 and t.get('shard_count')==8
                          and ex.get('effective_heavy_concurrency')==8
                          and ex.get('weak_timeout_ms')==300 and ex.get('strong_timeout_ms')==600 and ex.get('mod2_timeout_ms')==500)
                      reason='fresh-runkey' if authorized else 'semantic-gate-failed'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('authorized='+('true' if authorized else 'false')+'\n')
          print('CUT192 block1 parent-cover authorized:',authorized,'reason:',reason,'before:',before,'head:',head)
          PY

  cut192-block1-parent-cover:
    needs: [integrity, authorize-cut192-block1-parent-cover]
    if: needs.authorize-cut192-block1-parent-cover.outputs.authorized == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {id: '0000-0295', start: 0, end: 295}
          - {id: '0295-0590', start: 295, end: 590}
          - {id: '0590-0885', start: 590, end: 885}
          - {id: '0885-1180', start: 885, end: 1180}
          - {id: '1180-1475', start: 1180, end: 1475}
          - {id: '1475-1770', start: 1475, end: 1770}
          - {id: '1770-2065', start: 1770, end: 2065}
          - {id: '2065-2360', start: 2065, end: 2360}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact CUT dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Checkout exact EX5 e8 handoff producer
        uses: actions/checkout@v4
        with:
          ref: fd00531181228c9f367a49eb61ddc3af6ab84ab3
          path: .stage32-ex5-cut-handoff
      - name: Scan source-locked HNF parent shard
        run: |
          python stages/stage32/full178-cut/cut192_e8_block1_parent_cover_scan.py \
            --ex5-root .stage32-ex5-cut-handoff \
            --start ${{ matrix.start }} --end ${{ matrix.end }} \
            --weak-timeout-ms 300 --strong-timeout-ms 600 --mod2-timeout-ms 500 \
            --output "$RUNNER_TEMP/CUT192-parent-shard-${{ matrix.id }}.json"
      - name: Upload compact CUT192 parent shard
        uses: actions/upload-artifact@v4
        with:
          name: cut192-block1-parent-shard-${{ matrix.id }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/CUT192-parent-shard-${{ matrix.id }}.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  cut192-block1-parent-cover-aggregate:
    needs: [cut192-block1-parent-cover]
    if: always() && needs.cut192-block1-parent-cover.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Download CUT192 parent shards
        uses: actions/download-artifact@v4
        with:
          pattern: cut192-block1-parent-shard-*-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/cut192-parent-shards
          merge-multiple: true
      - name: Aggregate exact parent coverage
        run: |
          python stages/stage32/full178-cut/cut192_e8_block1_parent_cover_aggregate.py \
            --input-dir "$RUNNER_TEMP/cut192-parent-shards" \
            --output "$RUNNER_TEMP/CUT192-block1-parent-cover-aggregate.json"
          cat "$RUNNER_TEMP/CUT192-block1-parent-cover-aggregate.json"
      - name: Upload compact CUT192 parent aggregate
        uses: actions/upload-artifact@v4
        with:
          name: cut192-block1-parent-cover-aggregate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/CUT192-block1-parent-cover-aggregate.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
