name: Stage32 claim frontier integrity

# Trigger lifecycle: ACTIVE_AUTO — repository-wide workflow/claim/demand safety gate
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'stages/stage32/proof/**'
      - 'stages/stage32/STAGE32-PROOF-PATH.md'
      - 'stages/stage32/FINAL-CHECK.json'
      - 'stages/stage32/COMMANDS.md'
      - 'stages/stage32/MAIN-STATE.json'
      - 'stages/stage32/MAIN-START-HERE.md'
      - 'stages/stage32/32-01-178/MAIN-START-HERE.md'
      - 'stages/stage32/verify_main_startup.py'
      - 'stages/stage32/verify_main_startup_authority_v*.py'
      - 'stages/stage32/verify_cut191_main_consumption.py'
      - 'stages/stage32/management/post-cut191-hostile-pass-consumption-20260911.json'
      - 'stages/stage32/management/CUT191-MAIN-CONSUMPTION-HOSTILE-AUDIT-PASS.json'
      - 'stages/stage32/management/post-cut194-hostile-pass-consumption-20260912.json'
      - 'stages/stage32/full178-cut/CROSS-LANE-STATE.json'
      - 'stages/stage32/full178-cut/MAIN-START-HERE.md'
      - 'stages/stage32/full178-cut/CUT191-HOSTILE-AUDIT-PASS.json'
      - 'stages/stage32/full178-cut/CUT191-AUDIT-HANDOFF.json'
      - 'stages/stage32/full178-cut/CUT191-first-block-closure-checkpoint.json'
      - 'stages/stage32/full178-cut/verify_cut191_exact_head_audit.py'
      - 'stages/stage32/full178-cut/CUT194-e8-common-adapter-wave2-result.json'
      - 'stages/stage32/full178-cut/CUT194-e8-common-adapter-wave2-audit-handoff.json'
      - 'stages/stage32/full178-cut/CUT201-e8-wave9-recovery-preflight.json'
      - 'stages/stage32/full178-cut/CUT201-e8-wave9-recovery-g2-failure.json'
      - 'stages/stage32/full178-cut/CUT201-e8-wave9-recovery-g3-preflight.json'
      - 'stages/stage32/full178-cut/CUT201-e8-wave9-recovery-g3-failure.json'
      - 'stages/stage32/full178-cut/CUT201-e8-wave9-recovery-g4-preflight.json'
      - 'stages/stage32/full178-cut/runkeys/CUT201-e8-wave9.json'
      - 'stages/stage32/final-chain/32-03-multibranch/MAIN-START-HERE.md'
      - 'stages/stage32-ex*/MAIN-STATE.json'
      - 'stages/stage32-ex*/MAIN-START-HERE.md'
      - 'stages/stage32-ex5/CROSS-LANE-STATE.json'
      - 'stages/stage32-ex3/**'
      - 'stages/stage32/verify_stage32_post1728_v6_negative_authority_consumption.py'
      - 'stages/stage32/post1728-v6-negative-authority-consumption-and-frontier-remap.json'
      - 'stages/stage32/post1730-o210-v3-main-consumption-preflight.json'
      - 'stages/stage32/verify_post1730_o210_v3_main_claim_sync.py'
      - 'stages/stage32/residual-32-01-production/post1623-hperp-v6-hdeck-character-preflight.json'
      - 'stages/stage32/residual-32-01-production/post1648ae-v6-carrier-member-source-gap.json'
      - 'stages/stage32/residual-32-01-production/post1648ag-v6-known140-basis-elimination.json'
      - 'stages/stage32/residual-32-01-production/post1648ah-fsm-unibranch-v6-exclusion.json'
      - 'stages/stage32/residual-32-01-production/state.json'
      - 'stages/stage32/GOAL_AND_STOP_CONTRACT.md'
      - 'AGENTS.md'
      - 'docs/research-os/policies/hostile-audit-and-freshness.md'
      - 'docs/research-os/policies/verify_hostile_audit_and_freshness.py'
      - 'docs/research-os/policies/pr-workflow-trigger-lifecycle.md'
      - 'docs/research-os/policies/stage32-pr-workflow-trigger-inventory-20260911.json'
      - 'docs/research-os/policies/verify_stage32_pr_workflow_trigger_inventory.py'
      - 'docs/research-os/policies/repo-workflow-trigger-inventory-20260911.json'
      - 'docs/research-os/policies/verify_repo_workflow_trigger_inventory.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checked-out head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Checkout exact audited pre-sync evidence separately
        uses: actions/checkout@v4
        with:
          ref: 6487de765b0d35e05d81018aeaff902af9b7d21a
          path: .stage32-audited-q602
      - name: Verify live Q602 V3 claim synchronization
        run: python stages/stage32/proof/verify_stage32_q602_sync.py
      - name: Verify repo-wide hostile-audit and freshness governance
        run: python docs/research-os/policies/verify_hostile_audit_and_freshness.py
      - name: Verify Stage32 PR workflow trigger lifecycle
        run: python docs/research-os/policies/verify_stage32_pr_workflow_trigger_inventory.py
      - name: Verify repository-wide PR workflow trigger lifecycle
        run: python docs/research-os/policies/verify_repo_workflow_trigger_inventory.py
      - name: Replay historical V6 authority consumption
        working-directory: .stage32-audited-q602
        run: python stages/stage32/verify_stage32_post1728_v6_negative_authority_consumption.py
      - name: Replay byte-exact imported EX3 O210 terminal mathematics
        run: python stages/stage32-ex3/verify_ex3_09_o210_cover_geometry_exclusion_candidate.py
      - name: Replay historical audited O210 post-sync authority
        working-directory: .stage32-audited-q602
        run: python stages/stage32/verify_post1730_o210_v3_main_claim_sync.py
      - name: Verify base Stage32 claim DAG
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
      - name: Verify active Stage32 mathematical frontier and claim-sync hooks
        run: python stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Verify cross-lane demand DAG and lane coordination
        run: python stages/stage32/proof/verify_cross_lane_demands.py
      - name: Verify live synchronized MAIN authority boundary
        run: python stages/stage32/verify_main_startup.py
      - name: Verify stopped EX6 management enrollment
        run: python stages/stage32-ex6/verify_main_state.py
      - name: Replay synthetic fail-close regressions
        run: python stages/stage32/proof/verify_stage32_claim_dag.py --self-test-fail-closed
      - name: Assert current FINAL-CHECK is NOT_READY
        shell: bash
        run: |
          set +e
          output="$(python stages/stage32/proof/verify_stage32_claim_dag.py --final)"
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -eq 2
          printf '%s\n' "$output" | python -c 'import json,sys; o=json.load(sys.stdin); assert o["verdict"] == "NOT_READY_STAGE32_FINAL_CHECK"; assert o["final_ready"] is False'

  authorize-cut201-wave9-recovery:
    needs: [integrity]
    if: github.event_name == 'pull_request' && github.head_ref == 'stage32cut-e8-common-adapter-wave9-20260913'
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - id: gate
        name: Authorize CUT201 generation4 partitioned shard5 recovery
        shell: bash
        run: |
          set -euo pipefail
          KEY='stages/stage32/full178-cut/runkeys/CUT201-e8-wave9.json'
          HEAD_SHA="$(git rev-parse HEAD)"
          PARENT_SHA="$(git rev-parse HEAD^)"
          export HEAD_SHA PARENT_SHA KEY
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          def blob(path):
              raw=Path(path).read_bytes()
              return hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          key=os.environ['KEY']
          try:
              old=json.loads(subprocess.check_output(['git','show',f"{os.environ['PARENT_SHA']}:{key}"],text=True))
          except Exception:
              old={}
          p=Path(key)
          new=json.loads(p.read_text()) if p.exists() else {}
          changed=subprocess.run(['git','diff','--quiet',os.environ['PARENT_SHA'],os.environ['HEAD_SHA'],'--',key]).returncode != 0
          recovery=new.get('recovery',{})
          expected_parts=[[2201,2204],[2205,2208],[2209,2212],[2213,2216],[2217,2220],[2221,2224],[2225,2228],[2229,2232]]
          ok=(changed
              and old.get('generation')==3 and old.get('armed') is True and old.get('consumed') is False
              and old.get('recovery',{}).get('survivor_offset_start')==2201
              and old.get('recovery',{}).get('survivor_offset_count')==32
              and new.get('schema')=='STAGE32_CUT201_E8_COMMON_ADAPTER_WAVE9_RUNKEY_V1'
              and new.get('generation')==4 and new.get('generation',0)>old.get('generation',0)
              and new.get('armed') is True and new.get('consumed') is False
              and new.get('branch')=='stage32cut-e8-common-adapter-wave9-20260913'
              and new.get('parent_cut200_audited_head')=='a1073508a33dac1001657554054a74d3cf47034a'
              and new.get('parent_cut200_hostile_audit_review')==5189541446
              and new.get('main_parent_exact_head')=='6d63d798adb50dd4efc5f0d5abc553b3dfa23060'
              and new.get('ex5_producer_exact_head')=='fd00531181228c9f367a49eb61ddc3af6ab84ab3'
              and new.get('worker_blob')=='a8be279ebc3bca4a383d4a81e4c04de7413b17b8'
              and new.get('aggregator_blob')=='6e41072243ff92eabae39f522398aed2fad8df7f'
              and new.get('recovery_g3_failure_blob')==blob('stages/stage32/full178-cut/CUT201-e8-wave9-recovery-g3-failure.json')
              and new.get('recovery_g4_preflight_blob')==blob('stages/stage32/full178-cut/CUT201-e8-wave9-recovery-g4-preflight.json')
              and new.get('workflow_blob')==blob('.github/workflows/stage32-claim-frontier-integrity.yml')
              and recovery.get('source_run_id')==34745899934
              and recovery.get('generation2_failed_run_id')==34792659996
              and recovery.get('generation3_failed_run_id')==34793454958
              and recovery.get('generation3_failed_job_id')==103821980290
              and recovery.get('rerun_shards')==[5]
              and recovery.get('partition_ranges')==expected_parts
              and recovery.get('partition_size')==4
              and recovery.get('job_timeout_minutes')==45
              and recovery.get('execution_checkout_head')=='be6a6f8acc9942dd4973f13c630a4318b923e03d'
              and recovery.get('reuse_generation1_success_artifacts') is True
              and recovery.get('full_wave_rerun_forbidden') is True
              and recovery.get('mathematical_worker_change') is False
              and recovery.get('source_population_change') is False
              and new.get('wave',{}).get('survivor_offset_range')==[2041,2295]
              and new.get('wave',{}).get('block_count')==255
              and new.get('wave',{}).get('terminal_count')==28815)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('authorized='+('true' if ok else 'false')+'\n')
          print('CUT201 wave9 recovery runkey changed:', changed)
          print('CUT201 wave9 recovery old/new generations:', old.get('generation'), new.get('generation'))
          print('CUT201 wave9 generation4 partitioned shard5 recovery authorized:', ok)
          PY

  cut201-wave9-recovery-g4-parts:
    needs: [authorize-cut201-wave9-recovery]
    if: needs.authorize-cut201-wave9-recovery.outputs.authorized == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 0
            start: 2201
          - part: 1
            start: 2205
          - part: 2
            start: 2209
          - part: 3
            start: 2213
          - part: 4
            start: 2217
          - part: 5
            start: 2221
          - part: 6
            start: 2225
          - part: 7
            start: 2229
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout byte-identical generation1 execution tree
        uses: actions/checkout@v4
        with:
          ref: be6a6f8acc9942dd4973f13c630a4318b923e03d
      - name: Assert exact generation1 execution tree
        run: test "$(git rev-parse HEAD)" = "be6a6f8acc9942dd4973f13c630a4318b923e03d"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact solver dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Execute CUT201 shard5 generation4 partition
        run: |
          python stages/stage32/full178-cut/cut201_e8_common_adapter_wave9.py \
            --survivor-offset-start ${{ matrix.start }} \
            --survivor-offset-count 4 \
            --timeout-ms 750 \
            --output "$RUNNER_TEMP/cut201-shard-5-part-${{ matrix.part }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cut201-shard-5-part-${{ matrix.part }}-recovery-g4
          path: ${{ runner.temp }}/cut201-shard-5-part-${{ matrix.part }}.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  cut201-wave9-recovery-g4-combine-shard5:
    needs: [cut201-wave9-recovery-g4-parts]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout byte-identical generation1 execution tree
        uses: actions/checkout@v4
        with:
          ref: be6a6f8acc9942dd4973f13c630a4318b923e03d
      - name: Assert exact generation1 execution tree
        run: test "$(git rev-parse HEAD)" = "be6a6f8acc9942dd4973f13c630a4318b923e03d"
      - name: Download generation4 shard5 partitions
        uses: actions/download-artifact@v4
        with:
          pattern: cut201-shard-5-part-*-recovery-g4
          path: ${{ runner.temp }}/cut201-shard5-parts
          merge-multiple: true
      - name: Combine shard5 partitions structurally and fail closed
        shell: bash
        run: |
          python - "$RUNNER_TEMP/cut201-shard5-parts" "$RUNNER_TEMP/cut201-shard-5.json" <<'PY'
          import copy,hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1]); out_path=Path(sys.argv[2])
          files=sorted(root.glob('cut201-shard-5-part-*.json'))
          expected=[(2201,2204),(2205,2208),(2209,2212),(2213,2216),(2217,2220),(2221,2224),(2225,2228),(2229,2232)]
          if len(files)!=8:
              raise SystemExit(f'expected 8 generation4 partitions, got {len(files)}')
          def csha(v):
              return hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          shards=[json.loads(p.read_text()) for p in files]
          got=sorted(tuple(s['target']['survivor_offset_range']) for s in shards)
          if got!=expected:
              raise SystemExit(f'partition ranges drift: {got}')
          for s in shards:
              q=dict(s); claimed=q.pop('canonical_sha256_without_this_field',None)
              if s.get('schema')!='STAGE32_CUT201_E8_COMMON_ADAPTER_WAVE9_SHARD_V1' or claimed!=csha(q):
                  raise SystemExit('partition canonical/schema drift')
              if s['credit']['stage32_main_pruning_credit'] is not False or s['credit']['cut201_pruning_credit'] is not False:
                  raise SystemExit('partition credit leak')
              if s['firewalls']['main_authority_mutated'] is not False:
                  raise SystemExit('partition MAIN mutation leak')
          ordered=sorted(shards,key=lambda s:s['target']['survivor_offset_range'][0])
          first=ordered[0]
          for s in ordered[1:]:
              if s['source']!=first['source'] or s['method']!=first['method'] or s['credit']!=first['credit'] or s['firewalls']!=first['firewalls']:
                  raise SystemExit('partition invariant drift')
              for k in ('row_id','g','d','e','cut191_block0_disjoint','cut193_wave1_disjoint','cut194_wave2_disjoint','cut195_wave3_disjoint','cut196_wave4_disjoint','cut197_wave5_disjoint','cut198_wave6_disjoint','cut199_wave7_disjoint','cut200_wave8_disjoint','n356_preserved_all_wave_blocks'):
                  if s['target'][k]!=first['target'][k]:
                      raise SystemExit(f'partition target invariant drift: {k}')
          block_indices=[]; closed=[]; recs=[]; methods={}
          for s in ordered:
              block_indices += list(s['target']['block_indices'])
              closed += list(s['result']['candidate_closed_block_indices'])
              recs += list(s['result']['blocks'])
              for k,v in s['result']['method_counts'].items():
                  methods[k]=methods.get(k,0)+int(v)
          if len(block_indices)!=32 or len(set(block_indices))!=32 or len(recs)!=32:
              raise SystemExit('combined shard5 coverage drift')
          if sorted(r['block_index'] for r in recs)!=sorted(block_indices):
              raise SystemExit('combined shard5 record coverage drift')
          closed=sorted(int(v) for v in closed)
          if len(closed)!=len(set(closed)):
              raise SystemExit('combined shard5 duplicate closure')
          bh=hashlib.sha256(); ch=hashlib.sha256()
          for i in block_indices: bh.update(f'{i}\n'.encode())
          for i in closed: ch.update(f'{i}\n'.encode())
          out=copy.deepcopy(first)
          out.pop('canonical_sha256_without_this_field',None)
          out['target']['survivor_offset_range']=[2201,2232]
          out['target']['block_indices']=block_indices
          out['target']['block_index_stream_sha256']=bh.hexdigest()
          out['target']['block_count']=32
          out['target']['terminal_count']=3616
          out['result']['candidate_closed_block_indices']=closed
          out['result']['candidate_closed_block_count']=len(closed)
          out['result']['candidate_closed_block_stream_sha256']=ch.hexdigest()
          out['result']['candidate_pruned_terminals']=113*len(closed)
          out['result']['method_counts']=methods
          out['result']['blocks']=recs
          out['canonical_sha256_without_this_field']=csha(out)
          out_path.write_text(json.dumps(out,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'combined_range':[2201,2232],'blocks':32,'closed':len(closed),'canonical':out['canonical_sha256_without_this_field']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cut201-shard-5-recovery-g4
          path: ${{ runner.temp }}/cut201-shard-5.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  cut201-wave9-recovery-aggregate:
    needs: [cut201-wave9-recovery-g4-combine-shard5]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout byte-identical generation1 execution tree
        uses: actions/checkout@v4
        with:
          ref: be6a6f8acc9942dd4973f13c630a4318b923e03d
      - name: Assert exact generation1 execution tree
        run: test "$(git rev-parse HEAD)" = "be6a6f8acc9942dd4973f13c630a4318b923e03d"
      - name: Download retained generation1 successful shards
        uses: actions/download-artifact@v4
        with:
          pattern: cut201-shard-*
          path: ${{ runner.temp }}/cut201-shards
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34745899934
      - name: Download generation4 reconstructed shard5
        uses: actions/download-artifact@v4
        with:
          name: cut201-shard-5-recovery-g4
          path: ${{ runner.temp }}/cut201-shards
      - name: Assert exact eight-shard recovery population
        shell: bash
        run: |
          set -euo pipefail
          test "$(find "$RUNNER_TEMP/cut201-shards" -maxdepth 1 -name 'cut201-shard-*.json' -type f | wc -l)" -eq 8
          test -f "$RUNNER_TEMP/cut201-shards/cut201-shard-5.json"
      - name: Aggregate fail-closed CUT201 wave9 recovery
        run: |
          python stages/stage32/full178-cut/aggregate_cut201_e8_wave9.py \
            --input-dir "$RUNNER_TEMP/cut201-shards" \
            --output "$RUNNER_TEMP/CUT201-wave9-recovery-aggregate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cut201-wave9-recovery-aggregate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/CUT201-wave9-recovery-aggregate.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
