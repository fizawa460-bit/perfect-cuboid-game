name: StructureRadar registry lifecycle repair finalizer
on:
  push:
    branches: [structure-radar-registry-lifecycle-repair]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-registry-lifecycle-repair
          fetch-depth: 0
      - name: Repair stale transient card lifecycle
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, collections
          root = pathlib.Path('.')
          rp = root / 'docs/structure-radar/structure-registry.json'
          reg = json.loads(rp.read_text())
          cards = reg['structures']
          before = collections.Counter(c.get('card_status') for c in cards)
          changed = 0
          for card in cards:
              if card.get('card_status') == 'SUBMITTED_FOR_AUDIT':
                  card['card_status'] = 'NORMALIZED'
                  changed += 1
          assert changed == 228, (changed, before)
          assert collections.Counter(c.get('card_status') for c in cards) == {'NORMALIZED': 228}
          rp.write_text(json.dumps(reg, indent=2, ensure_ascii=False) + '\n')

          readme = root / 'docs/structure-radar/README.md'
          text = readme.read_text()
          needle = '''A PASS certifies the\nsubmitted batch; it does not claim globally exhaustive literature coverage and\ndoes not close the campaign while another queue item is ready.\n'''
          insert = '''A PASS certifies the\nsubmitted batch; it does not claim globally exhaustive literature coverage and\ndoes not close the campaign while another queue item is ready.\n\nCard lifecycle is separate from the audit verdict. `SUBMITTED_FOR_AUDIT` is a\ntransient state for an open batch. After the batch has passed independent audit\nand its normalized card content is canonical/merged, the persistent registry\nstate must not remain `SUBMITTED_FOR_AUDIT`: use `AUDITED` when an explicit\nrepo-native card-level audit record is materialized, otherwise use `NORMALIZED`.\nBoth states are eligible for later structure-search work. The audit/main handoff\nmust repair any stale transient status before declaring the registry ready for\nsearch; this is lifecycle bookkeeping only and must not invent a new audit PASS.\n'''
          assert needle in text
          text = text.replace(needle, insert, 1)
          readme.write_text(text)
          PY
      - name: Refresh and verify
        shell: bash
        run: |
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git diff --check
      - name: Assert literature-search phase unlocked
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, collections
          root = pathlib.Path('.')
          controller = json.loads((root/'docs/structure-radar/controller.json').read_text())
          queue = json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          registry = json.loads((root/'docs/structure-radar/structure-registry.json').read_text())
          statuses = collections.Counter(c.get('card_status') for c in registry['structures'])
          assert statuses == {'NORMALIZED': 228}, statuses
          assert controller['status'] == 'READY', controller['status']
          assert controller['corpus']['source_count'] == 2556
          assert controller['corpus']['review_states'] == {'CURRENT_REVIEWED': 2556}
          assert controller['registry']['structure_count'] == 228
          assert controller['registry']['unresolved_search_count'] == 203
          assert controller['registry']['pending_arsenal_decision_count'] == 217
          assert controller['queue']['task_count'] == 34
          assert controller['queue']['source_census_task_count'] == 0
          assert controller['queue']['current_task'] == 'SR-SEARCH-01'
          assert controller['queue']['current_phase'] == 'LITERATURE_SEARCH'
          searches = [t for t in queue['tasks'] if t['phase'] == 'LITERATURE_SEARCH']
          assert len(searches) == 34, len(searches)
          assert searches[0]['task_id'] == 'SR-SEARCH-01'
          assert searches[0]['status'] == 'READY'
          assert searches[0]['structure_ids'] == ['SR-STR-001','SR-STR-002','SR-STR-003','SR-STR-004','SR-STR-005','SR-STR-006']
          print('REGISTRY_LIFECYCLE_REPAIR=PASS')
          print('SEARCH_TASKS=34')
          print('FIRST_SEARCH_TASK=SR-SEARCH-01')
          PY
      - name: Commit official repair and remove finalizer
        shell: bash
        run: |
          rm .github/workflows/sr-registry-lifecycle-repair-finalizer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/structure-radar .github/workflows/sr-registry-lifecycle-repair-finalizer.yml
          git commit -m 'StructureRadar: repair registry lifecycle and unlock search queue'
          git push origin HEAD:structure-radar-registry-lifecycle-repair
