name: Stage15-6ar twist adapter

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6ar/**'
      - 'stages/stage15/evidence/stage15_6ar_twist_adapter.json'
      - 'stages/stage15/replay/verify_stage15_6ar.py'
      - 'stages/stage15/scripts/stage15_6ar_twist_adapter.py'
      - '.github/workflows/stage15-6ar-twist-adapter.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage15-6ar exact twist adapter
        run: python stages/stage15/replay/verify_stage15_6ar.py
      - name: Compile Stage15-6ar utility
        run: python -m py_compile stages/stage15/scripts/stage15_6ar_twist_adapter.py stages/stage15/replay/verify_stage15_6ar.py
