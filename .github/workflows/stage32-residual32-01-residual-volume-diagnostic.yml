name: Stage32 residual32-01 residual volume diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/residual-32-01-production/measure_resumable_residual_volume.py'
      - '.github/workflows/stage32-residual32-01-residual-volume-diagnostic.yml'

permissions:
  contents: read
  actions: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPOSITORY: fizawa460-bit/perfect-cuboid-game
      GEN36_ARTIFACT_ID: '9722184127'
      GEN36_ZIP_SHA256: c892e391ae36076db4e1627822ec95863739cded2bfb34586fc7eb23f0622ee6
      GEN36_MANIFEST_SHA256: 5d27617cd9ea9f85dc871a387e149e7a2b075803de86ac03a879f3894d7cc6a4
      GEN37_ARTIFACT_ID: '9722817296'
      GEN37_ZIP_SHA256: 4a786b5e8e9816f855294c04cc2352818fbb84e6d1de4dc0dcb54e60bc181e6a
      GEN37_MANIFEST_SHA256: 19617b2e04a9c61508eaa408e85f98167217b5f96d36371763f12d1841685bc1
      GEN38_ARTIFACT_ID: '9724140764'
      GEN38_ZIP_SHA256: 6af38b6518e846822f729f269f029ab0509319b375fa75167b6b68c6cc37d8ba
      GEN38_MANIFEST_SHA256: 7c1c6248274f988848b9608d65102e207368467ba1afb29022341a6f866d0476
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify exact Gen36-38 frontier manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/residual-volume"
          for G in 36 37 38; do
            AID_VAR="GEN${G}_ARTIFACT_ID"
            ZIP_VAR="GEN${G}_ZIP_SHA256"
            AID="${!AID_VAR}"
            EXPECT="${!ZIP_VAR}"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$AID/zip" \
              -o "$RUNNER_TEMP/residual-volume/gen${G}.zip"
            ACTUAL=$(sha256sum "$RUNNER_TEMP/residual-volume/gen${G}.zip" | awk '{print $1}')
            test "$ACTUAL" = "$EXPECT"
            mkdir -p "$RUNNER_TEMP/residual-volume/gen${G}"
            unzip -q "$RUNNER_TEMP/residual-volume/gen${G}.zip" -d "$RUNNER_TEMP/residual-volume/gen${G}"
          done

      - name: Measure finite envelope and residual scale
        run: |
          set -euo pipefail
          python stages/stage32/residual-32-01-production/measure_resumable_residual_volume.py \
            --full178-manifest stages/stage32/residual-32-01-production/full178-manifest.json \
            --gen36-dir "$RUNNER_TEMP/residual-volume/gen36" \
            --gen37-dir "$RUNNER_TEMP/residual-volume/gen37" \
            --gen38-dir "$RUNNER_TEMP/residual-volume/gen38" \
            --gen36-sha "$GEN36_MANIFEST_SHA256" \
            --gen37-sha "$GEN37_MANIFEST_SHA256" \
            --gen38-sha "$GEN38_MANIFEST_SHA256" \
            --output "$RUNNER_TEMP/residual-volume/stage32-residual-volume-diagnostic.json"

      - name: Print compact row-scale interpretation
        run: |
          python - <<'PY'
          import json, os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'residual-volume', 'stage32-residual-volume-diagnostic.json')
          d = json.load(open(p))
          print(json.dumps({
              'raw_remaining_upper': d['current_exact_frontier']['exact_finite_raw_remaining_node_upper_bound'],
              'raw_remaining_upper_log10': d['current_exact_frontier']['exact_finite_raw_remaining_node_upper_bound_log10'],
              'full_campaign_raw_upper': d['finite_search_certificate']['raw_budget_only_full_campaign_node_upper_bound'],
              'full_campaign_raw_upper_log10': d['finite_search_certificate']['raw_budget_only_full_campaign_node_upper_bound_log10'],
              'estimated_actual_remaining': d['local_linear_residual_model']['total_estimated_actual_nodes_remaining'],
              'estimated_256m_chunks': d['local_linear_residual_model']['total_estimated_256m_equivalent_chunks'],
              'idealized_17_runner_waves': d['local_linear_residual_model']['idealized_17_runner_256m_waves'],
              'per_lineage_estimate': d['local_linear_residual_model']['per_lineage_estimated_actual_nodes'],
              'row_tail_before_peak': d['current_exact_frontier']['row_tail_sources_before_or_at_budget_only_raw_peak'],
              'row_tail_count': d['current_exact_frontier']['row_tail_source_count'],
          }, sort_keys=True))
          for r in d['rows']:
              print(json.dumps({
                  'row_id': r['row_id'],
                  'frontier_units': r['frontier_units'],
                  'row_tail_units': r['row_tail_units'],
                  'partition_units': r['stratum_partition_units'],
                  'current_e_min': r['current_e_min'],
                  'current_e_median': r['current_e_median'],
                  'current_e_max': r['current_e_max'],
                  'emax': r['emax'],
                  'raw_peak_e': r['raw_curve_peak_e'],
                  'all_current_before_or_at_peak': r['all_current_e_before_or_at_raw_peak'],
                  'row_tail_later_e_counts': r['row_tail_later_e_counts'],
                  'median_raw_next_over_current': r['median_raw_next_over_current'],
                  'row_raw_remaining': r['raw_remaining_envelope_total'],
                  'row_estimated_actual_remaining': r['local_linear_estimated_actual_nodes_remaining_total'],
              }, sort_keys=True))
          PY

      - name: Upload compact diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: stage32-residual32-01-residual-volume-diagnostic
          path: ${{ runner.temp }}/residual-volume/stage32-residual-volume-diagnostic.json
          retention-days: 7
          if-no-files-found: error
