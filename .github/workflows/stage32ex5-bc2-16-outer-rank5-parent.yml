name: Stage32EX5 BC2-16 outer-rank5 symbolic x4 parent preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_16_outer_rank5_symbolic_x4_parent_preflight.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-15-next-exceptional-terminal-block-preflight-checkpoint.json'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2_03_generic_indexed_terminal_adaptive_exceptional_partition.py'
      - 'stages/stage32-ex5/breadth-cycle-2/bc2-02-full178-target-to-59d-model-adapter-preflight.json'
      - 'stages/stage32-ex5/runkeys/bc2-16-outer-rank5-parent-preflight.json'
      - 'stages/stage32/residual-32-01-production/full178-manifest.json'
      - 'stages/stage32/residual-32-01-production/full178-prefix-indexed-compression-main-checkpoint.json'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - '.github/workflows/stage32ex5-bc2-16-outer-rank5-parent.yml'

permissions:
  contents: read

concurrency:
  group: stage32ex5-bc2-16-outer-rank5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.auth.outputs.authorized }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Validate fresh BC2-16 run-key arm in synchronize commit range
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          KEY='stages/stage32-ex5/runkeys/bc2-16-outer-rank5-parent-preflight.json'
          BEFORE='${{ github.event.before }}'
          HEAD='${{ github.event.pull_request.head.sha }}'
          authorized=false
          if [ "${{ github.event.action }}" = "synchronize" ] && [ -n "$BEFORE" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && git diff --name-only "$BEFORE" "$HEAD" | grep -Fxq "$KEY"; then
              python - "$KEY" "$BEFORE" <<'PY'
          import json,subprocess,sys
          key,before=sys.argv[1:]
          new=json.load(open(key))
          if new.get('schema')!='STAGE32EX5_BC2_16_OUTER_RANK5_PARENT_PREFLIGHT_RUNKEY_V1':
              raise SystemExit('run-key schema mismatch')
          if new.get('armed') is not True:
              raise SystemExit('run-key is not armed')
          if new.get('source_commit')!='defd1ee771ad01c1bbabed348fda2aa06132e4fe':
              raise SystemExit('BC2-16 source commit lock mismatch')
          if new.get('terminal_rank_block') != [665,797]:
              raise SystemExit('terminal block lock mismatch')
          if int(new.get('outer_exceptional_rank',-1)) != 5:
              raise SystemExit('outer exceptional rank lock mismatch')
          if int(new.get('expected_parent_branch_count',0)) != 1:
              raise SystemExit('parent branch count lock mismatch')
          if int(new.get('parent_timeout_ms',0)) != 5000:
              raise SystemExit('parent timeout lock mismatch')
          if new.get('bc2_15_checkpoint_canonical_sha256')!='f88ebe53c4300c01fc0a4870cc0dca75a0a091b60c95c8da7e00926bcee43182':
              raise SystemExit('BC2-15 checkpoint lock mismatch')
          if int(new.get('projected_max_artifact_bytes',0)) > 200000:
              raise SystemExit('artifact projection exceeds BC2-16 ceiling')
          if int(new.get('artifact_retention_days',0)) != 1:
              raise SystemExit('transient artifact retention must be one day')
          if int(new.get('effective_heavy_concurrency',0)) != 1:
              raise SystemExit('effective heavy concurrency must be one')
          old_generation=-1
          try:
              old_text=subprocess.check_output(['git','show',f'{before}:{key}'],text=True,stderr=subprocess.DEVNULL)
              old_generation=int(json.loads(old_text).get('generation',-1))
          except subprocess.CalledProcessError:
              pass
          if int(new.get('generation',-1)) <= old_generation:
              raise SystemExit('run-key generation did not advance')
          print('BC2_16_RUNKEY_FRESH_ARM_OK')
          PY
              authorized=true
            fi
          fi
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          echo "BC2_16_HEAVY_AUTHORIZED=$authorized"

  outer-rank5-symbolic-parent-preflight:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact solver dependencies
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Compile BC2-16 solver
        run: python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_16_outer_rank5_symbolic_x4_parent_preflight.py
      - name: Run exact one-parent symbolic x4 preflight
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_16_outer_rank5_symbolic_x4_parent_preflight.py \
            --manifest stages/stage32/residual-32-01-production/full178-manifest.json \
            --prefix-checkpoint stages/stage32/residual-32-01-production/full178-prefix-indexed-compression-main-checkpoint.json \
            --adapter-preflight stages/stage32-ex5/breadth-cycle-2/bc2-02-full178-target-to-59d-model-adapter-preflight.json \
            --bc2-15-checkpoint stages/stage32-ex5/breadth-cycle-2/bc2-15-next-exceptional-terminal-block-preflight-checkpoint.json \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --parent-timeout-ms 5000 \
            --output "$RUNNER_TEMP/bc2-16-outer-rank5-parent-preflight.json"
      - name: Validate partition and credit firewalls
        run: |
          python - "$RUNNER_TEMP/bc2-16-outer-rank5-parent-preflight.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); a=p['adaptive_exceptional_partition']; r=p['parent_result']; f=p['firewalls']
          assert p['schema']=='STAGE32EX5_BC2_16_OUTER_RANK5_SYMBOLIC_X4_PARENT_PREFLIGHT_V1'
          assert p['block_semantics']['rank_start']==665 and p['block_semantics']['rank_end']==797
          assert p['block_semantics']['exceptional_rank']==5
          assert a['fixed_exceptional_mass']==4 and a['residual_exceptional_mass']==0
          assert a['mass_split_derived_from_bc2_15_terminal_and_locked_labels'] is True
          assert a['parent_branch_count']==1 and r['tested_parent_branches']==1
          assert f['whole_g1_d008_e4_stratum_closed'] is False
          assert f['FULL178_complete'] is False and f['stage32_main_credit'] is False
          assert f['n350_production_coverage_credit'] is False
          assert f['theorem_credit'] is False and f['endpoint_credit'] is False
          assert f['merge_authorized'] is False
          print('BC2_16_SCOPE_FIREWALL_OK',r['aggregate_result'],r['exact_unsat_parent_branches'],r['unknown_parent_branches'])
          PY
      - name: Upload compact BC2-16 evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-16-outer-rank5-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/bc2-16-outer-rank5-parent-preflight.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
