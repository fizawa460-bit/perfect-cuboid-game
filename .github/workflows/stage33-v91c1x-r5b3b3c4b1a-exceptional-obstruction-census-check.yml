name: Stage33 V91C1X R5B3B3C4B1A exceptional obstruction census check

on:
  push:
    branches:
      - stage33-v91c1x-r5b2d0-swap23-source-lock
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b1a-exceptional-obstruction-census-check.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1a_exceptional_nonsquare_obstruction_census_and_correction_preflight.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1a-exceptional-nonsquare-obstruction-census-and-correction-preflight.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1-exceptional-p1-targeted-residue-field-squareclass.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4a-tame-residue-parity-and-cross-carrier-preflight.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b2-a2-02-formal-tame-symbol-hidden-carrier-inventory.json'
  pull_request:
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b1a-exceptional-obstruction-census-check.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1a_exceptional_nonsquare_obstruction_census_and_correction_preflight.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1a-exceptional-nonsquare-obstruction-census-and-correction-preflight.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1-exceptional-p1-targeted-residue-field-squareclass.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4a-tame-residue-parity-and-cross-carrier-preflight.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b2-a2-02-formal-tame-symbol-hidden-carrier-inventory.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify C4B1A exceptional obstruction census
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1a_exceptional_nonsquare_obstruction_census_and_correction_preflight.py
      - name: Verify live Stage33 state remains synchronized
        run: python stages/stage33/sync_main_state.py --check
      - name: Diff hygiene and read-only cleanliness
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
