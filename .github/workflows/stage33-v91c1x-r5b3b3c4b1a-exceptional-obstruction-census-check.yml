name: Stage33 V91C1X R5B3B3C4B1A exceptional obstruction census check

on:
  workflow_dispatch:
permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify C4B1A exceptional obstruction census
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1a_exceptional_nonsquare_obstruction_census_and_correction_preflight.py
      - name: Verify live Stage33 state remains synchronized
        run: python stages/stage33/sync_main_state.py --check
      - name: Diff hygiene and read-only cleanliness
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
