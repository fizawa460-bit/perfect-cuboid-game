name: Stage15-6ba AR-012 false-trigger audit

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6ba/**'
      - 'stages/stage15/evidence/stage15_6ba_ar012_false_trigger.json'
      - 'stages/stage15/replay/verify_stage15_6ba.py'
      - 'stages/stage15/scripts/stage15_6ba_ar012_false_trigger.py'
      - '.github/workflows/stage15-6ba-ar012-false-trigger.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python stages/stage15/replay/verify_stage15_6ba.py
      - run: python -m py_compile stages/stage15/scripts/stage15_6ba_ar012_false_trigger.py
