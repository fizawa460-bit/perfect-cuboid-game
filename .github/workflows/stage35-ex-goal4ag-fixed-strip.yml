name: Stage35-EX Goal4AG fixed-component strip

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage35-ex/runkeys/goal4ag-fixed-strip.json'
      - '.github/workflows/stage35-ex-goal4ag-fixed-strip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sympy==1.14.0
      - name: Authorize exact runkey
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=json.loads(Path('stages/stage35-ex/runkeys/goal4ag-fixed-strip.json').read_text())
          assert d['schema']=='STAGE35_EX_GOAL4AG_FIXED_STRIP_RUNKEY_V1'
          assert d['armed'] is True and d['generation']==1
          p=Path('stages/stage35-ex/diagnose_stage35_ex_35_goal4ag_fixed_component_strip.py')
          b=p.read_bytes(); got=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert got==d['diagnostic_blob_sha1']=='394a6e1848b872a0980894845b4458ffdc3f7ff2'
          print('GOAL4AG_FIXED_STRIP_RUNKEY=AUTHORIZED')
          PY
      - name: Exact forced-component stripping
        run: |
          set -euo pipefail
          python -B stages/stage35-ex/diagnose_stage35_ex_35_goal4ag_fixed_component_strip.py | tee /tmp/goal4ag-strip.log
          grep -q '^GOAL4AG_FIXED_STRIP_JSON=' /tmp/goal4ag-strip.log
      - name: Enforce no-credit boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=next(x.split('=',1)[1] for x in Path('/tmp/goal4ag-strip.log').read_text().splitlines() if x.startswith('GOAL4AG_FIXED_STRIP_JSON='))
          d=json.loads(s)
          assert d['degree_range']==[25,64]
          assert d['global_all_degree_exhaustion_proved'] is False
          assert d['explicit_F_B_materialized'] is False
          assert d['theorem_credit'] is False and d['endpoint_credit'] is False
          print('GOAL4AG_FIXED_STRIP_BOUNDARY=PASS')
          PY
