name: Stage32 BRIDGE BR204 retained replay

# Trigger lifecycle: ACTIVE_AUTO — current BRIDGE frontier exact-head audit/replay gate.
on:
  pull_request:
    paths:
      - '.github/workflows/stage32-bridge-br204-retained-replay.yml'
      - 'stages/stage32/generalization-bridge/**'
      - 'docs/research-os/policies/verify_repo_workflow_trigger_inventory.py'
      - 'docs/research-os/policies/repo-workflow-trigger-inventory-bridge-supplement.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-bridge-br204-retained-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retained-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Freeze BRIDGE retained boundary and credit firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage32/generalization-bridge/STATE.json').read_text())
          assert s['current_node']=='BR204'
          assert s['routing']['BR201_complete'] is True
          assert s['routing']['BR202_complete'] is True
          assert s['routing']['BR203_complete'] is True
          assert s['routing']['BR204_light_preflight_complete'] is True
          assert s['routing']['BR204_compact_producer_gate_passed'] is True
          assert s['routing']['BR204_FULL178_scaleout_authorized'] is False
          assert s['routing']['heavy_compute_armed'] is False
          assert s['routing']['BR205_full_qBC_escalation_authorized'] is False
          assert s['br205_bounded_preflight']['formal_BR205_gate_passed'] is False
          print('BRIDGE retained boundary frozen at BR204; heavy and BR205 escalation unauthorized')
          PY

      - name: Verify repository workflow lifecycle composite inventory
        run: python docs/research-os/policies/verify_repo_workflow_trigger_inventory.py

      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'

      - name: Replay BR203 exact 16-state Picard mu source lock
        run: |
          python stages/stage32/generalization-bridge/verify_br203_picard_mu_16_state_v2.py \
            --output /tmp/BR203-PICARD-MU-16-STATE-RESULT.json
          python stages/stage32/generalization-bridge/emit_br203_bounded_mu_header.py \
            /tmp/BR203-PICARD-MU-16-STATE-RESULT.json \
            /tmp/br203_mu_generated.hpp

      - name: Replay BR203 direct bounded same-population intersection
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -I/tmp \
            stages/stage32/generalization-bridge/verify_br203_bounded_mu_intersection_kernel.cpp \
            -o /tmp/br203-direct
          /tmp/br203-direct > /tmp/br203-direct.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/br203-direct.json'))
          assert x['status']=='PASS_ZERO_CREDIT'
          assert x['H16_d32']['BR203_mu_K8']==229209796641
          PY

      - name: Replay BR204 compact routing and K8 syndrome equivalence
        run: |
          g++ -std=c++20 -O3 -DNDEBUG \
            stages/stage32/generalization-bridge/verify_br204_compact_routing_surface_preflight.cpp \
            -o /tmp/br204-routing
          /tmp/br204-routing > /tmp/br204-routing.json
          g++ -std=c++20 -O3 -DNDEBUG \
            stages/stage32/generalization-bridge/verify_br204_compact_k8_syndrome_preflight.cpp \
            -o /tmp/br204-k8
          /tmp/br204-k8 > /tmp/br204-k8.json
          g++ -std=c++20 -O3 -DNDEBUG -I/tmp \
            stages/stage32/generalization-bridge/verify_br204_compact_mu_bounded_equivalence.cpp \
            -o /tmp/br204-mu
          /tmp/br204-mu > /tmp/br204-mu.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/br204-routing.json'))
          k=json.load(open('/tmp/br204-k8.json'))
          m=json.load(open('/tmp/br204-mu.json'))
          assert r['status']=='PASS_ZERO_CREDIT'
          assert r['H96']['refined_states']==4070710
          assert k['status']=='PASS_ZERO_CREDIT'
          assert k['H16']['direct_equals_compact'] is True
          assert m['status']=='PASS_ZERO_CREDIT'
          assert m['H10']['direct_reference_match'] is True
          assert m['H16']['direct_reference_match'] is True
          assert m['H16']['BR203_mu_K8']==229209796641
          print('BR204 compact retained replay PASS')
          PY

      - name: Reverify bounded BR205 qBC-tail attribution without authorization
        run: python stages/stage32/generalization-bridge/verify_br205_qbc_slack_attribution_bounded_preflight.py

      - name: Diff check
        if: github.event_name == 'pull_request'
        run: git -c core.whitespace=-blank-at-eof diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
