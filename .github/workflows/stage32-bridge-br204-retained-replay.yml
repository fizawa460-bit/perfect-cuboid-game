name: Stage32 BRIDGE BR204 retained replay

# Trigger lifecycle: ACTIVE_AUTO — current BRIDGE frontier exact-head audit/replay gate.
on:
  push:
    branches:
      - stage32bridge-mainbatch
    paths:
      - '.github/workflows/stage32-bridge-br204-retained-replay.yml'
      - 'stages/stage32/generalization-bridge/**'
      - '!stages/stage32/generalization-bridge/runkeys/br204-full178-heavy.json'
      - 'docs/research-os/policies/verify_repo_workflow_trigger_inventory.py'
      - 'docs/research-os/policies/repo-workflow-trigger-inventory-bridge-supplement.json'
  pull_request:
    paths:
      - '.github/workflows/stage32-bridge-br204-retained-replay.yml'
      - 'stages/stage32/generalization-bridge/**'
      - '!stages/stage32/generalization-bridge/runkeys/br204-full178-heavy.json'
      - 'docs/research-os/policies/verify_repo_workflow_trigger_inventory.py'
      - 'docs/research-os/policies/repo-workflow-trigger-inventory-bridge-supplement.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-bridge-br204-retained-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTUAL_V45_MAIN: 659ba93b9eba657b49a728f549c6bb6028398e08
  V45_MAIN_STATE_BLOB: a8f873ffdcaca280f7b57158b69606b3ea496d3c
  GENERATION1_HEAD: ee755bbfd46f405ca83e4930b354ee63459ad362
  GENERATION1_RUN: '35344605175'
  AUDITED_DOORSTEP: 4a84fc8c09bb2ccb35aab965797aeaefd3b6efe8
  AUDITED_REVIEW: '5247726057'
  AUDITED_WORKER_BLOB: 0d5ee8e1013cab6120e957707a363e86b3c0d41e
  BC_SHARD_WORKER_BLOB: ee152cccd3eaa6740202036d8d25ffb0d6a0fa84
  BC_COMBINER_BLOB: efcbcc3e2b31604acea8f83bbf9524e5180e5139
  BC_EQUIV_BLOB: e77d033dd375b7a2db319b647d45d56354b9b2b8
  GEN2_PREFLIGHT_BLOB: 16bca3f86043e10fb4574ca199d4f38d19e3549e
  BC_RESUME_RUNNER_BLOB: 15dcf1e21979d3de155c57a01f6a5922dddc1ba3
  BC_FINALIZER_BLOB: 953f70ef3f9396249743f4fdcd68f1990d917b69
  FINER_TARGETS_BLOB: 7b1ade20bcb3408bd7d66581033902a54ac90592
  G2_FINER_WORKFLOW_BLOB: e0441ae839fae00bc4a0302b9c10f75427686d7c
  G2_FINER_RUNKEY_BLOB: 5add938726e35fdaa850dfe1e80018344ceea1f4

jobs:
  retained-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Verify frozen generation-1 recovery and generation-2 preflight
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          state=json.loads(Path('stages/stage32/generalization-bridge/STATE.json').read_text())
          cp=json.loads(Path('stages/stage32/generalization-bridge/BR204-GENERATION1-RECOVERY-CHECKPOINT.json').read_text())
          pf=json.loads(Path('stages/stage32/generalization-bridge/BR204-GENERATION2-FINER-PARTITION-PREFLIGHT.json').read_text())
          rk=json.loads(Path('stages/stage32/generalization-bridge/runkeys/br204-full178-heavy.json').read_text())

          assert state['current_node']=='BR204'
          assert state['active_leaf']=='BR204_GENERATION2_COLD_DOORSTEP_AUDIT'
          assert state['live_main_refresh']['repository_main_head']==os.environ['ACTUAL_V45_MAIN']
          assert state['live_main_refresh']['repository_main_state_blob']==os.environ['V45_MAIN_STATE_BLOB']
          assert state['live_main_refresh']['authoritative_remaining_terminals']=='138652739800650593494'

          assert cp['bridge']['run_id']==int(os.environ['GENERATION1_RUN'])
          assert cp['bridge']['execution_head']==os.environ['GENERATION1_HEAD']
          assert cp['bridge']['run_conclusion']=='cancelled'
          inv=cp['generation1_inventory']
          assert inv['total_workflow_jobs']==256
          assert inv['outer_unit_jobs']==248
          assert inv['complete_outer_artifact_count']==31
          assert inv['partial_outer_artifact_count']==41
          assert inv['failed_outer_jobs_without_durable_outer_payload_count']==66
          assert len(cp['exact_hard_stops_with_persisted_status'])==3
          assert all(x['reason']=='SINGLE_D_TIMEOUT_REQUIRES_FINER_PARTITION'
                     for x in cp['exact_hard_stops_with_persisted_status'])

          assert pf['status']=='COLD_EXECUTION_TOPOLOGY_IMPLEMENTED__EXACT_HEAD_REPLAY_AND_HOSTILE_AUDIT_REQUIRED_BEFORE_GENERATION2__ZERO_CREDIT'
          assert pf['live_main_refresh']['repository_main_head']==os.environ['ACTUAL_V45_MAIN']
          assert pf['live_main_refresh']['main_state_blob']==os.environ['V45_MAIN_STATE_BLOB']
          assert pf['live_main_refresh']['authoritative_remaining_terminals']=='138652739800650593494'
          q=pf['proposed_exact_finer_partition']
          assert q['parent_quantum']=='b_x_d'
          assert q['child_quantum']=='b_x_d_x_bc_shard'
          assert q['bc_shard_count']==16
          assert pf['carry_compatibility_gate']['current_authorization'] is False

          # This runkey is frozen generation-1 execution history. It is deliberately
          # not rewritten or re-armed by the generation-2 preflight commits.
          assert rk['generation']==1 and rk['armed'] is True
          assert rk['carry_run_id'] is None
          assert rk['arm_contract']['audited_doorstep_head']==os.environ['AUDITED_DOORSTEP']
          assert rk['arm_contract']['audited_doorstep_review_id']==int(os.environ['AUDITED_REVIEW'])
          assert rk['source_locks']['worker_blob']=='0d5ee8e1013cab6120e957707a363e86b3c0d41e'

          for obj in (state, cp, pf):
              credit=obj.get('credit',{})
              for k in ('stage32_main','full178_complete','theorem','effectivity','receiver','endpoint','perfect_cuboid','merge'):
                  if k in credit: assert credit[k] is False
          print('PASS frozen generation1 recovery + generation2 finer-partition preflight')
          PY

      - name: Verify actual live V45 main snapshot
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$ACTUAL_V45_MAIN"
          test "$(git rev-parse FETCH_HEAD:stages/stage32/MAIN-STATE.json)" = "$V45_MAIN_STATE_BLOB"

      - name: Verify repository workflow lifecycle composite inventory
        run: python docs/research-os/policies/verify_repo_workflow_trigger_inventory.py

      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'

      - name: Replay retained BR203 and bounded BR204 semantics
        run: |
          set -euo pipefail
          python stages/stage32/generalization-bridge/verify_br203_picard_mu_16_state_v2.py --output /tmp/mu.json
          python stages/stage32/generalization-bridge/emit_br203_bounded_mu_header.py /tmp/mu.json /tmp/br203_mu_generated.hpp
          g++ -std=c++20 -O3 -DNDEBUG -I/tmp stages/stage32/generalization-bridge/verify_br203_bounded_mu_intersection_kernel.cpp -o /tmp/br203-direct
          /tmp/br203-direct > /tmp/br203-direct.json
          g++ -std=c++20 -O3 -DNDEBUG stages/stage32/generalization-bridge/verify_br204_compact_routing_surface_preflight.cpp -o /tmp/routing
          /tmp/routing > /tmp/routing.json
          g++ -std=c++20 -O3 -DNDEBUG stages/stage32/generalization-bridge/verify_br204_compact_k8_syndrome_preflight.cpp -o /tmp/k8
          /tmp/k8 > /tmp/k8.json
          g++ -std=c++20 -O3 -DNDEBUG -I/tmp stages/stage32/generalization-bridge/verify_br204_compact_mu_bounded_equivalence.cpp -o /tmp/mu-eq
          /tmp/mu-eq > /tmp/mu-eq.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/br203-direct.json'))
          r=json.load(open('/tmp/routing.json'))
          k=json.load(open('/tmp/k8.json'))
          m=json.load(open('/tmp/mu-eq.json'))
          assert d['status']=='PASS_ZERO_CREDIT' and d['H16_d32']['BR203_mu_K8']==229209796641
          assert r['status']=='PASS_ZERO_CREDIT' and r['H96']['refined_states']==4070710
          assert k['status']=='PASS_ZERO_CREDIT' and k['H16']['direct_equals_compact'] is True
          assert m['status']=='PASS_ZERO_CREDIT'
          assert m['H10']['direct_reference_match'] is True
          assert m['H16']['direct_reference_match'] is True
          assert m['H16']['BR203_mu_K8']==229209796641
          PY

      - name: Verify generation-2 finer-partition source locks
        run: |
          set -euo pipefail
          test "$(git hash-object stages/stage32/generalization-bridge/run_br204_full178_b_unit.cpp)" = "$AUDITED_WORKER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/run_br204_full178_bc_shard.cpp)" = "$BC_SHARD_WORKER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/combine_br204_bc_shards.py)" = "$BC_COMBINER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/verify_br204_bc_shard_equivalence.py)" = "$BC_EQUIV_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/run_br204_resumable_bc_shards.py)" = "$BC_RESUME_RUNNER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/finalize_br204_bc_shard_checkpoint.py)" = "$BC_FINALIZER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-GENERATION1-FINER-TARGETS.json)" = "$FINER_TARGETS_BLOB"
          test "$(git hash-object .github/workflows/br204-stage32-bridge-finer-recovery.yml)" = "$G2_FINER_WORKFLOW_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/runkeys/br204-finer-recovery-g2.json)" = "$G2_FINER_RUNKEY_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-GENERATION2-FINER-PARTITION-PREFLIGHT.json)" = "$GEN2_PREFLIGHT_BLOB"
          python -m py_compile \
            stages/stage32/generalization-bridge/combine_br204_bc_shards.py \
            stages/stage32/generalization-bridge/verify_br204_bc_shard_equivalence.py \
            stages/stage32/generalization-bridge/run_br204_resumable_bc_shards.py \
            stages/stage32/generalization-bridge/finalize_br204_bc_shard_checkpoint.py \
            stages/stage32/generalization-bridge/combine_br204_d_slices.py \
            stages/stage32/generalization-bridge/run_br204_resumable_band.py \
            stages/stage32/generalization-bridge/finalize_br204_band_checkpoint.py \
            stages/stage32/generalization-bridge/verify_br204_recovery_inventory.py

      - name: Verify cold generation2 finer recovery doorway
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rk=json.loads(Path('stages/stage32/generalization-bridge/runkeys/br204-finer-recovery-g2.json').read_text())
          t=json.loads(Path('stages/stage32/generalization-bridge/BR204-GENERATION1-FINER-TARGETS.json').read_text())
          pf=json.loads(Path('stages/stage32/generalization-bridge/BR204-GENERATION2-FINER-PARTITION-PREFLIGHT.json').read_text())
          assert rk['schema']=='STAGE32_BR204_FINER_RECOVERY_G2_RUNKEY_V1'
          assert rk['generation']==0 and rk['armed'] is False
          assert rk['arm_contract']['audited_doorstep_head'] is None
          assert rk['arm_contract']['audited_doorstep_review_id'] is None
          assert rk['carry_generation1_run_id']==35344605175
          assert rk['execution']['max_parallel']==15
          assert rk['resource_preflight']['planned_effective_heavy_concurrency']==15
          assert rk['resource_preflight']['maximum_other_stage32_heavy_concurrency_at_arm']==3
          assert rk['source_locks']['audited_generation1_worker_blob']=='0d5ee8e1013cab6120e957707a363e86b3c0d41e'
          assert rk['source_locks']['repository_main_head']=='659ba93b9eba657b49a728f549c6bb6028398e08'
          assert rk['source_locks']['repository_main_state_blob']=='a8f873ffdcaca280f7b57158b69606b3ea496d3c'
          assert t['target_count']==69==len(t['targets'])
          assert len({(x['b'],x['d']) for x in t['targets']})==69
          assert pf['implementation_progress']['generation2_runkey_arm'].startswith('COLD_GENERATION0_UNARMED')
          assert pf['carry_compatibility_gate']['current_authorization'] is False
          assert all(v is False for v in rk['credit'].values())
          print('PASS generation2 finer recovery doorway is cold and zero-credit')
          PY

      - name: Prove direct versus 16-way BC-shard exact equivalence
        run: |
          set -euo pipefail
          python stages/stage32/generalization-bridge/verify_br204_bc_shard_equivalence.py --include-dir /tmp --b 0 --d 8 --shard-count 16

      - name: Verify finer-partition firewalls and no generation-2 arm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          worker=Path('stages/stage32/generalization-bridge/run_br204_full178_bc_shard.cpp').read_text()
          audited=Path('stages/stage32/generalization-bridge/run_br204_full178_b_unit.cpp')
          import subprocess
          assert subprocess.check_output(['git','hash-object',str(audited)],text=True).strip()=='0d5ee8e1013cab6120e957707a363e86b3c0d41e'
          combiner=Path('stages/stage32/generalization-bridge/combine_br204_bc_shards.py').read_text()
          pf=json.loads(Path('stages/stage32/generalization-bridge/BR204-GENERATION2-FINER-PARTITION-PREFLIGHT.json').read_text())
          assert '--bc-shard-index' in worker and '--bc-shard-count' in worker
          assert 'this_index %' in worker
          assert 'BC_MOD' in worker
          assert 'set(found)==set(range(a.shard_count))' in combiner
          assert pf['proposed_exact_finer_partition']['bc_shard_count']==16
          assert pf['carry_compatibility_gate']['current_authorization'] is False
          assert 'Hostile-audit' in 'Hostile-audit the changed recovery/execution topology before any generation-2 runkey-only arm commit.'
          print('PASS execution-only partition primitive; generation2 heavy remains unauthorized')
          PY

      - name: Reverify bounded BR205 qBC-tail attribution without authorization
        run: python stages/stage32/generalization-bridge/verify_br205_qbc_slack_attribution_bounded_preflight.py

      - name: Diff check from last hostile-audited BR204 doorstep
        run: git -c core.whitespace=-blank-at-eof diff --check "$AUDITED_DOORSTEP" HEAD
