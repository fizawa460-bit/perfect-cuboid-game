name: Stage32 BRIDGE BR204 retained replay

# Trigger lifecycle: ACTIVE_AUTO — current BRIDGE frontier exact-head audit/replay gate.
on:
  push:
    branches:
      - stage32bridge-mainbatch
    paths:
      - '.github/workflows/stage32-bridge-br204-retained-replay.yml'
      - 'stages/stage32/generalization-bridge/**'
      - '!stages/stage32/generalization-bridge/runkeys/br204-full178-heavy.json'
      - 'docs/research-os/policies/verify_repo_workflow_trigger_inventory.py'
      - 'docs/research-os/policies/repo-workflow-trigger-inventory-bridge-supplement.json'
  pull_request:
    paths:
      - '.github/workflows/stage32-bridge-br204-retained-replay.yml'
      - 'stages/stage32/generalization-bridge/**'
      - '!stages/stage32/generalization-bridge/runkeys/br204-full178-heavy.json'
      - 'docs/research-os/policies/verify_repo_workflow_trigger_inventory.py'
      - 'docs/research-os/policies/repo-workflow-trigger-inventory-bridge-supplement.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage32-bridge-br204-retained-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTUAL_V45_MAIN: 659ba93b9eba657b49a728f549c6bb6028398e08
  V45_MAIN_STATE_BLOB: a8f873ffdcaca280f7b57158b69606b3ea496d3c
  GENERATION1_HEAD: ee755bbfd46f405ca83e4930b354ee63459ad362
  GENERATION1_RUN: '35344605175'
  AUDITED_DOORSTEP: 4a84fc8c09bb2ccb35aab965797aeaefd3b6efe8
  AUDITED_REVIEW: '5247726057'
  AUDITED_WORKER_BLOB: 0d5ee8e1013cab6120e957707a363e86b3c0d41e
  BC_SHARD_WORKER_BLOB: ca0a4985e788455432eb59d603da54fc3c703ea6
  BC_COMBINER_BLOB: efcbcc3e2b31604acea8f83bbf9524e5180e5139
  BC_EQUIV_BLOB: e77d033dd375b7a2db319b647d45d56354b9b2b8
  GEN2_PREFLIGHT_BLOB: d6005307ce778d8d6a1895b38c0ca75b8e58118c
  BC_RESUME_RUNNER_BLOB: 15dcf1e21979d3de155c57a01f6a5922dddc1ba3
  BC_FINALIZER_BLOB: 953f70ef3f9396249743f4fdcd68f1990d917b69
  FINER_TARGETS_BLOB: 7b1ade20bcb3408bd7d66581033902a54ac90592
  G2_FINER_WORKFLOW_BLOB: 8a208f0d092786a92ff19f58a2c062bd20f80955
  G2_FINER_RUNKEY_BLOB: f2e45bc7ffa2f331cb160126dcca3ddeaa4d7b78
  G2_EXECUTION_WORKFLOW_BLOB: f935f6c1fafbb224b725a8dd886fcf7d4d1fe89f
  G2_RECOVERY_CHECKPOINT_BLOB: 8f8cf85df79e31953dffcb563affec638caddd99
  G2_RECOVERY_VERIFIER_BLOB: df9ce800fa8e44b12d6618965c0997897eaeb819
  G3_TARGETS_BLOB: 975fadbe0f3ee0dfd7c792be7807c154421dec20
  G3_PARENT_COMBINER_BLOB: 5986168bca8ec63e1d1aab2e417e9157ae09ef23
  G3_HIER_RUNNER_BLOB: ae79ec1ed4ed373f53e5ef010bc2f9e17d8ced45
  G3_FINALIZER_BLOB: 04f574c4e40d7c6651439f9e7da5d940749b485a
  G3_EQUIV_BLOB: 3148a180d4e41d5a2910d373a8c4cae065a0b3c3
  G3_WORKFLOW_BLOB: 5fc7e6040aa03b702b53c6ba990f3359920f6b04
  G3_RUNKEY_BLOB: c5db6eaa834b0e24c07a3307fcdaf27200b99f50
  G3_STATE_BLOB: e78df8d785205b5abaeb7d0f37511179f00e0891
  G2_AUDITED_COLD: 8dae39f68e3b0f087e2f4ea8ab6295d6c703f372
  G2_AUDIT_REVIEW: '5255840221'

jobs:
  retained-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Verify frozen generation-2 execution and generation-3 cold recovery
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          state=json.loads(Path('stages/stage32/generalization-bridge/STATE.json').read_text())
          g1=json.loads(Path('stages/stage32/generalization-bridge/BR204-GENERATION1-RECOVERY-CHECKPOINT.json').read_text())
          g2pf=json.loads(Path('stages/stage32/generalization-bridge/BR204-GENERATION2-FINER-PARTITION-PREFLIGHT.json').read_text())
          g2cp=json.loads(Path('stages/stage32/generalization-bridge/BR204-GENERATION2-RECOVERY-CHECKPOINT.json').read_text())
          g2rk=json.loads(Path('stages/stage32/generalization-bridge/runkeys/br204-finer-recovery-g2.json').read_text())
          g3t=json.loads(Path('stages/stage32/generalization-bridge/BR204-GENERATION3-RECOVERY-TARGETS.json').read_text())
          g3rk=json.loads(Path('stages/stage32/generalization-bridge/runkeys/br204-recovery-g3.json').read_text())

          assert state['current_node']=='BR204'
          assert state['active_leaf']=='BR204_GENERATION3_COLD_DOORSTEP_AUDIT'
          assert state['live_main_refresh']['repository_main_head']==os.environ['ACTUAL_V45_MAIN']
          assert state['live_main_refresh']['repository_main_state_blob']==os.environ['V45_MAIN_STATE_BLOB']
          assert state['live_main_refresh']['authoritative_remaining_terminals']=='138652739800650593494'
          assert subprocess.check_output(['git','hash-object','stages/stage32/generalization-bridge/STATE.json'],text=True).strip()==os.environ['G3_STATE_BLOB']

          assert g1['bridge']['run_id']==int(os.environ['GENERATION1_RUN'])
          assert g1['bridge']['execution_head']==os.environ['GENERATION1_HEAD']
          assert g2pf['live_main_refresh']['repository_main_head']==os.environ['ACTUAL_V45_MAIN']

          assert g2cp['generation2_run']['run_id']==35445118788
          assert g2cp['generation2_run']['execution_head']=='cc8c65a13b806b7c96be23dd9f04cd6bf7ec3029'
          assert g2cp['generation2_run']['workflow_blob']==os.environ['G2_EXECUTION_WORKFLOW_BLOB']
          r=g2cp['reconciled_execution']
          assert r['target_count']==69
          assert r['compute_complete_but_undurable_cap_reject_count']==36
          assert r['durable_partial_bc16_timeout_count']==33
          assert r['all_36_complete_runner_logs_verified'] is True
          assert r['all_36_cap_reject_logs_verified'] is True
          assert r['d148_boundary']['b2']['completed_parent_bc16_shards']==[0]

          assert g2rk['generation']==1 and g2rk['armed'] is True
          assert g2rk['arm_contract']['audited_doorstep_head']==os.environ['G2_AUDITED_COLD']
          assert g2rk['arm_contract']['audited_doorstep_review_id']==int(os.environ['G2_AUDIT_REVIEW'])

          assert g3t['target_count']==69==len(g3t['targets'])
          assert g3t['classes']['retention_replay_flat16_count']==36
          assert g3t['classes']['d148_hierarchical_bc64_count']==33
          assert g3t['classes']['retained_generation2_parent_bc16']==[{'b':2,'d':148,'index':0}]
          assert len({(x['b'],x['d']) for x in g3t['targets']})==69

          assert g3rk['schema']=='STAGE32_BR204_RECOVERY_G3_RUNKEY_V1'
          assert g3rk['generation']==0 and g3rk['armed'] is False
          assert g3rk['arm_contract']['audited_doorstep_head'] is None
          assert g3rk['arm_contract']['audited_doorstep_review_id'] is None
          assert g3rk['carry_generation2_run_id']==35445118788
          assert g3rk['execution']['max_parallel']==15
          assert g3rk['resource_preflight']['planned_effective_heavy_concurrency']==15
          assert g3rk['source_locks']['generation2_recovery_checkpoint_blob']==os.environ['G2_RECOVERY_CHECKPOINT_BLOB']
          assert g3rk['source_locks']['generation3_targets_blob']==os.environ['G3_TARGETS_BLOB']
          assert g3rk['source_locks']['generation3_workflow_blob']==os.environ['G3_WORKFLOW_BLOB']
          assert all(v is False for v in g3rk['credit'].values())

          for obj in (state,g1,g2pf,g2cp,g3t,g3rk):
              credit=obj.get('credit',{})
              for k in ('stage32_main','full178_complete','theorem','effectivity','receiver','endpoint','perfect_cuboid','merge'):
                  if k in credit: assert credit[k] is False
          print('PASS frozen generation2 execution + generation3 cold recovery doorway')
          PY

      - name: Verify actual live V45 main snapshot
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$ACTUAL_V45_MAIN"
          test "$(git rev-parse FETCH_HEAD:stages/stage32/MAIN-STATE.json)" = "$V45_MAIN_STATE_BLOB"

      - name: Verify repository workflow lifecycle composite inventory
        run: python docs/research-os/policies/verify_repo_workflow_trigger_inventory.py

      - name: Install exact algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'

      - name: Replay retained BR203 and bounded BR204 semantics
        run: |
          set -euo pipefail
          python stages/stage32/generalization-bridge/verify_br203_picard_mu_16_state_v2.py --output /tmp/mu.json
          python stages/stage32/generalization-bridge/emit_br203_bounded_mu_header.py /tmp/mu.json /tmp/br203_mu_generated.hpp
          g++ -std=c++20 -O3 -DNDEBUG -I/tmp stages/stage32/generalization-bridge/verify_br203_bounded_mu_intersection_kernel.cpp -o /tmp/br203-direct
          /tmp/br203-direct > /tmp/br203-direct.json
          g++ -std=c++20 -O3 -DNDEBUG stages/stage32/generalization-bridge/verify_br204_compact_routing_surface_preflight.cpp -o /tmp/routing
          /tmp/routing > /tmp/routing.json
          g++ -std=c++20 -O3 -DNDEBUG stages/stage32/generalization-bridge/verify_br204_compact_k8_syndrome_preflight.cpp -o /tmp/k8
          /tmp/k8 > /tmp/k8.json
          g++ -std=c++20 -O3 -DNDEBUG -I/tmp stages/stage32/generalization-bridge/verify_br204_compact_mu_bounded_equivalence.cpp -o /tmp/mu-eq
          /tmp/mu-eq > /tmp/mu-eq.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/br203-direct.json'))
          r=json.load(open('/tmp/routing.json'))
          k=json.load(open('/tmp/k8.json'))
          m=json.load(open('/tmp/mu-eq.json'))
          assert d['status']=='PASS_ZERO_CREDIT' and d['H16_d32']['BR203_mu_K8']==229209796641
          assert r['status']=='PASS_ZERO_CREDIT' and r['H96']['refined_states']==4070710
          assert k['status']=='PASS_ZERO_CREDIT' and k['H16']['direct_equals_compact'] is True
          assert m['status']=='PASS_ZERO_CREDIT'
          assert m['H10']['direct_reference_match'] is True
          assert m['H16']['direct_reference_match'] is True
          assert m['H16']['BR203_mu_K8']==229209796641
          PY

      - name: Verify generation-2 historical and generation-3 recovery source locks
        run: |
          set -euo pipefail
          test "$(git hash-object stages/stage32/generalization-bridge/run_br204_full178_b_unit.cpp)" = "$AUDITED_WORKER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/run_br204_full178_bc_shard.cpp)" = "$BC_SHARD_WORKER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/combine_br204_bc_shards.py)" = "$BC_COMBINER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/run_br204_resumable_bc_shards.py)" = "$BC_RESUME_RUNNER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-GENERATION1-FINER-TARGETS.json)" = "$FINER_TARGETS_BLOB"
          test "$(git hash-object .github/workflows/br204-stage32-bridge-finer-recovery.yml)" = "$G2_FINER_WORKFLOW_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/runkeys/br204-finer-recovery-g2.json)" = "$G2_FINER_RUNKEY_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-GENERATION2-FINER-PARTITION-PREFLIGHT.json)" = "$GEN2_PREFLIGHT_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-GENERATION2-RECOVERY-CHECKPOINT.json)" = "$G2_RECOVERY_CHECKPOINT_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/verify_br204_generation2_recovery_checkpoint.py)" = "$G2_RECOVERY_VERIFIER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/BR204-GENERATION3-RECOVERY-TARGETS.json)" = "$G3_TARGETS_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/combine_br204_bc64_to_bc16_parent.py)" = "$G3_PARENT_COMBINER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/run_br204_resumable_bc64_hierarchical.py)" = "$G3_HIER_RUNNER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/finalize_br204_generation3_target.py)" = "$G3_FINALIZER_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/verify_br204_bc64_hierarchical_equivalence.py)" = "$G3_EQUIV_BLOB"
          test "$(git hash-object .github/workflows/br204-stage32-bridge-recovery-g3.yml)" = "$G3_WORKFLOW_BLOB"
          test "$(git hash-object stages/stage32/generalization-bridge/runkeys/br204-recovery-g3.json)" = "$G3_RUNKEY_BLOB"
          python stages/stage32/generalization-bridge/verify_br204_generation2_recovery_checkpoint.py
          python -m py_compile \
            stages/stage32/generalization-bridge/combine_br204_bc_shards.py \
            stages/stage32/generalization-bridge/run_br204_resumable_bc_shards.py \
            stages/stage32/generalization-bridge/combine_br204_bc64_to_bc16_parent.py \
            stages/stage32/generalization-bridge/run_br204_resumable_bc64_hierarchical.py \
            stages/stage32/generalization-bridge/finalize_br204_generation3_target.py \
            stages/stage32/generalization-bridge/verify_br204_bc64_hierarchical_equivalence.py

      - name: Verify cold generation3 recovery doorway
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          rk=json.loads(Path('stages/stage32/generalization-bridge/runkeys/br204-recovery-g3.json').read_text())
          t=json.loads(Path('stages/stage32/generalization-bridge/BR204-GENERATION3-RECOVERY-TARGETS.json').read_text())
          assert rk['generation']==0 and rk['armed'] is False
          assert rk['arm_contract']['audited_doorstep_head'] is None
          assert rk['arm_contract']['audited_doorstep_review_id'] is None
          assert rk['execution']['target_count']==69
          assert rk['execution']['retention_replay_flat16_count']==36
          assert rk['execution']['d148_hierarchical_bc64_count']==33
          assert rk['execution']['parent_bc_shard_count']==16
          assert rk['execution']['child_bc_shard_count']==64
          assert rk['resource_preflight']['planned_effective_heavy_concurrency']==15
          assert rk['resource_preflight']['repository_stage_concurrency_ceiling']==18
          assert rk['resource_preflight']['maximum_other_stage32_heavy_concurrency_at_arm']==3
          assert rk['source_locks']['generation3_workflow_blob']==os.environ['G3_WORKFLOW_BLOB']
          assert rk['source_locks']['generation3_targets_blob']==os.environ['G3_TARGETS_BLOB']
          assert t['classes']['retained_generation2_parent_bc16']==[{'b':2,'d':148,'index':0}]
          assert all(v is False for v in rk['credit'].values())
          print('PASS generation3 recovery doorway is cold and zero-credit')
          PY

      - name: Prove direct versus 16-way BC-shard exact equivalence
        run: |
          set -euo pipefail
          python stages/stage32/generalization-bridge/verify_br204_bc_shard_equivalence.py --include-dir /tmp --b 0 --d 8 --shard-count 16

      - name: Prove BC64 hierarchical recovery equals ordinary BC16 payload
        run: |
          set -euo pipefail
          python stages/stage32/generalization-bridge/verify_br204_bc64_hierarchical_equivalence.py --include-dir /tmp --b 0 --d 8

      - name: Verify generation3 recovery firewalls and no arm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rk=json.loads(Path('stages/stage32/generalization-bridge/runkeys/br204-recovery-g3.json').read_text())
          t=json.loads(Path('stages/stage32/generalization-bridge/BR204-GENERATION3-RECOVERY-TARGETS.json').read_text())
          group=Path('stages/stage32/generalization-bridge/combine_br204_bc64_to_bc16_parent.py').read_text()
          hier=Path('stages/stage32/generalization-bridge/run_br204_resumable_bc64_hierarchical.py').read_text()
          assert rk['generation']==0 and rk['armed'] is False
          assert t['semantics']['blind_generation2_rerun'] is False
          assert t['semantics']['exact_union_required'] is True
          assert 'range(a.parent_index,a.child_count,a.parent_count)' in group
          assert 'PARENT_COUNT=16' in hier and 'CHILD_COUNT=64' in hier
          assert rk['recovery_policy']['carry_validated_generation2_parent_bc16'] is True
          assert rk['recovery_policy']['retained_generation2_parent_bc16']==[{'b':2,'d':148,'index':0}]
          assert all(v is False for v in rk['credit'].values())
          print('PASS generation3 is execution-only recovery, cold and zero-credit')
          PY

      - name: Reverify bounded BR205 qBC-tail attribution without authorization
        run: python stages/stage32/generalization-bridge/verify_br205_qbc_slack_attribution_bounded_preflight.py

      - name: Diff check from last hostile-audited BR204 doorstep
        run: git -c core.whitespace=-blank-at-eof diff --check "$G2_AUDITED_COLD" HEAD
