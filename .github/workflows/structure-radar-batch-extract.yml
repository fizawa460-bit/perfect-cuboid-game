name: StructureRadar batch extract

on:
  pull_request:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Emit current READY source batch
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          queue = json.loads((root / 'docs/structure-radar/exploration-queue.json').read_text(encoding='utf-8'))
          task = next(t for t in queue['tasks'] if t['status'] == 'READY')
          wanted = set(task['source_ids'])

          index = json.loads((root / 'docs/structure-radar/source-manifest.json').read_text(encoding='utf-8'))
          by_id = {}
          for part in index['parts']:
              data = json.loads((root / part['path']).read_text(encoding='utf-8'))
              for src in data['sources']:
                  if src['source_id'] in wanted:
                      by_id[src['source_id']] = src

          print(f'=== SR_BATCH_TASK {task["task_id"]} SOURCES={len(task["source_ids"])} ===')
          for i, sid in enumerate(task['source_ids'], 1):
              src = by_id[sid]
              path = root / src['path']
              print(f'\n=== SR_SOURCE_BEGIN {i:02d} {sid} {src["path"]} ===')
              print(path.read_text(encoding='utf-8'))
              print(f'=== SR_SOURCE_END {i:02d} {sid} ===')
          PY
