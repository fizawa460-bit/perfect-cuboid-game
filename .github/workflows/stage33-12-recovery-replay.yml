name: Stage33-12 recovery replay

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: stage33-12-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-recovery-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay recovered H1-41 blocker and compact state
        run: |
          python stages/stage33/33-12/verify_j2_recovered_mask6_h1_coordinate41_blocker.py
          python stages/stage33/sync_main_state.py --check
          git diff --check
