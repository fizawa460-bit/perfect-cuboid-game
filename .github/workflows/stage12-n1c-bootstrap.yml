name: Stage12-N1c bootstrap outputs

on:
  pull_request:
    paths:
      - "scripts/audit_shared_p_global_mobius_stage12_n1c.py"
      - "scripts/update_shared_p_global_mobius_stage12_n1c_memo.py"
      - ".github/workflows/stage12-n1c-bootstrap.yml"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage12-n1-primitive-joint
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate report and memo
        run: |
          python -m py_compile scripts/audit_shared_p_global_mobius_stage12_n1c.py
          python -m py_compile scripts/update_shared_p_global_mobius_stage12_n1c_memo.py
          python scripts/audit_shared_p_global_mobius_stage12_n1c.py \
            --write-report data/shared_p_global_mobius_stage12_n1c_report.json
          python scripts/update_shared_p_global_mobius_stage12_n1c_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --report data/shared_p_global_mobius_stage12_n1c_report.json \
            --output generated-face-ratio-geometry-research.md
          mv generated-face-ratio-geometry-research.md docs/face-ratio-geometry-research.md
          rm -f .github/workflows/stage12-n1c-bootstrap.yml
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document Stage12-N1c global Mobius inversion"
          git push origin HEAD:agent/stage12-n1-primitive-joint
