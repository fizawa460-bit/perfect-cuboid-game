name: Stage14-s7-35 extra xi gcd collapse 4/7

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-35/**'
      - 'stages/stage14/scripts/14-s7-35/**'
      - '.github/workflows/stage14-s7-35-extra-gcd-collapse-4-7.yml'
      - 'stages/stage14/14-s7-34/**'
      - 'stages/stage14/14-s7-33/**'
      - 'stages/stage14/14-4cu/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage14-s7-35 extra-gcd audit
        run: python stages/stage14/scripts/14-s7-35/extra_gcd_collapse_4_7_audit.py

      - name: Compile Stage14-s7-35 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-35/extra_gcd_collapse_4_7_audit.py

      - name: Run merged s7-34 regression
        run: python stages/stage14/scripts/14-s7-34/fourth_power_root_transfer_47_80_audit.py

      - name: Run merged s7-33 boundary regression
        run: python stages/stage14/scripts/14-s7-33/theorem_boundary_audit.py

      - name: Run merged 4cu regression
        run: python stages/stage14/scripts/14-4/orientation_linear_product_19_32_audit.py

      - name: Lock predecessor boundaries
        run: |
          grep -Fq 'STAGE14_S7_34=COMPLETE_XI_FOURTH_POWER_ROOT_GCD_TRANSFER_AND_47_80_PROMOTION' stages/stage14/14-s7-34/result.md
          grep -Fq 'XI_COMMON_ROOT_GCD_FOURTH_POWER_DIVIDES_QXI=true' stages/stage14/14-s7-34/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=47/80' stages/stage14/14-s7-34/result.md
          grep -Fq 'JOINT_CORE_DIVIDES_ENDPOINT_LINEAR_PRODUCT=true' stages/stage14/14-4cu/result.md

      - name: Lock Stage14-s7-35 theorem boundary
        run: |
          f=stages/stage14/14-s7-35/result.md
          grep -Fq 'STAGE14_S7_35=COMPLETE_EXTRA_XI_RESIDUAL_GCD_COLLAPSE_AND_4_7_PROMOTION' "$f"
          grep -Fq 'XI_RESIDUAL_GCD_COPRIME_TO_SWITCH_CELL=true' "$f"
          grep -Fq 'XI_RESIDUAL_GCD_EQUALS_RAW_HOST_ODD_GCD=true' "$f"
          grep -Fq 'XI_EXTRA_GCD_DIVIDES_ENDPOINT_OMEGA_PRODUCT=true' "$f"
          grep -Fq 'XI_EXTRA_GCD_FIXED_POWER_SUPPORT=false' "$f"
          grep -Fq 'NONPROPORTIONAL_FORCED_H_EXPONENT=(chi-1/4)/4' "$f"
          grep -Fq 'NONPROPORTIONAL_FORCED_SAVING=3*(chi-1/4)/4' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=4/7' "$f"
          grep -Fq 'IMPROVEMENT_OVER_PREVIOUS_47_80=9/560' "$f"
          grep -Fq 'FOUR_SEVENTHS_SATURATION_THETA=2/7' "$f"
          grep -Fq 'FOUR_SEVENTHS_SATURATION_PHI=1/4' "$f"
          grep -Fq 'FOUR_SEVENTHS_SINGLE_CROSS_ROOT_EXPONENT=1/56' "$f"
          grep -Fq 'FOUR_SEVENTHS_JOINT_CORE_EXPONENT=1/4' "$f"
          grep -Fq 'FOUR_SEVENTHS_LINEAR_PRODUCT_COFACTOR_EXPONENT=0' "$f"
          grep -Fq 'REMAINING_RECEIVER=FourSeventhsSingleCrossRootFullJointCoreLinearProductIncidence' "$f"
          grep -Fq 'S7_35_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-s7-36' "$f"
