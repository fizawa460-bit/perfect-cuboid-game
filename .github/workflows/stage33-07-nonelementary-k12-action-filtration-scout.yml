name: Stage33-07 non-elementary k1 k2 action filtration scout

on:
  pull_request:
    branches: [main]
    paths:
      - 'stages/stage33/33-07/scout_nonelementary_k12_action_filtration.py'
      - 'stages/stage33/33-07/scout_nonelementary_k12_full_q_isometry.py'
      - 'stages/stage33/33-07/certify_nonelementary_k12_exact_q2_2q_profile_filter.py'
      - 'stages/stage33/33-07/certify_nonelementary_k1_q2_2q_cc_orbits.py'
      - 'stages/stage33/33-07/certify_nonelementary_k2_q2_2q_skeleton_orbits.py'
      - 'stages/stage33/33-07/coordinate-k3-scaled-action-choices-retained.json'
      - 'stages/stage33/33-07/picard-discriminant-compact.json'
      - '.github/workflows/stage33-07-nonelementary-k12-action-filtration-scout.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage33-07-k12-action-filtration-scout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact algebra and finite solver
        run: pip install 'sympy==1.14.0' 'z3-solver==4.15.3.0'

      - name: Recover locked Q2+2Q survivors
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          gh run download 32903229764 \
            --repo "${GITHUB_REPOSITORY}" \
            --name stage33-07-k12-exact-q2-2q-profile \
            --dir "$work"
          cp "$work/nonelementary-k12-exact-q2-2q-profile-filter.json" stages/stage33/33-07/
          cp "$work/nonelementary-k12-exact-q2-2q-profile-surviving-orbits.bin" stages/stage33/33-07/
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          h=Path('stages/stage33/33-07')
          p=h/'nonelementary-k12-exact-q2-2q-profile-filter.json'
          d=json.loads(p.read_text()); s=d.pop('canonical_sha256')
          assert s=='18d33892d04de286bfa8aa006fb8e4d133d7b51472e950c51bc74cc67a366300'
          assert hashlib.sha256(json.dumps(d,sort_keys=True,separators=(',',':')).encode()).hexdigest()==s
          b=(h/'nonelementary-k12-exact-q2-2q-profile-surviving-orbits.bin').read_bytes()
          assert len(b)==104028*7
          assert hashlib.sha256(b).hexdigest()=='4eebb36004d88917a233a7f449056e9d20082de94018d9ce4b48bbbbfe144c36'
          print({'q2_cert':s,'records':len(b)//7})
          PY

      - name: Rebuild cheap locked skeleton sources
        run: |
          cd stages/stage33/33-07
          python certify_nonelementary_target_q4_rank_obstruction.py
          python certify_nonelementary_target_q8_exponent_reduction.py
          python certify_nonelementary_k12_q2_support_reduction.py
          python certify_nonelementary_k12_2q_support_reduction.py
          python certify_nonelementary_k1_q2_2q_cc_orbits.py
          python certify_nonelementary_k2_q2_2q_skeleton_orbits.py

      - name: Run exact action filtration scout
        env:
          SAMPLE_PER_KIND: '8'
        run: python stages/stage33/33-07/scout_nonelementary_k12_action_filtration.py

      - name: Enforce scout-only firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('stages/stage33/33-07/nonelementary-k12-action-filtration-scout.json').read_text())
          assert d['sample_count']==16
          assert d['exact_sampled_action_filtration_certified'] is True
          assert d['full_action_exhaustive_certified'] is False
          for k in ('endpoint_finite_q_certified','endpoint_full_action_certified',
                    'actual_index512_glue_identified','arithmetic_HS_closed',
                    'stage33_08_released','stage33_09_released',
                    'theorem_credit','endpoint_credit','perfect_cuboid_nonexistence_claim'):
            assert d[k] is False
          assert d['stage33_progress']=='6/11'
          print({'target_cc':d['target_cc_fixed_dimensions'],
                 'target_ct':d['target_ct_fixed_dimensions'],
                 'target_joint':d['target_joint_v4_fixed_dimensions'],
                 'status_counts':d['status_counts'],
                 'sha256':d['canonical_sha256']})
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-k12-action-filtration-scout
          retention-days: 5
          if-no-files-found: error
          path: stages/stage33/33-07/nonelementary-k12-action-filtration-scout.json
