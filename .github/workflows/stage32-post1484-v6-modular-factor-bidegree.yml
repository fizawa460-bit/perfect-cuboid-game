name: Stage32 post1484 V6 modular-factor bidegree replay

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replay exact modular-factor bidegree boundary
        run: >-
          python stages/stage32/residual-32-01-production/certify_stage32_post1484_v6_modular_factor_bidegree_boundary.py
          --check stages/stage32/residual-32-01-production/post1484-v6-modular-factor-bidegree-boundary.json
