name: Stage32 post1484 V6 modular-factor bidegree replay

on:
  pull_request:
    paths:
      - '.github/workflows/stage32-post1484-v6-modular-factor-bidegree.yml'
      - 'stages/stage32/residual-32-01-production/certify_stage32_post1484_v6_modular_factor_bidegree_boundary.py'
      - 'stages/stage32/residual-32-01-production/post1484-v6-modular-factor-bidegree-boundary.json'
      - 'stages/stage32/residual-32-01-production/post1484-v6-modular-factor-bidegree-source-note.md'
      - 'stages/stage32/residual-32-01-production/post1484-v6-modular-factor-bidegree-hostile-audit-repair.json'
      - 'stages/stage32/residual-32-01-production/post1473-o188-cusp-ramification-budget.json'
      - 'stages/stage32/residual-32-01-production/post1473-x8-marked-exceptional-incidence.json'
      - 'stages/stage32/residual-32-01-production/post1473-x8-satake-boundary-marking.json'
      - 'stages/stage32/32-21/post1473-v6-witness-body-recovered.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replay exact modular-factor bidegree boundary
        run: >-
          python stages/stage32/residual-32-01-production/certify_stage32_post1484_v6_modular_factor_bidegree_boundary.py
          --check stages/stage32/residual-32-01-production/post1484-v6-modular-factor-bidegree-boundary.json
