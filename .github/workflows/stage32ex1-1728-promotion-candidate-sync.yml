name: Stage32EX1 1728 promotion candidate sync

on:
  push:
    paths:
      - '.github/workflows/stage32ex1-1728-promotion-candidate-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register provisional current-target promotion package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          CORE_KEYS=['claim_id','kind','statement','scope_key','scope','proves','does_not_prove','requires','bridges','source_locks','replay_verifier']
          def core_sha(c):
              return hashlib.sha256(json.dumps({k:c[k] for k in CORE_KEYS if k in c},sort_keys=True,separators=(',',':')).encode()).hexdigest()

          terminal_id='S32.EX1.ALL_V6_GENUS1_CARRIERS_EXCLUDED_CANDIDATE.V2'
          adapter_id='S32.ADAPTER.EX1_V6_CARRIER_TO_MAIN_V6_CARRIER.V1'
          main_id='S32.V6.NO_INTEGRAL_IRREDUCIBLE_GENUS1_MEMBER.V2'
          adapter_hash='a8db7803b60ed6c7d514235dbac383b128f849fc35a2dca748bb99cc532a413e'
          main_hash='5a89879108f0d739f57ab779bedfc9e8877c3c7b8de681b54ebd9adbd8df69bc'

          regp=Path('stages/stage32/proof/CLAIM-REGISTRY.json')
          reg=json.loads(regp.read_text())
          by={c['claim_id']:c for c in reg['claims']}
          terminal=by[terminal_id]
          assert terminal['authority_status']=='AUDITED'
          assert terminal['audit_receipt']=={'status':'PASS','pr':1728,'exact_head':'e3c4a04d5010e6dca9428722e334890e2614297a','review_id':5147627146}
          assert terminal['claim_core_sha256']=='84e7a4b6990d7c687eebe341fbea296fad1da2cae4785cb87580a0d84572437a'
          assert adapter_id not in by and main_id not in by

          adapter={
            'claim_id':adapter_id,
            'kind':'adapter_contract',
            'statement':'The hostile-audited Stage32EX1 terminal quantifies the same geometric carrier population as the current Stage32 MAIN V6 nonexistence target: integral irreducible geometric-genus-1 curves on the minimal desingularization S in Picard class V6 for row g1-d186. The retained h=4/Q-state machinery is an exhaustive internal parameterization of that carrier problem, not a narrower replacement population.',
            'scope_key':'S32.EX1_TO_MAIN.V6_CARRIER',
            'scope':{'row_id':'g1-d186','picard_class':'V6','surface':'minimal_desingularization_S_of_the_cuboid_surface','geometric_analysis_field':'C','integral':True,'irreducible':True,'geometric_genus':1,'role':'exact_current_target_population_identity'},
            'proves':['The EX1 scope key S32.EX1.V6_CARRIER may be transferred to the current MAIN scope key S32.MAIN.V6_CARRIER for the geometric V6 integral-irreducible genus-1 carrier predicate only.','The current MAIN V6 carrier target and the audited EX1 terminal use the same row/class/genus and shared source-locked V6 carrier data.'],
            'does_not_prove':['Stage32 MAIN V6 nonexistence is audited merely because this adapter exists.','Q602 or O210 exclusion.','Any absolute Q602 residue identification.','Stage32 closure.','Perfect Cuboid existence or nonexistence.'],
            'requires':['S32.MAIN.CURRENT_TARGET_CONTEXT.V1','S32.EX1.LANE_CONTRACT.V2',terminal_id],
            'bridges':{'from_scope_key':'S32.EX1.V6_CARRIER','to_scope_key':'S32.MAIN.V6_CARRIER','semantics':'exact current-target population identity for geometric V6 integral irreducible genus-1 carriers only'},
            'source_locks':[
              {'path':'stages/stage32-ex1/ex1-07-current-main-v6-carrier-promotion-adapter.json','blob_sha1':'2317bf844f8cab6841aa43db3b6678c350df9507','canonical_sha256':'e21bf24712be8931b6854e2640cf9ccc02c965a4235be84e60086565c4d76a42'},
              {'path':'stages/stage32-ex1/verify_ex1_07_current_main_v6_carrier_promotion_adapter.py','blob_sha1':'9b57e63c0ca1d2e422e43f5af4bd8c32a40ff4c6'},
              {'path':'stages/stage32/MAIN-STATE.json','blob_sha1':'05e2942b4c893044688f16926b5e9837e59d8e9d'},
              {'path':'stages/stage32-ex1/ex1-00-source-lock-and-target-adapter.json','blob_sha1':'ac76873a0e24874b4f5625d692a10e916886c92f','canonical_sha256':'783526a604572a4a81a314c59db1a399d38209ee159352106d7c5f6b5e71fa6c'},
              {'path':'stages/stage32-ex1/stage32-ex1.md','blob_sha1':'66072a1f3286819c999d2dedc9659914b3448518'}],
            'replay_verifier':'stages/stage32-ex1/verify_ex1_07_current_main_v6_carrier_promotion_adapter.py',
            'claim_core_sha256':adapter_hash,
            'authority_status':'PROVISIONAL',
            'audit_receipt':None
          }
          assert core_sha(adapter)==adapter_hash

          mainc={
            'claim_id':main_id,
            'kind':'mathematical_claim',
            'statement':'For the exact current Stage32 MAIN V6 carrier population, the complete V6 linear system contains no integral irreducible member of geometric genus 1; this promotion candidate is obtained from the hostile-audited Stage32EX1 terminal through the explicit current-target population-identity adapter.',
            'scope_key':'S32.MAIN.V6_CARRIER',
            'scope':{'row_id':'g1-d186','picard_class':'V6','target':'population_wide_nonexistence','integral':True,'irreducible':True,'geometric_genus':1},
            'proves':['All integral irreducible geometric-genus-1 V6 members are excluded for the exact current Stage32 MAIN carrier target once this promoted claim itself receives hostile-audit PASS.'],
            'does_not_prove':['Q602 or O210 exclusion.','An absolute Q602 residue.','FULL178 numerical census completion.','Stage32 closure.','Perfect Cuboid existence or nonexistence.'],
            'requires':['S32.MAIN.CURRENT_TARGET_CONTEXT.V1',terminal_id,adapter_id],
            'source_locks':[
              {'path':'stages/stage32-ex1/ex1-07-current-main-v6-carrier-promotion-adapter.json','blob_sha1':'2317bf844f8cab6841aa43db3b6678c350df9507','canonical_sha256':'e21bf24712be8931b6854e2640cf9ccc02c965a4235be84e60086565c4d76a42'},
              {'path':'stages/stage32-ex1/verify_ex1_07_current_main_v6_carrier_promotion_adapter.py','blob_sha1':'9b57e63c0ca1d2e422e43f5af4bd8c32a40ff4c6'},
              {'path':'stages/stage32/MAIN-STATE.json','blob_sha1':'05e2942b4c893044688f16926b5e9837e59d8e9d'}],
            'replay_verifier':'stages/stage32-ex1/verify_ex1_07_current_main_v6_carrier_promotion_adapter.py',
            'claim_core_sha256':main_hash,
            'authority_status':'PROVISIONAL',
            'audit_receipt':None
          }
          assert core_sha(mainc)==main_hash
          reg['claims'].extend([adapter,mainc])
          regp.write_text(json.dumps(reg,sort_keys=True,separators=(',',':'))+'\n')

          lanep=Path('stages/stage32/proof/LANE-ADAPTERS.json')
          lanes=json.loads(lanep.read_text())
          ex1=next(x for x in lanes['lanes'] if x['lane']=='EX1')
          for cid in (adapter_id,main_id):
              if cid not in ex1['claim_refs']:
                  ex1['claim_refs'].append(cid)
          ex1['notes']=(
            'S32.EX1.ALL_V6_GENUS1_CARRIERS_EXCLUDED_CANDIDATE.V2 is AUDITED by PR #1728 exact head e3c4a04d5010e6dca9428722e334890e2614297a, review 5147627146. '
            'EX1 terminal credit is FULL_TARGET_CLOSURE / ALL_V6_GENUS1_CARRIERS_EXCLUDED at exact EX1 scope. '
            'EX1-07 now carries PROVISIONAL explicit current-target adapter S32.ADAPTER.EX1_V6_CARRIER_TO_MAIN_V6_CARRIER.V1 and PROVISIONAL MAIN-scope candidate S32.V6.NO_INTEGRAL_IRREDUCIBLE_GENUS1_MEMBER.V2. '
            'The adapter binds only the geometric V6 integral-irreducible genus-1 carrier population from S32.EX1.V6_CARRIER to S32.MAIN.V6_CARRIER. '
            'Neither provisional claim grants MAIN credit until hostile-audit PASS and authority synchronization; active_frontier_refs therefore remain on the existing declared goals. '
            'No Q602/O210, Stage32 closure, or Perfect Cuboid credit is transferred.'
          )
          lanep.write_text(json.dumps(lanes,sort_keys=True,separators=(',',':'))+'\n')

          pp=Path('stages/stage32/STAGE32-PROOF-PATH.md')
          s=pp.read_text()
          marker='\n## 5. FULL178 and closure\n'
          assert marker in s and '### 4.3 EX1 current-target promotion adapter checkpoint' not in s
          insert='''\n### 4.3 EX1 current-target promotion adapter checkpoint\n\nThe EX1 terminal claim `S32.EX1.ALL_V6_GENUS1_CARRIERS_EXCLUDED_CANDIDATE.V2` has hostile-audit PASS at exact head `e3c4a04d5010e6dca9428722e334890e2614297a` (review `5147627146`) and is synchronized as **AUDITED**. The next boundary is not an automatic MAIN promotion: the generic `S32.ADAPTER.EX_TO_MAIN_PROMOTION_BOUNDARY.V2` explicitly cannot establish a concrete cross-scope equivalence.\n\n`S32.ADAPTER.EX1_V6_CARRIER_TO_MAIN_V6_CARRIER.V1` is therefore registered as a new **PROVISIONAL** concrete adapter from `S32.EX1.V6_CARRIER` to `S32.MAIN.V6_CARRIER`. Its replayable artifact `stages/stage32-ex1/ex1-07-current-main-v6-carrier-promotion-adapter.json` checks the exact current MAIN routing state, the EX1-00 target contract, shared V6 source locks, the audited terminal receipt, and the existing MAIN population-wide nonexistence goal. The bridge is limited to the geometric predicate “integral irreducible V6 member of geometric genus 1 on the minimal desingularization S”; it transfers no Q602/O210 or Stage32-closure semantics.\n\nA corresponding MAIN-scope mathematical candidate `S32.V6.NO_INTEGRAL_IRREDUCIBLE_GENUS1_MEMBER.V2` is also **PROVISIONAL**. It depends explicitly on the audited EX1 terminal plus this concrete adapter. The existing active-frontier goal `S32.V6.NO_INTEGRAL_IRREDUCIBLE_GENUS1_MEMBER.V1` remains the current declared goal until hostile audit accepts the promotion package and a later `AUTHORITY_OR_AUDIT_TRANSITION` / `ACTIVE_FRONTIER_REMAP` synchronization is performed. No MAIN mathematical credit is granted at this checkpoint.\n'''
          s=s.replace(marker,insert+marker,1)
          pp.write_text(s)

          projp=Path('stages/stage32-ex1/RETAINED-AUDIT-PROJECTION.json')
          proj=json.loads(projp.read_text())
          proj['candidate']['candidate_status']='AUDITED_EX1_TERMINAL_WITH_PROVISIONAL_CURRENT_MAIN_PROMOTION_PACKAGE_READY_FOR_AUDIT'
          proj['candidate']['audit_route']='EX1-07_HOSTILE_AUDIT_OF_CURRENT_MAIN_PROMOTION_ADAPTER'
          proj['promotion_candidate']={
            'adapter_claim_id':adapter_id,
            'main_claim_id':main_id,
            'authority_status':'PROVISIONAL',
            'audit_receipt':None,
            'stage32_main_credit':False,
            'active_frontier_remap_completed':False
          }
          ws=proj['audit_routing_overlay']['working_set']
          for path in [
            'stages/stage32-ex1/ex1-07-current-main-v6-carrier-promotion-adapter.json',
            'stages/stage32-ex1/verify_ex1_07_current_main_v6_carrier_promotion_adapter.py',
            'stages/stage32/MAIN-STATE.json',
            'stages/stage32/proof/ACTIVE-FRONTIER.json',
            'stages/stage32/proof/CLAIM-SYNC-CONTRACT.md']:
              if path not in ws: ws.append(path)
          proj['audit_routing_overlay']['current_leaf']='EX1-07_CURRENT_MAIN_PROMOTION_ADAPTER_AUDIT_HANDOFF'
          projp.write_text(json.dumps(proj,indent=2)+'\n')
          PY
          python3 stages/stage32-ex1/verify_ex1_07_current_main_v6_carrier_promotion_adapter.py
          python3 stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python3 stages/stage32/proof/verify_stage32_active_frontier.py
          python3 stages/stage32-ex1/verify_ex1_05af_retained_terminal_consolidation_v2.py
      - name: Commit promotion package registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fizawa460-bit'
          git config user.email 'fizawa460@gmail.com'
          git add stages/stage32/proof/CLAIM-REGISTRY.json stages/stage32/proof/LANE-ADAPTERS.json stages/stage32/STAGE32-PROOF-PATH.md stages/stage32-ex1/RETAINED-AUDIT-PROJECTION.json
          git commit -m '[Stage32EX1][promotion] register provisional current-target adapter package'
          git push origin HEAD:stage32ex1-terminal-05af-retained-consolidation
