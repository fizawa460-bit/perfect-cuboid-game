name: Stage13-11 self-contained review bundle

on:
  push:
    branches:
      - agent/stage13-11-review-bundle
    paths:
      - 'stages/stage13/**'
      - '!stages/stage13/data/13-11/**'
      - '.github/workflows/stage13-11-self-contained-review.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'stages/stage13/**'
      - '.github/workflows/stage13-11-self-contained-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Build physical Stage13-only review page
        run: python stages/stage13/scripts/13-11/build_self_contained_review.py

      - name: Verify physical bundle markers and Stage13-only scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          html_path = Path('review/STAGE13-FINAL-SELF-CONTAINED-20260808-R01.html')
          manifest_path = Path('stages/stage13/data/13-11/review_bundle_manifest.json')
          builder_path = Path('stages/stage13/scripts/13-11/build_self_contained_review.py')
          html = html_path.read_text(encoding='utf-8')
          manifest = json.loads(manifest_path.read_text())
          bundle = 'STAGE13-FINAL-SELF-CONTAINED-20260808-R01'

          assert f'BUNDLE_ID={bundle}' in html
          assert f'END_OF_BUNDLE={bundle}' in html
          assert 'CHECKPOINT=START_OF_MAIN' in html
          assert 'CHECKPOINT=BEFORE_EMBEDDED_SOURCES' in html
          assert 'CHECKPOINT=AFTER_EMBEDDED_SOURCES' in html
          assert 'CHECKPOINT=END_OF_MAIN' in html
          assert 'REVIEW_SCOPE=STAGE13_ONLY' in html
          assert 'STAGE12_SOURCE_EMBEDDED=false' in html
          assert manifest['status']['physical_single_html'] is True
          assert manifest['status']['external_runtime_dependencies'] is False
          assert manifest['status']['stage13_only_bundle'] is True
          assert manifest['review_protocol']['stage12_source_embedded'] is False
          assert manifest['review_protocol']['stage12_review_in_scope'] is False
          assert manifest['source_count'] >= 10
          assert manifest['html_bytes'] > 100000
          assert all(row['path'].startswith('stages/stage13/') for row in manifest['sources'])
          assert not any(row['path'].startswith('stages/stage12/') for row in manifest['sources'])
          assert 'Path("stages/stage12/' not in builder_path.read_text(encoding='utf-8')
          print('Stage13-11 Stage13-only bundle verification: PASS')
          PY

      - name: Commit generated bundle when changed
        if: github.event_name == 'push'
        run: |
          changed="$(git status --porcelain -- review/STAGE13-FINAL-SELF-CONTAINED-20260808-R01.html stages/stage13/data/13-11/review_bundle_manifest.json)"
          if [ -z "$changed" ]; then
            echo 'Generated bundle already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review/STAGE13-FINAL-SELF-CONTAINED-20260808-R01.html stages/stage13/data/13-11/review_bundle_manifest.json
          git commit -m 'Stage13-11 generate Stage13-only review bundle'
          git push origin HEAD:${{ github.ref_name }}
