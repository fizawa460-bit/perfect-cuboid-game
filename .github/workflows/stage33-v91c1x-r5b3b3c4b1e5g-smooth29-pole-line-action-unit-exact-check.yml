name: Stage33 V91C1X C4B1E5G smooth29 exact check

on:
  push:
    branches:
      - stage33-v91c1x-r5b3b3c4b1e-1757-refinement-unit-preflight
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b1e5g-smooth29-pole-line-action-unit-exact-check.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e5g_smooth29_pole_line_action_unit_attachment.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e5g-smooth29-pole-line-action-unit-attachment.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e5f-whole-cover-action-transport-debt-partition.json'
      - 'stages/stage33/MAIN-STATE.json'
      - 'stages/stage33/sync_main_state.py'
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  exact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Rebuild E5F debt partition read-only
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e5f_whole_cover_action_transport_debt_partition.py
      - name: Rebuild E5G smooth29 attachment read-only
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e5g_smooth29_pole_line_action_unit_attachment.py
      - name: Verify Stage33 mutable authority remains synchronized
        run: python stages/stage33/sync_main_state.py --check
      - name: Verify clean exact head
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
