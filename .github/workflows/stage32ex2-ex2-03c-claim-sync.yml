name: Stage32EX2 EX2-03C claim sync

on:
  push:
    branches:
      - stage32ex2-ex2-00-source-lock-continuation
    paths:
      - 'stages/stage32-ex2/runkeys/ex2-03c-claim-sync.json'

permissions:
  contents: write

concurrency:
  group: stage32ex2-ex2-03c-claim-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Authorize fresh run-key generation
        shell: bash
        run: |
          set -euo pipefail
          KEY='stages/stage32-ex2/runkeys/ex2-03c-claim-sync.json'
          BEFORE='${{ github.event.before }}'
          HEAD='${{ github.sha }}'
          test -n "$BEFORE"
          git cat-file -e "$BEFORE^{commit}"
          git diff --name-only "$BEFORE" "$HEAD" | grep -Fxq "$KEY"
          BEFORE="$BEFORE" KEY="$KEY" python - <<'PY'
          import json, os, subprocess
          key = os.environ['KEY']
          before = os.environ['BEFORE']
          new = json.load(open(key))
          try:
              old = json.loads(subprocess.check_output(['git','show',f'{before}:{key}'], text=True))
              old_generation = int(old.get('generation', -1))
          except subprocess.CalledProcessError:
              old_generation = -1
          assert new['schema'] == 'STAGE32EX2_EX2_03C_CLAIM_SYNC_RUNKEY_V1'
          assert new['armed'] is True
          assert int(new['generation']) > old_generation
          assert new['source_locks']['helper_path'] == 'stages/stage32-ex2/apply_ex2_03c_claim_sync.py'
          actual = subprocess.check_output(['git','hash-object',new['source_locks']['helper_path']], text=True).strip()
          assert actual == new['source_locks']['helper_blob_sha1']
          assert new['expected_current_main'] == 'f2a89e613cdf91191a0aada9e90c9fc93373a6c6'
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact replay dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Apply deterministic EX2-03C claim sync
        run: python stages/stage32-ex2/apply_ex2_03c_claim_sync.py
      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
          git diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          stages/stage32-ex2/MAIN-STATE.json
          stages/stage32-ex2/verify_main_state.py
          stages/stage32/proof/CLAIM-REGISTRY.json
          stages/stage32/proof/LANE-ADAPTERS.json
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Commit and push synchronized state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stage32ex2-claim-sync-bot'
          git config user.email 'stage32ex2-claim-sync-bot@users.noreply.github.com'
          git add stages/stage32-ex2/MAIN-STATE.json \
                  stages/stage32-ex2/verify_main_state.py \
                  stages/stage32/proof/CLAIM-REGISTRY.json \
                  stages/stage32/proof/LANE-ADAPTERS.json
          git commit -m '[Stage32EX2][claim-sync] register EX2-03C zero-curve nonfixedness'
          git push origin HEAD:stage32ex2-ex2-00-source-lock-continuation
