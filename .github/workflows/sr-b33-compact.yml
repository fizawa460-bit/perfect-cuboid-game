name: StructureRadar batch33 compact classifier
on:
  push:
    branches: [structure-radar-history-batch-33]
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact table
        shell: bash
        run: |
          python - <<'PY'
          import csv,pathlib,re
          rows=list(csv.DictReader(pathlib.Path('.tmp/sr-b33-summary.tsv').open(),delimiter='\t'))
          out=['sid\tpath\tstatus_words\ttop_ids\tneighbors']
          for r in rows:
              txt=r['preview'].lower(); keys=[]
              for k in ['final','closed','complete','proved','unconditional','conditional','pending','candidate','fail','failed','repair','repaired','superseded','historical','not directly applicable','no asymptotic','finite','audit','manifest','review','mathematics_changed=false','theorem_changed=false','bookkeeping','roadmap','frozen','no new theorem','no theorem']:
                  if k in txt: keys.append(k.replace(' ','_'))
              ids=re.findall(r'SR-STR-\d+',r['top_cards'])[:4]
              ns=re.findall(r'SR-STR-\d+',r['basename_neighbors']); nu=[]
              for x in ns:
                  if x not in nu: nu.append(x)
              out.append('\t'.join([r['sid'],r['path'],','.join(keys),','.join(ids),','.join(nu[:8])]))
          pathlib.Path('.tmp/sr-b33-compact.tsv').write_text('\n'.join(out)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp/sr-b33-compact.tsv
          git commit -m 'Temp: compact batch33 classification' || true
          git push origin HEAD:structure-radar-history-batch-33
