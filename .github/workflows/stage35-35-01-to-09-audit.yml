name: Stage35 and Stage35-EX aggregate audit

# Stage35-EX is an experimental sibling lane; preserve parked Stage35 authority and exact audited replay boundaries.
on:
  pull_request:
    paths:
      - 'stages/stage35/**'
      - 'stages/stage35-ex/**'
      - '.github/workflows/stage35-35-01-to-09-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage35-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 380
      - name: Assert exact PR head checkout
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "ACTUAL_HEAD_SHA=${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Verify Stage35 promoted 35-01 through 35-09 authority
        run: python -B stages/stage35/verify_stage35_35_01_to_09.py
      - name: Verify Stage35 35-10 material routing firewalls
        run: python -B stages/stage35/35-10/verify_35_10.py

  replay-stage35-ex-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 380
      - name: Assert exact PR head checkout
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "ACTUAL_HEAD_SHA=${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Replay deterministic V74 history shard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shard_targets < <(python - "$SHARD" <<'PY'
          import string, sys
          shard = int(sys.argv[1])
          assert 0 <= shard < 6
          targets = ["base"] + [str(i) for i in range(10, 33)]
          targets += ["32p", "33g1", "33g2", "33", "34", "35"]
          targets += ["35g4" + c for c in string.ascii_lowercase]
          targets += ["35g4a" + c for c in string.ascii_lowercase[:9]]
          targets += ["35g4aj", "35g4ak"]
          assert len(targets) == 67
          assert len(set(targets)) == 67
          selected = [t for i, t in enumerate(targets) if i % 6 == shard]
          assert len(selected) in (11, 12)
          print("\n".join(selected))
          PY
          )
          echo "SHARD=${SHARD} TARGET_COUNT=${#shard_targets[@]} TARGETS=${shard_targets[*]}"
          for target in "${shard_targets[@]}"; do
            python -B stages/stage35-ex/verify_stage35_ex_v74_legacy_replay.py "$target"
          done

  verify-stage35-ex-current:
    needs: [verify-stage35-core, replay-stage35-ex-history]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head checkout
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "ACTUAL_HEAD_SHA=${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Verify audited Goal4AK authority synchronization and local-evaluation release
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4ak_audited_claim_sync.py
      - name: Verify Goal4AL class-B evaluation on the positive real receiver component
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4al_real_component.py
      - name: Verify Goal4AM enlarged finite-local population BM-nonempty route blocker
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4am_enlarged_population_blocker.py
      - name: Verify Goal4AN known-two-class U_PC restricted adelic blocker
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4an_known_two_class_upc.py
      - name: Verify Goal4AO source-marked known-two-class local-population blocker
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4ao_source_marked_two_class.py
      - name: Verify Goal4AP infinite algebraic Brauer unit-character layer
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4ap_algebraic_brauer_unit_layer.py
      - name: Verify Goal4AQ full unit-character endpoint equivalence
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4aq_unit_character_endpoint_equivalence.py
      - name: Verify Goal4AR full Brauer endpoint equivalence
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4ar_full_brauer_endpoint_equivalence.py
      - name: Verify Goal4AS fresh exhaustive-view audit and marked Kummer slice
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4as_fresh_exhaustive_view_marked_kummer.py
      - name: Verify Goal4AT marked residual Kummer local support
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4at_marked_residual_kummer_local_support.py
      - name: Verify Goal4AU three-direction marked Kummer gcd allocation
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4au_three_direction_marked_kummer.py
      - name: Verify Goal4AV common coefficient torsor / endpoint common-cover boundary
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4av_common_cover.py
      - name: Verify Goal4AW marked elliptic height lower bound versus Goal4M upper window
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4aw_height_lower_vs_upper.py
      - name: Verify Goal4AX cross-face six-norm torus compatibility
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4ax_cross_face_norm_torsor.py
      - name: Verify Goal4AY derived-cuboid involution nonlinear descent boundary
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4ay_derived_cuboid_involution.py
      - name: Verify Goal4AZ super-sqrt distinct-class amplification boundary
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4az_super_sqrt_amplification.py
      - name: Verify Goal4BA finite visible Brauer truncation nonobstruction
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4ba_finite_visible_brauer_truncation.py
      - name: Verify Goal4BB arbitrary finite Brauer subgroup nonobstruction
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4bb_arbitrary_finite_brauer_subgroup.py
      - name: Verify Goal4BC post-Goal4AS ledger exhaustion fresh-view audit
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4bc_post_ledger_fresh_view_audit.py
      - name: Verify Goal4BD simultaneous three-marked rank-jump endpoint equivalence
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4bd_three_marked_endpoint_equivalence.py
      - name: Verify Goal4BE gcd-reservoir quadratic reciprocity cycle
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4be_gcd_reservoir_quadratic_reciprocity.py
      - name: Verify Goal4BF source-oriented Gaussian quartic lift
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4bf_oriented_gaussian_quartic_lift.py
      - name: Verify Goal4BG Gaussian face/space square-root phase compatibility
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4bg_gaussian_face_space_phase.py
      - name: Verify Goal4BH reservoir leading-unit face/space orientation torsor
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4bh_face_space_orientation_torsor.py
      - name: Verify Goal4BI rational Hilbert split-orientation boundary
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4bi_secondary_orientation_hilbert_product.py
      - name: Verify Goal4BJ support-cleaned global Gaussian quartic orientation carrier
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4bj_global_gaussian_orientation_carrier.py
