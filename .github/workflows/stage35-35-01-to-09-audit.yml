name: Stage35 and Stage35-EX aggregate audit

# Stage35-EX is an experimental sibling lane; preserve parked Stage35 authority and exact provisional replay boundaries.
on:
  pull_request:
    paths:
      - 'stages/stage35/**'
      - 'stages/stage35-ex/**'
      - '.github/workflows/stage35-35-01-to-09-audit.yml'
  workflow_dispatch:

jobs:
  verify-stage35-and-ex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # V71 -> persisted V70/V69/... -> retained audited history.
          fetch-depth: 360
      - name: Assert exact PR head checkout
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "ACTUAL_HEAD_SHA=${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Verify Stage35 promoted 35-01 through 35-09 authority
        run: python -B stages/stage35/verify_stage35_35_01_to_09.py
      - name: Verify Stage35 35-10 material routing firewalls
        run: python -B stages/stage35/35-10/verify_35_10.py
      - name: Replay Stage35-EX persisted history through Goal4AG against V71
        run: |
          set -euo pipefail
          targets="base $(seq 10 32) 32p 33g1 33g2 33 34 35 35g4a 35g4b 35g4c 35g4d 35g4e 35g4f 35g4g 35g4h 35g4i 35g4j 35g4k 35g4l 35g4m 35g4n 35g4o 35g4p 35g4q 35g4r 35g4s 35g4t 35g4u 35g4v 35g4w 35g4x 35g4y 35g4z 35g4aa 35g4ab 35g4ac 35g4ad 35g4ae 35g4af 35g4ag"
          for target in $targets; do
            python -B stages/stage35-ex/verify_stage35_ex_v71_legacy_replay.py "$target"
          done
      - name: Verify provisional Goal4AH degree31 Riemann-Roch effectivity
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4ah.py
