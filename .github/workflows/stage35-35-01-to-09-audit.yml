name: Stage35 and Stage35-EX aggregate audit

# Stage35-EX is an experimental sibling lane; this workflow must preserve the parked Stage35 authority while checking EX-only audited/provisional reductions.
on:
  pull_request:
    paths:
      - 'stages/stage35/**'
      - 'stages/stage35-ex/**'
      - '.github/workflows/stage35-35-01-to-09-audit.yml'
  workflow_dispatch:

jobs:
  verify-stage35-and-ex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # V46 stacks Goal4I on immutable in-PR V45 snapshot ec4d0789...;
          # nested V45/V44/V43 reaches hostile-audited Goal4E and all earlier retained snapshots.
          fetch-depth: 256
      - name: Assert exact PR head checkout
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "ACTUAL_HEAD_SHA=${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Verify Stage35 promoted 35-01 through 35-09 authority
        run: python -B stages/stage35/verify_stage35_35_01_to_09.py
      - name: Verify Stage35 35-10 material routing firewalls
        run: python -B stages/stage35/35-10/verify_35_10.py
      - name: Replay Stage35-EX base and 35EX-10 through 32 against immutable V46/V45 history
        run: |
          set -euo pipefail
          python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py base
          for n in $(seq 10 32); do
            python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py "$n"
          done
      - name: Replay Stage35-EX 35EX-32 merged-route promotion
        run: python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py 32p
      - name: Replay Stage35-EX 35EX-33 goal 1
        run: python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py 33g1
      - name: Replay Stage35-EX 35EX-33 goal 2
        run: python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py 33g2
      - name: Replay Stage35-EX 35EX-33 Gaussian blocker
        run: python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py 33
      - name: Replay Stage35-EX 35EX-34 fresh breadth audit
        run: python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py 34
      - name: Replay hostile-audited Stage35-EX 35EX-35 goals 1-3 authority
        run: python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py 35
      - name: Replay hostile-audited Stage35-EX 35EX-35 Goal4A authority
        run: python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py 35g4a
      - name: Replay hostile-audited Stage35-EX 35EX-35 Goal4B authority
        run: python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py 35g4b
      - name: Replay hostile-audited Stage35-EX 35EX-35 Goal4C authority
        run: python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py 35g4c
      - name: Replay hostile-audited Stage35-EX 35EX-35 Goal4D authority
        run: python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py 35g4d
      - name: Replay hostile-audited Stage35-EX 35EX-35 Goal4E authority
        run: python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py 35g4e
      - name: Replay in-PR provisional Stage35-EX 35EX-35 Goal4F snapshot
        run: python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py 35g4f
      - name: Replay in-PR provisional Stage35-EX 35EX-35 Goal4G snapshot
        run: python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py 35g4g
      - name: Replay in-PR provisional Stage35-EX 35EX-35 Goal4H snapshot
        run: python -B stages/stage35-ex/verify_stage35_ex_v46_legacy_replay.py 35g4h
      - name: Verify stacked Stage35-EX 35EX-35 Goal4I v2 descent self-map preflight
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4i.py
