name: Stage35 and Stage35-EX aggregate audit

# Stage35-EX is an experimental sibling lane; this workflow must preserve the parked Stage35 authority while checking EX-only provisional reductions.
on:
  pull_request:
    paths:
      - 'stages/stage35/**'
      - 'stages/stage35-ex/**'
      - '.github/workflows/stage35-35-01-to-09-audit.yml'
  workflow_dispatch:

jobs:
  verify-stage35-and-ex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # V34 replay reads immutable V33 state at #1600 merge c8a87683...;
          # nested V33/V32/V31/V30 replay reaches earlier retained snapshots.
          fetch-depth: 128
      - name: Assert exact PR head checkout
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "ACTUAL_HEAD_SHA=${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Verify Stage35 promoted 35-01 through 35-09 authority
        run: python -B stages/stage35/verify_stage35_35_01_to_09.py
      - name: Verify Stage35 35-10 material routing firewalls
        run: python -B stages/stage35/35-10/verify_35_10.py
      - name: Replay Stage35-EX base and 35EX-10 through 32 against immutable V33 snapshot
        run: |
          set -euo pipefail
          python -B stages/stage35-ex/verify_stage35_ex_v34_legacy_replay.py base
          for n in $(seq 10 32); do
            python -B stages/stage35-ex/verify_stage35_ex_v34_legacy_replay.py "$n"
          done
      - name: Replay Stage35-EX 35EX-32 merged-route promotion against immutable V33 snapshot
        run: python -B stages/stage35-ex/verify_stage35_ex_v34_legacy_replay.py 32p
      - name: Replay Stage35-EX 35EX-33 goal 1 against immutable V33 snapshot
        run: python -B stages/stage35-ex/verify_stage35_ex_v34_legacy_replay.py 33g1
      - name: Replay Stage35-EX 35EX-33 goal 2 against immutable V33 snapshot
        run: python -B stages/stage35-ex/verify_stage35_ex_v34_legacy_replay.py 33g2
      - name: Replay Stage35-EX 35EX-33 Gaussian blocker against immutable V33 snapshot
        run: python -B stages/stage35-ex/verify_stage35_ex_v34_legacy_replay.py 33
      - name: Replay Stage35-EX 35EX-34 fresh breadth audit against immutable V33 snapshot
        run: python -B stages/stage35-ex/verify_stage35_ex_v34_legacy_replay.py 34
      - name: Verify Stage35-EX 35EX-35 private edge-gcd six-variable goals 1-3
        run: python -B stages/stage35-ex/verify_stage35_ex_35.py
