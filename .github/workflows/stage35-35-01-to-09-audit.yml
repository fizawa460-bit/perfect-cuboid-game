name: Stage35 and Stage35-EX aggregate audit

# Stage35-EX is an experimental sibling lane; preserve parked Stage35 authority and exact provisional replay boundaries.
on:
  pull_request:
    paths:
      - 'stages/stage35/**'
      - 'stages/stage35-ex/**'
      - '.github/workflows/stage35-35-01-to-09-audit.yml'
  workflow_dispatch:

jobs:
  verify-stage35-and-ex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # V54 -> persisted V53/V52/V51/V50/V49 -> retained audited history.
          fetch-depth: 320
      - name: Assert exact PR head checkout
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "ACTUAL_HEAD_SHA=${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Verify Stage35 promoted 35-01 through 35-09 authority
        run: python -B stages/stage35/verify_stage35_35_01_to_09.py
      - name: Verify Stage35 35-10 material routing firewalls
        run: python -B stages/stage35/35-10/verify_35_10.py
      - name: Replay Stage35-EX base and 35EX-10 through 32 against V54 history
        run: |
          set -euo pipefail
          python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py base
          for n in $(seq 10 32); do
            python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py "$n"
          done
      - name: Replay Stage35-EX 35EX-32 merged-route promotion
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 32p
      - name: Replay Stage35-EX 35EX-33 goal 1
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 33g1
      - name: Replay Stage35-EX 35EX-33 goal 2
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 33g2
      - name: Replay Stage35-EX 35EX-33 Gaussian blocker
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 33
      - name: Replay Stage35-EX 35EX-34 fresh breadth audit
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 34
      - name: Replay hostile-audited Stage35-EX 35EX-35 goals 1-3 authority
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35
      - name: Replay hostile-audited Goal4A
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4a
      - name: Replay hostile-audited Goal4B
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4b
      - name: Replay hostile-audited Goal4C
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4c
      - name: Replay hostile-audited Goal4D
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4d
      - name: Replay hostile-audited Goal4E
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4e
      - name: Replay provisional Goal4F
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4f
      - name: Replay provisional Goal4G
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4g
      - name: Replay provisional Goal4H
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4h
      - name: Replay provisional Goal4I
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4i
      - name: Replay provisional Goal4J
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4j
      - name: Replay provisional Goal4K
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4k
      - name: Replay provisional Goal4L
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4l
      - name: Replay provisional Goal4M
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4m
      - name: Replay provisional Goal4N
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4n
      - name: Replay provisional Goal4O
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4o
      - name: Replay provisional Goal4P
        run: python -B stages/stage35-ex/verify_stage35_ex_v54_legacy_replay.py 35g4p
      - name: Verify stacked Stage35-EX Goal4Q 48-node compactification geometry
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4q.py
