name: Stage35 and Stage35-EX aggregate audit

# Stage35-EX is an experimental sibling lane; preserve parked Stage35 authority and exact provisional replay boundaries.
on:
  pull_request:
    paths:
      - 'stages/stage35/**'
      - 'stages/stage35-ex/**'
      - '.github/workflows/stage35-35-01-to-09-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage35-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 380
      - name: Assert exact PR head checkout
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "ACTUAL_HEAD_SHA=${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Verify Stage35 promoted 35-01 through 35-09 authority
        run: python -B stages/stage35/verify_stage35_35_01_to_09.py
      - name: Verify Stage35 35-10 material routing firewalls
        run: python -B stages/stage35/35-10/verify_35_10.py

  replay-stage35-ex-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Snapshot-aware V73 -> V72/V71/... replay. Historical adapters may inspect retained git history.
          fetch-depth: 380
      - name: Assert exact PR head checkout
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "ACTUAL_HEAD_SHA=${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Replay deterministic V73 history shard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shard_targets < <(python - "$SHARD" <<'PY'
          import string, sys
          shard = int(sys.argv[1])
          assert 0 <= shard < 6
          targets = ["base"] + [str(i) for i in range(10, 33)]
          targets += ["32p", "33g1", "33g2", "33", "34", "35"]
          targets += ["35g4" + c for c in string.ascii_lowercase]
          targets += ["35g4a" + c for c in string.ascii_lowercase[:9]]
          assert len(targets) == 65
          assert len(set(targets)) == 65
          selected = [t for i, t in enumerate(targets) if i % 6 == shard]
          assert len(selected) in (10, 11)
          print("\n".join(selected))
          PY
          )
          echo "SHARD=${SHARD} TARGET_COUNT=${#shard_targets[@]} TARGETS=${shard_targets[*]}"
          for target in "${shard_targets[@]}"; do
            python -B stages/stage35-ex/verify_stage35_ex_v73_legacy_replay.py "$target"
          done

  verify-stage35-ex-current:
    needs: [verify-stage35-core, replay-stage35-ex-history]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head checkout
        run: |
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "ACTUAL_HEAD_SHA=${ACTUAL_HEAD_SHA}"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight symbolic dependency
        run: python -m pip install --disable-pip-version-check sympy==1.14.0
      - name: Verify audited Goal4AJ claim synchronization
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4aj_audited_claim_sync.py
      - name: Verify provisional exact Goal4AK explicit F_B assembly
        run: python -B stages/stage35-ex/verify_stage35_ex_35_goal4ak_explicit_fb.py
