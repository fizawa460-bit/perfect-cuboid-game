name: Stage32-18AM d16 b16 one-wall breakthrough scout

on:
  push:
    branches: [stage32-18am-b16-one-wall-breakthrough-scout]
    paths: ['stages/stage32/runkeys/18am-b16-breakthrough-scout.json']

permissions: {contents: read, actions: read}
concurrency: {group: stage32-18am-b16-one-wall-breakthrough-scout, cancel-in-progress: true}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs: {matrix: '${{ steps.k.outputs.matrix }}'}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Require dedicated ARM commit
        run: |
          set -euo pipefail
          KEY=stages/stage32/runkeys/18am-b16-breakthrough-scout.json
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1 && test "${changed[0]}" = "$KEY"
          test "$(git log -1 --pretty=%s)" = 'Stage32-18AM: ARM B16 BREAKTHROUGH SCOUT'
      - id: k
        run: |
          python - <<'PY'
          import json,pathlib,os
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18am-b16-breakthrough-scout.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1' and d['armed'] and d['bound']==16
          assert d['target_wall']==[436,5] and d['node_cap']==6000000 and d['wallclock_minutes']==20 and d['max_parallel']==15
          assert d['criterion']=='COMPLETE_ONLY' and d['source_exact_artifact_id']==9574308138
          assert d['shard_count']==1024 and d['secondary_split_coordinate']==48 and d['allow_finer_split'] is False
          modes=d['modes']; assert len(modes)==12 and len(set(modes))==12
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps({'include':[{'mode':m} for m in modes]},separators=(',',':'))+'\n')
          PY

  scout:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build exact scout
        env: {GH_TOKEN: '${{ github.token }}', MODE: '${{ matrix.mode }}'}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++ libboost-dev
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/source.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/src"
          python stages/stage32/32-18X/build_two_stage_certifier.py --source "$RUNNER_TEMP/src/d16-exact-symmetry-sharded.cpp" --output "$RUNNER_TEMP/work/cert.cpp" --primary-id 436
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AF/patch_symmetry_schedule.py
          SRC="$RUNNER_TEMP/work/cert.cpp" MODE="$MODE" python stages/stage32/32-18AM/patch_constraint_directed_basis.py
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic "$RUNNER_TEMP/work/cert.cpp" -o "$RUNNER_TEMP/work/cert"
          cp "$RUNNER_TEMP/src/d16-hperp.txt" "$RUNNER_TEMP/work/"
          cp "$RUNNER_TEMP/src/d16-aut-prefix256-bundle.txt" "$RUNNER_TEMP/work/"
      - name: Run breakthrough scout ${{ matrix.mode }}
        env: {MODE: '${{ matrix.mode }}'}
        run: |
          set -euo pipefail; set +e
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" timeout --signal=TERM --kill-after=20s 20m "$RUNNER_TEMP/work/cert" --input "$RUNNER_TEMP/work/d16-hperp.txt" --bundle "$RUNNER_TEMP/work/d16-aut-prefix256-bundle.txt" --output "$RUNNER_TEMP/out/cert.json" --dump-canonical "$RUNNER_TEMP/out/dump.bin" --bound 16 --shard-id 5 --shard-count 1024 --split-coordinate 48 --node-cap 6000000 >"$RUNNER_TEMP/out/stdout.txt" 2>"$RUNNER_TEMP/out/stderr.txt"
          rc=$?; set -e
          STATUS=COMPLETE
          if [ "$rc" -ne 0 ]; then if grep -q 'exact traversal node cap exceeded' "$RUNNER_TEMP/out/stderr.txt"; then STATUS=RESOURCE_WALL_NODE_CAP; elif [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$rc" -eq 143 ]; then STATUS=RESOURCE_WALL_WALLCLOCK; else STATUS=UNEXPECTED_FAILURE; fi; fi
          export STATUS
          python - <<'PY'
          import json,os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'; cert={}
          if (r/'cert.json').exists():
              try: cert=json.loads((r/'cert.json').read_text())
              except: cert={}
          rt=float((r/'runtime.txt').read_text().strip().splitlines()[-1]) if (r/'runtime.txt').exists() and (r/'runtime.txt').read_text().strip() else None
          keys=['nodes','constraint_prunes','exact_prune_checks','exact_symmetry_prune_checks','exact_symmetry_prunes','canonical_survivors_including_zero']
          out={'schema':'STAGE32_18AM_B16_BREAKTHROUGH_SCOUT_RESULT_V1','mode':os.environ['MODE'],'target_wall':[436,5],'status':os.environ['STATUS'],'runtime_seconds':rt,'promotion_eligible':os.environ['STATUS']=='COMPLETE','D16_B16_NUMERICAL_CREDIT':False}
          out.update({k:cert.get(k) for k in keys}); (r/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          test "$STATUS" != UNEXPECTED_FAILURE
      - uses: actions/upload-artifact@v4
        with: {name: 'stage32-18am-p436-s5-${{ matrix.mode }}-g1', path: '${{ runner.temp }}/out/', retention-days: 7, if-no-files-found: error}

  summarize:
    needs: scout
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'stage32-18am-p436-s5-*-g1', path: '${{ runner.temp }}/runs'}
      - run: |
          python - <<'PY'
          import json,os,pathlib
          docs=[json.loads(p.read_text()) for p in (pathlib.Path(os.environ['RUNNER_TEMP'])/'runs').rglob('compact.json')]; assert len(docs)==12
          complete=sorted(d['mode'] for d in docs if d['status']=='COMPLETE')
          out={'schema':'STAGE32_18AM_B16_BREAKTHROUGH_SCOUT_SUMMARY_V1','verdict':'PASS_BREAKTHROUGH_SIGNAL' if complete else 'NO_BREAKTHROUGH_SIGNAL','target_wall':[436,5],'criterion':'COMPLETE_ONLY','complete_modes':complete,'results':sorted(docs,key=lambda d:d['mode']),'next_item':'32-18AN-D16-B16-FULL-PROMOTION' if complete else '32-18AN-D16-B16-ORBIT-MITM-SCOUT','D16_B16_NUMERICAL_CREDIT':False,'GLOBAL_B16_AGGREGATION_COMPLETE':False,'FULL_D16_G0_ROW_COMPLETE':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False,'CONTROLLER_MODIFIED':False}
          o=pathlib.Path(os.environ['RUNNER_TEMP'])/'summary';o.mkdir();(o/'stage32-18am-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n');print(json.dumps({'verdict':out['verdict'],'complete_modes':complete}))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: stage32-18am-b16-breakthrough-scout-summary-g1, path: '${{ runner.temp }}/summary/', retention-days: 14, if-no-files-found: error}
