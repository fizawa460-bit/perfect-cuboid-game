name: Stage26-40 upper mechanism

on:
  pull_request:
    paths:
      - 'stages/stage26/26-40/**'
      - 'stages/stage26/26-controller.json'
      - 'stages/stage26/26-30/**'
      - 'stages/stage18/final.md'
      - 'stages/stage20/final.md'
      - 'stages/stage25/25-reentry-60/**'
      - '.github/workflows/stage26-40-upper-mechanism.yml'
  workflow_dispatch:

jobs:
  verify-stage26-40:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage26 checkpoint40 upper mechanism
        run: python stages/stage26/26-40/verify_26_40.py
