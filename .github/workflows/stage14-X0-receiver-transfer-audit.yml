name: Stage14-X0 receiver transfer audit

on:
  pull_request:
    paths:
      - "stages/stage14/14-X0/**"
      - "stages/stage14/data/14-X0/**"
      - "stages/stage14/scripts/14-X0/**"
      - ".github/workflows/stage14-X0-receiver-transfer-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit exact receiver transfer and finite fibers
        run: python3 stages/stage14/scripts/14-X0/receiver_transfer_audit.py
