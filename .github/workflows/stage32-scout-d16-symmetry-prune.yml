name: Stage32 scout d16 symmetry pruning

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/scouts/d16_constrained_hperp_prepare.py'
      - 'stages/stage32/scouts/d16_constrained_hperp_enum.cpp'
      - 'stages/stage32/scouts/d16_symmetry_breaker_prepare.py'
      - 'stages/stage32/32-07/export_aut_action_locked.py'
      - '.github/workflows/stage32-scout-d16-symmetry-prune.yml'

permissions:
  contents: read

jobs:
  d16-symmetry-prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact lattice preprocessing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pari-gp g++
          gp --version
          g++ --version
      - name: Rebuild source-locked Stage32 Picard core
        run: |
          python stages/stage32/32-01/run_sparse_picard_export.py
          test -s stages/stage32/32-01/picard-core.json
          mkdir -p "$RUNNER_TEMP/core" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          cp stages/stage32/32-01/picard-core.json "$RUNNER_TEMP/core/picard-core.json"
      - name: Build reduced Hperp coordinates
        run: |
          python stages/stage32/scouts/d16_constrained_hperp_prepare.py \
            --core "$RUNNER_TEMP/core/picard-core.json" \
            --output "$RUNNER_TEMP/work/d16-constrained-hperp.txt"
      - name: Regenerate source-locked geometric Aut action
        run: |
          ok=0
          for attempt in 1 2 3; do
            if python stages/stage32/32-07/export_aut_action_locked.py \
              --output "$RUNNER_TEMP/out/d16-aut-action.json"; then
              ok=1
              break
            fi
            echo "Aut export attempt $attempt failed; retrying" >&2
            sleep 5
          done
          test "$ok" -eq 1
      - name: Prepare depth-1, depth-2 and depth-3 score breakers
        run: |
          python stages/stage32/scouts/d16_symmetry_breaker_prepare.py \
            --input "$RUNNER_TEMP/work/d16-constrained-hperp.txt" \
            --aut "$RUNNER_TEMP/out/d16-aut-action.json" \
            --word-depth 1 --max-breakers 9 \
            --output "$RUNNER_TEMP/work/d16-symmetry-d1.txt" \
            | tee "$RUNNER_TEMP/out/d16-symmetry-d1-prepare.log"
          python stages/stage32/scouts/d16_symmetry_breaker_prepare.py \
            --input "$RUNNER_TEMP/work/d16-constrained-hperp.txt" \
            --aut "$RUNNER_TEMP/out/d16-aut-action.json" \
            --word-depth 2 --max-breakers 64 \
            --output "$RUNNER_TEMP/work/d16-symmetry-d2.txt" \
            | tee "$RUNNER_TEMP/out/d16-symmetry-d2-prepare.log"
          python stages/stage32/scouts/d16_symmetry_breaker_prepare.py \
            --input "$RUNNER_TEMP/work/d16-constrained-hperp.txt" \
            --aut "$RUNNER_TEMP/out/d16-aut-action.json" \
            --word-depth 3 --max-breakers 64 \
            --output "$RUNNER_TEMP/work/d16-symmetry-d3.txt" \
            | tee "$RUNNER_TEMP/out/d16-symmetry-d3-prepare.log"
      - name: Compile optional-symmetry exact-leaf enumerator
        run: |
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic \
            stages/stage32/scouts/d16_constrained_hperp_enum.cpp \
            -o "$RUNNER_TEMP/work/d16-constrained-hperp-enum"
      - name: Run baseline b6
        run: |
          "$RUNNER_TEMP/work/d16-constrained-hperp-enum" \
            --input "$RUNNER_TEMP/work/d16-constrained-hperp.txt" \
            --output "$RUNNER_TEMP/out/d16-b6-baseline.json" \
            --bounds 6 --per-bound-seconds 30 --node-cap 10000000 --survivor-cap 100000
      - name: Run depth-1 symmetry-pruned b6
        run: |
          "$RUNNER_TEMP/work/d16-constrained-hperp-enum" \
            --input "$RUNNER_TEMP/work/d16-constrained-hperp.txt" \
            --symmetry-breakers "$RUNNER_TEMP/work/d16-symmetry-d1.txt" \
            --output "$RUNNER_TEMP/out/d16-b6-symmetry-d1.json" \
            --bounds 6 --per-bound-seconds 30 --node-cap 10000000 --survivor-cap 100000
      - name: Run depth-2 symmetry-pruned b6
        run: |
          "$RUNNER_TEMP/work/d16-constrained-hperp-enum" \
            --input "$RUNNER_TEMP/work/d16-constrained-hperp.txt" \
            --symmetry-breakers "$RUNNER_TEMP/work/d16-symmetry-d2.txt" \
            --output "$RUNNER_TEMP/out/d16-b6-symmetry-d2.json" \
            --bounds 6 --per-bound-seconds 30 --node-cap 10000000 --survivor-cap 100000
      - name: Run depth-3 symmetry-pruned b6
        run: |
          "$RUNNER_TEMP/work/d16-constrained-hperp-enum" \
            --input "$RUNNER_TEMP/work/d16-constrained-hperp.txt" \
            --symmetry-breakers "$RUNNER_TEMP/work/d16-symmetry-d3.txt" \
            --output "$RUNNER_TEMP/out/d16-b6-symmetry-d3.json" \
            --bounds 6 --per-bound-seconds 30 --node-cap 10000000 --survivor-cap 100000
      - name: Compare pruning effect and enforce scout firewalls
        run: |
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          b=json.loads((root/'d16-b6-baseline.json').read_text())
          d1=json.loads((root/'d16-b6-symmetry-d1.json').read_text())
          d2=json.loads((root/'d16-b6-symmetry-d2.json').read_text())
          d3=json.loads((root/'d16-b6-symmetry-d3.json').read_text())
          bt=b['tiers'][0]; t1=d1['tiers'][0]; t2=d2['tiers'][0]; t3=d3['tiers'][0]
          assert bt['bound']==6 and bt['status']=='COMPLETE'
          assert bt['exact_survivors_including_zero']==17833 and bt['nonzero_survivors']==17832
          assert b['symmetry_breaker_count']==0
          assert t1['status']=='COMPLETE' and d1['symmetry_breaker_count']==9
          assert t1['exact_survivors_including_zero']==1050
          assert t2['status']=='COMPLETE' and d2['symmetry_breaker_count']==49
          assert t2['exact_survivors_including_zero']==315
          assert t3['status']=='COMPLETE' and d3['symmetry_breaker_count']==64
          assert 37 <= t3['exact_survivors_including_zero'] <= t2['exact_survivors_including_zero']
          assert t3['nodes'] <= t2['nodes'] <= t1['nodes'] <= bt['nodes']
          for r in (b,d1,d2,d3):
              assert r['THEOREM_CREDIT'] is False
              assert r['RECEIVER_CREDIT'] is False
              assert r['FULL_D16_G0_ROW_COMPLETE'] is False
              assert r['R29_LG2_NUMERICAL_COMPONENT_COMPLETE'] is False
          summary={
              'baseline':{'nodes':bt['nodes'],'survivors':bt['exact_survivors_including_zero'],'seconds':bt['elapsed_seconds']},
              'depth1':{'breakers':d1['symmetry_breaker_count'],'nodes':t1['nodes'],'survivors':t1['exact_survivors_including_zero'],'seconds':t1['elapsed_seconds']},
              'depth2':{'breakers':d2['symmetry_breaker_count'],'nodes':t2['nodes'],'survivors':t2['exact_survivors_including_zero'],'seconds':t2['elapsed_seconds']},
              'depth3':{'breakers':d3['symmetry_breaker_count'],'nodes':t3['nodes'],'survivors':t3['exact_survivors_including_zero'],'seconds':t3['elapsed_seconds']},
              'depth3_node_reduction_vs_baseline':bt['nodes']/t3['nodes'],
              'depth3_survivor_reduction_vs_baseline':bt['exact_survivors_including_zero']/t3['exact_survivors_including_zero'],
              'depth3_node_gain_vs_depth2':t2['nodes']/t3['nodes'],
              'depth3_survivor_gain_vs_depth2':t2['exact_survivors_including_zero']/t3['exact_survivors_including_zero'],
              'ideal_orbit_count_b6':37,
              'route_gate':'KEEP_AUT_IF_DEPTH3_HAS_NONTRIVIAL_GAIN_OTHERWISE_GREEDY_FULL_GROUP_SELECTION_BEFORE_JOINT_QUADRATIC',
              'THEOREM_CREDIT':False,
              'RECEIVER_CREDIT':False,
              'FULL_D16_G0_ROW_COMPLETE':False,
          }
          (root/'d16-symmetry-prune-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(summary)
          PY
          du -ah "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-scout-d16-symmetry-prune
          path: ${{ runner.temp }}/out/
          retention-days: 5
          if-no-files-found: error
