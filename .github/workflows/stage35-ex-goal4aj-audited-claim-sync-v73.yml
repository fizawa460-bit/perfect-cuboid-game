name: Stage35-EX Goal4AJ audited claim sync V73

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact replay dependency
        run: python -m pip install --disable-pip-version-check sympy
      - name: Verify audited Goal4AJ claim synchronization
        run: |
          set -euo pipefail
          python -u -B stages/stage35-ex/verify_stage35_ex_35_goal4aj_audited_claim_sync.py
