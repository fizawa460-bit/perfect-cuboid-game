name: Stage32-18AC d16 b16 adaptive c48x256 tail rescue

on:
  push:
    branches:
      - stage32-18ac-b16-tail-x256-rescue
    paths:
      - 'stages/stage32/runkeys/18ac-b16-tail-x256-rescue.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-18ac-b16-tail-x256-rescue
  cancel-in-progress: true

jobs:
  validate-run-key:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.key.outputs.matrix }}
      generation: ${{ steps.key.outputs.generation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require dedicated ARM commit
        run: |
          set -euo pipefail
          KEY='stages/stage32/runkeys/18ac-b16-tail-x256-rescue.json'
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$KEY"
          test "$(git log -1 --pretty=%s)" = 'Stage32-18AC: ARM B16 C48X256 TAIL RESCUE'
      - id: key
        name: Validate adaptive x256 contract and Actions budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,urllib.request
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18ac-b16-tail-x256-rescue.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1'
          assert d['workflow']=='stage32-18ac-d16-b16-tail-x256-rescue'
          assert d['armed'] is True and d['generation']==1 and d['bound']==16
          assert d['accepted_b14_canonical_survivors']==44450
          assert d['accepted_b14_dump_sha256']=='4d4680a87fab0c01ac8b54bcf404eecaa707cf5db782b31d5fa7357a52249d8a'
          assert d['prepared_artifact_id']==9626136705
          assert d['prepared_zip_sha256']=='f706cd79cf1fc64da0a59bc5cc528ea677e3892f602d3f58d78cb1543bf8380c'
          assert d['source_x16_run_id']==33030066426 and d['source_x16_summary_artifact_id']==9631617459
          assert d['source_x16_summary_digest']=='sha256:3607380f62285a7c89919f0b184bceb296713b8a18fc7ae81f135e289f79c0f2'
          assert d['source_x32_run_id']==33035492820 and d['source_x32_summary_artifact_id']==9633913882
          assert d['source_x32_summary_digest']=='sha256:d7821ecd335752334b04547ea4b255a0c407914022762574b8a1b88b1027a95c'
          assert d['source_x64_run_id']==33041481560 and d['source_x64_summary_artifact_id']==9635756996
          assert d['source_x64_summary_digest']=='sha256:c54356b49dd09ee2e96770baca0ec69a68e7a433bd20f3213fcbc3848b2257b5'
          assert d['source_x128_run_id']==33046646974 and d['source_x128_summary_artifact_id']==9637483930
          assert d['source_x128_summary_digest']=='sha256:ae45e1125ecbeae3571c0f9e3cfa1d0247890b6fa28b625c7a2b20a57f096c65'
          assert d['source_logical_x16_complete_count']==26
          assert d['primary_residues']==[436,503,922]
          assert d['primary_coordinate']==54 and d['primary_modulus']==1024
          assert d['secondary_coordinate']==48 and d['source_secondary_shard_count']==128 and d['rescue_secondary_shard_count']==256
          assert d['node_cap']==18000000 and d['max_parallel']==15 and d['max_parallel']<=18
          assert d['artifact_uncompressed_cap_bytes']==1000000 and d['artifact_retention_days']==7
          assert d['storage_budget_bytes']==524288000
          walls={436:[48,115,5,57,106,123,124,62,15],503:[16,19,118,25,109,127],922:[32,17,115,38,13,78,15]}
          got={int(k):v for k,v in d['source_node_cap_x128'].items()}
          assert got==walls and sum(map(len,walls.values()))==22
          assert len({(p,s%16) for p,ws in walls.items() for s in ws})==22
          inc=[]
          for p in d['primary_residues']:
              for parent in walls[p]:
                  for child in (parent,parent+128):
                      inc.append({'tag':f'c48x256-p{p}-s{child}','primary':p,'parent128':parent,'secondary':child})
          assert len(inc)==44 and len({x['tag'] for x in inc})==44

          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'stage32-18ac-preflight'}
          sources=(
              (d['source_x16_summary_artifact_id'],d['source_x16_run_id'],d['source_x16_summary_digest']),
              (d['source_x32_summary_artifact_id'],d['source_x32_run_id'],d['source_x32_summary_digest']),
              (d['source_x64_summary_artifact_id'],d['source_x64_run_id'],d['source_x64_summary_digest']),
              (d['source_x128_summary_artifact_id'],d['source_x128_run_id'],d['source_x128_summary_digest']),
          )
          for aid,rid,digest in sources:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/artifacts/{aid}',headers=headers)
              with urllib.request.urlopen(req) as r: a=json.load(r)
              assert a['workflow_run']['id']==rid and not a['expired'] and a['digest']==digest

          current=0; page=1
          while True:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}',headers=headers)
              with urllib.request.urlopen(req) as r: payload=json.load(r)
              arts=payload.get('artifacts',[])
              current += sum(int(x['size_in_bytes']) for x in arts if not x.get('expired',False))
              if len(arts)<100: break
              page += 1
          worst_new=len(inc)*d['artifact_uncompressed_cap_bytes'] + 8000000
          projected=current+worst_new
          assert projected <= d['storage_budget_bytes'], (current,worst_new,projected,d['storage_budget_bytes'])
          print(json.dumps({'source_x128_node_cap':22,'new_x256_jobs':len(inc),'current_nonexpired_artifact_bytes':current,'worst_case_new_bytes':worst_new,'projected_peak_bytes':projected,'storage_budget_bytes':d['storage_budget_bytes'],'max_parallel':d['max_parallel']},sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('generation='+str(d['generation'])+'\n')
              f.write('matrix='+json.dumps({'include':inc},separators=(',',':'))+'\n')
          PY

  rescue:
    needs: validate-run-key
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.validate-run-key.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Restore SHA-locked prepared certifiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prepared"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RUNNER_TEMP/prepared.zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9626136705/zip"
          echo 'f706cd79cf1fc64da0a59bc5cc528ea677e3892f602d3f58d78cb1543bf8380c  '"$RUNNER_TEMP/prepared.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/prepared.zip" -d "$RUNNER_TEMP/prepared"
          chmod +x "$RUNNER_TEMP/prepared/d16-two-stage-436" "$RUNNER_TEMP/prepared/d16-two-stage-503" "$RUNNER_TEMP/prepared/d16-two-stage-922"
      - name: Exact x256 rescue ${{ matrix.tag }}
        env:
          PRIMARY: ${{ matrix.primary }}
          PARENT128: ${{ matrix.parent128 }}
          SECONDARY: ${{ matrix.secondary }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          exe="$RUNNER_TEMP/prepared/d16-two-stage-$PRIMARY"
          set +e
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" \
            timeout --signal=TERM --kill-after=30s 50m \
            "$exe" \
              --input "$RUNNER_TEMP/prepared/d16-hperp.txt" \
              --bundle "$RUNNER_TEMP/prepared/d16-aut-prefix256-bundle.txt" \
              --output "$RUNNER_TEMP/out/cert.json" \
              --dump-canonical "$RUNNER_TEMP/out/dump.bin" \
              --bound 16 --shard-id "$SECONDARY" --shard-count 256 --split-coordinate 48 --node-cap 18000000 \
              >"$RUNNER_TEMP/out/stdout.txt" 2>"$RUNNER_TEMP/out/stderr.txt"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -q 'exact traversal node cap exceeded' "$RUNNER_TEMP/out/stderr.txt"; then
              STATUS='RESOURCE_WALL_NODE_CAP' RC="$rc" python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          runtime=float((root/'runtime.txt').read_text().strip().splitlines()[-1])
          out={'schema':'STAGE32_18AC_B16_TAIL_X256_RESCUE_RESULT_V1','tag':os.environ['TAG'],'primary_residue':int(os.environ['PRIMARY']),'parent_x128_shard':int(os.environ['PARENT128']),'secondary_shard':int(os.environ['SECONDARY']),'secondary_shard_count':256,'status':os.environ['STATUS'],'node_cap':18000000,'runtime_seconds':runtime,'exit_code':int(os.environ['RC']),'D16_B16_NUMERICAL_CREDIT':False}
          (root/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
            elif [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              STATUS='RESOURCE_WALL_WALLCLOCK' RC="$rc" python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          runtime=float((root/'runtime.txt').read_text().strip().splitlines()[-1])
          out={'schema':'STAGE32_18AC_B16_TAIL_X256_RESCUE_RESULT_V1','tag':os.environ['TAG'],'primary_residue':int(os.environ['PRIMARY']),'parent_x128_shard':int(os.environ['PARENT128']),'secondary_shard':int(os.environ['SECONDARY']),'secondary_shard_count':256,'status':os.environ['STATUS'],'node_cap':18000000,'wallclock_cap_seconds':3000,'runtime_seconds':runtime,'exit_code':int(os.environ['RC']),'D16_B16_NUMERICAL_CREDIT':False}
          (root/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
            else
              cat "$RUNNER_TEMP/out/stderr.txt"
              exit "$rc"
            fi
          else
            python - <<'PY'
          import hashlib,json,os,pathlib
          MAGIC=b'S32D16C1'; RS=141
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          d=json.loads((root/'cert.json').read_text()); p=int(os.environ['PRIMARY']); s=int(os.environ['SECONDARY']); parent=int(os.environ['PARENT128'])
          assert d['schema']=='STAGE32_18X_D16_B16_TWO_STAGE_SHARD_V1' and d['status']=='COMPLETE' and d['bound']==16
          assert d['TRAVERSAL_COMPLETENESS_CERTIFICATE'] is True
          assert d['all_symmetry_branch_rejections_exact_rational_cauchy_schwarz'] is True
          assert d['aut_group_order']==1536 and d['dfs_symmetry_breaker_count']==256
          assert d['two_stage_partition'] is True
          assert (d['primary_shard_id'],d['primary_shard_count'],d['primary_split_coordinate'])==(p,1024,54)
          assert (d['secondary_shard_id'],d['secondary_shard_count'],d['secondary_split_coordinate'])==(s,256,48)
          assert s%128==parent
          raw=(root/'dump.bin').read_bytes(); assert raw[:8]==MAGIC and (len(raw)-8)%RS==0
          rec=[raw[i:i+RS] for i in range(8,len(raw),RS)]
          assert len(rec)==len(set(rec))
          n=len(rec); assert n==int(d['canonical_survivors_including_zero'])
          runtime=float((root/'runtime.txt').read_text().strip().splitlines()[-1])
          out={'schema':'STAGE32_18AC_B16_TAIL_X256_RESCUE_RESULT_V1','tag':os.environ['TAG'],'primary_residue':p,'parent_x128_shard':parent,'secondary_shard':s,'secondary_shard_count':256,'status':'COMPLETE','node_cap':18000000,'runtime_seconds':runtime,'canonical_survivors_including_zero':n,'canonical_norm_histogram':d['canonical_norm_histogram'],'canonical_dump_sha256':hashlib.sha256(raw).hexdigest(),'nodes':d.get('nodes'),'coordinate_trials':d.get('coordinate_trials'),'prepared_input_sha256':d.get('prepared_input_sha256'),'stable_aut_content_sha256':d.get('stable_aut_content_sha256'),'canonical_bundle_sha256':d.get('canonical_bundle_sha256'),'aut_group_order':1536,'dfs_symmetry_breaker_count':256,'D16_B16_NUMERICAL_CREDIT':False}
          (root/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
          fi

          bytes=$(du -sb "$RUNNER_TEMP/out" | cut -f1)
          if [ "$bytes" -gt 1000000 ]; then
            ARTIFACT_BYTES="$bytes" python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'; p=root/'compact.json'; d=json.loads(p.read_text())
          if d.get('status')=='COMPLETE':
              d['status']='RESOURCE_WALL_ARTIFACT_SIZE'; d['artifact_bytes_before_compaction']=int(os.environ['ARTIFACT_BYTES']); d['artifact_uncompressed_cap_bytes']=1000000; d['D16_B16_NUMERICAL_CREDIT']=False
              for name in ('cert.json','dump.bin','stdout.txt','stderr.txt'):
                  q=root/name
                  if q.exists(): q.unlink()
              p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
              print(json.dumps({'tag':d['tag'],'status':d['status'],'artifact_bytes_before_compaction':d['artifact_bytes_before_compaction']},sort_keys=True))
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18ac-b16-${{ matrix.tag }}-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error

  summarize:
    needs: [validate-run-key, rescue]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Download frozen x128 reconstruction summary
        uses: actions/download-artifact@v4
        with:
          name: stage32-18ab-b16-adaptive-x128-rescue-summary-g1
          path: ${{ runner.temp }}/source-summary
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33046646974
      - name: Download current x256 rescue evidence
        uses: actions/download-artifact@v4
        with:
          pattern: stage32-18ac-b16-c48x256-*-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/x256
      - name: Verify adaptive x256 reconstruction and freeze verdict
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          MAGIC=b'S32D16C1'; RS=141
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          source_files=list((root/'source-summary').rglob('stage32-18ab-b16-adaptive-x128-rescue-summary.json'))
          assert len(source_files)==1,source_files
          src=json.loads(source_files[0].read_text())
          assert src['schema']=='STAGE32_18AB_B16_ADAPTIVE_X128_RESCUE_SUMMARY_V1'
          assert src['verdict']=='B16_TAIL_GEOMETRY__ADAPTIVE_C48X128_INSUFFICIENT__FINER_SPLIT_REQUIRED'
          assert src['source_x16_run_id']==33030066426 and src['source_x32_run_id']==33035492820 and src['source_x64_run_id']==33041481560
          assert src['source_x64_summary_artifact_id']==9635756996
          assert src['source_complete_x64_count']==42 and src['source_node_cap_x64_count']==26 and src['new_x128_child_count']==52
          assert src['logical_x16_complete_count']==26
          assert src['next_item']=='32-18AC-D16-B16-C48X256-TAIL-RESCUE'
          for k in ('D16_B16_NUMERICAL_CREDIT','GLOBAL_B16_AGGREGATION_COMPLETE','FULL_D16_G0_ROW_COMPLETE','THEOREM_CREDIT','RECEIVER_CREDIT','CONTROLLER_MODIFIED'):
              assert src[k] is False

          primaries=(436,503,922)
          walls={436:[48,115,5,57,106,123,124,62,15],503:[16,19,118,25,109,127],922:[32,17,115,38,13,78,15]}
          expected_remaining={(q,s,'RESOURCE_WALL_NODE_CAP') for q,ws in walls.items() for s in ws}
          got_remaining={(int(x['primary']),int(x['secondary128']),x['status']) for x in src['remaining_resource_walls']}
          assert got_remaining==expected_remaining,(got_remaining,expected_remaining)
          assert len({(q,s%16) for q,ws in walls.items() for s in ws})==22

          docs={}; dirs={}
          for p in (root/'x256').rglob('compact.json'):
              d=json.loads(p.read_text()); docs[d['tag']]=d; dirs[d['tag']]=p.parent
          expected={f'c48x256-p{q}-s{c}' for q in primaries for s in walls[q] for c in (s,s+128)}
          assert set(docs)==expected,(len(docs),len(expected),set(docs)^expected)

          source_lock=None
          remaining=[]; closed_parents=[]; per={}
          def lock(d): return (d['prepared_input_sha256'],d['stable_aut_content_sha256'],d['canonical_bundle_sha256'],d['aut_group_order'],d['dfs_symmetry_breaker_count'])
          def records(tag,d):
              raw=(dirs[tag]/'dump.bin').read_bytes(); assert raw[:8]==MAGIC and (len(raw)-8)%RS==0
              assert hashlib.sha256(raw).hexdigest()==d['canonical_dump_sha256']
              rec=[raw[i:i+RS] for i in range(8,len(raw),RS)]
              assert len(rec)==int(d['canonical_survivors_including_zero']) and len(rec)==len(set(rec))
              rh={}
              for r in rec: rh[str(r[0])]=rh.get(str(r[0]),0)+1
              assert rh=={str(k):int(v) for k,v in d['canonical_norm_histogram'].items()}
              return rec,rh

          for q in primaries:
              pin=[]
              for parent in walls[q]:
                  pair=[]; rec=[]; hist={}
                  for s in (parent,parent+128):
                      tag=f'c48x256-p{q}-s{s}'; d=docs[tag]
                      assert d['schema']=='STAGE32_18AC_B16_TAIL_X256_RESCUE_RESULT_V1'
                      assert d['primary_residue']==q and d['parent_x128_shard']==parent and d['secondary_shard']==s and d['secondary_shard_count']==256
                      assert s%128==parent and d['D16_B16_NUMERICAL_CREDIT'] is False
                      pair.append(d['status'])
                      if d['status']=='COMPLETE':
                          lk=lock(d)
                          if source_lock is None: source_lock=lk
                          assert lk==source_lock
                          r,h=records(tag,d); rec.extend(r)
                          for k,v in h.items(): hist[k]=hist.get(k,0)+v
                      else:
                          assert d['status'] in ('RESOURCE_WALL_NODE_CAP','RESOURCE_WALL_WALLCLOCK','RESOURCE_WALL_ARTIFACT_SIZE')
                          remaining.append({'primary':q,'parent128':parent,'secondary256':s,'status':d['status']})
                  if pair==['COMPLETE','COMPLETE']:
                      assert len(rec)==len(set(rec))
                      closed_parents.append({'primary':q,'parent128':parent,'logical_x16':parent%16,'canonical_survivors_including_zero':len(rec),'canonical_norm_histogram':hist,'union_dump_sha256':hashlib.sha256(MAGIC+b''.join(sorted(rec))).hexdigest()})
                      pin.append({'parent128':parent,'logical_x16':parent%16,'status':'COMPLETE'})
                  else:
                      pin.append({'parent128':parent,'logical_x16':parent%16,'status':'INCOMPLETE','child_statuses':pair})
              per[str(q)]={'all_source_x128_walls_closed':all(x['status']=='COMPLETE' for x in pin),'source_x128_parents':pin}

          logical_count=26+len(closed_parents)
          assert 26 <= logical_count <= 48
          unresolved=[{'primary':q,'logical_x16':parent%16,'parent128':parent} for q in primaries for parent in walls[q] if not any(x['primary']==q and x['parent128']==parent for x in closed_parents)]
          assert len(unresolved)==48-logical_count
          if logical_count==48:
              verdict='PASS_B16_TAIL_GEOMETRY__ADAPTIVE_C48X256_CLOSES_HISTORICAL_TAILS__PRODUCTION_DESIGN_READY'
              next_item='32-18AD-D16-B16-RESOURCE-SAFE-EXACT-PRODUCTION-DESIGN'
          else:
              verdict='B16_TAIL_GEOMETRY__ADAPTIVE_C48X256_INSUFFICIENT__FINER_SPLIT_REQUIRED'
              next_item='32-18AD-D16-B16-C48X512-TAIL-RESCUE'
          out={'schema':'STAGE32_18AC_B16_ADAPTIVE_X256_RESCUE_SUMMARY_V1','verdict':verdict,'source_x128_run_id':33046646974,'source_x128_summary_artifact_id':9637483930,'source_logical_x16_complete_count':26,'source_node_cap_x128_count':22,'new_x256_child_count':44,'new_x256_complete_count':sum(1 for d in docs.values() if d['status']=='COMPLETE'),'logical_x16_complete_count':logical_count,'closed_x128_parents':closed_parents,'unresolved_logical_x16':unresolved,'remaining_resource_walls':remaining,'per_primary':per,'next_item':next_item,'D16_B16_NUMERICAL_CREDIT':False,'GLOBAL_B16_AGGREGATION_COMPLETE':False,'FULL_D16_G0_ROW_COMPLETE':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False,'CONTROLLER_MODIFIED':False}
          outdir=root/'summary'; outdir.mkdir()
          (outdir/'stage32-18ac-b16-adaptive-x256-rescue-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'verdict':verdict,'new_x256_complete_count':out['new_x256_complete_count'],'logical_x16_complete_count':logical_count,'remaining_resource_wall_count':len(remaining),'unresolved_logical_x16':unresolved,'remaining_resource_walls':remaining,'next_item':next_item,'per_primary_complete':{k:v['all_source_x128_walls_closed'] for k,v in per.items()}},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18ac-b16-adaptive-x256-rescue-summary-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/summary/
          retention-days: 14
          if-no-files-found: error
