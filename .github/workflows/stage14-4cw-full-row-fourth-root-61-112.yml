name: Stage14-4cw full row fourth root 61/112

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4cw/**'
      - 'stages/stage14/scripts/14-4/full_row_fourth_root_61_112_audit.py'
      - 'stages/stage14/data/14-4/full_row_fourth_root_61_112_summary.json'
      - '.github/workflows/stage14-4cw-full-row-fourth-root-61-112.yml'
      - 'stages/stage14/14-X12/**'
      - 'stages/stage14/14-s7-37/**'
      - 'stages/stage14/14-4cv/**'
      - 'stages/stage14/14-4cr/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage14-4cw deterministic 61/112 audit
        run: python stages/stage14/scripts/14-4/full_row_fourth_root_61_112_audit.py

      - name: Compile Stage14-4cw audit
        run: python -m py_compile stages/stage14/scripts/14-4/full_row_fourth_root_61_112_audit.py

      - name: Stage14-X12 regression
        run: python stages/stage14/scripts/14-X12/lost_core_fourth_root_71_128_audit.py

      - name: Stage14-s7-37 regression
        run: python stages/stage14/scripts/14-s7-37/sameside_u_residual_19_34_audit.py

      - name: Stage14-4cv regression
        run: python stages/stage14/scripts/14-4/row_column_cofactor_7_12_audit.py

      - name: Boundary locks
        run: |
          f=stages/stage14/14-4cw/result.md
          grep -Fq 'STAGE14_4CW=COMPLETE_FULL_CAYLEY_ROW_LOST_CORE_FOURTH_ROOT_AND_61_112_PROMOTION' "$f"
          grep -Fq 'MERGED_X12_IMPORTED=true' "$f"
          grep -Fq 'FULL_CAYLEY_ROW_AFTER_X12_COLUMN_PROVED=true' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=61/112' "$f"
          grep -Fq 'SIXTYONE_112_SATURATION_THETA=61/224' "$f"
          grep -Fq 'SIXTYONE_112_EFFECTIVE_COLUMN_SUPPORT_EXPONENT=1/28' "$f"
          grep -Fq 'SIXTYONE_112_FULL_ROW_LIFT_EXPONENT=1/112' "$f"
          grep -Fq 'REMAINING_RECEIVER=SixtyOneOneHundredTwelfthsFullCayleyRowFourthRootColumnShortLiftIncidence' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-4cx' "$f"
