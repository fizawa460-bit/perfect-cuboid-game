name: Temporary Stage27 r5aj lifecycle sync

on:
  push:
    branches:
      - agent/stage27-19-r5aj-residual-chart
    paths:
      - 'scripts/tmp_stage27_r5aj_sync.py'
      - '.github/workflows/tmp-stage27-r5aj-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-19-r5aj-residual-chart
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply canonical lifecycle and historical verifier repair
        run: |
          python scripts/tmp_stage27_r5aj_sync.py
          python -m json.tool stages/stage27/27-controller.json >/dev/null
          python -m json.tool stages/stage27/27-19-r5ah/route-contract.json >/dev/null
          python -m json.tool stages/stage27/27-19-r5aj/route-contract.json >/dev/null
          python stages/stage27/27-19-r5aj/verify_27_19_r5aj_r5ak.py
          python stages/stage15/replay/verify_stage15_8_html.py
          git diff --check
      - name: Commit sync and remove temporary helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stages/stage27/27-controller.json docs/00_CURRENT_RESEARCH_STATUS.md stages/stage27/27-19-r401* stages/stage27/27-19-r402*
          git rm scripts/tmp_stage27_r5aj_sync.py .github/workflows/tmp-stage27-r5aj-sync.yml
          git add -A
          git commit -m 'Stage27-19-r5aj: sync audited lifecycle and historical verifier hygiene'
          git push origin HEAD:agent/stage27-19-r5aj-residual-chart
