name: Stage33-09 Picard equivariant transport

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'stages/stage33/33-09/**'
      - '.github/workflows/stage33-09-main.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: stage33-09-picard-equivariant-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retain-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retain the already-passed source-locked bridge artifact once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test ! -f stages/stage33/33-09/marked-picard-basis-source.json; then
            gh run download 33134518085 \
              --repo fizawa460-bit/perfect-cuboid-game \
              --name stage33-09-marked-picard-bridge \
              --dir stages/stage33/33-09
          fi
      - name: Reverify Stage33-09 closure locally
        run: python stages/stage33/33-09/certify_stage33_09_exit.py
      - name: Enforce Stage33-09 closure and downstream firewalls
        run: |
          python - <<'PY'
          import hashlib,json
          p='stages/stage33/33-09/stage33-09-closure.json'; x=json.load(open(p)); h=x.pop('canonical_sha256')
          assert h==hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert all(x['exit_condition'].values())
          assert x['stage33_10_released'] and x['stage33_progress']=='6/11'
          assert not x['stage33_07_closed'] and not x['stage33_08_released']
          assert x['connecting_matrix_columns_explicitly_materialized']==0
          assert not x['absolute_h1_receiver_exact'] and not x['arithmetic_localization_connecting_map_computed'] and not x['arithmetic_hs_closed']
          assert not x['theorem_credit'] and not x['endpoint_credit']
          print('STAGE33_09_EXIT_FIREWALL=PASS_EXACT')
          print('CERTIFICATE_SHA256='+h)
          PY
      - name: Commit retained nonexpiring evidence once
        if: github.event_name == 'pull_request'
        run: |
          if git status --porcelain -- stages/stage33/33-09 | grep -q .; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add stages/stage33/33-09/marked-picard-basis-source.json \
                    stages/stage33/33-09/marked-picard-basis-bridge-certified.json \
                    stages/stage33/33-09/stage33-09-closure.json
            git commit -m 'Stage33-09: retain exact marked Picard bridge evidence'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
