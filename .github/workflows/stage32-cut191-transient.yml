name: Stage32 CUT191 transient residual replay

on:
  pull_request:
    branches: [main]
    paths:
      - 'stages/stage32/full178-cut/cut191_residual_fresh_replay.py'
      - '.github/workflows/stage32-cut191-transient.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact solver dependencies
        run: python -m pip install --disable-pip-version-check sympy==1.13.3 z3-solver==4.15.4.0
      - name: Fresh replay parent 3182
        run: |
          mkdir -p cut191-out
          python stages/stage32/full178-cut/cut191_residual_fresh_replay.py \
            --parent 3182 --timeout-ms 15000 \
            --output cut191-out/CUT191-residual-parent-3182.json
      - uses: actions/upload-artifact@v4
        with:
          name: cut191-residual-3182
          path: cut191-out/*.json
          if-no-files-found: error
          retention-days: 7
