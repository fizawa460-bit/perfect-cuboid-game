name: Stage34-02b D2 StageA2 genus-two rank<=1 14-branch closure

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage34/runkeys/stage34-02b-d2-stageA2-genus2-rankle1-14-closure.json'
      - 'stages/stage34/34-02/d2-stageA2-genus2-rankle1-14-closure-lock.json'
      - 'stages/stage34/34-02/d2-stageA2-genus2-rankle1-rationalpoints-lock.json'
      - 'stages/stage34/34-02/run_d2_stageA2_genus2_rankle1_14_closure.py'
      - '.github/workflows/stage34-02b-d2-stageA2-genus2-rankle1-14-closure.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Check dedicated proof run key changed and armed
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          KEY=stages/stage34/runkeys/stage34-02b-d2-stageA2-genus2-rankle1-14-closure.json
          if [ -n "$BEFORE" ]; then git fetch --no-tags --depth=1 origin "$BEFORE" || true; fi
          if [ ! -f "$KEY" ]; then echo 'authorized=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$BEFORE" ] || ! git diff --name-only "$BEFORE" HEAD | grep -Fxq "$KEY"; then echo 'authorized=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p='stages/stage34/runkeys/stage34-02b-d2-stageA2-genus2-rankle1-14-closure.json'
          d=json.load(open(p))
          ok=(d.get('schema')=='STAGE34_02B_D2_STAGEA2_GENUS2_RANKLE1_14_CLOSURE_RUNKEY_V1' and d.get('armed') is True and d.get('expected_candidates')==14 and d.get('planned_heavy_jobs')==1 and d.get('effective_heavy_concurrency')==1 and d.get('maximum_external_magma_requests_at_once')==1)
          print('authorized='+('true' if ok else 'false'))
          PY

  prove:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Replay complete genus-two pointsets and exact parent pullback
        run: python3 stages/stage34/34-02/run_d2_stageA2_genus2_rankle1_14_closure.py
      - name: Enforce compact proof artifact cap
        if: always()
        run: |
          test -f stages/stage34/34-02/d2-stageA2-genus2-rankle1-14-closure.json
          test $(wc -c < stages/stage34/34-02/d2-stageA2-genus2-rankle1-14-closure.json) -le 1048576
          test $(wc -c < stages/stage34/34-02/d2-stageA2-genus2-rankle1-14-closure-stdout.txt) -le 1048576
      - name: Upload compact proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-02b-d2-stageA2-genus2-rankle1-14-closure
          path: |
            stages/stage34/34-02/d2-stageA2-genus2-rankle1-14-closure.json
            stages/stage34/34-02/d2-stageA2-genus2-rankle1-14-closure-stdout.txt
          if-no-files-found: warn
          retention-days: 1
