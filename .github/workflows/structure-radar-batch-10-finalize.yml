name: StructureRadar batch10 finalizer
on:
  push:
    branches: [structure-radar-deep-corpus-batch-10]
permissions:
  contents: write
jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'trigger batch10 finalizer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-10
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize batch10 and verify
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          batch_id='SR-BATCH-STAGE14_15_DEEP_CORPUS-10-R01'
          task_id='SR-CENSUS-STAGE14_15_DEEP_CORPUS-01'
          sel=json.loads((root/'.github/structure-radar-batch-10-selection.json').read_text())
          sources=sel['sources']
          src={s['source_id']:s for s in sources}
          regp=root/'docs/structure-radar/structure-registry.json'
          progp=root/'docs/structure-radar/progress.json'
          reg=json.loads(regp.read_text())
          prog=json.loads(progp.read_text())
          cards={c['structure_id']:c for c in reg['structures']}

          def prov(sid, locator):
              s=src[sid]
              return {'source_id':sid,'path':s['path'],'locator':locator,'fingerprint':s['fingerprint']}
          def addprov(cid, sid, locator):
              c=cards[cid]
              if not any(x.get('source_id')==sid for x in c.get('repo_provenance',[])):
                  c.setdefault('repo_provenance',[]).append(prov(sid,locator))
              c['card_status']='SUBMITTED_FOR_AUDIT'

          addprov('SR-STR-005','SRC-6BBC3C3E7FC5','toric anticanonical four-corner blowup and B(log B)^5 exactly-two ambient order')
          addprov('SR-STR-149','SRC-F5A3EE25199B','archimedean Tamagawa chamber asymptotic and explicit directional masses')
          addprov('SR-STR-003','SRC-33753E1ECAA6','Euler-brick K3 double-cover model and quantitative thin-set envelope')
          addprov('SR-STR-010','SRC-51BDF12B5CDA','gcd/lcm local-state decomposition and p=2,p=3 completion blockers')
          addprov('SR-STR-010','SRC-18B94F44928A','adelic six-state law, local blocker mass and thin-cover log saving')
          addprov('SR-STR-010','SRC-09CABBAA884C','explicit eta<1/46 thin-cover exponent and growing-prime dimension-two sieve')
          addprov('SR-STR-181','SRC-51BDF12B5CDA','exact gcd/lcm inverse for the shared-edge two-face ambient chart')

          new_id='SR-STR-214'
          if new_id not in cards:
              new_card={
                'structure_id':new_id,
                'canonical_math_name':'Explicit Peyre-Tamagawa constant for the primitive exactly-two two-face ambient height',
                'exact_equations_or_object':'For Y=Bl_4(P^1 x P^1) with the physical anticanonical height D_R, the exactly-two chamber counts satisfy E_q(B) ~ Lambda_E M_q B(log B)^5 and E_2(B) ~ C_E B(log B)^5, where Lambda_E=(1/81920) prod_{p>=3}(1-1/p)^6(1+6/p+1/p^2), C_E=Lambda_E(M_a+M_b+M_c), alpha(Y)=1/2880, beta(Y)=1, and the physical bad-prime factor is tau_2=9/64. The third-face-square degree-two thin subset has zero leading density, so raw and exactly-two leading constants agree.',
                'search_terms_primary':['Peyre Tamagawa constant four-corner toric blowup','two-face Pythagorean ambient Euler product constant'],
                'search_terms_aliases':['Stage14-e explicit ambient constant','physical p=2 toric height correction'],
                'theorem_species':['Peyre constant','toric Manin asymptotic','adelic local density','Euler product'],
                'repo_provenance':[prov('SRC-920BD51D9E14','explicit effective-cone volume, local densities, and assembled ambient leading constant')],
                'target_populations':['Stage14-e primitive exactly-two two-face ambient population E_2(B) and directional E_q(B)'],
                'potential_weapon_types':['EXACT_CONSTANT','TORIC_HEIGHT','LOCAL_DENSITY','ADELIC_PRODUCT'],
                'applicability_gaps':['The constant is for the no-integral-space-diagonal ambient/two-face population, not the main N2 space-diagonal-filtered count.','The p=2 factor is specific to the physical projective metric and cannot be replaced by the good-prime point-count factor.','The general toric Manin/equidistribution and thin-set zero-density inputs remain external theorem inputs.'],
                'existing_radar_overlap':['SR-STR-005','SR-STR-149','SR-STR-010'],
                'search_status':'SEARCHED',
                'arsenal_decision':'PENDING',
                'card_status':'SUBMITTED_FOR_AUDIT'
              }
              reg['structures'].append(new_card); cards[new_id]=new_card

          carriers={
            'SRC-6BBC3C3E7FC5':['SR-STR-005'],
            'SRC-F5A3EE25199B':['SR-STR-149'],
            'SRC-920BD51D9E14':['SR-STR-214'],
            'SRC-33753E1ECAA6':['SR-STR-003'],
            'SRC-51BDF12B5CDA':['SR-STR-010','SR-STR-181'],
            'SRC-18B94F44928A':['SR-STR-010'],
            'SRC-09CABBAA884C':['SR-STR-010'],
          }
          reviews=prog.setdefault('source_reviews',{})
          for s in sources:
              sid=s['source_id']
              rec={'fingerprint':s['fingerprint'],'batch_id':batch_id}
              if sid in carriers:
                  rec['status']='STRUCTURES_RECORDED'; rec['structure_ids']=carriers[sid]
              else:
                  rec['status']='NO_DISTINCT_STRUCTURE'
              reviews[sid]=rec

          batches=prog.setdefault('audit_batches',[])
          batches[:]=[b for b in batches if b.get('batch_id')!=batch_id]
          batches.append({
            'batch_id':batch_id,
            'task_id':task_id,
            'status':'SUBMITTED_FOR_AUDIT',
            'source_ids':[s['source_id'] for s in sources],
            'sources_reviewed':60,
            'structures_added':1,
            'structures_updated':5,
            'structure_carrier_sources':7,
            'structures_deduped':53,
            'searches_completed':0,
            'arsenal_decisions':0,
            'audit_required':True,
            'duplicate_source':0,
            'no_distinct_structure':53
          })
          reg['status']='BATCH_SUBMITTED_FOR_AUDIT'
          regp.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')
          progp.write_text(json.dumps(prog,indent=2,ensure_ascii=False)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python scripts/verify_research_arsenal.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/structure-radar-batch-10-trigger.txt || true
          git rm -f .github/structure-radar-batch-10-selection.json .github/structure-radar-batch-10-bundle.txt || true
          git rm -f .github/structure-radar-batch-10-index-*.json .github/structure-radar-batch-10-regtail-*.json || true
          git rm -f .github/workflows/structure-radar-batch-10-select.yml .github/workflows/structure-radar-batch-10-finalize.yml || true
          git add docs/structure-radar
          python scripts/structure_radar.py verify
          python scripts/verify_research_arsenal.py
          git commit -m 'StructureRadar: review deep corpus batch 10'
          git push origin HEAD:structure-radar-deep-corpus-batch-10
