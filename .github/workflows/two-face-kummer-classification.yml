name: Two-face Kummer classification

on:
  pull_request:
    paths:
      - "data/two_face_cuboids_1e6_fixed.json"
      - "data/two_face_cuboids_1e6_kummer_classification.json"
      - "data/two_face_cuboids_1e6_kummer_report.json"
      - "docs/face-ratio-geometry-research.md"
      - "scripts/classify_two_face_kummer_curves.py"
      - "scripts/update_two_face_kummer_stage2_memo.py"
      - ".github/workflows/two-face-kummer-classification.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Kummer classification
        run: |
          python scripts/classify_two_face_kummer_curves.py \
            --write-derived generated-kummer-classification.json \
            --write-report generated-kummer-report.json
          cat generated-kummer-report.json

      - name: Compare committed outputs when present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pairs = [
              (
                  Path("data/two_face_cuboids_1e6_kummer_classification.json"),
                  Path("generated-kummer-classification.json"),
              ),
              (
                  Path("data/two_face_cuboids_1e6_kummer_report.json"),
                  Path("generated-kummer-report.json"),
              ),
          ]
          for committed, generated in pairs:
              if not committed.exists():
                  print(f"{committed} is not committed yet; skipping comparison")
                  continue
              expected = json.loads(committed.read_text(encoding="utf-8"))
              actual = json.loads(generated.read_text(encoding="utf-8"))
              if expected != actual:
                  raise SystemExit(f"{committed} differs from regenerated output")
          PY

      - name: Regenerate the stage-two research memo
        run: |
          python scripts/update_two_face_kummer_stage2_memo.py \
            --input docs/face-ratio-geometry-research.md \
            --output generated-face-ratio-geometry-research.md
          grep -n "4.9 既知24円錐曲線" generated-face-ratio-geometry-research.md
          grep -n "McKinnon型計数定理" generated-face-ratio-geometry-research.md
          if grep -P "\t" generated-face-ratio-geometry-research.md; then
            echo "Unexpected tab found in generated Markdown" >&2
            exit 1
          fi

      - name: Commit reproducible outputs to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cp generated-kummer-classification.json data/two_face_cuboids_1e6_kummer_classification.json
          cp generated-kummer-report.json data/two_face_cuboids_1e6_kummer_report.json
          cp generated-face-ratio-geometry-research.md docs/face-ratio-geometry-research.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/two_face_cuboids_1e6_kummer_classification.json \
            data/two_face_cuboids_1e6_kummer_report.json \
            docs/face-ratio-geometry-research.md
          if git diff --cached --quiet; then
            echo "Generated outputs are already current"
          else
            git commit -m "Record Kummer curve classification results"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Upload classification outputs
        uses: actions/upload-artifact@v4
        with:
          name: two-face-kummer-classification
          path: |
            generated-kummer-classification.json
            generated-kummer-report.json
            generated-face-ratio-geometry-research.md
