name: Stage32 residual32-01 pairing-prefix calibration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/residual-32-01-production/**'
      - 'stages/stage32/runkeys/residual32-01-pairing-prefix-calibration.json'
      - '.github/workflows/stage32-residual32-01-pairing-prefix-calibration.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        name: Verify fresh dedicated run-key generation
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          KEY='stages/stage32/runkeys/residual32-01-pairing-prefix-calibration.json'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          [ "$ACTION" = synchronize ] || exit 0
          [ -n "${BEFORE:-}" ] || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || exit 0
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          mapfile -t changed < <(git diff --name-only "$BEFORE" "$HEAD")
          [ "${#changed[@]}" -eq 1 ] || exit 0
          [ "${changed[0]}" = "$KEY" ] || exit 0
          python - "$BEFORE" "$KEY" <<'PY'
          import json, subprocess, sys
          before, key = sys.argv[1:]
          old = json.loads(subprocess.check_output(['git','show',f'{before}:{key}'], text=True))
          new = json.load(open(key))
          assert old['schema'] == new['schema'] == 'STAGE32_RESIDUAL32_01_PAIRING_PREFIX_RUNKEY_V1'
          assert new['workload'] == old['workload'] == 'PAIRING_PREFIX_REPRESENTATIVE_CALIBRATION'
          assert int(new['generation']) == int(old['generation']) + 1
          assert new['armed'] is True
          assert int(new['node_limit']) == 250000
          assert new['assignment_order'] == list(range(10)) + [29]
          assert new['representatives'] == [
              {'m':1,'genus':0,'degree':16,'exceptional_mass':8},
              {'m':2,'genus':0,'degree':8,'exceptional_mass':8},
              {'m':4,'genus':0,'degree':12,'exceptional_mass':8},
              {'m':8,'genus':0,'degree':10,'exceptional_mass':8},
          ]
          assert int(new['effective_heavy_concurrency']) == 1
          assert float(new['projected_peak_artifact_mb']) < 1.0
          assert new['B18_RELEASE_AUTHORIZED'] is False
          assert new['FULL_178_ROW_SWEEP_AUTHORIZED'] is False
          PY
          sed -i '$d' "$GITHUB_OUTPUT"
          echo 'authorized=true' >> "$GITHUB_OUTPUT"
      - name: Inspect nonexpiring retained Picard bundle
        run: |
          python - <<'PY'
          import importlib.util, json
          path='stages/stage33/33-07/picard_base_rows_retained.py'
          spec=importlib.util.spec_from_file_location('retained_picard',path)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          x=mod.load()
          def shape(v):
              if isinstance(v,list):
                  if v and isinstance(v[0],list): return [len(v),len(v[0])]
                  return [len(v)]
              return type(v).__name__
          print(json.dumps({'keys':sorted(x), 'shapes':{k:shape(x[k]) for k in sorted(x)}},sort_keys=True))
          PY

  calibrate:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: |
          python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run exact offline representative pairing-prefix calibration
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage32-residual32-01"
          python stages/stage32/residual-32-01-production/calibrate_representatives.py \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --output "$RUNNER_TEMP/stage32-residual32-01/calibration.json" \
            --node-limit 250000
      - name: Enforce scoped calibration contract
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'stage32-residual32-01'/'calibration.json'
          x=json.loads(p.read_text())
          assert x['schema']=='STAGE32_RESIDUAL32_01_RETAINED_BASIS_PREFIX_CALIBRATION_V1'
          assert x['coordinate_model']=='RETAINED_PRIMITIVE_BASIS_PAIRINGS_EXCEPTIONALS_FIRST'
          assert x['retained_picard_bundle_sha256']=='d1deeb3b0cb65fd52563355cd5497a2319ddd7bc9fe4aaeaca91449f155c998c'
          assert x['exceptional_basis_coordinate_count']==29
          assert x['curve_basis_coordinate_count']==35
          assert x['aut_used_in_probe'] is False
          assert x['leaf_aut_canonicalization_regressed_in_this_probe'] is False
          assert x['prefix_aut_canonical_augmentation_implemented'] is False
          assert x['representative_m_classes']==[1,2,4,8]
          assert len(x['representatives'])==4
          assert all(r['credit_scope']=='PAIRING_LATTICE_PREFIX_COST_PROFILE_ONLY' for r in x['representatives'])
          assert x['full_178_row_sweep_authorized'] is False
          assert x['B18_RELEASE_AUTHORIZED'] is False
          assert x['FULL_D16_G0_ROW_COMPLETE'] is False
          assert x['FULL_D176_D192_NUMERICAL_ORBIT_CENSUS'] is False
          assert x['R29_LG2']=='NOT_DISCHARGED'
          assert x['THEOREM_CREDIT'] is False and x['RECEIVER_CREDIT'] is False
          print(json.dumps({
              'nodes': {str(r['m']):r['nodes_visited'] for r in x['representatives']},
              'prunes': {str(r['m']):r['membership_prunes'] for r in x['representatives']},
              'oracle_build_seconds':x['oracle_build_seconds'],
              'transform_denominator':x['transform_certificate']['inverse_denominator'],
              'certificate_sha256':x['canonical_sha256_without_this_field'],
          },sort_keys=True))
          PY
          du -h "$RUNNER_TEMP/stage32-residual32-01/calibration.json"
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-residual32-01-pairing-prefix-calibration
          path: ${{ runner.temp }}/stage32-residual32-01/calibration.json
          retention-days: 7
          if-no-files-found: error
