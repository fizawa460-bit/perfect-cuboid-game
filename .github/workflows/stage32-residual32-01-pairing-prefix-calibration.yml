name: Stage32 residual32-01 pairing-prefix calibration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/residual-32-01-production/**'
      - 'stages/stage32/runkeys/residual32-01-pairing-prefix-calibration.json'
      - '.github/workflows/stage32-residual32-01-pairing-prefix-calibration.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        name: Verify fresh dedicated run-key generation
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          KEY='stages/stage32/runkeys/residual32-01-pairing-prefix-calibration.json'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          [ "$ACTION" = synchronize ] || exit 0
          [ -n "${BEFORE:-}" ] || exit 0
          git fetch --no-tags --depth=1 origin "$BEFORE" || exit 0
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || exit 0
          mapfile -t changed < <(git diff --name-only "$BEFORE" "$HEAD")
          [ "${#changed[@]}" -eq 1 ] || exit 0
          [ "${changed[0]}" = "$KEY" ] || exit 0
          python - "$BEFORE" "$KEY" <<'PY'
          import json, subprocess, sys
          before, key = sys.argv[1:]
          old = json.loads(subprocess.check_output(['git','show',f'{before}:{key}'], text=True))
          new = json.load(open(key))
          assert old['schema'] == new['schema'] == 'STAGE32_RESIDUAL32_01_PAIRING_PREFIX_RUNKEY_V1'
          assert new['workload'] == old['workload'] == 'PAIRING_PREFIX_REPRESENTATIVE_CALIBRATION'
          assert int(new['generation']) == int(old['generation']) + 1
          assert new['armed'] is True
          assert int(new['node_limit']) == 250000
          assert new['selection_mode'] == 'LOCKED_GENERATION6_DISCRIMINANT_ACTIVE_ORDER'
          assert new['assignment_order'] == [0,1,2,3,61,4,5,6,7,8,9]
          assert new['known_label_order_1based'] == [93,94,95,96,49,97,98,99,101,102,103]
          assert new['coordinate_model'] == 'AUT_EQUIVARIANT_ALL140_KNOWN_CURVE_PAIRINGS_TO_PICARD64_HNF'
          assert new['aut_mode'] == 'EXACT_AUT1536_ALL140_GLOBAL_BUDGET_CLASS_PREFIX_STABILIZER_LEX_MIN'
          assert new['representatives'] == [
              {'m':1,'genus':0,'degree':16,'exceptional_mass':8},
              {'m':2,'genus':0,'degree':8,'exceptional_mass':8},
              {'m':4,'genus':0,'degree':12,'exceptional_mass':8},
              {'m':8,'genus':0,'degree':10,'exceptional_mass':8},
          ]
          assert int(new['effective_heavy_concurrency']) == 1
          assert float(new['projected_peak_artifact_mb']) < 1.0
          assert new['B18_RELEASE_AUTHORIZED'] is False
          assert new['FULL_178_ROW_SWEEP_AUTHORIZED'] is False
          assert new['THEOREM_CREDIT'] is False
          assert new['RECEIVER_CREDIT'] is False
          PY
          sed -i '$d' "$GITHUB_OUTPUT"
          echo 'authorized=true' >> "$GITHUB_OUTPUT"
      - name: Inspect nonexpiring retained exact Stage32 marking
        run: |
          python - <<'PY'
          import importlib.util, json
          path='stages/stage33/33-07/stage32_picard_marking_retained.py'
          spec=importlib.util.spec_from_file_location('retained_stage32_marking',path)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          x=mod.load(); a=x['aut_action']
          print('MARKING_META='+json.dumps({
              'schema':x['schema'], 'canonical_sha256':x['canonical_sha256'],
              'stage32_picard_core_sha256':x['stage32_picard_core_sha256'],
              'stage32_aut_action_sha256':x['stage32_aut_action_sha256'],
              'hperp_text_sha256':x['hperp_text_sha256'],
              'source_artifact':x['source_artifact']},sort_keys=True))
          print('AUT_META='+json.dumps({
              'schema':a['schema'],'permutation_count':a['permutation_count'],
              'stored_permutations':len(a['permutations_1based']),
              'permutation_degree':len(a['permutations_1based'][0]),
              'canonical_sha256':a['canonical_sha256_without_this_field']},sort_keys=True))
          def describe(obj, path='$', depth=0):
              if depth > 3:
                  return []
              out=[]
              if isinstance(obj, dict):
                  out.append({'path':path,'type':'dict','keys':sorted(obj.keys())[:80],'key_count':len(obj)})
                  for k,v in obj.items():
                      if depth < 2:
                          out.extend(describe(v, path+'.'+str(k), depth+1))
              elif isinstance(obj, list):
                  item_types=sorted({type(v).__name__ for v in obj[:20]})
                  row_lengths=[]
                  for v in obj[:20]:
                      if isinstance(v,(list,tuple,dict,str)):
                          try: row_lengths.append(len(v))
                          except Exception: pass
                  out.append({'path':path,'type':'list','len':len(obj),'item_types':item_types,'sample_lengths':row_lengths[:20]})
                  if obj and depth < 2:
                      out.extend(describe(obj[0], path+'[0]', depth+1))
              elif isinstance(obj, str):
                  out.append({'path':path,'type':'str','len':len(obj),'prefix':obj[:120]})
              else:
                  out.append({'path':path,'type':type(obj).__name__,'value':obj if isinstance(obj,(int,float,bool,type(None))) else None})
              return out
          print('MARKING_STRUCTURE='+json.dumps(describe(x),sort_keys=True))
          PY

  calibrate:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: |
          python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Run exact offline all140 HNF plus prefix Aut1536 representative calibration
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage32-residual32-01"
          python stages/stage32/residual-32-01-production/calibrate_representatives.py \
            --retained stages/stage33/33-07/picard_base_rows_retained.py \
            --marking stages/stage33/33-07/stage32_picard_marking_retained.py \
            --output "$RUNNER_TEMP/stage32-residual32-01/calibration.json" \
            --node-limit 250000
      - name: Enforce scoped calibration contract
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'stage32-residual32-01'/'calibration.json'
          x=json.loads(p.read_text())
          assert x['schema']=='STAGE32_RESIDUAL32_01_AUT_EQUIVARIANT_ALL140_CALIBRATION_V4'
          assert x['coordinate_model']=='AUT_EQUIVARIANT_ALL140_KNOWN_CURVE_PAIRINGS_TO_PICARD64_HNF'
          assert x['selected_assignment_order_source']=='LOCKED_FROM_GENERATION6_DISCRIMINANT_ACTIVE_SELECTION'
          assert x['selected_assignment_order']==[0,1,2,3,61,4,5,6,7,8,9]
          assert x['known_label_order_1based']==[93,94,95,96,49,97,98,99,101,102,103]
          assert x['gen6_depth5_active_known_label_1based']==49
          assert x['retained_picard_bundle_sha256']=='d1deeb3b0cb65fd52563355cd5497a2319ddd7bc9fe4aaeaca91449f155c998c'
          assert x['adapter_certificate']['known_curve_count']==140
          assert x['adapter_certificate']['picard_rank']==64
          assert x['adapter_certificate']['basis_row_regression_count']==64
          assert x['adapter_certificate']['basis_row_regression_exact'] is True
          assert x['aut_mode']=='EXACT_AUT1536_ALL140_GLOBAL_BUDGET_CLASS_PREFIX_STABILIZER_LEX_MIN'
          assert x['aut_used_in_probe'] is True
          assert x['prefix_aut_canonical_augmentation_implemented'] is True
          assert x['selected64_setwise_preservation_required'] is False
          assert x['full_aut_group_order']==1536
          assert x['global_budget_class_preserving_subgroup_size'] >= 1
          assert len(x['aut_certificate']['checks'])==11
          assert len(x['distinct_prefix_actions_by_depth'])==11
          assert x['representative_m_classes']==[1,2,4,8]
          assert len(x['representatives'])==4
          assert all(r['credit_scope']=='ALL140_PAIRING_LATTICE_AND_PREFIX_AUT_COST_PROFILE_ONLY' for r in x['representatives'])
          assert all(r['total_exact_prunes']==r['membership_prunes']+r['symmetry_prunes'] for r in x['representatives'])
          assert x['full_178_row_sweep_authorized'] is False
          assert x['B18_RELEASE_AUTHORIZED'] is False
          assert x['FULL_D16_G0_ROW_COMPLETE'] is False
          assert x['FULL_D176_D192_NUMERICAL_ORBIT_CENSUS'] is False
          assert x['R29_LG2']=='NOT_DISCHARGED'
          assert x['THEOREM_CREDIT'] is False and x['RECEIVER_CREDIT'] is False
          print(json.dumps({
              'known_labels':x['known_label_order_1based'],
              'adapter_paths':x['adapter_certificate']['discovery_paths'],
              'adapter_modes':x['adapter_certificate']['discovery_modes'],
              'active_rows':x['active_congruence_rows_by_depth'],
              'full_aut_group_order':x['full_aut_group_order'],
              'global_budget_subgroup_size':x['global_budget_class_preserving_subgroup_size'],
              'prefix_actions':x['distinct_prefix_actions_by_depth'],
              'nodes':{str(r['m']):r['nodes_visited'] for r in x['representatives']},
              'membership_prunes':{str(r['m']):r['membership_prunes'] for r in x['representatives']},
              'symmetry_prunes':{str(r['m']):r['symmetry_prunes'] for r in x['representatives']},
              'terminals':{str(r['m']):r['terminal_prefixes_before_stop'] for r in x['representatives']},
              'adapter_build_seconds':x['adapter_build_seconds'],
              'oracle_build_seconds':x['oracle_build_seconds'],
              'aut_build_seconds':x['aut_build_seconds'],
              'certificate_sha256':x['canonical_sha256_without_this_field'],
          },sort_keys=True))
          PY
          du -h "$RUNNER_TEMP/stage32-residual32-01/calibration.json"
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-residual32-01-pairing-prefix-calibration
          path: ${{ runner.temp }}/stage32-residual32-01/calibration.json
          retention-days: 7
          if-no-files-found: error
