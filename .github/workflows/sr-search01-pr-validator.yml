name: StructureRadar SR-SEARCH-01 PR validator
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sr-search01-apply
      - name: Reuse apply block
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,textwrap
          text=pathlib.Path('.github/workflows/sr-search01-apply.yml').read_text()
          marker="python - <<'PY'\n"
          block=text.split(marker,1)[1].split('\n          PY',1)[0]
          exec(textwrap.dedent(block),{})
          PY
      - name: Refresh verify and assert
        shell: bash
        run: |
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git diff --check
          python - <<'PY'
          import json,pathlib
          r=pathlib.Path('.')
          reg=json.loads((r/'docs/structure-radar/structure-registry.json').read_text())
          cards={c['structure_id']:c for c in reg['structures']}
          ids=[f'SR-STR-{i:03d}' for i in range(1,7)]
          assert all(cards[x]['search_status']=='SEARCHED' for x in ids)
          assert all(cards[x]['arsenal_decision']=='ACTIVE' for x in ids)
          c=json.loads((r/'docs/structure-radar/controller.json').read_text())
          assert c['registry']['unresolved_search_count']==197,c['registry']
          assert c['registry']['pending_arsenal_decision_count']==211,c['registry']
          q=json.loads((r/'docs/structure-radar/exploration-queue.json').read_text())
          ready=next(t for t in q['tasks'] if t['status']=='READY')
          assert ready['phase']=='LITERATURE_SEARCH'
          assert ready['structure_ids']==[f'SR-STR-{i:03d}' for i in range(7,13)],ready
          assert len(q['tasks'])==33,len(q['tasks'])
          print('SR_SEARCH01_VALIDATED',ready['task_id'],ready['structure_ids'])
          PY
      - name: Commit validated official blobs
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/structure-radar
          git commit -m 'Temp: validate SR-SEARCH-01 official blobs' || true
          git push origin HEAD:agent/sr-search01-apply
