name: Stage35-EX Goal4AF direct S C5 imageinPic extraction

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage35-ex/probe_stage35_ex_35_goal4af_c5_surface_imageinpic.py'
      - 'stages/stage35-ex/runkeys/goal4af-c5-surface-imageinpic.json'
      - '.github/workflows/stage35-ex-goal4af-c5-surface-imageinpic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage35-ex-goal4af-c5-surface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          KEY='stages/stage35-ex/runkeys/goal4af-c5-surface-imageinpic.json'
          echo 'authorized=false' >> "$GITHUB_OUTPUT"
          test '${{ github.event_name }}' = 'pull_request' || exit 0
          test "${PR_NUMBER}" = '1659' || exit 0
          test "${HEAD_REF}" = 'stage35-ex-goal4x-open-receiver-boundary-picard' || exit 0
          test -n "${BEFORE}" || exit 0
          git fetch --no-tags --depth=1 origin "${BEFORE}" || exit 0
          git diff --name-only "${BEFORE}" "${HEAD_SHA}" | grep -Fxq "${KEY}" || exit 0
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          key=Path('stages/stage35-ex/runkeys/goal4af-c5-surface-imageinpic.json')
          probe=Path('stages/stage35-ex/probe_stage35_ex_35_goal4af_c5_surface_imageinpic.py')
          new=json.loads(key.read_text())
          assert new['schema']=='STAGE35_EX_GOAL4AF_C5_SURFACE_IMAGEINPIC_RUNKEY_V1'
          assert new['armed'] is True and new['generation']==1
          assert new['route']=='DIRECT_SURFACE_C5_IMAGEINPIC_PLUS_LEMMA11'
          assert new['upstream_git_blob_sha1']=='0422b69847f2afb97cb7b3ed02ebef91279f61b1'
          def blob(p):
              raw=p.read_bytes()
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob(probe)==new['probe_blob_sha1']=='bbc73b288ef926339314fe74c136b69c39b5745c'
          assert new['stage33_source_helper_blob_sha1']=='010db3767b8f932c71ac5722b50ccb64a8c79f9d'
          assert new['planned_jobs']==1 and new['planned_shards']==1
          assert new['persisted_output_upper_bound_bytes']<=131072
          assert new['actions_artifact_upload'] is False
          print('GOAL4AF_RUNKEY_AUTHORIZED=true')
          PY
          echo 'authorized=true' >> "$GITHUB_OUTPUT"

  extract:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Direct S-side C5 imageinPic extraction and Lemma11 pair correction
        run: |
          set -euo pipefail
          python -B stages/stage35-ex/probe_stage35_ex_35_goal4af_c5_surface_imageinpic.py | tee /tmp/goal4af-c5.log
          grep -q '^GOAL4AF_DIAGNOSTIC_JSON=' /tmp/goal4af-c5.log
      - name: Enforce diagnostic no-credit boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          lines=Path('/tmp/goal4af-c5.log').read_text().splitlines()
          s=next(x.split('=',1)[1] for x in lines if x.startswith('GOAL4AF_DIAGNOSTIC_JSON='))
          d=json.loads(s)
          assert d['individual_C5_count']==16
          assert d['pair_count']==8
          assert d['goal4ac_residual_pair_count']==4
          assert d['target_span_computed'] is False
          assert d['theorem_credit'] is False
          assert d['endpoint_credit'] is False
          print('GOAL4AF_DIAGNOSTIC_BOUNDARY=PASS')
          PY
