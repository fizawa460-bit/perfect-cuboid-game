name: Stage14-4cw nonprop 19/34 proportional 9/16

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4cw/**'
      - 'stages/stage14/data/14-4/nonprop_19_34_prop_9_16_summary.json'
      - 'stages/stage14/scripts/14-4/nonprop_19_34_prop_9_16_audit.py'
      - '.github/workflows/stage14-4cw-nonprop-19-34-prop-9-16.yml'
      - 'stages/stage14/14-4cv/**'
      - 'stages/stage14/14-s7-35/**'
      - 'stages/stage14/14-4cu/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage14-4cw deterministic audit
        run: python stages/stage14/scripts/14-4/nonprop_19_34_prop_9_16_audit.py

      - name: Compile Stage14-4cw audit
        run: python -m py_compile stages/stage14/scripts/14-4/nonprop_19_34_prop_9_16_audit.py

      - name: Stage14-4cv regression
        run: python stages/stage14/scripts/14-4/row_column_cofactor_7_12_audit.py

      - name: Stage14-s7-35 regression
        run: python stages/stage14/scripts/14-s7-35/extra_gcd_collapse_4_7_audit.py

      - name: Stage14-4cu regression
        run: python stages/stage14/scripts/14-4/orientation_linear_product_19_32_audit.py

      - name: Boundary locks
        run: |
          f=stages/stage14/14-4cw/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=9/16' "$f"
          grep -Fq 'NONPROPORTIONAL_BRANCH_UPPER_BOUND_EXPONENT=19/34' "$f"
          grep -Fq 'PROPORTIONAL_BRANCH_UPPER_BOUND_EXPONENT=9/16' "$f"
          grep -Fq 'REMAINING_RECEIVER=NineSixteenthsProportionalEndpointScaleKResidualGaussianGcdIncidence' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-4cx' "$f"
