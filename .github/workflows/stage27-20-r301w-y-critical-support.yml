name: Stage27-20-r301w-y critical support weapon audit

on:
  push:
    branches:
      - agent/stage27-20-r301w-y-critical-support
  pull_request:
    paths:
      - 'stages/stage27/27-20-r301w/**'
      - 'stages/stage27/27-20-r301x/**'
      - 'stages/stage27/27-20-r301y/**'
      - 'stages/stage27/27-20-r301w-y/**'
      - '.github/workflows/stage27-20-r301w-y-critical-support.yml'

jobs:
  verify-stage27-20-r301w-y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage27-20-r301w-y
        run: python stages/stage27/27-20-r301w-y/verify_27_20_r301w_y.py
      - name: Validate batch JSON
        run: |
          python -m json.tool stages/stage27/27-20-r301w-y/batch-registry.json >/dev/null
          python -m json.tool stages/stage27/27-20-r301w-y/controller-sync-delta.json >/dev/null
      - name: Verify parent Stage27-20-r301 contract
        run: python stages/stage27/27-20-r301/verify_27_20_r301.py
      - name: Diff hygiene
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
