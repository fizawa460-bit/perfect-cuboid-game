name: Stage32EX5 BC2-30 bounded executor
# lifecycle: ACTIVE_AUTO — current one-generation BC2-30 executor; remove after retained result

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'stages/stage32-ex5/runkeys/bc2-30-boundary42-partition.json'
      - '.github/workflows/stage32-ex5-bc2-30.yml'

permissions:
  contents: read

jobs:
  authorize-bc2-30:
    runs-on: ubuntu-24.04
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: gate
        name: Authorize only fresh BC2-30 generation-1 runkey
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          key=Path('stages/stage32-ex5/runkeys/bc2-30-boundary42-partition.json')
          before=os.environ.get('BEFORE','').strip(); head=os.environ.get('HEAD_SHA','').strip()
          authorized=False; reason='cold'
          if before and head and key.exists():
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',before],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              old_ok=subprocess.run(['git','cat-file','-e',before+'^{commit}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if old_ok:
                  changed=subprocess.check_output(['git','diff','--name-only',before,head],text=True).splitlines()
                  if str(key) in changed:
                      r=json.loads(key.read_text())
                      try:
                          old=json.loads(subprocess.check_output(['git','show',before+':'+str(key)],text=True,stderr=subprocess.DEVNULL))
                          generation_ok=int(r.get('generation',0))>int(old.get('generation',0))
                      except subprocess.CalledProcessError:
                          generation_ok=False
                      source='stages/stage32-ex5/breadth-cycle-2/bc2_30_boundary42_partition.py'
                      manifest='stages/stage32-ex5/breadth-cycle-2/bc2-30-residual-p39-leaf-manifest.json'
                      preflight='stages/stage32-ex5/breadth-cycle-2/bc2-30-boundary42-partition-preflight.json'
                      sb=subprocess.check_output(['git','hash-object',source],text=True).strip()
                      mb=subprocess.check_output(['git','hash-object',manifest],text=True).strip()
                      pb=subprocess.check_output(['git','hash-object',preflight],text=True).strip()
                      a=r.get('audit_consumption',{}); t=r.get('target',{}); ex=r.get('execution',{})
                      authorized=(r.get('schema')=='STAGE32EX5_BC2_30_BOUNDARY42_PARTITION_RUNKEY_V1'
                          and r.get('generation')==1 and r.get('armed') is True and generation_ok
                          and a.get('bc2_29_hostile_audit_status')=='PASS'
                          and a.get('bc2_29_hostile_audit_exact_head')=='ca8e0ea7209b898d24d5f647dcce11be1aff03b2'
                          and a.get('bc2_29_hostile_audit_review_id')==5183342658
                          and r.get('source_git_blob_sha')==sb=='9e9a681ecab2bd0a2ad0a1877a855b09e356a54d'
                          and r.get('residual_manifest_git_blob_sha')==mb=='4f1dcec4d2956309cecddd79f05cd275120999f0'
                          and r.get('preflight_git_blob_sha')==pb=='de79e172ad43e7b99d27b2096e2a40835eec33ed'
                          and r.get('bc2_29_checkpoint_canonical')=='e02b94819d44d0d74e5ce393746efcc4b069075f98c4c00ad2895246e941fe1d'
                          and r.get('residual_manifest_canonical')=='c984fa8cb1b2d64fe3ae16dee56f521d25341ae08200898b8baec4739ca1ca64'
                          and r.get('preflight_canonical')=='771ef6c2fb29b0aaf7612820d8892ba32e477814819219304880f6d83c6fcd4e'
                          and t.get('retained_unknown_parent_count')==1
                          and t.get('residual_unknown_p39_leaf_count')==1
                          and t.get('maximum_subbranch_checks')==4
                          and t.get('unretained_bc2_19_unknown_identity_count')==172
                          and ex.get('per_subbranch_timeout_ms')==2000
                          and ex.get('effective_heavy_concurrency')==1
                          and ex.get('heavy_scaleout_authorized') is False)
                      reason='fresh-runkey' if authorized else 'semantic-gate-failed'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('authorized='+('true' if authorized else 'false')+'\n')
          print('BC2-30 authorized:',authorized,'reason:',reason,'before:',before,'head:',head)
          PY

  bc2-30-boundary42-bounded:
    needs: authorize-bc2-30
    if: needs.authorize-bc2-30.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact BC2-30 dependencies
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0' 'z3-solver==4.15.4.0'
      - name: Verify audited BC2-29 predecessor and BC2-30 authorization
        run: |
          python stages/stage32-ex5/breadth-cycle-2/verify_bc2_29_boundary39_partition_checkpoint.py
          python - <<'PY'
          import json
          s=json.load(open('stages/stage32-ex5/MAIN-STATE.json'))
          a=s['intermediate_audit_boundary']
          assert s['schema']=='STAGE32EX5_MAIN_COMPACT_STATE_V13_BC2_29_AUDIT_CONSUMED_BC2_30_EXECUTION'
          assert a['last_hostile_audit_status']=='PASS'
          assert a['last_hostile_audit_exact_head']=='ca8e0ea7209b898d24d5f647dcce11be1aff03b2'
          assert a['last_hostile_audit_review_id']==5183342658
          assert a['bc2_30_execution_authorized'] is True
          assert a['bc2_31_execution_authorized'] is False
          PY
          python stages/stage32/proof/verify_stage32_claim_dag.py --integrity
          python stages/stage32/proof/verify_stage32_active_frontier.py
      - name: Compile BC2-30 producer
        run: python -m py_compile stages/stage32-ex5/breadth-cycle-2/bc2_30_boundary42_partition.py
      - name: Run bounded BC2-30 boundary42 exact partition
        run: |
          python stages/stage32-ex5/breadth-cycle-2/bc2_30_boundary42_partition.py \
            --per-subbranch-timeout-ms 2000 \
            --output "$RUNNER_TEMP/bc2-30.json"
          cat "$RUNNER_TEMP/bc2-30.json"
      - name: Validate BC2-30 scope firewalls
        run: |
          python - "$RUNNER_TEMP/bc2-30.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['audit_consumption']['bc2_29_hostile_audit_status']=='PASS'
          assert p['audit_consumption']['bc2_29_hostile_audit_review_id']==5183342658
          assert p['target']['checked_parent_indices']==[1064]
          assert p['target']['checked_bc2_29_unknown_p39_leaf_count']==1
          assert p['target']['unretained_bc2_19_unknown_identity_count']==172
          assert p['partition_certificate']['boundary_pairing_label']==42
          assert p['partition_certificate']['coverage_exact'] is True
          assert p['partition_certificate']['disjoint'] is True
          assert p['partition_certificate']['maximum_possible_subbranch_count']==4
          assert p['credit']['whole_first_block_unsat'] is False
          assert p['credit']['full178_complete'] is False
          assert p['credit']['stage32_main_credit'] is False
          assert p['firewalls']['unknown_relabelled_unsat'] is False
          assert p['firewalls']['partition_leaf_unknown_dropped'] is False
          assert p['firewalls']['main_promotion'] is False
          assert p['firewalls']['merge_authorized'] is False
          assert p['firewalls']['perfect_cuboid_existence_claim'] is False
          assert p['firewalls']['perfect_cuboid_nonexistence_claim'] is False
          print('BC2_30_SCOPE_OK',p['status'],p['canonical_sha256_without_this_field'])
          PY
      - name: Upload BC2-30 exact result
        uses: actions/upload-artifact@v4
        with:
          name: stage32ex5-bc2-30-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/bc2-30.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
