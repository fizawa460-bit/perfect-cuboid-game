name: Stage33 V91C1X R5B3B3C2C strict-prime norm materialize

on:
  push:
    branches:
      - stage33-v91c1x-r5b2d0-swap23-source-lock
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c2c-orbit-representative-strict-prime-decomposition-and-transport-materialize.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c2c_orbit_representative_strict_prime_decomposition_and_transport.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage33-v91c1x-r5b2d0-swap23-source-lock
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Materialize C2C strict-prime certificate
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c2c_orbit_representative_strict_prime_decomposition_and_transport.py --write
      - name: Bound generated delta
        shell: bash
        run: |
          git diff --check
          test "$(git status --porcelain | wc -l)" -eq 1
          git status --porcelain | grep 'stages/stage33/33-12/e3-v91c1x-r5b3b3c2c-orbit-representative-strict-prime-decomposition-and-transport.json'
      - name: Commit exact generated certificate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stages/stage33/33-12/e3-v91c1x-r5b3b3c2c-orbit-representative-strict-prime-decomposition-and-transport.json
          git commit -m '[Stage33] materialize R5B3B3C2C strict-prime certificate'
          git push origin HEAD:stage33-v91c1x-r5b2d0-swap23-source-lock
