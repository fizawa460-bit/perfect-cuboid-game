name: Stage14-s7-24 rank-two Plucker root line

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-24/**'
      - 'stages/stage14/scripts/14-s7-24/**'
      - '.github/workflows/stage14-s7-24-rank2-plucker-root-line.yml'
      - 'stages/stage14/14-s7-23/**'
      - 'stages/stage14/14-X1/**'
      - 'stages/stage14/14-4ci/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run s7-24 Plucker/root-line audit
        run: python stages/stage14/scripts/14-s7-24/rank2_plucker_root_line_audit.py

      - name: Run merged s7-23 regression
        run: python stages/stage14/scripts/14-s7-23/rank3_primary_support_audit.py

      - name: Run merged X1 joint-fiber regression
        run: python stages/stage14/scripts/14-X1/joint_physical_fiber_audit.py

      - name: Run merged 4ci regression
        run: python stages/stage14/scripts/14-4/full_k_dual_common_core_audit.py

      - name: Check merged s7-23 boundary
        run: |
          f=stages/stage14/14-s7-23/result.md
          grep -Fq 'STAGE14_S7_23=COMPLETE_CELLWISE_DUAL_SUPPORT_AND_RANK_THREE_ENDPOINT_ELIMINATION' "$f"
          grep -Fq 'RANK3_PHYSICAL_ENDPOINT_PACKETS_EXIST=false' "$f"
          grep -Fq 'NEXT=Stage14-s7-24' "$f"

      - name: Check merged X1 boundary
        run: |
          f=stages/stage14/14-X1/result.md
          grep -Fq 'STAGE14_X1=COMPLETE_JOINT_COMMON_CORE_CRT_PHYSICAL_FIBER_LEMMA' "$f"
          grep -Fq 'JOINT_COMMON_CORE_CRT_PHYSICAL_FIBER_LEMMA_PROVED=true' "$f"
          grep -Fq 'JOINT_PHYSICAL_FIBER_BO1_PROVED=true' "$f"

      - name: Check merged 4ci boundary
        run: |
          f=stages/stage14/14-4ci/result.md
          grep -Fq 'STAGE14_4CI=COMPLETE_COMMON_CORE_FULL_K_DUAL_SATURATION_AND_NORMALIZED_HOST_REDUCTION' "$f"
          grep -Fq 'K_DUAL_SATURATION_ORDER=k^2' "$f"
          grep -Fq 'K_DUAL_DEFECT=1' "$f"
          grep -Fq 'DYADIC_RESIDUAL_TRIPLE_SUPPORT_EXPONENT=2*(theta+phi)-1/2' "$f"

      - name: Lock s7-24 theorem boundary
        run: |
          f=stages/stage14/14-s7-24/result.md
          grep -Fq 'STAGE14_S7_24=COMPLETE_RANK_TWO_PLUCKER_ELIMINATION_AND_PRIMITIVE_ROOT_LINE_SATURATION' "$f"
          grep -Fq 'XI_RANK2_J2_DIVIDES_P13=true' "$f"
          grep -Fq 'XI_RANK2_T2_DIVIDES_P14=true' "$f"
          grep -Fq 'XI_RANK2_S2_DIVIDES_P23=true' "$f"
          grep -Fq 'XI_RANK2_R2_DIVIDES_P24=true' "$f"
          grep -Fq 'XI_RANK2_PHYSICAL_ENDPOINT_PACKETS_EXIST=false' "$f"
          grep -Fq 'XI_PHYSICAL_ENDPOINT_SHORT_RANK_EXACT=1' "$f"
          grep -Fq 'XI_ROOT_LINE_QUOTIENT_SATURATION_ORDER=xi^2' "$f"
          grep -Fq 'XI_ROOT_LINE_DUAL_DEFECT=1' "$f"
          grep -Fq 'PRIMITIVE_ROOT_DIRECTION_COMMON_CORE_CELL_MULTIPLICITY_PROVED=false' "$f"
          grep -Fq 'UNIQUE_CONDITIONAL_7_8_SATURATION_CORNER=(theta,phi)=(5/16,1/4)' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=7/8' "$f"
          grep -Fq 'TH16_NEEDED_BY_S7_24=false' "$f"
          grep -Fq 'NEXT=Stage14-s7-25' "$f"
