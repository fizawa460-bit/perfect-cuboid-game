name: Stage15-6bc weighted twist gate

on:
  pull_request:
    paths:
      - 'stages/stage15/15-6bc/**'
      - 'stages/stage15/evidence/stage15_6bc_weighted_twist_gate.json'
      - 'stages/stage15/replay/verify_stage15_6bc.py'
      - 'stages/stage15/scripts/stage15_6bc_weighted_twist_gate.py'
      - '.github/workflows/stage15-6bc-weighted-twist-gate.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python stages/stage15/replay/verify_stage15_6bc.py
      - run: python -m py_compile stages/stage15/scripts/stage15_6bc_weighted_twist_gate.py
