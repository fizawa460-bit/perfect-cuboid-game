name: Stage32 MAIN BTVA static7 normalmass bounded panel

# Trigger lifecycle: ACTIVE_AUTO — one-shot e=12 retained-basis pairing pilot.
# Restricted to this workflow file on the active MAIN research branch; retire after artifact retention.
on:
  workflow_dispatch:
  push:
    branches:
      - stage32-main-v44-btva-static7-20260918
    paths:
      - '.github/workflows/stage32-main-btva-static7-normalmass-bounded-panel.yml'

permissions:
  contents: read

concurrency:
  group: stage32-main-btva-static7-normalmass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-panel:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Checkout exact 178 source
        uses: actions/checkout@v4
        with:
          ref: e60f03cf5105bc6e26cb4615acabd6fe0c07625c
          path: .stage32-178-btva-panel
          fetch-depth: 1

      - name: Assert exact source locks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/run_btva_static7_normalmass_bounded_panel.py)" = "971cf6bab500eefd04bbef870807f1badc8b07c4"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/run_btva_static7_bounded_panel.py)" = "e44bec7ad9c0b7a4d8d7d87a455f181a681035c6"
          test "$(git hash-object stages/stage32-ex5/breadth-cycle-2/bc2_02_one_indexed_full178_terminal_to_picard64_completion.py)" = "6b4c3514b5b4cbccd8e66cbffc7f61f8830d1633"
          test "$(git hash-object stages/stage32-ex5/breadth-cycle-2/bc2-01b-runtime-node-coordinate-bridge.json)" = "2a14a683e8ec38ec993eb711841c466f2be6eb06"
          test "$(git hash-object stages/stage32/residual-32-01-production/full178-manifest.json)" = "0a46b34e278688240656b4977e9cb7f589e90e06"
          test "$(git -C .stage32-178-btva-panel rev-parse HEAD)" = "e60f03cf5105bc6e26cb4615acabd6fe0c07625c"
          test "$(git -C .stage32-178-btva-panel hash-object stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_aggregate_picard_lattice_preflight.py)" = "5fa9f1d67d6411cb550230b62398aff7bd6488ff"

      - name: Set up exact solver Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'

      - name: Install exact solver dependencies
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'

      - name: Run BTVA static7 normalmass panel
        run: |
          python stages/stage32/management/btva-compressed-lift/run_btva_static7_normalmass_bounded_panel.py             --retained stages/stage33/33-07/picard_base_rows_retained.py             --marking stages/stage33/33-07/stage32_picard_marking_retained.py             --lane178-root .stage32-178-btva-panel             --solver-timeout-ms 10000             --max-flat-cuts 32             --output "$RUNNER_TEMP/btva-static7-normalmass-panel.json"

      - name: Validate zero-credit result
        run: |
          python - "$RUNNER_TEMP/btva-static7-normalmass-panel.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p["schema"]=="STAGE32_MAIN_BTVA_STATIC7_NORMALMASS_BOUNDED_PANEL_V1"
          assert p["target"]["row_id"]=="g0-d008"
          assert p["target"]["normal_mass"]==112
          assert p["target"]["exceptional_mass"]==8
          assert p["decision_problem"]["all140_pairings_nonnegative"] is True
          assert p["decision_problem"]["normal_pairing_sum"]==112
          assert p["decision_problem"]["exceptional_pairing_sum"]==8
          assert p["firewalls"]["main_pruning_credit"] is False
          assert p["firewalls"]["known_32_plane_conics_closed"] is False
          assert p["firewalls"]["merge_authorized"] is False
          print(json.dumps({"summary":p["summary"],"canonical":p["canonical_sha256_without_this_field"]},sort_keys=True))
          PY

      - name: Upload bounded panel evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-main-btva-static7-normalmass-bounded-panel
          path: ${{ runner.temp }}/btva-static7-normalmass-panel.json
          retention-days: 7
          compression-level: 9


  e12-basis-pairing-pilot:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact MAIN research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Checkout exact 178 compressed-Picard source
        uses: actions/checkout@v4
        with:
          ref: e60f03cf5105bc6e26cb4615acabd6fe0c07625c
          path: .stage32-178-btva-panel
          fetch-depth: 1

      - name: Assert exact e12 pilot source locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/BTVA-D8-V43-HPADJ21-ROW-REFERENCE.json)" = "386a3f8f9e279ebd9608d7ac21a47715b1a964fc"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/run_btva_d8_retained_basis_pairing_pilot.py)" = "cba3a0d797ffcc829ef24922830c83afd83d982e"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/run_btva_base4_full343_shard.py)" = "63321a54f565b2da38efbef756caf8db148f0063"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/BTVA-D8-ALL140-RECEIVER-SEMANTICS-RETAINED.json)" = "c4c94fc8e2b45ee51660fe3665160fde98659056"
          test "$(git hash-object stages/stage32/management/btva-compressed-lift/BTVA-D8-PLANE-CONIC-EXCEPTION-SEPARATION.json)" = "75d384c194c678ff6158ea793e943bce91741bb8"
          test "$(git -C .stage32-178-btva-panel rev-parse HEAD)" = "e60f03cf5105bc6e26cb4615acabd6fe0c07625c"
          test "$(git -C .stage32-178-btva-panel hash-object stages/stage32/32-01-178/fibration-nef/verify_fibration_nef_aggregate_picard_lattice_preflight.py)" = "5fa9f1d67d6411cb550230b62398aff7bd6488ff"

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'

      - name: Install exact solver dependencies
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.15.4.0'

      - name: Run e12 retained-basis pairing top16 pilot
        shell: bash
        run: |
          python - "$RUNNER_TEMP/btva-d8-e12-basis-pairing-top16.json" <<'PY'
          from __future__ import annotations
          import hashlib,importlib.util,json,math,sys
          from pathlib import Path
          import sympy
          from sympy import Matrix
          from sympy.matrices.normalforms import hermite_normal_form
          from z3 import Int,SolverFor,sat,unknown,unsat

          ROOT=Path.cwd()
          REF=ROOT/"stages/stage32/management/btva-compressed-lift/BTVA-D8-V43-HPADJ21-ROW-REFERENCE.json"
          FULL_WORKER=ROOT/"stages/stage32/management/btva-compressed-lift/run_btva_base4_full343_shard.py"
          DEGREE=8; E=12; NORMAL_MASS=92; NORMAL_COUNT=92; EXCEPTIONAL_COUNT=48; PICARD_RANK=64
          TIMEOUT=2500; MAX_CUTS=64; EXPECTED_GRAM_DET=268435456

          def req(v,msg):
              if not v: raise SystemExit("FAIL: "+msg)
          def csha(v):
              return hashlib.sha256(json.dumps(v,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest()
          def load_module(path,name):
              spec=importlib.util.spec_from_file_location(name,path)
              req(spec is not None and spec.loader is not None,"module spec "+str(path))
              mod=importlib.util.module_from_spec(spec);sys.modules[name]=mod;spec.loader.exec_module(mod);return mod
          def linear(coeffs,vars):
              return sum(int(coeffs[j])*vars[j] for j in range(len(vars)))
          def functional_u_coeffs(coeffs,gram_inv):
              q=Matrix([[int(v) for v in coeffs]])*gram_inv
              req(q.shape==(1,PICARD_RANK),"functional transform shape")
              req(all(sympy.denom(v)==1 for v in q),"functional transform integrality")
              return [int(q[0,j]) for j in range(PICARD_RANK)]

          ref=json.loads(REF.read_text())
          stored=ref["canonical_sha256_without_this_field"]
          body=dict(ref);body.pop("canonical_sha256_without_this_field")
          req(csha(body)==stored=="c3dadf206e3b06961ed8499f551c4ef2773b8f2ee5f4fb0a28eab91a40beb616","e12 reference canonical")
          req(ref["hpadj21"]["predomain"]["e8_admitted"] is False,"e8 scope correction")
          req(ref["hpadj21"]["predomain"]["e12_smallest_even_structurally_admitted"] is True,"e12 current-domain boundary")
          targets=ref["e12_census"]["top16"]
          req(len(targets)==16 and sum(int(r["terminal_mass"]) for r in targets)==1248525,"top16 target mass")
          req(csha([{k:r[k] for k in ("base4","exceptional_multiplicity_per_x4","representative_exceptional_rank","representative_terminal_rank_x4_0")} for r in targets])=="157633161cb1a40d5f622b430303d128a58f2b9286ed754e2f09358b27a41a43","top16 source rows")

          full=load_module(FULL_WORKER,"s32_e12_bp_full")
          req(full.PARENT.is_file() and full.blob(full.PARENT)==full.PARENT_BLOB,"full343 parent")
          parent=full.load_module(full.PARENT,"s32_e12_bp_parent")
          old=parent.load_module(parent.RELAXED,"s32_e12_bp_old")
          lane=Path(".stage32-178-btva-panel")/old.LANE178_AGG_REL
          req(lane.is_file() and old.git_blob(lane)==old.LANE178_AGG_BLOB,"178 aggregate source")
          v1=old.load_module(old.BASE,"s32_e12_bp_base")
          bundle=v1.load_retained(ROOT/"stages/stage33/33-07/picard_base_rows_retained.py","s32_e12_bp_bundle")
          marking=v1.load_retained(ROOT/"stages/stage33/33-07/stage32_picard_marking_retained.py","s32_e12_bp_marking")
          data=v1.reconstruct_translation_data(marking,bundle)
          adapter=data["adapter"];bridge=data["bridge"]
          coords=adapter.class_coordinates_in_retained_basis
          gram=Matrix(bundle["picard_gram_64x64"])
          req(coords.shape==(140,64) and gram.shape==(64,64) and gram==gram.T,"Picard shapes")
          req(abs(int(gram.det()))==EXPECTED_GRAM_DET,"Gram determinant")
          labels=[int(x) for x in adapter.certificate["retained_basis_known_labels_1based"]]
          req(len(labels)==64 and len(set(labels))==64,"retained labels")
          ridx=[x-1 for x in labels]
          req(coords.extract(ridx,list(range(64)))==Matrix.eye(64),"retained coordinate identity")
          req(adapter.pairing_matrix==coords*gram,"pairing reconstruction")

          H=hermite_normal_form(gram);req(H.shape==(64,64),"Gram HNF shape")
          Hinv=H.inv();modulus=1
          for value in Hinv: modulus=math.lcm(modulus,int(sympy.denom(value)))
          invq=Hinv*modulus
          req(all(sympy.denom(v)==1 for v in invq),"Gram HNF denominator clear")
          congr=[]
          if modulus!=1:
              for i in range(64):
                  row=[int(invq[i,j])%modulus for j in range(64)]
                  if any(row): congr.append(row)
          req(modulus==8 and len(congr)==23,"retained Gram HNF regression")

          ginv=gram.inv()
          du=functional_u_coeffs(bridge.degree_functional,ginv)
          eu=functional_u_coeffs(bridge.exceptional_mass_functional,ginv)
          nodes=old.node_matrix(json.loads(old.NODE_BRIDGE.read_text()))
          req(nodes.shape==(48,7) and int(nodes.rank())==7,"node rank")

          rows=[]
          for pos,t in enumerate(targets):
              base4=tuple(int(v) for v in t["base4"])
              u=[Int(f"u_{pos}_{j}") for j in range(64)]
              s=SolverFor("QF_LIA");s.set(timeout=TIMEOUT)
              for j,lab in enumerate(labels):
                  upper=NORMAL_MASS if lab<=NORMAL_COUNT else E
                  s.add(u[j]>=0,u[j]<=upper)
              for row in congr:
                  s.add(sum(row[j]*u[j] for j in range(64)) % modulus == 0)
              pair=[sum(int(coords[i,j])*u[j] for j in range(64)) for i in range(140)]
              normal=pair[:92];exc=pair[92:]
              for expr in normal:s.add(expr>=0,expr<=NORMAL_MASS)
              for expr in exc:s.add(expr>=0,expr<=E)
              s.add(sum(normal)==NORMAL_MASS)
              s.add(sum(exc)==E)
              s.add(sum(du[j]*u[j] for j in range(64))==DEGREE)
              s.add(sum(eu[j]*u[j] for j in range(64))==E)
              assignment=[pair[int(label)-1] for label in old.ASSIGNMENT]
              agg=[sum(int(old.L[i][j])*assignment[j] for j in range(len(old.ASSIGNMENT))) for i in range(4)]
              for expr,val in zip(agg,base4):s.add(expr==val)

              seen=set();cuts=[];iterations=0;status="UNKNOWN";reason=None;witness=None
              while iterations<=MAX_CUTS:
                  iterations+=1;res=s.check()
                  if res==unsat:
                      status="UNSAT_BASIS_PAIRING_PICARD_FIBER";break
                  if res==unknown:
                      reason=s.reason_unknown();break
                  req(res==sat,"unexpected solver status")
                  m=s.model();uvals=[int(m.eval(v,model_completion=True).as_long()) for v in u]
                  U=Matrix(uvals);xq=ginv*U
                  req(all(sympy.denom(v)==1 for v in xq),"SAT Gram lattice integrality")
                  pvals=[int(v) for v in coords*U]
                  req(min(pvals)>=0 and sum(pvals[:92])==NORMAL_MASS and sum(pvals[92:])==E,"SAT pairing replay")
                  support=tuple(i for i,v in enumerate(pvals[92:]) if v>0)
                  rank=old.support_rank(nodes,support)
                  if rank==7:
                      status="SAT_BTVA_COMPATIBLE_BASIS_PAIRING_LIFT"
                      witness={"retained_basis_pairings_sha256":csha(uvals),"all140_pairings_sha256":csha(pvals),"support_indices_0based":list(support),"support_size":len(support),"support_rank":rank}
                      break
                  flat=old.closure(nodes,support);req(flat not in seen,"repeated lazy flat");seen.add(flat)
                  outside=[k for k in range(48) if k not in flat];req(outside,"proper flat outside")
                  s.add(sum(exc[k] for k in outside)>=1)
                  cuts.append({"support_rank":rank,"support_size":len(support),"closure_size":len(flat),"outside_count":len(outside)})
              else: reason="max_flat_cuts_exhausted"
              rows.append({"ranked_target_position":pos,"base4":list(base4),"exceptional_multiplicity_per_x4":int(t["exceptional_multiplicity_per_x4"]),"terminal_mass":int(t["terminal_mass"]),"result":status,"solver_iterations":iterations,"lazy_flat_cut_count":len(cuts),"reason_unknown":reason,"compatible_witness":witness})

          unsat_mass=sum(r["terminal_mass"] for r in rows if r["result"].startswith("UNSAT_"))
          sat_mass=sum(r["terminal_mass"] for r in rows if r["result"].startswith("SAT_"))
          unknown_mass=sum(r["terminal_mass"] for r in rows if r["result"]=="UNKNOWN")
          req(unsat_mass+sat_mass+unknown_mass==1248525,"mass conservation")
          out={
            "schema":"STAGE32_MAIN_BTVA_D8_E12_RETAINED_BASIS_PAIRING_TOP16_PILOT_V1",
            "stage":32,"status":"BOUNDED_CURRENT_DOMAIN_E12_BASIS_PAIRING_PILOT_ZERO_CREDIT",
            "target":{"row_id":"g0-d008","genus":0,"degree":8,"exceptional_mass":12,"normal_mass":92,"selected_base4_count":16,"selected_terminal_mass":1248525},
            "authority_compatibility":{"e12_structurally_admitted_by_hpadj21":True,"direct_min_with_hpadj21_row_floor_authorized":False},
            "coordinate_change":{"variables":"64 retained-basis curve pairings u=Gram*x","gram_determinant_abs":EXPECTED_GRAM_DET,"gram_hnf_membership_modulus":modulus,"gram_hnf_active_congruence_rows":len(congr),"gram_lattice_membership_exact_for_integral_picard64":True},
            "rows":rows,
            "summary":{"unsat_base4_count":sum(r["result"].startswith("UNSAT_") for r in rows),"compatible_sat_base4_count":sum(r["result"].startswith("SAT_") for r in rows),"unknown_base4_count":sum(r["result"]=="UNKNOWN" for r in rows),"unsat_terminal_mass":unsat_mass,"compatible_sat_terminal_mass":sat_mass,"unknown_terminal_mass":unknown_mass,"max_lazy_flat_cut_count":max(r["lazy_flat_cut_count"] for r in rows)},
            "source_locks":{"e12_reference_blob_sha1":"386a3f8f9e279ebd9608d7ac21a47715b1a964fc","algorithm_reference_blob_sha1":"cba3a0d797ffcc829ef24922830c83afd83d982e","full343_worker_blob_sha1":"63321a54f565b2da38efbef756caf8db148f0063","all140_semantics_blob_sha1":"c4c94fc8e2b45ee51660fe3665160fde98659056","conic_separation_blob_sha1":"75d384c194c678ff6158ea793e943bce91741bb8","lane178_head":"e60f03cf5105bc6e26cb4615acabd6fe0c07625c","lane178_aggregate_blob_sha1":"5fa9f1d67d6411cb550230b62398aff7bd6488ff"},
            "execution":{"solver":"Z3_QF_LIA","solver_timeout_ms":TIMEOUT,"max_flat_cuts":MAX_CUTS,"effective_concurrency":1},
            "semantics":{"unsat_is_safe_rejection_within_e12_raw_compressed_slice":True,"sat_does_not_claim_effective_curve":True,"unknown_is_not_unsat":True,"known_plane_conic_exception_separated_by_d8_degree":True,"all140_nonnegativity_used_as_d8_necessary_condition":True},
            "firewalls":{"main_pruning_credit":False,"receiver_credit":False,"effectivity_credit":False,"theorem_credit":False,"endpoint_credit":False,"full178_complete":False,"stage32_closed":False,"merge_authorized":False}
          }
          out["canonical_sha256_without_this_field"]=csha(out)
          Path("$RUNNER_TEMP/btva-d8-e12-basis-pairing-top16.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print("BTVA_D8_E12_TOP16_SUMMARY="+json.dumps(out["summary"],sort_keys=True))
          print("BTVA_D8_E12_TOP16_CANONICAL="+out["canonical_sha256_without_this_field"])
          PY

      - name: Validate e12 top16 pilot
        shell: bash
        run: |
          python - "$RUNNER_TEMP/btva-d8-e12-basis-pairing-top16.json" <<'PY'
          import hashlib,json,sys
          p=json.load(open(sys.argv[1]))
          stored=p.pop("canonical_sha256_without_this_field")
          calc=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest()
          assert stored==calc
          assert p["schema"]=="STAGE32_MAIN_BTVA_D8_E12_RETAINED_BASIS_PAIRING_TOP16_PILOT_V1"
          assert p["target"]["selected_terminal_mass"]==1248525
          assert p["authority_compatibility"]["direct_min_with_hpadj21_row_floor_authorized"] is False
          assert p["summary"]["unsat_terminal_mass"]+p["summary"]["compatible_sat_terminal_mass"]+p["summary"]["unknown_terminal_mass"]==1248525
          assert p["firewalls"]["main_pruning_credit"] is False
          assert p["firewalls"]["merge_authorized"] is False
          print(json.dumps({"summary":p["summary"],"canonical":stored},sort_keys=True))
          PY

      - name: Upload e12 top16 pilot
        uses: actions/upload-artifact@v4
        with:
          name: stage32-main-btva-d8-e12-basis-pairing-top16
          path: ${{ runner.temp }}/btva-d8-e12-basis-pairing-top16.json
          retention-days: 7
          compression-level: 9
