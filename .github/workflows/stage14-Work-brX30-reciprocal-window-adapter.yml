name: Stage14-Work-brX30 reciprocal window adapter audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-Work-brX30/**'
      - 'docs/stage14-toolbox/work-brX30-receiver-matrix.md'
      - 'stages/stage14/scripts/14-Work-brX30/**'
      - '.github/workflows/stage14-Work-brX30-reciprocal-window-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run integrated brX30 audit
        run: python stages/stage14/scripts/14-Work-brX30/reciprocal_window_adapter_audit.py

      - name: Compile integrated audit
        run: python -m py_compile stages/stage14/scripts/14-Work-brX30/reciprocal_window_adapter_audit.py

      - name: Regress merged Work-bqX29
        run: python stages/stage14/scripts/14-Work-bqX29/atomic_capacity_exhaustion_audit.py

      - name: Regress merged mainline 4fe..4fg
        run: python stages/stage14/scripts/14-4/batch_4fe_4fg_radial_physical_density_audit.py

      - name: Regress merged s7-87..89
        run: python stages/stage14/scripts/14-s-batch/s7_87_89_normalized_radial_product_audit.py

      - name: Regress merged t125..t128 and tH29
        run: python stages/stage14/14-t-batch-t125-128-th29/audit.py

      - name: Lock integrated boundary
        run: |
          grep -Fq 'STAGE14_WORK_BRX30=COMPLETE' stages/stage14/14-Work-brX30/result.md
          grep -Fq 'GLOBAL_S_RECIPROCAL_DIVISOR_WINDOW_COORDINATE_IDENTIFIED=true' stages/stage14/14-Work-brX30/result.md
          grep -Fq 'DIRECT_RADIAL_DIVISOR_TO_PROJECTIVE_PRIME_ADAPTER_NOGO_AT_CURRENT_LEVEL=true' stages/stage14/14-Work-brX30/result.md
          grep -Fq 'COMMON_ADAPTER_PROVED=false' stages/stage14/14-Work-brX30/result.md
          grep -Fq 'STRICT_SUBSQRT_POWER_SAVING_PROVED=false' stages/stage14/14-Work-brX30/result.md

      - name: Lock receiver matrix
        run: |
          grep -Fq 'COMMON_ARITHMETIC_RECIPROCAL_WINDOW_ADAPTER_PROVED=false' docs/stage14-toolbox/work-brX30-receiver-matrix.md
          grep -Fq 'NEXT_REVISIT_CONDITION=4fj+s7-92+t131' docs/stage14-toolbox/work-brX30-receiver-matrix.md

      - name: Diff check
        run: git diff --check origin/main...HEAD
