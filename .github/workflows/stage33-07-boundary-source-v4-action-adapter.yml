name: Stage33-07 boundary source V4 action adapter

on:
  pull_request:
    paths:
      - 'stages/stage33/33-07/certify_boundary_source_v4_action_adapter.py'
      - 'stages/stage33/33-07/materialize_order2_first_residue_functions.py'
      - 'stages/stage33/33-07/certify_order2_quotient_raw_order4_bockstein.py'
      - 'stages/stage33/33-07/compact_order2_quotient_raw_order4_bockstein.py'
      - 'stages/stage33/33-07/certify_order2_raw_extension_normal_form.py'
      - 'stages/stage33/33-07/materialize_order2_localization_receiver.py'
      - '.github/workflows/stage33-07-boundary-source-v4-action-adapter.yml'
  workflow_dispatch:

concurrency:
  group: stage33-07-boundary-source-v4-action-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: gate
        env: {EVENT: '${{ github.event_name }}', ACTION: '${{ github.event.action }}', BEFORE: '${{ github.event.before }}', HEAD: '${{ github.event.pull_request.head.sha }}', WORKFLOW_REF: '${{ github.workflow_ref }}'}
        run: python .github/scripts/stage33_commit_range_gate.py

  certify:
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - name: Preflight bounded Actions storage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Locally measured certificate is 10,642 bytes.  Charge a full MiB
          # for the only retained artifact; raw regenerated inputs stay local.
          gh api "repos/${GH_REPO}/actions/artifacts?per_page=100" --paginate --slurp > artifacts.json
          python - <<'PY'
          import json
          pages=json.load(open('artifacts.json'))
          current=sum(int(a['size_in_bytes']) for p in pages for a in p['artifacts'] if not a['expired'])
          representative_certificate_bytes=10642
          charged_new_artifact_bytes=1024*1024
          budget=500*1024*1024
          projected=current+charged_new_artifact_bytes
          print(f'ACTIONS_STORAGE_CURRENT_BYTES={current}')
          print(f'REPRESENTATIVE_CERTIFICATE_BYTES={representative_certificate_bytes}')
          print(f'CHARGED_NEW_ARTIFACT_BYTES={charged_new_artifact_bytes}')
          print(f'ACTIONS_STORAGE_PROJECTED_PEAK_BYTES={projected}')
          print(f'ACTIONS_STORAGE_BUDGET_BYTES={budget}')
          if projected > budget:
              raise SystemExit('projected Actions storage exceeds the 500 MiB operating budget')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact integer algebra dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Reproduce locked source and receiver prefixes
        working-directory: stages/stage33/33-07
        run: |
          python certify_order2_quotient_raw_order4_bockstein.py
          python compact_order2_quotient_raw_order4_bockstein.py
          python certify_order2_raw_extension_normal_form.py
          python materialize_order2_localization_receiver.py
      - name: Certify complete source-side V4 action
        working-directory: stages/stage33/33-07
        run: python certify_boundary_source_v4_action_adapter.py
      - name: Validate source/middle promotion firewall
        working-directory: stages/stage33/33-07
        run: |
          python - <<'PY'
          import hashlib,json
          p='boundary-source-v4-action-adapter.json'
          x=json.load(open(p)); h=x.pop('canonical_sha256')
          assert h==hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          r=x['raw_boundary_extension_action']
          assert r['raw_order2_source_count']==17 and r['raw_order4_source_count']==9
          assert r['all_17_raw_order2_sources_cc_fixed']
          assert r['all_9_raw_order4_sources_cc_inverted_with_locked_U44_double']
          q=x['finite_quotient_source_action']
          assert q['all_26_source_directions_v4_fixed_after_quotient_to_order2']
          assert q['cc_action']=='TRIVIAL' and q['ct_action']=='TRIVIAL'
          e=x['exact_consequence']
          assert e['source_side_v4_action_fully_materialized']
          assert not e['genuine_middle_gersten_module_action_materialized']
          assert e['connecting_matrix_columns_materialized']==0
          assert not e['source_and_kernel_actions_determine_middle_extension_class']
          s=x['project_status']
          assert not s['actual_index512_glue_identified']
          assert not s['absolute_delta_loc_computed'] and not s['arithmetic_HS_closed']
          assert s['stage33_progress']=='6/11' and not s['stage33_08_released']
          assert not s['theorem_credit'] and not s['endpoint_credit']
          print('STAGE33_07_BOUNDARY_SOURCE_V4_ACTION_ADAPTER=PASS')
          print('CERTIFICATE_SHA256='+h)
          print('RAW_ACTION=17_FIXED_ORDER2_PLUS_9_INVERTED_ORDER4')
          print('QUOTIENT_A2_V4_ACTION=TRIVIAL_ON_F2_26')
          print('MIDDLE_MODULE_ACTION_MATERIALIZED=false')
          print('CONNECTING_MATRIX_COLUMNS=0/26')
          print('NEXT='+x['next_exact_leaf'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-07-boundary-source-v4-action-adapter
          retention-days: 3
          path: stages/stage33/33-07/boundary-source-v4-action-adapter.json
