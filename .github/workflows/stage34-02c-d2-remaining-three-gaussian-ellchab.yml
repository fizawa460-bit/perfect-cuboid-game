name: Stage34-02c D2 remaining-three Gaussian rank-index Chabauty

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage34/runkeys/stage34-02c-d2-remaining-three-gaussian-ellchab.json'
      - 'stages/stage34/34-02/d2-stageA2-remaining-three-gaussian-elliptic-quotient-lock.json'
      - 'stages/stage34/34-02/d2-stageA2-remaining-three-gaussian-rank-index-lock.json'
      - 'stages/stage34/34-02/probe_d2_stageA2_remaining_three_gaussian_elliptic_chabauty.py'
      - 'stages/stage34/34-02/probe_d2_stageA2_remaining_three_gaussian_rank_index_chabauty.py'
      - '.github/workflows/stage34-02c-d2-remaining-three-gaussian-ellchab.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate dedicated Gaussian rank-index run key against commit range
        id: gate
        env:
          BEFORE: "${{ github.event.before }}"
        run: |
          KEY=stages/stage34/runkeys/stage34-02c-d2-remaining-three-gaussian-ellchab.json
          if [ ! -f "$KEY" ]; then echo 'authorized=false' >> "$GITHUB_OUTPUT"; echo 'reason=runkey_missing' >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$BEFORE" ]; then echo 'authorized=false' >> "$GITHUB_OUTPUT"; echo 'reason=no_before' >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BEFORE" || true
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo 'authorized=false' >> "$GITHUB_OUTPUT"; echo 'reason=before_unavailable' >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! git diff --name-only "$BEFORE" HEAD | grep -Fxq "$KEY"; then echo 'authorized=false' >> "$GITHUB_OUTPUT"; echo 'reason=runkey_unchanged' >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          p='stages/stage34/runkeys/stage34-02c-d2-remaining-three-gaussian-ellchab.json'
          cur=json.load(open(p))
          try:
              old=json.loads(subprocess.check_output(['git','show',f'{os.environ["BEFORE"]}:{p}'],text=True))
              oldgen=int(old.get('generation',-1))
          except Exception:
              oldgen=-1
          ok=(
              cur.get('schema')=='STAGE34_02C_D2_REMAINING_THREE_GAUSSIAN_ELLCHAB_RUNKEY_V1'
              and cur.get('armed') is True
              and isinstance(cur.get('generation'),int)
              and cur['generation']>oldgen
              and cur.get('expected_targets')==3
              and cur.get('planned_heavy_jobs')==1
              and cur.get('effective_heavy_concurrency')==1
              and cur.get('maximum_external_magma_requests_at_once')==1
              and cur.get('artifact_max_bytes')==1048576
              and cur.get('retention_days')==1
              and cur.get('source_lock_blob_sha')=='e5e5ca88fe5bd2a5f0c05d46afbe30d6f07ce9fc'
          )
          print('authorized='+('true' if ok else 'false'))
          print('reason='+('fresh_generation_armed' if ok else 'semantic_gate_failed'))
          PY
      - name: Report authorization
        run: echo "authorized=${{ steps.gate.outputs.authorized }} reason=${{ steps.gate.outputs.reason }}"

  probe:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Run three Gaussian rank-index Chabauty diagnostics sequentially
        run: python3 stages/stage34/34-02/probe_d2_stageA2_remaining_three_gaussian_rank_index_chabauty.py
      - name: Enforce compact evidence cap
        if: always()
        run: |
          test -f stages/stage34/34-02/d2-stageA2-remaining-three-gaussian-rank-index-chabauty-probe.json
          test -f stages/stage34/34-02/d2-stageA2-remaining-three-gaussian-rank-index-chabauty-stdout.txt
          test $(wc -c < stages/stage34/34-02/d2-stageA2-remaining-three-gaussian-rank-index-chabauty-probe.json) -le 1048576
          test $(wc -c < stages/stage34/34-02/d2-stageA2-remaining-three-gaussian-rank-index-chabauty-stdout.txt) -le 1048576
      - name: Upload compact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-02c-d2-remaining-three-gaussian-rank-index-ellchab
          path: |
            stages/stage34/34-02/d2-stageA2-remaining-three-gaussian-rank-index-chabauty-probe.json
            stages/stage34/34-02/d2-stageA2-remaining-three-gaussian-rank-index-chabauty-stdout.txt
          if-no-files-found: warn
          retention-days: 1
