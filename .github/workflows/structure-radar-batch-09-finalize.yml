name: StructureRadar batch09 finalizer
on:
  push:
    branches: [structure-radar-deep-corpus-batch-09]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-09
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize batch09 into StructureRadar
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          batch_id='SR-BATCH-STAGE14_15_DEEP_CORPUS-09-R01'
          sel=json.loads((root/'.github/structure-radar-batch-09-selection.json').read_text())
          ids=[s['source_id'] for s in sel['sources']]
          expected=['SRC-5198A8296555','SRC-A5868BCA96BC','SRC-5E800F35A48E','SRC-53FF51222A66','SRC-054D76029077','SRC-66A7A4123CB0','SRC-7D60555DCF15','SRC-339A15F9CAC8','SRC-C6A8A18426F6','SRC-5791A3F0EAE1','SRC-27676E7CB4A0','SRC-0D99B7BC6755','SRC-901FE869650B','SRC-B49F0315944E','SRC-956AB2A25F6A','SRC-79485C954983','SRC-322A6608D4DA','SRC-F778A6F7B6F8','SRC-05EB8588403B','SRC-D7BC84BC46FF','SRC-211C6AEE55B9','SRC-5AC85D35911E','SRC-5B22CB404D6D','SRC-8877DA873D48','SRC-BC716B5FE645','SRC-3EA2572333FE','SRC-C3DEE2452219','SRC-9CF65D40BD91','SRC-0FAAA5602657','SRC-92CD4B0CE772','SRC-56737349D85B','SRC-2D6712AF25CC','SRC-ECBB4B4DB242','SRC-50883B89B752','SRC-80DD28ED1DBB','SRC-703C3D0C91C6','SRC-AB243D1C78FE','SRC-56DDFAA7EB3B','SRC-C19CA93A41A8','SRC-02901D30BA3A','SRC-CCF8EFFB1AE0','SRC-5ADCC984FEC4','SRC-18BF44EC0F58','SRC-43911700F5F7','SRC-3E59778D8D2B','SRC-3623F032847F','SRC-CD0C85946C31','SRC-28EA19EBD7B4','SRC-9F2C4CD33B26','SRC-6EBB0A75ACF1','SRC-EC5E53F797FE','SRC-538CF7F83088','SRC-3F7AB9BF2B43','SRC-10594A842E95','SRC-4D3FB67D963D','SRC-D72AB7D26807','SRC-936DB983099C','SRC-BB17D4BBB9E3','SRC-4B3456BCE69E','SRC-CB06187116E3']
          assert sel['batch_id']==batch_id and sel['task_id']=='SR-CENSUS-STAGE14_15_DEEP_CORPUS-01'
          assert ids==expected and len(ids)==60 and len(set(ids))==60
          sm={s['source_id']:s for s in sel['sources']}
          carrier={
            'SRC-AB243D1C78FE':['SR-STR-198'],
            'SRC-CD0C85946C31':['SR-STR-198'],
            'SRC-28EA19EBD7B4':['SR-STR-199'],
            'SRC-9F2C4CD33B26':['SR-STR-199'],
            'SRC-6EBB0A75ACF1':['SR-STR-199'],
            'SRC-EC5E53F797FE':['SR-STR-197'],
            'SRC-538CF7F83088':['SR-STR-200'],
            'SRC-3F7AB9BF2B43':['SR-STR-200'],
            'SRC-10594A842E95':['SR-STR-200'],
            'SRC-56DDFAA7EB3B':['SR-STR-202'],
            'SRC-C19CA93A41A8':['SR-STR-202'],
            'SRC-02901D30BA3A':['SR-STR-202'],
            'SRC-CCF8EFFB1AE0':['SR-STR-201'],
            'SRC-18BF44EC0F58':['SR-STR-205'],
            'SRC-3623F032847F':['SR-STR-204'],
            'SRC-4B3456BCE69E':['SR-STR-181'],
          }
          assert len(carrier)==16
          reg_path=root/'docs/structure-radar/structure-registry.json'
          reg=json.loads(reg_path.read_text())
          cards={c['structure_id']:c for c in reg['structures']}
          locators={
            'SRC-AB243D1C78FE':'X1 joint common-core/CRT physical-fiber lemma',
            'SRC-CD0C85946C31':'X2 Pluecker rank-one CRT collapse',
            'SRC-28EA19EBD7B4':'X3 split-quartic equal-value reduction',
            'SRC-9F2C4CD33B26':'X4 physical proportional-branch elimination',
            'SRC-6EBB0A75ACF1':'X5 reciprocal biquadratic Cayley/smooth split',
            'SRC-EC5E53F797FE':'X6 primitive four-root CRT residue lock',
            'SRC-538CF7F83088':'X7 Gaussian quotient and self-generated-modulus firewall',
            'SRC-3F7AB9BF2B43':'X8 dual-Cayley minimax mechanism',
            'SRC-10594A842E95':'X9 five-eighths saturation boundary split mechanism',
            'SRC-56DDFAA7EB3B':'X10 root-gcd and dominant Cayley short-cofactor reduction',
            'SRC-C19CA93A41A8':'X11 proportional four-root gcd decomposition',
            'SRC-02901D30BA3A':'X12 lost-core fourth-root row/column coupling',
            'SRC-CCF8EFFB1AE0':'X13 reverse reciprocal row/column reconstruction',
            'SRC-18BF44EC0F58':'X14 switch-supported zero-mode physical-density reduction',
            'SRC-3623F032847F':'X15 three-projection Pythagorean centering receiver',
            'SRC-4B3456BCE69E':'e1 no-space two-face minimal gluing and real-height chart',
          }
          for sid,tgts in carrier.items():
              s=sm[sid]
              prov={'source_id':sid,'path':s['path'],'locator':locators[sid],'fingerprint':s['fingerprint']}
              for tid in tgts:
                  c=cards[tid]
                  if not any(p.get('source_id')==sid for p in c.get('repo_provenance',[])):
                      c.setdefault('repo_provenance',[]).append(prov)
                  c['card_status']='SUBMITTED_FOR_AUDIT'
          c181=cards['SR-STR-181']
          c181['exact_equations_or_object']=(
            'For oriented primitive Pythagorean faces with S1=g*alpha and S2=g*beta, minimal shared-edge gluing is '
            'e=g*alpha*beta=lcm(S1,S2), x=beta*X1, y=alpha*X2; a common scale t equals gcd(e,x,y), so primitivity forces t=1. '
            'With t1=X1/S1, t2=X2/S2 and L=lcm(S1,S2), (e,x,y)=L(1,t1,t2) and the ambient real height is '
            'D_R=L*sqrt(1+t1^2+t2^2), without any rational or integral space-diagonal condition. On the physical space-diagonal branch, '
            'G^2=H^2*S2^2+S^2*X2^2=S^2*H2^2+X^2*S2^2 gives an induced integral triple, while compact conjugates satisfy '
            'N_phys*N_-=S^2*X^2*(R_-)^2 and Z_-=-U*V/X2^2. These are exact coordinate adapters, not population estimates.'
          )
          reg_path.write_text(json.dumps(reg,indent=2)+'\n')
          prog_path=root/'docs/structure-radar/progress.json'
          prog=json.loads(prog_path.read_text())
          for sid in ids:
              s=sm[sid]
              if sid in carrier:
                  prog['source_reviews'][sid]={'fingerprint':s['fingerprint'],'batch_id':batch_id,'status':'STRUCTURES_RECORDED','structure_ids':carrier[sid]}
              else:
                  prog['source_reviews'][sid]={'fingerprint':s['fingerprint'],'batch_id':batch_id,'status':'NO_DISTINCT_STRUCTURE'}
          prog['audit_batches']=[b for b in prog.get('audit_batches',[]) if b.get('batch_id')!=batch_id]
          prog['audit_batches'].append({
            'batch_id':batch_id,
            'task_id':'SR-CENSUS-STAGE14_15_DEEP_CORPUS-01',
            'status':'SUBMITTED_FOR_AUDIT',
            'source_ids':ids,
            'sources_reviewed':60,
            'structures_added':0,
            'structures_updated':9,
            'structure_carrier_sources':16,
            'structures_deduped':44,
            'searches_completed':0,
            'arsenal_decisions':0,
            'audit_required':True,
            'duplicate_source':0,
            'no_distinct_structure':44
          })
          prog_path.write_text(json.dumps(prog,indent=2)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python scripts/verify_research_arsenal.py
          git diff --check
          rm -f .github/structure-radar-batch-09-* .github/workflows/structure-radar-batch-09-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          python scripts/structure_radar.py verify
          python scripts/verify_research_arsenal.py
          git diff --cached --check
          git commit -m 'StructureRadar: census Stage14-15 deep corpus batch 09'
          git push origin HEAD:structure-radar-deep-corpus-batch-09
