name: Stage34-02 D2 StageA2 genus-two branch-minimal rank census

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage34/runkeys/stage34-02-d2-stageA2-genus2-branch-minimal-rank-census.json'
      - 'stages/stage34/34-02/d2-stageA2-genus2-branch-minimal-rank-census-lock.json'
      - 'stages/stage34/34-02/run_d2_stageA2_genus2_branch_minimal_rank_census.py'
      - 'stages/stage34/34-02/validate_d2_stageA2_genus2_branch_minimal_rank_census_runkey.py'
      - '.github/workflows/stage34-02-d2-stageA2-genus2-branch-minimal-rank-census.yml'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch event-before commit if needed
        env: {BEFORE: '${{ github.event.before }}'}
        run: 'if [ -n "$BEFORE" ]; then git fetch --no-tags --depth=1 origin "$BEFORE" || true; fi'
      - name: Validate dedicated run key against actual commit range
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 stages/stage34/34-02/validate_d2_stageA2_genus2_branch_minimal_rank_census_runkey.py "$BEFORE" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Report authorization
        run: echo "authorized=${{ steps.gate.outputs.authorized }} reason=${{ steps.gate.outputs.reason }}"

  census:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate exact residual triple quotient table
        run: |
          python3 stages/stage34/34-02/run_d2_stageA2_factor_branch_local.py
          python3 stages/stage34/34-02/refine_d2_stageA2_factor_branch_support.py
          python3 stages/stage34/34-02/run_d2_stageA2_full_support_projective.py
          python3 stages/stage34/34-02/run_d2_stageA2_rank1_cover_selection.py
          python3 stages/stage34/34-02/probe_d2_stageA2_triple_quotient_models.py
      - name: Run one selected genus-two RankBounds computation per residual branch
        run: python3 stages/stage34/34-02/run_d2_stageA2_genus2_branch_minimal_rank_census.py
      - name: Enforce compact evidence cap
        if: always()
        run: |
          test -f stages/stage34/34-02/d2-stageA2-genus2-branch-minimal-rank-census.json
          test $(wc -c < stages/stage34/34-02/d2-stageA2-genus2-branch-minimal-rank-census.json) -le 1048576
          test $(wc -c < stages/stage34/34-02/d2-stageA2-genus2-branch-minimal-rank-census-stdout.txt) -le 1048576
      - name: Upload compact census evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-02-d2-stageA2-genus2-branch-minimal-rank-census
          path: |
            stages/stage34/34-02/d2-stageA2-genus2-branch-minimal-rank-census.json
            stages/stage34/34-02/d2-stageA2-genus2-branch-minimal-rank-census-stdout.txt
          if-no-files-found: warn
          retention-days: 1
