name: SR-STR-222 Work result finalizer

on:
  push:
    branches:
      - agent/sr222-thorner-zaman-partial-upgrade
    paths:
      - docs/structure-radar/.sr222-work-result-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sr222-thorner-zaman-partial-upgrade
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch SR-STR-222 conservatively
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('docs/structure-radar/structure-registry.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          card = next(c for c in data['structures'] if c['structure_id'] == 'SR-STR-222')

          paragraph = (
              ' External Work follow-up (2026-08-18), independently checked against primary sources, '
              'found no published unconditional theorem that directly supplies the full tH33 joint target. '
              'Thorner–Zaman Theorem 1.4 supplies an individual Chebotarev asymptotic controlled by the maximal '
              'Hecke conductor; after specialization to an abelian ray-class extension over Q(i), this gives a '
              'polynomial-conductor individual ray-class density engine compatible with d=X^{o(1)} at the finite '
              'conductor level. This is only a partial upgrade: Chebotarev counts prime ideals by Frobenius/ray '
              'class and does not itself impose the continuous canonical D4-sector condition on a chosen Gaussian '
              'generator or directly recover the exact unit-normalized ordinary residue beta_* mod d. The narrowed '
              'remaining obstruction is therefore RayClassToCanonicalSectorOrdinaryResidueAdapter, or an equivalent '
              'individual asymptotic for the combined finite ray-character and angular Hecke-character family. '
              'SR-STR-222 and tH33 remain unresolved.'
          )
          if 'RayClassToCanonicalSectorOrdinaryResidueAdapter' not in card['exact_equations_or_object']:
              card['exact_equations_or_object'] += paragraph

          for term in [
              'ray-class Chebotarev angular Hecke adapter',
              'unit-resolving Gaussian residue sector adapter',
          ]:
              if term not in card['search_terms_aliases']:
                  card['search_terms_aliases'].append(term)

          for species in [
              'individual ray-class Chebotarev asymptotic',
              'ray-class to canonical-sector ordinary-generator adapter',
          ]:
              if species not in card['theorem_species']:
                  card['theorem_species'].append(species)

          for weapon in [
              'CHEBOTAREV_RAY_CLASS',
              'ANGULAR_HECKE_ADAPTER',
          ]:
              if weapon not in card['potential_weapon_types']:
                  card['potential_weapon_types'].append(weapon)

          gaps = [
              'External Work follow-up 2026-08-18: DIRECT_FULL_TARGET_THEOREM_COUNT=0. Thorner–Zaman Theorem 1.4 is a genuine super-Kai conductor-scale individual ray-class partial upgrade after ray-class specialization, but it is not a direct theorem for the joint fixed-sector ordinary canonical-generator residue target.',
              'THORNER_ZAMAN_RAY_CLASS_PARTIAL_UPGRADE=true; JOINT_FIXED_RESIDUE_AND_FIXED_SECTOR=false. The narrowed minimal obstruction is RayClassToCanonicalSectorOrdinaryResidueAdapter, or an equivalent individual finite-ray-character × angular-Hecke-character asymptotic.',
              'Kai/Mitsui still supplies the direct fixed-sector plus ordinary-residue geometry only in its audited pseudopolynomial modulus range; Stucky supplies sector/radial localization without the growing ordinary modulus; averaged BV/BDH-type results remain non-direct for one frozen fixed-U packet.',
              'The external Work result is a literature/applicability refinement only: search_status remains SEARCHED, arsenal_decision remains PENDING, CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT remains 1/2, and STRICT_SUBSQRT_POWER_SAVING_PROVED remains false.'
          ]
          for gap in gaps:
              if gap not in card['applicability_gaps']:
                  card['applicability_gaps'].append(gap)

          assert card['search_status'] == 'SEARCHED'
          assert card['arsenal_decision'] == 'PENDING'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False, sort_keys=False) + '\n', encoding='utf-8')
          PY
      - name: Verify StructureRadar
        run: |
          python scripts/structure_radar.py verify
          git diff --check
      - name: Remove one-shot helpers and commit
        shell: bash
        run: |
          rm -f .github/workflows/sr222-work-result-finalize.yml
          rm -f docs/structure-radar/.sr222-work-result-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/structure-radar/structure-registry.json .github/workflows/sr222-work-result-finalize.yml docs/structure-radar/.sr222-work-result-trigger
          git commit -m 'StructureRadar record SR-STR-222 Work literature result'
          git push origin HEAD:agent/sr222-thorner-zaman-partial-upgrade
