name: TEMP Stage27 r301t-v sync

on:
  push:
    branches:
      - agent/stage27-20-r301t-v-critical-support
    paths:
      - '.github/workflows/tmp-stage27-r301tv-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage27-20-r301t-v-critical-support
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply batch files
        run: |
          python .github/scripts/tmp_stage27_r301tv_sync.py
          rm -f .github/workflows/stage27-20-r301t-v-critical-support.yml
      - name: Verify and publish stage files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python stages/stage27/27-20-r301t-v/verify_27_20_r301t_v.py
          python -m json.tool stages/stage27/27-controller.json >/dev/null
          python -m json.tool stages/stage27/27-20-r301t-v/batch-registry.json >/dev/null
          git add stages/stage27
          git diff --check --cached
          git commit -m 'Stage27-20-r301t-v critical support batch'
          git push origin HEAD:agent/stage27-20-r301t-v-critical-support
