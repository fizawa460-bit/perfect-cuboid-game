## 1. Import only the audited Stage14 complete-host bounds

Stage14 Proposition 3.6 partitions every active face into `B^o(1)` balanced cells. On the nonproportional branch the two complete bounds used at the final wall are

\[
E_k\le 3\theta-\frac14\qquad(\theta\le1/4),
\]

and

\[
E_{\rm RRF}\le1-2\theta\qquad(\theta\ge1/4),
\]

while the proportional branch is bounded by `7/16`.

By r301t, occupied first-coordinate support injects into this same active-face measure. No Stage14 saving is multiplied into a separately charged Stage27 count; we simply restrict the already complete active-face host to the occupied support subset.

## 2. Quantitative off-wall saving

Fix any constant `eta>0`. For cells with

\[
\theta\le\frac14-\eta,
\]

one has

\[
E_k\le\frac12-3\eta.
\]

For cells with

\[
\theta\ge\frac14+\eta,
\]

one has

\[
E_{\rm RRF}\le\frac12-2\eta.
\]

The proportional branch is already at most `7/16`. Consequently the occupied q1 support carried by cells satisfying

\[
|\theta-1/4|\ge\eta
\]

obeys the uniform fixed-distance bound

\[
\boxed{|Q_{\rm off,eta}(B)|\ll B^{1/2-2\eta+o(1)}}.
\]

The same conclusion holds for occupied `j` support because r301m gives bounded physical multiplicity between `q1` and `j`.

## 3. Firewall

This is not a global strict sub-square-root theorem. A shrinking neighborhood of `theta=1/4`, and in particular the exact critical wall, is not covered by a fixed `eta`. The theorem only localizes every possible half-power saturation to that wall.

```text
STAGE27_20_R301U_STATUS=BATCH_SUBMITTED_PENDING_FRESH_AUDIT
OFF_WALL_FIXED_DISTANCE_SUPPORT_SAVING_PROVED=true
OFF_WALL_Q1_BOUND=B^(1/2-2eta+o(1))
OFF_WALL_J_BOUND=B^(1/2-2eta+o(1))
CRITICAL_THETA=1/4
GLOBAL_Q1_SUPPORT_DEFICIT_PROVED=false
STRICT_SUB_SQRT_UPPER_PROVED=false
NEXT_DERIVED_ROUTE=27-20-r301v
```
''')

          v.joinpath('result.md').write_text(r'''# Stage27-20-r301v — exact critical-support wall and the remaining receiver

STATUS=BATCH_SUBMITTED_PENDING_FRESH_AUDIT
CHECKPOINT=40
ROUTE_KIND=UPPER_REENTRY_PREFLIGHT
PARENT_ROUTE=Stage27-20-r301u
SOURCE_STAGE=Stage20

## 1. Critical segment

On the Stage14 balanced feasible domain, set

\[
\theta=\frac14.
\]

The constraints give

\[
\frac18\le\phi\le\frac14,
\qquad
\chi=2\theta+2\phi-\frac34=2\phi-\frac14\in[0,1/4].
\]

For every nonproportional cell on this segment, both final complete-host exponents saturate:

\[
\boxed{E_k=3\theta-1/4=1/2},
\qquad
\boxed{E_{\rm RRF}=1-2\theta=1/2}.
\]

The proportional branch remains below the wall (`<=7/16`), so the only surviving fixed-power obstruction is the nonproportional critical segment

\[
\boxed{\theta=1/4,\quad 1/8\le\phi\le1/4,\quad \chi=2\phi-1/4}.
\]

## 2. Stage27 receiver after r301s

R301s proves

\[
N_2(B)\le |Q(B)|B^{o(1)},
\]

and r301u proves a fixed-power saving for every fixed-distance off-wall part of `Q(B)`. Therefore, within this architecture, a global strict sub-half theorem now reduces to a target-specific support theorem on the critical packets.

A sufficient receiver is: prove some fixed `delta>0` such that the number of occupied first-face slopes represented by the nonproportional critical packets is

\[
\boxed{|Q_{\rm crit}(B)|\ll B^{1/2-\delta+o(1)}}.
\]

Then the off-wall decomposition plus r301s would imply

\[
N_2(B)\ll B^{1/2-\delta'+o(1)}
\]

for some fixed `delta'>0` after choosing a fixed wall neighborhood compatible with the critical theorem.

## 3. What existing weapons do not provide

The following do not by themselves prove the critical support deficit:

- the uniform fixed-x elliptic fiber bound `B^o(1)` from r301r; that fiber exponent is already zero;
- the fixed-x squareclass count `B^o(1)` from r301h;
- height-only counting of rational `q1` values;
- Stage14 off-wall complete-host savings, which are equal to `1/2` at `theta=1/4`;
- multiplying the Stage20 host sieve with the half-power theorem on a different charged ledger.

The next legal attacks are therefore critical-wall-specific: a new local obstruction with weighted mass, a collision/energy deficit for occupied slopes, or a thin-projection theorem on the exact critical packet receiver.

```text
STAGE27_20_R301V_STATUS=BATCH_SUBMITTED_PENDING_FRESH_AUDIT
