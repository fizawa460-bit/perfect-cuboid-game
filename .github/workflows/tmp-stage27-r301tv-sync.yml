STATUS=BATCH_SUBMITTED_PENDING_FRESH_AUDIT
CHECKPOINT=40
ROUTE_KIND=UPPER_REENTRY_PREFLIGHT
PARENT_ROUTE=Stage27-20-r301s
SOURCE_STAGE=Stage20

## 1. Exact coordinate adapter

For a primitive oriented Stage14 face write

\[
F=(S,X,H),\qquad S^2+X^2=H^2,
\]

and use the frozen rational-circle coordinate

\[
q_0=u/v\in(0,1),\qquad
(S,X,H)=\delta^{-1}(v^2-u^2,2uv,v^2+u^2),\quad \delta\in\{1,2\}.
\]

The Stage20/27 torus coordinate attached to the same oriented face is

\[
q_1=\frac{H+X}{S}.
\]

Substitution gives the exact Möbius relation

\[
\boxed{q_1=\frac{v+u}{v-u}=\frac{1+q_0}{1-q_0}},
\qquad
\boxed{q_0=\frac{q_1-1}{q_1+1}}.
\]

Thus positive physical `q1>1` and Stage14 `q0 in (0,1)` determine each other uniquely. The primitive oriented face is uniquely reconstructed from reduced `u/v`, with the usual parity factor `delta` fixed by primitiveness.

## 2. Support injection

Let `Q(B)` be the occupied first-coordinate support from r301s. Every physical Stage27 survivor contributing an occupied `q1` contains the corresponding oriented primitive integral face, hence that face is an active Stage14 vertex in the raw two-face graph at the same space-diagonal cutoff.

Therefore the Möbius adapter gives an injection

\[
\boxed{Q(B)\hookrightarrow V(B)}
\]

into Stage14 active-face vertices, after the frozen first-face orientation. If one forgets the first-face orientation and compares with the undirected active-vertex set, only an absolute face-swap multiplicity is introduced. No fixed power is lost.

This is intentionally only an injection. Stage14 `V(B)` also contains the other endpoint of each raw two-face edge and vertices coming from triple objects, so equality `|Q(B)|=V(B)` is not asserted.

## 3. Consequence

The Stage14 packet decomposition may be pulled back to occupied `q1` values with at most the already-audited `B^o(1)` cell/decorative multiplicity. Hence any complete packetwise upper bound for active vertices is a legal upper bound for the corresponding occupied `q1` support.

This does not itself beat the half-power wall: Stage14 only proves `V(B)<<B^(1/2+o(1))`, which reproduces the current exponent.

```text
STAGE27_20_R301T_STATUS=BATCH_SUBMITTED_PENDING_FRESH_AUDIT
Q1_TO_STAGE14_FACE_MOBIUS_ADAPTER_PROVED=true
Q1_TO_ACTIVE_FACE_SUPPORT_INJECTION_PROVED=true
