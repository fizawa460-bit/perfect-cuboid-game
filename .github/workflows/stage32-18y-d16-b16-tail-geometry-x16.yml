name: Stage32-18Y d16 b16 c48x16 tail pilot

on:
  push:
    branches:
      - stage32-18y-b16-tail-geometry-x16
    paths:
      - 'stages/stage32/runkeys/18y-b16-tail-geometry-x16.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: stage32-18y-b16-tail-geometry-x16
  cancel-in-progress: true

jobs:
  validate-run-key:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.key.outputs.matrix }}
      generation: ${{ steps.key.outputs.generation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require dedicated ARM commit
        run: |
          set -euo pipefail
          KEY='stages/stage32/runkeys/18y-b16-tail-geometry-x16.json'
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$KEY"
          test "$(git log -1 --pretty=%s)" = 'Stage32-18Y: ARM B16 C48X16 TAIL PILOT'
      - id: key
        name: Validate x16 contract and Actions budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,urllib.request
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18y-b16-tail-geometry-x16.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1'
          assert d['workflow']=='stage32-18y-d16-b16-tail-geometry-x16'
          assert d['armed'] is True and d['generation']==1 and d['bound']==16
          assert d['accepted_b14_canonical_survivors']==44450
          assert d['accepted_b14_dump_sha256']=='4d4680a87fab0c01ac8b54bcf404eecaa707cf5db782b31d5fa7357a52249d8a'
          assert d['prepared_artifact_id']==9626136705
          assert d['prepared_zip_sha256']=='f706cd79cf1fc64da0a59bc5cc528ea677e3892f602d3f58d78cb1543bf8380c'
          assert d['primary_residues']==[436,503,922]
          assert d['primary_coordinate']==54 and d['primary_modulus']==1024
          assert d['secondary_coordinate']==48 and d['secondary_shard_count']==16
          assert d['node_cap']==18000000 and d['max_parallel']==15
          assert d['artifact_uncompressed_cap_bytes']==4000000
          assert d['artifact_retention_days']==7
          assert d['storage_budget_bytes']==524288000
          assert d['max_parallel']<=18
          inc=[]
          for p in d['primary_residues']:
              for s in range(16):
                  inc.append({'tag':f'c48x16-p{p}-s{s}','primary':p,'secondary':s})
          assert len(inc)==48

          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']
          current=0; page=1
          while True:
              url=f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'stage32-18y-budget-preflight'})
              with urllib.request.urlopen(req) as r:
                  payload=json.load(r)
              arts=payload.get('artifacts',[])
              current += sum(int(a['size_in_bytes']) for a in arts if not a.get('expired',False))
              if len(arts)<100: break
              page += 1
          worst_new=len(inc)*d['artifact_uncompressed_cap_bytes'] + 8000000
          projected=current+worst_new
          assert projected <= d['storage_budget_bytes'], (current,worst_new,projected,d['storage_budget_bytes'])
          print(json.dumps({'current_nonexpired_artifact_bytes':current,'worst_case_new_bytes':worst_new,'projected_peak_bytes':projected,'storage_budget_bytes':d['storage_budget_bytes'],'max_parallel':d['max_parallel'],'jobs':len(inc)},sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('generation=1\n')
              f.write('matrix='+json.dumps({'include':inc},separators=(',',':'))+'\n')
          PY

  pilot:
    needs: validate-run-key
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.validate-run-key.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Restore SHA-locked prepared certifiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prepared"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RUNNER_TEMP/prepared.zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9626136705/zip"
          echo 'f706cd79cf1fc64da0a59bc5cc528ea677e3892f602d3f58d78cb1543bf8380c  '"$RUNNER_TEMP/prepared.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/prepared.zip" -d "$RUNNER_TEMP/prepared"
          chmod +x "$RUNNER_TEMP/prepared/d16-two-stage-436" "$RUNNER_TEMP/prepared/d16-two-stage-503" "$RUNNER_TEMP/prepared/d16-two-stage-922"
      - name: Exact real-leaf pilot ${{ matrix.tag }}
        env:
          PRIMARY: ${{ matrix.primary }}
          SECONDARY: ${{ matrix.secondary }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          exe="$RUNNER_TEMP/prepared/d16-two-stage-$PRIMARY"
          set +e
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" \
            timeout --signal=TERM --kill-after=30s 50m \
            "$exe" \
              --input "$RUNNER_TEMP/prepared/d16-hperp.txt" \
              --bundle "$RUNNER_TEMP/prepared/d16-aut-prefix256-bundle.txt" \
              --output "$RUNNER_TEMP/out/cert.json" \
              --dump-canonical "$RUNNER_TEMP/out/dump.bin" \
              --bound 16 --shard-id "$SECONDARY" --shard-count 16 --split-coordinate 48 --node-cap 18000000 \
              >"$RUNNER_TEMP/out/stdout.txt" 2>"$RUNNER_TEMP/out/stderr.txt"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -q 'exact traversal node cap exceeded' "$RUNNER_TEMP/out/stderr.txt"; then
              STATUS='RESOURCE_WALL_NODE_CAP' RC="$rc" python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          lines=(root/'runtime.txt').read_text().strip().splitlines()
          runtime=float(lines[-1])
          out={'schema':'STAGE32_18Y_B16_TAIL_GEOMETRY_X16_RESULT_V1','tag':os.environ['TAG'],'primary_residue':int(os.environ['PRIMARY']),'secondary_shard':int(os.environ['SECONDARY']),'secondary_shard_count':16,'status':os.environ['STATUS'],'node_cap':18000000,'runtime_seconds':runtime,'exit_code':int(os.environ['RC']),'D16_B16_NUMERICAL_CREDIT':False}
          (root/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
            elif [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              STATUS='RESOURCE_WALL_WALLCLOCK' RC="$rc" python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          lines=(root/'runtime.txt').read_text().strip().splitlines()
          runtime=float(lines[-1])
          out={'schema':'STAGE32_18Y_B16_TAIL_GEOMETRY_X16_RESULT_V1','tag':os.environ['TAG'],'primary_residue':int(os.environ['PRIMARY']),'secondary_shard':int(os.environ['SECONDARY']),'secondary_shard_count':16,'status':os.environ['STATUS'],'node_cap':18000000,'wallclock_cap_seconds':3000,'runtime_seconds':runtime,'exit_code':int(os.environ['RC']),'D16_B16_NUMERICAL_CREDIT':False}
          (root/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
            else
              cat "$RUNNER_TEMP/out/stderr.txt"
              exit "$rc"
            fi
          else
            python - <<'PY'
          import hashlib,json,os,pathlib
          MAGIC=b'S32D16C1'; RS=141
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          d=json.loads((root/'cert.json').read_text()); p=int(os.environ['PRIMARY']); s=int(os.environ['SECONDARY'])
          assert d['schema']=='STAGE32_18X_D16_B16_TWO_STAGE_SHARD_V1' and d['status']=='COMPLETE' and d['bound']==16
          assert d['TRAVERSAL_COMPLETENESS_CERTIFICATE'] is True
          assert d['all_symmetry_branch_rejections_exact_rational_cauchy_schwarz'] is True
          assert d['aut_group_order']==1536 and d['dfs_symmetry_breaker_count']==256
          assert d['two_stage_partition'] is True
          assert (d['primary_shard_id'],d['primary_shard_count'],d['primary_split_coordinate'])==(p,1024,54)
          assert (d['secondary_shard_id'],d['secondary_shard_count'],d['secondary_split_coordinate'])==(s,16,48)
          raw=(root/'dump.bin').read_bytes(); assert raw[:8]==MAGIC and (len(raw)-8)%RS==0
          n=(len(raw)-8)//RS; assert n==int(d['canonical_survivors_including_zero'])
          lines=(root/'runtime.txt').read_text().strip().splitlines()
          runtime=float(lines[-1])
          out={'schema':'STAGE32_18Y_B16_TAIL_GEOMETRY_X16_RESULT_V1','tag':os.environ['TAG'],'primary_residue':p,'secondary_shard':s,'secondary_shard_count':16,'status':'COMPLETE','node_cap':18000000,'runtime_seconds':runtime,'canonical_survivors_including_zero':n,'canonical_norm_histogram':d['canonical_norm_histogram'],'canonical_dump_sha256':hashlib.sha256(raw).hexdigest(),'nodes':d.get('nodes'),'coordinate_trials':d.get('coordinate_trials'),'prepared_input_sha256':d.get('prepared_input_sha256'),'stable_aut_content_sha256':d.get('stable_aut_content_sha256'),'canonical_bundle_sha256':d.get('canonical_bundle_sha256'),'aut_group_order':1536,'dfs_symmetry_breaker_count':256,'D16_B16_NUMERICAL_CREDIT':False}
          (root/'compact.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
          fi

          bytes=$(du -sb "$RUNNER_TEMP/out" | cut -f1)
          if [ "$bytes" -gt 4000000 ]; then
            ARTIFACT_BYTES="$bytes" python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          p=root/'compact.json'; d=json.loads(p.read_text())
          if d.get('status')=='COMPLETE':
              d['status']='RESOURCE_WALL_ARTIFACT_SIZE'
              d['artifact_bytes_before_compaction']=int(os.environ['ARTIFACT_BYTES'])
              d['artifact_uncompressed_cap_bytes']=4000000
              d['D16_B16_NUMERICAL_CREDIT']=False
              for name in ('cert.json','dump.bin','stdout.txt','stderr.txt'):
                  q=root/name
                  if q.exists(): q.unlink()
              p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
              print(json.dumps({'tag':d['tag'],'status':d['status'],'artifact_bytes_before_compaction':d['artifact_bytes_before_compaction']},sort_keys=True))
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18y-b16-${{ matrix.tag }}-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error

  summarize:
    needs: [validate-run-key, pilot]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stage32-18y-b16-c48x16-*-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/runs
      - name: Verify x16 geometry evidence and freeze verdict
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          MAGIC=b'S32D16C1'; RS=141
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'runs'
          docs={}; dirs={}
          for p in root.rglob('compact.json'):
              d=json.loads(p.read_text()); docs[d['tag']]=d; dirs[d['tag']]=p.parent
          expected={f'c48x16-p{q}-s{s}' for q in (436,503,922) for s in range(16)}
          assert set(docs)==expected,(set(docs),expected)
          per={}; all_complete=True; source_lock=None
          for q in (436,503,922):
              ss=[docs[f'c48x16-p{q}-s{s}'] for s in range(16)]
              statuses=[d['status'] for d in ss]
              complete=all(x=='COMPLETE' for x in statuses)
              info={'statuses':statuses,'all_complete':complete,'runtime_seconds':[d['runtime_seconds'] for d in ss]}
              if complete:
                  recs=[]; hist={}
                  for s,d in enumerate(ss):
                      lock=(d['prepared_input_sha256'],d['stable_aut_content_sha256'],d['canonical_bundle_sha256'],d['aut_group_order'],d['dfs_symmetry_breaker_count'])
                      if source_lock is None: source_lock=lock
                      assert lock==source_lock
                      raw=(dirs[f'c48x16-p{q}-s{s}']/'dump.bin').read_bytes(); assert raw[:8]==MAGIC and (len(raw)-8)%RS==0
                      recs.extend(raw[i:i+RS] for i in range(8,len(raw),RS))
                      for k,v in d['canonical_norm_histogram'].items(): hist[str(k)]=hist.get(str(k),0)+int(v)
                  assert len(recs)==len(set(recs))
                  record_hist={}
                  for r in recs: record_hist[str(r[0])]=record_hist.get(str(r[0]),0)+1
                  assert record_hist==hist,(record_hist,hist)
                  union=MAGIC+b''.join(sorted(recs))
                  info['canonical_survivors_including_zero']=len(recs)
                  info['canonical_norm_histogram']=hist
                  info['union_dump_sha256']=hashlib.sha256(union).hexdigest()
                  info['max_runtime_seconds']=max(d['runtime_seconds'] for d in ss)
                  info['max_nodes']=max(int(d['nodes']) for d in ss)
              else:
                  all_complete=False
              per[str(q)]=info
          if all_complete:
              verdict='PASS_B16_TAIL_GEOMETRY__C48_SIXTEEN_WAY_CLOSES_HISTORICAL_TAILS__PRODUCTION_DESIGN_READY'
              next_item='32-18Z-D16-B16-RESOURCE-SAFE-EXACT-PRODUCTION-DESIGN'
          else:
              verdict='B16_TAIL_GEOMETRY__C48_SIXTEEN_WAY_INSUFFICIENT__FINER_SECONDARY_SPLIT_REQUIRED'
              next_item='32-18Z-D16-B16-C48X32-TAIL-PILOT'
          out={'schema':'STAGE32_18Y_B16_TAIL_GEOMETRY_X16_SUMMARY_V1','verdict':verdict,'primary_residues':[436,503,922],'primary_coordinate':54,'primary_modulus':1024,'secondary_coordinate':48,'secondary_shard_count':16,'node_cap':18000000,'per_primary':per,'next_item':next_item,'D16_B16_NUMERICAL_CREDIT':False,'GLOBAL_B16_AGGREGATION_COMPLETE':False,'FULL_D16_G0_ROW_COMPLETE':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False,'CONTROLLER_MODIFIED':False}
          outdir=pathlib.Path(os.environ['RUNNER_TEMP'])/'summary'; outdir.mkdir()
          (outdir/'stage32-18y-b16-tail-geometry-x16-summary.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'verdict':verdict,'per_primary':per,'next_item':next_item},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18y-b16-tail-geometry-x16-summary-g${{ needs.validate-run-key.outputs.generation }}
          path: ${{ runner.temp }}/summary/
          retention-days: 14
          if-no-files-found: error
