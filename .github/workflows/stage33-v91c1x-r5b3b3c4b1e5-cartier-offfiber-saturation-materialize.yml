name: Stage33 V91C1X R5B3B3C4B1E5 Cartier/off-fiber saturation materialize

on:
  push:
    branches:
      - stage33-v91c1x-r5b3b3c4b1e-1757-refinement-unit-preflight
    paths:
      - '.github/workflows/stage33-v91c1x-r5b3b3c4b1e5-cartier-offfiber-saturation-materialize.yml'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e5_rees_cartier_legitimacy_offfiber_saturation.py'
      - 'stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e4-rees-cartier-rational-gauge-lift.json'
      - 'stages/stage33/33-12/e3-v91c1x-r5b2c1-all-48-node-isolating-rees-neighborhoods.json'
      - 'stages/stage33/33-12/materialize_e3_v91c1x_r5b2c1_all_48_node_isolating_rees_neighborhoods.py'
      - 'stages/stage33/33-07/exceptional-p1-tangent-coordinates.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact dependency
        run: python -m pip install 'sympy==1.14.0'
      - name: Materialize exact C4B1E5 saturation audit
        run: python stages/stage33/33-12/materialize_e3_v91c1x_r5b3b3c4b1e5_rees_cartier_legitimacy_offfiber_saturation.py --write
      - name: Enforce artifact-only bounded delta
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e5-rees-cartier-legitimacy-offfiber-saturation.json'
          changed="$(git status --porcelain | sed 's/^...//')"
          test -n "$changed"
          test "$changed" = "$artifact"
          git diff --check
      - name: Commit generated certificate
        shell: bash
        run: |
          artifact='stages/stage33/33-12/e3-v91c1x-r5b3b3c4b1e5-rees-cartier-legitimacy-offfiber-saturation.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$artifact"
          git diff --cached --quiet || git commit -m '[Stage33] materialize C4B1E5 Cartier legitimacy/off-fiber saturation artifact'
          git push
