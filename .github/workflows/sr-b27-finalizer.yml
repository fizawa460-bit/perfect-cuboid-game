name: StructureRadar batch27 finalizer

on:
  push:
    branches:
      - structure-radar-deep-corpus-batch-27

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: structure-radar-deep-corpus-batch-27
          fetch-depth: 0
      - name: Apply batch27 census
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, string
          root=pathlib.Path('.')
          progress_p=root/'docs/structure-radar/progress.json'
          registry_p=root/'docs/structure-radar/structure-registry.json'
          queue=json.loads((root/'docs/structure-radar/exploration-queue.json').read_text())
          progress=json.loads(progress_p.read_text())
          registry=json.loads(registry_p.read_text())
          task=next(t for t in queue['tasks'] if t['status']=='READY' and t['phase']=='SOURCE_CENSUS')
          source_ids=task['source_ids']
          assert task['task_id']=='SR-CENSUS-STAGE14_15_DEEP_CORPUS-01'
          assert len(source_ids)==60
          source_map={}
          for p in (root/'docs/structure-radar/source-manifest').glob('part-*.json'):
              for s in json.loads(p.read_text())['sources']:
                  source_map[s['source_id']]=s
          suffixes=list('bstuvwxyz') + ['c'+x for x in string.ascii_lowercase] + ['d'+x for x in string.ascii_lowercase]
          # First component is bs..bz, not b+s..b+z generated above.
          suffixes=['b'+x for x in 'stuvwxyz'] + ['c'+x for x in string.ascii_lowercase] + ['d'+x for x in string.ascii_lowercase]
          assert len(suffixes)==60
          paths=[source_map[s]['path'] for s in source_ids]
          expected=[f'stages/stage15/15-6{x}/result.md' for x in suffixes]
          assert paths==expected, (paths[:3],paths[-3:])
          M={
            'bs':['SR-STR-179','SR-STR-017'],
            'bt':['SR-STR-017','SR-STR-216'],
            'bu':['SR-STR-044','SR-STR-200'],
            'bv':['SR-STR-169','SR-STR-222'],
            'bw':['SR-STR-200','SR-STR-202'],
            'bx':['SR-STR-215'],
            'by':['SR-STR-215','SR-STR-173'],
            'bz':['SR-STR-222','SR-STR-187'],
            'ca':['SR-STR-215','SR-STR-222'],
            'cb':[],
            'cc':[],
            'cd':[],
            'ce':['SR-STR-215'],
            'cf':['SR-STR-206','SR-STR-213'],
            'cg':[],
            'ch':['SR-STR-102','SR-STR-200'],
            'ci':['SR-STR-172'],
            'cj':['SR-STR-164','SR-STR-222'],
            'ck':['SR-STR-222','SR-STR-209'],
            'cl':['SR-STR-172'],
            'cm':['SR-STR-164','SR-STR-170'],
            'cn':['SR-STR-224','SR-STR-194'],
            'co':['SR-STR-213','SR-STR-170'],
            'cp':['SR-STR-164','SR-STR-170'],
            'cq':['SR-STR-224','SR-STR-219'],
            'cr':['SR-STR-215','SR-STR-173','SR-STR-170'],
            'cs':['SR-STR-215','SR-STR-194'],
            'ct':['SR-STR-194','SR-STR-200'],
            'cu':['SR-STR-200','SR-STR-194'],
            'cv':['SR-STR-200','SR-STR-222'],
            'cw':['SR-STR-222','SR-STR-200'],
            'cx':['SR-STR-222','SR-STR-145'],
            'cy':['SR-STR-222','SR-STR-206','SR-STR-169'],
            'cz':['SR-STR-194','SR-STR-195','SR-STR-198'],
            'da':['SR-STR-090','SR-STR-201','SR-STR-208'],
            'db':['SR-STR-089','SR-STR-213'],
            'dc':['SR-STR-208','SR-STR-090','SR-STR-222'],
            'dd':['SR-STR-090','SR-STR-201','SR-STR-173'],
            'de':['SR-STR-222','SR-STR-169','SR-STR-219'],
            'df':['SR-STR-200','SR-STR-202'],
            'dg':['SR-STR-200','SR-STR-202','SR-STR-194'],
            'dh':['SR-STR-169','SR-STR-190','SR-STR-222'],
            'di':['SR-STR-205','SR-STR-222','SR-STR-200'],
            'dj':['SR-STR-190','SR-STR-222','SR-STR-200'],
            'dk':['SR-STR-222','SR-STR-169','SR-STR-208'],
            'dl':['SR-STR-222','SR-STR-224','SR-STR-166'],
            'dm':['SR-STR-190','SR-STR-222','SR-STR-225'],
            'dn':['SR-STR-209','SR-STR-222'],
            'do':['SR-STR-209','SR-STR-190','SR-STR-205'],
            'dp':['SR-STR-166','SR-STR-225','SR-STR-222'],
            'dq':['SR-STR-222','SR-STR-225','SR-STR-209'],
            'dr':['SR-STR-209','SR-STR-166','SR-STR-222'],
            'ds':['SR-STR-090','SR-STR-200','SR-STR-206'],
            'dt':['SR-STR-200','SR-STR-222'],
            'du':['SR-STR-222','SR-STR-166','SR-STR-213'],
            'dv':['SR-STR-089','SR-STR-214','SR-STR-090'],
            'dw':['SR-STR-089','SR-STR-166','SR-STR-213'],
            'dx':['SR-STR-187','SR-STR-222'],
            'dy':['SR-STR-145','SR-STR-187','SR-STR-222'],
            'dz':['SR-STR-187','SR-STR-216','SR-STR-222'],
          }
          assert set(M)==set(suffixes)
          batch='SR-BATCH-STAGE14_15_DEEP_CORPUS-27-R01'
          cards={c['structure_id']:c for c in registry['structures']}
          union=set(); carrier=0; no_distinct=0
          for sid,suf in zip(source_ids,suffixes):
              s=source_map[sid]; ids=M[suf]
              if ids:
                  carrier+=1; union.update(ids)
                  progress['source_reviews'][sid]={
                    'fingerprint':s['fingerprint'],'status':'STRUCTURES_RECORDED','batch_id':batch,'structure_ids':ids
                  }
                  for cid in ids:
                      assert cid in cards, cid
                      prov=cards[cid]['repo_provenance']
                      assert all(x.get('source_id')!=sid for x in prov)
                      prov.append({'source_id':sid,'path':s['path'],'locator':'normalized Stage14-15 deep-corpus batch27 carrier','fingerprint':s['fingerprint']})
              else:
                  no_distinct+=1
                  progress['source_reviews'][sid]={
                    'fingerprint':s['fingerprint'],'status':'NO_DISTINCT_STRUCTURE','batch_id':batch
                  }
          assert carrier==56 and no_distinct==4 and len(union)==33
          assert not any(x.get('batch_id')==batch for x in progress.get('audit_batches',[]))
          progress['audit_batches'].append({
            'batch_id':batch,
            'task_id':task['task_id'],
            'status':'SUBMITTED_FOR_AUDIT',
            'source_ids':source_ids,
            'sources_reviewed':60,
            'structures_added':0,
            'structures_updated':len(union),
            'structure_carrier_sources':carrier,
            'structures_deduped':no_distinct,
            'searches_completed':0,
            'arsenal_decisions':0,
            'audit_required':True,
            'duplicate_source':0,
            'no_distinct_structure':no_distinct
          })
          registry['status']='BATCH_SUBMITTED_FOR_AUDIT'
          progress_p.write_text(json.dumps(progress,indent=2,ensure_ascii=False)+'\n')
          registry_p.write_text(json.dumps(registry,indent=2,ensure_ascii=False)+'\n')
          print('BATCH27_UNION='+','.join(sorted(union)))
          print(f'BATCH27_CARRIER={carrier}')
          print(f'BATCH27_NO_DISTINCT={no_distinct}')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          git diff --check
          rm .github/workflows/sr-b27-finalizer.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'StructureRadar: finalize deep corpus batch 27'
          git push origin HEAD:structure-radar-deep-corpus-batch-27
