name: StructureRadar batch30 diagnostic

on:
  push:
    branches:
      - structure-radar-history-batch-30

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit one-shot marker
        shell: bash
        run: |
          test -f .tmp/sr-b30-diag-ran.txt && exit 0
          mkdir -p .tmp
          printf 'diagnostic workflow ran\n' > .tmp/sr-b30-diag-ran.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp/sr-b30-diag-ran.txt
          git commit -m 'Temp: batch30 diagnostic marker'
          git push origin HEAD:structure-radar-history-batch-30
