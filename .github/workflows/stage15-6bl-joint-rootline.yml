name: Stage15-6bl joint rootline
on:
  pull_request:
    paths: ['stages/stage15/15-6bl/**','stages/stage15/evidence/stage15_6bl_joint_rootline.json','stages/stage15/replay/verify_stage15_6bl.py','stages/stage15/scripts/stage15_6bl_joint_rootline.py','.github/workflows/stage15-6bl-joint-rootline.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python stages/stage15/replay/verify_stage15_6bl.py
