name: Stage32 32-01-178 N300 second-half x4 capacity

on:
  pull_request:
    paths:
      - 'stages/stage32/32-01-178/nodes/N260/**'
      - 'stages/stage32/32-01-178/nodes/N280/**'
      - 'stages/stage32/32-01-178/nodes/N290/**'
      - 'stages/stage32/32-01-178/nodes/N300/**'
      - '.github/workflows/stage32-01-178-n300-second-half-x4-capacity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify N300 second-half x4 capacity cut
        run: python stages/stage32/32-01-178/nodes/N300/verify_n300_second_half_x4_capacity.py
