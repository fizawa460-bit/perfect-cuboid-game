name: Stage33 V91C1N-W fixed-space and source-bound transport diagnostics

on:
  pull_request:
    paths:
      - 'stages/stage33/**'
      - '.github/workflows/stage33-v91c1n-o-batch-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-v91c1n-w-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned exact local algebra
        run: python -m pip install 'sympy==1.14.0'
      - name: Verify V91C1N minimal fixed-space discriminator
        run: python stages/stage33/33-12/verify_e3_v91c1n_minimal_joint_v4_fixed_coordinate_discriminator.py
      - name: Diagnose V91C1O A2_02 generator stabilizers
        run: python stages/stage33/33-12/diagnose_e3_v91c1o_a2_02_geometric_stabilizer.py
      - name: Verify V91C1O preflight certificate
        run: python stages/stage33/33-12/verify_e3_v91c1o_a2_02_generator_stabilizer_preflight.py
      - name: Diagnose V91C1P full generated residue stabilizer
        run: python stages/stage33/33-12/diagnose_e3_v91c1p_a2_02_full_residue_stabilizer.py
      - name: Verify V91C1P preflight certificate
        run: python stages/stage33/33-12/verify_e3_v91c1p_a2_02_full_residue_stabilizer_preflight.py
      - name: Diagnose V91C1Q shortest mask20-moving stabilizer word
        run: python stages/stage33/33-12/diagnose_e3_v91c1q_shortest_mask20_moving_stabilizer_word.py
      - name: Diagnose V91C1R source-bound swap23 boundary-function package transport
        run: python stages/stage33/33-12/diagnose_e3_v91c1r_swap23_boundary_function_package_transport.py
      - name: Diagnose V91C1S swap23 actual-prime attached Cech difference
        run: python stages/stage33/33-12/diagnose_e3_v91c1s_swap23_prime_attached_cech_difference.py
      - name: Diagnose V91C1V actual-prime to known140 locator
        run: python stages/stage33/33-12/diagnose_e3_v91c1v_actual_prime_known140_locator.py
      - name: Diagnose V91C1W all-eight strict-scheme provenance
        run: python stages/stage33/33-12/diagnose_e3_v91c1w_all8_strict_scheme_provenance.py
      - name: Diagnose V91C1W all-eight Picard64 reduction v2
        run: python stages/stage33/33-12/diagnose_e3_v91c1w_all8_picard64_reduction_v2.py
      - name: Verify V91C1V bounded locator certificate
        run: python stages/stage33/33-12/verify_e3_v91c1v_a2_02_actual_prime_known140_locator_bounded_result.py
      - name: Verify Stage33 startup authority and V91C1V audit gate
        run: |
          python stages/stage33/33-12/verify_stage33_v91c1v_candidate_current_startup_v106.py
          python stages/stage33/sync_main_state.py --check
      - name: Diff hygiene
        run: git diff --check
