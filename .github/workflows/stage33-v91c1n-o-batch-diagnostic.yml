name: Stage33 V91C1N-X_R1 retained transport and chain-blocker diagnostics

on:
  pull_request:
    paths:
      - 'stages/stage33/**'
      - '.github/workflows/stage33-v91c1n-o-batch-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage33-v91c1n-xr1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned exact local algebra
        run: python -m pip install 'sympy==1.14.0'
      - name: Replay retained stabilizer and swap23 transport chain through W
        run: |
          python stages/stage33/33-12/verify_e3_v91c1n_minimal_joint_v4_fixed_coordinate_discriminator.py
          python stages/stage33/33-12/diagnose_e3_v91c1o_a2_02_geometric_stabilizer.py
          python stages/stage33/33-12/verify_e3_v91c1o_a2_02_generator_stabilizer_preflight.py
          python stages/stage33/33-12/diagnose_e3_v91c1p_a2_02_full_residue_stabilizer.py
          python stages/stage33/33-12/verify_e3_v91c1p_a2_02_full_residue_stabilizer_preflight.py
          python stages/stage33/33-12/diagnose_e3_v91c1q_shortest_mask20_moving_stabilizer_word.py
          python stages/stage33/33-12/diagnose_e3_v91c1r_swap23_boundary_function_package_transport.py
          python stages/stage33/33-12/diagnose_e3_v91c1s_swap23_prime_attached_cech_difference.py
          python stages/stage33/33-12/diagnose_e3_v91c1v_actual_prime_known140_locator.py
          python stages/stage33/33-12/diagnose_e3_v91c1w_all8_strict_scheme_provenance.py
          python stages/stage33/33-12/diagnose_e3_v91c1w_all8_picard64_reduction_v2.py
          python stages/stage33/33-12/verify_e3_v91c1w_a2_02_all8_picard64_reduction.py
      - name: Replay X_R1 exact negative chain-level preflight
        run: python stages/stage33/33-12/diagnose_e3_v91c1x_r1_chain_level_action_difference_preflight.py
      - name: Verify Stage33 V111 current startup frontier
        run: |
          python stages/stage33/33-12/verify_stage33_v91c1x_r1_chain_preflight_current_startup_v111.py
          python stages/stage33/sync_main_state.py --check
      - name: Diff hygiene
        run: git diff --check
