name: StructureRadar b39 anti-loop

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'structure-radar-parallel-39-antiloop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append batch39 anti-loop accounting and self-clean
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/structure-radar/progress.json')
          data=json.loads(p.read_text())
          bid='SR-BATCH-PARALLEL-39-ANTI-LOOP-R01'
          rows=data['audit_batches']
          if not any(x.get('batch_id')==bid for x in rows):
              rows.append({
                  'batch_id': bid,
                  'phase': 'EXTERNAL_GATE_CLOSURE',
                  'status': 'SUBMITTED_FOR_AUDIT',
                  'mode': 'ONE_PR_FOUR_LANE_ANTI_LOOP_PRECHECK',
                  'anti_loop_policy': 'docs/structure-radar/anti-loop-policy.json',
                  'structure_ids': ['SR-STR-167','SR-STR-174','SR-STR-019','SR-STR-024'],
                  'parallel_lane_count': 4,
                  'single_pr_for_all_lanes': True,
                  'gates_closed': 0,
                  'external_gate_count_before': 13,
                  'external_gate_count_after': 13,
                  'sr_str_167_anti_loop_state': 'THEOREM_GATE_PAUSED',
                  'sr_str_167_frozen_missing_lemma': 'MAINWallPhysicalSelectorCanonicalCorrelationDecompositionAdapter',
                  'sr_str_174_anti_loop_state': 'THEOREM_GATE_PAUSED',
                  'sr_str_174_frozen_missing_lemma': 'MAINWallWeightedQ17GoodWitnessJointIncidenceExceptionalMassAdapter',
                  'sr_str_019_anti_loop_state': 'THEOREM_GATE_PAUSED',
                  'sr_str_019_frozen_missing_lemma': 'IndividualCellCommonParentNestedDivisorBilinearIncidenceEstimate',
                  'sr_str_019_stage27_route_consolidated': True,
                  'sr_str_019_stage27_route_consolidated_into': 'SR-STR-169 same-MAIN aggregate L2/correlation route',
                  'sr_str_024_anti_loop_state': 'WORK_ONLY',
                  'sr_str_024_frozen_missing_lemma': 'UniformFilteredQuotientCharacterVoronoiFunctionalEquationAdapter',
                  'normal_chatgpt_stopped_count': 4,
                  'substantive_routing_progress_count': 1,
                  'next_rotation_structure_ids': ['SR-STR-162','SR-STR-223','SR-STR-222','SR-STR-021'],
                  'overall_pause_recommended': False,
                  'work_delegation_recommended': True,
                  'primary_work_target': 'SR-STR-169 / MAINWallPrimitiveInverseFrequencySameMeasureLargeSieveQuadraticFormDeficit',
                  'secondary_work_target': 'SR-STR-024 / UniformFilteredQuotientCharacterVoronoiFunctionalEquationAdapter',
                  'audit_required': True
              })
          p.write_text(json.dumps(data, indent=2)+'\n')
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          rm .github/workflows/structure-radar-b39-antiloop.yml
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add docs/structure-radar/progress.json .github/workflows/structure-radar-b39-antiloop.yml
          git commit -m 'StructureRadar: materialize anti-loop batch 39' || true
          git push origin HEAD:${{ github.head_ref }}
