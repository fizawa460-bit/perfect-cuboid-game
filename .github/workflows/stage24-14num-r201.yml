name: 24-14num-r201 matched M2 bootstrap

on:
  pull_request:
    paths:
      - 'stages/stage24/24-14num-r201/**'
      - 'stages/stage15/scripts/paired_enumerator.py'
      - '.github/workflows/stage24-14num-r201.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact matched M2/N2 bootstrap
        run: python stages/stage24/24-14num-r201/bootstrap.py
      - name: Show frozen bootstrap summary
        run: cat stages/stage24/24-14num-r201/bootstrap-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage24-14num-r201-bootstrap-summary
          path: stages/stage24/24-14num-r201/bootstrap-summary.json
