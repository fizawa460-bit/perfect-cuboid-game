name: Stage35-EX Goal4AA principal target probe
on:
  pull_request:
    paths:
      - 'stages/stage35-ex/probe_goal4aa_principal_target.py'
      - '.github/workflows/stage35-ex-goal4aa-principal-target-probe.yml'
  workflow_dispatch:
jobs:
  probe-goal4aa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 320
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check sympy
      - run: python -B stages/stage35-ex/probe_goal4aa_principal_target.py
