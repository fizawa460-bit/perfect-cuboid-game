name: Stage32-12 e8 full-parent numerical orbit census

on:
  pull_request:
    paths:
      - 'stages/stage32/32-12/**'
      - '.github/workflows/stage32-12-e8-parent-orbits.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-e8-parent-and-orbits:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact verifier dependency
        run: pip install sympy==1.14.0
      - name: Download source-locked evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"/{tier,profile,repair,core,action,tail,out}
          gh run download 32686588363 --repo fizawa460-bit/perfect-cuboid-game --name stage32-10-e8-a36-le65536-exact-tier --dir "$RUNNER_TEMP/tier"
          gh run download 32679056269 --repo fizawa460-bit/perfect-cuboid-game --name stage32-08-e8-a36-materialization-profile --dir "$RUNNER_TEMP/profile"
          gh run download 32694939071 --repo fizawa460-bit/perfect-cuboid-game --name stage32-11r-timeout-shard-aggregate --dir "$RUNNER_TEMP/repair"
          gh run download 32624596141 --repo fizawa460-bit/perfect-cuboid-game --name stage32-01-low-degree-verified-prefix --dir "$RUNNER_TEMP/core"
          gh run download 32674649970 --repo fizawa460-bit/perfect-cuboid-game --name stage32-07-d8g0-e2-a54-aut-orbits --dir "$RUNNER_TEMP/action"
          gh run download 32689063120 --repo fizawa460-bit/perfect-cuboid-game --name stage32-11-e8-a36-cell-3-1f72b6cd2e1f0fa1ed2242ac --dir "$RUNNER_TEMP/tail/cell3"
          gh run download 32689063120 --repo fizawa460-bit/perfect-cuboid-game --name stage32-11-e8-a36-cell-12-6255f13f554f292a69766726 --dir "$RUNNER_TEMP/tail/cell12"
          gh run download 32689063120 --repo fizawa460-bit/perfect-cuboid-game --name stage32-11-e8-a36-cell-32-ae613a0b4080925693f6bc0b --dir "$RUNNER_TEMP/tail/cell32"
          gh run download 32689063120 --repo fizawa460-bit/perfect-cuboid-game --name stage32-11-e8-a36-cell-34-b985be195269a6a2254d7680 --dir "$RUNNER_TEMP/tail/cell34"
          gh run download 32689063120 --repo fizawa460-bit/perfect-cuboid-game --name stage32-11-e8-a36-cell-42-d9fc54429a74c7ac51ce526d --dir "$RUNNER_TEMP/tail/cell42"
          gh run download 32689063120 --repo fizawa460-bit/perfect-cuboid-game --name stage32-11-e8-a36-cell-44-e20ebc392d1a1f553d83fd94 --dir "$RUNNER_TEMP/tail/cell44"
          gh run download 32689063120 --repo fizawa460-bit/perfect-cuboid-game --name stage32-11-e8-a36-cell-45-e4bd3088438e7c60b1b4e7a6 --dir "$RUNNER_TEMP/tail/cell45"
          gh run download 32689063120 --repo fizawa460-bit/perfect-cuboid-game --name stage32-11-e8-a36-cell-51-fa50992d9fab8d914eb6774e --dir "$RUNNER_TEMP/tail/cell51"
      - name: Assemble exact 53-cell e8/a36 parent
        run: |
          python stages/stage32/32-12/assemble_e8_parent.py \
            --tier "$RUNNER_TEMP/tier/tier65536.json" \
            --profile "$RUNNER_TEMP/profile/materialization-profile.json" \
            --repair "$RUNNER_TEMP/repair/timeout-shard-aggregate.json" \
            --tail-dir "$RUNNER_TEMP/tail" \
            --output "$RUNNER_TEMP/out/e8-a36-full-parent.json"
      - name: Partition full parent under source-locked Aut(S)
        run: |
          python stages/stage32/32-12/verify_e8_parent_aut_orbits.py \
            --core "$RUNNER_TEMP/core/picard-core.json" \
            --action "$RUNNER_TEMP/action/aut-action.json" \
            --parent "$RUNNER_TEMP/out/e8-a36-full-parent.json" \
            --output "$RUNNER_TEMP/out/e8-a36-full-parent-aut-orbits.json"
      - name: Enforce credit firewalls
        run: |
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          for name in ('e8-a36-full-parent.json','e8-a36-full-parent-aut-orbits.json'):
              d=json.loads((root/name).read_text())
              assert d['theorem_credit'] is False
              assert d['receiver_credit'] is False
              assert d['FULL_D8_G0_ROW_COMPLETE'] is False
              assert d['FULL_D176_D192_NUMERICAL_ORBIT_CENSUS'] is False
              assert d['R29_LG2_NUMERICAL_COMPONENT_COMPLETE'] is False
              assert d['R29_LG2']=='NOT_DISCHARGED'
              assert d['R29_LG2_EFF']=='NOT_DISCHARGED'
              assert d['R29_LG2_MB']=='NOT_DISCHARGED'
              assert d['G10_LOWGENUS_PICARD']=='AMBER'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-12-e8-a36-full-parent-aut-orbit-census
          path: ${{ runner.temp }}/out/*.json
          if-no-files-found: error
