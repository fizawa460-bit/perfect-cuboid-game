name: Stage32-21ad FULL178 anti-fixed coset census

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32/residual-32-01-production/build_stage32_21ad_full178_antifixed_coset_census.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_reynolds_rank2_antifixed_coset_bound.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_reynolds_rank2_quotient_class_map.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_reynolds_antifixed_coset_penalty.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_reynolds_rank2_integer_qp.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_reynolds_rank2_integral_projection_bound.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_reynolds_lattice_diagnostic.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_orbit_sum_qp_bound.py'
      - 'stages/stage32/residual-32-01-production/direct_picard_slice_bridge.py'
      - 'stages/stage32/residual-32-01-production/hperp_integral_adapter.py'
      - 'stages/stage32/residual-32-01-production/full178-manifest.json'
      - 'stages/stage32/runkeys/stage32-21ad-full178-antifixed-coset-census.json'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'
      - '.github/workflows/stage32-21ad-full178-antifixed-coset-census.yml'

permissions:
  contents: read

concurrency:
  group: stage32-21ad-full178-antifixed-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUNKEY: stages/stage32/runkeys/stage32-21ad-full178-antifixed-coset-census.json
  DRIVER: stages/stage32/residual-32-01-production/build_stage32_21ad_full178_antifixed_coset_census.py
  MANIFEST: stages/stage32/residual-32-01-production/full178-manifest.json
  RETAINED: stages/stage33/33-07/picard_base_rows_retained.py
  MARKING: stages/stage33/33-07/stage32_picard_marking_retained.py

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      armed: ${{ steps.gate.outputs.armed }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        name: Authorize only a fresh run-key-only synchronize commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          runkey_path = os.environ['RUNKEY']
          key = json.loads(Path(runkey_path).read_text())
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          action = event.get('action')
          before = event.get('before')
          after = event.get('after') or event['pull_request']['head']['sha']
          expected_base = key.get('expected_base_merge_commit')
          reasons = []

          if action != 'synchronize':
              reasons.append('action_not_synchronize')
          if key.get('armed') is not True:
              reasons.append('runkey_not_armed')
          if not isinstance(key.get('generation'), int) or key['generation'] <= 0:
              reasons.append('generation_not_positive')
          if key.get('requested_heavy_jobs') != 1:
              reasons.append('requested_heavy_jobs_not_one')
          if key.get('maximum_effective_stage32_heavy_overlap', 999) > 18:
              reasons.append('stage32_concurrency_ceiling_exceeded')
          if key.get('legacy_prefix_dfs_heavy_rearm_authorized') is not False:
              reasons.append('legacy_prefix_dfs_rearm_not_forbidden')
          if key.get('blind_512m_or_higher_arm_authorized') is not False:
              reasons.append('blind_escalation_not_forbidden')

          changed = []
          if action == 'synchronize' and before and after:
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', before, after], text=True
              ).splitlines()
              if changed != [runkey_path]:
                  reasons.append('synchronize_diff_not_exactly_runkey')
          elif action == 'synchronize':
              reasons.append('missing_before_after')

          if expected_base:
              ok = subprocess.run(
                  ['git', 'merge-base', '--is-ancestor', expected_base, after]
              ).returncode == 0
              if not ok:
                  reasons.append('audited_base_not_ancestor')
          else:
              reasons.append('missing_expected_base')

          armed = not reasons
          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a') as fh:
              fh.write(f"armed={'true' if armed else 'false'}\n")
              fh.write(f"reason={'AUTHORIZED' if armed else ','.join(reasons)}\n")
          print(json.dumps({
              'armed': armed,
              'reason': 'AUTHORIZED' if armed else reasons,
              'action': action,
              'before': before,
              'after': after,
              'changed_files': changed,
              'generation': key.get('generation'),
          }, sort_keys=True))
          PY

  preflight:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Deterministic 1-of-16 row-shard preflight
        run: |
          python "$DRIVER" \
            --manifest "$MANIFEST" \
            --retained "$RETAINED" \
            --marking "$MARKING" \
            --row-shards 16 \
            --shard-index 0 \
            --output stage32-21ad-preflight.json
      - name: Upload compact preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-21ad-deterministic-shard-preflight
          path: stage32-21ad-preflight.json
          retention-days: 7
          compression-level: 9

  full-census:
    needs: [authorize, preflight]
    if: needs.authorize.outputs.armed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Install exact local algebra dependency
        run: python -m pip install --disable-pip-version-check 'sympy==1.14.0'
      - name: Exact FULL178 audited anti-fixed coset census
        run: |
          python "$DRIVER" \
            --manifest "$MANIFEST" \
            --retained "$RETAINED" \
            --marking "$MARKING" \
            --output stage32-21ad-full178-census.json
      - name: Upload compact FULL178 exact census evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-21ad-full178-antifixed-coset-census
          path: stage32-21ad-full178-census.json
          retention-days: 7
          compression-level: 9
