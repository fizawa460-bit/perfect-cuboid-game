name: StructureRadar search10 cadence repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.head_ref == 'structure-radar-search-10-finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Permanently set literature-search cadence to 10
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/structure_radar.py')
          s=p.read_text()
          old='for index, batch in enumerate(chunks(searchable, 8), start=1):'
          new='for index, batch in enumerate(chunks(searchable, 10), start=1):'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
          python scripts/structure_radar.py refresh
          python scripts/structure_radar.py verify
          python - <<'PY'
          import json
          q=json.load(open('docs/structure-radar/exploration-queue.json'))
          ready=next(t for t in q['tasks'] if t['status']=='READY')
          assert ready['phase']=='LITERATURE_SEARCH'
          assert ready['structure_ids']==['SR-STR-084','SR-STR-085','SR-STR-086','SR-STR-087','SR-STR-088','SR-STR-089','SR-STR-090','SR-STR-091','SR-STR-092','SR-STR-093'], ready
          PY
          rm .github/workflows/structure-radar-search10-cadence-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'StructureRadar: persist 10-card literature cadence'
          git push origin HEAD:${{ github.head_ref }}
