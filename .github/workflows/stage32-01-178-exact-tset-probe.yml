name: Stage32 32-01-178 V48 full-support 384 min-bound
# lifecycle: ACTIVE_AUTO
on:
  push:
    branches: [stage32-01-178-post-td02-fibration-nef]
    paths: ['.github/workflows/stage32-01-178-exact-tset-probe.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stage32-01-178-exact-tset-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate-min-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify aggregate source
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("stages/stage32/32-01-178/fibration-nef/aggregate_v48_full_support_min_bound.py")
          raw=p.read_bytes()
          got=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          assert got=="d2a197701acf4c8447176256662d736b6d3f4d91", got
          PY

      - name: Download frozen V48 pair receipts with pagination
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v48-pairs /tmp/v48-zips
          : > /tmp/v48-artifacts.tsv
          for page in 1 2; do
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/35906475088/artifacts?per_page=100&page=${page}" \
              --jq '.artifacts[] | select(.name | startswith("v47-support-qbc-pair-")) | [.id,.name] | @tsv' \
              >> /tmp/v48-artifacts.tsv
          done
          count="$(wc -l < /tmp/v48-artifacts.tsv)"
          echo "PAIR_ARTIFACT_COUNT=${count}"
          test "${count}" -eq 192
          while read -r id name; do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              --output "/tmp/v48-zips/${id}.zip"
            unzip -qo "/tmp/v48-zips/${id}.zip" -d /tmp/v48-pairs
          done
          test "$(find /tmp/v48-pairs -maxdepth 1 -name 'row*-b*.json' | wc -l)" -eq 384

      - name: Verify receipt census and aggregate min-bound
        run: |
          set -euo pipefail
          test "$(find /tmp/v48-pairs -maxdepth 1 -name 'row*-b*.json' | wc -l)" -eq 384
          python stages/stage32/32-01-178/fibration-nef/aggregate_v48_full_support_min_bound.py \
            --v48-dir /tmp/v48-pairs \
            --output /tmp/V48-FULL-SUPPORT-384-MIN-BOUND.json

      - name: Persist compact zero-credit certificate
        run: |
          set -euo pipefail
          out="stages/stage32/32-01-178/fibration-nef/V48-FULL-SUPPORT-384-MIN-BOUND-RETAINED.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          src=Path("/tmp/V48-FULL-SUPPORT-384-MIN-BOUND.json")
          dst=Path("stages/stage32/32-01-178/fibration-nef/V48-FULL-SUPPORT-384-MIN-BOUND-RETAINED.json")
          o=json.loads(src.read_text())
          o["execution"]={
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "execution_head": os.environ["GITHUB_SHA"],
              "workflow_path": ".github/workflows/stage32-01-178-exact-tset-probe.yml",
              "aggregate_blob_sha1": "d2a197701acf4c8447176256662d736b6d3f4d91",
              "result_retained_by_workflow": True,
          }
          o.pop("canonical_sha256_without_this_field",None)
          raw=json.dumps(o,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
          o["canonical_sha256_without_this_field"]=hashlib.sha256(raw).hexdigest()
          dst.write_text(json.dumps(o,sort_keys=True,indent=2)+"\n")
          print("RETAINED_CANONICAL="+o["canonical_sha256_without_this_field"])
          print("RETAINED_RESULT="+json.dumps(o["result"],sort_keys=True))
          print("RETAINED_COVERAGE="+json.dumps(o["coverage"],sort_keys=True))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${out}"
          git diff --cached --quiet && { echo "FAIL: no retained certificate produced"; exit 1; }
          git commit -m "stage32 178: retain V48 full-support 384 min-bound"
          git push origin "HEAD:${GITHUB_REF_NAME}"
