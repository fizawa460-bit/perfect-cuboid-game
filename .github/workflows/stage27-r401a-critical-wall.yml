name: Stage27-r401a critical wall localization

on:
  pull_request:
    paths:
      - 'stages/stage27/**'
      - 'stages/stage14/final.md'
      - 'docs/00_CURRENT_RESEARCH_STATUS.md'
      - '.github/workflows/stage27-r401a-critical-wall.yml'
  workflow_dispatch:

jobs:
  verify-r401a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Stage27-r401a
        run: python stages/stage27/27-r401a/verify_r401a.py
