name: Stage14-t62 matched rectangle frame

on:
  pull_request:
    paths:
      - 'stages/stage14/14-t62/**'
      - 'stages/stage14/data/14-t62/**'
      - 'stages/stage14/scripts/14-t/t62_matched_rectangle_frame_audit.py'
      - 'stages/stage14/scripts/14-t/t62_validate_frozen.py'
      - '.github/workflows/stage14-t62-matched-rectangle-frame.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run t61 predecessor regression
        run: python stages/stage14/scripts/14-t/t61_polar_schatten_obstruction_audit.py > /tmp/t61.json
      - name: Run t62 matched rectangle frame audit
        run: python stages/stage14/scripts/14-t/t62_matched_rectangle_frame_audit.py > /tmp/t62.json
      - name: Validate frozen t62 boundary
        run: python stages/stage14/scripts/14-t/t62_validate_frozen.py
      - name: Compile t62 scripts
        run: python -m py_compile stages/stage14/scripts/14-t/t62_matched_rectangle_frame_audit.py stages/stage14/scripts/14-t/t62_validate_frozen.py
