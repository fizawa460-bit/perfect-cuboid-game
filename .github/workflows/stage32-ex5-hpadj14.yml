name: Stage32EX5 HPADJ14 row-exact capacity

# Trigger lifecycle: ACTIVE_AUTO — current EX5 HPADJ14 producer / audit-boundary gate.
# Retire or demote when HPADJ14 ceases to be the active EX5 leaf.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'stages/stage32-ex5/hpadj-14_ex5/**'
      - '.github/workflows/stage32-ex5-hpadj14.yml'

permissions:
  contents: read

jobs:
  hpadj14-row-exact-capacity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
      - name: Checkout exact current MAIN V35 candidate source
        uses: actions/checkout@v4
        with:
          repository: fizawa460-bit/perfect-cuboid-game
          ref: a01dfd4173ae46c7d51e4f6f9ecdad8b4755f90c
          path: _main-v35-current
          fetch-depth: 1
      - name: Checkout V34 MAIN predecessor
        uses: actions/checkout@v4
        with:
          repository: fizawa460-bit/perfect-cuboid-game
          ref: 8ec716abbaebbdf91d8452f19145a66c310bd222
          path: _main-v34
          fetch-depth: 1
      - name: Checkout hostile-audited TD01 envelope
        uses: actions/checkout@v4
        with:
          repository: fizawa460-bit/perfect-cuboid-game
          ref: 54945927416a94a67533c7b06c59c5a24e50c4f1
          path: _td01-audit
          fetch-depth: 1
      - name: Checkout hostile-audited symbolic GRF04 kernel
        uses: actions/checkout@v4
        with:
          repository: fizawa460-bit/perfect-cuboid-game
          ref: d534e107bfcf68ab1d687366afd3671a152f6e2b
          path: _grf04-audit
          fetch-depth: 1
      - name: Checkout hostile-audited HPADJ08 source
        uses: actions/checkout@v4
        with:
          repository: fizawa460-bit/perfect-cuboid-game
          ref: 36eab50192cf80ec5ed48aba40f4a56076759fea
          path: _hpadj08-audit
          fetch-depth: 1
      - name: Checkout exact TD02 concrete formula source
        uses: actions/checkout@v4
        with:
          repository: fizawa460-bit/perfect-cuboid-game
          ref: f305d4f270a708051c9a2b3b04f7ab25f6cdfdbe
          path: _td02-source
          fetch-depth: 1
      - name: Reverify exact MAIN V35 source dependency
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C _main-v35-current rev-parse HEAD)" = "a01dfd4173ae46c7d51e4f6f9ecdad8b4755f90c"
          test "$(git -C _main-v34 rev-parse HEAD)" = "8ec716abbaebbdf91d8452f19145a66c310bd222"
          test "$(git -C _td01-audit rev-parse HEAD)" = "54945927416a94a67533c7b06c59c5a24e50c4f1"
          test "$(git -C _grf04-audit rev-parse HEAD)" = "d534e107bfcf68ab1d687366afd3671a152f6e2b"
          test "$(git -C _hpadj08-audit rev-parse HEAD)" = "36eab50192cf80ec5ed48aba40f4a56076759fea"
          test "$(git -C _td02-source rev-parse HEAD)" = "f305d4f270a708051c9a2b3b04f7ab25f6cdfdbe"
          python _main-v35-current/stages/stage32/management/grf04-uniform-bound/verify_grf04_v35_uniform_block_bound_candidate.py \
            --v34-root _main-v34 \
            --td01-root _td01-audit \
            --grf04-root _grf04-audit \
            --hpadj08-root _hpadj08-audit \
            --td02-root _td02-source
      - name: Derive HPADJ14 row-exact GRF04 Picard capacity bound
        run: |
          python stages/stage32-ex5/hpadj-14_ex5/derive_row_exact_grf04_picard_capacity_bound.py \
            --v35-root _main-v35-current | tee /tmp/hpadj14.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('/tmp/hpadj14.json').read_text())
          assert d['status'] == 'STRICTER_ROW_EXACT_GRF04_PICARD_CAPACITY_CANDIDATE_HOSTILE_AUDIT_REQUIRED'
          assert d['exact_population_adapter']['post_hpadj08_x4_complete_survivor_mass'] == 6703403803993209250491
          assert d['candidate_bound']['hpadj14_candidate_upper_bound'] < 511195899564352597589
          assert d['candidate_bound']['strict_improvement_vs_main_v35_candidate'] is True
          assert d['semantics']['statistical_independence_assumed'] is False
          assert d['firewalls']['stage32_main_pruning_credit'] is False
          print('HPADJ14_CANONICAL=' + d['canonical_sha256_without_this_field'])
          print('HPADJ14_UPPER=' + str(d['candidate_bound']['hpadj14_candidate_upper_bound']))
          print('HPADJ14_IMPROVEMENT_VS_V35=' + str(d['candidate_bound']['improvement_vs_main_v35_candidate']))
          PY
