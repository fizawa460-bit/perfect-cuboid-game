name: Stage24-60 interaction algebra audit

on:
  pull_request:
    paths:
      - 'stages/stage24/24-60/**'
      - 'stages/stage24/24-controller.json'
      - '.github/workflows/stage24-60-interaction-audit.yml'
  workflow_dispatch:

jobs:
  exact-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify interaction exponent algebra
        run: python stages/stage24/24-60/interaction_formula_audit.py
