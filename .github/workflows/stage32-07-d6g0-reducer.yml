name: Stage32-07 d6g0 exact reducer discovery

on:
  pull_request:
    paths:
      - 'stages/stage32/32-07/**'
      - '.github/workflows/stage32-07-d6g0-reducer.yml'

permissions:
  contents: read
  actions: read

jobs:
  d6g0-reducer:
    name: d6g0-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - label: e0-a45
            e: 0
            a: 45
          - label: e1-a42
            e: 1
            a: 42
          - label: e2-a38
            e: 2
            a: 38
          - label: e2-a39
            e: 2
            a: 39
          - label: e3-a35
            e: 3
            a: 35
          - label: e3-a36
            e: 3
            a: 36
          - label: e4-a31
            e: 4
            a: 31
          - label: e4-a32
            e: 4
            a: 32
          - label: e4-a33
            e: 4
            a: 33
          - label: e5-a28
            e: 5
            a: 28
          - label: e5-a29
            e: 5
            a: 29
          - label: e5-a30
            e: 5
            a: 30
          - label: e6-a24
            e: 6
            a: 24
          - label: e6-a25
            e: 6
            a: 25
          - label: e6-a26
            e: 6
            a: 26
          - label: e6-a27
            e: 6
            a: 27
          - label: e7-a21
            e: 7
            a: 21
          - label: e7-a22
            e: 7
            a: 22
          - label: e7-a23
            e: 7
            a: 23
          - label: e7-a24
            e: 7
            a: 24
          - label: e8-a18
            e: 8
            a: 18
          - label: e8-a19
            e: 8
            a: 19
          - label: e8-a20
            e: 8
            a: 20
          - label: e8-a21
            e: 8
            a: 21
          - label: e9-a15
            e: 9
            a: 15
          - label: e9-a16
            e: 9
            a: 16
          - label: e9-a17
            e: 9
            a: 17
          - label: e9-a18
            e: 9
            a: 18
          - label: e10-a12
            e: 10
            a: 12
          - label: e10-a13
            e: 10
            a: 13
          - label: e10-a14
            e: 10
            a: 14
          - label: e10-a15
            e: 10
            a: 15
          - label: e11-a9
            e: 11
            a: 9
          - label: e11-a10
            e: 11
            a: 10
          - label: e11-a11
            e: 11
            a: 11
          - label: e11-a12
            e: 11
            a: 12
          - label: e12-a6
            e: 12
            a: 6
          - label: e12-a7
            e: 12
            a: 7
          - label: e12-a8
            e: 12
            a: 8
          - label: e12-a9
            e: 12
            a: 9
          - label: e13-a3
            e: 13
            a: 3
          - label: e13-a4
            e: 13
            a: 4
          - label: e13-a5
            e: 13
            a: 5
          - label: e13-a6
            e: 13
            a: 6
