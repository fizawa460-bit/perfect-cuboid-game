name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DL exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=fd628494e24daa6a6d9f300f0b61b90a1c26432e
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DL.py"
          git worktree remove --force "$tmp"
      - name: Verify 36-09DM entire Creutz-Viray explicit-image adelic control
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DM.py
      - name: Assert DM checkpoint and DN lock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V189_36_09DM_CHECKPOINT_REPAIR_PENDING_EXACT_HEAD_CI'
          dm=s['authority_frontier']['36-09DM']
          assert dm['status']=='PROVISIONAL_PENDING_EXACT_HEAD_CI'
          assert dm['certificate_blob_sha']=='95956c74aca1aca1601a1f4c77b66bfb226a5198'
          assert dm['verifier_blob_sha']=='db57b0e9e45573425633f59958cda42fd5d2b75c'
          assert dm['P2_ADELIC_POINT_ORTHOGONAL_ENTIRE_CV_EXPLICIT_IMAGE'] is True
          assert dm['FULL_CREUTZ_VIRAY_EXPLICIT_IMAGE_BM_SET_NONEMPTY'] is True
          assert dm['FULL_CREUTZ_VIRAY_EXPLICIT_IMAGE_BM_OBSTRUCTION_DISPROVED'] is True
          assert dm['RATIONAL_PLUS_F5_BM_SET_NONEMPTY'] is True
          assert dm['FULL_CREUTZ_VIRAY_EXPLICIT_IMAGE_COMPUTED'] is False
          assert dm['FULL_BRAUER_GROUP_COMPUTED'] is False
          cur=s['current']
          assert cur['unit']=='36-09DM'
          assert cur['next_exact_leaf']=='36-09DN_FIXED_P2_FULL_BRAUER_OUTSIDE_CREUTZ_VIRAY_FORMAL_DISK_PREFLIGHT'
          assert cur['36_09DN_entry_allowed'] is False
          pg=s['promotion_gates']
          assert pg['36_09DM_certificate_complete'] is True
          assert pg['36_09DM_exact_head_ci_passed'] is False
          assert pg['36_09DN_entry_allowed'] is False
          assert pg['BT_full_Creutz_Viray_explicit_image_BM_set_nonempty'] is True
          assert pg['BT_full_Creutz_Viray_explicit_image_BM_obstruction_disproved'] is True
          assert pg['BT_p2_adelic_point_orthogonal_entire_CV_explicit_image'] is True
          for key in ['BT_full_L1_quotient_computed','BT_Pic0_mod2_computed','BT_full_Creutz_Viray_explicit_image_computed','BT_full_relevant_Brauer_group_computed','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          print('36-09DM repaired provisional checkpoint verified: entire Creutz-Viray explicit-image Brauer set is nonempty; DN remains locked pending exact-head CI and the required intermediate hostile audit. Full Brauer/BM/fixed-p/receiver/endpoint credit remains open.')
          PY
          git diff --check
