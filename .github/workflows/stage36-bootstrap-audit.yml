name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DA exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=114d44b1e5014c6756a40edcd717da385fb2b383
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DA.py"
          git worktree remove --force "$tmp"
      - name: Verify 36-09DB third independent Brauer class
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DB.py
      - name: Assert DB checkpoint and DC lock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V166_36_09DB_THIRD_BRAUER_CLASS'
          db=s['authority_frontier']['36-09DB']
          assert db['status']=='PROVISIONAL_PENDING_EXACT_HEAD_CI'
          assert db['certificate_blob_sha']=='fbdf20fd4c4f4f338d31a55a2a1dd0786ca968c8'
          assert db['verifier_blob_sha']=='6854624b657d9b7d95ddd9c01e462be243d90aa7'
          assert db['THIRD_INDEPENDENT_BRAUER_CLASS_FOUND'] is True
          assert db['CONSTRUCTED_BRAUER_SUBGROUP_RANK_LOWER_BOUND']==3
          assert db['FULL_BRAUER_GROUP_COMPUTED'] is False
          assert db['A_B_D_SPAN_FULL_RELEVANT_BRAUER_GROUP'] is False
          assert db['RANK3_JOINT_ADELIC_MATRIX_COMPLETE'] is False
          cur=s['current']
          assert cur['unit']=='36-09DB'
          assert cur['next_exact_leaf']=='36-09DC_FIXED_P2_RANK3_BRAUER_TWO_PLACE_EVALUATION_MATRIX_PREFLIGHT'
          assert cur['36_09DB_entry_allowed'] is True
          assert cur['36_09DC_entry_allowed'] is False
          pg=s['promotion_gates']
          assert pg['36_09DB_certificate_complete'] is True
          assert pg['36_09DB_exact_head_ci_passed'] is False
          assert pg['36_09DC_entry_allowed'] is False
          assert pg['BT_third_independent_Brauer_class_found'] is True
          assert pg['BT_constructed_Brauer_subgroup_rank_lower_bound']==3
          assert pg['BT_full_relevant_Brauer_group_computed'] is False
          for key in ['Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          print('36-09DB provisional checkpoint verified: third independent class found, constructed rank >=3; DC locked pending exact-head CI.')
          PY
          git diff --check
