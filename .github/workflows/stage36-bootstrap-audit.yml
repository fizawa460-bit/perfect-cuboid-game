name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DW exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=70762720e965e97c0442777b00a1794f906821e8
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DW.py"
          git worktree remove --force "$tmp"
      - name: Verify 36-09DX exact global Phi-Selmer intersection
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DX.py
      - name: Assert V212 DX provisional firewalls and DY lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V212_36_09DX_GLOBAL_PHI_SELMER_PENDING_EXACT_HEAD_CI'
          dx=s['authority_frontier']['36-09DX']; cur=s['current']; pg=s['promotion_gates']
          assert dx['status']=='PROVISIONAL_PENDING_EXACT_HEAD_CI'
          assert dx['certificate_blob_sha']=='ee8fda5da9fdd7ea26220740eecb07b2d8a0effe'
          assert dx['verifier_blob_sha']=='19e6a1863b26eec1354045c813b03fa16a9b012f'
          assert dx['source_blob_sha']=='403c6bf71acbce1e1f83b3ec855dd2a1e5f7ea90'
          assert dx['PHI_SELMER_F2_DIMENSION']==2
          assert dx['PHI_SELMER_CARDINALITY']==4
          assert dx['PHI_SELMER_THIRD_COORDINATE_TRIVIAL'] is True
          assert cur['unit']=='36-09DX'
          assert cur['36_09DY_entry_allowed'] is False
          assert pg['36_09DX_certificate_complete'] is True
          assert pg['36_09DX_exact_head_ci_passed'] is False
          assert pg['36_09DY_entry_allowed'] is False
          assert pg['BT_global_Phi_Selmer_group_computed'] is False
          assert pg['BT_proSelmer_cokernel_size_computed'] is False
          for key in ['BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          print('36-09DX provisional four-class Phi-Selmer candidate verified; DY remains locked pending exact-head CI. No downstream credit is granted.')
          PY
          git diff --check
