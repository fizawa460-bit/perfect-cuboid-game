name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09CN exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=6b31ca804744c4d8726d3d74861faadee78e0d64
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CN.py"
          git worktree remove --force "$tmp"
      - name: Replay immutable 36-09CO exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=b19439a701579d1563a77746cb1e6d57da04460e
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CO.py"
          git worktree remove --force "$tmp"
      - name: Replay immutable 36-09CP exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=acb10a76b8adcd07d52dc977e4257790395f535a
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CP.py"
          git worktree remove --force "$tmp"
      - name: Replay immutable 36-09CQ exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=a0d8cb76e43f926342f1a57b2b6aa903d19da63d
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CQ.py"
          git worktree remove --force "$tmp"
      - name: Replay immutable 36-09CR exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=ab7237e6e0d218c97a48e221504327a355648866
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CR.py"
          git worktree remove --force "$tmp"
      - name: Assert CR exact-green promotion and CS unlock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V145_36_09CR_EXACT_GREEN_CS_UNLOCK'
          cq=s['authority_frontier']['36-09CQ']
          assert cq['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert cq['exact_head']=='a0d8cb76e43f926342f1a57b2b6aa903d19da63d'
          assert cq['exact_head_ci']=='34188612840/101941880607'
          cr=s['authority_frontier']['36-09CR']
          assert cr['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert cr['certificate_blob_sha']=='d1bde3d1da2d8482ff26457aa6e437ecbabbdfea'
          assert cr['verifier_blob_sha']=='eaff2e04f7b89e1de0c4b4935a07757b47d27ab4'
          assert cr['exact_head']=='ab7237e6e0d218c97a48e221504327a355648866'
          assert cr['exact_head_ci']=='34191583995/101950581298'
          assert cr['REUSABLE_CONNECTING_LOCALIZATION_PROTOCOL_FOUND'] is True
          assert cr['EXISTING_SOURCE_BOUND_BT_DUAL_EVALUATION_ADAPTER_FOUND'] is False
          assert cr['FORMAL_3_TO_5_DUAL_PROJECTION_EXACT'] is True
          assert cr['BT_FIVE_ROOT_DECK_TORSOR_ACTION_SOURCE_BOUND'] is False
          assert cr['BT_POINTWISE_FIVE_CHARACTER_CLASS_SOURCE_BOUND'] is False
          assert cr['BT_GEOMETRY_BOUND_DUAL_EVALUATION_ADAPTER_COMPLETE'] is False
          assert cr['FIRST_MISSING_OBLIGATION']=='BT_FIVE_ROOT_DECK_TORSOR_ACTION_AND_POINTWISE_CHARACTER_CLASS_SOURCE_BINDING'
          assert cr['LIT_WF02_APPLICABILITY_PASS'] is False
          assert cr['NEW_GLOBAL_OBSTRUCTION_OBTAINED'] is False
          cur=s['current']
          assert cur['unit']=='36-09CR'
          assert cur['next_exact_leaf']=='36-09CS_BT_FIVE_ROOT_DECK_DUAL_PROJECTION_CONSTRUCTION_PREFLIGHT'
          assert cur['36_09CR_entry_allowed'] is True
          assert cur['36_09CS_entry_allowed'] is True
          pg=s['promotion_gates']
          assert pg['36_09CR_certificate_complete'] is True
          assert pg['36_09CR_exact_head_ci_passed'] is True
          assert pg['36_09CS_entry_allowed'] is True
          assert pg['BT_formal_five_to_three_dual_projection_constructed'] is True
          assert pg['BT_five_root_deck_torsor_action_source_bound'] is False
          assert pg['BT_pointwise_five_character_class_source_bound'] is False
          assert pg['BT_geometry_bound_dual_evaluation_adapter_complete'] is False
          assert pg['BT_Poitou_Tate_local_condition_system_complete'] is False
          assert pg['LIT_WF02_applicability_pass'] is False
          assert pg['new_global_obstruction_obtained'] is False
          for key in ['fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          claims=s['claims']
          for key in ['new_theorem_credit','LIT_WF02_applicability_pass','Selmer_membership_obtained','Poitou_Tate_obstruction_obtained','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert claims[key] is False
          print('36-09CR exact-green parent verified and 36-09CS entry unlocked. No PT/BM/receiver/endpoint credit.')
          PY
          git diff --check
