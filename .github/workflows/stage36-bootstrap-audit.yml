name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09CN exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=6b31ca804744c4d8726d3d74861faadee78e0d64
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CN.py"
          git worktree remove --force "$tmp"
      - name: Replay immutable 36-09CO exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=b19439a701579d1563a77746cb1e6d57da04460e
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CO.py"
          git worktree remove --force "$tmp"
      - name: Replay immutable 36-09CP exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=acb10a76b8adcd07d52dc977e4257790395f535a
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CP.py"
          git worktree remove --force "$tmp"
      - name: Replay immutable 36-09CQ exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=a0d8cb76e43f926342f1a57b2b6aa903d19da63d
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CQ.py"
          git worktree remove --force "$tmp"
      - name: Replay immutable corrected 36-09CR exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=1e9cf94bc7ffc6ac78fabf51adac3cdf31d2bd12
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CR.py"
          git worktree remove --force "$tmp"
      - name: Replay immutable 36-09CS exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=b1b88082b018edb4d9b22157943c7dd8b289b277
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CS.py"
          git worktree remove --force "$tmp"
      - name: Assert CS exact-green promotion and CT unlock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V149_36_09CS_EXACT_GREEN_CT_UNLOCK'
          cs=s['authority_frontier']['36-09CS']
          assert cs['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert cs['certificate_blob_sha']=='4657613348e8c59630ff8bcd660e518ed491f7c9'
          assert cs['verifier_blob_sha']=='b9f5ec9caea93940c53165280ad99901e4280911'
          assert cs['exact_head']=='b1b88082b018edb4d9b22157943c7dd8b289b277'
          assert cs['exact_head_ci']=='34192357445/101952828878'
          assert cs['BT_FIVE_ROOT_DECK_TORSOR_ACTION_SOURCE_BOUND'] is True
          assert cs['BT_POINTWISE_FIVE_KUMMER_CLASS_SOURCE_BOUND'] is True
          assert cs['BT_GEOMETRY_BOUND_DUAL_EVALUATION_ADAPTER_COMPLETE'] is True
          cur=s['current']
          assert cur['unit']=='36-09CS'
          assert cur['next_exact_leaf']=='36-09CT_BT_POINTWISE_LOCAL_TATE_PAIRING_REQUIRED_PLACE_PREFLIGHT'
          assert cur['36_09CT_entry_allowed'] is True
          pg=s['promotion_gates']
          assert pg['36_09CS_exact_head_ci_passed'] is True
          assert pg['36_09CT_entry_allowed'] is True
          assert pg['BT_geometry_bound_dual_evaluation_adapter_complete'] is True
          assert pg['BT_Poitou_Tate_local_condition_system_complete'] is False
          assert pg['Stage36_required_place_inventory_complete'] is False
          assert pg['LIT_WF02_applicability_pass'] is False
          assert pg['new_global_obstruction_obtained'] is False
          for key in ['fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          claims=s['claims']
          for key in ['new_theorem_credit','LIT_WF02_applicability_pass','Selmer_membership_obtained','Poitou_Tate_obstruction_obtained','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert claims[key] is False
          print('36-09CS exact-green parent verified and 36-09CT entry unlocked. No PT/BM/receiver/endpoint credit.')
          PY
          git diff --check
