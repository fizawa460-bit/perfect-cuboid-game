name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Assert hostile-audited and merged PR1677 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_batch_promotion']
          assert a['candidate_pr']==1677
          assert a['audited_head']=='56f815b9bc25ca91a2ba6e0c0291664bfeac733d'
          assert a['hostile_audit_review']==5127436589
          assert a['exact_head_ci']=='34074355295/101597480228'
          assert a['merged_main_sha']=='58e81a647b63bcea17ab396409c2813b667f45e2'
          PY
          git merge-base --is-ancestor 58e81a647b63bcea17ab396409c2813b667f45e2 HEAD

      - name: Replay exact 36-09AM candidate parent
        shell: bash
        run: |
          set -euo pipefail
          H=46b426a393ee2eb027305f9c45f248008ff02fec
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AM.py"
          git worktree remove --force "$tmp"

      - name: Verify current 36-09AN retained-open Tunnell necessary gate
        run: python3 stages/stage36/verify_stage36_36_09AN.py

      - name: Assert 36-09AN firewalls and hostile-audit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V76_36_09AN_BATCH_AUDIT_CHECKPOINT'
          assert s['status']=='ACTIVE_BATCH_HOSTILE_AUDIT_CHECKPOINT'
          an=s['authority_frontier']['36-09AN']
          assert an['RETAINED_OPEN_MAP_EXACT'] is True
          assert an['RETAINED_IMAGE_NON2TORSION'] is True
          assert an['RETAINED_RECEIVER_IMPLIES_POSITIVE_RANK'] is True
          assert an['RETAINED_RECEIVER_IMPLIES_N_CONGRUENT'] is True
          assert an['RETAINED_RECEIVER_IMPLIES_TUNNELL_EQUALITY'] is True
          assert an['TUNNELL_FAIL_RETAINED_RECEIVER_EMPTY'] is True
          assert an['AM_TORSION_EXCEPTION_SECTORS_REMAIN_ON_RETAINED_OPEN'] is False
          assert an['TUNNELL_FAIL_RETAINED_OPEN_EXCEPTION_SECTOR_COUNT']==0
          assert an['TUNNELL_EQUALITY_SIDE_CLASSIFIED'] is False
          assert an['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert an['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AN-AUDIT-CHECKPOINT'
          assert s['current']['next_owner']=='HOSTILE_AUDIT'
          assert s['current']['hostile_audit_checkpoint_reached'] is True
          assert s['current']['36_09AO_entry_allowed'] is False
          assert s['promotion_gates']['36_09AN_hostile_audit_passed'] is False
          assert s['claims']['candidate_parameter_set_shrunk'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AN retained-open rank/Tunnell gate verified; Tunnell-fail side has zero retained exceptions; AO locked pending hostile audit')
          PY
          git diff --check
