name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Assert hostile-audited merged AV-AY authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())['audited_history']['36-09AV-AY']
          assert a['pr']==1683 and a['hostile_audit_review']==5128446584
          assert a['merged_main_sha']=='b7a045b7c910a3e01d3826556cd71019af15418f'
          PY
          git merge-base --is-ancestor b7a045b7c910a3e01d3826556cd71019af15418f HEAD
      - name: Replay exact 36-09BB provisional parent
        shell: bash
        run: |
          set -euo pipefail
          H=72441c82f2c146c63ebde6459b18789e33c6dddb
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BB.py"
          git worktree remove --force "$tmp"
      - name: Verify repaired current 36-09BC
        run: python3 stages/stage36/verify_stage36_36_09BC.py
      - name: Assert BC repair firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V91_36_09BC_REPAIR_CHECKPOINT'
          assert s['failed_audit']['review']==5128976664
          bc=s['authority_frontier']['36-09BC']
          assert bc['JACOBIAN_MINOR']=='32*R0*S0*kappa*lambda'
          assert bc['JACOBIAN_MINOR_RECOMPUTED'] is True
          assert bc['GOOD_PRIME_PUNCTURED_BOUNDARY_LOCAL_NONEMPTY'] is True
          assert bc['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert bc['RECEIVER_CLOSED'] is False
          assert s['authority_frontier']['36-09BD']['status']=='DOWNSTREAM_RELOCK_REQUIRED_AFTER_BC_GREEN'
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['R29_CAMP2_closed'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('repaired 36-09BC verified at current main; downstream BD/BE remain locked pending exact-green parent provenance')
          PY
          git diff --check
