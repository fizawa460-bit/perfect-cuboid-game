name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DB exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=83d1f209f85ef747963f05a7b177c783b76142bd
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DB.py"
          git worktree remove --force "$tmp"
      - name: Verify 36-09DC rank3 two-place Brauer control
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DC.py
      - name: Assert DC checkpoint and DD lock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V168_36_09DC_RANK3_TWO_PLACE_CONTROL'
          dc=s['authority_frontier']['36-09DC']
          assert dc['status']=='PROVISIONAL_PENDING_EXACT_HEAD_CI'
          assert dc['certificate_blob_sha']=='4865bd16973ddf0fd746bc4219ea68b8277817b3'
          assert dc['verifier_blob_sha']=='71eaafb8f04952d617c6bbda5d8632af18da45ac'
          assert dc['RANK3_JOINT_ADELIC_EVALUATION_MATRIX_COMPLETE'] is True
          assert dc['RANK3_CONSTRUCTED_SUBGROUP_SOLE_BM_OBSTRUCTION'] is False
          assert dc['RANK3_NO_GO_CONDITIONAL_ON_ADELIC_SOLUBILITY'] is True
          assert dc['FULL_BRAUER_GROUP_COMPUTED'] is False
          assert dc['A_B_D_SPAN_FULL_RELEVANT_BRAUER_GROUP'] is False
          cur=s['current']
          assert cur['unit']=='36-09DC'
          assert cur['next_exact_leaf']=='36-09DD_FIXED_P2_CREUTZ_VIRAY_SUBGROUP_COMPLETENESS_PREFLIGHT'
          assert cur['36_09DC_entry_allowed'] is True
          assert cur['36_09DD_entry_allowed'] is False
          pg=s['promotion_gates']
          assert pg['36_09DC_certificate_complete'] is True
          assert pg['36_09DC_exact_head_ci_passed'] is False
          assert pg['36_09DD_entry_allowed'] is False
          assert pg['BT_rank3_joint_adelic_evaluation_matrix_complete'] is True
          assert pg['BT_rank3_constructed_subgroup_sole_BM_obstruction'] is False
          assert pg['BT_full_relevant_Brauer_group_computed'] is False
          for key in ['Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          print('36-09DC provisional checkpoint verified: rank3 two-place full control obtained; DD locked pending exact-head CI. No full-group/BM/fixed-p/receiver credit.')
          PY
          git diff --check
