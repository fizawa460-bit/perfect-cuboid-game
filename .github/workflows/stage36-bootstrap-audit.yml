name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'stages/stage29/29-16/active-kernel-ledger.json'
      - 'stages/stage29/29-06/endpoint-hub-graph.json'
      - 'stages/stage29/29-06/source-crosswalk.md'
      - 'stages/stage29/29-02f/audit.md'
      - 'stages/stage29/29-02f/open-algebraic-brauer-adapter.md'
      - 'stages/stage29/29-02ha/result.md'
      - 'stages/stage29/29-02ha/exact-sign-cover-model.md'
      - 'stages/stage29/29-02hb/campedelli_kernel_check.py'
      - 'stages/stage29/29-02hb/route-contract.json'
      - 'stages/stage29/29-02hb/arithmetic-routing.md'
      - 'stages/stage29/29-02hb/campedelli-quotient-adapter.md'
      - 'stages/stage29/29-02hb/source-lock.md'
      - 'docs/arsenal/index.json'
      - 'docs/arsenal/cards/formal/S30-W01.md'
      - 'docs/arsenal/cards/formal/S34-W01.md'
      - 'docs/arsenal/cards/formal/S34-W02.md'
      - 'docs/arsenal/cards/formal/S34-W03.md'
      - 'docs/arsenal/cards/provisional/S33-PW07.md'
      - 'docs/arsenal/cards/provisional/S33-PW08.md'
      - 'docs/arsenal/cards/workflows/S30-WF01.md'
      - 'docs/arsenal/cards/workflows/S30-WF02.md'
      - 'docs/arsenal/cards/workflows/S30-WF03.md'
      - 'docs/arsenal/cards/workflows/S34-WF01.md'
      - 'docs/research-os/policies/repository-asset-discovery.md'
      - 'docs/research-os/policies/cycle-exploration-safety-protocol.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "exact_head=$actual"

      - name: Assert current PR base lock
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.base.sha }}"
          python3 - "$expected" <<'PY'
          import json,sys
          from pathlib import Path
          expected=sys.argv[1]
          actual=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())['base_main_sha']
          assert actual==expected, f'MAIN-STATE base_main_sha {actual} != PR base {expected}'
          print(f'base_main_sha={actual}')
          PY

      - name: Replay Stage36 bootstrap authority
        run: python3 stages/stage36/verify_stage36_bootstrap.py

      - name: Replay audited Stage36 36-01 authority
        run: python3 stages/stage36/verify_stage36_36_01.py

      - name: Replay audited Stage36 36-02 authority
        run: python3 stages/stage36/verify_stage36_36_02_audited.py

      - name: Replay audited Stage36 36-03 authority
        run: python3 stages/stage36/verify_stage36_36_03_audited.py

      - name: Replay audited Stage36 36-04 authority
        run: python3 stages/stage36/verify_stage36_36_04_audited.py

      - name: Replay audited Stage36 36-05 blocked authority
        run: python3 stages/stage36/verify_stage36_36_05_audited.py

      - name: Verify Stage36 36-09 replacement breadth gate
        run: python3 stages/stage36/verify_stage36_36_09.py

      - name: Assert hostile-audit boundary before 36-09A
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V12_36_09_BREADTH_GATE_PENDING_AUDIT'
          assert s['status']=='ACTIVE_PENDING_HOSTILE_AUDIT'
          g=s['promotion_gates']
          assert g['source_authority_lock_complete'] is True
          assert g['three_Q_representatives_exact'] is True
          assert g['physical_open_push_and_boundary_complete'] is True
          assert g['pointwise_H_torsor_class_explicit'] is True
          assert g['uniform_finite_ramification_support_proved'] is False
          assert g['finite_exhaustive_H_twist_family_proved'] is False
          assert g['receiver_matched_replacement_theorem_proved'] is False
          u5=s['completed_units']['36-05']
          assert u5['promotion_status']=='AUDITED'
          assert u5['legal_outcome']=='BLOCKED_MOVING_RAMIFICATION_SUPPORT'
          u9=s['completed_units']['36-09']
          assert u9['status']=='BREADTH_GATE_SELECTS_CAMP4_BRAUER_COMPATIBILITY_PREFLIGHT_PENDING_HOSTILE_AUDIT'
          assert u9['certificate_blob_sha']=='f7eb66245d24e9d463cb98d82d56daa86ebb5772'
          assert u9['EXHAUSTIVE_VIEW_AUDIT'] is True
          assert u9['BLIND_REDISCOVERY'] is True
          assert u9['CANDIDATE_LEDGER_CLASSIFIED'] is True
          assert u9['SELECTED_NEXT_ROUTE']=='36-09A_CAMP4_BRAUER_COMPATIBILITY_PREFLIGHT'
          assert u9['RECEIVER_MATCHED_REPLACEMENT_THEOREM_PROVED'] is False
          assert u9['promotion_status']=='PROVISIONAL_NOT_AUDITED'
          assert s['current']['unit']=='36-09'
          assert s['current']['36_06_entry_allowed'] is False
          assert s['current']['36_09A_entry_allowed'] is False
          assert s['current']['provisional_successor_after_hostile_audit']=='36-09A_CAMP4_BRAUER_COMPATIBILITY_PREFLIGHT'
          assert '36-06' not in s['completed_units']
          assert '36-09A' not in s['completed_units']
          assert all(v is False for v in s['claims'].values())
          print('36-09 breadth gate provisional; 36-09A selected but not started; no replacement/receiver/endpoint credit')
          PY
