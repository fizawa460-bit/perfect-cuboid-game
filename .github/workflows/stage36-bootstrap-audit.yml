name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09CQ exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=a0d8cb76e43f926342f1a57b2b6aa903d19da63d; tmp="$(mktemp -d)"; git worktree add --detach "$tmp" "$H"; python3 "$tmp/stages/stage36/verify_stage36_36_09CQ.py"; git worktree remove --force "$tmp"
      - name: Replay immutable corrected 36-09CR exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=1e9cf94bc7ffc6ac78fabf51adac3cdf31d2bd12; tmp="$(mktemp -d)"; git worktree add --detach "$tmp" "$H"; python3 "$tmp/stages/stage36/verify_stage36_36_09CR.py"; git worktree remove --force "$tmp"
      - name: Replay immutable 36-09CS exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=b1b88082b018edb4d9b22157943c7dd8b289b277; tmp="$(mktemp -d)"; git worktree add --detach "$tmp" "$H"; python3 "$tmp/stages/stage36/verify_stage36_36_09CS.py"; git worktree remove --force "$tmp"
      - name: Replay immutable 36-09CT exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=562e64f8f4ea64f420a7970a03119d0029d70a10; tmp="$(mktemp -d)"; git worktree add --detach "$tmp" "$H"; python3 "$tmp/stages/stage36/verify_stage36_36_09CT.py"; git worktree remove --force "$tmp"
      - name: Replay immutable 36-09CU exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=b741a0459eee46cb3f0404c0d13befb819c793d0; tmp="$(mktemp -d)"; git worktree add --detach "$tmp" "$H"; python3 "$tmp/stages/stage36/verify_stage36_36_09CU.py"; git worktree remove --force "$tmp"
      - name: Replay immutable 36-09CV exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=eb391492fb79af264f46a72616ccd3b1a9f37f01; tmp="$(mktemp -d)"; git worktree add --detach "$tmp" "$H"; python3 "$tmp/stages/stage36/verify_stage36_36_09CV.py"; git worktree remove --force "$tmp"
      - name: Assert CV exact-green promotion and CW unlock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V155_36_09CV_EXACT_GREEN_CW_UNLOCK'
          cv=s['authority_frontier']['36-09CV']
          assert cv['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert cv['certificate_blob_sha']=='2abc41fe2dccc7563e4c8af49d37b78094e7cd64'
          assert cv['verifier_blob_sha']=='ce0cf641b188c1d69cda149567e0ab63403399a4'
          assert cv['exact_head']=='eb391492fb79af264f46a72616ccd3b1a9f37f01'
          assert cv['exact_head_ci']=='34195900786/101963435117'
          assert cv['OLD_H_TORSOR_CLASS_SELF_TRIVIAL_ON_PHYSICAL_RECEIVER'] is True
          assert cv['OLD_H_TORSOR_CLASS_IS_BRAUER_H2'] is False
          assert cv['CAMP4_EXPLICIT_BRAUER_PACKET_AVAILABLE_FOR_TRANSPORT'] is False
          assert cv['EXISTING_SOURCE_BOUND_BT_NONTRIVIAL_BRAUER_OR_SECONDARY_CLASS_FOUND'] is False
          assert cv['FIRST_MISSING_OBLIGATION']=='BT_LITERAL_NON_KUMMER_DIVISOR_CECH_COMMON_COCYCLE_OR_SECONDARY_EXTENSION_CONSTRUCTION'
          cur=s['current']
          assert cur['unit']=='36-09CV'
          assert cur['next_exact_leaf']=='36-09CW_BT_LITERAL_NON_KUMMER_DIVISOR_CECH_CONSTRUCTION_PREFLIGHT'
          assert cur['36_09CW_entry_allowed'] is True
          pg=s['promotion_gates']
          assert pg['36_09CV_exact_head_ci_passed'] is True
          assert pg['36_09CW_entry_allowed'] is True
          assert pg['BT_literal_non_kummer_divisor_Cech_common_cocycle_materialized'] is False
          assert pg['BT_nontrivial_receiver_locus_secondary_evaluation_found'] is False
          assert pg['BT_Brauer_class_with_point_dependent_receiver_evaluation_found'] is False
          assert pg['new_global_obstruction_obtained'] is False
          for key in ['fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          claims=s['claims']
          for key in ['new_theorem_credit','LIT_WF02_applicability_pass','Selmer_membership_obtained','Poitou_Tate_obstruction_obtained','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert claims[key] is False
          print('36-09CV exact-green parent verified and 36-09CW entry unlocked. No BM/PT/receiver/endpoint credit.')
          PY
          git diff --check
