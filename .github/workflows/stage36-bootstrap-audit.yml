name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Assert hostile-audited PR1670 authority promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_batch_promotion']
          assert a['candidate_pr']==1670
          assert a['audited_head']=='f2922c992ab1e056fa03932ba017d0dfdae845cb'
          assert a['hostile_audit_review']==5127056767
          assert a['exact_head_ci']=='34067480463/101578693605'
          assert a['merged_main_sha']=='9306238c7ada55e31311245019d6b7e474ad837f'
          PY

      - name: Replay exact 36-09AG candidate parent
        shell: bash
        run: |
          set -euo pipefail
          H=6ef7635a92bc5e9440ed527c60ea871d0c3216fc
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AG.py"
          git worktree remove --force "$tmp"

      - name: Verify current 36-09AH common-u:v genus-one geometry
        run: python3 stages/stage36/verify_stage36_36_09AH.py

      - name: Assert 36-09AH firewalls and 36-09AI unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V69_36_09AH_CANDIDATE'
          ah=s['authority_frontier']['36-09AH']
          assert ah['COMMON_UV_INTERSECTION_GENUS']==1
          assert ah['PENCIL_SINGULAR_DIRECTIONS_FIXED'] is True
          assert ah['PENCIL_SINGULAR_DIRECTIONS']==['0','infinity','1','-1']
          assert ah['Q_JACOBIAN_IDENTIFIED'] is False
          assert ah['Q_TWIST_SQUARECLASS_IDENTIFIED'] is False
          assert ah['COMMON_UV_RATIONAL_POINT_OBTAINED'] is False
          assert ah['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert ah['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AI'
          assert s['current']['36_09AI_entry_allowed'] is True
          assert s['promotion_gates']['36_09AH_hostile_audit_passed'] is False
          assert s['claims']['Q_jacobian_identified'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AH exact: smooth common-u:v genus-one (2,2) intersection with fixed pencil directions; Q-Jacobian remains unclaimed; 36-09AI unlocked')
          PY
          git diff --check
