name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Replay exact hostile-audited U-AA promotion checkpoint
        shell: bash
        run: |
          set -euo pipefail
          H=d5c212d9be970dc31a28d50db926f4cfac34c561
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AA_audited.py"
          git worktree remove --force "$tmp"

      - name: Verify current 36-09AB product-square diagnosis
        run: python3 stages/stage36/verify_stage36_36_09AB.py

      - name: Assert 36-09AB firewalls and 36-09AC unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V63_36_09AB_CANDIDATE'
          assert s['status']=='ACTIVE_BATCHING_SUBSTANTIVE_PR'
          assert s['promotion_gates']['36_09AA_hostile_audit_passed'] is True
          assert s['promotion_gates']['36_09AA_promoted'] is True
          ab=s['authority_frontier']['36-09AB']
          assert ab['PRODUCT_QUOTIENT_BIRATIONAL_TO_E_TAU'] is True
          assert ab['PRODUCT_QUOTIENT_CANDIDATE_SHRINK'] is False
          assert ab['SAME_X_SEPARATE_SQUARE_DATA_PRESERVED_BY_PRODUCT'] is False
          assert ab['S34_W03_INTERSECTION_EXCLUSION_EXECUTED'] is False
          assert ab['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AC'
          assert s['current']['36_09AC_entry_allowed'] is True
          assert s['promotion_gates']['36_09AB_hostile_audit_passed'] is False
          assert s['claims']['candidate_parameter_set_shrunk'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('audited U-AA promotion replayed; 36-09AB product quotient dominated by E_tau; 36-09AC separate-squareclass double cover unlocked')
          PY
          git diff --check
