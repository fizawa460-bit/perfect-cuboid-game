name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/cards/formal/S34-W01.md'
      - 'docs/arsenal/cards/formal/S34-W02.md'
      - 'docs/arsenal/cards/workflows/LIT-WF02.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay exact 36-09BZ green parent
        shell: bash
        run: |
          set -euo pipefail
          H=dc6c23acbfc77ea5e3ce4951f136be0daa291db2
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BZ.py"
          git worktree remove --force "$tmp"
      - name: Verify current 36-09CA
        run: python3 stages/stage36/verify_stage36_36_09CA.py
      - name: Assert CA firewalls and CB selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V117_36_09CA_TIE_SOURCE_PULLBACK'
          assert s['status']=='36_09CA_PROVISIONAL_CANDIDATE_CB_SELECTED'
          bz=s['authority_frontier']['36-09BZ']
          assert bz['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert bz['exact_head']=='dc6c23acbfc77ea5e3ce4951f136be0daa291db2'
          assert bz['exact_head_ci']=='34149039121/101827189412'
          ca=s['authority_frontier']['36-09CA']
          assert ca['PARAMETER_UNIT_LEMMA_EXACT'] is True
          assert ca['TIE_SOURCE_PULLBACK_EXACT'] is True
          assert ca['TIE_NEEDED_SECTOR_LOCALLY_REALIZABLE'] is True
          assert ca['NEW_POINT_INDEPENDENT_BRANCH_ROWS']==0
          assert ca['ALL_BZ_SURVIVORS_Q2_POINTS'] is False
          assert s['current']['next_exact_leaf']=='36-09CB_GENERAL_Q2_SOURCE_CONIC_REALIZATION_PREFLIGHT'
          assert s['current']['36_09CB_entry_allowed'] is True
          assert s['promotion_gates']['36_09BZ_exact_head_ci_passed'] is True
          assert s['promotion_gates']['36_09CA_certificate_complete'] is True
          assert s['promotion_gates']['36_09CA_exact_head_ci_passed'] is False
          assert s['promotion_gates']['36_09CB_unlocked'] is True
          assert s['promotion_gates']['all_BZ_outer_survivors_are_Q2_points'] is False
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert s['claims'][key] is False
          print('36-09CA candidate verified: the tie-unit source pullback is exact and adds no independent branch row; CB source-conic Q2 realization is selected without closure credit.')
          PY
          git diff --check
