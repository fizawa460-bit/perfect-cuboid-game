name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Verify exact-green 36-09DW dual-basis pairing correction
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DW_pairing_correction.py
      - name: Verify retained DZ arithmetic remains numerically valid
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DZ.py
      - name: Assert V230 hostile re-audit candidate and EB relock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          c=json.loads(Path('stages/stage36/36-09DW/dual-basis-pairing-correction.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V230_36_09DW_PAIRING_CORRECTION_REAUDIT_CANDIDATE'
          assert s['status']=='HOSTILE_REAUDIT_REQUIRED'
          pc=s['post_audit_correction']; cur=s['current']; pg=s['promotion_gates']
          assert pc['unit']=='36-09DW-CORRECTION'
          assert pc['status']=='EXACT_GREEN_CORRECTION_PENDING_EXTERNAL_REAUDIT'
          assert pc['repair_replay_head']=='267dc0caa50725918d2de43b3c4e0a54aaa9ad84'
          assert pc['repair_replay_ci']=='34303828781/102316243814'
          assert pc['external_reaudit_passed'] is False
          assert c['corrected_global_Phi_Selmer']['F2_dimension']==2
          assert c['corrected_global_Phi_Selmer']['cardinality']==4
          assert c['direct_rational_witness']['P_plus_excluded_by_historical_Q2_Phi_image'] is True
          assert cur['unit']=='36-09DW-CORRECTION'
          assert cur['next_owner']=='HOSTILE_REAUDIT'
          assert cur['substantive_batch_pr_continues'] is False
          assert cur['hostile_audit_checkpoint_reached'] is True
          assert cur['36_09EB_entry_allowed'] is False
          assert pg['36_09DW_pairing_correction_exact_head_ci_passed'] is True
          assert pg['external_reaudit_after_DW_pairing_correction_passed'] is False
          assert pg['36_09EB_entry_allowed'] is False
          assert pg['BT_Phi_Selmer_historical_labels_valid'] is False
          assert pg['BT_Phi_Selmer_corrected_labels_valid_pending_reaudit'] is True
          assert pg['BT_DZ_numeric_results_retained'] is True
          assert pg['BT_EA_four_coset_numeric_reduction_retained'] is True
          for key in ['BT_retained_open_curve_proSelmer_intersection_computed','BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09DW/dual-basis-pairing-correction.json'],text=True).strip()=='5135ad3afac4960b9d48445c6e840c5ce3798bd7'
          assert subprocess.check_output(['git','hash-object','stages/stage36/verify_stage36_36_09DW_pairing_correction.py'],text=True).strip()=='b63e2b472f832a2a0d310764a50cc3cb28c1f7e9'
          subprocess.check_call(['git','cat-file','-e','267dc0caa50725918d2de43b3c4e0a54aaa9ad84^{commit}'])
          print('V230 verified: DW pairing correction is exact-green. Historical Phi local bases/DX labels remain revoked; corrected four labels are pending external hostile re-audit. Numeric DY/DZ/EA results are retained and EB stays relocked.')
          PY
          git diff --check
