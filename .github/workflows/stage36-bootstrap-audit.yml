name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Assert hostile-audited merged AV-AY authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())['audited_history']['36-09AV-AY']
          assert a['pr']==1683
          assert a['audited_head']=='c09f264e4becbc4c7f06145b32ce366b2d4d7a4f'
          assert a['hostile_audit_review']==5128446584
          assert a['exact_head_ci']=='34087344920/101633809000'
          assert a['merged_main_sha']=='b7a045b7c910a3e01d3826556cd71019af15418f'
          PY
          git merge-base --is-ancestor b7a045b7c910a3e01d3826556cd71019af15418f HEAD
      - name: Replay exact 36-09AZ provisional parent
        shell: bash
        run: |
          set -euo pipefail
          H=70d242588f4ae1b56dfc80e7c634e1f666ff57fd
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AZ.py"
          git worktree remove --force "$tmp"
          test "$(git rev-parse "$H":stages/stage36/36-09AZ/boundary-survivor-open-refinement-preflight.json)" = "0ad33f6d197525978f716a146bb128ac343c0710"
          test "$(git rev-parse "$H":stages/stage36/verify_stage36_36_09AZ.py)" = "455d8c5c65ec84cfea902fadb4233fbf490358e1"
      - name: Verify current 36-09BA auxiliary genus-one open points
        run: python3 stages/stage36/verify_stage36_36_09BA.py
      - name: Assert BA firewalls and BB unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V89_36_09BA_CANDIDATE'
          ba=s['authority_frontier']['36-09BA']
          assert ba['AY_AUXILIARY_OPEN_Q_POINTS_INFINITE'] is True
          assert ba['BOUNDARY_ONLY_AUXILIARY_CLOSURE_IMPOSSIBLE'] is True
          assert ba['AUXILIARY_OPEN_POINT_IS_RECEIVER'] is False
          assert ba['S34_W03_RECEIVER_INTERSECTION_SELECTED'] is True
          assert ba['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert ba['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09BB'
          assert s['current']['36_09BB_entry_allowed'] is True
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['R29_CAMP2_closed'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09BA verified; AY auxiliary genus-one has infinitely many nonboundary Q-points, but receiver intersection remains separate; S34-W03 BB unlocked')
          PY
          git diff --check
