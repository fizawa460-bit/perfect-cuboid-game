name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Assert audited authority and AE/AO source locks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_history']['36-09AM-AN']
          assert a['hostile_audit_review']==5127771308
          assert a['merged_main_sha']=='6b6c541d1a6bbe229381ac0400148bd17523ca06'
          ao=s['audited_history']['parallel-36-09AO']
          assert ao['hostile_audit_review']==5127677576
          PY
          test "$(git rev-parse HEAD:stages/stage36/36-09AE/six-reservoir-squareclass-conic-coupling-preflight.json)" = "ddae37dd35cd0e732cebadf9c17f3f3fa57930df"
          test "$(git rev-parse HEAD:stages/stage36/36-09AO/monsky-full2-kernel-source-lock.md)" = "9f22dfe19d42d7104d30d219aac1cfd72a67c72a"

      - name: Replay exact 36-09AS provisional parent
        shell: bash
        run: |
          set -euo pipefail
          H=2ac34f56fa6b63dcbf8ac67b5c46d34857acf9c8
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AS.py"
          git worktree remove --force "$tmp"
          test "$(git rev-parse "$H":stages/stage36/36-09AS/all-parity-monsky-kernel-equation-compression-preflight.json)" = "6b20e9a7d4bb1221feb06622db4d165fb2e3e1ee"
          test "$(git rev-parse "$H":stages/stage36/verify_stage36_36_09AS.py)" = "badc07dbfd0f4fdccf0f1e8f75198d48576c2e40"

      - name: Verify current 36-09AT local-row Monsky equivalence
        run: python3 stages/stage36/verify_stage36_36_09AT.py

      - name: Assert 36-09AT firewalls and 36-09AU unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V82_36_09AT_CANDIDATE'
          a=s['authority_frontier']['36-09AT']
          assert a['ODD_AE_MONSKY_EXACT_EQUIVALENCE'] is True
          assert a['ODD_MONSKY_GATE_NEW_AFTER_AE'] is False
          assert a['EVEN_SECOND_BLOCK_AE_EQUIVALENCE'] is True
          assert a['EVEN_FIRST_TRANSPOSED_REDEI_BRIDGE'] is False
          assert a['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert a['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AU'
          assert s['current']['36_09AU_entry_allowed'] is True
          assert s['claims']['even_full_AE_Monsky_equivalence'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          print('36-09AT verified; odd Monsky is exact AE local-row repackaging; even second block also local; AU transposed-Redei bridge unlocked')
          PY
          git diff --check
