name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DP exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=ac5d65e7cd148db91e41706cc213c350f981e2f4
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DP.py"
          git worktree remove --force "$tmp"
      - name: Assert V197 DP exact-green parent and DQ unlock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V197_36_09DP_EXACT_GREEN_DQ_UNLOCK_PENDING_PROMOTION_REPLAY'
          dp=s['authority_frontier']['36-09DP']
          assert dp['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert dp['certificate_blob_sha']=='ca4e238820ee5c1f5850ac99e5995e71c7d68eba'
          assert dp['verifier_blob_sha']=='f288684887dbbfcc40ba3fa6039724cd5598e834'
          assert dp['source_blob_sha']=='d9e081ac00c1b0267c970ba1ab2c0932d0a51425'
          assert dp['exact_head']=='ac5d65e7cd148db91e41706cc213c350f981e2f4'
          assert dp['exact_head_ci']=='34230132989/102073890507'
          assert dp['GLOBAL_Q2_2PRIMARY_LOCALIZATION_SURJECTIVE'] is True
          assert dp['GLOBAL_Q2_2PRIMARY_LOCALIZATION_IMAGE_UNBOUNDED'] is True
          cur=s['current']; pg=s['promotion_gates']
          assert cur['unit']=='36-09DP'
          assert cur['36_09DQ_entry_allowed'] is True
          assert pg['36_09DP_exact_head_ci_passed'] is True
          assert pg['36_09DP_promotion_replay_passed'] is False
          assert pg['36_09DQ_entry_allowed'] is True
          assert pg['BT_global_Q2_2primary_localization_image_is_full'] is True
          assert pg['BT_global_Q2_2primary_localization_image_unbounded'] is True
          assert pg['BT_global_2primary_adelic_annihilator_computed'] is False
          for key in ['BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','BT_full_Brauer_set_nonempty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          print('36-09DP immutable exact-green evidence replayed; 36-09DQ is unlocked for the global 2-primary adelic annihilator problem only. No downstream credit is granted.')
          PY
          git diff --check
