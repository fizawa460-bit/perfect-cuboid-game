name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Assert hostile-audited PR1674 promotion authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_batch_promotion']
          assert a['candidate_pr']==1674
          assert a['audited_head']=='4bfec87e1ce85608f87fc57e884fc026b5a715b8'
          assert a['hostile_audit_review']==5127180987
          assert a['exact_head_ci']=='34070010830/101585489611'
          assert a['merged_main_sha']=='652cbd51cd6b546f2a178597f7f2d3474c92b1c6'
          base=a['merged_main_sha']
          def rev(path):
              return subprocess.check_output(['git','rev-parse',f'{base}:{path}'],text=True).strip()
          assert rev('stages/stage36/36-09AI/j1728-congruent-number-jacobian-preflight.json')=='c5af6c4dde67532ea8d592e74aed187c72bbed4e'
          assert rev('stages/stage36/36-09AH/common-uv-two-quadric-genusone-preflight.json')=='732431bef8dfafe25cbdeb005c4237d72a40ae4b'
          PY

      - name: Verify current 36-09AJ exact full-2 covering class
        run: python3 stages/stage36/verify_stage36_36_09AJ.py

      - name: Assert 36-09AJ firewalls and 36-09AK unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V72_36_09AJ_CANDIDATE'
          assert s['status']=='ACTIVE_BATCHING_SUBSTANTIVE_PR'
          aj=s['authority_frontier']['36-09AJ']
          assert aj['H1_FULL2_CLASS_IDENTIFIED'] is True
          assert aj['SELMER_MEMBERSHIP_PROVED'] is False
          assert aj['COVERING_LOCALLY_SOLVABLE_EVERYWHERE_PROVED'] is False
          assert aj['COVERING_CLASS_TRIVIALIZED'] is False
          assert aj['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert aj['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AK'
          assert s['current']['36_09AK_entry_allowed'] is True
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AJ exact H1/full-2 class verified; Selmer/MW/receiver firewalls intact; 36-09AK unlocked')
          PY
          git diff --check
