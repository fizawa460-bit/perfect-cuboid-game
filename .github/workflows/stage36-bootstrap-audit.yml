name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Replay exact hostile-audited U-AA promotion checkpoint
        shell: bash
        run: |
          set -euo pipefail
          H=d5c212d9be970dc31a28d50db926f4cfac34c561
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AA_audited.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09AB candidate parent
        shell: bash
        run: |
          set -euo pipefail
          H=f729993d52a441632b3566c5d08b06c2672d4ae6
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AB.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09AC candidate parent
        shell: bash
        run: |
          set -euo pipefail
          H=c86501ad978ba9395d06f59722fc60c04c632231
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AC.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09AD candidate parent
        shell: bash
        run: |
          set -euo pipefail
          H=ebb280e5f1c56372fa3494799506d2242ff2ec31
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AD.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09AE candidate parent
        shell: bash
        run: |
          set -euo pipefail
          H=205042c4c09917c319f1a596f67bf6a55d8c3d65
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AE.py"
          git worktree remove --force "$tmp"

      - name: Verify current 36-09AF variable-prime Jacobi separation
        run: python3 stages/stage36/verify_stage36_36_09AF.py

      - name: Assert 36-09AF firewalls and hostile-audit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V67_36_09AF_BATCH_AUDIT_CHECKPOINT'
          assert s['status']=='ACTIVE_BATCH_HOSTILE_AUDIT_CHECKPOINT'
          af=s['authority_frontier']['36-09AF']
          assert af['SAME_FIBER_SAME_MOD8_PRIME_IDENTITY_SEPARATION'] is True
          assert af['MOD8_RESERVOIR_COMPRESSION_SUFFICIENT'] is False
          assert af['ACTUAL_PRIME_IDENTITY_LOAD_BEARING'] is True
          assert af['ACTUAL_PAIRWISE_JACOBI_MATRIX_LOAD_BEARING'] is True
          assert af['RESIDUE_ONLY_COMPRESSION_STATUS']=='BLOCKED_NEW_PATTERN_ISOLATED'
          assert af['FULL_VARIABLE_PRIME_JACOBI_ROUTE_LIVE'] is True
          assert af['FINITE_Q_SQUARECLASS_FAMILY'] is False
          assert af['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert af['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AF-AUDIT-CHECKPOINT'
          assert s['current']['next_owner']=='HOSTILE_AUDIT'
          assert s['current']['hostile_audit_checkpoint_reached'] is True
          assert s['current']['36_09AG_entry_allowed'] is False
          assert s['promotion_gates']['36_09AF_hostile_audit_passed'] is False
          assert s['claims']['candidate_parameter_set_shrunk'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AF same-fiber variable-prime Jacobi separation verified; residue-only compression blocked; AB-AF hostile-audit checkpoint reached; 36-09AG locked')
          PY
          git diff --check
