name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Assert hostile-audited PR1670 authority promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_batch_promotion']
          assert a['candidate_pr']==1670
          assert a['audited_head']=='f2922c992ab1e056fa03932ba017d0dfdae845cb'
          assert a['hostile_audit_review']==5127056767
          assert a['merged_main_sha']=='9306238c7ada55e31311245019d6b7e474ad837f'
          PY

      - name: Replay exact 36-09AI candidate checkpoint
        shell: bash
        run: |
          set -euo pipefail
          H=8c84ca4ea7676029d6580ae433b506eaa9cc067b
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AI.py"
          git worktree remove --force "$tmp"

      - name: Verify AG-AI hostile-audit checkpoint state
        run: python3 stages/stage36/verify_stage36_36_09AI_checkpoint.py

      - name: Assert checkpoint firewalls and AJ lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V71_36_09AI_BATCH_AUDIT_CHECKPOINT'
          assert s['status']=='ACTIVE_BATCH_HOSTILE_AUDIT_CHECKPOINT'
          assert s['current']['unit']=='36-09AI-AUDIT-CHECKPOINT'
          assert s['current']['next_owner']=='HOSTILE_AUDIT'
          assert s['current']['hostile_audit_checkpoint_reached'] is True
          assert s['current']['36_09AJ_entry_allowed'] is False
          assert s['promotion_gates']['36_09AI_hostile_audit_passed'] is False
          assert s['claims']['covering_class_trivialized'] is False
          assert s['claims']['candidate_parameter_set_shrunk'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('AG-AI hostile-audit checkpoint reached; AJ locked; receiver and endpoint firewalls remain closed')
          PY
          git diff --check
