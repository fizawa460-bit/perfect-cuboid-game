name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/cards/formal/S34-W01.md'
      - 'docs/arsenal/cards/formal/S34-W02.md'
      - 'docs/arsenal/cards/workflows/LIT-WF02.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay exact 36-09CF green parent
        shell: bash
        run: |
          set -euo pipefail
          H=64bc9055b007985d11e9d43890993953cb27f175
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CF.py"
          git worktree remove --force "$tmp"
      - name: Verify current 36-09CG
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09CG.py
      - name: Assert CG firewalls and CH selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V125_36_09CG_BETA_EVEN_M_UNUSED_HMU0'
          cf=s['authority_frontier']['36-09CF'];assert cf['status']=='PROVISIONAL_EXACT_GREEN_PARENT';assert cf['exact_head']=='64bc9055b007985d11e9d43890993953cb27f175';assert cf['exact_head_ci']=='34167343086/101880897033'
          cg=s['authority_frontier']['36-09CG'];assert cg['certificate_blob_sha']=='5640b5a0dd498b893066913f241f885872e1d29a';assert cg['verifier_blob_sha']=='7a210e55a5e2386fb02a59de00502a4e810b9410';assert cg['ALL_OLD_SIX_HMU0_SPECIES_COMPLETE'] is True;assert cg['FIXED_P_PARAMETER_EXCLUSION_OBTAINED'] is False
          cur=s['current'];assert cur['next_exact_leaf']=='36-09CH_SELECTED_ALPHA_AND_BETA_HMU1_LOCAL_REALIZATION_PREFLIGHT';assert cur['36_09CH_entry_allowed'] is True;assert cur['substantive_batch_pr_continues'] is True;assert cur['hostile_audit_checkpoint_reached'] is False
          pg=s['promotion_gates'];assert pg['36_09CF_exact_head_ci_passed'] is True;assert pg['36_09CG_certificate_complete'] is True;assert pg['36_09CH_unlocked'] is True;assert pg['all_old_six_hmu0_species_complete'] is True;assert pg['all_old_six_local_realization_complete'] is False
          for key in ['fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:assert pg[key] is False
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:assert s['claims'][key] is False
          print('36-09CG workflow verified: all old-six hmu=0 species complete; CH selected-alpha/beta-hmu1 sufficiency selected.')
          PY
          git diff --check
