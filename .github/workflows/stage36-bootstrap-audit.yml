name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Verify audited DW correction remains valid
        run: python3 stages/stage36/verify_stage36_36_09DW_pairing_correction.py
      - name: Verify exact-green 36-09EB representatives
        run: python3 stages/stage36/verify_stage36_36_09EB.py
      - name: Verify exact-green 36-09EC factor Selmer and MW closure reduction
        run: python3 stages/stage36/verify_stage36_36_09EC.py
      - name: Verify exact-green 36-09ED dyadic MW saturation
        run: python3 stages/stage36/verify_stage36_36_09ED.py
      - name: Verify hostile-audited 36-09EE Q2 rho retained-open exclusion
        run: python3 stages/stage36/verify_stage36_36_09EE.py
      - name: Verify audited 36-09EF fixed-p2 physical receiver adapter
        run: python3 stages/stage36/verify_stage36_36_09EF.py
      - name: Assert V245 EF PASS consumption and EG unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          receipt=json.loads(Path('stages/stage36/36-09EF/hostile-audit-pass-consumption.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V245_36_09EF_PASS_CONSUMED_EG_UNLOCKED'
          assert s['status']=='ACTIVE_MAIN_CONTINUATION'
          assert s['base_main_sha']=='0d5410376b94038f27ed86897f2b925355415ed0'
          af=s['authority_frontier']['36-09EF']; pg=s['promotion_gates']; cur=s['current']; ha=s['hostile_audit_checkpoint']
          assert af['status']=='AUDITED_EXACT_GREEN_PASS_CONSUMED'
          assert af['audited_exact_head']=='5ea451cdf0efdd87f57fc87d5ada881ac637a183'
          assert af['external_hostile_review_id']==5150902901
          assert af['exact_head_ci']=='34320001092/102364303534'
          assert af['merged_main_sha']=='0d5410376b94038f27ed86897f2b925355415ed0'
          assert af['pass_consumption_receipt_blob_sha']=='5c6a73434c179fc3e1d11c301d1045a5f23bce2a'
          assert receipt['audit_pr']==1741
          assert receipt['audited_exact_head']==af['audited_exact_head']
          assert receipt['hostile_audit_review_id']==5150902901
          assert receipt['hostile_audit_result']=='PASS'
          assert receipt['exact_head_ci']==af['exact_head_ci']
          assert receipt['merged_main_sha']==af['merged_main_sha']
          assert receipt['consumption_result']['36_09EF_hostile_audit_passed'] is True
          assert receipt['consumption_result']['36_09EF_pass_consumed'] is True
          assert receipt['consumption_result']['36_09EG_entry_allowed'] is True
          assert pg['36_09EF_hostile_audit_passed'] is True
          assert pg['36_09EF_pass_consumed'] is True
          assert pg['36_09EG_entry_allowed'] is True
          assert pg['fixed_p2_receiver_sector_empty'] is True
          assert pg['fixed_p_parameter_exclusion_obtained'] is True
          assert pg['excluded_parameter']=='p=2'
          assert pg['candidate_parameter_set_shrunk'] is False
          assert pg['receiver_emptiness_proved'] is False
          assert pg['R29_CAMP2_closed'] is False
          assert pg['Q11_CAMPEDELLI_closed'] is False
          assert pg['endpoint_closed'] is False
          assert cur['unit']=='36-09EG'
          assert cur['36_09EG_entry_allowed'] is True
          assert ha['previous_result']=='PASS_CONSUMED'
          assert ha['previous_review_id']==5150902901
          assert ha['new_checkpoint_pending'] is False
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09EF/hostile-audit-pass-consumption.json'],text=True).strip()=='5c6a73434c179fc3e1d11c301d1045a5f23bce2a'
          print('V245 verified: hostile-audit PASS review 5150902901 is consumed after #1741 merge; 36-09EG is unlocked. No candidate-set/full R29/Q11/endpoint credit.')
          PY
          git diff --check
