name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Assert hostile-audited merged AV-AY authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())['audited_history']['36-09AV-AY']
          assert a['pr']==1683
          assert a['audited_head']=='c09f264e4becbc4c7f06145b32ce366b2d4d7a4f'
          assert a['hostile_audit_review']==5128446584
          assert a['exact_head_ci']=='34087344920/101633809000'
          assert a['merged_main_sha']=='b7a045b7c910a3e01d3826556cd71019af15418f'
          PY
          git merge-base --is-ancestor b7a045b7c910a3e01d3826556cd71019af15418f HEAD
          test "$(git rev-parse HEAD:stages/stage36/36-09AY/universal-boundary-tunnell-survivor-preflight.json)" = "add18004debf95a218a6393f6c2f18f2bd4f7e10"
          test "$(git rev-parse HEAD:stages/stage36/36-09AE/six-reservoir-squareclass-conic-coupling-preflight.json)" = "ddae37dd35cd0e732cebadf9c17f3f3fa57930df"
          test "$(git rev-parse HEAD:stages/stage36/36-09AC/same-x-separate-squareclass-double-cover-preflight.json)" = "3e95cc443bb9de9e0d2b14d6d9c32ea7c1953021"
      - name: Verify current 36-09AZ coordinate-level open refinement
        run: python3 stages/stage36/verify_stage36_36_09AZ.py
      - name: Assert AZ firewalls and BA unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V88_36_09AZ_CANDIDATE'
          assert s['status']=='ACTIVE_BATCHING_SUBSTANTIVE_PR'
          az=s['authority_frontier']['36-09AZ']
          assert az['UNIQUE_PRIMITIVE_LMINUS_BOUNDARY'] is True
          assert az['COORDINATE_LEVEL_OPEN_REFINEMENT'] is True
          assert az['BRANCH_LABEL_DELETION_VALID'] is False
          assert az['TUNNELL_DETECTS_OPEN_INEQUALITY'] is False
          assert az['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert az['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09BA'
          assert s['current']['36_09BA_entry_allowed'] is True
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AZ verified; one primitive X=K boundary point is classified, but the AY squareclass tuple cannot be deleted; BA open rational-point classification unlocked')
          PY
          git diff --check
