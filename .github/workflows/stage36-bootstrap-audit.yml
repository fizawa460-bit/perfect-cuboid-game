name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay repaired exact 36-09BC parent
        shell: bash
        run: |
          set -euo pipefail
          H=c8acd051f3d6b5537c9bd7220909b2f71306a870
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BC.py"
          git worktree remove --force "$tmp"
      - name: Verify repaired current 36-09BD
        run: python3 stages/stage36/verify_stage36_36_09BD.py
      - name: Assert BD repair firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V92_36_09BD_REPAIR_CHECKPOINT'
          assert s['failed_audit']['review']==5128976664
          bc=s['authority_frontier']['36-09BC']; bd=s['authority_frontier']['36-09BD']
          assert bc['status']=='REPAIRED_EXACT_GREEN_PARENT'
          assert bc['exact_head']=='c8acd051f3d6b5537c9bd7220909b2f71306a870'
          assert bd['EXHAUSTIVE_VIEW_AUDIT_COMPLETE'] is True
          assert bd['BLIND_REDISCOVERY_COMPLETE'] is True
          assert bd['SELECTED_FULL_CHARACTER_QUOTIENT_INVENTORY'] is True
          assert bd['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert bd['RECEIVER_CLOSED'] is False
          assert s['authority_frontier']['36-09BE']['status']=='DOWNSTREAM_RELOCK_REQUIRED_AFTER_BD_GREEN'
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['R29_CAMP2_closed'] is False
          print('36-09BD repaired provenance verified against repaired exact-green BC; BE remains locked pending this exact-head CI')
          PY
          git diff --check
