name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Replay exact 36-09U batch parent
        shell: bash
        run: |
          set -euo pipefail
          H=dfbd0ddff789b9e1a6f3b8033e553fd3d7bd56b4
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09U.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09V batch parent
        shell: bash
        run: |
          set -euo pipefail
          H=117cdb991a29706b7b9e79485c5b9f19a6f09552
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09V.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09W batch parent
        shell: bash
        run: |
          set -euo pipefail
          H=84a60e2c74b90eb51c55cf871ad1305e0684e548
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09W.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09X batch parent
        shell: bash
        run: |
          set -euo pipefail
          H=fbb418d7cc2a5a58cf79391d90ff71a4017f72cd
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09X.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09Y batch parent
        shell: bash
        run: |
          set -euo pipefail
          H=9816546d9f7148b8b3e347f2000308ee3597a582
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09Y.py"
          git worktree remove --force "$tmp"

      - name: Verify current batched 36-09Z
        run: python3 stages/stage36/verify_stage36_36_09Z.py

      - name: Assert 36-09Z firewalls and 36-09AA unlock
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V60_36_09Z_BATCHED'
          assert s['status']=='ACTIVE_BATCHING_SUBSTANTIVE_PR'
          Z=s['authority_frontier']['36-09Z']
          assert Z['QI_RANKJUMP_LOCUS_NONEMPTY'] is True
          assert Z['QI_RANKJUMP_LOCUS_EMPTY'] is False
          assert Z['GLOBAL_CASSELS_RANKJUMP_EMPTY_ROUTE_BLOCKED'] is True
          assert Z['RECEIVER_SPECIFIC_INTERSECTION_ROUTE_LIVE'] is True
          assert Z['RECEIVER_RANKJUMP_INTERSECTION_EMPTY'] is False
          assert Z['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AA'
          assert s['current']['36_09AA_entry_allowed'] is True
          assert s['current']['hostile_audit_checkpoint_reached'] is False
          assert s['promotion_gates']['36_09Z_hostile_audit_passed'] is False
          assert s['claims']['Qi_rankjump_locus_nonempty_provisional'] is True
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09Z explicit MW rankjump witnesses verified; global rankjump-empty/Cassels route blocked; receiver-coupled 36-09AA unlocked; hostile audit deferred')
          PY
