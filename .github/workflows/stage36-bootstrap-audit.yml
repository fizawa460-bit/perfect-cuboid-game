name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Verify audited DW correction remains valid
        run: python3 stages/stage36/verify_stage36_36_09DW_pairing_correction.py
      - name: Verify exact-green 36-09EB representatives
        run: python3 stages/stage36/verify_stage36_36_09EB.py
      - name: Verify exact-green 36-09EC factor Selmer and MW closure reduction
        run: python3 stages/stage36/verify_stage36_36_09EC.py
      - name: Verify exact-green 36-09ED dyadic MW saturation
        run: python3 stages/stage36/verify_stage36_36_09ED.py
      - name: Verify hostile-audited 36-09EE Q2 rho retained-open exclusion
        run: python3 stages/stage36/verify_stage36_36_09EE.py
      - name: Verify exact-green 36-09EF fixed-p2 physical receiver adapter
        run: python3 stages/stage36/verify_stage36_36_09EF.py
      - name: Assert V244 EF hostile-audit checkpoint and credit ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          ef=json.loads(Path('stages/stage36/36-09EF/fixed-p2-physical-receiver-adapter-preflight.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V244_36_09EF_EXACT_GREEN_HOSTILE_AUDIT_CHECKPOINT'
          assert s['status']=='HOSTILE_AUDIT_CHECKPOINT_PENDING_EXACT_HEAD_CI'
          assert s['base_main_sha']=='09cc1687e74ef0372e4f7f1ebd8b0cddacc52dd6'
          af=s['authority_frontier']['36-09EF']; pg=s['promotion_gates']; cur=s['current']; ha=s['hostile_audit_checkpoint']
          assert af['status']=='EXACT_GREEN_FIXED_P2_EXCLUSION_HOSTILE_AUDIT_CHECKPOINT'
          assert af['certificate_blob_sha']=='7ba7dd6df5d118868e0344d9d568c62c4058efdd'
          assert af['source_blob_sha']=='7b616319f58cb466fa6840446ee71c2078f162e1'
          assert af['verifier_blob_sha']=='7e84d81f29319686aa8b7b025308d23993b57249'
          assert af['v243_exact_green_head']=='f4408aedd0bcac865c4df272d4781b17fed1e1d5'
          assert af['v243_exact_head_ci']=='34318122353/102358580544'
          assert ef['physical_receiver_consequence']['fixed_p2_retained_receiver_sector_empty'] is True
          assert ef['physical_receiver_consequence']['fixed_p_parameter_exclusion_obtained'] is True
          assert ef['physical_receiver_consequence']['candidate_parameter_set_shrunk'] is False
          assert pg['36_09EF_exact_head_ci_passed'] is True
          assert pg['36_09EF_promotion_replay_passed'] is True
          assert pg['36_09EF_hostile_audit_passed'] is False
          assert pg['fixed_p2_receiver_sector_empty'] is True
          assert pg['fixed_p_parameter_exclusion_obtained'] is True
          assert pg['excluded_parameter']=='p=2'
          assert pg['candidate_parameter_set_shrunk'] is False
          assert pg['receiver_emptiness_proved'] is False
          assert pg['R29_CAMP2_closed'] is False
          assert pg['Q11_CAMPEDELLI_closed'] is False
          assert pg['endpoint_closed'] is False
          assert cur['hostile_audit_checkpoint_reached'] is True
          assert cur['36_09EG_entry_allowed'] is False
          assert ha['new_checkpoint_pending'] is True
          assert ha['target_pr']==1741
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09EF/fixed-p2-physical-receiver-adapter-preflight.json'],text=True).strip()=='7ba7dd6df5d118868e0344d9d568c62c4058efdd'
          assert subprocess.check_output(['git','hash-object','stages/stage36/verify_stage36_36_09EF.py'],text=True).strip()=='7e84d81f29319686aa8b7b025308d23993b57249'
          print('V244 verified: V243 exact-head CI is consumed and p=2 physical receiver exclusion is exact-green. Hostile audit is now mandatory before EG. Candidate-set/full R29/Q11/endpoint credit remains closed.')
          PY
          git diff --check
