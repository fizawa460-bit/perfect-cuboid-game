name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/cards/formal/S34-W01.md'
      - 'docs/arsenal/cards/formal/S34-W02.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Assert hostile-reaudited merged BH-BO authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_history']['36-09BH-BO']
          assert a['pr']==1691
          assert a['hostile_reaudit_review']==5130920000
          assert a['audited_exact_head']=='40210e1f9225c792eca479f3f56bed73f550e024'
          assert a['merged_main_sha']=='727b3f34c4d850e868aff64483aeb99861b13c7c'
          PY
      - name: Replay exact 36-09BP parent
        shell: bash
        run: |
          set -euo pipefail
          H=1ff60da12b83e92daa40b90ce2e5ca756a089212
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BP.py"
          git worktree remove --force "$tmp"
      - name: Verify current 36-09BQ
        run: python3 stages/stage36/verify_stage36_36_09BQ.py
      - name: Assert BQ firewalls and BR unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V106_36_09BQ_FIXED_P_OUTER_EXHAUSTIVENESS'
          bq=s['authority_frontier']['36-09BQ']
          assert bq['FIXED_P_EXHAUSTIVE_OUTER_BRANCH_FAMILY'] is True
          assert bq['AY_AW_COMPATIBLE_BRANCH'] is True
          assert bq['BB_JOINT_RECEIVER_SYSTEM_EXACT'] is True
          assert bq['UNIFORM_FINITE_Q_SQUARECLASS_FAMILY'] is False
          assert bq['UNIFORM_FINITE_H1_TWIST_FAMILY'] is False
          assert bq['S34_W02_APPLICABILITY_PROVED'] is False
          assert s['current']['unit']=='36-09BQ'
          assert s['current']['next_exact_leaf']=='36-09BR_AY_MORDELL_WEIL_CONGRUENCE_APPLICABILITY_PREFLIGHT'
          assert s['current']['36_09BR_entry_allowed'] is True
          assert s['promotion_gates']['local_parameter_elimination_route_exhausted'] is False
          assert s['promotion_gates']['uniform_finite_Q_squareclass_family'] is False
          assert s['promotion_gates']['finite_exhaustive_H1_twist_family'] is False
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert s['claims'][key] is False
          print('36-09BQ verified; fixed-p AW outer exhaustiveness recovered, AY/BB population adapter exact, uniform finite Q-squareclass/H1 family still absent, S34-W02 applicability selected next.')
          PY
          git diff --check
