name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/cards/formal/S34-W01.md'
      - 'docs/arsenal/cards/formal/S34-W02.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay exact 36-09BS parent
        shell: bash
        run: |
          set -euo pipefail
          H=14dc92d94dd81d01f0b84070070410ad4c3ecca9
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BS.py"
          git worktree remove --force "$tmp"
      - name: Verify current 36-09BT
        run: python3 stages/stage36/verify_stage36_36_09BT.py
      - name: Assert BT equation-adapter firewalls and BU unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V109_36_09BT_GENERAL_AW_FULL_COVER_MODEL'
          bt=s['authority_frontier']['36-09BT']
          assert bt['GENERAL_AW_BRANCH_FULL_COVER_LOCAL_MODEL_OBTAINED'] is True
          assert bt['SEVEN_RESERVOIR_ODD_SUPPORT_UPPER_BOUND'] is True
          assert bt['GENERAL_BRANCH_BAD_PLACE_TAXONOMY_COMPLETE'] is False
          assert bt['WHOLE_FIXED_P_PARAMETER_ELIMINATION_INTERFACE_COMPLETE'] is False
          assert s['current']['next_exact_leaf']=='36-09BU_GENERAL_AW_BRANCH_BAD_PLACE_VALUATION_TAXONOMY_PREFLIGHT'
          assert s['current']['36_09BU_entry_allowed'] is True
          assert s['promotion_gates']['local_parameter_elimination_route_exhausted'] is False
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert s['claims'][key] is False
          print('36-09BT verified; general AW full-cover equation adapter is exact. AY local taxonomy is not transferred unchanged; BU general bad-place taxonomy selected.')
          PY
          git diff --check
