name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/cards/workflows/LIT-WF02.md'
      - 'docs/arsenal/lit-wf02-global-h1-localization-reciprocity-contract.json'
      - 'docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09CL audited mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=76603296ade67b2544aaaa16559358f2a2793272
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CL.py"
          git worktree remove --force "$tmp"
      - name: Verify current 36-09CM BT global Kummer localization adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09CM.py
      - name: Assert CM firewalls and CN selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V136_36_09CM_BT_GLOBAL_KUMMER_LOCALIZATION_ADAPTER'
          cm=s['authority_frontier']['36-09CM']
          assert cm['certificate_blob_sha']=='06c3e6d1fcc2453dc44b84d50896abdc6a1658d7'
          assert cm['verifier_blob_sha']=='837ef698fd808c4adf9858f4d037ef73982db2c5'
          assert cm['BT_GLOBAL_KUMMER_CLASS_ADAPTER_COMPLETE'] is True
          assert cm['BT_DYNAMIC_LOCALIZATION_SYSTEM_ADAPTER_COMPLETE_AT_SQUARECLASS_COVER_LEVEL'] is True
          assert cm['OLD_36_04_CLASS_IDENTIFICATION_COMPLETE'] is False
          assert cm['OLD_S36_PW07_ADAPTER_COMPLETE'] is False
          assert cm['LIT_WF02_APPLICABILITY_PASS'] is False
          cur=s['current']
          assert cur['next_exact_leaf']=='36-09CN_BT_KUMMER_IMMUTABLE_LOCALIZATION_PACKAGE_PREFLIGHT'
          assert cur['36_09CN_entry_allowed'] is True
          assert cur['hostile_audit_checkpoint_reached'] is False
          pg=s['promotion_gates']
          assert pg['BT_branch_global_Kummer_class_constructed'] is True
          assert pg['BT_dynamic_localization_system_adapter_constructed_at_squareclass_cover_level'] is True
          assert pg['LIT_WF02_applicability_pass'] is False
          assert pg['new_global_obstruction_obtained'] is False
          for key in ['fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          print('36-09CM candidate verified; CN immutable package selected with all global-obstruction/closure firewalls retained.')
          PY
          git diff --check
