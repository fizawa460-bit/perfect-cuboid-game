name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DX exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=6232e765ffc2f40599a0125dac8a99f303a63e7e
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DX.py"
          git worktree remove --force "$tmp"
      - name: Verify repaired DN audit provenance remains non-authoritative
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DN.py
      - name: Assert V216 re-audit PASS consumed and DY entry unlocked
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          r=json.loads(Path('stages/stage36/36-09DX/hostile-reaudit-pass-receipt.json').read_text())
          dm=json.loads(Path('stages/stage36/36-09DM/intermediate-hostile-audit-pass-receipt.json').read_text())
          dn=json.loads(Path('stages/stage36/36-09DN/fixed-p2-full-br2-common-neighborhood-preflight.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V216_36_09DX_AUDITED_DY_UNLOCKED'
          dx=s['authority_frontier']['36-09DX']; cur=s['current']; pg=s['promotion_gates']; ha=s['hostile_audit_checkpoint']
          assert dx['status']=='AUDITED_EXACT_GREEN_PARENT'
          assert dx['certificate_blob_sha']=='ee8fda5da9fdd7ea26220740eecb07b2d8a0effe'
          assert dx['verifier_blob_sha']=='19e6a1863b26eec1354045c813b03fa16a9b012f'
          assert dx['source_blob_sha']=='403c6bf71acbce1e1f83b3ec855dd2a1e5f7ea90'
          assert dx['hostile_reaudit_receipt_blob_sha']=='cb803e739f05f7b7e15393da742c9bf5e62d8c36'
          assert dx['hostile_reaudit_review_id']==5147432710
          assert dx['promotion_replay_head']=='e4ce31bac8953e265faac6729e3a387a3592cea7'
          assert dx['promotion_replay_ci']=='34291943572'
          assert r['schema']=='STAGE36_PR1712_DX_HOSTILE_REAUDIT_PASS_RECEIPT_V1'
          assert r['status']=='PASS_EXTERNAL_REAUDIT_CONSUMABLE'
          assert r['audited_pr']==1712
          assert r['external_reaudit']['external_review_id']==5147432710
          assert r['external_reaudit']['review_node_id']=='PRR_kwDOTr52Y88AAAABMs-XBg'
          assert r['external_reaudit']['audited_exact_head']=='a3dd4765baa8ebc0395c7a346392972f32fac8db'
          assert r['external_reaudit']['result']=='PASS'
          assert r['external_reaudit']['exact_head_ci_run']==34281594257
          assert r['external_reaudit']['exact_head_ci_conclusion']=='success'
          assert r['merged_main_sha']=='119e24100dd943cadef39df783a7b5de7b3a5704'
          assert r['post_audit_main_sync']['stage36_semantic_drift'] is False
          assert ha['result']=='PASS'
          assert ha['external_reaudit_required'] is False
          assert ha['reaudit_pass_recorded'] is True
          assert ha['reaudit_pass_consumed'] is True
          assert ha['reaudit_pass_consumption_head']=='e4ce31bac8953e265faac6729e3a387a3592cea7'
          assert ha['reaudit_pass_consumption_ci']=='34291943572'
          assert cur['unit']=='36-09DX'
          assert cur['next_owner']=='MAIN'
          assert cur['substantive_batch_pr_continues'] is True
          assert cur['hostile_audit_checkpoint_reached'] is False
          assert cur['36_09DY_entry_allowed'] is True
          assert pg['hostile_reaudit_passed'] is True
          assert pg['hostile_reaudit_receipt_recorded'] is True
          assert pg['hostile_reaudit_pass_consumed'] is True
          assert pg['36_09DX_promotion_replay_passed'] is True
          assert pg['36_09DY_entry_allowed'] is True
          assert dm['authority_credit'] is False
          assert dn['batch_parent']['dm_intermediate_audit_authority_consumed'] is False
          assert pg['BT_global_Phi_Selmer_group_computed'] is True
          assert pg['BT_global_Phi_Selmer_F2_dimension']==2
          assert pg['BT_global_Phi_Selmer_cardinality']==4
          assert pg['BT_global_Phi_Selmer_third_coordinate_trivial'] is True
          assert pg['BT_proSelmer_cokernel_size_computed'] is False
          for key in ['BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09DX/hostile-reaudit-pass-receipt.json'],text=True).strip()=='cb803e739f05f7b7e15393da742c9bf5e62d8c36'
          print('PR1712 hostile re-audit PASS consumed by successful separate promotion replay. 36-09DX is the audited exact-green parent and 36-09DY entry is unlocked; no DY/downstream mathematical credit is granted.')
          PY
          git diff --check
