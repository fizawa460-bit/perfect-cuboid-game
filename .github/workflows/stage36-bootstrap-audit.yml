name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Assert hostile-audited upstream authority and immutable source locks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          am=s['audited_history']['36-09AM-AN']
          assert am['pr']==1679
          assert am['hostile_audit_review']==5127771308
          assert am['audited_head']=='12716259951f02589ecfaf6ac8f9670b7a23f06f'
          assert am['exact_head_ci']=='34076440104/101603376687'
          ao=s['audited_history']['parallel-36-09AO']
          assert ao['hostile_audit_review']==5127677576
          assert ao['audited_head']=='f5db4fc0aafdc61f931b6499afb18c1966c1f99d'
          PY
          test "$(git rev-parse HEAD:stages/stage36/36-09AE/six-reservoir-squareclass-conic-coupling-preflight.json)" = "ddae37dd35cd0e732cebadf9c17f3f3fa57930df"
          test "$(git rev-parse HEAD:stages/stage36/36-09V/gaussian-directional-prime-support-preflight.json)" = "9fdec16f920104cc6c1961fb092185a0371258d5"
          test "$(git rev-parse HEAD:stages/stage36/36-09AO/monsky-full2-kernel-source-lock.md)" = "9f22dfe19d42d7104d30d219aac1cfd72a67c72a"

      - name: Replay exact 36-09AP provisional checkpoint
        shell: bash
        run: |
          set -euo pipefail
          H=ce04f0158633f4fa935fb0949238d5b8d0ce10a2
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AP.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09AQ provisional checkpoint
        shell: bash
        run: |
          set -euo pipefail
          H=62497175353167faf98af7bfae6b6c2b3b32d013
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AQ.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09AR provisional checkpoint
        shell: bash
        run: |
          set -euo pipefail
          H=79dd6d595498d1c89f2e70dd535b2f8fe17941df
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AR.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09AS provisional checkpoint
        shell: bash
        run: |
          set -euo pipefail
          H=2ac34f56fa6b63dcbf8ac67b5c46d34857acf9c8
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AS.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09AT provisional checkpoint
        shell: bash
        run: |
          set -euo pipefail
          H=b798b4d5a5d8ac134f7831d8be7f25a4b060debc
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AT.py"
          git worktree remove --force "$tmp"
          test "$(git rev-parse "$H":stages/stage36/36-09AT/odd-localrow-monsky-equivalence-even-transpose-gap-preflight.json)" = "b4aaa9447f42ed60d51674bdaaee7ff16162437a"
          test "$(git rev-parse "$H":stages/stage36/verify_stage36_36_09AT.py)" = "62e3c992623284258c7b6e127f5ef2472757cda6"

      - name: Verify current 36-09AU reciprocity close
        run: python3 stages/stage36/verify_stage36_36_09AU.py

      - name: Assert 36-09AU checkpoint firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V83_36_09AU_AUDIT_CHECKPOINT'
          assert s['status']=='ACTIVE_BATCH_HOSTILE_AUDIT_CHECKPOINT'
          au=s['authority_frontier']['36-09AU']
          assert au['ALL_PARITY_AE_MONSKY_EXACT_EQUIVALENCE'] is True
          assert au['MONSKY_NEW_FILTER_AFTER_AE'] is False
          assert au['TUNNELL_ONLY_NEW_GLOBAL_GATE_IN_AP_AU'] is True
          assert au['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert au['RECEIVER_CLOSED'] is False
          assert au['HOSTILE_AUDIT_PASSED'] is False
          assert s['current']['unit']=='36-09AU-AUDIT-CHECKPOINT'
          assert s['current']['next_owner']=='HOSTILE_AUDIT'
          assert s['current']['hostile_audit_checkpoint_reached'] is True
          assert s['current']['36_09AV_entry_allowed'] is False
          assert s['claims']['candidate_parameter_set_shrunk'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['R29_CAMP2_closed'] is False
          assert s['claims']['Q11_CAMPEDELLI_closed'] is False
          assert s['claims']['endpoint_closed'] is False
          assert s['claims']['perfect_cuboid_existence_claim'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AU checkpoint verified; broad AP-AT replay green; AV remains locked pending hostile audit')
          PY
          git diff --check
