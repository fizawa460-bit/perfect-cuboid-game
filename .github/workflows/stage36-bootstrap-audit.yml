name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Assert hostile-audited merged AP-AU authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())['audited_history']['36-09AP-AU']
          assert a['hostile_audit_review']==5128229756
          assert a['merged_main_sha']=='d43db1874b0e657143fa07b1a16eb87fc27e0238'
          PY
          git merge-base --is-ancestor d43db1874b0e657143fa07b1a16eb87fc27e0238 HEAD
      - name: Replay exact 36-09AW provisional parent
        shell: bash
        run: |
          set -euo pipefail
          H=40befe5dc8362444a127e066d6cfdbe4a6171943
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AW.py"
          git worktree remove --force "$tmp"
          test "$(git rev-parse "$H":stages/stage36/36-09AW/fixed-p-finite-squareclass-tunnell-branch-sieve-preflight.json)" = "c1970a020803275ba87b249229e319367fa8f811"
          test "$(git rev-parse "$H":stages/stage36/verify_stage36_36_09AW.py)" = "a45d38d7db7428073e55e9cfeb929f335fd037e5"
      - name: Verify current 36-09AX bounded fixed-p scan
        run: python3 stages/stage36/verify_stage36_36_09AX.py
      - name: Assert AX firewalls and AY unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V86_36_09AX_CANDIDATE'
          ax=s['authority_frontier']['36-09AX']
          assert ax['BOUNDED_FIXED_P_SCAN_COMPLETE'] is True
          assert ax['FIXED_P_ZERO_SURVIVOR_COUNT']==0
          assert ax['TUNNELL_ALONE_PARAMETER_SHRINK_OBSERVED'] is False
          assert ax['UNIFORM_NONEXCLUSION_THEOREM'] is False
          assert ax['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert ax['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AY'
          assert s['current']['36_09AY_entry_allowed'] is True
          assert s['claims']['receiver_emptiness_proved'] is False
          print('36-09AX verified; bounded scan has no fixed-p exclusions; AY structural analysis unlocked')
          PY
          git diff --check
