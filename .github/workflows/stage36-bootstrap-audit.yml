name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Verify audited DW correction remains valid
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DW_pairing_correction.py
      - name: Verify exact-green 36-09EB representatives
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09EB.py
      - name: Verify exact-green 36-09EC factor Selmer and MW closure reduction
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09EC.py
      - name: Assert V236 EC promotion and ED unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          ec=json.loads(Path('stages/stage36/36-09EC/fixed-p2-factor-proselmer-mw-closure-preflight.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V236_36_09EC_EXACT_GREEN_ED_UNLOCKED'
          assert s['status']=='ACTIVE_MAIN_CONTINUATION'
          af=s['authority_frontier']['36-09EC']; cur=s['current']; pg=s['promotion_gates']
          assert af['status']=='EXACT_GREEN_PARENT'
          assert af['certificate_blob_sha']=='f3f4c7e126ba2b81c6fb593d9db513d9c61297a0'
          assert af['source_blob_sha']=='c3bc3947747ad72a7708cbdce5b109a9286be6d3'
          assert af['verifier_blob_sha']=='f616817a2d62ba3a70516418263acd6374c67405'
          assert af['exact_head']=='b4eb0feb76e595f0789e1d3f9e2ff1b6301374d6'
          assert af['exact_head_ci']=='34308677766/102330585261'
          assert ec['global_factor_2Selmer']['E_tau']['F2_dimension']==3
          assert ec['global_factor_2Selmer']['E_sigma']['F2_dimension']==2
          assert ec['global_factor_2Selmer']['E_rho']['F2_dimension']==2
          assert ec['factor_Sha']['T2Sha_A_zero'] is True
          assert ec['proSelmer_to_MW_completion']['T2Sel_J_equals_JQ_completion'] is True
          assert cur['next_exact_leaf']=='36-09ED_FIXED_P2_DYADIC_RANK_ONE_MW_CLOSURE_INTERSECTION_PREFLIGHT'
          assert cur['36_09ED_entry_allowed'] is True
          assert pg['36_09EC_exact_head_ci_passed'] is True
          assert pg['36_09EC_promotion_replay_passed'] is True
          assert pg['36_09ED_entry_allowed'] is True
          assert pg['BT_T2Sel_J_equals_JQ_completion'] is True
          assert pg['BT_four_translated_intersections_decided'] is False
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09EC/fixed-p2-factor-proselmer-mw-closure-preflight.json'],text=True).strip()=='f3f4c7e126ba2b81c6fb593d9db513d9c61297a0'
          assert subprocess.check_output(['git','hash-object','stages/stage36/verify_stage36_36_09EC.py'],text=True).strip()=='f616817a2d62ba3a70516418263acd6374c67405'
          for key in ['BT_retained_open_curve_proSelmer_intersection_computed','BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          print('V236 verified: EC repaired exact-head CI is consumed; T2Sel(J)=J(Q)^hat_2 is exact-green and ED is unlocked only for rank-one dyadic MW-closure intersection. No downstream credit.')
          PY
          git diff --check
