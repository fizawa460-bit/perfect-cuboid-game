name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Verify audited DW correction remains valid
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DW_pairing_correction.py
      - name: Verify exact-green 36-09EB representatives
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09EB.py
      - name: Verify exact-green 36-09EC factor Selmer and MW closure reduction
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09EC.py
      - name: Verify 36-09ED dyadic MW saturation
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09ED.py
      - name: Assert V237 provisional ED and EE relock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          ed=json.loads(Path('stages/stage36/36-09ED/fixed-p2-dyadic-rank-one-mw-saturation-preflight.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V237_36_09ED_PROVISIONAL_DYADIC_SATURATION'
          assert s['status']=='PROVISIONAL_EXACT_PENDING_CI'
          af=s['authority_frontier']['36-09ED'];cur=s['current'];pg=s['promotion_gates']
          assert af['status']=='PROVISIONAL_EXACT_PENDING_CI'
          assert af['certificate_blob_sha']=='87e4dd2074f4e7264c728d5e999cd321ba81e2e0'
          assert af['source_blob_sha']=='cc62f75cc4de2b1542db9df4c0b1f7e7976ca3a4'
          assert af['verifier_blob_sha']=='dc006ea551c198b0d5ac6027843149600f7c904b'
          assert ed['exact_rational_torsion']['rational_torsion_structure']=='Z/4Z x Z/2Z'
          assert ed['dyadic_saturation']['P_is_2adically_saturated_free_generator'] is True
          assert ed['dyadic_saturation']['P_claimed_integral_MW_generator'] is False
          assert ed['A_completion_reduction']['infinite_Z2_directions']==1
          assert cur['unit']=='36-09ED'
          assert cur['next_exact_leaf']=='36-09EE_FIXED_P2_FINITE_TORSION_Q2_RETAINED_OPEN_INTERSECTION_PREFLIGHT'
          assert cur['36_09EE_entry_allowed'] is False
          assert pg['36_09ED_exact_head_ci_passed'] is False
          assert pg['36_09EE_entry_allowed'] is False
          assert pg['BT_E_tau_P_2adic_saturated'] is True
          assert pg['BT_four_translated_intersections_decided'] is False
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09ED/fixed-p2-dyadic-rank-one-mw-saturation-preflight.json'],text=True).strip()=='87e4dd2074f4e7264c728d5e999cd321ba81e2e0'
          assert subprocess.check_output(['git','hash-object','stages/stage36/verify_stage36_36_09ED.py'],text=True).strip()=='dc006ea551c198b0d5ac6027843149600f7c904b'
          for key in ['BT_retained_open_curve_proSelmer_intersection_computed','BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          print('V237 verified: ED certifies exact E_tau 2-primary torsion and a 2-adically saturated free point P. EE remains locked; no retained-open intersection or downstream credit.')
          PY
          git diff --check
