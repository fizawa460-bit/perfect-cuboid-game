name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Verify audited DW correction remains valid
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DW_pairing_correction.py
      - name: Verify exact-green 36-09EB representatives
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09EB.py
      - name: Assert V234 EB promotion and EC unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          eb=json.loads(Path('stages/stage36/36-09EB/fixed-p2-corrected-phi-coset-representative-preflight.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V234_36_09EB_EXACT_GREEN_EC_UNLOCKED'
          assert s['status']=='ACTIVE_MAIN_CONTINUATION'
          af=s['authority_frontier']['36-09EB']; cur=s['current']; pg=s['promotion_gates']
          assert af['status']=='EXACT_GREEN_PARENT'
          assert af['certificate_blob_sha']=='63f03e134273b33fa4a51ce67c867e169996939a'
          assert af['source_blob_sha']=='e1250f712e2fb08d38a42312055a2ac7666c7a91'
          assert af['verifier_blob_sha']=='90a8290331355f9a105bb131447040b5ca1cf99a'
          assert af['exact_head']=='384973a32fb1daf200be6c4223098e223f702bb2'
          assert af['exact_head_ci']=='34306930887/102325454844'
          assert eb['jacobian_representatives']['representative_set_cardinality']==4
          assert eb['quotient_identification']['representatives_exhaust_JQ_mod_PhiAQ'] is True
          assert eb['local_translation_data']['all_four_EA_translations_materialized'] is True
          assert cur['unit']=='36-09EB'
          assert cur['next_exact_leaf']=='36-09EC_FIXED_P2_FOUR_TRANSLATED_RETAINED_OPEN_INTERSECTION_PREFLIGHT'
          assert cur['36_09EC_entry_allowed'] is True
          assert pg['36_09EB_exact_head_ci_passed'] is True
          assert pg['36_09EB_promotion_replay_passed'] is True
          assert pg['36_09EC_entry_allowed'] is True
          assert pg['BT_Phi_coset_representatives_materialized'] is True
          assert pg['BT_Phi_coset_representative_count']==4
          assert pg['BT_four_translated_intersections_decided'] is False
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09EB/fixed-p2-corrected-phi-coset-representative-preflight.json'],text=True).strip()=='63f03e134273b33fa4a51ce67c867e169996939a'
          assert subprocess.check_output(['git','hash-object','stages/stage36/verify_stage36_36_09EB.py'],text=True).strip()=='90a8290331355f9a105bb131447040b5ca1cf99a'
          for key in ['BT_retained_open_curve_proSelmer_intersection_computed','BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          print('V234 verified: all four corrected rational Phi coset representatives are exact-green and EC is unlocked only to test the four translated retained-open intersections. No downstream credit.')
          PY
          git diff --check
