name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/cards/formal/S34-W01.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Assert hostile-reaudited merged BH-BO authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_history']['36-09BH-BO']
          assert a['pr']==1691
          assert a['failed_audit_review']==5130678946
          assert a['hostile_reaudit_review']==5130920000
          assert a['audited_exact_head']=='40210e1f9225c792eca479f3f56bed73f550e024'
          assert a['exact_head_ci']=='34111088276/101707255576'
          assert a['merged_main_sha']=='727b3f34c4d850e868aff64483aeb99861b13c7c'
          assert a['accepted_aggregate']=='NO_PARAMETER_SHRINK_ESTABLISHED_AT_CURRENT_CHECKPOINT'
          PY
      - name: Replay hostile-reaudited exact 36-09BO head
        shell: bash
        run: |
          set -euo pipefail
          H=40210e1f9225c792eca479f3f56bed73f550e024
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BO.py"
          git worktree remove --force "$tmp"
      - name: Verify current 36-09BP
        run: python3 stages/stage36/verify_stage36_36_09BP.py
      - name: Assert BP router firewalls and BQ unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V105_36_09BP_GLOBAL_DESCENT_ROUTER'
          bp=s['authority_frontier']['36-09BP']
          assert bp['SELECTED_WEAPON']=='S34-W01'
          assert bp['S34_W01_SHAPE_MATCH'] is True
          assert bp['EXHAUSTIVE_BRANCH_ADAPTER_MISSING'] is True
          assert bp['FINITE_EXHAUSTIVE_SQUARECLASS_FAMILY'] is False
          assert bp['FINITE_EXHAUSTIVE_H1_TWIST_FAMILY'] is False
          assert s['cycle_ledger']['B4_BAD_PRIME_LOCAL']=='LIVE_PARAMETER_ELIMINATION_UNTESTED_UNIFORMLY_RETAINS_RECEIVER_POINT_GATES'
          assert s['current']['unit']=='36-09BP'
          assert s['current']['next_exact_leaf']=='36-09BQ_RELATIVE_FACTOR_SQUARECLASS_BRANCH_EXHAUSTIVENESS_PREFLIGHT'
          assert s['current']['36_09BQ_entry_allowed'] is True
          assert s['promotion_gates']['36_09BO_hostile_reaudit_passed'] is True
          assert s['promotion_gates']['36_09BO_merged'] is True
          assert s['promotion_gates']['finite_exhaustive_squareclass_family'] is False
          assert s['promotion_gates']['finite_exhaustive_H1_twist_family'] is False
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert s['claims'][key] is False
          print('36-09BP router verified; audited BH-BO promoted, S34-W01 selected only as shape match, exhaustive receiver branch adapter remains BQ, local parameter elimination stays live.')
          PY
          git diff --check
