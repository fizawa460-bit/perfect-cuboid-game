        run: git show 51efa8394c45bc60a4b482c4f6f94f7826eb9d20:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 36-09E preflight
        run: python3 stages/stage36/verify_stage36_36_09E.py
      - name: Restore exact V23 36-09E promotion state
        run: git show f75830b2fd54031c1af05e2377a9da365a4d7fdf:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 36-09E audited authority
        run: python3 stages/stage36/verify_stage36_36_09E_audited.py
      - name: Restore exact V24 36-09F mathematical state
