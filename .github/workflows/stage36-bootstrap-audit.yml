name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'stages/stage29/29-16/active-kernel-ledger.json'
      - 'stages/stage29/29-06/endpoint-hub-graph.json'
      - 'stages/stage29/29-02ha/result.md'
      - 'stages/stage29/29-02ha/exact-sign-cover-model.md'
      - 'stages/stage29/29-02hb/campedelli_kernel_check.py'
      - 'stages/stage29/29-02hb/route-contract.json'
      - 'stages/stage29/29-02hb/arithmetic-routing.md'
      - 'stages/stage29/29-02hb/campedelli-quotient-adapter.md'
      - 'stages/stage29/29-02hb/source-lock.md'
      - 'docs/arsenal/index.json'
      - 'docs/arsenal/cards/formal/S30-W01.md'
      - 'docs/arsenal/cards/workflows/S30-WF02.md'
      - 'docs/arsenal/cards/workflows/S30-WF03.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "exact_head=$actual"

      - name: Assert current PR base lock
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.base.sha }}"
          python3 - "$expected" <<'PY'
          import json
          import sys
          from pathlib import Path
          expected = sys.argv[1]
          state = json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          actual = state['base_main_sha']
          assert actual == expected, f'MAIN-STATE base_main_sha {actual} != PR base {expected}'
          print(f'base_main_sha={actual}')
          PY

      - name: Replay Stage36 bootstrap authority
        run: python3 stages/stage36/verify_stage36_bootstrap.py

      - name: Replay audited Stage36 36-01 authority
        run: python3 stages/stage36/verify_stage36_36_01.py

      - name: Verify Stage36 36-02 three Q representatives
        run: python3 stages/stage36/verify_stage36_36_02.py

      - name: Assert hostile-audit boundary before 36-03
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['status'] == 'ACTIVE_PENDING_HOSTILE_AUDIT'
          assert s['current']['unit'] == '36-02'
          assert s['current']['next_exact_leaf'] == '36-02_THREE_Q_REPRESENTATIVE_INVENTORY'
          assert s['current']['provisional_successor_after_hostile_audit'] == '36-03_PHYSICAL_OPEN_PUSH_AND_BOUNDARY'
          assert s['promotion_gates']['source_authority_lock_complete'] is True
          assert s['promotion_gates']['three_Q_representatives_exact'] is False
          for key, value in s['promotion_gates'].items():
              if key != 'source_authority_lock_complete':
                  assert value is False, (key, value)
          assert all(v is False for v in s['claims'].values())
          print('36-02 pending hostile audit; 36-03 not started')
          PY
