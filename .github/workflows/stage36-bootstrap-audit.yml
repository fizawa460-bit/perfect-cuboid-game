name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'stages/stage29/29-16/active-kernel-ledger.json'
      - 'stages/stage29/29-06/endpoint-hub-graph.json'
      - 'stages/stage29/29-06/source-crosswalk.md'
      - 'stages/stage29/29-02f/audit.md'
      - 'stages/stage29/29-02f/route-contract.json'
      - 'stages/stage29/29-02f/boundary-gersten-receiver.md'
      - 'stages/stage29/29-02f/open-algebraic-brauer-adapter.md'
      - 'stages/stage29/29-02ha/result.md'
      - 'stages/stage29/29-02ha/exact-sign-cover-model.md'
      - 'stages/stage29/29-02hb/campedelli_kernel_check.py'
      - 'stages/stage29/29-02hb/route-contract.json'
      - 'stages/stage29/29-02hb/arithmetic-routing.md'
      - 'stages/stage29/29-02hb/campedelli-quotient-adapter.md'
      - 'stages/stage29/29-02hb/source-lock.md'
      - 'docs/arsenal/index.json'
      - 'docs/arsenal/cards/formal/S30-W01.md'
      - 'docs/arsenal/cards/formal/S34-W01.md'
      - 'docs/arsenal/cards/formal/S34-W02.md'
      - 'docs/arsenal/cards/formal/S34-W03.md'
      - 'docs/arsenal/cards/provisional/S33-PW07.md'
      - 'docs/arsenal/cards/provisional/S33-PW08.md'
      - 'docs/arsenal/cards/workflows/S30-WF01.md'
      - 'docs/arsenal/cards/workflows/S30-WF02.md'
      - 'docs/arsenal/cards/workflows/S30-WF03.md'
      - 'docs/arsenal/cards/workflows/S34-WF01.md'
      - 'docs/research-os/policies/repository-asset-discovery.md'
      - 'docs/research-os/policies/cycle-exploration-safety-protocol.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "exact_head=$actual"

      - name: Assert current PR base lock
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.base.sha }}"
          python3 - "$expected" <<'PY'
          import json,sys
          from pathlib import Path
          expected=sys.argv[1]
          actual=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())['base_main_sha']
          assert actual==expected, f'MAIN-STATE base_main_sha {actual} != PR base {expected}'
          print(f'base_main_sha={actual}')
          PY

      - name: Assert PR base is merged into exact PR head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          current="${{ github.event.pull_request.base.sha }}"
          git merge-base --is-ancestor "$current" HEAD
          test "$(git merge-base "$current" HEAD)" = "$current"
          echo "pr_base_ancestor=$current"

      - name: Prepare historical V14 36-09A mathematical replay projection
        shell: bash
        run: |
          set -euo pipefail
          cp stages/stage36/MAIN-STATE.json /tmp/stage36-current-state.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('stages/stage36/MAIN-STATE.json')
          s=json.loads(p.read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V15_36_09A_AUDITED_USER_APPROVED'
          assert s['status']=='ACTIVE'
          s['schema']='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V14_36_09A_PENDING_HOSTILE_AUDIT'
          s['status']='ACTIVE_PENDING_HOSTILE_AUDIT'
          s['base_main_sha']='5fa33e600b81fc34f4be9b22761c8079b31d7806'
          s.pop('stage36_36_09A_authority',None)
          s['completed_units']['36-09A']={
            'leaf':'36-09A_CAMP4_BRAUER_COMPATIBILITY_PREFLIGHT',
            'status':'BLOCKED_UPSTREAM_BR2A_BR2B_INCOMPLETE_PENDING_HOSTILE_AUDIT',
            'certificate':'stages/stage36/36-09A/camp4-brauer-compatibility-preflight.json',
            'certificate_blob_sha':'66f31c03e5a978783a60b036322538f173a2f411',
            'verifier':'stages/stage36/verify_stage36_36_09A.py',
            'legal_outcome':'BLOCKED_UPSTREAM_BR2A_BR2B_INCOMPLETE',
            'CAMP2_QFORM_OPEN_BRIDGE_EXACT':True,
            'CAMP4_TO_CAMP2_BRAUER_COMPATIBILITY_PROVED':False,
            'CAMP4_TO_CAMP2_BRAUER_INCOMPATIBILITY_PROVED':False,
            'NEXT_ROUTE_AFTER_AUDIT':'36-09B_RECEIVER_RESTRICTED_BRANCH_INTERSECTION_PREFLIGHT',
            'NEW_THEOREM_CREDIT':False,
            'promotion_status':'PROVISIONAL_NOT_AUDITED'
          }
          s['current']={
            'unit':'36-09A',
            'next_exact_leaf':'36-09A_CAMP4_BRAUER_COMPATIBILITY_PREFLIGHT',
            'next_owner':'STAGE36_MAIN',
            'result':'BLOCKED_UPSTREAM_BR2A_BR2B_INCOMPLETE_PENDING_HOSTILE_AUDIT',
            '36_06_entry_allowed':False,
            '36_09_entry_allowed':False,
            '36_09A_entry_allowed':True,
            '36_09B_entry_allowed':False,
            'provisional_successor_after_hostile_audit':'36-09B_RECEIVER_RESTRICTED_BRANCH_INTERSECTION_PREFLIGHT',
            'why':'CAMP2 Q-form/open bridge is exact, but retained K16-C2-BRAUER-EXPLICIT-CHAIN authority leaves BR2A explicit classes and BR2B local evaluations open, so Campedelli pull-push compatibility cannot yet be certified. Neither compatibility nor incompatibility is claimed.'
          }
          s['anti_loop'].pop('do_not_start_36_09B_before_36_09A_authority_resolution',None)
          s['anti_loop']['do_not_start_36_09B_before_36_09A_hostile_audit']=True
          p.write_text(json.dumps(s,indent=2,separators=(',', ': '))+'\n')
          print('historical V14 36-09A projection prepared')
          PY

      - name: Replay Stage36 bootstrap authority
        run: python3 stages/stage36/verify_stage36_bootstrap.py

      - name: Replay audited Stage36 36-01 authority
        run: python3 stages/stage36/verify_stage36_36_01.py

      - name: Replay audited Stage36 36-02 authority
        run: python3 stages/stage36/verify_stage36_36_02_audited.py

      - name: Replay audited Stage36 36-03 authority
        run: python3 stages/stage36/verify_stage36_36_03_audited.py

      - name: Replay audited Stage36 36-04 authority
        run: python3 stages/stage36/verify_stage36_36_04_audited.py

      - name: Replay audited Stage36 36-05 blocked authority
        run: python3 stages/stage36/verify_stage36_36_05_audited.py

      - name: Replay audited Stage36 36-09 breadth authority
        run: python3 stages/stage36/verify_stage36_36_09_audited.py

      - name: Replay immutable Stage36 36-09A mathematical preflight
        run: python3 stages/stage36/verify_stage36_36_09A.py

      - name: Restore V15 audited promotion state
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/stage36-current-state.json stages/stage36/MAIN-STATE.json

      - name: Replay Stage36 36-09A user-approved audited authority
        run: python3 stages/stage36/verify_stage36_36_09A_audited.py

      - name: Assert 36-09B authorized but unstarted
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V15_36_09A_AUDITED_USER_APPROVED'
          assert s['status']=='ACTIVE'
          u=s['completed_units']['36-09A']
          assert u['promotion_status']=='AUDITED'
          assert u['verdict']=='USER_APPROVED_PASS_AFTER_FRESHNESS_ONLY_FAIL'
          assert u['final_freshness_only_fail_review']==5120235515
          assert u['final_user_approved_head']=='bc94e9c7aa8be2cd1c14dec63d001282cb6bb781'
          assert u['final_exact_head_ci_run']==33950158090
          assert u['final_exact_head_ci_job']==101263286962
          assert u['certificate_blob_sha']=='66f31c03e5a978783a60b036322538f173a2f411'
          assert s['current']['unit']=='36-09B'
          assert s['current']['36_09B_entry_allowed'] is True
          assert s['current']['36_06_entry_allowed'] is False
          assert '36-09B' not in s['completed_units']
          assert s['promotion_gates']['receiver_matched_replacement_theorem_proved'] is False
          assert s['promotion_gates']['R29_CAMP2_closed'] is False
          assert all(v is False for v in s['claims'].values())
          print('36-09A user-approved authority promoted; 36-09B authorized but unstarted')
          PY
