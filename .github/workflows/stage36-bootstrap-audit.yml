name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DD exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=d1e1e48745b4ea2bdebb7ea69f2beb500f4974df
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DD.py"
          git worktree remove --force "$tmp"
      - name: Assert DD exact-green promotion and DE unlock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V171_36_09DD_EXACT_GREEN_DE_UNLOCK'
          dd=s['authority_frontier']['36-09DD']
          assert dd['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert dd['certificate_blob_sha']=='81c580ab09f2fc265f033c51e99f3a553d726f92'
          assert dd['verifier_blob_sha']=='07058c865dbb493183d9c71b0e176f2c3d08e729'
          assert dd['exact_head']=='d1e1e48745b4ea2bdebb7ea69f2beb500f4974df'
          assert dd['exact_head_ci']=='34203063483/101986101989'
          assert dd['FOURTH_INDEPENDENT_BRAUER_CLASS_FOUND'] is True
          assert dd['CONSTRUCTED_BRAUER_SUBGROUP_RANK_LOWER_BOUND']==4
          assert dd['RANK3_COMPLETENESS_DISPROVED'] is True
          assert dd['FULL_CREUTZ_VIRAY_EXPLICIT_IMAGE_COMPUTED'] is False
          cur=s['current']
          assert cur['unit']=='36-09DD'
          assert cur['next_exact_leaf']=='36-09DE_FIXED_P2_PRIME_PRIVATE_BRAUER_FAMILY_PREFLIGHT'
          assert cur['36_09DE_entry_allowed'] is True
          pg=s['promotion_gates']
          assert pg['36_09DD_exact_head_ci_passed'] is True
          assert pg['36_09DE_entry_allowed'] is True
          assert pg['BT_constructed_Brauer_subgroup_rank_lower_bound']==4
          assert pg['BT_full_Creutz_Viray_explicit_image_computed'] is False
          assert pg['BT_full_relevant_Brauer_group_computed'] is False
          for key in ['Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          print('36-09DD exact-green parent verified and DE unlocked. Fourth independent class is provisional credit only; full explicit/full Brauer image remains open.')
          PY
          git diff --check
