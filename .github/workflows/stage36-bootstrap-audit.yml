          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V29_THIN_36_09H_AUDITED'
          assert s['status']=='ACTIVE'
          a=s['authority_frontier']['36-09H']
