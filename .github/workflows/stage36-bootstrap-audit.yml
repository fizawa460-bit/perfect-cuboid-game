name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Assert hostile-audited PR1670 authority promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_batch_promotion']
          assert a['candidate_pr']==1670
          assert a['audited_head']=='f2922c992ab1e056fa03932ba017d0dfdae845cb'
          assert a['hostile_audit_review']==5127056767
          assert a['merged_main_sha']=='9306238c7ada55e31311245019d6b7e474ad837f'
          PY

      - name: Replay exact 36-09AH candidate parent
        shell: bash
        run: |
          set -euo pipefail
          H=ab90853e74735a367faa4d98e5c249de3c3a9cd5
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AH.py"
          git worktree remove --force "$tmp"

      - name: Verify current 36-09AI congruent-number Jacobian
        run: python3 stages/stage36/verify_stage36_36_09AI.py

      - name: Assert 36-09AI firewalls and 36-09AJ unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V70_36_09AI_CANDIDATE'
          ai=s['authority_frontier']['36-09AI']
          assert ai['Q_JACOBIAN_FAMILY']=='CONGRUENT_NUMBER_J1728'
          assert ai['NORMALIZED_MODEL']=='E_n: Y^2=X^3-n^2*X'
          assert ai['n_positive_squarefree'] is True
          assert ai['TWO_COVERING_STRUCTURE_IDENTIFIED'] is True
          assert ai['COVERING_CLASS_TRIVIALIZED'] is False
          assert ai['MORDELL_WEIL_RANK_CLASSIFIED'] is False
          assert ai['COMMON_UV_RATIONAL_POINT_OBTAINED'] is False
          assert ai['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert ai['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AJ'
          assert s['current']['36_09AJ_entry_allowed'] is True
          assert s['promotion_gates']['36_09AI_hostile_audit_passed'] is False
          assert s['claims']['covering_class_trivialized'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AI exact: common-u:v curve is a 2-covering of squarefree congruent-number E_n with j=1728; covering class not trivialized; 36-09AJ unlocked')
          PY
          git diff --check
