name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Assert hostile-audited merged AV-AY authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())['audited_history']['36-09AV-AY']
          assert a['pr']==1683 and a['hostile_audit_review']==5128446584
          assert a['merged_main_sha']=='b7a045b7c910a3e01d3826556cd71019af15418f'
          PY
      - name: Replay exact 36-09AZ
        shell: bash
        run: |
          set -euo pipefail
          H=70d242588f4ae1b56dfc80e7c634e1f666ff57fd
          tmp="$(mktemp -d)"; git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AZ.py"
          git worktree remove --force "$tmp"
      - name: Replay exact 36-09BA
        shell: bash
        run: |
          set -euo pipefail
          H=a4fde9a55b6483018ffb4be49ffbc758939b7e22
          tmp="$(mktemp -d)"; git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BA.py"
          git worktree remove --force "$tmp"
      - name: Replay exact 36-09BB
        shell: bash
        run: |
          set -euo pipefail
          H=72441c82f2c146c63ebde6459b18789e33c6dddb
          tmp="$(mktemp -d)"; git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BB.py"
          git worktree remove --force "$tmp"
      - name: Replay repaired exact 36-09BC
        shell: bash
        run: |
          set -euo pipefail
          H=c8acd051f3d6b5537c9bd7220909b2f71306a870
          tmp="$(mktemp -d)"; git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BC.py"
          git worktree remove --force "$tmp"
      - name: Replay repaired exact 36-09BD
        shell: bash
        run: |
          set -euo pipefail
          H=03e1a03c84afcceb7b034b3326aef989baafe621
          tmp="$(mktemp -d)"; git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BD.py"
          git worktree remove --force "$tmp"
      - name: Verify current repaired 36-09BE
        run: python3 stages/stage36/verify_stage36_36_09BE.py
      - name: Assert repaired BE checkpoint firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V93_36_09BE_AUDIT_CHECKPOINT'
          assert s['failed_audit']['review']==5128976664
          bc=s['authority_frontier']['36-09BC']; bd=s['authority_frontier']['36-09BD']; be=s['authority_frontier']['36-09BE']
          assert bc['JACOBIAN_MINOR']=='32*R0*S0*kappa*lambda'
          assert bc['exact_head']=='c8acd051f3d6b5537c9bd7220909b2f71306a870'
          assert bd['exact_head']=='03e1a03c84afcceb7b034b3326aef989baafe621'
          assert be['FULL_COVER_GENUS']==17
          assert be['CHARACTER_QUOTIENT_INVENTORY_COMPLETE'] is True
          assert be['WEIGHT2_ELLIPTIC_QUOTIENT_COUNT']==6
          assert be['NEW_CROSS_ELLIPTIC_QUOTIENT_COUNT']==2
          assert be['FULL_JACOBIAN_Q_ISOGENY_DECOMPOSITION_PROVED'] is False
          assert be['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert be['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09BE-AUDIT-CHECKPOINT'
          assert s['current']['36_09BF_entry_allowed'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['R29_CAMP2_closed'] is False
          assert s['claims']['Q11_CAMPEDELLI_closed'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('AZ-BE repaired broad replay passed; BF remains locked pending hostile re-audit')
          PY
          git diff --check
