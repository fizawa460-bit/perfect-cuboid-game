name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Assert hostile-audited merged BF-BG authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_history']['36-09BF-BG']
          assert a['pr']==1689
          assert a['hostile_audit_review']==5129489415
          assert a['audited_exact_head']=='731265665feb2bed991cf912b89431bb35ce65ad'
          assert a['exact_head_ci']=='34098010028/101665838247'
          assert a['merged_main_sha']=='e758e05953df2cf8cd4ab26ac1e9d72374e99760'
          PY
          git merge-base --is-ancestor e758e05953df2cf8cd4ab26ac1e9d72374e99760 HEAD
      - name: Replay hostile-audited exact 36-09BG head
        shell: bash
        run: |
          set -euo pipefail
          H=731265665feb2bed991cf912b89431bb35ce65ad
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BG.py"
          git worktree remove --force "$tmp"
      - name: Verify current 36-09BH
        run: python3 stages/stage36/verify_stage36_36_09BH.py
      - name: Assert BH firewalls and BI unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V96_36_09BH_BAD_PLACE_FULL_COVER_VALUATION'
          bh=s['authority_frontier']['36-09BH']
          assert bh['ODD_BAD_SUPPORT_SEVEN_RESERVOIRS'] is True
          assert bh['NEW_ODD_RESERVOIR']=='Q=a^2+b^2'
          assert bh['NEW_Q_RESERVOIR_FIRST_RESIDUE_FILTER'] is False
          assert bh['PRIME2_FULL_COVER_CLASSIFIED'] is False
          assert bh['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert bh['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09BH'
          assert s['current']['next_exact_leaf']=='36-09BI_PRIME2_FULL_COVER_CONGRUENCE_PREFLIGHT'
          assert s['current']['36_09BI_entry_allowed'] is True
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert s['claims'][key] is False
          print('36-09BH checkpoint verified; seven-reservoir odd bad support fixed, Q-reservoir first row automatic, prime 2 unlocked next')
          PY
          git diff --check
