name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Replay exact 36-09U batch parent
        shell: bash
        run: |
          set -euo pipefail
          H=dfbd0ddff789b9e1a6f3b8033e553fd3d7bd56b4
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09U.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09V batch parent
        shell: bash
        run: |
          set -euo pipefail
          H=117cdb991a29706b7b9e79485c5b9f19a6f09552
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09V.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09W batch parent
        shell: bash
        run: |
          set -euo pipefail
          H=84a60e2c74b90eb51c55cf871ad1305e0684e548
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09W.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09X batch parent
        shell: bash
        run: |
          set -euo pipefail
          H=fbb418d7cc2a5a58cf79391d90ff71a4017f72cd
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09X.py"
          git worktree remove --force "$tmp"

      - name: Verify current batched 36-09Y
        run: python3 stages/stage36/verify_stage36_36_09Y.py

      - name: Assert 36-09Y firewalls and 36-09Z unlock
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V59_36_09Y_BATCHED'
          assert s['status']=='ACTIVE_BATCHING_SUBSTANTIVE_PR'
          Y=s['authority_frontier']['36-09Y']
          assert Y['COMPLETE_ODD_LOCAL_MATRIX'] is True
          assert Y['ALPHA_CROSS_D0_ROW']=='(d/r)=+1'
          assert Y['BETA_CROSS_C0_ROW']=='(e/r)=+1'
          assert Y['ALPHA_Q2_INFINITY_CLASSIFIED'] is True
          assert Y['BETA_COMPLETE_Q2_IMAGE_CLASSIFIED'] is False
          assert Y['B11_LOCAL_SOLVABILITY_ONLY_UNIFORM_CLOSURE_BLOCKED'] is True
          assert Y['GLOBAL_SELMER_TO_MW_DISTINCTION_LIVE'] is True
          assert Y['MULTIPLACE_RECIPROCITY_OBSTRUCTION_PROVED'] is False
          assert Y['ALPHA_GROWTH_EXCLUDED'] is False
          assert Y['BETA_GROWTH_EXCLUDED'] is False
          assert Y['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert Y['QI_RANKJUMP_LOCUS_EMPTY'] is False
          assert Y['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09Z'
          assert s['current']['36_09Z_entry_allowed'] is True
          assert s['current']['hostile_audit_checkpoint_reached'] is False
          assert s['promotion_gates']['36_09Y_hostile_audit_passed'] is False
          assert s['promotion_gates']['multiplace_reciprocity_obstruction_proved'] is False
          assert s['claims']['candidate_parameter_set_shrunk'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09Y odd cross-sector local matrix and alpha Q2/infinity boundary verified; pure-local B11 closure blocked; 36-09Z Selmer-to-MW/Cassels preflight unlocked; hostile audit deferred')
          PY
