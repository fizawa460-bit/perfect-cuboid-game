name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DF exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=ac6dc90ac0a6a872076117cd9801f3e3c1bc6d09
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DF.py"
          git worktree remove --force "$tmp"
      - name: Verify 36-09DG paired Q(i) complement direction
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DG.py
      - name: Assert DG checkpoint and DH lock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V176_36_09DG_PAIRED_QI_COMPLEMENT'
          dg=s['authority_frontier']['36-09DG']
          assert dg['status']=='PROVISIONAL_PENDING_EXACT_HEAD_CI'
          assert dg['certificate_blob_sha']=='01648358b303872f228b7835cbd44bb8d15578c7'
          assert dg['verifier_blob_sha']=='1e33184927096ba26a2c8866073c6078520eb4b4'
          assert dg['source_lock_blob_sha']=='f5b5e0a333464257ca29ea058de2cf3bd191636f'
          assert dg['PAIRED_QI_CLASS_FOUND'] is True
          assert dg['F5_INDEPENDENT_FROM_KNOWN_PRIVATE_SUBGROUP_MOD_BRQ'] is True
          assert dg['F5_OUTSIDE_ENTIRE_RATIONAL_COMPONENT_IMAGE'] is False
          assert dg['FULL_L1_QUOTIENT_COMPUTED'] is False
          assert dg['FULL_CREUTZ_VIRAY_EXPLICIT_IMAGE_COMPUTED'] is False
          cur=s['current']
          assert cur['unit']=='36-09DG'
          assert cur['next_exact_leaf']=='36-09DH_FIXED_P2_PAIRED_QI_CROSS_EVALUATION_AND_FAMILY_PREFLIGHT'
          assert cur['36_09DG_entry_allowed'] is True
          assert cur['36_09DH_entry_allowed'] is False
          pg=s['promotion_gates']
          assert pg['36_09DG_certificate_complete'] is True
          assert pg['36_09DG_exact_head_ci_passed'] is False
          assert pg['36_09DH_entry_allowed'] is False
          assert pg['BT_F5_independent_from_known_private_subgroup_mod_BrQ'] is True
          assert pg['BT_F5_outside_entire_rational_component_image'] is False
          for key in ['BT_full_L1_quotient_computed','BT_Pic0_mod2_computed','BT_full_Creutz_Viray_explicit_image_computed','BT_full_relevant_Brauer_group_computed','BT_joint_BM_correction_with_F5_complete','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          print('36-09DG provisional checkpoint verified. F5 is new modulo the known infinite private subgroup H; DH remains locked. No full quotient/Brauer/BM/fixed-p/receiver credit.')
          PY
          git diff --check
