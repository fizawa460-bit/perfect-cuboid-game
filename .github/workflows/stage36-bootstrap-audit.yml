name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DQ exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=b121fc0f23eba3241f35cf64a13d45cba7eaa213
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DQ.py"
          git worktree remove --force "$tmp"
      - name: Assert V199 DQ exact-green parent and DR unlock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V199_36_09DQ_EXACT_GREEN_DR_UNLOCK_PENDING_PROMOTION_REPLAY'
          dq=s['authority_frontier']['36-09DQ']
          assert dq['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert dq['certificate_blob_sha']=='4c41228d23f9088bfbea8b68c94b2a26948f8691'
          assert dq['verifier_blob_sha']=='cabac18dca47c5bb56a54c08876aae653b3bc4c8'
          assert dq['source_blob_sha']=='71829ec5e0af601605f1f93c5f3a3fec4cae2102'
          assert dq['exact_head']=='b121fc0f23eba3241f35cf64a13d45cba7eaa213'
          assert dq['exact_head_ci']=='34231468694/102078401099'
          assert dq['GLOBAL_2PRIMARY_ADELIC_ANNIHILATOR_COMPUTED'] is True
          cur=s['current']; pg=s['promotion_gates']
          assert cur['unit']=='36-09DQ'
          assert cur['36_09DR_entry_allowed'] is True
          assert pg['36_09DQ_exact_head_ci_passed'] is True
          assert pg['36_09DQ_promotion_replay_passed'] is False
          assert pg['36_09DR_entry_allowed'] is True
          assert pg['BT_global_2primary_adelic_annihilator_is_T2Sel_image'] is True
          assert pg['BT_retained_open_curve_proSelmer_intersection_computed'] is False
          for key in ['BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          print('36-09DQ immutable exact-green evidence replayed; 36-09DR is unlocked for the retained-open curve/pro-Selmer intersection problem only. No downstream credit is granted.')
          PY
          git diff --check
