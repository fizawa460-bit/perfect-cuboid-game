name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Assert hostile-audited merged BF-BG authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_history']['36-09BF-BG']
          assert a['pr']==1689
          assert a['hostile_audit_review']==5129489415
          assert a['audited_exact_head']=='731265665feb2bed991cf912b89431bb35ce65ad'
          assert a['exact_head_ci']=='34098010028/101665838247'
          assert a['merged_main_sha']=='e758e05953df2cf8cd4ab26ac1e9d72374e99760'
          PY
      - name: Replay hostile-audited exact 36-09BG head
        shell: bash
        run: |
          set -euo pipefail
          H=731265665feb2bed991cf912b89431bb35ce65ad
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BG.py"
          git worktree remove --force "$tmp"
      - name: Replay exact 36-09BN parent
        shell: bash
        run: |
          set -euo pipefail
          H=7d9d6e3b1011715c5884a2da0a642892d8cf3984
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BN.py"
          git worktree remove --force "$tmp"
      - name: Verify current 36-09BO
        run: python3 stages/stage36/verify_stage36_36_09BO.py
      - name: Assert BO checkpoint firewalls and BP lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V103_36_09BO_BAD_PLACE_LOCAL_AUDIT_CHECKPOINT'
          bo=s['authority_frontier']['36-09BO']
          assert bo['Q_RESERVOIR_LOCAL_LAYER_COMPLETE'] is True
          assert bo['ALL_BAD_PLACE_LOCAL_SQUARE_LAYERS_CLASSIFIED'] is True
          assert bo['BAD_PLACE_PARAMETER_ONLY_LOCAL_ROUTE_BLOCKED'] is True
          assert bo['LOCAL_RECEIVER_POINT_GATES_RETAINED'] is True
          assert bo['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert bo['RECEIVER_CLOSED'] is False
          assert s['cycle_ledger']['B4_BAD_PRIME_LOCAL']=='BLOCKED_AS_STANDALONE_PARAMETER_FILTER_RETAINS_RECEIVER_POINT_GATES'
          assert s['current']['unit']=='36-09BO-AUDIT-CHECKPOINT'
          assert s['current']['hostile_audit_checkpoint_reached'] is True
          assert s['current']['36_09BP_entry_allowed'] is False
          assert s['promotion_gates']['36_09BO_hostile_audit_passed'] is False
          assert s['promotion_gates']['36_09BP_unlocked'] is False
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert s['claims'][key] is False
          print('36-09BO checkpoint verified; all bad-place local square layers classified, standalone parameter-local route blocked, receiver-point gates retained, BP audit-locked')
          PY
          git diff --check
