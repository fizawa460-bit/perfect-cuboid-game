name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'stages/stage29/29-16/active-kernel-ledger.json'
      - 'stages/stage29/29-06/endpoint-hub-graph.json'
      - 'stages/stage29/29-02f/**'
      - 'stages/stage29/29-02ha/**'
      - 'stages/stage29/29-02hb/**'
      - 'docs/arsenal/**'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "exact_head=$expected"

      - name: Assert current PR base lock
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.base.sha }}"
          python3 - "$expected" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1], (s['base_main_sha'],sys.argv[1])
          print('base_main_sha='+s['base_main_sha'])
          PY

      - name: Assert PR base and predecessor heads are ancestors
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || '125504622b46e462bd5fe8d7016f18d59717d696' }}"
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor d0f3de51b86cda9199a55e89757ae6887f572ea3 HEAD
          git merge-base --is-ancestor 2af6edb984e0c0a51e945f886939a09b442c3218 HEAD
          git merge-base --is-ancestor fd7b5d9dfef272bee2b6676797e6d12d8b07bde0 HEAD

      - name: Save current V17 state
        run: cp stages/stage36/MAIN-STATE.json /tmp/stage36-v17.json

      - name: Restore immutable 36-09A mathematical state
        run: git show d0f3de51b86cda9199a55e89757ae6887f572ea3:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json

      - name: Replay Stage36 bootstrap authority
        run: python3 stages/stage36/verify_stage36_bootstrap.py
      - name: Replay audited Stage36 36-01 authority
        run: python3 stages/stage36/verify_stage36_36_01.py
      - name: Replay audited Stage36 36-02 authority
        run: python3 stages/stage36/verify_stage36_36_02_audited.py
      - name: Replay audited Stage36 36-03 authority
        run: python3 stages/stage36/verify_stage36_36_03_audited.py
      - name: Replay audited Stage36 36-04 authority
        run: python3 stages/stage36/verify_stage36_36_04_audited.py
      - name: Replay audited Stage36 36-05 blocked authority
        run: python3 stages/stage36/verify_stage36_36_05_audited.py
      - name: Replay audited Stage36 36-09 breadth authority
        run: python3 stages/stage36/verify_stage36_36_09_audited.py
      - name: Replay immutable Stage36 36-09A mathematical preflight
        run: python3 stages/stage36/verify_stage36_36_09A.py

      - name: Restore exact V15 36-09A promotion state
        run: git show 2af6edb984e0c0a51e945f886939a09b442c3218:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 36-09A user-approved audited authority
        run: python3 stages/stage36/verify_stage36_36_09A_audited.py

      - name: Restore exact V16 36-09B mathematical state
        run: git show fd7b5d9dfef272bee2b6676797e6d12d8b07bde0:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 36-09B receiver-restricted branch preflight
        run: python3 stages/stage36/verify_stage36_36_09B.py

      - name: Restore current V17 state
        run: cp /tmp/stage36-v17.json stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 36-09B user-approved audited authority
        run: python3 stages/stage36/verify_stage36_36_09B_audited.py

      - name: Assert 36-09C authorized but unstarted
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V17_THIN_36_09B_AUDITED_USER_APPROVED'
          assert s['current']['unit']=='36-09C'
          assert s['current']['36_09C_entry_allowed'] is True
          assert s['cycle_ledger']['B2_SINGLE_PLACE_DIRECT_RECEIVER_OBSTRUCTION']=='LIVE'
          assert s['promotion_gates']['receiver_matched_replacement_theorem_proved'] is False
          assert s['promotion_gates']['R29_CAMP2_closed'] is False
          assert all(v is False for v in s['claims'].values())
          print('36-09B user-approved authority promoted; 36-09C authorized but unstarted')
          PY
