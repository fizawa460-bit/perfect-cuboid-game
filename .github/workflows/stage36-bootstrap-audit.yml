name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Assert audited Stage36 authority and reconciled AO payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_history']['36-09AM-AN']
          assert a['pr']==1679
          assert a['audited_head']=='12716259951f02589ecfaf6ac8f9670b7a23f06f'
          assert a['hostile_audit_review']==5127771308
          assert a['exact_head_ci']=='34076440104/101603376687'
          assert a['merged_main_sha']=='6b6c541d1a6bbe229381ac0400148bd17523ca06'
          ao=s['audited_history']['parallel-36-09AO']
          assert ao['hostile_audit_review']==5127677576
          assert ao['audited_head']=='f5db4fc0aafdc61f931b6499afb18c1966c1f99d'
          PY
          git merge-base --is-ancestor 6b6c541d1a6bbe229381ac0400148bd17523ca06 HEAD
          test "$(git rev-parse HEAD:stages/stage36/36-09AO/monsky-stage36-full2-class-adapter-preflight.json)" = "a26991cb071e086d3cbc36b8c9d2db329a14e5b1"
          test "$(git rev-parse HEAD:stages/stage36/36-09AO/monsky-full2-kernel-source-lock.md)" = "9f22dfe19d42d7104d30d219aac1cfd72a67c72a"

      - name: Replay exact 36-09AQ provisional parent
        shell: bash
        run: |
          set -euo pipefail
          H=62497175353167faf98af7bfae6b6c2b3b32d013
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AQ.py"
          git worktree remove --force "$tmp"
          test "$(git rev-parse "$H":stages/stage36/36-09AQ/odd-eta-plus-monsky-class-coordinate-adapter-preflight.json)" = "ac75db896e04664c50c26399b5f8af333e38cca1"
          test "$(git rev-parse "$H":stages/stage36/verify_stage36_36_09AQ.py)" = "235851de57165557d0aef4f59881561fe4e40c1a"

      - name: Verify current 36-09AR even Monsky adapter
        run: python3 stages/stage36/verify_stage36_36_09AR.py

      - name: Assert 36-09AR firewalls and 36-09AS unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V80_36_09AR_CANDIDATE'
          assert s['status']=='ACTIVE_BATCHING_SUBSTANTIVE_PR'
          ar=s['authority_frontier']['36-09AR']
          assert ar['EVEN_MONSKY_COORDINATE_ADAPTER'] is True
          assert ar['ALL_PARITY_MONSKY_COORDINATE_ADAPTER'] is True
          assert ar['EVEN_COMMON_FIRST_BLOCK_PSI_AB'] is True
          assert ar['MONSKY_KERNEL_MEMBERSHIP_UNIFORMLY_PROVED'] is False
          assert ar['TWO_GATE_CONVERSE'] is False
          assert ar['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert ar['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AS'
          assert s['current']['36_09AS_entry_allowed'] is True
          assert s['claims']['candidate_parameter_set_shrunk'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AR verified; all parity/sign Stage36 classes have exact Monsky coordinates; AS kernel-equation compression unlocked')
          PY
          git diff --check
