name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Verify audited DW correction remains valid
        run: python3 stages/stage36/verify_stage36_36_09DW_pairing_correction.py
      - name: Verify exact-green 36-09EB representatives
        run: python3 stages/stage36/verify_stage36_36_09EB.py
      - name: Verify exact-green 36-09EC factor Selmer and MW closure reduction
        run: python3 stages/stage36/verify_stage36_36_09EC.py
      - name: Verify exact-green 36-09ED dyadic MW saturation
        run: python3 stages/stage36/verify_stage36_36_09ED.py
      - name: Verify hostile-audited 36-09EE Q2 rho retained-open exclusion
        run: python3 stages/stage36/verify_stage36_36_09EE.py
      - name: Assert V242 hostile PASS consumed and EF unlocked
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          r=json.loads(Path('stages/stage36/36-09EE/hostile-audit-pass-receipt.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V242_36_09EE_HOSTILE_PASS_CONSUMED_EF_UNLOCKED'
          assert s['status']=='ACTIVE_MAIN_CONTINUATION'
          assert s['base_main_sha']=='733176600f99e91993d08c16aa98f09c08a1e726'
          assert r['audit']['review_id']==5149991589
          assert r['audit']['audited_exact_head']=='6ae4fde45a9665f7a81173e0790006722f9bb1da'
          assert r['merged_checkpoint']['merge_commit']=='4d7f50af95ffc00340d14ec9830f619273278a81'
          af=s['authority_frontier']['36-09EE'];ha=s['hostile_audit_checkpoint'];pg=s['promotion_gates'];cur=s['current']
          assert af['status']=='AUDITED_EXACT_GREEN_PASS_CONSUMED'
          assert af['external_hostile_review_id']==5149991589
          assert af['pass_consumption_replay_head']=='e7b0fb5d266652c5fda0c71a5987ef9c97af933e'
          assert af['pass_consumption_replay_ci']=='34315556514/102350902176'
          assert ha['result']=='PASS_CONSUMED'
          assert ha['promotion_pr']==1740
          assert ha['pass_consumed'] is True
          assert pg['36_09EE_pass_consumption_ci_passed'] is True
          assert pg['36_09EE_pass_consumed'] is True
          assert pg['36_09EF_entry_allowed'] is True
          assert cur['36_09EF_entry_allowed'] is True
          assert cur['hostile_audit_checkpoint_reached'] is False
          assert pg['BT_global_2primary_Brauer_set_empty'] is True
          assert pg['Brauer_Manin_obstruction_obtained'] is True
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09EE/hostile-audit-pass-receipt.json'],text=True).strip()=='91a047fbffd05ecac51236a94e9d7582347051e2'
          for key in ['fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          print('V242 verified on synchronized current main: hostile PASS 5149991589 is consumed; 36-09EF is unlocked strictly for the physical receiver adapter. Downstream credit remains closed.')
          PY
          git diff --check
