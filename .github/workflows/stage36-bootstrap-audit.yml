name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Verify audited 36-09DW dual-basis pairing correction
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DW_pairing_correction.py
      - name: Verify retained DZ arithmetic remains numerically valid
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DZ.py
      - name: Assert V232 promotion consumption and EB unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          c=json.loads(Path('stages/stage36/36-09DW/dual-basis-pairing-correction.json').read_text())
          r=json.loads(Path('stages/stage36/36-09DW/hostile-reaudit-pass-receipt.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V232_36_09DW_PAIRING_PASS_CONSUMED_EB_UNLOCKED'
          assert s['status']=='ACTIVE_MAIN_CONTINUATION'
          af=s['authority_frontier']['36-09DW-CORRECTION']; pc=s['post_audit_correction']; hc=s['hostile_audit_checkpoint']; cur=s['current']; pg=s['promotion_gates']
          assert af['status']=='AUDITED_EXACT_GREEN_CORRECTION'
          assert af['external_reaudit_review_id']==5149329866
          assert af['audited_exact_head']=='8bade5065ae9b727668163df284bb0c14886ac47'
          assert af['promotion_replay_head']=='594fdbdcdba8b1d4ed76a4325d25dadc27da22c3'
          assert af['promotion_replay_ci']=='34306570884/102324397624'
          assert pc['external_reaudit_passed'] is True
          assert pc['promotion_replay_passed'] is True
          assert pc['pass_receipt_blob_sha']=='3420b0b147cc04b5f430fb7b8d7810437a788879'
          assert hc['result']=='PASS_CONSUMED'
          assert hc['current_authority_valid_for_corrected_label_dependent_DW_DX_CLAIMS'] is True
          assert cur['next_owner']=='MAIN'
          assert cur['substantive_batch_pr_continues'] is True
          assert cur['36_09EB_entry_allowed'] is True
          assert pg['external_reaudit_after_DW_pairing_correction_passed'] is True
          assert pg['36_09DW_pairing_pass_promotion_replay_passed'] is True
          assert pg['36_09EB_entry_allowed'] is True
          assert pg['BT_Phi_Selmer_historical_labels_valid'] is False
          assert pg['BT_Phi_Selmer_corrected_labels_authority_valid'] is True
          assert c['corrected_global_Phi_Selmer']['all_classes']==[['[1]','[1]','[1]'],['[1]','[1]','[-1]'],['[1]','[2]','[6]'],['[1]','[2]','[-6]']]
          assert r['external_reaudit']['result']=='PASS'
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09DW/hostile-reaudit-pass-receipt.json'],text=True).strip()=='3420b0b147cc04b5f430fb7b8d7810437a788879'
          for key in ['BT_retained_open_curve_proSelmer_intersection_computed','BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          print('V232 verified: PR1736 hostile PASS is consumed by V231 exact-green promotion replay; corrected Phi labels are authority-valid, historical labels remain revoked, and EB is unlocked only for explicit rational quotient representatives/local translations.')
          PY
          git diff --check
