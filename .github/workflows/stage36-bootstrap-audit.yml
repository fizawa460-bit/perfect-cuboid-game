name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Verify exact-green 36-09DY parent
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DY.py
      - name: Verify exact-green 36-09DZ MW quotient
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DZ.py
      - name: Assert V226 DZ promotion and EA unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          dz=json.loads(Path('stages/stage36/36-09DZ/fixed-p2-mw-phi-quotient-preflight.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V226_36_09DZ_EXACT_GREEN_EA_UNLOCKED'
          assert s['status']=='ACTIVE_MAIN_CONTINUATION'
          af=s['authority_frontier']['36-09DZ']; cur=s['current']; pg=s['promotion_gates']
          assert af['status']=='EXACT_GREEN_PARENT'
          assert af['certificate_blob_sha']=='5fb697e6d450ab46adde1a4a40cde9c415e4cd90'
          assert af['source_blob_sha']=='4ff753f9933f56cd33accaac264ddc7e936d2364'
          assert af['verifier_blob_sha']=='c7a8edc23e7d1f3438ec658fd7d23c8b79587dad'
          assert af['exact_head']=='39318eca6bb0c902c2c459cf3513dd02c2fda648'
          assert af['exact_head_ci']=='34301812471/102310102509'
          assert dz['Mordell_Weil_rank']['common_rank_exact']==1
          assert dz['exact_proSelmer_defect']['Phi_cokernel_F2_dimension']==2
          assert dz['exact_proSelmer_defect']['Psi_cokernel_F2_dimension']==5
          assert cur['unit']=='36-09DZ'
          assert cur['next_exact_leaf']=='36-09EA_FIXED_P2_DEFECT_AWARE_RETAINED_OPEN_INTERSECTION_PREFLIGHT'
          assert cur['next_owner']=='MAIN'
          assert cur['36_09EA_entry_allowed'] is True
          assert pg['36_09DZ_exact_head_ci_passed'] is True
          assert pg['36_09DZ_promotion_replay_passed'] is True
          assert pg['36_09EA_entry_allowed'] is True
          assert pg['BT_common_MW_rank_exact']==1
          assert pg['BT_Phi_proSelmer_cokernel_F2_dimension']==2
          assert pg['BT_Psi_proSelmer_cokernel_F2_dimension']==5
          for key in ['BT_proSelmer_product_identification_obtained','BT_T2Sel_computed','BT_retained_open_curve_proSelmer_intersection_computed','BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09DZ/fixed-p2-mw-phi-quotient-preflight.json'],text=True).strip()=='5fb697e6d450ab46adde1a4a40cde9c415e4cd90'
          assert subprocess.check_output(['git','hash-object','stages/stage36/verify_stage36_36_09DZ.py'],text=True).strip()=='c7a8edc23e7d1f3438ec658fd7d23c8b79587dad'
          subprocess.check_call(['git','cat-file','-e','39318eca6bb0c902c2c459cf3513dd02c2fda648^{commit}'])
          print('V226 verified: DZ exact-head CI is consumed. Common MW rank=1, finite isogeny Sha kernels vanish, and exact Phi/Psi pro-Selmer cokernel dimensions are 2/5. EA is unlocked for the defect-aware retained-open intersection only.')
          PY
          git diff --check
