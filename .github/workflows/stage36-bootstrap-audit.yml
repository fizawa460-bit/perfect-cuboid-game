name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/cards/workflows/LIT-WF02.md'
      - 'docs/arsenal/lit-wf02-global-h1-localization-reciprocity-contract.json'
      - 'docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09CL audited mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=76603296ade67b2544aaaa16559358f2a2793272
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CL.py"
          git worktree remove --force "$tmp"
      - name: Replay immutable 36-09CM exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=f5b270da04815e6339cd8795d0ddf58ce34138ca
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CM.py"
          git worktree remove --force "$tmp"
      - name: Replay immutable 36-09CN exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=6b31ca804744c4d8726d3d74861faadee78e0d64
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CN.py"
          git worktree remove --force "$tmp"
      - name: Verify current 36-09CO required-place rule
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09CO.py
      - name: Assert CO firewalls and CP lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V139_36_09CO_REQUIRED_PLACE_RULE'
          cn=s['authority_frontier']['36-09CN']
          assert cn['exact_head']=='6b31ca804744c4d8726d3d74861faadee78e0d64'
          assert cn['exact_head_ci']=='34180629566/101918846959'
          co=s['authority_frontier']['36-09CO']
          assert co['certificate_blob_sha']=='e41bfad47046ff47074285f2c6f719d9125b12a1'
          assert co['verifier_blob_sha']=='7102c81b0af5530ee0462fb23ddce66f2b5c7f2e'
          assert co['CONDITIONAL_SERRE_REQUIRED_PLACE_RULE_COMPLETE'] is True
          assert co['STAGE36_REQUIRED_PLACE_INVENTORY_COMPLETE'] is False
          assert co['FIXED_DUAL_OR_EVALUATION_FAMILY_AVAILABLE'] is False
          assert co['MILNE_LOCAL_CONDITION_SYSTEM_AVAILABLE'] is False
          assert co['LIT_WF02_APPLICABILITY_PASS'] is False
          cur=s['current']
          assert cur['unit']=='36-09CO'
          assert cur['next_exact_leaf']=='36-09CP_FIXED_DUAL_PAIRING_OR_LOCAL_CONDITION_SYSTEM_PREFLIGHT'
          assert cur['36_09CP_entry_allowed'] is False
          assert cur['hostile_audit_checkpoint_reached'] is False
          pg=s['promotion_gates']
          assert pg['36_09CN_exact_head_ci_passed'] is True
          assert pg['36_09CO_exact_head_ci_passed'] is False
          assert pg['36_09CP_unlocked'] is False
          assert pg['conditional_Serre_required_place_rule_complete'] is True
          assert pg['Stage36_required_place_inventory_complete'] is False
          assert pg['fixed_dual_or_evaluation_family_available'] is False
          assert pg['Milne_local_condition_system_available'] is False
          assert pg['LIT_WF02_applicability_pass'] is False
          assert pg['new_global_obstruction_obtained'] is False
          for key in ['fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          print('36-09CO candidate verified; conditional Serre place rule is available but Stage36 dual/local-condition input is still missing. CP stays locked until exact-green CO.')
          PY
          git diff --check
