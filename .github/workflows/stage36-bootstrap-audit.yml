name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DX finite Phi-Selmer evidence
        shell: bash
        run: |
          set -euo pipefail
          H=6232e765ffc2f40599a0125dac8a99f303a63e7e
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DX.py"
          git worktree remove --force "$tmp"
      - name: Verify audited DS correction remains valid
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DS_correction.py
      - name: Verify 36-09DY finite-to-proSelmer defect
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DY.py
      - name: Assert V223 provisional DY checkpoint and DZ relock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          dy=json.loads(Path('stages/stage36/36-09DY/fixed-p2-phi-to-proselmer-defect-preflight.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V223_36_09DY_PROVISIONAL_EXACT_GREEN'
          assert s['status']=='PROVISIONAL_EXACT_GREEN_PENDING_CI'
          af=s['authority_frontier']['36-09DY']; cur=s['current']; pg=s['promotion_gates']
          assert af['status']=='PROVISIONAL_EXACT_GREEN_PENDING_CI'
          assert af['certificate_blob_sha']=='3adcab8e00fa8a517df28ce71b95925f6e00ada6'
          assert af['source_blob_sha']=='cea6737bcf9dfe242f7c3e3b2475377b2f39e481'
          assert af['verifier_blob_sha']=='39173498249965f010fb40769131bd6f3618e484'
          assert dy['finite_Psi_Selmer']['F2_dimension']==5
          assert dy['finite_Psi_Selmer']['cardinality']==32
          assert dy['proSelmer_kernels']['Phi_kernel_F2_dimension']==3
          assert dy['proSelmer_kernels']['Psi_kernel_F2_dimension']==3
          assert dy['Mordell_Weil_quotient_constraints']['common_Mordell_Weil_rank_options']==[0,1]
          assert dy['proSelmer_cokernel_constraints']['Phi_cokernel_F2_dimension_options']==[1,2]
          assert dy['proSelmer_cokernel_constraints']['Psi_cokernel_F2_dimension_options']==[4,5]
          assert cur['unit']=='36-09DY'
          assert cur['next_exact_leaf']=='36-09DZ_FIXED_P2_MORDELL_WEIL_PHI_QUOTIENT_PREFLIGHT'
          assert cur['next_owner']=='MAIN_PROMOTION_REPLAY'
          assert cur['36_09DZ_entry_allowed'] is False
          assert pg['36_09DY_certificate_complete'] is True
          assert pg['36_09DY_exact_head_ci_passed'] is False
          assert pg['36_09DZ_entry_allowed'] is False
          assert pg['BT_proSelmer_kernel_dimensions_computed'] is True
          assert pg['BT_Phi_proSelmer_kernel_F2_dimension']==3
          assert pg['BT_Psi_proSelmer_kernel_F2_dimension']==3
          assert pg['BT_Psi_Selmer_F2_dimension']==5
          assert pg['BT_Psi_Selmer_cardinality']==32
          assert pg['BT_common_MW_rank_upper_bound']==1
          assert pg['BT_Phi_proSelmer_cokernel_exact_dimension_computed'] is False
          assert pg['BT_Psi_proSelmer_cokernel_exact_dimension_computed'] is False
          for key in ['BT_proSelmer_product_identification_obtained','BT_T2Sel_computed','BT_retained_open_curve_proSelmer_intersection_computed','BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09DY/fixed-p2-phi-to-proselmer-defect-preflight.json'],text=True).strip()=='3adcab8e00fa8a517df28ce71b95925f6e00ada6'
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09DY/phi-to-proselmer-defect-source-lock.md'],text=True).strip()=='cea6737bcf9dfe242f7c3e3b2475377b2f39e481'
          assert subprocess.check_output(['git','hash-object','stages/stage36/verify_stage36_36_09DY.py'],text=True).strip()=='39173498249965f010fb40769131bd6f3618e484'
          print('V223 verified: DY independently reconstructs dual Sel^Psi=F2^5, exact pro-Selmer kernels F2^3, rank<=1, and a one-bit Phi cokernel ambiguity. DZ remains locked until this exact head is green and consumed by promotion replay.')
          PY
          git diff --check
