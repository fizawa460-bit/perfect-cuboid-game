name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DR exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=ffff741cc96fb9d3125013e0d02e69410a434175
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DR.py"
          git worktree remove --force "$tmp"
      - name: Assert V201 DR exact-green parent and DS unlock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V201_36_09DR_EXACT_GREEN_DS_UNLOCK_PENDING_PROMOTION_REPLAY'
          dr=s['authority_frontier']['36-09DR']
          assert dr['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert dr['certificate_blob_sha']=='c212f0430fb5b4d04ee0887e303a73fb303657c8'
          assert dr['verifier_blob_sha']=='1331530aa261bffb9d3fd2c605ae25d494fb507a'
          assert dr['source_blob_sha']=='e546e1a731dfd6b270641eb1adb026847f8b838e'
          assert dr['exact_head']=='ffff741cc96fb9d3125013e0d02e69410a434175'
          assert dr['exact_head_ci']=='34234332852/102088050237'
          cur=s['current']; pg=s['promotion_gates']
          assert cur['unit']=='36-09DR'
          assert cur['36_09DS_entry_allowed'] is True
          assert pg['36_09DR_exact_head_ci_passed'] is True
          assert pg['36_09DR_promotion_replay_passed'] is False
          assert pg['36_09DS_entry_allowed'] is True
          assert pg['BT_Jacobian_Q_V4_elliptic_quotient_isogeny_constructed'] is True
          assert pg['BT_proSelmer_product_identification_obtained'] is False
          assert pg['BT_isogeny_2primary_kernel_cokernel_computed'] is False
          for key in ['BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          print('36-09DR immutable exact-green evidence replayed; 36-09DS is unlocked for 2-primary isogeny transport only. No downstream credit is granted.')
          PY
          git diff --check
