name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DW exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=70762720e965e97c0442777b00a1794f906821e8
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DW.py"
          git worktree remove --force "$tmp"
      - name: Assert V211 DW exact-green parent and DX unlock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V211_36_09DW_EXACT_GREEN_DX_UNLOCK_PENDING_PROMOTION_REPLAY'
          dw=s['authority_frontier']['36-09DW']; cur=s['current']; pg=s['promotion_gates']
          assert dw['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert dw['certificate_blob_sha']=='ffa5d8ee9fceed3cfcfc05ce029538557a803ac7'
          assert dw['verifier_blob_sha']=='adb18732d6e5efa03e1a240a719aba9c6c25c505'
          assert dw['source_blob_sha']=='08c91eed30774fa5c44509bb61f1c3b1386f2266'
          assert dw['exact_head']=='70762720e965e97c0442777b00a1794f906821e8'
          assert dw['exact_head_ci']=='34266118614/102195801165'
          assert cur['unit']=='36-09DW'
          assert cur['36_09DX_entry_allowed'] is True
          assert pg['36_09DW_exact_head_ci_passed'] is True
          assert pg['36_09DW_promotion_replay_passed'] is False
          assert pg['36_09DX_entry_allowed'] is True
          assert pg['BT_Phi_five_local_images_computed'] is True
          assert pg['BT_global_Phi_Selmer_group_computed'] is False
          for key in ['BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          print('36-09DW immutable exact-green evidence replayed; 36-09DX is unlocked for the global 32768-class intersection only. No downstream credit is granted.')
          PY
          git diff --check
