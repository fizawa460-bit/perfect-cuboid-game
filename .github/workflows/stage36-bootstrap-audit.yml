name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DE exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=b857167b4652cec6b5d149a3509c465c862b7b0e
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DE.py"
          git worktree remove --force "$tmp"
      - name: Verify 36-09DF p2 adelic solubility and complement boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DF.py
      - name: Assert DF checkpoint and DG lock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V174_36_09DF_ADELIC_SOLUBILITY_PRIVATE_BM_NO_GO'
          df=s['authority_frontier']['36-09DF']
          assert df['status']=='PROVISIONAL_PENDING_EXACT_HEAD_CI'
          assert df['certificate_blob_sha']=='e2ad1a187dc607b558288a6cad91272c021dd493'
          assert df['verifier_blob_sha']=='44dbc5518fd7615294438b9918506d1febaae580'
          assert df['P2_RETAINED_OPEN_ADELIC_SOLUBILITY_PROVED'] is True
          assert df['P2_LOCAL_OBSTRUCTION_EXCLUDED'] is True
          assert df['PRIVATE_INFINITE_SUBGROUP_BM_SET_NONEMPTY'] is True
          assert df['FULL_CREUTZ_VIRAY_EXPLICIT_IMAGE_COMPUTED'] is False
          assert df['FULL_BRAUER_GROUP_COMPUTED'] is False
          cur=s['current']
          assert cur['unit']=='36-09DF'
          assert cur['next_exact_leaf']=='36-09DG_FIXED_P2_NONRATIONAL_QI_BRAUER_COMPLEMENT_PREFLIGHT'
          assert cur['36_09DG_entry_allowed'] is False
          pg=s['promotion_gates']
          assert pg['36_09DF_certificate_complete'] is True
          assert pg['36_09DF_exact_head_ci_passed'] is False
          assert pg['36_09DG_entry_allowed'] is False
          assert pg['BT_p2_retained_open_adelic_solubility_proved'] is True
          assert pg['BT_p2_local_obstruction_excluded'] is True
          assert pg['BT_private_infinite_subgroup_BM_set_nonempty'] is True
          assert pg['BT_full_Creutz_Viray_explicit_image_computed'] is False
          assert pg['BT_full_relevant_Brauer_group_computed'] is False
          for key in ['Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          print('36-09DF provisional checkpoint verified: p2 retained-open adelic solubility and private-subgroup BM-set nonemptiness obtained; DG locked pending exact-head CI.')
          PY
          git diff --check
