name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DS exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=7cad044d63dace9140c7527390358e19b794298d
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DS.py"
          git worktree remove --force "$tmp"
      - name: Verify 36-09DT explicit constant V4-isogeny kernel
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DT.py
      - name: Assert V204 DT provisional firewalls and DU lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V204_36_09DT_CONSTANT_KERNEL_PENDING_EXACT_HEAD_CI'
          dt=s['authority_frontier']['36-09DT']
          assert dt['status']=='PROVISIONAL_PENDING_EXACT_HEAD_CI'
          assert dt['certificate_blob_sha']=='362326de8d6ecc0b415ecf29c6eb936134e395ce'
          assert dt['verifier_blob_sha']=='7b0f62e25a16bfffe569f6df2e940771c40a8631'
          assert dt['source_blob_sha']=='df701b11135d43cd2baaa1c59eb9c289d3abfb72'
          cur=s['current']; pg=s['promotion_gates']
          assert cur['unit']=='36-09DT'
          assert cur['36_09DT_entry_allowed'] is True
          assert cur['36_09DU_entry_allowed'] is False
          assert pg['36_09DS_exact_head_ci_passed'] is True
          assert pg['36_09DS_promotion_replay_passed'] is True
          assert pg['36_09DT_certificate_complete'] is True
          assert pg['36_09DT_exact_head_ci_passed'] is False
          assert pg['36_09DU_entry_allowed'] is False
          assert pg['BT_V4_isogeny_kernel_rational_structure_computed'] is False
          assert pg['BT_V4_isogeny_kernel_constant_Z2_cubed'] is False
          assert pg['BT_dual_isogeny_kernel_split_mu2_cubed'] is False
          assert pg['BT_Phi_Selmer_local_condition_map_computed'] is False
          assert pg['BT_proSelmer_cokernel_size_computed'] is False
          assert pg['BT_proSelmer_product_identification_obtained'] is False
          for key in ['BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          print('36-09DT provisional verifier passed; constant-kernel candidate awaits exact-head CI and DU remains locked. No downstream credit is granted.')
          PY
          git diff --check
