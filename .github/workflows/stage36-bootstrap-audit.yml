name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'stages/stage29/29-16/active-kernel-ledger.json'
      - 'stages/stage29/29-06/endpoint-hub-graph.json'
      - 'stages/stage29/29-02f/**'
      - 'stages/stage29/29-02ha/**'
      - 'stages/stage29/29-02hb/**'
      - 'docs/arsenal/**'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "exact_head=$expected"

      - name: Assert current PR base lock
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.base.sha }}"
          python3 - "$expected" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1], (s['base_main_sha'],sys.argv[1])
          print('base_main_sha='+s['base_main_sha'])
          PY

      - name: Assert PR base and immutable predecessor heads are ancestors
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || '98764e37e408866386ef41cc526d830a6092462b' }}"
          for x in "$base" d0f3de51b86cda9199a55e89757ae6887f572ea3 2af6edb984e0c0a51e945f886939a09b442c3218 fd7b5d9dfef272bee2b6676797e6d12d8b07bde0 1d29735f3f50c6918a32b2542de8364b86568396 ac5a7c81d3f268bebbc2a9de8e658b23c97d5649 6e0c40eeb7a533b47aba0d224c34e85822db373c f22d67dda4183c3bfd39710ebb4083f5185f3f49 631d773a0f341954507eacf303f0c5f7cbdc836a 51efa8394c45bc60a4b482c4f6f94f7826eb9d20; do
            git merge-base --is-ancestor "$x" HEAD
          done

      - name: Save current V23 state
        run: cp stages/stage36/MAIN-STATE.json /tmp/stage36-v23.json

      - name: Restore immutable 36-09A mathematical state
        run: git show d0f3de51b86cda9199a55e89757ae6887f572ea3:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 bootstrap authority
        run: python3 stages/stage36/verify_stage36_bootstrap.py
      - name: Replay audited Stage36 36-01 authority
        run: python3 stages/stage36/verify_stage36_36_01.py
      - name: Replay audited Stage36 36-02 authority
        run: python3 stages/stage36/verify_stage36_36_02_audited.py
      - name: Replay audited Stage36 36-03 authority
        run: python3 stages/stage36/verify_stage36_36_03_audited.py
      - name: Replay audited Stage36 36-04 authority
        run: python3 stages/stage36/verify_stage36_36_04_audited.py
      - name: Replay audited Stage36 36-05 blocked authority
        run: python3 stages/stage36/verify_stage36_36_05_audited.py
      - name: Replay audited Stage36 36-09 breadth authority
        run: python3 stages/stage36/verify_stage36_36_09_audited.py
      - name: Replay immutable Stage36 36-09A mathematical preflight
        run: python3 stages/stage36/verify_stage36_36_09A.py

      - name: Restore exact V15 36-09A promotion state
        run: git show 2af6edb984e0c0a51e945f886939a09b442c3218:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 36-09A user-approved audited authority
        run: python3 stages/stage36/verify_stage36_36_09A_audited.py

      - name: Restore exact V16 36-09B mathematical state
        run: git show fd7b5d9dfef272bee2b6676797e6d12d8b07bde0:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 36-09B receiver-restricted branch preflight
        run: python3 stages/stage36/verify_stage36_36_09B.py

      - name: Restore exact V17 36-09B promotion state
        run: git show 1d29735f3f50c6918a32b2542de8364b86568396:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 36-09B user-approved audited authority
        run: python3 stages/stage36/verify_stage36_36_09B_audited.py

      - name: Restore exact V18 36-09C mathematical state
        run: git show ac5a7c81d3f268bebbc2a9de8e658b23c97d5649:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 36-09C all-place local-solubility preflight
        run: python3 stages/stage36/verify_stage36_36_09C.py

      - name: Restore exact V19 36-09C promotion state
        run: git show 6e0c40eeb7a533b47aba0d224c34e85822db373c:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 36-09C hostile-audited authority
        run: python3 stages/stage36/verify_stage36_36_09C_audited.py

      - name: Restore exact V20 36-09D mathematical state
        run: git show f22d67dda4183c3bfd39710ebb4083f5185f3f49:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 36-09D Q-defined pencil fibration preflight
        run: python3 stages/stage36/verify_stage36_36_09D.py

      - name: Restore exact V21 36-09D promotion state
        run: git show 631d773a0f341954507eacf303f0c5f7cbdc836a:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 36-09D hostile-audited successor authority
        run: python3 stages/stage36/verify_stage36_36_09D_audited.py

      - name: Restore exact V22 36-09E mathematical state
        run: git show 51efa8394c45bc60a4b482c4f6f94f7826eb9d20:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 36-09E character elliptic quotient arithmetic preflight
        run: python3 stages/stage36/verify_stage36_36_09E.py

      - name: Restore current V23 state
        run: cp /tmp/stage36-v23.json stages/stage36/MAIN-STATE.json
      - name: Replay Stage36 36-09E hostile-audited successor authority
        run: python3 stages/stage36/verify_stage36_36_09E_audited.py

      - name: Assert 36-09F ready-unstarted boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V23_THIN_36_09E_AUDITED'
          assert s['status']=='ACTIVE'
          a=s['authority_frontier']['36-09E']
          assert a['promotion_status']=='HOSTILE_AUDIT_PASS'
          assert a['hostile_audit_review']==5120645782
          assert a['audited_head']=='51efa8394c45bc60a4b482c4f6f94f7826eb9d20'
          assert a['certificate_blob_sha']=='081b704fecaa3bd39e6a523ee7beaefe706683f4'
          assert a['PHYSICAL_T1_ELIMINATED'] is True
          assert a['NINE_TO_FOUR_LEGENDRE_TWIST_COLLAPSE'] is True
          assert a['S34_W03_APPLICABILITY_MATCHED'] is True
          assert a['S34_W03_INTERSECTION_EXCLUSION_EXECUTED'] is False
          assert s['current']['unit']=='36-09F'
          assert s['current']['next_exact_leaf']=='36-09F_PAIRED_LEGENDRE_RECEIVER_INTERSECTION_PREFLIGHT'
          assert s['current']['36_09F_entry_allowed'] is True
          assert s['promotion_gates']['paired_legendre_receiver_intersection_empty_proved'] is False
          assert s['promotion_gates']['R29_CAMP2_closed'] is False
          assert all(v is False for v in s['claims'].values())
          print('36-09E hostile-audited authority frozen; 36-09F ready-unstarted')
          PY
