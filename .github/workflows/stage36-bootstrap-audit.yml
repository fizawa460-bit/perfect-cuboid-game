name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Assert hostile-audited and merged PR1677 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_batch_promotion']
          assert a['candidate_pr']==1677
          assert a['audited_head']=='56f815b9bc25ca91a2ba6e0c0291664bfeac733d'
          assert a['hostile_audit_review']==5127436589
          assert a['exact_head_ci']=='34074355295/101597480228'
          assert a['merged_main_sha']=='58e81a647b63bcea17ab396409c2813b667f45e2'
          PY
          git merge-base --is-ancestor 58e81a647b63bcea17ab396409c2813b667f45e2 HEAD

      - name: Replay exact hostile-audited 36-09AL checkpoint
        shell: bash
        run: |
          set -euo pipefail
          H=56f815b9bc25ca91a2ba6e0c0291664bfeac733d
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AL.py"
          git worktree remove --force "$tmp"

      - name: Verify current 36-09AM uniform rank-zero Tunnell/Sha2 sieve
        run: python3 stages/stage36/verify_stage36_36_09AM.py

      - name: Assert 36-09AM firewalls and 36-09AN unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V75_36_09AM_CANDIDATE'
          assert s['status']=='ACTIVE_BATCHING_SUBSTANTIVE_PR'
          am=s['authority_frontier']['36-09AM']
          assert am['UNIFORM_RANKZERO_TUNNELL_FAIL_CLASSIFIER'] is True
          assert am['TORSION_SHAPED_EXCEPTION_SECTOR_COUNT']==4
          assert am['OUTSIDE_SECTORS_ELS_TUNNELL_FAIL_IMPLIES_NONTRIVIAL_SHA2'] is True
          assert am['TUNNELL_EQUALITY_SIDE_CLASSIFIED'] is False
          assert am['TORSION_SECTOR_RETAINED_OPEN_CLASSIFIED'] is False
          assert am['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert am['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AN'
          assert s['current']['36_09AN_entry_allowed'] is True
          assert s['promotion_gates']['36_09AL_hostile_audit_passed'] is True
          assert s['promotion_gates']['36_09AL_promoted_to_main'] is True
          assert s['claims']['candidate_parameter_set_shrunk'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AM uniform rank-zero sieve verified on merged PR1677 authority; exactly four torsion-shaped sectors remain on conditional Tunnell-fail ELS side; 36-09AN unlocked')
          PY
          git diff --check
