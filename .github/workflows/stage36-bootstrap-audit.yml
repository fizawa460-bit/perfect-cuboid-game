name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Replay exact 36-09U batch parent
        shell: bash
        run: |
          set -euo pipefail
          U_HEAD=dfbd0ddff789b9e1a6f3b8033e553fd3d7bd56b4
          git merge-base --is-ancestor "$U_HEAD" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$U_HEAD"
          python3 "$tmp/stages/stage36/verify_stage36_36_09U.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09V batch parent
        shell: bash
        run: |
          set -euo pipefail
          V_HEAD=117cdb991a29706b7b9e79485c5b9f19a6f09552
          git merge-base --is-ancestor "$V_HEAD" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$V_HEAD"
          python3 "$tmp/stages/stage36/verify_stage36_36_09V.py"
          git worktree remove --force "$tmp"

      - name: Verify current batched 36-09W
        run: python3 stages/stage36/verify_stage36_36_09W.py

      - name: Assert 36-09W firewalls and 36-09X unlock
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V57_36_09W_BATCHED'
          assert s['status']=='ACTIVE_BATCHING_SUBSTANTIVE_PR'
          W=s['authority_frontier']['36-09W']
          assert W['PARAMETER_HILBERT_TABLE_EXACT'] is True
          assert W['GLOBAL_PARAMETER_CHECKSUM_EXACT'] is True
          assert W['PARAMETER_ONLY_RECIPROCITY_BLOCKED'] is True
          assert W['DIRECTION_INTERNAL_LEGENDRE_FREEDOM'] is True
          assert W['DIRECTION_ONLY_RECIPROCITY_BLOCKED'] is True
          assert W['KUMMER_COUPLED_B11_REMAINS_LIVE'] is True
          assert W['MULTIPLACE_RECIPROCITY_OBSTRUCTION_PROVED'] is False
          assert W['CANDIDATE_SET_SHRUNK'] is False
          assert W['QI_RANKJUMP_LOCUS_EMPTY'] is False
          assert W['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09X'
          assert s['current']['36_09X_entry_allowed'] is True
          assert s['current']['hostile_audit_checkpoint_reached'] is False
          assert s['promotion_gates']['36_09W_hostile_audit_passed'] is False
          assert s['promotion_gates']['multiplace_reciprocity_obstruction_proved'] is False
          assert s['promotion_gates']['Kummer_class_coupled_Hilbert_obstruction_proved'] is False
          assert s['claims']['candidate_set_shrunk'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09W exact parameter Hilbert checksum verified; coarse reciprocity blocked; Kummer-coupled B11 remains live; 36-09X unlocked; hostile audit deferred')
          PY
