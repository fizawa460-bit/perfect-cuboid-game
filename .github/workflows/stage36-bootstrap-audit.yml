name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Replay exact hostile-audited U-AA promotion checkpoint
        shell: bash
        run: |
          set -euo pipefail
          H=d5c212d9be970dc31a28d50db926f4cfac34c561
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AA_audited.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09AB candidate parent
        shell: bash
        run: |
          set -euo pipefail
          H=f729993d52a441632b3566c5d08b06c2672d4ae6
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AB.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09AC candidate parent
        shell: bash
        run: |
          set -euo pipefail
          H=c86501ad978ba9395d06f59722fc60c04c632231
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AC.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09AD candidate parent
        shell: bash
        run: |
          set -euo pipefail
          H=ebb280e5f1c56372fa3494799506d2242ff2ec31
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AD.py"
          git worktree remove --force "$tmp"

      - name: Verify current 36-09AE Jacobi coupling
        run: python3 stages/stage36/verify_stage36_36_09AE.py

      - name: Assert 36-09AE firewalls and 36-09AF unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V66_36_09AE_CANDIDATE'
          assert s['status']=='ACTIVE_BATCHING_SUBSTANTIVE_PR'
          ae=s['authority_frontier']['36-09AE']
          assert ae['JACOBI_ROW_COUNT']==8
          assert ae['PAIR_SYMBOL_MATRIX_RANK']==5
          assert ae['RECIPROCITY_CONSISTENCY_RELATIONS']==3
          assert ae['MOD8_SKELETON_NAIVE']==512
          assert ae['MOD8_SKELETON_SURVIVORS']==128
          assert ae['BRANCH_RESIDUE_SKELETON_SHRUNK'] is True
          assert ae['PAIR_SYMBOL_REALIZABILITY_PROVED'] is False
          assert ae['FINITE_Q_SQUARECLASS_FAMILY'] is False
          assert ae['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert ae['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AF'
          assert s['current']['36_09AF_entry_allowed'] is True
          assert s['promotion_gates']['36_09AE_hostile_audit_passed'] is False
          assert s['claims']['candidate_parameter_set_shrunk'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AE Jacobi coupling verified; 512-to-128 residue skeleton pruning exact; actual variable-prime squareclasses unresolved; 36-09AF unlocked')
          PY
          git diff --check
