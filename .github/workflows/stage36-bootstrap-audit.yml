name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Assert hostile-audited PR1677 authority promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_batch_promotion']
          assert a['candidate_pr']==1677
          assert a['audited_head']=='56f815b9bc25ca91a2ba6e0c0291664bfeac733d'
          assert a['hostile_audit_review']==5127436589
          assert a['exact_head_ci']=='34074355295/101597480228'
          assert a['merged_main_sha']=='58e81a647b63bcea17ab396409c2813b667f45e2'
          PY
          git merge-base --is-ancestor 58e81a647b63bcea17ab396409c2813b667f45e2 HEAD

      - name: Replay exact hostile-audited 36-09AL head
        shell: bash
        run: |
          set -euo pipefail
          H=56f815b9bc25ca91a2ba6e0c0291664bfeac733d
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AL.py"
          git worktree remove --force "$tmp"

      - name: Replay exact 36-09AN candidate parent
        shell: bash
        run: |
          set -euo pipefail
          H=8ade3e831595143280cee1bf39fb94205075e2cd
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AN.py"
          git worktree remove --force "$tmp"

      - name: Verify current 36-09AO Monsky full-2 class adapter
        run: python3 stages/stage36/verify_stage36_36_09AO.py

      - name: Assert 36-09AO firewalls and hostile-audit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V77_36_09AO_BATCH_AUDIT_CHECKPOINT'
          assert s['status']=='ACTIVE_BATCH_HOSTILE_AUDIT_CHECKPOINT'
          ao=s['authority_frontier']['36-09AO']
          assert ao['MONSKY_MATRIX_CONSTRUCTION_ADAPTED'] is True
          assert ao['ODD_STAGE36_CLASS_COORDINATE_ADAPTER_EXECUTED'] is True
          assert ao['EVEN_STAGE36_CLASS_EXAMPLE_ADAPTED'] is False
          assert ao['B7_KERNEL_VECTOR']==[0,0,1,1,1,0,1,0]
          assert ao['B7_MONSKY_RANK']==6
          assert ao['B7_MONSKY_NULLITY']==2
          assert ao['B7_SHA2_DIMENSION']==2
          assert ao['UNIFORM_MW_VS_SHA_CLASSIFIED'] is False
          assert ao['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert ao['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AO-AUDIT-CHECKPOINT'
          assert s['current']['next_owner']=='HOSTILE_AUDIT'
          assert s['current']['hostile_audit_checkpoint_reached'] is True
          assert s['current']['36_09AP_entry_allowed'] is False
          assert s['claims']['candidate_parameter_set_shrunk'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AO actual-prime Monsky/full2 kernel adapter verified; B7 nullity/Sha2 dimension 2 fixed-fiber result; uniform family remains open; AM-AO hostile-audit checkpoint reached; AP locked')
          PY
          git diff --check
