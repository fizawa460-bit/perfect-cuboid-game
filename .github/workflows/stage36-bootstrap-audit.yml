name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact head and current-main integration lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path('stages/stage36/36-09FE/current-main-integration.json').read_text())
          assert r['current_main_integration']['parent_main_sha']==sys.argv[1]
          assert r['current_main_integration']['post_ER_scope_requires_fresh_hostile_audit'] is True
          assert r['current_main_integration']['current_integration_hostile_audit_pass'] is False
          assert r['current_main_integration']['merge_authorized'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay Stage36 retained exact chain through FE
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            verify_stage36_36_09DW_pairing_correction.py
            verify_stage36_36_09EB.py verify_stage36_36_09EC.py verify_stage36_36_09ED.py
            verify_stage36_36_09EE.py verify_stage36_36_09EF.py
            verify_stage36_36_09EG.py verify_stage36_36_09EH.py verify_stage36_36_09EI.py
            verify_stage36_36_09EJ.py verify_stage36_36_09EK.py verify_stage36_36_09EL.py
            verify_stage36_36_09EM.py verify_stage36_36_09EN.py verify_stage36_36_09EO.py
            verify_stage36_36_09EP.py verify_stage36_36_09EQ.py verify_stage36_36_09ER.py
            verify_stage36_36_09ES.py verify_stage36_36_09ET.py verify_stage36_36_09EU.py
            verify_stage36_36_09EV.py verify_stage36_36_09EW.py verify_stage36_36_09EX.py
            verify_stage36_36_09EY.py verify_stage36_36_09EZ.py verify_stage36_36_09FA.py
            verify_stage36_36_09FB.py verify_stage36_36_09FC.py verify_stage36_36_09FD.py
            verify_stage36_36_09FE.py
          )
          for t in "${tests[@]}"; do
            echo "=== $t ==="
            python3 "stages/stage36/$t"
          done
      - name: Verify V296 FE current-main integration boundary
        run: python3 stages/stage36/verify_stage36_36_09FE_current_main_integration.py
      - name: Repository whitespace check
        run: git diff --check
