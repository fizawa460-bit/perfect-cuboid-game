name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/cards/workflows/LIT-WF02.md'
      - 'docs/arsenal/lit-wf02-global-h1-localization-reciprocity-contract.json'
      - 'docs/arsenal/verify_lit_wf02_global_h1_localization_reciprocity.py'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09CL audited mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=76603296ade67b2544aaaa16559358f2a2793272
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CL.py"
          git worktree remove --force "$tmp"
      - name: Assert 1705 audit consumption and CM unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V135_36_09CL_AUDIT_PASS_CM_UNLOCK'
          h=s['audited_history']['36-09CI-CL']
          assert h['pr']==1705
          assert h['hostile_audit_review']==5136295432
          assert h['audited_exact_head']=='da4fa2b0da0a2322ac4f2f3a84a0d5006858f8a2'
          assert h['exact_head_ci']=='34175238539/101903217236'
          assert h['merged_main_sha']=='3cbdaf46e74f458681041322f574365e0003d818'
          cur=s['current']
          assert cur['next_exact_leaf']=='36-09CM_GLOBAL_KUMMER_CLASS_AND_LOCALIZATION_ADAPTER_PREFLIGHT'
          assert cur['36_09CM_entry_allowed'] is True
          assert cur['hostile_audit_checkpoint_reached'] is False
          assert cur['substantive_batch_pr_continues'] is True
          pg=s['promotion_gates']
          assert pg['36_09CL_hostile_audit_passed'] is True
          assert pg['36_09CM_unlocked'] is True and pg['36_09CM_entry_allowed'] is True
          assert pg['global_H1_class_constructed'] is False
          assert pg['dynamic_localization_adapter_constructed'] is False
          assert pg['new_global_obstruction_obtained'] is False
          for key in ['fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          print('PR #1705 hostile-audit PASS consumed; 36-09CM unlocked with zero new mathematical credit.')
          PY
          git diff --check
