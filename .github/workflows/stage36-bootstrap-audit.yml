name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Assert hostile-reaudited merged AZ-BE authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_history']['36-09AZ-BE']
          assert a['pr']==1686
          assert a['failed_audit_review']==5128976664
          assert a['hostile_reaudit_review']==5129219368
          assert a['audited_exact_head']=='52161f9872d7748bd3a4dcba346f7fd42d68edd9'
          assert a['exact_head_ci']=='34095467995/101658038311'
          assert a['merged_main_sha']=='386b6a52d7bfec2e8903412c7ca56976b46c288b'
          PY
          git merge-base --is-ancestor 386b6a52d7bfec2e8903412c7ca56976b46c288b HEAD
      - name: Replay hostile-reaudited exact 36-09BE head
        shell: bash
        run: |
          set -euo pipefail
          H=52161f9872d7748bd3a4dcba346f7fd42d68edd9
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BE.py"
          git worktree remove --force "$tmp"
      - name: Replay exact 36-09BF parent
        shell: bash
        run: |
          set -euo pipefail
          H=2079662f682f2a2b49009da169bc66176df8e893
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BF.py"
          git worktree remove --force "$tmp"
      - name: Verify current 36-09BG
        run: python3 stages/stage36/verify_stage36_36_09BG.py
      - name: Assert BG checkpoint firewalls and BH lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V95_36_09BG_AUDIT_CHECKPOINT'
          bg=s['authority_frontier']['36-09BG']
          assert bg['ALL_15_CHARACTER_PULLBACK_COLLAPSE_COMPLETE'] is True
          assert bg['NEW_CHARACTER_PREDICATE_BEYOND_BB'] is False
          assert bg['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert bg['RECEIVER_CLOSED'] is False
          assert s['cycle_ledger']['B4_FULL_CHARACTER_QUOTIENTS']=='BLOCKED_NO_NEW_INFORMATION_AS_NEW_PREDICATE_ROUTE'
          assert s['cycle_ledger']['B4_BAD_PRIME_LOCAL']=='LIVE_SELECTED'
          assert s['current']['unit']=='36-09BG-AUDIT-CHECKPOINT'
          assert s['current']['hostile_audit_checkpoint_reached'] is True
          assert s['current']['36_09BH_entry_allowed'] is False
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert s['claims'][key] is False
          print('36-09BG checkpoint verified; all character predicates collapse on AY, character-predicate route blocked, bad-place full-cover valuation selected but BH remains audit-locked')
          PY
          git diff --check
