name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Assert hostile-audited and merged 36-09AP-AU authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_history']['36-09AP-AU']
          assert a['pr']==1680
          assert a['audited_head']=='9aa2e4c06240bbf1f6260dd2c11c3d622119f16f'
          assert a['hostile_audit_review']==5128229756
          assert a['exact_head_ci']=='34085000175/101627220799'
          assert a['merged_main_sha']=='d43db1874b0e657143fa07b1a16eb87fc27e0238'
          PY
          git merge-base --is-ancestor d43db1874b0e657143fa07b1a16eb87fc27e0238 HEAD
          test "$(git rev-parse HEAD:stages/stage36/36-09AU/even-transposed-redei-stage36-equivalence-close-preflight.json)" = "ae4572d4131464a8aca83d39e2faefbd4ffec18e"
          test "$(git rev-parse HEAD:stages/stage36/36-09AD/coupled-six-reservoir-factor-squareclass-parity-preflight.json)" = "9d0388845955efee71d1a761ae4ee943d8b565d5"
          test "$(git rev-parse HEAD:stages/stage36/36-09AN/retained-open-tunnell-necessary-gate-preflight.json)" = "76c55e89505b081c487749f4d7ab4d80e9d38a1f"

      - name: Verify current 36-09AV actual-coordinate specialization
        run: python3 stages/stage36/verify_stage36_36_09AV.py

      - name: Assert AV firewalls and AW unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V84_36_09AV_CANDIDATE'
          av=s['authority_frontier']['36-09AV']
          assert av['ACTUAL_COORDINATE_TWIST_FORMULA'] is True
          assert av['EXPLICIT_NON2TORSION_POINT'] is True
          assert av['TUNNELL_NEW_FILTER_AFTER_ACTUAL_COORDINATE'] is False
          assert av['TUNNELL_BRANCH_PREFILTER_BEFORE_REALIZATION'] is True
          assert av['P_ONLY_TUNNELL_GATE'] is False
          assert av['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert av['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AW'
          assert s['current']['36_09AW_entry_allowed'] is True
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AV verified; actual U/V makes Tunnell automatic, fixed-p pre-realization branch sieve AW unlocked')
          PY
          git diff --check
