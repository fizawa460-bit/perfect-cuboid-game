name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/cards/formal/S34-W01.md'
      - 'docs/arsenal/cards/formal/S34-W02.md'
      - 'docs/arsenal/cards/workflows/LIT-WF02.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09CB mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=f888de991a62164645d8b81c18cb08aad029371b
          git cat-file -e "$H^{commit}" || git fetch origin "$H" --depth=1
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CB.py"
          git worktree remove --force "$tmp"
      - name: Assert PR1696 audit consumption and CC unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V120_36_09CC_PROMOTION'
          assert s['status']=='ACTIVE_MAIN_CONTINUATION'
          a=s['audited_history']['36-09BY-CB']
          assert a['status']=='AUDITED_MERGED_AUTHORITY'
          assert a['pr']==1696
          assert a['hostile_audit_review']==5135340667
          assert a['audited_exact_head']=='f7848842c1edc82c7dff0136d8b67e9b087143dd'
          assert a['exact_head_ci']=='34162974810/101868399574'
          assert a['merged_main_sha']=='5e5c262877a21a6ef197562143657ae1ac5963c7'
          cb=s['authority_frontier']['36-09CB']
          assert cb['status']=='AUDITED_MERGED_INPUT'
          assert cb['ALL_BZ_OUTER_SURVIVORS_HAVE_Q2_FULL_COVER_POINT'] is True
          assert cb['PRIME2_BRANCH_FILTER_LAYER_COMPLETE'] is True
          cur=s['current']
          assert cur['next_exact_leaf']=='36-09CC_GENERAL_OLD_SIX_QQ_SOURCE_PULLBACK_PREFLIGHT'
          assert cur['next_owner']=='MAIN'
          assert cur['substantive_batch_pr_continues'] is True
          assert cur['hostile_audit_checkpoint_reached'] is False
          assert cur['36_09CC_entry_allowed'] is True
          pg=s['promotion_gates']
          assert pg['36_09CB_hostile_audit_passed'] is True
          assert pg['36_09CC_unlocked'] is True
          assert pg['36_09CC_entry_allowed'] is True
          for key in ['fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert s['claims'][key] is False
          print('Stage36 promotion verified: PR #1696 hostile-audit PASS is consumed and 36-09CC is unlocked without additional mathematical credit.')
          PY
          git diff --check
