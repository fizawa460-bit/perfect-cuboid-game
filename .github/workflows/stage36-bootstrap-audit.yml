      - name: Verify Stage36 36-09G repaired breadth refresh and blind provenance
        run: python3 stages/stage36/verify_stage36_36_09G.py
      - name: Assert hostile-audit boundary before 36-09H
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V26_36_09G_PENDING_HOSTILE_AUDIT'
          assert s['status']=='ACTIVE_PENDING_HOSTILE_AUDIT'
          a=s['authority_frontier']['36-09G']
          assert a['promotion_status']=='PROVISIONAL_NOT_AUDITED'
          assert a['BLIND_PROVENANCE_FAIL_CLOSED'] is True
          assert a['blind_snapshot_commit']=='30c37a19053638cdf806e88fa726f8d099146306'
          assert a['comparison_commit']=='0ea755a7c48b472fdb377b6a044596135de58b66'
          assert a['FRESH_EXHAUSTIVE_VIEW_AUDIT'] is True
          assert a['FRESH_BLIND_REDISCOVERY'] is True
          assert a['COMMON_TWO_JMINUS_RANK']==2
          assert a['COMMON_TWO_JMINUS_KERNEL_DIMENSION']==1
          assert a['COMMON_SUBRECEIVER_RATIONAL_STRICTNESS_PROVED'] is False
          assert a['SINGLE_REP_FULL_THREE_CHARACTER_ENDPOINT_EQUIVALENT'] is True
          assert a['B10_STATUS']=='LIVE_COMMON_TWO_JMINUS_SUBRECEIVER'
          assert a['S34_W01_STATUS']=='APPLICABILITY_CANDIDATE_PREFLIGHT_REQUIRED'
          assert a['S34_W01_TRIGGERED'] is False
          assert s['cycle_ledger']['counts']=={'live':1,'untested':3,'blocked':6,'dominated':1}
          assert s['cycle_ledger']['blind_snapshot_precedes_ledger_and_arsenal_commit'] is True
          assert s['current']['36_09H_entry_allowed'] is False
          assert s['promotion_gates']['blind_provenance_fail_closed'] is True
          assert s['promotion_gates']['common_jminus_subreceiver_rational_strictness_proved'] is False
          assert s['promotion_gates']['R29_CAMP2_closed'] is False
          assert all(v is False for v in s['claims'].values())
          print('36-09G provenance repaired and frozen; B10 common-Jminus live; 36-09H locked pending hostile audit')
          PY
