name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DX finite Phi-Selmer evidence
        shell: bash
        run: |
          set -euo pipefail
          H=6232e765ffc2f40599a0125dac8a99f303a63e7e
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DX.py"
          git worktree remove --force "$tmp"
      - name: Verify repaired DN audit provenance remains non-authoritative
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DN.py
      - name: Verify post-audit DS pro-Selmer torsion correction
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DS_correction.py
      - name: Assert V217 correction checkpoint and DY relock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          corr=json.loads(Path('stages/stage36/36-09DS/proselmer-torsion-injectivity-correction.json').read_text())
          oldds=json.loads(Path('stages/stage36/36-09DS/fixed-p2-v4-isogeny-2primary-proselmer-transport-preflight.json').read_text())
          dx=json.loads(Path('stages/stage36/36-09DX/fixed-p2-global-phi-selmer-intersection-preflight.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V217_36_09DS_CORRECTION_REAUDIT_CHECKPOINT'
          assert s['status']=='HOSTILE_REAUDIT_REQUIRED'
          af=s['authority_frontier']['36-09DX']; pc=s['post_audit_correction']; cur=s['current']; pg=s['promotion_gates']; ha=s['hostile_audit_checkpoint']
          assert af['status']=='EXACT_GREEN_MATHEMATICS_RETAINED_AUDIT_REOPENED_BY_DS_CORRECTION'
          assert af['PHI_SELMER_F2_DIMENSION']==2
          assert af['PHI_SELMER_CARDINALITY']==4
          assert af['DOWNSTREAM_RELEASE_BLOCKED'] is True
          assert dx['global_Phi_Selmer_group']['F2_dimension']==2
          assert dx['global_Phi_Selmer_group']['cardinality']==4
          assert pc['status']=='PROVISIONAL_CORRECTION_PENDING_EXACT_HEAD_CI_AND_EXTERNAL_REAUDIT'
          assert pc['certificate_blob_sha']=='d3318c8291835de8011f6b72fea8ca4479c3107d'
          assert pc['source_blob_sha']=='7b8d09ddf0eaa147af01437d0ef19a80da44fb0c'
          assert pc['verifier_blob_sha']=='48da0461edbd728b9c621ec1931d2ff2b1abb04d'
          assert set(pc['revoked_claims'])=={'T2Sel_2_torsion_free','Phi_injective','Psi_injective','proSelmer_mutual_injections_constructed'}
          assert corr['corrected_proSelmer_transport']['Phi_kernel_nonzero'] is True
          assert corr['corrected_proSelmer_transport']['Psi_kernel_nonzero'] is True
          assert corr['corrected_proSelmer_transport']['Phi_injective'] is False
          assert corr['corrected_proSelmer_transport']['Psi_injective'] is False
          assert oldds['proSelmer_transport']['Phi_injective'] is True
          assert oldds['proSelmer_transport']['Psi_injective'] is True
          assert ha['result']=='REOPENED_POST_AUDIT_DS_MATHEMATICAL_DEFECT'
          assert ha['historical_pass_retained_as_history_not_current_authority'] is True
          assert ha['current_authority_valid'] is False
          assert ha['external_reaudit_required'] is True
          assert ha['current_audit_candidate_pr']==1731
          assert cur['unit']=='36-09DS-CORRECTION'
          assert cur['next_owner']=='HOSTILE_REAUDIT'
          assert cur['substantive_batch_pr_continues'] is False
          assert cur['hostile_audit_checkpoint_reached'] is True
          assert cur['36_09DY_entry_allowed'] is False
          assert pg['post_audit_DS_injectivity_defect_detected'] is True
          assert pg['DS_T2Sel_2_torsion_free_claim_valid'] is False
          assert pg['DS_Phi_proSelmer_injective'] is False
          assert pg['DS_Psi_proSelmer_injective'] is False
          assert pg['DS_proSelmer_mutual_injections_constructed'] is False
          for key in ['DS_Phi_kernel_nonzero','DS_Psi_kernel_nonzero','DS_Phi_kernel_killed_by_2','DS_Psi_kernel_killed_by_2','DS_Phi_cokernel_killed_by_2','DS_Psi_cokernel_killed_by_2']:
            assert pg[key] is True,key
          assert pg['DS_correction_certificate_complete'] is True
          assert pg['DS_correction_exact_head_ci_passed'] is False
          assert pg['external_reaudit_after_DS_correction_passed'] is False
          assert pg['36_09DY_entry_allowed'] is False
          assert pg['BT_global_Phi_Selmer_group_computed'] is True
          assert pg['BT_global_Phi_Selmer_cardinality']==4
          for key in ['BT_proSelmer_kernel_dimensions_computed','BT_proSelmer_cokernel_size_computed','BT_proSelmer_product_identification_obtained','BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09DS/proselmer-torsion-injectivity-correction.json'],text=True).strip()=='d3318c8291835de8011f6b72fea8ca4479c3107d'
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09DS/proselmer-torsion-injectivity-correction-source-lock.md'],text=True).strip()=='7b8d09ddf0eaa147af01437d0ef19a80da44fb0c'
          assert subprocess.check_output(['git','hash-object','stages/stage36/verify_stage36_36_09DS_correction.py'],text=True).strip()=='48da0461edbd728b9c621ec1931d2ff2b1abb04d'
          print('V217 verified: the historical PR1712 audit is reopened because DS mutual pro-Selmer injectivity is false in the presence of the split rational 2-torsion kernels. DX finite Phi-Selmer mathematics remains exact-green, but DY and every downstream promotion are relocked pending exact-head CI plus external re-audit.')
          PY
          git diff --check
