name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/cards/formal/S34-W01.md'
      - 'docs/arsenal/cards/formal/S34-W02.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay exact 36-09BR parent
        shell: bash
        run: |
          set -euo pipefail
          H=0fca8cdf580d07f6993a27f7277deb23bcfe5c21
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BR.py"
          git worktree remove --force "$tmp"
      - name: Verify current 36-09BS
        run: python3 stages/stage36/verify_stage36_36_09BS.py
      - name: Assert BS population firewalls and BT unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V108_36_09BS_POPULATION_ADAPTER'
          bs=s['authority_frontier']['36-09BS']
          assert bs['AW_BRANCH_POPULATION_EQUALS_AY'] is False
          assert bs['AY_IS_ONE_AW_COMPATIBLE_BRANCH'] is True
          assert bs['BH_BO_GATES_GENERAL_AW_BRANCH'] is False
          assert bs['GENERAL_AW_BRANCH_LOCAL_MODEL_OBTAINED'] is False
          assert bs['WHOLE_FIXED_P_PARAMETER_ELIMINATION_FROM_AY_GATES'] is False
          assert s['current']['next_exact_leaf']=='36-09BT_GENERAL_AW_SQUARECLASS_BRANCH_FULL_COVER_LOCAL_MODEL_PREFLIGHT'
          assert s['current']['36_09BT_entry_allowed'] is True
          assert s['promotion_gates']['local_parameter_elimination_route_exhausted'] is False
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert s['claims'][key] is False
          print('36-09BS verified; AY-only local gates cannot be charged to all AW branches. BT general squareclass branch full-cover model selected.')
          PY
          git diff --check
