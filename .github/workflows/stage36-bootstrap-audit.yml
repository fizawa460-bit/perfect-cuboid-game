name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/cards/formal/S34-W01.md'
      - 'docs/arsenal/cards/formal/S34-W02.md'
      - 'docs/arsenal/cards/workflows/LIT-WF02.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay exact 36-09CC green parent
        shell: bash
        run: |
          set -euo pipefail
          H=99a4f5235b0d2c9a8aaabc1ad2e36eadf518e7e7
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CC.py"
          git worktree remove --force "$tmp"
      - name: Verify current 36-09CD
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09CD.py
      - name: Assert CD firewalls and CE selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V122_36_09CD_OLD_SIX_FILTER_INTEGRATION'
          cc=s['authority_frontier']['36-09CC']
          assert cc['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert cc['exact_head']=='99a4f5235b0d2c9a8aaabc1ad2e36eadf518e7e7'
          assert cc['exact_head_ci']=='34164929391/101873986407'
          cd=s['authority_frontier']['36-09CD']
          assert cd['certificate_blob_sha']=='78adcb3cf8f80c58cab77cedd3e694df8e266c8e'
          assert cd['verifier_blob_sha']=='8638530c242bd979031e76aab933dd7d6ffc9ed4'
          assert cd['FIXED_P_OLD_SIX_FILTER_INTEGRATION_COMPLETE'] is True
          assert cd['SOUND_ZERO_SURVIVOR_EXCLUSION_RULE'] is True
          assert cd['FIXED_P_PARAMETER_EXCLUSION_OBTAINED'] is False
          assert cd['RECEIVER_CLOSED'] is False
          cur=s['current']
          assert cur['next_exact_leaf']=='36-09CE_GENERAL_OLD_SIX_HMU0_TIE_REALIZATION_PREFLIGHT'
          assert cur['next_owner']=='MAIN'
          assert cur['substantive_batch_pr_continues'] is True
          assert cur['hostile_audit_checkpoint_reached'] is False
          assert cur['36_09CE_entry_allowed'] is True
          pg=s['promotion_gates']
          assert pg['36_09CC_exact_head_ci_passed'] is True
          assert pg['36_09CD_certificate_complete'] is True
          assert pg['36_09CE_unlocked'] is True
          assert pg['fixed_p_old_six_filter_integration_complete'] is True
          assert pg['sound_zero_survivor_exclusion_rule'] is True
          assert pg['old_six_hmu0_tie_realization_complete'] is False
          for key in ['fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert s['claims'][key] is False
          print('36-09CD workflow checkpoint verified: old-six branch-only rows are integrated into the fixed-p outer family; CE hmu=0 tie realization selected with no parameter/global credit.')
          PY
          git diff --check
