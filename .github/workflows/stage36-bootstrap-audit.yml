name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'stages/stage29/29-16/active-kernel-ledger.json'
      - 'stages/stage29/29-06/endpoint-hub-graph.json'
      - 'stages/stage29/29-02f/**'
      - 'stages/stage29/29-02ha/**'
      - 'stages/stage29/29-02hb/**'
      - 'docs/arsenal/**'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
          fi

      - name: Assert immutable merged authorities are ancestors
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || '824355f591f8f951fda9f2a7c1f4e3e66d4e1e9a' }}"
          for x in "$base" d0f3de51b86cda9199a55e89757ae6887f572ea3 2af6edb984e0c0a51e945f886939a09b442c3218 fd7b5d9dfef272bee2b6676797e6d12d8b07bde0 1d29735f3f50c6918a32b2542de8364b86568396 ac5a7c81d3f268bebbc2a9de8e658b23c97d5649 6e0c40eeb7a533b47aba0d224c34e85822db373c f22d67dda4183c3bfd39710ebb4083f5185f3f49 631d773a0f341954507eacf303f0c5f7cbdc836a 51efa8394c45bc60a4b482c4f6f94f7826eb9d20 f75830b2fd54031c1af05e2377a9da365a4d7fdf a3f6380a89e627a9fa36915466a901361e0cb175 cf6ada6bf53ee29c04751dfae427a96252c98e9c 4ed21de07a935ed848400515a44f53aba49234c7 c8b6bca818697125ef75a85527e282c15c6bd8f3 2f708b8f0b36483eb7ce19fbb4f7dcc6b9d9d0bc dbd9ab95f1cf248a8a4704b205f62b8b96b1aefa fc5886d62b78d8dcb21824ff02419a3e3b7634c8 8ff10455b27a789a6ba71c354042be0f79a2b3a6 0bc325f9b9db817193bc271121d19cb04970c5b9 40cd38c5f5d2679874ce3be882cc67d17d4c7558 f91c045796cba859ec1dd172cf7871fcac5f6d8a b6b538b4c8838e24ddf99eb05fc022fe50056af4 dd0fab674db9a10d6494590c1987333aa338a37e 8607da00e76f9f0ff1759c04b983ba329cca5de6 824355f591f8f951fda9f2a7c1f4e3e66d4e1e9a; do
            git merge-base --is-ancestor "$x" HEAD
          done

      - name: Save current V40 state
        run: cp stages/stage36/MAIN-STATE.json /tmp/stage36-v40.json

      - name: Replay Stage36 authority chain through 36-09J
        shell: bash
        run: |
          set -euo pipefail
          git show d0f3de51b86cda9199a55e89757ae6887f572ea3:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_bootstrap.py
          python3 stages/stage36/verify_stage36_36_01.py
          python3 stages/stage36/verify_stage36_36_02_audited.py
          python3 stages/stage36/verify_stage36_36_03_audited.py
          python3 stages/stage36/verify_stage36_36_04_audited.py
          python3 stages/stage36/verify_stage36_36_05_audited.py
          python3 stages/stage36/verify_stage36_36_09_audited.py
          python3 stages/stage36/verify_stage36_36_09A.py
          git show 2af6edb984e0c0a51e945f886939a09b442c3218:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09A_audited.py
          git show fd7b5d9dfef272bee2b6676797e6d12d8b07bde0:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09B.py
          git show 1d29735f3f50c6918a32b2542de8364b86568396:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09B_audited.py
          git show ac5a7c81d3f268bebbc2a9de8e658b23c97d5649:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09C.py
          git show 6e0c40eeb7a533b47aba0d224c34e85822db373c:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09C_audited.py
          git show f22d67dda4183c3bfd39710ebb4083f5185f3f49:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09D.py
          git show 631d773a0f341954507eacf303f0c5f7cbdc836a:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09D_audited.py
          git show 51efa8394c45bc60a4b482c4f6f94f7826eb9d20:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09E.py
          git show f75830b2fd54031c1af05e2377a9da365a4d7fdf:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09E_audited.py
          git show a3f6380a89e627a9fa36915466a901361e0cb175:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09F.py
          git show cf6ada6bf53ee29c04751dfae427a96252c98e9c:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09F_audited.py
          git show 4ed21de07a935ed848400515a44f53aba49234c7:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09G_audited.py
          git show c8b6bca818697125ef75a85527e282c15c6bd8f3:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09H.py
          git show 2f708b8f0b36483eb7ce19fbb4f7dcc6b9d9d0bc:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09H_audited.py
          tmp="$(mktemp -d)"; git worktree add --detach "$tmp" 476829b39679f4c380fe0458e37c28745e5f5621; python3 "$tmp/stages/stage36/verify_stage36_36_09I.py"; git worktree remove --force "$tmp"
          git show fc5886d62b78d8dcb21824ff02419a3e3b7634c8:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09I_audited.py
          tmp="$(mktemp -d)"; git worktree add --detach "$tmp" 6ede28751914a881a5ddaca7691538a8a3e4780c; python3 "$tmp/stages/stage36/verify_stage36_36_09J.py"; git worktree remove --force "$tmp"
          git show 0bc325f9b9db817193bc271121d19cb04970c5b9:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09J_audited.py

      - name: Replay Stage36 36-09K and 36-09L audited authorities
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; git worktree add --detach "$tmp" e10530918619cea1fc1720a6074ea0ca0499f904; python3 "$tmp/stages/stage36/verify_stage36_36_09K.py"; git worktree remove --force "$tmp"
          git show f91c045796cba859ec1dd172cf7871fcac5f6d8a:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09K_audited.py
          tmp="$(mktemp -d)"; git worktree add --detach "$tmp" 98d057a47fc37a897fb14e904cdf9d52913f082b; python3 "$tmp/stages/stage36/verify_stage36_36_09L.py"; git worktree remove --force "$tmp"
          git show dd0fab674db9a10d6494590c1987333aa338a37e:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09L_audited.py

      - name: Replay repaired Stage36 36-09M against merged V38 state
        shell: bash
        run: |
          set -euo pipefail
          git show 8607da00e76f9f0ff1759c04b983ba329cca5de6:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09M.py

      - name: Replay 36-09M user-pass promotion at merged V39 authority
        shell: bash
        run: |
          set -euo pipefail
          git show 824355f591f8f951fda9f2a7c1f4e3e66d4e1e9a:stages/stage36/MAIN-STATE.json > stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09M_user_pass_promoted.py

      - name: Restore V40 and verify Stage36 36-09N exact preflight
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/stage36-v40.json stages/stage36/MAIN-STATE.json
          python3 stages/stage36/verify_stage36_36_09N.py

      - name: Assert hostile-audit boundary before 36-09O
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V40_36_09N_PENDING_HOSTILE_AUDIT'
          assert s['status']=='ACTIVE_PENDING_HOSTILE_AUDIT'
          N=s['authority_frontier']['36-09N']
          assert N['certificate_blob_sha']=='ad66f3849b496b56e1cbeea1f46ba1f8bf967164'
          assert N['verifier_blob_sha']=='e86b9fa5b01f9421839c9d05a3f63c8db29549cf'
          assert N['source_lock_blob_sha']=='e7c98981fbb1d523fd7db54478dc09aa87b547e8'
          assert N['SPECIALIZATION_Q0']==6
          assert N['SPECIALIZATION_INJECTIVE'] is True
          assert N['SPECIALIZED_RANK']==1
          assert N['GENERIC_FUNCTION_FIELD_MW_RANK']==1
          assert N['EXACT_ALPHA_IMAGE']==['[1]','[-1]','[C]','[-C]']
          assert N['EXACT_BETA_IMAGE']==['[1]','[2]']
          assert N['FIBERWISE_RANK_ONE_FOR_EVERY_RATIONAL_Q_PROVED'] is False
          assert s['cycle_ledger']['counts']=={'live':1,'untested':3,'blocked':6,'dominated':2}
          assert s['current']['36_09O_entry_allowed'] is False
          assert s['promotion_gates']['generic_function_field_rank1_promoted'] is False
          assert s['promotion_gates']['exact_generic_kummer_images_promoted'] is False
          assert s['promotion_gates']['uniform_Mordell_Weil_group_proved'] is False
          assert s['promotion_gates']['isogeny_Selmer_groups_computed'] is False
          assert s['promotion_gates']['receiver_emptiness_proved'] is False
          assert s['promotion_gates']['R29_CAMP2_closed'] is False
          print('36-09N exact relative Kummer images and generic rank 1 frozen pending hostile audit; 36-09O locked')
          PY
