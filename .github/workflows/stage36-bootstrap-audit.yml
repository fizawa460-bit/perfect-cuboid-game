name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DV exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=25d27029099611f24752b6443a3ec4859afe0c19
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DV.py"
          git worktree remove --force "$tmp"
      - name: Assert V209 DV exact-green parent and DW unlock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V209_36_09DV_EXACT_GREEN_DW_UNLOCK_PENDING_PROMOTION_REPLAY'
          dv=s['authority_frontier']['36-09DV']
          assert dv['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert dv['certificate_blob_sha']=='cc3c071315c92f4cb398e18d650d5cd3652413c8'
          assert dv['verifier_blob_sha']=='440d3bfb2acd58b3a51eb8a54aa3c5f4325bbea8'
          assert dv['source_blob_sha']=='cf822af037a429f8506b8d417c98790541fd08b7'
          assert dv['exact_head']=='25d27029099611f24752b6443a3ec4859afe0c19'
          assert dv['exact_head_ci']=='34256784848/102164496201'
          cur=s['current']; pg=s['promotion_gates']
          assert cur['unit']=='36-09DV'
          assert cur['36_09DW_entry_allowed'] is True
          assert pg['36_09DV_exact_head_ci_passed'] is True
          assert pg['36_09DV_promotion_replay_passed'] is False
          assert pg['36_09DW_entry_allowed'] is True
          assert pg['BT_Phi_required_place_set_certified'] is True
          assert pg['BT_Phi_global_unramified_ambient_finite'] is True
          assert pg['BT_Phi_Selmer_local_condition_map_computed'] is False
          assert pg['BT_global_Phi_Selmer_group_computed'] is False
          for key in ['BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          print('36-09DV immutable exact-green evidence replayed; 36-09DW is unlocked for five-place local-image computation only. No downstream credit is granted.')
          PY
          git diff --check
