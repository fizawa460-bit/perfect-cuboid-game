name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Assert audited Stage36 authority and reconciled AO payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_history']['36-09AM-AN']
          assert a['pr']==1679
          assert a['audited_head']=='12716259951f02589ecfaf6ac8f9670b7a23f06f'
          assert a['hostile_audit_review']==5127771308
          assert a['exact_head_ci']=='34076440104/101603376687'
          assert a['merged_main_sha']=='6b6c541d1a6bbe229381ac0400148bd17523ca06'
          ao=s['audited_history']['parallel-36-09AO']
          assert ao['hostile_audit_review']==5127677576
          assert ao['audited_head']=='f5db4fc0aafdc61f931b6499afb18c1966c1f99d'
          PY
          git merge-base --is-ancestor 6b6c541d1a6bbe229381ac0400148bd17523ca06 HEAD
          test "$(git rev-parse HEAD:stages/stage36/36-09AO/monsky-stage36-full2-class-adapter-preflight.json)" = "a26991cb071e086d3cbc36b8c9d2db329a14e5b1"
          test "$(git rev-parse HEAD:stages/stage36/36-09AO/monsky-full2-kernel-source-lock.md)" = "9f22dfe19d42d7104d30d219aac1cfd72a67c72a"

      - name: Replay exact 36-09AR provisional parent
        shell: bash
        run: |
          set -euo pipefail
          H=79dd6d595498d1c89f2e70dd535b2f8fe17941df
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AR.py"
          git worktree remove --force "$tmp"
          test "$(git rev-parse "$H":stages/stage36/36-09AR/even-monsky-class-coordinate-adapter-preflight.json)" = "667a2ab1329865acdefca3b531511a3798edb3e6"
          test "$(git rev-parse "$H":stages/stage36/verify_stage36_36_09AR.py)" = "3368f0a8301f9bd8c0a8f2d3c08c89e14901546f"

      - name: Verify current 36-09AS kernel-equation compression
        run: python3 stages/stage36/verify_stage36_36_09AS.py

      - name: Assert 36-09AS firewalls and 36-09AT unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V81_36_09AS_CANDIDATE'
          assert s['status']=='ACTIVE_BATCHING_SUBSTANTIVE_PR'
          a=s['authority_frontier']['36-09AS']
          assert a['ALL_PARITY_KERNEL_EQUATION_COMPRESSION'] is True
          assert a['ODD_T_FLIP_SIMULTANEOUS_PASS_REQUIRES_ALL_P_1_OR_7_MOD8'] is True
          assert a['EVEN_EF_FLIP_SIMULTANEOUS_PASS_REQUIRES_ALL_P_1_MOD8'] is True
          assert a['SINGLE_PARAMETER_UNIFORM_EXCLUSION'] is False
          assert a['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert a['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AT'
          assert s['current']['36_09AT_entry_allowed'] is True
          assert s['claims']['candidate_parameter_set_shrunk'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AS verified; all parity Monsky equations compressed; exact branch-pair mod8 restrictions obtained; AT reservoir-Redei specialization unlocked')
          PY
          git diff --check
