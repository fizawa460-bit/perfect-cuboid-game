name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Verify audited DW correction remains valid
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DW_pairing_correction.py
      - name: Verify exact-green 36-09EB representatives
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09EB.py
      - name: Verify exact-green 36-09EC factor Selmer and MW closure reduction
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09EC.py
      - name: Verify exact-green 36-09ED dyadic MW saturation
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09ED.py
      - name: Verify provisional 36-09EE Q2 rho retained-open exclusion
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09EE.py
      - name: Assert V239 provisional EE and EF relock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          ee=json.loads(Path('stages/stage36/36-09EE/fixed-p2-q2-rho-retained-open-exclusion-preflight.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V239_36_09EE_PROVISIONAL_Q2_RHO_OBSTRUCTION'
          assert s['status']=='PROVISIONAL_EXACT_PENDING_CI'
          af=s['authority_frontier']['36-09EE'];cur=s['current'];pg=s['promotion_gates']
          assert af['status']=='PROVISIONAL_EXACT_PENDING_CI'
          assert af['certificate_blob_sha']=='683d52e7cba9e2bd683cc06577fb6913532feb77'
          assert af['source_blob_sha']=='0cc6e97c62fbb0782f19e30d87b19509d8144a8c'
          assert af['verifier_blob_sha']=='5bd144d3fca1ec08112d05e0639d12df9291c0c1'
          assert ee['Q2_odd_torsion_exclusion']['E_rho_Q2_odd_torsion_zero'] is True
          assert ee['Q2_odd_torsion_exclusion']['Q2_to_2adic_completion_injective'] is True
          assert ee['Q2_intersection_exclusion']['local_Q2_retained_open_MW_completion_intersection_empty'] is True
          assert ee['Q2_intersection_exclusion']['global_retained_open_proSelmer_intersection_empty'] is True
          assert ee['brauer_manin_consequence']['full_global_2primary_Brauer_set_on_retained_open_empty'] is True
          assert ee['brauer_manin_consequence']['two_primary_Brauer_Manin_obstruction_obtained'] is True
          assert ee['brauer_manin_consequence']['physical_receiver_adapter_not_yet_promoted'] is True
          assert cur['unit']=='36-09EE'
          assert cur['36_09EF_entry_allowed'] is False
          assert cur['hostile_audit_checkpoint_reached'] is True
          assert pg['36_09EE_exact_head_ci_passed'] is False
          assert pg['36_09EF_entry_allowed'] is False
          assert pg['BT_Q2_retained_open_MW_completion_intersection_empty'] is True
          assert pg['BT_global_2primary_Brauer_set_empty'] is True
          assert pg['Brauer_Manin_obstruction_obtained'] is True
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09EE/fixed-p2-q2-rho-retained-open-exclusion-preflight.json'],text=True).strip()=='683d52e7cba9e2bd683cc06577fb6913532feb77'
          assert subprocess.check_output(['git','hash-object','stages/stage36/verify_stage36_36_09EE.py'],text=True).strip()=='5bd144d3fca1ec08112d05e0639d12df9291c0c1'
          for key in ['fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          print('V239 verified: EE provisionally proves the fixed-p2 retained-open pro-Selmer intersection and full 2-primary Brauer set are empty via the Q2 rho quotient. EF remains locked pending exact-head CI and hostile audit; no physical receiver or endpoint credit.')
          PY
          git diff --check
