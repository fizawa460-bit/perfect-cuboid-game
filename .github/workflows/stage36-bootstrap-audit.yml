name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Assert hostile-audited merged BF-BG authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_history']['36-09BF-BG']
          assert a['pr']==1689
          assert a['hostile_audit_review']==5129489415
          assert a['audited_exact_head']=='731265665feb2bed991cf912b89431bb35ce65ad'
          assert a['exact_head_ci']=='34098010028/101665838247'
          assert a['merged_main_sha']=='e758e05953df2cf8cd4ab26ac1e9d72374e99760'
          PY
      - name: Replay hostile-audited exact 36-09BG head
        shell: bash
        run: |
          set -euo pipefail
          H=731265665feb2bed991cf912b89431bb35ce65ad
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BG.py"
          git worktree remove --force "$tmp"
      - name: Replay exact 36-09BM parent
        shell: bash
        run: |
          set -euo pipefail
          H=b8c1c6ed972ff48149a0ed417c7c027f29d69c37
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BM.py"
          git worktree remove --force "$tmp"
      - name: Verify current 36-09BN
        run: python3 stages/stage36/verify_stage36_36_09BN.py
      - name: Assert BN firewalls and BO unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V102_36_09BN_OLD_SIX_TIE_COMPLETE'
          bn=s['authority_frontier']['36-09BN']
          assert bn['ALL_OLD_SIX_TIE_RESIDUES_CLASSIFIED'] is True
          assert bn['OLD_SIX_ODD_LOCAL_SQUARE_CRITERIA_COMPLETE'] is True
          assert bn['OLD_SIX_PARAMETER_ONLY_LOCAL_FILTER'] is False
          assert bn['RECEIVER_POINT_LOCAL_GATES_RETAINED'] is True
          assert bn['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert bn['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09BN'
          assert s['current']['next_exact_leaf']=='36-09BO_Q_RESERVOIR_FULL_QQ_CANCELLATION_PREFLIGHT'
          assert s['current']['36_09BO_entry_allowed'] is True
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert s['claims'][key] is False
          print('36-09BN verified; old-six odd local layer complete as receiver-point gates, Q reservoir selected next')
          PY
          git diff --check
