name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/cards/formal/S34-W01.md'
      - 'docs/arsenal/cards/formal/S34-W02.md'
      - 'docs/arsenal/cards/workflows/LIT-WF02.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay exact 36-09CI promotion parent
        shell: bash
        run: |
          set -euo pipefail
          H=624099676d03393a2ee0b1ef93df3b41b53e994c
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 - "$tmp" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads((Path(sys.argv[1])/'stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V128_36_09CI_PROMOTION'
          assert s['audited_history']['36-09CC-CH']['hostile_audit_review']==5135648704
          assert s['promotion_gates']['36_09CI_unlocked'] is True
          assert s['current']['36_09CI_entry_allowed'] is True
          PY
          git worktree remove --force "$tmp"
      - name: Verify current 36-09CI
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09CI.py
      - name: Assert CI firewalls and CJ selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V129_36_09CI_Q_RESERVOIR_LOCAL_COMPLETE'
          ch=s['authority_frontier']['36-09CH']
          assert ch['status']=='AUDITED_MERGED_INPUT'
          assert ch['ALL_OLD_SIX_LOCAL_REALIZATION_COMPLETE'] is True
          ci=s['authority_frontier']['36-09CI']
          assert ci['certificate_blob_sha']=='f94c26579e93dea64f6a58b9c28da7133a1159c5'
          assert ci['verifier_blob_sha']=='816cdf2dc1dce951c4671a78690cab0633e90b90'
          assert ci['hasse_source_note_blob_sha']=='7375d96c685197cf5cb0ef68c0ce1eb874d698a0'
          assert ci['GENERAL_Q_RESERVOIR_LOCAL_REALIZATION_COMPLETE'] is True
          assert ci['BU_Q_ROW_NECESSARY_AND_SUFFICIENT'] is True
          assert ci['NEW_BRANCH_FILTER_BEYOND_BU_Q_ROW'] is False
          assert ci['FIXED_P_PARAMETER_EXCLUSION_OBTAINED'] is False
          cur=s['current']
          assert cur['next_exact_leaf']=='36-09CJ_FIXED_P_ALL_BAD_PLACE_LOCAL_INTEGRATION_PREFLIGHT'
          assert cur['next_owner']=='MAIN'
          assert cur['substantive_batch_pr_continues'] is True
          assert cur['hostile_audit_checkpoint_reached'] is False
          assert cur['36_09CJ_entry_allowed'] is True
          pg=s['promotion_gates']
          assert pg['36_09CI_certificate_complete'] is True
          assert pg['36_09CI_exact_head_ci_passed'] is False
          assert pg['36_09CJ_unlocked'] is True
          assert pg['general_Q_reservoir_local_realization_complete'] is True
          assert pg['BU_Q_row_necessary_and_sufficient'] is True
          for key in ['fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert s['claims'][key] is False
          print('36-09CI workflow verified: Q-reservoir local realization is exact, BU Q-row is necessary and sufficient, and CJ all-bad-place integration is selected without global credit.')
          PY
          git diff --check
