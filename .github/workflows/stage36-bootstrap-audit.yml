name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Replay exact hostile-audited 36-09AB through AF checkpoint
        shell: bash
        run: |
          set -euo pipefail
          H=f2922c992ab1e056fa03932ba017d0dfdae845cb
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AF.py"
          git worktree remove --force "$tmp"

      - name: Assert audited PR1670 promotion normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_batch_promotion']
          assert a['candidate_pr']==1670
          assert a['audited_head']=='f2922c992ab1e056fa03932ba017d0dfdae845cb'
          assert a['hostile_audit_review']==5127056767
          assert a['exact_head_ci']=='34067480463/101578693605'
          assert a['merged_main_sha']=='9306238c7ada55e31311245019d6b7e474ad837f'
          for leaf in ('36_09AB','36_09AC','36_09AD','36_09AE','36_09AF'):
              assert s['promotion_gates'][leaf+'_hostile_audit_passed'] is True
          PY

      - name: Verify current 36-09AG individual conic Hasse solubility
        run: python3 stages/stage36/verify_stage36_36_09AG.py

      - name: Assert 36-09AG firewalls and 36-09AH unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V68_36_09AG_CANDIDATE'
          ag=s['authority_frontier']['36-09AG']
          assert ag['INDIVIDUAL_CONIC_LOCAL_SOLUBILITY_CLASSIFIED'] is True
          assert ag['INDIVIDUAL_CONIC_Q_SOLUBILITY_CLASSIFIED'] is True
          assert ag['ALL_128_AE_RESIDUE_SURVIVORS_Q2_PASS'] is True
          assert ag['COMMON_UV_RATIO_OBTAINED'] is False
          assert ag['COUPLED_INTERSECTION_POINT_OBTAINED'] is False
          assert ag['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert ag['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AH'
          assert s['current']['36_09AH_entry_allowed'] is True
          assert s['promotion_gates']['36_09AG_hostile_audit_passed'] is False
          assert s['claims']['common_uv_ratio_obtained'] is False
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AG exact: both diagonal conics separately Q-soluble under their selected odd rows; common u:v remains unresolved; 36-09AH unlocked')
          PY
          git diff --check
