name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/cards/formal/S34-W01.md'
      - 'docs/arsenal/cards/formal/S34-W02.md'
      - 'docs/arsenal/cards/workflows/LIT-WF02.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay exact 36-09CA green parent
        shell: bash
        run: |
          set -euo pipefail
          H=b8e9ba3b091b9c0e350cafdaeefbfcfccc0dcfb0
          git cat-file -e "$H^{commit}"
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09CA.py"
          git worktree remove --force "$tmp"
      - name: Verify current 36-09CB
        run: python3 stages/stage36/verify_stage36_36_09CB.py
      - name: Assert CB firewalls and CC selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V118_36_09CB_Q2_LOCAL_REALIZATION'
          assert s['status']=='36_09CB_PROVISIONAL_CANDIDATE_CC_SELECTED'
          ca=s['authority_frontier']['36-09CA']
          assert ca['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert ca['exact_head']=='b8e9ba3b091b9c0e350cafdaeefbfcfccc0dcfb0'
          assert ca['exact_head_ci']=='34149759346/101829367656'
          cb=s['authority_frontier']['36-09CB']
          assert cb['MIXED_F0_SOURCE_CONIC_REALIZATION_COMPLETE'] is True
          assert cb['DEEP_F1_SOURCE_CONIC_REALIZATION_COMPLETE'] is True
          assert cb['ALL_BZ_OUTER_SURVIVORS_HAVE_Q2_FULL_COVER_POINT'] is True
          assert cb['PRIME2_BRANCH_FILTER_LAYER_COMPLETE'] is True
          assert cb['RECEIVER_CLOSED'] is False
          assert s['current']['next_exact_leaf']=='36-09CC_GENERAL_OLD_SIX_QQ_SOURCE_PULLBACK_PREFLIGHT'
          assert s['current']['36_09CC_entry_allowed'] is True
          assert s['promotion_gates']['36_09CA_exact_head_ci_passed'] is True
          assert s['promotion_gates']['36_09CB_certificate_complete'] is True
          assert s['promotion_gates']['36_09CB_exact_head_ci_passed'] is False
          assert s['promotion_gates']['36_09CC_unlocked'] is True
          assert s['promotion_gates']['prime2_branch_filter_layer_complete'] is True
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert s['claims'][key] is False
          print('36-09CB candidate verified: every BZ survivor has a Q2 point on the exact full-cover local model; prime-2 filtering is complete, while receiver/global credit remains closed. CC selected.')
          PY
          git diff --check
