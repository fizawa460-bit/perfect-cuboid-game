name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DD exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=d1e1e48745b4ea2bdebb7ea69f2beb500f4974df
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DD.py"
          git worktree remove --force "$tmp"
      - name: Verify 36-09DE infinite private-prime Brauer family
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DE.py
      - name: Assert DE checkpoint and DF lock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V172_36_09DE_INFINITE_PRIVATE_BRAUER_SUBGROUP'
          de=s['authority_frontier']['36-09DE']
          assert de['status']=='PROVISIONAL_PENDING_EXACT_HEAD_CI'
          assert de['certificate_blob_sha']=='14e73de6228606ad077303db96f1a032c2955238'
          assert de['verifier_blob_sha']=='e953c3864f4a216631d8dcf1665c1d151748f085'
          assert de['source_lock_blob_sha']=='6314560c7d55b34ef4ce060cb3a85bd79e0181f6'
          assert de['INFINITE_RANK_CREUTZ_VIRAY_EXPLICIT_SUBGROUP_CONSTRUCTED'] is True
          assert de['INFINITE_PRIVATE_SUBGROUP_BM_OBSTRUCTION'] is False
          assert de['INFINITE_PRIVATE_SUBGROUP_NO_GO_CONDITIONAL_ON_ADELIC_SOLUBILITY'] is True
          assert de['FULL_CREUTZ_VIRAY_EXPLICIT_IMAGE_COMPUTED'] is False
          assert de['FULL_BRAUER_GROUP_COMPUTED'] is False
          cur=s['current']
          assert cur['unit']=='36-09DE'
          assert cur['next_exact_leaf']=='36-09DF_FIXED_P2_CREUTZ_VIRAY_COMPLEMENT_AND_LOCAL_OBSTRUCTION_PREFLIGHT'
          assert cur['36_09DE_entry_allowed'] is True
          assert cur['36_09DF_entry_allowed'] is False
          pg=s['promotion_gates']
          assert pg['36_09DE_certificate_complete'] is True
          assert pg['36_09DE_exact_head_ci_passed'] is False
          assert pg['36_09DF_entry_allowed'] is False
          assert pg['BT_infinite_rank_Creutz_Viray_explicit_subgroup_constructed'] is True
          assert pg['BT_infinite_private_subgroup_sole_BM_obstruction'] is False
          assert pg['BT_full_Creutz_Viray_explicit_image_computed'] is False
          assert pg['BT_full_relevant_Brauer_group_computed'] is False
          for key in ['Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          print('36-09DE provisional checkpoint verified: infinite-rank private-prime explicit subgroup constructed and block-diagonal BM no-go recorded; DF locked pending exact-head CI.')
          PY
          git diff --check
