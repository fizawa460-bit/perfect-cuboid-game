name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DL exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=fd628494e24daa6a6d9f300f0b61b90a1c26432e
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DL.py"
          git worktree remove --force "$tmp"
      - name: Assert DL exact-green promotion and DM unlock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V187_36_09DL_EXACT_GREEN_DM_UNLOCK'
          dl=s['authority_frontier']['36-09DL']
          assert dl['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert dl['certificate_blob_sha']=='f3c8cba00d00b81fed2b316a62af96fc106cdaa7'
          assert dl['verifier_blob_sha']=='5413476c769a814d9986fa2cc91f4e4ff5f6c08f'
          assert dl['exact_head']=='fd628494e24daa6a6d9f300f0b61b90a1c26432e'
          assert dl['exact_head_ci']=='34213028270/102018234558'
          assert dl['FULL_RATIONAL_COMPONENT_BRAUER_SET_NONEMPTY'] is True
          assert dl['P2_ADELIC_POINT_ORTHOGONAL_FULL_RATIONAL_COMPONENT'] is True
          cur=s['current']
          assert cur['unit']=='36-09DL'
          assert cur['next_exact_leaf']=='36-09DM_FIXED_P2_FULL_RATIONAL_COMPONENT_PLUS_F5_ADELIC_CONTROL_PREFLIGHT'
          assert cur['36_09DM_entry_allowed'] is True
          pg=s['promotion_gates']
          assert pg['36_09DL_exact_head_ci_passed'] is True
          assert pg['36_09DM_entry_allowed'] is True
          assert pg['BT_rational_component_image_BM_set_nonempty'] is True
          for key in ['BT_rational_plus_F5_BM_set_nonempty','BT_full_Creutz_Viray_explicit_image_BM_set_nonempty','BT_full_L1_quotient_computed','BT_Pic0_mod2_computed','BT_full_Creutz_Viray_explicit_image_computed','BT_full_relevant_Brauer_group_computed','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          print('36-09DL exact-green parent verified and DM unlocked. Full rational-component Brauer set is nonempty; full explicit/full Brauer/BM/fixed-p credit remains open.')
          PY
          git diff --check
