name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DK exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=b673f8d711873ca83d36ce849a28c207bb0675b7
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DK.py"
          git worktree remove --force "$tmp"
      - name: Assert DK exact-green promotion and DL unlock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V185_36_09DK_EXACT_GREEN_DL_UNLOCK'
          dk=s['authority_frontier']['36-09DK']
          assert dk['status']=='PROVISIONAL_EXACT_GREEN_PARENT'
          assert dk['certificate_blob_sha']=='dd59fb2492e3bcb75409cc316c85ea6a130d10d1'
          assert dk['verifier_blob_sha']=='cec084abd32b95302428c6352edfaea4a908e264'
          assert dk['exact_head']=='b673f8d711873ca83d36ce849a28c207bb0675b7'
          assert dk['exact_head_ci']=='34212206197/102015582572'
          assert dk['F5_OUTSIDE_ENTIRE_RATIONAL_COMPONENT_IMAGE'] is True
          assert dk['GENUINE_NONRATIONAL_CREUTZ_VIRAY_DIRECTION_FOUND'] is True
          cur=s['current']
          assert cur['unit']=='36-09DK'
          assert cur['next_exact_leaf']=='36-09DL_FIXED_P2_FULL_RATIONAL_COMPONENT_ADELIC_CONTROL_PREFLIGHT'
          assert cur['36_09DL_entry_allowed'] is True
          pg=s['promotion_gates']
          assert pg['36_09DK_exact_head_ci_passed'] is True
          assert pg['36_09DL_entry_allowed'] is True
          assert pg['BT_F5_outside_entire_rational_component_image'] is True
          assert pg['BT_genuine_nonrational_Creutz_Viray_direction_found'] is True
          for key in ['BT_rational_component_image_BM_set_nonempty','BT_rational_plus_F5_BM_set_nonempty','BT_full_L1_quotient_computed','BT_Pic0_mod2_computed','BT_full_Creutz_Viray_explicit_image_computed','BT_full_relevant_Brauer_group_computed','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          print('36-09DK exact-green parent verified and DL unlocked. F5 is outside the full rational-component image; full explicit/full Brauer/BM/fixed-p credit remains open.')
          PY
          git diff --check
