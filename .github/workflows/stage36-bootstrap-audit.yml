name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DI exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=885349056cf203f8e3cfab735cea1870d4b3befa
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DI.py"
          git worktree remove --force "$tmp"
      - name: Verify 36-09DJ explicit F5 plus R5 corestriction
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DJ.py
      - name: Assert DJ checkpoint and DK lock firewalls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V182_36_09DJ_EXPLICIT_CORESTRICTION'
          dj=s['authority_frontier']['36-09DJ']
          assert dj['status']=='PROVISIONAL_PENDING_EXACT_HEAD_CI'
          assert dj['certificate_blob_sha']=='76b57c000b551846c24a0c7236c206d929faff20'
          assert dj['verifier_blob_sha']=='4da10e05bc671f62d5169d85757f83f7048a7ed5'
          assert dj['EXPLICIT_F5_PLUS_R5_CORESTRICTION_CHAIN_COMPLETE'] is True
          assert dj['F5_NOT_EQUAL_R5_MOD_BRQ'] is True
          assert dj['F5_OUTSIDE_ENTIRE_RATIONAL_COMPONENT_IMAGE'] is False
          assert dj['F5_INSIDE_ENTIRE_RATIONAL_COMPONENT_IMAGE'] is False
          assert dj['FULL_L1_QUOTIENT_COMPUTED'] is False
          cur=s['current']
          assert cur['unit']=='36-09DJ'
          assert cur['next_exact_leaf']=='36-09DK_FIXED_P2_F5_FULL_RATIONAL_COMPONENT_SPAN_PREFLIGHT'
          assert cur['36_09DK_entry_allowed'] is False
          pg=s['promotion_gates']
          assert pg['36_09DJ_certificate_complete'] is True
          assert pg['36_09DJ_exact_head_ci_passed'] is False
          assert pg['36_09DK_entry_allowed'] is False
          assert pg['BT_explicit_F5_plus_R5_corestriction_chain_complete'] is True
          assert pg['BT_F5_not_equal_R5_mod_BrQ_provisional'] is True
          for key in ['BT_F5_outside_entire_rational_component_image','BT_F5_inside_rational_component_image','BT_full_L1_quotient_computed','BT_Pic0_mod2_computed','BT_full_Creutz_Viray_explicit_image_computed','BT_full_relevant_Brauer_group_computed','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False
          print('36-09DJ provisional checkpoint verified: F5+R5 explicit corestriction separates at Q5; DK remains locked pending exact-head CI. No full rational-image/Picard/L1/full-Brauer/BM/fixed-p credit.')
          PY
          git diff --check
