name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/cards/formal/S34-W01.md'
      - 'docs/arsenal/cards/formal/S34-W02.md'
      - 'docs/arsenal/cards/workflows/LIT-WF02.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay audited 36-09BP-BX exact head
        shell: bash
        run: |
          set -euo pipefail
          H=11e1152a2de6df17c7354ab48f33f25865dd0ae5
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09BX.py"
          git worktree remove --force "$tmp"
      - name: Assert re-audit PASS consumption and BY unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V114_36_09BY_AUDIT_PASS_PROMOTION'
          assert s['status']=='AUDITED_BP_BX_PROMOTED_BY_UNLOCKED'
          h=s['audited_history']['36-09BP-BX']
          assert h['pr']==1693
          assert h['failed_audit_review']==5132495760
          assert h['hostile_reaudit_review']==5132705989
          assert h['audited_exact_head']=='11e1152a2de6df17c7354ab48f33f25865dd0ae5'
          assert h['exact_head_ci']=='34128399040/101762381263'
          assert h['merged_main_sha']=='af40c029a8721755b39dad13be452a2a74540c4e'
          assert h['mathematics']=='PASS'
          bx=s['authority_frontier']['36-09BX']
          assert bx['status']=='AUDITED_MERGED_AUTHORITY'
          assert bx['hostile_reaudit_review']==5132705989
          assert s['current']['unit']=='36-09BY'
          assert s['current']['next_exact_leaf']=='36-09BY_REMAINING_Q2_ALPHA_TIE_GATE_PARAMETER_PULLBACK_PREFLIGHT'
          assert s['current']['next_owner']=='MAIN'
          assert s['current']['substantive_batch_pr_continues'] is True
          assert s['current']['hostile_audit_checkpoint_reached'] is False
          assert s['current']['36_09BY_entry_allowed'] is True
          assert s['promotion_gates']['36_09BX_hostile_reaudit_passed'] is True
          assert s['promotion_gates']['36_09BY_unlocked'] is True
          for key in ['candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed','perfect_cuboid_existence_claim','perfect_cuboid_nonexistence_claim']:
            assert s['claims'][key] is False
          print('#1693 hostile re-audit PASS consumed exactly; BP-BX is audited authority and 36-09BY is unlocked with no extra mathematical credit.')
          PY
          git diff --check
