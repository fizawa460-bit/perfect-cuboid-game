name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Replay immutable 36-09DM exact-green mathematical evidence
        shell: bash
        run: |
          set -euo pipefail
          H=12bf7eb1ee7da6bf0e7ac8f35df9e5379d8e65cb
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09DM.py"
          git worktree remove --force "$tmp"
      - name: Verify immutable DM intermediate hostile-audit receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          rp=Path('stages/stage36/36-09DM/intermediate-hostile-audit-pass-receipt.json')
          r=json.loads(rp.read_text())
          assert subprocess.check_output(['git','hash-object',str(rp)],text=True).strip()=='66cd600ed6c49c240840c89e960881e05bbbdf84'
          assert r['status']=='PASS'
          assert r['audited_exact_head']=='12bf7eb1ee7da6bf0e7ac8f35df9e5379d8e65cb'
          PY
      - name: Verify 36-09DN full exponent-2 Brauer common-neighborhood result
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DN.py
      - name: Assert V192 DN provisional firewalls and DO lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V192_36_09DN_FULL_BR2_PENDING_EXACT_HEAD_CI'
          dn=s['authority_frontier']['36-09DN']
          assert dn['status']=='PROVISIONAL_PENDING_EXACT_HEAD_CI'
          assert dn['certificate_blob_sha']=='bffce7f0e27a9f92f12657bcca1b71cddce7ccaa'
          assert dn['verifier_blob_sha']=='9f0a751709e4a0e5893b8b91c789e619c8e5a501'
          assert dn['source_blob_sha']=='60984a1f42b999e770219398690e833b54c8eb0f'
          assert dn['FULL_BR2_BRAUER_SET_NONEMPTY'] is True
          assert dn['FULL_BR2_BRAUER_MANIN_OBSTRUCTION_DISPROVED'] is True
          assert dn['FULL_2PRIMARY_BRAUER_SET_NONEMPTY'] is False
          assert dn['FULL_BRAUER_SET_NONEMPTY'] is False
          cur=s['current'];pg=s['promotion_gates']
          assert cur['unit']=='36-09DN'
          assert cur['36_09DO_entry_allowed'] is False
          assert pg['36_09DN_certificate_complete'] is True
          assert pg['36_09DN_exact_head_ci_passed'] is False
          assert pg['36_09DO_entry_allowed'] is False
          assert pg['BT_full_Br2_Brauer_set_nonempty'] is True
          assert pg['BT_full_Br2_Brauer_Manin_obstruction_disproved'] is True
          for key in ['BT_full_2primary_Brauer_set_nonempty','BT_full_Brauer_set_nonempty','BT_full_relevant_Brauer_group_computed','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          print('36-09DN provisional exact-head candidate verified; full Br[2] Brauer set is nonempty, while higher 2-primary/full Brauer/fixed-p/receiver/endpoint credit remains locked pending exact-head CI.')
          PY
          git diff --check
