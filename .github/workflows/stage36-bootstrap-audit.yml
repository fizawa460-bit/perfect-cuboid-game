          assert a['certificate_blob_sha']=='08e7e87f866aebbc92b7d5cd776ce8b5fe60744d'
          assert a['UNBOUNDED_SHARED_ODD_PRIME_SUPPORT_PROVED'] is True
          assert a['LOCAL_SUPPORT_CONSTRUCTION_IS_GLOBAL_RECEIVER_POINT'] is False
          assert a['S34_W01_TRIGGERED'] is False
          assert a['B10_STATUS']=='LIVE_RECEIVER_S34_W01_FIRST_LAYER_BLOCKED'
          assert a['FRESH_BREADTH_REQUIRED'] is True
          assert s['cycle_ledger']['fresh_EXHAUSTIVE_VIEW_AUDIT_after_36_09H'] is False
