name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Assert hostile-audited PR1674 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_batch_promotion']
          assert a['candidate_pr']==1674
          assert a['audited_head']=='4bfec87e1ce85608f87fc57e884fc026b5a715b8'
          assert a['hostile_audit_review']==5127180987
          assert a['merged_main_sha']=='652cbd51cd6b546f2a178597f7f2d3474c92b1c6'
          PY

      - name: Replay exact 36-09AJ synced parent
        shell: bash
        run: |
          set -euo pipefail
          H=3a808af3404c7d57add3c4dca120b9d1696aa46e
          git merge-base --is-ancestor "$H" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AJ.py"
          git worktree remove --force "$tmp"

      - name: Verify current 36-09AK everywhere-local B7 covering
        run: python3 stages/stage36/verify_stage36_36_09AK.py

      - name: Assert 36-09AK firewalls and 36-09AL unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V73_36_09AK_CANDIDATE'
          assert s['status']=='ACTIVE_BATCHING_SUBSTANTIVE_PR'
          ak=s['authority_frontier']['36-09AK']
          assert ak['EXPLICIT_B7_COVERING_ELS'] is True
          assert ak['B7_CLASS_IN_2SELMER_E73073'] is True
          assert ak['UNIFORM_FULL2_LOCAL_OBSTRUCTION_CLOSURE'] is False
          assert ak['KUMMER_IMAGE_PROVED'] is False
          assert ak['SHA2_NONTRIVIAL_PROVED'] is False
          assert ak['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AL'
          assert s['current']['36_09AL_entry_allowed'] is True
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AK ELS Selmer survivor verified; local-obstruction uniform closure blocked; AL MW-vs-Sha unlocked')
          PY
          git diff --check
