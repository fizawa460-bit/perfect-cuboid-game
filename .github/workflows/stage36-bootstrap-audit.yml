name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Assert post-merge hostile-audited PR1679 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          a=s['audited_history']['36-09AM-AN']
          assert a['pr']==1679
          assert a['audited_head']=='12716259951f02589ecfaf6ac8f9670b7a23f06f'
          assert a['hostile_audit_review']==5127771308
          assert a['exact_head_ci']=='34076440104/101603376687'
          assert a['merged_main_sha']=='6b6c541d1a6bbe229381ac0400148bd17523ca06'
          PY
          git merge-base --is-ancestor 6b6c541d1a6bbe229381ac0400148bd17523ca06 HEAD
          test "$(git rev-parse 6b6c541d1a6bbe229381ac0400148bd17523ca06:stages/stage36/36-09AN/retained-open-tunnell-necessary-gate-preflight.json)" = "76c55e89505b081c487749f4d7ab4d80e9d38a1f"

      - name: Replay exact PR1679 36-09AM candidate parent
        shell: bash
        run: |
          set -euo pipefail
          H=46b426a393ee2eb027305f9c45f248008ff02fec
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AM.py"
          git worktree remove --force "$tmp"

      - name: Replay exact PR1679 36-09AN audited checkpoint
        shell: bash
        run: |
          set -euo pipefail
          H=12716259951f02589ecfaf6ac8f9670b7a23f06f
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AN.py"
          git worktree remove --force "$tmp"

      - name: Replay exact hostile-audited parallel 36-09AO payload
        shell: bash
        run: |
          set -euo pipefail
          H=f5db4fc0aafdc61f931b6499afb18c1966c1f99d
          git cat-file -e "$H^{commit}"
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$H"
          python3 "$tmp/stages/stage36/verify_stage36_36_09AO.py"
          git worktree remove --force "$tmp"
          test "$(git rev-parse "$H":stages/stage36/36-09AO/monsky-stage36-full2-class-adapter-preflight.json)" = "a26991cb071e086d3cbc36b8c9d2db329a14e5b1"
          test "$(git rev-parse HEAD:stages/stage36/36-09AO/monsky-stage36-full2-class-adapter-preflight.json)" = "a26991cb071e086d3cbc36b8c9d2db329a14e5b1"

      - name: Verify current reconciled 36-09AP two-gate adapter
        run: python3 stages/stage36/verify_stage36_36_09AP.py

      - name: Assert 36-09AP firewalls and 36-09AQ unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V78_36_09AP_RECONCILED_CANDIDATE'
          assert s['status']=='ACTIVE_BATCHING_SUBSTANTIVE_PR'
          ap=s['authority_frontier']['36-09AP']
          assert ap['RETAINED_RECEIVER_TWO_GATE_FILTER'] is True
          assert ap['ODD_ETA_MINUS_MONSKY_COORDINATE_ADAPTER'] is True
          assert ap['ODD_ETA_PLUS_MONSKY_COORDINATE_ADAPTER'] is False
          assert ap['EVEN_MONSKY_COORDINATE_ADAPTER'] is False
          assert ap['TWO_GATE_CONVERSE'] is False
          assert ap['CANDIDATE_PARAMETER_SET_SHRUNK'] is False
          assert ap['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09AQ'
          assert s['current']['36_09AQ_entry_allowed'] is True
          assert s['claims']['receiver_emptiness_proved'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09AP reconciled two-gate adapter verified; odd eta-minus complete; AQ unlocked')
          PY
          git diff --check
