name: Stage36 authority audit

on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi

      - name: Replay exact 36-09U batch parent
        shell: bash
        run: |
          set -euo pipefail
          U_HEAD=dfbd0ddff789b9e1a6f3b8033e553fd3d7bd56b4
          git merge-base --is-ancestor "$U_HEAD" HEAD
          tmp="$(mktemp -d)"
          git worktree add --detach "$tmp" "$U_HEAD"
          python3 "$tmp/stages/stage36/verify_stage36_36_09U.py"
          git worktree remove --force "$tmp"

      - name: Verify current batched 36-09V
        run: python3 stages/stage36/verify_stage36_36_09V.py

      - name: Assert 36-09V firewalls and 36-09W unlock
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V56_36_09V_BATCHED'
          assert s['status']=='ACTIVE_BATCHING_SUBSTANTIVE_PR'
          V=s['authority_frontier']['36-09V']
          assert V['SIX_RESERVOIR_DIRECTIONAL_PARTITION'] is True
          assert V['FIXED_FINITE_S_RECOVERED'] is False
          assert V['C2_FIXED_FINITE_S_COMPRESSION_BLOCKED'] is True
          assert V['B11_SELECTED_NEXT'] is True
          assert V['CANDIDATE_SET_SHRUNK'] is False
          assert V['QI_RANKJUMP_LOCUS_EMPTY'] is False
          assert V['RECEIVER_CLOSED'] is False
          assert s['current']['unit']=='36-09W'
          assert s['current']['36_09W_entry_allowed'] is True
          assert s['current']['hostile_audit_checkpoint_reached'] is False
          assert s['promotion_gates']['36_09U_hostile_audit_passed'] is False
          assert s['promotion_gates']['36_09V_hostile_audit_passed'] is False
          assert s['promotion_gates']['multiplace_reciprocity_obstruction_proved'] is False
          assert s['promotion_gates']['receiver_emptiness_proved'] is False
          assert s['claims']['candidate_set_shrunk'] is False
          assert s['claims']['perfect_cuboid_nonexistence_claim'] is False
          print('36-09V exact batched directional support verified; fixed finite-S blocked; 36-09W unlocked; hostile audit deferred')
          PY
