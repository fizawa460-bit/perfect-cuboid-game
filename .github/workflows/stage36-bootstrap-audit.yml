name: Stage36 authority audit
on:
  pull_request:
    paths:
      - 'stages/stage36/**'
      - '.github/workflows/stage36-bootstrap-audit.yml'
      - 'docs/research-os/policies/**'
      - 'docs/arsenal/**'
      - 'docs/stage36-literature-strengthening-promotion.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-stage36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact-head checkout and current PR base lock
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected_base="${{ github.event.pull_request.base.sha }}"
            python3 - "$expected_base" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          assert s['base_main_sha']==sys.argv[1]
          assert s['freshness']['current_main']==sys.argv[1]
          assert s['freshness']['stage36_source_drift'] is False
          assert s['freshness']['sync_required_before_audit'] is False
          PY
            git merge-base --is-ancestor "$expected_base" HEAD
          fi
      - name: Verify exact-green 36-09DZ parent
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09DZ.py
      - name: Verify exact-green 36-09EA four-coset reduction
        shell: bash
        run: |
          set -euo pipefail
          python3 stages/stage36/verify_stage36_36_09EA.py
      - name: Assert V228 EA promotion and EB unlock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          s=json.loads(Path('stages/stage36/MAIN-STATE.json').read_text())
          ea=json.loads(Path('stages/stage36/36-09EA/fixed-p2-defect-aware-retained-open-intersection-preflight.json').read_text())
          assert s['schema']=='STAGE36_CAMPEDELLI_UNIFORM_TORSOR_MAIN_STATE_V228_36_09EA_EXACT_GREEN_EB_UNLOCKED'
          assert s['status']=='ACTIVE_MAIN_CONTINUATION'
          af=s['authority_frontier']['36-09EA']; cur=s['current']; pg=s['promotion_gates']
          assert af['status']=='EXACT_GREEN_PARENT'
          assert af['certificate_blob_sha']=='aea5c84bb2721a92759e4143f5199f607a31637d'
          assert af['source_blob_sha']=='fe3fe4b5a8341159f347b6f8fc3d083aeccdf926'
          assert af['verifier_blob_sha']=='d5c66971754b2bfc1f9d87648e2a7678f9a7d885'
          assert af['exact_head']=='3fb6e9ef83374ad7bc41a9c299892ec1ec27389e'
          assert af['exact_head_ci']=='34302314342/102311646262'
          assert ea['coset_decomposition']['representative_set_cardinality']==4
          assert ea['coset_decomposition']['representatives_materialized'] is False
          assert ea['elliptic_product_side']['T2Sel_J_identified_with_product'] is False
          assert ea['retained_open_criterion']['exact_four_coset_intersection_reduction'] is True
          assert cur['unit']=='36-09EA'
          assert cur['next_exact_leaf']=='36-09EB_FIXED_P2_PHI_COSET_REPRESENTATIVE_PREFLIGHT'
          assert cur['36_09EB_entry_allowed'] is True
          assert pg['36_09EA_exact_head_ci_passed'] is True
          assert pg['36_09EA_promotion_replay_passed'] is True
          assert pg['36_09EB_entry_allowed'] is True
          assert pg['BT_four_coset_retained_open_reduction_computed'] is True
          assert pg['BT_Phi_coset_representatives_materialized'] is False
          for key in ['BT_retained_open_curve_proSelmer_intersection_computed','BT_global_2primary_Brauer_set_nonempty','BT_global_2primary_Brauer_set_empty','Brauer_Manin_obstruction_obtained','fixed_p_parameter_exclusion_obtained','candidate_parameter_set_shrunk','receiver_emptiness_proved','R29_CAMP2_closed','Q11_CAMPEDELLI_closed','endpoint_closed']:
            assert pg[key] is False,key
          assert subprocess.check_output(['git','hash-object','stages/stage36/36-09EA/fixed-p2-defect-aware-retained-open-intersection-preflight.json'],text=True).strip()=='aea5c84bb2721a92759e4143f5199f607a31637d'
          assert subprocess.check_output(['git','hash-object','stages/stage36/verify_stage36_36_09EA.py'],text=True).strip()=='d5c66971754b2bfc1f9d87648e2a7678f9a7d885'
          print('V228 verified: EA exact-head CI is consumed. The Jacobian pro-Selmer adelic image is an exact union of four rational translations of the literal elliptic-product image; EB is unlocked only to materialize representatives. All downstream credit remains closed.')
          PY
          git diff --check
