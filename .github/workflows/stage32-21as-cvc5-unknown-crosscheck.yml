name: Stage32-21as cvc5 exact single UNKNOWN crosscheck

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stage32-21as-cvc5-unknown-crosscheck.yml'
      - 'stages/stage32/32-21/32-21ap-unknown-frontier.json'
      - 'stages/stage32/residual-32-01-production/certify_stage32_21as_cvc5_unknown.py'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_21ap_selected_pairing_integer_fiber.py'
      - 'stages/stage32/residual-32-01-production/diagnose_stage32_21ak_affine_2adic_membership.py'
      - 'stages/stage33/33-07/picard_base_rows_retained.py'
      - 'stages/stage33/33-07/stage32_picard_marking_retained.py'

permissions:
  contents: read

concurrency:
  group: stage32-21as-cvc5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'

      - name: Install exact algebra and independent SMT dependencies
        run: python -m pip install 'sympy==1.14.0' 'z3-solver==4.13.4.0' 'cvc5==1.3.4'

      - name: Crosscheck single UNKNOWN with cvc5 QF_LIA
        working-directory: stages/stage32/residual-32-01-production
        run: |
          python certify_stage32_21as_cvc5_unknown.py \
            --frontier "$GITHUB_WORKSPACE/stages/stage32/32-21/32-21ap-unknown-frontier.json" \
            --retained "$GITHUB_WORKSPACE/stages/stage33/33-07/picard_base_rows_retained.py" \
            --marking "$GITHUB_WORKSPACE/stages/stage33/33-07/stage32_picard_marking_retained.py" \
            --solver-timeout-ms 300000 \
            --output "$GITHUB_WORKSPACE/stage32-21as-cvc5-unknown-crosscheck.json"

      - name: Upload compact exact crosscheck evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage32-21as-cvc5-unknown-crosscheck
          path: stage32-21as-cvc5-unknown-crosscheck.json
          retention-days: 3
          compression-level: 9
