name: Stage32-18AT d16 b16 heavy tier3 cost planner

on:
  push:
    branches: [stage32-18as-b16-heavy-tier2-cost-planner]
    paths: ['stages/stage32/runkeys/18at-b16-heavy-tier3-cost-planner.json']

permissions: {contents: read, actions: read}
concurrency: {group: stage32-18at-b16-heavy-tier3-cost-planner, cancel-in-progress: true}

jobs:
  planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Require dedicated ARM commit
        run: |
          set -euo pipefail
          KEY=stages/stage32/runkeys/18at-b16-heavy-tier3-cost-planner.json
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1 && test "${changed[0]}" = "$KEY"
          test "$(git log -1 --pretty=%s)" = 'Stage32-18AT: ARM B16 HEAVY TIER3 COST PLANNER'
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('stages/stage32/runkeys/18at-b16-heavy-tier3-cost-planner.json').read_text())
          assert d['schema']=='STAGE32_HEAVY_RUN_KEY_V1' and d['armed'] and d['bound']==16
          assert d['target_wall']==[436,5] and d['allow_finer_split'] is False
          assert d['source_exact_artifact_id']==9574308138
          assert d['source_tier1_run_id']==33140252216 and d['source_tier1_artifact_id']==9673711597
          assert d['source_tier2_run_id']==33140746043 and d['source_tier2_artifact_id']==9674119196
          assert d['expected_frontier_states']==4103 and d['expected_tier3_input']==180
          assert d['tier3_probe_budget']==262144 and d['max_parallel']==1
          assert d['shard_count']==1024 and d['secondary_split_coordinate']==48 and d['block_cut']==39
          PY
      - name: Fetch locked source and planner artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++ libboost-dev
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/tier1" "$RUNNER_TEMP/tier2" "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/source.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9574308138/zip"
          echo '0671a8a8637641f5cc4da36b99700b1511c923d03e5ea446317d17b35bd88fc4  '"$RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/src"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/tier1.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9673711597/zip"
          echo 'c384122c04cbd2536e215cf6c8786c9f16be3dd4ce7976fb7747331da3933ac2  '"$RUNNER_TEMP/tier1.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/tier1.zip" -d "$RUNNER_TEMP/tier1"
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$RUNNER_TEMP/tier2.zip" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9674119196/zip"
          echo '20c3cc6514d94f412ffcc2907566b7fa9d8bb8836ffbfad61c07868fed58b6ab  '"$RUNNER_TEMP/tier2.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/tier2.zip" -d "$RUNNER_TEMP/tier2"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          p1=json.loads((root/'tier1'/'stage32-18ar-plan.json').read_text())
          p2=json.loads((root/'tier2'/'stage32-18as-plan.json').read_text())
          assert p1['schema']=='STAGE32_18AR_B16_FRONTIER_COST_PLAN_V1' and p1['frontier_states']==4103
          assert p2['schema']=='STAGE32_18AS_B16_HEAVY_TIER2_COST_PLAN_V1' and p2['frontier_states']==4103
          ids=p2['tier3_frontier_ids']; assert len(ids)==180 and len(set(ids))==180
          (root/'work'/'tier3-ids.txt').write_text(''.join(f'{x}\n' for x in ids))
          PY
      - name: Build exact selective planner
        run: |
          set -euo pipefail
          python stages/stage32/32-18X/build_two_stage_certifier.py --source "$RUNNER_TEMP/src/d16-exact-symmetry-sharded.cpp" --output "$RUNNER_TEMP/work/cert.cpp" --primary-id 436
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AF/patch_symmetry_schedule.py
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AO/patch_block_frontier.py
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AP/patch_lower_block_replay.py
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AR/patch_frontier_cost_planner.py
          SRC="$RUNNER_TEMP/work/cert.cpp" python stages/stage32/32-18AS/patch_selective_frontier_planner.py
          g++ -O3 -DNDEBUG -std=c++17 -Wall -Wextra -pedantic "$RUNNER_TEMP/work/cert.cpp" -o "$RUNNER_TEMP/work/cert"
          cp "$RUNNER_TEMP/src/d16-hperp.txt" "$RUNNER_TEMP/work/"
          cp "$RUNNER_TEMP/src/d16-aut-prefix256-bundle.txt" "$RUNNER_TEMP/work/"
      - name: Probe only 180 tier2-capped frontier states
        run: |
          set -euo pipefail
          /usr/bin/time -q -f '%e' -o "$RUNNER_TEMP/out/runtime.txt" timeout --signal=TERM --kill-after=20s 45m "$RUNNER_TEMP/work/cert" --input "$RUNNER_TEMP/work/d16-hperp.txt" --bundle "$RUNNER_TEMP/work/d16-aut-prefix256-bundle.txt" --output "$RUNNER_TEMP/out/cert.json" --dump-canonical "$RUNNER_TEMP/out/dump.bin" --bound 16 --shard-id 5 --shard-count 1024 --split-coordinate 48 --block-cut 39 --frontier-cap 5000 --replay-limit 0 --planner-probe-budget 262144 --planner-output "$RUNNER_TEMP/out/tier3-costs.csv" --planner-id-file "$RUNNER_TEMP/work/tier3-ids.txt" --node-cap 2000000 >"$RUNNER_TEMP/out/stdout.txt" 2>"$RUNNER_TEMP/out/stderr.txt"
      - name: Build tier3 distribution
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,os,pathlib,math,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP']); out=root/'out'
          cert=json.loads((out/'cert.json').read_text())
          p2=json.loads((root/'tier2'/'stage32-18as-plan.json').read_text())
          with (out/'tier3-costs.csv').open() as f:
              rows=[{'frontier_id':int(r['frontier_id']),'probe_nodes':int(r['probe_nodes']),'complete':r['complete']=='1'} for r in csv.DictReader(f)]
          ids=p2['tier3_frontier_ids']
          assert cert['status']=='FRONTIER_COMPLETE' and cert['frontier_states']==4103
          assert cert['planner_selected_ids']==180 and cert['planner_completed']+cert['planner_capped']==180
          assert [r['frontier_id'] for r in rows]==ids
          unresolved=[r['frontier_id'] for r in rows if not r['complete']]
          costs=sorted(r['probe_nodes'] for r in rows if r['complete'])
          def pct(xs,p):
              if not xs:return None
              return xs[min(len(xs)-1,max(0,math.ceil(p*len(xs))-1))]
          if len(unresolved)<=24:
              next_item='32-18AU-D16-B16-WEIGHTED-PRODUCTION-WITH-MONSTER-ISOLATION'
          else:
              next_item='32-18AU-D16-B16-HEAVY-TIER4-COST-PLANNER'
          runtime=None
          try: runtime=float((out/'runtime.txt').read_text().strip())
          except Exception: pass
          result={'schema':'STAGE32_18AT_B16_HEAVY_TIER3_COST_PLAN_V1','verdict':'TIER3_HEAVY_DISTRIBUTION_MEASURED','target_wall':[436,5],'frontier_states':4103,'tier3_input_count':180,'tier3_probe_budget':262144,'tier3_completed_count':len(costs),'tier3_capped_count':len(unresolved),'tier4_frontier_ids':unresolved,'tier3_completed_quantiles':{'p50':pct(costs,.50),'p90':pct(costs,.90),'p95':pct(costs,.95),'p99':pct(costs,.99),'max':max(costs) if costs else None},'total_resolved_frontier_count_after_tier3':3923+len(costs),'minimum_total_lower_nodes_given_tier4_floor':p2['resolved_exact_total_nodes']+sum(costs)+len(unresolved)*262144,'runtime_seconds':runtime,'next_item':next_item,'D16_B16_NUMERICAL_CREDIT':False,'GLOBAL_B16_AGGREGATION_COMPLETE':False,'FULL_D16_G0_ROW_COMPLETE':False,'THEOREM_CREDIT':False,'RECEIVER_CREDIT':False,'CONTROLLER_MODIFIED':False}
          (out/'stage32-18at-plan.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          shutil.copy2(root/'work'/'tier3-ids.txt',out/'tier3-input-ids.txt')
          print(json.dumps({'verdict':result['verdict'],'tier3_completed':len(costs),'tier4':len(unresolved),'total_resolved':result['total_resolved_frontier_count_after_tier3'],'next_item':next_item},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage32-18at-b16-heavy-tier3-cost-plan-g1
          path: '${{ runner.temp }}/out/'
          retention-days: 14
          if-no-files-found: error
