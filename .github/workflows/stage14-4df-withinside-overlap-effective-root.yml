name: Stage14-4df within-side overlap effective root

on:
  pull_request:
    paths:
      - 'stages/stage14/14-4df/**'
      - 'stages/stage14/data/14-4/withinside_overlap_effective_root_summary.json'
      - 'stages/stage14/scripts/14-4/withinside_overlap_effective_root_audit.py'
      - 'stages/stage14/roadmap.md'
      - '.github/workflows/stage14-4df-withinside-overlap-effective-root.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage14-4df deterministic audit
        run: python stages/stage14/scripts/14-4/withinside_overlap_effective_root_audit.py

      - name: Compile Stage14-4df audit
        run: python -m py_compile stages/stage14/scripts/14-4/withinside_overlap_effective_root_audit.py

      - name: Merged 4de regression
        run: |
          f=stages/stage14/14-4de/result.md
          grep -Fq 'STAGE14_4DE=COMPLETE_FULL_RESIDUAL_CROSS_COPRIMALITY_MIXED_FOURTH_ROOT_COMPRESSION_AND_S_ROUTE_REACTIVATION' "$f"
          grep -Fq 'MIXED_FOURTH_ROOT_LINE_PROVED=true' "$f"

      - name: Merged s7-46 regression
        run: |
          f=stages/stage14/14-s7-46/result.md
          grep -Fq 'STAGE14_S7_46=COMPLETE_MIXED_FOURTH_ROOT_SIGN_ALLOCATION_COFACTOR_RECONSTRUCTION_AND_SECOND_RECIPROCAL_FINITE_FIBER' "$f"
          grep -Fq 'MIXED_FOURTH_ROOT_TUPLE_PHYSICAL_PACKET_FINITE_FIBER_EQUIVALENCE=true' "$f"
          grep -Fq 'DUAL_BALANCED_XI_COFACTOR_SPLIT_REQUIRED=true' "$f"
          grep -Fq 'S_ROUTE_CURRENT_STATE=ACTIVE_REACTIVATED' "$f"
          grep -Fq 'S7_47_SCHEDULED=true' "$f"

      - name: Fixed-U non-cross-promotion locks
        run: |
          grep -Fq 'STAGE14_T86=' stages/stage14/14-t86/result.md
          grep -Fq 'STAGE14_TH24=' stages/stage14/14-tH24/result.md

      - name: Stage14-4df theorem boundary
        run: |
          f=stages/stage14/14-4df/result.md
          grep -Fq 'STAGE14_4DF=COMPLETE_S7_46_COFACTOR_OVERLAP_EFFECTIVE_MODULUS_LIFT_AND_PAIRWISE_SEPARATED_SQRT_SATURATION' "$f"
          grep -Fq 'MERGED_S7_46_IMPORTED=true' "$f"
          grep -Fq 'WITHIN_SIDE_OVERLAP_EFFECTIVE_MODULUS_LIFT_PROVED=true' "$f"
          grep -Fq 'FIXED_OVERLAP_COMPLETE_COUNT_EXPONENT=1/2-w_+-w_-' "$f"
          grep -Fq 'SQRT_SATURATION_FOUR_NORM_BLOCKS_PAIRWISE_SEPARATED=true' "$f"
          grep -Fq 'REMAINING_RECEIVER=SquareRootQuarterScalePairwiseSeparatedMixedFourthRootDualBalancedXiCofactorSplitPhysicalAdmissibilityDensity' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=1/2' "$f"
          grep -Fq 'STRICT_SUBSQRT_POWER_SAVING_PROVED=false' "$f"
          grep -Fq 'S_ROUTE_CURRENT_STATE=ACTIVE_REACTIVATED' "$f"
          grep -Fq 'S_ROUTE_REACTIVATION_DECISION_REQUIRED=false' "$f"
          grep -Fq 'S_ROUTE_REACTIVATION_CHECK_SUSPENDED=true' "$f"
          grep -Fq 'S_ROUTE_REACTIVATION_CHECK_RESUMES_WHEN_S_ROUTE_CLOSED=true' "$f"
          grep -Fq 'MAINLINE_H_NEEDED=false' "$f"
          grep -Fq 'NEXT=Stage14-4dg' "$f"
          grep -Fq 'NEXT_S_ROUTE=Stage14-s7-47' "$f"

      - name: Roadmap active s lifecycle lock
        run: |
          f=stages/stage14/roadmap.md
          grep -Fq 'S_ROUTE_CURRENT_STATE=ACTIVE_REACTIVATED' "$f"
          grep -Fq 'S_ROUTE_REACTIVATION_DECISION_REQUIRED=false' "$f"
          grep -Fq 'S_ROUTE_REACTIVATION_CHECK_SUSPENDED=true' "$f"
          grep -Fq 'S_ROUTE_REACTIVATION_CHECK_RESUMES_WHEN_S_ROUTE_CLOSED=true' "$f"
          grep -Fq 'S_REACTIVATION_CHECK_ONLY_WHEN_S_ROUTE_CLOSED=true' "$f"
          grep -Fq 'S_ROUTE_NEXT=Stage14-s7-47' "$f"
          grep -Fq 'SquareRootQuarterScalePairwiseSeparatedMixedFourthRootDualBalancedXiCofactorSplitPhysicalAdmissibilityDensity' "$f"
