name: Stage14-s7-42 sH41 critical closure stability prism

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-42/**'
      - 'stages/stage14/scripts/14-s7-42/**'
      - '.github/workflows/stage14-s7-42-sh41-critical-closure-stability-prism.yml'
      - 'stages/stage14/14-s7-41/**'
      - 'stages/stage14/14-s7-40/**'
      - 'stages/stage14/14-4cz/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage14-s7-42 audit
        run: python stages/stage14/scripts/14-s7-42/sh41_critical_closure_stability_prism_audit.py

      - name: Compile Stage14-s7-42 audit
        run: python -m py_compile stages/stage14/scripts/14-s7-42/sh41_critical_closure_stability_prism_audit.py

      - name: Merged s7-41 regression
        run: python stages/stage14/scripts/14-s7-41/residual_twin_finite_fiber_23_44_audit.py

      - name: Merged s7-40 regression
        run: python stages/stage14/scripts/14-s7-40/h2_row_endpoint_23_44_audit.py

      - name: Lock 4cz primitive endpoint contraction
        run: |
          f=stages/stage14/14-4cz/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=23/44' "$f"
          grep -Fq 'K>=B^(1/132+o(1))' "$f"
          grep -Fq 'TwentyThreeFortyFourthsGloballyOddPrimitiveFourRootFullCayleyTwinShortFirstResidualIncidence' "$f"

      - name: Lock Stage14-s7-42 theorem boundary
        run: |
          f=stages/stage14/14-s7-42/result.md
          grep -Fq 'STAGE14_S7_42=COMPLETE_SH41_CRITICAL_CLOSURE_AND_SQRT_STABILITY_PRISM_REDUCTION' "$f"
          grep -Fq 'SH41_SAFE_CRITICAL_FIBER_DELTA=1/22' "$f"
          grep -Fq 'SH41_CRITICAL_ENDPOINT_BOUND=21/44' "$f"
          grep -Fq 'SH41_CRITICAL_ENDPOINT_STRICTLY_SUBSQRT=true' "$f"
          grep -Fq 'POINTWISE_CRITICAL_REPLACEMENT_IMPLIES_FIXED_GLOBAL_DELTA=false' "$f"
          grep -Fq 'SQRT_DANGER_PRISM_IDENTIFIED=true' "$f"
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=23/44' "$f"
          grep -Fq 'NEW_WHOLE_FAMILY_POWER_SAVING_PROVED=false' "$f"
          grep -Fq 'S7_42_NEW_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'S_ROUTE_BLOCKED_WAITING_FOR_H=false' "$f"
          grep -Fq 'REMAINING_RECEIVER=HalfBarrierNormalizedCrossRootSameSideSquareRemovedReverseReciprocalStabilityPrism' "$f"
          grep -Fq 'NEXT=Stage14-s7-43' "$f"
