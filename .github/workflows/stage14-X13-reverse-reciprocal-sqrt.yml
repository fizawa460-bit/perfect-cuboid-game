name: Stage14-X13 reverse reciprocal sqrt

on:
  pull_request:
    paths:
      - 'stages/stage14/14-X13/**'
      - 'stages/stage14/scripts/14-X13/**'
      - 'stages/stage14/data/14-X13/**'
      - '.github/workflows/stage14-X13-reverse-reciprocal-sqrt.yml'
      - 'stages/stage14/14-4cy/**'
      - 'stages/stage14/14-s7-40/**'
      - 'stages/stage14/14-s7-27/**'
      - 'stages/stage14/14-s7-28/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage14-X13 exact audit
        run: python stages/stage14/scripts/14-X13/reverse_reciprocal_sqrt_audit.py

      - name: Compile Stage14-X13 audit
        run: python -m py_compile stages/stage14/scripts/14-X13/reverse_reciprocal_sqrt_audit.py

      - name: Run merged Stage14-4cy regression
        run: python stages/stage14/scripts/14-4/cross_root_square_row_reduction_23_44_audit.py

      - name: Run merged Stage14-s7-40 regression
        run: python stages/stage14/scripts/14-s7-40/h2_row_endpoint_23_44_audit.py

      - name: Run merged Stage14-4cx regression
        run: python stages/stage14/scripts/14-4/cayley_annulus_collapse_23_44_audit.py

      - name: Lock exact reciprocal predecessor equations
        run: |
          grep -Fq 'RECIPROCAL_FOUR_MODULUS_QUADRATIC_SYSTEM_PROVED=true' stages/stage14/14-s7-27/result.md
          grep -Fq '(L_x^+ c_x^+)^2-(L_x^- c_x^-)^2' stages/stage14/14-s7-27/result.md
          grep -Fq '(L_k^+ c_k^+)^2-(L_k^- c_k^-)^2' stages/stage14/14-s7-27/result.md
          grep -Fq 'MOVING_XY_RECONSTRUCTED_FROM_PRIMITIVE_MODULI=true' stages/stage14/14-s7-28/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=23/44' stages/stage14/14-4cy/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=23/44' stages/stage14/14-s7-40/result.md

      - name: Lock Stage14-X13 theorem boundary
        run: |
          f=stages/stage14/14-X13/result.md
          grep -Fq 'STAGE14_X13=COMPLETE_REVERSE_RECIPROCAL_COLUMN_TO_ROW_RECONSTRUCTION_AND_SQRT_PROMOTION' "$f"
          grep -Fq 'MERGED_4CY_IMPORTED=true' "$f"
          grep -Fq 'MERGED_S7_40_IMPORTED=true' "$f"
          grep -Fq 'SECOND_RECIPROCAL_EQUATION_REVERSED_BY_DIVISOR_FACTORIZATION=true' "$f"
          grep -Fq 'FIRST_RECIPROCAL_EQUATION_REVERSED_BY_DIVISOR_FACTORIZATION=true' "$f"
          grep -Fq 'FIXED_PRIMITIVE_X_PAIR_AND_M_TO_N_MULTIPLICITY=Bo1' "$f"
          grep -Fq 'ROW_CRT_LIFT_INDEPENDENT_SUPPORT=false' "$f"
          grep -Fq 'POST_COLUMN_ROW_RECONSTRUCTION_MULTIPLICITY=Bo1' "$f"
          grep -Fq 'REVERSE_RECIPROCAL_NONPROPORTIONAL_COMPLETE_COUNT_SIMPLIFIED=1-2theta' "$f"
          grep -Fq 'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=1/2' "$f"
          grep -Fq 'IMPROVEMENT_OVER_MERGED_23_44=1/44' "$f"
          grep -Fq 'SQRT_B_UPPER_BOUND_PROVED=true' "$f"
          grep -Fq 'STRICT_SUBSQRT_POWER_SAVING_PROVED=false' "$f"
          grep -Fq 'SQRT_SATURATION_THETA=1/4' "$f"
          grep -Fq 'SQRT_SATURATION_PHI_RANGE=[5/24,1/4]' "$f"
          grep -Fq 'OPEN_4CZ_CROSS_PROMOTED_TO_X13=false' "$f"
          grep -Fq 'X13_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'REMAINING_RECEIVER=SquareRootThetaQuarterPrimitiveCommonCoreSingleColumnReverseReciprocalIncidence' "$f"
          grep -Fq 'NEXT_RECOMMENDED=Stage14-X14' "$f"

      - name: Diff check
        run: git diff --check HEAD^ HEAD
