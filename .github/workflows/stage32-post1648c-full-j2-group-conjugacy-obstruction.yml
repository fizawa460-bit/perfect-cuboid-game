name: Stage32 post1648C full J2 group-conjugacy obstruction

on:
  pull_request:
    paths:
      - 'stages/stage32/residual-32-01-production/post1648c-full-j2-group-conjugacy-absolute-line-obstruction.json'
      - 'stages/stage32/residual-32-01-production/post1648c-full-j2-group-conjugacy-absolute-line-obstruction-source-note.md'
      - 'stages/stage32/residual-32-01-production/verify_stage32_post1648c_full_j2_group_conjugacy_absolute_line_obstruction.py'
      - '.github/workflows/stage32-post1648c-full-j2-group-conjugacy-obstruction.yml'

jobs:
  full-j2-conjugacy-obstruction:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Verify exhaustive full-J2 conjugacy obstruction
        run: python3 -B stages/stage32/residual-32-01-production/verify_stage32_post1648c_full_j2_group_conjugacy_absolute_line_obstruction.py
      - name: Diff check
        run: git diff --check
