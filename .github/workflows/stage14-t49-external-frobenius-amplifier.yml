name: Stage14-t49 external Frobenius amplifier

on:
  pull_request:
    paths:
      - 'stages/stage14/14-t49/**'
      - 'stages/stage14/scripts/14-t/t49_external_frobenius_amplifier_audit.py'
      - 'stages/stage14/scripts/14-t/t49_validate_frozen.py'
      - 'stages/stage14/data/14-t49/**'
      - '.github/workflows/stage14-t49-external-frobenius-amplifier.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run t48 regression
        run: python stages/stage14/scripts/14-t/t48_physical_row_correlation_audit.py
      - name: Run tH13 regression
        run: python stages/stage14/scripts/tH13/sparse_many_conductor_adapter_audit.py
      - name: Run t49 external Frobenius amplifier audit
        run: python stages/stage14/scripts/14-t/t49_external_frobenius_amplifier_audit.py
      - name: Validate frozen t49 ledger and boundary
        run: python stages/stage14/scripts/14-t/t49_validate_frozen.py
