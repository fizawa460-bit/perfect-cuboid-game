name: Stage14-s7-12 unbalanced denominator 10-11 audit

on:
  pull_request:
    paths:
      - 'stages/stage14/14-s7-12/**'
      - 'stages/stage14/scripts/14-s7-12/**'
      - '.github/workflows/stage14-s7-12-unbalanced-denominator-10-11.yml'
      - 'stages/stage14/14-s7-11/**'
      - 'stages/stage14/14-s7-10/**'
      - 'stages/stage14/14-s7-04/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regress Stage14-s7-10 mixed Fourier theorem
        run: python stages/stage14/scripts/14-s7-10/uniform_two_cell_fourier_audit.py

      - name: Regress Stage14-s7-11 multicell barrier
        run: python stages/stage14/scripts/14-s7-11/multicell_torus_barrier_audit.py

      - name: Audit Stage14-s7-12 unbalanced short denominator receiver
        run: python stages/stage14/scripts/14-s7-12/unbalanced_short_denominator_audit.py

      - name: Lock Stage14-s7-12 theorem boundary
        shell: bash
        run: |
          set -euo pipefail
          f=stages/stage14/14-s7-12/result.md
          grep -F 'STAGE14_S7_12=COMPLETE_UNBALANCED_SHORT_DENOMINATOR_RECEIVER_AND_10_11_BOUND' "$f"
          grep -F 'UNBALANCED_THIN_RECEIVER_IS_MIN_OF_TWO_VALID_BOUNDS=true' "$f"
          grep -F 'FIXED_COORDINATE_AND_TWO_CELL_SAVINGS_MULTIPLIED=false' "$f"
          grep -F 'OPTIMAL_DENOMINATOR_SQUAREPART_THRESHOLD_EXPONENT=1/11' "$f"
          grep -F 'CRITICAL_THIN_DENOMINATOR_EXPONENT=5/11' "$f"
          grep -F 'CRITICAL_DENOMINATOR_COEFFICIENT_EXPONENT=3/11' "$f"
          grep -F 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=10/11' "$f"
          grep -F 'NEW_WHOLE_FAMILY_POWER_SAVING_PROVED=true' "$f"
          grep -F 'SQRT_B_UPPER_BOUND_PROVED=false' "$f"
          grep -F 'NEXT=Stage14-s7-13' "$f"
