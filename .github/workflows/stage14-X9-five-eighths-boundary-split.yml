name: Stage14-X9 five-eighths boundary split

on:
  pull_request:
    paths:
      - 'stages/stage14/14-X9/**'
      - 'stages/stage14/data/14-X9/**'
      - 'stages/stage14/scripts/14-X9/**'
      - '.github/workflows/stage14-X9-five-eighths-boundary-split.yml'
      - 'stages/stage14/14-X8/**'
      - 'stages/stage14/14-X7/**'
      - 'stages/stage14/14-s7-31/**'
      - 'stages/stage14/14-4cr/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage14-X9 boundary split audit
        run: python stages/stage14/scripts/14-X9/five_eighths_boundary_split_audit.py

      - name: Compile Stage14-X9 audit
        run: python -m py_compile stages/stage14/scripts/14-X9/five_eighths_boundary_split_audit.py

      - name: Run merged Stage14-s7-31 regression
        run: python stages/stage14/scripts/14-s7-31/fixed_outer_common_gcd_audit.py

      - name: Run merged Stage14-4cr regression
        run: python stages/stage14/scripts/14-4/two_thirds_cayley_gaussian_audit.py

      - name: Run merged Stage14-X8 regression
        run: python stages/stage14/scripts/14-X8/two_sided_dual_cayley_minimax_audit.py

      - name: Run merged Stage14-X7 regression
        run: python stages/stage14/scripts/14-X7/gaussian_quotient_resultant_audit.py

      - name: Lock predecessor boundaries
        run: |
          grep -Fq 'STAGE14_S7_31=COMPLETE_FIXED_OUTER_COMMON_GCD_SQUARE_DIVISIBILITY_AND_5_8_BOUND' stages/stage14/14-s7-31/result.md
          grep -Fq 'CURRENT_PHYSICAL_UPPER_BOUND_EXPONENT=5/8' stages/stage14/14-s7-31/result.md
          grep -Fq 'OPPOSITE_QUOTIENT_COMMON_GCD_ODDPART_SQUARE_DIVIDES_C_URES=true' stages/stage14/14-s7-31/result.md
          grep -Fq 'STAGE14_4CR=COMPLETE_TWO_THIRDS_PROMOTION_AND_CAYLEY_GAUSSIAN_ORIENTATION_FACTORIZATION' stages/stage14/14-4cr/result.md
          grep -Fq 'CAYLEY_GOOD_CORE_SIGN_ALLOCATION_PROVED=true' stages/stage14/14-4cr/result.md
          grep -Fq 'STAGE14_X8=COMPLETE_TWO_SIDED_DUAL_CAYLEY_MINIMAX_AND_TWO_THIRDS_PROMOTION' stages/stage14/14-X8/result.md
          grep -Fq 'STAGE14_X7=COMPLETE_SELF_GENERATED_FOUR_ROOT_UNCHARGING_AND_GAUSSIAN_QUOTIENT_RESULTANT_REDUCTION' stages/stage14/14-X7/result.md

      - name: Lock Stage14-X9 theorem boundary
        run: |
          f=stages/stage14/14-X9/result.md
          grep -Fq 'STAGE14_X9=COMPLETE_FIVE_EIGHTHS_PROMOTION_AND_UPPER_CORE_LOWER_CORELESS_BOUNDARY_SPLIT' "$f"
          grep -Fq 'MERGED_X8_IMPORTED=true' "$f"
          grep -Fq 'MERGED_S7_31_IMPORTED=true' "$f"
          grep -Fq 'MERGED_4CR_IMPORTED=true' "$f"
          grep -Fq 'CURRENT_PHYSICAL_WHOLE_FAMILY_EXPONENT=5/8' "$f"
          grep -Fq 'IMPROVEMENT_OVER_X8_TWO_THIRDS=1/24' "$f"
          grep -Fq 'X8_TWO_THIRDS_SATURATION_SUPERSEDED=true' "$f"
          grep -Fq 'TWO_THIRDS_CAYLEY_GAUSSIAN_COMMON_GCD_ROOT_PRODUCT_RECEIVER_MINIMAL=false' "$f"
          grep -Fq 'UPPER_EDGE_C_URES_EXPONENT=1/2' "$f"
          grep -Fq 'UPPER_EDGE_FIRST_PRIMITIVE_PAIR_EXPONENT=1/8' "$f"
          grep -Fq 'UPPER_EDGE_OPPOSITE_QUOTIENT_PAIR_EXPONENT=0' "$f"
          grep -Fq 'LOWER_CORNER_COMMON_CORE_EXPONENT=0' "$f"
          grep -Fq 'LOWER_CORNER_FIRST_PRIMITIVE_PAIR_EXPONENT=3/8' "$f"
          grep -Fq 'LOWER_CORNER_OPPOSITE_QUOTIENT_PAIR_EXPONENT=1/4' "$f"
          grep -Fq 'LOWER_CORNER_BALANCED_REAL_GAUSSIAN_VALUE_TRIAD=true' "$f"
          grep -Fq 'REMAINING_RECEIVER=FiveEighthsSeparatedUpperCayleyLowerCorelessReciprocalEnergy' "$f"
          grep -Fq 'X9_AUXILIARY_H_NEEDED=false' "$f"
          grep -Fq 'SQRT_B_UPPER_BOUND_PROVED=false' "$f"
          grep -Fq 'NEXT_RECOMMENDED=Stage14-X10' "$f"

      - name: Diff check
        run: git diff --check HEAD^ HEAD
