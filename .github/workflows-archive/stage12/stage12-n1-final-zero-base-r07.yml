# Verify the generated physical bundle on the final PR head.
name: Stage12-N1 physical zero-base re-review R07

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/stage12-n1-2-final-r05.md"
      - "docs/stage12-n1-3a-rectangular-error-repair.md"
      - "docs/stage12-n1-3h-zero-base-provenance-closure.md"
      - "docs/stage12-n1-2-final-r06-zero-base.md"
      - "docs/review/stage12-n1-2-final-zero-base-rereview-manifest-20260807-r07.md"
      - "review/PC-N1-2-FINAL-ZERO-BASE-REREVIEW-20260807-R07.html"
      - "scripts/build_stage12_n1_final_zero_base_r07.py"
      - ".github/workflows/stage12-n1-final-zero-base-r07.yml"

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build physical zero-base R07 bundle
        run: |
          python -m py_compile scripts/build_stage12_n1_final_zero_base_r07.py
          python scripts/build_stage12_n1_final_zero_base_r07.py
      - name: Verify physical zero-base R07 bundle
        shell: bash
        run: |
          final_md=docs/stage12-n1-2-final-r06-zero-base.md
          page=review/PC-N1-2-FINAL-ZERO-BASE-REREVIEW-20260807-R07.html
          manifest=docs/review/stage12-n1-2-final-zero-base-rereview-manifest-20260807-r07.md
          test -s "$final_md"
          test -s "$page"
          test -s "$manifest"
          grep -Fq 'BUNDLE_ID=PC-N1-2-FINAL-ZERO-BASE-REREVIEW-20260807-R07' "$page"
          grep -Fq 'COMPLETED_THROUGH=Stage12-N1-3h' "$page"
          grep -Fq 'SOURCE_SNAPSHOT_COMMIT=1cc47f22be84e2924671294c88f2613d7cbafcd4' "$page"
          grep -Fq 'SOURCE_LEDGER_SHA256=9e8fe78faca3e30f9bfa9db9ef5cfd7b5c33187e94889c46aa3ab83b011c6f98' "$page"
          grep -Fq 'HISTORICAL_PROVENANCE_COMMIT=8d6910e8e68145e474f92716460a1cc6f384ecf1' "$page"
          grep -Fq 'DOCUMENT_STATUS=FULL_ZERO_BASE_REREVIEW_CANDIDATE_WITH_PROVENANCE' "$page"
          grep -Fq 'CHECKPOINT=START_OF_MAIN' "$page"
          grep -Fq 'CHECKPOINT=END_OF_MAIN' "$page"
          grep -Fq 'END_OF_BUNDLE=PC-N1-2-FINAL-ZERO-BASE-REREVIEW-20260807-R07' "$page"
          grep -Fq 'EMBEDDED SOURCE 8/8' "$final_md"
          grep -Fq 'Stage12-N1-3a：一様長方形誤差の指数修復' "$final_md"
          grep -Fq 'Stage12-N1-2f：体積・局所密度主項' "$final_md"
          grep -Fq 'Stage12-N1-2j：primitive-first Möbius' "$final_md"
          grep -Fq 'Stage12-N1-2k：最終平均誤差' "$final_md"
          grep -Fq 'VERTICAL_GROWTH_L_CHI4=CLOSED_BY_STAGE12_N1_3H_SECTION_2' "$final_md"
          grep -Fq 'RADIAL_LOWER_LIMIT_BOUNDARY=CLOSED_BY_STAGE12_N1_3H_SECTION_3' "$final_md"
          grep -Fq '3A_OLD_RETAINED_MIN_RS_APPLICATION=SUPERSEDED_BY_3F' "$final_md"
          grep -Fq 'D_{\lambda,2}(s_1,s_2)' "$manifest"
          grep -Fq 'PHYSICAL_SELF_CONTAINMENT=' "$manifest"
          grep -Fq 'VERTICAL_GROWTH=' "$manifest"
          grep -Fq 'RADIAL_LOWER_LIMIT=' "$manifest"
          ! grep -Pq '\x0c' "$final_md"
          ! grep -Pq '\x0c' "$page"
          test "$(wc -c < "$final_md")" -gt 100000
          test "$(wc -c < "$page")" -gt 110000
      - name: Commit generated Final R06 and R07 page
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          final_md=docs/stage12-n1-2-final-r06-zero-base.md
          page=review/PC-N1-2-FINAL-ZERO-BASE-REREVIEW-20260807-R07.html
          if git diff --quiet -- "$final_md" "$page" && \
             git ls-files --error-unmatch "$final_md" >/dev/null 2>&1 && \
             git ls-files --error-unmatch "$page" >/dev/null 2>&1; then
            echo "Generated R07 files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$final_md" "$page"
          git commit -m "Generate Stage12 physical zero-base bundle R07"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload physical zero-base R07 bundle
        uses: actions/upload-artifact@v4
        with:
          name: stage12-n1-final-zero-base-r07
          path: |
            docs/stage12-n1-2-final-r06-zero-base.md
            docs/review/stage12-n1-2-final-zero-base-rereview-manifest-20260807-r07.md
            review/PC-N1-2-FINAL-ZERO-BASE-REREVIEW-20260807-R07.html
          if-no-files-found: error
          retention-days: 7
